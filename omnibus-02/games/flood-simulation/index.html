<!doctype html>
<html lang="ja">
  <head>
<meta name="robots" content="noindex,nofollow">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>浸水シミュレーション</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #1a2320;
        width: 100%;
        height: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
      }
      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        color: #eef5ef;
        background: #1a2320;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        text-align: center;
        transition: opacity 180ms ease;
      }
      #boot-status.is-hidden {
        pointer-events: none;
        opacity: 0;
      }
      .boot-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(238, 245, 239, 0.22);
        border-top-color: #8ed0ae;
        border-radius: 50%;
        animation: boot-spin 900ms linear infinite;
      }
      #boot-status[data-state="error"] .boot-spinner {
        display: none;
      }
      #boot-message {
        max-width: 320px;
        font-size: 15px;
        line-height: 1.7;
      }
      #boot-retry {
        min-width: 120px;
        min-height: 44px;
        padding: 10px 20px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 14px;
        color: #fff;
        background: #406b55;
        font: inherit;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 1.8s;
        }
      }
      canvas.scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BUv2FsF-.js"></script>
  
<script src="/gf-nav.js" defer></script>
</head>
  <body>
    <div id="app"></div>
    <div id="boot-status" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p id="boot-message">シミュレーションを準備しています…</p>
      <button id="boot-retry" type="button" hidden>もう一度試す</button>
    </div>
  </body>
</html>
