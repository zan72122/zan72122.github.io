<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b3a8f">
  <title>スターサーキットGP - 3Dカートレース</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- レース中HUD -->
  <div id="hud">
    <div id="hud-rank" class="rank"></div>
    <div id="hud-lap"></div>
    <div id="hud-times">
      <div id="hud-time"></div>
      <div id="hud-laptime"></div>
    </div>
    <div id="hud-item"><canvas width="72" height="72"></canvas></div>
    <div id="hud-coins-wrap">🪙<span id="hud-coins">×0</span></div>
    <div id="hud-speed-wrap"><span id="hud-speed">0</span><small>km/h</small></div>
    <canvas id="minimap" width="170" height="170"></canvas>
    <div id="hud-announce"></div>
    <div id="hud-countdown"></div>
  </div>

  <!-- タッチ操作 -->
  <div id="touch-ui"></div>

  <!-- 画面 -->
  <div id="title-screen"></div>
  <div id="result-screen"></div>
  <div id="pause-overlay"><div>ポーズちゅう<br><small>Esc / P でさいかい</small></div></div>
  <div id="rotate-hint">📱 よこむきにしてあそんでね</div>

  <script src="dist/bundle.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
