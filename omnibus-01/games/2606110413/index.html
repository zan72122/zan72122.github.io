<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="おかしのくに">
  <meta name="theme-color" content="#111827">
<title>おかしのくにの まとあて</title>
<link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1F36D;</text></svg>">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-score" class="hud-chip"><span class="hud-label">てん</span><span id="score-value">0</span></div>
      <div id="hud-fever" class="hidden">ふぃーばー! 2ばい!</div>
      <div id="hud-time" class="hud-chip"><span class="hud-label">のこり</span><span id="time-value">60</span></div>
    </div>

    <button id="mute-btn" aria-label="おとを けす">&#x1F50A;</button>

    <!-- タイトル -->
    <div id="title-screen" class="screen">
      <div id="title-logo">
        <div class="title-line1">おかしのくにの</div>
        <div class="title-line2">まとあて</div>
      </div>
      <div id="title-tap">たっぷして すたーと!</div>
    </div>

    <!-- カウントダウン -->
    <div id="countdown" class="screen hidden"><span id="countdown-num"></span></div>

    <!-- フィナーレ -->
    <div id="finale" class="screen hidden"><span id="finale-text">すごーい!</span></div>

    <!-- けっか -->
    <div id="result" class="screen hidden">
      <div id="result-stars"><span class="star">&#x2B50;</span><span class="star">&#x2B50;</span><span class="star">&#x2B50;</span></div>
      <div id="result-score">0 てん!</div>
      <div id="result-praise">すごいね!</div>
      <button id="retry-btn">もういちど</button>
    </div>

    <!-- たてむき警告 -->
    <div id="rotate-overlay">
      <div id="rotate-phone">&#x1F4F1;</div>
      <div id="rotate-text">よこに してね</div>
    </div>

    <div id="debug-hud" class="hidden"></div>
  </div>
  <script type="module" src="./js/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
