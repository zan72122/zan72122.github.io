<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ほしあつめアイランド</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three-0.166.1.js"
  }
}
</script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hearts"></div>
    <div class="counter" id="coin-counter">
      <span class="coin-icon"></span><span id="coin-count">0</span>
    </div>
    <div class="counter" id="star-counter">
      <span class="star-icon">★</span><span id="star-count">0 / 5</span>
    </div>
  </div>

  <!-- ダメージ・リスポーン演出 -->
  <div id="vignette"></div>
  <div id="whiteout"></div>

  <!-- タッチ操作UI(タッチ環境のみ表示) -->
  <div id="touch-ui" class="inactive">
    <div id="stick-area">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="btn-jump">ジャンプ</div>
  </div>

  <!-- タイトル画面 -->
  <div id="screen-title" class="screen">
    <h1>ほしあつめ<br>アイランド</h1>
    <p class="subtitle">うかぶ しまの ほしのかけらを 5つ あつめよう!</p>
    <button id="btn-start" disabled>はじめる</button>
    <div class="controls-help">
      <p>WASD / 矢印キー … はしる &nbsp;|&nbsp; Shift … ダッシュ</p>
      <p>スペース … ジャンプ(着地してすぐ押すと だんだん高く!)</p>
      <p>Q / E・ドラッグ … カメラ &nbsp;|&nbsp; 敵は上から ふみつけ!</p>
    </div>
  </div>

  <!-- クリア画面 -->
  <div id="screen-clear" class="screen hidden">
    <h1>クリア!</h1>
    <p class="subtitle">ほしのかけらを ぜんぶ あつめた!<br>コイン <span id="clear-coins">0</span> まい</p>
    <button id="btn-again">もういちど</button>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="screen-over" class="screen hidden">
    <h1>ゲームオーバー</h1>
    <p class="subtitle">もういちど ちょうせんしよう!</p>
    <button id="btn-retry">リトライ</button>
  </div>

  <!-- CDN読み込み失敗時の案内 -->
  <div id="load-error" class="screen hidden">
    <h1>よみこみエラー</h1>
    <p class="subtitle">つうしんかんきょうを たしかめて<br>もういちど ためしてね</p>
    <button onclick="location.reload()">さいよみこみ</button>
  </div>

  <script>
    // main.js(ES Module)が起動すると window.__BOOT_OK が立つ。
    // importmap の解決失敗は error イベントで拾えないことがあるため
    // タイムアウト方式で検知する。
    setTimeout(function () {
      if (!window.__BOOT_OK) {
        document.getElementById('load-error').classList.remove('hidden');
      }
    }, 7000);
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
