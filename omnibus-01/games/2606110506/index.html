<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<title>3D流体力学ビジュアライザー — おきなわの一日</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    html, body {
      position: fixed; inset: 0;
      width: 100%; height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #0a2a4a;
      font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* ---- overlay layers ---- */
    .layer { position: absolute; inset: 0; }
    #ui-layer { pointer-events: none; z-index: 6; }

    /* ---- scene selector bar (bottom) ---- */
    #scene-bar {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      max-width: calc(100% - 16px);
      display: flex; flex-wrap: nowrap; gap: 6px;
      overflow-x: auto; overflow-y: hidden;
      pointer-events: auto;
      padding: 4px;
      scrollbar-width: none;
    }
    #scene-bar::-webkit-scrollbar { display: none; }
    .scene-btn {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      min-width: 58px;
      padding: 6px 7px 4px;
      border: 2px solid rgba(255,255,255,.25);
      border-radius: 12px;
      background: rgba(8, 30, 56, .62);
      color: #dff3ff;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .scene-btn .emo { font-size: 20px; line-height: 1.15; }
    .scene-btn.active {
      background: rgba(0, 150, 199, .85);
      border-color: #aef3ff;
      color: #fff;
      transform: translateY(-3px);
    }

    /* ---- info panel (top-left) ---- */
    #info-panel {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      max-width: min(420px, 62vw);
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(8, 30, 56, .68);
      border: 1px solid rgba(255,255,255,.22);
      color: #f2fbff;
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity .5s ease;
      pointer-events: none;
    }
    #info-panel.show { opacity: 1; }
    #info-panel h2 { font-size: 15px; margin-bottom: 4px; color: #aef3ff; }
    #info-panel p { font-size: 11.5px; line-height: 1.55; }
    #info-panel .phys { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 999px; background: rgba(0,150,199,.45); font-size: 10px; }

    /* ---- HUD (top-right) ---- */
    #hud {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      display: flex; align-items: center; gap: 8px;
      pointer-events: auto;
    }
    #quality-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      background: rgba(8, 30, 56, .62);
      color: #dff3ff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
    }
    #fps {
      font-size: 10px; color: rgba(223,243,255,.75);
      background: rgba(8,30,56,.5);
      padding: 4px 8px; border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- per-scene extra UI (e.g. syrup colors) ---- */
    #scene-ui {
      position: absolute;
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: auto;
    }
    .syrup-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.55);
      cursor: pointer;
      font-size: 9px; color: #fff; font-family: inherit;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s, border-color .2s;
    }
    .syrup-btn.active { border-color: #fff; transform: scale(1.16); }

    /* ---- start screen ---- */
    #start-screen {
      z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.4vmin;
      background: linear-gradient(180deg, #062a52 0%, #0a5f8e 46%, #15a8c2 78%, #43d6c9 100%);
      cursor: pointer;
    }
    #start-screen .title-art { width: min(58vmin, 380px); filter: drop-shadow(0 1vmin 1.4vmin rgba(0,20,40,.4)); }
    #start-screen h1 {
      color: #f2fbff; font-size: min(5.4vmin, 30px); letter-spacing: .12em;
      text-shadow: 0 2px 10px rgba(0,30,60,.55);
    }
    #start-screen .sub { color: #c9f0ff; font-size: min(3vmin, 15px); letter-spacing: .2em; }
    #start-btn {
      width: min(20vmin, 130px); height: min(20vmin, 130px);
      animation: bounce 1.4s ease-in-out infinite;
      filter: drop-shadow(0 .8vmin .8vmin rgba(0,20,40,.45));
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    #start-screen.hide { display: none; }
  </style>
  <script type="module" crossorigin src="./assets/index-BQuQqITD.js"></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="ui-layer" class="layer">
    <div id="info-panel"></div>
    <div id="hud">
      <span id="fps"></span>
      <button id="quality-btn" type="button"></button>
    </div>
    <div id="scene-ui"></div>
    <div id="scene-bar"></div>
  </div>
  <div id="start-screen" class="layer"></div>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
