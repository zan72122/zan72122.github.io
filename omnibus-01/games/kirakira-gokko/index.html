<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>キラキラ モデルごっこ</title>
<link rel="stylesheet" href="style.css">

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <div id="stage-wrap">
    <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg">
      <defs id="art-defs"></defs>
      <g id="bg-layer"></g>
      <g id="scene-layer"></g>
      <g id="ui-layer"></g>
      <g id="fx-layer"></g>
      <g id="hint-layer"></g>
      <g id="wipe-layer"></g>
    </svg>
  </div>

  <!-- 縦画面のとき「よこにしてね」案内(文字なし) -->
  <div id="rotate-overlay">
    <svg viewBox="0 0 300 300" width="60%" xmlns="http://www.w3.org/2000/svg">
      <g id="rotate-phone">
        <rect x="105" y="60" width="90" height="170" rx="18"
              fill="#fff" stroke="#a44a66" stroke-width="8"/>
        <rect x="117" y="84" width="66" height="116" rx="6" fill="#ffd2e2"/>
        <circle cx="150" cy="214" r="8" fill="#ffb0cb"/>
        <path d="M150 142 m-22 0 a22 22 0 1 1 44 0 a22 22 0 1 1 -44 0"
              fill="none" stroke="#ff6fa5" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="100 40"/>
      </g>
      <path d="M232 150 a 86 86 0 0 0 -50 -76" fill="none"
            stroke="#ff6fa5" stroke-width="12" stroke-linecap="round"/>
      <path d="M236 116 l-6 38 l-34 -16 z" fill="#ff6fa5"/>
    </svg>
  </div>

  <script src="audio.js"></script>
  <script src="art.js"></script>
  <script src="avatar.js"></script>
  <script src="items.js"></script>
  <script src="input.js"></script>
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
