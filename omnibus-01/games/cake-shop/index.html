<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<title>ケーキやさん 3D</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="gl"></canvas>
    <!-- 2D HUD オーバーレイ(ボタン・進行アイコン・指ヒント) -->
    <svg id="hud" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg">
      <defs id="hud-defs"></defs>
      <g id="ui-layer"></g>
      <g id="hint-layer"></g>
      <g id="wipe-layer"></g>
    </svg>
  </div>

  <!-- 縦画面のとき「よこにしてね」案内(文字なし) -->
  <div id="rotate-overlay">
    <svg viewBox="0 0 300 300" width="60%" xmlns="http://www.w3.org/2000/svg">
      <g id="rotate-phone">
        <rect x="105" y="60" width="90" height="170" rx="18"
              fill="#fff" stroke="#6b3a4e" stroke-width="8"/>
        <rect x="117" y="84" width="66" height="116" rx="6" fill="#ffd2e2"/>
        <circle cx="150" cy="214" r="8" fill="#ffb0cb"/>
        <path d="M150 142 m-22 0 a22 22 0 1 1 44 0 a22 22 0 1 1 -44 0"
              fill="none" stroke="#ff6fa5" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="100 40"/>
      </g>
      <path d="M232 150 a 86 86 0 0 0 -50 -76" fill="none"
            stroke="#ff6fa5" stroke-width="12" stroke-linecap="round"/>
      <path d="M236 116 l-6 38 l-34 -16 z" fill="#ff6fa5"/>
    </svg>
  </div>

  <script src="audio.js"></script>
  <script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
