<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const sa=document.getElementById('sa');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const S=x=>({x:x||0,v:0});
function spr(o,t,k,d,dt){o.v+=((t-o.x)*k-o.v*d)*dt;o.x+=o.v*dt;}
function mul(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- color helpers ---------- */
const rgbC={};
function rgb(h){let c=rgbC[h];if(c)return c;const n=parseInt(h.slice(1),16);return rgbC[h]=[n>>16&255,n>>8&255,n&255];}
const shC={};
function sh(h,a,al){
  if(al==null)al=1;const k=h+a+'|'+al;let s=shC[k];if(s)return s;
  const c=rgb(h);const f=v=>a<0?v*(1+a):v+(255-v)*a;
  return shC[k]='rgba('+(f(c[0])|0)+','+(f(c[1])|0)+','+(f(c[2])|0)+','+al+')';
}
function hexShade(h,a){const c=rgb(h);const f=v=>{v=a<0?v*(1+a):v+(255-v)*a;return('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);};return'#'+f(c[0])+f(c[1])+f(c[2]);}
function rgbaS(h,al){const c=rgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')';}

/* ---------- felt textures (pre-generated, cached) ---------- */
const TEX=256;const texC={};
function feltTex(h){
  if(texC[h])return texC[h];
  const c=document.createElement('canvas');c.width=c.height=TEX;const g=c.getContext('2d');
  const R=mul(parseInt(h.slice(1),16)*7+13);const col=rgb(h);
  g.fillStyle=h;g.fillRect(0,0,TEX,TEX);
  const offs=[-TEX,0,TEX];
  for(let i=0;i<22;i++){
    const x=R()*TEX,y=R()*TEX,r=18+R()*46,l=R()<.5;
    for(const ox of offs)for(const oy of offs){
      const cx=x+ox,cy=y+oy;if(cx+r<0||cx-r>TEX||cy+r<0||cy-r>TEX)continue;
      const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
      gr.addColorStop(0,l?'rgba(255,255,255,.07)':'rgba(40,10,30,.06)');gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.fillRect(cx-r,cy-r,r*2,r*2);
    }
  }
  const dk='rgba('+(col[0]*.5|0)+','+(col[1]*.45|0)+','+(col[2]*.5|0)+',';
  for(let i=0;i<2600;i++){
    const x=R()*TEX,y=R()*TEX,s=.6+R()*1.3;
    g.fillStyle=R()<.5?'rgba(255,255,255,'+(.05+R()*.15).toFixed(3)+')':dk+(.05+R()*.16).toFixed(3)+')';
    g.fillRect(x,y,s,s);
  }
  g.lineCap='round';
  for(let i=0;i<760;i++){
    const x=R()*TEX,y=R()*TEX,a=R()*TAU,len=3+R()*11,cu=(R()-.5)*1.4;
    g.strokeStyle=R()<.55?'rgba(255,255,255,'+(.07+R()*.2).toFixed(3)+')':dk+(.06+R()*.2).toFixed(3)+')';
    g.lineWidth=.45+R()*.6;
    for(const ox of offs)for(const oy of offs){
      const cx=x+ox,cy=y+oy;if(cx+len<0||cx-len>TEX||cy+len<0||cy-len>TEX)continue;
      g.beginPath();g.moveTo(cx,cy);
      g.quadraticCurveTo(cx+Math.cos(a+cu)*len*.5,cy+Math.sin(a+cu)*len*.5,cx+Math.cos(a)*len,cy+Math.sin(a)*len);g.stroke();
    }
  }
  return texC[h]=c;
}
const hasDM=typeof DOMMatrix!=='undefined';
function pat(g,h,cs){
  const m=g.__pc||(g.__pc={});let p=m[h];
  if(!p){p=g.createPattern(feltTex(h),'repeat');m[h]=p;}
  if(hasDM&&p.setTransform){const k=.7/cs;try{p.setTransform(new DOMMatrix([k,0,0,k,0,0]));}catch(e){}}
  return p;
}
function felt(g,path,h,cs,o){
  o=o||{};
  if(o.sd!==0){const s=(o.sd==null?1.6:o.sd)/cs;g.save();g.translate(s*.6,s);g.fillStyle='rgba(60,28,45,.2)';g.fill(path);g.restore();}
  g.fillStyle=pat(g,h,cs);g.fill(path);
  if(o.r){
    const gr=g.createRadialGradient(o.cx-o.r*.35,o.cy-o.r*.42,o.r*.05,o.cx,o.cy,o.r*1.05);
    gr.addColorStop(0,'rgba(255,250,245,'+(o.hi||.22)+')');gr.addColorStop(.55,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(70,28,50,'+(o.lo||.22)+')');
    g.fillStyle=gr;g.fill(path);
  }
  if(o.edge!==false){
    g.lineWidth=1.1/cs;g.strokeStyle=sh(h,-.32,.55);g.stroke(path);
    g.setLineDash([.9/cs,1.7/cs]);g.lineWidth=1.5/cs;g.strokeStyle=sh(h,.38,.6);g.stroke(path);g.setLineDash([]);
  }
}
function stitch(g,path,color,cs,w,dash){
  const d=(dash||3.2)/cs;g.setLineDash([d,d*.8]);g.lineWidth=(w||1.2)/cs;g.lineCap='round';
  g.save();g.translate(.5/cs,.7/cs);g.strokeStyle='rgba(60,28,40,.28)';g.stroke(path);g.restore();
  g.strokeStyle=color;g.stroke(path);g.setLineDash([]);
}
function E(x,y,rx,ry,rot){const p=new Path2D();p.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);return p;}
function rrP(x,y,w,h,r){const p=new Path2D();r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();return p;}
function polyP(pts,close){const p=new Path2D();for(let i=0;i<pts.length;i++){i?p.lineTo(pts[i][0],pts[i][1]):p.moveTo(pts[i][0],pts[i][1]);}if(close)p.closePath();return p;}
function smoothP(pts,close,p){
  p=p||new Path2D();const n=pts.length;if(n<2)return p;
  p.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<n-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;p.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
  p.lineTo(pts[n-1][0],pts[n-1][1]);if(close)p.closePath();return p;
}

/* ---------- palette ---------- */
const PAL={wall:'#b8a3b6',stones:['#bea9bb','#b29cb0','#c6b3c3','#ad97ab'],floor:'#d9bcab',rug:'#c98e9b',rugB:'#ead2ab',
  gate:'#eadab9',gate2:'#dcc6a0',door:'#a87a62',door2:'#946850',hinge:'#6e4a43',curtain:'#c47b90',curtain2:'#a9657c',
  gold:'#d8b56c',goldT:'#e0c385',pearl:'#f6f0e8',skin:'#f7dccb',cheek:'#ee9fa8',hair:'#c99560',hair2:'#ad7c4c',
  eye:'#4b3341',thread:'#fff4e6',sage:'#93aa84',crown:'#e7c67c',shoe:'#d48f9f'};
const STRIPCOLS=['#e8a2b4','#f2e1c0','#bda5d6','#da8ca0','#f0c3a6','#f5ede5','#ceb2dc','#e9b6c2'];
const DRESSES=[
  {m:'#f1e4e0',b:'#ead5d5',l:['#f7f0e7','#dccae6','#f0c9d1']},
  {m:'#e9e1f0',b:'#ddd1e9',l:['#f7f0e7','#f0c9d1','#efe0c0']},
  {m:'#f4eadb',b:'#ecddc4',l:['#f7f0e7','#e8b9c6','#cdbbe0']},
  {m:'#f2dfe4',b:'#e8cdd5',l:['#f7f0e7','#d6c4e6','#f2dcc0']}];

/* ---------- sound (Web Audio synthesis) ---------- */
const Snd=(function(){
  let ac=null,master=null,nbuf=null,mGain=null,musicOn=false,mNext=0,mStep=0;
  function init(){
    try{
      if(!ac){
        const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        ac=new AC();master=ac.createGain();master.gain.value=.8;
        const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;
        master.connect(comp);comp.connect(ac.destination);
        nbuf=ac.createBuffer(1,ac.sampleRate|0,ac.sampleRate);const d=nbuf.getChannelData(0);
        let b=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b=b*.6+w*.4;d[i]=b;}
        mGain=ac.createGain();mGain.gain.value=0;mGain.connect(master);
      }
      if(ac.state==='suspended'){const p=ac.resume();if(p&&p.catch)p.catch(()=>{});}
    }catch(e){ac=null;}
  }
  const ok=()=>!!ac&&ac.state!=='closed';
  function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
  function tone(f1,f2,dur,vol,type,delay,dest){
    if(!ok())return;
    try{const t=ac.currentTime+(delay||0);const o=ac.createOscillator();o.type=type||'sine';
      o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
      const g=ac.createGain();env(g,t,Math.min(.012,dur*.2),vol,dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05);}catch(e){}
  }
  function noise(f1,f2,q,dur,vol,type,delay){
    if(!ok())return;
    try{const t=ac.currentTime+(delay||0);const s=ac.createBufferSource();s.buffer=nbuf;
      const f=ac.createBiquadFilter();f.type=type||'bandpass';f.Q.value=q;f.frequency.setValueAtTime(f1,t);
      if(f2&&f2!==f1)f.frequency.exponentialRampToValueAtTime(f2,t+dur);
      const g=ac.createGain();env(g,t,Math.min(.02,dur*.25),vol,dur);
      s.connect(f);f.connect(g);g.connect(master);const off=Math.random()*.5;s.start(t,off);s.stop(t+dur+.05);}catch(e){}
  }
  const mid=n=>440*Math.pow(2,(n-69)/12);
  function box(n,t,vol){
    try{const f=mid(n);[[1,1],[2,.28],[4.02,.08]].forEach(([m,a])=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f*m;
      const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*a,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+1.1/m+.2);
      o.connect(g);g.connect(mGain);o.start(t);o.stop(t+1.5);});}catch(e){}
  }
  function bass(n,t,vol,dur){
    try{const o=ac.createOscillator();o.type='triangle';o.frequency.value=mid(n);const g=ac.createGain();
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(mGain);o.start(t);o.stop(t+dur+.05);}catch(e){}
  }
  const MEL=[76,0,79,78,0,76,74,0,76,71,0,0,72,0,76,74,0,72,71,0,74,76,0,0,
             76,0,79,81,0,79,78,0,76,74,0,0,72,0,74,76,0,78,79,0,0,0,0,0];
  const CH=[[55,59,62],[50,54,57],[52,55,59],[47,50,54],[48,52,55],[50,54,57],[55,59,62],[55,59,62],
            [55,59,62],[48,52,55],[50,54,57],[47,50,55],[48,52,55],[50,54,57],[55,59,62],[55,59,62]];
  const BT=60/112;
  function tick(){
    if(!musicOn||!ok()||ac.state!=='running')return;
    const now=ac.currentTime;if(mNext<now-.5)mNext=now+.05;
    while(mNext<now+.3){
      const st=mStep%48,beat=st%3,bar=(st/3|0)%16;const ch=CH[bar];
      if(MEL[st])box(MEL[st]+12,mNext,.075);
      if(beat===0)bass(ch[0]-12,mNext,.09,BT*1.6);else{box(ch[1],mNext,.022);box(ch[2],mNext,.018);}
      mNext+=BT;mStep++;
    }
  }
  function music(on){
    if(!ok())return;musicOn=on;
    try{const t=ac.currentTime;mGain.gain.cancelScheduledValues(t);mGain.gain.setValueAtTime(mGain.gain.value,t);
      mGain.gain.linearRampToValueAtTime(on?1:0,t+(on?1.5:2));if(on){mNext=t+.1;mStep=0;}}catch(e){}
  }
  return{init,tick,music,
    suspend(){try{if(ac&&ac.state==='running')ac.suspend().catch(()=>{});}catch(e){}},
    resume(){try{if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});}catch(e){}},
    fusu(){noise(950,480,.7,.13,.22,'bandpass');noise(320,180,.5,.1,.12,'lowpass');},
    shuru(v){const k=clamp(v,0,1);noise(1700+k*600,3300+k*800,1.3,.12,.045+.07*k,'bandpass');},
    koro(n){const f=[523,587,659,698,784][n%5];tone(f,f*.82,.15,.11,'sine');tone(f*2.01,f*1.7,.07,.03,'sine');},
    pofun(v){v=v||1;tone(210,82,.34,.28*v,'sine');noise(700,220,.6,.22,.14*v,'lowpass');},
    bell(d){tone(1568,1568,.75,.055,'sine',d||0);tone(2350,2350,.5,.028,'sine',(d||0)+.02);},
    mugyu(){noise(520,170,1,.2,.18,'lowpass');tone(270,165,.22,.13,'triangle');},
    success(){[1047,1319,1568,2093].forEach((f,i)=>{tone(f,f,.95,.065,'sine',.1+i*.085);tone(f*2,f*2,.35,.012,'sine',.1+i*.085);});},
    pok(){tone(540,380,.07,.07,'sine');},
    fluff(){noise(1300,800,.8,.06,.05,'bandpass');},
    mew(){tone(720,980,.14,.07,'sine');tone(980,640,.22,.06,'sine',.13);},
    boing(){tone(300,760,.17,.09,'sine');},
    thump(){tone(95,48,.26,.32,'sine');noise(320,110,.6,.16,.14,'lowpass');},
    creak(){noise(240,420,5,1.3,.06,'bandpass');tone(118,140,1.3,.035,'triangle');},
    joy(){[784,988,1175,1568].forEach((f,i)=>tone(f,f*1.01,.4,.06,'sine',i*.07));},
    whoosh(){noise(400,1600,.8,.5,.09,'bandpass');}
  };
})();

/* ---------- layout ---------- */
let W=1,H=1,DPR=1,u=4,portrait=true;let safe={t:0,r:0,b:0,l:0};
const LY={strips:[],homes:{}};
function readSafe(){
  try{const s=getComputedStyle(sa);return{t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};}
  catch(e){return{t:0,r:0,b:0,l:0};}
}
function doLayout(){
  W=Math.max(200,window.innerWidth|0);H=Math.max(200,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  safe=readSafe();
  const aw=W-safe.l-safe.r,ah=H-safe.t-safe.b;
  portrait=aw/ah<1.0;
  LY.strips=[];
  if(portrait){
    u=Math.min(ah*.0046,aw/94);
    LY.px=safe.l+aw*.5;LY.foot=safe.t+ah*.655;
    LY.floorTop=LY.foot-15*u;
    LY.gw=Math.min(aw*.82,84*u);LY.gTop=safe.t+ah*.045;
    const my=LY.foot+7*u;
    LY.mat={x:safe.l+1.5*u,y:my,w:aw-3*u,h:H-safe.b-1.2*u-my};
    const top=LY.mat.y+4.5*u,bot=LY.mat.y+LY.mat.h-4*u;
    for(let i=0;i<3;i++){
      const y=top+(i+.5)*(bot-top)/3;const ax=LY.mat.x+10.5*u,tx=LY.mat.x+LY.mat.w-4*u;
      LY.strips.push({ax,ay:y,ex:1,ey:0,len:tx-ax,w:6*u});
    }
    LY.tray={y:LY.foot+2.6*u,xs:[.31,.69,.2,.8,.42,.58].map(f=>safe.l+aw*f)};
    LY.homes={cat:{x:safe.l+aw*.13,y:LY.foot+3*u,sc:.78},bear:{x:safe.l+aw*.25,y:LY.floorTop+2.5*u,sc:.72},rabbit:{x:safe.l+aw*.86,y:LY.foot+3*u,sc:.78}};
  }else{
    u=Math.min(ah*.0068,aw*.0048);
    LY.px=safe.l+aw*.565;LY.foot=safe.t+ah*.9;
    LY.floorTop=LY.foot-16*u;
    LY.gw=Math.min(aw*.44,98*u);LY.gTop=safe.t+ah*.045;
    const my=safe.t+ah*.33;
    const mx=safe.l+W*.035+1.5*u;LY.mat={x:mx,y:my,w:Math.min(aw*.3,LY.px-mx-46*u),h:H-safe.b-2*u-my};
    const top=LY.mat.y+18*u,bot=LY.mat.y+LY.mat.h-4*u;
    for(let i=0;i<3;i++){
      const y=top+(i+.5)*(bot-top)/3;const ax=LY.mat.x+10.5*u,tx=LY.mat.x+LY.mat.w-4*u;
      LY.strips.push({ax,ay:y,ex:1,ey:0,len:tx-ax,w:6*u});
    }
    LY.tray={y:LY.mat.y+8.5*u,xs:[0,1,2,3].map(k=>LY.mat.x+11*u+k*15*u).filter(x=>x<LY.mat.x+LY.mat.w-8*u)};
    LY.homes={cat:{x:safe.l+aw*.39,y:LY.foot+1*u,sc:.9},rabbit:{x:safe.l+aw*.8,y:LY.foot+1*u,sc:.9},bear:{x:safe.l+aw*.91,y:LY.foot-3*u,sc:.92}};
  }
  LY.gx=LY.px;LY.gBot=LY.floorTop+2*u;
  LY.hw=LY.gw/2;LY.archH=LY.hw*.72;LY.spring=LY.gTop+LY.archH;
  // wall embroidery spots
  LY.wallFl=[];
  const R=mul(5);
  for(let i=0;i<10;i++){
    const side=i%2?1:-1;const k=(i>>1)/5;
    const x=LY.gx+side*(LY.hw+5*u+R()*Math.max(4*u,(W/2-LY.hw-10*u)));
    const y=LY.gTop+20*u+k*(LY.floorTop-LY.gTop-26*u)+R()*8*u;
    if(x>4*u&&x<W-4*u)LY.wallFl.push({x,y,r:(2.4+R()*1.6)*u,c:STRIPCOLS[i%STRIPCOLS.length],d:i*.18,rot:R()*TAU});
  }
  renderStatic();
}

/* ---------- static background ---------- */
let bgC=null,frC=null,ballC=null;
function archPath(p,hw,inset){
  const gx=LY.gx,b=LY.gBot,top=LY.gTop+inset;const ah=LY.archH*(hw/LY.hw);const sy=top+ah;
  p.moveTo(gx-hw,b);p.lineTo(gx-hw,sy);p.ellipse(gx,sy,hw,ah,0,PI,TAU);p.lineTo(gx+hw,b);p.closePath();return p;
}
function renderStatic(){
  bgC=document.createElement('canvas');bgC.width=cv.width;bgC.height=cv.height;
  const g=bgC.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const ft=LY.floorTop;
  g.fillStyle=pat(g,PAL.wall,1);g.fillRect(0,0,W,ft+2);
  const R=mul(11);const rh=Math.max(24,12*u);
  for(let row=0,y=-rh*.35;y<ft;row++,y+=rh){
    const off=(row%2)*rh*.95;

function skirtPath(sw,yo,scal){
  const fw=fwF();const pts=[];
  for(let i=0;i<NH;i++){const t=i/(NH-1)*2-1;const h=hemAt(t);pts.push([(h.x-PR.sway.x)*sw+PR.sway.x,h.y+yo]);}

  p.moveTo(-wx,0);

  for(let i=1;i<NH;i++){

function drawVine(g,pts,k,cs){
  let tot=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);tot+=l;}
  const lim=tot*clamp(k,0,1);let acc=0;const out=[pts[0]];
  for(let i=1;i<pts.length;i++){if(acc+seg[i-1]>=lim){const f=(lim-acc)/seg[i-1];out.push([lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f)]);break;}acc+=seg[i-1];out.push(pts[i]);}
  if(out.length<2)return;
  stitch(g,smoothP(out),PAL.sage,cs,.9,1.3);
  for(let i=1;i<out.length;i++){
    const p=out[i],q=out[i-1];const a=Math.atan2(p[1]-q[1],p[0]-q[0]);
    const lp=E((p[0]+q[0])/2+Math.cos(a+1.4)*1.1,(p[1]+q[1])/2+Math.sin(a+1.4)*1.1,1.3,.6,a+.6);
    g.fillStyle=pat(g,PAL.sage,cs);g.fill(lp);g.strokeStyle='rgba(60,80,50,.4)';g.lineWidth=.25;g.stroke(lp);
    if(i%2===0){g.fillStyle=PAL.pearl;g.beginPath();g.arc(p[0],p[1],.5,0,TAU);g.fill();}
  }
}

function animalHead(a){const s=a.sc*a.scl*u;const hy={cat:-19,rabbit:-19,bear:-22}[a.type];return{x:a.x,y:a.y-a.hop.x*u+hy*s};}

    g.lineCap='round';g.save();g.translate(.4,.6);g.strokeStyle='rgba(60,28,45,.2)';g.lineWidth=2.8;g.stroke(tp);g.restore();g.strokeStyle=pat(g,C.b,cs);g.lineWidth=2.6;g.stroke(tp);stitch(g,tp,C.d,cs,.8,1.2);}

  if(a.type==='rabbit'){for(const sd of[-1,1]){g.save();g.translate(sd*2.8,hy-5.5);g.rotate(sd*.16+a.ear.x*(sd>0?1:.8));felt(g,E(0,-7.2,2.5,8),C.b,cs,{cx:0,cy:-7,r:8});felt(g,E(0,-6.8,1.2,6),'#f3c2ca',cs,{sd:0,edge:false});g.restore();}}

  g.strokeStyle='#8a5a5a';g.lineWidth=.45;g.beginPath();g.moveTo(0,hy+2.2);g.lineTo(0,hy+3);g.arc(-.8,hy+3,.8,0,PI*.9);g.moveTo(0,hy+3);g.arc(.8,hy+3,.8,PI,PI*.1,true);g.stroke();
  if(a.type==='cat'){g.strokeStyle='rgba(255,250,240,.9)';g.lineWidth=.35;for(const sd of[-1,1]){g.beginPath();g.moveTo(sd*3.6,hy+2);g.lineTo(sd*7.6,hy+1.2);g.moveTo(sd*3.6,hy+2.7);g.lineTo(sd*7.4,hy+3.2);g.stroke();}}

  if(holding){const n=a.gifts.length;for(let i=0;i<n;i++){const f=a.gifts[i];g.save();g.scale(1/cs,1/cs);drawRose(g,((i-(n-1)/2)*3.6)*cs,(pawY-2.2)*cs,.66*s,f,f.theta,f.rot+G.t*.2,f.sq.x,0,0);g.restore();}}

  g.restore();
}
function animalHit(a,x,y){
  if(a.beh==='hidden'||a.beh==='enter'||a.beh==='leave')return 1e9;
  const s=a.sc*a.scl*u;const cx=a.x,cy=a.y-a.hop.x*u-13*s;const d=Math.hypot((x-cx),(y-cy)*.8);

}
function updAnimals(dt){
  const beat=G.t*112/60;
  for(const a of ANIMS){
    const hm=LY.homes[a.type];a.sc=hm.sc;
    a.bt+=dt;a.happy=Math.max(0,a.happy-dt);a.want=Math.max(0,a.want-dt);
    spr(a.hop,0,90,7,dt);spr(a.sq,0,150,9,dt);spr(a.rot,0,40,6,dt);
    a.earV+=(-a.ear.x*60-a.earV*3)*dt;a.ear.x+=a.earV*dt;
    a.jx*=Math.max(0,1-dt*10);a.jy*=Math.max(0,1-dt*10);
    switch(a.beh){
      case'hidden':a.x=LY.gx;a.y=LY.gBot;a.scl=.4;break;
      case'enter':{const d=1.7;const t=clamp(a.bt/d,0,1);a.scl=lerp(.45,1,ease(t));
        a.x=lerp(LY.gx+(hm.x-LY.gx)*.12,hm.x,ease(t));a.y=lerp(LY.gBot+u,hm.y,ease(t));a.hop.x=Math.abs(Math.sin(t*PI*4))*5*(1-t*.4);a.face=hm.x<LY.gx?-1:1;
        if(t>=1){a.beh='idle';a.bt=0;a.sq.v+=4;Snd.pok();}break;}
      case'leave':{const t=clamp(a.bt/1.5,0,1);a.scl=lerp(1,.4,ease(t));a.x=lerp(hm.x,LY.gx,ease(t));a.y=lerp(hm.y,LY.gBot+u,ease(t));a.hop.x=Math.abs(Math.sin(t*PI*4))*4;
        if(t>=1){a.beh='hidden';}break;}
      case'idle':{a.scl=1;a.x+=(hm.x-a.x)*Math.min(1,dt*4);a.y+=(hm.y-a.y)*Math.min(1,dt*4);
        if(G.phase==='ball'){a.hop.x=Math.max(a.hop.x,Math.abs(Math.sin(beat*PI+a.a0))*(a.type==='bear'?.6:1.1));a.rot.x=Math.sin(beat*PI/3+a.a0)*.08;}
        if(a.want>0){a.hop.x=Math.max(a.hop.x,Math.abs(Math.sin(G.t*8))*1.5);}
        a.face=a.x<PR.x?1:-1;break;}
      case'circle':{const D=2.8;const t=clamp(a.bt/D,0,1);const cx=PR.x,cy=LY.foot+1*u;const rx=(PR.hw*fwF()+11)*u,ry=8*u;
        const a0=Math.atan2((hm.y-cy)/ry,(hm.x-cx)/rx);const dir=a.type==='cat'?1:-1;const ang=a0+dir*TAU*ease(t);
        const ex=cx+Math.cos(ang)*rx,ey=cy+Math.sin(ang)*ry;const w=Math.min(1,t*6,(1-t)*6);
        a.x=lerp(hm.x,ex,w);a.y=lerp(hm.y,ey,w);a.hop.x=Math.abs(Math.sin(t*PI*10))*2.6;a.face=-Math.sin(ang)*dir>0?1:-1;a.depth=Math.sin(ang)*w;
        if(t>=1){a.beh='idle';a.bt=0;a.depth=0;}break;}
      case'hop':{const t=a.bt;const n=Math.floor(t/.42);if(n<3){const ph=(t%.42)/.42;a.hop.x=Math.sin(ph*PI)*(7-n*1.4);if(ph<.06&&!a._h){a._h=1;a.earV+=(n%2?-1:1)*6;a.sq.v-=3;Snd.boing();}if(ph>.5)a._h=0;}else{a.beh='idle';a.bt=0;}break;}
      case'stomp':{const t=a.bt;const n=Math.floor(t/.5);if(n<3){const ph=(t%.5)/.5;a.rot.x=(n%2?.12:-.12)*Math.sin(ph*PI);a.hop.x=Math.sin(ph*PI)*1.6;
          if(ph>.85&&!a._s){a._s=1;a.sq.v+=7;G.shake.v+=26;Snd.thump();for(const b of ANIMS)if(b!==a&&b.beh==='idle'){b.hop.v+=14;b.sq.v-=2;}for(const p of petals){p.vy-=rnd(30,80);p.vx+=rnd(-30,30);}PR.hop.v+=6;hemPuff(1.2,.6);}if(ph<.5)a._s=0;}
        else{a.beh='idle';a.bt=0;}break;}

function tapAnimal(a){

  if(a.type==='cat'){a.beh='circle';a.hop.v+=18;Snd.mew();}
  else if(a.type==='rabbit'){a.beh='hop';}
  else{a.beh='stomp';}
}

/* ---------- flowers ---------- */
function looseFlowers(){return flowers.filter(f=>f.state==='rest'||f.state==='pop'||f.state==='fall');}
function updFlowers(dt){
  for(let i=flowers.length-1;i>=0;i--){
    const f=flowers[i];
    spr(f.sq,0,f.state==='attached'?120:170,f.state==='attached'?6:9,dt);spr(f.sp,0,60,7,dt);spr(f.hop,0,120,8,dt);spr(f.tilt,0,60,8,dt);
    switch(f.state){
      case'pop':{f.t+=dt/.62;const t=clamp(f.t,0,1);f.x=lerp(f.x0,f.tx,t);f.y=lerp(f.y0,f.ty,t)-Math.sin(PI*t)*Math.max(50,20*u);f.rot+=dt*4*f.chir;
        if(t>=1){f.state='rest';f.sq.v+=9;Snd.pofun(.5);fluff(f.x,f.y+4*u,f.color,4,50);}break;}
      case'fall':{f.vy+=1800*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=1-1.5*dt;f.rot+=f.vx*.002;
        if(f.x<8*u){f.x=8*u;f.vx=Math.abs(f.vx)*.4;}if(f.x>W-8*u){f.x=W-8*u;f.vx=-Math.abs(f.vx)*.4;}
        if(f.y>=f.ground){f.y=f.ground;if(f.vy>260){f.vy*=-.32;f.sq.v+=f.vy*-.02;Snd.pofun(.6);fluff(f.x,f.y+4*u,f.color,3,40);}else{f.vy=0;f.state='rest';f.tx=f.x;f.ty=f.y;f.sq.v+=4;}}break;}
      case'drag':{
        let tx=ptr.x,ty=ptr.y-6.5*u;
        const c=G.cand;if(c&&c.w){const m=clamp(.6*(1-c.ratio)+.15,0,.75);tx=lerp(tx,c.x,m);ty=lerp(ty,c.y,m);}
        const ax=(tx-f.x)*300-f.vx*24,ay=(ty-f.y)*300-f.vy*24;f.vx+=ax*dt;f.vy+=ay*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
        const sp=Math.hypot(f.vx,f.vy);f.sp.x+=(clamp(sp/(220*u/4),0,1.6)-f.sp.x)*Math.min(1,dt*10);
        f.tilt.x+=(clamp(f.vx*.0009,-.4,.4)-f.tilt.x)*Math.min(1,dt*10);f.rot+=f.vx*.0016*dt*60*.05;
        if(c&&c.w&&c.ratio<.55){f.pressT+=dt;f.sq.x+=(.5-f.sq.x)*Math.min(1,dt*14);if(f.pressT>.08&&!f.mug){f.mug=true;Snd.mugyu();}}
        else{f.pressT=Math.max(0,f.pressT-dt*2);if(f.pressT<=0)f.mug=false;}
        break;}
      case'snap':{f.t+=dt/.16;const tg=f.slot==='extra'?toW(f.lx,f.ly):slotWorld(f.slot,f.hx);const t=clamp(f.t,0,1);f.x=lerp(f.x0,tg.x,ease(t));f.y=lerp(f.y0,tg.y,ease(t));
        if(t>=1){f.state='press';f.t=0;Snd.mugyu();}break;}
      case'press':{f.t+=dt;const tg=f.slot==='extra'?toW(f.lx,f.ly):slotWorld(f.slot,f.hx);f.x=tg.x;f.y=tg.y;f.sq.x=lerp(f.sq.x,.55,Math.min(1,dt*20));f.sq.v=0;
        if(f.slot!=='extra')slots[f.slot].dep.x=Math.max(slots[f.slot].dep.x,1.1);
        if(f.t>.13)doAttach(f);break;}
      case'gone':{f.alpha-=dt*3;if(f.alpha<=0)flowers.splice(i,1);break;}
    }

}
function drawLoose(){
  const list=flowers.filter(f=>f.state==='rest'||f.state==='pop'||f.state==='fall'||f.state==='drag'||f.state==='snap'||f.state==='press'||f.state==='gone');
  list.sort((a,b)=>(a.state==='drag')-(b.state==='drag'));
  const tg=G.target;
  for(const f of list){
    if(f.state==='press')continue;
    const sc=f.state==='snap'?lerp(1,f.slot==='extra'?.72:SLOTSC[f.slot]||1,ease(f.t)):1;
    if(f.state==='rest'||f.state==='fall'){ctx.fillStyle='rgba(60,30,40,.2)';ctx.beginPath();ctx.ellipse(f.x+1,f.y+5.2*u,6.4*u,1.8*u,0,0,TAU);ctx.fill();}
    if(tg&&tg.obj===f&&f.state==='rest'){
      const R=7*u;const pulse=.5+.5*Math.sin(G.t*3.2);const hg=ctx.createRadialGradient(f.x,f.y,R*.5,f.x,f.y,R*2.4);
      hg.addColorStop(0,'rgba(255,244,215,'+(.25+.25*pulse).toFixed(3)+')');hg.addColorStop(1,'rgba(255,240,210,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(f.x,f.y,R*2.4,0,TAU);ctx.fill();
    }

    if(f.state==='drag'){ctx.fillStyle='rgba(60,30,40,.14)';ctx.beginPath();ctx.ellipse(f.x+3*u,f.y+5*u,6*u,2.4*u,0,0,TAU);ctx.fill();}
    drawRose(ctx,f.x,f.y-f.hop.x*u,sc,f,f.theta,f.rot,f.sq.x,f.sp.x,f.tilt.x);

function princessZone(x,y){
  const l=toL(x,y);const hc=headC();
  if(Math.hypot(l.x-hc.x,l.y-hc.y+2)<14.5)return'head';
  if(l.y>-21&&l.y<0&&Math.abs(l.x)<11.5)return'body';
  if(l.y>=0&&l.y<49){const hw=lerp(9,PR.hw*fwF(),clamp(l.y/40,0,1))+3;if(Math.abs(l.x)<hw)return'skirt';}
  return null;
}
function findSlot(x,y){
  const l=toL(x,y);let best=null;
  const consider=(name,lx,ly,rad,hx)=>{if(slots[name].f)return;const d=Math.hypot(l.x-lx,l.y-ly);const ratio=d/rad;if(!best||ratio<best.ratio)best={slot:name,ratio,hx,lx,ly};};
  const c=slotLocal('chest');consider('chest',c.x,c.y,14);
  const cr=slotLocal('crown');consider('crown',cr.x,cr.y-1.5,16.5);
  if(!slots.hem.f){const hx=clamp(l.x,-PR.hw*.7,PR.hw*.7);const h=slotLocal('hem',hx);
    let d=Math.hypot((l.x-h.x)*.6,l.y-h.y);if(l.y>16&&l.y<54&&Math.abs(l.x)<PR.hw+6)d=Math.min(d,Math.abs(l.y-h.y)*.5);
    const ratio=d/15;if(!best||ratio<best.ratio)best={slot:'hem',ratio,hx,lx:h.x,ly:h.y};}
  if(!best)return null;
  if(best.ratio>1){const z=princessZone(x,y);if(!(z&&best.ratio<2))return null;best.ratio=Math.min(best.ratio,.99);}
  const w=toW(best.lx,best.ly);best.x=w.x;best.y=w.y;best.w=true;return best;
}
function doAttach(f){
  const name=f.slot;f.state='attached';f.sq.x=.6;f.sq.v=-3;f.sp.x=0;
  let wpos;
  if(name==='extra'){extras.push(f);wpos=toW(f.lx,f.ly);hemImpulse(clamp(f.lx/PR.hw,-1,1),5,1.5);hemPuff(2.4,1.2);PR.spread.v+=2.2;setPose(Math.random()<.5?'hop':'giggle',1.1);}
  else{
    slots[name].f=f;slots[name].hx=f.hx;wpos=slotWorld(name,f.hx);
    const tx=name==='hem'?clamp(f.hx/PR.hw,-1,1):0;
    hemImpulse(tx,name==='hem'?14:7,name==='hem'?4:2);hemPuff(name==='hem'?6:3.4,name==='hem'?2.6:1.4);
    const n=(slots.chest.f?1:0)+(slots.hem.f?1:0)+(slots.crown.f?1:0);
    PR.spreadT=1+.09*n+(slots.hem.f?.07:0);PR.spread.v+=name==='hem'?4.5:3;
    PR.sparkle=2;
    if(name==='chest'){PR.vineT=1;setPose('bow',2.2);PR.blush.v+=3;}
    if(name==='hem'){PR.layersT=3;setPose('twirl',1.8);setTimeout0(()=>spinPrincess(f.hx>=0?1:-1),.25);for(const p of petals){const dx=p.x-PR.x;const s=dx>=0?1:-1;p.vx+=s*rnd(120,260);p.vy-=rnd(20,90);p.vr+=s*rnd(6,14);}}
    if(name==='crown'){PR.crownT=1;PR.threadT=1;setPose('stretch',2);}
    if(n>=3&&G.phase==='dress'){G.finaleAt=G.t+2.6;}
  }
  sparks(wpos.x,wpos.y,10,PAL.goldT);fluff(wpos.x,wpos.y,f.color,4,70);
  Snd.success();Snd.pofun(.6);
  G.cand=null;
}
let timers=[];
function setTimeout0(fn,delay){timers.push({t:G.t+delay,fn});}
function runTimers(){for(let i=timers.length-1;i>=0;i--){if(G.t>=timers[i].t){const fn=timers[i].fn;timers.splice(i,1);fn();}}}

/* ---------- petals, curtains, stars ---------- */
function updPetals(dt){
  for(const p of petals){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.vx*=1-2.2*dt;p.vy=p.vy*(1-2.2*dt);p.vr*=1-2*dt;

  if(ptr.mode==='flower'&&ptr.obj){

  if(at(5.7)){AN.rabbit.beh='enter';AN.rabbit.bt=0;Snd.boing();}

const ptr={id:null,down:false,x:0,y:0,sx:0,sy:0,t0:0,mode:'none',obj:null,moved:0,acc:0,lx:0};
function hitTest(x,y){
  // loose flowers first (small objects on top)
  let best=null,bd=1e9;
  for(const f of flowers){if(!(f.state==='rest'||f.state==='pop'||f.state==='fall'))continue;const d=Math.hypot(x-f.x,y-f.y);const r=Math.max(9*u,30);if(d<r&&d<bd){bd=d;best={k:'flower',o:f};}}
  if(best)return best;
  if(G.phase==='ball'){for(const a of ANIMS){const d=animalHit(a,x,y);if(d<bd){bd=d;best={k:'animal',o:a};}}if(best)return best;}
  for(const st of strips){const d=stripHit(st,x,y);if(d<bd){bd=d;best={k:'strip',o:st};}}
  if(best)return best;
  const z=princessZone(x,y);if(z)return{k:'princess',z};
  return{k:'none'};
}

  const h=hitTest(x,y);

    const f=h.o;ptr.mode='flower';ptr.obj=f;f.state='drag';f.vx=f.vy=0;f.pressT=0;f.mug=false;f.sq.v-=3;f.hop.x=0;Snd.pok();
    if(G.phase==='ball'){for(const a of ANIMS)if(a.beh==='idle')a.want=99;}
  }else if(h.k==='strip'){
    const st=h.o;ptr.mode='roll';ptr.obj=st;st.touching=true;st.prevAng=null;st.lpx=x;st.lpy=y;
    st.theta=Math.min(THMAX-.05,st.theta+.32);st.peak=Math.max(st.peak,st.theta);st.sq.v-=5;st.hop.v+=4;
    st.prevHd=null;addNap(st,x,y,0);
    const q=stripSL(st,x,y);for(let i=1;i<=NS;i++){const d=Math.abs(i/NS*q.Lr-q.s);if(d<5*u)st.v[i]+=(Math.random()-.5)*60;}
    Snd.fusu();rollInput(st,x,y);
    G.pointDir=null;
  }else if(h.k==='animal'){ptr.mode='none';tapAnimal(h.o);}
  else if(h.k==='princess'){
    if(h.z==='skirt'){ptr.mode='skirt';const l=toL(x,y);hemImpulse(clamp(l.x/PR.hw,-1,1),5,1.4);PR.spread.v+=1.3;Snd.fluff();Snd.pok();}
    else{ptr.mode='none';if(!first)setPose('giggle',1);PR.hop.v+=6;PR.bend.v+=2;Snd.pok();}
  }else{
    ptr.mode='none';if(!first){fluff(x,y,PAL.pearl,3,35);Snd.fluff();}
    if(y<Math.max(16,6.5*u)+30||x<W*.08||x>W*.92)G.curtSway=Math.max(G.curtSway,.6);
  }
}
function moveTo(x,y){
  x=clamp(x,0,W);y=clamp(y,0,H);
  const dx=x-ptr.x,dy=y-ptr.y;ptr.moved+=Math.hypot(dx,dy);ptr.x=x;ptr.y=y;
  if(ptr.mode==='roll'&&ptr.obj){rollInput(ptr.obj,x,y);}
  else if(ptr.mode==='flower'&&ptr.obj){
    const f=ptr.obj;
    if(G.phase==='dress'){
      const c=findSlot(f.x,f.y);G.cand=c;
      if(c&&c.slot==='hem')slots.hem.px=c.hx;
    }else G.cand=null;
    if(G.phase==='ball'){for(const a of ANIMS){if(a.beh==='idle'&&animalHit(a,f.x,f.y)<1e9){a.want=Math.max(a.want,.5);a.happy=.3;}}}
  }else if(ptr.mode==='skirt'){
    const l=toL(x,y);if(Math.abs(dx)>.5){hemImpulse(clamp(l.x/PR.hw,-1,1),dx/u*.9,Math.abs(dx)/u*.25);PR.sway.v+=dx/u*.6;}
    ptr.acc+=dx;
    if(Math.abs(ptr.acc)>16*u){spinPrincess(Math.sign(ptr.acc));ptr.acc=0;if(G.phase==='ball'){setPose('dance',0);}else setPose('twirl',1.2);PR.spread.v+=2;}
  }
}
function dropFlower(f){
  f.state='fall';f.ground=clamp(Math.max(f.y+2*u,LY.floorTop+8*u),LY.floorTop+6*u,H-safe.b-7*u);
  if(portrait&&f.ground>LY.foot+6*u&&f.ground<H)f.ground=Math.max(f.ground,LY.foot+4*u);
  f.vy=Math.min(f.vy,0)*.3;f.vx*=.4;
}
function end(cancel){
  const m=ptr.mode,o=ptr.obj;ptr.down=false;ptr.mode='none';ptr.obj=null;
  if(m==='roll'&&o){o.touching=false;o.prevAng=null;}
  else if(m==='flower'&&o){
    const f=o;
    for(const a of ANIMS)a.want=0;
    if(G.phase==='dress'){
      const c=findSlot(f.x,f.y);
      if(c&&!cancel){f.slot=c.slot;f.hx=c.hx||0;if(f.pressT>.06){doAttach(f);}else{f.state='snap';f.t=0;f.x0=f.x;f.y0=f.y;}}
      else dropFlower(f);
    }else if(G.phase==='ball'){
      let ta=null,bd=1e9;for(const a of ANIMS){const d=animalHit(a,f.x,f.y);const d2=animalHit(a,ptr.x,ptr.y);const dd=Math.min(d,d2);if(dd<bd){bd=dd;ta=a;}}
      if(ta&&!cancel){f.state='gift';ta.gifts.push(f);if(ta.gifts.length>3){const old=ta.gifts.shift();old.state='gone';old.alpha=0;}ta.beh='joy';ta.bt=0;ta._j=0;Snd.joy();Snd.success();hearts(ta.x,ta.y-24*ta.sc*u,4);sparks(ta.x,ta.y-14*ta.sc*u,8);
        setPose('cheer',1.2);
        if(ANIMS.every(a=>a.gifts.length>0)&&G.resetAt<0){G.resetAt=G.t+9;for(const a of ANIMS){a.hop.v+=18;}setTimeout0(()=>{spinPrincess(1);Snd.joy();for(const a of ANIMS)hearts(a.x,a.y-24*a.sc*u,3);},1.2);}}
      else if(!cancel&&princessZone(f.x,f.y)==='skirt'&&extras.length<6){const l=toL(f.x,f.y);f.slot='extra';f.lx=clamp(l.x,-PR.hw*.8,PR.hw*.8);f.ly=clamp(l.y,8,38);f.state='snap';f.t=0;f.x0=f.x;f.y0=f.y;}
      else dropFlower(f);
    }else dropFlower(f);
    G.cand=null;
  }else if(m==='skirt'){
    if(G.t-ptr.t0<.3&&ptr.moved<14){PR.spread.v+=3.2;hemPuff(3.5,2);PR.hop.v+=5;Snd.fluff();if(G.phase==='ball')setPose('hop',.7);}
  }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();Snd.init();
  if(ptr.id!==null){
    // a second finger: tiny independent fluff only, never touches game state
    fluff(clamp(e.clientX,0,W),clamp(e.clientY,0,H),PAL.pearl,2,25);return;
  }
  ptr.id=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  begin(clamp(e.clientX,0,W),clamp(e.clientY,0,H));
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==ptr.id)return;e.preventDefault();
  let list=null;try{list=e.getCoalescedEvents?e.getCoalescedEvents():null;}catch(_){list=null;}
  if(list&&list.length){for(const c of list)moveTo(c.clientX,c.clientY);}else moveTo(e.clientX,e.clientY);
},{passive:false});
function upH(e){if(e.pointerId!==ptr.id)return;e.preventDefault&&e.preventDefault();end(e.type==='pointercancel');ptr.id=null;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}
cv.addEventListener('pointerup',upH,{passive:false});
cv.addEventListener('pointercancel',upH,{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===ptr.id){end(true);ptr.id=null;}});
function releaseAll(){if(ptr.id!==null){end(true);ptr.id=null;}}
window.addEventListener('blur',releaseAll);
['contextmenu','selectstart','dragstart','gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});

/* ---------- resize / visibility ---------- */
function onResize(){
  const ow=W,oh=H;releaseAll();doLayout();
  if(ow>1&&oh>1&&(ow!==W||oh!==H)){
    for(const f of flowers){if(f.state==='rest'||f.state==='fall'||f.state==='pop'){f.x=clamp(f.x*W/ow,8*u,W-8*u);f.y=clamp(f.y*H/oh,LY.floorTop+6*u,H-safe.b-7*u);f.tx=f.x;f.ty=f.y;if(f.state==='pop')f.state='rest';}}
    for(const st of strips){st.naps.length=0;st.y.fill(0);st.v.fill(0);}
    initPetals();initStars();
    for(const a of ANIMS){if(a.beh!=='hidden'&&a.beh!=='enter'&&a.beh!=='leave'){const h=LY.homes[a.type];a.x=h.x;a.y=h.y;if(a.beh==='circle')a.beh='idle';}}
  }
}
window.addEventListener('resize',()=>{onResize();});
window.addEventListener('orientationchange',()=>{setTimeout(onResize,120);});
let running=true,last=performance.now(),acc=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;releaseAll();Snd.suspend();}
  else{if(!running){running=true;last=performance.now();acc=0;Snd.resume();requestAnimationFrame(frame);}}
});

/* ---------- main loop ---------- */
const STEP=1/120;
function update(dt){
  G.t+=dt;G.pt+=dt;
  if(!ptr.down&&!demo.active)G.idle+=dt;
  if(G.demoCool>0)G.demoCool-=dt;
  runTimers();
  computeTarget();
  for(const st of strips)updStrip(st,dt);
  updPrincess(dt);updFlowers(dt);updAnimals(dt);updParts(dt);updPetals(dt);updDemo(dt);
  spr(G.shake,0,300,14,dt);spr(G.doorGlow,G.phase==='dress'?0:G.doorGlow.x,8,4,dt);if(G.doorGlow.x<0)G.doorGlow.x=0;
  G.curtSway=Math.max(G.phase==='ball'?1:0,G.curtSway-dt*.4);
  for(const k in slots){const s=slots[k];let tg=0;
    if(!s.f&&ptr.mode==='flower'&&G.cand&&G.cand.slot===k)tg=clamp(1-G.cand.ratio,0,1)*.9+(ptr.obj&&ptr.obj.pressT>0?.4:0);
    s.pulse=(G.target&&G.target.kind==='slot'&&G.target.name===k)||(!s.f&&G.target&&G.target.kind==='flower'&&nextSlotName()===k)?.5+.5*Math.sin(G.t*4):0;
    if(s.pulse>0)tg=Math.max(tg,.15+.15*s.pulse);
    spr(s.dep,tg,120,12,dt);}
  // hints: gentle hop of the single target while idle
  const tg=G.target;
  if(tg&&!ptr.down&&G.idle>1.4&&(G.phase==='dress'||G.phase==='ball')){
    const ph=(G.t%2.4);
    if(ph<dt*1.01){if(tg.kind==='strip'){tg.obj.hop.v+=9;tg.obj.sq.v-=3;}else if(tg.kind==='flower'){tg.obj.hop.v+=11;tg.obj.sq.v-=3;}else if(tg.kind==='animal'){tg.obj.hop.v+=12;}}
  }
  if(G.phase==='dress'||G.phase==='ball'){
    if(!demo.active&&!ptr.down&&G.idle>4&&G.demoCool<=0&&G.target&&(G.target.kind==='strip'||G.target.kind==='flower'||G.target.kind==='animal'))startDemo();
  }
  // princess small idle actions
  if(G.phase==='dress'&&!ptr.down&&PR.pose==='idle'){
    G.idleAct-=dt;
    if(G.idleAct<0){G.idleAct=rnd(5.5,8);if(!slots.chest.f)setPose('stroke',1.7);}
  }
  if(G.phase==='dress'&&G.finaleAt>0&&G.t>=G.finaleAt&&ptr.mode!=='flower')startFinale();
  if(G.phase==='finale')updFinale(dt);
  if(G.phase==='ball'){
    if(!ptr.down)G.ballIdle+=dt;
    if(PR.pose==='idle')setPose('dance',0);
    if(Math.floor(G.t/7.5)!==Math.floor((G.t-dt)/7.5)&&!ptr.down&&Math.abs(PR.spinV)<.1)spinPrincess(Math.random()<.5?1:-1);
    if((G.resetAt>0&&G.t>=G.resetAt&&ptr.mode!=='flower')||G.ballIdle>50)startReset();
  }
  if(G.phase==='reset')updReset(dt);
}
function draw(){
  const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#6e5a6c';g.fillRect(0,0,W,H);
  const shk=G.shake.x;g.save();if(Math.abs(shk)>.05)g.translate(Math.sin(G.t*70)*shk*.08,Math.abs(shk)*.05);
  g.drawImage(bgC,0,0,W,H);
  drawGate();
  drawWallFlowers();
  drawRugWave();
  drawLightSpill();
  drawStars(1/60);
  drawCurtains();
  drawPetals();
  const behind=ANIMS.filter(a=>a.beh!=='hidden'&&(a.beh==='enter'||a.beh==='leave'||a.y<LY.foot-4*u||(a.depth||0)<-.05));
  const front=ANIMS.filter(a=>a.beh!=='hidden'&&behind.indexOf(a)<0);
  behind.sort((a,b)=>a.y-b.y);for(const a of behind)drawAnimal(a);
  drawPrincess();
  front.sort((a,b)=>a.y-b.y);for(const a of front)drawAnimal(a);
  const tgS=G.target&&G.target.kind==='strip'&&!ptr.down?G.target.obj:null;
  for(const st of strips)drawStrip(st,st===tgS);
  drawLoose();
  drawParts();
  if(demo.active)drawMitten(demo.x,demo.y,demo.press,demo.alpha*.95,-.4);
  g.restore();
}
function frame(now){
  if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.1)dt=.1;
  acc+=dt;let n=0;
  try{
    while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++;}
    if(n>=12)acc=0;
    Snd.tick();
    draw();
  }catch(err){console.warn(err);}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
doLayout();initPetals();initStars();
for(const st of strips){st.gt=1;}
// settle physics so the first frame is calm
for(let i=0;i<30;i++)update(STEP);
G.idle=0;
window.__felt={G,PR,strips,flowers,slots,ANIMS,LY,ptr,slotWorld,get u(){return u;},stripC:i=>({x:strips[i].C.x,y:strips[i].C.y,r:rollRu(strips[i].theta)*u})};
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
