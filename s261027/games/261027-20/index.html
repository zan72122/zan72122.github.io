#sa{position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const saEl=document.getElementById('sa');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const bump=(s,c,w)=>{const u=(s-c)/w;return Math.exp(-u*u);};

/* ================= layout ================= */
let W=390,H=844,DPR=1,S=1,Yb=844,Yh=0,z0=2800,portrait=true,HW=108,AMP=55,LAT=1,LEVOFF=46,safeB=0,safeT=0;
const cam={s:0,x:0,vs:0,vx:0};
const D=[450,1100,1750,2400,3300];
const SIDE=[0,-1,1,-1,0];
const G=D.map(d=>d-330);
const S_END=D[4]+530;
const CP=[[-900,0],[0,0],[450,0.04],[780,-0.3],[1100,-0.6],[1430,0.12],[1750,0.8],[2080,0.12],[2400,-0.7],[2740,0.15],[3050,0.4],[3300,0],[3700,0],[4600,0]];
function cxRaw(s){
  if(s<=CP[0][0])return CP[0][1];
  const n=CP.length;
  if(s>=CP[n-1][0])return CP[n-1][1];
  let i=0;while(i<n-2&&s>=CP[i+1][0])i++;
  const a=CP[i],b=CP[i+1],pa=CP[Math.max(0,i-1)],pb=CP[Math.min(n-1,i+2)];
  const L=b[0]-a[0];const t=(s-a[0])/L;
  const m0=(b[1]-pa[1])/(b[0]-pa[0])*L, m1=(pb[1]-a[1])/(pb[0]-a[0])*L;
  const t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*a[1]+(t3-2*t2+t)*m0+(-2*t3+3*t2)*b[1]+(t3-t2)*m1;
}
function cx(s){return AMP*cxRaw(s);}
function hw(s){
  let w=HW*(1+0.18*bump(s,D[2]+40,200)+0.95*bump(s,D[4]+170,330)*(portrait?1:0.8));
  if(s>S_END-140){w*=Math.sqrt(clamp((S_END-s)/140,0,1));}
  return w;
}
function readSafe(){try{const cs=getComputedStyle(saEl);safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;}catch(e){safeT=safeB=0;}}
function resize(){
  W=Math.max(200,window.innerWidth||390);H=Math.max(200,window.innerHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  if(W*H*DPR*DPR>3.4e6)DPR=Math.max(1,Math.sqrt(3.4e6/(W*H)));
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  portrait=H>=W*1.05;
  readSafe();
  S=portrait?Math.min(H/844,W/390):Math.min(H/820,W/700);
  Yb=H-safeB*0.55;
  const span=2.5*Yb;Yh=Yb-span;z0=span/(0.75*S);
  const vw=W/S;
  if(portrait){HW=Math.min(108,vw*0.28);AMP=Math.min(55,vw*0.14);LAT=1;LEVOFF=Math.min(46,vw*0.12);}
  else{HW=clamp(vw*0.15,150,200);AMP=clamp(vw*0.17,90,240);LAT=clamp(vw/760,1.2,1.9);LEVOFF=78;}
  snapCam();
}

/* ================= projection ================= */
const _p={x:0,y:0,k:0};
function pj(x,s,h){let z=z0+(s-cam.s);if(z<z0*0.35)z=z0*0.35;const sc=z0/z;_p.k=sc*S;_p.x=W/2+(x-cam.x)*_p.k;_p.y=Yh+(Yb-Yh)*sc-(h||0)*_p.k;return _p;}
function P(x,s,h){const p=pj(x,s,h);return{x:p.x,y:p.y,k:p.k};}
function unproj(X,Y){let sc=(Y-Yh)/(Yb-Yh);if(sc<0.3)sc=0.3;const d=z0/sc-z0;const k=sc*S;return{s:cam.s+d,x:cam.x+(X-W/2)/k};}
function scAt(d){return z0/(z0+d);}

/* ================= textures ================= */
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function noiseFn(n,seed){
  const g=new Float32Array(n*n);let r=seed*9301+49297;
  for(let i=0;i<n*n;i++){r=(r*16807)%2147483647;g[i]=r/2147483647;}
  return function(x,y){
    const xi=Math.floor(x),yi=Math.floor(y);let xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const x0=((xi%n)+n)%n,x1=(x0+1)%n,y0=((yi%n)+n)%n,y1=(y0+1)%n;
    const a=g[y0*n+x0],b=g[y0*n+x1],c=g[y1*n+x0],d=g[y1*n+x1];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
let NACRE,NP,MOSAIC,MP,BANK,BP,NACRE2,NP2;
function genNacre(warm){
  const N=256,c=mkC(N,N),g=c.getContext('2d'),img=g.createImageData(N,N),d=img.data;
  const n1=noiseFn(4,warm?5:11),n2=noiseFn(8,warm?17:23),n3=noiseFn(16,37),n4=noiseFn(32,51),n5=noiseFn(8,77);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=x/N,v=y/N;
    const q=n1(u*4,v*4)*0.55+n2(u*8,v*8)*0.3+n3(u*16,v*16)*0.15;
    const w=n5(u*8+q*3,v*8+q*2);
    const t=q*1.7+w*0.7;
    const fib=Math.pow(0.5+0.5*Math.sin(TAU*(40*u+14*v)+q*10+w*4),9);
    const fib2=Math.pow(0.5+0.5*Math.sin(TAU*(-9*u+31*v)+q*7),14);
    const band=Math.pow(0.5+0.5*Math.sin(TAU*(2*u+1*v)+q*6),5);
    const mic=n4(u*32,v*32)-0.5;
    const br=0.9+0.11*band+0.07*fib+0.04*fib2+0.05*mic;
    let r=0.86+0.1*Math.cos(TAU*(t+0.02)),gg=0.86+0.09*Math.cos(TAU*(t+0.36)),b=0.9+0.09*Math.cos(TAU*(t+0.68));
    if(warm){r+=0.03;b-=0.03;}
    const i=(y*N+x)*4;
    d[i]=clamp(r*br*255,0,255);d[i+1]=clamp(gg*br*255,0,255);d[i+2]=clamp(b*br*255,0,255);d[i+3]=255;
  }
  g.putImageData(img,0,0);return c;
}
const PAL=['#f3cfe2','#cde4f7','#dcd2f5','#c9eedd','#f6e6c6','#e8d3f6','#c8e6f2'];
function genMosaic(){
  const N=512,c=mkC(N,N),g=c.getContext('2d');
  g.fillStyle='#cfcbe4';g.fillRect(0,0,N,N);
  const np=g.createPattern(NACRE,'repeat');
  const cells=13,cs=N/cells;let seed=7;const rr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const polys=[];
  for(let j=0;j<cells;j++)for(let i=0;i<cells;i++){
    const cxp=(i+0.5+(rr()-0.5)*0.5)*cs,cyp=(j+0.5+(rr()-0.5)*0.5)*cs;
    const nv=5+Math.floor(rr()*3),rot=rr()*TAU,pts=[];
    for(let k=0;k<nv;k++){const a=rot+k/nv*TAU+(rr()-0.5)*0.5;const rad=cs*(0.52+rr()*0.22);pts.push([Math.cos(a)*rad,Math.sin(a)*rad*(0.75+rr()*0.3)]);}
    polys.push({x:cxp,y:cyp,pts,col:PAL[Math.floor(rr()*PAL.length)],ang:rr()*TAU,sc:0.4+rr()*0.5,lt:rr()});
  }
  for(const p of polys){
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const X=p.x+ox*N,Y=p.y+oy*N;if(X<-cs*1.2||X>N+cs*1.2||Y<-cs*1.2||Y>N+cs*1.2)continue;
      g.save();g.translate(X,Y);g.beginPath();p.pts.forEach((q,k)=>k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();
      g.save();g.clip();g.rotate(p.ang);g.scale(p.sc,p.sc);g.fillStyle=np;g.fillRect(-cs*3,-cs*3,cs*6,cs*6);g.restore();
      g.globalAlpha=0.5;g.fillStyle=p.col;g.fill();g.globalAlpha=1;
      const gr=g.createLinearGradient(-cs*0.5,-cs*0.5,cs*0.5,cs*0.5);
      gr.addColorStop(0,'rgba(255,255,255,'+(0.25+p.lt*0.35)+')');gr.addColorStop(0.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(120,110,170,0.18)');
      g.fillStyle=gr;g.fill();
      g.lineWidth=2;g.strokeStyle='rgba(176,140,80,0.7)';g.stroke();
      g.lineWidth=0.7;g.strokeStyle='rgba(255,255,255,0.6)';g.stroke();
      g.restore();
    }
  }
  return c;
}
function genBank(){
  const N=512,c=mkC(N,N),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,N,N);gr.addColorStop(0,'#232a58');gr.addColorStop(0.5,'#1b2149');gr.addColorStop(1,'#262d5e');
  g.fillStyle=gr;g.fillRect(0,0,N,N);
  const nz=noiseFn(8,99);const img=g.getImageData(0,0,N,N),d=img.data;
  for(let y=0;y<N;y+=1)for(let x=0;x<N;x++){const v=(nz(x/64,y/64)-0.5)*2;const i=(y*N+x)*4;d[i]+=v;d[i+1]+=v;d[i+2]+=v*1.4;}
  g.putImageData(img,0,0);
  const np=g.createPattern(NACRE,'repeat');
  let seed=3;const rr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const items=[];
  for(let i=0;i<9;i++)items.push({x:rr()*N,y:rr()*N,r:12+rr()*16,t:Math.floor(rr()*3),a:rr()*TAU});
  const drawAt=(it,X,Y)=>{
    g.save();g.translate(X,Y);g.rotate(it.a);
    // gold vine
    g.strokeStyle='rgba(222,186,110,0.75)';g.lineWidth=1.4;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(it.r*1.5,-it.r,it.r*2.5,it.r*0.8,it.r*3.4,0);g.stroke();
    g.beginPath();g.arc(it.r*3.4,-it.r*0.4,it.r*0.4,0,TAU*0.8);g.stroke();
    g.fillStyle='rgba(235,200,120,0.9)';for(let k=0;k<4;k++){g.beginPath();g.arc(it.r*(0.8+k*0.7),Math.sin(k*1.7)*it.r*0.5,1.6,0,TAU);g.fill();}
    if(it.t===0){
      for(let k=0;k<5;k++){g.save();g.rotate(k/5*TAU);g.beginPath();g.ellipse(0,-it.r*0.6,it.r*0.32,it.r*0.62,0,0,TAU);g.save();g.clip();g.fillStyle=np;g.fillRect(-it.r,-it.r*1.5,it.r*2,it.r*2);g.restore();g.strokeStyle='rgba(222,186,110,0.8)';g.lineWidth=0.9;g.stroke();g.restore();}
      g.fillStyle='#f6e8c8';g.beginPath();g.arc(0,0,it.r*0.22,0,TAU);g.fill();
    }else if(it.t===1){
      g.beginPath();g.moveTo(0,it.r*0.6);for(let k=0;k<=8;k++){const a=Math.PI+k/8*Math.PI;g.quadraticCurveTo(Math.cos(a-0.2)*it.r*1.15,Math.sin(a-0.2)*it.r*1.15-it.r*0.1,Math.cos(a)*it.r,Math.sin(a)*it.r-it.r*0.1);}g.closePath();
      g.save();g.clip();g.fillStyle=np;g.fillRect(-it.r*1.3,-it.r*1.3,it.r*2.6,it.r*2.6);g.restore();
      g.strokeStyle='rgba(222,186,110,0.8)';g.lineWidth=1;g.stroke();
      for(let k=1;k<8;k++){const a=Math.PI+k/8*Math.PI;g.beginPath();g.moveTo(0,it.r*0.5);g.lineTo(Math.cos(a)*it.r*0.95,Math.sin(a)*it.r*0.95-it.r*0.1);g.stroke();}
    }else{
      for(let k=0;k<3;k++){g.save();g.rotate(-0.6+k*0.6);g.beginPath();g.ellipse(0,-it.r*0.7,it.r*0.28,it.r*0.75,0,0,TAU);g.save();g.clip();g.fillStyle=np;g.fillRect(-it.r,-it.r*1.6,it.r*2,it.r*2);g.restore();g.strokeStyle='rgba(222,186,110,0.8)';g.lineWidth=0.9;g.stroke();g.restore();}
    }
    g.restore();
  };
  for(const it of items)for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const X=it.x+ox*N,Y=it.y+oy*N;if(X>-120&&X<N+120&&Y>-120&&Y<N+120)drawAt(it,X,Y);}
  g.fillStyle='rgba(240,214,150,0.55)';
  for(let i=0;i<70;i++){g.beginPath();g.arc(rr()*N,rr()*N,0.6+rr()*1.1,0,TAU);g.fill();}
  return c;
}
function buildTextures(){
  NACRE=genNacre(false);NACRE2=genNacre(true);
  NP=ctx.createPattern(NACRE,'repeat');NP2=ctx.createPattern(NACRE2,'repeat');
  MOSAIC=genMosaic();MP=ctx.createPattern(MOSAIC,'repeat');
  BANK=genBank();BP=ctx.createPattern(BANK,'repeat');
}

/* ================= drawing helpers ================= */
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);}
function LG(x0,y0,x1,y1,st){const g=ctx.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<st.length;i+=2)g.addColorStop(st[i],st[i+1]);return g;}
function RG(x,y,r0,r1,st,x1,y1){const g=ctx.createRadialGradient(x,y,Math.max(0,r0),x1===undefined?x:x1,y1===undefined?y:y1,Math.max(0.1,r1));for(let i=0;i<st.length;i+=2)g.addColorStop(st[i],st[i+1]);return g;}
function nacreIn(bx,by,bw,bh,shx,shy,sc,warm){
  ctx.save();ctx.clip();ctx.fillStyle=warm?NP2:NP;const s=sc||0.45;const ox=shx||0,oy=shy||0;
  ctx.translate(ox,oy);ctx.scale(s,s);ctx.fillRect((bx-ox)/s,(by-oy)/s,bw/s,bh/s);ctx.restore();
}
function sheen(x0,y0,x1,y1,ph,a){
  const f=((ph%1)+1)%1;
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(clamp(f-0.18,0,1),'rgba(255,255,255,0)');
  g.addColorStop(clamp(f-0.08,0,1),'rgba(255,214,236,'+(a*0.8)+')');
  g.addColorStop(clamp(f,0,1),'rgba(255,255,255,'+a+')');
  g.addColorStop(clamp(f+0.08,0,1),'rgba(200,236,255,'+(a*0.8)+')');
  g.addColorStop(clamp(f+0.18,0,1),'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fill();
}
function goldStroke(w){ctx.lineWidth=w;ctx.strokeStyle='#c9993f';ctx.stroke();ctx.lineWidth=w*0.45;ctx.strokeStyle='#ffe7a6';ctx.stroke();}
function goldGrad(x0,y0,x1,y1){return LG(x0,y0,x1,y1,[0,'#fff0b8',0.35,'#f2c862',0.7,'#c38d2e',1,'#f6d27a']);}
function star(x,y,r,a){ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*0.28:r;const an=a+i/8*TAU;ctx.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr);}ctx.closePath();}
function pearlBall(x,y,r,glow){
  if(glow>0){ctx.fillStyle=RG(x,y,r*0.5,r*3.2,[0,'rgba(255,246,220,'+(0.5*glow)+')',1,'rgba(255,246,220,0)']);circ(x,y,r*3.2);ctx.fill();}
  ctx.fillStyle=RG(x-r*0.35,y-r*0.4,r*0.1,r*1.15,[0,'#ffffff',0.35,'#fbf3ff',0.7,'#e7dcef',1,'#b9b0d2'],x,y);circ(x,y,r);ctx.fill();
  ctx.fillStyle='rgba(255,210,235,0.35)';ell(x+r*0.25,y+r*0.35,r*0.55,r*0.3,-0.5);ctx.fill();
  ctx.fillStyle='rgba(200,240,255,0.4)';ell(x-r*0.3,y+r*0.2,r*0.4,r*0.22,0.6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.95)';circ(x-r*0.38,y-r*0.42,r*0.22);ctx.fill();
}
function glowAt(x,y,r,a){if(a<=0.01)return;ctx.fillStyle=RG(x,y,r*0.15,r,[0,'rgba(255,244,200,'+(0.6*a)+')',0.5,'rgba(255,214,238,'+(0.28*a)+')',1,'rgba(255,214,238,0)']);circ(x,y,r);ctx.fill();}

/* ================= audio ================= */
let AC=null,mGain=null,wet=null,noiseB=null,gushG=null,gushF=null,rumG=null,ambG=null,voices=0;const lastP={};
function audioInit(){
  if(AC){if(AC.state!=='running'){try{AC.resume();}catch(e){}}return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C();}catch(e){AC=null;return;}
  try{
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=0.003;comp.release.value=0.25;
    mGain=AC.createGain();mGain.gain.value=0.75;mGain.connect(comp);comp.connect(AC.destination);
    const sr=AC.sampleRate;noiseB=AC.createBuffer(1,sr*2,sr);const nd=noiseB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const len=Math.floor(sr*2.4),ir=AC.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const dd=ir.getChannelData(ch);for(let i=0;i<len;i++){const t=i/len;dd[i]=(Math.random()*2-1)*Math.pow(1-t,3.2);}}
    const conv=AC.createConvolver();conv.buffer=ir;wet=AC.createGain();wet.gain.value=1;const wo=AC.createGain();wo.gain.value=0.3;wet.connect(conv);conv.connect(wo);wo.connect(mGain);
    const loop=(fType,f,q,g0)=>{const src=AC.createBufferSource();src.buffer=noiseB;src.loop=true;const fl=AC.createBiquadFilter();fl.type=fType;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=g0;src.connect(fl);fl.connect(g);g.connect(mGain);src.start();return[g,fl];};
    [gushG,gushF]=loop('bandpass',800,0.6,0);
    [rumG]=loop('lowpass',150,0.8,0);
    [ambG]=loop('lowpass',380,0.5,0.018);
    const sil=AC.createBufferSource();sil.buffer=AC.createBuffer(1,1,sr);sil.connect(AC.destination);sil.start(0);
    AC.resume&&AC.resume();
  }catch(e){}
}
function okA(){return AC&&AC.state==='running'&&mGain;}
function gap(name,g){if(!okA())return false;const t=AC.currentTime;if(lastP[name]!==undefined&&t-lastP[name]<g)return false;lastP[name]=t;return true;}
function tone(f,type,vol,dec,o){
  if(!okA()||voices>44)return;o=o||{};
  const t=AC.currentTime+(o.delay||0);
  const os=AC.createOscillator();os.type=type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.glide||dec));

const BF={x:0,y:0,k:1,rot:0,front:0,back:0};
function boatFrame(b){
  const q=pj(b.x,b.s,0);BF.k=q.k*b.size;BF.x=q.x;BF.y=q.y-b.lift*q.k;BF.rot=b.roll*0.22;BF.front=b.pitch*12;BF.back=-b.pitch*8;return BF;

function boatLocal(lx,ly,out){ // boat local -> screen

const ptrs=new Map();
let hits=[];
function pushHit(kind,x,y,r,pri,ref){hits.push({kind,x,y,r,pri,ref});}
function mainTarget(){
  const ph=st.phase;
  if(ph==='travel')return gates[st.stage]&&gates[st.stage].rise>0.8?'lever':null;
  if(ph==='duck')return duck.state==='dock'?'duck':null;
  if(ph==='pearl')return(pearl.state==='surface'||pearl.state==='float')?'pearl':null;
  if(ph==='flag')return frog.flag==='hand'&&frog.state==='pad'?'flag':null;
  if(ph==='arrive'||ph==='party'){if(party.t<5)return null;if(party.ring.rise>0.95&&party.hi>=party.toys.length)return'ring';return party.toys[party.hi%party.toys.length];}

function pick(x,y){
  const mt=mainTarget();let best=null,bs=-1e9;
  for(const h of hits){
    let r=h.r;if(h.kind===mt)r*=1.4;
    const d=Math.hypot(h.x-x,h.y-y);if(d>r)continue;
    const sc=h.pri*1000-d+(h.kind===mt?500:0);

function onDown(e){
  e.preventDefault();audioInit();

  if(st.phase==='loop')return;
  const h=pick(x,y);p.hit=h;
  if(!h){fallbackTap(x,y);return;}

}
function onMove(e){
  const p=ptrs.get(e.pointerId);if(!p)return;e.preventDefault();
  p.x=e.clientX;p.y=e.clientY;p.moved=Math.max(p.moved,Math.hypot(p.x-p.x0,p.y-p.y0));

}
function onUp(e,cancel){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);

}
function isTap(p){return p.moved<14&&performance.now()-p.t0<450;}
function downKind(p,h){

    case'duck':{

    case'decor':{const dc=h.ref;dc.wv+=6;dc.ov+=5;SFX.glock(pn(Math.floor(Math.random()*5)+8,72),0.5,0);const q=dc._w;if(q)sparkles(q[0],q[1],20,4,14,1);break;}

function moveKind(p){

      gt.p=clamp(gt.p0+0.05+eff/tr,0,1);break;}
    case'duck':if(duck.drag===p.id){duck.sx=p.x+duck.ox;duck.sy=p.y+duck.oy;}break;
    case'pearl':if(pearl.drag===p.id){const now=performance.now();const dtm=Math.max(1,now-pearl.lastT);pearl.vX=lerp(pearl.vX,(p.x-pearl.lastX)/dtm*1000,0.4);pearl.vY=lerp(pearl.vY,(p.y-pearl.lastY)/dtm*1000,0.4);pearl.lastX=p.x;pearl.lastY=p.y;pearl.lastT=now;

function upKind(p,cancel){

/* ================= update ================= */
let T=0;
function leverTravel(gt){const pv=leverPivot(gt.k);return 2.0*LEVL*pv.k;}
const LEVL=104;
function leverPivot(k){return pj(leverWX(k),G[k]+22,0);}
function update(dt){
  T+=dt;st.phaseT+=dt;st.idle+=dt;
  const k=st.stage;
  // gates & levers
  for(const gt of gates){
    if(gt.rising&&gt.rise<1){const was=gt.rise;gt.rise=Math.min(1,gt.rise+dt*0.7);if(was===0){SFX.rise();}
      if(Math.random()<dt*30)splash(cx(gt.s)+rnd(-hw(gt.s),hw(gt.s)),gt.s+rnd(-6,6),1,0.6,false);
      if(gt.rise>=1){SFX.clank();}}
    if(gt.rise>=0.95&&gt.R<1&&gt.g<0.05)gt.R=Math.min(1,gt.R+dt*(gt.k===st.stage?0.4:0.2));
    if(gt.drag===null){
      if(gt.tap>0){gt.tap-=dt;gt.p+=(0.42-gt.p)*Math.min(1,dt*28);gt.v=0;}
      else{const a=-150*gt.p-6.5*gt.v-3;gt.v+=a*dt;gt.p+=gt.v*dt;if(gt.p<0){gt.p=0;if(gt.v<-0.8){gt.v=-gt.v*0.3;SFX.click(0.4);}else gt.v=0;}}

function hintSag(){const th=st.touched?4:6;if(st.idle<th)return 0;const t=(st.idle-th)%4;return t<1.2?Math.sin(t/1.2*Math.PI)*0.07:0;}

/* ================= main loop ================= */
let last=performance.now(),running=true;
function frame(now){
  if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  const n=Math.max(1,Math.ceil(dt/(1/120)));const h=dt/n;
  try{
    for(let i=0;i<n;i++)update(h);
    if(okA())musicTick();
    render();
  }catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
  requestAnimationFrame(frame);
}
function onVis(){
  if(document.hidden){running=false;if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}}
  else if(!running){running=true;last=performance.now();if(AC){try{AC.resume();}catch(e){}}requestAnimationFrame(frame);}
}

  cvs.addEventListener('lostpointercapture',e=>{if(ptrs.has(e.pointerId))onUp(e,true);});
  cvs.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();},{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  document.addEventListener('selectstart',e=>e.preventDefault());
  window.addEventListener('resize',resize);

  if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',onVis);
  window.addEventListener('pagehide',()=>{running=false;if(AC){try{AC.suspend();}catch(e){}}});
  window.addEventListener('pageshow',()=>{if(!document.hidden&&!running){running=true;last=performance.now();if(AC){try{AC.resume();}catch(e){}}requestAnimationFrame(frame);}});
  window.addEventListener('focus',()=>{if(AC&&AC.state!=='running'&&!document.hidden){try{AC.resume();}catch(e){}}});

}
