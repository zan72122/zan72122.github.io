<body>

<script>
"use strict";
(function(){
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=(d,s)=>Math.exp(-(d*d)/(2*s*s));

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const L={W:390,H:844,U:1,dpr:1};
let SIL=false; // silhouette drawing mode
const SHC='#24142f';
const C=c=>SIL?SHC:c;

// ---------- offscreen canvases ----------
const bgC=document.createElement('canvas'), bgG=bgC.getContext('2d');
const fgC=document.createElement('canvas'), fgG=fgC.getContext('2d');
const texC=document.createElement('canvas'), texG=texC.getContext('2d');
const fabC=document.createElement('canvas'), fabG=fabC.getContext('2d');
const shC=document.createElement('canvas'), shG=shC.getContext('2d');
const stC=document.createElement('canvas'), stG=stC.getContext('2d');
const TS=0.5, SS=0.28; // texture & shadow scale
let weavePat=null;

function readSafe(){
  const s=getComputedStyle(document.getElementById('safe'));
  return {t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};
}

function layout(){
  const W=Math.max(200,window.innerWidth), H=Math.max(200,window.innerHeight);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const sf=readSafe();
  L.W=W;L.H=H;L.dpr=dpr;L.sf=sf;
  L.land=W>H*1.05;
  L.U=Math.max(0.7,Math.min(W/390,H/600));
  const U=L.U;
  if(L.land){
    L.curtL=Math.max(sf.l+W*0.17,W*0.18); L.curtR=Math.min(W-sf.r-W*0.17,W*0.82);
    L.curtTop=sf.t+H*0.13; L.cb=H*0.71; L.duvH=H*0.06;
  }else{
    L.curtL=sf.l+W*0.05; L.curtR=W-sf.r-W*0.05;
    L.curtTop=sf.t+Math.max(H*0.10,70); L.cb=H*0.70; L.duvH=H*0.05;
  }
  L.cw=L.curtR-L.curtL; L.cx=(L.curtL+L.curtR)/2; L.ch=L.cb-L.curtTop;
  L.backY=L.cb-3*U;
  L.apronBot=H-sf.b-L.duvH;
  L.apronY=L.cb+(L.apronBot-L.cb)*0.66;
  L.fyMin=L.cb-Math.min(L.ch*0.2,110*U); L.fyMax=L.cb-4*U;
  L.fxMin=L.curtL+16*U; L.fxMax=L.curtR+ (L.land?40*U:6*U);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  bgC.width=fgC.width=cv.width; bgC.height=fgC.height=cv.height;
  texC.width=Math.max(8,Math.ceil(L.cw*TS)); texC.height=Math.max(8,Math.ceil(L.ch*TS));
  fabC.width=texC.width; fabC.height=texC.height;
  shC.width=stC.width=Math.max(8,Math.ceil(W*SS)); shC.height=stC.height=Math.max(8,Math.ceil(H*SS));
  buildWeave(); drawBG(); drawFG(); drawFabric();
  if(typeof onLayout==='function') onLayout();
}

// ---------- shapes ----------
function starPath(g,x,y,r,rot,n,inner){
  n=n||5; inner=inner||0.5; g.beginPath();
  for(let i=0;i<n*2;i++){const a=rot-Math.PI/2+i*Math.PI/n, rr=i%2?r*inner:r; const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath();
}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
// plush ellipse with soft radial shading
function ell(g,x,y,rx,ry,c0,c1,c2,rot){
  g.beginPath(); g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);
  if(SIL){g.fillStyle=SHC;}
  else if(c1){const gr=g.createRadialGradient(x-rx*.35,y-ry*.45,Math.min(rx,ry)*.08,x,y,Math.max(rx,ry)*1.08);
    gr.addColorStop(0,c0);gr.addColorStop(.65,c1);gr.addColorStop(1,c2||c1);g.fillStyle=gr;}
  else g.fillStyle=c0;
  g.fill();
}
function stitch(g,draw,col,w){ if(SIL)return; g.save(); g.setLineDash([2.2,2.4]); g.lineWidth=w||1; g.strokeStyle=col||'rgba(90,50,40,.45)'; g.beginPath(); draw(); g.stroke(); g.restore(); }
function buttonEye(g,x,y,r,closed,lx,ly){
  if(SIL)return;
  if(closed){g.save();g.strokeStyle='#2b1b1e';g.lineWidth=r*.55;g.lineCap='round';g.beginPath();g.arc(x,y+r*.2,r*.8,Math.PI*1.1,Math.PI*1.9);g.stroke();g.restore();return;}
  x+=(lx||0)*r*.35; y+=(ly||0)*r*.35;
  g.fillStyle='#24171a';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.strokeStyle='rgba(120,90,90,.6)';g.lineWidth=r*.18;g.beginPath();g.arc(x,y,r*.78,0,TAU);g.stroke();
  g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(x-r*.35,y-r*.38,r*.3,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(x+r*.3,y+r*.35,r*.14,0,TAU);g.fill();
}
function blush(g,x,y,r,a){ if(SIL)return; g.fillStyle='rgba(240,120,130,'+(a||.35)+')'; g.beginPath(); g.ellipse(x,y,r,r*.7,0,0,TAU); g.fill(); }

// ---------- audio ----------
const A={ctx:null,out:null,noise:null,last:{},music:null,nextNote:0,step:0};
function audioInit(){
  if(A.ctx){ if(A.ctx.state==='suspended'){const p=A.ctx.resume(); if(p&&p.catch)p.catch(()=>{});} return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{A.ctx=new AC();}catch(e){A.ctx=null;return;}
  const comp=A.ctx.createDynamicsCompressor();
  A.out=A.ctx.createGain(); A.out.gain.value=0.55; A.out.connect(comp); comp.connect(A.ctx.destination);
  const len=A.ctx.sampleRate; const b=A.ctx.createBuffer(1,len,A.ctx.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1; A.noise=b;
  if(A.ctx.state==='suspended'){const p=A.ctx.resume(); if(p&&p.catch)p.catch(()=>{});}
}
function gap(key,ms){const t=performance.now(); if(A.last[key]&&t-A.last[key]<ms)return false; A.last[key]=t; return true;}
function tone(f,dur,o){
  if(!A.ctx)return; o=o||{}; const t=A.ctx.currentTime+(o.delay||0);
  const osc=A.ctx.createOscillator(), g=A.ctx.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const v=o.vol||.15, at=o.at||.006;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+at); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(A.out); osc.start(t); osc.stop(t+dur+.05);
}
function noise(dur,o){
  if(!A.ctx||!A.noise)return; o=o||{}; const t=A.ctx.currentTime+(o.delay||0);
  const s=A.ctx.createBufferSource(); s.buffer=A.noise; s.loop=true;
  const f=A.ctx.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||2500,t); f.Q.value=o.q||.8;
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const g=A.ctx.createGain(); const v=o.vol||.1;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.at||dur*.3)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(A.out); s.start(t,Math.random()*.5); s.stop(t+dur+.05);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const sfx={
  cloth(v){ if(gap('cloth',140)) noise(.32,{f:rnd(2600,4200),q:.6,vol:.05*(v||1),f2:1500}); },
  fuwa(){ if(gap('fuwa',200)){ noise(.5,{f:900,q:.5,vol:.07,f2:3000,at:.15}); tone(330,.4,{vol:.03,f2:440}); } },
  press(){ if(gap('press',90)){ noise(.35,{f:600,q:.7,vol:.09,f2:300,at:.02}); tone(220,.35,{vol:.08,f2:150}); tone(660,.25,{vol:.03,type:'triangle',delay:.03}); } },
  click(){ tone(1800,.04,{type:'square',vol:.04}); tone(900,.06,{type:'triangle',vol:.05,delay:.03}); },
  light(m){ if(gap('light',110)) tone(300+m*70,.18,{type:'sine',vol:.025,at:.03}); },
  wood(p){ p=p||1; if(gap('wood',60)){ tone(520*p,.12,{vol:.18,type:'sine'}); tone(1180*p,.07,{vol:.08,type:'triangle'}); noise(.05,{f:1800,q:2,vol:.05}); } },
  creak(){ if(gap('creak',300)){ tone(140,.32,{type:'sawtooth',vol:.035,f2:210}); tone(180,.25,{type:'sawtooth',vol:.02,f2:120,delay:.12}); } },
  swish(){ if(gap('swish',160)){ tone(900,.25,{type:'triangle',vol:.04,f2:1600}); noise(.25,{f:5000,q:1.5,vol:.03}); } },
  step(){ if(gap('step',110)) tone(rnd(150,190),.09,{vol:.07,f2:90}); },
  squish(p){ p=p||1; if(gap('squish',120)){ tone(520*p,.12,{vol:.12,f2:300*p}); tone(380*p,.16,{vol:.1,f2:700*p,delay:.1}); } },
  boing(){ if(gap('boing',400)){ tone(200,.4,{type:'triangle',vol:.1,f2:600}); tone(600,.3,{vol:.05,f2:300,delay:.15}); } },
  chime(){ [76,79,84].forEach((n,i)=>tone(NOTE(n),.6,{vol:.07,delay:i*.07,type:'sine'})); },
  tada(){ [72,76,79,84,88].forEach((n,i)=>{tone(NOTE(n),.7,{vol:.08,delay:i*.08});tone(NOTE(n+12),.3,{vol:.025,delay:i*.08,type:'triangle'});}); },
  merge(big){ const ns=big?[48,55,60,64,67,72,76]:[55,60,64,67]; ns.forEach((n,i)=>tone(NOTE(n),1.4-i*.1,{vol:.07,at:.08,delay:i*.09})); },
  pop(){ tone(700,.08,{vol:.12,f2:1200}); tone(1500,.1,{vol:.05,delay:.05,type:'triangle'}); },
  yum(){ [79,83,86].forEach((n,i)=>tone(NOTE(n),.25,{vol:.08,delay:i*.09,type:'triangle'})); },
  purr(){ if(gap('purr',900)){ const t=1.1; noise(t,{f:180,q:3,vol:.12,ft:'lowpass'}); for(let i=0;i<8;i++) tone(55,.1,{vol:.05,delay:i*.13,type:'triangle'}); } },
  ting(){ if(gap('ting',120)) tone(NOTE(84+Math.floor(rnd(0,5))*2),.5,{vol:.05}); },
  sparkle(){ if(gap('spark',200)) [88,91,96].forEach((n,i)=>tone(NOTE(n),.3,{vol:.03,delay:i*.05})); },
  whoosh(){ if(gap('whoosh',260)) noise(.4,{f:700,f2:2400,q:.7,vol:.06}); },
};
const MARCH=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,74,71];
const LULL=[67,72,76,72,74,71,67,0,69,72,77,76,74,72,71,0];
function musicTick(){
  if(!A.ctx||!A.music)return;
  const ct=A.ctx.currentTime; if(A.nextNote<ct)A.nextNote=ct+.05;
  while(A.nextNote<ct+.15){
    const d=A.nextNote-ct;
    if(A.music==='march'){
      const n=MARCH[A.step%16]; tone(NOTE(n),.22,{vol:.06,delay:d}); tone(NOTE(n+12),.12,{vol:.025,delay:d,type:'triangle'});
      if(A.step%2===0) tone(NOTE(48+(A.step%8<4?0:7)),.18,{vol:.06,delay:d,type:'triangle'});
      A.nextNote+=.24;
    }else{
      const n=LULL[A.step%16]; if(n){tone(NOTE(n),1.1,{vol:.04,delay:d,at:.01}); tone(NOTE(n+12),.6,{vol:.012,delay:d,type:'triangle'});}
      if(A.step%4===0) tone(NOTE(48+[0,5,7,0][(A.step/4|0)%4]),1.6,{vol:.03,delay:d,at:.05});
      A.nextNote+=.42;
    }
    A.step++;
  }
}
function setMusic(m){ if(A.music!==m){A.music=m;A.step=0;} }

// ---------- static scenery ----------
function seeded(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function buildWeave(){
  const t=document.createElement('canvas'); t.width=6; t.height=6; const g=t.getContext('2d');
  g.fillStyle='rgba(255,240,250,.07)'; g.fillRect(0,0,6,1); g.fillRect(0,3,6,1);
  g.fillStyle='rgba(60,30,70,.07)'; g.fillRect(1,0,1,6); g.fillRect(4,0,1,6);
  weavePat=ctx.createPattern(t,'repeat');
}
function drawWindow(g,x,y,w,h){
  const U=L.U;
  g.fillStyle='#5b3b2c'; rrect(g,x-6*U,y-6*U,w+12*U,h+12*U,6*U); g.fill();
  const sky=g.createLinearGradient(0,y,0,y+h); sky.addColorStop(0,'#0c1230'); sky.addColorStop(1,'#2a2c5e');
  g.fillStyle=sky; rrect(g,x,y,w,h,4*U); g.fill();
  const r=seeded(7);
  for(let i=0;i<14;i++){g.fillStyle='rgba(255,240,200,'+(.4+r()*.5)+')'; g.beginPath(); g.arc(x+r()*w,y+r()*h,(0.6+r()*1.2)*U,0,TAU); g.fill();}
  const mr=Math.min(w,h)*.22, mx=x+w*.62, my=y+h*.32;
  const gl=g.createRadialGradient(mx,my,mr*.5,mx,my,mr*3); gl.addColorStop(0,'rgba(255,228,160,.35)'); gl.addColorStop(1,'rgba(255,228,160,0)');
  g.fillStyle=gl; g.fillRect(x,y,w,h);
  g.save(); g.beginPath(); g.arc(mx,my,mr,0,TAU); g.arc(mx+mr*.45,my-mr*.2,mr*.85,0,TAU,true); g.fillStyle='#f6d98d'; g.fill('evenodd'); g.restore();
  g.strokeStyle='#5b3b2c'; g.lineWidth=4*U; g.beginPath(); g.moveTo(x+w/2,y); g.lineTo(x+w/2,y+h); g.moveTo(x,y+h/2); g.lineTo(x+w,y+h/2); g.stroke();
  g.fillStyle='#e9c46a'; g.fillRect(x-8*U,y+h+4*U,w+16*U,4*U);
  // small window curtains
  g.fillStyle='rgba(196,150,180,.85)';
  g.beginPath(); g.moveTo(x-6*U,y-6*U); g.quadraticCurveTo(x+w*.25,y+h*.4,x-2*U,y+h*.75); g.lineTo(x-6*U,y+h*.75); g.fill();
  g.beginPath(); g.moveTo(x+w+6*U,y-6*U); g.quadraticCurveTo(x+w*.75,y+h*.4,x+w+2*U,y+h*.75); g.lineTo(x+w+6*U,y+h*.75); g.fill();
}
function drawBG(){
  const g=bgG,W=L.W,H=L.H,U=L.U; g.setTransform(L.dpr,0,0,L.dpr,0,0);
  const wall=g.createLinearGradient(0,0,0,H); wall.addColorStop(0,'#161c3d'); wall.addColorStop(.6,'#262650'); wall.addColorStop(1,'#2e2550');
  g.fillStyle=wall; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.025)'; for(let x=0;x<W;x+=26*U) g.fillRect(x,0,10*U,H);
  const r=seeded(11);
  for(let i=0;i<Math.floor(W*H/2600/U/U);i++){ const sx=r()*W, sy=r()*H*.8; g.fillStyle='rgba(233,196,106,'+(.25+r()*.4)+')'; starPath(g,sx,sy,(2+r()*2.2)*U,r()*TAU); g.fill(); }
  if(L.land){ drawWindow(g,W*.035,H*.17,Math.min(W*.11,L.curtL-W*.08),H*.28); }
  else { const wy=L.sf.t+8*U, wh=L.curtTop-H*.045-wy-10*U; if(wh>26*U) drawWindow(g,W*.62,wy,W*.24,wh); }
  // backstage
  const bs=g.createLinearGradient(0,L.curtTop,0,L.cb); bs.addColorStop(0,'#2c1d36'); bs.addColorStop(.7,'#5a3a3c'); bs.addColorStop(1,'#7a5040');
  g.fillStyle=bs; g.fillRect(L.curtL,L.curtTop-20*U,L.cw,L.ch+20*U);
  const amb=g.createRadialGradient(L.cx,L.cb-L.ch*.3,10,L.cx,L.cb-L.ch*.3,L.cw*.7); amb.addColorStop(0,'rgba(255,190,110,.25)'); amb.addColorStop(1,'rgba(255,190,110,0)');
  g.fillStyle=amb; g.fillRect(L.curtL,L.curtTop,L.cw,L.ch);
  const bf=g.createLinearGradient(0,L.cb-34*U,0,L.cb); bf.addColorStop(0,'#5d3b2e'); bf.addColorStop(1,'#8a5a3c');
  g.fillStyle=bf; g.fillRect(L.curtL,L.cb-34*U,L.cw,34*U);
  // apron floor
  const fl=g.createLinearGradient(0,L.cb,0,H); fl.addColorStop(0,'#9a6644'); fl.addColorStop(1,'#5a3626');
  g.fillStyle=fl; g.fillRect(0,L.cb,W,H-L.cb);
  g.strokeStyle='rgba(50,25,15,.35)'; g.lineWidth=1.2*U;
  for(let i=-12;i<=12;i++){ g.beginPath(); g.moveTo(L.cx+i*L.cw/9,L.cb); g.lineTo(L.cx+i*L.cw/5.2,H); g.stroke(); }
  for(let k=1;k<5;k++){ const yy=L.cb+(H-L.cb)*Math.pow(k/5,1.4); g.strokeStyle='rgba(50,25,15,.18)'; g.beginPath(); g.moveTo(0,yy); g.lineTo(W,yy); g.stroke(); }
  const fs=g.createLinearGradient(0,L.cb,0,L.cb+30*U); fs.addColorStop(0,'rgba(20,10,20,.45)'); fs.addColorStop(1,'rgba(20,10,20,0)');
  g.fillStyle=fs; g.fillRect(0,L.cb,W,30*U);
  if(L.land){ // bed on the right wall
    const bx=L.curtR+W*.06, bw=W-bx+20*U, by=H*.5;
    g.fillStyle='#6b4430'; rrect(g,bx,by-H*.12,bw,H*.2,16*U); g.fill();
    g.fillStyle='#e8d6c8'; rrect(g,bx+10*U,by-H*.04,bw,H*.08,12*U); g.fill();
    const dv=g.createLinearGradient(0,by,0,H); dv.addColorStop(0,'#b77d93'); dv.addColorStop(1,'#7d4f6d');
    g.fillStyle=dv; g.beginPath(); g.moveTo(bx-6*U,by+H*.02); g.quadraticCurveTo(bx+bw*.4,by-H*.02,W,by+H*.01); g.lineTo(W,H); g.lineTo(bx-14*U,H); g.closePath(); g.fill();
    g.fillStyle='rgba(240,210,140,.6)'; const r2=seeded(5); for(let i=0;i<12;i++){starPath(g,bx+r2()*bw,by+H*.05+r2()*H*.3,4*U,r2()); g.fill();}
  }
}
function drawFG(){
  const g=fgG,W=L.W,H=L.H,U=L.U; g.setTransform(L.dpr,0,0,L.dpr,0,0); g.clearRect(0,0,W,H);
  const pw=L.land?28*U:Math.max(12*U,L.curtL-L.sf.l+2);
  const post=(x0,w)=>{ const gr=g.createLinearGradient(x0,0,x0+w,0); gr.addColorStop(0,'#4a2c22'); gr.addColorStop(.5,'#8a5a3a'); gr.addColorStop(1,'#4a2c22');
    g.fillStyle=gr; g.fillRect(x0,L.curtTop-30*U,w,L.cb-L.curtTop+34*U);
    g.fillStyle='#d9b45a'; g.fillRect(x0+w*.42,L.curtTop,w*.16,L.ch); };
  post(L.curtL-pw,pw); post(L.curtR,pw);
  // wing opening on the right post (where the light comes from)
  const ox=L.curtR, ow=pw, oy=L.fyMin-6*U, oh=L.cb-oy;
  g.save(); g.beginPath(); g.moveTo(ox,L.cb); g.lineTo(ox,oy+ow*.6); g.quadraticCurveTo(ox+ow*.5,oy-ow*.4,ox+ow,oy+ow*.6); g.lineTo(ox+ow,L.cb); g.closePath();

    if(q.y>floor){ q.y=floor; q.x=lerp(q.x,q.px,.25); } }

function groups(){

  for(const p of arr){ if(curG.length&&(p.nx-curG[curG.length-1].nx)*L.cw>48*L.U){ gs.push(curG); curG=[]; } curG.push(p); }

function paradeUpdate(dt){

  if(n!==G.gs){
    if(n>G.gs){ if(n===2){ sfx.merge(false); main.forEach(p=>jump(p,120)); }
      if(n===3){ sfx.merge(true); main.forEach(p=>{jump(p,150);p.happy=1;}); HS.forEach(s=>s.v+=rnd(-2,2)); }
      if(n===4){ sfx.merge(true); sfx.tada(); G.bowT=0; HS.forEach(s=>s.v+=rnd(-3,3)); const c=pPos(main[1]); spawn('star',c.x,c.y-50*U,18,{up:200}); } }
    G.gs=n; }

      else { p.lookY=0; if(p.hop<=0&&p.hopV===0){ p.hop=Math.max(0,Math.sin(G.beat*Math.PI+idx*Math.PI))*5; p.tilt=Math.sin(G.beat*Math.PI)*.07; } } }
    else { p.tilt=Math.sin(p.t*1.3)*.04; if(p.hopV===0&&p.hop<1.5) p.hop=0;

  // backstage
  drawPartySet(g,op);
  if(op<.5) drawBeam(g);
  const order=KINDS.map(k=>P[k]).filter(p=>p.vis&&p.z<=.5).sort((a,b)=>(a.drag?1:0)-(b.drag?1:0)||a.nx-b.nx);
  if(chair.vis&&chair.z<=.5) drawChair(g);
  drawRibbonIf(g,.5,false);
  for(const p of order) drawPuppet(g,p);
  if(!crown.on&&crown.fy<L.cb+1) drawFreeCrown(g);
  if(G.mode==='party') for(const tr of TR) if(tr.st==='home'||tr.st==='back') drawTreat(g,tr.ty,tr.x,tr.y,U*tr.sc);
  // curtain
  renderTexture(shA,G.wall*.12+(G.ready?.08:0));
  drawCurtain(g); drawTies(g);
  const showCurl=G.mode!=='party'&&op<.1&&!(CU.grab&&Math.abs(CU.grab.gx-curlX())<60*U);
  if(showCurl&&(G.mode==='act'||G.ready)) drawCurl(g,G.ready?L.cx:curlX(),G.ready?1:0,G.ready?.8+.2*Math.sin(perfT*3):.35+.25*Math.sin(perfT*3));
  if(G.ready&&op<.1){ g.save(); g.globalCompositeOperation='lighter'; const gr=g.createLinearGradient(0,hemAt(L.cx)-40*U,0,hemAt(L.cx)+10*U);
    gr.addColorStop(0,'rgba(255,200,110,0)'); gr.addColorStop(1,'rgba(255,200,110,'+(.25+.1*Math.sin(perfT*3))+')'); g.fillStyle=gr; g.fillRect(L.curtL,hemAt(L.cx)-40*U,L.cw,50*U); g.restore();
    if(Math.random()<dt*3) spawn('star',rnd(L.curtL,L.curtR),hemAt(L.cx),1,{up:60,v0:10,v1:40,s:.6}); }
  g.drawImage(fgC,0,0,L.W,L.H);
  // light source seen through the fabric (or directly when the hem is up)
  if(G.mode!=='party'||op<.5) drawFlash(g,FL.y<hemAt(FL.x)-4*U&&FL.x<L.curtR);
  // apron
  if(chair.vis&&chair.z>.5) drawChair(g);
  drawRibbonIf(g,.5,true);
  for(const p of KINDS.map(k=>P[k]).filter(p=>p.vis&&p.z>.5).sort((a,b)=>a.z-b.z)) drawPuppet(g,p);
  drawFlyFlower(g);
  if(!crown.on&&crown.fy>=L.cb+1) drawFreeCrown(g);
  if(G.mode==='party') for(const tr of TR) if(tr.st==='drag') drawTreat(g,tr.ty,tr.x,tr.y,U*1.25);
  ptUpdateDraw(g,dt);
  drawHint(g);
}
function drawRibbonIf(g,zc,front){ if(!ribbon.on||!P.cat.vis)return; if((P.cat.z>zc)===front) drawRibbon(g); }
function frame(ts){
  if(!running)return;
  const dt=Math.min(.05,Math.max(0,(ts-(lastT||ts))/1000)); lastT=ts;
  try{ update(dt); render(dt); }catch(err){ if(!frame.err){frame.err=1; console.warn(err);} }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ running=false; if(A.ctx&&A.ctx.state==='running')A.ctx.suspend().catch(()=>{}); }
  else if(!running){ running=true; lastT=0; if(A.ctx)A.ctx.resume().catch(()=>{}); requestAnimationFrame(frame);} });
let rzT=0; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(layout,60); }); window.addEventListener('orientationchange',()=>setTimeout(layout,200));
window.addEventListener('unhandledrejection',e=>e.preventDefault());
layout(); startAct(0); FL.nx=clamp((L.cx+88*L.U-L.fxMin)/(L.fxMax-L.fxMin),0,1); FL.ny=.72; flashPlace();
window.__game={G,P,CU,FL,LT,L,crown,TR,startAct,startGather,startParty,startPlay};
requestAnimationFrame(frame);
})();
</script>
