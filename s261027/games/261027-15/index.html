function stageBeat(i,kind){const c=G.stageOrder[i];if(!c||c.state!=='stage'||G.phase!=='nursery')return;const R=cR(c);const st=c.feather?[0,1,2,3][c.feather.kind]:c.T.style;
 c.sqv+=1.5;if(kind==='copy'){if(c.z<=0)jumpH(c,R*0.2);return;}
 if(st===0){c.danceDir*=-1;c.leanv+=c.danceDir*3;}else if(st===1){if(c.z<=0)jumpH(c,R*0.35);}else if(st===2){if(c.spinP>=1&&Math.random()<0.5)c.spinP=0;else if(c.z<=0)jumpH(c,R*0.2);}else{c.danceDir*=-1;c.vx=c.danceDir*R*2.5;if(c.z<=0)jumpH(c,R*0.2);}}
function playStep(step,t){
 if(M.mode==='nursery'){if(G.phase!=='nursery'){M.mode='off';return;}const n=G.stageOrder.length,s=step%16;
  if(n>=1&&(s===0||s===8)){S.drum(t,0.8);at(t,()=>{stageBeat(0);G.drum.dentV+=5;});}else if(n>=1&&s===12){S.drum(t,0.4);at(t,()=>{G.drum.dentV+=2;});}
  if(n>=2&&(s===4||s===12||s===14)){S.bell(t,s===14?91:s===4?84:88,0.6);at(t,()=>{stageBeat(1);G.bell.av+=2;});}
  if(n>=3){const m=NMEL[s];if(m){S.marimba(t,m,0.8);at(t,()=>stageBeat(2));at(t+30/M.bpm,()=>{stageBeat(0,'copy');stageBeat(1,'copy');});}if(s===0||s===6||s===8||s===14)S.bass(t,[48,43,45,43][s===0?0:s===6?1:s===8?2:3],0.7);}
 }else if(M.mode==='parade'){const s8=step%8,bar=(step>>3)%4,root=[60,65,67,60][bar];const ch=[root,root+4,root+7];const R=L.chickR;
  if(s8%2===0){S.tick(t,s8===0);at(t,()=>hopVoice(0,0.28));}
  if(s8===0||s8===4){S.bass(t,(s8===0?root:root+7)-24,0.9);at(t,()=>hopVoice(1,0.45));}
  if(s8%2===1){S.bell(t,ch[(s8>>1)%3]+12,0.45);at(t,()=>hopVoice(2,0.22));}
  const m=MEL[step%32];if(m){S.lead(t,m,0.24,1);at(t,()=>hopVoice(3,0.3));}
  if(s8===0&&bar===0)S.drum(t,0.5);
 }
}
function hopVoice(ti,h){const c=chickByTi(ti);if(!c||G.scene!=='town')return;if(c.z<=0&&c.vz<=0)jumpH(c,L.chickR*c.T.size*h);c.sqv+=0.5;}
function musicUpdate(){if(M.mode==='off')return;const c=mClock();if(M.next<c-0.3||M.next>c+3)M.next=c+0.05;let guard=0;while(M.next<c+0.12&&guard++<8){playStep(M.step,M.next);M.next+=30/M.bpm;M.step++;}}
function curChord(){const bar=(M.step>>3)%4;const root=[60,65,67,60][bar];return[root,root+4,root+7];}
function nextSub(){const c=mClock(),q=15/M.bpm;const base=M.next-30/M.bpm;let t=base;while(t<c-0.03)t+=q;return t;}

/* ---------- input ---------- */
const grabs=new Map();
function pickEgg(x,y){let best=null,bd=1e9;for(const e of G.eggs){if(e.state==='gone'||e.state==='enter'||e.grabId!=null)continue;const cy=e.y-e.z-e.ry*(1-e.sq);const d=hyp((x-e.x)/(e.rx*1.3),(y-cy)/(e.ry*1.25));if(d<1&&d<bd){bd=d;best=e;}}return best;}
function pickChick(x,y,ox){ox=ox||0;let best=null,bk=-1e9;for(const c of G.chicks){if(c.grabId!=null||c.state==='pop')continue;const R=cR(c),cx=c.x-ox;const hb=hyp(x-cx,y-(c.y-c.z-R*0.8));const hc=headC(c),hh=hyp(x-(hc.x-ox),y-hc.y);
  if(hb<R*1.25||hh<R*0.95){if(c.y>bk){bk=c.y;best={c,part:hh<R*0.8&&y<hc.y+R*0.3?'head':'body'};}}}return best;}
function pickFeather(x,y){let best=null,bd=L.eggR*0.75;for(const f of G.feathers){if(f.state!=='pot'||f.grabId!=null)continue;const mx=f.x+Math.sin(f.ang)*L.chickR*0.7,my=f.y-Math.cos(f.ang)*L.chickR*0.7;const d=hyp(x-mx,y-my);if(d<bd){bd=d;best=f;}}return best;}
function onDown(ev){
 ev.preventDefault();initAudio();G.lastInput=G.t;
 const x=ev.clientX,y=ev.clientY,id=ev.pointerId;if(grabs.has(id))return;
 try{cv.setPointerCapture(id);}catch(e){}
 if(G.scene==='nursery')downNursery(id,x,y);else downTown(x,y);
}
function downNursery(id,x,y){
 if(G.zoomDir!==0){ring(x,y);return;}
 const nur=G.phase==='nursery';
 if(nur&&G.potShow>0.6){const f=pickFeather(x,y);if(f){f.grabId=id;f.state='drag';f.ox=f.x-x;f.oy=f.y-y;grabs.set(id,{kind:'feather',o:f});S.soft(1.5);f.angv+=3;return;}}
 // worn feather tap
 for(const c of G.chicks){if(!c.feather)continue;const h=headTop(c),R=cR(c);if(hyp(x-h.x,y-(h.y-R*0.6))<R*0.6){c.fav+=5;c.fsT=1.5;c.fsHold=0.5;S.shimmer(c.feather.kind);sparkle(h.x,h.y-R*0.6,5,FCOL[c.feather.kind]);return;}}
 const pc=pickChick(x,y);
 if(pc){const c=pc.c;c.grabId=id;c.sqv+=2.5;S.soft(1.3+c.ti*0.1);grabs.set(id,{kind:'chick',o:c,part:pc.part,sx:x,sy:y,moved:false});return;}
 const e=nur?pickEgg(x,y):null;
 if(e){eggDown(e,id,x,y);return;}
 const dp=drumPos();if(hyp(x-dp.x,y-(dp.y-dp.r*0.6))<dp.r*1.6){const live=G.stageOrder.length>0;G.drum.dentV+=live?12:5;if(live){S.drum(tnow(),0.9);G.stageOrder.forEach(c=>{c.sqv+=2;});sparkle(dp.x,dp.y-dp.r,4,hex('#ffd0e0'));}else S.soft(0.8);return;}
 const bp=bellPos();if(hyp(x-(bp.x-bp.r*0.6),y-(bp.y-bp.r*1.8))<bp.r*1.7){const live=G.stageOrder.length>0;G.bell.av+=(x<bp.x-bp.r*0.6?1:-1)*(live?7:2.5);if(live){S.bell(tnow(),[84,88,91][(Math.random()*3)|0],1);G.stageOrder.forEach(c=>{c.lookT=Math.sign(bp.x-c.x)||1;});sparkle(bp.x-bp.r*0.6,bp.y-bp.r*1.6,4,hex('#fff3a0'));}else S.soft(1.6);return;}
 const n=L.nest;if(hyp((x-n.x)/(n.r*1.3),(y-n.y)/(n.ry*1.8))<1){grabs.set(id,{kind:'nest'});G.nest.touch=1.8;G.nest.sinkV+=L.eggR*9;G.nest.wob=1.3;S.fusu();fluff(x,y,4);ring(x,y,L.eggR*0.9,hex('#fff4d8'));return;}
 const s=L.stage;if(hyp((x-s.x)/s.rx,(y-s.y)/(s.ry*2.5))<1){G.stageSinkV+=L.eggR*2.5;S.soft(0.9);ring(x,y,L.eggR*0.6);return;}
 if(y<L.gate.y&&Math.abs(x-L.gate.x)<200*L.cs){G.flagKick=1;S.soft(1.2);ring(x,y,L.eggR*0.5);return;}
 ring(x,y,L.eggR*0.45);P({type:'spark',x,y:y-4,vy:-L.eggR,life:0.5,s:L.eggR*0.12,col:hex('#ffffff')});S.soft(0.7);
}
function eggDown(e,id,x,y){
 e.grabId=id;e.held=true;e.dragging=false;e.awake=3;
 const cy=e.y-e.z-e.ry*(1-e.sq),lx=clamp((x-e.x)/e.rx,-1,1),ly=clamp((y-cy)/e.ry,-1,1);
 e.dentA=Math.atan2(lx,-ly);e.pressSide=lx<0?-1:1;e.dentv+=6;e.sqv+=2.2;e.wobv+=rnd(-3,3);
 S.puni(0.9+e.ti*0.08);
 if(e.state==='nest'&&e.seated){e.charge+=0.3;G.nest.sinkV+=L.eggR*1.5;}
 grabs.set(id,{kind:'egg',o:e,sx:x,sy:y,ox:e.x-x,oy:e.y-y,maxDy:0});
}
function startEggDrag(e){e.dragging=true;if(G.nestEgg===e)G.nestEgg=null;e.state='drag';e.seated=false;S.jump(0.8);}
function onMove(ev){
 const g=grabs.get(ev.pointerId);if(!g)return;ev.preventDefault();G.lastInput=G.t;
 const x=ev.clientX,y=ev.clientY;
 if(g.kind==='egg'){const e=g.o;
  if(!e.dragging){const dx=x-g.sx,dy=y-g.sy;
   if(e.state==='nest'){if(dy<-L.eggR*0.5||Math.abs(dx)>L.eggR*0.7)startEggDrag(e);else if(dy>g.maxDy&&e.seated){e.charge+=(dy-g.maxDy)/(L.eggR*4);g.maxDy=dy;}}
   else if(hyp(dx,dy)>L.eggR*0.22)startEggDrag(e);}
  if(e.dragging){e.ptx=clamp(x+g.ox,L.eggR,W-L.eggR);e.pty=clamp(y+g.oy,L.stage.y+L.eggR*1.5,L.bot-4);}}
 else if(g.kind==='chick'){const c=g.o;
  if(!g.moved&&hyp(x-g.sx,y-g.sy)>cR(c)*0.5&&G.phase==='nursery'&&c.state!=='pop'){g.moved=true;c.state='held';c.onArrive=null;c.perf=null;S.jump(1.2);chickChirp(c,{kind:'short',pitch:1.1});}
  if(c.state==='held'){c.hx=x;c.hy=y;}}
 else if(g.kind==='feather'){const f=g.o;f.x=x+f.ox;f.y=y+f.oy;}
}
function onUp(ev){
 initAudio();
 const g=grabs.get(ev.pointerId);if(!g)return;grabs.delete(ev.pointerId);
 if(g.kind==='egg'){const e=g.o;e.held=false;e.grabId=null;if(e.state==='gone')return;if(e.dragging){e.dragging=false;releaseEgg(e);}else{e.sqv-=2.6;e.dentv-=3;if(e.state==='home'&&e.z===0)e.vz=L.eggR*3.2;}}
 else if(g.kind==='chick'){const c=g.o;c.grabId=null;if(c.state==='held'){c.state='fall';}else if(!g.moved&&c.state!=='pop'){if(g.part==='head')chickReply(c);else chickHop(c);}}
 else if(g.kind==='feather'){const f=g.o;f.grabId=null;if(f.state==='drag')dropFeather(f);}
}
function downTown(x,y){
 const TW=G.town;if(!TW)return;const wx=x+TW.camX,R=L.chickR;
 for(const c of G.chicks){if(!c.feather)continue;const h=headTop(c),Rc=cR(c);const fy=h.y-Rc*0.7*c.fs;if(hyp(wx-h.x,y-fy)<Rc*0.85*Math.max(1,c.fs*0.8)){featherSolo(c);return;}}
 const pc=pickChick(x,y,TW.camX);if(pc){tapChickTown(pc.c);return;}
 for(const f of TW.flowers){const base=TW.roadBot+R*(0.7+f.dy),h=R*1.3*f.s*(1+f.dy*0.12),hx=f.x+Math.sin(f.a)*h,hy=base-Math.cos(f.a)*h;if(hyp(wx-hx,y-hy)<R*0.9){f.av+=(wx<hx?1:-1)*6;petals(hx,hy,6,f.col,true);S.chime(f.note);return;}}
 for(const pd of TW.puddles){const py=TW.roadY+pd.dy*TW.roadH;if(Math.abs(wx-pd.x)<pd.w&&Math.abs(y-py)<pd.w*0.5){splash(pd,wx);return;}}
 for(const h of TW.houses){if(h.x>wx||h.x+h.w<wx)continue;for(const wd of h.win){const ws=h.w*0.26,wxx=h.x+wd.dx*h.w,wy=TW.roadTop+2-h.h+wd.dy*h.h+ws*0.2;if(wx>wxx-ws*0.2&&wx<wxx+ws*1.2&&y>wy-ws*0.2&&y<wy+ws*1.2){wd.force=2;wd.wave=1.2;S.tweet();sparkle(wxx+ws/2,wy,4,hex(wd.col),true);return;}}}
 ring(wx,y,L.eggR*0.45,WHITE,true);S.soft(0.8);
}
function tapChickTown(c){
 const TW=G.town,R=cR(c);c.combo=(G.t-c.lastTap<0.75)?Math.min(c.combo+1,6):0;c.lastTap=G.t;
 jumpH(c,R*(1.1+c.combo*0.28));c.flapTime=0.5;c.sqv+=2;
 const ch=curChord(),m=ch[c.combo%3]+12*Math.floor(c.combo/3)+12;const t=nextSub();
 if(AC){const p=Math.pow(2,(m-84)/12)*1.25;at(t,()=>chickChirp(c,{kind:'short',pitch:p}));
  if(c.ti===0)S.drum(t,0.5);else if(c.ti===1)S.bass(t,m-36,0.9);else if(c.ti===2)S.bell(t,m+12,0.7);else S.lead(t,m+12,0.3,1);}
 c.mouth=1;const h=headTop(c);sparkle(h.x,h.y,c.combo>=2?9:4,c.combo>=2?hex('#fff3a0'):c.T.cL,true,c.combo>=2?1.3:1);
 if(c===G.chicks[0]&&G.phase==='parade'){TW.boost=5;G.chicks.forEach((o,i)=>{if(o!==c)later(0.08*i,()=>{if(o.z<=0)jumpH(o,cR(o)*0.5);o.flapTime=0.3;});});}
}
function featherSolo(c){
 const k=c.feather.kind;c.fsT=k===1?1.7:2.2;c.fsHold=1.1;c.fav+=6;c.spinP=0;S.shimmer(k);const t=tnow();
 if(AC){const ch=curChord();[0,1,2,3,4].forEach(i=>S.bell(t+0.1+i*0.08,ch[i%3]+12+(i>2?12:0),0.6));}
 const h=headTop(c);sparkle(h.x,h.y-cR(c),12,FCOL[k],true,1.4);
}
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp,{passive:false});
window.addEventListener('pointercancel',onUp,{passive:false});
cv.addEventListener('lostpointercapture',ev=>{if(grabs.has(ev.pointerId))onUp(ev);});
['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>{if(n==='touchend')initAudio();if(e.cancelable)e.preventDefault();},{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

/* ---------- guidance ---------- */
function getTarget(){
 if(G.scene==='town'){if(G.phase==='parade'&&G.chicks[0])return{k:'tap',c:G.chicks[0]};return null;}
 if(G.phase!=='nursery')return null;
 const ne=G.nestEgg;if(ne&&ne.state==='nest'&&ne.seated)return{k:'press',e:ne};
 if(ne||G.eggs.some(e=>e.dragging))return null;
 let best=null,bd=1e9;const s=nestSeat();for(const e of G.eggs){if(e.state!=='home'||!e.entered||e.held)continue;const d=hyp(e.x-s.x,e.y-s.y);if(d<bd){bd=d;best=e;}}
 return best?{k:'drag',e:best}:null;
}
function updHint(dt){
 G.target=getTarget();const h=G.hint;
 for(const e of G.eggs)e.hintSq=0;
 if(G.target&&G.t-G.lastInput>4&&grabs.size===0&&G.zoomDir===0){h.on=true;h.t+=dt;}else{h.on=false;h.t=0;}
 if(h.on&&G.target.k==='press'){const p=h.t%3.4;if((p>0.5&&p<0.95)||(p>1.3&&p<1.75))G.target.e.hintSq=0.1;}
}
function drawHand(x,y,pr,a){
 if(a<=0.01)return;const s=L.eggR*0.5;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);const k=1-pr*0.12;ctx.scale(k,k);ctx.rotate(-0.3);
 ctx.fillStyle='#fff1e6';ctx.strokeStyle='rgba(215,150,130,0.75)';ctx.lineWidth=Math.max(1.5,s*0.08);
 rr(ctx,-0.6*s,1.05*s,1.55*s,1.35*s,0.55*s);ctx.fill();ctx.stroke();
 for(let i=0;i<3;i++){rr(ctx,(0.05+i*0.3)*s,0.9*s,0.32*s,0.6*s,0.16*s);ctx.fill();ctx.stroke();}
 rr(ctx,-0.24*s,-0.05*s,0.48*s,1.6*s,0.24*s);ctx.fill();ctx.stroke();
 ctx.fillStyle='rgba(255,200,200,0.6)';ell(ctx,0,0.18*s,0.14*s,0.1*s);ctx.fill();
 ell(ctx,-0.72*s,1.6*s,0.25*s,0.5*s,0.5);ctx.fillStyle='#fff1e6';ctx.fill();ctx.stroke();
 ctx.restore();
 if(pr>0.6){ctx.strokeStyle='rgba(255,255,255,'+(0.7*a)+')';ctx.lineWidth=2;ell(ctx,x,y,L.eggR*0.35*pr,L.eggR*0.25*pr);ctx.stroke();}
}
function drawHint(){
 const h=G.hint;if(!h.on||!G.target)return;const tg=G.target,per=3.4,p=h.t%per;
 const fa=p<0.3?p/0.3:p>2.8?Math.max(0,1-(p-2.8)/0.4):1;
 if(tg.k==='drag'){const e=tg.e,sx=e.x+e.rx*0.2,sy=e.y-e.ry*1.2,s=nestSeat(),ex=s.x+e.rx*0.2,ey=s.y-e.ry*1.2;let x=sx,y=sy,pr=0;
  if(p<0.5)pr=0;else if(p<0.7)pr=(p-0.5)/0.2;else if(p<2.1){pr=1;const q=ease((p-0.7)/1.4);x=lerp(sx,ex,q);y=lerp(sy,ey,q)-Math.sin(q*Math.PI)*L.eggR*0.6;}else{pr=Math.max(0,1-(p-2.1)/0.3);x=ex;y=ey;}
  drawHand(x,y,pr,fa*0.85);}
 else if(tg.k==='press'){const e=tg.e,x=e.x+e.rx*0.1,y=e.y-e.ry*2*(1-e.sq)+e.ry*0.05;const pr=((p>0.5&&p<0.95)||(p>1.3&&p<1.75))?1:0;drawHand(x,y+pr*L.eggR*0.1,pr,fa*0.85);}
 else if(tg.k==='tap'){const c=tg.c,R=cR(c),x=c.x-G.town.camX+R*0.2,y=c.y-c.z-R*1.2;const pr=((p>0.6&&p<0.8)||(p>1.2&&p<1.4))?1:0;drawHand(x,y,pr,fa*0.85);}
}

/* ---------- main loop ---------- */
function update(dt){
 G.t+=dt;
 for(let i=G.vq.length-1;i>=0;i--){if(G.t>=G.vq[i].gt){const f=G.vq[i].fn;G.vq.splice(i,1);try{f();}catch(e){}}}
 if(G.scene==='nursery')updNursery(dt);else updTown(dt);
 updParts(dt);updHint(dt);
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(G.scene==='nursery'){
  const zp=G.zoomP,Z=Math.pow(7,ease(zp)),ta=clamp((zp-0.5)/0.4,0,1);
  if(ta<1){ctx.save();if(Z>1.001){const gx=L.gate.x,gy=L.gate.y-L.gate.h*0.42;ctx.translate(gx,gy);ctx.scale(Z,Z);ctx.translate(-gx,-gy);}drawNursery();ctx.restore();}
  if(ta>0&&G.town){if(G.zoomDir>0)drawTownIntro(ta);else drawTown(ta,false);}
 }else drawTown(1,true);
 drawHint();
}
function drawTownIntro(a){
 const TW=G.town;const save=G.stageOrder.map(c=>[c.x,c.y,c.z,c.ds]);
 G.stageOrder.forEach((c,i)=>{c.x=TW.leadX-i*TW.spacing-(1-a)*W*0.3;c.y=TW.roadY+(i%2?1:-1)*L.chickR*0.12;c.z=0;c.ds=1;});
 drawTown(a,true);
 G.stageOrder.forEach((c,i)=>{c.x=save[i][0];c.y=save[i][1];c.z=save[i][2];c.ds=save[i][3];});
}
let last=performance.now(),raf=0,running=false;
function frame(now){
 raf=requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
 const n=Math.max(1,Math.ceil(dt/0.0084)),h=dt/n;
 try{for(let i=0;i<n;i++)update(h);musicUpdate();render();}catch(e){if(!frame.err){frame.err=1;console.warn(e);}}
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}else{if(AC)AC.resume().catch(()=>{});M.next=0;start();}});
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(layout,60);});
window.addEventListener('orientationchange',()=>setTimeout(layout,200));

layout();makeEggs(false);makeFeathers();
start();
})();
</script>
