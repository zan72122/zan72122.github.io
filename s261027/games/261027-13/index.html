<script>
'use strict';
(() => {
// ============================================================
//  基本ユーティリティ
// ============================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const R = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const damp = (c, t, rate, dt) => c + (t - c) * (1 - Math.exp(-rate * dt));
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const C = {
  ai: '#1f3a68', aiD: '#142645', aiL: '#4d6fa0', shu: '#d8452a', shuD: '#a8261b',
  kinari: '#efe5cc', paper: '#f6efdc', wood: '#a87a48', woodD: '#6e4a28', woodL: '#c99a62',
  sand: '#dcc79a', pine: '#2f5a46', pineD: '#1d3b30', white: '#fbf6ea', gold: '#f2c14e', skin: '#f0d3aa'
};
const SHU_VARIANTS = [[216, 69, 42], [226, 84, 40], [204, 50, 34], [222, 60, 28], [214, 76, 52]];
const TAIL_PALS = [
  ['#d8452a', '#f6efe0', '#1f3a68'], ['#1f3a68', '#f6efe0', '#d8452a', '#f6efe0'],
  ['#d8452a', '#f2c14e', '#f6efe0'], ['#c23a24', '#1f3a68', '#f6efe0', '#f2c14e'], ['#d8452a', '#f6efe0']
];

let W = 0, H = 0, DPR = 1;
const SA = { t: 0, b: 0, l: 0, r: 0 };
const L = {};

// ============================================================
//  音（Web Audio 合成）
// ============================================================
const AU = {
  c: null, m: null, nb: null, nb2: null, bf: null, bg: null, wf: null, wg: null, started: false,
  init() {
    try {
      if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.c = new AC();
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.m = c.createGain(); this.m.gain.value = 0.8; this.m.connect(comp);
      const len = (c.sampleRate * 2) | 0;
      const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
      const b2 = c.createBuffer(1, len, c.sampleRate), d2 = b2.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d2[i] = last * 3.5; }
      this.nb2 = b2;
      const loop = (buf, type, f, q) => {
        const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
        const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
        const g = c.createGain(); g.gain.value = 0;
        s.connect(fl); fl.connect(g); g.connect(this.m); s.start();
        return [fl, g];
      };
      [this.bf, this.bg] = loop(b, 'bandpass', 2400, 0.9);
      [this.wf, this.wg] = loop(b2, 'bandpass', 500, 0.7);
      if (c.state === 'suspended') c.resume();
      this.started = true;
    } catch (e) { this.c = null; }
  },
  ok() { return !!(this.c && this.c.state === 'running'); },
  v(x = 0.06) { return 1 + (Math.random() * 2 - 1) * x; },
  env(g, t0, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec);
  },
  noise(t0, dur, type, f, q, peak, a = 0.004, buf) {
    const c = this.c, s = c.createBufferSource(); s.buffer = buf || this.nb;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = c.createGain(); s.connect(fl); fl.connect(g); g.connect(this.m);
    this.env(g, t0, a, peak, dur);
    s.start(t0, Math.random() * 1.5); s.stop(t0 + a + dur + 0.05);
    return fl;
  },
  osc(t0, type, f0, f1, fdur, peak, a, dec) {
    const c = this.c, o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + fdur);
    const g = c.createGain(); o.connect(g); g.connect(this.m);
    this.env(g, t0, a, peak, dec);
    o.start(t0); o.stop(t0 + a + dec + 0.05);
    return o;
  },
  pon(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    this.osc(t, 'sine', 360 * this.v(0.1), 115, 0.13, 0.42 * s, 0.004, 0.24);
    this.noise(t, 0.07, 'lowpass', 800, 0.7, 0.3 * s, 0.003); },
  flap(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    for (let i = 0; i < 3; i++) this.noise(t + i * 0.055 * this.v(0.2), 0.04, 'bandpass', 700 + Math.random() * 600, 1.3, 0.24 * s * (1 - i * 0.25), 0.003); },
  kyu() { if (!this.ok()) return; const t = this.c.currentTime;
    this.osc(t, 'triangle', 620 * this.v(), 1450, 0.09, 0.2, 0.004, 0.11);
    this.osc(t + 0.08, 'sine', 900 * this.v(), 1900, 0.06, 0.14, 0.003, 0.09);
    this.noise(t, 0.09, 'bandpass', 3200, 3, 0.1, 0.004); },
  click(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    this.noise(t, 0.02, 'bandpass', 2100 * this.v(0.15), 6, 0.4 * s, 0.001);
    this.osc(t, 'sine', 1000 * this.v(0.1), 640, 0.025, 0.08 * s, 0.001, 0.035); },
  pin(s = 1) { if (!this.ok()) return; const t = this.c.currentTime, f = (280 + s * 140) * this.v(0.04);
    this.osc(t, 'triangle', f * 1.05, f, 0.06, 0.26 * s, 0.003, 0.8);
    this.osc(t, 'sine', f * 2.01, f * 2, 0.05, 0.09 * s, 0.002, 0.5);
    this.noise(t, 0.03, 'highpass', 3000, 0.7, 0.12 * s, 0.002); },
  whoosh(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    const fl = this.noise(t, 0.75, 'bandpass', 400, 1.3, 0.35 * s, 0.18, this.nb);
    fl.frequency.setValueAtTime(350, t); fl.frequency.exponentialRampToValueAtTime(1500 * this.v(0.2), t + 0.3); fl.frequency.exponentialRampToValueAtTime(450, t + 0.9); },
  don(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    this.osc(t, 'sine', 112 * this.v(0.05), 46, 0.3, 0.95 * s, 0.003, 1.0);
    this.osc(t, 'triangle', 190, 80, 0.1, 0.22 * s, 0.002, 0.25);
    this.noise(t, 0.14, 'lowpass', 320, 0.8, 0.55 * s, 0.002); },
  ten(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    this.osc(t, 'sine', 540 * this.v(0.05), 370, 0.05, 0.34 * s, 0.002, 0.15);
    this.noise(t, 0.06, 'bandpass', 2900, 1.2, 0.36 * s, 0.001);
    this.osc(t, 'triangle', 860, 720, 0.04, 0.07 * s, 0.001, 0.08); },
  kane() { if (!this.ok()) return; const t0 = this.c.currentTime;
    [0, 0.15, 0.3].forEach((dt, k) => { const f = 1180 * this.v(0.02), pk = k === 2 ? 0.2 : 0.13;
      [1, 2.76, 5.4, 8.93].forEach((r, i) => this.osc(t0 + dt, 'sine', f * r, 0, 0, pk / (i + 1), 0.002, k === 2 ? 0.7 : 0.28)); });
    this.osc(t0 + 0.3, 'triangle', 520, 1040, 0.4, 0.09, 0.05, 0.6); },
  cheer(s = 1) { if (!this.ok()) return; const t = this.c.currentTime;
    this.noise(t, 1.3, 'bandpass', 1050, 0.9, 0.13 * s, 0.3);
    this.noise(t + 0.15, 1.1, 'bandpass', 1750, 1.4, 0.08 * s, 0.35); },
  setBrush(level, wet) { if (!this.ok()) return; const t = this.c.currentTime;
    this.bg.gain.setTargetAtTime(level * 0.34, t, 0.03);
    this.bf.frequency.setTargetAtTime(1300 + (1 - wet) * 3000, t, 0.05); },
  setWind(level) { if (!this.ok()) return; const t = this.c.currentTime;
    this.wg.gain.setTargetAtTime(level * 0.55, t, 0.15);
    this.wf.frequency.setTargetAtTime(280 + level * 950, t, 0.2); }
};

// ============================================================
//  テクスチャ生成（事前生成してキャッシュ）
// ============================================================
let GRAIN_PAT = null;
function makeGrain() {
  const S = 256, c = mk(S, S), g = c.getContext('2d'), id = g.createImageData(S, S), d = id.data;
  for (let i = 0; i < S * S; i++) {
    const r = Math.random(); let v = 0, a = 0;
    if (r < 0.06) { v = 20; a = Math.random() * 26; } else if (r < 0.1) { v = 70; a = 12; } else if (r > 0.95) { v = 255; a = Math.random() * 30; }
    d[i * 4] = v * 0.9 + 10; d[i * 4 + 1] = v * 0.86 + 14; d[i * 4 + 2] = v * 0.8 + 28; d[i * 4 + 3] = a;
  }
  g.putImageData(id, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 60; i++) {
    g.strokeStyle = Math.random() < 0.5 ? `rgba(90,70,40,${R(0.04, 0.09)})` : `rgba(255,250,235,${R(0.05, 0.1)})`;
    g.lineWidth = R(0.5, 1.2); g.beginPath();
    const x = R(20, S - 20), y = R(20, S - 20), a = R(TAU), l = R(6, 18);
    g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + R(-3, 3), y + Math.sin(a) * l * 0.5 + R(-3, 3), x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.stroke();
  }
  return c;
}

function shapePath(g, shape, w, h) {
  g.beginPath();
  if (shape === 'hex') {
    g.moveTo(w * 0.5, 0); g.lineTo(w, h * 0.2); g.lineTo(w, h * 0.8); g.lineTo(w * 0.5, h); g.lineTo(0, h * 0.8); g.lineTo(0, h * 0.2); g.closePath();
  } else g.rect(0, 0, w, h);
}
const OUTLINE_UV = {
  rect: [[0, 0], [0.5, 0], [1, 0], [1, 0.5], [1, 1], [0.5, 1], [0, 1], [0, 0.5]],
  hex: [[0.5, 0], [0.75, 0.1], [1, 0.2], [1, 0.5], [1, 0.8], [0.75, 0.9], [0.5, 1], [0.25, 0.9], [0, 0.8], [0, 0.5], [0, 0.2], [0.25, 0.1]]
};

function makePaper(w, h, shape) {
  const c = mk(w, h), g = c.getContext('2d');
  g.fillStyle = '#f7f0dd'; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let y = 0; y < h; y++) {
    const row = (y % 7 === 0 ? -5 : 0) + Math.sin(y * 0.05) * 1.5;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, n = (Math.random() - 0.5) * 12 + row;
      d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.2;
    }
  }
  g.putImageData(id, 0, 0);
  for (let i = 0; i < 16; i++) {
    const x = R(w), y = R(h), r = R(w * 0.08, w * 0.3);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(205,185,140,0.10)'); gr.addColorStop(1, 'rgba(205,185,140,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.lineCap = 'round';
  for (let i = 0; i < w * 0.55; i++) {
    g.strokeStyle = `rgba(${Math.random() < 0.6 ? '150,128,90' : '255,252,240'},${R(0.08, 0.2)})`;
    g.lineWidth = R(0.4, 1.1); g.beginPath();
    const x = R(w), y = R(h), a = R(TAU), l = R(4, w * 0.05);
    g.moveTo(x, y); g.bezierCurveTo(x + R(-6, 6), y + R(-6, 6), x + Math.cos(a) * l + R(-4, 4), y + Math.sin(a) * l + R(-4, 4), x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.stroke();
  }
  // 竹骨（透けて見える）
  const bw = w * 0.018;
  const bone = (x0, y0, x1, y1, wd) => {
    g.strokeStyle = 'rgba(118,86,44,0.30)'; g.lineWidth = wd; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.strokeStyle = 'rgba(255,240,210,0.18)'; g.lineWidth = wd * 0.3; g.beginPath(); g.moveTo(x0 - wd * 0.2, y0 - wd * 0.2); g.lineTo(x1 - wd * 0.2, y1 - wd * 0.2); g.stroke();
    const L2 = Math.hypot(x1 - x0, y1 - y0), n = Math.floor(L2 / (w * 0.22));
    for (let k = 1; k <= n; k++) {
      const t = k / (n + 1) + R(-0.03, 0.03), x = lerp(x0, x1, t), y = lerp(y0, y1, t), a = Math.atan2(y1 - y0, x1 - x0) + Math.PI / 2;
      g.strokeStyle = 'rgba(100,70,34,0.35)'; g.lineWidth = wd * 0.4; g.beginPath();
      g.moveTo(x - Math.cos(a) * wd * 0.8, y - Math.sin(a) * wd * 0.8); g.lineTo(x + Math.cos(a) * wd * 0.8, y + Math.sin(a) * wd * 0.8); g.stroke();
    }
  };
  if (shape === 'hex') {
    bone(w * 0.5, h * 0.02, w * 0.5, h * 0.98, bw);
    bone(w * 0.04, h * 0.22, w * 0.96, h * 0.78, bw * 0.8);
    bone(w * 0.96, h * 0.22, w * 0.04, h * 0.78, bw * 0.8);
    bone(w * 0.03, h * 0.5, w * 0.97, h * 0.5, bw * 0.7);
  } else {
    bone(w * 0.5, h * 0.02, w * 0.5, h * 0.98, bw);
    bone(w * 0.02, h * 0.28, w * 0.98, h * 0.28, bw * 0.9);
    bone(w * 0.02, h * 0.66, w * 0.98, h * 0.66, bw * 0.9);
    bone(w * 0.04, h * 0.04, w * 0.96, h * 0.96, bw * 0.7);
    bone(w * 0.96, h * 0.04, w * 0.04, h * 0.96, bw * 0.7);
  }
  // 縁の折り返し
  g.save(); shapePath(g, shape, w, h); g.clip();
  g.strokeStyle = 'rgba(150,118,70,0.32)'; g.lineWidth = w * 0.04; shapePath(g, shape, w, h); g.stroke();
  g.strokeStyle = 'rgba(120,90,50,0.25)'; g.lineWidth = w * 0.012; shapePath(g, shape, w, h); g.stroke();
  g.restore();
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = '#000'; shapePath(g, shape, w, h); g.fill();
  g.globalCompositeOperation = 'source-over';
  return c;
}

function makeCloud(w, h) {
  const sc = Math.min(DPR, 1.5), c = mk(w * sc, h * sc), g = c.getContext('2d');
  g.scale(sc, sc);
  const bumps = [];
  const n = 4 + ((w / h) | 0);
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, r = h * (0.17 + 0.13 * Math.sin(t * Math.PI)) * R(0.88, 1.1);
    bumps.push([w * (0.1 + t * 0.8), h * 0.74 - r * 0.55 - Math.sin(t * Math.PI) * h * 0.14, r]);
  }
  const shape = (grow) => {
    g.beginPath();
    for (const b of bumps) { g.moveTo(b[0] + b[2] + grow, b[1]); g.arc(b[0], b[1], b[2] + grow, 0, TAU); }
    g.rect(w * 0.08 - grow, h * 0.5, w * 0.84 + grow * 2, h * 0.24 + grow);
    g.moveTo(w * 0.08, h * 0.74); g.arc(w * 0.08, h * 0.62, h * 0.12 + grow, 0, TAU);
    g.moveTo(w * 0.92, h * 0.74); g.arc(w * 0.92, h * 0.62, h * 0.12 + grow, 0, TAU);
  };
  g.fillStyle = C.ai; shape(2.2); g.fill();
  g.save(); g.translate(1.5, 1); g.fillStyle = 'rgba(31,58,104,0.35)'; shape(2.2); g.fill(); g.restore();
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#fffaf0'); gr.addColorStop(0.7, '#f3ead6'); gr.addColorStop(1, '#e2d6bb');
  g.fillStyle = gr; shape(0); g.fill();
  g.strokeStyle = 'rgba(77,111,160,0.45)'; g.lineWidth = 1.4; g.lineCap = 'round';
  for (const b of bumps) {
    if (Math.random() < 0.7) { g.beginPath(); g.arc(b[0] - b[2] * 0.15, b[1] + b[2] * 0.15, b[2] * 0.55, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  }
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(31,58,104,${R(0.03, 0.07)})`; g.fillRect(R(w), R(h), R(2, 10), 1); }
  c.cw = w; c.ch = h;
  return c;
}

function makePine(h, flip) {
  const sc = Math.min(DPR, 1.5), w = h * 1.0, c = mk(w * sc, h * sc), g = c.getContext('2d');
  g.scale(sc, sc);
  if (flip) { g.translate(w, 0); g.scale(-1, 1); }
  const pts = [];
  for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push([w * 0.5 + Math.sin(t * 2.6 + 0.4) * w * 0.14 - t * w * 0.06, h - t * h * 0.78]); }
  const tw = (t) => lerp(h * 0.055, h * 0.016, t);
  g.beginPath();
  pts.forEach((p, i) => { const t = i / 12; i ? g.lineTo(p[0] - tw(t), p[1]) : g.moveTo(p[0] - tw(t), p[1]); });
  for (let i = 12; i >= 0; i--) { const t = i / 12; g.lineTo(pts[i][0] + tw(t), pts[i][1]); }
  g.closePath(); g.fillStyle = '#6b4a35'; g.fill(); g.strokeStyle = C.aiD; g.lineWidth = 1.6; g.stroke();
  g.strokeStyle = 'rgba(30,20,10,0.45)'; g.lineWidth = 1;
  for (let i = 0; i < 26; i++) { const t = R(0.05, 0.9), k = Math.floor(t * 12), p = pts[k]; g.beginPath(); g.moveTo(p[0] - tw(t) * 0.7, p[1] + R(-4, 4)); g.lineTo(p[0] + tw(t) * R(-0.2, 0.6), p[1] + R(-4, 4)); g.stroke(); }
  const pads = [];
  const bran = [[0.42, -1, 0.34], [0.55, 1, 0.3], [0.68, -1, 0.26], [0.8, 1, 0.22], [0.95, -0.2, 0.2]];
  for (const [t, dir, len] of bran) {
    const k = Math.min(12, Math.round(t * 12)), p = pts[k];
    const ex = p[0] + dir * w * len, ey = p[1] - h * 0.05;
    g.strokeStyle = '#5a3c2a'; g.lineWidth = h * 0.014; g.lineCap = 'round';
    g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo((p[0] + ex) / 2, p[1] + h * 0.02, ex, ey); g.stroke();
    pads.push([ex, ey, w * (0.16 + len * 0.35), h * 0.07]);
    pads.push([(p[0] + ex) / 2, ey + h * 0.01, w * 0.12, h * 0.05]);
  }
  pads.push([pts[12][0], pts[12][1] - h * 0.02, w * 0.2, h * 0.07]);
  const pad = (x, y, rw, rh, col, grow) => {

function drawPerson(p) {

  ctx.rotate(lean);

  ctx.strokeStyle = C.white; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-3, shY); ctx.lineTo(0, shY + 7); ctx.lineTo(3, shY); ctx.stroke();

  ctx.fillStyle = '#1b1b24'; ctx.beginPath(); ctx.arc(hx - look * 0.4, hy - 1.5, 5.4, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();

}
function drawHint() {

  let x, y, press = u > 0.12 && u < 0.85;

  else if (tg === 'knot') { const a = G.ptail.p[0], b = k.loopPt(); x = lerp(a.x, b.x, e); y = lerp(a.y, b.y, e); }
  else if (tg === 'reel') { const kp = knobPos(); x = kp.x; y = kp.y + e * H * 0.1; }
  else { x = k.x + Math.sin(e * TAU) * W * 0.22; y = k.y; }
  ctx.save(); ctx.globalAlpha = 0.75 * fadeIn * (u > 0.92 ? (1 - u) / 0.08 : 1);
  if (press) { ctx.strokeStyle = 'rgba(255,250,235,0.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, 12 + Math.sin(G.t * 10) * 2, 0, TAU); ctx.stroke(); }
  const s = clamp(Math.min(W, H) / 420, 0.8, 1.6) * (press ? 0.92 : 1);
  ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(-0.35);
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = C.aiD; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-5, 4); ctx.arc(0, 4, 5, Math.PI, 0); ctx.lineTo(5, 26);
  ctx.quadraticCurveTo(9, 20, 13, 24); ctx.quadraticCurveTo(17, 20, 21, 25); ctx.quadraticCurveTo(25, 22, 28, 28);
  ctx.lineTo(28, 46); ctx.quadraticCurveTo(26, 60, 12, 62); ctx.lineTo(2, 62); ctx.quadraticCurveTo(-8, 58, -14, 44);
  ctx.lineTo(-20, 32); ctx.quadraticCurveTo(-20, 26, -13, 30); ctx.lineTo(-5, 38); ctx.closePath();

}

let last = 0, running = true, rafId = 0;
function frame(ts) {
