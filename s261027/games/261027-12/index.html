  drag = { id: e.pointerId, kind: h.kind, sx: p[0], sy: p[1], lx: p[0], ly: p[1], lt: performance.now(), moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const U = L.U;
  switch (h.kind) {
    case 'knob': {

      S.tT = clamp(S.tT + 0.035, 0, 1); S.knobPress = 1; S.knobGlint = Math.max(S.knobGlint, 0.6);
      if (S.tT >= 1) S.knobWob = 1;
      snd.click(); S.budPuff = Math.min(1.2, S.budPuff + 0.3);
      addP({ type: 'glint', x: knobX(S.t) + L.knobR * 0.6, y: L.slCY - L.knobR * 0.7, vx: 20, vy: -30, life: 0.6, max: 0.6, s: 6 });
      break;
    }
    case 'track': {
      const ft = clamp((p[0] - L.trX0) / (L.trX1 - L.trX0), 0, 1);
      S.tT = clamp(S.tT + clamp(ft - S.tT, -0.1, 0.1), 0, 1); drag.off = 0; S.knobPress = 1; snd.click();

    }
    case 'bunch': {
      const bn = h.bn; drag.slot = bn.i; drag.grab = [p[0], p[1]]; drag.bn = bn;
      pokes[vine.to.slots[bn.i].b].held = true; pokes[vine.to.slots[bn.i].b].f = vine.to.slots[bn.i].f;
      slotState[bn.i].om += (Math.random() - 0.5) * 2; snd.jingle();
      break;
    }
    case 'unripe': {

    }

      break;
    }
    case 'lamp': {

      const lp = lampPositions().find(q => q[2] === h.i);

        for (let k = 0; k < 22; k++) { const a = Math.random() * TAU; addP({ type: 'rain', x: lp[0], y: lp[1], vx: Math.cos(a) * (40 + Math.random() * 90), vy: Math.sin(a) * (40 + Math.random() * 90), life: 1.6, max: 1.6, s: 3 + Math.random() * 3, h: Math.random() }); }
      } else if (lp) {
        for (let k = 0; k < 5; k++) addP({ type: 'glint', x: lp[0], y: lp[1], vx: (Math.random() - 0.5) * 80, vy: -30 - Math.random() * 40, life: 0.8, max: 0.8, s: 4 + Math.random() * 3 });
      }

      break;
    }
    case 'rabbit': {
      const r = h.r; r.earV += 8; r.wob = 1; r.joy = Math.max(r.joy, 0.3); snd.chirp(); r.glance = 1;

      for (const ls of lampSw) ls.v += (Math.random() - 0.5) * 3;
      break;
    }
    case 'plant': {
      S.budPuff = Math.min(1.4, S.budPuff + 0.6); S.wind = Math.min(1, S.wind + 0.6); snd.rustle();
      for (const st of slotState) st.om += (Math.random() - 0.5) * 1.5;
      drag.kind = 'none';
      break;
    }
    case 'castle': { S.castleWob = 1; S.flagBoost = Math.max(S.flagBoost, 0.6); snd.soft(); drag.kind = 'none'; break; }
    default: {

}
function onMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (e.cancelable) e.preventDefault();
  const p = getP(e); const U = L.U;
  const now = performance.now(); const dtm = Math.max(1, now - drag.lt);
  const vx = (p[0] - drag.lx) / dtm * 1000;
  drag.lx = p[0]; drag.ly = p[1]; drag.lt = now;
  if (!drag.moved && hyp(p[0] - drag.sx, p[1] - drag.sy) > 6) drag.moved = true;
  S.lastInput = S.time;
  switch (drag.kind) {
    case 'knob': case 'track': {
      if (!drag.moved) break;
      const nt = clamp((p[0] - drag.off - L.trX0) / (L.trX1 - L.trX0), 0, 1);
      if (Math.abs(nt - S.tT) > 0.002) snd.slide();
      if ((nt >= 1 && S.tT < 1) || (nt <= 0 && S.tT > 0)) { S.knobWob = 1; snd.tick(); }
      S.tT = nt; S.knobPress = 1;
      break;
    }
    case 'bunch': {
      const st = slotState[drag.slot]; const sl = vine.to.slots[drag.slot];
      if (!sl || !F.bunches[drag.slot]) { drag.kind = 'none'; pokes.forEach(q => q.held = false); break; }
      const P = [p[0] - drag.grab[0], p[1] - drag.grab[1]]; const m = hyp(P[0], P[1]);
      st.px = P[0] * 0.55; st.py = P[1] * 0.55; st.pvx = 0; st.pvy = 0;
      const pk = pokes[sl.b]; pk.x = P[0] * 0.3; pk.y = P[1] * 0.3; pk.vx = 0; pk.vy = 0;
      st.om += clamp(vx * 0.00002, -0.3, 0.3);
      if (m > 0.85 * U) {
        // ぷちん！
        const bn = F.bunches[drag.slot];
        st.harvested = true; S.harvestDirty = true;
        const o = makeLoose(bn, bn.ax + st.px, bn.ay + st.py);
        o.th = bn.th; loose.push(o);
        pk.held = false; pk.vx = -pk.x * 6; pk.vy = -pk.y * 6;
        st.px = 0; st.py = 0;
        S.wind = Math.min(1, S.wind + 0.5);
        snd.pop(); snd.rustle();
        for (let k = 0; k < 6; k++) addP({ type: 'glint', x: bn.ax, y: bn.ay, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 80, life: 0.6, max: 0.6, s: 4 + Math.random() * 4 });
        drag.kind = 'loose'; drag.o = o; o.tx = o.x; o.ty = o.y; drag.off = [o.x - p[0], o.y - p[1]];
      }
      break;
    }
    case 'loose': {
      const o = drag.o; o.tx = p[0] + drag.off[0]; o.ty = p[1] + drag.off[1];
      o.tx = clamp(o.tx, L.minX, L.maxX); o.ty = clamp(o.ty, L.sf.t, L.slCY);
      break;
    }
    case 'arch': {
      if (!drag.moved) break;
      const x = p[0] - drag.off[0], by = p[1] - drag.off[1];
      const d = clamp((by - L.backY) / (L.rowY - L.backY), 0, 1);
      const lim = archXLimits(d);
      arch.nxT = clamp((x - L.px) / U, lim[0], lim[1]); arch.dT = d;
      arch.vx = vx;
      if (!arch.slumped && vine.to.mode !== 'bush') {
        // 支えがなくなると、つるは自分の重みでしなる
        arch.slumped = true; arch.row = false;
        setVine(buildVine({ mode: 'bush' }), S.t > 0.3 ? 1.4 : 0.6);

}
function onUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (e.cancelable) e.preventDefault();
  const p = getP(e); const U = L.U;
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  const d = drag; drag = null;
  S.lastInput = S.time;
  switch (d.kind) {
    case 'knob': case 'track': snd.tick(); break;
    case 'bunch': {
      const st = slotState[d.slot]; const sl = vine.to.slots[d.slot];
      if (sl) { const pk = pokes[sl.b]; pk.held = false; }
      st.om += clamp(-st.px * 0.05, -4, 4); snd.jingle();
      break;
    }
    case 'loose': dropLoose(d.o); break;
    case 'arch': dropArch(d.moved); break;
  }
  pokes.forEach(q => q.held = false);
}
function dropLoose(o) {
  const U = L.U; const c = looseCenter(o);
  let best = -1, bd = 1e9;
  rabbits.forEach((r, i) => {
    if (r.mode !== 'ground' && r.mode !== 'dance') return;
    const pp = platePos(r); const d = hyp(pp[0] - c[0], pp[1] - c[1]);
    if (d < 1.05 * U && d < bd) { bd = d; best = i; }
  });
  if (best >= 0) { sendToPlate(o, best); o.vx *= 0.3; o.vy = -1.2 * U; return; }
  o.state = 'fall'; o.gy = clamp(c[1] + 0.3 * U, L.baseY + 0.15 * U, L.gB - 0.05 * U);

function dropArch(moved) {
  const U = L.U;
  arch.drag = false;

  if (arch.dT > 0.45) {

    const lim = archXLimits(1);
    let nx = clamp(arch.nxT, lim[0], lim[1]);

    const cands = [0, half - 0.12, -(half - 0.12)];

    arch.nxT = clamp(nx, lim[0], lim[1]);

  arch.liftV -= 2;
  snd.thump();
  for (const ls of lampSw) ls.v += (Math.random() - 0.5) * 4;
  setTimeout(() => snd.creak(), 160);

function cancelDrag() {

  const d = drag; drag = null;
  if (d.kind === 'loose') dropLoose(d.o);

cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
cv.addEventListener('pointerup', onUp, { passive: false });
cv.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.id) { try { cv.releasePointerCapture(e.pointerId); } catch (_) {} cancelDrag(); } });

['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'contextmenu', 'dblclick', 'selectstart'].forEach(ev =>
  document.addEventListener(ev, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false }));
window.addEventListener('blur', cancelDrag);

// ================================================================
//  ループ・リサイズ・表示切り替え
// ================================================================
let raf = 0, last = 0, running = false;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  try { update(dt); render(); } catch (err) { console.warn(err); }
  raf = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); cancelDrag(); if (AC && AC.state === 'running') AC.suspend().catch(() => {}); }
  else { start(); if (AC) AC.resume().catch(() => {}); }
});
let rsT = 0;
function relayout() {
  const oldU = L.U, oldBase = L.baseY, oldW = W;
  cancelDrag();
  layout();
  if (oldU) {
    for (const o of loose) { if (o.state === 'ground' || o.state === 'fall') { o.x = o.x / oldW * W; o.y = L.baseY + (o.y - oldBase) * L.U / oldU; o.gy = L.baseY + (o.gy - oldBase) * L.U / oldU; o.br0 *= L.U / oldU; } else o.br0 *= L.U / oldU; }
  }
  rabbits.forEach((r, i) => { r.hx = L.rab[i][0]; r.hy = L.rab[i][1]; r.x = r.hx; r.y = r.hy; });
  const lim = archXLimits(arch.dT); arch.nxT = clamp(arch.nxT, lim[0], lim[1]); arch.nx = arch.nxT; arch.d = arch.dT;
  vine.cur = null;

window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(relayout, 60); });
window.addEventListener('orientationchange', () => { clearTimeout(rsT); rsT = setTimeout(relayout, 200); });

// 初期化
layout();
makeLeafSprites(); makeBerrySprites();
initRabbits();
(function initArch() {
  arch.nx = arch.nxT = L.portrait ? -1.05 : -2.0; arch.d = arch.dT = 0; arch.row = false;
  const lim = archXLimits(0); arch.nx = arch.nxT = clamp(arch.nx, lim[0], lim[1]);
})();
reseedSlots();
setVine(buildVine({ mode: 'bush' }), 0);
start();

// 自動テスト用の読み取り口（画面には何も出さない）
window.__grape = { S, arch, party, rabbits: () => rabbits, loose: () => loose, F, L, vine, slotState, knobX, archGeo, curvePt, platePos, looseCenter };
})();
</script>
