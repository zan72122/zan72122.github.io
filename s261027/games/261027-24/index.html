<body>

<script>
(()=>{
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const sab=document.getElementById('sa');
let W=390,H=844,DPR=1,PORT=true;
const SA={t:0,r:0,b:0,l:0};

// ---------- helpers ----------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const eIn=t=>{t=clamp(t,0,1);return t*t*t;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function S(x,k,d){return{x:x,v:0,t:x,k:k||160,d:d||14};}
function stepS(s,dt){s.v+=((s.t-s.x)*s.k-s.v*s.d)*dt;s.x+=s.v*dt;}
const hsl=(h,s,l,a)=>a===undefined?`hsl(${h},${s}%,${l}%)`:`hsla(${h},${s}%,${l}%,${a})`;
function lg(x0,y0,x1,y1,st){const g=ctx.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<st.length;i+=2)g.addColorStop(st[i],st[i+1]);return g;}
function rg(x0,y0,r0,x1,y1,r1,st){const g=ctx.createRadialGradient(x0,y0,Math.max(0,r0),x1,y1,Math.max(0.01,r1));for(let i=0;i<st.length;i+=2)g.addColorStop(st[i],st[i+1]);return g;}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.01,Math.abs(rx)),Math.max(0.01,Math.abs(ry)),rot||0,0,TAU);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.01,r),0,TAU);}
function pathRR(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rr(x,y,w,h,r){ctx.beginPath();pathRR(x,y,w,h,r);}
const CHROME=[0,'#464b55',0.14,'#e6ebf2',0.3,'#8a93a1',0.46,'#ffffff',0.56,'#c4ccd6',0.72,'#5b626e',0.86,'#dbe1e8',1,'#383c45'];
const CHROMEV=[0,'#f4f7fb',0.25,'#aab3bf',0.5,'#6a717d',0.62,'#e9eef4',0.85,'#8e97a4',1,'#3e434c'];
const REDV=[0,'#ff8a8a',0.08,'#ff4a5c',0.35,'#e0162f',0.7,'#9c0a22',1,'#4e0313'];

// ---------- sprites ----------
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
let BERRY=null; const CLOUDS=[];
function buildSprites(){
  BERRY=mkCanvas(128,128);const b=BERRY.getContext('2d');
  const r=46;b.translate(64,66);
  const shape=()=>{b.beginPath();b.moveTo(0,r*1.05);
    b.bezierCurveTo(-r*0.62,r*0.85,-r*1.06,r*0.1,-r*0.93,-r*0.4);
    b.bezierCurveTo(-r*0.8,-r*0.86,-r*0.3,-r*0.86,0,-r*0.72);
    b.bezierCurveTo(r*0.3,-r*0.86,r*0.8,-r*0.86,r*0.93,-r*0.4);
    b.bezierCurveTo(r*1.06,r*0.1,r*0.62,r*0.85,0,r*1.05);b.closePath();};
  shape();let g=b.createRadialGradient(-r*0.35,-r*0.35,r*0.05,0,r*0.1,r*1.25);
  g.addColorStop(0,'#ff8a8f');g.addColorStop(0.35,'#ee1b36');g.addColorStop(0.75,'#a8061e');g.addColorStop(1,'#5e0212');
  b.fillStyle=g;b.fill();
  // rim light
  shape();g=b.createLinearGradient(r,r,-r*0.2,0);g.addColorStop(0,'rgba(255,170,120,0.55)');g.addColorStop(0.35,'rgba(255,120,120,0)');b.fillStyle=g;b.fill();
  const seeds=[[-0.55,-0.32],[0,-0.42],[0.55,-0.32],[-0.72,0.08],[-0.25,0],[0.25,0],[0.72,0.08],[-0.48,0.42],[0,0.4],[0.48,0.42],[-0.2,0.76],[0.2,0.76],[-0.28,-0.55],[0.28,-0.55]];
  for(const s of seeds){const x=s[0]*r,y=s[1]*r;
    b.fillStyle='rgba(110,0,20,0.55)';b.beginPath();b.ellipse(x,y+1.5,3.4,4.4,0,0,TAU);b.fill();
    b.fillStyle='#ffe28a';b.beginPath();b.ellipse(x,y,2.1,3.2,0,0,TAU);b.fill();
    b.fillStyle='rgba(255,255,255,0.8)';b.beginPath();b.arc(x-0.6,y-1,0.8,0,TAU);b.fill();}
  // wet highlight
  b.fillStyle='rgba(255,255,255,0.75)';b.beginPath();b.ellipse(-r*0.45,-r*0.32,r*0.16,r*0.3,0.5,0,TAU);b.fill();
  b.fillStyle='rgba(255,255,255,0.9)';b.beginPath();b.arc(-r*0.22,-r*0.55,r*0.07,0,TAU);b.fill();
  b.fillStyle='rgba(255,255,255,0.35)';b.beginPath();b.ellipse(r*0.4,r*0.35,r*0.08,r*0.18,-0.4,0,TAU);b.fill();
  // leaves
  for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*0.5;b.save();b.translate(0,-r*0.72);b.rotate(a+Math.PI/2);
    b.beginPath();b.moveTo(0,0);b.quadraticCurveTo(r*0.18,-r*0.22,0,-r*0.52);b.quadraticCurveTo(-r*0.18,-r*0.22,0,0);
    const lgr=b.createLinearGradient(0,0,0,-r*0.5);lgr.addColorStop(0,'#2f8a2a');lgr.addColorStop(1,'#8be06a');b.fillStyle=lgr;b.fill();b.restore();}
  b.fillStyle='#3d9a33';b.fillRect(-2.5,-r*1.05,5,r*0.35);
  for(let v=0;v<3;v++){const c=mkCanvas(256,140);const x=c.getContext('2d');
    const blobs=[];for(let i=0;i<7;i++)blobs.push([rnd(50,206),rnd(60,90),rnd(26,50)]);
    for(const q of blobs){const gg=x.createRadialGradient(q[0]-q[2]*0.3,q[1]-q[2]*0.4,2,q[0],q[1],q[2]);
      gg.addColorStop(0,'rgba(255,255,255,1)');gg.addColorStop(0.55,'rgba(255,240,245,0.95)');gg.addColorStop(0.85,'rgba(255,190,190,0.55)');gg.addColorStop(1,'rgba(255,180,190,0)');
      x.fillStyle=gg;x.beginPath();x.arc(q[0],q[1],q[2],0,TAU);x.fill();}
    CLOUDS.push(c);}
}
function berry(x,y,r,rot,sx,sy){const k=r/46;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(k*(sx||1),k*(sy||1));ctx.drawImage(BERRY,-64,-66);ctx.restore();}

// ---------- audio ----------
let AC=null,MG=null,NB=null,vc=0;
function audioInit(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ua=navigator.userActivation;if(ua&&!ua.isActive&&!ua.hasBeenActive)return;AC=new A();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=5;comp.connect(AC.destination);
      MG=AC.createGain();MG.gain.value=0.75;MG.connect(comp);
      const len=(AC.sampleRate*1.2)|0;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
const aok=()=>AC&&MG&&vc<34;
function env(g,t0,a,pk,dec){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);}
function tone(f,dur,o){if(!aok())return;o=o||{};try{
  const t0=AC.currentTime+(o.at||0);const os=AC.createOscillator();os.type=o.type||'sine';
  os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+(o.gt||dur));
  const g=AC.createGain();env(g,t0,o.a||0.004,o.v||0.2,dur);os.connect(g);let last=g;
  if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);last=fl;}
  last.connect(MG);let lfo=null;
  if(o.vib){lfo=AC.createOscillator();const lgn=AC.createGain();lfo.frequency.value=o.vib;lgn.gain.value=f*(o.vd||0.03);lfo.connect(lgn);lgn.connect(os.frequency);lfo.start(t0);lfo.stop(t0+dur+0.1);}
  os.start(t0);os.stop(t0+(o.a||0.004)+dur+0.05);vc++;
  os.onended=()=>{vc--;try{os.disconnect();g.disconnect();if(last!==g)last.disconnect();if(lfo)lfo.disconnect();}catch(e){}};
}catch(e){}}
function noise(dur,o){if(!aok())return;o=o||{};try{
  const t0=AC.currentTime+(o.at||0);const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t0);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+dur);f.Q.value=o.q||1;
  const g=AC.createGain();env(g,t0,o.a||0.003,o.v||0.2,dur);s.connect(f);f.connect(g);g.connect(MG);
  s.start(t0,Math.random()*0.6);s.stop(t0+(o.a||0.003)+dur+0.05);vc++;
  s.onended=()=>{vc--;try{s.disconnect();f.disconnect();g.disconnect();}catch(e){}};
}catch(e){}}
const SND={
  clank(lv){const b=70*Math.pow(1.2,lv);
    noise(0.07,{f:1600+lv*500,q:0.9,v:0.4});noise(0.3,{ft:'lowpass',f:380+lv*90,v:0.35});
    tone(b,0.45,{v:0.42,to:b*0.55});
    [2,4.83,7.9,11.2].forEach((m,i)=>tone(b*m,0.5+lv*0.12-i*0.07,{type:i?'sine':'triangle',v:0.13/(i+1),a:0.002}));
    if(lv>=1)tone(760*Math.pow(1.12,lv),0.9+lv*0.2,{v:0.035*lv,at:0.03});
    if(lv>=3){SND.bell(1046,0.08,0.1);SND.bell(1568,0.06,0.22);}},
  hiss(up){noise(0.42,{ft:'bandpass',f:up?500:2200,to:up?2600:500,q:0.8,v:0.1,a:0.05});},
  tick(p){noise(0.02,{f:2600+p*600,q:5,v:0.14});tone(1100+p*300,0.025,{type:'square',v:0.025});},
  gatan(){noise(0.12,{ft:'lowpass',f:700,v:0.4});tone(110,0.28,{v:0.34,to:62});tone(390,0.18,{type:'triangle',v:0.08,at:0.06});noise(0.05,{f:2000,q:2,v:0.15,at:0.07});},
  clunk(){tone(160,0.1,{v:0.2,to:110,type:'triangle'});noise(0.05,{ft:'lowpass',f:900,v:0.2});},
  thud(){tone(85,0.4,{v:0.55,to:42});noise(0.16,{ft:'lowpass',f:500,v:0.4});tone(280,0.14,{type:'triangle',v:0.12,to:170});},
  boing(p){p=p||1;tone(260*p,0.28,{v:0.17,to:560*p,gt:0.09,vib:16,vd:0.05});},
  pop(p){p=p||1;tone(420*p,0.12,{v:0.18,to:880*p,gt:0.05});noise(0.03,{f:3000*p,q:3,v:0.06});},
  plop(p){p=p||1;tone(700*p,0.16,{v:0.16,to:260*p,gt:0.12,vib:24});},
  squish(){noise(0.32,{ft:'lowpass',f:260,to:1300,v:0.28,a:0.05});tone(170,0.26,{v:0.12,to:250,vib:9});},
  slurp(){noise(0.5,{ft:'lowpass',f:500,to:200,v:0.2,a:0.08});tone(340,0.45,{v:0.08,to:200,vib:6});},
  bell(f,v,at){v=v||0.12;tone(f,1.5,{v,at});tone(f*2.01,1.0,{v:v*0.45,at});tone(f*3.03,0.55,{v:v*0.2,at});},
  chime(i){const sc=[523,587,659,784,880,1047,1175,1319,1568,1760];SND.bell(sc[i%sc.length]*(i>=sc.length?2:1),0.07);},
  chord(){[523,659,784,1047,1319,1568].forEach((f,i)=>SND.bell(f,0.08,i*0.07));[262,330,392].forEach(f=>tone(f,1.8,{type:'triangle',v:0.07,a:0.05}));},
  fanfare(){const n=[523,659,784,1047,784,1047,1319];n.forEach((f,i)=>{tone(f,0.22,{type:'square',v:0.05,lp:2400,at:i*0.11});SND.bell(f,0.05,i*0.11);});[392,523,659].forEach(f=>tone(f,2.2,{type:'triangle',v:0.08,a:0.08,at:0.66}));},
  horn(){[0,0.24].forEach(at=>{tone(311,0.18,{type:'sawtooth',v:0.11,lp:1300,at});tone(392,0.18,{type:'square',v:0.06,lp:1100,at});});},
  spark(){tone(rnd(1900,2700),0.16,{v:0.045});},
  tap(){tone(rnd(560,760),0.06,{type:'triangle',v:0.07});},
  twang(){tone(196,0.7,{type:'sawtooth',v:0.07,lp:900,vib:7});tone(392,0.5,{v:0.06});},
  whoosh(){noise(1.2,{ft:'bandpass',f:300,to:2400,q:0.6,v:0.14,a:0.4});},
  munch(){noise(0.05,{f:1500,q:2,v:0.12});noise(0.05,{f:1300,q:2,v:0.1,at:0.12});},
  voice(k,big){const at=0;
    if(k==='cat'){tone(620,0.12,{type:'triangle',v:0.13,to:880,gt:0.08});tone(880,0.2,{type:'triangle',v:0.12,to:560,at:0.1,vib:big?9:0});}
    else if(k==='rabbit'){tone(900,0.08,{type:'triangle',v:0.12,to:1400});tone(1200,0.1,{type:'triangle',v:0.1,to:1700,at:0.09});}
    else if(k==='chick'){tone(1900,0.07,{v:0.12,to:2500});tone(2000,0.08,{v:0.1,to:2700,at:0.1});if(big)tone(2100,0.08,{v:0.1,to:2800,at:0.2});}
    else {tone(380,0.14,{type:'triangle',v:0.14,to:560});tone(560,0.22,{type:'triangle',v:0.12,to:480,at:0.12,vib:big?7:0});}}
};

// ---------- layout ----------
const LY={};
function layout(){
  const t=SA.t,b=SA.b,l=SA.l,r=SA.r;
  if(PORT){
    LY.win={x:l+8,y:t+8,w:W-l-r-16,h:H*0.5-t-8};
    LY.dashY=LY.win.y+LY.win.h;
    const R=Math.min(W*0.125,H*0.058);
    LY.lev={x:W*0.5,y0:H*0.715-b*0.35,travel:H*0.098,R};
    LY.wheel={x:W*0.0,y:H*1.0,r:W*0.36};
    LY.gauges=[{x:W*0.17,y:LY.dashY+H*0.08,r:W*0.085},{x:W*0.83,y:LY.dashY+H*0.08,r:W*0.085}];
    LY.mirror={x:LY.win.x+W*0.03,y:LY.win.y+LY.win.h*0.62,w:W*0.17,h:H*0.07};
    // plaza
    LY.hz=H*0.42;
    LY.castle={x:W*0.42,y:LY.hz,s:H*0.27/540};
    LY.truck={x:-W*0.03,y:H*0.655,s:W*0.55/400};
    LY.cake={x:W*0.71,y:H*0.715,w0:W*0.37,h0:H*0.07};
    LY.bkP={x:W*0.33,y:H*0.785,s:W*0.0028};
    LY.homes=[{x:W*0.17,y:H*0.915-b*0.6},{x:W*0.5,y:H*0.935-b*0.6},{x:W*0.83,y:H*0.915-b*0.6}];
    LY.climax=[{x:W*0.47,y:H*0.9-b*0.5},{x:W*0.69,y:H*0.935-b*0.5},{x:W*0.9,y:H*0.9-b*0.5}];

    LY.mirror={x:LY.win.x+W*0.02,y:LY.win.y+LY.win.h*0.55,w:W*0.11,h:H*0.11};
    LY.hz=H*0.47;
    LY.castle={x:W*0.76,y:LY.hz,s:H*0.36/540};
    LY.truck={x:W*0.005,y:H*0.73,s:W*0.37/400};
    LY.cake={x:W*0.585,y:H*0.775,w0:W*0.215,h0:H*0.09};
    LY.bkP={x:W*0.435,y:H*0.85,s:H*0.0034};
    LY.homes=[{x:W*0.76,y:H*0.9-b},{x:W*0.865,y:H*0.925-b},{x:W*0.955-r*0.5,y:H*0.9-b}];
    LY.climax=[{x:W*0.465,y:H*0.95-b*0.5},{x:W*0.72,y:H*0.93-b*0.5},{x:W*0.86,y:H*0.92-b*0.5}];
    LY.cs=H*0.13/100;
    LY.lev2={x:W*0.065,y0:H*0.855-b*0.4,travel:H*0.055,R:H*0.048};
    LY.U=H/100;
  }
}
function readSA(){const cs=getComputedStyle(sab);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}
function resize(){
  W=Math.max(240,window.innerWidth||390);H=Math.max(240,window.innerHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const wasP=PORT;PORT=H>=W*1.05;readSA();layout();
  if(started)onRelayout(wasP!==PORT);
}

// ---------- round / state ----------
let T=0,PH='extend',phT=0,started=false;
let R={};
function newRound(){
  const h=rnd(-14,14);
  R={hue:h,
    sky:[hsl(224+h,72,40),hsl(220+h,62,60),hsl(6+h*0.4,88,76),hsl(38+h*0.3,96,82)],
    roof:pick([['#ff8fc0','#b8406f','#ffd6e8'],['#f9a0c8','#c24d87','#ffe0f0'],['#ff9eb0','#c04060','#ffe0e6'],['#f4a6e0','#a24a9a','#ffe4f6'],['#ffab9a','#c45a50','#ffe2da']]),
    ribbon:pick(['#ff4f8b','#46b8ff','#ffc43a','#a97cff','#3fd49a']),
    pat:(Math.random()*3)|0,patCol:pick(['#ff6f9c','#ff4a5a','#6aa8ff','#ffa63a','#b07aff']),
    order:shuffle([0,1,2]),

    balloons:pick([['#ff3b5c','#ff9ec7','#ffd23f','#ffffff','#6ec8ff'],['#ff5a7a','#ffc0d8','#ffe066','#b08cff','#ffffff'],['#ff2d4f','#ffffff','#ffcc33','#ff88b8','#7fe0b0']]),

// ---------- particles ----------
const PT=[];const PMAX=230;
function addP(p){if(PT.length>=PMAX)PT.splice(0,PT.length-PMAX+1);p.age=0;PT.push(p);}
function sparkle(sp,x,y,n,sz,col){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(30,150)*(sz||1);addP({sp,k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,g:60,life:rnd(0.5,1),s:rnd(3,7)*(sz||1),rot:rnd(0,3),vr:rnd(-4,4),col:col||'#fff6c0'});}}
function leaves(sp,x,y,n,sz){for(let i=0;i<n;i++){const a=rnd(-2.6,-0.5);const v=rnd(60,160)*(sz||1);addP({sp,k:'leaf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:120*(sz||1),life:rnd(1,1.6),s:rnd(4,7)*(sz||1),rot:rnd(0,6),vr:rnd(-6,6),col:pick(['#5cc84a','#8be06a','#3d9a33'])});}}
function hearts(sp,x,y,n,sz){for(let i=0;i<n;i++)addP({sp,k:'heart',x:x+rnd(-10,10)*sz,y,vx:rnd(-30,30)*sz,vy:rnd(-110,-60)*sz,g:-10,life:rnd(0.9,1.4),s:rnd(5,8)*sz,rot:rnd(-0.4,0.4),vr:0,col:pick(['#ff5a8a','#ff8fb6','#ff3b6b'])});}
function confetti(x,y,n,spd){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(40,260)*(spd||1);addP({sp:'p',k:pick(['conf','conf','petal']),x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,g:110,drag:1.6,life:rnd(3,5.5),s:rnd(4,8)*LY.U*0.22,rot:rnd(0,6),vr:rnd(-8,8),col:pick(R.flags.concat(['#ffe9a8','#ffd700']))});}}
function updParts(dt){
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.age+=dt;if(p.age>p.life){PT.splice(i,1);continue;}
    if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy=p.vy*f;p.vx+=Math.sin(T*2+p.rot)*12*dt;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
}
function drawParts(sp){
  for(const p of PT){if(p.sp!==sp)continue;const a=clamp(Math.min(p.age*8,(p.life-p.age)*2.5),0,1);if(a<=0)continue;
    ctx.globalAlpha=a;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.k==='spark'){const s=p.s;ctx.fillStyle=p.col;ctx.beginPath();for(let j=0;j<4;j++){const an=j*Math.PI/2;ctx.lineTo(Math.cos(an)*s,Math.sin(an)*s);ctx.lineTo(Math.cos(an+Math.PI/4)*s*0.28,Math.sin(an+Math.PI/4)*s*0.28);}ctx.closePath();ctx.fill();}
    else if(p.k==='leaf'){ctx.fillStyle=p.col;ell(0,0,p.s,p.s*0.45);ctx.fill();}
    else if(p.k==='heart'){const s=p.s;ctx.fillStyle=p.col;ctx.beginPath();ctx.moveTo(0,s*0.9);ctx.bezierCurveTo(-s*1.4,-s*0.2,-s*0.6,-s*1.2,0,-s*0.4);ctx.bezierCurveTo(s*0.6,-s*1.2,s*1.4,-s*0.2,0,s*0.9);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.6)';ell(-s*0.4,-s*0.35,s*0.2,s*0.14,-0.5);ctx.fill();}
    else if(p.k==='conf'){ctx.scale(1,Math.cos(p.age*7+p.rot));ctx.fillStyle=p.col;ctx.fillRect(-p.s*0.5,-p.s*0.3,p.s,p.s*0.6);}
    else if(p.k==='petal'){ctx.scale(Math.cos(p.age*5+p.rot),1);ctx.fillStyle=p.col==='#ffffff'?'#ffd6e6':p.col;ell(0,0,p.s*0.6,p.s*0.35);ctx.fill();}
    else if(p.k==='cream'){ctx.fillStyle='#fffaf5';circ(0,0,p.s);ctx.fill();}
    ctx.restore();}
  ctx.globalAlpha=1;
}

// ---------- characters ----------
function mkChar(kind){
  return{kind,x:0,y:0,s:1,face:1,hop:0,hv:0,arc:0,ph:rnd(0,10),blink:0,blinkA:0,bt:rnd(1,3),lx:0,ly:0,look:null,lookSpd:rnd(4,7),
    happy:0,hT:0,sur:0,sT:0,open:0,oT:0,cheek:0,cT:0,aL:0,aR:0,aLT:0,aRT:0,lean:0,leanT:0,tilt:0,
    ear:S(0,90,5),tail:S(0,60,3.5),sq:S(1,280,11),q:[],task:null,busy:false,hold:null,munch:0,lick:0,sit:0,flap:0,walk:0,
    idle:rnd(1,3),eager:0,eagerT:0,worry:0,blob:0,blobT:0,squeeze:0,pour:0,ribbon:'#ff4f8b',hx:0,hy:0,wave:0,cheer:0,cheerT:0,hopCount:0};
}
function joy(c,big){c.hT=big?1.4:0.9;c.cT=big?1.6:1;c.oT=0.5;c.hv=big?380:260;c.hop=Math.max(c.hop,0.01);c.ear.v+=big?14:9;c.tail.v+=big?12:8;c.sq.v-=3;}
function surprise(c,d){c.sT=d||0.6;c.oT=0.35;c.ear.v+=6;}
function updChar(c,dt){
  c.bt-=dt;if(c.bt<0){c.blinkA=0.15;c.bt=rnd(2,5);if(Math.random()<0.18)c.bt=0.25;}
  if(c.blinkA>0){c.blinkA-=dt;c.blink=Math.sin(clamp(1-c.blinkA/0.15,0,1)*Math.PI);}else c.blink=0;
  const kk=Math.min(1,dt*9);
  c.hT-=dt;c.sT-=dt;c.oT-=dt;c.cT-=dt;c.cheerT-=dt;c.eagerT-=dt;
  c.happy+=((c.hT>0?1:0)-c.happy)*kk;c.sur+=((c.sT>0?1:0)-c.sur)*kk;
  c.open+=((c.oT>0||c.munch>0?1:0)*(c.munch>0?0.5+0.5*Math.sin(T*24):1)-c.open)*Math.min(1,dt*14);
  c.cheek+=((c.cT>0?1:0)-c.cheek)*Math.min(1,dt*5);
  c.eager+=((c.eagerT>0?1:0)-c.eager)*Math.min(1,dt*6);
  c.munch=Math.max(0,c.munch-dt);
  c.aL+=(c.aLT-c.aL)*Math.min(1,dt*10);c.aR+=(c.aRT-c.aR)*Math.min(1,dt*10);
  c.lean+=(c.leanT-c.lean)*Math.min(1,dt*5);
  c.blob+=(c.blobT-c.blob)*Math.min(1,dt*4);
  if(c.hop>0||c.hv>0){c.hv-=1500*dt;c.hop+=c.hv*dt;if(c.hop<=0){if(c.hv<-150){c.sq.v-=c.hv*0.012;c.ear.v-=6;c.tail.v-=4;}c.hop=0;c.hv=0;}}
  stepS(c.ear,dt);stepS(c.tail,dt);stepS(c.sq,dt);
  let tx=0,ty=0;
  if(c.look){const hx=c.x,hy=c.y-60*c.s;const dx=c.look.x-hx,dy=c.look.y-hy;const d=Math.hypot(dx,dy)||1;const m=Math.min(1,d/(35*c.s));tx=dx/d*m;ty=dy/d*m;}
  const sp=Math.min(1,dt*c.lookSpd);c.lx+=(tx*c.face-c.lx)*sp;c.ly+=(ty-c.ly)*sp;
  if(!c.task&&c.q.length){c.task=c.q.shift();c.task.t=0;if(c.task.s)c.task.s(c);}
  if(c.task){const k=c.task;k.t+=dt;const u=Math.min(1,k.t/(k.d||0.0001));if(k.u)k.u(c,u,dt);if(u>=1){if(k.e)k.e(c);if(c.task===k)c.task=null;}}
}
function flushChar(c){
  let guard=0;
  if(c.task){const k=c.task;c.task=null;if(k.u)k.u(c,1,0);if(k.e)k.e(c);}
  while(c.q.length&&guard++<50){const k=c.q.shift();if(k.s)k.s(c);if(k.u)k.u(c,1,0);if(k.e)k.e(c);}
  c.arc=0;c.walk=0;c.pour=0;c.squeeze=0;c.flap=0;c.sit=0;
}
function tMove(fn,d,arc,walk){return{d,s(c){const p=fn(c);c.mx0=c.x;c.my0=c.y;c.mx1=p.x;c.my1=p.y;if(Math.abs(p.x-c.x)>2)c.face=p.x>=c.x?1:-1;if(arc)SND.boing(c.kind==='chick'?1.6:1.1);},
  u(c,u){const e=walk?u:ease(u);c.x=lerp(c.mx0,c.mx1,e);c.y=lerp(c.my0,c.my1,e);c.arc=arc?Math.sin(u*Math.PI)*arc:0;c.walk=walk&&u<1?1:0;},
  e(c){c.x=c.mx1;c.y=c.my1;c.arc=0;c.walk=0;if(arc){c.sq.v-=4;c.ear.v-=5;}}};}
function tWait(d,u){return{d,u};}
function tDo(fn){return{d:0,s:fn};}

// shared face pieces (local coords)
function eyes(c,ex,ey,er){
  const lx=c.lx*er*0.45,ly=c.ly*er*0.35;
  for(const sd of [-1,1]){const x=sd*ex+lx,y=ey+ly;
    if(c.happy>0.5){ctx.strokeStyle='#2a1020';ctx.lineWidth=er*0.6;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y+er*0.45,er*0.85,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}

      ell(x,y,er*sx,er*1.18*sy);ctx.fillStyle=rg(x-er*0.3,y-er*0.5,0,x,y,er*1.4,[0,'#6a4060',0.5,'#24101c',1,'#0a0308']);ctx.fill();
      if(sy>0.35){ctx.fillStyle='#fff';ell(x-er*0.32,y-er*0.42*sy,er*0.4*sx,er*0.44*sy);ctx.fill();ell(x+er*0.32,y+er*0.42*sy,er*0.17,er*0.17*sy);ctx.fill();
        if(c.eager>0.3||c.sur>0.3){ctx.fillStyle='rgba(255,255,255,0.9)';ell(x+er*0.05,y-er*0.05,er*0.12,er*0.12);ctx.fill();}}}}

function cheeks(c,cx,cy,r){const a=0.22+c.cheek*0.5;ctx.fillStyle=`rgba(255,110,150,${a})`;ell(-cx,cy,r,r*0.62);ctx.fill();ell(cx,cy,r,r*0.62);ctx.fill();}
function mouth(c,y,w,col){
  if(c.open>0.12){const o=c.open;ell(0,y+w*0.3*o,w*0.55*(0.8+o*0.3),w*0.55*o);ctx.fillStyle='#8a1530';ctx.fill();ell(0,y+w*0.55*o,w*0.35,w*0.22*o);ctx.fillStyle='#ff7a96';ctx.fill();}
  else{ctx.strokeStyle=col||'#4a1a24';ctx.lineWidth=w*0.22;ctx.lineCap='round';ctx.beginPath();const sm=c.worry>0.5&&c.happy<0.3?-1:1;

function arm(x,y,a,sd,len,w,fill){const th=-sd*a;ctx.save();ctx.translate(x,y);ctx.rotate(th);rr(-w/2,-w/2,w,len+w*0.5,w/2);ctx.fillStyle=fill;ctx.fill();ctx.restore();return{x:x-Math.sin(th)*len,y:y+Math.cos(th)*len};}
function paw(p,r,fill){circ(p.x,p.y,r);ctx.fillStyle=fill;ctx.fill();}

function drawHeld(c,h1,h2,kind){
  const mx=(h1.x+h2.x)/2,my=(h1.y+h2.y)/2;
  if(kind==='berry'){berry(mx,my-6,c.kind==='chick'?11:9,0.1*Math.sin(T*6));}

    ctx.fillStyle='#ffd0e0';rr(-14*sq,-26,28*sq,7,3);ctx.fill();
    ctx.fillStyle=lg(-4,0,4,0,CHROME);ctx.beginPath();ctx.moveTo(-4,15);ctx.lineTo(4,15);ctx.lineTo(1.5,24);ctx.lineTo(-1.5,24);ctx.closePath();ctx.fill();
    if(c.blob>0.03){const b=c.blob;ctx.fillStyle=rg(-2,26,0,0,28+b*6,b*10,[0,'#ffffff',0.7,'#fbf3f6',1,'#e2d4e0']);ell(0,26+b*6,b*8,b*9);ctx.fill();}

    ctx.fillStyle='#d01836';ell(0,-12,9,2.5);ctx.fill();ctx.fillStyle='#ffd0e0';ctx.beginPath();ctx.moveTo(9,-12);ctx.lineTo(15,-15);ctx.lineTo(9,-8);ctx.fill();ctx.restore();}

function drawChar(c){
  const lift=c.hop+c.arc;
  ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);
  if(!c.noShadow){const sh=clamp(1-lift/120,0.4,1);ctx.fillStyle='rgba(70,10,40,0.22)';ell(0,0,30*sh,6*sh);ctx.fill();}
  ctx.translate(0,-lift);ctx.scale(c.face,1);
  const sq=clamp(c.sq.x,0.6,1.4);ctx.scale(1+(1-sq)*0.7,sq);
  ctx.rotate(c.lean+(c.sit?-0.35*c.sit:0));
  if(c.kind==='bear')drawBear(c);else if(c.kind==='cat')drawCat(c);else if(c.kind==='rabbit')drawRabbit(c);else drawChick(c);

function drawBear(c){
  const br=Math.sin(T*2.3+c.ph)*1.3;
  const fur=rg(-10,-62,4,0,-40,62,[0,'#e2ac78',0.45,'#b0723f',1,'#5a301b']);

  ctx.fillStyle=rg(-9,-10,3,0,0,28,[0,'#e8b47e',0.55,'#b0723f',1,'#6a3a1f']);circ(0,0,25);ctx.fill();
  ctx.fillStyle=rg(-3,4,1,0,8,13,[0,'#fff3dc',1,'#e2b98c']);ell(0,8,12.5,9.5);ctx.fill();
  ctx.fillStyle=rg(-1,3,0,0,4,5,[0,'#7a5050',1,'#2a1010']);ell(0,4,4.6,3.3);ctx.fill();

  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-11,-10,-12,2);ctx.quadraticCurveTo(-8,6,0,0);ctx.quadraticCurveTo(11,-10,12,2);ctx.quadraticCurveTo(8,6,0,0);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';ell(-7,-3,2.5,1.5,-0.5);ctx.fill();ctx.fillStyle=c.ribbon;circ(0,0,3);ctx.fill();ctx.restore();

  ctx.restore();
}
function drawCat(c){
  const br=Math.sin(T*2.1+c.ph)*1.2;

  ctx.strokeStyle='rgba(150,150,200,0.35)';ctx.lineWidth=3;ctx.stroke();

    ctx.beginPath();ctx.moveTo(-5,2);ctx.quadraticCurveTo(-1,-13,2,-14);ctx.quadraticCurveTo(5,-8,5,2);ctx.closePath();ctx.fillStyle='#ffb6c8';ctx.fill();ctx.restore();}
  ctx.fillStyle=rg(-9,-9,3,0,0,28,[0,'#ffffff',0.6,'#f3f3fa',1,'#b9bedc']);ell(0,0,26,22);ctx.fill();

  ctx.fillStyle='#ff8aa8';ctx.beginPath();ctx.moveTo(-2.5,4);ctx.lineTo(2.5,4);ctx.lineTo(0,7);ctx.closePath();ctx.fill();

  ctx.strokeStyle='rgba(120,110,150,0.6)';ctx.lineWidth=0.9;
  for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*9,6);ctx.lineTo(sd*25,3);ctx.moveTo(sd*9,8);ctx.lineTo(sd*25,9);ctx.stroke();}
  ctx.restore();
}
function drawRabbit(c){
  const br=Math.sin(T*2.6+c.ph)*1.2;

const endP=(e,cancel)=>{if(e.pointerId!==PRIMARY)return;PRIMARY=null;HOVER.on=false;try{onUp(e.clientX,e.clientY,cancel);}catch(err){DRAG=null;}try{cv.releasePointerCapture(e.pointerId);}catch(_){}};
cv.addEventListener('pointerup',e=>endP(e,false));
window.addEventListener('pointerup',()=>audioInit(),{passive:true});window.addEventListener('touchend',()=>audioInit(),{passive:true});
cv.addEventListener('pointercancel',e=>endP(e,true));
cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===PRIMARY)endP(e,false);});
['contextmenu','gesturestart','gesturechange','dblclick','selectstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',()=>{resize();});
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
function onRelayout(orient){
  cancelDrag();
  if(isPlazaPH()||PH==='toPlaza'){
    for(const c of FR){flushChar(c);c.busy=false;c.s=LY.cs*(c.kind==='chick'?0.85:1);const h=homeOf(c);c.x=h.x;c.y=h.y;c.hold=c.kind==='rabbit'?'bag':null;}
    while(TOSS.length)landBerry(TOSS.shift());
    if(PB.sel){PB.sel=null;BK.n=Math.min(13,BK.n+1);}
    for(let i=PT.length-1;i>=0;i--)if(PT[i].sp==='p')PT.splice(i,1);
    if(FL.length){const old=FL;FL=buildFlags();FL.forEach((l,i)=>{const o=old[i];if(o){l.prog=o.prog;l.fp=o.fp||0;l.on=o.on;l.tight=o.tight;l.sag=o.sag;const n=l.flags.length;l.flags.forEach((f,j)=>{if(l.fp>(j+0.5)/n)f.o=1;});}});}
  }
  CK.cam.init=false;
}

// ---------- main loop ----------
let last=0,raf=0,running=true;
function frame(ts){
  raf=0;if(!running)return;
  const now=ts/1000;let dt=last?now-last:0.016;last=now;dt=Math.min(dt,0.05);
  try{update(dt);draw();}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
  raf=requestAnimationFrame(frame);
}
function update(dt){
  const sub=dt>0.025?2:1;const h=dt/sub;
  for(let i=0;i<sub;i++){T+=h;phT+=h;
    updLever(h);
    if(!isPlazaPH()||PH==='toCockpit')updCockpit(h);
    if(isPlazaPH()||PH==='toPlaza')updPlaza(h);
    updParts(h);
  }
  updTransition(dt);
  idleT+=dt;HINT.cool-=dt;
  if(!HINT.on&&idleT>4.5&&HINT.cool<=0&&!DRAG&&hintPath()){HINT.on=true;HINT.t=0;}
  if(HINT.on){HINT.t+=dt;if(HINT.t>2.0){HINT.on=false;HINT.cool=8;}}
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#2a0410';ctx.fillRect(0,0,W,H);
  if(PH==='toPlaza'||PH==='toCockpit'){drawTransition();}
  else if(isPlazaPH()){const pc={x:W*0.55,y:H*0.52};const F={x:pc.x,y:pc.y};PZ.F=F;PZ.P=pc;PZ.Zc=PZ.z;drawPlaza(PZ.z,pc,F);}
  else{PZ.F={x:0,y:0};PZ.P={x:0,y:0};PZ.Zc=1;drawCockpitWorld();drawFrame();}
  drawHint();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;if(raf)cancelAnimationFrame(raf);raf=0;try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{running=true;last=0;if(!raf)raf=requestAnimationFrame(frame);try{if(AC&&started)AC.resume();}catch(e){}}});

// ---------- boot ----------
buildSprites();newRound();resize();resetCockpit();resetPlaza();started=true;
window.__game={get phase(){return PH;},get stage(){return CK.stage;},get cakeP(){return CAKE.P;},get basket(){return CK.bk.st;},get ladder(){return LAD2.stage;},
  lever(){return LV;},friends(){return FR.map(c=>({k:c.kind,x:c.x,y:c.y,s:c.s,busy:c.busy}));},bkScreen(){const b=ckToScreen(CK.bk.x,CK.bk.y-20);return b;},tipScreen(){const t=ckTip();return ckToScreen(t.x,t.y);},
  plazaToScreen(x,y){return toScreenP(x,y);},basketP(){return toScreenP(LY.bkP.x,LY.bkP.y-28*LY.bkP.s);},lev2(){const g=LY.lev2;return toScreenP(g.x,g.y0);},cab(){const c=cabScreen();return toScreenP(c.x,c.y);},horn(){const c=hornScreen();return toScreenP(c.x,c.y);},cake(){return toScreenP(LY.cake.x,LY.cake.y-LY.cake.h0*0.5);}};
raf=requestAnimationFrame(frame);
})();
</script>
</body>
