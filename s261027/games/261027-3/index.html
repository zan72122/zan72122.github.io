})();

function smooth(c, p, closed) {

}

function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, TAU); }

const SND = {

  const lp = L.loop;
  const qx = (x - lp.cx) / lp.rx, qy = (y - lp.cy) / lp.ry, r = hyp(qx, qy) || .001;

// ---------- launching papers from box ----------
function launchPaper(x, y, vx, vy, fast, slowLong) {
  const b = S.box;
  if (b.count <= 0) return null;
  const p = newPaper(x, y);
  p.vx = vx; p.vy = vy; p.vr = rand(-4, 4) * (fast ? 2.5 : 1);
  p.stretch = slowLong ? 1 : 0;
  p.groundY = pickGround(Math.max(y, L.box.y - .02 * H));
  b.count--; S.pulled++;
  b.tipH = 0; b.tipV = 0;
  const emptyK = 1 - b.count / NPAPER;
  b.shake = Math.min(2.2, b.shake + (fast ? 1 : .45) * (1 + emptyK * 1.6));
  const since = S.t - b.lastPull; b.lastPull = S.t;
  b.rapid = since < .7 ? b.rapid + 1 : 0;
  if (b.rapid >= 2) { b.shake = Math.min(2.6, b.shake + .8); SND.koto(3 + Math.min(3, b.rapid - 1), .9); }

  c.fillStyle = f.on ? '#f08a5a' : '#f26b4f'; ell(c, 0, by, 9.5, 5); c.fill();
  c.strokeStyle = '#7a2a1a'; c.lineWidth = 1.6; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, -3, by - 1.5, 3.5, 1.4); c.fill();
  // stem
  blob(c, rectPts(-4, -50, 8, 42), '#a8d8cf', '#3f746c', 2, r, .5);
  // head
  c.translate(-4, -60); c.rotate(f.osc - .25);
  c.scale(.8, 1);
  blob(c, ellPts(0, 0, 32, 32, 14, r, .03), 'rgba(220,240,236,.75)', null, 0, r, 0);
  // blades
  const bl = 1 - Math.min(.65, f.power * .8);
  if (f.power > .3) { c.fillStyle = `rgba(150,205,230,${f.power * .45})`; c.beginPath(); c.arc(0, 0, 26, 0, TAU); c.fill(); }
  c.globalAlpha = bl;
  for (let i = 0; i < 3; i++) {
    const a = f.ang + i * TAU / 3;
    c.save(); c.rotate(a);
    c.fillStyle = '#7ec3e0'; c.beginPath(); c.ellipse(13, 0, 13, 7, .3, 0, TAU); c.fill();
    c.strokeStyle = '#3c7a96'; c.lineWidth = 1.5; c.stroke();
    c.restore();
  }
  c.globalAlpha = 1;
  // cage
  c.strokeStyle = 'rgba(60,110,105,.85)'; c.lineWidth = 1.4;
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; c.beginPath(); c.moveTo(Math.cos(a) * 6, Math.sin(a) * 6); c.lineTo(Math.cos(a) * 31, Math.sin(a) * 31); c.stroke(); }
  line(c, ellPts(0, 0, 31, 31, 16, r, .02), true, '#3f746c', 2.6, r);
  line(c, ellPts(0, 0, 18, 18, 12, r, .03), true, 'rgba(63,116,108,.6)', 1.4, r, 1);
  blob(c, ellPts(0, 0, 6, 6, 8, r), '#f2c14e', '#7a5a20', 1.6, r, 0);
  c.restore();
}
function drawBox(c, target, pulse) {
  const b = S.box, bw = L.box.w, d = L.box.d, h = L.box.h * b.thick;
  if (!boxSpr) makeBoxSprite();
  const sh = b.shake, sx = Math.sin(S.t * 55) * sh * 2.6 * U, sr = Math.sin(S.t * 47) * sh * .035;
  const bx = L.box.x + b.ox + sx, by = L.box.y + b.oy;
  const r = mulberry(13 + boilSeed % 2);
  c.save();
  c.fillStyle = 'rgba(90,55,25,.2)'; ell(c, L.box.x + b.ox, L.box.y + 2 * U, bw * (.55 + .2 * b.roll) * (1 + b.oy / (200 * U)), 9 * U); c.fill();
  // rotate around the box centre (rolling onto its side shifts the centre height)
  const ch = lerp(h / 2, bw / 2, b.roll);
  c.translate(bx, by - ch); c.rotate(b.rot + sr);
  // front face
  c.drawImage(boxSpr, -bw / 2 - boxSpr.pad, -h / 2 - boxSpr.pad * (h / L.box.h), boxSpr.w, boxSpr.h * (h / L.box.h));
  // top face
  const top = [[-bw / 2, -h / 2], [bw / 2, -h / 2], [bw / 2 - 7 * U, -h / 2 - d], [-bw / 2 + 7 * U, -h / 2 - d]];
  blob(c, [top[0], [0, -h / 2], top[1], top[2], [0, -h / 2 - d], top[3]], '#fff0c8', '#8a4f36', 2.4 * U, r, .7);
  const scy = -h / 2 - d * .5;
  if (b.dent > 0) {
    line(c, [[-bw * .3, scy - 6 * U], [-bw * .1, scy + 4 * U], [bw * .05, scy - 3 * U], [bw * .28, scy + 5 * U]], false, 'rgba(138,79,54,.7)', 1.8 * U, r, 1);
    line(c, [[-bw / 2, -h * .1], [-bw * .2, h * .05], [bw * .1, -h * .15]], false, 'rgba(138,79,54,.6)', 1.6 * U, r, 1);
  }
  // slot
  const st = b.slot ? 1 : 0;
  c.fillStyle = '#6b4b3a'; ell(c, 0, scy, (30 + st * 5) * U, (5.5 + st * 3.5 + b.dent * 2) * U); c.fill();
  c.strokeStyle = '#4a3020'; c.lineWidth = 1.6 * U; c.stroke();
  // tissue tip peeking out
  if (b.count > 0 && b.by == null) {
    if (target) glow(c, 0, scy - 22 * U, (48 + pulse * 14) * U, .5 + pulse * .35);
    const th = Math.max(0, b.tipH) * (34 + (target ? pulse * 6 : 0)) * U;
    if (th > 1) {
      const wv = Math.sin(S.t * 2.2) * 5 * U + Math.sin(S.t * 3.7) * 2 * U;
      const pts = [[-16 * U, scy + 2 * U], [-12 * U, scy - th * .45], [-4 * U + wv * .5, scy - th * .9], [wv, scy - th], [6 * U + wv * .6, scy - th * .82], [14 * U, scy - th * .35], [16 * U, scy + 2 * U]];
      c.beginPath(); smooth(c, pts, true); c.fillStyle = '#ffffff'; c.fill();
      c.fillStyle = 'rgba(180,192,220,.35)'; c.beginPath(); c.moveTo(wv, scy - th); c.lineTo(6 * U + wv * .6, scy - th * .82); c.lineTo(14 * U, scy - th * .35); c.lineTo(2 * U, scy); c.fill();
      line(c, pts, true, 'rgba(130,142,182,.85)', 1.6 * U, r);
      line(c, [[wv * .9, scy - th * .92], [1 * U, scy]], false, 'rgba(150,165,200,.55)', 1 * U, r, 1);
    }
  }
  c.restore();
}
function drawStrip(c, p, g) {
  if (S.box.count <= 0) return;
  const sl = boxSlot(), spd = clamp(hyp(p.vx, p.vy) / U / 900, 0, 1);
  const Ln = Math.min(g.len, 130 * U);
  const ex = sl.x + Math.cos(g.ang) * Ln, ey = sl.y + Math.sin(g.ang) * Ln;
  const sag = Ln * .32 * (1 - spd);
  const mx = (sl.x + ex) / 2, my = (sl.y + ey) / 2 + sag;
  const N = 12, L1 = [], R1 = [], r = mulberry(91 + boilSeed % 2);
  for (let i = 0; i <= N; i++) {
    const t = i / N, it = 1 - t;
    const x = it * it * sl.x + 2 * it * t * mx + t * t * ex, y = it * it * sl.y + 2 * it * t * my + t * t * ey;
    const dx = 2 * it * (mx - sl.x) + 2 * t * (ex - mx), dy = 2 * it * (my - sl.y) + 2 * t * (ey - my);
    const dl = hyp(dx, dy) || 1, nx = -dy / dl, ny = dx / dl;
    const w = lerp(6, 24, Math.pow(t, .7)) * U * (1 + Math.sin(t * 9 + S.t * 8) * .05);
    L1.push([x + nx * w, y + ny * w]); R1.push([x - nx * w, y - ny * w]);
  }
  const tipx = ex + Math.cos(g.ang) * 16 * U, tipy = ey + Math.sin(g.ang) * 16 * U;
  const pts = [...L1, [tipx, tipy], ...R1.reverse()];
  c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath();
  c.fillStyle = 'rgba(255,255,255,.96)'; c.fill();
  c.save(); c.clip(); c.fillStyle = 'rgba(175,188,218,.28)';
  c.beginPath(); c.moveTo(sl.x, sl.y); c.quadraticCurveTo(mx, my, tipx, tipy); c.lineTo(R1[0][0], R1[0][1]); c.closePath(); c.fill(); c.restore();
  line(c, pts, true, 'rgba(130,142,182,.85)', 1.5 * U, r);
  const wr = [];
  for (let i = 1; i < 4; i++) { const a = L1[i * 2], b = R1[R1.length - 1 - i * 2]; wr.push([a, b]); }
  for (const [a, b] of wr) line(c, [a, [(a[0] + b[0]) / 2 + 3 * U, (a[1] + b[1]) / 2], b], false, 'rgba(150,165,200,.5)', 1 * U, r, 1);
}
function drawPaperRest(c, p, target, pulse) {
  const spr = sprite(p), sw = spr.w;
  if (target) glow(c, p.x, p.y - 4 * U, (34 + pulse * 10) * U, .5 + pulse * .3);
  c.save(); c.translate(p.x, p.y);
  c.fillStyle = 'rgba(110,80,50,.14)'; ell(c, 0, 2 * U, sw * .36, 4.5 * U); c.fill();
  const sq = p.landT < .3 ? 1 - .3 * Math.sin(p.landT / .3 * Math.PI) : 1;
  const ruf = p.lift > 0 ? Math.sin(S.t * 30 + p.ph) * .14 * Math.min(1, p.lift * 2) : 0;
  const ball = p.cr > .8;
  const sy = lerp(.6, .95, p.cr) * sq + ruf;
  const tb = target ? Math.abs(Math.sin(S.t * 5)) * 4 * U : 0;
  c.translate(0, -sw * sy * .32 - tb);
  c.rotate(ball ? p.rot : p.rot * .25);
  c.scale(1 + (1 - sq) * .3, sy);
  c.drawImage(spr, -sw / 2, -sw / 2, sw, sw);
  c.restore();
}
function drawPaperFly(c, p) {
  const spr = sprite(p), sw = spr.w;
  c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
  const fx = p.cr > .8 ? 1 : .32 + .68 * Math.abs(Math.cos(p.flip));
  c.scale(fx, 1 + p.stretch * .7);
  c.drawImage(spr, -sw / 2, -sw / 2, sw, sw);
  c.restore();
}
function drawPlate(c, f, target, pulse) {
  const h = foodHome(f), pr = L.pic.plateR * U;
  const r = mulberry(400 + S.foods.indexOf(f));
  c.fillStyle = 'rgba(90,60,30,.15)'; ell(c, h[0] + 2 * U, h[1] + 4 * U, pr * 1.15, pr * .5); c.fill();
  c.fillStyle = '#ffffff'; ell(c, h[0], h[1], pr * 1.15, pr * .5); c.fill();
  c.strokeStyle = '#6a9ac9'; c.lineWidth = 2 * U; c.stroke();
  c.strokeStyle = 'rgba(106,154,201,.5)'; c.lineWidth = 1 * U; ell(c, h[0], h[1], pr * .8, pr * .32); c.stroke();
  if (f.st === 'plate' || f.st === 'back' || f.st === 'in') {
    if (target) glow(c, f.x, f.y - 6 * U, (38 + pulse * 12) * U, .5 + pulse * .35);
    const s = 19 * U * (1 + f.pop * .3) * (target ? 1 + pulse * .08 : 1);
    drawFood(c, f.kind, f.x, f.y - 8 * U - (target ? pulse * 3 * U : 0), s);
  }
}
function drawStreaks(c) {
  for (const s of S.streaks) {
    if (s.tr.length < 3) continue;
    const a = Math.sin(clamp(s.life / s.max, 0, 1) * Math.PI) * .55 * S.fan.power;
    c.globalAlpha = a; c.strokeStyle = '#ffffff'; c.lineWidth = 3.2 * U; c.lineCap = 'round';
    c.beginPath(); smooth(c, s.tr, false); c.stroke();
    c.strokeStyle = 'rgba(140,170,200,.7)'; c.lineWidth = 1.2 * U; c.beginPath(); smooth(c, s.tr, false); c.stroke();
  }
  c.globalAlpha = 1;
}
function drawParts(c) {
  for (const q of S.parts) {
    const k = q.life / q.max, a = 1 - k;
    c.globalAlpha = Math.max(0, a);
    c.fillStyle = q.col;
    if (q.k === 'spark') {
      c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.beginPath();
      for (let i = 0; i < 8; i++) { const rr = i % 2 ? q.sz * .4 : q.sz; const t = i / 8 * TAU; c.lineTo(Math.cos(t) * rr, Math.sin(t) * rr); }
      c.closePath(); c.fill(); c.restore();
    } else if (q.k === 'heart') {
      const s = q.sz * (1 + k * .3);
      c.save(); c.translate(q.x, q.y); c.beginPath(); c.moveTo(0, s * .8);
      c.bezierCurveTo(-s * 1.4, -s * .2, -s * .5, -s * 1.1, 0, -s * .35);
      c.bezierCurveTo(s * .5, -s * 1.1, s * 1.4, -s * .2, 0, s * .8); c.fill(); c.restore();
    } else if (q.k === 'zz') {
      c.strokeStyle = q.col; c.lineWidth = 1.5 * U; c.beginPath(); c.arc(q.x, q.y, q.sz * (1 + k), 0, TAU); c.stroke();
    } else { c.beginPath(); c.arc(q.x, q.y, q.sz, 0, TAU); c.fill(); }
  }
  c.globalAlpha = 1;
}
function drawHint(c, tg) {
  const T = 2.6, t = S.hintT % (T + 1.6);
  if (t > T) return;
  const k = t / T, a = Math.min(1, t * 4, (T - t) * 4) * .9;
  if (tg.k === 'tip') {
    const sl = boxSlot();
    const e = easeIO(clamp((k - .2) / .6, 0, 1));
    drawHand(c, sl.x + e * 50 * U, sl.y - 26 * U - e * 100 * U, k < .2 ? 1 - k * 5 : 0, a);
  } else if (tg.k === 'fan') {
    const pr = Math.abs(Math.sin(k * Math.PI * 2));
    drawHand(c, tg.x, tg.y - 4 * U + pr * 6 * U, pr > .8 ? pr : 0, a);
  } else if ((tg.k === 'food' || tg.k === 'paper') && tg.to) {
    const e = easeIO(clamp((k - .15) / .65, 0, 1));
    const x = lerp(tg.x, tg.to.x, e), y = lerp(tg.y, tg.to.y, e);
    if (tg.k === 'food' && e > 0) drawFood(c, tg.fd.kind, x, y - 22 * U, 16 * U);
    drawHand(c, x, y, k < .15 ? 1 - k / .15 : 0, a);
  }
}

// ================= main loop & events =================
let last = 0, raf = 0, running = true;
function frame(ts) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (ts - last) / 1000)); last = ts;
  if (dt <= 0) { draw(); return; }
  const steps = dt > 1 / 45 ? 2 : 1;
  for (let i = 0; i < steps; i++) update(dt / steps);
  draw();
}
function toLocal(e) { return { x: e.clientX, y: e.clientY }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  auInit();
  try { cv.setPointerCapture(e.pointerId); } catch (er) { }
  const q = toLocal(e);
  const p = { id: e.pointerId, x: q.x, y: q.y, x0: q.x, y0: q.y, vx: 0, vy: 0, lt: e.timeStamp || performance.now(), lmt: S.t, travel: 0, grab: null };
  ptrs.set(e.pointerId, p);
  S.idleT = 0; S.hintT = 0;
  onDown(p);
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  e.preventDefault();
  const q = toLocal(e), ts = e.timeStamp || performance.now();
  const dx = q.x - p.x, dy = q.y - p.y, dtm = Math.max(4, ts - p.lt) / 1000;
  p.vx = lerp(p.vx, dx / dtm, .55); p.vy = lerp(p.vy, dy / dtm, .55);
  p.x = q.x; p.y = q.y; p.lt = ts; p.lmt = S.t; p.travel += hyp(dx, dy);
  S.idleT = 0;
  onMove(p, dx, dy);
}, { passive: false });
function endPtr(e, cancel) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  try { onUp(p, cancel); } catch (er) { }
  if (S.box.by === p.id) S.box.by = null;
}
cv.addEventListener('pointerup', e => { e.preventDefault(); endPtr(e, false); }, { passive: false });
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('lostpointercapture', e => { if (ptrs.has(e.pointerId)) endPtr(e, false); });
['contextmenu', 'gesturestart', 'gesturechange', 'dblclick', 'selectstart'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let rzT = 0;
function onResize() { clearTimeout(rzT); rzT = setTimeout(() => { layout(); }, 60); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false; cancelAnimationFrame(raf);
    // release any held objects so nothing gets stuck
    for (const p of [...ptrs.values()]) { ptrs.delete(p.id); try { onUp(p, true); } catch (er) { } }
    S.box.by = null;
    if (A.c) try { A.c.suspend(); } catch (er) { }
  } else if (!running) {
    running = true; last = performance.now();
    if (A.c) try { A.c.resume(); } catch (er) { }
    raf = requestAnimationFrame(frame);
  }
});

resetState();
layout();
S.cat.nx = L.catHome.x / W; S.cat.ny = L.catHome.y / H;
S.box.tipH = 1;
last = performance.now();
raf = requestAnimationFrame(frame);
window.__S = S;
})();
