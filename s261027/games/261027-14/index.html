// ---------- 基本ユーティリティ ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t) * (1 - t); };
const easeIn = t => { t = clamp(t, 0, 1); return t * t * t; };
const easeOutBack = (t, s = 1.8) => { t = clamp(t, 0, 1) - 1; return t * t * ((s + 1) * t + s) + 1; };
const bounceOut = t => {
  t = clamp(t, 0, 1);
  const n = 7.5625, d = 2.75;
  if (t < 1 / d) return n * t * t;
  if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
  if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
  return n * (t -= 2.625 / d) * t + 0.984375;
};
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
// ばね（半陰的オイラー）
const spr = (x = 0) => ({ x, v: 0, t: x });
function sstep(s, target, k, c, dt) { s.v += (k * (target - s.x) - c * s.v) * dt; s.x += s.v * dt; return s.x; }

// 色ユーティリティ（キャッシュ付き）
const _shadeCache = new Map();
function shade(hex, amt) {
  const key = hex + amt;
  let r = _shadeCache.get(key);
  if (r) return r;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  let R = parseInt(h.substr(0, 2), 16), Gc = parseInt(h.substr(2, 2), 16), B = parseInt(h.substr(4, 2), 16);
  if (amt >= 0) { R += (255 - R) * amt; Gc += (255 - Gc) * amt; B += (255 - B) * amt; }
  else { R *= 1 + amt; Gc *= 1 + amt; B *= 1 + amt; }
  r = 'rgb(' + (R | 0) + ',' + (Gc | 0) + ',' + (B | 0) + ')';
  _shadeCache.set(key, r);
  return r;
}

// ---------- 音（Web Audio 合成） ----------
const SND = (() => {
  let ac = null, out = null, nbuf = null, ok = false;
  function init() {
    try {
      if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      out = ac.createGain(); out.gain.value = 0.6;
      out.connect(comp); comp.connect(ac.destination);
      nbuf = ac.createBuffer(1, ac.sampleRate | 0, ac.sampleRate);
      const d = nbuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(out); b.start(0);
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      ok = true;
    } catch (e) { ac = null; ok = false; }
  }
  const T = () => ac.currentTime;
  function env(g, t0, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(a + 0.01, dur));
  }
  function tone(type, f0, f1, dur, vol, o = {}) {
    if (!ok) return;
    try {
      const ny = ac.sampleRate * 0.45;
      if (f0 > ny) return;
      if (f1) f1 = Math.min(f1, ny);
      const t0 = T() + (o.t || 0);
      const osc = ac.createOscillator(); osc.type = type;
      osc.frequency.setValueAtTime(f0, t0);
      if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur * (o.glide || 1));
      if (o.vib) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vib; lg.gain.value = o.vibD || f0 * 0.02; l.connect(lg); lg.connect(osc.frequency);
        l.start(t0); l.stop(t0 + dur + 0.05);
      }
      const g = ac.createGain(); env(g, t0, o.a || 0.004, vol, dur);
      let n = osc;
      if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); n = f; }
      n.connect(g); g.connect(out);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function noise(dur, vol, o = {}) {
    if (!ok) return;
    try {
      const t0 = T() + (o.t || 0);
      const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass';
      f.frequency.setValueAtTime(o.f || 1000, t0);
      if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
      f.Q.value = o.Q || 1;
      const g = ac.createGain(); env(g, t0, o.a || 0.002, vol, dur);
      s.connect(f); f.connect(g); g.connect(out);
      s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function bell(f, vol, dur, t = 0) {
    tone('sine', f, f, dur, vol, { t, a: 0.002 });
    tone('sine', f * 2.76, f * 2.76, dur * 0.5, vol * 0.4, { t, a: 0.002 });
    tone('sine', f * 5.4, f * 5.4, dur * 0.28, vol * 0.2, { t, a: 0.002 });
    tone('sine', f * 8.93, f * 8.93, dur * 0.15, vol * 0.1, { t, a: 0.001 });
  }
  function curve(type, arr, dur, vol, o = {}) {
    if (!ok) return;
    try {
      const t0 = T() + (o.t || 0);
      const osc = ac.createOscillator(); osc.type = type;
      osc.frequency.setValueCurveAtTime(arr, t0, dur);
      const g = ac.createGain(); env(g, t0, 0.005, vol, dur);
      let n = osc;
      if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); n = f; }
      n.connect(g); g.connect(out); osc.start(t0); osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  const S = {
    init, get ok() { return ok; }, get ctx() { return ac; },
    // スタンプ：重い「ドスン」＋金属の震え
    thud(p = 1) {
      tone('sine', 120, 38, 0.32, 0.9 * p, { a: 0.002 });
      tone('triangle', 70, 40, 0.2, 0.4 * p);
      noise(0.09, 0.5 * p, { type: 'lowpass', f: 700 });
      bell(330, 0.08 * p, 0.35); bell(497, 0.05 * p, 0.3, 0.01);
    },
    boing(deep) {
      const n = 64, a = new Float32Array(n), base = deep ? 150 : 230, top = deep ? 470 : 720, w = deep ? 8 : 11;
      for (let i = 0; i < n; i++) { const u = i / (n - 1); a[i] = base + (top - base) * Math.min(1, u * 3.2) * (1 - u * 0.35) + Math.sin(u * TAU * w) * 70 * (1 - u); }
      curve('triangle', a, deep ? 0.75 : 0.48, 0.32);
      curve('sine', a.map(v => v * 2.01), deep ? 0.5 : 0.3, 0.08);
    },
    petan() { noise(0.06, 0.35, { f: 900, Q: 1.5 }); tone('sine', 260, 110, 0.09, 0.3); },
    slide(d = 0.6) { noise(d, 0.12, { f: 2600, f1: 700, Q: 0.8, a: 0.05 }); noise(d * 0.8, 0.06, { type: 'lowpass', f: 400, a: 0.05 }); },
    door() { noise(0.03, 0.35, { type: 'highpass', f: 2500 }); tone('sine', 190, 85, 0.12, 0.45); bell(920, 0.08, 0.2, 0.01); },
    tick(v = 0.5) { noise(0.025, 0.06 + 0.12 * v, { f: 1500 + 800 * v, Q: 3 }); tone('square', 900, 700, 0.02, 0.015 + 0.02 * v, { lp: 2000 }); },
    katan() {
      noise(0.04, 0.4, { f: 1600, Q: 2 }); tone('sine', 320, 150, 0.09, 0.4);
      bell(1318, 0.18, 0.9, 0.06); bell(1760, 0.1, 0.7, 0.12);
    },
    joy() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => { tone('triangle', f, f, 0.22, 0.2, { t: i * 0.075 }); tone('sine', f * 2, f * 2, 0.15, 0.06, { t: i * 0.075 }); });
      bell(2093, 0.08, 0.8, 0.4); bell(2637, 0.06, 0.7, 0.48);
    },
    wrong() { tone('sine', 330, 250, 0.22, 0.2, { vib: 9, vibD: 20 }); tone('sine', 250, 300, 0.2, 0.12, { t: 0.18 }); },
    rattle() { for (let i = 0; i < 4; i++) noise(0.03, 0.15, { f: 2200, Q: 4, t: i * 0.05 }); },
    oven() { tone('sawtooth', 120, 175, 0.35, 0.06, { lp: 600 }); noise(0.3, 0.08, { f: 500, Q: 2 }); },
    pop(p = 1) { tone('sine', 280 * p, 900 * p, 0.09, 0.32); noise(0.03, 0.1, { f: 2000 }); },
    chime() { for (let i = 0; i < 3; i++) bell(rnd(1800, 3200), 0.06, 0.6, i * 0.06); },
    drum(p = 1) { tone('sine', 170, 60, 0.32, 0.7 * p); noise(0.08, 0.25 * p, { type: 'lowpass', f: 900 }); tone('triangle', 230, 120, 0.12, 0.15 * p); },
    bigdrum() { tone('sine', 95, 38, 0.8, 0.95); tone('triangle', 60, 35, 0.5, 0.35); noise(0.14, 0.4, { type: 'lowpass', f: 500 }); },
    cymbal() { noise(0.9, 0.22, { type: 'highpass', f: 5200, a: 0.002 }); noise(0.25, 0.15, { f: 8000, Q: 0.8 }); bell(3100, 0.05, 0.5); },
    trumpet(v = 0) {
      const ns = [[523, 659], [587, 784], [659, 880]][v % 3];
      ns.forEach((f, i) => { tone('sawtooth', f, f, 0.13, 0.13, { t: i * 0.14, lp: 2200, q: 2, a: 0.012, vib: 6, vibD: 6 }); tone('square', f / 2, f / 2, 0.12, 0.03, { t: i * 0.14, lp: 900 }); });
    },
    horn() {
      tone('square', 466, 440, 0.12, 0.09, { lp: 1600 }); tone('square', 587, 554, 0.12, 0.07, { lp: 1600 });
      tone('square', 622, 587, 0.2, 0.09, { t: 0.15, lp: 1800 }); tone('square', 784, 740, 0.2, 0.06, { t: 0.15, lp: 1800 });
    },
    gara(d = 1.1) { const n = Math.floor(d * 16); for (let i = 0; i < n; i++) { noise(0.035, 0.13, { f: 1100 + (i % 3) * 300, Q: 3, t: i * d / n }); } tone('sawtooth', 90, 130, d, 0.03, { lp: 400 }); },
    gear(n = 4) { for (let i = 0; i < n; i++) { noise(0.02, 0.16, { f: 3000, Q: 5, t: i * 0.07 }); tone('square', 1500, 1200, 0.015, 0.02, { t: i * 0.07, lp: 3000 }); } },
    clock() { bell(880, 0.22, 1.6); bell(1320, 0.12, 1.4, 0.02); bell(660, 0.15, 1.8, 0.5); bell(990, 0.08, 1.4, 0.52); },
    whoosh() { noise(0.4, 0.12, { f: 500, f1: 2500, Q: 0.7, a: 0.1 }); },
    creak() { tone('sawtooth', 200, 140, 0.4, 0.05, { lp: 800, vib: 14, vibD: 15 }); },
    squeak(p = 1) { tone('sine', 900 * p, 1400 * p, 0.08, 0.12); tone('sine', 1300 * p, 1000 * p, 0.08, 0.1, { t: 0.08 }); },
    note(f, vol = 0.1, t = 0) {
      tone('sine', f, f, 0.55, vol, { t, a: 0.002 });
      tone('sine', f * 2, f * 2, 0.25, vol * 0.35, { t, a: 0.002 });
      tone('sine', f * 3.98, f * 3.98, 0.09, vol * 0.15, { t, a: 0.001 });
    },
    bass(f, vol = 0.1, t = 0) { tone('triangle', f, f, 0.3, vol, { t, a: 0.005 }); },
    beat(kind, t = 0, v = 1) {
      if (kind === 'drum') { tone('sine', 150, 60, 0.18, 0.22 * v, { t }); noise(0.04, 0.06 * v, { type: 'lowpass', f: 800, t }); }
      else { noise(0.05, 0.07 * v, { type: 'highpass', f: 6500, t }); }
    },
    paper() { noise(0.12, 0.12, { f: 3000, f1: 1500, Q: 0.7 }); },
    time() { return ok ? ac.currentTime : 0; },
    suspend() { try { if (ac && ac.state === 'running') ac.suspend(); } catch (e) {} },
    resume() { try { if (ac && ac.state === 'suspended') ac.resume(); } catch (e) {} },
  };
  return S;
})();

function layout() {
  W = Math.max(200, window.innerWidth | 0);
  H = Math.max(200, window.innerHeight | 0);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

  c.lineTo(84, -76); c.quadraticCurveTo(112, -74, 112, -50); c.lineTo(112, -30); c.quadraticCurveTo(112, -22, 100, -22); c.lineTo(-96, -22); c.quadraticCurveTo(-108, -22, -108, -30); c.closePath();
  c.fillStyle = lg(c, 0, -86, 0, -22, [0, '#ff7a62', 0.25, '#e64a3a', 0.6, C.red, 1, '#7c1912']); c.fill();
  c.lineWidth = 2.6; c.strokeStyle = C.goldD; c.stroke();

  }

function updateStamp(dt) {

    if (B.delivered && tx > 592 && tx < 670 && ty > 458 && ty < 560) {
      P.kind = 'none';
      if (B.basket.length < 3) {
        B.oven.t = 1; B.ovenT = 0.55; SND.oven();
        const it = { type: pick(BREADS), pop: spr(0), anim: { x0: 631, y0: 518, t: 0, d: 0.45 } };
        B.basket.push(it); G.playTouches++;
        setTimeout(() => SND.pop(1.2), 200);
        burst(631, 515, 6, 'dust', 'town', { col: '#fff1c0', up: 120, g: 200, s0: 2, s1: 4 });
      } else { B.oven.v += 4; SND.rattle(); }
      return;
    }
  }
  // 花車
  if (G.cat.delivered && G.cat.cartOut && dist(tx, ty, G.cat.cartX, 535) < 62) {
    const f = { col: pick(FLOWER_COLS), col2: pick(FLOWER_COLS), kind: (Math.random() * 3) | 0, pop: null };
    G.cat.spinV = 7; G.cat.cartKeyV = 8;
    startCarry('flower', f, G.cat.cartX, 520, null, P); SND.chime();
    return;
  }
  // 楽器を持つ人形
  const players = G.actors.filter(a => a.inst);
  const pl = hitActor(tx, ty, players, 14);
  if (pl) { P.kind = 'none'; playInst(pl); return; }
  // 郵便車
  if (Math.abs(tx - cx) < 122 && ty > ROADY - 150 && ty < ROADY + 16) { P.kind = 'car'; P.carX0 = car.s; return; }
  pokeTown(tx, ty, false);
  P.kind = 'none';
}
function pokeTown(tx, ty, small) {
  // 郵便受け
  for (const k in G.mbox) { const mb = G.mbox[k]; if (Math.abs(tx - mb.x) < 50 && ty > 450 && ty < 605) { mb.wob.v += 6; mb.lid.v += 5; SND.rattle(); return; } }
  if (!small) {
    const a = hitActor(tx, ty, G.actors, 8);
    if (a) { actorJump(a, 300); a.happy = Math.max(a.happy, 0.9); SND.squeak(a.scale < 1 ? 1.3 : 1); return; }
  }
  // 家は小さく揺れるだけ
  const hs = tx > 400 && tx < 700 && ty > 270 && ty < 595 ? G.bake : tx > 820 && tx < 1000 && ty > 320 && ty < 595 ? G.cat : tx > 1300 && tx < 1480 && ty > 280 && ty < 595 ? G.bear : null;
  if (hs) { hs.wig.v += 5; if (!hs.delivered) { hs.win.v += 2; } SND.tick(0.3); }
}
function handleMove(P, e) {
  const dxs = P.x - P.lx, dys = P.y - P.ly;
  P.moved = Math.max(P.moved, dist(P.x0, P.y0, P.x, P.y));
  if (P.kind === 'stamp') {
    G.stamp.drag = Math.max(0, (P.y - P.y0) / (40 * L.ds));
  } else if (P.kind === 'carry' && G.carry && G.carry.mode === 'drag') {
    const [tx, ty] = toTown(P.x, P.y);
    let x = tx, y = ty + G.carry.oy;
    if (G.carry.kind === 'env' && G.letter) {
      const mb = G.mbox[G.letter.animal], d = dist(x, y, mb.x, MB_MOUTH_Y);
      if (d < 75) { const k = (1 - d / 75) * 0.55; x = lerp(x, mb.x, k); y = lerp(y, MB_MOUTH_Y, k); }
    }
    G.carry.x = x; G.carry.y = y;
    G.carry.rot = clamp(dxs * 0.02, -0.4, 0.4);
  } else if (P.kind === 'car') {
    const car = G.car;
    if (!car.drag && P.moved > 7 && !carLocked()) { car.drag = true; car.vel = 0; if (G.phase === 'paradeReady') startParade(); }
    if (car.drag) {
      let ds = dxs / V.z;
      if (G.phase === 'drive' && G.letter && G.letter.stage === 'bag') {
        const d = wdel(HOUSE[G.letter.animal].stop - car.s);
        if (Math.abs(d) < 140 && Math.sign(ds) === Math.sign(d)) ds *= 0.5;
        if (Math.abs(d) < 140 && Math.sign(ds) !== Math.sign(d) && Math.abs(d) < 40) ds *= 0.6;
      }
      moveCar(ds);
      const now = performance.now(), dtm = Math.max(8, now - P.lt);
      car.vel = lerp(car.vel, ds / (dtm / 1000), 0.35);
      car.lastMove = now;
      if (G.phase === 'drive' && G.letter && G.letter.stage === 'bag') {
        const d = wdel(HOUSE[G.letter.animal].stop - car.s);
        if (Math.abs(d) < 10) { car.drag = false; car.s = HOUSE[G.letter.animal].stop; car.v = 0; car.vel = 0; P.kind = 'none'; arrive(); }
      }
    }
  }
  P.lx = P.x; P.ly = P.y; P.lt = performance.now();
}
function handleUp(P, cancel) {
  if (P.kind === 'stamp') {
    const S = G.stamp;
    if (cancel) { if (S.st === 'held') S.st = 'idle'; else if (S.st === 'pressed') stampRelease(); }
    else if (S.st === 'held') { S.st = 'slam'; S.v = Math.max(S.v, 3); }
    else if (S.st === 'pressed') stampRelease();
  } else if (P.kind === 'carry' && G.carry && G.carry.mode === 'drag') {
    const quick = P.moved < 12 && (G.t - P.t0) < 0.5;
    if (cancel) returnCarry();
    else if (quick) { G.carry.mode = 'lift'; G.carry.x = P.cx0; G.carry.y = P.cy0 - 34; SND.pop(1.6); }
    else dropCarry(G.carry.x, G.carry.y);
  } else if (P.kind === 'car') {
    const car = G.car;
    if (car.drag) {
      car.drag = false;
      car.v = performance.now() - car.lastMove < 100 ? clamp(car.vel, -950, 950) : 0;
      if (Math.abs(car.v) > 400) SND.whoosh();
    } else if (!cancel && P.moved < 12) carTap();
  }
}
function onDown(e) {
  e.preventDefault();
  SND.init();
  if (PT) return;                       // 二本目の指は無視
  PT = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now(), t0: G.t, kind: null, moved: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  G.idle = 0; G.demo = null; G.inputs++;
  try { handleDown(PT); } catch (err) { console.warn(err); }
}
function onMove(e) {
  if (!PT || e.pointerId !== PT.id) return;
  e.preventDefault();
  PT.x = e.clientX; PT.y = e.clientY;
  try { handleMove(PT, e); } catch (err) { console.warn(err); }
}
function onUp(e, cancel) {
  if (!PT || e.pointerId !== PT.id) return;
  const P = PT; PT = null;
  P.x = e.clientX; P.y = e.clientY;
  try { handleUp(P, cancel); } catch (err) { console.warn(err); }
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
}
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
cv.addEventListener('pointerup', e => onUp(e, false), { passive: false });
cv.addEventListener('pointercancel', e => onUp(e, true), { passive: false });
cv.addEventListener('lostpointercapture', e => onUp(e, true));
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart']) {
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
}

// =========================================================
//  ループ
// =========================================================
let running = true, lastT = 0;
function frame(ts) {
  if (!running) return;
  let dt = lastT ? (ts - lastT) / 1000 : 1 / 60;
  lastT = ts;
  dt = clamp(dt, 0, 0.05);
  const n = Math.max(1, Math.ceil(dt / (1 / 60) - 0.01));
  for (let i = 0; i < n; i++) update(dt / n);
  updateMusic();
  render();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; SND.suspend(); if (PT) { const P = PT; PT = null; try { handleUp(P, true); } catch (_) {} } }
  else if (!running) { running = true; lastT = 0; SND.resume(); requestAnimationFrame(frame); }
});
let resizeT = 0;
function onResize() { layout(); computeView(); }
window.addEventListener('resize', () => { onResize(); clearTimeout(resizeT); resizeT = setTimeout(onResize, 250); });
window.addEventListener('orientationchange', () => setTimeout(onResize, 300));

initState();
G.letter = newLetter(G.queue.shift());
G.letter.stage = 'desk'; G.letter.ft = 1;
G.nextRandom = 'rabbit';
layout();
G.cam.dcx = Math.min(HOUSE.rabbit.cx, W / viewZ(false) / 2 + 40);
computeView();
requestAnimationFrame(frame);
// 自動テスト用（表示はしない）
window.__petan = { G, get phase() { return G.phase; }, get stampP() { return G.stamp.p; }, view: () => V, toScreenTown: (x, y) => fromTown(x, y), toScreenDesk: (x, y) => fromDesk(x, y) };
</script>
