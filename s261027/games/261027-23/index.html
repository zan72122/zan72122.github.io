<script>
'use strict';
(()=>{
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

// ================= utils =================
const PI=Math.PI,TAU=PI*2;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,r,dt)=>a+(b-a)*(1-Math.exp(-r*dt));
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const hyp=Math.hypot;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function angD(a,b){let d=a-b;while(d>PI)d-=TAU;while(d<-PI)d+=TAU;return d}
const RGB={};
function rgb(h){if(RGB[h])return RGB[h];const n=parseInt(h.slice(1),16);return RGB[h]=[n>>16&255,n>>8&255,n&255]}
function rgba(h,a){const c=rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(3)+')'}
function mixc(h1,h2,t){const a=rgb(h1),b=rgb(h2);return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')'}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return [c,g]}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(.01,r),0,TAU)}
const INK='#2a2140';

const COL={
 rose:{b:'#e65a92',l:'#ffc2da',d:'#97235a',n:0},
 coral:{b:'#f47c66',l:'#ffd5c8',d:'#a6402d',n:1},
 gold:{b:'#e2b040',l:'#fff1b8',d:'#8f621a',n:2},
 mint:{b:'#3fc2a1',l:'#c4f6e6',d:'#1b765e',n:3},
 sky:{b:'#55a6e6',l:'#cde8ff',d:'#235d94',n:4},
 lavender:{b:'#a77fe0',l:'#e4d4ff',d:'#593894',n:5},
};
const CK=Object.keys(COL);
const PENT=[0,2,4,7,9];
function pf(i,base){base=base||523.25;const o=Math.floor(i/5),s=PENT[((i%5)+5)%5];return base*Math.pow(2,(o*12+s)/12)}

// ================= audio =================
const AU={c:null};
function audioInit(){
 if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{
  const c=new AC();AU.c=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(c.destination);
  AU.m=c.createGain();AU.m.gain.value=.85;AU.m.connect(comp);
  const len=Math.floor(c.sampleRate*2.2),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
  const cvv=c.createConvolver();cvv.buffer=ir;const rg=c.createGain();rg.gain.value=.36;cvv.connect(rg);rg.connect(AU.m);AU.rev=cvv;
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.nb=nb;
  // thread swish
  let s=c.createBufferSource();s.buffer=nb;s.loop=true;let f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=1.3;
  let g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.m);s.start();AU.swG=g;AU.swF=f;
  // sea ambience
  s=c.createBufferSource();s.buffer=nb;s.loop=true;f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.m);s.start();AU.seaG=g;
  AU.next=0;AU.step=0;
  if(c.state==='suspended')c.resume();
 }catch(e){AU.c=null}
}
function outp(g,wet){g.connect(AU.m);if(wet>0){const s=AU.c.createGain();s.gain.value=wet;g.connect(s);s.connect(AU.rev)}}
function tone(f,dur,o){
 if(!AU.c||f>15000)return;o=o||{};const c=AU.c,t=c.currentTime+(o.when||0);
 const os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
 if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t+(o.slideT||dur));
 if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*.03;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05)}
 const v=o.vol==null?.15:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 os.connect(g);outp(g,o.wet==null?.3:o.wet);os.start(t);os.stop(t+dur+.05);
}
function noise(dur,o){
 if(!AU.c)return;o=o||{};const c=AU.c,t=c.currentTime+(o.when||0);
 const s=c.createBufferSource();s.buffer=AU.nb;const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||3000,t);
 if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
 const g=c.createGain(),v=o.vol==null?.15:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.003));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);outp(g,o.wet==null?.12:o.wet);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
}
function bell(f,vol,when,dur){vol=vol||.12;when=when||0;dur=dur||1.1;tone(f,dur,{vol,when,wet:.5});tone(f*2.756,dur*.45,{vol:vol*.28,when,wet:.45});tone(f*5.404,dur*.22,{vol:vol*.1,when,wet:.4})}
const SFX={
 chik(sp){noise(.035,{f:5200+sp*1500,q:2.2,vol:.22});tone(2600+sp*600,.025,{type:'square',vol:.018,wet:0})},
 rin(i){bell(pf(i),.13)},
 dent(){tone(170,.12,{slide:.6,vol:.12,wet:.05})},
 kyu(p){p=p||1;tone(480*p,.17,{slide:2.7,type:'triangle',vol:.13,wet:.2});noise(.06,{f:3500,q:3,vol:.05})},
 pon(f){f=f||380;tone(f,.2,{slide:1.9,vol:.22,wet:.2});tone(f*2,.12,{slide:1.5,vol:.05,when:.01})},
 tick(){noise(.012,{f:6500,q:4,vol:.12,wet:.05});tone(1900,.02,{type:'square',vol:.012,wet:0})},
 whoosh(d,f){d=d||.6;noise(d,{f:f||500,f2:(f||500)*5,q:.8,vol:.16,att:d*.4,wet:.3})},
 chirp(p){p=p||1;tone(700*p,.11,{slide:1.6,vol:.11,vib:18});tone(1050*p,.16,{slide:1.25,vol:.1,when:.1,vib:20})},
 giggle(p){p=p||1;for(let i=0;i<3;i++)tone((900+i*120)*p,.08,{slide:1.3,vol:.08,when:i*.085,vib:25})},
 gasp(p){p=p||1;tone(500*p,.35,{slide:2.2,vol:.1,vib:9,att:.04})},
 gliss(base,n,sp){base=base||0;n=n||10;sp=sp||.055;for(let i=0;i<n;i++)bell(pf(base+i),.07,i*sp,1.3)},
 pad(ch,dur,vol){if(!AU.c)return;vol=vol||.05;for(const s of ch){const f=261.63*Math.pow(2,s/12);tone(f,dur,{type:'triangle',vol,att:.5,wet:.6});tone(f*1.003,dur,{vol:vol*.6,att:.6,wet:.6})}},
 splash(){noise(.5,{ft:'lowpass',f:2400,f2:500,vol:.14,att:.02,wet:.3})},
 shf(){noise(.18,{f:1800,f2:3600,q:.7,vol:.07})},
};
function swish(v){if(!AU.c)return;AU.swG.gain.setTargetAtTime(Math.min(.09,v*.09),AU.c.currentTime,.03);AU.swF.frequency.setTargetAtTime(1800+v*2500,AU.c.currentTime,.05)}
function seaAmb(v){if(!AU.c)return;AU.seaG.gain.setTargetAtTime(v,AU.c.currentTime,.8)}
const CHORDS=[[0,4,7],[9,12,16],[5,9,12],[7,11,14]];
let melI=5;
function musicTick(){
 if(!AU.c||!G.music)return;const c=AU.c;
 if(AU.next<c.currentTime)AU.next=c.currentTime+.05;
 while(AU.next<c.currentTime+.2){
  const st=AU.step,w=AU.next-c.currentTime,ch=CHORDS[Math.floor(st/16)%4];
  if(st%8===0){tone(65.41*2*Math.pow(2,ch[0]/12),.9,{type:'triangle',vol:.1,when:w,wet:.2})}
  if(st%4===2){tone(261.63*Math.pow(2,ch[1]/12),.5,{type:'triangle',vol:.03,when:w,wet:.5})}
  if(st%2===0||Math.random()<.25){melI=clamp(melI+pick([-2,-1,-1,1,1,2,0]),3,11);if(Math.random()<.85)bell(pf(melI),.045+(st%8===0?.02:0),w,.9)}
  AU.next+=.24;AU.step++;
 }
}

// ================= state =================
const G={t:0,scene:'tailor',mode:'indoor',phase:'sew',phT:0,fleet:[],client:null,visitor:null,order:[],sail:null,
 cam:{mode:'tailor',p:0,dir:0,dur:2.4,z0:1,kT:1,C:{x:0,y:0},F:{x:0,y:0},ov:'indoor'},shopZ:1,lastIn:0,
 parade:false,paradeT:0,seaT:0,music:false,thread:'rose',alt:['mint','gold'],lever:-1,leverHeld:false,
 ribbons:[],tools:0,bloom:0,gf:null,fly:null,arr:null,waves:[],knots:[],shells:[],dolphin:null,nextRare:20,
 lh:{rot:.6,sp:.55,man:0,mx:0,big:0},cycle:0,demo:null,hl:0,firstDone:false,sew:{pid:null,fx:0,fy:0,trav:0,combo:0,last:-9,prog:0},
 clouds:[],glyphs:[],farBoats:[],pathV:0};
window.__G=G;
const PS=[],PW=[],PMAX=200;
function part(list,o){if(list.length>=PMAX)list.shift();list.push(o)}
function sparks(list,x,y,n,o){o=o||{};for(let i=0;i<n;i++){const a=o.a!=null?o.a+rnd(-o.spread||-.6,o.spread||.6):rnd(0,TAU),s=(o.sp||140)*rnd(.3,1);
 part(list,{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),life:(o.life||.7)*rnd(.7,1.2),max:(o.life||.7),size:(o.size||3)*rnd(.6,1.3),col:o.col||'#ffd77a',kind:o.kind||'dot',grav:o.grav||0,rot:rnd(0,TAU)})}}
function ring(list,x,y,r,col,life){part(list,{x,y,vx:0,vy:0,life:life||1,max:life||1,size:r,col:col||'#ffffff',kind:'ring',grav:0,rot:0})}
function updParts(list,dt){for(let i=list.length-1;i>=0;i--){const p=list[i];p.life-=dt;if(p.life<=0){list.splice(i,1);continue}
 const f=Math.exp(-dt*2.4);p.vx*=f;p.vy*=f;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*2}}
function star4(g,x,y,r,rot){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();for(let i=0;i<8;i++){const a=i*PI/4,rr=i%2?r*.28:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.restore()}
function drawParts(g,list,sc){
 sc=sc||1;
 for(const p of list){if(p.kind!=='ring')continue;const a=p.life/p.max,r=p.size*(1+(1-a)*2.2);g.strokeStyle=rgba(p.col,a*.6);g.lineWidth=1.3/sc;g.beginPath();g.ellipse(p.x,p.y,r,r*.32,0,0,TAU);g.stroke()}
 g.save();g.globalCompositeOperation='lighter';
 for(const p of list){if(p.kind==='ring')continue;const a=clamp(p.life/p.max);
  if(p.kind==='star'){g.fillStyle=rgba(p.col,a);star4(g,p.x,p.y,p.size*(.5+a*.8),p.rot)}
  else if(p.kind==='pearl'){g.fillStyle=rgba('#ffffff',a*.9);circ(g,p.x,p.y,p.size*.6);g.fill();g.fillStyle=rgba(p.col,a*.35);circ(g,p.x,p.y,p.size*1.6);g.fill()}
  else{g.fillStyle=rgba(p.col,a);circ(g,p.x,p.y,p.size*(.4+a*.6));g.fill()}}
 g.restore();
}

// ================= layout =================
let L={},SEA={},PORT=true;
function layout(){
 PORT=H>=W*1.02;const m=Math.min(W,H);L.m=m;L.p=PORT;
 if(PORT){
  L.s=Math.min(W*.6,H*.29);L.sail={x:W*.5,y:H*.475};L.win={x:W*.735,y:H*.125,r:Math.min(W*.19,H*.1)};
  L.lens={x:W*.13,y:H*.085};L.handle={x:W*.76,y:H*.89};L.spool={x:W*.15,y:H*.88};
  L.alt=[{x:W*.34,y:H*.915},{x:W*.5,y:H*.93}];L.rail={x0:W*.06,x1:W*.58,y:H*.825};L.desk=H*.8;
 }else{
  L.s=Math.min(H*.32,W*.27);L.sail={x:W*.44,y:H*.5};L.win={x:W*.8,y:H*.29,r:H*.16};
  L.lens={x:W*.1,y:H*.13};L.handle={x:W*.85,y:H*.86};L.spool={x:W*.13,y:H*.87};
  L.alt=[{x:W*.21,y:H*.9},{x:W*.28,y:H*.92}];L.rail={x0:W*.63,x1:W*.9,y:H*.52};L.desk=H*.8;
 }
 L.hr=m*.085;L.rot=-.12;
 SEA.hz=H*(PORT?.33:.36);SEA.lhX=W*(PORT?.13:.1);SEA.lhB=SEA.hz+H*.055;SEA.lhH=H*(PORT?.24:.32);
 SEA.dock={x:W*(PORT?.5:.38),y:SEA.hz+H*(PORT?.1:.12)};SEA.base=m*(PORT?.25:.16);
}
function ds(y){return .55+.62*clamp((y-SEA.hz)/(H-SEA.hz))}

// ================= backgrounds =================
const BG={};
function hatch(g,x,y,w,h,ang,gap,col,lw){g.save();g.strokeStyle=col;g.lineWidth=lw||.7;const P=new Path2D();const c=Math.cos(ang),s=Math.sin(ang),R=hyp(w,h)/2+gap,cx=x+w/2,cy=y+h/2;
 for(let d=-R;d<=R;d+=gap){P.moveTo(cx-c*R-s*d,cy-s*R+c*d);P.lineTo(cx+c*R-s*d,cy+s*R+c*d)}g.stroke(P);g.restore()}
function grain(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?'rgba(255,240,220,'+a+')':'rgba(20,10,30,'+a+')';g.fillRect(Math.random()*w,Math.random()*h,1,1)}}
function buildShop(){
 const [c,g]=mk(W,H);const m=L.m;
 let gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#2a2234');gr.addColorStop(.5,'#6a5660');gr.addColorStop(1,'#2a2234');
 g.fillStyle=gr;g.fillRect(0,0,W,L.desk);
 gr=g.createRadialGradient(L.lens.x,L.lens.y,0,L.lens.x,L.lens.y,m*.9);gr.addColorStop(0,'rgba(255,196,110,.32)');gr.addColorStop(1,'rgba(255,196,110,0)');g.fillStyle=gr;g.fillRect(0,0,W,L.desk);
 // stone courses (curved interior)
 const bh=m*.07;
 for(let row=0,y=-bh*.3;y<L.desk;row++,y+=bh){
  gr=g.createLinearGradient(0,y,0,y+bh);gr.addColorStop(0,'rgba(255,232,200,.07)');gr.addColorStop(.7,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(10,0,20,.22)');g.fillStyle=gr;g.fillRect(0,y,W,bh);
  g.save();g.beginPath();g.rect(0,y+bh*.62,W,bh*.38);g.clip();hatch(g,0,y+bh*.6,W,bh*.4,.8,3.2,'rgba(30,18,40,.22)',.6);g.restore();
  g.strokeStyle='rgba(28,18,36,.55)';g.lineWidth=1.1;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
  g.strokeStyle='rgba(255,230,200,.12)';g.lineWidth=1;g.beginPath();g.moveTo(0,y+1.5);g.lineTo(W,y+1.5);g.stroke();
  const n=8;for(let j=-n;j<=n;j++){const th=(j+(row%2?.5:0))/n*1.45;if(Math.abs(th)>1.5)continue;const x=W/2+Math.sin(th)*W*.72;
   g.strokeStyle='rgba(28,18,36,.5)';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-1,1),y+bh);g.stroke();
   if(Math.random()<.25){g.strokeStyle='rgba(20,10,30,.25)';g.beginPath();g.arc(x+rnd(8,30),y+rnd(6,bh-6),rnd(2,5),rnd(0,3),rnd(3,6));g.stroke()}}
 }
 hatch(g,0,0,W*.18,L.desk,1.25,4,'rgba(10,5,20,.18)',.6);hatch(g,W*.82,0,W*.18,L.desk,1.9,4,'rgba(10,5,20,.18)',.6);
 // landscape: dress form & shelf
 if(!PORT){
  const fx=W*.17,fy=H*.48,fh=H*.36;
  g.save();g.translate(fx,fy);
  g.fillStyle='rgba(20,10,25,.25)';g.beginPath();g.ellipse(fh*.05,fh*.62,fh*.2,fh*.04,0,0,TAU);g.fill();
  g.strokeStyle='#4a3524';g.lineWidth=4;g.beginPath();g.moveTo(0,fh*.1);g.lineTo(0,fh*.6);g.stroke();
  g.beginPath();g.moveTo(-fh*.13,fh*.62);g.lineTo(0,fh*.52);g.lineTo(fh*.13,fh*.62);g.stroke();
  g.beginPath();g.moveTo(-fh*.1,-fh*.32);g.bezierCurveTo(-fh*.2,-fh*.2,-fh*.08,-fh*.08,-fh*.15,fh*.12);g.lineTo(fh*.15,fh*.12);g.bezierCurveTo(fh*.08,-fh*.08,fh*.2,-fh*.2,fh*.1,-fh*.32);g.closePath();
  gr=g.createLinearGradient(-fh*.15,0,fh*.15,0);gr.addColorStop(0,'#c99a86');gr.addColorStop(.45,'#efd2c0');gr.addColorStop(1,'#8a5f58');g.fillStyle=gr;g.fill();g.strokeStyle=INK;g.lineWidth=1.2;g.stroke();
  g.save();g.clip();hatch(g,0,-fh*.35,fh*.2,fh*.5,1.1,3,'rgba(60,20,40,.3)',.6);g.restore();
  // draped cloth on form
  g.beginPath();g.moveTo(-fh*.12,-fh*.1);g.quadraticCurveTo(0,fh*.0,fh*.12,-fh*.12);g.lineTo(fh*.2,fh*.3);g.quadraticCurveTo(0,fh*.36,-fh*.2,fh*.3);g.closePath();
  gr=g.createLinearGradient(-fh*.2,0,fh*.2,0);gr.addColorStop(0,'#7c3a63');gr.addColorStop(.5,'#c56a94');gr.addColorStop(1,'#62284d');g.fillStyle=gr;g.fill();g.strokeStyle=INK;g.stroke();
  g.strokeStyle='rgba(40,10,30,.45)';for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(i*fh*.03,-fh*.05);g.quadraticCurveTo(i*fh*.05,fh*.15,i*fh*.06,fh*.32);g.stroke()}
  g.fillStyle='#d9b45c';circ(g,0,-fh*.36,fh*.035);g.fill();
  g.restore();
 }
 // drapes valance
 const sw=PORT?3:5,swW=W/sw;
 for(let i=0;i<sw;i++){const x0=i*swW,x1=x0+swW,d=H*(PORT?.035:.05);

function edgeLR(sd,v){const L0=-.5+.06*v;return [L0,L0+.1+1.05*Math.pow(Math.max(0,v),.9)+(.12+sd.shapeK)*Math.sin(PI*v)]}

 if(c.mode==='trans'&&c.dir<0&&G.client){G.client.x=damp(G.client.x,SEA.dock.x,4,dt);G.client.y=damp(G.client.y,SEA.dock.y,4,dt)}
 updateLighthouse(dt);
 for(const cl of G.clouds){cl.x+=cl.sp*dt;if(cl.x>1.15)cl.x=-.5}
 if(G.scene==='tailor'&&G.sail){
  const sd=G.sail;if(!sd.onShip)updSail(sd,dt);
  const idle=clamp((G.t-G.lastIn-2)/3);sd.flap=1+idle*.9;

  if(G.phase==='ribbon'||G.phase==='light'||G.phase==='bloom')updRibbons(dt);

}

 g.strokeStyle=gr;g.lineWidth=r*.2;circ(g,0,0,r*.85);g.stroke();g.strokeStyle=INK;g.lineWidth=1;circ(g,0,0,r*.95);g.stroke();circ(g,0,0,r*.75);g.stroke();
 g.strokeStyle='#c9973a';g.lineWidth=r*.1;for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(i*TAU/6)*r*.78,Math.sin(i*TAU/6)*r*.78);g.stroke()}
 g.fillStyle=gr;circ(g,0,0,r*.2);g.fill();g.strokeStyle=INK;g.lineWidth=1;g.stroke();
 g.fillStyle='#7a2a3a';g.beginPath();g.ellipse(r*.85,0,r*.14,r*.2,0,0,TAU);g.fill();g.stroke();g.fillStyle='rgba(255,200,200,.6)';circ(g,r*.82,-r*.06,r*.05);g.fill();
 g.restore();
}
function drawSpool(g,x,y,col,s,rot,hop){
 const c=COL[col],w=s*.42,h=s*.62;y-=hop*s*.25;
 g.save();g.translate(x,y);
 g.fillStyle='rgba(10,5,10,.35)';g.beginPath();g.ellipse(3,h*.55,w*1.15,w*.32,0,0,TAU);g.fill();
 const gr=g.createLinearGradient(-w,0,w,0);gr.addColorStop(0,c.d);gr.addColorStop(.4,c.l);gr.addColorStop(.7,c.b);gr.addColorStop(1,c.d);g.fillStyle=gr;g.fillRect(-w*.8,-h*.4,w*1.6,h*.8);
 g.strokeStyle=rgba(c.d,.6);g.lineWidth=.8;for(let i=0;i<9;i++){const yy=-h*.4+((i/9*h*.8+rot*8)%(h*.8));g.beginPath();g.moveTo(-w*.8,yy);g.quadraticCurveTo(0,yy+3,w*.8,yy);g.stroke()}
 g.strokeStyle=INK;g.lineWidth=1;g.strokeRect(-w*.8,-h*.4,w*1.6,h*.8);
 for(const yy of [-h*.45,h*.45]){const wg=g.createLinearGradient(-w,0,w,0);wg.addColorStop(0,'#7a5030');wg.addColorStop(.4,'#e0b47c');wg.addColorStop(1,'#6a4020');g.fillStyle=wg;g.beginPath();g.ellipse(0,yy,w,w*.3,0,0,TAU);g.fill();g.stroke()}
 g.fillStyle='#3a2414';g.beginPath();g.ellipse(0,-h*.45,w*.2,w*.07,0,0,TAU);g.fill();
 g.restore();
}
function drawNeedle(g){
 const nl=needleLen(),a=ND.a,x=ND.x,y=ND.y-ND.hop*L.m*.02;const pk=ND.poke;
 g.save();g.translate(x,y);g.rotate(a);
 const vis=nl*(1-pk*.22),sh=pk*nl*.11;g.translate(sh,0);
 g.fillStyle='rgba(10,5,20,.25)';g.beginPath();g.ellipse(4,6,vis*.5,3,0,0,TAU);g.fill();
 const w=L.m*.008;g.beginPath();g.moveTo(vis*.5,0);g.lineTo(-nl*.42,-w);g.quadraticCurveTo(-nl*.52,0,-nl*.42,w);g.closePath();
 const gr=g.createLinearGradient(0,-w,0,w);gr.addColorStop(0,'#ffffff');gr.addColorStop(.5,'#a7afc4');gr.addColorStop(1,'#596078');g.fillStyle=gr;g.fill();g.strokeStyle=INK;g.lineWidth=.8;g.stroke();
 g.fillStyle='#2a2140';g.beginPath();g.ellipse(-nl*.4,0,nl*.045,w*.35,0,0,TAU);g.fill();
 const gp=((G.t*.8)%1)*1.2-.6;g.save();g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,255,255,.9)';g.fillRect(gp*nl-4,-w*.6,8,w*.5);
 if(pk>.3){g.fillStyle='rgba(255,250,220,'+pk+')';star4(g,vis*.5,0,L.m*.03*pk,G.t*4)}g.restore();
 g.restore();
}
function drawThread(g){
 const c=COL[G.thread];if(chain.length<2)return;
 g.lineCap='round';g.lineJoin='round';
 g.beginPath();g.moveTo(chain[0].x,chain[0].y);for(let i=1;i<chain.length-1;i++){const m={x:(chain[i].x+chain[i+1].x)/2,y:(chain[i].y+chain[i+1].y)/2};g.quadraticCurveTo(chain[i].x,chain[i].y,m.x,m.y)}g.lineTo(chain[chain.length-1].x,chain[chain.length-1].y);
 const tw=clamp(L.m*.009,3,5.5);g.strokeStyle=c.d;g.lineWidth=tw;g.stroke();g.strokeStyle=c.b;g.lineWidth=tw*.62;g.stroke();
 g.save();g.translate(-.6,-.8);g.strokeStyle=rgba(c.l,.9);g.lineWidth=L.m*.0025;g.stroke();g.restore();
 // running satin glint
 const n=chain.length,gi=((G.t*(1.2+ND.sp/(L.m*1.5)))%1)*(n-1),i0=Math.floor(gi),p=chain[i0],q=chain[Math.min(n-1,i0+1)];
 g.save();g.globalCompositeOperation='lighter';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=L.m*.006;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();g.restore();
 // thread tip toward finger / loose end
 const nl=needleLen(),tip={x:ND.x+Math.cos(ND.a)*nl*.5,y:ND.y+Math.sin(ND.a)*nl*.5};
 if(G.sew.pid!=null){const fx=G.sew.fx,fy=G.sew.fy;if(hyp(fx-tip.x,fy-tip.y)>6){g.strokeStyle=c.b;g.lineWidth=L.m*.005;g.beginPath();g.moveTo(tip.x,tip.y);g.quadraticCurveTo((tip.x+fx)/2,(tip.y+fy)/2+6,fx,fy);g.stroke()}
  g.save();g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(fx,fy,0,fx,fy,L.m*.03);rg.addColorStop(0,rgba(c.l,.9));rg.addColorStop(1,rgba(c.b,0));g.fillStyle=rg;g.fillRect(fx-L.m*.03,fy-L.m*.03,L.m*.06,L.m*.06);g.restore()}
 else{const idle=clamp((G.t-G.lastIn-1.5)/2.5);const wv=Math.sin(G.t*3)*(4+idle*10);g.strokeStyle=c.b;g.lineWidth=L.m*.006;g.beginPath();g.moveTo(tip.x,tip.y);
  g.bezierCurveTo(tip.x+Math.cos(ND.a)*L.m*.04,tip.y+Math.sin(ND.a)*L.m*.04+wv,tip.x+Math.cos(ND.a+.8)*L.m*.07,tip.y+Math.sin(ND.a+.8)*L.m*.07-wv,tip.x+Math.cos(ND.a+.3)*L.m*.09+wv*.5,tip.y+Math.sin(ND.a+.3)*L.m*.09);g.stroke()}
 g.lineCap='butt';g.lineJoin='miter';
}
function drawHalo(g,tg){
 if(!tg)return;const pulse=.5+.5*Math.sin(G.hl*4);g.save();g.globalCompositeOperation='lighter';const r=tg.r*(1+pulse*.15);
 const rg=g.createRadialGradient(tg.x,tg.y,r*.2,tg.x,tg.y,r);rg.addColorStop(0,'rgba(255,225,140,'+(.18+pulse*.12)+')');rg.addColorStop(1,'rgba(255,215,120,0)');g.fillStyle=rg;g.fillRect(tg.x-r,tg.y-r,r*2,r*2);
 g.strokeStyle='rgba(255,236,170,'+(.25+pulse*.25)+')';g.lineWidth=2;circ(g,tg.x,tg.y,r*.75+pulse*4);g.stroke();g.restore();
}
function drawOverlay(cam){
 const g=ctx,C=G.cam.C,z=cam.z,sd=G.sail;if(cam.ov<=.01)return;
 if(G.mode==='indoor'&&L.win.r*z>hyp(W,H)*1.2)return;
 g.save();g.globalAlpha=cam.ov;g.translate(C.x,C.y);g.scale(z,z);g.translate(-C.x,-C.y);
 g.drawImage(G.mode==='indoor'?BG.shop:BG.ledge,0,0,W,H);
 if(G.mode==='indoor'){const w=L.win;g.save();g.globalCompositeOperation='lighter';g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=w.r*.08;g.beginPath();g.arc(w.x,w.y,w.r*.75,PI*1.1,PI*1.45);g.stroke();g.lineWidth=w.r*.03;g.beginPath();g.arc(w.x,w.y,w.r*.6,PI*1.15,PI*1.35);g.stroke();g.restore()}
 const inTailor=G.scene==='tailor';
 const ph=G.phase,lightOn=['light','bloom'].includes(ph)||(ph==='ribbon'&&sd&&sd.bows.length>0);
 drawLens(g,0,lightOn||ph==='gift');
 drawHandle(g,lightOn);
 if(sd&&!sd.onShip&&inTailor){
  const T=sailTf();
  // desk shadow
  g.fillStyle='rgba(10,5,10,'+(.22-sd.lift*.1)+')';g.beginPath();g.ellipse(T.x+L.s*.15,L.desk+H*.03+sd.lift*H*.02,L.s*(.75-sd.lift*.15),L.s*.09,0,0,TAU);g.fill();
  // tools
  if(G.tools<1&&ph!=='enter'){g.save();g.globalAlpha*=1-G.tools;const sp=spoolPos();
   for(let i=0;i<2;i++){const a=L.alt[i];drawSpool(g,a.x-G.tools*W*.5,a.y,G.alt[i],L.m*.1,G.t*.1,G.altHop?G.altHop[i]:0)}
   drawSpool(g,sp.x,sp.y,G.thread,L.m*.14,(G.sew.fx+G.sew.fy)*.02+sd.st.length,G.mainHop||0);
   g.restore()}
  // rail
  if(['ribbon','light','bloom','gift'].includes(ph)&&G.ribbons.length){const r=L.rail,a=clamp(1-G.ribbons[0].drop*1.4);g.save();g.globalAlpha*=a;g.strokeStyle='#5e3f12';g.lineWidth=5;g.beginPath();g.moveTo(r.x0-10,r.y);g.lineTo(r.x1+10,r.y);g.stroke();g.strokeStyle='#e0b45c';g.lineWidth=2;g.stroke();g.fillStyle='#d8b058';circ(g,r.x0-10,r.y,5);g.fill();circ(g,r.x1+10,r.y,5);g.fill();g.restore()}
  for(const rb of G.ribbons)if(rb.state!=='used'&&rb.state!=='drag')drawRibbonChain(g,rb);
  // beam
  if(lightOn||ph==='gift'){const ba=beamAng(),hw=(ph==='ribbon'?.08:.16)+G.bloom*.8,len=hyp(W,H)*1.3,lx=L.lens.x,ly=L.lens.y,al=ph==='ribbon'?.12:.26;
   g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(lx,ly,0,lx,ly,len);gr.addColorStop(0,'rgba(255,225,140,'+al+')');gr.addColorStop(.6,'rgba(255,210,120,'+al*.4+')');gr.addColorStop(1,'rgba(255,200,100,0)');
   g.fillStyle=gr;g.beginPath();g.moveTo(lx,ly);g.arc(lx,ly,len,ba-hw,ba+hw);g.closePath();g.fill();g.restore()}
  // sail
  if(ph==='enter'){}
  else if(ph==='arrive'&&G.arr){const cm=camNow(),tg=shipSailScreen(G.client,cm),e=easeIO(clamp(G.arr.t)),T2=sailTf();
   const x=lerp(tg.x,T2.x,e),y=lerp(tg.y,T2.y,e)-Math.sin(PI*e)*H*.1,s=tg.s*Math.pow(T2.s/tg.s,e),r=lerp(tg.r,T2.r,e);
   g.save();g.translate(x,y);g.rotate(r);g.scale(s,s);drawSail(g,sd,s);g.restore()}
  else if(ph==='fly'&&G.fly){const f=flyTf();g.save();g.translate(f.x,f.y);g.rotate(f.r);g.scale(f.s*f.fx,f.s);drawSail(g,sd,f.s);g.restore()}
  else if(ph!=='transform'){
   if(sd.lift>0){g.save();g.globalCompositeOperation='lighter';const r=L.s*1.4;const rg=g.createRadialGradient(T.x,T.y,0,T.x,T.y,r);rg.addColorStop(0,'rgba(255,230,160,'+(.35*sd.lift)+')');rg.addColorStop(1,'rgba(255,220,140,0)');g.fillStyle=rg;g.fillRect(T.x-r,T.y-r,r*2,r*2);g.restore()}
   g.save();g.translate(T.x,T.y);g.rotate(T.r);
   if(G.gf&&G.gf.st>.01){const a=G.gf.sa-T.r;g.rotate(a);g.scale(1+G.gf.st,1-G.gf.st*.4);g.rotate(-a)}
   g.scale(T.s,T.s);drawSail(g,sd,T.s);
   if(lightOn&&ph!=='ribbon'){const ba=beamAng()-T.r,hw=.16+G.bloom*.8;g.save();g.clip(sailPath(sd));g.globalCompositeOperation='lighter';const lpos=s2l(T,L.lens.x,L.lens.y);
    const gr=g.createRadialGradient(lpos.x,lpos.y,0,lpos.x,lpos.y,4);gr.addColorStop(0,'rgba(255,220,130,.35)');gr.addColorStop(1,'rgba(255,200,100,0)');g.fillStyle=gr;g.beginPath();g.moveTo(lpos.x,lpos.y);g.arc(lpos.x,lpos.y,5,ba-hw*.7,ba+hw*.7);g.closePath();g.fill();g.restore()}
   g.restore();
   for(const b of sd.bows)if(b.held){drawBow(g,b.hx,b.hy,b.b*T.s*1.1,b,1,sd.t)}
  }
  for(const rb of G.ribbons)if(rb.state==='drag')drawRibbonChain(g,rb);
  if(G.tools<1&&ph!=='enter'&&ph!=='arrive'||ph==='arrive'){g.save();g.globalAlpha*=1-G.tools;drawThread(g);drawNeedle(g);g.restore()}
  drawHalo(g,guideTarget());
 }
 drawParts(g,PS,1);
 g.restore();
}
function drawGhost(){
 const d=G.demo;if(!d)return;const tt=((G.t-d.t0)%d.dur)/d.dur,p=d.path(tt);if(!p)return;
 const fade=clamp(Math.min(tt*6,(1-tt)*6)),g=ctx,r=L.m*.045;
 g.save();g.globalAlpha=.55*fade;
 g.fillStyle='rgba(255,250,240,.55)';g.beginPath();g.ellipse(p.x+r*.55,p.y+r*1.6,r*.75,r*1.5,-.35,0,TAU);g.fill();
 g.fillStyle='rgba(255,252,245,.85)';g.beginPath();g.ellipse(p.x,p.y+r*.15,r*.62,r*.8,-.25,0,TAU);g.fill();
 if(p.press){g.globalCompositeOperation='lighter';g.strokeStyle='rgba(255,230,160,.9)';g.lineWidth=2;circ(g,p.x,p.y,r*(1+((G.t*2)%1)*.8));g.stroke()}
 g.restore();
}
function render(){
 const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#141a33';g.fillRect(0,0,W,H);
 const cam=camNow(),tailorVis=G.cam.mode!=='sea';
 let lhA=1;if(G.cam.mode==='tailor')lhA=0;else if(G.cam.mode==='trans')lhA=clamp((G.cam.p-.25)/.4);
 g.save();
 if(tailorVis&&G.mode==='indoor'){const r=L.win.r*cam.z;if(r<hyp(W,H)*1.2){g.beginPath();g.arc(G.cam.C.x,G.cam.C.y,r,0,TAU);g.clip()}}
 drawSeaWorld(cam,lhA);
 g.restore();
 if(tailorVis)drawOverlay(cam);
 if(G.cam.mode==='sea'){drawHalo(g,guideTarget());drawParts(g,PS,1)}
 drawGhost();
 g.drawImage(BG.vig,0,0,W,H);
}

// ================= boot =================
function initWorld(){
 G.glyphs=[];for(let i=0;i<70;i++)G.glyphs.push({nx:Math.random(),ny:Math.random(),s:Math.random(),ph:rnd(0,TAU),sp:rnd(.3,1),gold:Math.random()<.35});
 G.farBoats=[];for(let i=0;i<rndi(2,4);i++)G.farBoats.push({x:Math.random(),sp:rnd(.002,.006),s:rnd(3,5)});
 const types=shuffle(Object.keys(TYPES));const first=makeShip(types.shift());G.order=types;G.fleet=[first];
 newTailor('indoor',first);G.scene='tailor';G.phase='sew';G.cam.mode='tailor';
}
let oldW=0,oldH=0;
function resize(){
 const nw=Math.max(1,window.innerWidth),nh=Math.max(1,window.innerHeight);
 DPR=Math.min(2,window.devicePixelRatio||1);W=nw;H=nh;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 const ohz=SEA.hz;layout();
 if(oldW>0){const sx=W/oldW;const sy=(y)=>SEA.hz+(y-ohz)*(H-SEA.hz)/(oldH-ohz);
  for(const s of G.fleet){s.x*=sx;s.y=sy(s.y);for(const p of s.trail){p.x*=sx;p.y=sy(p.y)}}
  for(const wv of G.waves)for(const p of wv.pts){p.x*=sx;p.y=sy(p.y)}
  for(const k of G.knots){k.x*=sx;k.y=sy(k.y)}for(const s of G.shells){s.x*=sx;s.y=sy(s.y)}
  if(G.client&&G.scene==='tailor'){setTailorCam(G.client,G.mode);if(G.client.state==='dock'||G.client.state==='wait'){G.client.x=SEA.dock.x;G.client.y=SEA.dock.y}}
  if(G.ribbons.length)for(const rb of G.ribbons){if(rb.state==='used')continue;const a=railPt(rb.i,G.ribbons.length);rb.state='hang';rb.pid=null;for(const p of rb.pts){p.x=p.px=a.x;p.y=p.py=a.y}}
  if(G.sail&&!G.sail.onShip){if(ND.home){const h=needleHome();ND.x=h.x;ND.y=h.y}else{ND.x*=sx;ND.y*=H/oldH}for(const p of chain){p.x=p.px=ND.x;p.y=p.py=ND.y}}
  if(G.gf){G.gf.x=L.sail.x;G.gf.y=L.sail.y;G.gf.held=false}
  PTR.clear();G.sew.pid=null;G.leverHeld=false;
 }
 oldW=W;oldH=H;buildAll();
}
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,120)});
window.addEventListener('orientationchange',()=>{clearTimeout(rzT);rzT=setTimeout(resize,250)});
let last=0,running=true,raf=0;
function frame(ts){
 if(!running)return;const dt=last?clamp((ts-last)/1000,0,.05):1/60;last=ts;
 try{update(dt);render()}catch(e){console.warn(e)}
 raf=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;cancelAnimationFrame(raf);if(AU.c&&AU.c.state==='running')AU.c.suspend()}else{running=true;last=0;if(AU.c)AU.c.resume();raf=requestAnimationFrame(frame)}});
window.__dbg={L:()=>L,tear:()=>{const sd=G.sail,T=sailTf();return tearPts(sd).map(p=>l2s(T,p.x,p.y))},rib:()=>G.ribbons.filter(r=>r.state==='hang').map(r=>({x:r.pts[3].x,y:r.pts[3].y})),
 sail:()=>sailTf(),ship:(i)=>{const s=G.visitor;if(!s)return null;const q=w2s(s.x,s.y-s.sz*.3,camNow());return q},fleet:()=>G.fleet.filter(s=>s.done).map(s=>w2s(s.x,s.y-s.sz*.25,camNow()))};
layout();
resize();initWorld();
raf=requestAnimationFrame(frame);
})();
</script>
