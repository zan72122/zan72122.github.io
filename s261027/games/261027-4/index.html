// ============================================================
//  基本ユーティリティ

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const hyp = Math.hypot;
function mulberry(a) {
  return function () {

const R = Math.random;

// 紙の質感

//  パーティクル更新

}

// ============================================================
//  ループ
// ============================================================
let last = 0, rafId = 0, running = false;
function frame(ts) {
  if (!running) return;
  let dt = (ts - last) / 1000; last = ts;
  if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 1 / 30);
  T += dt;
  try {
    updateHint(dt);
    updateSponge(dt);
    updatePhase(dt);
    updateCreatures(dt);
    updateFish(dt);
    updateParticles(dt);
    audioUpdate(dt);
