<script>
(function(){
'use strict';

/* =========================================================
   基本ユーティリティ
   ========================================================= */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sat=t=>t<0?0:t>1?1:t;
const eo=t=>1-Math.pow(1-sat(t),3);
const eio=t=>{t=sat(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eob=t=>{t=sat(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const lin=t=>sat(t);
const rnd=(a,b)=>a+Math.random()*(b-a);
const dmp=(c,t,k,dt)=>c+(t-c)*(1-Math.exp(-k*dt));
const hyp=Math.hypot;

const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let VW=1,VH=1,DPR=1,DPRCAP=2;
const SAFE={l:0,r:0,t:0,b:0};

/* 投影：x右 y上 z奥。斜め前上方から見下ろす */
const SK=0.22, DPF=0.5;
const _vl=hyp(SK,DPF,1), VDX=-SK/_vl, VDY=-DPF/_vl, VDZ=1/_vl;
const _ll=hyp(0.35,0.85,0.45), LX=-0.35/_ll, LY=0.85/_ll, LZ=-0.45/_ll;
const cam={ox:0,oy:0,s:20,a0:-10,a1:10,b0:-6,b1:24,fa:0,fb:5,init:false};
let PX=0,PY=0;
function prj(x,y,z){PX=cam.ox+(x+SK*z)*cam.s;PY=cam.oy-(y+DPF*z)*cam.s;}
function dep(x,y,z){return VDX*x+VDY*y+VDZ*z;}
/* 画面→平面 */
function scrToZ(sx,sy,z0){const a=(sx-cam.ox)/cam.s,b=(cam.oy-sy)/cam.s;return {x:a-SK*z0,y:b-DPF*z0,z:z0};}
function scrToY(sx,sy,y0){const a=(sx-cam.ox)/cam.s,b=(cam.oy-sy)/cam.s;const z=(b-y0)/DPF;return {x:a-SK*z,y:y0,z:z};}

/* 擬似カメラ基底（球体描画用） */
const CF=[VDX,VDY,VDZ];
const CR=(()=>{let x=1-VDX*VDX,y=-VDX*VDY,z=-VDX*VDZ;const l=hyp(x,y,z);return [x/l,y/l,z/l];})();
const CU=[CF[1]*CR[2]-CF[2]*CR[1],CF[2]*CR[0]-CF[0]*CR[2],CF[0]*CR[1]-CF[1]*CR[0]];
if(CU[1]<0){CU[0]=-CU[0];CU[1]=-CU[1];CU[2]=-CU[2];}

/* =========================================================
   色
   ========================================================= */
function C(h){const n=parseInt(h.slice(1),16);return {r:n>>16&255,g:n>>8&255,b:n&255,c:[]};}
function shf(col,k){let q=Math.round(k*40);if(q<0)q=0;if(q>64)q=64;let s=col.c[q];
  if(!s){const m=q/40;const f=v=>Math.min(255,Math.round(v*m+(m>1?(m-1)*120:0)));s=col.c[q]='rgb('+f(col.r)+','+f(col.g)+','+f(col.b)+')';}return s;}
const K={
 red:C('#ff4a4a'),yel:C('#ffd23a'),blu:C('#3d7cf5'),cyan:C('#36d3e6'),pink:C('#ff79b4'),wht:C('#ffffff'),cream:C('#fff2df'),
 dark:C('#2b2238'),mouth:C('#a8323e'),tongue:C('#ff8fa0'),cheek:C('#ff9fb8'),skin:C('#ffd7b5'),skin2:C('#e8b48a'),
 wood1:C('#e8a862'),wood2:C('#d49250'),wood3:C('#bb7a3e'),woodD:C('#8f5a2c'),woodL:C('#f2c48a'),
 gold:C('#ffcb3a'),goldD:C('#e29a18'),grey:C('#aab5c7'),greyD:C('#7b8698'),greyL:C('#d4dbe6'),
 purple:C('#9b59ff'),purpleD:C('#6e3ad6'),green:C('#5fd35f'),greenD:C('#3aa84a'),orange:C('#ff9a3a'),
 brown:C('#a8693c'),brownD:C('#7c4a26'),brownL:C('#e7b884'),black:C('#33333d'),tan:C('#f1c690'),
 teal:C('#20b6a8'),navy:C('#2c3e8f'),lilac:C('#c9a6ff'),bulbOff:C('#b99555'),bulbOn:C('#fff4a8'),
 rope1:C('#ff5f8f'),rope2:C('#ffe066'),net:C('#e8454f'),mint:C('#8ff0c8'),sky1:C('#bfe9ff'),
 bld1:C('#ffd1dc'),bld2:C('#c9e7ff'),bld3:C('#fff0b3'),bld4:C('#d4f5d0'),bld5:C('#e7d6ff'),win:C('#7fb3e6'),
 cloud:C('#ffffff'),grass:C('#86d46a'),silver:C('#e9eef5'),ponyC:C('#f4c69e'),ele:C('#9fb0c6'),eleD:C('#8193ab')
};

/* =========================================================
   行列（3x4）
   ========================================================= */
function MI(){return [1,0,0,0,1,0,0,0,1,0,0,0];}
function MT(M,x,y,z){return [M[0],M[1],M[2],M[3],M[4],M[5],M[6],M[7],M[8],
  M[0]*x+M[1]*y+M[2]*z+M[9],M[3]*x+M[4]*y+M[5]*z+M[10],M[6]*x+M[7]*y+M[8]*z+M[11]];}
function MRX(M,a){if(!a)return M;const c=Math.cos(a),s=Math.sin(a);return [M[0],M[1]*c+M[2]*s,-M[1]*s+M[2]*c,M[3],M[4]*c+M[5]*s,-M[4]*s+M[5]*c,M[6],M[7]*c+M[8]*s,-M[7]*s+M[8]*c,M[9],M[10],M[11]];}
function MRY(M,a){if(!a)return M;const c=Math.cos(a),s=Math.sin(a);return [M[0]*c-M[2]*s,M[1],M[0]*s+M[2]*c,M[3]*c-M[5]*s,M[4],M[3]*s+M[5]*c,M[6]*c-M[8]*s,M[7],M[6]*s+M[8]*c,M[9],M[10],M[11]];}
function MRZ(M,a){if(!a)return M;const c=Math.cos(a),s=Math.sin(a);return [M[0]*c+M[1]*s,-M[0]*s+M[1]*c,M[2],M[3]*c+M[4]*s,-M[3]*s+M[4]*c,M[5],M[6]*c+M[7]*s,-M[6]*s+M[7]*c,M[8],M[9],M[10],M[11]];}
function MS(M,x,y,z){return [M[0]*x,M[1]*y,M[2]*z,M[3]*x,M[4]*y,M[5]*z,M[6]*x,M[7]*y,M[8]*z,M[9],M[10],M[11]];}
function MP(M,x,y,z){return [M[0]*x+M[1]*y+M[2]*z+M[9],M[3]*x+M[4]*y+M[5]*z+M[10],M[6]*x+M[7]*y+M[8]*z+M[11]];}
function MFromDir(x,y,z,fx,fy,fz){ // ローカル+zを方向へ向ける
  let l=hyp(fx,fy,fz)||1;fx/=l;fy/=l;fz/=l;
  let rx=fz,ry=0,rz=-fx;l=hyp(rx,ry,rz);if(l<1e-4){rx=1;rz=0;l=1;}rx/=l;rz/=l;
  const ux=fy*rz-fz*ry,uy=fz*rx-fx*rz,uz=fx*ry-fy*rx;
  return [rx,ux,fx, ry,uy,fy, rz,uz,fz, x,y,z];
}

/* =========================================================
   ボクセル描画パイプライン
   ========================================================= */
const FACES=[[1,5,7,3],[0,4,6,2],[2,6,7,3],[0,1,5,4],[4,5,7,6],[0,2,3,1]];
const pool=[];let pI=0;
function nb(){let b=pool[pI++];if(!b){b={t:0,x:new Float32Array(8),y:new Float32Array(8),f:[0,0,0],fc:['','',''],oc:['','',''],n:0,d:0,a:1,fn:null};pool.push(b);}b.t=0;b.a=1;b.fn=null;return b;}
let groups=[];const gpool=[];let gI=0;
function G(d,ord){let g=gpool[gI++];if(!g){g={d:0,it:[],o:false};gpool.push(g);}g.d=d;g.it.length=0;g.o=!!ord;groups.push(g);return g;}
function GL(d,ord){let g=gpool[gI++];if(!g){g={d:0,it:[],o:false};gpool.push(g);}g.d=d;g.it.length=0;g.o=!!ord;return g;} // 直描き用
let ALPHA=1, STROKE=true;
function bx(g,M,x,y,z,w,h,d,col,em){
  const b=nb();b.a=ALPHA;
  let sx=0,sy=0,sz=0;
  const m0=M[0],m1=M[1],m2=M[2],m3=M[3],m4=M[4],m5=M[5],m6=M[6],m7=M[7],m8=M[8],tx=M[9],ty=M[10],tz=M[11];
  const os=cam.s,ox=cam.ox,oy=cam.oy;
  for(let i=0;i<8;i++){
    const lx=(i&1)?x+w:x,ly=(i&2)?y+h:y,lz=(i&4)?z+d:z;
    const wx=m0*lx+m1*ly+m2*lz+tx,wy=m3*lx+m4*ly+m5*lz+ty,wz=m6*lx+m7*ly+m8*lz+tz;
    sx+=wx;sy+=wy;sz+=wz;
    b.x[i]=ox+(wx+SK*wz)*os;b.y[i]=oy-(wy+DPF*wz)*os;
  }
  b.d=(VDX*sx+VDY*sy+VDZ*sz)*0.125;
  let n=0;
  for(let k=0;k<3;k++){
    let ax,ay,az;
    if(k===0){ax=m0;ay=m3;az=m6;}else if(k===1){ax=m1;ay=m4;az=m7;}else{ax=m2;ay=m5;az=m8;}
    const il=1/(hyp(ax,ay,az)||1);ax*=il;ay*=il;az*=il;
    const dv=ax*VDX+ay*VDY+az*VDZ;
    if(dv<-0.003){b.f[n]=k*2;sc(b,n,col,ax*LX+ay*LY+az*LZ,em);n++;}
    else if(dv>0.003){b.f[n]=k*2+1;sc(b,n,col,-(ax*LX+ay*LY+az*LZ),em);n++;}
  }
  b.n=n;g.it.push(b);return b;
}
function sc(b,n,col,dl,em){const k=em?(em===true?1.2:em):0.6+0.4*(dl*0.5+0.5);b.fc[n]=shf(col,k);b.oc[n]=shf(col,Math.min(k,1)*0.68);}
function cu(g,d,fn){const b=nb();b.t=1;b.d=d;b.fn=fn;g.it.push(b);return b;}
function drawB(b){
  if(b.a<1)ctx.globalAlpha=b.a;
  const X=b.x,Y=b.y;
  for(let j=0;j<b.n;j++){const F=FACES[b.f[j]];
    ctx.beginPath();ctx.moveTo(X[F[0]],Y[F[0]]);ctx.lineTo(X[F[1]],Y[F[1]]);ctx.lineTo(X[F[2]],Y[F[2]]);ctx.lineTo(X[F[3]],Y[F[3]]);ctx.closePath();
    ctx.fillStyle=b.fc[j];ctx.fill();if(STROKE){ctx.strokeStyle=b.oc[j];ctx.stroke();}}
  if(b.a<1)ctx.globalAlpha=1;
}
const byD=(a,b)=>b.d-a.d;
function flush(g){if(!g.o)g.it.sort(byD);const it=g.it;for(let i=0;i<it.length;i++){const b=it[i];if(b.t===1)b.fn();else drawB(b);}}
function drawGroups(){groups.sort(byD);for(let i=0;i<groups.length;i++)flush(groups[i]);}

/* 星型（ボクセル） */
function star2(g,M,sz,col,em){
  const t=sz*0.36;
  bx(g,M,-sz/2,-t/2,-t/2,sz,t,t,col,em);
  bx(g,M,-t/2,-sz*0.55,-t/2,t,sz*1.1,t,col,em);
  const Md=MRZ(M,PI/4),s2=sz*0.72;
  bx(g,Md,-s2/2,-t*0.4,-t*0.45,s2,t*0.8,t*0.9,col,em);
  bx(g,Md,-t*0.4,-s2/2,-t*0.45,t*0.8,s2,t*0.9,col,em);
}

/* =========================================================
   キャラクター（人形）
   ========================================================= */
function face(g,M,p,s){
  const z=-0.78,d=0.1,e=p.eye||0;
  if(e===1){bx(g,M,-0.5,0.74,z,0.32,0.1,d,K.dark);bx(g,M,0.18,0.74,z,0.32,0.1,d,K.dark);}
  else{const eh=e===2?0.42:0.32,ew=e===2?0.26:0.22;
    bx(g,M,-0.33-ew/2,0.6,z,ew,eh,d,K.dark);bx(g,M,0.33-ew/2,0.6,z,ew,eh,d,K.dark);
    bx(g,M,-0.36,0.6+eh-0.13,z-0.03,0.09,0.09,d,K.wht,true);bx(g,M,0.3,0.6+eh-0.13,z-0.03,0.09,0.09,d,K.wht,true);}
  if(!s.noCheek){bx(g,M,-0.64,0.4,z+0.02,0.24,0.14,d,K.cheek);bx(g,M,0.4,0.4,z+0.02,0.24,0.14,d,K.cheek);}
  const m=p.mouth||0;
  if(m===0){bx(g,M,-0.16,0.24,z,0.32,0.1,d,K.mouth);bx(g,M,-0.27,0.32,z,0.11,0.1,d,K.mouth);bx(g,M,0.16,0.32,z,0.11,0.1,d,K.mouth);}
  else if(m===1){bx(g,M,-0.14,0.14,z,0.28,0.28,d,K.mouth);}
  else if(m===2){bx(g,M,-0.32,0.12,z,0.64,0.26,d,K.mouth);bx(g,M,-0.15,0.12,z-0.02,0.3,0.1,d,K.tongue);}
  else{bx(g,M,-0.2,0.24,z,0.4,0.09,d,K.mouth);}
}
function human(g,M,p,s){
  const L=s.leg||1.3;
  const Mh=MRX(MRZ(MT(M,0,L+(p.by||0),0),p.bz||0),p.bx||0);
  for(let side=-1;side<=1;side+=2){
    const ax=side<0?(p.ll||0):(p.rl||0), az=side<0?(p.llz||0):(p.rlz||0);
    const Ml=MRX(MRZ(MT(Mh,side*0.33,0,0),side*az),ax);
    bx(g,Ml,-0.28,-L,-0.3,0.56,L,0.6,s.pants);
    bx(g,Ml,-0.31,-L,-0.48-(s.bigShoe?0.3:0),0.62,0.36,0.82+(s.bigShoe?0.3:0),s.shoe);
  }
  bx(g,Mh,-0.66,0,-0.42,1.32,1.45,0.84,s.shirt);
  if(s.stripe)bx(g,Mh,-0.69,0.62,-0.45,1.38,0.3,0.9,s.stripe);
  if(s.belt)bx(g,Mh,-0.69,0.04,-0.45,1.38,0.3,0.9,s.belt);
  if(s.btn){bx(g,Mh,-0.12,0.95,-0.5,0.24,0.24,0.1,s.btn);bx(g,Mh,-0.12,0.45,-0.5,0.24,0.24,0.1,s.btn);}
  if(s.collar)bx(g,Mh,-0.86,1.3,-0.62,1.72,0.3,1.24,s.collar);
  for(let side=-1;side<=1;side+=2){
    const ra=side<0?(p.la||0):(p.ra||0), rf=side<0?(p.lf||0):(p.rf||0);
    const Ma=MRX(MRZ(MT(Mh,side*0.87,1.36,0),side*ra),rf);
    bx(g,Ma,-0.21,-1.1,-0.22,0.42,1.1,0.44,s.sleeve||s.shirt);
    bx(g,Ma,-0.26,-1.46,-0.27,0.52,0.4,0.54,s.glove||s.skin||K.skin);
    if(s.pole&&side>0){}
  }
  const Mhd=MRX(MRY(MRZ(MT(Mh,0,1.45,0),p.hz||0),p.hy||0),p.hx||0);
  bx(g,Mhd,-0.72,0,-0.7,1.44,1.36,1.4,s.skin||K.skin);
  face(g,Mhd,p,s);
  const h=s.hat;
  if(h==='clown'){
    bx(g,Mhd,-0.18,0.38,-0.98,0.36,0.36,0.32,K.red);
    bx(g,Mhd,-0.98,0.45,-0.45,0.3,0.6,0.95,K.orange);bx(g,Mhd,0.68,0.45,-0.45,0.3,0.6,0.95,K.orange);
    bx(g,Mhd,-0.52,1.36,-0.52,1.04,0.42,1.04,K.blu);bx(g,Mhd,-0.36,1.78,-0.36,0.72,0.42,0.72,K.yel);
    bx(g,Mhd,-0.21,2.2,-0.21,0.42,0.36,0.42,K.blu);bx(g,Mhd,-0.2,2.56,-0.2,0.4,0.4,0.4,K.pink);
  }else if(h==='walker'){
    bx(g,Mhd,-0.77,0.95,-0.76,1.54,0.52,1.52,K.brownD);bx(g,Mhd,-0.77,0.3,-0.2,0.2,0.7,0.95,K.brownD);bx(g,Mhd,0.57,0.3,-0.2,0.2,0.7,0.95,K.brownD);
    bx(g,Mhd,-0.32,1.42,-0.1,0.64,0.5,0.64,K.brownD);bx(g,Mhd,-0.5,1.5,-0.2,0.36,0.3,0.3,K.pink);bx(g,Mhd,0.14,1.5,-0.2,0.36,0.3,0.3,K.pink);
  }else if(h==='kid'){
    bx(g,Mhd,-0.77,1.18,-0.76,1.54,0.38,1.52,K.green);bx(g,Mhd,-0.62,1.18,-1.2,1.24,0.14,0.52,K.greenD);bx(g,Mhd,-0.15,1.56,-0.15,0.3,0.2,0.3,K.yel);
  }else if(h==='trap'){
    bx(g,Mhd,-0.77,0.98,-0.76,1.54,0.48,1.52,K.dark);bx(g,Mhd,-0.25,0.4,0.65,0.5,1.0,0.5,K.dark);
    bx(g,Mhd,-0.4,1.42,-0.6,0.8,0.22,0.2,K.gold,1.05);bx(g,Mhd,-0.12,1.6,-0.62,0.24,0.24,0.2,K.cyan,1.05);
  }else if(h==='jug'){
    bx(g,Mhd,-0.98,1.32,-0.95,1.96,0.16,1.9,K.navy);bx(g,Mhd,-0.62,1.46,-0.6,1.24,1.0,1.2,K.navy);bx(g,Mhd,-0.65,1.5,-0.63,1.3,0.26,1.26,K.red);
  }
}
const ST_CLOWN={pants:K.blu,shoe:K.red,shirt:K.yel,stripe:K.red,collar:K.wht,btn:K.blu,glove:K.wht,skin:K.cream,hat:'clown',bigShoe:true};
const ST_WALK={pants:K.pink,shoe:K.wht,shirt:K.cyan,stripe:K.pink,hat:'walker',sleeve:K.cyan};
const ST_KID={pants:K.navy,shoe:K.orange,shirt:K.orange,stripe:K.yel,hat:'kid',leg:1.2};
const ST_TRAP={pants:K.purple,shoe:K.pink,shirt:K.pink,stripe:K.purple,belt:K.gold,hat:'trap'};
const ST_JUG={pants:K.navy,shoe:K.black,shirt:K.wht,stripe:K.blu,belt:K.red,hat:'jug',btn:K.red,sleeve:K.blu};

/* =========================================================
   どうぶつ
   ========================================================= */
const ANI={
  rabbit:{body:K.wht,head:K.wht,arm:K.wht,belly:K.pink,ear:'rabbit',nose:K.pink},
  bear:{body:K.brown,head:K.brown,arm:K.brown,belly:K.brownL,ear:'round',nose:K.dark,muzzle:K.brownL},
  panda:{body:K.wht,head:K.wht,arm:K.black,belly:K.wht,ear:'roundB',nose:K.dark,patch:true,legC:K.black},
  pony:{body:K.ponyC,head:K.ponyC,arm:K.ponyC,belly:K.cream,ear:'pony',nose:K.brownD,snout:true},
  elephant:{body:K.ele,head:K.ele,arm:K.ele,belly:K.greyL,ear:'ele',nose:null,trunk:true},
  bunny2:{body:K.lilac,head:K.lilac,arm:K.lilac,belly:K.wht,ear:'rabbit',nose:K.pink}
};
function animal(g,M,a){
  const T=ANI[a.type];const st=a.stand||0;
  const by=st*0.55+(a.jy||0);

function rotBall(ang,ax,az){ // 水平軸(ax,0,az)まわり回転
  const l=hyp(ax,az)||1;const x=ax/l,z=az/l,c=Math.cos(ang),s=Math.sin(ang),t=1-c;

  const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];b=[b[0]-d*a[0],b[1]-d*a[1],b[2]-d*a[2]];l=hyp(b[0],b[1],b[2]);b=b.map(v=>v/l);

  R[0]=a[0];R[3]=a[1];R[6]=a[2];R[1]=b[0];R[4]=b[1];R[7]=b[2];R[2]=c[0];R[5]=c[1];R[8]=c[2];}

function updBall(dt){
  const b=ball;
  b.sqv+=(-190*b.sq-10*b.sqv)*dt;b.sq+=b.sqv*dt;
  b.hopv-=40*dt;b.hop+=b.hopv*dt;if(b.hop<0){b.hop=0;if(b.hopv<-3){b.hopv=-b.hopv*0.3;b.sqv-=4;}else b.hopv=0;}
  if(b.state==='free'){
    if(b.drag){
      const ax=b.tx-b.x,az=b.tz-b.z;
      b.vx=dmp(b.vx,clamp(ax*9,-22,22),14,dt);b.vz=dmp(b.vz,clamp(az*9,-22,22),14,dt);
    }else{
      const f=Math.exp(-1.0*dt);b.vx*=f;b.vz*=f;
      const dx=DIP.x-b.x,dz=DIP.z-b.z,d=hyp(dx,dz);
      if(d<4.5&&d>0.01){const k=(4.5-d)*3.2*dt;b.vx+=dx/d*k;b.vz+=dz/d*k;}
    }

    if(dd<(b.drag?1.9:2.2)){b.state='sink';b.p=0;b.drag=false;b.sx0=b.x;b.sz0=b.z;onEvent('ballIn');if(ptr.kind==='ball')ptr.kind=null;}

  }else if(b.state==='sink'){
    b.p+=dt/0.4;const p=eo(b.p);
    const nx=lerp(b.sx0,DIP.x,p),nz=lerp(b.sz0,DIP.z,p);moveBall(nx-b.x,nz-b.z);b.x=nx;b.z=nz;

  }

}
function ballTop(){return ball.y+BR*(1+Math.min(0,ball.sq)*0.8);}

  else if(c.state==='bal'){

function handPt(h,inner){const sgn=h===0?1:-1;return {x:jug.x+sgn*(inner?0.45:1.2),y:jug.y+2.55,z:jug.z-1.15};}
function clubPattern(c,out){
  const n=jug.n;
  if(n>=3){
    const tau=jug.tau,k=c.slot;
    const nn=Math.floor((tau-k)/3),b=k+3*nn,h=((b%2)+2)%2,p=tau-b;
    const fl=2.35;
    if(p<fl){const f=p/fl;const A=handPt(h,true),B=handPt(1-h,false);
      let hb=1;if(jug.high>=0&&b>=jug.high&&b<jug.high+3)hb=2.2;if(c.hbFlight===b)hb=Math.max(hb,1.9);
      out.x=lerp(A.x,B.x,f);out.z=A.z;out.y=A.y+4*3.0*hb*f*(1-f);out.r=-(h===0?1:-1)*TAU*f*(hb>1.5?2:1);out.fl=b;out.f=f;out.h=1-h;out.hb=hb;}
    else{const f=(p-fl)/(3-fl);const A=handPt(1-h,false),B=handPt(1-h,true);out.x=lerp(A.x,B.x,f);out.z=A.z;out.y=A.y-Math.sin(PI*f)*0.45;out.r=(h===0?-1:1)*0.25*(1-f);out.fl=-1;out.f=0;out.h=1-h;out.hb=1;}
  }else{
    const h=c.slot===0?0:1;const per=1.05;let ph=(jug.tau1/per+(h===1?0.5:0))%1;const fl=0.72;
    const A=handPt(h,false);A.x=jug.x+(h===0?0.95:-0.95);
    if(ph<fl){const f=ph/fl;const cyc=Math.floor(jug.tau1/per+(h===1?0.5:0));let hb=c.hbFlight===cyc?1.8:1;
      out.x=A.x+Math.sin(PI*f)*(h===0?-0.3:0.3);out.z=A.z;out.y=A.y+4*2.4*hb*f*(1-f);out.r=-(h===0?1:-1)*TAU*f;out.fl=cyc;out.f=f;out.h=h;out.hb=hb;}
    else{const f=(ph-fl)/(1-fl);out.x=A.x;out.z=A.z;out.y=A.y-Math.sin(PI*f)*0.35;out.r=0;out.fl=-1;out.f=0;out.h=h;out.hb=1;}
  }
  return out;
}
const _cp={x:0,y:0,z:0,r:0,fl:0,f:0,h:0,hb:1};
function updJug(dt){
  const j=jug;j.t+=dt;j.poke=Math.max(0,j.poke-dt);j.litCd-=dt;
  if(j.state==='enter'){j.p+=dt/0.8;const p=sat(j.p);j.x=lerp(JUG.x+9,JUG.x,p);j.y=lerp(0,1,p)+Math.sin(PI*p)*3.5;j.z=JUG.z;if(j.p>=1){j.state='wait';j.x=JUG.x;j.y=1;SFX.wood(1.2);}}
  const rate=1+S.excite*0.25;
  if(j.n>=3){const prev=j.tau;j.tau+=dt/BEAT*rate;
    if(j.high<0&&!j.highFired&&j.n3T!==undefined&&S.time-j.n3T>2.6){j.high=Math.ceil(j.tau)+1;}
    if(j.high>=0&&!j.highFired&&j.tau>j.high+2+1.2){j.highFired=true;onEvent('highThrow');SFX.yay();}
    if(j.high>=0&&j.highFired&&j.tau>j.high+6)j.high=-1;
    if(Math.floor(prev)!==Math.floor(j.tau))SFX.wood(1.1+((Math.floor(j.tau))%2)*0.15);
  }else if(j.n>0){const prev=j.tau1;j.tau1+=dt*rate;const per=1.05;if(Math.floor(prev/per*2)!==Math.floor(j.tau1/per*2))SFX.wood(1.15);}
  if(S.excite>0&&j.n>=3&&Math.random()<dt*0.25){const c=clubs[(Math.random()*3)|0];if(c.state==='juggle'){clubPattern(c,_cp);if(_cp.fl<0){}}}
}
function updClubs(dt){
  for(const c of clubs){
    if(toolMove(c,dt))continue;
    if(c.state==='home'||c.state==='sel'){c.y=dmp(c.y,c.state==='sel'?1.4+Math.sin(S.time*7+c.i)*0.12:0.22,10,dt);c.rot=dmp(c.rot,c.state==='sel'?0.3*Math.sin(S.time*6):PI/2,8,dt);}
    else if(c.state==='drag'){dragTool(c,dt,0);c.rot=dmp(c.rot,clamp(-c.vx*0.08,-0.8,0.8),8,dt);
      if(hyp(c.x-JUG.x,c.y-(1+2.6))<2.6&&jug.state==='wait'||hyp(c.x-JUG.x,c.y-(1+2.6))<2.6&&jug.n>0)giveClub(c);}
    else if(c.state==='give'){c.p+=dt/0.25;const p=eo(c.p);const hp=handPt(jug.n%2===0?0:1,false);c.x=lerp(c.fx,hp.x,p);c.y=lerp(c.fy,hp.y,p);c.z=lerp(c.fz,hp.z,p);
      if(c.p>=1){c.state='juggle';c.bl=0;c.bfx=c.x;c.bfy=c.y;c.bfz=c.z;c.bfr=c.rot;}}
    else if(c.state==='juggle'){
      clubPattern(c,_cp);
      if(c.bl<1){c.bl=Math.min(1,c.bl+dt/0.35);const q=eio(c.bl);c.x=lerp(c.bfx,_cp.x,q);c.y=lerp(c.bfy,_cp.y,q);c.z=lerp(c.bfz,_cp.z,q);c.rot=lerp(c.bfr,_cp.r,q);}
      else{c.x=_cp.x;c.y=_cp.y;c.z=_cp.z;c.rot=_cp.r;}
      c.fl=_cp.fl;c.f=_cp.f;c.hand=_cp.h;c.hbNow=_cp.hb;
    }else if(c.state==='drop'){
      c.vy-=26*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;
      if(c.y<1.2){c.y=1.2;if(c.vy<-3){c.vy=-c.vy*0.4;c.vx*=0.5;c.vr*=0.5;SFX.pokon(0.8);}else{c.vy=0;c.vx=0;c.vr=0;c.rot=PI/2;}}
      c.dropT-=dt;if(c.dropT<=0){c.state='juggle';c.bl=0;c.bfx=c.x;c.bfy=c.y;c.bfz=c.z;c.bfr=c.rot;jug.pick=0.5;SFX.pick();}
    }
  }
}
function giveClub(c){
  if(c.state==='give'||c.state==='juggle')return;
  c.state='give';c.p=0;c.fx=c.x;c.fy=c.y;c.fz=c.z;c.slot=jug.n;sel=null;if(ptr.kind==='tool'&&ptr.tgt===c)ptr.kind=null;
  SFX.pokon(1);
  clubs.forEach(o=>{if(o!==c&&o.state==='juggle'){o.bl=0;o.bfx=o.x;o.bfy=o.y;o.bfz=o.z;o.bfr=o.rot;}});
  jug.n++;if(jug.n===1){jug.tau1=0;}
  if(jug.n===3){jug.tau=0.0;jug.n3T=S.time;onEvent('clubsAll');SFX.yay();}
  else{clubs.forEach(o=>{if(o.state==='home'){o.wob=1;}});}
}
function boostClub(c){
  if(c.state!=='juggle')return;
  clubPattern(c,_cp);
  if(_cp.fl<0||_cp.f>0.85){SFX.pokon(1.2);c.wob=1;return;}
  if(c.hbFlight===_cp.fl){c.state='drop';c.vx=rnd(-2,2);c.vy=2;c.vr=rnd(-8,8);c.dropT=1.6;c.z=jug.z-1.3;SFX.whoosh(1.5);jug.oops=1;return;}
  c.hbFlight=_cp.fl;SFX.whoosh(1.6);SFX.pokon(1.4);
}
function jugPose(){
  const j=jug,t=S.time,p={};
  if(j.state==='enter'){p.la=2.6;p.ra=2.6;p.ll=0.9;p.rl=0.9;p.mouth=2;return p;}
  if(j.n===0){p.lf=1.2;p.rf=1.2;p.la=0.3+Math.sin(t*3)*0.1;p.ra=0.3-Math.sin(t*3)*0.1;p.mouth=0;
    if(S.act===5){const c=clubs.find(c=>c.state==='drag'||c.state==='sel')||clubs.find(c=>c.state==='home');if(c){p.hy=clamp(Math.atan2(-(c.x-j.x),-(c.z-j.z)),-1,1);p.hx=0.3;}}
    if(hint.nudge>0){p.lf=1.8;p.rf=1.8;p.mouth=1;}
  }else{
    let hy=[2.55,2.55];
    clubs.forEach(c=>{if(c.state==='juggle'&&c.fl<0)hy[c.hand]=c.y-j.y;});
    const reach=[0,0];clubs.forEach(c=>{if(c.state==='juggle'&&c.hbNow>1.5&&c.f>0.55)reach[c.hand]=1;});
    p.rf=1.25+(hy[0]-2.55)*0.6;p.lf=1.25+(hy[1]-2.55)*0.6;p.ra=0.25;p.la=0.25;
    if(reach[0]){p.rf=2.6;p.ra=0.4;}if(reach[1]){p.lf=2.6;p.la=0.4;}
    p.hx=-0.35;p.mouth=j.n>=3?2:0;p.eye=0;p.by=Math.abs(Math.sin(t*4))*0.05;
    if(j.oops>0){p.mouth=1;p.eye=2;}
    if(j.pick>0){p.bx=0.5;}
    const tpending=S.act===5&&clubs.some(c=>c.state==='home'||c.state==='sel'||c.state==='drag');
    if(tpending&&j.n<3){p.ra=0.3;}
  }
  if(j.lit>0&&j.n<3){p.la=2.8;p.ra=2.8;p.mouth=2;}
  if(j.poke>0){p.mouth=1;p.eye=2;}
  return p;
}

function placeSpot(){const s=spot;s.state='snap';s.p=0;s.fx=s.x;s.fy=s.y;s.fz=s.z;sel=null;if(ptr.kind==='tool'&&ptr.tgt===s)ptr.kind=null;SFX.clank();}

function planeOf(o){
  switch(o.kind){case 'uni':return {t:'y',v:1};case 'bar':return {t:'z',v:TRZ};case 'club':return {t:'z',v:JUG.z-1.15};case 'spot':return {t:'z',v:SPOTS.z};}
  return {t:'y',v:1};
}
function ptrWorld(o,sx,sy){const pl=planeOf(o);let w=pl.t==='y'?scrToY(sx,sy,pl.v):scrToZ(sx,sy,pl.v);
  if(pl.t==='y'){w.z=clamp(w.z,-12,13);w.x=clamp(w.x,-18,18);}else{w.y=clamp(w.y,0,26);w.x=clamp(w.x,-18,18);}return w;}
function dragTool(o,dt,lift){
  o.ox=dmp(o.ox||0,0,5,dt);o.oy=dmp(o.oy||0,0,5,dt);o.oz=dmp(o.oz||0,0,5,dt);
  const tx=o.tx+o.ox,ty=o.ty+o.oy,tz=o.tz+o.oz;
  const nx=dmp(o.x,tx,20,dt),ny=dmp(o.y,ty+lift,20,dt),nz=dmp(o.z,tz,20,dt);
  o.vx=(nx-o.x)/dt;o.vy=(ny-o.y)/dt;o.vz=(nz-o.z)/dt;o.x=nx;o.y=ny;o.z=nz;
}
function toolMove(o,dt){
  if(o.state==='pop'){o.p+=dt/0.7;const p=sat(o.p);const h=o.kind==='club'?HOME.club[o.i]:HOME[o.kind];
    o.x=lerp(o.fx,h.x,p);o.z=lerp(o.fz,h.z,p);o.y=lerp(o.fy,o.kind==='club'?0.22:0,p)+Math.sin(PI*p)*5;
    if(o.kind==='club')o.rot=PI/2+TAU*p*2;if(o.kind==='uni')o.wheelV=12;
    if(o.p>=1){o.state='home';o.sq=0.35;SFX.wood(0.9);}return true;}
  if(o.state==='fall'){o.vy-=30*dt;o.y+=o.vy*dt;o.x+=o.vx*dt*0.3;o.z+=o.vz*dt*0.3;const gr=groundAt(o.x,o.z)+(o.kind==='club'?0.22:0);
    if(o.y<=gr){o.y=gr;if(o.vy<-4){o.vy=-o.vy*0.4;SFX.drop();o.sq=0.3;}else{o.state='return';o.p=0;o.fx=o.x;o.fy=o.y;o.fz=o.z;SFX.pick();}}return true;}
  if(o.state==='return'){o.p+=dt/0.65;const p=sat(o.p);const h=o.kind==='club'?HOME.club[o.i]:HOME[o.kind];
    o.x=lerp(o.fx,h.x,eio(p));o.z=lerp(o.fz,h.z,eio(p));o.y=lerp(o.fy,o.kind==='club'?0.22:0,p)+Math.sin(PI*p)*2.5;
    if(o.kind==='club')o.rot=lerp(o.rot,PI/2,p);
    if(o.p>=1){o.state='home';SFX.wood(0.8);}return true;}
  if(o.state==='fly'){o.p+=dt/0.5;const p=eio(o.p);o.x=lerp(o.fx,o.tx,p);o.y=lerp(o.fy,o.ty,p)+Math.sin(PI*sat(o.p))*3;o.z=lerp(o.fz,o.tz,p);
    if(o.p>=1){placeTool(o);}return true;}
  return false;
}
function targetOf(o){
  switch(o.kind){
    case 'uni':return {x:GROOVE.x,y:1,z:GROOVE.z};
    case 'bar':return {x:0,y:pivotY()-TRL,z:TRZ};
    case 'club':return {x:JUG.x,y:1+2.6,z:JUG.z-1.15};
    case 'spot':return {x:MOUNT.x,y:MOUNT.y,z:MOUNT.z};
    case 'ball':return {x:DIP.x,y:1,z:DIP.z};
    case 'rope':return {x:HOOKR.x,y:HOOKR.y,z:ROPEZ};
  }

}
function placeTool(o){
  if(o.kind==='uni')placeUni();else if(o.kind==='bar')placeBar();else if(o.kind==='club')giveClub(o);else if(o.kind==='spot')placeSpot();
}
function releaseTool(o){
  const t=targetOf(o);
  const d=o.kind==='uni'?hyp(o.x-t.x,o.z-t.z):hyp(o.x-t.x,o.y-t.y);
  if(d<3.6){o.state='fly';o.p=0;o.fx=o.x;o.fy=o.y;o.fz=o.z;o.tx=t.x;o.ty=t.y;o.tz=t.z;return;}
  o.state='fall';o.vy=Math.min(o.vy,2);

      if(a.spray>0){a.spray-=dt;if(a.tip&&Math.random()<dt*40)for(let i=0;i<3;i++)spawnConf(a.tip[0],a.tip[1],a.tip[2],rnd(-3,3),rnd(7,13),rnd(-3,1));}}

const CONFC=['#ffcf33','#ff4a5a','#3d7cf5','#ff7ebd','#3ad9e6','#ffffff'];
const CONFD=['#d99a12','#c22a3a','#2550b8','#d24f8f','#1fa3b0','#d8dde8'];

function buildHits(){

  else if(clown.state==='bal'||clown.state==='flip')addHit(ball,'ballP',clown.x,clown.y+2.2,clown.z,1.6,2);
  // ロープ

  if(rope.state==='on'){for(let i=1;i<10;i++){const x=lerp(HOOKL.x,HOOKR.x,i/10);addHit(rope,'pluck',x,ropeY(x),ROPEZ,0.8,2,26);}}
  if(walker.state!=='hidden'&&walker.state!=='enter')addHit(walker,'pokeW',walker.x,walker.y+2.2,walker.z,1.5,1);

  if(rider.state==='ride')addHit(rider,'poke',uni.x,uni.y+3.6,uni.z,1.2,1);
  // ブランコ
  const b=trap.bar;
  if(['home','sel'].includes(b.state))addHit(b,live(4)?'tool':'wig',b.x,b.y+0.3,b.z,2.2,S.act===4?3:1,S.act===4?60:40);

  // クラブ
  clubs.forEach(c=>{if(['home','sel'].includes(c.state))addHit(c,live(5)?'tool':'wig',c.x,c.y+0.3,c.z,1.3,S.act===5?3:1,S.act===5?46:30);
    if(c.state==='juggle')addHit(c,'club',c.x,c.y,c.z,1.0,2,38);});
  if(jug.state!=='hidden'&&jug.state!=='enter')addHit(jug,'poke',jug.x,jug.y+2,jug.z,1.5,1);
  // ライト
  if(['home','sel'].includes(spot.state))addHit(spot,live(6)?'tool':'wig',spot.x,spot.y+0.9,spot.z,2.2,S.act===6?3:1,S.act===6?60:40);
  if(spot.state==='mounted'&&S.phase==='free')addHit(spot,'aim',spot.x,spot.y,spot.z,2.2,2,56);

  crates.forEach(c=>{if(c.state==='closed')addHit(c,'crate',c.x,c.h/2,c.z,1.5,0);});

  animals.forEach(a=>{if(a.state==='sit')addHit(a,'animal',a.x,a.y+1.4*a.sc,a.z,1.3*a.sc,1,30);});
}
function pickHit(x,y){

}

function updCurtain(dt){
  if(S.phase==='free'&&S.curtain===0){S.freeIdle+=dt;if(ptr.id!==null)S.freeIdle=0;if(S.freeIdle>45){S.curtain=0.0001;S.curtainDir=1;SFX.curtain();}}
  if(S.curtainDir===1){S.curtain=Math.min(1,S.curtain+dt/1.3);if(S.curtain>=1){S.curtainDir=0;S.holdT=0.6;}}
  else if(S.curtainDir===0&&S.curtain>=1){S.holdT-=dt;if(S.holdT<=0){const keep=true;init();cam.init=true;S.curtain=1;S.curtainDir=-1;SFX.curtain();}}
  else if(S.curtainDir===-1){S.curtain=Math.max(0,S.curtain-dt/1.3);if(S.curtain<=0){S.curtain=0;S.curtainDir=0;}}
}
function drawCurtain(){
  if(S.curtain<=0)return;
  const p=eio(S.curtain);const h=VH*p;const n=Math.ceil(VW/34);const w=VW/n;
  for(let i=0;i<n;i++){const wave=Math.sin(i*0.9+S.time*2)*6*p;const hh=h+wave;
    ctx.fillStyle=i%2?'#d8343e':'#ef4a52';ctx.fillRect(i*w,0,w+1,hh);
    ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(i*w+w*0.75,0,w*0.25,hh);}
  ctx.fillStyle='#ffcb3a';ctx.fillRect(0,h-10,VW,10);
  for(let i=0;i<n;i++){ctx.fillStyle='#e29a18';ctx.fillRect(i*w+w*0.3,h-4,w*0.4,10);}
}

/* =========================================================
   カメラ
   ========================================================= */
const ROI={
  land:[[-12.5,14,-6.2,24],[-12.5,14.5,-6.2,31],[-14,16,-6.2,33],[-18,20,-6.2,34],[-19,21,-6.2,37],[-19.5,21.5,-6.2,38],[-20,22,-6.5,42]],
  port:[[-9.8,11.6,-6.2,30],[-9.8,11.8,-6.2,31],[-10.5,12.5,-6.2,33],[-12.5,14.5,-6.2,34],[-13,15,-6.2,37],[-13.5,15.5,-6.2,38],[-14,16,-6.5,42]]
};
function updCam(dt){
  const land=VW>=VH*1.0;
  let idx=S.act-1;if(S.phase==='free'||S.finaleT>2)idx=6;
  if(S.act>=3&&tent.sideT>=0&&idx<3)idx=3;
  const r=(land?ROI.land:ROI.port)[idx];
  // 注目点
  let fa=(r[0]+r[1])/2,fb=(r[2]+r[3])/2;
  if(S.act===1&&S.phase==='play'){fa=ball.x+SK*ball.z;fb=ball.y+DPF*ball.z;}
  const k=cam.init?1000:1.6;
  cam.a0=dmp(cam.a0,r[0],k,dt);cam.a1=dmp(cam.a1,r[1],k,dt);cam.b0=dmp(cam.b0,r[2],k,dt);cam.b1=dmp(cam.b1,r[3],k,dt);
  cam.fa=dmp(cam.fa,fa,k,dt);cam.fb=dmp(cam.fb,fb,k,dt);cam.init=false;
  const m=8;
  const vx=SAFE.l+m,vy=SAFE.t+m,vw=VW-SAFE.l-SAFE.r-2*m,vh=VH-SAFE.t-SAFE.b-2*m;
  const s=Math.min(vw/(cam.a1-cam.a0),vh/(cam.b1-cam.b0));
  cam.s=s;
  let ox=vx+vw/2-cam.fa*s;{const lo=vx-cam.a0*s,hi=vx+vw-cam.a1*s;ox=lo<=hi?clamp(ox,lo,hi):(lo+hi)/2;}
  let oy=vy+vh/2+cam.fb*s;{const lo=vy+cam.b1*s,hi=vy+vh+cam.b0*s;oy=lo<=hi?clamp(oy,lo,hi):(lo+hi)/2;}
  // 縦長は少し下寄りに
  cam.ox=ox;cam.oy=oy;
  if(S.shake>0){S.shake=Math.max(0,S.shake-dt);S.shakeY=Math.sin(S.time*60)*S.shake*0.35;}else S.shakeY=0;
}

/* =========================================================
   ループ
   ========================================================= */
function resize(){
  VW=Math.max(1,window.innerWidth);VH=Math.max(1,window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1,DPRCAP);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  const st=getComputedStyle(document.getElementById('sa'));
  SAFE.t=parseFloat(st.paddingTop)||0;SAFE.r=parseFloat(st.paddingRight)||0;SAFE.b=parseFloat(st.paddingBottom)||0;SAFE.l=parseFloat(st.paddingLeft)||0;
  cam.init=true;skyKey='';
}
window.addEventListener('resize',()=>{resize();cancelAll();});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{resize();cancelAll();},120);});

function update(dt){
  S.time+=dt;S.actT+=dt;if(S.finaleT>=0)S.finaleT+=dt;
  updTweens(dt);updEv();
  updBall(dt);updClown(dt);updRope(dt);updWalker(dt);updUni(dt);updRider(dt);updTrap(dt);updArtist(dt);updJug(dt);updClubs(dt);updSpot(dt);
  updAnimals(dt);updCrates(dt);updConf(dt);updLit(dt);updHint(dt);updCurtain(dt);
  if(tent.sideT>=0){const prev=tent.sideT;tent.sideT+=dt;SIDEBLK.forEach((b,i)=>{if(prev<b.t+0.3&&tent.sideT>=b.t+0.3&&i%2===0)SFX.block(b.r*2+b.k);});}
  if(S.act>=2&&tent.bulbs<6&&S.act<6)tent.bulbs=3+(S.act-1)*2;
  updCam(dt);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.lineJoin='round';ctx.lineWidth=Math.max(0.6,cam.s*0.03);
  pI=0;gI=0;groups.length=0;
  drawBG();
  ctx.lineWidth=Math.max(0.6,cam.s*0.03);
  drawStage();
  drawDecals();
  drawShadows();
  drawGlow();
  buildTent();buildBleachers();buildRopeRig();buildRope();buildWalker();buildCrates();
  buildBall();buildClown();buildUni();buildRider();buildTrap();buildJug();buildSpot();
  buildRoof();
  drawGroups();
  drawBeam();
  drawConf();
  buildHits();
  drawHand();
  drawCurtain();
}
let last=0,running=true,rafId=0,slowT=0,fastT=0;
function frame(ts){
  rafId=0;if(!running)return;
  let dt=last?(ts-last)/1000:0.016;last=ts;
  const raw=dt;dt=clamp(dt,0.001,0.05);
  try{update(dt);render();musicTick();}catch(err){if(!frame.warned){frame.warned=true;console.warn(err);}}
  // 低速端末の自動調整
  if(raw>0.026){slowT+=raw;fastT=0;}else{fastT+=raw;slowT=Math.max(0,slowT-raw*0.5);}
  if(slowT>2&&QUAL.lvl<2){QUAL.lvl++;slowT=0;if(QUAL.lvl===1){QUAL.p=200;conf.max=200;}else{QUAL.p=120;conf.max=120;DPRCAP=1.5;STROKE=false;resize();}}
  rafId=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;cancelAll();if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
  else{running=true;last=0;if(AC&&AC.state!=='running')AC.resume().catch(()=>{});if(!rafId)rafId=requestAnimationFrame(frame);}
});
window.addEventListener('unhandledrejection',e=>{e.preventDefault();});

init();resize();
rafId=requestAnimationFrame(frame);

/* 自動テスト用の読み取り口（画面には何も表示しない） */
window.__circus={
  get state(){return {act:S.act,phase:S.phase,ball:ball.state,rope:rope.state,uni:uni.state,bar:trap.bar.state,clubs:clubs.map(c=>c.state),spot:spot.state,animals:animals.length,W:tent.W,pole:tent.pole,deco:tent.deco,roofOpen:tent.roofOpen,conf:conf.n,excite:S.excite,curtain:S.curtain};},
  screen(name){
    const P=(x,y,z)=>{prj(x,y,z);return {x:PX,y:PY};};
    switch(name){
      case 'ball':return P(ball.x,ball.y,ball.z);
      case 'dip':return P(DIP.x,1+BR,DIP.z);
      case 'ropeTip':return P(rope.tx,rope.ty,ROPEZ);
      case 'hookR':return P(HOOKR.x,HOOKR.y,ROPEZ);
      case 'uni':return P(uni.x,uni.y+1.2,uni.z);
      case 'groove':return P(GROOVE.x,1,GROOVE.z);
      case 'bar':return P(trap.bar.x,trap.bar.y+0.3,trap.bar.z);
      case 'barTarget':return P(0,pivotY()-TRL,TRZ);
      case 'club0':case 'club1':case 'club2':{const c=clubs[+name[4]];return P(c.x,c.y+0.3,c.z);}
      case 'hands':return P(JUG.x,1+2.6,JUG.z-1.15);
      case 'spot':return P(spot.x,spot.y+0.9,spot.z);
      case 'mount':return P(MOUNT.x,MOUNT.y,MOUNT.z);
      case 'barHung':{const b=barPos();return P(b.x,b.y,TRZ);}
      case 'rope':return P(0,ropeY(0),ROPEZ);
      case 'uniWheel':return P(uni.x,uni.y+0.8,uni.z);
      case 'clubJ0':case 'clubJ1':case 'clubJ2':{const c=clubs[+name[5]];return P(c.x,c.y,c.z);}
    }
    return null;
  }
};
})();
