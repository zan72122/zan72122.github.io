<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,v)=>{let t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const eOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const eIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eBack=t=>{t=clamp(t,0,1);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const wrapA=a=>{a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI;};
const hyp=Math.hypot;
const h1=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function css(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:+a.toFixed(3))+')';}

// ---------- random ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry((Date.now()^0x5f3759df)>>>0);
const rnd=(a,b)=>a+(b-a)*rng();
const pick=a=>a[Math.floor(rng()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ---------- inks ----------
const C={
 coral:[238,96,86], coralL:[248,154,132], lemon:[255,212,70], lemonL:[255,234,150], turq:[28,168,178], turqL:[124,214,208],
 cream:[251,241,216], creamD:[236,218,182], ink:[72,42,74], indigo:[32,32,88], indigoD:[18,18,52], purple:[86,54,128],
 mint:[120,255,198], paleY:[255,244,150], peach:[255,150,196], gold:[238,182,60], goldD:[180,116,36], goldL:[255,228,132],
 pink:[248,138,170], white:[255,252,244], lilac:[186,170,255], leaf:[96,178,104], orange:[250,140,60], brown:[196,120,70]
};
let TK=0,TW=0; // ambient night / warm tint
function tn(c){const k=TK;let r=c[0]*(1-k+k*0.36),g=c[1]*(1-k+k*0.31),b=c[2]*(1-k+k*0.62)+k*20;
 if(TW>0){r+=(255-r)*TW*0.16;g+=(150-g)*TW*0.08;b+=(150-b)*TW*0.05;}return [r,g,b];}
const tc=(c,a)=>css(tn(c),a);

// ---------- glow sprites (stippled phosphor ink) ----------
const glowCache={};
function glowSprite(c,soft){
 const key=(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+(soft?'s':'');
 let s=glowCache[key]; if(s) return s;
 const N=96; s=document.createElement('canvas'); s.width=s.height=N; const g=s.getContext('2d');
 const gr=g.createRadialGradient(N/2,N/2,0,N/2,N/2,N/2);
 gr.addColorStop(0,css(c,0.5)); gr.addColorStop(0.3,css(c,0.22)); gr.addColorStop(0.7,css(c,0.06)); gr.addColorStop(1,css(c,0));
 g.fillStyle=gr; g.fillRect(0,0,N,N);
 if(!soft) for(let i=0;i<300;i++){const rr=Math.pow(Math.random(),1.5)*N*0.47,a=Math.random()*TAU;
  g.fillStyle=css(mixc(c,[255,255,255],Math.random()*0.6),(1-rr/(N*0.5))*0.85);
  g.fillRect(N/2+Math.cos(a)*rr,N/2+Math.sin(a)*rr,1.3,1.3);}
 glowCache[key]=s; return s;
}
function glow(c,x,y,r,a){ if(a<=0.01||r<=0.5) return; const sp=glowSprite(c,r*DPR*S.camZ>110);
 ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(1,a); ctx.drawImage(sp,x-r,y-r,r*2,r*2);
 ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }

// ---------- paper grain ----------
let grainPat=null, speckPat=null;
function makeGrain(){
 const N=180;
 const c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d');
 const id=g.createImageData(N,N), d=id.data;
 for(let i=0;i<N*N;i++){const v=Math.random();const k=v<0.05?170+Math.random()*50:(v<0.3?232+Math.random()*12:244+Math.random()*11);
  d[i*4]=k;d[i*4+1]=k*0.985;d[i*4+2]=k*0.95;d[i*4+3]=255;}
 g.putImageData(id,0,0);
 g.lineWidth=0.7;
 for(let i=0;i<60;i++){g.strokeStyle='rgba(150,118,92,'+(0.07+Math.random()*0.12).toFixed(2)+')';g.beginPath();let x=Math.random()*N,y=Math.random()*N;g.moveTo(x,y);
  for(let k=0;k<4;k++){x+=(Math.random()-.5)*16;y+=(Math.random()-.5)*16;g.lineTo(x,y);}g.stroke();}
 grainPat=ctx.createPattern(c,'repeat');
 const c2=document.createElement('canvas'); c2.width=c2.height=N; const g2=c2.getContext('2d');
 for(let i=0;i<220;i++){g2.fillStyle='rgba(255,250,220,'+(0.15+Math.random()*0.5).toFixed(2)+')';g2.fillRect(Math.random()*N,Math.random()*N,1,1);}
 speckPat=ctx.createPattern(c2,'repeat');
}

// ---------- hand drawn shapes ----------
function blob(cx,cy,rx,ry,seed,wob,n){
 n=n||12; const P=[];
 for(let i=0;i<n;i++){const a=i/n*TAU;const k=1+(h1(seed*13.7+i*1.37)-0.5)*wob;P.push(cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k);}
 ctx.beginPath();
 for(let i=0;i<n;i++){const j=(i+1)%n;const mx=(P[i*2]+P[j*2])/2,my=(P[i*2+1]+P[j*2+1])/2;
  if(i===0) ctx.moveTo(mx,my); else ctx.quadraticCurveTo(P[i*2],P[i*2+1],mx,my);}
 ctx.quadraticCurveTo(P[0],P[1],(P[0]+P[2])/2,(P[1]+P[3])/2); ctx.closePath();
}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot||0,0,TAU);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.01,r),0,TAU);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function starPath(x,y,r,rot,pts){pts=pts||5;ctx.beginPath();for(let i=0;i<pts*2;i++){const a=rot+i*PI/pts-PI/2;const rr=i%2?r*0.48:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
// riso: under-plate offset (misregistration) then main plate
let MISX=1.4,MISY=1;
function riso(path,main,under,ua){
 ctx.save();ctx.translate(MISX,MISY);path();ctx.globalAlpha=ua===undefined?0.9:ua;ctx.fillStyle=under;ctx.fill();ctx.restore();
 path();ctx.fillStyle=main;ctx.fill();
}

// ---------- layout ----------
let W=390,H=844,DPR=1;
const L={};
const SAFE={t:0,b:0,l:0,r:0};
function readSafe(){try{const cs=getComputedStyle(document.getElementById('sa'));SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;SAFE.r=parseFloat(cs.paddingRight)||0;}catch(e){}}
let houses=[], stars=[], clouds=[];
function layout(){
 const vv=window.visualViewport;
 W=Math.max(200,Math.round(window.innerWidth||(vv&&vv.width)||390));
 H=Math.max(200,Math.round(window.innerHeight||(vv&&vv.height)||844));
 DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
 readSafe();
 const portrait=H>=W*1.05;
 const top=SAFE.t, bot=H-SAFE.b, uh=bot-top;
 const u=portrait?Math.min(W/390,uh/760):Math.min(W/1000,uh/720);
 L.portrait=portrait; L.u=u; L.top=top; L.bot=bot;
 MISX=1.5*u; MISY=1.05*u;
 if(portrait){
  L.R=Math.min(W*0.35,uh*0.165);
  L.wx=W/2; L.wy=Math.max(top+uh*0.40,top+L.R*1.32+8);
  L.shoreTop=top+uh*0.56; L.standY=top+uh*0.655; L.foodY=top+uh*0.728; L.lakeTop=top+uh*0.768;
  L.spacing=Math.min(W*0.29,150*u);
  L.bx=W*0.19; L.ZP=0.8;
  L.dockX0=-30*u; L.dockX1=W*0.2;
  L.platX=W*0.7;
 } else {
  L.R=Math.min(uh*0.235,W*0.2);
  L.wx=W/2; L.wy=Math.max(top+uh*0.37,top+L.R*1.32+8);
  L.shoreTop=top+uh*0.59; L.standY=top+uh*0.685; L.foodY=top+uh*0.752; L.lakeTop=top+uh*0.792;
  L.spacing=Math.min(W*0.15,190*u);
  L.bx=W*0.19; L.ZP=0.82;
  L.dockX0=W*0.0-20*u; L.dockX1=W*0.16;
  L.platX=W*0.64;
 }
 L.cs=portrait?1.24:1.15;
 L.bw=118*u; L.bh=120*u; L.bBase=L.shoreTop+30*u;
 L.doorX=L.bx+L.bw*0.31; L.doorY=L.bBase;
 L.tx=W-L.bx; L.tw=116*u; L.th=104*u; L.tBase=L.bBase;
 L.dockY=L.lakeTop+10*u;
 L.platY0=L.lakeTop+(H-L.lakeTop)*0.5;
 // party view (zoomed out)
 const z=L.ZP;
 L.pX0=W/2-(W/2)/z; L.pX1=W/2+(W/2)/z; L.pY1=top+(H-top)/z;
 L.platYP=L.lakeTop+(L.pY1-L.lakeTop)*0.44;
 L.platXP=W/2;
 genTown();
}
function genTown(){
 const r2=mulberry(1234+S.cycle*77);
 houses=[]; const u=L.u;
 let x=-W*0.3; const pal=[C.coral,C.turq,C.lemon,C.cream,C.pink,C.turqL];
 let k=0;
 while(x<W*1.3){
  const w=(30+r2()*26)*u, h=(30+r2()*40)*u;
  const cx=x+w/2;
  // keep the shops' spots a bit clearer
  const near=Math.abs(cx-L.bx)<L.bw*0.5||Math.abs(cx-L.tx)<L.tw*0.5;
  const hh=near?h*0.75:h;
  const wins=[]; const cols=w>44*u?2:1, rows=hh>48*u?2:1;
  for(let ry=0;ry<rows;ry++)for(let cx2=0;cx2<cols;cx2++) wins.push({x:(cols===1?0.5:(cx2?0.7:0.3)),y:(rows===1?0.45:(ry?0.68:0.3)),lit:0,th:0});
  houses.push({x,w,h:hh,c:pal[Math.floor(r2()*pal.length)],roof:r2()<0.6?0:(r2()<0.5?1:2),rc:pal[Math.floor(r2()*pal.length)],wins,seed:k*7+3});
  x+=w+(2+r2()*10)*u; k++;
 }
 // window light order: left to right
 let all=[]; houses.forEach(h=>h.wins.forEach(wn=>{wn.gx=h.x+wn.x*h.w; all.push(wn);}));
 all.sort((a,b)=>a.gx-b.gx); all.forEach((wn,i)=>{wn.th=0.5+0.36*(i/Math.max(1,all.length-1));});
 stars=[]; for(let i=0;i<46;i++) stars.push({x:r2(),y:Math.pow(r2(),1.2),s:0.6+r2()*1.4,p:r2()*TAU,c:[C.paleY,C.mint,C.peach,C.white][i%4]});
 clouds=[]; for(let i=0;i<3;i++) clouds.push({x:r2(),y:0.08+r2()*0.3,s:0.7+r2()*0.6,seed:i*11+5,sp:0.004+r2()*0.006});
}

// ---------- audio (Web Audio synthesis) ----------
const A={ctx:null};
function audioUnlock(){
 try{
  const ua=navigator.userActivation; if(ua&&!ua.isActive&&(!A.ctx||A.ctx.state!=='running')) return;
  if(!A.ctx){
   const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
   const c=new AC(); A.ctx=c;
   A.master=c.createGain(); A.master.gain.value=0.7;
   const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6800; lp.Q.value=0.5;
   const comp=c.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=14; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.25;
   A.master.connect(lp); lp.connect(comp); comp.connect(c.destination);
   A.sfx=c.createGain(); A.sfx.gain.value=1; A.sfx.connect(A.master);
   A.music=c.createGain(); A.music.gain.value=0.5; A.music.connect(A.master);
   A.bus={}; ['day','night','party'].forEach(k=>{const g=c.createGain();g.gain.value=0;g.connect(A.music);A.bus[k]=g;});
   const len=Math.floor(c.sampleRate*0.8), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
   for(let i=0;i<len;i++) d[i]=Math.random()*2-1; A.noise=b;
   A.next=c.currentTime+0.15; A.step=0; A.lvl={day:0,night:0,party:0};
   const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
  }
  if(A.ctx.state!=='running') A.ctx.resume().catch(()=>{});
 }catch(e){}
}
const live=()=>!!(A.ctx&&A.ctx.state==='running');
const mf=m=>440*Math.pow(2,(m-69)/12);
const PENTA=[0,2,4,7,9];
const pm=(i,base)=>{i=Math.round(i);const o=Math.floor(i/5);return (base||72)+o*12+PENTA[((i%5)+5)%5];};
let voices=0;
function vo(type,f,t,dec,v,dest,att,f2){
 if(voices>48||f>9000) return; voices++;
 const c=A.ctx; const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
 att=att||0.004; if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+att+dec*0.7);
 const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);
 o.connect(g); g.connect(dest||A.sfx); o.start(t); o.stop(t+att+dec+0.05);
 o.onended=()=>{voices--;try{g.disconnect();}catch(e){}};
 return o;
}
function vib(f,t,dec,v,rate,depth,dest){
 if(voices>48) return; voices++;
 const c=A.ctx,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();
 o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.8,t+dec);
 l.frequency.setValueAtTime(rate,t); l.frequency.linearRampToValueAtTime(rate*0.5,t+dec); lg.gain.setValueAtTime(depth,t); lg.gain.linearRampToValueAtTime(0,t+dec);
 l.connect(lg); lg.connect(o.frequency);
 g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
 o.connect(g); g.connect(dest||A.sfx); o.start(t); l.start(t); o.stop(t+dec+0.05); l.stop(t+dec+0.05);
 o.onended=()=>{voices--;};
}
function nz(t,dec,v,type,freq,q,dest,f2){
 if(voices>48) return; voices++;
 const c=A.ctx,s=c.createBufferSource(); s.buffer=A.noise; s.loop=true;
 const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dec); f.Q.value=q;
 const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
 s.connect(f); f.connect(g); g.connect(dest||A.sfx); s.start(t,Math.random()*0.4); s.stop(t+dec+0.05);
 s.onended=()=>{voices--;};
}
const I={
 xylo(f,t,v,d){vo('sine',f,t,0.34,v,d,0.003);vo('sine',f*3.93,t,0.07,v*0.28,d,0.002);},
 bell(f,t,v,d){vo('sine',f,t,1.0,v,d,0.004);vo('sine',f*2.76,t,0.45,v*0.26,d,0.003);vo('sine',f*5.4,t,0.2,v*0.08,d,0.002);},
 glass(f,t,v,d){vo('sine',f,t,1.3,v,d,0.012);vo('sine',f*2.004,t,0.7,v*0.22,d,0.01);vo('triangle',f*3,t,0.35,v*0.05,d,0.01);},
 mbox(f,t,v,d){vo('sine',f,t,0.85,v,d,0.003);vo('sine',f*4.01,t,0.16,v*0.16,d,0.002);},
 wood(t,v,d){nz(t,0.045,v,'bandpass',1900,5,d);vo('sine',820,t,0.045,v*0.5,d,0.002);},
 bass(f,t,v,d){vo('triangle',f,t,0.3,v,d,0.006);vo('sine',f*2,t,0.12,v*0.3,d,0.004);},
 clap(t,v,d){nz(t,0.08,v,'bandpass',1500,1.1,d);nz(t+0.014,0.06,v*0.6,'bandpass',1700,1.3,d);},
 pad(f,t,v,d,dur){if(voices>48)return;voices++;const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+dur*0.4);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(d);o.start(t);o.stop(t+dur+0.05);o.onended=()=>{voices--;};}
};
const now=()=>A.ctx.currentTime+0.005;
const SFX={
 wheelTap(k){if(!live())return;const t=now();I.bell(mf(76+k*2),t,0.13);I.bell(mf(83+k*2),t+0.025,0.05);nz(t,0.05,0.04,'highpass',3200,0.7);},
 grab(){if(!live())return;const t=now();vo('sine',mf(88),t,0.12,0.03);},
 tick(idx,speed,n){if(!live())return;const t=now();const m=pm(idx,72);const v=0.035+Math.min(speed,10)*0.009;
  if(n<0.7) I.xylo(mf(m),t,v*(1-n*0.8)); if(n>0.3) I.glass(mf(m+12),t,v*0.55*n);},
 flip(night){if(!live())return;const t=now();const seq=night?[79,76,72,67]:[67,72,76,79];
  seq.forEach((m,i)=>night?I.glass(mf(m),t+i*0.09,0.06):I.xylo(mf(m),t+i*0.08,0.08));},
 paku(f,combo){if(!live())return;const t=now();const k=Math.pow(2,Math.min(combo,7)*2/12);
  vo('sine',f*1.5*k,t,0.09,0.16,null,0.002,f*0.55*k);nz(t,0.04,0.07,'bandpass',2200*k,2);},
 chew(kind,k){if(!live())return;const t=now();
  if(kind==='toast'){nz(t,0.05,0.07,'bandpass',2600,3);nz(t+0.05,0.04,0.05,'bandpass',3200,3);}

  else {vo('sine',300*k,t,0.1,0.07,null,0.01,240*k);nz(t,0.06,0.03,'lowpass',900,1);}},

// music: 8th-note scheduler (lookahead), day/night/party buses crossfaded
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
let melo=0;
function music(){
 if(!live()) return;
 const c=A.ctx, t0=c.currentTime;
 const silent=S.P&&S.P.t<0.9&&!S.P.ending;
 const pres=partyPres();
 const tg={day:silent?0:(1-S.n)*(1-pres)*0.9,night:silent?0:S.n*(1-pres)*0.9,party:silent?0:pres*(S.P&&S.P.t>4.2?1:0)};
 for(const k in tg){ if(Math.abs(A.lvl[k]-tg[k])>0.01){A.lvl[k]=tg[k];A.bus[k].gain.setTargetAtTime(tg[k],t0,silent?0.08:0.6);} }
 const sd=60/100/2;
 if(A.next<t0-0.3) A.next=t0+0.05;
 let n=0;
 while(A.next<t0+0.16&&n<4){step(A.step,A.next);A.next+=sd;A.step++;n++;}
}
function step(i,t){
 const s=i%8, bar=Math.floor(i/8)%4, ch=CH[bar];
 const B=A.bus;
 if(A.lvl.day>0.03){
  if(s%2===0) I.xylo(mf(ch[(s/2)%3]+12),t,0.05,B.day);
  if(s===3||s===7) I.wood(t,0.035,B.day);
  if(s===5&&bar%2===0) I.xylo(mf(ch[2]+24),t,0.025,B.day);
 }
 if(A.lvl.night>0.03){
  if(s===0||s===3||s===6) I.mbox(mf(ch[(s/3)%3|0]+24),t,0.045,B.night);
  if(s===0) I.pad(mf(ch[0]),t,0.03,B.night,2.2);
 }
 if(A.lvl.party>0.03){
  if(s===0||s===4) I.bass(mf(ch[0]-12),t,0.11,B.party);
  if(s===6) I.bass(mf(ch[1]-12),t,0.07,B.party);
  if(s===2||s===6) I.clap(t,0.045,B.party);
  if(s%2===1) I.wood(t,0.02,B.party);
  melo+= (Math.random()<0.5?1:-1)*(Math.random()<0.3?2:1); melo=clamp(melo,0,9);
  if(s!==7) I.xylo(mf(pm(melo,72)),t,0.045,B.party);
  if(s===0||s===5) I.glass(mf(pm(melo+5,72)),t,0.03,B.party);
  if(S.P&&S.P.climax&&s%2===0) I.bell(mf(pm(melo+7,72)),t,0.025,B.party);
 }
}

  if(sp>40*u&&rng()<dt*10) addP({k:'drop',x:b.x-b.face*20*u,y:b.y+2*u,vx:-b.vx*0.1+rnd(-20,20)*u,vy:-rnd(40,90)*u,g:400*u,dr:0.5,max:0.7,s:2*u,c:C.white,ty:b.y+6*u,rot:0,vr:0});

  const dx=B1.x-A1.x,dy=(B1.y-A1.y)*1.8,dd=hyp(dx,dy);

 // ripples reaching boats make residents hop

}

function updateWorld(dt){
 const u=L.u;
 for(let i=gifts.length-1;i>=0;i--){const g=gifts[i];g.t+=dt;const k=clamp(g.t/g.dur,0,1);const tp=g.plat>=0?decoPos({plat:g.plat}):lakeXY(g.nx,g.ny);
  g.x=lerp(g.x0,tp.x,k);g.y=lerp(g.y0,tp.y,k)-Math.sin(k*PI)*90*u;g.rot+=dt*8;
  if(k>=1){g.x=tp.x;g.y=tp.y;landGift(g);gifts.splice(i,1);}}
 for(let i=decos.length-1;i>=0;i--){const d=decos[i];d.vis=Math.min(1,d.vis+dt*2.5);
  d.swV+=(-d.sw*40-d.swV*3)*dt;d.sw+=d.swV*dt;
  const fp=decoPos(d);
  const tgt=d.anchor?1:0;d.atr+=(tgt-d.atr)*Math.min(1,dt*2.2);
  if(d.atr>0.01&&d.anchor){const ap=anchorPos(d);d.x=lerp(fp.x,ap.x,d.atr);d.y=lerp(fp.y,ap.y,d.atr);}
  else if(d.atr>0.01&&d.lastA){d.x=lerp(fp.x,d.lastA.x,d.atr);d.y=lerp(fp.y,d.lastA.y,d.atr);}
  else {d.x=fp.x;d.y=fp.y;}
  if(d.anchor) d.lastA={x:d.x,y:d.y};
  if(d.fading){d.fade+=dt;if(d.fade>1.2)decos.splice(i,1);}}
 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.life+=dt;r.r+=r.vr*dt*(1-0.5*r.r/r.max);if(r.r>=r.max*0.98)ripples.splice(i,1);}
 for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>0.7)rings.splice(i,1);}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;
  if(p.life>p.max){parts.splice(i,1);continue;}
  p.vy+=p.g*dt;const dr=Math.exp(-(p.dr||0)*dt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  if(p.k==='feather'){p.vx+=Math.sin(p.life*5+p.rot)*60*u*dt;p.vy=Math.min(p.vy,40*u);}
  if(p.k==='drop'&&p.ty&&p.y>p.ty&&p.vy>0){if(S.n>0.4||S.P) addRipple(p.x,p.ty,{max:22*u,vr:30*u,c:p.c,glow:1,w:1.2});parts.splice(i,1);}}
 // ambient phosphor ripples at night
 S.ambT-=dt;if(S.ambT<0){S.ambT=0.8+rng()*1.4;if(S.n>0.55){const p=lakeXY(rng(),rng());addRipple(p.x,p.y,{max:rnd(26,46)*u,vr:26*u,c:pick([C.mint,C.paleY,C.peach]),glow:1,w:1.2});}}
 // rare golden fish
 S.fishT-=dt;if(!S.fish&&S.fishT<0){S.fishT=(S.P?8:16)+rng()*14;if(rng()<(S.P?0.55:0.3)){const p=lakeXY(0.2+rng()*0.6,0.3+rng()*0.5);S.fish={x:p.x,y:p.y,t:0,dir:rng()<.5?-1:1,special:rng()<0.15};addRipple(p.x,p.y,{max:30*u,vr:40*u,c:C.goldL,glow:S.n});}}
 if(S.fish){S.fish.t+=dt;if(S.fish.t>1.1){addRipple(S.fish.x+S.fish.dir*50*u,S.fish.y,{max:34*u,vr:40*u,c:C.goldL,glow:S.n});burst(S.fish.x+S.fish.dir*50*u,S.fish.y,5,{k:'drop',c:C.goldL,sp:80,up:100,g:500,max:0.6,s:2.4});S.fish=null;}}
}

function computeHint(){
 const u=L.u;
 if(S.phase==='tie') return null;
 if(S.P&&!S.P.ending){
  if(S.P.t<6.5) return null;
  if(!S.P.pushed){const b=boats[0];if(b)return {kind:'drag',x:b.x,y:b.y-6*u,x2:b.x+(b.x<W/2?1:-1)*110*u,y2:b.y+10*u,r:44*u};}
  if(!S.P.tapped){const bx=lakeBox();return {kind:'tap',x:lerp(bx.x0,bx.x1,0.3),y:lerp(L.lakeTop,bx.y1,0.6),r:30*u};}
  if(S.P.t>70&&!S.P.climax) return {kind:'rotate',x:L.wx,y:L.wy,r:L.R*1.1};
  return null;
 }
 if(S.ribbonDone){return {kind:'rotate',x:L.wx,y:L.wy,r:L.R*1.1,dir:Math.sign(ribbonDelta())||1,rib:true};}
 if(!S.learned) return {kind:S.anyInput?'rotate':'tap',x:L.wx,y:L.wy,r:L.R*0.3,dir:1};
 if(!S.isNight){
  if(S.fedPhase<2&&ducks.every(d=>awake(d))){const f=foods.find(foodReady);if(f){const d=ducks[f.i];return {kind:'drag',x:f.x,y:f.y,x2:d.mx,y2:d.my,r:34*u,food:f};}}
 } else {
  if(S.fedPhase<2&&flies.every(f=>flyFree(f))){const j=jellies.find(jellyReady);if(j){const f=flies[j.i];return {kind:'drag',x:j.x,y:j.y-12*u,x2:f.x,y2:f.y,r:32*u,jelly:j};}}
 }
 return {kind:'rotate',x:L.wx,y:L.wy,r:L.R*1.1,dir:S.isNight?1:1};
}
function updateHint(dt){
 S.hint=computeHint();
 const idle=S.t-Math.max(0,S.lastInput);
 const need=S.anyInput?4.2:5.0;
 const busy=ptrs.size>0||(S.drag!==null)||Math.abs(S.vel)>0.5;
 if(S.hint&&idle>need&&!busy){S.handT+=dt;} else S.handT=0;
 // characters quietly point with their gaze when idle
 if(S.hint&&idle>3&&!busy&&(!S.focus||S.t>S.focus.until)){
  const h=S.hint;if(h.kind==='drag'&&h.food){const d=ducks[h.food.i];d.gest=Math.max(d.gest,0.5);d.gestK=0;}
  S.focus={x:h.rib?ribbonPos().x:h.x,y:h.rib?ribbonPos().y:h.y,until:S.t+1.2};
 }
}

 if(up>-0.2){ctx.globalAlpha=0.22*sstep(-0.2,0.4,up);ctx.fillStyle=css(mixc(C.lemonL,C.peach,S.sun));circ(sp.x,sp.y,L.R*0.75);ctx.fill();ctx.globalAlpha=1;}
 // party: the town splits into sunset pink and night indigo
 if(S.split>0.01){const a=S.split;
  ctx.save();ctx.beginPath();ctx.moveTo(VX0-4,VY0-4);
  for(let y=VY0;y<=L.lakeTop;y+=12*u) ctx.lineTo(L.wx+splitWave(y),y);
  ctx.lineTo(L.wx+splitWave(L.lakeTop),L.lakeTop+2);ctx.lineTo(VX0-4,L.lakeTop+2);ctx.closePath();
  const g1=ctx.createLinearGradient(0,VY0,0,L.lakeTop);g1.addColorStop(0,css([240,120,160],a*0.75));g1.addColorStop(1,css([255,200,140],a*0.75));ctx.fillStyle=g1;ctx.fill();
  ctx.beginPath();ctx.moveTo(VX1+4,VY0-4);for(let y=VY0;y<=L.lakeTop;y+=12*u) ctx.lineTo(L.wx+splitWave(y),y);
  ctx.lineTo(L.wx+splitWave(L.lakeTop),L.lakeTop+2);ctx.lineTo(VX1+4,L.lakeTop+2);ctx.closePath();
  const g2=ctx.createLinearGradient(0,VY0,0,L.lakeTop);g2.addColorStop(0,css([22,22,72],a*0.8));g2.addColorStop(1,css([70,46,120],a*0.8));ctx.fillStyle=g2;ctx.fill();
  ctx.restore();
  for(let y=VY0;y<L.lakeTop;y+=9*u){glow(pick([C.goldL,C.peach,C.mint]),L.wx+splitWave(y),y,7*u,a*0.5);}
 }
 // stars (phosphor grains)
 const sa=sstep(0.45,0.85,S.n)+partyPres()*0.5*partyNear();
 if(sa>0.02){for(const s of stars){const x=lerp(VX0,VX1,s.x),y=lerp(VY0,L.shoreTop-30*u,s.y);const tw=0.6+0.4*Math.sin(S.t*1.7+s.p);
   if(S.P&&S.split>0&&x<L.wx+splitWave(y)) continue;
   glow(s.c,x,y,s.s*5*u,sa*tw*0.8);ctx.fillStyle=css(s.c,sa*tw);ctx.fillRect(x-0.8*u,y-0.8*u,1.6*u*s.s,1.6*u*s.s);}}
 // clouds
 for(const c of clouds){const x=lerp(VX0-80*u,VX1+80*u,((c.x+S.t*c.sp*0.2)%1+1)%1),y=lerp(VY0+20*u,L.shoreTop-60*u,c.y);const s=c.s*u;
  const col=mixc(mixc(C.cream,[110,82,160],S.n),C.peach,S.sun*0.6);const ucol=mixc(mixc(C.turqL,C.purple,S.n),C.coralL,S.sun*0.5);
  ctx.globalAlpha=0.85-S.n*0.4;
  riso(()=>{blob(x,y,34*s,13*s,c.seed,0.3,10);},css(col),css(ucol),0.6);
  riso(()=>{blob(x+18*s,y-9*s,20*s,12*s,c.seed+3,0.3,9);},css(col),css(ucol),0.6);
  ctx.globalAlpha=1;}
}
function splitWave(y){return Math.sin(y*0.03+S.t*1.6)*7*L.u+Math.sin(y*0.011-S.t)*5*L.u;}

function drawFace(x,y,r,o){
 // o: {blink,gx,gy,mood:'smile'|'joy'|'laugh'|'sleepy'|'surp', cheek}
 const ink=o.ink||[86,40,60];
 ctx.strokeStyle=css(ink);ctx.fillStyle=css(ink);ctx.lineCap='round';ctx.lineWidth=Math.max(1,r*0.07);
 const ex=r*0.34,ey=-r*0.1,er=r*0.11;
 const closed=o.blink>0||o.mood==='sleepy';
 for(const s of [-1,1]){const px=x+s*ex,py=y+ey;
  if(o.mood==='joy'||o.mood==='laugh'){ctx.beginPath();ctx.arc(px,py+er*0.6,er*1.2,PI*1.15,PI*1.85);ctx.stroke();}
  else if(closed){ctx.beginPath();ctx.arc(px,py-er*0.4,er*1.1,PI*0.15,PI*0.85);ctx.stroke();}
  else if(o.mood==='surp'){ctx.fillStyle='#fff';circ(px,py,er*1.6);ctx.fill();ctx.stroke();ctx.fillStyle=css(ink);circ(px+o.gx*er*0.5,py+o.gy*er*0.5,er*0.8);ctx.fill();}
  else {circ(px+o.gx*er*0.7,py+o.gy*er*0.6,er);ctx.fill();ctx.fillStyle='#fff';circ(px+o.gx*er*0.7-er*0.35,py+o.gy*er*0.6-er*0.35,er*0.35);ctx.fill();ctx.fillStyle=css(ink);}
 }
 ctx.fillStyle=css(C.pink,0.75);ell(x-r*0.55,y+r*0.2,r*0.16*(1+(o.cheek||0)),r*0.1*(1+(o.cheek||0)));ctx.fill();ell(x+r*0.55,y+r*0.2,r*0.16*(1+(o.cheek||0)),r*0.1*(1+(o.cheek||0)));ctx.fill();
 ctx.fillStyle=css(ink);
 if(o.mood==='laugh'||o.mood==='joy'){const m=o.mood==='laugh'?1+0.25*Math.sin(S.t*18):0.8;ctx.beginPath();ctx.moveTo(x-r*0.22,y+r*0.18);ctx.quadraticCurveTo(x,y+r*(0.18+0.5*m),x+r*0.22,y+r*0.18);ctx.closePath();ctx.fill();
  ctx.fillStyle=css(C.coral);ell(x,y+r*(0.18+0.26*m),r*0.1,r*0.06*m);ctx.fill();}
 else if(o.mood==='surp'){ctx.beginPath();ctx.ellipse(x,y+r*0.28,r*0.08,r*0.11,0,0,TAU);ctx.fill();}
 else {ctx.beginPath();ctx.arc(x,y+r*0.12,r*0.2,PI*0.18,PI*0.82);ctx.stroke();}
}

function drawWheel(){
 const u=L.u,R=L.R,rot=S.r+S.sway,n=S.n;
 ctx.save();ctx.translate(L.wx,L.wy);
 // stand
 ctx.lineCap='round';
 for(const s of [-1,1]){ctx.strokeStyle=tc(C.coral,0.9);ctx.lineWidth=8*u;ctx.beginPath();ctx.moveTo(MISX,MISY);ctx.lineTo(s*R*0.62+MISX,R*1.6+MISY);ctx.stroke();
  ctx.strokeStyle=tc(C.goldD);ctx.lineWidth=8*u;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*R*0.62,R*1.6);ctx.stroke();}
 if(n>0.25||S.P) glow(C.goldL,0,0,R*1.55,Math.max((n-0.25)*0.35,partyPres()*0.4));
 const sx=1+S.wob*0.045,sy=1-S.wob*0.045;
 ctx.scale(sx,sy);
 const rr=R*0.93,rw=R*0.15;
 // thickness edge
 ctx.lineWidth=rw;ctx.strokeStyle=tc(C.goldD);circ(0,5*u,rr);ctx.stroke();
 ctx.strokeStyle=tc(C.coral,0.85);circ(MISX,MISY,rr);ctx.stroke();
 ctx.strokeStyle=tc(C.gold);circ(0,0,rr);ctx.stroke();
 // the sunset band on the ring, where the ribbon grows
 const ra=rot+PI/2;
 ctx.lineWidth=rw*0.62;
 for(let k=-6;k<=6;k++){const a=ra+k*0.08;ctx.strokeStyle=css(mixc(C.peach,C.coralL,Math.abs(k)/6),0.55*(1-Math.abs(k)/7));
  ctx.beginPath();ctx.arc(0,0,rr,a-PI/2-0.045,a-PI/2+0.045);ctx.stroke();}
 // highlight
 ctx.lineWidth=rw*0.26;ctx.strokeStyle=tc(C.goldL);ctx.beginPath();ctx.arc(-1.5*u,-1.5*u,rr+rw*0.22,-2.7,-1.25);ctx.stroke();
 ctx.lineWidth=rw*0.12;ctx.strokeStyle=css(C.white,0.6);ctx.beginPath();ctx.arc(-1.5*u,-1.5*u,rr+rw*0.24,-2.45,-2.0);ctx.stroke();
 // engraved dots
 ctx.fillStyle=tc(C.goldD);
 for(let k=0;k<28;k++){const a=rot+k/28*TAU;circ(Math.sin(a)*rr,-Math.cos(a)*rr,1.6*u);ctx.fill();}
 // spokes
 ctx.lineWidth=3*u;
 for(let k=0;k<6;k++){const a=rot+k/6*TAU+PI/6;const c=Math.sin(a),s2=-Math.cos(a);
  ctx.strokeStyle=tc(C.coral,0.7);ctx.beginPath();ctx.moveTo(c*R*0.2+MISX,s2*R*0.2+MISY);ctx.lineTo(c*R*0.84+MISX,s2*R*0.84+MISY);ctx.stroke();
  ctx.strokeStyle=tc(C.goldD);ctx.beginPath();ctx.moveTo(c*R*0.2,s2*R*0.2);ctx.lineTo(c*R*0.84,s2*R*0.84);ctx.stroke();
  ctx.fillStyle=tc(C.goldL);riso(()=>{const px=c*R*0.55,py=s2*R*0.55;ctx.beginPath();ctx.moveTo(px,py-5*u);ctx.lineTo(px+4*u,py);ctx.lineTo(px,py+5*u);ctx.lineTo(px-4*u,py);ctx.closePath();},tc(C.goldL),tc(C.coral),0.8);}
 // knobs (look grabbable)
 for(let k=0;k<8;k++){const a=rot+k/8*TAU+PI/8;const px=Math.sin(a)*(rr+rw*0.62),py=-Math.cos(a)*(rr+rw*0.62);
  riso(()=>circ(px,py,4.6*u),tc(C.gold),tc(C.coral),0.85);ctx.fillStyle=tc(C.goldL);circ(px-1.3*u,py-1.3*u,1.6*u);ctx.fill();}
 // mementos from earlier parties
 for(let k=0;k<Math.min(S.memento,6);k++){const a=rot+PI+0.5+k*0.3;const px=Math.sin(a)*rr,py=-Math.cos(a)*rr;ctx.fillStyle=css(C.pink);starPath(px,py,4*u,a,5);ctx.fill();}
 // ribbon
 if(S.ribbonG>0.01||S.P){const rp={x:Math.sin(ra)*rr,y:-Math.cos(ra)*rr};drawRibbon(rp.x,rp.y,ra,S.P?3:S.ribbonG);}
 // sun & moon fixed on the ring
 const spx=Math.sin(rot)*R,spy=-Math.cos(rot)*R;
 const mpx=Math.sin(rot+PI)*R,mpy=-Math.cos(rot+PI)*R;
 drawMoon(mpx,mpy,R*0.27,rot);
 drawSun(spx,spy,R*0.27,rot);
 // hub (center axle)
 const hr=R*0.17*(1+S.hub*0.14);
 riso(()=>circ(0,0,hr),tc(C.gold),tc(C.coral),0.9);
 ctx.lineWidth=2.5*u;ctx.strokeStyle=tc(C.goldD);circ(0,0,hr*0.72);ctx.stroke();
 riso(()=>circ(0,0,hr*0.34),tc(C.goldL),tc(C.goldD),0.9);
 ctx.fillStyle=css(C.white,0.7);ell(-hr*0.38,-hr*0.42,hr*0.2,hr*0.12,-0.6);ctx.fill();
 for(let k=0;k<6;k++){const a=rot*1+k/6*TAU;ctx.fillStyle=tc(C.goldD);circ(Math.cos(a)*hr*0.86,Math.sin(a)*hr*0.86,1.3*u);ctx.fill();}
 ctx.restore();
 // tap rings
 for(const g of rings){const k=g.t/0.7;ctx.strokeStyle=css(C.goldL,(1-k)*0.8);ctx.lineWidth=3*u*(1-k);circ(g.x,g.y,L.R*0.2+k*L.R*0.9);ctx.stroke();}
 // the sunset spot at the top where the ribbon wants to be tied
 if(S.ribbonG>1.5&&!S.P){const k=sstep(1.5,3,S.ribbonG);const tx=L.wx,ty=L.wy-L.R*1.16;const pulse=0.6+0.4*Math.sin(S.t*4);
  glow(C.peach,tx,ty,26*u*(0.8+pulse*0.4),0.7*k);
  ctx.lineWidth=3*u;ctx.strokeStyle=css(C.goldL,k);ctx.beginPath();ctx.arc(tx,ty,7*u,PI*0.1,PI*0.9,true);ctx.stroke();
  ctx.fillStyle=css(C.pink,k);starPath(tx,ty-2*u,5*u*(0.9+pulse*0.2),S.t*0.5,5);ctx.fill();
  if(S.ribbonDone&&rng()<0.3) burst(tx+rnd(-20,20)*u,ty+rnd(-10,10)*u,1,{k:'spark',c:pick([C.peach,C.goldL]),sp:20,g:-30,max:0.8,s:2});}
}
function drawSun(x,y,r,rot){
 const u=L.u;
 ctx.save();ctx.translate(x,y);
 const sl=sstep(0.45,0.8,S.n);
 // rays (turn with the wheel)
 ctx.save();ctx.rotate(rot*1.0+S.t*0.15);
 for(let k=0;k<12;k++){const a=k/12*TAU;const L1=r*(k%2?1.3:1.48);
  riso(()=>{ctx.beginPath();ctx.moveTo(Math.cos(a-0.16)*r*0.92,Math.sin(a-0.16)*r*0.92);ctx.lineTo(Math.cos(a)*L1,Math.sin(a)*L1);ctx.lineTo(Math.cos(a+0.16)*r*0.92,Math.sin(a+0.16)*r*0.92);ctx.closePath();},
   tc(k%2?C.coral:C.lemon),tc(C.coralL),0.7);}
 ctx.restore();
 riso(()=>blob(0,0,r,r,7,0.05,14),tc(C.lemon),tc(C.coral),0.95);
 ctx.fillStyle=tc(C.lemonL,0.9);ell(-r*0.35,-r*0.4,r*0.3,r*0.18,-0.5);ctx.fill();
 const mood=S.laugh?'laugh':(S.joy>0?'joy':(S.surp>0?'surp':(sl>0.5?'sleepy':'smile')));
 ctx.rotate(Math.sin(S.t*1.3)*0.06);
 drawFace(0,r*0.05,r,{blink:S.sunBlink,gx:S.sgx,gy:S.sgy,mood,cheek:S.joy>0?0.4:0});
 ctx.restore();
}
function drawMoon(x,y,r,rot){
 const u=L.u;
 ctx.save();ctx.translate(x,y);
 const aw=sstep(0.3,0.6,S.n);
 glow(C.paleY,0,0,r*2.6,0.25+aw*0.6);
 glow(C.mint,0,0,r*1.6,aw*0.3);
 riso(()=>blob(0,0,r,r,19,0.05,14),css(mixc([236,228,200],[255,248,200],aw)),css(mixc(C.turqL,C.lilac,aw)),0.9);
 ctx.fillStyle=css(mixc([210,200,170],[230,224,180],aw),0.8);
 circ(-r*0.45,-r*0.35,r*0.13);ctx.fill();circ(r*0.5,r*0.45,r*0.1);ctx.fill();circ(r*0.55,-r*0.5,r*0.07);ctx.fill();
 // phosphor speckles inside
 if(aw>0.1){for(let k=0;k<10;k++){const a=k*2.4,rr=r*0.8*h1(k+3);ctx.fillStyle=css(C.paleY,aw*0.7);ctx.fillRect(Math.cos(a)*rr,Math.sin(a)*rr,1.4*u,1.4*u);}}
 const mood=S.laugh?'laugh':(S.joy>0?'joy':(S.surp>0&&aw>0.5?'surp':(aw<0.4?'sleepy':'smile')));
 ctx.rotate(Math.sin(S.t*1.1+1)*0.06);
 drawFace(0,r*0.05,r,{blink:S.moonBlink,gx:S.mgx,gy:S.mgy,mood,ink:[70,50,100],cheek:S.joy>0?0.4:0});

}
function drawRibbon(x,y,ang,g){
 const u=L.u;const t=S.t;const pc=V.ribbonC;
 ctx.save();ctx.translate(x,y);ctx.rotate(ang);
 const pulse=S.ribbonDone||S.P?1+Math.sin(t*3)*0.04:1;
 if(S.ribbonDone||S.P) glow(C.peach,0,-2*u,40*u*pulse,0.55);
 // thread
 const th=clamp(g,0,1);
 ctx.lineCap='round';ctx.strokeStyle=css(C.goldL);ctx.lineWidth=2*u;
 for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(s*6*u+Math.sin(t*3+s)*4*u,8*u*th,s*10*u+Math.sin(t*2.4+s)*7*u,16*u*th,s*(7+Math.sin(t*2+s)*5)*u,26*u*th);ctx.stroke();}
 // tails
 if(g>1){const k=clamp(g-1,0,1);
  for(const s of [-1,1]){riso(()=>{ctx.beginPath();ctx.moveTo(-3*u*s,0);ctx.quadraticCurveTo(s*10*u+Math.sin(t*2+s)*3*u,14*u*k,s*14*u,26*u*k);ctx.lineTo(s*8*u,22*u*k);ctx.lineTo(s*5*u,28*u*k);ctx.quadraticCurveTo(s*4*u,12*u*k,3*u*s,0);ctx.closePath();},css(pc[0]),css(pc[1]),0.9);}
 }
 // loops
 if(g>2){const k=eBack(clamp(g-2,0,1))*pulse;
  for(const s of [-1,1]){
   riso(()=>{ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(s*8*u*k,-20*u*k,s*32*u*k,-18*u*k,s*28*u*k,-1*u*k);ctx.bezierCurveTo(s*32*u*k,14*u*k,s*8*u*k,12*u*k,0,0);ctx.closePath();},css(pc[0]),css(pc[1]),0.95);
   ctx.strokeStyle=css(mixc(pc[0],[150,40,80],0.35));ctx.lineWidth=1.4*u;ctx.beginPath();ctx.moveTo(s*4*u*k,-2*u*k);ctx.quadraticCurveTo(s*16*u*k,-8*u*k,s*22*u*k,-1*u*k);ctx.stroke();
   ctx.fillStyle=css(C.goldL);for(let q=0;q<4;q++){const qa=q/4;circ(s*(8+qa*18)*u*k,(-11+qa*8)*u*k,1.1*u);ctx.fill();}
   if(V.special){ctx.fillStyle=css(C.turqL);starPath(s*20*u*k,-6*u*k,3.2*u,t,5);ctx.fill();}
  }
 }
 // knot
 if(g>1){const k=eBack(clamp((g-1)*1.2,0,1));riso(()=>blob(0,0,7*u*k*pulse,6*u*k*pulse,31,0.15,9),css(pc[0]),css(pc[1]),1);ctx.fillStyle=css(C.white,0.6);ell(-2*u*k,-2*u*k,2*u*k,1.2*u*k);ctx.fill();}
 ctx.restore();
}

function updateTown(dt){
 const all=S.P?1:0;
 for(const h of houses) for(const w of h.wins){const tg=(S.n>w.th||all)?1:0;w.lit+=(tg-w.lit)*Math.min(1,dt*3);}
}
function drawTown(){
 const u=L.u,base=L.shoreTop+6*u;
 // far hills
 riso(()=>{ctx.beginPath();ctx.moveTo(VX0-5,base);for(let x=VX0;x<=VX1+20;x+=20*u) ctx.lineTo(x,L.shoreTop-14*u-Math.sin(x*0.012+1)*12*u-Math.sin(x*0.031)*5*u);ctx.lineTo(VX1+5,base);ctx.closePath();},tc(C.turqL),tc(C.turq),0.7);
 // ground
 const gcol=mixc(mixc(C.creamD,[248,200,170],S.sun*0.4),[170,120,160],S.split*0.5);
 riso(()=>{ctx.beginPath();ctx.moveTo(VX0-5,L.shoreTop);for(let x=VX0;x<=VX1+20;x+=24*u) ctx.lineTo(x,L.shoreTop+Math.sin(x*0.05)*1.5*u);ctx.lineTo(VX1+5,L.shoreTop);ctx.lineTo(VX1+5,L.lakeTop+8*u);ctx.lineTo(VX0-5,L.lakeTop+8*u);ctx.closePath();},tc(gcol),tc(C.coralL),0.6);
 ctx.fillStyle=tc(C.coral,0.25);for(let i=0;i<60;i++){const x=lerp(VX0,VX1,h1(i*3.1)),y=lerp(L.shoreTop+4*u,L.lakeTop,h1(i*7.7));ctx.fillRect(x,y,1.6*u,1.6*u);}
 // long shadows from the sun
 const up=Math.cos(S.r);const shA=0.22*sstep(0.02,0.35,up)*(1-partyPres());const dir=-(Math.sign(Math.sin(S.r))||1);const len=clamp(0.25/Math.max(up,0.12),0,2.4);
 if(shA>0.01){ctx.fillStyle=css([90,40,90],shA);
  const shp=(x0,x1,h,b)=>{ctx.beginPath();ctx.moveTo(x0,b);ctx.lineTo(x1,b);ctx.lineTo(x1+dir*h*len,b+9*u);ctx.lineTo(x0+dir*h*len,b+9*u);ctx.closePath();ctx.fill();};
  for(const h of houses) shp(h.x,h.x+h.w,h.h,base);
  shp(L.bx-L.bw/2,L.bx+L.bw/2,L.bh,L.bBase);shp(L.tx-L.tw/2,L.tx+L.tw/2,L.th,L.tBase);}
 // houses
 for(const h of houses){
  const x=h.x,w=h.w,hh=h.h,top=base-hh;
  riso(()=>{blob(x+w/2,top+hh/2,w/2,hh/2,h.seed,0.04,10);},tc(h.c),tc(C.coral,0.8),0.6);
  ctx.fillStyle=tc(h.c);ctx.fillRect(x+2*u,top+hh*0.3,w-4*u,hh*0.7);
  // roof
  if(h.roof===0) riso(()=>{ctx.beginPath();ctx.moveTo(x-4*u,top+4*u);ctx.lineTo(x+w/2,top-hh*0.42);ctx.lineTo(x+w+4*u,top+4*u);ctx.closePath();},tc(h.rc),tc(C.coral),0.8);
  else if(h.roof===1) riso(()=>{ctx.beginPath();ctx.moveTo(x-3*u,top+5*u);ctx.quadraticCurveTo(x+w/2,top-hh*0.5,x+w+3*u,top+5*u);ctx.closePath();},tc(h.rc),tc(C.turq),0.8);
  else riso(()=>{rrect(x-3*u,top-6*u,w+6*u,12*u,4*u);},tc(h.rc),tc(C.coral),0.8);
  // windows
  for(const wn of h.wins){const wx=x+wn.x*w,wy=top+wn.y*hh+4*u,ww=8*u,wh=9*u;
   const lit=wn.lit;
   ctx.fillStyle=css(mixc(tn(C.turq),C.paleY,lit));rrect(wx-ww/2,wy-wh/2,ww,wh,2*u);ctx.fill();
   if(lit>0.05) glow(C.paleY,wx,wy,16*u,lit*0.6*S.n+lit*0.2);
   ctx.strokeStyle=tc(C.cream,0.9);ctx.lineWidth=1.2*u;ctx.beginPath();ctx.moveTo(wx,wy-wh/2);ctx.lineTo(wx,wy+wh/2);ctx.stroke();}

function patternPts(kind,n){const P=[];for(let i=0;i<=n;i++){const t=i/n*TAU;let x,y;
 if(kind==='bow'){x=Math.sin(t);y=Math.sin(2*t)*0.55;}
 else if(kind==='flower'){const r=0.45+0.55*Math.abs(Math.cos(2.5*t));x=Math.cos(t)*r;y=Math.sin(t)*r;}
 else if(kind==='star'){const k=Math.floor(i/n*10);const f=(i/n*10)-k;const a0=k/10*TAU-PI/2,a1=(k+1)/10*TAU-PI/2;const r0=k%2?0.45:1,r1=k%2?1:0.45;x=lerp(Math.cos(a0)*r0,Math.cos(a1)*r1,f);y=lerp(Math.sin(a0)*r0,Math.sin(a1)*r1,f);}
 else {x=16*Math.pow(Math.sin(t),3)/17;y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17;}
 P.push([x,y]);}return P;}

function onFlip(){
 if(S.phase==='cycle'&&!S.P){S.swaps++;S.learned=true;S.fedPhase=0;}

 const sp=sunPos(),mp=moonPos();
 const look=(px,py,tx,ty)=>{const dx=tx-px,dy=ty-py,d=Math.max(1,hyp(dx,dy));const k=Math.min(1,d/(80*L.u));return [dx/d*k,dy/d*k];};
 let st,mt;

 else if(S.t-S.fT<1.5){st=look(sp.x,sp.y,S.fx,S.fy);mt=look(mp.x,mp.y,S.fx,S.fy);}
 else if(S.focus&&S.t<S.focus.until){st=look(sp.x,sp.y,S.focus.x,S.focus.y);mt=look(mp.x,mp.y,S.focus.x,S.focus.y);}
 else {st=[Math.sin(S.t*0.5)*0.6,0.5];mt=[Math.sin(S.t*0.4+2)*0.6,0.5];}
 const k=Math.min(1,dt*6);S.sgx+=(st[0]-S.sgx)*k;S.sgy+=(st[1]-S.sgy)*k;S.mgx+=(mt[0]-S.mgx)*k;S.mgy+=(mt[1]-S.mgy)*k;
}
let prevBeat=0;
function update(dt){
 S.t+=dt;
 // beat clock (follows the audio scheduler when sound is on)
 if(live()){const sd=60/100/2;S.beat=(A.step-(A.next-A.ctx.currentTime)/sd)/2;} else S.beat+=dt*100/60;
 S.beatP=((S.beat%1)+1)%1;S.beatHit=Math.floor(S.beat)!==Math.floor(prevBeat);prevBeat=S.beat;
 updateWheel(dt);
 S.n=(1-Math.cos(S.r))/2;const sr=Math.sin(S.r);S.sun=Math.pow(sr*sr,0.65);
 const pres=partyPres();
 TK=S.n*0.7*(1-pres*0.3);TW=S.sun*(1-S.n*0.3);
 if(!S.isNight&&S.n>0.62){S.isNight=true;onFlip();}
 else if(S.isNight&&S.n<0.38){S.isNight=false;onFlip();}
 updateRibbon(dt);
 updateParty(dt);
 if(S.P){const P=S.P;S.split=sstep(1.0,2.2,P.t)*pres*partyNear();S.camZ=lerp(1,L.ZP,eIO(sstep(2.3,4.4,P.t))*pres);} else {S.split=0;S.camZ=1;}
 for(const d of ducks) if(d.mode==='life') d.wasNight=d.p>=0.45;
 updateDucks(dt);updateFlies(dt);updateFoods(dt);updateJellies(dt);updateTown(dt);updateWorld(dt);updateFaces(dt);updateHint(dt);
 // the next thing to touch gently bounces
 S.bT=(S.bT||0)-dt;if(S.bT<0){S.bT=2.4;const h=S.hint;const idle=S.t-Math.max(0,S.lastInput);
  if(h&&idle>1.8&&ptrs.size===0){if(h.food)h.food.hop=0.5;else if(h.jelly){h.jelly.sq=0.4;h.jelly.sqV=0;}else if(h.kind==='tap'||h.kind==='rotate'){S.hubV+=3;S.wobV+=2;}
   else if(S.P&&boats[0]){boats[0].hopV=120;}}}
 S.shake=Math.max(0,S.shake-dt);S.joy=Math.max(0,S.joy-dt);S.dockRock=Math.max(0,(S.dockRock||0)-dt*0.8);
}

// ================= loop & lifecycle =================
let raf=0,lastNow=0;
window.__errs=[];
function frame(ts){
 raf=requestAnimationFrame(frame);
 let dt=(ts-lastNow)/1000;lastNow=ts;
 if(!(dt>0)||dt>0.25) dt=1/60;
 dt=Math.min(dt,0.05);
 try{update(dt);render();music();}catch(e){if(window.__errs.length<5)window.__errs.push(String(e&&e.stack||e));}
}
function start(){if(raf)return;lastNow=performance.now();raf=requestAnimationFrame(frame);}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function onResize(){
 for(const id of Array.from(ptrs.keys())) onUp(id,true);
 layout();vign=null;
 for(const b of boats){b.x=clamp(b.x,L.pX0+30*L.u,L.pX1-30*L.u);b.y=clamp(b.y,L.lakeTop+30*L.u,L.pY1-30*L.u);b.sx=b.x;b.sy=b.y;}
 for(const d of ducks){d.tr=null;} for(const f of flies){f.tr=null;f.trail.length=0;}
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stop();for(const id of Array.from(ptrs.keys()))onUp(id,true);if(A.ctx&&A.ctx.state==='running')A.ctx.suspend().catch(()=>{});}
 else {start();if(A.ctx)A.ctx.resume().catch(()=>{});}
});
window.addEventListener('pagehide',()=>{stop();});
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
window.addEventListener('blur',()=>{for(const id of Array.from(ptrs.keys()))onUp(id,true);});
let rzT=0;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,60);});
window.addEventListener('orientationchange',()=>{setTimeout(onResize,250);});
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,60);});
