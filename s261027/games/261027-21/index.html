const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
const SND={
 click(sp,big){if(!AU.ok('click',.028))return;const p=1+Math.min(sp,14)*.035;AU.noise(.035,{ft:'bandpass',f:2400*p,q:5,vol:.15});AU.tone((big?330:500)*p,.06,{type:'triangle',vol:.08,f2:300*p});},

 puff(a){if(!AU.ok('puff',.05))return;AU.noise(.22+.3*a,{ft:'bandpass',f:1300,f2:380,q:.8,vol:.08+.14*a});AU.tone(180,.12,{type:'sine',vol:.05*a,f2:90})},

 bell(n,br){const f=PENTA[n%PENTA.length]*.75;const P=[[1,.2,1.5],[2.01,.06,.9],[2.76,.07,.6],[4.07,.025,.35],[5.43,.012,.25]];for(const p of P)AU.tone(f*p[0],p[2]*(.8+br*.4),{vol:p[1]*(.7+br*.5),at:.002});AU.noise(.03,{ft:'highpass',f:5000,vol:.05})},

/* ---------- particles ---------- */
const PT={a:[],cap:240,

  case'drop':{const r=p.r;ctx.fillStyle='rgba(120,200,255,.55)';ell(p.x,p.y,r*(1-Math.min(.25,Math.abs(p.vy)*.0004/U)),r*(1+Math.min(.35,Math.abs(p.vy)*.0006/U)),Math.atan2(p.vy,p.vx)+Math.PI/2);ctx.fill();ctx.strokeStyle='rgba(60,140,230,.55)';ctx.lineWidth=.9*U;ctx.stroke();shine(p.x-r*.3,p.y-r*.35,r*.35,r*.25,.85);break}

function guideTarget(){if(G.trans)return null;
 if(G.scene==='room'){const l=L.r,g=l.gear;
  if(R.ready&&R.handle.drop>=1)return{x:R.handle.x,y:R.handle.y,r:32*U,kind:'pull'};

  if(R.pushes<2)return{x:l.bel.x,y:l.bel.y-l.belh*.6,r:l.belw*.62,kind:'press'};
  const k=Math.floor(G.t/9)%3;if(k===1&&R.pushes<10)return{x:l.bel.x,y:l.bel.y-l.belh*.6,r:l.belw*.62,kind:'press'};if(k===2&&R.rings<10)return{x:l.bell.x,y:l.bell.y+l.bellR*1.1,r:l.bellR*1.25,kind:'tap'};return rot}
 const L2=L.c;
 if(C.pic==='ready'&&C.ribbon.ex)return{x:C.ribbon.ex,y:C.ribbon.ey,r:26*U,kind:'pull'};
 if(C.pic==='unroll'||C.pic==='end'||C.pic==='grow')return null;
 if(C.journeys>0&&C.pic==='none'&&C.score<4)return{x:L2.hatch.x,y:L2.hatch.y,r:36*U,kind:'tap'};
 const foodT=()=>{let f=null;for(const q of C.foods)if(q.st==='tray'&&trayActive(q.tray)&&(!f||q.tray>f.tray))f=q;if(!f)return null;const c=bestEater(f.x,f.y);if(!c)return null;const m=mouthOf(c);return{x:f.x,y:f.y,r:26*U,kind:'drag',x2:m[0],y2:m[1]}};
 const critT=()=>{let c=null;for(const q of C.crits)if(!critBusy(q)&&q.st==='idle'&&(!c||q.wantSlide>c.wantSlide))c=q;if(!c)return null;const e=pathAt(C.ext>.99?L2.long:L2.short,0);return{x:c.x,y:c.y-20*L2.cs,r:34*L2.cs,kind:'drag',x2:e.x,y2:e.y}};
 if(C.feedsHere<2){const f=foodT();if(f)return f}
 if(C.slidesHere<1){const c=critT();if(c)return c}
 if(C.pumps<1){for(const c of C.crits)if(c.st==='ride')return{x:L2.pump.x,y:L2.pump.y-50*U,r:34*U,kind:'press'}}

 if(C.pic==='ready'&&C.ribbon.ex&&(dist(x,y,C.ribbon.ex,C.ribbon.ey)<56*U||dist(x,y,L2.pb.x,L2.pb.y-20*U)<54*U)){C.ribbon.pid=id;C.ribbon.gy=y-C.ribbon.pull;SND.tick();return}

function frame(ts){raf=requestAnimationFrame(frame);let dt=(ts-last)/1000;last=ts;if(!(dt>0)||dt>1)dt=1/60;const rdt=dt;dt=Math.min(dt,.05);G.dt=dt;
