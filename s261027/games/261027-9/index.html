<script>
(()=>{
'use strict';
// =====================================================================
//  ぽっぽ！木の汽車を走らせよう — single file wooden diorama train toy
// =====================================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const ease=(cur,tgt,rate,dt)=>cur+(tgt-cur)*(1-Math.exp(-rate*dt));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function vnoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u);}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);}
function rgb(a){return `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;}
function hex(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}

// ---------------------------------------------------------------- layout
let W=0,H=0,DPR=1,S=1,CX=0,OY=0,PORT=true;
const SAFE={t:0,b:0,l:0,r:0};
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('safe'));
    SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;SAFE.r=parseFloat(cs.paddingRight)||0;}catch(e){}
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  readSafe();
  const aw=W-SAFE.l-SAFE.r,ah=H-SAFE.t-SAFE.b;
  S=Math.min(aw*0.95/342,ah*0.9/455);
  CX=SAFE.l+aw/2;
  PORT=W<H*0.9;
  OY=PORT?SAFE.t+ah*0.6:SAFE.t+ah/2+45*S;
  WAGON_Y=clamp((H-OY)/S-50,166,215);
  releaseAll();
}

// ---------------------------------------------------------------- course
const LAP=6400,START_U=300,STOP_U=5900,BR0=2450,BR1=3050,T0=3540,T1=4060,TOWN0=4260,TOWN1=5560;
const WATER_Y=-75;
const KP=[[-1000,0],[600,0],[820,-34],[1060,-8],[1260,-26],[2220,-232],[2440,-240],[3060,-240],[3330,-160],[3540,-120],[4060,-26],[4230,0],[7400,0]];
function hU(u){for(let i=0;i<KP.length-1;i++){const a=KP[i],b=KP[i+1];if(u<=b[0]){const t=clamp((u-a[0])/(b[0]-a[0]),0,1);return a[1]+(b[1]-a[1])*(1-Math.cos(Math.PI*t))/2;}}return 0;}
const modL=x=>((x%LAP)+LAP)%LAP;
const hx=x=>hU(modL(x));
function bridgeT(u){return(u>BR0&&u<BR1)?(u-BR0)/(BR1-BR0):-1;}
function gx(x){const u=modL(x);let y=hU(u);const t=bridgeT(u);if(t>=0)y+=215*Math.pow(Math.sin(Math.PI*t),0.55);return y;}
function bankY(x){const u=modL(x);const t=bridgeT(u);const base=28+22*(0.5+0.5*Math.sin(u*0.013))+10*Math.sin(u*0.031);
  if(t>=0)return gx(x)-30-base*0.4;return hU(u)-base;}
function inTunnel(u){return u>T0&&u<T1;}

// ---------------------------------------------------------------- procedural wood
const PAT={};const G={};
function woodCanvas(base,dark,light,seed,opt){
  opt=opt||{};
  const w=256,h=128,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const r=mulberry(seed);
  g.fillStyle=base;g.fillRect(0,0,w,h);
  // soft color bands
  for(let i=0;i<10;i++){const y=r()*h,bh=6+r()*24;g.fillStyle=r()<0.5?dark:light;g.globalAlpha=0.06+r()*0.08;
    for(let k=-1;k<=1;k++){g.fillRect(0,y+k*h,w,bh);} }
  // grain
  const lines=opt.lines||60;
  for(let i=0;i<lines;i++){
    const y0=r()*h,amp=0.6+r()*(opt.amp||3.2),k1=1+Math.floor(r()*3),k2=2+Math.floor(r()*5),p1=r()*TAU,p2=r()*TAU;
    g.strokeStyle=r()<0.62?dark:light;g.globalAlpha=0.07+r()*0.22;g.lineWidth=0.4+r()*1.5;
    for(let k=-1;k<=1;k++){g.beginPath();
      for(let x=0;x<=w;x+=4){const y=y0+k*h+Math.sin(x/w*TAU*k1+p1)*amp+Math.sin(x/w*TAU*k2+p2)*amp*0.35;x?g.lineTo(x,y):g.moveTo(x,y);}
      g.stroke();}
  }
  // knots
  const knots=opt.knots==null?1:opt.knots;
  for(let i=0;i<knots;i++){const kx=20+r()*(w-40),ky=20+r()*(h-40);
    for(let j=5;j>0;j--){g.globalAlpha=0.12;g.strokeStyle=dark;g.lineWidth=0.8;ell(g,kx,ky,j*3.2,j*1.3);g.stroke();}
    g.globalAlpha=0.35;g.fillStyle=dark;ell(g,kx,ky,2.4,1.1);g.fill();}
  // fine pores
  g.globalAlpha=0.08;g.fillStyle=dark;
  for(let i=0;i<500;i++){g.fillRect(r()*w,r()*h,1+r()*3,0.5);}
  g.globalAlpha=1;
  return c;
}
function mkPat(name,base,dark,light,seed,opt,scale){
  const p=ctx.createPattern(woodCanvas(base,dark,light,seed,opt),'repeat');
  try{if(p&&p.setTransform&&typeof DOMMatrix!=='undefined')p.setTransform(new DOMMatrix([scale||0.55,0,0,scale||0.55,0,0]));}catch(e){}
  PAT[name]=p;
}
function makeStone(){
  const c=document.createElement('canvas');c.width=128;c.height=96;const g=c.getContext('2d');const r=mulberry(77);
  g.fillStyle='#3b3430';g.fillRect(0,0,128,96);
  for(let row=0;row<4;row++){const y=row*24,off=row%2?16:0;
    for(let col=-1;col<5;col++){const x=col*32+off;const v=60+r()*30;
      g.fillStyle=`rgb(${v+18},${v+8},${v})`;rr(g,x+1.5,y+1.5,29,21,5);g.fill();
      g.fillStyle='rgba(255,240,220,0.12)';rr(g,x+3,y+3,25,6,3);g.fill();}}
  const p=ctx.createPattern(c,'repeat');try{p.setTransform(new DOMMatrix([0.6,0,0,0.6,0,0]));}catch(e){}
  PAT.stone=p;
}
function initArt(){
  mkPat('red','#8c3a22','#4a1a0c','#c46a42',11,{lines:70},0.5);
  mkPat('green','#2f5a3e','#16301f','#5b8a62',12,{lines:60},0.5);
  mkPat('light','#d8a46a','#8e5a2c','#f3cf98',13,{lines:55},0.5);
  mkPat('mid','#a8703f','#5c3415','#d29a62',14,{lines:60},0.55);
  mkPat('dark','#5a3a22','#2a170a','#86603c',15,{lines:50},0.55);
  mkPat('cream','#ead6b0','#b08a5a','#fff2d6',16,{lines:40,knots:0},0.5);
  mkPat('grass','#7f9c4e','#4f6a2a','#a8bf6a',17,{lines:46,amp:5,knots:0},0.9);
  mkPat('hillFar','#8aa0a6','#5f7880','#b6c8c8',18,{lines:40,amp:6,knots:0},1.2);
  mkPat('hillMid','#7d9a62','#526c3c','#a7bf84',19,{lines:46,amp:6,knots:0},1.0);
  mkPat('hillNear','#6e8c4a','#45602a','#97b06a',20,{lines:50,amp:5,knots:1},0.8);
  mkPat('tree','#5f8f46','#365a24','#8fbf62',21,{lines:50,amp:4,knots:0},0.5);
  mkPat('tree2','#7c9c3a','#4c6a1c','#b0c86a',22,{lines:50,amp:4,knots:0},0.5);
  mkPat('plank','#c08a52','#7a4c22','#e2b47a',23,{lines:60},0.55);
  mkPat('rock','#6b5a48','#3e3226','#8f7c66',24,{lines:40,amp:7},1.0);
  mkPat('rose','#d98a8a','#9a4a4e','#f2b8b0',25,{lines:40},0.5);
  mkPat('mint','#9cc4a4','#5f8a6c','#c8e2c8',26,{lines:40},0.5);
  mkPat('sky','#93b6d4','#5b7fa2','#c6dcec',27,{lines:40},0.5);
  mkPat('honey','#e3b25a','#a4722a','#f6d68e',28,{lines:40},0.5);
  mkPat('lav','#b2a0cf','#7a6698','#d6c8ea',29,{lines:40},0.5);
  mkPat('teal','#3f7d7a','#1f4a48','#6aa6a2',30,{lines:40},0.5);
  mkPat('roof','#9b3d2e','#5a1c12','#c4644e',31,{lines:40},0.5);
  makeStone();
  // gradients defined in local units; reused (transform applies at fill time)
  G.boilerShade=lineG(0,-162,0,-88,[[0,'rgba(255,240,220,0.10)'],[0.16,'rgba(255,236,200,0.55)'],[0.28,'rgba(255,255,255,0.06)'],[0.7,'rgba(40,10,0,0.12)'],[1,'rgba(30,8,0,0.5)']]);
  G.cabShade=lineG(-160,0,-68,0,[[0,'rgba(0,0,0,0.30)'],[0.25,'rgba(255,255,255,0.05)'],[0.55,'rgba(255,250,230,0.16)'],[1,'rgba(0,0,0,0.22)']]);
  G.roofShade=lineG(0,-196,0,-174,[[0,'rgba(255,240,210,0.45)'],[0.4,'rgba(255,255,255,0.0)'],[1,'rgba(0,0,0,0.35)']]);
  G.iron=radG(0,0,0,0,0,30,[[0.82,'#4a4644'],[0.9,'#9a958c'],[0.95,'#5e5a55'],[1,'#2a2725']]);
  G.wheelShade=radG(-8,-8,2,0,0,27,[[0,'rgba(255,240,210,0.25)'],[0.6,'rgba(255,255,255,0)'],[1,'rgba(30,10,0,0.45)']]);
  G.flame=lineG(0,14,0,-30,[[0,'rgba(255,60,10,0.9)'],[0.35,'rgba(255,140,30,0.85)'],[0.75,'rgba(255,220,90,0.7)'],[1,'rgba(255,255,200,0)']]);
  G.ember=radG(0,8,0,0,8,22,[[0,'#ffb040'],[0.4,'#c03a10'],[1,'#2a0804']]);
  G.emberCold=radG(0,8,0,0,8,22,[[0,'#5a1a0c'],[0.6,'#2a0a05'],[1,'#120403']]);
  G.water=lineG(0,-90,0,120,[[0,'#7fb7c9'],[0.3,'#4f8fa8'],[1,'#2a5470']]);
  G.puff=puffSprite('255,255,255');G.puffG=puffSprite('120,112,106');G.ring=ringSprite();
}
function lineG(x0,y0,x1,y1,st){const g=ctx.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
function radG(x0,y0,r0,x1,y1,r1,st){const g=ctx.createRadialGradient(x0,y0,r0,x1,y1,r1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
const brassCache=new Map();
function brass(x0,y0,x1,y1){const k=x0+','+y0+','+x1+','+y1;let g=brassCache.get(k);if(!g){g=lineG(x0,y0,x1,y1,[[0,'#6b4810'],[0.22,'#c8952e'],[0.42,'#fff1b4'],[0.55,'#e6b64a'],[0.8,'#9a6a1a'],[1,'#4e340a']]);brassCache.set(k,g);}return g;}
function puffSprite(col){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const r=mulberry(col.length*7);
  for(let i=0;i<7;i++){const a=r()*TAU,d=r()*10,x=32+Math.cos(a)*d,y=32+Math.sin(a)*d,rad=14+r()*10;
    const gr=g.createRadialGradient(x-rad*0.3,y-rad*0.3,1,x,y,rad);gr.addColorStop(0,`rgba(${col},0.55)`);gr.addColorStop(0.6,`rgba(${col},0.32)`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;circ(g,x,y,rad);g.fill();}
  return c;}
function ringSprite(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,12,32,32,30);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.55,'rgba(255,255,255,0.7)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;circ(g,32,32,30);g.fill();return c;}

// ---------------------------------------------------------------- audio
let AC=null,BUS=null,ECHO=null,NOISE=null,voices=0,burnNode=null,whistle=null;
function audioInit(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    try{AC=new C();}catch(e){AC=null;return;}
    try{
      const master=AC.createGain();master.gain.value=0.75;
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=0.004;comp.release.value=0.25;
      BUS=AC.createGain();BUS.gain.value=1;BUS.connect(comp);
      ECHO=AC.createGain();ECHO.gain.value=0;BUS.connect(ECHO);
      const dl=AC.createDelay(1);dl.delayTime.value=0.16;const fb=AC.createGain();fb.gain.value=0.42;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;
      ECHO.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(comp);
      comp.connect(master);master.connect(AC.destination);
      NOISE=AC.createBuffer(1,AC.sampleRate*2|0,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);
    }catch(e){AC=null;return;}
  }
  if(AC.state!=='running'&&AC.state!=='closed'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}
}
function aok(cost){if(!AC||!BUS||AC.state==='closed')return false;if(voices>(cost?22:28))return false;return true;}
function hold(d){voices++;setTimeout(()=>{voices--;},d*1000+80);}
function nz(t,d,o){o=o||{};const s=AC.createBufferSource();s.buffer=NOISE;const fl=AC.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);
  if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=o.q==null?1:o.q;
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,o.g||0.2),t+(o.a||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(o.dest||BUS);s.start(t,Math.random()*1.5);s.stop(t+d+0.05);hold(d);}
function tone(t,d,o){o=o||{};const os=AC.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f||440,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+(o.fd||d));
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,o.g||0.2),t+(o.a||0.005));
  if(o.sus){g.gain.setValueAtTime(o.g,t+d-(o.r||0.1));}
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  let node=os;if(o.lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=o.lq||0.7;os.connect(f);node=f;}
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=(o.f||440)*(o.vd||0.008);l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+0.05);}
  node.connect(g);g.connect(o.dest||BUS);os.start(t);os.stop(t+d+0.05);hold(d);}
const SND={
  coalClack(){if(!aok())return;const t=AC.currentTime;nz(t,0.07,{f:2400,q:2,g:0.22});tone(t,0.08,{type:'triangle',f:330,f2:200,g:0.12});nz(t+0.05,0.05,{f:1800,q:3,g:0.1});},
  coalLift(){if(!aok())return;const t=AC.currentTime;nz(t,0.05,{f:3000,q:3,g:0.08});tone(t,0.05,{type:'triangle',f:520,g:0.05});},
  coalIn(big){if(!aok())return;const t=AC.currentTime;nz(t,0.12,{f:900,q:1.5,g:0.2});nz(t+0.03,0.5+big*0.4,{type:'lowpass',f:200,f2:900,q:0.5,g:0.35+big*0.2,a:0.04});tone(t,0.35,{f:70,f2:42,g:0.35,a:0.01});
    for(let i=0;i<5;i++)nz(t+0.08+Math.random()*0.4,0.03,{type:'highpass',f:2500,g:0.07});},
  ignite(){if(!aok())return;const t=AC.currentTime;nz(t,0.9,{type:'lowpass',f:150,f2:1200,q:0.8,g:0.5,a:0.06});tone(t,0.7,{f:58,f2:40,g:0.45,a:0.02});},
  crackle(v){if(!aok(1))return;const t=AC.currentTime;nz(t,0.025,{type:'highpass',f:2200+Math.random()*2000,g:0.03+v*0.05});},
  bubble(){if(!aok(1))return;const t=AC.currentTime;const f=500+Math.random()*500;tone(t,0.07,{f,f2:f*2.2,g:0.05,a:0.004});},
  hiss(power,dur){if(!aok())return;const t=AC.currentTime;dur=dur||0.6;nz(t,dur,{type:'highpass',f:2500,f2:1500,q:0.7,g:0.06+power*0.22,a:0.02});nz(t,dur*0.8,{f:5200,q:1,g:0.04+power*0.08,a:0.01});},
  puff(v){if(!aok(1))return;const t=AC.currentTime;nz(t,0.25,{f:500,q:0.8,g:0.03+v*0.05,a:0.03});},
  snore(){if(!aok(1))return;const t=AC.currentTime;nz(t,1.2,{f:420,f2:300,q:1.2,g:0.05,a:0.5});},
  chuff(v,alt){if(!aok(1))return;const t=AC.currentTime;const d=clamp(0.2-v*0.06,0.08,0.2);nz(t,d,{f:alt?1100:780,q:0.9,g:0.12+v*0.1,a:0.006});tone(t,0.09,{f:90,f2:55,g:0.08+v*0.04});},
  clack(){if(!aok(1))return;const t=AC.currentTime;for(let i=0;i<2;i++){tone(t+i*0.09,0.05,{type:'triangle',f:820-i*120,g:0.07});nz(t+i*0.09,0.04,{f:1500,q:2,g:0.06});}},

function genLap(k){
  const r=mulberry(1234+k*977);const base=k*LAP;

    if((u>START_U-280&&u<START_U+300)||(u>BR0-20&&u<BR1+20)||(u>T0-240&&u<T1+170)||(u>TOWN0-120&&u<STOP_U+330))continue;

  }
  const animals=[{u:930,type:'sheep'},{u:1190,type:'deer'},{u:1640,type:'bunny'},{u:2010,type:'sheep'},{u:2330,type:'deer'},{u:3230,type:'bunny'},{u:3420,type:'sheep'}].map(a=>({x:base+a.u,type:a.type,look:0,hop:0,t:r()*5}));
  const houses=[];const types=['house','tower','florist','house','clock','shop','house','tower','house','station','house','florist','shop'];
  const pats=['cream','rose','mint','sky','honey','lav','light'];const roofs=['#9b3d2e','#2f6b6a','#6b3f8a','#b4572a','#3d5a8c','#7a3a2a'];
  let x=TOWN0;let i=0;
  while(x<TOWN1){const type=types[(i+k*3)%types.length];let w=type==='tower'?62:type==='clock'?70:type==='station'?120:80+r()*30;let h=type==='tower'?190+r()*30:type==='clock'?215:type==='station'?120:100+r()*50;
    const hs={x:base+x+w/2,w,h,type,pat:pats[(i*3+k)%pats.length],roof:roofs[(i+k*2)%roofs.length],wins:[],lit:false,litT:-1,flag:r()*TAU};
    const cols=type==='tower'||type==='clock'?1:type==='station'?3:2;const rows=Math.max(1,Math.floor((h-40)/46));
    for(let ry=0;ry<rows;ry++)for(let cx=0;cx<cols;cx++){
      if(type==='clock'&&ry===rows-1)continue;
      const wx=(cx-(cols-1)/2)*(w/cols),wy=-h+36+ry*46;

function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
function hitTest(px,py){
  const w=s2w(px,py);const l=w2l(w.x,w.y);
  // held gifts / coal priority not needed
  const ph=st.phase;
  // cord
  const ck=cordKnob();
  if(Math.hypot(l.x-ck.x,l.y-ck.y)<minR(26)||(distSeg(l.x,l.y,CORD_TOP.x,CORD_TOP.y,ck.x,ck.y)<minR(14)&&l.y>-188))if(!E.cordHeld)return{kind:'cord',l,w};
  // valve
  if(Math.hypot(l.x-VALVE.x,l.y-VALVE.y)<minR(28))return{kind:'valve',l,w};
  // lever
  const lk=leverKnob();
  if(!E.leverHeld&&(Math.hypot(l.x-lk.x,l.y-lk.y)<minR(26)||distSeg(l.x,l.y,LEVER_PIV.x,LEVER_PIV.y,lk.x,lk.y)<minR(16)))if(ph!=='run')return{kind:'lever',l,w};
  // start-station coal
  if(atStart()){
    const near=coals.find(c=>c.state==='shovel'&&!c.owner&&Math.hypot(w.x-c.x,w.y-c.y)<minR(22));
    if(near)return{kind:'coal',coal:near,l,w};
    const inBig=(ph==='coal')?(l.x>-130&&l.x<28&&l.y>-112&&l.y<78):(Math.hypot(w.x-SHOVEL.x,w.y-SHOVEL.y)<minR(48)||Math.hypot(l.x-DOOR.x,l.y-DOOR.y)<minR(30)||Math.hypot(w.x-SCUTTLE.x,w.y-SCUTTLE.y)<minR(30));
    if(inBig){const c=coals.find(c=>c.state==='shovel'&&!c.owner);if(c)return{kind:'coal',coal:c,l,w};return{kind:'coalbusy',l,w};}
  }
  // arrival
  if(ph==='arrive'){
    const b=stationBase();
    for(const g of gifts){if(g.state==='wagon'&&!g.owner&&g.pop>0.5){const h=giftHome(g);if(Math.hypot(w.x-h.x,w.y-h.y)<minR(20))return{kind:'gift',g,l,w};}}
    let best=null,bd=1e9;
    for(const m of band){const mx=b+m.dx,my=m.y-30;const d=Math.hypot((w.x-mx)/1.0,(w.y-my)/1.25);if(d<minR(40)&&d<bd){bd=d;best=m;}}
    if(best)return{kind:'animal',m:best,l,w};
    if(Math.abs(w.x-(b+WAGON_DX))<minR(52)&&Math.abs(w.y-(WAGON_Y-14))<minR(30)){const g=gifts.find(g=>g.state==='wagon'&&!g.owner&&g.pop>0.5);if(g)return{kind:'gift',g,l,w};}
  }
  // pigeons
  if(atStart()){for(const p of pigeons){if(p.state==='sit'&&Math.hypot(w.x-p.x,w.y-p.y)<minR(14))return{kind:'pigeon',p,l,w};}}
  // engine body while running -> boost
  if(ph==='run'){
    if(l.x>-190&&l.x<175&&l.y>-260&&l.y<45)return{kind:'boost',l,w};
    if(Math.abs(w.y-hx(w.x))<70/1&&Math.abs(w.x-E.x)<260)return{kind:'boost',l,w};
  }
  return null;
}

function nudgeTarget(){const tg=getTarget();if(tg)tg.nudge=1;E.gazeKick=1;tgNudge=1;}
let tgNudge=0;

function startPointer(r){
  const d=r.data;
  switch(r.kind){
    case'coal':{const c=d.coal;c.owner=r.id;c.state='held';c.lift=1;c.hx=c.x;c.hy=c.y;shovelTiltV-=6;SND.coalLift();break;}
    case'coalbusy':{shovelTiltV-=3;SND.click();break;}
    case'valve':{r.a0=Math.atan2(d.l.y-VALVE.y,d.l.x-VALVE.x);r.turn=0;E.valveVel+=4;E.valveAng+=0.25;r.turn=0.25;SND.ratchet();
      if(E.pressure<0.3){SND.creak();}break;}
    case'cord':{E.cordHeld=r.id;r.y0=d.l.y;r.pull0=E.cordPull;E.cordPull=Math.max(E.cordPull,8);startWhistle();break;}
    case'lever':{E.leverHeld=r.id;r.a0=E.lever;E.leverVel+=1.2;SND.click();if(!leverReady()){SND.creak();}break;}
    case'animal':{playAnimal(d.m,true);break;}
    case'gift':{const g=d.g;g.owner=r.id;g.state='held';const h=giftHome(g);g.x=h.x;g.y=h.y;g.lift=1;SND.pop();break;}
    case'pigeon':{d.p.state='fly';d.p.vx=40+Math.random()*40;d.p.vy=-90;d.p.t=0;SND.flutter();break;}
    case'boost':{boost();break;}
  }
}
function movePointer(r){
  const d=r.data;const w=s2w(r.x,r.y);const l=w2l(w.x,w.y);
  switch(r.kind){
    case'coal':{const c=d.coal;if(c.state!=='held')return;c.x=w.x;c.y=w.y-6;
      const door=l2w(DOOR.x,DOOR.y);if(Math.hypot(c.x-door.x,c.y-door.y)<minR(34)){c.owner=null;flyCoal(c,0.18);r.kind='done';}break;}
    case'valve':{const a=Math.atan2(l.y-VALVE.y,l.x-VALVE.x);let da=a-r.a0;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;r.a0=a;
      const dd=Math.abs(da)*(E.pressure<0.3?0.35:1);E.valveAng+=dd;r.turn+=dd;if(Math.random()<dd*3)SND.ratchet();
      if(r.turn>1.3&&!r.fired){r.fired=true;openValve();}break;}
    case'cord':{const pull=clamp(r.pull0+(l.y-r.y0),0,70);E.cordPull=Math.max(pull,4);break;}
    case'lever':{const a=Math.atan2(l.x-LEVER_PIV.x,-(l.y-LEVER_PIV.y));
      if(E.engaged)return;
      if(leverReady()){let tgt=clamp(a,LEVER_REST-0.05,LEVER_ON);
        const prog=(tgt-LEVER_REST)/(LEVER_ON-LEVER_REST);
        // heavy resistance early, then catch
        const res=prog<0.55?LEVER_REST+(tgt-LEVER_REST)*0.6:tgt;E.lever=ease(E.lever,res,18,1/60);
        if((E.lever-LEVER_REST)/(LEVER_ON-LEVER_REST)>0.62)engage();}
      else{E.lever=clamp(LEVER_REST+(a-LEVER_REST)*0.2,LEVER_REST-0.03,LEVER_REST+0.12);}
      break;}
    case'gift':{const g=d.g;if(g.state!=='held')return;g.x=w.x;g.y=w.y-4;break;}
  }
}
function endPointer(id,cancel){
  const r=ptrs.get(id);if(!r)return;ptrs.delete(id);
  const d=r.data;const tap=(T-r.t0)<0.35&&r.moved<14;
  switch(r.kind){
    case'coal':{const c=d.coal;if(c.state!=='held')break;c.owner=null;
      const door=l2w(DOOR.x,DOOR.y);
      if(tap||Math.hypot(c.x-door.x,c.y-door.y)<minR(80)){flyCoal(c,tap?0.42:0.2);if(tap)shovelTiltV+=14;}
      else{c.state='back';c.t=0;c.sx=c.x;c.sy=c.y;SND.coalClack();}break;}
    case'valve':{if(!r.fired){if(r.turn<1.3){E.valveVel+=6;}openValve();}break;}
    case'cord':{E.cordHeld=null;if(tap&&E.whistleT<0.35){E.whistleTimer=0.55;E.cordVel=-60;E.cordPull=Math.max(E.cordPull,26);}else{stopWhistle();E.cordVel=-120;}break;}
    case'lever':{E.leverHeld=null;if(!E.engaged){if(leverReady()&&!cancel&&(tap||E.lever>LEVER_REST+0.12)){E.autoEngage=true;}else{if(!leverReady()){SND.clunk();E.leverVel-=2;smokePuff(...l2wA(-110,-60),-20,-10,4,false,0.6);}}}break;}
    case'gift':{const g=d.g;if(g.state!=='held')break;g.owner=null;
      const b=stationBase();let best=null,bd=1e9;for(const m of band){const dd=Math.hypot(g.x-(b+m.dx),g.y-(m.y-30));if(dd<bd){bd=dd;best=m;}}
      if(tap||bd<minR(55)){if(tap){best=band.slice().sort((a,b2)=>a.gifts.length-b2.gifts.length||a.hitCount-b2.hitCount)[0];}sendGift(g,best);}
      else{g.state='return';g.t=0;g.fx=g.x;g.fy=g.y;}break;}
  }
}
function l2wA(x,y){const p=l2w(x,y);return[p.x,p.y];}

// ----- actions
function flyCoal(c,dur){c.state='fly';c.t=0;c.dur=dur;c.sx=c.x;c.sy=c.y;SND.coalClack();
  const slot=c.slot;setTimeout(()=>{refillSlot(slot);},650);}
function refillSlot(slot){if(coals.some(c=>c.slot===slot&&(c.state==='shovel'||c.state==='held'||c.state==='back'||c.state==='pop')))return;
  const n=makeCoal(slot);n.state='pop';n.t=0;n.sx=SCUTTLE.x;n.sy=SCUTTLE.y-14;n.x=n.sx;n.y=n.sy;coals.push(n);}
function coalArrive(c){
  const first=!E.lit;E.fire=Math.min(1.7,E.fire+(first?0.55:0.4));E.lit=true;E.doorFlap=1;E.flash=1;E.shake=Math.max(E.shake,0.6);
  const door=l2w(DOOR.x,DOOR.y);sparks(door.x,door.y-4,first?14:9,90);
  const ch=l2w(CHIM.x,CHIM.y);for(let i=0;i<(first?4:2);i++)smokePuff(ch.x,ch.y,-8+Math.random()*16,-50-Math.random()*30,7,true,2.2);

}
function openValve(){
  if(E.pressure<0.3){ // not enough pressure: tiny puff, valve spins back
    const v=l2w(VALVE.x+20,VALVE.y-8);smokePuff(v.x,v.y,20,-15,3,false,0.6,{grow:10});SND.puff(0.2);E.valveVel-=5;E.valveTwitch=1;return;}
  E.jet=1;E.jetT=0;E.jetStyle=(E.jetStyle+(E.valveOpened?1:0))%4;E.valveVel+=10;E.bodyKick=1;
  SND.hiss(Math.min(1,E.pressure),1.6);
  if(!E.valveOpened){E.valveOpened=true;if(st.phase==='valve'){st.phase='whistle';setTimeout(()=>SND.chime(4),300);}}
  E.pressure=Math.max(0.4,E.pressure-0.12);
  // blow leaves if running
  if(st.phase==='run'){const d=lapData(curLap());d.trees.forEach(t=>{if(Math.abs(t.x-E.x)<220){t.shV+=3;leaves(t.x,hx(t.x)-60*t.s,5,-1);}});}
}
function whistlePower(){return E.valveOpened?clamp(E.pressure,0.5,1):0;}
function startWhistle(){
  const pw=whistlePower();whistleStart(pw,1);E.whistleOn=true;E.whistleT=0;
  if(pw>0)whistleEffects();else{const w=l2w(WHISTLE.x,WHISTLE.y);smokePuff(w.x,w.y,0,-20,3,false,0.7,{grow:12});}
}
function stopWhistle(){whistleStop();E.whistleOn=false;
  if(whistlePower()>0&&!E.whistledOnce&&E.whistleT>0.12){E.whistledOnce=true;if(st.phase==='whistle'){st.phase='lever';setTimeout(()=>SND.chime(4),200);}}}
function whistleEffects(){
  const w=l2w(WHISTLE.x,WHISTLE.y);soundRing(w.x,w.y,true);
  // pigeons
  if(atStart()){pigeons.forEach((p,i)=>{if(p.state==='sit'){p.state='fly';p.t=-i*0.08;p.vx=50+Math.random()*60;p.vy=-110-Math.random()*40;}});SND.flutter();}

function leverReady(){return(st.phase==='lever')||(st.phase==='arrive'&&st.arriveT>4);}
function engage(){
  if(E.engaged)return;E.engaged=true;E.engageT=T;E.lever=LEVER_ON;E.leverVel=-3;E.autoEngage=false;

function boost(){

  E.boost=Math.min(2.4,E.boost+0.75);E.v+=14;E.bodyKick=1;E.pressure=Math.min(1.2,E.pressure+0.05);
  const ch=l2w(CHIM.x,CHIM.y);for(let i=0;i<3;i++)smokePuff(ch.x,ch.y-2,(Math.random()-0.5)*20-E.v*0.2,-110-Math.random()*60,8+Math.random()*4,false,1.6,{grow:40});

function playAnimal(m,user){

function sendGift(g,m){g.state='fly';g.t=0;g.fx=g.x;g.fy=g.y;g.target=m;SND.boing();

  const b=stationBase();stars(b+m.dx,m.y-50,10);confetti(b+m.dx,m.y-60,10,1.6);SND.chime(3);setTimeout(()=>playAnimal(m,false),220);}

// town lighting
const houseQueue=[];
function queueHouse(hs,delay){if(hs.queued)return;hs.queued=true;houseQueue.push({hs,at:T+delay});}

// ---------------------------------------------------------------- target / hints
function getTarget(){
  const ph=st.phase;
  if(ph==='coal'){const c=coals.find(c=>c.state==='shovel');if(c)return{kind:'coal',x:c.x,y:c.y,r:22,from:{x:c.x,y:c.y},to:l2w(DOOR.x,DOOR.y)};return null;}
  if(ph==='valve'){const p=l2w(VALVE.x,VALVE.y);return{kind:'valve',x:p.x,y:p.y,r:26};}
  if(ph==='whistle'){const k=cordKnob();const p=l2w(k.x,k.y);return{kind:'cord',x:p.x,y:p.y,r:20};}
  if(ph==='lever'){const k=leverKnob();const p=l2w(k.x,k.y);return{kind:'lever',x:p.x,y:p.y,r:22,to:l2w(leverKnob(LEVER_ON).x,leverKnob(LEVER_ON).y)};}
  if(ph==='run'){const slope=-(hx(E.x+30)-hx(E.x-30))/60;if(slope>0.12&&!st.hillHintDone){const p=l2w(20,-110);return{kind:'boost',x:p.x,y:p.y,r:70,soft:true};}return null;}
  if(ph==='arrive'){if(st.arriveT<5)return null;const b=stationBase();
    if(!st.bandTapped){const m=band[1];return{kind:'animal',x:b+m.dx,y:m.y-34,r:36};}
    if(!st.giftGiven){const g=gifts.find(g=>g.state==='wagon'&&g.pop>0.9);if(g){const h=giftHome(g);const m=band[0];return{kind:'gift',x:h.x,y:h.y,r:18,to:{x:b+m.dx,y:m.y-34}};}}
    if(st.arriveT>14||st.giftGiven){const k=leverKnob();const p=l2w(k.x,k.y);return{kind:'lever',x:p.x,y:p.y,r:22,to:l2w(leverKnob(LEVER_ON).x,leverKnob(LEVER_ON).y)};}
  }
  return null;
}

// ---------------------------------------------------------------- update
function update(dt){
  T+=dt;st.idle+=dt;
  const ph=st.phase;
  // --- fire & pressure
  if(E.lit){E.fire=Math.max(ph==='run'?0.75:0.3,E.fire-dt*0.035);}
  const vent=E.jet*0.35+(E.whistleOn&&whistlePower()>0?0.06:0);
  E.pressure=clamp(E.pressure+dt*(0.5*E.fire-0.07*E.pressure-vent),0,1.25);
  if(ph==='run')E.pressure=Math.max(E.pressure,0.65);
  if(E.valveOpened)E.pressure=Math.max(E.pressure,0.4);
  if(ph==='coal'&&E.pressure>=0.38){st.phase='valve';st.idle=Math.min(st.idle,2);}
  burnUpdate(E.fire);
  if(E.lit&&Math.random()<dt*E.fire*7)SND.crackle(E.fire/1.7);
  // --- valve
  E.valveVel=ease(E.valveVel,0,4,dt);E.valveAng+=E.valveVel*dt;
  E.jet=Math.max(0,E.jet-dt*0.55);E.jetT+=dt;
  if(E.jet>0)emitJet(dt);
  // leak hint
  if(E.pressure>0.2&&!E.valveOpened){E.leakT-=dt;if(E.leakT<=0){E.leakT=0.25+Math.random()*0.35-(st.idle>10?0.15:0);const v=l2w(VALVE.x+24,VALVE.y-6);smokePuff(v.x,v.y,18+Math.random()*10,-20,2.5,false,0.8,{grow:14,lowp:true});if(Math.random()<0.3)SND.hiss(0.05,0.25);}}
  // --- cord
  if(!E.cordHeld){E.cordVel+=(-E.cordPull*160-E.cordVel*9)*dt;E.cordPull+=E.cordVel*dt;if(E.cordPull<0){E.cordPull=0;E.cordVel*=-0.3;}}
  if(E.whistleTimer>0){E.whistleTimer-=dt;if(E.whistleTimer<=0)stopWhistle();}
  if(E.whistleOn){E.whistleT+=dt;whistleSet(1+E.cordPull*0.0025);const pw=whistlePower();
    if(pw>0&&Math.random()<dt*14){const w=l2w(WHISTLE.x,WHISTLE.y-6);smokePuff(w.x,w.y,(Math.random()-0.5)*10-E.v*0.3,-90-Math.random()*40,3,false,1.0,{grow:30,lowp:true});}
    if(pw>0&&Math.random()<dt*2.5){const w=l2w(WHISTLE.x,WHISTLE.y);soundRing(w.x,w.y,false);}
    if(pw>0&&E.whistleT>0.15&&!E.whistledOnce){E.whistledOnce=true;if(st.phase==='whistle'){st.phase='lever';setTimeout(()=>SND.chime(4),200);}}
  }
  // --- lever
  if(E.autoEngage&&!E.engaged){E.lever=Math.min(LEVER_ON,E.lever+dt*(E.lever<LEVER_REST+0.18?0.9:2.6));if(E.lever>LEVER_REST+0.42)engage();}
  if(!E.leverHeld&&!E.autoEngage){const tgt=E.engaged?LEVER_ON:LEVER_REST;E.leverVel+=((tgt-E.lever)*90-E.leverVel*10)*dt;E.lever+=E.leverVel*dt;}
  // --- driving
  const u=modL(E.x);
  if(ph==='run'){
    const slope=-(hx(E.x+20)-hx(E.x-20))/40; // uphill positive
    E.boost=Math.max(0,E.boost-dt*0.85);
    const drive=72*(0.6+0.4*Math.min(1,E.pressure))+E.boost*95;
    const grav=165*Math.sin(Math.atan(slope));
    let a=drive-grav-0.9*E.v;
    if(T-E.engageT<0.45)a=-10; // backward lurch before pull
    E.v+=a*dt;E.v=clamp(E.v,T-E.engageT<0.45?-6:14,205);
    // terminal approach
    const k=Math.floor(E.x/LAP);let stopX=k*LAP+STOP_U;if(E.x>stopX+50)stopX+=LAP;
    const dist=stopX-E.x;
    if(dist<520&&dist>-1&&T-E.engageT>2){E.stopping=true;E.v=Math.min(E.v,6+dist*0.36);E.boost=Math.min(E.boost,0.5);
      if(dist<1.5){E.x=stopX;E.v=0;arrive();}}
    E.x+=E.v*dt;
  }else{E.v=ease(E.v,0,6,dt);}
  // wheel kinematics share one model
  const dTheta=E.v*dt/30+(E.boost>0.2&&ph==='run'?E.boost*dt*0.6:0);
  E.theta+=dTheta;
  const ci=Math.floor(E.theta/(Math.PI/2));
  if(ci!==E.chuffIdx){const prev=E.chuffIdx;E.chuffIdx=ci;if(ph==='run'||Math.abs(E.v)>3){chuff(ci);} if(ci%2===0&&prev!==ci)SND.tick();}
  E.clackAcc+=Math.abs(E.v)*dt;if(E.clackAcc>64){E.clackAcc-=64;if(ph==='run')SND.clack();}
  // tilt & bob
  const tgtTilt=Math.atan2(hx(E.x+45)-hx(E.x-45),90);E.tilt=ease(E.tilt,tgtTilt,8,dt);
  E.lurchV+=(-E.lurch*120-E.lurchV*9)*dt;E.lurch+=E.lurchV*dt;
  const strain=ph==='run'?clamp(-(hx(E.x+20)-hx(E.x-20))/40*3,0,1)*(1-clamp(E.boost,0,1)):0;
  E.bob=ph==='run'?Math.sin(E.theta*2)*0.6*(0.5+strain)+Math.sin(T*40)*0.15*clamp(E.v/120,0,1):0;
  E.strain=strain;
  E.shake=Math.max(0,E.shake-dt*2);E.flash=Math.max(0,E.flash-dt*2.5);E.doorFlap=Math.max(0,E.doorFlap-dt*2);E.bodyKick=Math.max(0,E.bodyKick-dt*3);
  // breathing / idle puffs
  const awake=E.valveOpened;

  if(t==='bear'){c.fillStyle=fur[0];circ(c,-11,-11,5.5);c.fill();circ(c,11,-11,5.5);c.fill();c.fillStyle=fur[1];circ(c,-11,-11,2.8);c.fill();circ(c,11,-11,2.8);c.fill();}
  if(t==='squirrel'){c.fillStyle=fur[0];c.beginPath();c.moveTo(-9,-8);c.lineTo(-8,-18);c.lineTo(-3,-11);c.closePath();c.fill();c.beginPath();c.moveTo(9,-8);c.lineTo(8,-18);c.lineTo(3,-11);c.closePath();c.fill();}
  c.fillStyle=fur[0];circ(c,0,0,hr);c.fill();
  c.fillStyle=radG(-4,-5,1,0,0,hr,[[0,'rgba(255,255,255,0.3)'],[1,'rgba(80,40,10,0.2)']]);circ(c,0,0,hr);c.fill();
  c.fillStyle=fur[1];ell(c,0,5,7,5);c.fill();
  c.fillStyle='#3a2018';ell(c,0,2.5,2,1.5);c.fill();
  if(t==='cat'){c.strokeStyle='rgba(60,30,10,0.6)';c.lineWidth=0.7;[-1,1].forEach(s=>{c.beginPath();c.moveTo(s*4,4);c.lineTo(s*13,2);c.moveTo(s*4,5.5);c.lineTo(s*13,6.5);c.stroke();});}
  // eyes

  else{c.fillStyle='#2a1a10';[-5,5].forEach(ex=>{circ(c,ex+lookX*1.5,-1.5+lookY*1.5,2);c.fill();c.fillStyle='#fff';circ(c,ex+lookX*1.5-0.6,-2.2+lookY*1.5,0.7);c.fill();c.fillStyle='#2a1a10';});}
  c.fillStyle='rgba(240,110,120,0.5)';circ(c,-8,4,2.4);c.fill();circ(c,8,4,2.4);c.fill();
  // little hat
  c.fillStyle=m.cloth[1];rr(c,-6,-hr-5,12,6,2);c.fill();c.fillStyle=m.cloth[0];c.fillRect(-6,-hr-1,12,2);
  c.restore();
  // instruments + decorations
  const deco=m.gifts;
  if(t==='rabbit'){
    c.save();c.translate(0,-14);c.fillStyle='#c8463a';rr(c,-16,-6,32,18,3);c.fill();c.fillStyle='#f4ead8';ell(c,0,-6,16,4);c.fill();c.strokeStyle='#f2c14e';c.lineWidth=1.2;
    c.beginPath();for(let i=0;i<=8;i++){c.lineTo(-16+i*4,i%2?10:-4);}c.stroke();
    const sa=-0.9+hit*1.0;[-1,1].forEach((s,i)=>{c.save();c.translate(s*12,-26);c.rotate(s*(i===m.note%2?sa:-0.9)*-1);c.fillStyle=PAT.light;c.fillRect(-1.2,0,2.4,18);c.fillStyle='#fff3e0';circ(c,0,18,2.8);c.fill();c.restore();});
    if(hit>0.3){c.strokeStyle='rgba(255,255,255,0.8)';c.lineWidth=1.5;c.beginPath();c.arc(0,-6,20+hit*6,Math.PI*1.2,Math.PI*1.8);c.stroke();}

    const ma=hit*0.8;[-1,1].forEach(s=>{c.save();c.translate(s*10,-18);c.rotate(s*0.5-ma*s*0.6);c.strokeStyle=PAT.light;c.lineWidth=1.6;c.beginPath();c.moveTo(0,0);c.lineTo(0,20);c.stroke();c.fillStyle='#e85a6e';circ(c,0,21,3);c.fill();c.restore();});
    decoFlowers(deco,-18,2);c.restore();}
  else if(t==='bear'){

function decoFlowers(deco,x,y){const c=ctx;deco.forEach((g,i)=>{const col=g==='box'?'#e87a9a':g==='bouquet'?'#f2c14e':'#fff8ee';c.save();c.translate(x+i*8,y);for(let p=0;p<5;p++){c.rotate(TAU/5);c.fillStyle=col;ell(c,0,-3.2,2,3.2);c.fill();}c.fillStyle='#e85a6e';circ(c,0,0,1.8);c.fill();c.restore();});}
function drawHeld(){
  coals.forEach(cl=>{if(cl.state==='held'||cl.state==='fly')drawCoal(cl);});
  gifts.forEach(g=>{if(g.state==='held')drawGift(g.type,g.x,g.y-(g.lift||0)*4,1.2);});

// --- lights pass
function drawLights(xl,xr){
  const c=ctx;
  // stars & moon
  if(st.night>0.05){c.setTransform(DPR,0,0,DPR,0,0);const lim=OY+(-330-cam.y*0.08)*S;
    c.globalCompositeOperation='lighter';
    for(let i=0;i<60;i++){const sx=hash(i)*W,sy=hash(i+100)*Math.min(lim,H*0.5);if(sy>lim)continue;const tw=0.5+0.5*Math.sin(T*2+i*3);c.fillStyle=`rgba(255,250,220,${st.night*(0.4+0.5*tw)})`;circ(c,sx,sy,1+hash(i+7)*1.4);c.fill();}
    const mx=W*0.2,my=Math.min(lim-30,H*0.14)+SAFE.t;const mr=Math.min(W,H)*0.05;
    c.fillStyle=`rgba(255,240,200,${st.night*0.25})`;circ(c,mx,my,mr*2.2);c.fill();
    c.globalCompositeOperation='source-over';c.globalAlpha=st.night;c.fillStyle='#fbefc8';circ(c,mx,my,mr);c.fill();c.fillStyle='rgba(180,150,100,0.3)';circ(c,mx-mr*0.3,my+mr*0.2,mr*0.2);c.fill();circ(c,mx+mr*0.3,my-mr*0.3,mr*0.12);c.fill();c.globalAlpha=1;}
  setWorld(1);
  c.save();engineMaskClip();
  for(const L of lights){
    if(L.t==='win'){drawLitWindow(L);}
  }
  c.globalCompositeOperation='lighter';
  for(const L of lights){if(L.t==='win'){const age=L.age;const a=Math.min(1,age*3);const g=c.createRadialGradient(L.x,L.y+L.h/2,0,L.x,L.y+L.h/2,L.w*2.6);g.addColorStop(0,`rgba(${L.col[0]},${L.col[1]},${L.col[2]},${0.4*a*(0.3+st.night*0.7)})`);g.addColorStop(1,'rgba(255,200,100,0)');c.fillStyle=g;circ(c,L.x,L.y+L.h/2,L.w*2.6);c.fill();}}
  c.restore();
  c.globalCompositeOperation='lighter';
  const nightish=Math.max(st.night,st.tunnelDark,st.dusk*0.5);
  for(const L of lights){
    if(L.t==='glow'){const g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);g.addColorStop(0,`rgba(${L.c},${L.a*(0.4+nightish*0.6)})`);g.addColorStop(1,`rgba(${L.c},0)`);c.fillStyle=g;circ(c,L.x,L.y,L.r);c.fill();}
    else if(L.t==='lamp'){if(st.tunnelDark<0.05&&st.night<0.05)continue;const g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);g.addColorStop(0,`rgba(255,190,110,${0.5*Math.max(st.tunnelDark,0.3)})`);g.addColorStop(1,'rgba(255,190,110,0)');c.fillStyle=g;circ(c,L.x,L.y,L.r);c.fill();}
    else if(L.t==='beam'){const a=L.a*(0.25+nightish*0.6);const g=c.createLinearGradient(L.x,L.y,(L.bx+L.bx2)/2,(L.by+L.by2)/2);g.addColorStop(0,`rgba(255,240,180,${a})`);g.addColorStop(1,'rgba(255,240,180,0)');
      c.fillStyle=g;c.beginPath();c.moveTo(L.x,L.y-3);c.lineTo(L.bx2,L.by2);c.lineTo(L.bx,L.by);c.lineTo(L.x,L.y+3);c.closePath();c.fill();
      const g2=c.createRadialGradient(L.x,L.y,0,L.x,L.y,22);g2.addColorStop(0,`rgba(255,250,210,${L.a*0.9})`);g2.addColorStop(1,'rgba(255,250,210,0)');c.fillStyle=g2;circ(c,L.x,L.y,22);c.fill();}

const ENG_OUTLINE=[[-176,-170],[-114,-206],[-56,-180],[-56,-162],[-8,-160],[-4,-188],[15,-198],[34,-188],[38,-160],[62,-160],[58,-234],[102,-234],[92,-160],[100,-166],[100,-188],[128,-188],[134,-160],[134,-62],[152,-46],[162,2],[-142,2],[-162,-40],[-176,-60]];
function engineMaskClip(){const c=ctx;const w0=s2w(-50,-50),w1=s2w(W+50,H+50);c.beginPath();c.rect(w0.x,w0.y,w1.x-w0.x,w1.y-w0.y);

function drawLitWindow(L){
  const c=ctx;const a=Math.min(1,L.age*4);const x=L.x-L.w/2,y=L.y;
  c.save();c.globalAlpha=a;
  c.fillStyle=`rgb(${L.col[0]},${L.col[1]},${L.col[2]})`;rr(c,x,y,L.w,L.h,3);c.fill();
  c.save();rr(c,x,y,L.w,L.h,3);c.clip();

  const pop=sm((L.age-0.4)*2);const wv=L.wave*2;
  if(pop>0){c.fillStyle='rgba(90,50,40,0.75)';const cx=L.x,cy=y+L.h+6-pop*12+wv;circ(c,cx,cy,6);c.fill();
    const an=L.an%5;if(an===0){ell(c,cx-3,cy-8,1.6,5);c.fill();ell(c,cx+3,cy-8,1.6,5);c.fill();}else if(an===1){c.beginPath();c.moveTo(cx-6,cy-2);c.lineTo(cx-5,cy-10);c.lineTo(cx-1,cy-5);c.moveTo(cx+6,cy-2);c.lineTo(cx+5,cy-10);c.lineTo(cx+1,cy-5);c.fill();}else{circ(c,cx-5,cy-5,2.4);c.fill();circ(c,cx+5,cy-5,2.4);c.fill();}}

}
// --- target halo & demo
function drawHalo(){
  const tg=getTarget();if(!tg)return;if(st.phase==='run'&&!tg.soft)return;
  const c=ctx;const pulse=0.5+0.5*Math.sin(T*4);const r=tg.r*(1.25+pulse*0.25+tgNudge*0.4);
  c.globalCompositeOperation='lighter';
  const g=c.createRadialGradient(tg.x,tg.y,r*0.3,tg.x,tg.y,r*1.6);const a=tg.soft?0.12+pulse*0.08:0.28+pulse*0.2;
  g.addColorStop(0,`rgba(255,230,140,${a})`);g.addColorStop(0.6,`rgba(255,210,100,${a*0.5})`);g.addColorStop(1,'rgba(255,200,80,0)');c.fillStyle=g;circ(c,tg.x,tg.y,r*1.6);c.fill();
  c.globalCompositeOperation='source-over';
  if(!tg.soft){c.strokeStyle=`rgba(255,240,180,${0.35+pulse*0.4})`;c.lineWidth=2.5/S*1.5;circ(c,tg.x,tg.y,r);c.stroke();
    // sparkle
    const sa=T*2;for(let i=0;i<3;i++){const an=sa+i*TAU/3;const sx=tg.x+Math.cos(an)*r,sy=tg.y+Math.sin(an)*r;c.fillStyle=`rgba(255,250,210,${0.5+pulse*0.5})`;c.save();c.translate(sx,sy);c.rotate(T*3);c.beginPath();for(let k=0;k<8;k++){const rr_=k%2?1.2:3.6;const a2=k/8*TAU;c.lineTo(Math.cos(a2)*rr_,Math.sin(a2)*rr_);}c.closePath();c.fill();c.restore();}}
}
function drawDemo(){
  if(!demo.active||!demo.tg)return;const tg=getTarget();if(!tg){demo.active=false;return;}
  const c=ctx;const t=demo.t,D=demo.dur;
  let x=tg.x,y=tg.y,press=0;const fadeA=Math.min(1,t*3,(D-t)*3);
  const k=tg.kind;
  if((k==='coal'||k==='gift'||k==='lever')&&tg.to){const m=clamp((t-0.5)/(D-1.1),0,1);const e=sm(m);x=lerp(tg.x,tg.to.x,e);y=lerp(tg.y,tg.to.y,e)-Math.sin(e*Math.PI)*(k==='lever'?0:30);press=t>0.4&&t<D-0.5?1:0;}
  else if(k==='cord'){const m=clamp((t-0.5)/1.2,0,1);y=tg.y+sm(m)*45;press=t>0.4&&t<1.9?1:0;}
  else if(k==='valve'){const m=clamp((t-0.4)/1.3,0,1);const an=-1+m*2.5;x=tg.x+Math.cos(an)*16;y=tg.y+Math.sin(an)*16;press=t>0.35&&t<1.8?1:0;}
  else{press=(Math.floor(t*2.2)%2===1)?1:0;}
  c.save();c.globalAlpha=fadeA;
  if(press){c.strokeStyle='rgba(255,255,255,0.8)';c.lineWidth=2/S*1.4;const rp=8+((t*3)%1)*14;circ(c,x,y,rp);c.stroke();}
  // hand
  const hs=1.15/Math.max(0.8,S/1.3);
  c.translate(x,y);c.scale(hs,hs);c.translate(press?2:6,press?2:8);
  c.fillStyle='rgba(40,20,10,0.25)';c.beginPath();c.ellipse(10,30,14,6,0,0,TAU);c.fill();
  c.fillStyle='#fde3c8';c.strokeStyle='#a0704a';c.lineWidth=1.6;
  c.beginPath();c.moveTo(-3,0);c.quadraticCurveTo(-4,-1,-3,-3);c.quadraticCurveTo(0,-6,3,-3);c.lineTo(4,12);c.quadraticCurveTo(9,8,12,12);c.quadraticCurveTo(16,9,19,14);c.quadraticCurveTo(23,12,24,18);c.lineTo(24,30);c.quadraticCurveTo(22,40,12,42);c.quadraticCurveTo(0,42,-2,32);c.lineTo(-8,20);c.quadraticCurveTo(-10,15,-5,15);c.lineTo(-2,19);c.closePath();c.fill();c.stroke();
  c.strokeStyle='rgba(160,112,74,0.5)';c.lineWidth=1;c.beginPath();c.moveTo(12,13);c.lineTo(12,20);c.moveTo(19,15);c.lineTo(19,22);c.stroke();
  c.restore();
}

// ---------------------------------------------------------------- loop
let last=0,raf=0,errCount=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  if(!last)last=now;let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<=0)return;
  try{update(dt);render();}catch(e){if(errCount++<1)console.error(e);}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;releaseAll();whistleStop();E.whistleOn=false;if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
  else{last=0;if(!raf)raf=requestAnimationFrame(frame);if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
});

if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);

cam.x=E.x-6;cam.y=0;

window.__poppo={st,E,get phase(){return st.phase;},get T(){return T;},jump(u){E.x=u;cam.x=u;},band:()=>band,gifts:()=>gifts,demo,target:()=>{const t=getTarget();return t?Object.assign(w2s(t.x,t.y),{kind:t.kind}):null;},w2s:(x,y)=>w2s(x,y),bandPos:()=>{const b=stationBase();return band.map(m=>w2s(b+m.dx,m.y-34));}};
