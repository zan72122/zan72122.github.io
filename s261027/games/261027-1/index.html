(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),saEl=document.getElementById('sa');
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eo=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const eb=t=>{t=clamp(t,0,1);const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const hyp=Math.hypot;
let W=390,H=844,DPR=1,U=1,PORT=true,T=0;
const SA={t:0,r:0,b:0,l:0};
const INK='#6d4f60';
const PAL=['#f7b6c8','#bfe8d6','#d9cdf3','#fbe7a1','#fbcfb4'];
const sp=(p=0)=>({p,v:0});
function spr(o,tg,k,c,dt){o.v+=((tg-o.p)*k-o.v*c)*dt;o.p+=o.v*dt;}

// ---------- timers / tweens ----------
let timers=[];
function after(d,fn){timers.push({t:T+d,fn});}
function runTimers(){if(!timers.length)return;const due=[];timers=timers.filter(x=>{if(x.t<=T){due.push(x);return false;}return true;});due.sort((a,b)=>a.t-b.t);for(const x of due){try{x.fn();}catch(e){console.warn(e);}}}
let tweens=[];
function tw(o,k,to,dur,delay=0,fn=sm){tweens=tweens.filter(x=>!(x.o===o&&x.k===k));tweens.push({o,k,from:null,to,t:-delay,dur,fn});}
function runTweens(dt){for(const x of tweens){x.t+=dt;if(x.t<0)continue;if(x.from===null)x.from=x.o[x.k];x.o[x.k]=x.from+(x.to-x.from)*x.fn(x.t/x.dur);}tweens=tweens.filter(x=>x.t<x.dur);}

// ---------- AUDIO ----------
let AC=null,MG=null,MUS=null,NB=null;
function initAudio(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      AC=new A();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.2;
      MG=AC.createGain();MG.gain.value=0.5;MG.connect(comp);comp.connect(AC.destination);
      MUS=AC.createGain();MUS.gain.value=0;MUS.connect(MG);
      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function O(type,f0,f1,t,dur,pk,at=0.006,out){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.8);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(out||MG);o.start(t);o.stop(t+dur+0.03);return o;}
function N(t,dur,pk,ft,f,q,f1,out){const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(out||MG);s.start(t,Math.random()*0.4);s.stop(t+dur+0.03);}
function snd(fn){if(!AC||AC.state==='closed')return;try{fn(AC.currentTime+0.005);}catch(e){}}
const SFX={
  peel:()=>snd(t=>{for(let i=0;i<5;i++)N(t+i*0.022+Math.random()*0.008,0.03,0.09,'bandpass',2200+i*500,3);N(t,0.12,0.025,'highpass',3500,0.7);O('sine',1800,2600,t,0.05,0.02);}),
  stick:()=>snd(t=>{O('sine',1200,380,t,0.08,0.17);N(t,0.03,0.06,'lowpass',1500,0.8);}),
  poyon:(f=320,v=1)=>snd(t=>{t+=0.03;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*0.8,t);o.frequency.exponentialRampToValueAtTime(f*1.7,t+0.08);o.frequency.exponentialRampToValueAtTime(f*1.15,t+0.3);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.15*v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.36);o.connect(g);g.connect(MG);o.start(t);o.stop(t+0.4);O('triangle',f*1.6,f*2.6,t,0.12,0.03*v);}),
  boing:()=>snd(t=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(470,t+0.5);l.frequency.value=14;lg.gain.value=22;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.24,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);o.connect(g);g.connect(MG);o.start(t);l.start(t);o.stop(t+0.62);l.stop(t+0.62);}),
  land:()=>snd(t=>{O('sine',170,70,t,0.26,0.25);N(t,0.12,0.08,'lowpass',380,0.8);}),
  bells:()=>snd(t=>{[1568,1976,2349,2637,3136].forEach((f,i)=>O('triangle',f,f,t+i*0.07,0.5,0.04));N(t,0.7,0.05,'bandpass',500,1.2,2600);}),
  drum:(f=180,v=1)=>snd(t=>{O('sine',f*1.6,f,t,0.42,0.3*v,0.003);O('triangle',f*2.02,f*1.9,t,0.13,0.05*v,0.003);N(t,0.07,0.07*v,'lowpass',1000,0.7);}),
  tok:(f=700)=>snd(t=>{O('triangle',f,f*0.8,t,0.08,0.09,0.002);}),
  twinkle:(i=0)=>snd(t=>{const f=1320*Math.pow(2,[0,2,4,7,9][i%5]/12);O('sine',f,f,t,0.3,0.06);O('sine',f*2,f*2,t+0.04,0.2,0.022);}),
  door:()=>snd(t=>{[523,659,784,1047,1319,1568].forEach((f,i)=>O('triangle',f,f,t+i*0.11,0.6,0.065));[262,330,392].forEach(f=>O('sine',f,f,t,1.5,0.04,0.3));}),
  voice:(base,n=4)=>snd(t=>{for(let i=0;i<n;i++){const f=base*(1+0.18*Math.sin(i*2.1));const tt=t+i*0.085;O('sine',f,f*1.32,tt,0.08,0.07,0.01);O('triangle',f*2,f*2.5,tt,0.06,0.014,0.01);}}),
  hmm:(base)=>snd(t=>{O('sine',base*0.9,base*1.35,t,0.34,0.08,0.03);O('sine',base*1.2,base*0.9,t+0.36,0.2,0.04,0.03);}),
  eat:(base)=>snd(t=>{for(let i=0;i<3;i++)O('triangle',base*0.5,base*0.38,t+i*0.16,0.09,0.09,0.01);}),
  squeak:()=>snd(t=>{O('sine',620,900,t,0.2,0.06);O('sine',900,700,t+0.12,0.15,0.03);}),
  cream:()=>snd(t=>{N(t,0.16,0.06,'lowpass',700,1,300);O('sine',260,170,t,0.15,0.07);}),
  pop:()=>snd(t=>{O('sine',500,1300,t,0.07,0.08);}),
  tick:()=>snd(t=>{O('sine',900,900,t,0.06,0.02);}),
  whoosh:()=>snd(t=>{N(t,0.7,0.05,'bandpass',300,1.5,1800);}),
  conf:()=>snd(t=>{for(let i=0;i<4;i++)N(t+i*0.03,0.04,0.03,'highpass',4000,0.7);}),
  puff:()=>snd(t=>{O('sine',240,150,t,0.14,0.08);N(t,0.08,0.025,'lowpass',600,0.7);}),
  note:(i)=>snd(t=>{const f=523*Math.pow(2,[0,2,4,7,9,12,14,16][((i%8)+8)%8]/12);O('sine',f,f,t,0.25,0.05);}),
};
// party music: happy birthday (public domain) + soft percussion
const HB=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3],[0,3],
  [72,.5],[74,.5],[76,1],[79,1],[76,.5],[74,.5],[72,2],[0,1],[69,.5],[72,.5],[74,1],[76,1],[74,1],[72,2],[0,3]];
const MUSIC={on:false,i:0,nt:0,pb:0,beat:0};const SPB=60/104;
function musicStart(){if(!AC)return;MUSIC.on=true;MUSIC.i=0;MUSIC.nt=AC.currentTime+0.3;MUSIC.pb=MUSIC.nt;MUSIC.beat=0;MUS.gain.cancelScheduledValues(AC.currentTime);MUS.gain.setTargetAtTime(1,AC.currentTime,0.6);}
function musicStop(){MUSIC.on=false;if(AC){MUS.gain.cancelScheduledValues(AC.currentTime);MUS.gain.setTargetAtTime(0,AC.currentTime,0.25);}}
function musicTick(){
  if(!MUSIC.on||!AC||AC.state!=='running')return;
  if(MUSIC.nt<AC.currentTime-0.4){MUSIC.nt=AC.currentTime+0.1;MUSIC.pb=MUSIC.nt;}
  const ah=AC.currentTime+0.35;
  while(MUSIC.nt<ah){const [n,b]=HB[MUSIC.i];if(n){const f=440*Math.pow(2,(n-69)/12);O('triangle',f,f,MUSIC.nt,Math.min(0.9,b*SPB*0.9),0.04,0.012,MUS);O('sine',f*2,f*2,MUSIC.nt,0.15,0.008,0.005,MUS);}MUSIC.nt+=b*SPB;MUSIC.i=(MUSIC.i+1)%HB.length;}
  while(MUSIC.pb<ah){const bt=MUSIC.beat%3;if(bt===0)O('sine',110,60,MUSIC.pb,0.18,0.06,0.003,MUS);else N(MUSIC.pb,0.05,0.02,'highpass',5000,0.7,null,MUS);MUSIC.pb+=SPB;MUSIC.beat++;}
}

// ---------- LAYOUT ----------
const L={room:{},gar:{}};
function mkSheetRow(x,y,w,h){const r=Math.min(h*0.34,w/4*0.36);return{x,y,w,h,slots:[0,1,2,3].map(i=>({x:x+w*(i+0.5)/4,y:y+h*0.53,r}))};}
function mkSheetGrid(x,y,w,h){const r=Math.min(w*0.2,h*0.17);return{x,y,w,h,slots:[0,1,2,3].map(i=>({x:x+w*(i%2?0.72:0.28),y:y+h*(i<2?0.28:0.72),r}))};}
function doLayout(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;
  PORT=H>=W;
  const top=SA.t,bot=H-SA.b,lf=SA.l,rt=W-SA.r,ih=bot-top;
  const rm=L.room,g=L.gar;rm.top=top;
  if(PORT){
    U=Math.min(W/390,H/800);
    const fy=top+ih*0.40;const sheetH=124*U,sy=bot-12*U-sheetH;
    rm.floorY=fy;
    rm.door={cx:W/2,w:140*U,h:196*U,bot:fy-2*U};rm.door.top=rm.door.bot-rm.door.h;
    rm.win={cx:W*0.86,cy:top+118*U,w:66*U,h:80*U};
    rm.shelf={x0:lf+8*U,x1:lf+112*U,y:top+92*U};
    rm.lamps=[{x:W/2,y:top+Math.max(54*U,(rm.door.top-top)*0.62),t:'pend'},{x:lf+30*U,y:rm.door.top+40*U,t:'sconce'},{x:rm.shelf.x0+20*U,y:rm.shelf.y,t:'table'},{x:rt-24*U,y:rm.win.cy+rm.win.h/2+46*U,t:'sconce'}];
    rm.orns=[{x:W*0.33,len:28*U,k:0},{x:W*0.67,len:42*U,k:1},{x:W*0.84,len:22*U,k:2}];
    rm.boxes=[{x:lf+22*U,y:fy+20*U,s:24*U,c:'#bfe8d6',r:'#f7b6c8'},{x:rt-22*U,y:fy+22*U,s:22*U,c:'#d9cdf3',r:'#fbe7a1'}];
    const ff=fy+26*U;
    rm.fam={mom:{x:W*0.2,y:ff},baby:{x:W*0.5,y:ff+6*U},dad:{x:W*0.8,y:ff}};
    L.rs={baby:84*U,mom:126*U,dad:138*U};
    const gz=sy-fy;
    rm.gift={hat:{x:W*0.2,y:fy+gz*0.36,R:56*U},drum:{x:W*0.8,y:fy+gz*0.37,R:54*U},pillow:{x:W*0.5,y:fy+gz*0.67,R:92*U}};
    rm.rug={cx:W/2,cy:fy+gz*0.6,rx:W*0.47,ry:gz*0.3};
    L.sheetR=mkSheetRow(lf+10*U,sy,rt-lf-20*U,sheetH);
    g.horizon=top+ih*0.30;
    g.house={x0:lf-14*U,x1:W*0.27,top:g.horizon-118*U,bot:g.horizon+16*U};g.house.door={cx:W*0.135,w:42*U,h:62*U,bot:g.house.bot-2*U};g.house.door.top=g.house.door.bot-g.house.door.h;
    g.cake={cx:W*0.5,by:top+ih*0.715,cw:192*U};
    g.fam={baby:{x:W*0.17,y:top+ih*0.565},dad:{x:W*0.53,y:top+ih*0.415},mom:{x:W*0.85,y:top+ih*0.475}};
    g.tray={x:W*0.19,y:top+ih*0.78,w:144*U,h:60*U};
    g.sun={x:W*0.8,y:top+46*U,r:26*U};
    const ax=[0.34,0.47,0.62,0.76,0.93],ay=[150,178,140,168,132],ox=[-10,6,-6,8,-14];
    g.bal=ax.map((a,i)=>({ax:W*a,ay:g.horizon+4*U,rx:W*a+ox[i]*U,ry:Math.max(top+46*U,g.horizon-ay[i]*U),r:26*U}));
    L.sheetG=L.sheetR;
  }else{
    U=Math.min(W/1180,H/820);
    const fy=top+ih*0.50;const shW=224*U,shX=rt-14*U-shW,shY=top+ih*0.25,shH=bot-14*U-shY;
    rm.floorY=fy;
    rm.door={cx:W*0.40,w:186*U,h:256*U,bot:fy-2*U};rm.door.top=rm.door.bot-rm.door.h;
    rm.win={cx:W*0.865,cy:top+96*U,w:120*U,h:116*U};
    rm.shelf={x0:lf+22*U,x1:lf+250*U,y:top+150*U};
    rm.lamps=[{x:rm.door.cx,y:top+Math.max(70*U,(rm.door.top-top)*0.6),t:'pend'},{x:rm.door.cx-rm.door.w/2-50*U,y:rm.door.top+54*U,t:'sconce'},{x:rm.shelf.x0+30*U,y:rm.shelf.y,t:'table'},{x:rm.door.cx+rm.door.w/2+50*U,y:rm.door.top+54*U,t:'sconce'}];
    rm.orns=[{x:W*0.22,len:40*U,k:0},{x:W*0.58,len:56*U,k:1},{x:W*0.7,len:34*U,k:2}];
    rm.boxes=[{x:lf+34*U,y:fy+44*U,s:32*U,c:'#bfe8d6',r:'#f7b6c8'},{x:shX-44*U,y:fy+34*U,s:28*U,c:'#d9cdf3',r:'#fbe7a1'}];
    rm.fam={mom:{x:W*0.15,y:fy+38*U},baby:{x:W*0.40,y:fy+46*U},dad:{x:W*0.64,y:fy+38*U}};

    g.cake={cx:W*0.45,by:top+ih*0.80,cw:262*U};
    g.fam={baby:{x:W*0.21,y:top+ih*0.74},dad:{x:W*0.70,y:top+ih*0.60},mom:{x:W*0.88,y:top+ih*0.56}};

    g.bal=ax.map((a,i)=>({ax:W*a,ay:g.horizon+4*U,rx:W*a+ox[i]*U,ry:Math.max(top+60*U,g.horizon-ay[i]*U),r:34*U}));
    const gx=W*0.6;L.sheetG=mkSheetRow(gx,bot-14*U-118*U,rt-14*U-gx,118*U);
  }
}

// ---------- STATE ----------

const G={},RB={};
const S={scene:'room',busy:false,cycle:0,active:'pillow',delivered:0,lastIn:0,lastHint:-99,hint:null,fc:null,
  slots:[0,1,2,3].map(()=>({has:true,pop:sp(1)})),bend:sp(),bendSlot:0,hs:new Map(),lifted:null,fly:[],

// ---------- DRAW PRIMS ----------
function E(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(1e-4,Math.abs(rx)),Math.max(1e-4,Math.abs(ry)),rot,0,TAU);}
function fE(x,y,rx,ry,c,rot=0){E(x,y,rx,ry,rot);ctx.fillStyle=c;ctx.fill();}
function RR(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fRR(x,y,w,h,r,c){RR(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();}
function blob(x,y,rx,ry,c,rot=0,sh){fE(x+Math.abs(rx)*0.06,y+Math.abs(ry)*0.1,rx,ry,sh||'rgba(170,120,140,0.2)',rot);fE(x,y,rx,ry,c,rot);}
function pStar(r){ctx.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,rr=i%2?r*0.5:r;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
function pStar4(r){ctx.beginPath();for(let i=0;i<8;i++){const a=-PI/2+i*PI/4,rr=i%2?r*0.32:r;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
function pHeart(r){ctx.beginPath();ctx.moveTo(0,r*0.85);ctx.bezierCurveTo(-r*1.25,r*0.05,-r*0.8,-r*0.98,0,-r*0.4);ctx.bezierCurveTo(r*0.8,-r*0.98,r*1.25,r*0.05,0,r*0.85);ctx.closePath();}
function pFlower(r,open=1){ctx.beginPath();for(let i=0;i<5;i++){const a=-PI/2+i*TAU/5,d=r*0.52*open;const x=Math.cos(a)*d,y=Math.sin(a)*d;ctx.moveTo(x+r*0.45,y);ctx.arc(x,y,r*0.45,0,TAU);}}
function pBerry(r){ctx.beginPath();ctx.moveTo(0,r*0.95);ctx.bezierCurveTo(-r*0.55,r*0.78,-r*0.98,r*0.05,-r*0.84,-r*0.36);ctx.bezierCurveTo(-r*0.72,-r*0.72,-r*0.22,-r*0.7,0,-r*0.56);ctx.bezierCurveTo(r*0.22,-r*0.7,r*0.72,-r*0.72,r*0.84,-r*0.36);ctx.bezierCurveTo(r*0.98,r*0.05,r*0.55,r*0.78,0,r*0.95);ctx.closePath();}
function leaves(r,y){ctx.fillStyle='#8fd6b0';for(let i=0;i<5;i++){const a=-PI/2+(i-2)*0.55;E(Math.cos(a)*r*0.2,y+Math.sin(a)*r*0.12+r*0.05,r*0.22,r*0.09,a);ctx.fill();}}
const SEEDS=[[-0.38,-0.12],[0.32,-0.16],[0,0.12],[-0.2,0.45],[0.24,0.4],[0,-0.32],[-0.5,0.15],[0.5,0.12]];
const SK=[{c:'#fbd56a',d:'#e9b648',l:'#fff1c4'},{c:'#f7a3bd',d:'#e57d9d',l:'#ffe1ec'},{c:'#c7b3f3',d:'#a68be4',l:'#ece4ff'},{c:'#f47f91',d:'#dc5f73',l:'#ffdfe4'}];
function sPath(k,r,open){if(k===0)pStar(r);else if(k===1)pHeart(r);else if(k===2)pFlower(r,open);else pBerry(r);}
const bumpF=(t,c)=>{const x=(t-c)/0.1;return Math.abs(x)<1?(1-x*x):0;};
function drawSticker(k,r,age=9,mat=null){
  let open=1,sc=1;
  if(k===1&&age<0.8)sc=1+0.2*(bumpF(age,0.1)+bumpF(age,0.38));
  if(k===2&&age<0.8)open=0.7+0.3*eb(age/0.5);
  r*=sc;ctx.lineJoin='round';ctx.lineCap='round';
  sPath(k,r,open);ctx.lineWidth=r*0.3;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle=SK[k].c;ctx.fill();ctx.lineWidth=r*0.1;ctx.strokeStyle=SK[k].c;ctx.stroke();
  if(k===0)fE(-r*0.16,-r*0.2,r*0.15,r*0.09,'rgba(255,255,255,0.7)',-0.5);
  else if(k===1)fE(-r*0.38,-r*0.3,r*0.16,r*0.1,'rgba(255,255,255,0.65)',-0.7);
  else if(k===2){fE(0,0,r*0.3,r*0.3,'#fde49a');fE(-r*0.08,-r*0.08,r*0.1,r*0.07,'rgba(255,255,255,0.7)');}
  else{const gl=age<0.7;for(let i=0;i<6;i++){const s=SEEDS[i];fE(s[0]*r,s[1]*r,r*0.06,r*0.09,gl?'#ffffff':'#ffeeb8');}leaves(r,-r*0.6);}
  if(mat==='pillow'){sPath(k,r*0.8,open);ctx.setLineDash([r*0.15,r*0.12]);ctx.lineWidth=r*0.07;ctx.strokeStyle=SK[k].d;ctx.stroke();ctx.setLineDash([]);}
  else if(mat==='drum'){fE(r*0.25,-r*0.3,r*0.12,r*0.06,'rgba(255,255,255,0.8)',0.6);}
  else if(mat==='hat'){sPath(k,r*0.88,open);ctx.lineWidth=r*0.05;ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.stroke();}
  if(k===0&&age<0.7){const q=age/0.7;ctx.strokeStyle=`rgba(255,230,140,${1-q})`;ctx.lineWidth=r*0.16*(1-q)+0.001;for(let i=0;i<5;i++){const a=-PI/2+i*TAU/5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*(1.2+q*0.5),Math.sin(a)*r*(1.2+q*0.5));ctx.lineTo(Math.cos(a)*r*(1.6+q*1.2),Math.sin(a)*r*(1.6+q*1.2));ctx.stroke();}}
  if(k===3&&age<0.7){const q=age/0.7;ctx.fillStyle=`rgba(255,250,220,${1-q})`;for(const i of [0,2,4]){const s=SEEDS[i];ctx.save();ctx.translate(s[0]*r,s[1]*r);ctx.rotate(q*2);pStar4(r*0.35*(1-q*0.5));ctx.fill();ctx.restore();}}
}
function drawFood(type,r){
  if(type==='berry'||type==='big'){fE(r*0.08,r*0.12,r*0.9,r*0.95,'rgba(170,90,110,0.22)');pBerry(r);ctx.fillStyle='#f26f86';ctx.fill();fE(-r*0.35,-r*0.15,r*0.14,r*0.24,'rgba(255,255,255,0.35)',0.3);for(const s of SEEDS)fE(s[0]*r*0.95,s[1]*r*0.95,r*0.05,r*0.075,'#ffe9a8');leaves(r*1.1,-r*0.62);}
  else if(type==='heart'){pHeart(r);ctx.fillStyle='rgba(170,90,110,0.2)';ctx.save();ctx.translate(r*0.08,r*0.1);ctx.fill();ctx.restore();pHeart(r);ctx.fillStyle='#f9a8c2';ctx.fill();ctx.lineWidth=r*0.12;ctx.strokeStyle='#fde4ec';ctx.stroke();fE(-r*0.38,-r*0.3,r*0.15,r*0.09,'rgba(255,255,255,0.7)',-0.7);}
  else if(type==='slice'){ctx.beginPath();ctx.moveTo(-r,r*0.55);ctx.lineTo(r,r*0.55);ctx.lineTo(r*0.15,-r*0.55);ctx.closePath();ctx.lineJoin='round';ctx.lineWidth=r*0.18;ctx.strokeStyle='#fff3dc';ctx.stroke();ctx.fillStyle='#fff3dc';ctx.fill();
    ctx.fillStyle='#f9c9d6';ctx.fillRect(-r*0.55,r*0.08,r*1.25,r*0.14);fE(r*0.1,-r*0.45,r*0.4,r*0.16,'#ffffff',0.5);ctx.save();ctx.translate(r*0.15,-r*0.7);drawFood('berry',r*0.32);ctx.restore();}
}

// ---------- GIFT GEOMETRY ----------
const PIL=[],CROWN=[],MEM=[];
for(let i=0;i<36;i++){const th=i/36*TAU,c=Math.cos(th),s=Math.sin(th);const u=Math.sign(c)*Math.pow(Math.abs(c),0.6),v=Math.sign(s)*Math.pow(Math.abs(s),0.6)*0.66;const n=hyp(u,v/0.44)||1;PIL.push([u,v,u/n,v/0.44/n]);}
for(let i=0;i<=20;i++){const th=PI+i/20*PI;CROWN.push([0.6*Math.cos(th),0.2+0.82*Math.sin(th),Math.cos(th),Math.sin(th)]);}
CROWN.push([0.6,0.21,0,1],[0,0.22,0,1],[-0.6,0.21,0,1]);
for(let i=0;i<28;i++){const th=i/28*TAU;MEM.push([0.86*Math.cos(th),-0.2+0.34*Math.sin(th),0,-1]);}
const REG={pillow:[{x:0,y:0,rx:0.98,ry:0.64}],hat:[{x:0,y:-0.18,rx:0.58,ry:0.42},{x:0,y:0.3,rx:0.98,ry:0.2,brim:1}],drum:[{x:0,y:-0.2,rx:0.84,ry:0.32,top:1},{x:0,y:0.2,rx:0.88,ry:0.27}]};
function hField(g,u,v){let h=0;for(const st of g.st){const d=hyp(u-st.u,v-st.v)/(st.r*1.9);if(d<1){const f=1-d*d;h+=st.p*f*f;}}for(const d of g.dents){const dd=hyp(u-d.u,v-d.v)/d.r;if(dd<1){const f=1-dd*dd;h+=d.p*f*f;}}return h;}
function deform(g,base,amp){const has=g.st.length||g.dents.length;return base.map(b=>{const h=has?hField(g,b[0],b[1]):0;return[b[0]+b[2]*h*amp,b[1]+b[3]*h*amp];});}
function smooth(pts){const n=pts.length;ctx.beginPath();const p0=pts[n-1],p1=pts[0];ctx.moveTo((p0[0]+p1[0])/2,(p0[1]+p1[1])/2);for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}ctx.closePath();}
function regD(kind,u,v){let best=null;REG[kind].forEach((e,i)=>{const du=(u-e.x)/e.rx,dv=(v-e.y)/e.ry,d=hyp(du,dv);if(!best||d<best.d)best={d,du,dv,e,i};});return best;}
function snapGift(g,u,v){const b=regD(g.kind,u,v);const lim=0.8;let du=b.du,dv=b.dv;if(b.d>lim){du*=lim/b.d;dv*=lim/b.d;}return{u:b.e.x+du*b.e.rx,v:b.e.y+dv*b.e.ry,top:!!b.e.top,reg:b.i};}

function patches(g,filter){
  for(const st of g.st){if(filter&&!filter(st))continue;const p=st.p;const a=clamp(Math.abs(p)*2.4,0,1);if(a<0.02)continue;const rr=st.r*(1.3+0.45*Math.max(0,p)),sy=st.top?0.58:1;
    if(p>0){fE(st.u+0.025,st.v+0.07*sy,rr,rr*sy,`rgba(195,150,170,${0.3*a})`);ctx.globalAlpha=a;fE(st.u,st.v-0.01,rr,rr*sy,SK[st.kind].l);ctx.globalAlpha=1;}
    else fE(st.u,st.v,rr*0.9,rr*0.9*sy,`rgba(200,160,180,${0.4*a})`);}
  for(const d of g.dents){if(filter&&!filter(d))continue;const a=clamp(Math.abs(d.p)*1.6,0,0.5);if(d.p<0)fE(d.u,d.v+0.02,d.r*0.75,d.r*0.6,`rgba(205,165,182,${a})`);else{fE(d.u+0.02,d.v+0.08,d.r*0.7,d.r*0.5,`rgba(205,165,182,${a*0.5})`);}}
}
function drawPlaced(g,st,oy=0){
  ctx.save();const p=st.p;ctx.translate(st.u,st.v+oy-Math.max(0,p)*0.05);if(st.top)ctx.scale(1,0.58);ctx.rotate(st.rot);
  const sc=1+p*0.4;ctx.scale(sc*(1+p*0.05),sc*(1+p*0.1));drawSticker(st.kind,st.r,T-st.t0,g.kind);ctx.restore();
}
function drawGift(g,x,y,R,shadow=true){
  ctx.save();const q=g.sq.p;ctx.translate(x,y+R*q*0.13);ctx.scale(R*(1+q*0.16),R*(1-q*0.2));ctx.lineJoin='round';ctx.lineCap='round';
  if(g.kind==='pillow')drawPillow(g,shadow);else if(g.kind==='hat')drawHat(g,shadow);else drawDrum(g,shadow);
  ctx.restore();
}
function drawPillow(g,shadow){
  if(shadow)fE(0,0.68,0.98,0.11,'rgba(150,110,125,0.16)');
  const pts=deform(g,PIL,0.16);
  ctx.save();ctx.translate(0.05,0.07);smooth(pts);ctx.fillStyle='rgba(205,165,180,0.35)';ctx.fill();ctx.restore();
  smooth(pts);ctx.fillStyle='#fffdf9';ctx.fill();ctx.lineWidth=0.022;ctx.strokeStyle='#efe0e5';ctx.stroke();
  ctx.save();smooth(pts);ctx.clip();fE(0.12,0.62,1.2,0.4,'#fbf1f3');fE(-0.3,-0.35,0.5,0.18,'#ffffff',-0.2);patches(g);ctx.restore();
  ctx.save();ctx.scale(0.85,0.82);smooth(PIL);ctx.setLineDash([0.06,0.05]);ctx.lineWidth=0.024;ctx.strokeStyle='#f2dbe3';ctx.stroke();ctx.setLineDash([]);ctx.restore();
  for(const sx of [-1,1])for(const sy of [-1,1])fE(sx*0.9,sy*0.58,0.06,0.05,'#fbe3ea');
  for(const st of g.st)drawPlaced(g,st);
}
function drawHat(g,shadow){
  if(shadow)fE(0,0.5,0.98,0.1,'rgba(150,110,125,0.16)');
  const bw=g.wob.p;
  ctx.save();ctx.translate(0,0.26);ctx.rotate(bw*0.12);ctx.scale(1,1+bw*0.25);
  fE(0.03,0.05,1.0,0.27,'rgba(205,165,180,0.35)');fE(0,0,1.0,0.27,'#fffdf8');E(0,0,1.0,0.27);ctx.lineWidth=0.02;ctx.strokeStyle='#eee2dc';ctx.stroke();
  fE(0,-0.04,0.68,0.15,'#f6efe9');
  ctx.save();E(0,0,1.0,0.27);ctx.clip();ctx.translate(0,-0.26);patches(g,s=>s.reg===1);ctx.restore();
  for(const st of g.st)if(st.reg===1)drawPlaced(g,st,-0.26);
  ctx.restore();
  const pts=deform(g,CROWN,0.16);
  ctx.save();ctx.translate(0.04,0.04);smooth(pts);ctx.fillStyle='rgba(205,165,180,0.35)';ctx.fill();ctx.restore();
  smooth(pts);ctx.fillStyle='#fffefb';ctx.fill();ctx.lineWidth=0.02;ctx.strokeStyle='#eee2dc';ctx.stroke();
  ctx.save();smooth(pts);ctx.clip();ctx.fillStyle='#efe8f8';ctx.fillRect(-1,0.03,2,0.19);fE(-0.22,-0.38,0.18,0.1,'#ffffff',-0.4);patches(g,s=>s.reg!==1);ctx.restore();
  // ribbon bow and tails
  const rb=g.rib.p;ctx.strokeStyle='#e4d8f6';ctx.lineWidth=0.08;
  for(let i=0;i<2;i++){const a=0.25+i*0.45+rb*(1+i*0.5);ctx.beginPath();ctx.moveTo(0.5,0.12);ctx.quadraticCurveTo(0.5+Math.sin(a*0.6)*0.2,0.3,0.5+Math.sin(a)*0.45,0.12+Math.cos(a)*0.42);ctx.stroke();}
  fE(0.37,0.07,0.14,0.08,'#ece2fb',-0.5);fE(0.63,0.07,0.14,0.08,'#ece2fb',0.5);fE(0.5,0.12,0.055,0.055,'#ddd0f3');
  for(const st of g.st)if(st.reg!==1)drawPlaced(g,st);
}
function drawDrum(g,shadow){
  if(shadow)fE(0,0.62,0.98,0.11,'rgba(150,110,125,0.16)');
  const body=()=>{ctx.beginPath();ctx.moveTo(-0.9,-0.2);ctx.lineTo(-0.9,0.42);ctx.ellipse(0,0.42,0.9,0.18,0,PI,0,true);ctx.lineTo(0.9,-0.2);ctx.closePath();};
  ctx.save();ctx.translate(0.05,0.05);body();ctx.fillStyle='rgba(205,165,180,0.35)';ctx.fill();ctx.restore();
  body();ctx.fillStyle='#fffcf8';ctx.fill();ctx.lineWidth=0.02;ctx.strokeStyle='#ece0dc';ctx.stroke();
  ctx.save();body();ctx.clip();fE(0.5,0.3,0.5,0.5,'#fbf3f0');
  ctx.strokeStyle='#ebdfe4';ctx.lineWidth=0.03;ctx.beginPath();for(let i=0;i<=8;i++){const x=-0.9+i*0.225;const y=i%2?0.36+0.12*Math.sqrt(1-(x/0.9)**2):-0.06;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  patches(g,s=>s.top===false);ctx.restore();
  ctx.beginPath();ctx.ellipse(0,0.42,0.9,0.18,0,0,PI);ctx.lineWidth=0.07;ctx.strokeStyle='#f3eae5';ctx.stroke();
  for(const st of g.st)if(st.top===false)drawPlaced(g,st);
  fE(0,-0.2,0.93,0.37,'#f3ebe6');
  const pts=deform(g,MEM,0.18);const m=g.mem.p;
  smooth(pts);ctx.fillStyle='#fffefb';ctx.fill();ctx.lineWidth=0.018;ctx.strokeStyle='#e9ddd8';ctx.stroke();
  ctx.save();smooth(pts);ctx.clip();
  if(Math.abs(m)>0.01){E(0,-0.2-m*0.03,0.5+Math.abs(m)*0.15,0.19+Math.abs(m)*0.06);ctx.lineWidth=0.03;ctx.strokeStyle=`rgba(230,205,215,${clamp(Math.abs(m),0,0.8)})`;ctx.stroke();}
  for(const r of g.rip){const q=r.t/0.6;E(r.u,r.v,0.1+q*0.6,(0.1+q*0.6)*0.4);ctx.lineWidth=0.03;ctx.strokeStyle=`rgba(240,200,215,${1-q})`;ctx.stroke();}
  patches(g,s=>s.top!==false);ctx.restore();
  for(const st of g.st)if(st.top)drawPlaced(g,st);
}

// ---------- RABBITS ----------
const RT={
  baby:{body:'#fff6ec',belly:'#fffdf8',inner:'#f9c4d1',cheek:'#f8b6c7',bodyY:-0.26,bodyRx:0.27,bodyRy:0.26,headY:-0.64,headR:0.34,ear:'droop',earL:0.4,earW:0.12,earX:0.22,shX:0.21,shY:-0.36,armL:0.21,armW:0.075,ex:0.13,ey:0.01,eR:0.042,eye:'n',voice:880,hugR:0.46,hugY:0.14,ek:55,ec:4,earK:0.5},
  mom:{body:'#fdeff3',belly:'#fffafb',inner:'#f6bfd0',cheek:'#f7b8c9',bodyY:-0.3,bodyRx:0.25,bodyRy:0.3,headY:-0.74,headR:0.26,ear:'up',earL:0.62,earW:0.1,earX:0.1,earA:0.12,shX:0.19,shY:-0.48,armL:0.25,armW:0.07,ex:0.1,ey:0.0,eR:0.034,eye:'g',voice:620,hugR:0.36,hugY:0.02,ek:90,ec:6,earK:0.35,lash:1},
  dad:{body:'#f1e0cc',belly:'#fbf1e4',inner:'#f3c3b5',cheek:'#f2b9a8',bodyY:-0.3,bodyRx:0.32,bodyRy:0.31,headY:-0.7,headR:0.32,ear:'up',earL:0.5,earW:0.14,earX:0.14,earA:0.16,shX:0.26,shY:-0.46,armL:0.25,armW:0.085,ex:0.12,ey:0.02,eR:0.038,eye:'n',voice:330,hugR:0.4,hugY:0.02,ek:150,ec:10,earK:0.2},
};
function liftOf(r){let l=r.hop;if(r.hold&&r.holdMode==='floor')l+=0.56-r.hold.sq.p*0.15;return l;}
function holdPt(r,mode){const P=RT[r.type],s=r.s*r.scl;const lift=liftOf(r)*s;
  if(mode==='hug')return{x:r.x,y:r.y-lift+(P.bodyY+P.hugY)*s,R:P.hugR*s};
  if(mode==='drum')return{x:r.x,y:r.y-lift-0.22*s,R:0.31*s};
  if(mode==='head')return{x:r.x,y:r.y-lift+(P.headY-P.headR*0.72)*s,R:P.headR*1.35*s};
  return{x:r.x,y:r.y-0.22*s,R:0.64*s};}
function zoneOf(r){const s=r.s*r.scl;const lift=liftOf(r)*s;return{x:r.x,y:r.y-lift-0.52*s,rad:Math.max(0.64*s,74*U)};}
function armA(r,side){
  const i=side<0?0:1;
  if(r.arm)return r.arm[i];
  if(r.hold&&r.holdMode==='hug')return -0.8;
  if(r.hold&&r.holdMode==='drum'){const bt=T-r.beatT[i];let a=-0.62;if(bt<0.32)a+=Math.sin(bt/0.32*PI)*1.5;return a;}
  const re=r.reach.p;return 0.3+re*1.35+(re>0.5?Math.sin(T*7+side)*0.12*re:0);
}
function drawArm(P,side,a){const px=side*P.shX,py=P.shY,dx=side*Math.sin(a),dy=Math.cos(a),L2=P.armL;const rot=Math.atan2(-dx,dy);blob(px+dx*L2*0.5,py+dy*L2*0.5,P.armW,L2*0.58,P.body,rot);fE(px+dx*L2,py+dy*L2,P.armW*1.05,P.armW,P.belly);}
function drawEars(r,P){

// ---------- PARTY LOGIC ----------
function cakeLocal(x,y){const c=L.gar.cake;return[(x-c.cx)/c.cw,(y-c.by)/c.cw];}
function cakeSnap(u,v,margin){let best=null;for(const t of TIERS){const cu=clamp(u,-t.w/2+0.05,t.w/2-0.05),cv=clamp(v,t.y0+0.035,t.y1-0.045);const d=hyp(u-cu,v-cv);if(d<=margin&&(!best||d<best.d))best={u:cu,v:cv,d};}return best;}
function cakeAt(x,y,m=0.06){if(S.party.pop.p<0.5)return null;const [u,v]=cakeLocal(x,y);return cakeSnap(u,v,m);}
function cakeDent(u,v,p,r=0.09,slow){const d={u,v,r,p,v2:0,k:slow?7:150,c:slow?5:6};S.party.dents.push(d);if(S.party.dents.length>14)S.party.dents.shift();return d;}
function addDecor(type,u,v,kind){const pt=S.party;const dc={type,kind,u,v,r:type==='st'?curSheet().slots[0].r*0.75/L.gar.cake.cw:0.085,p:-0.5,vp:0,t0:T,gone:false};pt.decor.push(dc);if(pt.decor.length>40)pt.decor.shift();
  cakeDent(u,v,-0.5,0.1);pt.decorN++;pt.inter++;SFX.cream();after(0.05,()=>SFX.stick());const c=L.gar.cake;const x=c.cx+u*c.cw,y=c.by+v*c.cw;burst(x,y,3,{k:type==='heart'?'heart':'spark',col:type==='st'?SK[kind].c:'#fff1b8',sp:100,g:-30,up:true,sz:6});emit({k:'ring',x,y,sz:16*U,col:'#ffffff',life:0.5});
  const near=nearestR(x,y);if(near)surprise(near);return dc;}
function nearestR(x,y){let b=null;for(const r of RABS()){if(!r.vis)continue;const d=hyp(r.x-x,r.y-y);if(!b||d<b.d)b={r,d};}return b&&b.r;}
function decorAt(x,y){const pt=S.party,c=L.gar.cake;if(pt.pop.p<0.5)return null;for(let i=pt.decor.length-1;i>=0;i--){const d=pt.decor[i];if(d.gone||d.type==='st')continue;const dx=c.cx+d.u*c.cw,dy=c.by+d.v*c.cw;if(hyp(x-dx,y-dy)<Math.max(d.r*c.cw*1.6,22*U))return d;}return null;}
function topAt(x,y){const c=L.gar.cake;if(S.party.top<0.5||S.party.pop.p<0.5)return false;return hyp(x-c.cx,y-(c.by-0.9*c.cw))<Math.max(0.15*c.cw,28*U);}
function balloonAt(x,y){for(let i=S.balloons.length-1;i>=0;i--){const b=S.balloons[i];if(hyp(x-b.x,y-b.y)<b.r*1.25)return b;}
  for(const b of S.balloons){const t=clamp(((x-b.ax)*(b.x-b.ax)+(y-b.ay)*(b.y-b.ay))/((b.x-b.ax)**2+(b.y-b.ay)**2||1),0,1);const px=lerp(b.ax,b.x,t),py=lerp(b.ay,b.y,t);if(t>0.15&&hyp(x-px,y-py)<16*U)return b;}return null;}
function feed(r,type){
  const pt=S.party;pt.feeds++;pt.inter++;r.food=type;r.foodK=1;startAct(r,'eat',1.5,()=>{r.food=null;SFX.voice(RT[r.type].voice,4);});
  SFX.eat(RT[r.type].voice);const z=zoneOf(r);burst(z.x,z.y-r.s*0.3,4,{k:'heart',col:'#f7a3bd',sp:90,g:-40,up:true,sz:7,life:1.1});

function regrowDecor(dc){after(1.1,()=>{dc.gone=false;dc.p=-0.6;dc.vp=0;const c=L.gar.cake;burst(c.cx+dc.u*c.cw,c.by+dc.v*c.cw,3,{k:'spark',col:'#ffffff',sp:70});SFX.pop();});}
function regrowTop(){after(1.1,()=>{S.party.top=1;S.party.topP.v+=5;const c=L.gar.cake;burst(c.cx,c.by-0.9*c.cw,4,{k:'spark',col:'#fff1b0',sp:90});SFX.pop();});}
function drumParty(u,v){

    const b=RB.baby;if(!b.act)startAct(b,'babyBounce',0.55);const m=RB.mom;if(!m.act)startAct(m,'dance',0.7);}

function updParty(dt){
  const pt=S.party;pt.t+=dt;spr(pt.pop,pt.popT,90,9,dt);spr(pt.topP,0,140,6,dt);spr(pt.houseW,0,120,6,dt);
  for(const d of pt.dents){d.v2+=((0-d.p)*d.k-d.v2*d.c)*dt;d.p+=d.v2*dt;}pt.dents=pt.dents.filter(d=>Math.abs(d.p)>0.004||Math.abs(d.v2)>0.02||d.held);
  for(const d of pt.decor){d.vp+=((0-d.p)*160-d.vp*7)*dt;d.p+=d.vp*dt;}
  pt.energy=Math.max(0,pt.energy-dt*0.15);
  for(const b of S.balloons){const top=SA.t+b.r*1.1;
    if(b.held!=null){const p=ptr.get(b.held);if(p){const tx=clamp(p.x+b.ox,b.r,W-b.r),ty=clamp(p.y+b.oy,top,b.ay-30*U);const nx=lerp(b.x,tx,Math.min(1,dt*18)),ny=lerp(b.y,ty,Math.min(1,dt*18));b.vx=(nx-b.x)/dt;b.vy=(ny-b.y)/dt;b.x=nx;b.y=ny;}}
    else{const wind=Math.sin(T*0.7+b.i*1.7)*14*U;b.vx+=((b.rx-b.x)*10-b.vx*1.5+wind)*dt;b.vy+=((b.ry-b.y)*10-b.vy*1.5)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.y<top){b.y=top;b.vy=Math.abs(b.vy)*0.4;}if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}if(b.y>b.ay-30*U){b.y=b.ay-30*U;b.vy=-Math.abs(b.vy);}}
    spr(b.sq,0,120,5,dt);}
  for(const f of S.food.values()){f.vx=lerp(f.vx,(f.tx-f.x)/Math.max(dt,1e-3),0.3);f.x=lerp(f.x,f.tx,Math.min(1,dt*25));f.y=lerp(f.y,f.ty,Math.min(1,dt*25));}
}

function slotAt(x,y){const sh=curSheet();for(let i=0;i<4;i++){const s=sh.slots[i];if(S.slots[i].has&&hyp(x-s.x,y-s.y)<s.r*1.3)return i;}return -1;}
function refillSlot(i){after(0.35,()=>{const sl=S.slots[i];sl.has=true;sl.pop.p=0;sl.pop.v=0;});}
function returnLifted(){const l=S.lifted;if(!l)return;S.lifted=null;S.fly.push({kind:l.kind,slot:l.slot,x:l.x||0,y:l.y||0,fx:l.x||0,fy:l.y||0,r:curSheet().slots[l.slot].r,t:0});S.slots[l.slot].has=false;}
function pickSticker(p,i){
  const s=curSheet().slots[i];S.slots[i].has=false;S.hs.set(p.id,{kind:i,slot:i,dx:s.x,dy:s.y,r:s.r,t0:T,vx:0,snap:null});p.mode='sticker';
  SFX.peel();S.bend.v-=16;S.bendSlot=i;

function stickerTarget(h){
  if(S.scene==='room'){const gt=giftAt(h.dx,h.dy,1.5);if(!gt)return null;const sn=snapGift(gt.g,gt.u,gt.v);const R=giftR(gt.g);return{g:gt.g,u:sn.u,v:sn.v,top:sn.top,gx:gt.g.x+sn.u*R,gy:gt.g.y+sn.v*R,ghost:true};}

function applySticker(kind,slot,tg){
  if(tg.cake)addDecor('st',tg.u,tg.v,kind);
  else{const R=giftR(tg.g);placeSticker(tg.g,kind,tg.u,tg.v,curSheet().slots[slot].r*0.9/R);}

const ptr=new Map();

cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{cv.setPointerCapture(e.pointerId);}catch(_){}const [x,y]=rel(e);const p={id:e.pointerId,x,y,sx:x,sy:y,t0:T,mode:null,hist:[[x,y,performance.now()]],moved:0};ptr.set(p.id,p);S.lastIn=T;S.hint=null;try{down(p);}catch(err){console.warn(err);}},{passive:false});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;e.preventDefault();const [x,y]=rel(e);p.x=x;p.y=y;p.moved=Math.max(p.moved,hyp(x-p.sx,y-p.sy));p.hist.push([x,y,performance.now()]);if(p.hist.length>8)p.hist.shift();S.lastIn=T;try{move(p);}catch(err){console.warn(err);}},{passive:false});

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
function velOf(p){const h=p.hist,now=performance.now();let i=h.length-1;while(i>0&&now-h[i-1][2]<100)i--;const a=h[i],b=h[h.length-1];const dt=Math.max(16,b[2]-a[2])/1000;if(now-b[2]>120)return[0,0];return[(b[0]-a[0])/dt,(b[1]-a[1])/dt];}
function ring(x,y){emit({k:'ring',x,y,sz:12*U,col:'rgba(255,255,255,0.8)',life:0.4});SFX.tick();}

function down(p){
  if(S.busy){return;}
  const {x,y}=p;
  if(S.lifted){const l=S.lifted;const tg=stickerTarget({dx:x,dy:y});if(tg){S.lifted=null;applySticker(l.kind,l.slot,tg);p.mode='none';return;}
    const si=slotAt(x,y);returnLifted();if(si<0){p.mode='none';return;}}
  const si=slotAt(x,y);if(si>=0){pickSticker(p,si);return;}
  if(S.scene==='room')downRoom(p);else downGarden(p);
}
function downRoom(p){
  const {x,y}=p;
  const gt=giftAt(x,y,1.2);
  if(gt){const g=gt.g;p.mode='gift';p.g=g;p.sub=null;S.active=g.kind;p.offx=g.x-x;p.offy=g.y-y;const u=gt.u,v=gt.v;
    if(g.state==='return'){g.state='home';}
    if(g.kind==='pillow'){const st=g.st.filter(s=>hyp(s.u-u,s.v-v)<s.r*1.3);const big=1+st.reduce((a,s)=>Math.max(a,s.stack),0)*0.5;p.dent={u,v,r:0.45*Math.min(1.6,big),p:-0.2,v2:-3,tgt:-0.5*Math.min(1.6,big),held:true};g.dents.push(p.dent);for(const s of st)s.vp-=3;SFX.puff();g.sq.v+=1;}
    else if(g.kind==='hat'){if(v>0.1){g.wob.v+=7*(u>0?1:-1);g.rib.v+=4;SFX.bells();}else{p.dent={u,v,r:0.35,p:-0.15,v2:-2,tgt:-0.32,held:true};g.dents.push(p.dent);g.rib.v+=3;SFX.puff();}for(const s of g.st)if(hyp(s.u-u,s.v-v)<s.r*1.3)s.vp-=3;}
    else{drumHit(g,u,v,1);}
    return;}
  const rb=rabbitAt(x,y);if(rb){tapRabbit(rb,x,y);p.mode='none';return;}
  if(tapDecor(x,y)){p.mode='none';return;}
  ring(x,y);p.mode='none';
}
function rabbitAt(x,y){let best=null;for(const r of RABS()){if(!r.vis)continue;const s=r.s*r.scl,lift=liftOf(r)*s;const cx=r.x,cy=r.y-lift-0.55*s;const dx=(x-cx)/(0.42*s),dy=(y-cy)/(0.75*s);const d=hyp(dx,dy);if(d<1&&(!best||d<best.d))best={r,d,ear:y<r.y-lift-0.95*s};}return best&&best.r?Object.assign(best.r,{_ear:best.ear}):null;}
function tapRabbit(r,x,y){
  const P=RT[r.type];
  if(r.hold&&!r.act){
    if(r.type==='baby'){startAct(r,'miniBounce',1.1);after(0.18,()=>{SFX.boing();});after(0.78,()=>{SFX.poyon(330,0.6);r.hold&&(r.hold.sq.v+=6);});return;}
    if(r.type==='mom'){startAct(r,'miniSpin',0.9);SFX.bells();r.hold.wob.v+=5;S.room.orn.forEach(o=>o.v+=1.5);return;}
    if(r.type==='dad'){const hp=holdPt(r,'drum');const u=(x-hp.x)/hp.R,v=(y-hp.y)/hp.R;if(regD('drum',u,v).d<1.4){const f=drumHit(r.hold,u,v,1);r.beatT[u<0?0:1]=T;after(0.3,()=>{r.beatT[u<0?1:0]=T;SFX.drum((f||200)*1.26,0.6);r.hold&&(r.hold.mem.v+=5);});return;}}
  }
  if(r._ear){r.wig=0.6;r.earL.v+=6;r.earR.v-=6;SFX.voice(P.voice*1.3,2);}else{if(!r.act)startAct(r,'happy',0.6);r.sq.v+=3;SFX.voice(P.voice,2);}
}
function tapDecor(x,y){
  const rm=L.room,st=S.room;
  for(let i=0;i<4;i++){const l=rm.lamps[i];if(hyp(x-l.x,y-(l.t==='table'?l.y-24*U:l.y))<26*U){st.lampW[i].v+=4;st.lamps[i]>0.5?SFX.twinkle(i):SFX.tick();return true;}}
  for(let i=0;i<rm.orns.length;i++){const o=rm.orns[i];if(hyp(x-o.x,y-(rm.top+o.len+9*U))<22*U){st.orn[i].v+=3;SFX.twinkle(i+2);return true;}}
  for(let i=0;i<2;i++){const b=rm.boxes[i];if(hyp(x-b.x,y-(b.y-b.s/2))<b.s*0.9){st.boxes[i].v+=40;SFX.tok(500+i*100);return true;}}
  const w=rm.win;if(Math.abs(x-w.cx)<w.w/2+8*U&&Math.abs(y-w.cy)<w.h/2+8*U){st.winW.v+=4;SFX.tick();return true;}
  const s=rm.shelf;if(x>s.x0&&x<s.x1&&y>s.y-56*U&&y<s.y+10*U){st.shelfW.v+=4;st.table.v+=st.tableOn?2:0;SFX.tok(800);return true;}
  return false;
}
function downGarden(p){
  const {x,y}=p;const pt=S.party;
  // tray
  for(let i=0;i<4;i++){const tp=trayPos(i);if(S.tray[i].has&&hyp(x-tp.x,y-tp.y)<tp.r*1.9){S.tray[i].has=false;startFood(p,TRAYT[i],'tray',i);SFX.pop();return;}}
  // dad drum
  const d=RB.dad;if(d.vis&&d.hold){const hp=holdPt(d,'drum');const u=(x-hp.x)/hp.R,v=(y-hp.y)/hp.R;if(regD('drum',u,v).d<1.35){drumParty(u,v);p.mode='none';return;}}
  // cake decor / top
  if(topAt(x,y)){p.mode='cakeItem';p.top=true;pt.topP.v+=4;return;}
  const dc=decorAt(x,y);if(dc){p.mode='cakeItem';p.dc=dc;dc.vp+=4;return;}
  // rabbits
  const rb=rabbitAt(x,y);
  if(rb&&rb.type!=='dad'){if(!rb.act){if(rb.type==='baby'){startAct(rb,'babyBounce',0.55);rb.hold&&(rb.hold.sq.v+=5);SFX.boing();after(0.5,()=>{SFX.poyon(330,0.6);rb.hold&&(rb.hold.sq.v+=5);});}else{startAct(rb,'miniSpin',0.9);SFX.bells();rb.hold&&(rb.hold.wob.v+=5);}}pt.inter++;p.mode='none';return;}
  if(rb&&rb.type==='dad'){giggle(rb,0.6);p.mode='none';return;}
  // cake body

  const b=balloonAt(x,y);if(b){p.mode='balloon';p.b=b;b.held=p.id;b.ox=b.x-x;b.oy=b.y-y;b.sq.v+=4;SFX.squeak();pt.balN++;pt.inter++;return;}

function startFood(p,type,from,ref){const f={type,from,ref,x:p.x,y:p.y-20*U,tx:p.x,ty:p.y-20*U,vx:0,r:(type==='big'?19:type==='slice'?22:17)*U,on:true};S.food.set(p.id,f);p.mode='food';}
function move(p){
  if(p.mode==='sticker'){const h=S.hs.get(p.id);if(!h)return;const ox=0,oy=-h.r*0.6;const nx=p.x+ox,ny=p.y+oy;const [vx]=velOf(p);h.vx=vx;h.dx=nx;h.dy=ny;h.snap=stickerTarget(h);if(h.snap){h.dx=lerp(nx,h.snap.gx,0.3);h.dy=lerp(ny,h.snap.gy,0.3);}return;}
  if(p.mode==='gift'){const g=p.g;if(g.state==='give'||g.state==='held'){p.mode='none';return;}
    const dx=p.x-p.sx,dy=p.y-p.sy;
    if(p.sub==null&&p.moved>12){if(g.st.length&&dy<-0.35*Math.abs(dx))startCarry(p,g);else p.sub='stroke';}
    if(p.sub==='stroke'){if(g.st.length&&dy<-60*U&&dy<-Math.abs(dx)*0.5){startCarry(p,g);}else{stroke(p,g);return;}}
    if(p.sub==='carry'){g.x=p.x+p.offx;g.y=p.y+p.offy;const r=RB[OWN[g.kind]];const z=zoneOf(r);const d=hyp(g.x-z.x,g.y-z.y);if(d<z.rad*1.4){const k=0.35*(1-d/(z.rad*1.4));g.x=lerp(g.x,z.x,k);g.y=lerp(g.y,z.y,k);}}
    return;}
  if(p.mode==='food'){const f=S.food.get(p.id);if(f){f.tx=p.x;f.ty=p.y-20*U;}return;}
  if(p.mode==='cakeItem'&&p.moved>12){const c=L.gar.cake;if(p.top){S.party.top=0;startFood(p,'big','top');}else{p.dc.gone=true;startFood(p,p.dc.type,'decor',p.dc);}cakeDent((p.top?0:p.dc.u),(p.top?-0.86:p.dc.v),-0.3,0.08);SFX.cream();return;}
  if(p.mode==='cake'&&p.moved>14){p.dent.held=false;p.dent.k=6;p.dent.c=5;p.dent.p=-0.75;p.dent.r=0.13;startFood(p,'slice','slice');SFX.cream();after(2.2,()=>{const c=L.gar.cake;burst(c.cx+p.cu*c.cw,c.by+p.cv*c.cw,3,{k:'spark',col:'#ffffff',sp:60});});return;}
}
function startCarry(p,g){p.sub='carry';g.state='carry';if(p.dent){p.dent.held=false;p.dent.tgt=0;p.dent=null;}g.sq.v+=3;SFX.pop();}
function stroke(p,g){const [u,v]=giftLocal(g,p.x,p.y);if(p.dent){if(regD(g.kind,u,v).d<1){p.dent.u=u;p.dent.v=v;}}
  g.st.forEach((st,i)=>{if(hyp(st.u-u,st.v-v)<st.r*1.4&&T-st.ls>0.3){st.ls=T;st.vp-=3.5;if(g.kind==='drum')SFX.drum(200+i*20,0.35);else SFX.note(i+(g.kind==='hat'?2:0));}});
  if(g.kind==='hat'&&v>0.1&&Math.abs(p.hist.at(-1)[0]-p.hist.at(-2)?.[0]||0)>2){g.wob.v+=0.6*(u>0?1:-1);}
}
function up(p,cancel){
  if(p.mode==='sticker'){const h=S.hs.get(p.id);S.hs.delete(p.id);if(!h)return;
    if(!cancel&&p.moved<10&&T-p.t0<0.45){if(S.lifted)returnLifted();S.slots[h.slot].has=true;S.lifted={kind:h.kind,slot:h.slot,x:h.dx,y:h.dy,t0:T};S.slots[h.slot].has=false;return;}
    const tg=cancel?null:stickerTarget(h);if(tg)applySticker(h.kind,h.slot,tg);else S.fly.push({kind:h.kind,slot:h.slot,x:h.dx,y:h.dy,fx:h.dx,fy:h.dy,r:h.r,t:0});return;}
  if(p.mode==='gift'){const g=p.g;if(p.dent){p.dent.held=false;p.dent.tgt=0;p.dent.k=150;p.dent.c=5;if(g.kind==='pillow')SFX.poyon(260,0.6);}
    if(p.sub==='carry'&&g.state==='carry'){if(cancel){g.state='return';return;}const [vx,vy]=velOf(p);const sp=hyp(vx,vy),mx=2400*U;const k=sp>mx?mx/sp:1;g.vx=vx*k;g.vy=vy*k;const z=zoneHit(g.x,g.y,giftR(g)*0.35);if(z)resolveGift(g,z);else g.state='slide';}
    return;}
  if(p.mode==='food'){const f=S.food.get(p.id);S.food.delete(p.id);if(!f)return;dropFood(f,cancel);return;}
  if(p.mode==='cakeItem'){if(p.top){S.party.topP.v+=5;SFX.poyon(500,0.5);}else if(p.dc){p.dc.vp-=4;SFX.poyon(520,0.5);}cakeDent(p.top?0:p.dc.u,p.top?-0.86:p.dc.v,-0.3,0.08);return;}
  if(p.mode==='cake'){if(p.dent&&p.dent.held){p.dent.held=false;SFX.poyon(300,0.6);}return;}
  if(p.mode==='balloon'){const b=p.b;b.held=null;if(!cancel&&p.moved<10){b.vy+=220*U;b.sq.v+=6;SFX.squeak();}else{SFX.squeak();}return;}
}
function dropFood(f,cancel){
  const pt=S.party;
  if(!cancel){const r=zoneHit(f.x,f.y,10*U);if(r){feed(r,f.type==='big'?'berry':f.type);if(f.from==='tray')refillTray(f.ref);else if(f.from==='decor')regrowDecor(f.ref);else if(f.from==='top')regrowTop();return;}
    const cs=(f.type==='berry'||f.type==='heart'||f.type==='big')?cakeAt(f.x,f.y,0.1):null;
    if(cs){if(f.from==='decor'){const dc=f.ref;dc.u=cs.u;dc.v=cs.v;dc.gone=false;dc.p=-0.5;cakeDent(cs.u,cs.v,-0.5,0.1);SFX.cream();return;}
      addDecor(f.type==='big'?'berry':f.type,cs.u,cs.v);if(f.from==='tray')refillTray(f.ref);else if(f.from==='top')regrowTop();return;}
    if(f.type==='slice'&&cakeAt(f.x,f.y,0.1)){SFX.cream();return;}}
  // fly back
  let tx,ty;const c=L.gar.cake;
  if(f.from==='tray'){const tp=trayPos(f.ref);tx=tp.x;ty=tp.y;}else if(f.from==='decor'){tx=c.cx+f.ref.u*c.cw;ty=c.by+f.ref.v*c.cw;}else if(f.from==='top'){tx=c.cx;ty=c.by-0.9*c.cw;}else{tx=c.cx;ty=c.by-0.4*c.cw;}
  S.foodFly.push({type:f.type,from:f.from,ref:f.ref,x:f.x,y:f.y,fx:f.x,fy:f.y,tx,ty,r:f.r,t:0});
}
function refillTray(i){after(0.45,()=>{S.tray[i].has=true;S.tray[i].pop.p=0;S.tray[i].pop.v=0;});}

// ---------- FOCUS / HINT ----------
function computeFocus(){
  if(S.busy)return null;
  if(S.scene==='room'){
    const und=KINDS.filter(k=>!G[k].delivered&&G[k].state!=='hidden');if(!und.length)return null;
    let g=G[S.active];if(!und.includes(S.active))g=G[und[0]];
    if(S.lifted||S.hs.size)return{kind:'gift',g};
    if(!g.st.length){const si={pillow:0,hat:2,drum:1}[g.kind];return{kind:'slot',si:S.slots[si].has?si:S.slots.findIndex(s=>s.has),g};}
    if(g.state==='home')return{kind:'give',g,r:RB[OWN[g.kind]]};
    return null;}
  const pt=S.party;if(pt.pop.p<0.5)return null;
  if(pt.decorN<2)return{kind:'tray'};
  if(pt.feeds<1)return{kind:'top'};
  if(pt.balN<1)return{kind:'balloon'};
  if(pt.drumN<3)return{kind:'drum'};
  if(pt.t>25&&pt.inter>=8)return{kind:'house'};
  return null;
}
function mkHint(fc){
  const d=2.2;
  if(fc.kind==='slot'&&fc.si>=0){const s=curSheet().slots[fc.si];return{type:'drag',ax:s.x,ay:s.y,bx:fc.g.x,by:fc.g.y,ghost:fc.si,si:fc.si,t:0,d};}
  if(fc.kind==='give'){const z=zoneOf(fc.r);return{type:'drag',ax:fc.g.x,ay:fc.g.y,bx:z.x,by:z.y,ghost:null,t:0,d};}
  if(fc.kind==='gift')return{type:'tap',ax:fc.g.x,ay:fc.g.y,t:0,d:1.8};
  const c=L.gar.cake;
  if(fc.kind==='tray'){const tp=trayPos(0);return{type:'drag',ax:tp.x,ay:tp.y,bx:c.cx,by:c.by-0.45*c.cw,ghost:-1,food:'berry',t:0,d};}
  if(fc.kind==='top'){const z=zoneOf(RB.baby);return{type:'drag',ax:c.cx,ay:c.by-0.9*c.cw,bx:z.x,by:z.y,ghost:-1,food:'berry',t:0,d};}
  if(fc.kind==='balloon'){const b=S.balloons[0];return{type:'tap',ax:b.x,ay:b.y,t:0,d:1.8};}
  if(fc.kind==='drum'){const hp=holdPt(RB.dad,'drum');return{type:'tap',ax:hp.x,ay:hp.y-hp.R*0.2,t:0,d:1.8};}
  if(fc.kind==='house'){const hd=L.gar.house.door;return{type:'tap',ax:hd.cx,ay:hd.bot-hd.h*0.4,t:0,d:1.8};}
  return null;
}

// ---------- UPDATE ----------
function update(dt){
  runTimers();runTweens(dt);
  for(const sl of S.slots)spr(sl.pop,1,180,10,dt);for(const sl of S.tray)spr(sl.pop,1,180,10,dt);spr(S.bend,0,120,7,dt);
  for(const f of S.fly){f.t+=dt;const s=curSheet().slots[f.slot];const k=eo(f.t/0.32);f.x=lerp(f.fx,s.x,k);f.y=lerp(f.fy,s.y,k)-Math.sin(k*PI)*20*U;}
  S.fly=S.fly.filter(f=>{if(f.t>=0.32){const sl=S.slots[f.slot];sl.has=true;sl.pop.p=0.8;sl.pop.v=2;return false;}return true;});
  for(const f of S.foodFly){f.t+=dt;const k=eo(f.t/0.35);f.x=lerp(f.fx,f.tx,k);f.y=lerp(f.fy,f.ty,k)-Math.sin(k*PI)*20*U;}
  S.foodFly=S.foodFly.filter(f=>{if(f.t>=0.35){if(f.from==='tray'){S.tray[f.ref].has=true;S.tray[f.ref].pop.p=0.8;}else if(f.from==='decor'){f.ref.gone=false;f.ref.p=-0.4;}else if(f.from==='top'){S.party.top=1;S.party.topP.v+=4;}else{cakeDent(0,-0.4,0.3,0.12);}SFX.cream();return false;}return true;});
  const st=S.room;spr(st.table,st.tableOn?1:0,120,8,dt);spr(st.garW,0,30,2.5,dt);spr(st.winW,0,60,4,dt);spr(st.shelfW,0,120,6,dt);for(const w of st.lampW)spr(w,0,25,1.5,dt);for(const o of st.orn)spr(o,0,22,1.4,dt);for(const b of st.boxes){spr(b,0,90,6,dt);if(b.p<0){b.p=0;b.v=Math.abs(b.v)*0.3;}}
  for(const k of KINDS)updGift(G[k],dt);
  for(const r of RABS())updRabbit(r,dt);
  if(S.scene==='garden')updParty(dt);
  updParticles(dt);musicTick();
  S.fc=computeFocus();
  if(S.hint){S.hint.t+=dt;if(S.hint.t>=S.hint.d)S.hint=null;}
  else if(S.fc&&!ptr.size&&T-S.lastIn>4.2&&T-S.lastHint>9){S.hint=mkHint(S.fc);S.lastHint=T;}
}

// ---------- DRAW ----------
function drawRoomFront(){
  const rs=RABS().slice().sort((a,b)=>a.y-b.y);for(const r of rs)drawRabbit(r);
  const fc=S.fc;
  const gs=KINDS.map(k=>G[k]).filter(g=>g.state!=='held'&&!(g.state==='hidden'&&g.sc.p<0.01));
  gs.sort((a,b)=>{const pa=(a.state==='carry'||a.state==='slide'||a.state==='give')?1:0,pb=(b.state==='carry'||b.state==='slide'||b.state==='give')?1:0;return pa-pb||a.y-b.y;});
  for(const g of gs){const R=g.state==='give'?g.give.R:giftR(g);if(R<0.5)continue;
    if(fc&&(fc.kind==='gift'||fc.kind==='give')&&fc.g===g&&g.state==='home'){const bob=fc.kind==='give'?Math.abs(Math.sin(T*3.2))*6*U:0;g.y-=bob;halo(g.x,g.y,R*1.15,R*0.85);drawGift(g,g.x,g.y,R,g.state!=='give');g.y+=bob;continue;}
    drawGift(g,g.x,g.y,R,g.state!=='give');}
  drawSheet();drawHeldStickers();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;
  if(S.scene==='room'){
    const z=S.cam.z,hole=S.room.door>0.002||z>0;
    if(hole)drawGarden(false);
    ctx.save();const d=L.room.door;const cx=d.cx,cy=d.bot-d.h*0.42;let k=1;
    if(z>0)k=1+Math.pow(z,2.2)*11;if(S.cam.in>0)k=1+S.cam.in*0.35;
    if(k!==1){ctx.translate(cx,cy);ctx.scale(k,k);ctx.translate(-cx,-cy);}
    if(S.shake>0)ctx.translate(Math.sin(T*43)*3*U*S.shake,Math.sin(T*37)*2*U*S.shake);
    drawRoomBack(hole);drawRoomFront();ctx.restore();
    if(S.cam.in>0){ctx.fillStyle=`rgba(255,248,236,${S.cam.in})`;ctx.fillRect(0,0,W,H);}
  }else{
    const r=S.cam.r;ctx.save();if(r>0){const hd=L.gar.house.door;const cx=hd.cx,cy=hd.bot-hd.h*0.5,k=1+r*r*8;ctx.translate(cx,cy);ctx.scale(k,k);ctx.translate(-cx,-cy);}
    drawGarden(true);ctx.restore();
    if(r>0.35){ctx.fillStyle=`rgba(255,248,236,${sm((r-0.35)/0.65)})`;ctx.fillRect(0,0,W,H);}
  }
  drawParticles();drawHint();
}

// ---------- LOOP ----------
let last=0,raf=0,running=false;
function frame(ms){raf=requestAnimationFrame(frame);let dt=(ms-last)/1000;last=ms;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);T+=dt;try{update(dt);draw();}catch(e){console.warn(e);}}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(AC&&AC.state==='running')AC.suspend();}else{start();if(AC&&AC.state==='suspended')AC.resume();}});
function onResize(){doLayout();for(const p of [...ptr.values()]){ptr.delete(p.id);up(p,true);}for(const k of KINDS){const g=G[k];if(g.state==='slide'||g.state==='carry')g.state='return';}initBalloons();}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',()=>setTimeout(onResize,120));
doLayout();initBalloons();for(const k of KINDS){const h=L.room.gift[k];G[k].x=h.x;G[k].y=h.y;}
for(const r of RABS()){const h=L.room.fam[r.type];r.x=h.x;r.y=h.y;r.s=L.rs[r.type];}
window.__game={S,G,RB,L,get T(){return T;}};
start();
})();
</script>
