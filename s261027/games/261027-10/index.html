<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';

// ---------------------------------------------------------------- basics
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bgCv = document.createElement('canvas');
const bgx = bgCv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = v => v < 0 ? -1 : 1;

let W = 1, H = 1, DPR = 1, SW = 1, SH = 1;
let L = null;           // layout
let R = 10;             // ball radius
let G = 1800;           // gravity px/s^2
let T = 0;              // game time
const MAXB = 140;

// stained glass palette: red, coral, gold, green, aqua, blue, purple
const COL = [
  { b: [236, 44, 72],  l: [255, 160, 175], d: [112, 10, 40] },
  { b: [255, 124, 84], l: [255, 206, 176], d: [138, 42, 20] },
  { b: [250, 198, 52], l: [255, 242, 172], d: [136, 84, 0] },
  { b: [112, 212, 72], l: [206, 255, 176], d: [30, 92, 22] },
  { b: [72, 204, 242], l: [196, 246, 255], d: [10, 82, 124] },
  { b: [64, 104, 244], l: [168, 196, 255], d: [16, 30, 124] },
  { b: [164, 84, 238], l: [224, 186, 255], d: [62, 20, 112] },
];
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const NOTES = [392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];
const LEAD = '#160f3a';
const GOLD = 'rgba(255,214,120,0.95)';

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- audio
const AU = { c: null, out: null, noise: null, voices: 0, lastTink: -1, lastThump: -1, beat: 0, step: 0 };
function audioInit() {
  try {
    if (!AU.c) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = new AC();
      AU.c = c;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 6;
      comp.attack.value = 0.003; comp.release.value = 0.25;
      const g = c.createGain(); g.gain.value = 0.75;
      g.connect(comp); comp.connect(c.destination);
      AU.out = g;
      const len = Math.floor(c.sampleRate * 1.5);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
      AU.noise = buf;
    }
    if (AU.c.state !== 'running') {
      const p = AU.c.resume();
      if (p && p.catch) p.catch(function () {});
    }
  } catch (e) { /* audio unavailable: game still works */ }
}
function aOK() { return !!(AU.c && AU.c.state === 'running' && AU.out); }
function tone(f, t, amp, dec, type) {
  const c = AU.c;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(Math.max(0.0002, amp), t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  o.connect(g); g.connect(AU.out);
  o.start(t); o.stop(t + dec + 0.05);
  return o;
}
function noiseHit(t, amp, freq, dur, q, type) {
  const c = AU.c;
  const s = c.createBufferSource(); s.buffer = AU.noise;
  const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.2;
  const g = c.createGain();
  g.gain.setValueAtTime(Math.max(0.0002, amp), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AU.out);
  s.start(t, rnd() * 0.8); s.stop(t + dur + 0.03);
  return { s: s, f: f, g: g };
}
const BAR_KIND = [0, 1, 2, 0, 1, 2, 1];
const PARTIALS = [
  [[1, 1, 0.95], [3.98, 0.30, 0.16], [9.1, 0.10, 0.05], [2.0, 0.10, 0.35]],   // soft wood
  [[1, 1, 1.3], [2.76, 0.28, 0.55], [5.4, 0.12, 0.26], [8.93, 0.05, 0.12]],   // glass
  [[1, 1, 1.8], [2.0, 0.34, 1.0], [3.01, 0.17, 0.6], [4.17, 0.09, 0.35]],     // bell
];
function playBar(i, vel) {
  if (!aOK() || AU.voices > 24) return;
  const t = AU.c.currentTime + 0.002, f = NOTES[i];
  AU.voices++;
  const P = PARTIALS[BAR_KIND[i]];
  let first = null;
  for (let k = 0; k < P.length; k++) {
    const o = tone(f * P[k][0], t, 0.15 * vel * P[k][1], P[k][2]);
    if (!first) first = o;
  }
  first.onended = function () { AU.voices = Math.max(0, AU.voices - 1); };
  noiseHit(t, 0.05 * vel, 2600 + i * 350, 0.025, 2);
}
function tink(vol, hi) {
  if (!aOK() || AU.voices > 30) return;
  if (T - AU.lastTink < 0.035) return;
  AU.lastTink = T;
  const t = AU.c.currentTime;
  const f = NOTES[(rnd() * 7) | 0] * (hi ? 4 : 2) * (1 + (rnd() - 0.5) * 0.012);
  tone(f, t, 0.045 * vol, 0.14);
  tone(f * 2.71, t, 0.016 * vol, 0.07);
}
function thump(vol) {
  if (!aOK()) return;
  if (T - AU.lastThump < 0.06) return;
  AU.lastThump = T;
  const c = AU.c, t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.22);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.22 * vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + 0.35);
  noiseHit(t, 0.08 * vol, 500, 0.18, 0.7, 'lowpass');
}
function squeak(up) {
  if (!aOK()) return;
  const c = AU.c, t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(up ? 620 : 900, t);
  o.frequency.exponentialRampToValueAtTime(up ? 1180 : 560, t + 0.14);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.06, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + 0.25);
}
function click(vol) {
  if (!aOK() || vol < 0.03) return;
  const t = AU.c.currentTime;
  noiseHit(t, 0.07 * vol, 3200, 0.03, 4);
  tone(1500, t, 0.02 * vol, 0.04, 'square');
}
function floodSound(big) {
  if (!aOK()) return;
  const c = AU.c, t = c.currentTime;
  const n = noiseHit(t, big ? 0.16 : 0.09, 900, big ? 2.4 : 1.4, 0.6);
  n.f.frequency.setValueAtTime(700, t);
  n.f.frequency.exponentialRampToValueAtTime(3800, t + (big ? 2.0 : 1.2));
  const seq = [0, 2, 4, 5, 6, 4, 5, 6];
  const m = big ? seq.length : 5;
  for (let k = 0; k < m; k++) {
    const f = NOTES[seq[k]] * 2;
    tone(f, t + k * 0.07, 0.07, 0.9);
    tone(f * 2.0, t + k * 0.07, 0.02, 0.5);
  }
}
function fanfare() {
  if (!aOK()) return;
  const t = AU.c.currentTime;
  const seq = [2, 4, 5, 6, 5, 6];
  for (let k = 0; k < seq.length; k++) {
    const f = NOTES[seq[k]] * (k > 3 ? 2 : 1);
    tone(f, t + k * 0.11, 0.1, 1.4);
    tone(f * 2, t + k * 0.11, 0.035, 0.9);
    tone(f * 3.01, t + k * 0.11, 0.015, 0.6);
  }
  [0, 2, 4].forEach(function (i) { tone(NOTES[i], t + 0.75, 0.06, 2.2); });
}
function sparkleArp() {
  if (!aOK()) return;
  const t = AU.c.currentTime;
  for (let k = 0; k < 7; k++) tone(NOTES[k] * 2, t + k * 0.05, 0.055, 0.7);
}
const MELODY = [4, 2, 0, 2, 4, 4, 4, -1, 3, 1, 3, 5, 4, 2, 1, -1, 0, 2, 4, 6, 5, 4, 2, -1, 1, 3, 2, 1, 0, -1, 2, -1];
function musicBox(vol) {
  if (!aOK() || AU.voices > 22) return;
  const i = MELODY[AU.step % MELODY.length];
  AU.step++;
  if (i < 0) return;
  const t = AU.c.currentTime;
  const f = NOTES[i] * 2;
  tone(f, t, vol, 0.9);
  tone(f * 3.0, t, vol * 0.15, 0.3);
  if (AU.step % 4 === 1) tone(NOTES[[0, 3, 1, 2][(AU.step >> 2) % 4]] / 2, t, vol * 0.7, 1.4);
}

// ---------------------------------------------------------------- state
const FLY = 0, PHY = 1, HELD = 2, FADE = 3, SPILL = 4;
let balls = [];
let segs = [];
const tr = { wob: 0, wv: 0, brim: 0, fillH: 0, count: 0, cap: 34, floods: 0, floodCD: 0, glow: 0, full: false, jig: 0 };
const pool = { count: 0, level: 0, cc: [0, 0, 0, 0, 0, 0, 0], wob: 0, wv: 0, evapT: 0, ever: false };
const wheel = { th: 0, w: 0, cum: 0, lastK: 0 };
const mgr = { ph: 0, awake: false, lights: 0, wob: 0, wv: 0, ring: -1, ringT: 0 };
const bars = [];
for (let i = 0; i < 7; i++) bars.push({ press: 0, pv: 0, waves: [], glow: 0, hitU: 0.5, last: -1, seed: rnd() * 6, invite: 0 });
const sparks = [], motes = [];
let sched = [];
function after(dt, fn) { sched.push({ t: T + dt, fn: fn }); }
let lastInput = 0, demoDone = false, everTouched = false;
let secretCD = 18;
let flash = 0;

function mkAnimal(kind) {
  return {
    kind: kind, x: 0, y: 0, vx: 0, vy: 0, r: 10, st: 'home', t: 0, homeX: 0, homeY: 0,
    lean: 0, leanT: 0, face: 1, ear: 0, earV: 0, sq: 0, sqV: 0, rot: 0, rollT: 0, rollDir: 1,
    pose: 0, poseT: 0, blink: 2 + rnd() * 2, happy: 0, surprise: 0, lookX: 0, lookY: 0,
    hopCD: 1, hold: null, holdT: 0, arc: null, armUp: 0, pat: 0, rideT: 0, rideA: 0, ridePh: 0,
    superJ: false, idleHop: 2 + rnd() * 2, cheer: 0, catchCD: 0, grabCD: 6, rideCD: 10, prevY: 0,
    demoT: 0, demoBar: 2, demoNext: 'home', kick: 0
  };
}
const rabbit = mkAnimal('r'), bear = mkAnimal('b');
const animals = [rabbit, bear];

// ---------------------------------------------------------------- layout
const sa = document.getElementById('sa');
function readSafe() {
  const s = getComputedStyle(sa);
  return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
}
function hwAt(y) {
  const t0 = L.tr;
  if (y <= t0.rimY) return t0.rw;
  if (y <= t0.neckY) {
    const t = (y - t0.rimY) / (t0.neckY - t0.rimY);
    return t0.nw + (t0.rw - t0.nw) * Math.pow(1 - t, 2.3);
  }
  const dy = y - t0.neckY;
  return dy >= t0.nw ? 0 : Math.sqrt(t0.nw * t0.nw - dy * dy);
}
function inBell(x, y) {
  const t0 = L.tr;
  if (y < t0.rimY - R * 8 || y > t0.neckY + t0.nw) return false;
  return Math.abs(x - t0.cx) <= hwAt(y) + R * 0.3;
}
function inPoolArea(x, y) {
  const B = L.basin;
  return x > B.x0 && x < B.x1 && y > B.top - R * 5 && y < B.bot + R;
}
function addSeg(ax, ay, bx, by, grp) {
  const dx = bx - ax, dy = by - ay;
  segs.push({
    ax: ax, ay: ay, dx: dx, dy: dy, il2: 1 / (dx * dx + dy * dy || 1), grp: grp,
    x0: Math.min(ax, bx) - R, x1: Math.max(ax, bx) + R, y0: Math.min(ay, by) - R, y1: Math.max(ay, by) + R
  });
}

function computeLayout() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const s = readSafe();
  const sl = s.l, st = s.t;
  SW = Math.max(1, W - s.l - s.r); SH = Math.max(1, H - s.t - s.b);
  const X = f => sl + f * SW, Y = f => st + f * SH;
  const port = SH / SW > 1.12;
  const lo = { port: port, X: X, Y: Y, safeT: st };
  let P;
  if (port) {
    P = {
      tr: [0.42, 0.075, 0.24, 0.225, 0.055], basin: [0.14, 0.76, 0.30, 0.41, 0.035], chute: [0.065, 0.022],
      mgr: [0.855, 0.298, 0.13, 0.19], xylo: [0.04, 0.96, 0.645, 0.40], rabbitX: 0.065, bearX: 0.905,
      ferris: [0.64, 0.15, 0.19]
    };
  } else {
    P = {
      tr: [0.25, 0.06, 0.115, 0.285, 0.027], basin: [0.08, 0.60, 0.315, 0.43, 0.02], chute: [0.19, 0.06],
      mgr: [0.885, 0.31, 0.09, 0.24], xylo: [0.25, 0.75, 0.66, 0.42], rabbitX: 0.04, bearX: 0.665,
      ferris: [0.56, 0.17, 0.16]
    };
  }
  lo.tr = { cx: X(P.tr[0]), rimY: Y(P.tr[1]), rw: SW * P.tr[2], neckY: Y(P.tr[3]), nw: SW * P.tr[4] };
  L = lo;
  // bell area -> ball radius
  let area = 0; const steps = 60;
  for (let k = 0; k < steps; k++) {
    const y = lerp(lo.tr.rimY, lo.tr.neckY, (k + 0.5) / steps);
    area += 2 * hwAt(y) * (lo.tr.neckY - lo.tr.rimY) / steps;
  }
  area += PI * lo.tr.nw * lo.tr.nw / 2;
  R = clamp(Math.sqrt(0.8 * area / (34 * PI)), 5, 22);
  G = 2.2 * SH;
  tr.cap = Math.round(0.8 * area / (PI * R * R));

  const B = { x0: X(P.basin[0]), x1: X(P.basin[1]), top: Y(P.basin[2]), bot: Y(P.basin[3]), inset: SW * P.basin[4] };
  const innerW = (B.x1 - B.x0) - B.inset;
  const lipDepth = (30 * PI * R * R / 0.78) / innerW;
  B.lipY = clamp(B.bot - lipDepth, B.top + R * 2, B.bot - R * 4);
  B.lipX = (B.x1 - B.inset) + B.inset * ((B.bot - B.lipY) / (B.bot - B.top));
  B.innerW = innerW;
  lo.basin = B;
  lo.groundY = B.top;
  const ch = { x0: B.lipX, y0: B.lipY, x1: B.lipX + SW * P.chute[0], y1: B.lipY + SH * P.chute[1] };
  lo.chute = ch;
  const wr = R * 2.8;
  lo.wheel = { x: ch.x1 + wr * 0.42, y: ch.y1 + wr * 1.05, r: wr };
  lo.cup = { x0: lo.wheel.x - wr * 1.0, x1: lo.wheel.x + wr * 1.0, top: lo.wheel.y + wr + R * 1.0, bot: lo.wheel.y + wr + R * 3.4 };
  lo.mgr = { cx: X(P.mgr[0]), baseY: Y(P.mgr[1]), rx: SW * P.mgr[2], h: SH * P.mgr[3] };
  lo.ferris = { x: X(P.ferris[0]), y: Y(P.ferris[1]), r: SW * P.ferris[2] * (port ? 1 : 0.62) };
  if (!port) lo.ferris.r = SH * P.ferris[2] * 1.15;
  // gears linking wheel to merry-go-round
  lo.gear1 = { x: lo.wheel.x, y: lo.wheel.y, r: wr * 0.55 };
  lo.gear2 = { r: wr * 0.32 };
  lo.gear2.x = lo.wheel.x + lo.gear1.r + lo.gear2.r * 0.92;
  lo.gear2.y = lo.wheel.y - wr * 0.15;
  // xylophone
  const xs = { x0: X(P.xylo[0]), x1: X(P.xylo[1]), yc: Y(P.xylo[2]), Lmax: SH * P.xylo[3] };
  xs.gap = (xs.x1 - xs.x0) * 0.022;
  xs.bw = ((xs.x1 - xs.x0) - xs.gap * 6) / 7;
  xs.pad = Math.max(SH * 0.05, 26);
  xs.padLoose = Math.max(SH * 0.09, 40);
  xs.bars = [];
  for (let i = 0; i < 7; i++) {
    const len = xs.Lmax * (1 - i * 0.07);
    const x = xs.x0 + i * (xs.bw + xs.gap);
    const top = xs.yc - len / 2;
    const th = Math.max(5, xs.bw * 0.16);
    const c = COL[i];
    const gr = ctx.createLinearGradient(x, 0, x + xs.bw, 0);
    gr.addColorStop(0, rgba(c.d, 0.97));
    gr.addColorStop(0.18, rgba(c.b, 0.93));
    gr.addColorStop(0.45, rgba(c.l, 0.9));
    gr.addColorStop(0.62, rgba(c.b, 0.9));
    gr.addColorStop(1, rgba(c.d, 0.97));
    // fixed stained-glass cut lines
    const rs = mulberry(31 + i * 7);
    const cuts = [];
    for (let k = 0; k < 3; k++) {
      const u = 0.18 + k * 0.27 + rs() * 0.08;
      cuts.push([u, u + (rs() - 0.5) * 0.16]);
    }
    xs.bars.push({ x: x, top: top, w: xs.bw, len: len, th: th, grad: gr, cuts: cuts, cxm: x + xs.bw / 2 });
  }
  lo.xylo = xs;

  // animals
  rabbit.r = R * 1.75; bear.r = R * 1.95;
  rabbit.homeX = X(P.rabbitX); rabbit.homeY = lo.groundY - rabbit.r;
  bear.homeX = X(P.bearX); bear.homeY = lo.groundY - bear.r;

  // colliders
  segs = [];
  const t0 = lo.tr, N = 16;
  const lp = [], rp = [];
  for (let k = 0; k <= N; k++) {
    const y = lerp(t0.rimY, t0.neckY, k / N), hw = hwAt(y);
    lp.push([t0.cx - hw, y]); rp.push([t0.cx + hw, y]);
  }
  const bp = [];
  for (let k = 1; k < 8; k++) {
    const a = PI - k * PI / 8;
    bp.push([t0.cx + Math.cos(a) * t0.nw, t0.neckY + Math.sin(a) * t0.nw]);
  }
  const bell = lp.concat(bp, rp.slice().reverse());
  lo.bellPts = bell;
  for (let k = 0; k < bell.length - 1; k++) addSeg(bell[k][0], bell[k][1], bell[k + 1][0], bell[k + 1][1], 1);
  // ground + basin
  addSeg(-R * 4, lo.groundY - SH * 0.012, B.x0, lo.groundY, 2);
  addSeg(B.x0, lo.groundY, B.x0 + B.inset, B.bot, 2);
  addSeg(B.x0 + B.inset, B.bot, B.x1 - B.inset, B.bot, 2);
  addSeg(B.x1 - B.inset, B.bot, B.lipX, B.lipY, 2);
  addSeg(ch.x0, ch.y0, ch.x1, ch.y1, 3);
  addSeg(B.x1 + R * 0.5, lo.groundY, W + R * 4, lo.groundY - SH * 0.025, 2);
  // cup
  const C = lo.cup;
  addSeg(C.x0, C.top - R, C.x0 + R * 0.6, C.bot, 4);
  addSeg(C.x0 + R * 0.6, C.bot, C.x1 - R * 0.6, C.bot, 4);
  addSeg(C.x1 - R * 0.6, C.bot, C.x1, C.top - R, 4);
  // screen edges
  addSeg(0, -H, 0, lo.groundY, 5);
  addSeg(W, -H, W, lo.groundY, 5);

  // tube path (decorative)
  const nY = t0.neckY, rimY = t0.rimY, rw = t0.rw, cx0 = t0.cx;
  lo.tube = [
    [cx0, nY + t0.nw * 0.85],
    [cx0 - rw * 0.08, nY + t0.nw * 2.9], [cx0 - rw * 1.2, nY + t0.nw * 2.6], [cx0 - rw * 1.18, rimY + (nY - rimY) * 0.55],

// ---------------------------------------------------------------- draw: basin, wheel, cup, gears
function basinPath() {
  const B = L.basin;

}
function drawBasinFront() {

function gearShape(x, y, r, teeth, rot, fill) {

// ---------------------------------------------------------------- draw: merry-go-round

function drawMGR() {

  }

  }
  hs.sort((p, q) => p.s - q.s);

    const x = cx0 + Math.cos(o.a) * rx * 0.72;

  ctx.fillStyle = cg; ctx.fillRect(cx0 - rx * 0.12, roofY, rx * 0.24, platY - roofY);

  }
  ctx.strokeStyle = LEAD; ctx.lineWidth = 1.5; ctx.strokeRect(cx0 - rx * 0.12, roofY, rx * 0.24, platY - roofY);
  for (const o of hs) if (o.s > 0) drawPoleHorse(o);
  // roof: cone of colored glass sectors
  const secs = [];
  for (let k = 0; k < 12; k++) { const a0 = ph + k * TAU / 12; secs.push({ a0: a0, a1: a0 + TAU / 12, m: Math.sin(a0 + TAU / 24), k: k }); }

  const ex = rx * 1.12, ey = ry * 1.1;
  for (const s of secs) {

    ctx.fillStyle = lit > 0.1 ? 'rgba(255,248,220,' + (0.5 + lit * 0.5 * tw).toFixed(2) + ')' : 'rgba(150,140,190,0.8)';
    ctx.beginPath(); ctx.arc(x, y, Math.max(1.5, R * 0.28), 0, TAU); ctx.fill();
  }

  ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(cx0, apexY, R * 0.45, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,214,120,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx0, apexY); ctx.lineTo(cx0, apexY - h * 0.12); ctx.stroke();
  const fw = Math.sin(T * 5) * R * 0.3;

  ctx.restore();
}

// ---------------------------------------------------------------- draw: animals
function eye(x, y, r, a, lookDX, lookDY, happy) {

    ctx.strokeStyle = '#2a1640'; ctx.lineWidth = r * 0.55; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.9, PI * 1.15, PI * 1.85); ctx.stroke(); ctx.lineCap = 'butt';

  ctx.fillStyle = '#2a1640';
  ellipse(x + lookDX * r * 0.35, y + lookDY * r * 0.3, r * big, r * 1.15 * big * open); ctx.fill();
  if (open > 0.5) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x + lookDX * r * 0.35 - r * 0.35, y + lookDY * r * 0.3 - r * 0.45, r * 0.38, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + lookDX * r * 0.35 + r * 0.3, y + lookDY * r * 0.3 + r * 0.35, r * 0.16, 0, TAU); ctx.fill();
  }

// ---------------------------------------------------------------- draw: frame

  }

  for (const b of world) drawBall(b);
  drawTrumpetFront();
  for (const a of animals) {

// ---------------------------------------------------------------- update
function update(dt) {
  T += dt;
  if (sched.length) {
    const due = [];
    sched = sched.filter(function (s) { if (s.t <= T) { due.push(s); return false; } return true; });
    for (const s of due) s.fn();
  }
  const n = Math.min(4, Math.max(1, Math.ceil(dt / (1 / 120))));
  const h = dt / n;
  for (let k = 0; k < n; k++) physStep(h);
  updateTrumpet(dt);
  updatePool(dt);
  updateWheel(dt);
  for (const a of animals) animalAI(a, dt);
  secretCD -= dt;
  flash = Math.max(0, flash - dt * 1.2);
  for (const b of bars) {
    b.pv += (-b.press * 520 - b.pv * 11) * dt;
    b.press += b.pv * dt;
    b.glow = Math.max(0, b.glow - dt * 2.2);
    if (b.invite > 0) b.invite = Math.max(0, b.invite - dt * 1.6);
  }
  // gentle in-world invitation when nobody plays
  const idle = T - lastInput;
  if (idle > 6 && !pointers.size) {
    const period = 2.6;
    const ph = (idle - 6) % period;
    if (ph < dt) bars[3].invite = 1;
  }
  if (idle > 10.5 && !demoDone && !pointers.size) {
    if (startDemo()) demoDone = true;
  }
  updateParticles(dt);
}

// ---------------------------------------------------------------- relayout keeping state
function relayout() {
  const old = L;

  // classify balls before
  const where = balls.map(function (b) {
    if (!old) return 'pool';
    if (b.st === HELD) return 'held';
    if (b.st === FADE) return 'fade';
    if (b.st === PHY && inBell(b.x, b.y)) return 'tr';
    return 'pool';
  });
  computeLayout();
  void oldR;
  const trB = [], poB = [];
  balls.forEach(function (b, i) {
    if (where[i] === 'tr') trB.push(b);
    else if (where[i] === 'pool' && b.st !== FLY) poB.push(b);
    else if (b.st === FLY || where[i] === 'fade') b.st = FADE;
  });
  balls = balls.filter(function (b) { return b.st !== FADE; });
  fillRegion(trB, function (y) { return [L.tr.cx - hwAt(y) + R * 1.05, L.tr.cx + hwAt(y) - R * 1.05]; }, L.tr.neckY + L.tr.nw - R, L.tr.rimY);

  fillRegion(poB, function () { return [B.x0 + B.inset + R * 1.5, B.lipX - R * 1.5]; }, B.bot - R, B.top - R * 10);
  for (const a of animals) {
    a.arc = null;
    if (a.st === 'home' || !pool.ever) { a.st = 'home'; a.x = a.homeX; a.y = a.homeY; a.vy = 0; }
    else { a.st = 'pool'; const xr = poolXRange(a); a.x = lerp(xr[0], xr[1], a.kind === 'r' ? 0.25 : 0.7); a.y = poolRestY(a) - a.r; a.vy = 0; }
    if (a.hold) { const b = a.hold; b.st = PHY; b.holder = null; a.hold = null; }

  for (const b of balls) if (b.st === HELD) { b.st = PHY; b.holder = null; }

      const b = list[k++];
      b.x = x + (rnd() - 0.5) * R * 0.1; b.y = y; b.px = b.x; b.py = b.y; b.vx = 0; b.vy = 0; b.st = PHY;
      x += R * 2.05;
    }
    y -= R * 1.8;
  }
}

// ---------------------------------------------------------------- loop
let last = 0, rafId = 0, running = true;
function frame(ts) {
  if (!running) return;
  rafId = requestAnimationFrame(frame);
  let dt = last ? (ts - last) / 1000 : 1 / 60;
  last = ts;
  if (!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 1 / 30);
  const t0 = performance.now();
  update(dt);
  const t1 = performance.now();
  render();
  prof.u = prof.u * 0.95 + (t1 - t0) * 0.05; prof.r = prof.r * 0.95 + (performance.now() - t1) * 0.05;
}
const prof = { u: 0, r: 0 };
function start() {
  computeLayout();
  rabbit.x = rabbit.homeX; rabbit.y = rabbit.homeY;
  bear.x = bear.homeX; bear.y = bear.homeY;
  for (const a of animals) { a.lookX = L.tr.cx; a.lookY = L.tr.rimY; }
  running = true; last = 0;
  rafId = requestAnimationFrame(frame);
}
let rzT = 0;
function onResize() {
  clearTimeout(rzT);
  rzT = setTimeout(function () {
    if (Math.abs(window.innerWidth - W) < 1 && Math.abs(window.innerHeight - H) < 1 && Math.min(2, window.devicePixelRatio || 1) === DPR) return;
    relayout();
  }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    running = false; cancelAnimationFrame(rafId);
    pointers.clear();
    if (AU.c && AU.c.state === 'running') { const p = AU.c.suspend(); if (p && p.catch) p.catch(function () {}); }
  } else {
    if (!running) { running = true; last = 0; rafId = requestAnimationFrame(frame); }
    if (AU.c && everTouched) { const p = AU.c.resume(); if (p && p.catch) p.catch(function () {}); }
  }
});
window.addEventListener('pageshow', function () { if (!running && !document.hidden) { running = true; last = 0; rafId = requestAnimationFrame(frame); } });

// test hook (no UI)
window.__game = {
  state: function () {
    return {
      balls: balls.length, fly: balls.filter(b => b.st === FLY).length, trumpet: tr.count, cap: tr.cap, fillH: +tr.fillH.toFixed(2),
      floods: tr.floods, pool: pool.count, wheelW: +wheel.w.toFixed(2), wheelCum: +wheel.cum.toFixed(2), awake: mgr.awake,
      rabbit: rabbit.st, bear: bear.st, msU: +prof.u.toFixed(1), msR: +prof.r.toFixed(1), R: +R.toFixed(1), T: +T.toFixed(1), press: bars.map(b => +b.press.toFixed(2)), glow: bars.map(b => +b.glow.toFixed(2))
    };
  },
  layout: function () { return { xylo: L.xylo.bars.map(g => ({ x: g.x, top: g.top, w: g.w, len: g.len })), mgr: L.mgr, basin: L.basin, wheel: L.wheel, tr: L.tr }; }
};
start();
})();
</script>
