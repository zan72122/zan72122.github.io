<script>
(function(){
'use strict';
/* ======================= utils ======================= */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeOutCubic=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeInOut=t=>{t=clamp(t,0,1);return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry(20261027);
const rr=(a,b)=>a+(b-a)*R();
const pick=a=>a[Math.floor(R()*a.length)%a.length];
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function noise1(x){const i=Math.floor(x),f=x-i;const u=f*f*(3-2*f);return (hash(i)*(1-u)+hash(i+1)*u)*2-1;}
function mixC(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,a){return a===undefined?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a.toFixed(3)+')';}
function darker(c,k){return [c[0]*k,c[1]*k,c[2]*k];}
const INKC=[58,40,28];
const ink=a=>'rgba(58,40,28,'+a+')';
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}

/* ======================= canvas ======================= */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let W=390,H=844,DPR=1,DPRCAP=2,Z0=1.5;
const SA={t:0,r:0,b:0,l:0};
let now=0;          // game clock (s)
let UPX=1;          // world/local units per screen pixel for the current drawing transform

function readSA(){
  try{const cs=getComputedStyle(document.getElementById('sa'));
    SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}

/* ======================= audio ======================= */
const AU={c:null,master:null,noise:null,voices:0,last:{},rev:null};
function audioInit(){
  try{
    if(!AU.c){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      AU.c=new C();
      const comp=AU.c.createDynamicsCompressor();
      comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=0.004;comp.release.value=0.2;
      AU.master=AU.c.createGain();AU.master.gain.value=0.6;
      AU.master.connect(comp);comp.connect(AU.c.destination);
      const len=Math.floor(AU.c.sampleRate*1.2);const buf=AU.c.createBuffer(1,len,AU.c.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
      // soft echo for bells
      const dl=AU.c.createDelay(1);dl.delayTime.value=0.23;const fb=AU.c.createGain();fb.gain.value=0.28;
      const lp=AU.c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
      const wet=AU.c.createGain();wet.gain.value=0.35;
      dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(AU.master);
      AU.rev=dl;
    }
    if(AU.c.state==='suspended') AU.c.resume();
  }catch(e){}
}
function canPlay(key,gap){
  if(!AU.c||AU.c.state!=='running') return false;
  if(AU.voices>24) return false;
  if(key){const t=AU.c.currentTime;if(AU.last[key]!==undefined&&t-AU.last[key]<gap) return false;AU.last[key]=t;}
  return true;
}
function osc(type,f0,f1,t0,dur,vol,att,dest,rev){
  try{
    const c=AU.c;const o=c.createOscillator();const g=c.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t0);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+dur*0.85);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+(att||0.005));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(dest||AU.master);if(rev&&AU.rev)g.connect(AU.rev);
    o.start(t0);o.stop(t0+dur+0.05);AU.voices++;
    o.onended=()=>{AU.voices--;try{g.disconnect();}catch(e){}};
  }catch(e){}
}
function nz(t0,dur,vol,ftype,freq,Q,att){
  try{
    const c=AU.c;const s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();
    f.type=ftype;f.frequency.value=freq;f.Q.value=Q||1;const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+(att||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(AU.master);s.start(t0,Math.random()*0.6);s.stop(t0+dur+0.05);
    AU.voices++;s.onended=()=>{AU.voices--;try{g.disconnect();}catch(e){}};
  }catch(e){}
}
const PENTA=[392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093];
const SND={
  pon(p){p=p||1;if(!canPlay('pon',0.05))return;const t=AU.c.currentTime;
    osc('sine',900*p,480*p,t,0.2,0.32,0.003);osc('sine',1800*p,1300*p,t,0.07,0.06,0.002);},
  xylo(i){if(!canPlay('xy',0.04))return;const f=PENTA[2+((i%9)+9)%9];const t=AU.c.currentTime;
    osc('triangle',f,f,t,0.34,0.13,0.003);osc('sine',f*4.01,f*4,t,0.08,0.03,0.002);},
  rustle(){if(!canPlay('ru',0.08))return;const t=AU.c.currentTime;
    nz(t,0.18,0.05,'bandpass',3800+Math.random()*1800,1.1,0.03);nz(t+0.06,0.12,0.03,'highpass',6500,0.7,0.02);},
  leaf(){if(!canPlay('lf',0.11))return;const t=AU.c.currentTime;nz(t,0.07,0.035,'bandpass',5200+Math.random()*1500,2,0.005);},
  creak(){if(!canPlay('cr',0.6))return;const t=AU.c.currentTime;
    try{const f=AU.c.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=3;f.connect(AU.master);
      osc('sawtooth',130,104,t,0.38,0.05,0.06,f);osc('sawtooth',196,170,t+0.05,0.25,0.03,0.05,f);}catch(e){}},
  boing(){if(!canPlay('bo',0.08))return;const t=AU.c.currentTime;osc('sine',320,720,t,0.16,0.18,0.004);osc('triangle',640,1100,t,0.1,0.04,0.003);},
  chirp(p){p=p||1;if(!canPlay('ch',0.12))return;const t=AU.c.currentTime;
    osc('sine',2600*p,3700*p,t,0.07,0.07,0.004);osc('sine',2900*p,4100*p,t+0.09,0.07,0.06,0.004);},
  tok(p){p=p||1;if(!canPlay('tok',0.06))return;const t=AU.c.currentTime;
    osc('sine',720*p,520*p,t,0.09,0.2,0.002);nz(t,0.04,0.06,'bandpass',1800*p,3,0.001);},
  step(){if(!canPlay('st',0.09))return;const t=AU.c.currentTime;osc('sine',260+Math.random()*60,180,t,0.06,0.07,0.002);nz(t,0.03,0.02,'lowpass',900,1,0.001);},
  bell(i){if(!canPlay('bl',0.07))return;const f=PENTA[4+((i%9)+9)%9];const t=AU.c.currentTime;
    osc('sine',f,f,t,1.4,0.09,0.004,null,true);osc('sine',f*2.76,f*2.76,t,0.5,0.025,0.003,null,true);osc('sine',f*5.4,f*5.4,t,0.2,0.012,0.002);},
  sparkle(){if(!canPlay('sp',0.15))return;const t=AU.c.currentTime;for(let k=0;k<4;k++)osc('sine',PENTA[7+k],PENTA[7+k],t+k*0.05,0.3,0.04,0.003,null,true);},
  success(){if(!canPlay('su',0.4))return;const t=AU.c.currentTime;const n=[2,4,5,7,9];
    n.forEach((k,j)=>{osc('triangle',PENTA[k],PENTA[k],t+j*0.085,0.45,0.13,0.004,null,true);osc('sine',PENTA[k]*2,PENTA[k]*2,t+j*0.085,0.25,0.04,0.003);});},
  pop(){if(!canPlay('pp',0.05))return;const t=AU.c.currentTime;nz(t,0.25,0.12,'lowpass',900,0.8,0.002);osc('sine',180,60,t,0.2,0.12,0.002);
    for(let k=0;k<5;k++)nz(t+0.08+Math.random()*0.35,0.03,0.03,'highpass',5000,1,0.001);},
  whoosh(){if(!canPlay('wh',0.3))return;const t=AU.c.currentTime;nz(t,0.6,0.05,'bandpass',600,0.6,0.25);},
  thud(){if(!canPlay('th',0.07))return;const t=AU.c.currentTime;osc('sine',200,90,t,0.12,0.16,0.002);}
};
const MUS={on:false,next:0,step:0,vol:0};
const MEL=[7,-1,9,-1,10,9,7,-1, 5,-1,7,-1,4,-1,-1,-1, 7,-1,9,-1,10,12,10,9, 7,-1,5,-1,6,-1,7,-1,
           9,-1,10,-1,12,10,9,-1, 7,-1,9,-1,5,-1,-1,-1, 4,-1,5,-1,7,9,7,5, 4,-1,2,-1,4,-1,-1,-1];
const BASS=[130.81,110,87.31,98];
function musicTick(){
  if(!MUS.on||!AU.c||AU.c.state!=='running') return;
  const c=AU.c;if(MUS.next<c.currentTime) MUS.next=c.currentTime+0.05;
  while(MUS.next<c.currentTime+0.3){
    const st=MUS.step%MEL.length;const n=MEL[st];const t=MUS.next;
    if(n>=0&&AU.voices<20){const f=PENTA[n];osc('triangle',f,f,t,0.5,0.06,0.006,null,true);osc('sine',f*2,f*2,t,0.25,0.018,0.004);}
    if(st%8===0&&AU.voices<20){const bf=BASS[(st/8|0)%4];osc('sine',bf,bf,t,1.6,0.08,0.03);osc('sine',bf*1.5,bf*1.5,t,1.2,0.025,0.05);}
    if(st%4===2&&AU.voices<20) nz(t,0.05,0.012,'highpass',7000,1,0.002);
    MUS.step++;MUS.next+=0.2;
  }
}

/* ======================= sprites ======================= */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const PALETTES=[
  {leaf:[[[176,212,104],[98,152,60]],[[138,190,84],[66,124,52]],[[196,220,120],[124,170,66]]],blossom:[255,176,196],bud:[[184,226,104],[96,164,58]]},
  {leaf:[[[180,214,110],[104,160,64]],[[150,198,88],[80,140,56]],[[250,198,212],[220,136,166]]],blossom:[255,206,222],bud:[[196,230,120],[110,170,70]]},
  {leaf:[[[240,190,92],[200,124,52]],[[222,128,74],[168,76,48]],[[196,200,96],[134,152,58]]],blossom:[255,222,150],bud:[[214,214,104],[150,160,62]]}
];
const SPR={leaves:[],blossom:[],glow:{},paper:null};
function leafPath(sh){
  const p=new Path2D();
  if(sh===0){p.moveTo(0,0);p.bezierCurveTo(14,-16,46,-17,62,0);p.bezierCurveTo(46,15,14,16,0,0);}
  else if(sh===1){p.moveTo(0,0);p.bezierCurveTo(18,-11,44,-10,64,0);p.bezierCurveTo(44,9,18,11,0,0);}
  else if(sh===2){p.moveTo(0,0);p.bezierCurveTo(3,-19,42,-19,62,0);p.bezierCurveTo(42,17,5,18,0,0);}
  else{p.moveTo(0,0);p.quadraticCurveTo(7,-9,15,-8);p.quadraticCurveTo(21,-16,29,-11);p.quadraticCurveTo(37,-17,45,-10);
    p.quadraticCurveTo(55,-11,63,0);p.quadraticCurveTo(55,10,45,9);p.quadraticCurveTo(37,16,29,10);p.quadraticCurveTo(21,15,15,8);p.quadraticCurveTo(7,9,0,0);}
  p.closePath();return p;
}
function buildLeafSprites(pal){
  SPR.leaves=[];const P=PALETTES[pal];
  for(let sh=0;sh<4;sh++)for(let ti=0;ti<P.leaf.length;ti++){
    const c=mkCanvas(74,46),g=c.getContext('2d');const rnd=mulberry(sh*31+ti*7+pal*101+3);
    g.translate(5,23);const path=leafPath(sh);const tone=P.leaf[ti];
    const grd=g.createLinearGradient(0,-16,8,16);grd.addColorStop(0,rgb(tone[0]));grd.addColorStop(1,rgb(tone[1]));
    g.fillStyle=grd;g.fill(path);
    g.save();g.clip(path);
    for(let k=0;k<6;k++){g.fillStyle=rgb(tone[1],0.16+rnd()*0.1);g.beginPath();g.arc(rnd()*62,(rnd()-0.5)*22,3+rnd()*9,0,TAU);g.fill();}
    g.fillStyle='rgba(255,255,225,0.28)';g.beginPath();g.ellipse(30,-6,20,4,-0.05,0,TAU);g.fill();
    g.restore();
    g.strokeStyle=rgb(darker(tone[1],0.75),0.5);g.lineWidth=3.2;g.stroke(path);
    g.strokeStyle='rgba(52,38,24,0.88)';g.lineWidth=1.5;g.lineJoin='round';g.stroke(path);
    g.beginPath();g.moveTo(1,0);g.quadraticCurveTo(30,-1.6,57,0);
    for(let k=1;k<5;k++){const x=k*11;g.moveTo(x,-0.6);g.lineTo(x+7,-7+rnd()*2);g.moveTo(x,0.4);g.lineTo(x+7,6-rnd()*2);}
    g.strokeStyle='rgba(50,62,26,0.42)';g.lineWidth=1;g.stroke();
    SPR.leaves.push(c);
  }
  SPR.canopy=[];
  for(let v=0;v<4;v++){const c=mkCanvas(128,128),g=c.getContext('2d');const rnd=mulberry(500+v*13+pal*7);const tone=P.leaf[v%P.leaf.length];
    const bl=[];for(let k=0;k<9;k++){const a=rnd()*TAU,d=rnd()*30;bl.push([64+Math.cos(a)*d,64+Math.sin(a)*d*0.8,16+rnd()*14]);}
    g.fillStyle='rgba(52,38,24,0.75)';for(const q of bl){g.beginPath();g.arc(q[0],q[1],q[2]+2,0,TAU);g.fill();}
    const gr=g.createLinearGradient(30,20,100,110);gr.addColorStop(0,rgb(mixC(tone[0],[255,255,220],0.15)));gr.addColorStop(1,rgb(darker(tone[1],0.9)));
    g.fillStyle=gr;for(const q of bl){g.beginPath();g.arc(q[0],q[1],q[2],0,TAU);g.fill();}
    for(let k=0;k<26;k++){g.fillStyle=rgb(rnd()<0.5?darker(tone[1],0.85):mixC(tone[0],[255,255,220],0.3),0.35);const x=30+rnd()*68,y=30+rnd()*68;
      g.beginPath();g.ellipse(x,y,5,2.6,rnd()*TAU,0,TAU);g.fill();}
    g.globalAlpha=1;SPR.canopy.push(c);}
  SPR.blossom=[];
  for(let v=0;v<2;v++){
    const c=mkCanvas(44,44),g=c.getContext('2d');g.translate(22,22);
    const col=v===0?P.blossom:[255,250,240];
    for(let k=0;k<5;k++){g.save();g.rotate(k*TAU/5);g.beginPath();g.ellipse(0,-10,7,10,0,0,TAU);
      g.fillStyle=rgb(col);g.fill();g.strokeStyle='rgba(150,70,90,0.55)';g.lineWidth=1.2;g.stroke();g.restore();}
    g.beginPath();g.arc(0,0,4.5,0,TAU);g.fillStyle='#f7c94b';g.fill();g.strokeStyle='rgba(120,80,30,.6)';g.stroke();
    SPR.blossom.push(c);
  }
}
function buildStaticSprites(){
  const glows={gold:[255,212,120],pink:[255,150,190],warm:[255,170,80],white:[255,250,235],green:[210,255,150],blue:[170,210,255]};
  for(const k in glows){const c=mkCanvas(96,96),g=c.getContext('2d');const gr=g.createRadialGradient(48,48,0,48,48,48);
    const col=glows[k];gr.addColorStop(0,rgb(col,1));gr.addColorStop(0.25,rgb(col,0.55));gr.addColorStop(0.6,rgb(col,0.15));gr.addColorStop(1,rgb(col,0));
    g.fillStyle=gr;g.fillRect(0,0,96,96);SPR.glow[k]=c;}
  // paper texture (multiply)
  const S=512,c=mkCanvas(S,S),g=c.getContext('2d');const rnd=mulberry(77);
  g.fillStyle='#fffdf8';g.fillRect(0,0,S,S);
  for(let k=0;k<26;k++){const x=rnd()*S,y=rnd()*S,r=40+rnd()*120;const gr=g.createRadialGradient(x,y,0,x,y,r);
    const tint=rnd()<0.5?[236,222,196]:[244,232,214];gr.addColorStop(0,rgb(tint,0.35));gr.addColorStop(1,rgb(tint,0));g.fillStyle=gr;
    for(const ox of [-S,0,S])for(const oy of [-S,0,S]){g.save();g.translate(ox,oy);g.fillRect(x-r,y-r,r*2,r*2);g.restore();}}
  for(let k=0;k<1400;k++){const x=rnd()*S,y=rnd()*S,l=3+rnd()*14,a=rnd()*TAU;
    g.strokeStyle='rgba(120,96,70,'+(0.04+rnd()*0.08).toFixed(3)+')';g.lineWidth=0.6+rnd()*0.6;g.beginPath();g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a+0.6)*l*0.5,y+Math.sin(a+0.6)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  for(let k=0;k<3000;k++){g.fillStyle='rgba(110,90,60,'+(rnd()*0.07).toFixed(3)+')';g.fillRect(rnd()*S,rnd()*S,1,1);}
  SPR.paper=c;SPR.paperPat=ctx.createPattern(c,'repeat');
}

/* ======================= camera core ======================= */
const cam={x:0,y:0,z:1,tx:0,ty:0,tz:1,vx:0,vy:0,vz:0,focus:null,hold:0};
const VR={x0:0,y0:0,x1:0,y1:0};
function w2sx(x){return (x-cam.x)*cam.z+W/2;}
function w2sy(y){return (y-cam.y)*cam.z+H/2;}
function s2wx(x){return (x-W/2)/cam.z+cam.x;}
function s2wy(y){return (y-H/2)/cam.z+cam.y;}
function setWorld(){ctx.setTransform(cam.z*DPR,0,0,cam.z*DPR,(W/2-cam.x*cam.z)*DPR,(H/2-cam.y*cam.z)*DPR);UPX=1/cam.z;}
function setScreen(){ctx.setTransform(DPR,0,0,DPR,0,0);UPX=1;}
function inView(x0,y0,x1,y1){return x1>=VR.x0&&x0<=VR.x1&&y1>=VR.y0&&y0<=VR.y1;}

/* ======================= drawing helpers ======================= */
// jittered polygon path from flat point array
function jpath(p,seed,amp,closed){
  ctx.beginPath();const n=p.length/2;
  for(let i=0;i<n;i++){
    const x=p[i*2],y=p[i*2+1];
    const jx=x+noise1(seed+i*1.37)*amp,jy=y+noise1(seed+i*2.11+9)*amp;
    if(i===0)ctx.moveTo(jx,jy);else ctx.lineTo(jx,jy);
    if(closed!==false||i<n-1){
      const k=(i+1)%n;if(!closed&&k===0)break;
      const x2=p[k*2],y2=p[k*2+1];const mx=(x+x2)/2,my=(y+y2)/2;const L=Math.hypot(x2-x,y2-y);
      if(L>amp*12){const nx=-(y2-y)/L,ny=(x2-x)/L;const o=noise1(seed+i*3.7+5)*amp*0.9;ctx.lineTo(mx+nx*o,my+ny*o);}
    }
  }

function skyCols(){
  const alt=clamp((-(cam.y-H/2/cam.z))/5000,0,1);
  const dayT=mixC([176,212,232],[120,170,226],alt),dayM=[212,230,236],dayH=[248,238,214];
  const duT=[96,86,160],duM=[222,136,150],duH=[252,176,100];
  const niT=[14,18,48],niM=[36,38,90],niH=[84,62,118];
  const d=SKY.dusk*(1-SKY.night*0.7),n=SKY.night;
  const f=(a,b,c)=>mixC(mixC(a,b,d),c,n);
  return [f(dayT,duT,niT),f(dayM,duM,niM),f(dayH,duH,niH)];
}
function drawSky(){
  setScreen();
  const [cT,cM,cH]=skyCols();
  const gy=w2sy(GROUND_Y),ty=w2sy(-5200),my=w2sy(-1400);
  const y0=Math.min(ty,gy-1),y1=gy;
  const g=ctx.createLinearGradient(0,y0,0,y1);

  g.addColorStop(1,rgb(cH));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun / golden light
  const alt=clamp((-(cam.y-H/2/cam.z))/4000,0,1);

      const tw=0.5+0.5*Math.sin(now*2+s.ph);ctx.fillStyle='rgba(255,250,220,'+(a*(0.4+0.6*tw)).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x,y,s.s,0,TAU);ctx.fill();}
    const mx=W*0.2,my2=H*0.14+SA.t;ctx.globalCompositeOperation='lighter';glow('white',mx,my2,80,a*0.45);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(255,248,214,'+a+')';circ(mx,my2,19);ctx.fill();ctx.strokeStyle='rgba(120,100,80,'+(a*0.5)+')';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='rgba(230,214,170,'+(a*0.6)+')';circ(mx-6,my2-4,4);ctx.fill();circ(mx+5,my2+6,3);ctx.fill();circ(mx+7,my2-6,2.2);ctx.fill();
  }
}

const T={br:[],dirty:true,size:90,total:0,bb:{x0:-30,y0:-90,x1:30,y1:0},cx:0,leafCount:0,tips:[],hT:0,pal:0};
const WK=0.22,BR_MAX=300,LEAF_MAX=1500,LEAF_PER=48;
let BID=0;
const TMP={x:0,y:0,tx:0,ty:-1,w:1,nx:0,ny:-1},TMP2={x:0,y:0,tx:0,ty:-1,w:1,nx:0,ny:-1},TMP3={x:0,y:0,tx:0,ty:-1,w:1,nx:0,ny:-1};
let windV=0;
function updWind(){windV=Math.sin(now*0.7)*0.5+Math.sin(now*1.9+2)*0.22+noise1(now*0.25)*0.45;}

function leafSz(b){return 15/b.zc;}

function mkBranch(parent,attachS,x,y,zc){
  const b={id:BID++,parent,attachS,pts:[{x,y}],cum:[0],len:0,grow:0,mature:0,zc,tipW:2.3/zc,
    children:[],leaves:[],w:[1],dpx:[x],dpy:[y],spring:0,springV:0,droop:0,droopT:0,droopV:0,
    seed:R()*1000,nextLeafS:0,lside:R()<0.5?1:-1,puff:0,budOpen:0,active:false,flex:1,total:0,
    lE:0,lD:0,isTip:true,born:now,poly:null,depth:parent?parent.depth+1:0,act:1};
  b.nextLeafS=leafSz(b)*rr(0.5,0.9);

  T.br.push(b);T.dirty=true;return b;
}
function bAdd(b,x,y){
  const l=b.pts[b.pts.length-1];const d=Math.hypot(x-l.x,y-l.y);if(d<1e-6)return;
  b.pts.push({x,y});b.cum.push(b.cum[b.cum.length-1]+d);b.len=b.cum[b.cum.length-1];
  b.dpx.push(x);b.dpy.push(y);b.w.push(b.w[b.w.length-1]);T.dirty=true;
}
function recum(b){b.cum[0]=0;for(let i=1;i<b.pts.length;i++)b.cum[i]=b.cum[i-1]+Math.hypot(b.pts[i].x-b.pts[i-1].x,b.pts[i].y-b.pts[i-1].y);b.len=b.cum[b.pts.length-1];T.dirty=true;}
function bIndex(b,s){const c=b.cum;let lo=0,hi=c.length-1;if(hi<1||s<=0)return 0;if(s>=c[hi])return hi-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=s)lo=m;else hi=m;}return lo;}

function wMul(b,s){return (0.45+0.55*b.mature)*clamp((b.grow-s)/(14/b.zc),0.32,1);}
function evalB(b,s,o){
  o=o||TMP;const n=b.pts.length;

  s=clamp(s,0,b.len);const i=bIndex(b,s);const seg=b.cum[i+1]-b.cum[i];const f=seg>0?(s-b.cum[i])/seg:0;
  const x0=b.dpx[i],y0=b.dpy[i],x1=b.dpx[i+1],y1=b.dpy[i+1];
  o.x=x0+(x1-x0)*f;o.y=y0+(y1-y0)*f;let tx=x1-x0,ty=y1-y0;const l=Math.hypot(tx,ty)||1;o.tx=tx/l;o.ty=ty/l;

// point on the upper surface (for things that sit / walk on a branch)
function surf(b,s,side,o){

  o.nx=nx;o.ny=ny;o.x+=nx*o.w*0.48;o.y+=ny*o.w*0.48;return o;
}
// point on the lower surface (for things that hang)
function under(b,s,o){o=evalB(b,s,o);let nx=o.ty,ny=-o.tx;if(ny<0){nx=-nx;ny=-ny;}o.nx=nx;o.ny=ny;o.x+=nx*o.w*0.45;o.y+=ny*o.w*0.45;return o;}
function isDesc(a,b){let p=a;while(p){if(p===b)return true;p=p.parent;}return false;} // a is b or a descendant of b
function extendable(b){return b.isTip&&b.pts.length<380;}

function updStruct(){
  const B=T.br;
  for(let i=B.length-1;i>=0;i--){const b=B[i];let t=b.len;for(const c of b.children)t+=c.total;b.total=t;}
  T.tips.length=0;
  for(const b of B)b.merged=false;
  for(const b of B){let best=null;for(const c of b.children){if(c.attachS>=b.len-0.5&&(!best||c.total>best.total))best=c;}b.cont=best;if(best)best.merged=true;}
  for(const b of B){
    const n=b.pts.length;const kids=b.children.length>1?b.children.slice().sort((a,c)=>c.attachS-a.attachS):b.children;
    let acc=0,k=0;
    for(let i=n-1;i>=0;i--){const s=b.cum[i];while(k<kids.length&&kids[k].attachS>=s-1e-6){acc+=kids[k].total;k++;}
      const d=b.len-s+acc;b.w[i]=Math.max(b.tipW,WK*Math.pow(d,0.7))+b.tipW*0.35;}
    b.w.length=n;
    let tip=true;for(const c of b.children)if(c.attachS>=b.len-0.5)tip=false;b.isTip=tip;if(tip)T.tips.push(b);

}
function computeBBox(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const b of T.br){const n=b.pts.length;for(let i=0;i<n;i+=2){const x=b.dpx[i],y=b.dpy[i];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    const x=b.dpx[n-1],y=b.dpy[n-1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  for(const bd of BLD){if(bd.x===undefined)continue;const s=bd.size;if(bd.x-s<x0)x0=bd.x-s;if(bd.x+s>x1)x1=bd.x+s;if(bd.y-s*1.6<y0)y0=bd.y-s*1.6;}
  T.bb.x0=x0;T.bb.y0=y0;T.bb.x1=x1;T.bb.y1=y1;
  const h=Math.max(0,-y0),w=x1-x0;T.size=Math.max(90,h,w*0.8);T.hT=h;

function addLeaf(b,s,o){

function updTree(dt){

    b.springV+=(-70*b.spring-5.5*b.springV)*dt;b.spring+=b.springV*dt;
    b.droopV+=(55*(b.droopT-b.droop)-6*b.droopV)*dt;b.droop+=b.droopV*dt;
    b.puff=Math.max(0,b.puff-dt*2.6);b.budOpen=Math.max(0,b.budOpen-dt*0.5);

      b.dpx[i]=bx+dx*ca-dy*sa;b.dpy[i]=by+dx*sa+dy*ca+dr*f*f;}

      const s=b.nextLeafS;const ls=leafSz(b);

function buildPoly(b){

    if(B.prog>=1){B.state='done';CONS=null;SND.success();sparkBurst(B.mx,B.my,12,B.size*0.6);onBuilt(B);}return;}
  const cap=(B.gate&1)?((B.gate&2)?1:0.6):0.1;
  const rate=B.type==='plaza'?1/3:1/6.5;
  B.prog=Math.min(cap,B.prog+dt*rate);
  if(B.prog>0.42&&!B.b2&&B.type!=='plaza'){B.b2=true;spawnBuilder(B,'roof');}
  const st=Math.floor(B.prog*18);
  if(st!==B.lstep&&B.prog>0.1&&B.prog<0.88){B.lstep=st;SND.tok(0.9+(st%2)*0.2);const p=locToWorld(B,(st%5-2)*18,-10-B.prog*50);
    addP({k:'dust',x:p.x,y:p.y,vx:rr(-1,1)*B.size*0.3,vy:-B.size*0.3,r:B.size*0.03,life:0.6,max:0.6});if(B.builder)B.builder.peck=0.25;}
  if(B.prog>=1){B.state='done';CONS=null;B.winT=2.5;SND.success();sparkBurst(B.x,B.y-B.size*0.5,16,B.size*0.9);onBuilt(B);}
}
function locToWorld(B,lx,ly){const k=B.size/100;const c=Math.cos(B.rot),s=Math.sin(B.rot);return {x:B.x+(lx*c-ly*s)*k,y:B.y+(lx*s+ly*c)*k};}

/* ---------- bridges ---------- */
function bridgeCands(){
  const C=[];
  for(const b of T.br){if(b.grow<b.len-0.5||b.len<20)continue;
    for(const f of [0.45,0.7,0.95]){const s=b.len*f;evalB(b,s,TMP);if(TMP.y>-40)continue;C.push({b,s,x:TMP.x,y:TMP.y,w:TMP.w});}}
  return C;
}
function findBridge(size){
  const C=bridgeCands();let best=null,bs=-1e9;const n=Math.min(C.length,90);
  const idx=[];for(let i=0;i<C.length;i++)idx.push(i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  for(let ii=0;ii<n;ii++)for(let jj=ii+1;jj<n;jj++){
    const A=C[idx[ii]],Bq=C[idx[jj]];if(A.b===Bq.b)continue;
    if(A.b.parent===Bq.b||Bq.b.parent===A.b){const ch=A.b.parent===Bq.b?A:Bq,pa=ch===A?Bq:A;if(Math.abs(ch.b.attachS-pa.s)<ch.s+size)continue;}
    const d=Math.hypot(A.x-Bq.x,A.y-Bq.y);if(d<size*1.0||d>size*3.6)continue;
    const dy=Math.abs(A.y-Bq.y);if(dy>d*0.4)continue;
    let ok=true;for(const G of BRG){if(Math.hypot(G.mx-(A.x+Bq.x)/2,G.my-(A.y+Bq.y)/2)<size*1.2){ok=false;break;}}if(!ok)continue;
    const mx=(A.x+Bq.x)/2,my=(A.y+Bq.y)/2;if(!boxFree(mx-d*0.3,my-size*0.4,mx+d*0.3,my+size*0.2))continue;
    const sc=-Math.abs(d-size*1.9)/size-dy/d*2+R()*0.6;
    if(sc>bs){bs=sc;best=[A,Bq,d];}
  }
  return best;
}
function startBridge(link){
  const size=hsize();let A,C;
  if(link){A=link[0];C=link[1];}else{const f=findBridge(size);if(!f)return false;A=f[0];C=f[1];}
  const G={type:'bridge',a:{b:A.b,s:A.s},c:{b:C.b,s:C.s},size:Math.max(size*0.8,20),prog:0,state:'build',bounce:0,bv:0,seed:R()*100,lstep:-1,n:10,lit:0,litAt:Infinity,tap:0,mx:0,my:0};
  BRG.push(G);updBridgePos(G);G.n=clamp(Math.round(G.d/(G.size*0.14)),5,40);
  if(CONS){G.prog=0.001;G.state='queued';}else CONS=G;
  return true;
}
function updBridgePos(G){surf(G.a.b,G.a.s,1,TMP);G.ax=TMP.x;G.ay=TMP.y;surf(G.c.b,G.c.s,1,TMP);G.cx=TMP.x;G.cy=TMP.y;G.mx=(G.ax+G.cx)/2;G.my=(G.ay+G.cy)/2;G.d=Math.hypot(G.cx-G.ax,G.cy-G.ay);}
function bridgePt(G,u,o){const sag=G.d*0.08+G.bounce*Math.sin(u*PI);o.x=lerp(G.ax,G.cx,u);o.y=lerp(G.ay,G.cy,u)+Math.sin(u*PI)*sag;return o;}
function updBridges(dt){
  for(const G of BRG){updBridgePos(G);G.bv+=(-60*G.bounce-5*G.bv)*dt;G.bounce+=G.bv*dt;
    if(G.state==='queued'&&!CONS){G.state='build';G.prog=0;CONS=G;}
    if(G.litAt<Infinity&&ST.waveR>=G.litAt)G.lit=Math.min(1,G.lit+dt*2);}
}
function drawBridge(G){
  if(!inView(Math.min(G.ax,G.cx)-G.size,Math.min(G.ay,G.cy)-G.size,Math.max(G.ax,G.cx)+G.size,Math.max(G.ay,G.cy)+G.size))return;
  const n=G.n,shown=G.state==='queued'?0:Math.floor(n*G.prog+0.999);const pw=G.d/n*0.82,ph=G.size*0.075;
  const dim=SKY.night*0.4;
  // ropes
  if(G.prog>0.5||G.state==='done'){const ra=clamp((G.prog-0.5)*2,0,1);ctx.globalAlpha=ra;
    const hh=G.size*0.32;ctx.strokeStyle=ink(0.75);ctx.lineWidth=1.3*UPX;ctx.beginPath();
    for(let i=0;i<=16;i++){bridgePt(G,i/16,TMP);const y=TMP.y-hh+Math.sin(i/16*PI)*G.d*-0.02;if(i===0)ctx.moveTo(TMP.x,y);else ctx.lineTo(TMP.x,y);}ctx.stroke();
    ctx.beginPath();for(let i=0;i<=n;i+=2){bridgePt(G,i/n,TMP);ctx.moveTo(TMP.x,TMP.y);ctx.lineTo(TMP.x,TMP.y-hh+Math.sin(i/n*PI)*G.d*-0.02);}ctx.lineWidth=0.9*UPX;ctx.stroke();
    for(const e of [0,1]){bridgePt(G,e,TMP);jpath([TMP.x-ph*0.6,TMP.y+ph,TMP.x-ph*0.6,TMP.y-hh*1.15,TMP.x+ph*0.6,TMP.y-hh*1.15,TMP.x+ph*0.6,TMP.y+ph],G.seed+e,0.3*UPX);paint(mixC([150,100,64],[50,44,70],dim),1.2,0);}
    ctx.globalAlpha=1;}
  for(let i=0;i<shown;i++){const u=(i+0.5)/n;bridgePt(G,u,TMP);bridgePt(G,u+0.01,TMP2);const a=Math.atan2(TMP2.y-TMP.y,TMP2.x-TMP.x);
    ctx.save();ctx.translate(TMP.x,TMP.y);ctx.rotate(a);rrect(-pw/2,-ph/2,pw,ph,ph*0.3);paint(mixC(i%2?[196,146,96]:[182,132,86],[60,50,70],dim),1.1,0.1);ctx.restore();}
}

/* ---------- lanterns ---------- */
const LAN_MAX=150;
function lanSize(){return clamp(T.size*0.017,8,58);}
function addLanternsOn(b,spacing,sz,litDelayBase){
  let added=0;
  for(let s=Math.min(b.len*0.5,spacing*0.55);s<b.len-sz*0.3;s+=spacing*rr(0.8,1.25)){
    if(LAN.length>=LAN_MAX)break;evalB(b,s,TMP);if(Math.abs(TMP.ty)>0.86&&R()<0.7)continue;
    let near=false;for(const B of BLD){if(B.x!==undefined&&Math.abs(B.x-TMP.x)<B.size*0.7&&TMP.y>B.y-B.size*1.2&&TMP.y<B.y+B.size*0.4){near=true;break;}}if(near)continue;
    const L={b,s,len:sz*rr(0.5,1.2),size:sz*rr(0.8,1.15),col:pick(LCOLS),lit:0,litAt:Infinity,ang:0,av:0,ph:R()*TAU,flash:0,x:0,y:0,ax:0,ay:0};
    if(litDelayBase!==undefined)L.litT=now+litDelayBase+s/(Math.max(1,b.len))*1.2;
    LAN.push(L);added++;
  }
  return added;
}
function genLanterns(){
  const sz=lanSize();const sp=Math.max(sz*3.4,T.size*0.05);
  for(const b of T.br){if(b.len<sp*0.5)continue;if(b.lanDone)continue;b.lanDone=true;addLanternsOn(b,sp,sz);}
}
function updLanterns(dt){
  for(const L of LAN){
    under(L.b,L.s,TMP);L.ax=TMP.x;L.ay=TMP.y;
    L.av+=(-9*L.ang-1.2*L.av+windAt(L.ax)*0.9+L.b.springV*0.5)*dt;L.ang+=L.av*dt;
    L.x=L.ax+Math.sin(L.ang)*L.len;L.y=L.ay+Math.cos(L.ang)*L.len;
    if(L.lit<1){
      let go=false;if(L.litAt<Infinity&&ST.waveR>=L.litAt)go=true;if(L.litT!==undefined&&now>=L.litT)go=true;
      if(go){if(L.lit===0){SND.bell(ST.bellN++);sparkBurst(L.x,L.y,5,L.size*1.2);L.flash=1;}L.lit=Math.min(1,L.lit+dt*3);}
    }
    L.flash=Math.max(0,L.flash-dt*1.5);
  }
}
function drawLanterns(){
  for(const L of LAN){
    if(!inView(L.x-L.size*2,L.y-L.len-L.size*2,L.x+L.size*2,L.y+L.size*2))continue;
    if(L.size*cam.z<1.5)continue;
    ctx.strokeStyle=ink(0.6);ctx.lineWidth=0.9*UPX;ctx.beginPath();ctx.moveTo(L.ax,L.ay);ctx.lineTo(L.x,L.y-L.size*0.45);ctx.stroke();
    ctx.save();ctx.translate(L.x,L.y);ctx.rotate(-L.ang*0.6);const s=L.size;
    const lc=L.lit>0?mixC(mixC(L.col,[255,255,230],0.25),L.col,1-L.lit):mixC(L.col,[200,190,180],0.55);
    ell(0,0,s*0.42,s*0.5);paint(lc,1.2,0.1);
    ctx.strokeStyle=rgb(darker(L.col,0.6),0.6);ctx.lineWidth=0.9*UPX;ctx.beginPath();ctx.ellipse(0,0,s*0.16,s*0.5,0,0,TAU);ctx.moveTo(-s*0.42,0);ctx.lineTo(s*0.42,0);ctx.stroke();
    rrect(-s*0.2,-s*0.6,s*0.4,s*0.14,s*0.04);paint([90,60,50],1,0);rrect(-s*0.2,s*0.46,s*0.4,s*0.14,s*0.04);paint([90,60,50],1,0);
    ctx.strokeStyle=rgb(L.col);ctx.lineWidth=1.4*UPX;ctx.beginPath();ctx.moveTo(0,s*0.6);ctx.lineTo(Math.sin(now*2+L.ph)*s*0.05,s*0.85);ctx.stroke();
    ctx.restore();
  }
}
function drawLanternGlows(){
  for(const L of LAN){if(L.lit<=0)continue;if(!inView(L.x-L.size*4,L.y-L.size*4,L.x+L.size*4,L.y+L.size*4))continue;
    const fl=0.9+0.1*Math.sin(now*9+L.ph)+0.05*Math.sin(now*23+L.ph);
    const name=L.col[1]<150?'pink':(L.col[2]<100?'warm':'gold');
    glow(name,L.x,L.y,L.size*(2.4+L.flash*3)*fl,L.lit*(0.22+0.68*SKY.night)+L.flash*0.5);
    glow('white',L.x,L.y,L.size*0.6,L.lit*0.5);}
}

/* ---------- garlands ---------- */
function genGarlands(){
  const size=hsize();const C=bridgeCands();let tries=0;
  while(GAR.length<16&&tries<400){tries++;const A=pick(C),B=pick(C);if(!A||!B||A.b===B.b)continue;
    const d=Math.hypot(A.x-B.x,A.y-B.y);if(d<size*1.1||d>size*5)continue;if(Math.abs(A.y-B.y)>d*0.5)continue;
    let ok=true;for(const g of GAR){if(Math.hypot(g.mx-(A.x+B.x)/2,g.my-(A.y+B.y)/2)<size*0.9){ok=false;break;}}if(!ok)continue;
    GAR.push({a:{b:A.b,s:A.s},c:{b:B.b,s:B.s},prog:0,delay:R()*3,seed:R()*100,mx:(A.x+B.x)/2,my:(A.y+B.y)/2,fs:size*0.13});}
}
function drawGarlands(dt){
  for(const g of GAR){
    if(g.delay>0){g.delay-=dt;continue;}g.prog=Math.min(1,g.prog+dt*0.7);
    under(g.a.b,g.a.s,TMP);const ax=TMP.x,ay=TMP.y;under(g.c.b,g.c.s,TMP);const cx=TMP.x,cy=TMP.y;g.mx=(ax+cx)/2;g.my=(ay+cy)/2;
    if(!inView(Math.min(ax,cx)-50,Math.min(ay,cy)-50,Math.max(ax,cx)+50,Math.max(ay,cy)+g.fs*4))continue;
    const d=Math.hypot(cx-ax,cy-ay);const sag=d*0.16+Math.sin(now*1.5+g.seed)*d*0.01;const N=Math.max(4,Math.round(d/(g.fs*1.4)));
    const pt=u=>[lerp(ax,cx,u),lerp(ay,cy,u)+Math.sin(u*PI)*sag];
    ctx.strokeStyle=ink(0.7);ctx.lineWidth=1*UPX;ctx.beginPath();for(let i=0;i<=20;i++){const u=i/20*g.prog;const p=pt(u);if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}ctx.stroke();
    const cols=[[240,110,120],[255,200,90],[130,190,230],[170,220,130],[250,160,200]];
    for(let i=0;i<N;i++){const u=(i+0.5)/N;if(u>g.prog)break;const p=pt(u),q=pt(u+0.02);const a=Math.atan2(q[1]-p[1],q[0]-p[0]);
      ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(a+Math.sin(now*3+i)*0.1);ctx.beginPath();ctx.moveTo(-g.fs*0.45,0);ctx.lineTo(g.fs*0.45,0);ctx.lineTo(0,g.fs*1.1);ctx.closePath();
      paint(cols[(i+Math.floor(g.seed))%5],0.9,0);ctx.restore();}
  }
}

/* ---------- nuts ---------- */
function drawAcornShape(x,y,r,rot,gold){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ell(0,r*0.15,r*0.78,r*0.95);paint(gold?[255,204,80]:[196,128,64],1.2,0.15);
  ctx.fillStyle='rgba(255,255,230,0.4)';ell(-r*0.3,r*0.05,r*0.18,r*0.4,0.2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-r*0.42,r*0.9,r*0.5,0,PI,TAU);ctx.lineTo(r*0.9,-r*0.32);ctx.quadraticCurveTo(0,-r*0.12,-r*0.9,-r*0.32);ctx.closePath();
  paint(gold?[214,160,60]:[132,96,62],1.2,0.1);
  ctx.strokeStyle=ink(0.35);ctx.lineWidth=0.8*UPX;ctx.beginPath();for(let k=-2;k<=2;k++){ctx.moveTo(k*r*0.3-r*0.1,-r*0.75);ctx.lineTo(k*r*0.3+r*0.12,-r*0.3);}ctx.stroke();
  ctx.strokeStyle=ink(0.85);ctx.lineWidth=1.4*UPX;ctx.beginPath();ctx.moveTo(0,-r*0.9);ctx.lineTo(r*0.08,-r*1.2);ctx.stroke();
  ctx.restore();
}
function spawnNut(){
  const C=T.br.filter(b=>b.len>20&&b.grow>=b.len-1&&b.depth>0&&(b.w[0]||1)<sq.size*1.2);if(!C.length)return;
  const b=pick(C);const s=b.len*rr(0.35,0.9);
  NUTS.push({st:'hang',b,s,x:0,y:0,vx:0,vy:0,size:sq.size*0.3,t:0,ph:R()*TAU,grow:0,rot:0});
}
function updNuts(dt){
  if(ST.nest&&NUTS.length<6&&now>ST.nutT){ST.nutT=now+6+R()*6;spawnNut();}
  for(let i=NUTS.length-1;i>=0;i--){const n=NUTS[i];n.t+=dt;n.grow=Math.min(1,n.grow+dt*0.8);
    if(n.st==='hang'){under(n.b,n.s,TMP);const sw=Math.sin(now*2+n.ph)*0.15+windAt(TMP.x)*0.1;n.x=TMP.x+Math.sin(sw)*n.size*0.9;n.y=TMP.y+Math.cos(sw)*n.size*0.9;n.rot=-sw;}
    else if(n.st==='fall'){
      const g=Math.max(600,T.size*1.2);const py=n.y;n.vy+=g*dt;n.x+=n.vx*dt;n.y+=n.vy*dt;n.rot+=n.vx*dt*0.05;
      let landed=false;
      if(n.vy>0){
        for(const b of T.br){const P=b.poly;if(!P||P.m<2||n.x<P.x0||n.x>P.x1||P.y1<py-5||P.y0>n.y+5)continue;
          for(let j=0;j<b.pts.length-1;j++){const ax=b.dpx[j],bx=b.dpx[j+1];if((n.x-ax)*(n.x-bx)>0)continue;const f=(n.x-ax)/((bx-ax)||1e-6);
            const ys=b.dpy[j]+(b.dpy[j+1]-b.dpy[j])*f-(b.w[j]||1)*0.5-n.size*0.5;
            if(py<=ys+1&&n.y>=ys){n.y=ys;if(Math.abs(n.vy)>g*0.12){n.vy*=-0.4;n.vx=rr(-1,1)*n.size*4;SND.thud();}else{n.st='rest';n.b=b;n.s=b.cum[j]+(b.cum[j+1]-b.cum[j])*f;n.vy=0;}landed=true;break;}}
          if(landed)break;}
      }
      if(!landed){let gy=Math.abs(n.x)<146?TABLE_Y:(Math.abs(n.x)<430?FLOOR_Y:GROUND_Y);gy-=n.size*0.5;
        if(n.y>=gy&&py<=gy+2){n.y=gy;if(Math.abs(n.vy)>g*0.1){n.vy*=-0.42;n.vx*=0.7;SND.thud();}else{n.st='rest';n.b=null;n.vy=0;}}
        else if(n.y>gy+50){n.y=gy;n.st='rest';n.b=null;}}
      if(n.t>12){n.st='rest';n.b=null;}
    }
    else if(n.st==='rest'){if(n.b){surf(n.b,n.s,1,TMP);n.x=TMP.x;n.y=TMP.y-n.size*0.5;}}
  }
}
function drawNuts(){for(const n of NUTS){if(n.st==='carried')continue;if(!inView(n.x-n.size*2,n.y-n.size*2,n.x+n.size*2,n.y+n.size*2))continue;
  if(n.st==='hang'){ctx.strokeStyle=ink(0.7);ctx.lineWidth=1*UPX;under(n.b,n.s,TMP);ctx.beginPath();ctx.moveTo(TMP.x,TMP.y);ctx.lineTo(n.x,n.y-n.size*0.5);ctx.stroke();}
  drawAcornShape(n.x,n.y,n.size*0.5*easeOutBack(n.grow),n.rot,false);}}

/* ======================= building drawings ======================= */
function drawBuilding(B){
  if(B.x===undefined||B.type==='nest')return;
  const s=B.size;const q=bldBox(B,s*0.4);if(!inView(q[0],q[1],q[2],q[3]+(B.deck?s:0)))return;
  if(s*cam.z<3)return;
  ctx.save();ctx.translate(B.x,B.y);ctx.rotate(B.rot);
  const sq=1-Math.sin(B.tap*PI*3)*0.07*B.tap;const k=s/100;ctx.scale(k*(2-sq),k*sq);UPX=1/(cam.z*k);
  if(B.deck)drawDeck(B);
  if(B.type==='house')drawCottage(B,false);
  else if(B.type==='bakery')drawCottage(B,true);
  else if(B.type==='birdhouse')drawBirdhouse(B);
  else if(B.type==='lookout')drawLookout(B);
  else if(B.type==='plaza')drawPlaza(B);
  ctx.restore();UPX=1/cam.z;
}
function drawDeck(B){
  const k=B.size/100;const dx=B.ax-B.x,dy=B.ay-B.y;const c=Math.cos(-B.rot),s=Math.sin(-B.rot);
  const lx=(dx*c-dy*s)/k,ly=(dx*s+dy*c)/k;const hw=B.type==='plaza'?96:58;

  ctx.beginPath();ctx.moveTo(-hw*0.2,7);ctx.lineTo(lx,ly);ctx.lineWidth=4;ctx.strokeStyle=ink(0.85);ctx.stroke();ctx.lineWidth=2.4;ctx.strokeStyle=rgb(col);ctx.stroke();
  // rope wraps at anchor
  ell(lx,ly,7,4);paint([200,170,120],1,0);
  jpath([-hw,0,hw,0,hw,8,-hw,8],B.seed+50,0.5);paint(mixC([182,130,86],[60,50,70],dim),1.3,0.12);
}
function drawWindow(B,cx,cy,r,bakery){
  const lit=B.lit;const dim=SKY.night;
  const glass=lit>0.05?mixC(mixC([196,224,236],[60,70,110],dim*0.7),[255,212,120],lit):mixC([196,224,236],[60,70,110],dim*0.7);
  jpath([cx-r-3,cy-r-3,cx+r+3,cy-r-3,cx+r+3,cy+r+3,cx-r-3,cy+r+3],B.seed+20,0.4);paint([150,100,66],1.3,0);
  ctx.beginPath();ctx.rect(cx-r,cy-r,r*2,r*2);ctx.fillStyle=rgb(glass);ctx.fill();

function treePath(b1,s1,b2,s2){

  if(!cur)return segs;

  while(nx){const nn=anc.get(nx);segs.push({k:'tree',b:nx,s0:0,s1:nn?nn.attachS:s2});nx=nn;}
  return segs;

    a.ps+=dir*a.speed*dt;let done=dir===0;

function stationary(a){

  if(a.b){surf(a.b,a.s,a.side,TMP);a.x=TMP.x;a.y=TMP.y;let ang=Math.atan2(TMP.ty,TMP.tx);if(TMP.tx<0)ang=Math.atan2(-TMP.ty,-TMP.tx);a.rot+=(clamp(ang,-0.5,0.5)-a.rot)*0.2;}
}
function randomSpot(){
  const C=T.br.filter(b=>b.grow>=b.len-1&&b.len>10);if(!C.length)return null;
  for(let k=0;k<8;k++){const b=pick(C);const s=b.len*rr(0.2,0.95);evalB(b,s,TMP);if(Math.abs(TMP.ty)<0.75&&TMP.y<-20)return {b,s};}
  const b=pick(C);return {b,s:b.len*0.6};
}
function sqSize(){return 29*clamp(Math.sqrt(T.size/520),1,3.4);}

function updSquirrel(a,dt){
  const P=a.pose;a.size+=(sqSize()-a.size)*Math.min(1,dt*0.5);
  P.blink=((now+a.x*0.001)%3.6<0.12)?1:0;a.earT=Math.max(0,a.earT-dt*0.6);P.ear+=(Math.min(1,a.earT*2)-P.ear)*Math.min(1,dt*10);
  P.hug=Math.max(0,P.hug-dt*1.5);P.peek=Math.max(0,P.peek-dt*0.8);a.hopT=Math.max(0,a.hopT-dt*2.2);P.arm=Math.max(0,P.arm-dt*0.7);
  P.curl+=((a.curlT?1:0)-P.curl)*Math.min(1,dt*4);
  if(a.path){a.curlT=false;const done=follow(a,dt);P.run+=dt*16;if(done){a.path=null;const f=a.onArrive;a.onArrive=null;if(f)f(a);}}
  else{P.run=0;stationary(a);}
  a.t+=dt;a.timer-=dt;
  if(a.main)mainThink(a,dt);else critterThink(a,dt);
}
function mainThink(a,dt){
  const P=a.pose;
  switch(a.mode){
    case 'wait':{
      a.hold='nest';a.face=-1;a.b=null;
      if(!a.path){a.x+=(52-a.x)*Math.min(1,dt*3);a.y=TABLE_Y;}
      if(a.timer<0){a.timer=3+R()*3;P.peek=1;}
      if(ST.strokes>=1&&!a.tested&&!a.path){a.tested=true;a.mode='test';
        setPath(a,[{k:'walk',x:26,y:TABLE_Y},{k:'fn',fn:()=>{P.arm=1.4;T.br[0].springV+=1.6;T.br[0].puff=0.6;SND.boing();SND.rustle();}},{k:'wait',dur:1.2},{k:'walk',x:52,y:TABLE_Y}],40,3,()=>{a.mode='wait';});}
      break;}
    case 'test':break;
    case 'climb':break;
    case 'curl':if(a.timer<0){a.curlT=false;a.mode='live';a.timer=1.5;}break;
    case 'live':{
      if(a.path)break;
      if(a.timer>0){if(a.inNest&&a.t%5<0.02)P.peek=1;break;}
      if(ST.phase==='dusk'||ST.phase==='lanternWait'){if(!a.inNest&&ST.nest)goNest(a);else{a.timer=2;P.peek=1;}break;}
      const r=R();const hang=NUTS.filter(n=>n.st==='hang'||n.st==='rest');
      if(hang.length&&r<0.45){fetchNut(a,pick(hang));}
      else if(r<0.75){const sp=randomSpot();if(sp)goTo(a,sp.b,sp.s,70,5,()=>{a.timer=2+R()*3;a.mode='live';});else a.timer=2;}
      else if(ST.nest&&!a.inNest)goNest(a);
      else{a.timer=3+R()*4;a.curlT=R()<0.4;}
      break;}
    case 'chase':{
      const n=a.chase;if(!n||NUTS.indexOf(n)<0){a.mode='live';a.timer=1;break;}
      if(n.st==='rest'&&!a.path){fetchNut(a,n);}
      break;}
    case 'dance':{if(!a.path){P.dance+=dt;a.hopT=Math.max(a.hopT,(Math.sin(now*6)>0.9)?0.5:0);if(a.timer<0){a.timer=0.6;a.face=-a.face;}}break;}
  }
}
function goNest(a,cb){const B=ST.nest;if(!B){a.timer=2;return;}goTo(a,B.b,B.s,70,5,()=>{a.inNest=true;a.b=B.b;a.s=B.s;a.mode=a.mode==='dance'?'dance':'live';a.timer=3+R()*4;a.pose.peek=1;if(cb)cb(a);});}
function fetchNut(a,n){
  a.mode='chase';a.chase=n;
  const pick_=()=>{if(NUTS.indexOf(n)<0){a.mode='live';a.timer=1;return;}n.st='carried';a.hold='nut';SND.pon(1.3);a.earT=1;};
  const deliver=()=>{const i=NUTS.indexOf(n);if(i>=0)NUTS.splice(i,1);a.hold=null;sparkBurst(a.x,a.y-a.size*0.5,6,a.size);SND.sparkle();a.mode='live';a.timer=2+R()*2;a.chase=null;};
  const homeLeg=()=>{const hs=BLD.filter(B=>B.state==='done'&&(B.type==='house'||B.type==='bakery'));
    if(hs.length&&R()<0.5){const H=pick(hs);goTo(a,H.b,H.s,70,5,()=>{H.winT=2;H.wave=1.5;deliver();});}
    else if(ST.nest)goNest(a,deliver);else deliver();};
  if(n.st==='hang'||(n.st==='rest'&&n.b)){goTo(a,n.b,n.s,70,4.5,()=>{pick_();homeLeg();});}
  else if(n.st==='rest'){const t=T.br[0];const f=pathFrom(a);const segs=f.pre.concat(treePath(f.b,f.s,t,20));
    segs.push({k:'hop',fx:0,fy:0,to:{x:n.x,y:n.y+n.size*0.5},h:a.size*1.5,dur:0.7});
    segs.push({k:'fn',fn:()=>{pick_();}});
    segs.push({k:'fn',fn:(an)=>{an.path.push({k:'hop',fx:an.x,fy:an.y,to:{b:t,s:20},h:a.size*1.5,dur:0.7});}});
    setPath(a,segs,70,4,()=>{homeLeg();});
    // fix hop start positions lazily
    for(const sg of segs)if(sg.k==='hop'&&sg.fx===0&&sg.fy===0){sg.lazy=true;}
  }
}
function critterThink(a,dt){
  const P=a.pose;if(a.path)return;
  if(a.mode==='dance'){P.dance+=dt;if(a.timer<0){a.timer=0.5+R()*0.4;a.face=-a.face;a.hopT=0.5;}return;}
  if(a.timer>0)return;
  if(ST.phase==='dusk'||ST.phase==='lanternWait'){if(a.home&&!a.inHome){goTo(a,a.home.b,a.home.s,40,6,()=>{a.inHome=true;a.vis=false;a.home.resIn=true;a.home.res=a;a.timer=4;});}else a.timer=3;return;}
  a.vis=true;if(a.inHome){a.inHome=false;}
  const r=R();
  const brs=BRG.filter(G=>G.state==='done');
  if(brs.length&&r<0.45){const G=pick(brs);const dir=R()<0.5?1:-1;const s0=dir>0?G.a:G.c;const f=pathFrom(a);
    const segs=f.pre.concat(treePath(f.b,f.s,s0.b,s0.s));segs.push({k:'bridge',G,dir});setPath(a,segs,40,6,()=>{a.timer=1+R()*2;});}
  else{const hs=BLD.filter(B=>B.state==='done'&&B.type!=='nest');
    if(hs.length&&r<0.85){const H=pick(hs);goTo(a,H.b,H.s,40,6,()=>{a.timer=2+R()*2;H.winT=1.5;});}
    else{const sp=randomSpot();if(sp)goTo(a,sp.b,sp.s,40,6,()=>{a.timer=2+R()*3;});else a.timer=2;}}
}
// hop segment start points that are only known when the hop begins
function fixLazy(a){const seg=a.path&&a.path[a.pi];if(seg&&seg.k==='hop'&&seg.lazy&&seg.t===undefined){seg.fx=a.x;seg.fy=a.y;seg.lazy=false;}}

/* birds */
function mkBird(o){return mkAnimal('bird',Object.assign({size:clamp(hsize()*0.3,9,52),col:pick([[110,170,226],[240,140,90],[250,206,90],[150,200,130],[230,130,170]]),mode:'perch'},o||{}));}
function edgeSpawn(){const side=R()<0.5?-1:1;return {x:cam.x+side*(W/2/cam.z+60/cam.z),y:cam.y-H/2/cam.z*rr(0.2,0.8)};}
function flyTo(a,to,cb,carry){
  resolveTo(to,TMP);const d=Math.hypot(TMP.x-a.x,TMP.y-a.y);
  a.fly={fx:a.x,fy:a.y,to,t:0,dur:clamp(d/(a.size*14),0.8,4.5),cb};a.mode='fly';if(carry!==undefined)a.carry=carry;a.vis=true;a.inHome=false;
  if(a.home&&a.home.res===a)a.home.resIn=false;
}
function updBird(a,dt){
  a.peck=Math.max(0,a.peck-dt);a.hopT=Math.max(0,a.hopT-dt*2.5);
  if(a.mode==='fly'){const F=a.fly;F.t+=dt/F.dur;const f=easeInOut(F.t);resolveTo(F.to,TMP);
    const mx=(F.fx+TMP.x)/2,my=Math.min(F.fy,TMP.y)-Math.hypot(TMP.x-F.fx,TMP.y-F.fy)*0.3;
    const u=1-f;a.x=u*u*F.fx+2*u*f*mx+f*f*TMP.x;a.y=u*u*F.fy+2*u*f*my+f*f*TMP.y;a.face=TMP.x>=F.fx?1:-1;a.flap+=dt*22;
    if(F.t>=1){a.fly=null;a.mode='perch';a.perch=F.to;SND.chirp(1+R()*0.2);a.timer=2+R()*4;if(F.cb)F.cb(a);}
    return;}
  if(a.mode==='perch'){if(a.perch)resolveTo(a.perch,TMP);a.x=TMP.x;a.y=TMP.y;a.flap=0;}
  if(a.mode==='home'){if(a.home){const p=locToWorld(a.home,0,-30);a.x=p.x;a.y=p.y;}a.vis=false;}
  if(a.role==='builder')return;
  a.timer-=dt;if(a.timer>0)return;
  const night=ST.phase==='dusk'||ST.phase==='lanternWait';
  if(night){if(a.home&&a.mode!=='home'){goHomeBird(a);}else if(!a.home&&a.mode!=='home'){const sp=randomSpot();if(sp)flyTo(a,sp);a.timer=20;}else a.timer=5;return;}
  if(a.mode==='home'){a.home.resIn=true;a.home.res=a;if(R()<0.4){const sp=randomSpot();const p=locToWorld(a.home,0,-30);a.x=p.x;a.y=p.y;a.vis=true;if(sp)flyTo(a,sp);}else{a.timer=3+R()*4;a.home.winT=Math.max(a.home.winT,1.2);}return;}
  const r=R();const hs=BLD.filter(B=>B.state==='done'&&(B.type==='house'||B.type==='bakery'||B.type==='birdhouse'));
  if(hs.length>=2&&r<0.3){const H=pick(hs.filter(h=>h!==a.home))||hs[0];flyTo(a,{B:H,lx:-48,ly:-10},(b)=>{H.winT=2.2;H.wave=1.6;if(H.res&&H.res.kind==='bird')H.resIn=true;b.carry=null;b.timer=1.5;},'letter');}
  else if(a.home&&r<0.55)goHomeBird(a);
  else{const sp=randomSpot();if(sp)flyTo(a,sp);else a.timer=2;}
}
function goHomeBird(a){const H=a.home;if(H.type==='lookout'){flyTo(a,{B:H,lx:-20,ly:-150});return;}flyTo(a,{B:H,lx:H.type==='birdhouse'?0:-22,ly:H.type==='birdhouse'?-24:-30},(b)=>{b.mode='home';b.vis=false;H.resIn=true;H.res=b;H.winT=1.5;b.timer=4+R()*6;});}
function spawnBuilder(B,carry){
  const bc=ANIM.filter(a=>a.kind==='bird').length;
  let a=null;
  if(bc>=14){a=ANIM.find(x=>x.kind==='bird'&&x.role!=='builder'&&x.mode!=='home');}
  if(!a){const e=edgeSpawn();a=mkBird({x:e.x,y:e.y,size:clamp(B.size*0.3,9,52)});}
  a.role='builder';
  flyTo(a,{B,lx:carry==='plank'?-58:56,ly:-2},(b)=>{B.gate|=(carry==='plank'?1:2);b.carry=null;SND.tok();if(carry==='plank')B.builder=b;},carry);
  if(carry==='plank')B.builder=a;else B.builder2=a;

function onBuilt(B){
  ST.built++;
  if(sq&&sq.mode==='live'&&!sq.path){sq.earT=1;sq.face=B.x>sq.x?1:-1;}
  for(const a of [B.builder,B.builder2]){if(!a)continue;a.role=null;a.timer=1+R()*2;}
  if(B.type==='house'||B.type==='birdhouse'||B.type==='lookout'){
    const a=B.builder;if(a&&!a.home){a.home=B;B.res=a;if(B.type!=='lookout'){goHomeBird(a);}}
  }
  if(B.type==='bakery'||(B.type==='house'&&R()<0.6)){
    if(ANIM.filter(a=>a.kind==='mouse').length<9){const m=mkAnimal('mouse',{size:clamp(B.size*0.28,9,46),col:pick([[176,166,160],[200,170,140],[230,220,210]]),home:B,b:B.b,s:B.s,timer:2});surf(B.b,B.s,1,TMP);m.x=TMP.x;m.y=TMP.y;if(!B.res)B.res=m;}
  }
  if(B.type==='bridge'&&ANIM.filter(a=>a.kind==='mouse').length<9&&R()<0.6){const m=mkAnimal('mouse',{size:clamp(B.size*0.26,9,46),col:[190,170,150],b:B.a.b,s:B.a.s,timer:0.5});surf(B.a.b,B.a.s,1,TMP);m.x=TMP.x;m.y=TMP.y;}
}

/* animal drawing */
function drawSquirrel(a){
  if(!a.vis)return;const s=a.size/40;if(a.size*cam.z<2)return;
  const P=a.pose;const hop=Math.sin(a.hopT*PI*2)*a.size*0.25*(a.hopT>0?1:0);
  ctx.save();ctx.translate(a.x,a.y-Math.abs(hop));ctx.rotate(a.rot);ctx.scale(s*a.face,s);UPX=1/(cam.z*s);
  const fur=a.col||SQC,bel=SQB;const dim=SKY.night*0.35;const fc=mixC(fur,[70,60,100],dim),bc=mixC(bel,[90,90,120],dim);
  const run=P.run?Math.sin(P.run):0,runA=P.run?1:0;const curl=P.curl;const dn=P.dance?Math.sin(P.dance*7):0;
  if(a.inNest){ctx.translate(0,8+P.curl*4-P.peek*4);}
  ctx.rotate(dn*0.15);
  // tail
  const tw=Math.sin(now*2.2+a.x)*0.08+run*0.15;
  const b0=[-6,-9],b1=[lerp(-26,-12,curl),lerp(-6,-2,curl)],b2=[lerp(-30,6,curl),lerp(-36,-12,curl)],b3=[lerp(-12+tw*20,14,curl),lerp(-46,-24,curl)];

  ctx.fillStyle=rgb(darker(fc,0.92));for(const p of tp){circ(p[0],p[1],p[2]);ctx.fill();}

  // haunch & feet
  const lift=runA*Math.max(0,run)*3;
  ell(-3,-7-lift*0.5,7.5,6.5);paint(fc,1.4,0.12);
  ell(4+run*3,-1.4-Math.max(0,-run)*2,4.2,1.9);paint(fc,1.2,0);ell(-6-run*3,-1.4-lift,4,1.8);paint(fc,1.2,0);

  ctx.save();ctx.translate(hx,hy);ctx.rotate(-look*0.3+(P.peek>0?0.25*Math.sin(P.peek*PI):0));
  // ear
  const eu=P.ear*3;ctx.beginPath();ctx.moveTo(-5,-6);ctx.quadraticCurveTo(-5,-15-eu,-1,-16-eu);ctx.quadraticCurveTo(1,-11,1,-7);ctx.closePath();paint(fc,1.3,0);
  ctx.fillStyle='rgba(240,150,150,0.6)';ctx.beginPath();ctx.moveTo(-3.6,-7);ctx.quadraticCurveTo(-3.4,-13-eu,-1.3,-13.5-eu);ctx.quadraticCurveTo(-0.4,-10,-0.6,-7.5);ctx.closePath();ctx.fill();
  circ(0,0,9.5);paint(fc,1.5,0.12);
  ell(5,2.5,5.2,4.2);ctx.fillStyle=rgb(bc);ctx.fill();
  if(P.blink||curl>0.6){ctx.strokeStyle=ink(0.9);ctx.lineWidth=1.2*UPX;ctx.beginPath();ctx.arc(3.5,-1.5,1.8,0.2,PI-0.2);ctx.stroke();}
  else{ctx.fillStyle='#23160e';circ(3.6,-1.6,1.9);ctx.fill();ctx.fillStyle='#fff';circ(4.2,-2.3,0.7);ctx.fill();}
  ctx.fillStyle='rgba(240,120,120,0.45)';circ(5.5,2.8,2.6);ctx.fill();
  ctx.fillStyle='#4a2c20';circ(9.3,0.2,1.3);ctx.fill();
  ctx.strokeStyle=ink(0.7);ctx.lineWidth=0.9*UPX;ctx.beginPath();ctx.moveTo(8.6,2.2);ctx.quadraticCurveTo(7.6,3.8,6.4,3.2);ctx.stroke();

    ell(0,-5,8,2.2);paint([100,66,42],1,0);ctx.strokeStyle=ink(0.4);ctx.lineWidth=0.8*UPX;ctx.beginPath();ctx.moveTo(-6,-1);ctx.lineTo(5,0);ctx.moveTo(-5,1.5);ctx.lineTo(6,1);ctx.stroke();ctx.restore();}

function drawBird(a){

const PS=[];const PMAX=280;

function leafBurst(x,y,n,sz){for(let i=0;i<n;i++)addP({k:'leaf',x,y,vx:rr(-1,1)*sz*3,vy:-rr(0.5,2)*sz*2,life:rr(1.4,2.4),max:2.4,sz:sz*rr(0.7,1.1),rot:R()*TAU,vr:rr(-4,4),v:Math.floor(R()*SPR.leaves.length)});}
function ripple(x,y){addP({k:'ripple',x,y,life:0.6,max:0.6});}
function launchFirework(){
  const vh=H/cam.z,vw=W/cam.z;const x=cam.x+rr(-0.4,0.4)*vw;const y0=cam.y+vh*0.45;const y1=cam.y-vh*rr(0.12,0.38);
  addP({k:'rocket',x,y:y0,vx:rr(-0.03,0.03)*vw,vy:(y1-y0)/1.1,life:1.1,max:1.1,col:pick([['gold','pink'],['white','gold'],['pink','blue'],['green','gold'],['warm','white']])});

}
function fwBurst(x,y,cols){const r=H/cam.z*rr(0.1,0.16);const n=34;for(let i=0;i<n;i++){const a=i/n*TAU+R()*0.1,v=r*rr(0.85,1.15);
  addP({k:'fw',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rr(1.1,1.6),max:1.6,col:cols[i%2],sz:rr(2.5,4)});}SND.pop();}
function updParticles(dt){
  const g=H/cam.z*0.25;
  for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.t+=dt;p.life-=dt;
    if(p.life<=0){if(p.k==='rocket')fwBurst(p.x,p.y,p.col);PS.splice(i,1);continue;}
    switch(p.k){
      case 'spark':p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy=p.vy*0.94+g*0.3*dt;break;
      case 'leaf':p.x+=p.vx*dt+Math.sin(p.t*3)*p.sz*dt*2;p.y+=p.vy*dt;p.vy+=p.sz*6*dt;p.vy=Math.min(p.vy,p.sz*4);p.vx*=0.97;p.rot+=p.vr*dt;break;
      case 'smoke':p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=0.99;p.r+=p.g*dt;break;
      case 'dust':p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=Math.abs(p.vy)*dt;break;
      case 'petal':p.x+=p.vx*dt+Math.sin(p.t*2+p.ph)*p.sz*0.8*dt*10;p.y+=p.vy*dt;p.rot+=dt*2;break;
      case 'fw':p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy=p.vy*0.95+g*0.4*dt;break;
      case 'rocket':p.x+=p.vx*dt;p.y+=p.vy*dt;if(R()<0.6)addP({k:'spark',x:p.x,y:p.y,vx:0,vy:0,life:0.35,max:0.35,sz:2,col:'warm'});break;
    }
  }
}
function drawParticles(){

    else if(p.k==='petal'){ctx.globalCompositeOperation='lighter';glow(p.col,p.x,p.y,p.sz*2.5,a*0.6);ctx.globalCompositeOperation='source-over';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ell(0,0,p.sz*0.5,p.sz*0.28);ctx.fillStyle=p.col==='pink'?'rgba(255,190,210,'+a+')':'rgba(255,236,170,'+a+')';ctx.fill();ctx.restore();}

}

/* ======================= camera ======================= */
function frameFor(extra){
  const bb=T.bb;let x0=Math.min(bb.x0,-60),x1=Math.max(bb.x1,70),y0=Math.min(bb.y0,-100),y1=Math.max(bb.y1,14);
  const h=y1-y0,w=x1-x0;y0-=h*0.22*extra;x0-=w*0.1*extra;x1+=w*0.1*extra;y1+=h*0.04+10;
  const aw=Math.max(100,W-SA.l-SA.r-30),ah=Math.max(100,H-SA.t-SA.b-30);
  const wf=(x1-x0)*(aw<ah*0.8?0.78:1);
  const z=Math.max(Math.min(aw/wf,ah/(y1-y0),Z0),Math.min(W,H)/5200);
  let cx=(x0+x1)/2;const vw=aw/z;
  if(vw<x1-x0){const fx=ST.lastX===undefined?cx:ST.lastX;cx=clamp(fx,x0+vw/2,x1-vw/2);}
  let cy=Math.min((y0+y1)/2,y1-(ah/2-10)/z);
  cx-=((SA.l-SA.r)/2)/z;cy-=((SA.t-SA.b)/2)/z;
  return {x:cx,y:cy,z};
}
function reframe(force,extra){
  computeBBox();const vz=cam.tz;const hw=(W-SA.l-SA.r-30)/2/vz,hh=(H-SA.t-SA.b-30)/2/vz;const bb=T.bb;
  const inside=bb.x0>cam.tx-hw&&bb.x1<cam.tx+hw&&bb.y0>cam.ty-hh&&bb.y1<cam.ty+hh+60/vz;
  if(inside&&!force)return;
  let g=frameFor(extra||1.5);
  if(!force&&g.z<cam.tz&&g.z>cam.tz*0.8){const z=cam.tz*0.8;g=frameFor(extra||1.5);g.z=Math.min(g.z,z);}
  cam.tx=g.x;cam.ty=g.y;cam.tz=g.z;
}
function camFocusOn(x,y,size,dur){
  if(INP.id!==null||ST.phase==='festival')return;
  if(size*cam.tz>46)return;if(now<cam.nextFocus)return;
  cam.nextFocus=now+14;cam.focus={x,y,z:Math.min(Z0,80/size),until:now+dur};
}
function camUpdate(dt){
  if(INP.id!==null){cam.vx=cam.vy=cam.vz=0;return;}
  let tx=cam.tx,ty=cam.ty,tz=cam.tz;
  if(cam.focus){if(now>cam.focus.until){cam.focus=null;reframe(true);tx=cam.tx;ty=cam.ty;tz=cam.tz;}else{tx=cam.focus.x;ty=cam.focus.y;tz=cam.focus.z;}}
  const w=2.1,wz=1.7;const n=Math.ceil(dt/0.017);const h=dt/n;
  for(let i=0;i<n;i++){
    cam.vx+=(w*w*(tx-cam.x)-2*w*cam.vx)*h;cam.x+=cam.vx*h;
    cam.vy+=(w*w*(ty-cam.y)-2*w*cam.vy)*h;cam.y+=cam.vy*h;
    const lz=Math.log(cam.z),lt=Math.log(tz);cam.vz+=(wz*wz*(lt-lz)-2*wz*cam.vz)*h;cam.z=Math.exp(lz+cam.vz*h);
  }
}
function updVR(){const m=40/cam.z;VR.x0=cam.x-W/2/cam.z-m;VR.x1=cam.x+W/2/cam.z+m;VR.y0=cam.y-H/2/cam.z-m;VR.y1=cam.y+H/2/cam.z+m;}

function addLanternsFrom(b,s0,sp,sz){const n0=LAN.length;addLanternsOn(b,sp,sz,0.25);for(let i=LAN.length-1;i>=n0;i--){if(LAN[i].s<s0)LAN.splice(i,1);}}
function beginFestival(b){
  setPhase('festival');MUS.on=true;
  const sz=lanSize()*1.3;const L={b,s:b.len*0.92,len:sz*0.8,size:sz,col:[255,200,100],lit:0,litAt:0,ang:0,av:0,ph:0,flash:1,x:0,y:0,ax:0,ay:0};LAN.push(L);
  // light distances along the tree, starting at the new branch

  while(st.length){const [x,e,d,from]=st.pop();x.lE=e;x.lD=d;for(const c of x.children)if(c!==from)st.push([c,0,d+Math.abs(c.attachS-e),x]);if(x.parent&&x.parent!==from)st.push([x.parent,x.attachS,d+e,x]);}

function startFinale(){

function updStory(dt){

      break;

  else if(!INP.moved&&h){if(h.k==='tip')tapTip(h.b);else if(h.k==='branch')tapBranch(h.b,h.s);}
  try{cv.releasePointerCapture(INP.id);}catch(_){}
  INP.id=null;INP.hit=null;INP.st=null;G.idle=0;
  if(!ST.reframeAt)ST.reframeAt=now+0.35;
}
cv.addEventListener('pointerdown',pointerDown,{passive:false});
cv.addEventListener('pointermove',pointerMove,{passive:false});
cv.addEventListener('pointerup',pointerUp,{passive:false});
cv.addEventListener('pointercancel',pointerUp,{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===INP.id)endInput();});
window.addEventListener('blur',()=>endInput());
['contextmenu','selectstart','dragstart','gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

/* ======================= guidance ======================= */
const G={idle:0,target:null,needNew:true,handT:-1,stretch:0,pulse:0};
function chooseTarget(){
  let best=null,bs=-1e9;
  for(const b of T.tips){if(b.grow<1)continue;tipPos(b,TMP);const sx=w2sx(TMP.x),sy=w2sy(TMP.y);
    if(sx<SA.l+40||sx>W-SA.r-40||sy<SA.t+70||sy>H-SA.b-60)continue;
    let sc=-Math.abs(sy-H*0.42)/H*1.2-Math.abs(sx-W/2)/W*0.8+hash(b.id*3.7+Math.floor(ST.strokes))*0.9;
    if(b===ST.lastB)sc+=0.35;if(ST.phase==='seed'&&b.depth===0)sc+=2;
    if(sc>bs){bs=sc;best=b;}}
  return best||T.tips[0]||T.br[0];
}
function updGuide(dt){
  if(INP.id===null)G.idle+=dt;else G.idle=0;
  if(G.needNew||!G.target||!G.target.isTip||T.br.indexOf(G.target)<0){if(INP.id===null&&now>=ST.reframeAt-0.3){G.target=chooseTarget();G.needNew=false;}}
  G.pulse=0.5+0.5*Math.sin(now*4.2);
  const hd=4.5;
  const quiet=ST.finale&&now-ST.finaleT<22;
  if(G.idle>hd&&!quiet&&!ST.wipe&&!cam.focus&&Math.abs(cam.vx)+Math.abs(cam.vy)<40/cam.z){if(G.handT<0)G.handT=0;G.handT+=dt;if(G.handT>3.4)G.handT=0;}else G.handT=-1;
  if(G.idle>10){G.stretch=((G.idle-10)%4)/1.2;if(G.stretch>1)G.stretch=0;}else G.stretch=0;
  if(sq&&G.target){tipPos(G.target,TMP);const dx=TMP.x-sq.x,dy=TMP.y-(sq.y-sq.size);sq.pose.look=clamp(-dy/Math.max(1,Math.hypot(dx,dy)),-1,1)*(sq.face*dx>0?1:0.3);
    if(sq.mode==='wait'&&G.idle>8&&((G.idle%5)<0.02))sq.pose.arm=1.2;}
}
function drawHand(){
  if(G.handT<0||G.handT>1.9)return;
  let tx,ty,dx,dy;
  if(ST.golden&&G.idle>9&&ST.golden.x!==undefined){tx=w2sx(ST.golden.x);ty=w2sy(ST.golden.y);dx=0;dy=0;}
  else{const b=G.target;if(!b)return;tipPos(b,TMP);tx=w2sx(TMP.x);ty=w2sy(TMP.y);
    let ux=TMP.tx*0.5,uy=TMP.ty*0.5-1;if(ty<H*0.33){uy=-0.2;ux=(tx<W/2?-1:1);}const l=Math.hypot(ux,uy)||1;dx=ux/l*Math.min(130,H*0.16);dy=uy/l*Math.min(130,H*0.16);}
  const t=G.handT;const app=clamp(t/0.3,0,1),mv=easeInOut(clamp((t-0.35)/1.0,0,1)),out=1-clamp((t-1.5)/0.4,0,1);
  const a=app*out;const x=tx+dx*mv,y=ty+dy*mv;const press=t>0.3&&t<1.45;
  setScreen();
  if(mv>0&&press){ctx.strokeStyle='rgba(140,200,90,'+(0.45*a)+')';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.stroke();}
  if(press){ctx.strokeStyle='rgba(255,255,255,'+(0.7*a)+')';ctx.lineWidth=2;circ(x,y,14+Math.sin(now*10)*2);ctx.stroke();}
  ctx.save();ctx.translate(x+4,y+6+(press?0:-8));ctx.rotate(-0.35);ctx.globalAlpha=a*0.92;
  ctx.fillStyle='rgba(60,40,30,0.18)';rrect(-9,4,22,70,11);ctx.fill();
  rrect(-11,0,22,62,11);ctx.fillStyle='#fff6ec';ctx.fill();ctx.strokeStyle=ink(0.8);ctx.lineWidth=1.8;ctx.stroke();
  rrect(-6,3,12,12,5);ctx.fillStyle='rgba(255,210,210,0.8)';ctx.fill();ctx.strokeStyle=ink(0.4);ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-11,40);ctx.quadraticCurveTo(-30,44,-28,72);ctx.lineTo(-24,100);ctx.lineTo(26,100);ctx.quadraticCurveTo(34,70,24,50);ctx.quadraticCurveTo(18,40,11,44);ctx.closePath();
  ctx.fillStyle='#fff6ec';ctx.fill();ctx.strokeStyle=ink(0.8);ctx.lineWidth=1.8;ctx.stroke();
  ctx.strokeStyle=ink(0.35);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(11,52);ctx.quadraticCurveTo(20,56,18,66);ctx.moveTo(-6,46);ctx.lineTo(-6,56);ctx.stroke();
  ctx.restore();ctx.globalAlpha=1;
}
function drawInk(){
  if(!INP.ink.length)return;setWorld();
  for(let i=INP.ink.length-1;i>=0;i--)if(now-INP.ink[i].t>0.9)INP.ink.splice(i,1);
  const pts=INP.ink;if(pts.length<1)return;ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<pts.length;i++){const a=1-(now-pts[i].t)/0.9;ctx.strokeStyle='rgba(120,190,80,'+(0.42*a).toFixed(3)+')';ctx.lineWidth=(8+4*a)*UPX;ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
  if(INP.st){const p=pts[pts.length-1];ctx.fillStyle='rgba(130,200,90,0.35)';circ(p.x,p.y,(11+Math.sin(now*20)*1.5)*UPX);ctx.fill();ctx.fillStyle='rgba(170,230,120,0.5)';circ(p.x,p.y,6*UPX);ctx.fill();}
}

/* ======================= reset / init ======================= */
function resetWorld(cycle){
  T.br.length=0;BID=0;T.leafCount=0;T.tips.length=0;T.dirty=true;T.pal=cycle%PALETTES.length;buildLeafSprites(T.pal);
  BLD.length=0;BRG.length=0;LAN.length=0;GAR.length=0;NUTS.length=0;PS.length=0;ANIM.length=0;CONS=null;TQ.length=0;
  R=mulberry(20261027+cycle*7919);
  const wipe=ST.wipe;for(const k in ST)delete ST[k];
  Object.assign(ST,{phase:'seed',phaseT:0,prog:0,strokes:0,nest:null,nestPending:false,nextBuild:2.6,festAt:22,bi:0,built:0,firstTouch:false,
    waveT0:-1,waveR:0,waveV:1,waveMax:1,finale:false,finaleT:0,lightsOn:false,cycle,golden:null,plaza:null,plazaTried:false,wipe:wipe||null,
    reframeAt:0,lastB:null,nutT:1e9,bellN:0,camSeq:0,fwT:0});
  SKY.dusk=SKY.night=SKY.td=SKY.tn=0;MUS.on=false;
  const b0=mkBranch(null,0,2,-1,Z0);
  for(const p of [[3,-20],[4,-36],[5,-50],[4,-62],[2,-74],[1,-86]])bAdd(b0,p[0],p[1]);
  b0.grow=b0.len;b0.mature=0.2;b0.nextLeafS=b0.len+leafSz(b0)*0.6;
  addLeaf(b0,64,{side:1,open:1,delay:0,k:1.0});addLeaf(b0,68,{side:-1,open:1,delay:0,k:0.95});
  updStruct();
  sq=mkAnimal('squirrel',{main:true,size:29,x:52,y:TABLE_Y,face:-1,mode:'wait',hold:'nest',col:SQC,timer:2});
  initCam();G.target=b0;G.idle=0;G.needNew=true;
  computeBBox();
}
function initCam(){
  Z0=Math.min(W/250,H/310);
  cam.z=cam.tz=Z0;cam.x=cam.tx=12+(SA.r-SA.l)/2/Z0*0;cam.y=cam.ty=-72;cam.vx=cam.vy=cam.vz=0;cam.focus=null;cam.nextFocus=0;
}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(window.devicePixelRatio||1,DPRCAP);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);readSA();
  const oldZ0=Z0;Z0=Math.min(W/250,H/310);
  if(T.br.length){const k=Z0/oldZ0;cam.z*=k;cam.tz*=k;if(cam.tz>Z0)cam.tz=Z0;reframe(true,1.4);if(ST.phase==='seed'&&ST.strokes<1){initCam();}}
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ======================= main loop ======================= */
let FRN=0,last=0,running=true,perfAcc=0,perfN=0,slowT=0;
function update(dt){
  now+=dt;updWind();
  updStory(dt);
  updTree(dt);
  if(T.dirty)updStruct();
  updBuildings(dt);updBridges(dt);updLanterns(dt);updNuts(dt);
  for(const B of BLD)if(B.type==='nest')B.size=sq.size*1.9;
  for(const L of LAN)if(L.flashAt&&now>=L.flashAt){L.flashAt=0;L.flash=1;if(L.lit<1)L.litT=now;SND.bell(Math.floor(R()*8));}
  for(const a of ANIM){if(a.kind==='bird')updBird(a,dt);else{updSquirrel(a,dt);if(a.anchor&&!a.path){resolveTo(a.anchor,TMP);a.x=TMP.x;a.y=TMP.y;a.rot=0;}}}
  ROOMFX.curtain=Math.max(0,ROOMFX.curtain-dt);ROOMFX.table=Math.max(0,ROOMFX.table-dt*2);
  updParticles(dt);updGuide(dt);
  if(!INP.st&&(++FRN)%8===0)computeBBox();
  camUpdate(dt);musicTick();
}
function render(){
  drawSky();drawFar();setWorld();updVR();
  drawWorldClouds(false);
  drawGround();drawGarden();for(const h of SC.houses)drawNeighbor(h);
  drawHouse();drawSunbeam();drawRoots();
  drawCanopy();drawTree();drawAcorn();
  drawGarlands(1/60);
  for(const G2 of BRG)drawBridge(G2);
  drawLeaves();setWorld();
  drawNuts();
  for(const B of BLD){if(B.type==='nest'){nestDraw(B,false);if(sq.inNest)drawSquirrel(sq);nestDraw(B,true);}else drawBuilding(B);}
  drawLanterns();drawAnimals();drawGolden();
  drawBuds(G.target,G.pulse);
  drawWorldClouds(true);
  setScreen();
  if(SKY.night>0.01||SKY.dusk>0.01){ctx.globalCompositeOperation='multiply';
    const c=mixC(mixC([255,255,255],[255,214,190],SKY.dusk*(1-SKY.night)),[130,130,196],SKY.night*0.85);ctx.fillStyle=rgb(c);ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}
  setWorld();ctx.globalCompositeOperation='lighter';
  drawWaveGlow();drawLanternGlows();drawBuildingGlows();drawNeighborGlows();
  if(SKY.night>0.3&&inView(100,-360,200,-240))glow('warm',150,-298,90,SKY.night*0.6);
  if(ST.lightsOn||ST.phase==='lanternWait'){glow('gold',0,-28,60,0.4*SKY.night);}
  ctx.globalCompositeOperation='source-over';
  drawParticles();drawInk();drawHand();
  setScreen();
  if(SPR.paperPat){ctx.globalCompositeOperation='multiply';ctx.fillStyle=SPR.paperPat;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45,W/2,H/2,Math.max(W,H)*0.75);vg.addColorStop(0,'rgba(80,50,30,0)');vg.addColorStop(1,'rgba(80,50,30,0.22)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(ST.wipe){const t=ST.wipe.t;const a=t<1?easeInOut(t):1-easeInOut((t-1)/1.2);ctx.fillStyle='rgba(246,239,223,'+clamp(a,0,1).toFixed(3)+')';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';glow('gold',W/2,H/2,Math.max(W,H)*0.5*a,a*0.6);ctx.globalCompositeOperation='source-over';}
}
function frame(ts){
  if(!running)return;requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0)||dt>1)dt=1/60;dt=Math.min(dt,1/20);
  const t0=performance.now();
  try{update(dt);render();}catch(err){window.__dgErr=(window.__dgErr||[]);if(window.__dgErr.length<5)window.__dgErr.push(String(err&&err.stack||err));}
  const ft=performance.now()-t0;perfAcc+=ft;perfN++;
  if(perfN>=90){const avg=perfAcc/perfN;perfAcc=0;perfN=0;if(avg>20&&DPRCAP>1){slowT++;if(slowT>=2){DPRCAP=Math.max(1,DPRCAP-0.5);slowT=0;resize();}}else slowT=0;}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;endInput();try{if(AU.c)AU.c.suspend();}catch(e){}}
  else if(!running){running=true;last=performance.now();requestAnimationFrame(frame);try{if(AU.c)AU.c.resume();}catch(e){}}
});
function init(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(window.devicePixelRatio||1,DPRCAP);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);readSA();Z0=Math.min(W/250,H/310);
  buildStaticSprites();genCloudSprites();genScenery();resetWorld(0);
  last=performance.now();requestAnimationFrame(frame);
}
// read-only hooks for automated checks
window.__dg={get s(){return {phase:ST.phase,prog:ST.prog,strokes:ST.strokes,branches:T.br.length,leaves:T.leafCount,buildings:BLD.map(b=>b.type+':'+b.state),bridges:BRG.length,
  lanterns:LAN.length,lit:LAN.filter(l=>l.lit>0).length,animals:ANIM.map(a=>a.kind+':'+a.mode),sq:{mode:sq.mode,x:sq.x,y:sq.y,inNest:sq.inNest,hold:sq.hold},cam:{x:cam.x,y:cam.y,z:cam.z},size:T.size,
  sky:{d:SKY.dusk,n:SKY.night},parts:PS.length,nest:!!ST.nest,golden:!!ST.golden,cycle:ST.cycle,tips:T.tips.length};},
  tip(){const b=G.target||T.tips[0];tipPos(b,TMP);return {x:w2sx(TMP.x),y:w2sy(TMP.y)};},
  tips(){return T.tips.map(b=>{tipPos(b,TMP);return {x:w2sx(TMP.x),y:w2sy(TMP.y)};});},
  toScreen(x,y){return {x:w2sx(x),y:w2sy(y)};},
  ff(sec){const n=Math.round(sec*30);for(let i=0;i<n;i++)update(1/30);},
  dbg(){return BLD.map(b=>({t:b.type,x:b.x,y:b.y,s:b.size,rot:b.rot,deck:b.deck}));},
  goldenPos(){return ST.golden&&ST.golden.x!==undefined?{x:w2sx(ST.golden.x),y:w2sy(ST.golden.y)}:null;}};
init();
})();
