<script>
(()=>{
'use strict';
// ================= 基本 =================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angNorm=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
const lerpAng=(a,b,t)=>a+angNorm(b-a)*t;
const horiz=a=>Math.abs(angNorm(a))<Math.PI/2?0:Math.PI;
const rnd=(a,b)=>a+(b-a)*Math.random();
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function spring(o,k,t,K,D,dt){const vk=k+'_v';let v=o[vk]||0;v+=(t-o[k])*K*dt;v*=Math.exp(-D*dt);o[vk]=v;o[k]+=v*dt;}
function springA(o,k,t,K,D,dt){spring(o,k,o[k]+angNorm(t-o[k]),K,D,dt);}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l;t=clamp(t,0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t);}

let W=1,H=1,DPR=1,BGDPR=1,S=1,LL=180,UW=1,UH=1;
const SA={t:0,r:0,b:0,l:0};
const X=f=>SA.l+f*UW, Y=f=>SA.t+f*UH;
const LAND=()=>W>H*1.05;
let bgCache={};

// ================= 音 (Web Audio) =================
const AU={c:null,m:null,nb:null,last:{},loops:{}};
function aInit(){
  try{
    if(AU.c){if(AU.c.state!=='running')AU.c.resume().catch(()=>{});return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=AU.c=new AC();
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
    AU.m=c.createGain();AU.m.gain.value=.9;AU.m.connect(comp);comp.connect(c.destination);
    const n=(c.sampleRate*2)|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    AU.nb=b;
    AU.loops.rain=mkLoop('highpass',1700,.5);
    AU.loops.wind=mkLoop('lowpass',420,.9);
    AU.loops.water=mkLoop('bandpass',620,.7);
    const o=c.createBufferSource();o.buffer=c.createBuffer(1,1,22050);o.connect(c.destination);o.start(0);
    if(c.state!=='running')c.resume().catch(()=>{});
  }catch(e){}
}
function mkLoop(type,f,q){const c=AU.c,s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.m);s.start();return{g,fl,v:0};}
function loopVol(name,v){if(!AU.c)return;const l=AU.loops[name];if(!l||Math.abs(l.v-v)<.004)return;l.v=v;try{l.g.gain.setTargetAtTime(v,AU.c.currentTime,.25);}catch(e){}}
function okS(name,gap){const t=performance.now();if(AU.last[name]&&t-AU.last[name]<gap*1000)return false;AU.last[name]=t;return true;}
function live(){return AU.c&&AU.c.state==='running';}
function tone(f,dur,o={}){
  if(!live())return;
  const c=AU.c,t=c.currentTime+(o.d||0);
  const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+dur);
  const g=c.createGain();const v=o.v||.2,a=o.a||.006;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(g);g.connect(AU.m);os.start(t);os.stop(t+dur+.05);
}
function noise(dur,o={}){
  if(!live())return;
  const c=AU.c,t=c.currentTime+(o.d||0);
  const s=c.createBufferSource();s.buffer=AU.nb;
  const fl=c.createBiquadFilter();fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);fl.Q.value=o.q||1;
  if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const g=c.createGain();const v=o.v||.2,a=o.a||.005;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
}
const PENTA=[523,587,659,784,880,1047,1175,1319,1568];
const SFX={
  rustle(v=1){if(!okS('rus',.07))return;noise(.22,{ft:'bandpass',f:2400+Math.random()*1800,q:.9,v:.2*v,a:.02});noise(.15,{ft:'bandpass',f:4200+Math.random()*1500,q:1.3,v:.1*v,d:.06});},
  place(){if(!okS('plc',.1))return;tone(150,.32,{f2:78,v:.3,a:.012});noise(.26,{ft:'lowpass',f:650,v:.18,a:.01});},
  boing(p=1){if(!okS('boi',.05))return;const r=rnd(.94,1.06);tone(250*p*r,.24,{f2:430*p*r,v:.12});tone(125*p*r,.2,{type:'triangle',v:.07,f2:210*p*r});},
  step(){tone(rnd(650,900),.05,{f2:380,v:.06,type:'triangle'});noise(.03,{ft:'highpass',f:3000,v:.035});},
  tick(){if(!okS('tick',.028))return;noise(.035,{ft:'bandpass',f:rnd(4200,7000),q:4,v:rnd(.04,.08)});},
  plop(s=1){if(!okS('plop',.05))return;tone(rnd(800,1400),.1,{f2:rnd(260,340),v:.1*s});},
  splash(s=1){if(!okS('spl',.09))return;noise(.42*s+.1,{ft:'lowpass',f:2300,f2:450,v:.24*s,a:.01});tone(480,.13,{f2:170,v:.07*s});},
  pour(){if(!okS('pour',.35))return;noise(.85,{ft:'bandpass',f:1600,f2:520,q:.7,v:.34,a:.03});for(let i=0;i<5;i++)tone(rnd(700,1300),.09,{f2:300,v:.06,d:.1+i*.09});},
  swish(){if(!okS('sw',.22))return;noise(.48,{ft:'bandpass',f:950,f2:480,q:1.5,v:.12,a:.08});},
  flap(w){if(!okS('flap',.075))return;noise(.1,{ft:'bandpass',f:450+w*800,q:.8,v:.05+.11*Math.min(1,w),a:.005});},
  tock(type){if(!okS('tock'+type,.04))return;const f={straw:520,blue:720,nut:430,acorn:390}[type]||560;const r=rnd(.93,1.08);tone(f*r,.11,{v:.17});tone(f*2.1*r,.05,{v:.05});},
  thud(){if(!okS('thud',.06))return;tone(rnd(160,210),.12,{f2:90,v:.14});},
  plink(i){const f=PENTA[i%PENTA.length]*rnd(.995,1.005);tone(f,.5,{type:'triangle',v:.15});tone(f*2,.25,{v:.05,d:.01});},
  chew(kind){const sp={sq:.07,fawn:.17,turtle:.3,rab:.075,bird:.1}[kind]||.1;const base={sq:1900,fawn:900,turtle:560,rab:1500,bird:2600}[kind]||1200;const n=kind==='turtle'?3:5;for(let i=0;i<n;i++)noise(.045,{ft:'bandpass',f:base*rnd(.85,1.15),q:3,v:.09,d:.05+i*sp});tone(base*.45,.09,{v:.05,f2:base*.6});},
  bell(f=880,d=0){tone(f,1.3,{v:.11,d});tone(f*2.76,.6,{v:.035,d});tone(f*5.4,.3,{v:.018,d});},
  success(){[523,659,784,1047].forEach((f,i)=>{tone(f,.55,{type:'triangle',v:.15,d:i*.11});tone(f*2,.3,{v:.04,d:i*.11});});SFX.bell(1568,.46);},
  squeak(){if(!okS('sqk',.15))return;const r=rnd(.95,1.1);tone(1500*r,.09,{f2:2200*r,v:.07});tone(1700*r,.08,{f2:2500*r,v:.06,d:.11});},
  pop(){if(!okS('pop',.05))return;const r=rnd(.9,1.12);tone(480*r,.08,{f2:950*r,v:.12});},
  chirp(){if(!okS('chirp',.12))return;const r=rnd(.95,1.1);tone(2600*r,.07,{f2:3400*r,v:.055});tone(2900*r,.07,{f2:3800*r,v:.045,d:.09});},
  sparkle(){if(!okS('spk',.1))return;tone(rnd(1800,3000),.45,{v:.045});},
  xylo(f,d=0){tone(f,.55,{type:'triangle',v:.12,d});tone(f*4,.12,{v:.03,d});},
  snort(){if(!okS('snt',.2))return;noise(.16,{ft:'bandpass',f:700,q:1,v:.1});},
  shake(){for(let i=0;i<6;i++)noise(.08,{ft:'bandpass',f:rnd(2500,4000),q:1,v:.08,d:i*.07});},
  creak(){if(!okS('crk',.4))return;tone(rnd(200,260),.25,{type:'triangle',f2:rnd(150,180),v:.05});},
};

// ================= 描画ヘルパー =================
function ell(c,x,y,rx,ry,rot,fill){c.beginPath();c.ellipse(x,y,Math.max(.01,Math.abs(rx)),Math.max(.01,Math.abs(ry)),rot||0,0,TAU);if(fill){c.fillStyle=fill;c.fill();}}
function circ(c,x,y,r,fill){c.beginPath();c.arc(x,y,Math.max(.01,r),0,TAU);if(fill){c.fillStyle=fill;c.fill();}}
function blob(c,x,y,rx,ry,rot,base,hi,sh){
  rx=Math.max(.1,rx);ry=Math.max(.1,ry);
  const g=c.createRadialGradient(x-rx*.35,y-ry*.45,Math.min(rx,ry)*.08,x,y,Math.max(rx,ry)*1.12);
  g.addColorStop(0,hi);g.addColorStop(.55,base);g.addColorStop(1,sh);
  ell(c,x,y,rx,ry,rot,g);
}
function fur(c,x,y,rx,ry,n,col,lw,seed,ang){
  c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.beginPath();
  let s=seed*9973+7;
  for(let i=0;i<n;i++){
    s=(s*9301+49297)%233280;const r1=s/233280;s=(s*9301+49297)%233280;const r2=s/233280;
    const a=r1*TAU,rr=Math.sqrt(r2)*.82;const px=x+Math.cos(a)*rx*rr,py=y+Math.sin(a)*ry*rr;
    const an=(ang!==undefined?ang:-.7)+(r2-.5)*.6;
    c.moveTo(px,py);c.lineTo(px+Math.cos(an)*lw*2.4,py+Math.sin(an)*lw*2.4);
  }
  c.stroke();
}
// 厚塗りの一筆
function dab(c,x,y,a,len,w,h,s,l,al=1){
  const dx=Math.cos(a)*len*.5,dy=Math.sin(a)*len*.5,bx=-dy*.22,by=dx*.22;
  c.lineWidth=w;
  c.strokeStyle=`hsla(${h},${s}%,${Math.max(0,l-13)}%,${.3*al})`;
  c.beginPath();c.moveTo(x-dx+w*.22,y-dy+w*.3);c.quadraticCurveTo(x+bx+w*.22,y+by+w*.3,x+dx+w*.22,y+dy+w*.3);c.stroke();
  c.strokeStyle=`hsla(${h},${s}%,${l}%,${al})`;
  c.beginPath();c.moveTo(x-dx,y-dy);c.quadraticCurveTo(x+bx,y+by,x+dx,y+dy);c.stroke();
  c.lineWidth=w*.32;
  c.strokeStyle=`hsla(${h},${Math.max(0,s-12)}%,${Math.min(97,l+18)}%,${.5*al})`;
  c.beginPath();c.moveTo(x-dx-w*.18,y-dy-w*.22);c.quadraticCurveTo(x+bx*.7-w*.18,y+by*.7-w*.22,x+dx*.55-w*.18,y+dy*.55-w*.22);c.stroke();
}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
function getBg(key,painter){
  if(!bgCache[key]){
    const cvs=mkCanvas(Math.ceil(W*BGDPR),Math.ceil(H*BGDPR));const c=cvs.getContext('2d');c.scale(BGDPR,BGDPR);c.lineCap='round';c.lineJoin='round';
    painter(c);bgCache[key]=cvs;
  }
  return bgCache[key];
}
function sprite(key,w,h,painter){
  if(!bgCache[key]){const d=Math.min(DPR,1.5);const cvs=mkCanvas(Math.ceil(w*d),Math.ceil(h*d));const c=cvs.getContext('2d');c.scale(d,d);c.lineCap='round';painter(c);bgCache[key]={cv:cvs,w,h};}
  return bgCache[key];
}
// 共通背景パーツ
function trunk(c,x,yb,w,R,col,y0){
  col=col||[25,35,22];y0=y0===undefined?-10:y0;
  c.fillStyle=`hsl(${col[0]},${col[1]}%,${col[2]}%)`;
  c.beginPath();c.moveTo(x-w*.5,y0);c.lineTo(x+w*.45,y0);c.lineTo(x+w*.62,yb);c.quadraticCurveTo(x,yb+w*.2,x-w*.7,yb);c.closePath();c.fill();
  for(let i=0;i<Math.max(10,(yb-y0)/(9*S));i++){
    const y=y0+R()*(yb-y0),xx=x+(R()-.5)*w*.9;
    dab(c,xx,y,Math.PI/2+(R()-.5)*.25,(16+R()*24)*S,(2.5+R()*3.5)*S,col[0]+R()*10,col[1]+10,col[2]+(xx<x?14:-2)+R()*12);
  }
}
function rock(c,x,y,rx,ry,R,hue){
  hue=hue||250;
  blob(c,x,y,rx,ry,0,`hsl(${hue},12%,42%)`,`hsl(${hue-20},14%,66%)`,`hsl(${hue},16%,24%)`);
  for(let i=0;i<Math.round(rx*ry/(30*S*S))+6;i++){const a=R()*TAU,r=Math.sqrt(R())*.8;const px=x+Math.cos(a)*rx*r,py=y+Math.sin(a)*ry*r;dab(c,px,py,-.4+R()*.8,(6+R()*10)*S,(2+R()*3)*S,hue-20+R()*40,12+R()*10,40+R()*28-(py>y?10:0));}
  for(let i=0;i<10+rx/(4*S);i++){const px=x+(R()-.5)*rx*1.5,py=y-ry*.6+R()*ry*.4;dab(c,px,py,-.3+R()*.6,(5+R()*8)*S,(2+R()*2.5)*S,85+R()*30,50,35+R()*25);}
}
function fern(c,x,y,len,ang,R,hue){
  hue=hue||110;
  for(let f=0;f<5;f++){
    const a=ang+(f-2)*.32+(R()-.5)*.2,l=len*(.7+R()*.4);
    const ex=x+Math.cos(a)*l,ey=y+Math.sin(a)*l,mx=x+Math.cos(a)*l*.5+Math.cos(a-1.4)*l*.12,my=y+Math.sin(a)*l*.5+Math.sin(a-1.4)*l*.12;
    c.strokeStyle=`hsl(${hue},45%,20%)`;c.lineWidth=3*S;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(mx,my,ex,ey);c.stroke();
    for(let i=1;i<12;i++){const t=i/12;const px=(1-t)*(1-t)*x+2*(1-t)*t*mx+t*t*ex,py=(1-t)*(1-t)*y+2*(1-t)*t*my+t*t*ey;const ll=(1-t*.7)*l*.22;
      dab(c,px+Math.cos(a-1.2)*ll*.5,py+Math.sin(a-1.2)*ll*.5,a-1.2,ll,4*S*(1-t*.5),hue+R()*20,50,22+t*25+R()*10);
      dab(c,px+Math.cos(a+1.2)*ll*.5,py+Math.sin(a+1.2)*ll*.5,a+1.2,ll,4*S*(1-t*.5),hue+R()*20,50,20+t*22+R()*10);}
  }
}
function flowers(c,n,R,area){
  const hues=[[350,80,62],[48,95,60],[280,55,62],[20,90,60],[200,70,72]];
  for(let i=0;i<n;i++){const p=area();if(!p)continue;const h=hues[(R()*hues.length)|0];const r=(2.5+R()*3)*S;
    for(let k=0;k<5;k++){const a=k/5*TAU+R();circ(c,p[0]+Math.cos(a)*r,p[1]+Math.sin(a)*r*.7,r*.75,`hsl(${h[0]},${h[1]}%,${h[2]}%)`);}
    circ(c,p[0],p[1],r*.5,'#fff3a0');circ(c,p[0]-r*.3,p[1]-r*.4,r*.3,'rgba(255,255,255,.7)');}
}
function foliage(c,n,R,x0,x1,y0,y1,hue,lt){
  const nb=Math.max(6,n/10|0);
  for(let i=0;i<nb;i++){const x=x0+R()*(x1-x0),y=y0+R()*(y1-y0),r=(30+R()*50)*S;const k=(y-y0)/Math.max(1,(y1-y0));const l=lt[0]+(lt[1]-lt[0])*k;
    const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${hue+R()*40},${40+R()*20}%,${l}%,.55)`);g.addColorStop(1,`hsla(${hue},40%,${l}%,0)`);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
  n=Math.round(n*1.7);
  for(let i=0;i<n;i++){const x=x0+R()*(x1-x0),y=y0+R()*(y1-y0);const k=(y-y0)/Math.max(1,(y1-y0));
    dab(c,x,y,(R()-.5)*1.6,(7+R()*13)*S,(3.5+R()*5)*S,hue+R()*45,35+R()*25,lt[0]+(lt[1]-lt[0])*k+R()*14-7,.85);}
}
function sunGlow(c,x,y,r,a){c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,236,170,${a})`);g.addColorStop(1,'rgba(255,236,170,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore();}
function shafts(c,R,n,a){c.save();c.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const x=R()*W,w=(30+R()*60)*S;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgba(255,240,180,${a})`);g.addColorStop(1,'rgba(255,240,180,0)');c.fillStyle=g;c.beginPath();c.moveTo(x,0);c.lineTo(x+w,0);c.lineTo(x+w-H*.35,H);c.lineTo(x-H*.35-w*.5,H);c.closePath();c.fill();}c.restore();}
function grassField(c,R,n,y0,y1,hue,l0,l1,skip){
  for(let i=0;i<n;i++){const x=R()*W,y=y0+R()*(y1-y0);if(skip&&skip(x,y))continue;const k=(y-y0)/Math.max(1,y1-y0);
    dab(c,x,y,-Math.PI/2+(R()-.5)*.9,(8+R()*14)*S*(.7+k*.6),(2.5+R()*3)*S*(.7+k*.6),hue+R()*35,40+R()*20,l0+(l1-l0)*k+R()*14-7);}
}
function cloud(c,x,y,r,col,al){c.save();c.globalAlpha=al;for(let i=0;i<7;i++){const a=i/7*Math.PI;const px=x+Math.cos(a)*r*1.3,py=y-Math.sin(a)*r*.45;blob(c,px,py,r*.6,r*.42,0,col[0],col[1],col[2]);}blob(c,x,y+r*.1,r*1.5,r*.4,0,col[0],col[1],col[2]);c.restore();}

// ================= 食べ物 =================
function drawFood(c,type,x,y,s,rot,bite){
  const k=S*s;c.save();c.translate(x,y);if(rot)c.rotate(rot);c.scale(k,k);
  if(bite){const q=Math.max(.05,1-bite*.85);c.scale(q,q);}
  switch(type){
    case 'straw':{
      const g=c.createRadialGradient(-3,-3,1,0,0,13);g.addColorStop(0,'#ff7a6a');g.addColorStop(.6,'#e0262f');g.addColorStop(1,'#8f101c');
      c.fillStyle=g;c.beginPath();c.moveTo(0,11);c.bezierCurveTo(-14,2,-12,-10,0,-8);c.bezierCurveTo(12,-10,14,2,0,11);c.fill();

function sparkBurst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(sp||90)*S*rnd(.5,1.2);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30*S,g:60*S,life:rnd(.5,1),s:rnd(2,4)*S,type:'spark',col:col||'255,230,140'});}}
function hearts(x,y,n){for(let i=0;i<n;i++)part({x:x+rnd(-14,14)*S,y,vx:rnd(-20,20)*S,vy:rnd(-70,-40)*S,life:rnd(1,1.6),s:rnd(5,8)*S,type:'heart'});}

function updParts(dt){
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life-=dt;if(p.life<=0){PARTS.splice(i,1);continue;}p.vy+=p.g*dt;if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy*=f;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}

}

const SHAPES={
  main:u=>{u=clamp(u,0,1);return .215*Math.pow(Math.sin(Math.PI*Math.pow(u,.7)),.85)*(1-.1*u)*(1+.035*Math.sin(u*34+1.3));},

class Leaf{
  constructor(o){
    Object.assign(this,{x:0,y:0,ang:0,lk:1,sc:1,squash:1,sag:0,curl:0,lift:0,lag:0,flut:0,waveA:0,waveB:0,wavePh:0,glow:0,glowT:0,water:0,held:false,travel:false,
      vx:0,vy:0,ax:0,ay:0,gox:0,goy:0,holdAng:0,mag:null,pal:PAL.main,shape:'main',seed:1,nStrokes:150,sheen:.3,stemK:1},o);
    this.hwf=SHAPES[this.shape];
    this.T={x:this.x,y:this.y,ang:this.ang,squash:this.squash,sag:0,curl:0,lift:0,sc:1,pk:70,pd:13};
    const R=mulberry(this.seed);this.st=[];
    const nc=this.pal.strokes.length;
    for(let i=0;i<this.nStrokes;i++){
      const u=.03+R()*.93,v=(R()*2-1)*.95,sg=v<0?-1:1,along=R()<.3,len=.5+R()*.7;
      let ci=(R()*nc)|0;if(R()<.35)ci=Math.min(nc-1,ci+1);

    }

  }
  len(){return LL*this.lk*this.sc;}
  place(x,y,ang,o){this.x=this.T.x=x;this.y=this.T.y=y;this.ang=this.T.ang=ang;for(const k of ['x','y','ang','squash','sag','curl','lift','sc','lag'])this[k+'_v']=0;if(o){for(const k in o){this[k]=o[k];this.T[k]=o[k];}}this.vx=this.vy=0;}
  pt(u,v){
    const L=this.len(),c=Math.cos(this.ang),s=Math.sin(this.ang);
    const hw=this.hwf(u)*L;const al=(u-.5)*L;

    return [this.x+c*al-s*lat,this.y+s*al+c*lat+wy];
  }
  ends(){const a=this.pt(0,0),b=this.pt(1,0);return a[0]<b[0]?{l:a,r:b,lu:0,ru:1}:{l:b,r:a,lu:1,ru:0};}
  hit(x,y,pad){
    const L=this.len();let prev=this.pt(0,0);
    for(let i=1;i<=10;i++){const u=i/10;const p=this.pt(u,0);const d=segDist(x,y,prev[0],prev[1],p[0],p[1]);const hw=this.hwf(u-.05)*L*Math.max(.35,Math.abs(this.squash));if(d-hw<pad)return true;prev=p;}

  update(dt){
    const T=this.T;

    const pvx=this.vx,pvy=this.vy;

      if(this.mag&&this.mag.m>0){tx=lerp(tx,this.mag.x,this.mag.m);ty=lerp(ty,this.mag.y,this.mag.m);}
      tx=clamp(tx,SA.l+8*S,W-SA.r-8*S);ty=clamp(ty,SA.t+8*S,H-SA.b-8*S);
      const k=1-Math.exp(-dt*24);const ox=this.x,oy=this.y;

      this.vx=lerp(this.vx,(this.x-ox)/dt,.35);this.vy=lerp(this.vy,(this.y-oy)/dt,.35);
    }else{
      spring(this,'x',T.x,T.pk,T.pd,dt);spring(this,'y',T.y,T.pk,T.pd,dt);
      this.vx=this.x_v;this.vy=this.y_v;
    }
    this.ax=lerp(this.ax,(this.vx-pvx)/dt,.2);this.ay=lerp(this.ay,(this.vy-pvy)/dt,.2);
    const tilt=this.held?clamp(this.vx*.0007/S,-.4,.4)*(T.tiltK===undefined?1:T.tiltK):0;
    springA(this,'ang',T.ang+tilt,T.ak||55,T.ad||9,dt);
    spring(this,'squash',T.squash,60,11,dt);

    spring(this,'curl',T.curl,60,10,dt);
    spring(this,'lift',T.lift,90,13,dt);
    spring(this,'sc',T.sc,70,9,dt);
    const c=Math.cos(this.ang),s=Math.sin(this.ang);
    const vperp=-this.vx*s+this.vy*c;
    spring(this,'lag',clamp(-vperp*.0005/S,-.5,.5),120,8,dt);
    this.flut=Math.max(this.flut*Math.exp(-dt*2.5),Math.min(1,Math.hypot(this.vx,this.vy)*.0012/S));

  shadow(c,ox,oy,a){

    for(const d of g.decor){const ex=d.x+Math.sin(d.a)*d.len,ey=d.y+Math.cos(d.a)*d.len;c.strokeStyle='rgba(90,60,30,.8)';c.lineWidth=1.4*S;c.beginPath();c.moveTo(d.x,d.y);c.lineTo(ex,ey);c.stroke();
      if(this.light>.05){c.save();c.globalCompositeOperation='lighter';const gg=c.createRadialGradient(ex,ey,0,ex,ey,26*S);gg.addColorStop(0,`rgba(255,220,140,${.5*this.light})`);gg.addColorStop(1,'rgba(255,220,140,0)');c.fillStyle=gg;c.fillRect(ex-26*S,ey-26*S,52*S,52*S);c.restore();}
      drawFood(c,d.kind,ex,ey+6*S,.9,-d.a);}
    if(!old){CAST.b1.draw(c);CAST.b2.draw(c);}
    // 滝
    c.strokeStyle='rgba(215,240,255,.75)';c.lineCap='round';for(const f of this.falls){c.lineWidth=(f.thin?1.6:3)*S;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x-f.vx*.02,f.y-f.vy*.025);c.stroke();}
    if(this.rainOn&&this.fl){for(const p of [this.fl,this.fr]){const gg=c.createLinearGradient(0,p[1],0,g.gy);gg.addColorStop(0,'rgba(210,240,255,.35)');gg.addColorStop(1,'rgba(210,240,255,.05)');c.fillStyle=gg;c.fillRect(p[0]-4*S+(p===this.fl?-6*S:2*S),p[1],8*S,g.gy-p[1]);}}
    drawRain(c);
    // ほしいものの吹き出し
    if(this.want&&!old){const a=this.want.a,hp=a.headPos();const bx=hp[0]+a.face*-6*S,by=hp[1]-(a.kind==='fawn'?52:42)*S+Math.sin(t*3)*2*S;
      circ(c,hp[0]+a.face*2*S,hp[1]-16*S,3*S,'rgba(255,255,255,.85)');circ(c,hp[0]+a.face*-2*S,hp[1]-24*S,4.5*S,'rgba(255,255,255,.9)');
      blob(c,bx,by,22*S,18*S,0,'#ffffff','#ffffff','#e8e0d0');drawFood(c,this.want.type,bx,by,.95);}
    // 持っている食べ物
    if(this.drag){const it=this.drag;c.fillStyle='rgba(20,20,10,.2)';ell(c,it.x+6*S,it.y+20*S,12*S,4*S,0);c.fill();drawFood(c,it.type,it.x,it.y,it.s*1.15,Math.sin(t*8)*.1);}
    if(this.party&&this.want){const it=this.findItem(this.want.type);if(it&&!this.drag)drawGoal(c,it.x,it.y,34*S);}
    if(this.light>.05){c.save();c.globalCompositeOperation='lighter';c.fillStyle=`rgba(255,200,120,${.06*this.light})`;c.fillRect(0,0,W,H);c.restore();}
  },
  drawTop(c){for(const h of this.helpers)if(h.lf.held)h.lf.draw(c,{shadow:true});}
};
function paintS6(c,g){
  const R=mulberry(606);const A=W*H/(400*700*S*S);
  let gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#c8d4d8');gr.addColorStop(.3,'#f0e2b0');gr.addColorStop(.55,'#8ab868');gr.addColorStop(1,'#4a7a34');c.fillStyle=gr;c.fillRect(0,0,W,H);
  sunGlow(c,g.cx,Y(.1),Math.max(W,H)*.5,.4);
  foliage(c,Math.round(380*A),R,-20,W+20,Y(.16),g.gy-50*S,105,[48,28]);for(let i=0;i<5;i++)trunk(c,X(.15+i*.18)+(R()-.5)*30*S,g.gy-30*S,(8+R()*8)*S,R,[150,12,38+R()*8],Y(.25));
  c.fillStyle='#6a9a44';c.fillRect(0,g.gy-40*S,W,H);
  grassField(c,R,Math.round(1000*A),g.gy-44*S,H,72,40,44);
  flowers(c,Math.round(60*A),R,()=>[R()*W,g.gy-30*S+R()*(H-g.gy+30*S)]);
  // 大木と枝
  for(const sd of [-1,1]){
    const tx=sd<0?X(.02):X(.98);trunk(c,tx,g.gy,46*S,R,[28,38,24]);
    const bx=g.cx+sd*.44*LL,by=g.ry+12*S;
    c.strokeStyle='#4a2e16';c.lineWidth=13*S;c.beginPath();c.moveTo(tx,g.ry+50*S);c.quadraticCurveTo((tx+bx)/2,g.ry+20*S,bx,by);c.stroke();
    c.strokeStyle='#4a2e16';c.lineWidth=9*S;c.beginPath();c.moveTo(tx,g.ry-10*S);c.quadraticCurveTo((tx+g.cx+sd*1.1*LL)/2,g.ry,g.cx+sd*1.05*LL,g.ry+26*S);c.stroke();
    c.strokeStyle='#8a6038';c.lineWidth=3*S;c.beginPath();c.moveTo(tx,g.ry+46*S);c.quadraticCurveTo((tx+bx)/2,g.ry+16*S,bx,by-3*S);c.stroke();
    foliage(c,Math.round(60*Math.max(1,S)),R,tx-60*S,tx+60*S,g.ry-110*S,g.ry-10*S,95,[24,40]);
  }
  for(let i=0;i<5;i++){const x=R()*W,y=g.gy+R()*(H-g.gy);blob(c,x,y,(8+R()*5)*S,(5+R()*3)*S,0,'#c8402a','#ff8a6a','#7a1a10');circ(c,x-3*S,y-2*S,1.5*S,'#fff');}
}

// ================= 場面の流れ =================
const SCENES=[SC1,SC2,SC3,SC4,SC5,SC6];
const PAINT={s1:paintS1,s2:paintS2,s3:paintS3,s4:paintS4,s5:paintS5,s6:paintS6};
function bgOf(sc){return getBg(sc.bgKey,cc=>PAINT[sc.bgKey](cc,sc.g));}
function goNext(type){
  if(G.trans)return;
  const from=G.si;const to=(from+1)%SCENES.length;
  if(SCENES[from].leave)SCENES[from].leave();
  if(G.heldLeaf){releaseLeaf(G.heldLeaf);}
  if(SCENES[from].drag)SCENES[from].drag=null;
  type=type||(to===0?'fade':'pan');
  const lf=LEAF;
  G.trans={type,from,to,t:0,dur:type==='fade'?3:2.1,swapped:false,x0:lf.x,y0:lf.y,a0:lf.ang,sq0:lf.squash,sc0:lf.sc};
  if(type==='pan'){
    const ns=SCENES[to];G.sid++;RAIN.length=0;RIP.length=0;PARTS.length=0;
    ns.enter();bgOf(ns);
    const st=ns.leafStart();G.trans.end=st;lf.travel=true;lf.water=0;
  }
  G.idle=0;
}
function startScene(i){G.si=i;G.sid++;RAIN.length=0;RIP.length=0;PARTS.length=0;const sc=SCENES[i];sc.enter();const st=sc.leafStart();LEAF.travel=false;LEAF.held=false;LEAF.place(st.x,st.y,st.ang,{squash:st.squash,lift:0,sag:0,curl:.05,sc:1});LEAF.water=0;LEAF.glow=0;}
function updTrans(dt){
  const tr=G.trans;tr.t+=dt;const k=clamp(tr.t/tr.dur,0,1);
  if(tr.type==='pan'){
    const e=ease(k),lf=LEAF,en=tr.end;
    lf.x=lerp(tr.x0,en.x,e);lf.y=lerp(tr.y0,en.y,e)-Math.sin(Math.PI*e)*H*.12;lf.ang=lerpAng(tr.a0,en.ang,e)+Math.sin(Math.PI*e)*.5;
    lf.squash=lerp(tr.sq0,en.squash,e);lf.sc=lerp(tr.sc0,1,e);lf.flut=.6;lf.lift=Math.sin(Math.PI*e);lf.sag=0;lf.curl=lerp(lf.curl,.05,e);lf.waveA=.03*Math.sin(Math.PI*e);lf.wavePh+=dt*6;
    SCENES[tr.to].update(dt);
    if(k>=1){G.si=tr.to;G.trans=null;lf.travel=false;lf.place(en.x,en.y,en.ang,{squash:en.squash,lift:0,sag:0,curl:.05,sc:1});}
  }else{
    if(!tr.swapped){SCENES[tr.from].update(dt);if(k>=.5){tr.swapped=true;G.cycle++;startScene(tr.to);}}
    else SCENES[tr.to].update(dt);
    if(k>=1){G.trans=null;}
  }
}

// ================= ヒント（ホタル） =================
const HINT={ph:'off',t:0,from:null,to:null,kind:''};
function updHint(dt){
  if(G.trans||P.down||G.idle<4){HINT.ph='off';HINT.t=0;return;}
  HINT.t+=dt;
  if(HINT.ph==='off'){const h=SCENES[G.si].hint&&SCENES[G.si].hint();if(h){HINT.ph='in';HINT.t=0;HINT.from=h.from;HINT.to=h.to;HINT.kind=h.kind||'drag';}return;}
  const d={in:.5,press:.55,move:1.4,out:.6,wait:2.6}[HINT.ph];
  if(HINT.t>=d){HINT.t=0;HINT.ph={in:'press',press:'move',move:'out',out:'wait',wait:'off'}[HINT.ph];
    if(HINT.ph==='press'){const tg=SCENES[G.si].target&&SCENES[G.si].target();if(tg&&tg.flut!==undefined){tg.flut=Math.max(tg.flut,.5);}SFX.sparkle();}}
}
function hintPos(){
  const f=HINT.from,to=HINT.to;if(!f||!to)return null;const ph=HINT.ph,k=HINT.t;
  if(ph==='in'||ph==='press')return[f[0],f[1],ph==='in'?k/.5:1];
  if(ph==='move'){const e=ease(clamp(k/1.4,0,1));if(HINT.kind==='shake'){const s=Math.sin(e*Math.PI*4);return[lerp(f[0],to[0],(s+1)/2),lerp(f[1],to[1],(s+1)/2),1];}
    const mx=(f[0]+to[0])/2,my=Math.min(f[1],to[1])-40*S;return[(1-e)*(1-e)*f[0]+2*(1-e)*e*mx+e*e*to[0],(1-e)*(1-e)*f[1]+2*(1-e)*e*my+e*e*to[1],1];}
  if(ph==='out'){const p=HINT.kind==='shake'?f:to;return[p[0],p[1],1-k/.6];}
  return null;
}
function drawHint(c){
  const p=hintPos();if(!p)return;const [x,y,a]=p;const t=G.t;
  c.save();c.globalCompositeOperation='lighter';
  const r=(18+(HINT.ph==='press'?Math.sin(HINT.t/.55*Math.PI)*8:0))*S;
  const g=c.createRadialGradient(x,y,0,x,y,r*2.2);g.addColorStop(0,`rgba(255,250,200,${.95*a})`);g.addColorStop(.25,`rgba(255,230,120,${.6*a})`);g.addColorStop(1,'rgba(255,220,100,0)');
  c.fillStyle=g;c.fillRect(x-r*2.2,y-r*2.2,r*4.4,r*4.4);
  if(HINT.ph==='press'){c.strokeStyle=`rgba(255,240,170,${.7*(1-HINT.t/.55)})`;c.lineWidth=3*S;circ(c,x,y,r*(1+HINT.t*2));c.stroke();}
  // 小さな羽
  c.globalCompositeOperation='source-over';c.globalAlpha=a*.7;const wf=Math.sin(t*30)*.5;
  ell(c,x-5*S,y-6*S,6*S,3*S,-.6+wf,'rgba(230,240,255,.8)');ell(c,x+5*S,y-6*S,6*S,3*S,.6-wf,'rgba(230,240,255,.8)');
  circ(c,x,y,4*S,'#fff6c0');
  c.restore();
  if(HINT.ph==='move'&&Math.random()<.5)part({x,y,vx:rnd(-10,10)*S,vy:rnd(-10,10)*S,life:.6,s:2.4*S,type:'spark',col:'255,240,170'});
}

// ================= 入力 =================
function toLocal(e){return[e.clientX,e.clientY];}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();aInit();
  if(P.id!==null)return;
  P.id=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x,y]=toLocal(e);P.x=P.sx=P.lx=x;P.y=P.sy=P.ly=y;P.down=true;P.moved=0;P.downT=G.t;
  G.idle=0;G.touched=true;HINT.ph='off';
  if(G.trans)return;
  try{SCENES[G.si].down(x,y);}catch(err){console.warn(err);}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==P.id)return;e.preventDefault();
  const [x,y]=toLocal(e);P.moved+=dist(x,y,P.x,P.y);P.x=x;P.y=y;G.idle=0;
  if(G.trans)return;
  try{SCENES[G.si].move(x,y);}catch(err){console.warn(err);}
},{passive:false});
function endPointer(e){
  if(e.pointerId!==P.id)return;
  const [x,y]=toLocal(e);if(e.type!=='lostpointercapture'){P.x=x;P.y=y;}
  P.id=null;P.down=false;
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  aInit();
  if(G.trans)return;
  try{SCENES[G.si].up(P.x,P.y);}catch(err){console.warn(err);}
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('lostpointercapture',endPointer);
window.addEventListener('blur',()=>{if(P.id!==null){endPointer({pointerId:P.id,clientX:P.x,clientY:P.y,type:'lostpointercapture'});}});
['contextmenu','dblclick','gesturestart','gesturechange','gestureend','selectstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

// ================= ループ =================
function update(dt){
  G.t+=dt;G.idle+=dt;
  for(let i=G.timers.length-1;i>=0;i--){const tm=G.timers[i];if(tm.sid!==G.sid){G.timers.splice(i,1);continue;}tm.t-=dt;if(tm.t<=0){G.timers.splice(i,1);try{tm.fn();}catch(err){console.warn(err);}}}
  if(G.trans)updTrans(dt);
  else SCENES[G.si].update(dt);
  // 光らせる対象は常に一つ
  const sc=SCENES[G.si];
  const tg=(!G.trans&&!P.down&&sc.target)?sc.target():null;
  LEAF.glowT=tg===LEAF?1:0;
  if(sc.helpers)for(const h of sc.helpers)h.lf.glowT=tg===h.lf?1:0;
  LEAF.update(dt);
  updParts(dt);updHint(dt);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const tr=G.trans;
  if(tr&&tr.type==='pan'){
    const e=ease(clamp(tr.t/tr.dur,0,1));
    ctx.save();ctx.translate(-e*W,0);SCENES[tr.from].draw(ctx,true);ctx.restore();
    ctx.save();ctx.translate((1-e)*W,0);SCENES[tr.to].draw(ctx,false);ctx.restore();
  }else{
    SCENES[G.si].draw(ctx,false);
  }
  const sc=SCENES[G.si];
  if(!tr||tr.type!=='pan'){const gl=sc.goal&&sc.goal();if(gl)drawGoal(ctx,gl.x,gl.y,gl.r);}
  if(LEAF.held)LEAF.draw(ctx,{shadow:true});
  if(LEAF.travel)LEAF.draw(ctx,{shadow:false});
  if(sc.drawTop&&(!tr||tr.type!=='pan'))sc.drawTop(ctx);
  drawParts(ctx);
  if(!tr)drawHint(ctx);
  if(tr&&tr.type==='fade'){const k=tr.t/tr.dur;const a=k<.5?k*2:2-k*2;ctx.fillStyle=`rgba(20,24,60,${a*.92})`;ctx.fillRect(0,0,W,H);
    if(a>.3){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<30;i++){const x=((i*137.5)%1)*W+((i*71)%W),y=((i*53)%100)/100*H*.6;circ(ctx,x%W,y,1.5*S,`rgba(255,250,220,${(a-.3)*Math.abs(Math.sin(G.t*2+i))})`);}ctx.restore();}}
  // 画面の縁を少し暗く（油絵の額縁感）
  const vg=sprite('vig',W,H,c=>{const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(20,15,5,.32)');c.fillStyle=g;c.fillRect(0,0,W,H);});
  ctx.drawImage(vg.cv,0,0,W,H);
}
let last=performance.now(),running=true;
function frame(now){
  if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=1/60;if(dt>1/20)dt=1/20;
  try{update(dt);render();}catch(err){console.warn(err);}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;try{AU.c&&AU.c.suspend();}catch(e){}}
  else if(!running){running=true;last=performance.now();try{AU.c&&AU.c.state!=='running'&&G.touched&&AU.c.resume();}catch(e){}requestAnimationFrame(frame);}
});
function readSA(){const e=document.getElementById('sa');const cs=getComputedStyle(e);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);BGDPR=Math.min(DPR,1.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  readSA();UW=W-SA.l-SA.r;UH=H-SA.t-SA.b;
  S=Math.min(UW/400,UH/660);LL=185*S;
  bgCache={};
}
let rzT=null;
function onResize(){
  const oW=W,oH=H;resize();
  if(oW===W&&oH===H)return;
  for(const sc of SCENES){if(sc.g&&sc.relayout&&(sc===SCENES[G.si]))sc.relayout();else if(sc.g)sc.layout();}
  if(G.trans&&G.trans.type==='pan'){const ns=SCENES[G.trans.to];G.trans.end=ns.leafStart();}
}
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,60);});
window.addEventListener('orientationchange',()=>{setTimeout(onResize,250);});
resize();
startScene(0);
requestAnimationFrame(frame);
// 背景を少しずつ先に描いておく
let pre=1;function prewarm(){if(pre>=SCENES.length)return;if(P.down||G.trans||G.t<1.5){setTimeout(prewarm,600);return;}const sc=SCENES[pre];if(!sc.g)sc.layout();bgOf(sc);pre++;setTimeout(prewarm,700);}
setTimeout(prewarm,1500);
// テスト用（画面には何も出ない）
window.__leafGame={G,LEAF,SCENES,CAST,P,AU,HINT,goNext,startScene,get W(){return W;},get H(){return H;},get S(){return S;},get LL(){return LL;}};
})();
</script>
