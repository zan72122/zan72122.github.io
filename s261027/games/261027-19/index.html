<script>
(()=>{
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeOutElastic=t=>{t=clamp(t,0,1);if(t===0||t===1)return t;return Math.pow(2,-9*t)*Math.sin((t*10-.75)*TAU/3)+1;};
const fin=(v,d=0)=>Number.isFinite(v)?v:d;
const hyp=Math.hypot;
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};

/* ---------- color ---------- */
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixc(h1,h2,t){const a=hexRgb(h1),b=hexRgb(h2);return'#'+[0,1,2].map(i=>Math.round(lerp(a[i],b[i],t)).toString(16).padStart(2,'0')).join('');}
function rgba(h,a){const c=hexRgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function tri(h,l=.55,d=.42){return{l:mixc(h,'#fffdf6',l),b:h,d:mixc(h,'#1b2758',d)};}
const GOLD='#d4a43a',GOLDL='#fff0b4',GOLDD='#8f6418',COB='#23479a',COBD='#16306c',CREAM='#f8eed6',INK='rgba(24,40,100,.55)';
const C={
  body:{l:'#fffaf0',b:'#f2d8b8',d:'#b27e55'},
  fur:{l:'#d29560',b:'#8c522b',d:'#4a2712'},
  cream:{l:'#fffaf0',b:'#efd6b2',d:'#b4875e'},
  gold:{l:'#fff3c0',b:'#d8a83c',d:'#7d5512'},
  cob:{l:'#7fa3e6',b:'#2a4fa4',d:'#122a63'},
  white:{l:'#ffffff',b:'#f3eee6',d:'#a9a5c4'},
  pink:{l:'#ffe1e6',b:'#f3a6b4',d:'#b25a72'},
  amber:{l:'#ffd59a',b:'#d9822f',d:'#6e3510'},
  tan:{l:'#fbe2bb',b:'#cf9556',d:'#764320'},
  grey:{l:'#ffffff',b:'#e5ddd2',d:'#7f7ea0'},
  nose:{l:'#8c84b8',b:'#2c2747',d:'#0d0b1c'}
};
const BAL=['#df463f','#27b0aa','#f2cf43','#a487d6','#f2876a','#f4e7cc'].map(h=>tri(h,.6,.38));
const RIBC=['#e86f8c','#2fa7b5','#efc23f','#9b7fd4'];
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093];

/* ---------- canvas/layout ---------- */
let W=1,H=1,DPR=1,S=1,OX=0,OY=0,VL=-360,VR=360,VT=-500,VB=500,VW=720,VH=1000,P=310,Q=0;
const sa=document.createElement('div');
sa.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(sa);
function insets(){const s=getComputedStyle(sa);return{t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};}
const L={};
const HR=100, SB=78, SL=78, NSP=13, SA0=-70*PI/180, SA1=-200*PI/180;
const FLOOR=268;
const spikeAng=i=>SA0+(SA1-SA0)*i/(NSP-1);
const domeY=x=>-428+98*Math.pow(x/P,2);

function layout(){
  L.hog={x:-20,y:150};
  L.tie={x:P-78,y:172};
  L.shelf={x:-P+62,y:-40};
  L.basket={x:-165-60*Q,y:430};
  L.capSlots=[{x:-58,y:-58},{x:0,y:-78},{x:58,y:-58}];
  L.table={x:205+110*Q,y:398};
  L.homes={rabbit:{x:-262-120*Q,y:332},squirrel:{x:-8-55*Q,y:478},kitten:{x:92+10*Q,y:470},fawn:{x:300+160*Q,y:300}};
  L.hugs={rabbit:{x:-150,y:268},squirrel:{x:-100,y:300},kitten:{x:78,y:300},fawn:{x:120,y:258}};
  L.food=[{x:-72,y:-2},{x:-25,y:6},{x:25,y:6},{x:72,y:-2}];
}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  cv.style.width=W+'px';cv.style.height=H+'px';
  const i=insets();const aw=Math.max(1,W-i.l-i.r),ah=Math.max(1,H-i.t-i.b);
  S=Math.max(0.05,Math.min(aw/720,ah/1000));OX=i.l+aw/2;OY=i.t+ah/2;
  VL=-OX/S;VR=(W-OX)/S;VT=-OY/S;VB=(H-OY)/S;VW=VR-VL;VH=VB-VT;
  const half=Math.min(-VL,VR);
  Q=clamp((half-360)/360,0,1);
  P=clamp(half-48,310,520);
  layout();
  if(canopy)relayoutCanopy();
  buildBG();
}
function setWorld(c){c.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);}

/* ---------- drawing helpers ---------- */
function ell(x,y,rx,ry,rot=0,c=ctx){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);}
function circ(x,y,r,c=ctx){c.beginPath();c.arc(x,y,Math.max(.01,r),0,TAU);}
function glaze(x,y,rx,ry,col,rot=0,c=ctx){
  const g=c.createRadialGradient(x-rx*.35,y-ry*.45,Math.min(rx,ry)*.06,x,y,Math.max(rx,ry)*1.05);
  g.addColorStop(0,col.l);g.addColorStop(.55,col.b);g.addColorStop(1,col.d);
  c.fillStyle=g;ell(x,y,rx,ry,rot,c);c.fill();
}
function shine(x,y,rx,ry,a=.75,rot=-.6,c=ctx){c.fillStyle=`rgba(255,255,250,${a})`;ell(x,y,rx,ry,rot,c);c.fill();}
function stroke(w=2,col=INK,c=ctx){c.lineWidth=w;c.strokeStyle=col;c.stroke();}
function vine(x,y,len,ang,sc=1,col=GOLD,c=ctx){
  c.save();c.translate(x,y);c.rotate(ang);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1.5*sc;c.lineCap='round';
  c.beginPath();c.moveTo(0,0);c.bezierCurveTo(len*.3,-len*.28,len*.66,len*.25,len,0);c.stroke();
  c.beginPath();c.arc(len+3*sc,-3*sc,3.2*sc,PI*.6,PI*2.2);c.stroke();
  for(const t of [.3,.62]){const lx=len*t,ly=t<.5?-len*.12:len*.1;c.save();c.translate(lx,ly);c.rotate(t<.5?-.9:.9);ell(0,-5*sc,2.4*sc,5.5*sc,0,c);c.fill();c.restore();}
  c.restore();
}
function goldFlower(x,y,r,c=ctx){
  c.fillStyle=GOLD;for(let i=0;i<5;i++){const a=i/5*TAU-PI/2;circ(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.62,c);c.fill();}
  c.fillStyle=GOLDL;circ(x,y,r*.5,c);c.fill();
  c.strokeStyle=GOLDD;c.lineWidth=.8;for(let i=0;i<5;i++){const a=i/5*TAU-PI/2;circ(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.62,c);c.stroke();}
}
// tiny seeded random for static decoration
let seedv=1;const srand=()=>{seedv=(seedv*16807)%2147483647;return(seedv-1)/2147483646;};

/* ---------- static background ---------- */
const bg=document.createElement('canvas');const bgc=bg.getContext('2d');
function buildBG(){
  bg.width=cv.width;bg.height=cv.height;const c=bgc;setWorld(c);seedv=7;
  // sky
  let g=c.createLinearGradient(0,VT,0,160);g.addColorStop(0,'#a9d3e3');g.addColorStop(.6,'#dcebe6');g.addColorStop(1,'#f8f0dc');
  c.fillStyle=g;c.fillRect(VL-2,VT-2,VW+4,VH+4);
  g=c.createRadialGradient(-P*.6,-380,10,-P*.6,-380,420);g.addColorStop(0,'rgba(255,246,214,.75)');g.addColorStop(1,'rgba(255,246,214,0)');
  c.fillStyle=g;c.fillRect(VL,VT,VW,VH);
  // clouds
  for(const cl of [[-P*.9,-300,1],[P*.5,-250,.8],[P*1.4,-330,1.1],[-P*1.6,-200,.9],[0,-560,1.2]]){
    for(let k=0;k<5;k++){const x=cl[0]+(k-2)*34*cl[2],y=cl[1]+(k%2?-14:4)*cl[2],r=(30+(k%3)*10)*cl[2];
      glaze(x,y,r,r*.8,{l:'#ffffff',b:'#fbf5e8',d:'#cbd7e2'},0,c);}
  }
  // far forest
  for(let layer=0;layer<2;layer++){
    const base=layer?178:150,col=layer?{l:'#b9d6a2',b:'#6f9a6a',d:'#2d5a49'}:{l:'#d3e6c8',b:'#9dbf9a',d:'#5f8a7a'};
    for(let x=VL-60;x<VR+60;x+=layer?62:78){
      const r=(layer?52:64)+srand()*28, y=base-r*(layer?1.1:1.5)-srand()*30;
      glaze(x,y,r,r*1.05,col,0,c);
      glaze(x+r*.3,y+r*.6,r*.8,r*.7,col,0,c);
      if(srand()<.5){c.fillStyle=rgba(GOLD,.7);circ(x-r*.2,y-r*.3,3,c);c.fill();circ(x+r*.25,y-r*.1,2.4,c);c.fill();}
    }
  }
  // floor
  c.fillStyle='#efe2c4';c.fillRect(VL-2,200,VW+4,VB-200+4);
  const ts=64;
  for(let y=214;y<VB+ts;y+=ts){
    for(let x=Math.floor(VL/ts)*ts-ts/2;x<VR+ts;x+=ts){
      const gx=c.createLinearGradient(x,y,x+ts,y+ts);gx.addColorStop(0,'#fdf6e4');gx.addColorStop(1,'#eadbb9');
      c.fillStyle=gx;c.fillRect(x+1,y+1,ts-2,ts-2);
      c.strokeStyle='rgba(35,71,154,.55)';c.lineWidth=1.4;c.strokeRect(x+3,y+3,ts-6,ts-6);
      const cx=x+ts/2,cy=y+ts/2;c.fillStyle=rgba(COB,.78);
      for(let k=0;k<4;k++){c.save();c.translate(cx,cy);c.rotate(k*PI/2);ell(0,-11,5.5,10,0,c);c.fill();c.restore();}
      c.fillStyle=rgba('#d9822f',.85);circ(cx,cy,4.5,c);c.fill();
      c.fillStyle=rgba('#d9822f',.45);for(const [dx,dy] of [[0,0],[ts,0],[0,ts],[ts,ts]]){c.beginPath();c.arc(x+dx,y+dy,9,0,TAU);c.fill();}
    }
  }
  g=c.createLinearGradient(0,200,0,330);g.addColorStop(0,'rgba(60,70,110,.28)');g.addColorStop(1,'rgba(60,70,110,0)');
  c.fillStyle=g;c.fillRect(VL,200,VW,130);
  // counter (stall)
  const cx0=-P+18,cx1=P-18;
  g=c.createLinearGradient(0,168,0,250);g.addColorStop(0,'#f6ecd4');g.addColorStop(1,'#d9c39a');
  c.fillStyle=g;c.fillRect(cx0,170,cx1-cx0,78);
  for(let x=cx0+4;x<cx1-30;x+=40){
    c.fillStyle='rgba(35,71,154,.85)';c.beginPath();c.moveTo(x+20,178);c.lineTo(x+34,208);c.lineTo(x+20,238);c.lineTo(x+6,208);c.closePath();c.fill();
    c.fillStyle=CREAM;circ(x+20,208,6,c);c.fill();c.fillStyle=GOLD;circ(x+20,208,2.5,c);c.fill();
  }
  c.fillStyle=GOLD;c.fillRect(cx0,165,cx1-cx0,7);c.fillStyle=rgba(GOLDL,.8);c.fillRect(cx0,165,cx1-cx0,2);
  c.fillStyle='rgba(30,40,90,.25)';c.fillRect(cx0,246,cx1-cx0,6);
  // shelf
  const sx=-P+10,sy=L.shelf.y+18;
  g=c.createLinearGradient(0,sy,0,sy+30);g.addColorStop(0,'#fbf3df');g.addColorStop(1,'#dcc6a0');
  c.fillStyle=g;c.fillRect(sx,sy,118,26);c.fillStyle=GOLD;c.fillRect(sx,sy-4,118,5);
  for(let k=0;k<3;k++)goldFlower(sx+22+k*37,sy+14,4,c);
  c.fillStyle=rgba(COB,.85);c.beginPath();c.moveTo(sx+110,sy+26);c.lineTo(sx+90,sy+60);c.lineTo(sx+96,sy+60);c.lineTo(sx+116,sy+26);c.fill();
  // pillars
  for(const px of [-P,P]){
    c.fillStyle='rgba(30,40,90,.2)';ell(px+6,262,34,9,0,c);c.fill();
    g=c.createLinearGradient(px-17,0,px+17,0);g.addColorStop(0,'#8d6417');g.addColorStop(.3,'#ffefb0');g.addColorStop(.55,'#d5a43b');g.addColorStop(1,'#6e4a10');
    c.fillStyle=g;c.fillRect(px-15,-342,30,600);
    c.save();c.beginPath();c.rect(px-15,-342,30,600);c.clip();
    c.strokeStyle=rgba(COB,.75);c.lineWidth=4;
    for(let y=-360;y<270;y+=46){c.beginPath();c.moveTo(px-16,y);c.bezierCurveTo(px-4,y+10,px+4,y+22,px+16,y+34);c.stroke();}
    c.restore();
    glaze(px,252,26,12,C.cob,0,c);glaze(px,-344,24,10,C.cob,0,c);
    glaze(px,-362,14,14,C.gold,0,c);shine(px-4,-367,4,3,.85,-.5,c);
    vine(px-12,-300,24,-1.2,1,GOLDL,c);
  }
}

/* ---------- audio ---------- */
let AC=null,MG=null,NB=null,voices=0;const lastP={};
function audioInit(){
  try{
    if(!AC){const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
      AC=new Ctor();MG=AC.createGain();MG.gain.value=.5;
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.2;
      MG.connect(comp);comp.connect(AC.destination);
      NB=AC.createBuffer(1,Math.floor(AC.sampleRate*1.2),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state!=='running')AC.resume().catch(()=>{});
  }catch(e){}
}
function can(k,gap){const t=performance.now();if(lastP[k]&&t-lastP[k]<gap*1000)return false;lastP[k]=t;return true;}
function tone(f,dur,o={}){
  if(!AC||AC.state!=='running'||voices>26)return;
  try{const t=AC.currentTime+(o.delay||0);const os=AC.createOscillator(),g=AC.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
    if(o.glide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.glide),t+dur*(o.gt||1));
    if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=f*.012;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05);}
    const v=o.vol||.15;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.at||.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    os.connect(g);g.connect(MG);os.start(t);os.stop(t+dur+.06);voices++;
    os.onended=()=>{voices--;try{g.disconnect();}catch(e){}};
  }catch(e){}
}
function noise(dur,o={}){
  if(!AC||AC.state!=='running'||voices>26||!NB)return;
  try{const t=AC.currentTime+(o.delay||0);const s=AC.createBufferSource();s.buffer=NB;
    const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
    const g=AC.createGain();const v=o.vol||.15;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.at||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.3);s.stop(t+dur+.05);voices++;
    s.onended=()=>{voices--;try{g.disconnect();}catch(e){}};
  }catch(e){}
}
const SFX={
  pop(){if(!can('pop',.08))return;noise(.09,{type:'highpass',f:1400,vol:.42,at:.002});tone(320,.12,{glide:.25,vol:.22,type:'triangle'});tone(180,.35,{delay:.08,type:'triangle',vol:.06,glide:.8});},
  grabCotton(){if(!can('gc',.1))return;noise(.18,{type:'lowpass',f:900,vol:.12,at:.03});},
  poof(){if(!can('poof',.12))return;noise(.32,{type:'bandpass',f:700,f2:180,q:.8,vol:.3,at:.01});tone(240,.25,{glide:.5,vol:.12});},
  rustle(){if(!can('rus',.11))return;noise(.16,{type:'highpass',f:3200,vol:.07,at:.03});},
  attach(i=0){if(!can('att',.15))return;const b=PENTA[4+(i%5)];tone(b*1.5,1.3,{vol:.1});tone(b*2.25,1,{vol:.05,delay:.01});tone(b*3.01,.7,{vol:.03,delay:.02});
    tone(b/2,.6,{type:'triangle',vol:.1,delay:.06});tone(b*3/4,.6,{type:'triangle',vol:.07,delay:.14});},
  boing(i=0){if(!can('boing',.09))return;const f=PENTA[i%PENTA.length]/2;tone(f,.3,{glide:1.5,gt:.3,vol:.12,type:'sine'});tone(f*2,.18,{vol:.03,delay:.02});},
  squeak(){if(!can('sq',.1))return;tone(900,.08,{glide:1.3,vol:.05,type:'triangle'});},
  canopy(){for(let i=0;i<10;i++)tone(PENTA[i],.6,{delay:i*.09,vol:.08});for(let i=0;i<5;i++)bellTone(PENTA[5+i]*1.5,.9+i*.18,.05);},
  feed(){if(!can('feed',.2))return;const s=[0,2,4,7];s.forEach((k,i)=>{const f=PENTA[k];tone(f,.22,{delay:i*.09,vol:.11});tone(f*4,.08,{delay:i*.09,vol:.02});});},
  dance(){if(!can('dance',.8))return;const m=[4,5,7,5,4,2,4,7,9];m.forEach((k,i)=>{tone(PENTA[k%11],.26,{delay:i*.13,vol:.07,vib:6});tone(PENTA[k%11]/2,.2,{delay:i*.13,vol:.03,type:'triangle'});});},
  bell(i){if(!can('bell'+i,.18)||!can('bellany',.05))return;bellTone(PENTA[(i*2)%PENTA.length]*1.5,0,.06);},
  tap(){if(!can('tap',.06))return;tone(1400,.08,{vol:.03});},
  hog(){if(!can('hog',.15))return;tone(440,.16,{glide:1.4,vol:.08,type:'triangle'});tone(660,.12,{delay:.06,vol:.05});},
  giggle(){if(!can('gig',.3))return;[0,1,2].forEach(i=>tone(700+i*90,.09,{delay:i*.08,vol:.05,type:'triangle',glide:1.2}));},
  cake(){if(!can('cake',.15))return;tone(330,.25,{vol:.08,vib:14,type:'triangle'});},
  whoosh(){if(!can('wh',.2))return;noise(.5,{type:'bandpass',f:400,f2:1600,vol:.08,at:.15});}
};
function bellTone(f,delay,v){tone(f,1.1,{delay,vol:v});tone(f*2.76,.5,{delay,vol:v*.35});tone(f*5.4,.25,{delay,vol:v*.15});}

/* ---------- state ---------- */
let T=0,G,hog,spikes,caps,anchors,balloons,rib,bands,parts,foods,animals,canopy=null,streamers,cake,bells,demo=null;
let idle=0,interacted=false,bid=0,bCount=0,ribCount=0;
const ptrs=new Map();

function mkBalloon(x,y,state){
  const shapes=['round','tear','heart','petal'];
  const b={id:++bid,x,y,vx:0,vy:0,r:rand(46,53),ci:bCount%6,shape:bCount<2?'round':shapes[(bCount*3+((bCount>>2)&1))%4],state,anchor:null,len:200,
    st:0,stv:0,stAng:0,rot:0,rotv:0,pid:null,grow:0,seed:rand(0,100),target:null,w:0,node:-1,launch:0,tension:{x:0,y:0},alpha:1,from:null,puff:0,wasHeld:0};
  bCount++;balloons.push(b);return b;
}
function newGame(){

function mkCap(slot,grow=0){return{slot,x:0,y:0,vx:0,vy:0,state:'basket',pid:null,sq:0,sqv:0,grow,spikes:[],c:-1,attT:0,spread:0,dent:0,hop:null,seed:Math.floor(rand(0,1e4)),grabT:0,anchor:null,wob:0,home(){const s=L.capSlots[this.slot];return{x:L.basket.x+s.x,y:L.basket.y+s.y};}};}

/* ---------- hedgehog geometry ---------- */
function h2w(lx,ly){const sx=1+hog.sq,sy=1-hog.sq;lx*=sx;ly*=sy;const c=Math.cos(hog.tilt),s=Math.sin(hog.tilt);return{x:hog.x+lx*c-ly*s,y:hog.y+lx*s+ly*c};}
function w2h(x,y){const dx=x-hog.x,dy=y-hog.y,c=Math.cos(-hog.tilt),s=Math.sin(-hog.tilt);return{x:(dx*c-dy*s)/(1+hog.sq),y:(dx*s+dy*c)/(1-hog.sq)};}
function spikeLen(s){return SL-34*s.cov;}
function spikeTipW(s){const a=s.a+s.wob,r=SB+spikeLen(s);return h2w(Math.cos(a)*r,Math.sin(a)*r);}
function anchorPos(a){const r=a.rad+(a.lift||0);return h2w(Math.cos(a.ang)*r,Math.sin(a.ang)*r);}
function normDeg(a){let d=a*180/PI;while(d>90)d-=360;while(d<=-270)d+=360;return d;}

function chooseCenter(i){
  for(let o=0;o<NSP;o++)for(const s of (o?[1,-1]:[1])){const j=i+o*s;if(j<0||j>=NSP)continue;
    if(spikes[j].capA)continue;
    let unc=false;for(let k=j-1;k<=j+1;k++)if(spikes[k]&&!spikes[k].covT)unc=true;
    if(unc)return j;}
  for(let o=0;o<NSP;o++)for(const s of (o?[1,-1]:[1])){const j=i+o*s;if(j>=0&&j<NSP&&!spikes[j].capA)return j;}
  return -1;
}
function capSnap(x,y,maxD){
  const l=w2h(x,y);const d=hyp(l.x,l.y);if(maxD&&d>maxD)return null;
  const c=chooseCenter(nearestIdx(l.x,l.y));if(c<0)return null;
  const a=spikes[c].a;const p=h2w(Math.cos(a)*(SB+44),Math.sin(a)*(SB+44));
  return{c,x:p.x,y:p.y};
}
function uncoveredCount(){let n=0;for(const s of spikes)if(!s.covT)n++;return n;}
function freeAnchor(){for(const a of anchors)if(!a.balloon&&!a.reserved)return a;return null;}

/* ---------- particles ---------- */
function addP(p){if(parts.length>130)parts.splice(0,parts.length-130);parts.push(Object.assign({life:0,max:1,vx:0,vy:0,rot:0,vr:0,sz:10,g:0},p));}
function burst(x,y,kind,n,col,sp=160){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(.4,1)*sp;addP({t:kind,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(kind==='spark'?40:0),rot:rand(0,TAU),vr:rand(-8,8),max:rand(.5,.9),sz:rand(6,12),col,g:kind==='shard'?220:kind==='fluff'?-30:40});}}
function hearts(x,y,n=1){for(let i=0;i<n;i++)addP({t:'heart',x:x+rand(-20,20),y:y-rand(0,20),vx:rand(-20,20),vy:rand(-90,-60),max:1.4,sz:rand(9,14),g:-10});}
function ring(x,y,col='#ffffff',sz=30,max=.45){addP({t:'ring',x,y,sz,max,col});}

/* ---------- caps ---------- */
function capAttach(cap,sn){
  const c=sn.c;cap.state='attached';cap.c=c;cap.attT=0;cap.spikes=[];cap.pid=null;
  for(let k=c-1;k<=c+1;k++){if(k<0||k>=NSP)continue;cap.spikes.push(k);const s=spikes[k];if(!s.covT||s.by==='ribbon'){s.covT=1;s.by='cotton';}s.wobv+=3;}
  spikes[c].capA=cap;
  const a={id:anchors.length,kind:'cap',ref:cap,ang:spikes[c].a,rad:SB+72,balloon:null,reserved:null,lift:0};
  anchors.push(a);cap.anchor=a;
  const p=anchorPos(a);burst(p.x,p.y,'fluff',8,'#ffffff',120);ring(p.x,p.y,'#ffffff',40);
  SFX.poof();G.lastUse='cap';
  hog.expr='lookback';hog.exprT=1.1;hog.touchBack=1.4;hog.sqv+=1.6;hog.tlx=-.7;hog.tly=-.7;
  setTimeout(()=>{if(hog&&hog.expr==='lookback'){hog.expr='happy';hog.exprT=1.2;SFX.giggle();}},900);
  setTimeout(()=>refillCap(cap.slot),900);
  if(G.phase==='party'||G.phase==='rise'){a.reserved='canopy';addCanopyBalloon();}
}
function refillCap(slot){
  if(!caps)return;
  if(caps.some(c=>c.slot===slot&&(c.state==='basket'||c.state==='held'||c.state==='return'||c.state==='hop')))return;
  const n=mkCap(slot,0);const h=n.home();n.x=h.x;n.y=h.y;caps.push(n);
  // keep attached caps bounded
  const att=caps.filter(c=>c.state==='attached'||c.state==='gone');if(caps.length>24){const g=caps.findIndex(c=>c.state==='gone');if(g>=0)caps.splice(g,1);}
  void att;
}
function capRelease(cap,rec,tap){
  cap.pid=null;
  if(G.phase==='farewell'){cap.state='return';return;}
  if(tap){
    // hop toward the nearest exposed spike
    const sn=capSnap(cap.x,cap.y,0);
    if(sn&&(G.phase==='play'||G.phase==='party')){cap.state='hop';cap.hop={t:0,x0:cap.x,y0:cap.y,c:sn.c,dur:.55};SFX.whoosh();return;}
    if(G.phase==='party'&&canopy){const n=canopy.nodes[Math.floor(rand(0,canopy.nodes.length))];cap.state='hop';cap.hop={t:0,x0:cap.x,y0:cap.y,node:n,dur:.7};return;}
    cap.state='return';cap.sqv+=3;return;
  }
  if(G.phase==='party'&&canopy){
    const n=nearestNode(cap.x,cap.y,120);
    if(n){decorateNode(n,cap);return;}
  }
  const sn=capSnap(cap.x,cap.y,SB+200);
  if(sn&&G.phase!=='rise'){cap.state='hop';cap.hop={t:0,x0:cap.x,y0:cap.y,c:sn.c,dur:.14};return;}
  cap.state='return';SFX.squeak();
}
function updateCaps(dt){
  for(const cap of caps){
    cap.grow=Math.min(1,cap.grow+dt*2.2);
    cap.sqv+=(-cap.sq*170-cap.sqv*9)*dt;cap.sq+=cap.sqv*dt;cap.sq=clamp(cap.sq,-.5,.5);
    cap.dent=Math.max(0,cap.dent-dt*2.5);
    if(cap.state==='basket'){const h=cap.home();cap.x=lerp(cap.x,h.x,Math.min(1,dt*10));cap.y=lerp(cap.y,h.y,Math.min(1,dt*10));
      if(idle>6&&G.phase==='play'){cap.wob=Math.sin(T*3+cap.slot*1.7)*.08;}else cap.wob*=.9;}
    else if(cap.state==='held'){
      const r=ptrs.get(cap.pid);if(!r){capRelease(cap,null,false);continue;}
      let tx=r.x,ty=r.y-18;cap.spread=0;
      if(G.phase==='play'||G.phase==='party'){const sn=capSnap(tx,ty,SB+200);
        if(sn){const d=hyp(sn.x-tx,sn.y-ty);const m=clamp(1-d/260,0,1);tx=lerp(tx,sn.x,m*.35);ty=lerp(ty,sn.y,m*.35);cap.spread=m;cap.snapC=sn.c;}}
      const px=cap.x,py=cap.y;const k=Math.min(1,dt*16);cap.x=lerp(cap.x,tx,k);cap.y=lerp(cap.y,ty,k);
      cap.vx=(cap.x-px)/dt;cap.vy=(cap.y-py)/dt;
      const sp=hyp(cap.vx,cap.vy);cap.sq=lerp(cap.sq,clamp(sp/2400,0,.22),.3);
    }
    else if(cap.state==='return'){const h=cap.home();cap.x=lerp(cap.x,h.x,Math.min(1,dt*7));cap.y=lerp(cap.y,h.y,Math.min(1,dt*7));
      if(hyp(cap.x-h.x,cap.y-h.y)<3){cap.state='basket';cap.sqv+=2.5;}}
    else if(cap.state==='hop'){
      const hp=cap.hop;hp.t+=dt;const u=clamp(hp.t/hp.dur,0,1);let tx,ty;
      if(hp.node){tx=hp.node.rx+hp.node.dx;ty=hp.node.ry+hp.node.dy;}
      else{const a=spikes[hp.c].a;const p=h2w(Math.cos(a)*(SB+44),Math.sin(a)*(SB+44));tx=p.x;ty=p.y;}
      cap.x=lerp(hp.x0,tx,ease(u));cap.y=lerp(hp.y0,ty,ease(u))-Math.sin(u*PI)*(hp.dur>.3?120:10);

      }

    else if(cap.state==='fly'){cap.x+=cap.vx*dt;cap.y+=cap.vy*dt;cap.vy+=300*dt;cap.grow=Math.max(0,cap.grow-dt*2.5);if(cap.grow<=0)cap.state='gone';}
  }
  for(let i=caps.length-1;i>=0;i--)if(caps[i].state==='gone')caps.splice(i,1);
  // ensure basket has 3 caps (refill)
  for(let s=0;s<3;s++)if(!caps.some(c=>c.slot===s&&c.state!=='attached'&&c.state!=='gone')){if(!G['rf'+s])G['rf'+s]=T+.9;if(T>G['rf'+s]){G['rf'+s]=0;refillCap(s);}}
}
const CAPP=[[0,-4,25],[-25,6,19],[25,6,19],[-15,-20,18],[15,-20,18],[0,16,18],[-37,18,13],[37,18,13],[0,-36,12]];
function puff(x,y,r,c=ctx){
  const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#f8f3ea');g.addColorStop(1,'#cfcbe0');

function drawPuffSet(list,seed){

  for(const p of list)puff(p[0],p[1],p[2]);

  let s=seed;for(const p of list){for(let k=0;k<3;k++){s=(s*9301+49297)%233280;const a=s/233280*TAU;const rr=p[2]*.6;ctx.beginPath();ctx.arc(p[0]+Math.cos(a)*rr*.5,p[1]+Math.sin(a)*rr*.5,rr*.5,a,a+1.3);ctx.stroke();}}

}
function drawCapFree(cap,hb){

  let ang=cap.wob;if(cap.state==='held'&&sp>0&&cap.snapC>=0){const a=spikes[cap.snapC].a;ang=lerp(ang,wrapA(a+PI/2+hog.tilt),sp*.6);}

function capAttachedPuffs(cap){
  const u=clamp(cap.attT/.55,0,1),e=easeOutElastic(u);
  const c=spikes[cap.c].a,cr=SB+44;const cx=Math.cos(c)*cr,cy=Math.sin(c)*cr;

  for(const k of cap.spikes){const s=spikes[k];add(s.a+s.wob*.5,SB+40,22);add(s.a,SB+14,19);}

  add(c,SB+64,13);

/* ---------- ribbon ---------- */
const RN=22,RSEG=16;
function ribbonUnroll(){
  rib.state='hang';rib.pin=true;rib.wrapped=new Set();rib.t=0;rib.ci=ribCount%4;rib.pid=null;rib.held=-1;rib.auto=null;
  rib.pts=[];for(let i=0;i<RN;i++){const x=L.shelf.x+28+rand(-2,2),y=L.shelf.y+8+i*.5;rib.pts.push({x,y,px:x,py:y});}
  SFX.rustle();
}
function ribbonPinPt(){return{x:L.shelf.x+30,y:L.shelf.y+10};}
function updateRibbon(dt){
  if(rib.state==='hidden'){
    if(G.ribbonUnlocked&&T>G.ribT){ribbonUnroll();}
    return;
  }
  if(rib.state==='gone'){if(T>rib.t){ribCount++;ribbonUnroll();}return;}
  const pts=rib.pts;
  if(rib.state==='wrap'){
    rib.t+=dt;const u=ease(rib.t/.5);
    for(let i=0;i<RN;i++){const p=pts[i];const q=rib.targetFn(i/(RN-1));p.x=lerp(p.x,q.x,u);p.y=lerp(p.y,q.y,u);p.px=p.x;p.py=p.y;}
    if(rib.t>=.5){finishBand();}
    return;
  }
  const grav=rib.state==='hang'&&rib.t<1.2?380:900;rib.t+=dt;
  for(const p of pts){const vx=(p.x-p.px)*.985,vy=(p.y-p.py)*.985;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+grav*dt*dt;}
  const held=rib.held>=0?ptrs.get(rib.pid):null;
  if(rib.held>=0&&!held&&!rib.auto){ribRelease(false);return;}
  const hc={x:hog.x,y:hog.y};
  for(let it=0;it<6;it++){
    if(rib.pin){const pp=ribbonPinPt();pts[0].x=pp.x;pts[0].y=pp.y;}
    if(rib.held>=0){const f=rib.auto?rib.fp:held;pts[rib.held].x=f.x;pts[rib.held].y=f.y;}
    for(let i=0;i<RN-1;i++){const a=pts[i],b=pts[i+1];const dx=b.x-a.x,dy=b.y-a.y;const d=hyp(dx,dy)||.001;const df=(d-RSEG)/d*.5;
      const fa=(rib.pin&&i===0)||rib.held===i?0:1,fb=rib.held===i+1?0:1;const tw=fa+fb||1;
      a.x+=dx*df*2*fa/tw;a.y+=dy*df*2*fa/tw;b.x-=dx*df*2*fb/tw;b.y-=dy*df*2*fb/tw;}
    for(let i=0;i<RN;i++){const p=pts[i];if(p.y>FLOOR+12)p.y=FLOOR+12;
      if(rib.held>=0&&i!==rib.held){const dx=p.x-hc.x,dy=p.y-hc.y,d=hyp(dx,dy);const R=SB+50;if(d<R&&d>.01){p.x=hc.x+dx/d*R;p.y=hc.y+dy/d*R;}}}
  }
  if(rib.held>=0&&G.phase!=='rise'&&G.phase!=='farewell'){
    for(const s of spikes){const a=s.a,r=SB+44;const sp=h2w(Math.cos(a)*r,Math.sin(a)*r);
      for(const p of pts){if(hyp(p.x-sp.x,p.y-sp.y)<46){if(!rib.wrapped.has(s.i)){rib.wrapped.add(s.i);s.wobv+=4;SFX.rustle();}break;}}}
    rib.drag+=dt;
  }
}
function ribRelease(tap){
  const wasAuto=!!rib.auto;rib.pid=null;
  if(tap&&!wasAuto&&G.phase!=='rise'&&G.phase!=='farewell'){
    // auto wrap nearest exposed spikes
    let best=-1,bd=1e9;for(const s of spikes){if(s.covT)continue;const p=spikeTipW(s);const d=hyp(p.x-rib.pts[rib.held<0?RN-1:rib.held].x,p.y-rib.pts[rib.held<0?RN-1:rib.held].y);if(d<bd){bd=d;best=s.i;}}
    if(best<0)best=Math.floor(rand(2,NSP-2));
    rib.wrapped=new Set([best-1,best,best+1].filter(i=>i>=0&&i<NSP));
    startWrap();SFX.whoosh();return;
  }
  rib.held=-1;rib.auto=null;
  if(rib.wrapped.size>0&&G.phase!=='rise'&&G.phase!=='farewell'){startWrap();return;}
  if(G.phase==='party'&&canopy){
    const end=rib.pts[RN-1],mid=rib.pts[Math.floor(RN/2)];const ref=end.y<mid.y?end:mid;
    const top=rib.pts.reduce((m,p)=>p.y<m.y?p:m,rib.pts[0]);
    if(top.y<60){const n=nearestNode(top.x,top.y,1e9);if(n){addStreamer(n);rib.state='gone';rib.t=T+1.2;G.decos++;G.lastUse='rib';return;}}
    void ref;
  }
  // fall back: re-pin to shelf gently
  rib.pin=true;rib.t=0;SFX.rustle();
}
function startWrap(){
  const idx=[...rib.wrapped].sort((a,b)=>a-b);let i0=idx[0],i1=idx[idx.length-1];
  if(i1-i0>4){const m=Math.round((i0+i1)/2);i0=m-2;i1=m+2;}
  i0=clamp(i0,0,NSP-1);i1=clamp(i1,0,NSP-1);
  rib.band={i0,i1};rib.state='wrap';rib.t=0;rib.held=-1;rib.pin=false;rib.auto=null;
  const a0=spikes[i0].a+.09,a1=spikes[i1].a-.09;
  rib.targetFn=u=>{const a=lerp(a0,a1,u);return h2w(Math.cos(a)*(SB+28),Math.sin(a)*(SB+28));};
}
function finishBand(){
  const {i0,i1}=rib.band;const band={i0,i1,ci:rib.ci,t:0,flut:0,tails:[],mid:(spikes[i0].a+spikes[i1].a)/2,anchor:null};
  for(let k=i0;k<=i1;k++){const s=spikes[k];if(!s.covT){s.covT=1;s.by='ribbon';}s.wobv+=3;}
  const a={id:anchors.length,kind:'band',ref:band,ang:band.mid,rad:SB+60,balloon:null,reserved:null,lift:0};anchors.push(a);band.anchor=a;
  const kp=anchorPos(a);
  for(let s=0;s<2;s++){const tl=[];for(let i=0;i<7;i++)tl.push({x:kp.x,y:kp.y+i*10,px:kp.x,py:kp.y+i*10});band.tails.push(tl);}
  bands.push(band);
  if(bands.length>6){const old=bands.shift();void old;}
  rib.state='gone';rib.t=T+1.4;G.lastUse='rib';
  SFX.rustle();SFX.attach(2);burst(kp.x,kp.y,'spark',8,GOLD,120);
  hog.expr='lookback';hog.exprT=1;hog.touchBack=1.2;hog.sqv+=1.4;hog.tlx=-.7;hog.tly=-.7;
  setTimeout(()=>{if(hog&&hog.expr==='lookback'){hog.expr='happy';hog.exprT=1.2;SFX.giggle();}},850);
  if(G.phase==='party'){a.reserved='canopy';addCanopyBalloon();}
}
function updateBands(dt){
  for(const b of bands){b.t=Math.min(1,b.t+dt*2.4);b.flut*=Math.exp(-dt*2);
    const kp=anchorPos(b.anchor);

/* ---------- balloons ---------- */

}

function balloonCanPop(b){return b.state==='approach'||b.state==='held';}

/* ---------- plaza ---------- */

/* ---------- flow ---------- */
function progressScore(){let att=0;for(const b of balloons)if(b.state==='attached')att++;let cov=0;for(const s of spikes)if(s.covT)cov++;return{att,cov,score:att+cov/NSP*1.5+(bands.length?.5:0)};}
function updateFlow(dt){
  G.pt+=dt;
  if(G.phase==='play'){
    const p=progressScore();
    if(G.riseDelay<0&&p.att>=4&&p.score>=6.4){G.riseDelay=1.6;}
    if(G.riseDelay>0){G.riseDelay-=dt;if(G.riseDelay<=0){G.riseDelay=-2;startRise();}}
  }else if(G.phase==='rise'){
    const t=G.pt;
    canopy.gar=ease((t-1.2)/1.6);
    G.glow=clamp(Math.sin(clamp((t-.8)/1.6,0,1)*PI),0,1);
    G.plazaT=clamp((t-2.8)/1.4,0,1);G.shade=clamp((t-2.6)/1.4,0,1);
    G.tableT=clamp((t-3.2)/.7,0,1);
    if(t>3.4&&!foods.length){makeFoods();}
    if(t>3.6&&foods.length)for(const f of foods)if(f.state==='hidden'){f.state='table';f.grow=0;}
    if(t>3.6&&!animals.length){G.animalT=T;makeAnimals();SFX.dance();}
    hog.hug=t>5.4?Math.min(1,hog.hug+dt*3):0;
    if(t>5.8&&!G.hugDone){G.hugDone=true;hog.expr='happy';hog.exprT=1e9;SFX.dance();for(const a of animals)hearts((a.x+hog.x)/2,hog.y-60,2);}
    if(t>8.2){for(const a of animals)a.mode='home';}
    if(t>8.6){G.phase='party';G.pt=0;G.partyT=0;hog.hug=0;}
  }else if(G.phase==='party'){
    G.partyT+=dt;hog.hug=Math.max(0,hog.hug-dt*2);
    if(G.partyT>70&&G.feeds>=6&&idle>16&&!ptrs.size){startFarewell();}
  }else if(G.phase==='farewell'){
    G.farewellT+=dt;const t=G.farewellT;
    if(canopy)canopy.gar=Math.max(0,canopy.gar-dt*.4);
    G.tableT=Math.max(0,G.tableT-dt*.6);G.plazaT=Math.max(0,G.plazaT-dt*.4);G.shade=Math.max(0,(G.shade||0)-dt*.5);
    if(t>2.6)for(const a of animals)a.mode='leave';
    if(t>3.2&&!G.capsBack){G.capsBack=true;for(const s of spikes){s.covT=0;s.by=null;s.capA=null;s.wobv+=2;}
      for(const c of caps)if(c.state==='attached'){c.state='fly';c.vx=rand(-120,120);c.vy=-260;}
      bands.length=0;anchors.length=0;SFX.poof();}
    if(t>6.5){resetCycle();}
  }
}
function startFarewell(){
  G.phase='farewell';G.farewellT=0;SFX.canopy();
  for(const nd of canopy.nodes){if(nd.b){nd.b.state='float';nd.b.vx=rand(-50,50);nd.b.vy=rand(-60,-20);}}
  for(const f of foods)if(f.state!=='held')f.state='hidden';
  hog.expr='happy';hog.exprT=3;
}
function resetCycle(){
  for(const r of ptrs.values()){r.obj=null;r.kind='none';}
  const keepT=T;newGame();T=keepT;G.startT=T-12;
}

/* ---------- hints ---------- */
function computeHint(){
  if(G.phase==='play'){
    const basketCaps=caps.filter(c=>c.state==='basket'&&c.grow>=1);
    const ribReady=rib.state==='hang'&&rib.held<0;
    const unc=uncoveredCount();
    let useRib=ribReady&&(bands.length===0||G.lastUse==='cap'||!basketCaps.length);
    if(useRib){const e=rib.pts[RN-1];const tgt=spikes.find(s=>!s.covT)||spikes[1];const p=h2w(Math.cos(tgt.a)*(SB+60),Math.sin(tgt.a)*(SB+60));return{obj:rib,x:e.x,y:e.y,tx:p.x,ty:p.y};}
    if(basketCaps.length&&(unc>0||anchors.filter(a=>!a.balloon).length===0)){
      const c=basketCaps.reduce((m,x)=>hyp(x.x-hog.x,x.y-hog.y)<hyp(m.x-hog.x,m.y-hog.y)?x:m,basketCaps[0]);
      const sn=capSnap(hog.x,hog.y-200,0)||{x:hog.x,y:hog.y-140};return{obj:c,x:c.x,y:c.y,tx:sn.x,ty:sn.y};}
    return null;
  }
  if(G.phase==='party'){
    const homeA=animals.filter(a=>a.mode==='home');if(!homeA.length)return null;
    const cyc=G.feeds<3?0:(G.hintCycle%3);
    if(cyc===1&&canopy){const nd=canopy.nodes[Math.floor(canopy.nodes.length/2)];const x=nd.rx+nd.dx,y=nd.ry+nd.dy;return{obj:nd,x,y,tx:x,ty:y+140};}
    if(cyc===2){const c=caps.find(c=>c.state==='basket'&&c.grow>=1);if(c&&canopy){const nd=canopy.nodes[3]||canopy.nodes[0];return{obj:c,x:c.x,y:c.y,tx:nd.rx+nd.dx,ty:nd.ry+nd.dy};}}
    const a=homeA.reduce((m,x)=>x.fed<m.fed?x:m,homeA[0]);
    const f=foods.find(f=>f.type===FAV[a.kind]&&f.state==='table')||foods.find(f=>f.state==='table');
    if(f)return{obj:f,x:f.x,y:f.y,tx:a.x,ty:a.y-70};
  }
  return null;
}
function updateHints(dt){
  const h=computeHint();G.hint=h;
  const since=T-G.startT;
  if(demo){demo.t+=dt;if(demo.t>2.1||!h||demo.obj!==h.obj)demo=null;}
  if(!demo&&h&&idle>4&&since>10&&!ptrs.size&&T>G.demoWait){demo={t:0,obj:h.obj,x:h.x,y:h.y,tx:h.tx,ty:h.ty};G.demoWait=T+6.5;}
}
function drawGlow(){
  const h=G.hint;if(!h||ptrs.size&&[...ptrs.values()].some(r=>r.obj===h.obj))return;
  const pul=.5+.5*Math.sin(T*4);const r=58+pul*12;
  const g=ctx.createRadialGradient(h.x,h.y,8,h.x,h.y,r);g.addColorStop(0,'rgba(255,245,190,.55)');g.addColorStop(.6,'rgba(255,225,140,.25)');g.addColorStop(1,'rgba(255,225,140,0)');
  ctx.fillStyle=g;circ(h.x,h.y,r);ctx.fill();
  for(let i=0;i<3;i++){const a=T*1.6+i*TAU/3;const x=h.x+Math.cos(a)*(r*.78),y=h.y+Math.sin(a)*(r*.6);star(x,y,4+pul*2,`rgba(255,240,170,${.7})`);}
}
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU,rr=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function hintBounce(o){return G.hint&&G.hint.obj===o?-Math.abs(Math.sin(T*4.5))*9:0;}
function drawDemo(){
  if(!demo)return;const t=demo.t;let x,y,press=0,al=1;

  ctx.fillStyle='rgba(30,40,90,.2)';ell(6,40,26,12);ctx.fill();
  glaze(0,40,26,30,C.white);
  ctx.beginPath();ctx.moveTo(-9,30);ctx.lineTo(-9,-6);ctx.arc(0,-6,9,PI,0);ctx.lineTo(9,30);ctx.closePath();const g=ctx.createLinearGradient(-9,0,9,0);g.addColorStop(0,'#f3eee6');g.addColorStop(.4,'#ffffff');g.addColorStop(1,'#bdb8d0');ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(35,71,154,.6)';ctx.lineWidth=1.6;ctx.stroke();ell(0,40,26,30);ctx.stroke();
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,62,20,PI*1.15,PI*1.85);ctx.stroke();

/* ---------- particles update/draw ---------- */
function updateParts(dt){
  for(const p of parts){p.life+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.rot+=p.vr*dt;
    if(p.t==='string'){p.y+=0;p.ey+=280*dt*p.life*3;p.ex+=Math.sin(p.life*9)*30*dt;}}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].life>=parts[i].max)parts.splice(i,1);
}
function drawParts(){
  for(const p of parts){const u=p.life/p.max,a=1-u;
    if(p.t==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=a;ctx.strokeStyle=p.col;ctx.lineWidth=5*(1-u*.5);ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,p.sz*(1-u*.6),0,PI*(1+u));ctx.stroke();ctx.restore();}
    else if(p.t==='fluff'){ctx.globalAlpha=a;puff(p.x,p.y,p.sz*(1+u*.5));ctx.globalAlpha=1;}
    else if(p.t==='spark'){star(p.x,p.y,p.sz*(1-u*.5),p.col.startsWith('#')?rgba(p.col,a):p.col);}
    else if(p.t==='heart'){ctx.save();ctx.translate(p.x+Math.sin(p.life*5)*6,p.y);ctx.globalAlpha=Math.min(1,a*1.6);const s=p.sz/10*(u<.15?u/.15:1);ctx.scale(s,s);
      ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-12,0,-10,-12,0,-6);ctx.bezierCurveTo(10,-12,12,0,0,8);ctx.closePath();const g=ctx.createRadialGradient(-3,-5,1,0,0,12);g.addColorStop(0,'#ffe0e8');g.addColorStop(.6,'#f06f90');g.addColorStop(1,'#a02c50');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=1;ctx.stroke();ctx.restore();}
    else if(p.t==='ring'){ctx.strokeStyle=rgba(p.col,a*.8);ctx.lineWidth=3*a+.5;circ(p.x,p.y,p.sz*(.4+u*1.1));ctx.stroke();}
    else if(p.t==='string'){ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo((p.x+p.ex)/2+Math.sin(p.life*12)*25*a,(p.y+p.ey)/2+20,p.ex,p.ey);ctx.strokeStyle='rgba(95,80,70,.8)';ctx.lineWidth=1.7;ctx.stroke();ctx.globalAlpha=1;}
  }
  ctx.globalAlpha=1;
}

/* ---------- input ---------- */
function toWorld(e){return{x:(e.clientX-OX)/S,y:(e.clientY-OY)/S,sx:e.clientX,sy:e.clientY};}
function grab(r){
  const x=r.x,y=r.y;
  const free=o=>o.pid==null;
  // food
  if(G.phase==='party'){let best=null,bd=58;for(const f of foods){if(f.state!=='table'||!free(f))continue;const d=hyp(f.x-x,f.y-y);if(d<bd){bd=d;best=f;}}
    if(best){best.state='held';best.pid=r.id;best.sqv+=3;r.kind='food';r.obj=best;SFX.squeak();for(const a of animals)if(a.mode==='home')a.lookAt={x:best.x,y:best.y,t:1.5};return;}}
  // caps
  {let best=null,bd=82;for(const c of caps){if((c.state!=='basket'&&c.state!=='return')||!free(c)||c.grow<.5)continue;const d=hyp(c.x-x,c.y-y);if(d<bd){bd=d;best=c;}}
    if(best){best.state='held';best.pid=r.id;best.sqv-=4;best.grabT=T;r.kind='cap';r.obj=best;SFX.grabCotton();hog.tlx=-.6;hog.tly=.6;return;}}
  // ribbon
  if((rib.state==='hang')&&rib.held<0&&rib.pid==null){let bi=-1,bd=48;for(let i=0;i<RN;i++){const p=rib.pts[i];const d=hyp(p.x-x,p.y-y);if(d<bd){bd=d;bi=i;}}
    if(bi>=0){rib.pid=r.id;rib.held=bi;rib.pin=false;rib.wrapped=new Set();rib.drag=0;r.kind='ribbon';r.obj=rib;SFX.rustle();return;}}
  // balloons (not canopy)
  {let best=null,bd=1e9;for(const b of balloons){if(!['stock','approach','attached'].includes(b.state)||!free(b)||b.grow<.6)continue;const d=hyp(b.x-x,b.y-y);if(d<b.r+26&&d<bd){bd=d;best=b;}}
    if(best){best.from=best.state;best.state='held';best.pid=r.id;best.stv+=2;r.kind='balloon';r.obj=best;SFX.squeak();
      if(best.target&&best.target.reserved===best){best.target.reserved=null;best.target=null;}return;}}
  // canopy nodes
  if(canopy&&G.phase==='party'){let best=null,bd=1e9;for(const nd of canopy.nodes){if(nd.held!=null||!nd.b)continue;const d=hyp(nd.rx+nd.dx-x,nd.ry+nd.dy-y);if(d<nd.b.r+24&&d<bd){bd=d;best=nd;}}
    if(best){best.held=r.id;r.kind='node';r.obj=best;SFX.squeak();return;}}
  // cake
  if(G.phase==='party'&&hyp(x-L.table.x,y-(L.table.y-70))<62){cake.wv+=9;cake.sv+=rand(-6,6)||4;SFX.cake();r.kind='cake';return;}
  // animals
  if(animals.length){for(const a of animals){if(hyp(a.x-x,a.y-60-y)<70){if(a.hop===0)a.hv=-320;a.lookAt={x,y,t:1};hearts(a.x,a.y-120,1);SFX.giggle();r.kind='animal';return;}}}
  // bells
  for(let i=0;i<bells.length;i++){const bl=bells[i];const p=rodPt(bl.t);const o=rodOffset(p.x);if(hyp(p.x+o.x-x,p.y+o.y+26-y)<34){bl.v+=4;bl.ring=1;bellTone(PENTA[(i*2)%PENTA.length]*1.5,0,.06);r.kind='bell';return;}}
  // hedgehog
  if(hyp(x-hog.x,y-hog.y)<SB+95){
    hog.sqv+=2.6;hog.vy-=90;hog.expr=G.phase==='play'?'lookback':'happy';hog.exprT=.9;
    for(const s of spikes)s.wobv+=rand(-3,3);
    const l=w2h(x,y);
    if(G.phase==='play'){hog.tlx=-.6;hog.tly=-.6;SFX.hog();
      // the cotton caps perk up as an invitation
      for(const c of caps)if(c.state==='basket')c.sqv+=3.5;
      if(hyp(l.x,l.y)>SB-10){ring(x,y,'#fff6d8',26);}
    }else{SFX.giggle();hearts(hog.x+30,hog.y-90,1);}
    r.kind='hog';return;}
  // empty
  ring(x,y,'#fff6d8',22,.4);SFX.tap();r.kind='none';
  for(const c of caps)if(c.state==='basket'&&hyp(c.x-x,c.y-y)<200)c.sqv+=1.5;
}
function release(r,cancel){
  const tap=!cancel&&!r.moved&&(T-r.t0)<.4;
  const o=r.obj;
  if(r.kind==='cap'&&o&&o.pid===r.id){if(cancel){o.pid=null;o.state='return';}else capRelease(o,r,tap);}
  else if(r.kind==='ribbon'&&rib.pid===r.id){if(cancel){rib.pid=null;rib.held=-1;rib.pin=true;rib.t=0;}else ribRelease(tap);}
  else if(r.kind==='balloon'&&o&&o.pid===r.id&&o.state==='held'){releaseBalloon(o,tap);}
  else if(r.kind==='node'&&o&&o.held===r.id){nodeRelease(o);}
  else if(r.kind==='food'&&o&&o.pid===r.id){foodRelease(o,tap&&!cancel);}
}
cv.addEventListener('pointerdown',e=>{

  ptrs.set(e.pointerId,r);idle=0;demo=null;

},{passive:false});

/* ---------- main loop ---------- */
function step(dt){
  T+=dt;idle+=dt;
  updateHog(dt);updateCaps(dt);updateRibbon(dt);updateBands(dt);updateBalloons(dt);updateCanopy(dt);updateBells(dt);
  if(animals.length)updateAnimals(dt);if(foods.length)updateFoods(dt);
  cake.wv+=(-cake.w*220-cake.wv*6)*dt;cake.w+=cake.wv*dt;cake.sv+=(-cake.sx*40-cake.sv*3)*dt;cake.sx=clamp(cake.sx+cake.sv*dt*.1,-1,1);
  updateParts(dt);updateFlow(dt);updateHints(dt);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  setWorld(ctx);
  // pillar glow during transformation
  if(G.glow>0){for(const px of [-P,P]){const g=ctx.createRadialGradient(px,-200,10,px,-200,220);g.addColorStop(0,`rgba(255,236,160,${.45*G.glow})`);g.addColorStop(1,'rgba(255,236,160,0)');ctx.fillStyle=g;ctx.fillRect(px-220,-420,440,700);}}
  drawPlaza();
  // shade under the balloons
  const att=balloons.filter(b=>b.state==='attached').length;const sh=Math.max(G.shade||0,att>=4?.5:0);
  if(sh>0){const g=ctx.createRadialGradient(hog.x,300,10,hog.x,300,(G.shade?P:180));g.addColorStop(0,`rgba(40,50,110,${.2*sh})`);g.addColorStop(1,'rgba(40,50,110,0)');ctx.fillStyle=g;ell(hog.x,300,G.shade?P:200,G.shade?100:50);ctx.fill();}
  drawRod();
  drawGarland();
  drawGlow();
  // stall tie post
  glaze(L.tie.x,L.tie.y-6,8,8,C.gold);
  // strings behind
  for(const b of balloons){if(b.state==='dead'||b.state==='canopy'||b.state==='float')continue;const o=stringOrigin(b);if(!o)continue;const bx=b.x,by=b.y+(b.state==='stock'?Math.sin(T*1.2+b.seed)*4:0);
    const k=knotOf(b,bx,by);const d=hyp(k.x-o.x,k.y-o.y);let al=1;if(b.state==='toCanopy'){al=clamp(1-(T-b.launch-1.2)/.8,0,1);}if(al<=0)continue;drawString(o,k,Math.max(0,b.len-d)*.4,al*b.grow);}
  // tethers from back to canopy
  if(canopy&&canopy.form>0&&anchors.length&&(G.phase==='party'||G.phase==='rise')){const hub={x:canopy.nodes[Math.floor(canopy.nodes.length/2)].rx,y:-300};const al=clamp((G.pt-1.6)/1.2,0,1)*(G.phase==='party'?1:1);
    if(al>0||G.phase==='party'){const a2=G.phase==='party'?1:al;for(const a of anchors){const p=anchorPos(a);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo((p.x+hub.x)/2+Math.sin(T+a.id)*8,(p.y+hub.y)/2,hub.x,hub.y);ctx.strokeStyle=`rgba(232,111,140,${.7*a2})`;ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle=`rgba(212,164,58,${.8*a2})`;ctx.lineWidth=1;ctx.stroke();}
      glaze(hub.x,hub.y,9*a2,9*a2,C.gold);}}
  // canopy balloons (behind the hedgehog)
  for(const b of balloons)if(b.state==='canopy'||b.state==='float')drawBalloon(b,b.x,b.y);
  // streamers
  for(const s of streamers)drawRibbonStrip(s.pts,RIBC[s.ci],16);
  // depth-sorted: hog, animals, table
  const ds=[{y:L.hog.y+100,f:drawHog}];
  for(const a of animals)ds.push({y:a.y,f:()=>drawAnimal(a)});
  if(G.tableT>0)ds.push({y:L.table.y+60,f:()=>{drawTable();for(const f of foods)if(f.state==='table'||f.state==='back'||f.state==='respawn'){if(f.state==='respawn')continue;const g=f.grow<1?easeOutBack(f.grow):1;drawFood(f,f.x,f.y+hintBounce(f),g*(G.tableT||1));}}});
  ds.sort((a,b)=>a.y-b.y);
  for(const d of ds){d.f();if(d.f===drawHog){for(const c of caps)if(c.state==='attached'){ctx.save();ctx.translate(hog.x,hog.y);ctx.rotate(hog.tilt);ctx.scale(1+hog.sq,1-hog.sq);drawPuffSet(capAttachedPuffs(c),c.seed);const a=spikes[c.c].a;goldFlower(Math.cos(a)*(SB+46),Math.sin(a)*(SB+46),4.5);ctx.restore();}
      for(const b of bands)drawBand(b);}}
  // basket
  drawBasketBack();
  for(const c of caps)if(c.state==='basket'||c.state==='return')drawCapFree(c,hintBounce(c));
  drawBasketFront();
  drawRibbon(hintBounce(rib));
  // eaten food in paws
  for(const f of foods)if(f.state==='eaten'||f.state==='fly')drawFood(f,f.x,f.y,f.state==='eaten'?.7*Math.max(.3,f.grow):.9);
  // balloons on strings
  for(const b of balloons){if(b.state==='dead'||b.state==='canopy'||b.state==='float')continue;const by=b.y+(b.state==='stock'?Math.sin(T*1.2+b.seed)*4:0);drawBalloon(b,b.x,by);}
  // held / flying things on top
  for(const c of caps)if(c.state==='held'||c.state==='hop'||c.state==='fly')drawCapFree(c,0);
  for(const f of foods)if(f.state==='held')drawFood(f,f.x,f.y,1.25);
  drawParts();
  drawDemo();
}
function drawBasketBack(){const b=L.basket;ctx.fillStyle='rgba(30,40,90,.2)';ell(b.x+6,b.y+40,112,16);ctx.fill();glaze(b.x,b.y-36,98,24,{l:'#d9b57c',b:'#9c6a33',d:'#4c2c10'});}
function drawBasketFront(){
  const b=L.basket;ctx.save();ctx.translate(b.x,b.y);
  ctx.beginPath();ctx.moveTo(-98,-36);ctx.quadraticCurveTo(-92,30,-62,38);ctx.lineTo(62,38);ctx.quadraticCurveTo(92,30,98,-36);ctx.quadraticCurveTo(0,-14,-98,-36);ctx.closePath();
  const g=ctx.createLinearGradient(0,-36,0,40);g.addColorStop(0,'#3a62b8');g.addColorStop(.5,'#23479a');g.addColorStop(1,'#122a63');ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();ctx.strokeStyle='rgba(255,245,220,.35)';ctx.lineWidth=2;for(let x=-110;x<110;x+=14){ctx.beginPath();ctx.moveTo(x,-40);ctx.lineTo(x+30,44);ctx.stroke();ctx.beginPath();ctx.moveTo(x+30,-40);ctx.lineTo(x,44);ctx.stroke();}
  goldFlower(0,8,6);vine(8,8,40,.1,1);vine(-8,8,40,PI-.1,1);ctx.restore();
  ctx.strokeStyle=GOLD;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-98,-36);ctx.quadraticCurveTo(0,-14,98,-36);ctx.stroke();ctx.strokeStyle=rgba(GOLDL,.8);ctx.lineWidth=1.5;ctx.stroke();
  shine(-60,-16,16,5,.35,.2);
  ctx.restore();
}
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return;}
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,.1);acc+=dt;let n=0;
  try{while(acc>=STEP&&n<4){step(STEP);acc-=STEP;n++;}if(n>=4)acc=0;render();}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
}
// debug hook for automated checks (no UI)
window.__hog={get state(){return{phase:G.phase,att:balloons.filter(b=>b.state==='attached').length,cov:spikes.filter(s=>s.covT).length,caps:caps.length,balloons:balloons.length,parts:parts.length,anchors:anchors.length,bands:bands.length,feeds:G.feeds,rib:rib.state,animals:animals.map(a=>a.mode+':'+a.fed)};},
  w2s:(x,y)=>({x:OX+x*S,y:OY+y*S}),
  pos(){return{hog:{x:hog.x,y:hog.y},caps:caps.map(c=>({x:c.x,y:c.y,s:c.state})),rib:rib.pts.length?rib.pts.map(p=>({x:p.x,y:p.y})):[],spikes:spikes.map(s=>{const a=s.a;const p=h2w(Math.cos(a)*(SB+44),Math.sin(a)*(SB+44));return{x:p.x,y:p.y,c:s.covT};}),
    balloons:balloons.map(b=>({x:b.x,y:b.y,s:b.state})),foods:foods.map(f=>({x:f.x,y:f.y,s:f.state,t:f.type})),animals:animals.map(a=>({x:a.x,y:a.y,k:a.kind,m:a.mode})),nodes:canopy?canopy.nodes.map(n=>({x:n.rx+n.dx,y:n.ry+n.dy})):[]};},
  bad(){const bad=[];for(const b of balloons)if(!Number.isFinite(b.x+b.y))bad.push('b');if(!Number.isFinite(hog.x+hog.y+hog.tilt))bad.push('h');for(const p of rib.pts)if(!Number.isFinite(p.x+p.y))bad.push('r');return bad;}};
resize();newGame();
requestAnimationFrame(t=>{last=t;frame(t);});
})();
