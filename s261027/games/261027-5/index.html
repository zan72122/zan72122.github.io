const SAFE={t:0,r:0,b:0,l:0};
const TAU=Math.PI*2, D2R=Math.PI/180, PI=Math.PI;

/* ================= math ================= */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function sm(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function eOut(t){t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t)}
function eBack(t){t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1)}
function rnd(a,b){return a+Math.random()*(b-a)}
function srand(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]}
function madd(o,a,s,d,t){return [o[0]+a[0]*s+d[0]*t,o[1]+a[1]*s+d[1]*t,o[2]+a[2]*s+d[2]*t]}
function lerp3(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function d2(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}
function pulse(t,per,w){const x=((t%per)+per)%per/per;return x<w?Math.sin(x/w*PI):0}

/* ================= colors ================= */
const colCache=new Map();
function rgbA(c){let v=colCache.get(c);if(!v){const n=parseInt(c.slice(1),16);v=[(n>>16)&255,(n>>8)&255,n&255];colCache.set(c,v);}return v}
function shade(c,k,mix,mk){const a=rgbA(c);let r=a[0]*k,g=a[1]*k,b=a[2]*k;
  if(mix){const m=rgbA(mix);r=lerp(r,m[0],mk);g=lerp(g,m[1],mk);b=lerp(b,m[2],mk);}

const PAPERW='#fffdf6', EDGE='#fcf6e9', EDGEL='rgba(160,128,92,0.5)', OUTL='rgba(110,82,58,0.30)';

/* ================= constants ================= */
const HW=1.0,HD=0.75,HH=0.95,TH=0.03,OV=0.1,LIP=0.17,DOORV=0.42,DOORR=0.28,WINA=0.64,WINV=0.6,WINS=0.13,RIMD=0.09;

const TYPES=[

 {wE:'#c6ead6',wI:'#e4f4ea',roofE:'#72c39f',roofI:'#a3dbc0',acc:'#f6a2bc',r:0.64,pat:1,bl:'#a6dfc6',blD:'#74c3a3',blP:'#fff3f8',star:'#f7b0c6'},
 {wE:'#dbcff2',wI:'#eee7f8',roofE:'#9d84d5',roofI:'#c0afe6',acc:'#f2c45a',r:0.86,pat:2,bl:'#cbbaee',blD:'#a58fda',blP:'#fff6dc',star:'#f2c450'}
];

 {body:'#f5a95e',dark:'#de8a3f',chest:'#fde3c2',ear:'#f6b2a1',eye:'#7d9a3a',size:1.0,stripe:'#d27833',curl:1,bed:'#f6c793',bedIn:'#fdeedc'},
 {body:'#b0b7c6',dark:'#939bad',chest:'#e1e5ec',ear:'#f2b4c5',eye:'#38435e',size:0.86,big:1,bed:'#c2b6e8',bedIn:'#eee9fb'}

/* ================= camera ================= */
const cam={pitch:0.8,dist:12,F:500,cx:0,cy:0,C:[0,0,0],u:[0,1,0],f:[0,0,-1],T:[0,0,0]};
const FIT=[[-3.0,0,1.55],[3.0,0,1.55],[-3.2,0,3.95],[3.2,0,3.95],[0,0,4.7],[-3.7,1.35,-4.4],[3.7,1.35,-4.4],[0,3.4,-3.15],[-3.75,0,-2.4],[3.75,0,-2.4],[-3.75,1.7,-3.15],[3.75,1.7,-3.15]];
function camSetup(){
  const a=W/H, t=clamp((a-0.46)/(1.45-0.46),0,1);
  const port=a<0.8;
  const os=STACK.slice(), ob=BLANK.slice();
  if(port){STACK[0]=-1.8;STACK[1]=5.3;BLANK[0]=1.8;BLANK[1]=5.25;} else {STACK[0]=-2.45;STACK[1]=3.8;BLANK[0]=2.45;BLANK[1]=3.65;}
  const b=G.blanket; if(b&&b.st==='idle'&&Math.hypot(b.x-ob[0],b.z-ob[1])<0.05){b.x=BLANK[0];b.z=BLANK[1];}
  FIT[2][0]=STACK[0]-0.8;FIT[2][2]=STACK[1]+0.4;FIT[3][0]=BLANK[0]+0.75;FIT[3][2]=BLANK[1]+0.4;FIT[4][2]=Math.max(4.7,STACK[1]+0.6);
  cam.pitch=lerp(port?40:44,38,t)*D2R; cam.dist=port?9.5:lerp(11,12.5,t);
  cam.T=[0,0,lerp(0.25,0.1,t)];
  const sp=Math.sin(cam.pitch),cp=Math.cos(cam.pitch);
  cam.C=[cam.T[0],cam.T[1]+cam.dist*sp,cam.T[2]+cam.dist*cp];
  cam.f=[0,-sp,-cp]; cam.u=[0,cp,-sp];
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(const p of FIT){const dx=p[0]-cam.C[0],dy=p[1]-cam.C[1],dz=p[2]-cam.C[2];
    const vz=dy*cam.f[1]+dz*cam.f[2], vy=dy*cam.u[1]+dz*cam.u[2];
    const nx=dx/vz, ny=vy/vz; mnx=Math.min(mnx,nx);mxx=Math.max(mxx,nx);mny=Math.min(mny,ny);mxy=Math.max(mxy,ny);}
  const pad=6;
  const aw=Math.max(50,W-SAFE.l-SAFE.r-pad*2), ah=Math.max(50,H-SAFE.t-SAFE.b-pad*2);
  cam.F=Math.min(aw/(mxx-mnx),ah/(mxy-mny));
  cam.cx=SAFE.l+pad+aw/2-cam.F*(mnx+mxx)/2;
  const used=cam.F*(mxy-mny), extra=ah-used;
  // put extra space mostly above (sky / garden), a little below
  cam.cy=SAFE.t+pad+extra*0.62+cam.F*mxy;
}
function proj(x,y,z){const dx=x-cam.C[0],dy=y-cam.C[1],dz=z-cam.C[2];
  let vz=dy*cam.f[1]+dz*cam.f[2]; const vy=dy*cam.u[1]+dz*cam.u[2]; if(vz<0.2)vz=0.2;
  return [cam.cx+cam.F*dx/vz, cam.cy-cam.F*vy/vz, vz]}
function projP(p){return proj(p[0],p[1],p[2])}
function pxw(z3){return cam.F/z3}
function unprojY(sx,sy,yp){const nx=(sx-cam.cx)/cam.F, ny=-(sy-cam.cy)/cam.F;
  const dx=nx, dy=cam.f[1]+ny*cam.u[1], dz=cam.f[2]+ny*cam.u[2];
  if(dy>-1e-4) return null; const t=(yp-cam.C[1])/dy; return [cam.C[0]+t*dx,yp,cam.C[2]+t*dz]}
function rayPlane(sx,sy,P0,n){const nx=(sx-cam.cx)/cam.F, ny=-(sy-cam.cy)/cam.F;
  const d=[nx,cam.f[1]+ny*cam.u[1],cam.f[2]+ny*cam.u[2]]; const den=dot(d,n); if(Math.abs(den)<1e-5)return null;
  const t=dot([P0[0]-cam.C[0],P0[1]-cam.C[1],P0[2]-cam.C[2]],n)/den; if(t<0)return null;
  return [cam.C[0]+d[0]*t,cam.C[1]+d[1]*t,cam.C[2]+d[2]*t]}

/* ================= sound ================= */
const SND={ctx:null,master:null,noise:null,slideG:null,ok:false};
function audioStart(){
  try{
    if(SND.ctx){ if(SND.ctx.state!=='running'){const p=SND.ctx.resume(); if(p&&p.catch)p.catch(()=>{});} return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=new AC(); SND.ctx=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-20; comp.knee.value=12; comp.ratio.value=4; comp.connect(c.destination);
    const m=c.createGain(); m.gain.value=0.5; m.connect(comp); SND.master=m;
    const len=c.sampleRate|0; const b=c.createBuffer(1,len,c.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; SND.noise=b;
    const s=c.createBufferSource(); s.buffer=b; s.loop=true; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    const g=c.createGain(); g.gain.value=0; s.connect(f); f.connect(g); g.connect(m); s.start(); SND.slideG=g;
    const o=c.createBufferSource(); o.buffer=c.createBuffer(1,1,22050); o.connect(c.destination); o.start(0);
    if(c.state!=='running'){const p=c.resume(); if(p&&p.catch)p.catch(()=>{});}
    SND.ok=true;
  }catch(e){SND.ok=false;}
}
function nz(dur,type,freq,q,gain,att,delay){ if(!SND.ok)return; try{
  const c=SND.ctx,t=c.currentTime+(delay||0); att=att||0.004;
  const s=c.createBufferSource(); s.buffer=SND.noise; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dur);
  s.connect(f); f.connect(g); g.connect(SND.master); s.start(t,Math.random()*0.6); s.stop(t+att+dur+0.05);
}catch(e){} }
function tn(f0,f1,dur,type,gain,att,delay){ if(!SND.ok)return; try{
  const c=SND.ctx,t=c.currentTime+(delay||0); att=att||0.004;
  const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+att+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t+att+dur+0.05);
}catch(e){} }
const SFX={
  lift(){nz(0.15,'bandpass',2400,0.7,0.07,0.03);},
  crease(i){i=clamp(i,0.3,1);nz(0.018,'highpass',1900,0.7,0.05*i);nz(0.018,'highpass',2300,0.7,0.04*i,0.002,0.045);},
  patan(){tn(190,82,0.14,'sine',0.32);nz(0.08,'lowpass',1500,0.8,0.22,0.002);},
  patta(){tn(250,120,0.1,'triangle',0.17);nz(0.06,'lowpass',2100,0.7,0.2,0.002);tn(1046,1040,0.35,'sine',0.035,0.01,0.07);},
  tear(){nz(0.012,'highpass',2600,0.7,0.035);},
  pop(){tn(560,190,0.16,'sine',0.36,0.003);nz(0.03,'bandpass',1100,1,0.12,0.001);},
  ko(v){tn(820,640,0.05,'triangle',0.1*v+0.03);},
  fusa(){nz(0.38,'lowpass',820,0.6,0.17,0.09);},
  land(){tn(210,110,0.09,'sine',0.24);},
  thump(){tn(120,70,0.12,'sine',0.2);},
  flip(){nz(0.07,'bandpass',1700,0.9,0.07,0.01);},
  sniff(){nz(0.05,'bandpass',1300,2,0.035,0.01);nz(0.05,'bandpass',1300,2,0.035,0.01,0.1);},
  tap(){tn(330,300,0.06,'sine',0.045);},
  rise(){tn(300,620,0.5,'triangle',0.045,0.05);},
  chime(){tn(784,780,0.5,'sine',0.06,0.01);tn(1175,1170,0.6,'sine',0.04,0.01,0.09);},
  ping(i){const f=523*Math.pow(1.1225,i%9);tn(f,f*0.995,0.35,'sine',0.045,0.006);},
  mew(i){ if(!SND.ok)return; try{const c=SND.ctx,t=c.currentTime,b=[690,600,800][i]||680;
    const o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(b,t); o.frequency.linearRampToValueAtTime(b*1.22,t+0.12); o.frequency.linearRampToValueAtTime(b*0.82,t+0.36);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1700; const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.connect(f); f.connect(g); g.connect(SND.master); o.start(t); o.stop(t+0.45);}catch(e){} },
  purr(dur,vol){ if(!SND.ok)return; dur=dur||1.6; vol=vol||0.14; try{const c=SND.ctx,t=c.currentTime;
    const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=44+Math.random()*10;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=230;
    const am=c.createGain(); am.gain.value=0.5; const lfo=c.createOscillator(); lfo.frequency.value=22+Math.random()*4; const lg=c.createGain(); lg.gain.value=0.5;
    lfo.connect(lg); lg.connect(am.gain); const env=c.createGain(); env.gain.setValueAtTime(0.0001,t); env.gain.linearRampToValueAtTime(vol,t+0.25);
    env.gain.setValueAtTime(vol,t+Math.max(0.3,dur-0.4)); env.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(lp); lp.connect(am); am.connect(env); env.connect(SND.master); o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);}catch(e){} },
  chord(){ const ns=[523.25,659.25,783.99,1046.5,1318.5]; ns.forEach((f,i)=>{tn(f,f*0.998,1.8,'sine',0.065,0.012,i*0.11);tn(f/2,f/2,1.6,'sine',0.03,0.02,i*0.11);}); }
};
function slideSound(v){ if(!SND.ok||!SND.slideG)return; try{SND.slideG.gain.setTargetAtTime(clamp(v,0,0.13),SND.ctx.currentTime,0.06);}catch(e){} }

/* ================= paper grain ================= */
let grain=null;
function makeGrain(){
  const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d');
  for(let i=0;i<520;i++){g.fillStyle=Math.random()<0.5?'rgba(255,255,255,0.30)':'rgba(140,110,70,0.09)';g.fillRect(Math.random()*96,Math.random()*96,1+Math.random()*1.4,1);}
  g.lineWidth=0.6;
  for(let i=0;i<34;i++){g.strokeStyle='rgba(150,120,80,0.08)';g.beginPath();const x=Math.random()*96,y=Math.random()*96;g.moveTo(x,y);g.quadraticCurveTo(x+rnd(-6,6),y+rnd(-6,6),x+rnd(-9,9),y+rnd(-9,9));g.stroke();}
  grain=ctx.createPattern(c,'repeat');
}

/* ================= house geometry ================= */
function rectP(a0,a1,v0,v1){return [[a0,v0],[a1,v0],[a1,v1],[a0,v1]]}
function setXf(h){
  const s=h.scale, sqY=1-h.sq, sqX=1+h.sq*0.45;
  const cyw=Math.cos(h.yaw), syw=Math.sin(h.yaw), cr=Math.cos(h.rock), sr=Math.sin(h.rock);
  const lift=Math.abs(sr)*HW*s; const tx=h.x+h.ox, tz=h.z+h.oz, ty=h.y+lift;
  h.P=function(p){const x=p[0]*s*sqX,y=p[1]*s*sqY,z=p[2]*s*sqX;const x2=x*cr-y*sr,y2=x*sr+y*cr;return [x2*cyw+z*syw+tx,y2+ty,-x2*syw+z*cyw+tz]};
  h.Vv=function(p){const x=p[0]*s*sqX,y=p[1]*s*sqY,z=p[2]*s*sqX;const x2=x*cr-y*sr,y2=x*sr+y*cr;return [x2*cyw+z*syw,y2,-x2*syw+z*cyw]};
}
function chain(h,out,O,A,E0,sgn,links){

/* ---------- bridges between houses ---------- */
function bridgePts(hA,hB){
  const yA=TH+HH+hA.r*0.5, yB=TH+HH+hB.r*0.5;
  const a=[hA.x+HW+OV*0.6,yA,hA.z], b=[hB.x-HW-OV*0.6,yB,hB.z];
  return {a,b,m:[(a[0]+b[0])/2,(a[1]+b[1])/2+0.02,(a[2]+b[2])/2]};
}
function drawBridge(hA,hB){
  const uA=hA.brR, uB=hB.brL; if(uA<=0&&uB<=0)return;
  const B=bridgePts(hA,hB);
  const half=(o,u,dir)=>{ if(u<=0)return; const tgt=[B.m[0]-o[0],B.m[1]-o[1]]; const ang1=Math.atan2(tgt[1],tgt[0]*dir); const len=Math.hypot(tgt[0],tgt[1])+0.04;
    const ang=lerp(-PI/2,ang1,eBack(u)); const dx=Math.cos(ang)*len*dir, dy=Math.sin(ang)*len;
    const wz=0.22; const p=[[o[0],o[1],o[2]-wz],[o[0]+dx,o[1]+dy,o[2]-wz],[o[0]+dx,o[1]+dy,o[2]+wz],[o[0],o[1],o[2]+wz]];
    const sp=p.map(projP); const dn=p.map(q=>proj(q[0],q[1]-0.04,q[2]));
    ctx.beginPath(); pathPts(dn); ctx.fillStyle=EDGE; ctx.fill(); ctx.strokeStyle=EDGEL; ctx.lineWidth=0.8; ctx.stroke();
    ctx.beginPath(); pathPts(sp); ctx.fillStyle=shade('#f7e9cf',0.98); ctx.fill(); if(grain){ctx.globalAlpha=0.5;ctx.fillStyle=grain;ctx.fill();ctx.globalAlpha=1;}
    ctx.strokeStyle=OUTL; ctx.stroke();
    // bunting
    const n=3; for(let i=0;i<n;i++){const t0=(i+0.15)/n,t1=(i+0.85)/n; const q0=[o[0]+dx*t0,o[1]+dy*t0,o[2]+wz], q1=[o[0]+dx*t1,o[1]+dy*t1,o[2]+wz];
      const s0=projP(q0), s1=projP(q1); const k=pxw(s0[2]);
      ctx.beginPath(); ctx.moveTo(s0[0],s0[1]); ctx.lineTo(s1[0],s1[1]); ctx.lineTo((s0[0]+s1[0])/2,(s0[1]+s1[1])/2+0.13*k*u); ctx.closePath();

/* ---------- blanket ---------- */
function drawBlanketGrid(grid,N,col,colD,colP,alpha){

  // far rows first (lower j = far)
  for(let j=0;j<N-1;j++)for(let i=0;i<N-1;i++){
    const a=grid[j*N+i],b=grid[j*N+i+1],c=grid[(j+1)*N+i+1],d=grid[(j+1)*N+i];
    const n=norm(cross([c[0]-a[0],c[1]-a[1],c[2]-a[2]],[b[0]-d[0],b[1]-d[1],b[2]-d[2]]));
    const nn=n[1]<0?[-n[0],-n[1],-n[2]]:n;

    const sa=S[j*N+i],sb=S[j*N+i+1],sc=S[(j+1)*N+i+1],sd=S[(j+1)*N+i];
    ctx.beginPath(); ctx.moveTo(sa[0],sa[1]); ctx.lineTo(sb[0],sb[1]); ctx.lineTo(sc[0],sc[1]); ctx.lineTo(sd[0],sd[1]); ctx.closePath();
    const fc=shade(col,kk); ctx.fillStyle=fc; ctx.fill(); ctx.strokeStyle=fc; ctx.lineWidth=1; ctx.stroke();
  }

  const per=[]; for(let i=0;i<N;i++)per.push(S[i]); for(let j=1;j<N;j++)per.push(S[j*N+N-1]); for(let i=N-2;i>=0;i--)per.push(S[(N-1)*N+i]); for(let j=N-2;j>0;j--)per.push(S[j*N]);
  ctx.beginPath(); pathPts(per); ctx.lineWidth=1.2; ctx.strokeStyle=shade(colD,0.85); ctx.stroke();
  const inset=[]; const m=(N-1)/2;
  for(const p of per){} // keep simple
  const cx=S[Math.floor(N*N/2)];
  ctx.setLineDash([3,3]); ctx.lineWidth=1.1; ctx.strokeStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); const ins=per.map(p=>[lerp(p[0],cx[0],0.14),lerp(p[1],cx[1],0.14)]); pathPts(ins); ctx.stroke(); ctx.setLineDash([]);

  spots.forEach((q,i)=>{ if(q[0]>=N||q[1]>=N)return; const p=S[q[1]*N+q[0]]; const r=Math.max(1.5,k*0.55);
    if(i%2){ctx.fillStyle=colP;ctx.beginPath();starPath(ctx,p[0],p[1],r,-PI/2,0.45);ctx.fill();}
    else flowerAt(ctx,p[0],p[1],r*0.45,colP,'#f6cf5c'); });
  ctx.globalAlpha=1;
}
const BN=5;
function blanketGridFree(b){
  const g=[]; const bx=0.62*b.sc, bz=0.48*b.sc; const curl=b.st==='idle'?1:0.3;
  const vel=[b.vx,b.vz]; const t=G.t;
  for(let j=0;j<BN;j++)for(let i=0;i<BN;i++){
    const u=i/(BN-1)*2-1, v=j/(BN-1)*2-1;
    let x=u*bx, z=v*bz, y=0.025+0.06*(1-u*u)*(1-v*v)*b.sc+0.01*Math.sin(t*2+u*2+v);
    const c=Math.max(0,(u+v-1.0)/1.0)*curl; y+=0.2*c*c; x-=0.13*c*c; z-=0.13*c*c;
    if(b.st==='drag'){const dd=Math.hypot(u-b.gu,v-b.gv)/2.8; x-=vel[0]*0.11*dd; z-=vel[1]*0.11*dd; y+=0.14*Math.max(0,1-dd*2.2)-0.01;}
    y+=b.wig*0.1*Math.sin(t*14+u*3)*(1-v*v);
    g.push([b.x+b.ox+x,b.y+y,b.z+b.oz+z]);
  }
  return g;
}
function drawInsideBlanket(h){
  const e=eBack(h.blIn); const bx=0.84*lerp(0.35,1,e), bz=0.6*lerp(0.35,1,e);
  const g=[];
  for(let j=0;j<BN;j++)for(let i=0;i<BN;i++){const u=i/(BN-1)*2-1,v=j/(BN-1)*2-1;
    const corner=Math.pow(Math.abs(u*v),2);
    const y=TH+0.03+0.07*(1-u*u)*(1-v*v)*e+0.07*corner*e;
    g.push(h.P([u*bx,y,v*bz+0.05]));}
  // reorder so far (negative z) first: v from -1 (back) to 1 (front) already
  drawBlanketGrid(g,BN,h.blCol,h.blColD,h.blColP);
}

function catPaths(list){

  for(const s of list){ctx.beginPath();s[1]();if(s[0]==='s'){ctx.lineWidth=s[3];ctx.strokeStyle=s[2];ctx.stroke();}else{ctx.fillStyle=s[2];ctx.fill();}}
}
function earsPath(hx,hy,tw,sc){sc=sc||1;

function buildBG(){

    const ring=(rx,rz,y)=>{const o=[];for(let j=0;j<24;j++){const a=j/24*TAU;o.push(proj(x+Math.cos(a)*rx,y,z+Math.sin(a)*rz));}return o;};
    const sh=ring(0.98,0.78,0); b.fillStyle='rgba(50,80,40,0.16)'; b.beginPath(); b.moveTo(sh[0][0]+4,sh[0][1]+3); for(const p of sh)b.lineTo(p[0]+4,p[1]+3); b.closePath(); b.fill();

    b.fillStyle=K.bed; b.beginPath(); b.moveTo(o2[0][0],o2[0][1]); for(const p of o2)b.lineTo(p[0],p[1]); b.closePath(); b.fill();

/* ================= stack of paper ================= */
function drawStack(){
  const n=G.stackN; const order=[];
  for(let i=0;i<n;i++)order.push(i);
  const types=G.state==='free'||G.state==='reset'?[2,1,0]:(G.built===0?[2,1]:G.built===1?[2]:[]);
  const wig=G.stackWig;
  for(let i=0;i<n;i++){
    const tp=types[i]!==undefined?types[i]:0; const T=TYPES[tp];
    const y=0.03+i*0.05, rot=(srand(i+3)-0.5)*0.25;
    const top=i===n-1; const lift=top?(0.12*wig+0.05*pulse(G.t,5,0.15)*(G.state==='free'?1:0)):0;
    const cr=Math.cos(rot), sr=Math.sin(rot);
    const loc=[[-0.78,-0.55],[0.78,-0.55],[0.78,0.55],[-0.78,0.55]];
    const w=loc.map((q,j)=>{const x=q[0]*cr-q[1]*sr, z=q[0]*sr+q[1]*cr; const lf=(j===2||j===1)?lift:0; return [STACK[0]+x,y+lf,STACK[1]+z];});
    ctx.beginPath(); pathPts(w.map(p=>proj(p[0],p[1]-0.04,p[2]))); ctx.fillStyle=EDGE; ctx.fill(); ctx.strokeStyle=EDGEL; ctx.lineWidth=0.8; ctx.stroke();
    ctx.beginPath(); pathPts(w.map(projP)); ctx.fillStyle=shade(T.wI,0.97); ctx.fill(); if(grain){ctx.globalAlpha=0.5;ctx.fillStyle=grain;ctx.fill();ctx.globalAlpha=1;}
    ctx.strokeStyle=OUTL; ctx.lineWidth=1; ctx.stroke();
    if(top){ const c=projP([STACK[0],y,STACK[1]]); const k=pxw(c[2]);
      ctx.strokeStyle='rgba(150,115,80,0.35)'; ctx.setLineDash([4,3]); ctx.beginPath(); const p0=projP(lerp3(w[0],w[1],0.33)),p1=projP(lerp3(w[3],w[2],0.33)); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]);
      const p2=projP(lerp3(w[0],w[1],0.66)),p3=projP(lerp3(w[3],w[2],0.66)); ctx.moveTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=T.roofI; ctx.globalAlpha=0.8; ctx.beginPath(); starPath(ctx,c[0],c[1],0.11*k,-PI/2,0.45); ctx.fill(); ctx.globalAlpha=1; }
  }
  const c=projP([STACK[0],0.1,STACK[1]]); G.stackScr=[c[0],c[1],pxw(c[2])*0.85];
}

function updOrn(dt){

/* ================= house shadows ================= */
function shadowPoly(pts){ // project to ground along light
  return pts.map(p=>{const t=p[1]/LIGHT[1]; return proj(p[0]-LIGHT[0]*t,0,p[2]-LIGHT[2]*t);}); }
function drawShadows(){
  ctx.beginPath();
  for(const h of houses){ if(!h.faces)continue; for(const f of h.faces){ if(f.g==='base')continue; pathPts(shadowPoly(f.w)); } }
  ctx.fillStyle='rgba(50,80,40,0.16)'; ctx.fill('nonzero');
  ctx.lineWidth=5; ctx.strokeStyle='rgba(50,80,40,0.05)'; ctx.stroke();
  // contact shadow under flat paper / bases
  for(const h of houses){ if(!h.fk.base)continue; const b=h.fk.base; const s=b.w.map(p=>proj(p[0]+0.05,0,p[2]+0.04));
    ctx.beginPath(); pathPts(s); ctx.fillStyle='rgba(50,80,40,0.14)'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle='rgba(50,80,40,0.06)'; ctx.stroke(); }
}

/* ================= interaction helpers ================= */
function pip(pts,p){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];
  if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1]+1e-9)+a[0]))ins=!ins;}return ins}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const l=dx*dx+dy*dy||1;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l;t=clamp(t,0,1);return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function polyDist(pts,p){if(pip(pts,p))return 0;let m=1e9;for(let i=0,j=pts.length-1;i<pts.length;j=i++)m=Math.min(m,segDist(p,pts[i],pts[j]));return m}
function hitHouse(h,p,margin,groups){let best=null,bd=1e9;for(const f of h.faces||[]){if(groups&&groups.indexOf(f.g)<0)continue;const d=polyDist(f.s,p);if(d<bd){bd=d;best=f;}}return bd<=margin?best:null}
function hitScale(){return Math.max(1,Math.min(W,H)/400)}

/* ---------- flap mapping ---------- */
function flapLen(h,fl){return (fl==='F'||fl==='B')?HH+h.L:HH+h.r}
function flapPt(h,fl,a,v,th){let p;
  if(fl==='F')p=[a,TH+v*Math.sin(th),HD+v*Math.cos(th)];
  else if(fl==='B')p=[a,TH+v*Math.sin(th),-HD-v*Math.cos(th)];
  else if(fl==='L')p=[-HW-v*Math.cos(th),TH+v*Math.sin(th),a];
  else p=[HW+v*Math.cos(th),TH+v*Math.sin(th),a];
  return h.P(p);}
function roofPt(h,pp){const rf=pp*h.beta; const top=[0,TH+HH,HD]; const V=h.L*0.92; return h.P([0,top[1]+Math.cos(rf)*V,top[2]-Math.sin(rf)*V]);}

/* ================= input ================= */
const IN={id:null,mode:null,down:[0,0],p:[0,0],t0:0,moved:0,d:null,lastP:[0,0],lastT:0};
function evPos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function onDown(p){
  const hs=hitScale(); const st=G.state, h=G.cur;
  IN.mode=null; IN.d={};
  // --- current task targets ---
  if(h&&st==='walls'&&!h.wCommit){
    const f=hitHouse(h,p,34*hs);
    if(f){ let fl;
      if(f.g==='Fw'||f.g==='Fr')fl='F'; else if(f.g==='Bw'||f.g==='Br')fl='B'; else if(f.g==='L'||f.g==='R')fl=f.g;
      else { const gp=unprojY(p[0],p[1],0)||[h.x,0,h.z]; const lx=gp[0]-h.x, lz=gp[2]-h.z; fl=Math.abs(lx)/HW>Math.abs(lz)/HD?(lx<0?'L':'R'):(lz>0?'F':'B'); }
      const gp=unprojY(p[0],p[1],0)||[h.x,0,h.z]; const lx=gp[0]-h.x, lz=gp[2]-h.z;
      let a,v; if(fl==='F'){a=lx;v=lz-HD;}else if(fl==='B'){a=lx;v=-lz-HD;}else if(fl==='L'){a=lz;v=-lx-HW;}else{a=lz;v=lx-HW;}
      const len=flapLen(h,fl); a=clamp(a,-HD,HD); v=clamp(v,len*0.6,len*0.95);
      IN.mode='wall'; IN.d={fl,a,v,start:projP(flapPt(h,fl,a,v,h['w'+fl].a)),maxA:0};
      h.wDrag=fl; h.wMaster=Math.max(h['w'+fl].a,22*D2R); IN.d.maxA=h.wMaster; SFX.lift(); return; }
  }
  if(h&&st==='roof'&&!h.rCommit){
    const f=hitHouse(h,p,46*hs,['Fr','Br','Fw','Bw','L','R']);
    if(f){ IN.mode='roof'; IN.d={p0:h.rF.a/h.beta}; h.rDrag=true; h.rTgt=Math.max(h.rTgt,0.12); SFX.lift(); return; }
  }
  if(h&&st==='door'&&!h.popped&&!h.ticking){
    const c=projP(fW(h.fk.fwall,0,DOORV)); const r=Math.max(40*hs,pxw(c[2])*DOORR*1.8);
    if(d2(c,p)<r){ IN.mode='door'; h.pressTgt=1; h.ticking=true; SFX.crease(0.8); return; }
  }
  // blanket (always draggable unless inserting)
  const b=G.blanket;
  if(b&&b.st==='idle'&&b.arrive>=1){ const c=projP([b.x,0.08,b.z]); const k=pxw(c[2]); const r=Math.max(st==='blanket'?52*hs:38*hs,0.7*k);
    if(d2(c,p)<r){ const gp=unprojY(p[0],p[1],0)||[b.x,0,b.z]; IN.mode='blanket'; IN.d={off:[b.x-gp[0],b.z-gp[2]]}; b.st='drag'; b.gu=clamp((gp[0]-b.x)/0.62,-1,1); b.gv=clamp((gp[2]-b.z)/0.48,-1,1); SFX.fusa(); return; } }
  if(h&&st==='deliver'){
    const f=hitHouse(h,p,40*hs); const hc=projP([h.x,0.5,h.z]);
    if(f||d2(hc,p)<60*hs){ const gp=unprojY(p[0],p[1],0)||[h.x,0,h.z]; IN.mode='house'; IN.d={off:[h.x-gp[0],h.z-gp[2]],last:[h.x,h.z]}; h.hop=0; SFX.lift(); return; }
  }

    c.hops=[]; c.mode='hop'; c.spot=null; hopTo(c,[BEDX[c.i],0,CATZ],0.8,1.6,'stand',()=>{c.mode='wait';}); c.hops[0].from=from; c.hops[0].above=true; c.house=null; c.ov=null; }
    SFX.flip(); });
  G.flags=Math.max(0,G.flags-dt*2); for(let i=0;i<5;i++)G.crown[i]=Math.max(0,G.crown[i]-dt*2.5); G.spin=Math.max(0,G.spin-dt*3);
  for(const h of houses){ h.brL=Math.max(0,h.brL-dt*2); h.brR=Math.max(0,h.brR-dt*2); h.towerX=Math.max(0,h.towerX-dt*2); h.lightT=[0,0,0];
    if(t>0.5){h.rFlat=true;} if(t>1.0){h.wFlat=true;h.crown=false;}
    if(t>1.6){ if(!h.rs)h.rs={x:h.x,z:h.z}; const u=sm((t-1.6)/0.7); h.x=lerp(h.rs.x,STACK[0],u); h.z=lerp(h.rs.z,STACK[1],u); h.scale=lerp(1,0.3,u); h.y=0.5*Math.sin(u*PI); h.fade=1-u*0.9; } }
  for(const d of G.disks){ if(t>1.4){d.x=lerp(d.x,STACK[0],dt*5); d.z=lerp(d.z,STACK[1],dt*5); d.vx=d.vz=0;} }
  if(t>1.0)G.orns=G.orns.filter(o=>!o.att); for(const o of G.orns){o.x=lerp(o.x,STACK[0],dt*4);o.z=lerp(o.z,STACK[1],dt*4);}
  if(t>2.4){ G.stackN=3; G.orns=[]; G.disks=[]; houses=[]; G.built=0; G.gift=null; G.purrAll=0;
    for(const c of cats){c.house=null;} G.stackN=3; G.state='free'; startNextPaper(); G.stackN=2; SFX.chime(); }
}

/* ================= render ================= */
function render(){
  resetT(); ctx.clearRect(0,0,W,H);
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bg,0,0); resetT();
  // flowers
  for(const f of G.flowers){const s=proj(f.x,0,f.z); const k=pxw(s[2])*0.1; const sw=Math.sin(G.t*1.6+f.ph)*0.08+f.wob*Math.sin(G.t*18)*0.4;
    ctx.save(); ctx.translate(s[0],s[1]); ctx.rotate(sw); ctx.strokeStyle='#6fae5e'; ctx.lineWidth=Math.max(1,k*0.12); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-k*1.4); ctx.stroke();
    ctx.fillStyle='#86c477'; ctx.beginPath(); ctx.ellipse(k*0.3,-k*0.6,k*0.3,k*0.13,-0.5,0,TAU); ctx.fill();
    flowerAt(ctx,0,-k*1.5,k*0.28,f.col,'#f6cf5c'); ctx.restore();}
  // build geometry
  for(const h of houses) buildFaces(h);
  drawShadows();
  // entities
  const ents=[];
  for(const h of houses) ents.push({z:h.z+0.001*h.x,f:()=>drawHouse(h)});
  const bh=bedHouses(); for(let j=0;j<bh.length-1;j++){const a=bh[j],b=bh[j+1]; ents.push({z:a.z+0.05,f:()=>drawBridge(a,b)});}
  for(const c of cats){ if(c.vis!=='world')continue; ents.push({z:c.above?100+c.z:c.z,f:()=>drawCatWorld(c)}); }
  for(const d of G.disks) ents.push({z:d.z,f:()=>drawDiskEnt(d)});
  const b=G.blanket; if(b&&!b.hidden){ ents.push({z:b.z+(b.st==='ins'?2:0),f:()=>drawFreeBlanket(b)}); }
  ents.push({z:STACK[1]-0.3,f:drawStack});
  for(const o of G.orns) if(!o.att) ents.push({z:o.z+(o.drag?50:0),f:()=>drawOrnEnt(o)});
  ents.sort((a,b)=>a.z-b.z);
  for(const e of ents){ try{e.f();}catch(err){ resetT(); ctx.globalAlpha=1; } }
  resetT();
  drawParts();
  // ripples
  for(const r of G.ripples){const u=r.t/0.7; ctx.strokeStyle='rgba(255,255,255,'+(0.7*(1-u))+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(r.x,r.y,8+u*26,(8+u*26)*0.45,0,0,TAU); ctx.stroke();}
  drawHand();
}
function drawFreeBlanket(b){
  const g=blanketGridFree(b);
  const sh=g.map(p=>proj(p[0]+0.04,0,p[2]+0.04));
  ctx.fillStyle='rgba(50,80,40,0.15)'; ctx.beginPath(); const per=[sh[0],sh[BN-1],sh[BN*BN-1],sh[BN*(BN-1)]]; pathPts(per); ctx.fill();
  drawBlanketGrid(g,BN,b.col,b.colD,b.colP);
}

/* ================= loop ================= */
let raf=0,last=0,running=false;
function frame(t){
  raf=requestAnimationFrame(frame);
  let dt=(t-last)/1000; last=t; if(!(dt>0))return; if(dt>0.05)dt=0.05;
  try{
    G.t+=dt; G.idle+=dt;
    updTimers(dt);
    if(IN.id!==null&&IN.mode&&(IN.mode==='house'||IN.mode==='blanket')){ /* keep velocities decaying when finger rests */ const now=performance.now(); if(now-IN.lastT>60){ onMove(IN.p,dt); } }
    for(const h of houses){ setXf(h); updHouse(h,dt); }
    updState(dt);
    for(const h of houses) setXf(h);
    for(const c of cats) updCat(c,dt);
    updFreeCats(dt);
    updBlanket(dt); updDisks(dt); updParts(dt); updOrn(dt); updHint(dt);
    slideSound((G.slideV||0)*0.035);
    if(IN.mode!=='house')G.slideV=(G.slideV||0)*0.85;
    render();
  }catch(e){ window.__err=(e&&e.stack)||String(e); try{resetT();ctx.globalAlpha=1;}catch(_){} }
}
function start(){ if(running)return; running=true; last=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ running=false; cancelAnimationFrame(raf); }

/* ================= events ================= */
function readSafe(){try{const cs=getComputedStyle(saEl);SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function resize(){
  readSafe(); W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight); DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); camSetup(); buildBG();
}
cv.addEventListener('pointerdown',e=>{
  if(e.cancelable)e.preventDefault(); audioStart(); if(IN.id!==null)return;
  IN.id=e.pointerId; try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=evPos(e); IN.down=p; IN.p=p; IN.t0=performance.now(); IN.lastT=IN.t0; IN.moved=0; G.idle=0; G.nextHint=4; endHint();
  try{onDown(p);}catch(err){IN.mode=null;}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==IN.id)return; if(e.cancelable)e.preventDefault(); const p=evPos(e); const now=performance.now();
  const dt=(now-IN.lastT)/1000; IN.lastT=now; IN.moved=Math.max(IN.moved,d2(p,IN.down)); IN.p=p; G.idle=0;
  try{onMove(p,clamp(dt,0.004,0.1));}catch(err){}
},{passive:false});
function endPtr(e,cancel){ if(e.pointerId!==IN.id)return; const p=evPos(e); try{onUp(p,cancel);}catch(err){} IN.mode=null; IN.id=null; try{cv.releasePointerCapture(e.pointerId);}catch(_){} }
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('lostpointercapture',e=>{ if(e.pointerId===IN.id)endPtr(e,true); });
window.addEventListener('blur',()=>{ if(IN.id!==null){ try{onUp(IN.p,true);}catch(e){} IN.id=null; IN.mode=null; } });
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(n=>document.addEventListener(n,e=>{ if(e.cancelable)e.preventDefault(); },{passive:false}));
window.addEventListener('resize',resize); window.addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){stop(); try{if(SND.ctx&&SND.ctx.state==='running'){const p=SND.ctx.suspend();if(p&&p.catch)p.catch(()=>{});}}catch(e){}} else {start(); try{if(SND.ctx){const p=SND.ctx.resume();if(p&&p.catch)p.catch(()=>{});}}catch(e){}} });
window.addEventListener('unhandledrejection',e=>{try{e.preventDefault();}catch(_){}});

makeGrain(); buildFlowers(); initGame(); resize(); start();
// test hook (no UI)
window.__neko={G,cats,get houses(){return houses},cam,proj,projP,fW,HD,DOORV,mouthPt,flapPt,roofPt,BEDX,BEDZ};
})();
</script>
