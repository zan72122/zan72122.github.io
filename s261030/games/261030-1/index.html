<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;};
function prng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

/* ---------- color ---------- */
const shadeCache=new Map();
function shade(hex,amt){
  const k=hex+'|'+amt;let v=shadeCache.get(k);if(v)return v;
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}else{r*=1+amt;g*=1+amt;b*=1+amt;}
  v='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';shadeCache.set(k,v);return v;
}

/* ---------- layout ---------- */
let W=0,H=0,DPR=1,U=1;
const SA={t:0,r:0,b:0,l:0};
const A={};
function readSA(){
  try{const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
const N=36, COS=new Float32Array(N), SIN=new Float32Array(N), DA=TAU/N;
for(let i=0;i<N;i++){COS[i]=Math.cos(i*DA);SIN[i]=Math.sin(i*DA);}
const R0=52;
const LIM=new Float32Array(N);
function layout(){
  const oW=W,oH=H;
  W=Math.max(240,window.innerWidth||390);H=Math.max(240,window.innerHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();
  U=clamp(Math.min(W/390,H/640),.7,2.2);
  const land=W>H*1.05;A.land=land;
  const x0=SA.l,y0=SA.t,sw=W-SA.l-SA.r,sh=H-SA.t-SA.b;
  const P=(nx,ny)=>({x:x0+nx*sw,y:y0+ny*sh});
  A.safe={l:x0+6,t:y0+6,r:x0+sw-6,b:y0+sh-6};
  if(land){
    A.horizon=y0+sh*.33;
    A.hillTop=P(.075,.37);A.gsY=y0+sh*.63;
    A.dough=P(.54,.6);
    A.oven=P(.885,.5);A.chef=P(.79,.66);A.basket=P(.955,.66);
    A.table=P(.73,.88);A.bed=P(.2,.88);A.bunny=P(.36,.9);A.rug=P(.66,.4);
    A.counter={x:A.oven.x-62*U,y:A.oven.y+16*U};
    A.skyCar={x:W*.5,y:H*.62};
    A.clouds={berry:[.15,.3],star:[.4,.16],cotton:[.66,.2],rainbow:[.86,.4]};
  }else{
    A.horizon=y0+sh*.25;
    A.hillTop=P(.09,.255);A.gsY=y0+sh*.4;
    A.dough=P(.5,.6);
    A.oven=P(.84,.785);A.chef=P(.66,.86);A.basket=P(.92,.9);
    A.table=P(.42,.93);A.bed=P(.16,.8);A.bunny=P(.24,.9);A.rug=P(.8,.31);
    A.counter={x:A.oven.x-52*U,y:A.oven.y+20*U};
    A.skyCar={x:W*.5,y:H*.6};
    A.clouds={berry:[.24,.2],star:[.74,.13],cotton:[.27,.42],rainbow:[.76,.38]};
  }
  const ang=35*PI/180;A.slAng=ang;
  A.slD={x:Math.cos(ang),y:Math.sin(ang)};A.slN={x:-Math.sin(ang),y:Math.cos(ang)};
  A.laneGap=15*U;
  A.treeX=stopX(.8*lmax(0),0)+6*U;
  A.tree={x:A.treeX,y:A.gsY-2*U};
  // pull limits
  const c=A.dough;
  for(let i=0;i<N;i++){
    const cx=COS[i],sy=SIN[i];let t=1e9;
    if(cx>1e-6)t=Math.min(t,(A.safe.r-c.x)/cx);if(cx<-1e-6)t=Math.min(t,(A.safe.l-c.x)/cx);
    if(sy>1e-6)t=Math.min(t,(A.safe.b-c.y)/sy);if(sy<-1e-6)t=Math.min(t,(A.safe.t-c.y)/sy);
    LIM[i]=Math.max(R0*1.2,Math.min(R0*3,t/U-6));
  }
  if(oW&&(oW!==W||oH!==H))remap(oW,oH);
  if(typeof D!=='undefined')for(let i=0;i<N;i++){D.base[i]=Math.min(D.base[i],LIM[i]);D.r[i]=Math.min(D.r[i],LIM[i]);}
  buildBg();
  skyGrad=null;
}
function laneTop(k){return{x:A.hillTop.x+A.slN.x*k*A.laneGap+6*U,y:A.hillTop.y+2*U+A.slN.y*k*A.laneGap};}
function lmax(k){const T=laneTop(k);return(A.gsY-4*U-T.y)/A.slD.y;}
function stopX(L,k){const T=laneTop(k);return T.x+A.slD.x*L+.26*L;}
function w2s(x,y){const s=cam.s;return{x:cam.px+(x-cam.px)*s,y:cam.py+(y-cam.py)*s};}

/* ---------- audio ---------- */
let AC=null,master=null,nbuf=null,stO=null,stG=null,stL=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
    master=AC.createGain();master.gain.value=.6;master.connect(comp);comp.connect(AC.destination);
    nbuf=AC.createBuffer(1,AC.sampleRate|0,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.03);
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){AC=null;}
}
function tone(f,d,o){
  o=o||{};if(!AC||AC.state!=='running')return;
  const t=AC.currentTime+(o.delay||0);
  const osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.gl||d));
  const v=o.g==null?.15:o.g,a=o.a||.008;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd||f*.05;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.05);}
  osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+d+.05);
}
function noise(d,o){
  o=o||{};if(!AC||AC.state!=='running')return;
  const t=AC.currentTime+(o.delay||0);
  const s=AC.createBufferSource();s.buffer=nbuf;
  const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+d);f.Q.value=o.q||.8;
  const g=AC.createGain(),v=o.g||.2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.4);s.stop(t+d+.05);
}
function stretchStart(){
  if(!AC||AC.state!=='running')return;
  try{
    if(!stO){
      stO=AC.createOscillator();stO.type='triangle';stO.frequency.value=200;
      const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=7;lg.gain.value=9;l.connect(lg);lg.connect(stO.frequency);l.start();
      stL=AC.createBiquadFilter();stL.frequency.value=1300;stG=AC.createGain();stG.gain.value=0;
      stO.connect(stL);stL.connect(stG);stG.connect(master);stO.start();
    }
    const t=AC.currentTime;stG.gain.cancelScheduledValues(t);stG.gain.setTargetAtTime(.035,t,.04);
  }catch(e){}
}
function stretchSet(e){if(stO&&AC){const t=AC.currentTime;stO.frequency.setTargetAtTime(170+e*3.2,t,.05);stG.gain.setTargetAtTime(e>4?.05:.02,t,.08);}}
function stretchStop(){if(stG&&AC){const t=AC.currentTime;stG.gain.cancelScheduledValues(t);stG.gain.setTargetAtTime(0,t,.05);}}
const last={};
const SFX={
  squish(){noise(.14,{f:1200,f2:260,g:.26});tone(280,.14,{f2:150,g:.13});},
  boing(e){tone(200+e,.3,{f2:430+e*2,g:.11,vib:13,vd:25});},
  pizza(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,{type:'triangle',g:.11,delay:i*.07}));tone(760,.7,{f2:430,g:.07,delay:.3,vib:6,vd:20});},
  slope(){tone(330,.55,{g:.15,vib:17,vd:70});tone(660,.3,{type:'triangle',g:.07,delay:.12,f2:990});},
  futon(){noise(.35,{f:520,f2:140,g:.36});tone(150,.3,{f2:90,g:.18});tone(880,.6,{g:.05,delay:.18});tone(1320,.6,{g:.035,delay:.26});},
  carpet(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.7,{g:.07,delay:i*.09}));noise(1.2,{ft:'highpass',f:3200,g:.035,a:.4});},
  growl(){tone(72,.8,{type:'sawtooth',g:.06,vib:8,vd:16,f2:56});noise(.6,{f:220,g:.05,a:.2});},
  chomp(){noise(.07,{ft:'bandpass',f:1800,q:2,g:.16});noise(.07,{ft:'bandpass',f:1400,q:2,g:.13,delay:.13});},
  plink(){tone(1150,.14,{f2:720,g:.09,type:'triangle'});},
  whee(d,f){tone(f,d,{f2:f*1.7,type:'triangle',g:.05,gl:d*.8});},
  bonk(){tone(200,.2,{f2:120,g:.15});noise(.09,{f:700,g:.1});tone(1400,.25,{g:.04,delay:.05});},
  snore(){noise(1.1,{f:330,g:.05,a:.45});},
  wake(){[659,880,988,1319].forEach((f,i)=>tone(f,.25,{type:'triangle',g:.09,delay:i*.08}));},
  arrive(){tone(784,.2,{type:'triangle',g:.09});tone(988,.3,{type:'triangle',g:.09,delay:.12});},
  ding(){tone(1319,1.2,{g:.08});tone(2637,.8,{g:.03});},
  joy(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.28,{type:'square',g:.035,delay:i*.06}));},
  star(){[1568,2093,2637,3136,2637,3520].forEach((f,i)=>tone(f,.5,{g:.05,delay:i*.07}));},
  cotton(){[784,988,1175].forEach((f,i)=>tone(f,.5,{g:.06,delay:i*.1,vib:5,vd:10}));noise(.5,{f:900,g:.05,a:.2});},
  rainbow(){[523,587,659,698,784,880,988,1047].forEach((f,i)=>tone(f,.22,{type:'triangle',g:.06,delay:i*.05}));},
  pop(){tone(480,.09,{f2:950,g:.09});},
  blip(){tone(620,.07,{f2:720,g:.045,type:'triangle'});},
  lift(){tone(260,2.2,{f2:720,g:.05,type:'triangle',a:.5,gl:2.2});noise(1.6,{ft:'bandpass',f:900,f2:2400,q:1,g:.04,a:.5});},
  land(){tone(620,.6,{f2:300,g:.05,a:.05});noise(.35,{f:400,g:.1});},
  fest(){const m=[784,880,988,1175,988,1175,1319];m.forEach((f,i)=>tone(f,.22,{type:'triangle',g:.05,delay:i*.14}));tone(392,1.1,{g:.04});},
  giant(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.5,{type:'triangle',g:.08,delay:i*.12}));},
  oven(){noise(.4,{f:600,g:.1});tone(200,.3,{f2:260,g:.06});}
};
function sfx(n,a,b){
  try{
    if(!AC||AC.state!=='running')return;
    const now=performance.now();if(last[n]&&now-last[n]<60)return;last[n]=now;
    SFX[n](a,b);
  }catch(e){}
}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ---------- particles ---------- */
const PMAX=140,parts=[];
function emit(x,y,k,o){
  if(parts.length>=PMAX)return null;o=o||{};
  const p={x,y,vx:o.vx||0,vy:o.vy||0,g:o.g||0,life:o.life||1,t:0,s:o.s||4,c:o.c||'#fff',k,rot:o.rot||rnd(0,TAU),vr:o.vr||0,L:o.L||'g',drag:o.drag||0};
  parts.push(p);return p;
}
function burst(x,y,k,n,o){
  o=o||{};
  for(let i=0;i<n;i++){const a=o.a!=null?o.a+rnd(-o.sp,o.sp):rnd(0,TAU),v=rnd(o.v0||40,o.v1||120)*U;
    emit(x,y,k,{vx:Math.cos(a)*v,vy:Math.sin(a)*v+(o.vy||0),g:(o.g||0)*U,life:rnd(o.l0||.6,o.l1||1.1),s:rnd(o.s0||3,o.s1||6)*U,c:o.cs?pick(o.cs):o.c,L:o.L,drag:o.drag||1.5,vr:rnd(-4,4)});}
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;const dr=Math.max(0,1-p.drag*dt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  }
}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s*1.1,y-s*.4,x-s*.45,y-s*1.1,x,y-s*.45);ctx.bezierCurveTo(x+s*.45,y-s*1.1,x+s*1.1,y-s*.4,x,y+s*.35);ctx.closePath();}
function starPath(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*PI/5-PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
function drawParts(L){
  for(const p of parts){
    if(p.L!==L)continue;
    const a=1-p.t/p.life;ctx.globalAlpha=Math.min(1,a*1.6);
    switch(p.k){
      case 'dot':ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.5+a*.5),0,TAU);ctx.fill();break;
      case 'heart':ctx.fillStyle=p.c;heartPath(p.x,p.y,p.s);ctx.fill();break;
      case 'star':ctx.fillStyle=p.c;starPath(p.x,p.y,p.s,p.rot);ctx.fill();break;
      case 'spark':ctx.strokeStyle=p.c;ctx.lineWidth=p.s*.35;ctx.beginPath();ctx.moveTo(p.x-p.s,p.y);ctx.lineTo(p.x+p.s,p.y);ctx.moveTo(p.x,p.y-p.s);ctx.lineTo(p.x,p.y+p.s);ctx.stroke();break;
      case 'smoke':ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1.6-a*.8),0,TAU);ctx.fill();break;
      case 'conf':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s,-p.s*.35,p.s*2,p.s*.7);ctx.restore();break;
      case 'feather':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.t*5)*.8);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.4,0,0,TAU);ctx.fill();ctx.restore();break;
      case 'bub':ctx.strokeStyle=p.c;ctx.lineWidth=1.4*U;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1.3-a*.5),0,TAU);ctx.stroke();break;
      case 'note':ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*.6,p.s*.45,-.4,0,TAU);ctx.fill();ctx.fillRect(p.x+p.s*.45,p.y-p.s*1.6,p.s*.22,p.s*1.6);break;
      case 'berry':drawBerry(p.x,p.y,p.s/(5*U),p.rot);break;
      case 'line':ctx.strokeStyle=p.c;ctx.lineWidth=p.s*.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.06,p.y-p.vy*.06);ctx.stroke();break;
    }
  }
  ctx.globalAlpha=1;
}

/* ---------- clay helpers ---------- */
const gradCache=new Map();
function unitGrad(col){
  let g=gradCache.get(col);if(g)return g;
  g=ctx.createRadialGradient(-.35,-.42,.08,0,0,1.12);
  g.addColorStop(0,shade(col,.38));g.addColorStop(.55,col);g.addColorStop(1,shade(col,-.2));
  gradCache.set(col,g);return g;
}
function blob(x,y,rx,ry,col,rot,noLine){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(rx,ry);
  ctx.beginPath();ctx.arc(0,0,1,0,TAU);ctx.fillStyle=unitGrad(col);ctx.fill();ctx.restore();
  if(!noLine){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);ctx.strokeStyle=shade(col,-.36);ctx.stroke();}
}
function flat(x,y,rx,ry,col,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);ctx.fillStyle=col;ctx.fill();}
function drawBerry(x,y,s,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(s*U,s*U);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,6);ctx.bezierCurveTo(-7,2,-6,-5,0,-4);ctx.bezierCurveTo(6,-5,7,2,0,6);
  const g=ctx.createRadialGradient(-2,-2,.5,0,0,7);g.addColorStop(0,'#ff8a8a');g.addColorStop(.6,'#e8364a');g.addColorStop(1,'#b81f33');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#9c1a2b';ctx.stroke();
  ctx.fillStyle='#ffe9a8';for(const q of [[-2,0],[2,-1],[0,3],[-3,-2.5],[3,2]]){ctx.fillRect(q[0]-.4,q[1]-.5,.8,1);}
  ctx.fillStyle='#4caf50';ctx.beginPath();ctx.ellipse(-2,-4.5,2.5,1.2,-.4,0,TAU);ctx.ellipse(2,-4.5,2.5,1.2,.4,0,TAU);ctx.fill();
  ctx.restore();
}
function drawSouv(k,x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s*U,s*U);ctx.lineWidth=1.2;
  if(k==='star'){
    blob(0,0,8,9,'#cfe8ff');ctx.fillStyle='#ffd23f';for(let i=0;i<4;i++){starPath(-3+(i%2)*5,-2+((i/2)|0)*5,2.6,i);ctx.fill();}
    flat(0,-9,6,2,'#f6a6c1');
  }else if(k==='cotton'){
    ctx.strokeStyle='#d9a066';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,0);ctx.stroke();
    blob(-3,-3,6,5,'#ffc2dc',0,true);blob(3,-4,6,5,'#c8e4ff',0,true);blob(0,-8,6,5,'#ffd8ea',0,true);
  }else if(k==='sprinkle'){
    blob(0,0,8,9,'#fff4f8');const cs=['#ff6b8b','#ffd23f','#5ec8ff','#7ed957','#b48cff'];
    for(let i=0;i<8;i++){ctx.fillStyle=cs[i%5];ctx.save();ctx.translate(-4+(i%3)*4,-4+((i/3)|0)*4);ctx.rotate(i);ctx.fillRect(-1.6,-.6,3.2,1.2);ctx.restore();}
    flat(0,-9,6,2,'#9ad0ff');
  }else{
    drawBerry(-3,1,1,-.2);drawBerry(3,-1,1,.25);
  }
  ctx.restore();
}

/* ---------- background ---------- */
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');

/* ---------- dough ---------- */
const D={state:'ready',r:new Float32Array(N).fill(R0),v:new Float32Array(N),base:new Float32Array(N).fill(R0),tgt:new Float32Array(N),
  sq:0,sqv:0,kind:null,preview:null,cand:null,candT:0,pv:0,formT:0,commitT:0,yOff:0,vy:0,lift:0,grab:null,demoDone:false,lastA:1,
  wasFormed:false,idle:0,bounceT:2,seed:1,stats:null,landed:true,jig:0};
let pointerId=null;
function analyze(r){
  let area=0,sum=0,sum2=0;
  for(let i=0;i<N;i++){const j=(i+1)%N;area+=.5*r[i]*r[j]*Math.sin(DA);sum+=r[i];sum2+=r[i]*r[i];}
  const mean=sum/N,cv=Math.sqrt(Math.max(0,sum2/N-mean*mean))/mean;
  let im=0,best=-1;const sm=analyze.sm||(analyze.sm=new Float32Array(N));
  for(let i=0;i<N;i++){let s=0;for(let k=-2;k<=2;k++)s+=r[(i+k+N)%N];sm[i]=s/5;if(sm[i]>best){best=sm[i];im=i;}}
  const far=sm[im],opp=sm[(im+N/2)%N],perp=(sm[(im+N/4)%N]+sm[(im+3*N/4)%N])/2;
  return{a:area/(PI*R0*R0),cv,far,opp,perp,dir:im*DA,Ld:far+opp,mean};
}
function classify(s){
  if(s.a>=5.3)return'carpet';
  if(s.far>=1.85*R0&&s.far>=1.55*Math.max(s.opp,s.perp))return'slope';
  if(s.cv<.19)return'pizza';
  if(s.a>=2.3)return'futon';
  return'pizza';
}
function doughCenter(){return{x:A.dough.x,y:A.dough.y+D.yOff-D.lift*14*U};}
function hitDough(x,y){
  if(!(D.state==='ready'||D.state==='formed'||(D.state==='spawning'&&D.yOff>-30*U)))return false;
  const c=doughCenter(),dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy);
  if(d<R0*U*1.25)return true;
  let a=Math.atan2(dy,dx);if(a<0)a+=TAU;const i=Math.round(a/DA)%N;
  return d<D.r[i]*U+26*U;
}
function startPull(x,y){
  if(D.state==='spawning'){D.state='ready';D.yOff=0;D.vy=0;}
  const c=doughCenter();
  if(D.state==='formed'){D.formT=Math.min(D.formT,.6);}
  D.state='pulling';D.lift=Math.min(D.lift,.5);
  D.grab={sx:x,sy:y,px:x,py:y,sd:dist(x,y,c.x,c.y),th:Math.atan2(y-c.y,x-c.x),e:0,maxE:0,res:1/(1+.35*(analyze(D.base).a-1))};
  D.sq=1;D.sqv=0;D.idle=0;S.demo=null;
  burst(x,y,'dot',7,{c:'#fffaf0',v0:30,v1:110,g:120,l0:.4,l1:.8,s0:2,s1:4});
  sfx('squish');buzz(12);stretchStart();
  for(const a of S.animals)if(!a.sleeping&&!a.riding)a.lookT=1.5;
}
function movePull(x,y){if(D.grab){D.grab.px=x;D.grab.py=y;}}
function endPull(){
  if(D.state!=='pulling'){D.grab=null;return;}
  const g=D.grab;D.grab=null;stretchStop();
  for(let i=0;i<N;i++){D.base[i]=D.base[i]+.86*(D.r[i]-D.base[i]);}
  const tmp=new Float32Array(N);
  for(let i=0;i<N;i++){tmp[i]=(D.base[(i+N-1)%N]+2*D.base[i]+D.base[(i+1)%N])/4;}
  for(let i=0;i<N;i++){D.base[i]=Math.min(LIM[i],lerp(D.base[i],tmp[i],.6));}
  D.sqv=-5;
  const st=analyze(D.base);
  const changed=st.a-D.lastA>.05||(g&&g.maxE>8);
  sfx('boing',(g?g.maxE:0)*2);buzz(8);

}
function form(kind,st){
  D.kind=kind;D.state='formed';D.commitT=0;D.wasFormed=true;D.lastA=st.a;D.stats=st;D.preview=kind;D.jig=1;
  sfx(kind);buzz(20);
  const c=doughCenter();
  if(kind==='pizza')burst(c.x,c.y,'dot',10,{cs:['#ffd25e','#e2553f','#fff'],v0:60,v1:160,g:200,s0:2,s1:4});
  if(kind==='slope')burst(c.x,c.y,'star',8,{cs:['#ff8fb1','#fff'],v0:60,v1:150,s0:3,s1:6});
  if(kind==='futon')burst(c.x,c.y,'feather',10,{cs:['#fff','#ffe3ef','#e3f1ff'],v0:40,v1:120,g:-10,l0:1,l1:1.6,s0:4,s1:7});

function spawnDough(delay){

}
function doSpawn(){
  D.r.fill(R0);D.base.fill(R0);D.v.fill(0);D.kind=null;D.preview=null;D.cand=null;D.pv=0;D.formT=0;D.wasFormed=false;D.lastA=1;
  D.demoDone=false;D.idle=0;D.yOff=-(A.dough.y+90*U);D.vy=0;D.state='spawning';D.lift=0;D.seed=Math.random()*1000;
}
function updDough(dt){
  if(D.state==='spawnwait'){D.spawnDelay-=dt;if(D.spawnDelay<=0)doSpawn();return;}
  if(D.state==='away')return;
  if(D.state==='spawning'){
    D.vy+=2600*U*dt;D.yOff+=D.vy*dt;
    if(D.yOff>=0){D.yOff=0;if(D.vy>300*U){D.vy=-D.vy*.28;D.sq=.9;D.sqv=0;sfx('squish');const c=doughCenter();burst(c.x,c.y+20*U,'dot',6,{c:'#fffaf0',v0:40,v1:90,g:100});}else{D.vy=0;D.state='ready';}}
  }
  const pulling=D.state==='pulling';
  if(pulling&&D.grab){
    const g=D.grab,c=doughCenter();const dx=g.px-c.x,dy=g.py-c.y,d=Math.hypot(dx,dy);
    let th;if(d>R0*U*.3)th=Math.atan2(dy,dx);else{const mx=g.px-g.sx,my=g.py-g.sy;th=mx*mx+my*my>16?Math.atan2(my,mx):g.th;}
    g.th=th;const e=Math.max(0,d-g.sd)/U*g.res;g.e=e;g.maxE=Math.max(g.maxE,e);
    for(let i=0;i<N;i++){const w=Math.exp(-Math.pow(angDiff(i*DA,th)/.7,2));D.tgt[i]=Math.min(LIM[i],D.base[i]+e*w+e*.1);}
    stretchSet(e);

  }
  const k=pulling?260:150,dmp=pulling?22:8;

  // squash
  const sqT=pulling?.3:0;D.sqv+=(120*(sqT-D.sq)-7*D.sqv)*dt;D.sq+=D.sqv*dt;
  // preview
  if(pulling){
    const st=analyze(D.r);let cand=null;
    if(st.a-D.lastA>.05||D.wasFormed||(D.grab&&D.grab.e>8))cand=classify(st);
    if(cand!==D.cand){D.cand=cand;D.candT=0;}else D.candT+=dt;
    if(D.candT>.28&&D.preview!==D.cand){D.preview=D.cand;D.pv=0;if(D.preview)sfx('blip');}
    D.formT=Math.max(0,D.formT-dt*3);
  }else if(D.state==='formed'){
    D.formT=Math.min(1,D.formT+dt*2.5);D.commitT+=dt;
    if(D.commitT>(D.kind==='carpet'?2.1:1.8))commitDough();

    D.preview=null;
    D.bounceT-=dt;if(D.bounceT<=0){D.bounceT=D.idle>4?1.1:1.7;D.sqv-=D.idle>4?3.2:2;}
  }

  D.jig=Math.max(0,D.jig-dt*1.2);
  const liftT=(D.preview==='carpet'&&(pulling||D.state==='formed'))?1:0;D.lift+=(liftT-D.lift)*Math.min(1,dt*3);

function commitDough(){
  const kind=D.kind,st=analyze(D.base);
  const c=doughCenter();
  const it={kind,r:Float32Array.from(D.base),st,a:st.a,x:c.x,y:c.y,sc:1,sy:1,place:'free',tr:null,seed:(Math.random()*1e6)|0,wob:0,id:++uid,jig:0,born:S.t};

  if(kind==='pizza')startPizza(it);
  else if(kind==='slope')startSlope(it);
  else if(kind==='futon')startFuton(it);

  checkModes();
}

/* ---------- items ---------- */
const PB=new Float32Array(N*2);
function polyPts(r,cx,cy,sc,sy,out,wav,wamp){
  out=out||PB;
  for(let i=0;i<N;i++){let rr=r[i];if(wamp)rr+=Math.sin(wav+i*1.7)*wamp;rr*=sc*U;out[i*2]=cx+COS[i]*rr;out[i*2+1]=cy+SIN[i]*rr*sy;}
  return out;
}
function pathPts(p,n){
  n=n||p.length/2;ctx.beginPath();
  let mx=(p[2*(n-1)]+p[0])/2,my=(p[2*(n-1)+1]+p[1])/2;ctx.moveTo(mx,my);
  for(let i=0;i<n;i++){const j=(i+1)%n;ctx.quadraticCurveTo(p[2*i],p[2*i+1],(p[2*i]+p[2*j])/2,(p[2*i+1]+p[2*j+1])/2);}
  ctx.closePath();
}
function scaled(r,f){const o=new Float32Array(N);for(let i=0;i<N;i++)o[i]=r[i]*f;return o;}
function travel(it,tx,ty,tsc,tsy,d,arc,done){it.tr={fx:it.x,fy:it.y,fsc:it.sc,fsy:it.sy,tx,ty,tsc,tsy,t:0,d,arc,done};it.place='free';if(travelers.indexOf(it)<0)travelers.push(it);}
function updTravel(it,dt){
  if(it.tr){const t=it.tr;t.t+=dt;const p=ease(t.t/t.d);
    const tx=typeof t.tx==='function'?t.tx():t.tx,ty=typeof t.ty==='function'?t.ty():t.ty;
    it.x=lerp(t.fx,tx,p);it.y=lerp(t.fy,ty,p)-Math.sin(PI*p)*t.arc;it.sc=lerp(t.fsc,t.tsc,p);it.sy=lerp(t.fsy,t.tsy,p);
    if(t.t>=t.d){it.tr=null;if(t.done)t.done(it);}}
}
function updItem(it,dt){
  it.jig=Math.max(0,it.jig-dt*.9);it.wob=Math.max(0,it.wob-dt*2);
}
function itemPos(it){
  switch(it.place){
    case 'table':{const i=S.pizzas.indexOf(it);return{x:A.table.x,y:A.table.y-36*U-i*3.5*U};}
    case 'bed':{const i=S.futons.indexOf(it);return{x:A.bed.x,y:A.bed.y-14*U-Math.min(i,8)*6*U};}
    case 'rug':{const i=S.carpets.indexOf(it);return{x:A.rug.x,y:A.rug.y-i*3*U};}
    case 'counter':{const i=S.counter.indexOf(it);return{x:A.counter.x-i*8*U,y:A.counter.y-i*3*U};}
    case 'hand':{const c=S.chef;return{x:c.x,y:c.y-70*U};}
    case 'oven':return{x:A.oven.x,y:A.oven.y-20*U};
  }
  return{x:it.x,y:it.y};
}
function seatsFor(a){return a<1.5?2:a<2.4?3:a<3.4?4:a<4.3?6:8;}

/* pizza */
function startPizza(it){
  it.baked=false;it.top=null;it.cheese=0;
  travel(it,()=>A.counter.x-S.counter.length*8*U,()=>A.counter.y,.4,.6,.8,60*U,it2=>{it2.place='counter';S.counter.push(it2);sfx('pop');});
}
function drawPizza(it,cx,cy,sc,sy,alpha){
  const r=it.r;const th=5*U*sc*1.6;
  ctx.lineWidth=1.6*U*Math.max(.5,sc);
  // side
  polyPts(r,cx,cy+th,sc,sy);pathPts(PB);ctx.fillStyle=it.baked?'#c9823f':'#dfbd88';ctx.fill();
  // crust
  polyPts(r,cx,cy,sc,sy);pathPts(PB);
  const g=ctx.createRadialGradient(cx-20*U*sc,cy-20*U*sc*sy,4*U,cx,cy,R0*U*sc*2.4);

      if(b.y>=b.gy){b.y=b.gy;if(b.vy>200*U){b.vy=-b.vy*.35;sfx('plink');}else{b.state='ground';b.vy=0;}}}
  }
}

/* sleep */
function topFuton(){return S.futons.length?S.futons[S.futons.length-1]:null;}
function sleepSlot(i,n){const f=topFuton();const p=itemPos(f);const w=Math.min(f.st.Ld*.42*U*.75,28*U*n);return{x:p.x+(n>1?(i/(n-1)-.5)*w:0)+6*U,y:p.y+4*U};}
function callSleepers(){
  const f=topFuton();if(!f)return;
  const sleepers=S.animals.filter(a=>a.sleeping||a.goingBed).length;
  let free=f.cap-sleepers;if(free<=0)return;
  const cand=S.animals.filter(a=>a.sleepy&&!a.sleeping&&!a.goingBed&&!a.riding&&!a.lock&&!a.shuttle&&(a.cur==null||a.cur.soft||a.cur.k==='wait')).sort((p,q)=>dist(p.x,p.y,A.bed.x,A.bed.y)-dist(q.x,q.y,A.bed.x,A.bed.y));
  for(const a of cand){if(free<=0)break;free--;planSleep(a,f);}
}
function planSleep(c,f){
  interrupt(c);c.goingBed=true;const n=f.cap;const idx=S.animals.filter(a=>a.goingBed||a.sleeping).length-1;
  c.plan=[walk({x:A.bed.x+(A.land?70:60)*U,y:A.bed.y+10*U}),jump(()=>sleepSlot(idx%n,n),.5,30*U),
    fn(c=>{c.sleeping=true;c.goingBed=false;c.pose='sleep';log(c.type+' sleeps');}),
    {k:'until',f:c=>c.sleepT>6.5,pose:'sleep',start:c=>{c.sleepT=0;},each:(c,dt)=>{c.sleepT+=dt;c.pose='sleep';const p=sleepSlot(idx%n,n);c.x=p.x;c.y=p.y;if(Math.random()<dt*1.2)emit(c.x-14*U,c.y-22*U,'bub',{vy:-26*U,vx:-8*U,life:1.4,s:4*U,c:'#8fb3ff'});if(Math.random()<dt*.4)sfx('snore');}},
    fn(c=>{wakeUp(c);})];
}
function wakeUp(c){
  c.sleeping=false;c.sleepy=false;c.slides=0;c.pose='stand';
  if(c.type==='bunny'&&!c.rested){c.rested=true;}
  sfx('wake');burst(c.x,c.y-30*U,'star',6,{cs:['#ffe27a','#fff'],v0:40,v1:100});
  log(c.type+' wakes');
  c.lock=true;
  c.plan=[jump({x:A.bed.x+(A.land?80:70)*U,y:A.bed.y+16*U},.5,40*U),wait(.5,{arms:'up',eyes:'happy'})];
  if(friendsOf(c,true).length){c.plan.push(wait(1.4,{arms:'call',pose:'stand',each:(c,dt)=>{if(Math.random()<dt*5)emit(c.x+c.face*10*U,c.y-40*U,'note',{vy:-50*U,vx:c.face*30*U,life:1,s:5*U,c:pick(['#ff6b8b','#7a6bff','#ffb000'])});}}),fn(c=>{const fr=friendsOf(c);for(let i=0;i<fr.length;i++)spawnFriend(fr[i],c,i*1.3);}));}
  if(c.type==='bunny')c.plan.push(wait(1,{each:(c)=>{c.hop=Math.abs(Math.sin(S.t*9))*10*U;}}));
  c.plan.push(fn(c=>{c.lock=false;c.hop=0;}));
}
function friendsOf(c,peek){
  if(S.animals.length>=7)return[];
  let list=(FRIENDS[c.type]||[]).filter(t=>!S.arrived[t]);
  if(!list.length){const rest=POOL.filter(t=>!S.arrived[t]);if(rest.length)list=[rest[0]];}
  list=list.slice(0,7-S.animals.length);
  if(!peek)for(const t of list)S.arrived[t]=1;
  return list;
}
function spawnFriend(type,caller,delay){
  const fromLeft=caller.x<W/2;const y=clamp(caller.y+rnd(-20,30)*U,A.horizon+50*U,A.safe.b-12*U);
  const a=makeChar(type,fromLeft?-30*U:W+30*U,y);a.lock=true;
  a.plan=[wait(delay),walk({x:caller.x+(fromLeft?-40:40)*U+rnd(-10,10)*U,y}),fn(a=>{a.lock=false;sfx('arrive');burst(a.x,a.y-40*U,'heart',3,{c:'#ff8fb1',v0:20,v1:60,vy:-40});log('friend arrives '+a.type);}),wait(1.2,{arms:'wave'})];
  S.animals.push(a);
}

/* meals */
function startMeal(pz){
  pz.cheese=1;sfx('pizza');
  const seats=pz.seats;
  const others=S.animals.filter(free).sort((p,q)=>dist(p.x,p.y,A.table.x,A.table.y)-dist(q.x,q.y,A.table.x,A.table.y));
  const eaters=[S.chef].concat(others.slice(0,seats-1));
  const extra=others.slice(seats-1);
  S.meal={pz,n:eaters.length,extra:extra.length,until:S.t+9};
  log('meal seats='+seats+' eaters='+eaters.length+' left='+extra.length+' tops='+(pz.topKinds||[]).join(','));
  eaters.forEach((c,i)=>{
    if(c!==S.chef)interrupt(c);
    c.lock=true;const sp=()=>seatPos(i,eaters.length>seats?seats:Math.max(eaters.length,2));
    c.plan.push(wait(i===0?1.1:.2),walk(sp),fn(c=>{c.face=c.x<A.table.x?1:-1;}),
      wait(3.2,{pose:'eat',arms:'eat',each:(c,dt,s)=>{c.puff=.6+.4*Math.abs(Math.sin(s.t*7));c.mouth='chew';if(Math.random()<dt*2.2)sfx('chomp');if(Math.random()<dt*3)emit(c.x+c.face*8*U,c.y-26*U,'dot',{vx:rnd(-20,20)*U,vy:-20*U,g:200*U,life:.5,s:1.6*U,c:'#e8a65a'});}}),
      fn(c=>{c.puff=.5;c.mouth='w';eatReact(c,pz,c===S.chef);}),wait(1.2,{arms:'up',eyes:'happy',each:(c,dt)=>{if(c.glow>0)c.hop=6*U+Math.sin(S.t*6)*4*U;}}),
      fn(c=>{c.lock=false;c.puff=0;c.ate++;c.wantBig=false;if(c===S.chef){c.hungry=false;c.fullT=40;}c.hop=0;}));
  });
  extra.forEach((c,i)=>{interrupt(c);c.lock=true;
    c.plan=[walk({x:A.table.x+(i%2?-1:1)*(110+i*12)*U,y:A.table.y-38*U-((i/2)|0)*8*U}),wait(2.6,{arms:'wave',each:c=>{c.lookX=A.dough.x;c.lookY=A.dough.y;c.lookT=.2;}}),fn(c=>{c.lock=false;c.wantBig=true;})];});
}
function eatReact(c,pz,isChef){
  const k=pz.topKinds||[];
  if(k.indexOf('star')>=0){c.glow=4;sfx('star');burst(c.x,c.y-30*U,'star',6,{cs:['#ffd23f','#fff6a8','#fff'],v0:40,v1:110,s0:3,s1:6});}
  if(k.indexOf('cotton')>=0){c.fluff=4;sfx('cotton');burst(c.x,c.y-30*U,'smoke',5,{cs:['rgba(255,190,220,.8)','rgba(200,228,255,.8)'],v0:20,v1:60,s0:5,s1:8,l0:1,l1:1.6});}
  if(k.indexOf('spr')>=0){c.spin=2;sfx('rainbow');burst(c.x,c.y-30*U,'conf',8,{cs:['#ff6b8b','#ffd23f','#5ec8ff','#7ed957','#b48cff'],v0:60,v1:140,g:150,s0:2,s1:4});}
  if(k.indexOf('berry')>=0){burst(c.x,c.y-40*U,'heart',isChef?7:3,{cs:['#ff6b8b','#ff9ec2'],v0:40,v1:110,vy:-40,s0:4,s1:7});if(isChef){c.joy=3;sfx('joy');}}
  if(!k.length){burst(c.x,c.y-40*U,'heart',2,{c:'#ff8fb1',v0:20,v1:60,vy:-40});sfx('pop');}

/* chef */
function chefThink(c){
  if(S.counter.length&&!S.oven.busy){planBake(c,S.counter[0]);return;}
  const gb=S.berries.filter(b=>b.state==='ground'&&!b.claim);
  if(gb.length){planPick(c,gb);return;}
  const h=chefStand();
  if(dist(c.x,c.y,h.x,h.y)>6*U){c.plan.push(walk(h,{soft:true}));return;}
  c.plan.push(Object.assign(wait(rnd(1.2,2.2),{soft:true}),{}));
}
function planBake(c,pz){

  const tops=[];const kinds=[];const rr=prng(pz.seed);
  const nb=Math.min(S.basket,6);
  c.plan=[walk(()=>({x:itemPos(pz).x+26*U,y:itemPos(pz).y+16*U}),{sp:1.3}),fn(c=>{c.face=-1;
      let delay=0;const p=itemPos(pz);
      if(nb>0){S.basket-=nb;kinds.push('berry');for(let i=0;i<nb;i++){tops.push({k:'berry',i:(rr()*N)|0,f:.25+rr()*.45,rot:rr()-.5});flyer('berry',A.basket.x,A.basket.y-10*U,p.x,p.y,delay);delay+=.15;}}
      if(S.pantry.star>0){S.pantry.star--;kinds.push('star');for(let i=0;i<7;i++)tops.push({k:'star',i:(rr()*N)|0,f:.15+rr()*.6,rot:rr()*3});flyer('star',A.basket.x,A.basket.y-10*U,p.x,p.y,delay);delay+=.15;}
      if(S.pantry.cotton>0){S.pantry.cotton--;kinds.push('cotton');for(let i=0;i<4;i++)tops.push({k:'cotton',i:(rr()*N)|0,f:.2+rr()*.5,c:i%2?'#ffc2dc':'#c8e4ff'});flyer('cotton',A.basket.x,A.basket.y-10*U,p.x,p.y,delay);delay+=.15;}
      if(S.pantry.sprinkle>0){S.pantry.sprinkle--;kinds.push('spr');const cs=['#ff6b8b','#ffd23f','#5ec8ff','#7ed957','#b48cff'];for(let i=0;i<14;i++)tops.push({k:'spr',i:(rr()*N)|0,f:.1+rr()*.65,rot:rr()*6,c:cs[i%5]});flyer('sprinkle',A.basket.x,A.basket.y-10*U,p.x,p.y,delay);delay+=.15;}
      pz.pendingTops=tops;pz.topKinds=kinds;pz.topAt=S.t+delay+.45;

    }),
    wait(.6,{arms:'up'}),{k:'until',f:()=>S.t>=pz.topAt,arms:'up'},
    fn(c=>{pz.tops=pz.pendingTops;S.oven.open=1;sfx('oven');const i=S.counter.indexOf(pz);if(i>=0)S.counter.splice(i,1);
      pz.place='free';travel(pz,A.oven.x,A.oven.y-18*U,.3,.5,.5,30*U,p=>{p.place='oven';S.oven.inside=p;S.oven.bake=2.2;S.oven.open=0;});}),
    {k:'until',f:()=>S.oven.inside===pz&&S.oven.bake<=0,arms:'down',each:c=>{c.face=1;},max:8},
    fn(c=>{S.oven.open=1;pz.baked=true;pz.seats=seatsFor(pz.a);S.lastSeats=pz.seats;sfx('ding');burst(A.oven.x,A.oven.y-30*U,'star',6,{cs:['#ffd23f','#fff'],v0:50,v1:120});
      travel(pz,()=>c.x,()=>c.y-70*U,.3,.6,.45,30*U,p=>{p.place='hand';});c.carry=pz;S.oven.inside=null;}),
    wait(.5,{arms:'hold'}),
    fn(c=>{S.oven.open=0;}),
    walk(()=>({x:A.table.x+(A.land?96:92)*U,y:A.table.y-6*U}),{arms:'hold'}),
    fn(c=>{c.carry=null;S.pizzas.push(pz);const p=itemPos(pz);pz.place='free';travel(pz,p.x,p.y,.42,.55,.45,30*U,p2=>{p2.place='table';});S.oven.busy=false;log('pizza on table seats='+pz.seats);}),
    wait(.5),fn(c=>{startMeal(pz);})];
}
function flyer(k,x0,y0,x1,y1,delay){S.flyers.push({k,x0,y0,x1,y1,t:-delay,d:.5});}
function planPick(c,list){
  const take=list.slice(0,4);for(const b of take)b.claim=true;
  c.plan=[];
  for(const b of take){c.plan.push(walk(()=>({x:b.x+8*U,y:b.y+4*U}),{sp:1.15}),fn(c=>{b.state='carried';c.carryN=(c.carryN||0)+1;c.sq=.4;sfx('plink');}),wait(.25,{arms:'hold'}));}
  c.plan.push(walk(()=>({x:A.basket.x-26*U,y:A.basket.y+8*U}),{arms:'hold'}),fn(c=>{const n=c.carryN||0;c.carryN=0;for(const b of take)b.state='done';S.basket=Math.min(12,S.basket+n);sfx('pop');burst(A.basket.x,A.basket.y-14*U,'heart',2,{c:'#ff6b8b',v0:20,v1:50,vy:-30});log('basket='+S.basket);}),wait(.4,{arms:'up',eyes:'happy'}));
}

/* animals autonomy */
function animalThink(c){
  if(c.deliver){const k=c.deliver;c.plan=[walk(()=>({x:S.chef.x+(c.x<S.chef.x?-30:30)*U,y:S.chef.y+6*U}),{arms:'hold'}),fn(c=>{deliver(c,k);}),wait(.8,{arms:'up',eyes:'happy'})];return;}
  if(c.sleepy&&S.futons.length&&!S.flight){callSleepers();if(c.goingBed||c.sleeping)return;}
  const hasSlope=S.slopes.length>0,hasFuton=S.futons.length>0,hasPizza=S.pizzas.length>0;
  if(c.wantRide&&S.carpets.length&&!S.flight&&Math.random()<.7){
    c.plan=[walk({x:A.rug.x+rnd(-40,40)*U,y:A.rug.y+rnd(14,28)*U},{soft:true}),wait(rnd(2.5,4),{soft:true,arms:'wave',each:c=>{c.lookX=c.x;c.lookY=0;c.lookT=.2;if(Math.random()<.02)c.sq=.3;}})];return;}
  if(c.sleepy&&!hasFuton){
    const h=c.type==='bunny'?A.bunny:randomGround();
    c.plan=[walk(c.type==='bunny'?{x:A.bunny.x,y:A.bunny.y}:h,{soft:true,sp:.6}),wait(rnd(2.5,4),{soft:true,each:(c,dt,s)=>{const q=s.t%3;c.arms=q<1?'rub':'down';c.eyes=q<1.6?'sleepy':'closed';c.mouth=q>1&&q<1.6?'o':'w';}})];return;
  }
  const pg=S.playground;
  const w={slide:hasSlope?(pg?3:2.6):0,bounce:hasFuton&&!c.sleepy?(pg?2:1):0,nibble:hasPizza&&!S.meal?(pg?2.2:.8):0,wander:pg?.6:1.4,wave:.5,fest:S.festival?1.4:0};
  if(c.type==='bunny'&&c.rested&&!hasSlope)w.wander+=1;
  let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot,ch='wander';for(const k in w){r-=w[k];if(r<=0){ch=k;break;}}
  if(ch==='slide'){
    const lanes=S.slopes;let it=lanes[lanes.length-1];if(lanes.length>1&&Math.random()<.45)it=pick(lanes);
    const T=laneTop(it.lane);
    c.plan=[walk({x:A.hillTop.x-4*U+rnd(-6,6)*U,y:A.gsY+8*U},{soft:true}),jump({x:A.hillTop.x-4*U,y:(A.hillTop.y+A.gsY)/2},.45,26*U),jump(()=>({x:T.x+2*U,y:T.y-2*U}),.45,24*U),wait(.25,{arms:'up'}),{k:'slide',it}];
  }else if(ch==='bounce'){
    const f=topFuton();
    c.plan=[walk({x:A.bed.x+(A.land?70:60)*U,y:A.bed.y+12*U},{soft:true}),jump(()=>{const p=itemPos(f);return{x:p.x+rnd(-20,20)*U,y:p.y+2*U};},.5,34*U),
      wait(1.6,{arms:'up',eyes:'happy',each:(c,dt,s)=>{c.hop=Math.abs(Math.sin(s.t*7))*16*U;if(Math.random()<dt*2)sfx('futon');}}),jump({x:A.bed.x+(A.land?80:66)*U,y:A.bed.y+18*U},.45,30*U)];
  }else if(ch==='nibble'){
    const i=(Math.random()*6)|0;
    c.plan=[walk(()=>seatPos(i,6),{soft:true}),fn(c=>{c.face=c.x<A.table.x?1:-1;}),wait(1.8,{pose:'eat',arms:'eat',each:(c,dt,s)=>{c.puff=.5+.4*Math.abs(Math.sin(s.t*7));c.mouth='chew';if(Math.random()<dt*1.4)sfx('chomp');}}),fn(c=>{c.puff=0;c.mouth='w';burst(c.x,c.y-40*U,'heart',1,{c:'#ff8fb1',v0:20,v1:40,vy:-30});})];
  }else if(ch==='wave'){

  }else if(ch==='fest'){
    c.plan=[walk(randomGround(),{soft:true}),wait(1.6,{soft:true,arms:'up',eyes:'happy',each:(c,dt,s)=>{c.hop=Math.abs(Math.sin(s.t*8))*8*U;c.face=Math.sin(s.t*4)>0?1:-1;}})];
  }else{
    c.plan=[walk(randomGround(),{soft:true}),wait(rnd(1,2.4),{soft:true})];
  }
}
function deliver(c,k){
  c.deliver=null;c.carry=null;
  if(!S.delivered){S.delivered=1;
    if(k==='berry'){S.basket=Math.min(12,S.basket+3);}else if(k==='star')S.pantry.star++;else if(k==='cotton')S.pantry.cotton++;else S.pantry.sprinkle++;
    S.chef.joy=1.5;S.chef.sq=.5;sfx('joy');log('souvenir delivered '+k);
  }
  flyer(k==='berry'?'berry':k==='rainbow'?'sprinkle':k,c.x,c.y-50*U,A.basket.x,A.basket.y-10*U,0);
  burst(S.chef.x,S.chef.y-60*U,'heart',2,{c:'#ff6b8b',v0:20,v1:50,vy:-40});
}

/* ---------- carpet flight ---------- */
function startCarpet(it){
  it.place='free';it.x=A.dough.x;it.y=A.dough.y-14*U;it.sc=1;it.sy=.62;
  const cap=it.a<6.4?3:it.a<7.7?5:7;
  S.flight={phase:'board',t:0,it,pax:[],dest:null,cap,cx:0,cy:0,cs:1,sky:0};
  log('carpet a='+it.a.toFixed(2)+' cap='+cap);
  recruit(false);
}
function recruit(sleepyOk){
  const F=S.flight,it=F.it;if(F.pax.length>=F.cap)return;
  let cands=S.animals.filter(a=>free(a)&&F.pax.indexOf(a)<0&&(sleepyOk||!a.sleepy));
  const pr=a=>(a.wantRide?-2:0)+(a.type==='bunny'&&a.rested&&!a.starDone?-1:0)+(a.lastRide?1.5:0);
  cands.sort((p,q)=>{const sp=pr(p),sq=pr(q);return sp-sq||dist(p.x,p.y,it.x,it.y)-dist(q.x,q.y,it.x,it.y);});
  const busyVip=F.t<4?S.animals.filter(a=>pr(a)<0&&!free(a)&&F.pax.indexOf(a)<0&&!a.sleeping&&!a.riding&&!a.sleepy).length:0;
  for(const c of cands.slice(0,Math.max(0,F.cap-F.pax.length-busyVip))){
    const i=F.pax.length;F.pax.push(c);F.lastJoin=F.t;
    interrupt(c);c.lock=true;c.boarded=false;
    c.plan=[walk(()=>{const s=carSeat(i);return{x:s.x+(i%2?14:-14)*U,y:A.dough.y+R0*U*1.2};},{sp:1.3}),jump(()=>carSeat(i),.45,36*U),fn(c=>{c.riding=true;c.boarded=true;c.seatI=i;c.lock=false;})];
  }
}
function carSeat(i){const F=S.flight;const n=F.pax.length;const it=F.it;const wdt=Math.min(n*30*U,(it.st.mean*2*.7)*U*it.sc);return{x:it.x+(n>1?(i/(n-1)-.5)*wdt:0),y:it.y+4*U};}
function chooseDest(pax){
  if(pax.length>=5)return'rainbow';
  if(pax.some(p=>p.type==='bunny'&&p.rested))return'star';
  if(pax.some(p=>POOL.indexOf(p.type)>=0))return'cotton';
  return'berry';
}
function cloudPos(k){const c=A.clouds[k];return{x:c[0]*W,y:c[1]*H};}
function updFlight(dt){
  const F=S.flight;if(!F)return;F.t+=dt;const it=F.it;
  if(F.phase==='board'){
    it.x=A.dough.x;it.y=A.dough.y-14*U-Math.sin(S.t*2.4)*5*U;
    for(const c of F.pax){if(c.riding){const s=carSeat(c.seatI);c.x=s.x;c.y=s.y;c.pose='sit';c.arms='up';}}
    if(F.t<6)recruit(false);else if(!F.pax.length&&F.t<8)recruit(true);
    const allIn=F.pax.length>0&&F.pax.every(c=>c.riding);
    if((allIn&&F.t>1.6&&F.t-(F.lastJoin||0)>1.2)||F.t>9){
      F.pax=F.pax.filter(c=>{if(!c.riding){interrupt(c);c.lock=false;return false;}return true;});
      F.pax.forEach((c,i)=>c.seatI=i);
      F.dest=chooseDest(F.pax);F.phase='lift';F.t=0;F.p0={x:it.x,y:it.y};sfx('lift');log('takeoff dest='+F.dest+' pax='+F.pax.map(p=>p.type).join(','));
      for(const c of F.pax){c.wantRide=false;}
    }
    return;
  }
  const cd=cloudPos(F.dest);const dock={x:cd.x,y:cd.y+64*U};
  if(F.phase==='lift'){
    const q=ease(F.t/2.6);cam.s=lerp(1,.42,q);F.sky=q*.55;
    F.cx=lerp(F.p0.x,A.skyCar.x,q);F.cy=lerp(F.p0.y,A.skyCar.y,q)-Math.sin(PI*q)*30*U;F.cs=lerp(1,.78,q);

/* ---------- wishes & demo ---------- */
function computeWish(){
  const f=S.flags,ch=S.chef;
  const kid=S.animals.find(a=>a.type==='ham'&&avail(a))||S.animals.find(a=>avail(a));

  if(!f.pizza)return{k:'pizza',c:ch};
  if(!f.slope&&kid)return{k:'slope',c:kid};
  if(sleepy&&!S.futons.length)return{k:'futon',c:sleepy};
  if(!f.carpet&&kid)return{k:'carpet',c:kid};
  if((S.basket>0||S.pantry.star||S.pantry.cotton||S.pantry.sprinkle)&&!S.counter.length)return{k:'pizza',c:ch};
  if(wanter)return{k:'carpet',c:wanter};

  const big=S.animals.find(a=>a.wantBig);if(big)return{k:'pizza',c:big};

  // face
  ctx.fillStyle='rgba(255,130,150,'+(c.joy>0||c.fluff>0?.75:.45)+')';ctx.beginPath();ctx.ellipse(-10,hy+5,3.6,2.2,0,0,TAU);ctx.ellipse(11,hy+5,3.6,2.2,0,0,TAU);ctx.fill();
  const ey=hy-1;let eyes=c.eyes;if(c.blinkT>0)eyes='closed';
  ctx.fillStyle='#3a2a2a';ctx.strokeStyle='#3a2a2a';ctx.lineWidth=1.6;ctx.lineCap='round';
  if(eyes==='closed'){ctx.beginPath();ctx.moveTo(-8,ey);ctx.quadraticCurveTo(-5,ey+2,-2,ey);ctx.moveTo(3,ey);ctx.quadraticCurveTo(6,ey+2,9,ey);ctx.stroke();}
  else if(eyes==='happy'){ctx.beginPath();ctx.moveTo(-8,ey+1);ctx.quadraticCurveTo(-5,ey-3,-2,ey+1);ctx.moveTo(3,ey+1);ctx.quadraticCurveTo(6,ey-3,9,ey+1);ctx.stroke();}
  else{const ry=eyes==='sleepy'?1.4:3.1;ctx.beginPath();ctx.ellipse(-5+gx,ey+gy,2.5,ry,0,0,TAU);ctx.ellipse(6+gx,ey+gy,2.5,ry,0,0,TAU);ctx.fill();
    if(eyes!=='sleepy'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4.2+gx,ey-1.2+gy,.9,0,TAU);ctx.arc(6.8+gx,ey-1.2+gy,.9,0,TAU);ctx.fill();}
    else{ctx.strokeStyle=shade(T.body,-.3);ctx.beginPath();ctx.moveTo(-8,ey-1);ctx.lineTo(-2,ey-1);ctx.moveTo(3,ey-1);ctx.lineTo(9,ey-1);ctx.stroke();}}
  // nose & mouth
  if(c.type==='chick'){ctx.fillStyle='#ff9f2e';ctx.beginPath();ctx.moveTo(-1,hy+3);ctx.lineTo(5,hy+5);ctx.lineTo(-1,hy+7);ctx.closePath();ctx.fill();}
  else{ctx.fillStyle='#e87f8f';ctx.beginPath();ctx.ellipse(.5,hy+3,1.8,1.3,0,0,TAU);ctx.fill();
    ctx.strokeStyle='#7a4a4a';ctx.lineWidth=1.2;ctx.beginPath();
    if(c.mouth==='o'){ctx.fillStyle='#b3505e';ctx.ellipse(.5,hy+8,2,2.6,0,0,TAU);ctx.fill();}

    else{ctx.moveTo(-2.5,hy+6);ctx.quadraticCurveTo(-1,hy+8,.5,hy+6);ctx.quadraticCurveTo(2,hy+8,3.5,hy+6);ctx.stroke();}}
  if(chef){// hat
    ctx.lineWidth=1.6;ctx.fillStyle='#fff';ctx.strokeStyle='#d8c8cc';

  }
  if(c.fluff>0){ctx.globalAlpha=Math.min(1,c.fluff)*.8;blob(-14,hy-14,6,5,'#ffc2dc',0,true);blob(14,hy-16,6,5,'#c8e4ff',0,true);blob(0,hy-22,7,5,'#ffd8ea',0,true);ctx.globalAlpha=1;}
  // carried things
  if(c.carry){

}

function drawFlyers(dt){

/* ---------- dough drawing ---------- */
const DR=new Float32Array(N);
function drawDough(){
  if(D.state==='away'||D.state==='spawnwait')return;
  const c=doughCenter();const de=demoE();
  for(let i=0;i<N;i++){let r=D.r[i];if(de>0&&S.demo){const w=Math.exp(-Math.pow(angDiff(i*DA,S.demo.th)/.7,2));r+=de*w+de*.1;}DR[i]=r;}
  const kind=D.state==='formed'?D.kind:null,ft=D.formT;
  const st=analyze(DR);const a=st.a;
  let h=clamp(18/a,2.5,18)*U*(1-D.sq*.35);
  if(D.kind==='futon'&&ft>0)h=lerp(h,16*U,ft);
  if(D.preview==='futon'&&D.state==='pulling')h=lerp(h,12*U,D.pv*.5);
  const sx=1+D.sq*.09,syv=1-D.sq*.14;
  // jiggle for slope
  if(D.kind==='slope'&&ft>0){for(let i=0;i<N;i++){DR[i]+=Math.sin(S.t*18+Math.cos(i*DA-st.dir)*4)*D.jig*4;}}
  const lift=D.lift;
  // shadow
  ctx.fillStyle='rgba(90,50,40,'+(.18-lift*.06)+')';polyPts(DR,c.x+4*U,c.y+h+8*U+lift*20*U,1-lift*.1,1);pathPts(PB);ctx.fill();
  ctx.save();ctx.translate(c.x,c.y+h);ctx.scale(sx,syv);ctx.translate(-c.x,-(c.y+h));
  const flut=lift>.05?lift*3:0,fw=S.t*4;
  // side
  polyPts(DR,c.x,c.y+h,1,1,PB,fw,flut);pathPts(PB);ctx.fillStyle=a>4.2?'#e6c592':'#dcb27c';ctx.fill();ctx.lineWidth=1.6*U;ctx.strokeStyle='#b88a55';ctx.stroke();
  // top
  polyPts(DR,c.x,c.y,1,1,PB,fw,flut);pathPts(PB);
  const thin=clamp((a-1)/4,0,1);
  const g=ctx.createRadialGradient(c.x-R0*U*.5,c.y-R0*U*.6,R0*U*.1,c.x,c.y,R0*U*2.6);
  g.addColorStop(0,'#fffaf0');g.addColorStop(.5,thin>.7?'#fbeed6':'#f7e1bb');g.addColorStop(1,thin>.7?'#f1dbb6':'#eccb94');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#c99a62';ctx.stroke();
  // raised rim when squashed
  if(D.sq>.05){polyPts(DR,c.x,c.y,.9,1);pathPts(PB);ctx.strokeStyle='rgba(255,252,240,'+Math.min(.9,D.sq)+')';ctx.lineWidth=6*U*D.sq;ctx.stroke();
    polyPts(DR,c.x,c.y,.8,1);pathPts(PB);ctx.strokeStyle='rgba(190,140,90,'+Math.min(.5,D.sq*.5)+')';ctx.lineWidth=2*U;ctx.stroke();}
  // flour specks
  const rr=prng(D.seed|0);ctx.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<10;i++){const k=(rr()*N)|0,f=rr()*.8;ctx.beginPath();ctx.arc(c.x+COS[k]*DR[k]*U*f,c.y+SIN[k]*DR[k]*U*f,1.6*U,0,TAU);ctx.fill();}
  // hint/forms
  const pv=D.state==='pulling'?D.pv:0;
  const pk=D.state==='pulling'?D.preview:null;
  if(pk==='pizza'||kind==='pizza'){const al=kind==='pizza'?ft:pv*.35;ctx.globalAlpha=al;polyPts(DR,c.x,c.y,.8,1);pathPts(PB);ctx.fillStyle='#e2553f';ctx.fill();
    polyPts(DR,c.x,c.y,.7,1,PB,S.t*3,1.5);pathPts(PB);ctx.fillStyle='#fff2b0';ctx.fill();
    if(kind==='pizza'){const r2=prng(7);for(let i=0;i<6;i++){const k=(r2()*N)|0,f=.2+r2()*.4;flat(c.x+COS[k]*DR[k]*U*f,c.y+SIN[k]*DR[k]*U*f,5*U,4*U,'#e2553f');}}
    ctx.globalAlpha=1;}
  if(pk==='slope'||kind==='slope'){const al=kind==='slope'?ft:pv*.4;ctx.save();polyPts(DR,c.x,c.y,1,1);pathPts(PB);ctx.clip();ctx.globalAlpha=al;ctx.strokeStyle='#ff7fa6';ctx.lineWidth=8*U;ctx.beginPath();
    const dx=Math.cos(st.dir),dy=Math.sin(st.dir);for(let s=-250;s<250;s+=22){const px=c.x+dx*s*U,py=c.y+dy*s*U;ctx.moveTo(px-dy*300*U,py+dx*300*U);ctx.lineTo(px+dy*300*U,py-dx*300*U);}ctx.stroke();ctx.restore();}
  if(pk==='futon'||kind==='futon'){const al=kind==='futon'?ft:pv*.45;ctx.save();ctx.globalAlpha=al;polyPts(DR,c.x,c.y,1,1);pathPts(PB);ctx.fillStyle='#ffc6da';ctx.fill();ctx.clip();
    ctx.fillStyle='#f28fb4';const stp=22*U;for(let x=c.x-300*U;x<c.x+300*U;x+=stp)for(let y=c.y-300*U;y<c.y+300*U;y+=stp){ctx.beginPath();ctx.arc(x+((Math.round((y-c.y)/stp)&1)?stp/2:0),y,2.4*U,0,TAU);ctx.fill();}
    ctx.restore();
    if(kind==='futon'){const pd=st.dir+PI,pi=Math.round(((pd%TAU)+TAU)%TAU/DA)%N;const pr=DR[pi]*.62;ctx.globalAlpha=ft;blob(c.x+Math.cos(pd)*pr*U,c.y+Math.sin(pd)*pr*U-6*U,30*U,17*U,'#ffffff');ctx.globalAlpha=1;}}
  if(pk==='carpet'||kind==='carpet'){const al=kind==='carpet'?ft:pv*.5;ctx.globalAlpha=al;
    const tmp={r:DR,seed:D.seed};drawCarpet(tmp,c.x,c.y,1,1,kind==='carpet'?1:.6);ctx.globalAlpha=1;}
  ctx.restore();
}

/* ---------- update all ---------- */
function updChars(dt){
  const all=[S.chef].concat(S.animals);
  for(const c of all){
    c.t+=dt;
    c.sqv+=(-160*c.sq-9*c.sqv)*dt;c.sq+=c.sqv*dt;
    c.wob=Math.max(0,c.wob-dt*2.5);c.glow=Math.max(0,c.glow-dt);c.fluff=Math.max(0,c.fluff-dt);c.spin=Math.max(0,c.spin-dt);
    if(c.joy>0){c.joy-=dt;c.hop=Math.abs(Math.sin(S.t*9))*12*U;if(c.joy<=0)c.hop=0;}
    c.blinkT=(c.blinkT||0)-dt;if(Math.random()<dt*.35&&c.eyes==='open')c.blinkT=.12;
    // gaze
    let lx=A.dough.x,ly=A.dough.y;
    if(c.lookT>0){c.lookT-=dt;lx=c.lookX;ly=c.lookY;}
    else if(S.flight&&c.riding){lx=c.x;ly=c.y-100;}
    else if(S.giant&&S.giant.phase!=='wait'){lx=S.giant.x;ly=S.giant.y;}
    const gdx=lx-c.x,gdy=ly-(c.y-30*U),gd=Math.hypot(gdx,gdy)||1;c.gx=gdx/gd*1.3*c.face;c.gy=gdy/gd*1.1;
    if(c.riding||c.shuttle){continue;}
    if(c.sleeping){runPlan(c,dt);continue;}
    const busy=runPlan(c,dt);
    if(!c.cur&&!c.plan.length){
      c.pose='stand';c.arms='down';if(c.eyes!=='open'&&!c.sleepy)c.eyes='open';c.mouth='w';
      c.thinkT-=dt;
      if(c.thinkT<=0){c.thinkT=rnd(.1,.5);if(c===S.chef)chefThink(c);else animalThink(c);}
    }
    // preview reactions
    if(c!==S.chef&&avail(c)&&D.state==='pulling'){
      if(D.preview==='slope'&&!c.sleepy){const tx=A.hillTop.x+60*U,ty=A.gsY+30*U;const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);if(d>40*U){c.x+=dx/d*30*U*dt;c.y+=dy/d*30*U*dt;c.face=dx>0?1:-1;}c.arms='up';c.eyes='happy';}
      if(D.preview==='carpet'){c.arms='up';c.lookX=c.x;c.lookY=0;c.lookT=.1;}
      if(D.preview==='futon'&&c.sleepy){c.pose='sleep';}
    }
    if(c===S.chef&&D.state==='pulling'&&D.preview==='pizza'&&(!c.cur||c.cur.soft)){c.arms='up';c.mouth='o';}
  }
  // chef hunger
  const ch=S.chef;
  if(ch.fullT>0){ch.fullT-=dt;if(ch.fullT<=0)ch.hungry=true;}
  ch.growl=Math.max(0,ch.growl-dt);
  if(ch.hungry&&!S.flight){S.chefGrowlT-=dt;if(S.chefGrowlT<=0){S.chefGrowlT=rnd(5,7);ch.growl=.9;sfx('growl');ch.sq=.15;}}
  // sleepy yawns
  for(const a of S.animals){if(a.sleepy&&!a.sleeping&&!a.riding){a.yawnT-=dt;if(a.yawnT<=0){a.yawnT=rnd(4,7);a.sq=.25;emit(a.x+8*U,a.y-50*U,'bub',{vy:-20*U,life:1.2,s:3*U,c:'#8fb3ff'});}}}
  // sleepers wanted
  if(S.futons.length&&!S.flight&&Math.random()<dt*.5)callSleepers();
  // remove off-screen meal flag
  if(S.meal&&S.t>S.meal.until)S.meal=null;
}
function update(dt){
  S.t+=dt;
  updDough(dt);
  updChars(dt);
  for(let i=travelers.length-1;i>=0;i--){const it=travelers[i];updTravel(it,dt);if(!it.tr&&travelers[i]===it)travelers.splice(i,1);}
  for(const it of S.pizzas)updItem(it,dt);for(const it of S.futons)updItem(it,dt);for(const it of S.carpets)updItem(it,dt);
  for(const it of S.slopes){updItem(it,dt);if(it.place==='morph'){it.morph+=dt/1;if(it.morph>=1){it.place='lane';it.jig=1;sfx('slope');assignSliders(it);}}}
  if(S.oven.bake>0){S.oven.bake-=dt;if(Math.random()<dt*5)emit(A.oven.x+22*U,A.oven.y-96*U,'smoke',{vy:-40*U,vx:10*U,life:1.4,s:6*U,c:'rgba(255,255,255,.7)'});}
  const ovT=(S.oven.open||(D.state==='pulling'&&D.preview==='pizza')||(D.state==='formed'&&D.kind==='pizza'))?1:0;
  S.oven.openV=(S.oven.openV||0)+(ovT-(S.oven.openV||0))*Math.min(1,dt*6);
  S.treeShake=Math.max(0,S.treeShake-dt*2);
  S.treeRegrow+=dt;if(S.treeRegrow>9){S.treeRegrow=0;if(S.treeBerries<6)S.treeBerries++;}
  for(const k in S.wob)S.wob[k]=Math.max(0,S.wob[k]-dt*2.5);
  updBerries(dt);S.berries=S.berries.filter(b=>b.state!=='done');
  updFlight(dt);
  if(!S.flight&&cam.s<1)cam.s=Math.min(1,cam.s+dt);
  updGiant(dt);
  if(S.festival&&!S.giant&&!S.flight&&S.t-(S.lastGiant||-99)>150){S.giantT-=dt;if(S.giantT<=0){S.giantT=rnd(110,160);startGiant(0);}}
  updFest(dt);
  updWish(dt);
  for(const p of S.pizzas){if(p.cheese>0)p.cheese=Math.max(0,p.cheese-dt/1.6);}
  updParts(dt);
  candyK=clamp((.85-cam.s)/.35,0,1);
}
function assignSliders(it){
  const av=S.animals.filter(a=>avail(a)&&!a.sleepy);let n=0;
  for(const c of av){if(n>=3)break;const T=laneTop(it.lane);interrupt(c);
    c.plan=[wait(n*1.1),walk({x:A.hillTop.x-4*U+rnd(-6,6)*U,y:A.gsY+8*U},{sp:1.2}),jump({x:A.hillTop.x-4*U,y:(A.hillTop.y+A.gsY)/2},.45,26*U),jump(()=>({x:T.x+2*U,y:T.y-2*U}),.45,24*U),wait(.2,{arms:'up'}),{k:'slide',it}];n++;}
}

/* ---------- render ---------- */
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky();
  cam.px=W/2;cam.py=H*.97;
  const s=cam.s;
  ctx.setTransform(DPR*s,0,0,DPR*s,DPR*cam.px*(1-s),DPR*cam.py*(1-s));
  if(s<.999){drawGroundExt();ctx.drawImage(bg,0,0,W,H);}
  drawFestBack();
  drawHill();
  const lanes=S.slopes.slice().sort((a,b)=>a.lane-b.lane);
  for(const it of lanes)if(it.place==='lane')drawSlope(it);
  drawRolls();
  // y-sorted
  const L=[];
  L.push({y:A.tree.y,f:drawTree});
  L.push({y:A.oven.y,f:drawOven});
  L.push({y:A.basket.y,f:drawBasket});
  L.push({y:A.table.y,f:drawTable});
  L.push({y:A.bed.y,f:drawBed});
  L.push({y:A.rug.y+6*U,f:drawRug});
  for(const it of S.counter){if(it.place==='counter'){const p=itemPos(it);L.push({y:p.y+20*U,f:()=>{const q=itemPos(it);drawPizza(it,q.x,q.y,it.sc,it.sy);}});}}
  const ch=S.chef;
  if(ch.carry&&ch.carry.place==='hand'&&!ch.carry.tr){const it=ch.carry;L.push({y:ch.y+1,f:()=>{const q=it.place==='hand'?itemPos(it):{x:it.x,y:it.y};drawPizza(it,q.x,q.y,it.sc,it.sy);}});}
  if(S.flight&&S.flight.phase==='board'){const it=S.flight.it;L.push({y:it.y+40*U,f:()=>{ctx.fillStyle='rgba(90,50,40,.14)';polyPts(it.r,it.x+4*U,it.y+34*U,1,.5);pathPts(PB);ctx.fill();drawCarpet(it,it.x,it.y,it.sc,it.sy,1);}});}
  for(const b of S.berries){if(b.state==='ground'||b.state==='fall')L.push({y:b.y,f:()=>{if(!(b.state==='fall'&&b.delay>0))drawBerry(b.x,b.y,1.5,b.rot);}});}
  if(S.giant)L.push({y:S.giant.gy,f:drawGiant});
  const chars=[S.chef].concat(S.animals);
  for(const c of chars){
    if(S.flight&&S.flight.phase!=='board'&&c.riding)continue;
    let y=c.y;if(c.sleeping)y=A.bed.y+2;if(c.riding&&S.flight)y=S.flight.it.y+41*U;if(c.shuttle)y=A.rug.y+7*U;
    L.push({y,f:()=>drawChar(c)});
  }
  L.sort((a,b)=>a.y-b.y);
  for(const e of L)e.f();
  for(const it of travelers)if(it.tr)drawTraveler(it);
  for(const it of S.slopes)if(it.place==='morph')drawSlope(it);
  drawFlyers(dt);
  drawFestFront();
  drawParts('g');
  drawDough();
  drawDemo();
  drawBubble();
  // sky layer
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSkyLayer();
  drawParts('s');
}
function drawTraveler(it){
  if(it.kind==='pizza')drawPizza(it,it.x,it.y,it.sc,it.sy);
  else if(it.kind==='futon')drawFuton(it,it.x,it.y,it.sc,it.sy);
}

/* ---------- other taps ---------- */
function tapOther(x,y){
  // convert to world
  const s=cam.s;const wx=cam.px+(x-cam.px)/s,wy=cam.py+(y-cam.py)/s;
  let best=null,bd=60*U;
  for(const c of [S.chef].concat(S.animals)){const d=dist(wx,wy,c.x,c.y-25*U);if(d<bd){bd=d;best=c;}}
  if(best){best.wob=1;best.sq=.25;sfx('blip');return;}
  const objs=[['oven',A.oven.x,A.oven.y-40*U,60],['tree',A.tree.x,A.tree.y-70*U,55],['table',A.table.x,A.table.y-30*U,70]];
  for(const o of objs){if(dist(wx,wy,o[1],o[2])<o[3]*U){S.wob[o[0]]=1;sfx('blip');return;}}
}

function toLocal(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

/* ---------- loop ---------- */
let raf=0,lastT=0,running=false;
const DBG={timeScale:1};
function frame(t){
  raf=0;if(!running)return;
  let dt=(t-lastT)/1000;lastT=t;if(!(dt>0))dt=0;dt=Math.min(dt,1/30);
  const ts=DBG.timeScale;let steps=Math.max(1,Math.ceil(ts));const sd=dt*ts/steps;
  try{for(let i=0;i<steps;i++)update(sd);render(dt*ts);}catch(err){if(!frame.err){frame.err=1;console.error(err);}}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;lastT=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(pointerId!==null){pointerId=null;endPull();}stretchStop();if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
  else{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});start();}
});
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{if(pointerId!==null){pointerId=null;endPull();}layout();},60);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

function remap(oW,oH){
  const fx=W/oW,fy=H/oH;
  for(const c of [S.chef].concat(S.animals)){if(!c)continue;c.x*=fx;c.y*=fy;if(c.cur&&c.cur.k==='jump'){c.cur.x0*=fx;c.cur.y0*=fy;}}
  for(const b of S.berries){b.x*=fx;b.y*=fy;b.gx*=fx;b.gy*=fy;}
  if(S.giant){S.giant.x*=fx;S.giant.gy*=fy;}
  for(const arr of [S.pizzas,S.futons,S.carpets,S.counter])for(const it of arr){it.x*=fx;it.y*=fy;if(it.tr){it.tr.fx*=fx;it.tr.fy*=fy;if(typeof it.tr.tx==='number'){it.tr.tx*=fx;it.tr.ty*=fy;}}}
  for(const it of S.slopes){const nl=lmax(it.lane);it.L=Math.min(it.L*(nl/Math.max(1,it.Lmax0||nl)),nl);it.Lmax0=nl;}
  S.flyers.length=0;
}
