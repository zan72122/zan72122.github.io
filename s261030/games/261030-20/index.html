// ======================================================================
//  ring path geometry (island coordinates 0..180)
// ======================================================================
const RC={cx:90,cy:86,hw:64,hh:52,r:26};
const PSEG=[];let PLEN=0;const NS=8;let SL=0;
(function(){const{cx,cy,hw,hh,r}=RC;
 const L=(x,y,dx,dy,len)=>{PSEG.push({t:0,x,y,dx,dy,len,s0:PLEN});PLEN+=len;};
 const A=(x,y,a0)=>{const len=Math.PI/2*r;PSEG.push({t:1,cx:x,cy:y,a0,len,s0:PLEN});PLEN+=len;};
 L(cx,cy+hh,-1,0,hw-r);A(cx-hw+r,cy+hh-r,Math.PI/2);L(cx-hw,cy+hh-r,0,-1,2*(hh-r));A(cx-hw+r,cy-hh+r,Math.PI);
 L(cx-hw+r,cy-hh,1,0,2*(hw-r));A(cx+hw-r,cy-hh+r,Math.PI*1.5);L(cx+hw,cy-hh+r,0,1,2*(hh-r));A(cx+hw-r,cy+hh-r,0);L(cx+hw-r,cy+hh,-1,0,hw-r);
 SL=PLEN/NS;})();
const PT={x:0,y:0,tx:0,ty:0};
function pathAt(s,o){o=o||PT;s=mod(s,PLEN);let q=PSEG[PSEG.length-1];for(let i=0;i<PSEG.length;i++){if(s<=PSEG[i].s0+PSEG[i].len){q=PSEG[i];break;}}
 const d=s-q.s0;if(q.t===0){o.x=q.x+q.dx*d;o.y=q.y+q.dy*d;o.tx=q.dx;o.ty=q.dy;}else{const a=q.a0+d/RC.r;o.x=q.cx+Math.cos(a)*RC.r;o.y=q.cy+Math.sin(a)*RC.r;o.tx=-Math.sin(a);o.ty=Math.cos(a);}return o;}
const slotC=i=>i*SL;
const slotOf=s=>Math.floor(mod(s+SL/2,PLEN)/SL)%NS;
function slotPos(i,off,ds){const p=pathAt(slotC(i)+(ds||0),{});return{x:p.x+p.ty*off,y:p.y-p.tx*off,tx:p.tx,ty:p.ty};}
function bPos(k,off){const p=pathAt(k*SL+SL/2,{});return{x:p.x+p.ty*off,y:p.y-p.tx*off};}// boundary between slot k and k+1
function nearestS(x,y){let bs=0,bd=1e9;const o={};for(let s=0;s<PLEN;s+=1){pathAt(s,o);const d=(o.x-x)*(o.x-x)+(o.y-y)*(o.y-y);if(d<bd){bd=d;bs=s;}}return{s:bs,d:Math.sqrt(bd)};}
function insideRing(x,y,inset){const{cx,cy,hw,hh,r}=RC;const ax=Math.abs(x-cx),ay=Math.abs(y-cy);const W2=hw-inset,H2=hh-inset,R2=r-inset;if(ax>W2||ay>H2)return false;if(ax>W2-R2&&ay>H2-R2){return Math.hypot(ax-(W2-R2),ay-(H2-R2))<=R2;}return true;}

 for(const k in TP){const p=TP[k];p.Bed=hex(p.bed);p.Bed2=hex(p.bed2);p.Edge=hex(p.edge);p.Tie=hex(p.tie);p.A1=hex(p.a1);p.A2=hex(p.a2);}}

// ======================================================================
//  track piece rendering (pixel plotting into ImageData)
// ======================================================================
const RAIL=hex('#e4e9f2'),RAILD=hex('#5d6380'),COLW=hex('#ffffff'),COLY=hex('#ffd546'),COLN=hex('#5c3a28'),COLG=hex('#4a9a40'),COLGD=hex('#3a8a3e'),COLO=hex('#f59a3c'),COLT=hex('#f0c890'),COLC=hex('#8fdcf7'),COLR=hex('#e8414f');
function renderTrack(fn,s0,s1,T,seed){
  const st={};let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(let s=s0-4;s<=s1+4;s+=1){fn(s,st);minx=Math.min(minx,st.x);maxx=Math.max(maxx,st.x);miny=Math.min(miny,st.y);maxy=Math.max(maxy,st.y);}
  minx=Math.floor(minx-11);miny=Math.floor(miny-11);maxx=Math.ceil(maxx+11);maxy=Math.ceil(maxy+11);
  const w=maxx-minx+1,h=maxy-miny+1;const c=mkCanvas(w,h),x=c.getContext('2d'),id=x.createImageData(w,h),D=id.data;
  const Rn=mrand(seed||1);const pal=TP[T];const ghost=T==='ghost';
  const put=(px,py,col,a)=>{px=Math.round(px)-minx;py=Math.round(py)-miny;if(px<0||py<0||px>=w||py>=h)return;const k=(py*w+px)*4;D[k]=col[0];D[k+1]=col[1];D[k+2]=col[2];D[k+3]=a==null?255:a;};
  const alphaAt=(px,py)=>{px=Math.round(px)-minx;py=Math.round(py)-miny;if(px<0||py<0||px>=w||py>=h)return 0;return D[(py*w+px)*4+3];};
  const p0={},p1={};fn(s0,p0);fn(s1,p1);
  const inNotch=(px,py)=>{const dx=px-p0.x,dy=py-p0.y;return dx*dx+dy*dy<=10.5&&(dx*p0.tx+dy*p0.ty)>-0.6;};
  // bed
  for(let s=s0;s<=s1;s+=0.3){fn(s,st);for(let o=-6;o<=6;o+=0.5){const px=Math.round(st.x+st.ty*o),py=Math.round(st.y-st.tx*o);if(inNotch(px,py))continue;const edge=Math.abs(o)>=5.5;
    if(ghost){if(edge){if(Math.floor((s-s0)/2.5)%2===0)put(px,py,pal.Edge,235);}else if(alphaAt(px,py)<200)put(px,py,pal.Bed,46);}
    else put(px,py,edge?pal.Edge:pal.Bed);}}
  if(!ghost){
    for(let s=s0;s<=s1;s+=0.7){fn(s,st);const o=rr(-4.5,4.5);if(Rn()<0.35){const px=st.x+st.ty*o,py=st.y-st.tx*o;if(!inNotch(Math.round(px),Math.round(py)))put(px,py,pal.Bed2);}}
    // tab
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const px=Math.round(p1.x)+dx,py=Math.round(p1.y)+dy;const ddx=px-p1.x,ddy=py-p1.y;const d2=ddx*ddx+ddy*ddy;if(d2<=10.5&&(ddx*p1.tx+ddy*p1.ty)>0.4){put(px,py,d2>5.5?pal.Edge:pal.Bed);}}
    // ties
    for(let s=s0+2;s<s1-1;s+=4){fn(s,st);for(let o=-5;o<=5;o+=0.5){const px=Math.round(st.x+st.ty*o),py=Math.round(st.y-st.tx*o);if(inNotch(px,py))continue;put(px,py,pal.Tie);}}
    // rails (shadow then light)
    for(let pass=0;pass<2;pass++)for(let s=s0;s<=s1+0.5;s+=0.25){fn(s,st);for(const o of[-3,3]){const px=Math.round(st.x+st.ty*o),py=Math.round(st.y-st.tx*o);if(pass===0)put(px,py+1,RAILD);else put(px,py,RAIL);}}
    // decorations
    if(T!=='base'){for(let s=s0+3;s<s1-2;s+=3+Rn()*3){for(const side of[-1,1]){if(Rn()<0.4)continue;fn(s,st);const o=side*(7.5+Rn()*1.2);const px=Math.round(st.x+st.ty*o),py=Math.round(st.y-st.tx*o);deco(T,px,py,put,Rn,pal);}}}

function nearWater(x,y,m){const P=LY.pond,Lg=LY.lagoon;if(((x-P.x)/(P.rx+m))**2+((y-P.y)/(P.ry+m))**2<=1)return true;if(((x-Lg.x)/(Lg.rx+m))**2+((y-Lg.y)/(Lg.ry+m))**2<=1)return true;
  for(const q of LY.creek)if(dist(x,y,q.x,q.y)<m+3)return true;if(dist(x,y,LY.duckSpot.x,LY.duckSpot.y)<m+4)return true;return false;}

//  rules: placement, adjacency, train transitions

function disc(k){if(!W.disc[k]){W.disc[k]=T;DLOG.push([k,Math.round(T*10)/10]);}}
const DLOG=[];
function slotsChanged(){
  // adjacency-driven states
  const sl=W.slots;let pic=-1;
  for(let k=0;k<NS;k++){const a=sl[k],b=sl[(k+1)%NS];if((a==='U'&&b==='A')||(a==='A'&&b==='U')){pic=k;break;}}
  if(pic!==W.picnic){W.picnic=pic;W.picnicT=T;}
  // decor validity
  for(const k in W.decor){const d=W.decor[k];const key=(sl[+k]||'_')+(sl[(+k+1)%NS]||'_');if(key!==d.key)delete W.decor[k];}
  for(const k in W.party){if(sl[+k]!=='S')delete W.party[k];}
  if(PARK.on)festivalAssign(true);
}
function placePiece(i,T0,fromTray){
  const was=W.slots[i];W.slots[i]=T0;W.fx[i]=T;W.visited[i]=false;
  const p=slotPos(i,0);
  SFX.snap(T0);burst(T0,p.x,p.y,10,26);sparkles(p.x,p.y,6);
  // immediate little patch of season
  for(const c of cells){if(c.ok&&c.slot===i&&dist(c.x,c.y,p.x,p.y)<10&&!(PARK.on&&c.park)){c.tgt=T0;c.at=T+dist(c.x,c.y,p.x,p.y)/40;}}
  train.moleWave=1.4;excite=Math.min(6,excite+1);
  if(was&&was!==T0)W.hist.swaps++;
  slotsChanged();
  const ch=chain();
  if(ch.closed&&!closedNow){onClose();}
  // reactions
  if(T0==='S'&&LY.adj.includes(i)){emote(duck,'spark',1);}
  if(T0==='F'&&LY.adj.includes(i)&&W.pond.ice>0.3){W.pond.hint=1;emote(duck,'drop',1.6);}
  for(const r of rabs)if(r.state==='wait'&&T0==='S'){emote(r,'flake',1.5);jump(r,4);}
  if(T0==='A')for(const s of sqs){emote(s,'acorn',1.4);}
}
function removePiece(i){const t=W.slots[i];W.slots[i]=null;W.fx[i]=T;slotsChanged();if(closedNow){closedNow=false;}return t;}
function onClose(){
  closedNow=true;
  if(!PARK.on){startPark();}
  else{SFX.fanfare();confetti(LY.wheel.x,LY.wheel.y-20,30);PARK.spin=2;for(const a of animals){jump(a,6);mood(a,'happy',1.5);}}
}
function visitSlot(j){
  const t=W.slots[j];if(!t||t==='base')return;W.visited[j]=true;
  const hp=pathAt(train.s,{});
  for(const c of cells){if(!c.ok||c.slot!==j||!c.near)continue;if(PARK.on&&c.park)continue;if(c.cur===t&&!c.tgt)continue;c.tgt=t;c.at=T+0.05+dist(c.x,c.y,hp.x,hp.y)/70;}
}
function headEnter(j){
  const a=W.slots[mod(j-1,NS)],b=W.slots[j];if(!b)return;
  visitSlot(j);if(b==='base'||!a)return;
  const k=mod(j-1,NS);
  if(a!=='base'){
    const key=a+b;const d=W.decor[k];
    if(d&&d.key===key){d.lv=Math.min(3,d.lv+1);d.t=T;}else W.decor[k]={key,lv:1,t:T,born:T};
    disc('pair_'+key);
    if(key==='SF')melt(k);
    else if(key==='FS')chill(k);
    else if(key==='SU'){SFX.sparkle();}
    else if(key==='FF'){for(let i=0;i<2;i++)addP('bfly',bPos(k,0).x,bPos(k,0).y,rr(-8,8),-6,6,pick(['#ff8fc0','#ffd546','#b48cff']),{bf:true});}
    else if(key==='AA'){for(const s of sqs)if(dist(s.x,s.y,bPos(k,12).x,bPos(k,12).y)<40){jump(s,7);}}
  }

}
function wagonAt(j){

  if(b==='A')nutLoad(j);
  if(b==='S')snowArrive(j);
  if(a==='F'&&b==='U')honeyLoad(j);
  if(a==='F'&&b==='S')beesCold(j);

const wagonPos=()=>pathAt(train.s-CAR_OFF[2],{});
function cargoAdd(it){if(W.cargo.length>=4)return false;W.cargo.push(it);return true;}
function cargoTake(pred){const i=W.cargo.findIndex(pred);if(i<0)return null;return W.cargo.splice(i,1)[0];}
// ---------- pond ----------
function melt(k){const P=W.pond;const bp=bPos(k,0);
  for(let i=0;i<8;i++)addP('petal',bp.x,bp.y,(LY.pond.x-bp.x)*rr(0.4,0.8),(LY.pond.y-bp.y)*rr(0.4,0.8),rr(1.2,2),pick(SEASONC.F));
  if(P.state==='ice'||P.state==='icecreek'){P.state='melting';P.meltT=0;SFX.water();disc('melt');emote(duck,'spark',1.5);mood(duck,'wow',1);}
  else if(P.state==='water'){P.ringT=T;SFX.sparkle();}
}
function chill(k){const P=W.pond;const bp=bPos(k,0);
  for(let i=0;i<8;i++)addP('flake',bp.x,bp.y,(LY.pond.x-bp.x)*rr(0.4,0.8),(LY.pond.y-bp.y)*rr(0.4,0.8),rr(1.2,2),'#ffffff');
  if(P.state==='creek'){P.state='refreeze';SFX.ice();disc('refreeze');emote(duck,'flake',1.5);}
  else if(P.state==='water'){P.frostT=T;SFX.ice();}
  else if(P.state==='ice'){P.ringT=T;}

function pondUpdate(dt){
  const P=W.pond;const snowNear=LY.adj.some(i=>W.slots[i]==='S');const flowerNear=LY.adj.some(i=>W.slots[i]==='F');
  if(DRAG_HINT_F)P.hint=1;else if(flowerNear&&(P.state==='ice'))P.hint=approach(P.hint,0.7,dt);else P.hint=approach(P.hint,0,dt*0.7);
  switch(P.state){
    case 'water':P.ice=approach(P.ice,(T-(P.frostT||-9)<4)?0.35:0,dt/2.5);P.cIce=approach(P.cIce,0,dt);P.creek=approach(P.creek,0,dt/6);
      if(snowNear){P.state='ice';SFX.ice();disc('ice');emote(duck,'wow',1.3);mood(duck,'wow',1.2);}break;
    case 'ice':P.ice=approach(P.ice,1,dt/2.6);if(!snowNear){P.thaw=(P.thaw||0)+dt;if(P.thaw>5){P.ice=approach(P.ice,0,dt/5);if(P.ice<=0){P.state='water';P.thaw=0;}}}else P.thaw=0;break;
    case 'melting':P.meltT+=dt;P.ice=approach(P.ice,0,dt/3.2);if(P.meltT>0.9)P.creek=approach(P.creek,1,dt/2.6);P.cIce=approach(P.cIce,0,dt/2);
      if(rnd()<dt*14){const a=rnd()*TAU;addP('drop',LY.pond.x+Math.cos(a)*LY.pond.rx*0.8,LY.pond.y+Math.sin(a)*LY.pond.ry*0.8,0,-10,0.5,'#8fdcf7',{g:40});}
      if(P.ice<=0&&P.creek>=1){P.state='creek';}break;
    case 'creek':P.creek=approach(P.creek,1,dt/2);P.ice=approach(P.ice,0,dt);P.cIce=approach(P.cIce,0,dt/2);break;
    case 'refreeze':P.cIce=approach(P.cIce,1,dt/2.8);P.ice=approach(P.ice,1,dt/2.8);if(P.cIce>=1)P.state='icecreek';break;
    case 'icecreek':P.cIce=1;P.ice=approach(P.ice,1,dt);break;
  }
}

function beesFollow(){let any=false;for(const b of bees){if(b.state==='home'||b.state==='stall'||b.state==='wander'){b.state='follow';b.t=0;b.carry=true;any=true;}}if(any){SFX.buzz();disc('beesFollow');}}

const PARK={on:false,t:0,spin:0,wheelA:0,carA:0,stalls:[],tilesDone:false,assignKey:'',rebuildN:0,quiet:0};
function startPark(){
  PARK.on=true;PARK.t=0;disc('park');SFX.fanfare();setTimeout(()=>SFX.rise(),500);
  const C={x:RC.cx,y:RC.cy};
  for(const c of cells){if(c.ok&&c.park){c.tint=W.slots[c.slot]||'base';c.tgt='P';c.at=T+0.6+dist(c.x,c.y,C.x,C.y)/55;}}
  PARK.stalls=LY.spots.map((s,i)=>({i,x:s.x,y:s.y,slot:s.slot,owner:null,kind:null,goods:[],prop:null,season:null,buildT:-9,key:''}));
  festivalAssign(false);
  for(const a of animals){jump(a,7);mood(a,'wow',1.5);}
  // guests arrive
  if(guests.length===0){const gk=[['frog',['ice','lemon','skate','boat','snowball']],['hedgehog',['nut','cookie','roast','cake','soup']],['chick',['pop','crown','candy','carrot','balloon']]];
    gk.forEach(([k,lk],i)=>{const b=LY.bench[2+i];const a=mkA(k,b.x+(i-1)*30,182,{spd:20,passenger:true,likes:lk,guest:true});a.home={x:b.x,y:b.y};a.state='home';walkTo(a,b.x,b.y,20);guests.push(a);});}
}
function ownerExp(o){const H=W.hist;if(o==='bees')return H.honey+H.bouquet+(W.disc.beesFollow?1:0)>0;if(o==='squirrels')return H.nuts>0||W.disc.picnic;if(o==='rabbits')return H.rides>0||H.parties>0;return false;}
const FAV={bees:['F','U'],squirrels:['A','U'],rabbits:['S','F']};
function groupGifts(o){const arr=o==='squirrels'?sqs:o==='rabbits'?rabs:[];const s=new Set();for(const a of arr)for(const gi of a.gifts)s.add(gi);return s;}
function stallFor(owner,season){
  const H=W.hist,gs=groupGifts(owner);let icons=[],prop=null;
  if(owner==='bees'){icons=[{S:'ice',F:'candy',U:'lemon',A:'cookie',base:'candy'}[season]];prop={S:'icecube',F:'arch',U:'parasol',A:'leafpile',base:'arch'}[season];
    for(let i=0;i<Math.min(H.honeyDel+H.honey>0?2:0,2);i++)icons.push('honey');if(H.bouquetDel>0)icons.push('crown');if(H.honey+H.honeyDel===0)icons[0]={S:'snowball',F:'crown',U:'balloon',A:'leaf',base:'crown'}[season];}
  else if(owner==='squirrels'){icons=[{S:'roast',F:'cake',U:'pop',A:'leaf',base:'roast'}[season]];prop={S:'lantern',F:'garden',U:'parasol',A:'leafpile',base:'lantern'}[season];
    if(H.nutsDel>0)icons.push('nut');if(H.nutsDel>2)icons.push('nut');if(H.gold>0)icons.push('star');}
  else if(owner==='rabbits'){icons=[{S:H.parties>0?'cup':'snowball',F:'carrot',U:'parasol',A:'soup',base:'carrot'}[season]];prop={S:'snowman',F:'garden',U:'parasol',A:'lantern',base:'garden'}[season];
    if(H.parties>0)icons.push('cookie');}
  if(gs.has('honey'))icons.push('honey');if(gs.has('bouquet'))icons.push('crown');if(gs.has('nut'))icons.push('nut');if(gs.has('gold'))icons.push('star');
  icons=icons.slice(0,4);return{icons,prop};
}
function festivalAssign(animate){
  const owners=['bees','squirrels','rabbits'].filter(ownerExp);
  const free=PARK.stalls.map(s=>s.i);const asg={};
  for(const o of owners){let best=-1,bs=-1e9;for(const i of free){const st=PARK.stalls[i];const t=W.slots[st.slot];const f=FAV[o];const sc=(t===f[0]?3:t===f[1]?2:0)-i*0.01;if(sc>bs){bs=sc;best=i;}}
    if(best>=0){asg[o]=best;free.splice(free.indexOf(best),1);}}
  let changed=false;
  for(const st of PARK.stalls){
    let owner=null;for(const o in asg)if(asg[o]===st.i)owner=o;
    const season=W.slots[st.slot]||'base';let kind,icons=[],prop=null;
    if(owner){const r=stallFor(owner,season);icons=r.icons;prop=r.prop;kind=owner+season;}
    else if(W.hist.gold>0&&!st.goldTaken&&free[0]===st.i){kind='gold';icons=['star','gold'];prop='sparkle';owner='gold';}
    else{kind='free'+season;prop={S:'snowman',F:'garden',U:'parasol',A:'leafpile',base:'garden'}[season];}
    const key=kind+'|'+icons.join(',')+'|'+prop;
    if(key!==st.key){if(st.key&&animate){changed=true;}st.key=key;st.kind=kind;st.owner=owner;st.icons=icons;st.prop=prop;st.season=season;st.buildT=T;}
  }
  PARK.asg=asg;
  if(changed&&animate){disc('rebuild');PARK.rebuildN++;SFX.cheer(1);for(const st of PARK.stalls)if(T-st.buildT<0.1)confetti(st.x,st.y-10,8);}
  // gondola tints
  for(const c of cells){if(c.ok&&c.park&&c.cur==='P'){const nt=W.slots[c.slot]||'base';if(nt!==c.tint){c.tint=nt;c.tgt='P';c.at=T+0.2+rnd()*0.8;}}}
}
function stallPos(o){if(!PARK.asg||PARK.asg[o]==null)return null;const st=PARK.stalls[PARK.asg[o]];return st;}

//  train update
// ======================================================================
let wasClosed=false;
function trainUpdate(dt){
  const ch=chain();
  const tr=train;
  if(tr.settle){tr.settle.t+=dt/0.7;const k=ease(tr.settle.t);tr.s=mod(tr.settle.from+tr.settle.d*k,PLEN);tr.v=0;if(tr.settle.t>=1){tr.settle=null;tr.state=tr.settleState||'end';tr.timer=2.5;}return;}
  if(!ch.closed){
    const u=uOf(ch);const umin=UMIN,umax=ch.len-UEND;
    if(u<umin-0.6||u>umax+0.6){
      let target;if(u<umin-0.6)target=umin;else target=umax;
      if(u>umax+0.6){const dBack=u-umax,dFwd=(PLEN-u)+umin;if(dFwd<dBack&&ch.len<PLEN)target=umin+PLEN;}
      tr.settle={from:tr.s,d:target-u,t:0};if(tr.settle.d>PLEN/2)tr.settle.d-=PLEN;tr.settleState=target>=umax-1?'end':'start';
      tr.surprise=1;SFX.boing();return;}
  }
  let mul=DRAGITEMS>0?0.3:1;
  if(tr.state==='station'){tr.v=0;tr.stopT-=dt;if(tr.stopT<=0){tr.state=ch.closed?'loop':'run';SFX.toot();}}
  else if(ch.closed){
    if(tr.state!=='loop'){if(tr.v<0)tr.v=Math.min(0,tr.v+DEC*dt);else{tr.state='loop';SFX.whistle();}}
    if(tr.state==='loop')tr.v=approach(tr.v,VMAX*mul,ACC*dt);
  }else{
    const u=uOf(ch),umin=UMIN,umax=ch.len-UEND;
    if(tr.state==='loop')tr.state='run';
    if(ch.a!==tr.chainA&&tr.state==='end')tr.timer=Math.min(tr.timer,0.9);
    tr.chainA=ch.a;
    if(tr.state==='run'){const rem=umax-u;const vt=rem<(tr.v*tr.v)/(2*DEC)+0.2?0:VMAX*mul;tr.v=approach(tr.v,vt,(vt<tr.v?DEC:ACC)*dt);
      if(rem<=0.25&&tr.v<3){tr.v=0;tr.state='end';tr.timer=3.6;tr.molePoint=1.5;SFX.toot();}}
    else if(tr.state==='end'){tr.v=0;tr.timer-=dt;if(umax-u>1.2){tr.state='run';SFX.whistle();tr.moleWave=Math.max(tr.moleWave,0.8);}
      else if(tr.timer<=0&&umax-umin>20)tr.state='back';else if(tr.timer<=0){tr.timer=4;tr.molePoint=1.5;}}
    else if(tr.state==='back'){const rem=u-umin;const vt=rem<(tr.v*tr.v)/(2*DEC)+0.2?0:-VB;tr.v=approach(tr.v,vt,(vt>tr.v?DEC:ACC)*dt);if(rem<=0.25&&tr.v>-3){tr.v=0;tr.state='start';tr.timer=1.1;}}
    else if(tr.state==='start'){tr.v=0;tr.timer-=dt;if(tr.timer<=0){tr.state='run';SFX.whistle(0.7);}}
  }
  // integrate
  const ds=tr.v*dt;if(ds===0)return;
  const prev=tr.s;let ns=tr.s+ds;
  if(!ch.closed){const u=uOf(ch)+ds;const uc=clamp(u,UMIN,ch.len-UEND);ns=ch.startS+uc;}
  tr.s=mod(ns,PLEN);
  const d=ds;
  if(d>0){
    // head enters slot
    const h0=slotOf(prev),h1=slotOf(tr.s);if(h0!==h1)headEnter(h1);
    const w0=prev-CAR_OFF[2],w1=tr.s-CAR_OFF[2];for(let j=0;j<NS;j++){const c=slotC(j);if(mod(c-w0,PLEN)<=d&&mod(c-w0,PLEN)>0)wagonAt(j);}
    const c0=prev-CAR_OFF[1];for(let j=0;j<NS;j++){const c=slotC(j);if(mod(c-c0,PLEN)<=d&&mod(c-c0,PLEN)>0)coachAt(j);}
    if(mod(STOP_S-prev,PLEN)<=d&&mod(STOP_S-prev,PLEN)>0&&tr.state!=='station'){
      tr.state='station';tr.stopT=1.5;stationArrive();if(ch.closed){W.laps++;onLap();}}
  }
  tr.wheel+=Math.abs(ds)*0.5;tr.clack+=Math.abs(ds);
  if(tr.clack>9){tr.clack=0;SFX.clack(Math.min(1,Math.abs(tr.v)/VMAX)+0.2,false);setTimeout(()=>SFX.clack(Math.min(1,Math.abs(tr.v)/VMAX)+0.2,true),90);}
}

function coachAt(j){
  for(let si=0;si<train.seats.length;si++){const a=train.seats[si];if(!a)continue;if(a.dest===j&&j!==0){alight(a,si,j);}}
}
function alight(a,si,j){train.seats[si]=null;a.seat=-1;const cp=pathAt(train.s-CAR_OFF[1],{});a.x=cp.x;a.y=cp.y;jump(a,8);SFX.hop();
  a.state='goto';let pt=a.destPt||slotPos(j,15);walkTo(a,pt.x,pt.y,a.spd);}
function chooseDest(a){
  // returns {slot, pt}
  const sl=W.slots;
  if(PARK.on){let best=null,bs=0;for(const st of PARK.stalls){let sc=0;for(const ic of st.icons||[])if(a.likes.includes(ic))sc+=2;if(st.owner)sc+=0.5;if(st.prop&&a.likes.includes(st.prop))sc+=1;if(sc>bs){bs=sc;best=st;}}
    if(a.kind==='frog'&&(W.pond.state==='creek'||W.pond.state==='icecreek'||W.pond.ice>0.5)){return{slot:nearestSlotTo(LY.duckSpot),pt:{x:LY.duckSpot.x+rr(-4,4),y:LY.duckSpot.y+4}};}
    if(best&&(bs>0.6))return{slot:best.slot,pt:{x:best.x+rr(-6,6),y:best.y+rr(5,8)},stall:best.i};
    return{slot:nearestSlotTo(LY.wheel),pt:{x:LY.wheel.x+rr(-10,10),y:LY.wheel.y+28},wheel:true};}
  if(a.kind!=='rabbit')return null;
  let c=[];for(let i=1;i<NS;i++){if(sl[i]==='S'&&W.party[i])c.push([i,4]);else if(sl[i]==='S')c.push([i,3]);else if(sl[i]==='F')c.push([i,1]);}
  if(!c.length)return null;c.sort((x,y)=>y[1]-x[1]);const top=c.filter(q=>q[1]===c[0][1]);const ch=pick(top)[0];
  const p=slotPos(ch,15);return{slot:ch,pt:{x:p.x+rr(-7,7),y:p.y+rr(2,5)}};
}
function nearestSlotTo(p){return slotOf(nearestS(p.x,p.y).s);}
function boarding(){
  const tr=train;if(Math.abs(tr.v)>0.5)return;const cp=pathAt(tr.s-CAR_OFF[1],{});if(dist(cp.x,cp.y,90,138)>10)return;
  for(const a of animals){if(!a.passenger||a.state!=='wait'||a.cool>0)continue;const si=tr.seats.indexOf(null);if(si<0)break;
    const d=chooseDest(a);if(!d){if(rnd()<0.005)emote(a,'note',1);continue;}
    const ch=chain();if(!ch.closed){let ok=false;for(let k=0;k<ch.n;k++)if(mod(ch.a+k,NS)===d.slot)ok=true;if(!ok)continue;}
    a.dest=d.slot;a.destPt=d.pt;a.destStall=d.stall;a.state='board';walkTo(a,cp.x,cp.y-2,30);a.seatWant=si;tr.seats[si]=a;}
}

    if(a.emoT>0)a.emoT-=dt;else a.emo=null;if(a.moodT>0)a.moodT-=dt;else a.mood='';
    if(a.jumpT>0)a.jumpT-=dt;if(a.cool>0)a.cool-=dt;
    a.look=null;
    if(dist(a.x,a.y,tp.x,tp.y)<45)a.look={x:tp.x,y:tp.y};
    for(const dg of DRAGS.values()){if(dist(a.x,a.y,dg.x,dg.y)<70){a.look={x:dg.x,y:dg.y};}}
    if(a===duck)duckUpdate(a,dt);else if(a.kind==='squirrel')sqUpdate(a,dt);else if(a.passenger)passUpdate(a,dt);

      else{a.moving=false;a.hop=0;if(a.look&&!AK[a.kind].front)a.flip=a.look.x<a.x;}}
    if(W.danceT>0&&a.state!=='ride'){a.hop=Math.abs(Math.sin(T*9+a.id))*4;}
  }
}
function duckUpdate(a,dt){

  if(st==='water'||(st==='ice'&&P.ice<0.5)){a.state='swim';a.swim=true;a.slide=false;a.wp=0;a.ang=(a.ang||0)+dt*0.6;const tx=pd.x+Math.cos(a.ang)*pd.rx*0.45,ty=pd.y+Math.sin(a.ang)*pd.ry*0.35+1;a.flip=Math.cos(a.ang+Math.PI/2)<0;a.x=lerp(a.x,tx,dt*3);a.y=lerp(a.y,ty,dt*3);a.hop=Math.sin(T*4)*0.6;}
  else if(st==='ice'||(st==='melting'&&P.ice>0.45)){a.state='skate';a.swim=false;a.slide=true;
    a.sk=(a.sk||0)+dt*(1.1);const tx=pd.x+Math.sin(a.sk)*pd.rx*0.6,ty=pd.y+Math.sin(a.sk*2)*pd.ry*0.2+1;const vx=Math.cos(a.sk);a.flip=vx<0;a.tilt=Math.round(vx*1.2);a.x=lerp(a.x,tx,dt*4);a.y=lerp(a.y,ty,dt*4);a.hop=0;
    a.slipT=(a.slipT||rr(4,8))-dt;if(a.slipT<=0){a.slipT=rr(5,9);jump(a,4);mood(a,'blush',1.6);emote(a,'drop',1.4);SFX.quack();a.spin=0.6;}
    if(a.spin>0){a.spin-=dt;a.flip=Math.floor(a.spin*10)%2===0;}}
  else if(st==='melting'||st==='creek'){a.slide=false;a.swim=true;a.state='swim';
    // travel creek pond->lagoon
    if(P.creek>0.6){a.wp=Math.min(1,(a.wp||0)+dt*0.12);}
    let x,y;if(a.wp<1){const q=creekAt(a.wp);x=q.x;y=q.y;const q2=creekAt(Math.min(1,a.wp+0.02));a.flip=q2.x<q.x;}
    else{a.ang=(a.ang||0)+dt*0.7;x=lg.x+Math.cos(a.ang)*lg.rx*0.45;y=lg.y+Math.sin(a.ang)*lg.ry*0.3;a.flip=Math.cos(a.ang+Math.PI/2)<0;if(!W.disc.duckShore){disc('duckShore');emote(a,'heart',1.5);SFX.quack();}}
    if(a.wp<0.02&&st==='melting'){x=pd.x;y=pd.y+1;}
    a.x=lerp(a.x,x,dt*4);a.y=lerp(a.y,y,dt*4);a.hop=Math.sin(T*4)*0.6;}
  else if(st==='refreeze'||st==='icecreek'){a.state='skate';a.swim=false;a.slide=true;
    a.sk=(a.sk||0)+dt*0.32;const u=(Math.sin(a.sk)+1)/2;const q=creekAt(u),q2=creekAt(clamp(u+0.02*Math.sign(Math.cos(a.sk)),0,1));a.flip=q2.x<q.x;a.tilt=Math.cos(a.sk)>0?1:-1;
    a.x=lerp(a.x,q.x,dt*5);a.y=lerp(a.y,q.y,dt*5);a.hop=0;if(!W.disc.duckLane&&st==='icecreek'){disc('duckLane');SFX.quack();mood(a,'happy',1.5);}}
}
function creekAt(t){const C=LY.creek;const f=clamp(t,0,1)*(C.length-1);const i=Math.min(C.length-2,Math.floor(f));const k=f-i;return{x:lerp(C[i].x,C[i+1].x,k),y:lerp(C[i].y,C[i+1].y,k)};}
function aStation(){for(let i=1;i<NS;i++)if(W.slots[i]==='A')return i;return -1;}
function sqUpdate(a,dt){

  if(a.state==='chase'){a.chaseT-=dt;const wp=pathAt(train.s-CAR_OFF[2]-10-a.idx*6,{});walkTo(a,wp.x+off*0.3,wp.y+3,Math.max(26,Math.abs(train.v)+10));

  if(W.picnic>=0){const p=bPos(W.picnic,17);if(T-W.picnicT>2.2){walkTo(a,p.x+off*0.9,p.y+2,30);if(arrived(a)){if(!W.disc.picnic){disc('picnic');W.hist.picnics++;SFX.cheer(1);hearts(p.x,p.y-8,3);}a.state='picnic';if(rnd()<dt*0.4){jump(a,2);}}}return;}

function passUpdate(a,dt){
  a.st+=dt;
  switch(a.state){
    case 'home':walkTo(a,a.home.x,a.home.y,a.spd);if(arrived(a)){a.state='wait';a.cool=3;}break;
    case 'wait':if(arrived(a)&&rnd()<dt*0.25){jump(a,2);}if(rnd()<dt*0.1&&!a.emo){a.wantT=0;}break;
    case 'board':{const cp=pathAt(train.s-CAR_OFF[1],{});walkTo(a,cp.x,cp.y-2,32);if(Math.abs(train.v)>0.6&&!arrived(a)){// train left
        const si=train.seats.indexOf(a);if(si>=0)train.seats[si]=null;a.state='home';break;}
      if(arrived(a)){a.state='ride';a.seat=train.seats.indexOf(a);jump(a,4);SFX.hop();W.hist.rides++;disc('ride');}break;}
    case 'ride':{const ch=chain();if(!ch.closed&&train.state==='station'){// at station with unreachable dest
        let ok=false;for(let k=0;k<ch.n;k++)if(mod(ch.a+k,NS)===a.dest)ok=true;if(!ok){const si=train.seats.indexOf(a);if(si>=0)train.seats[si]=null;a.seat=-1;a.state='home';a.x=pathAt(train.s-CAR_OFF[1]).x;a.y=PT.y;}}
      if(train.seats.indexOf(a)<0&&a.state==='ride'){a.state='home';}break;}
    case 'goto':if(arrived(a)){a.state='visit';a.visitT=rr(14,22);a.st=0;jump(a,4);emote(a,'heart',1.2);
        if(a.dest!=null&&W.party[a.dest])hearts(a.x,a.y-10,2);disc(a.guest?'guestVisit':'rabbitVisit');}break;
    case 'visit':a.visitT-=dt;
      if(rnd()<dt*0.5)jump(a,3);
      if(a.kind==='rabbit'&&W.slots[a.dest]==='S'&&!W.party[a.dest]&&W.urge&&T-(W.urge[a.dest]||-9)<4){if(!a.emo)emote(a,'bub_nut',2.5);}
      if(a.visitT<=0||(a.dest!=null&&!PARK.on&&!W.slots[a.dest])){a.state='home';walkTo(a,a.home.x,a.home.y,a.spd);}break;
  }
}
function beesUpdate(dt){

        if(W.stn.honey>0&&i<2){tx=62+Math.cos(b.t*1.2+i*3)*7;ty=152+Math.sin(b.t*1.7+i)*3;break;}

      case 'follow':tx=wp.x+Math.cos(b.t*3+i*1.6)*6;ty=wp.y-10+Math.sin(b.t*4+i)*3;k=4;if(b.t>30)b.state='return';break;

      case 'return':tx=LY.hive.x;ty=LY.hive.y-6;k=2;if(dist(b.x,b.y,tx,ty)<5){b.state='home';b.t=rr(0,9);}break;
      default:tx=b.x;ty=b.y;}
    b.x=lerp(b.x,tx,clamp(dt*k,0,1));b.y=lerp(b.y,ty,clamp(dt*k,0,1))+Math.sin(b.ph)*0.15;b.flip=tx<b.x;
    if(b.carry&&rnd()<dt*3)addP('spark',b.x,b.y+1,0,6,0.4,'#ffd546');

}

const HINT={sug:null,t:0,beckon:0,beckonSlot:-1,demoDone:false,demo:0,recalc:0};
function suggest(){
  const sl=W.slots,D=W.disc;const ch=chain();
  // gift suggestion when cargo and wanting animals
  if(W.cargo.length>0&&(ch.closed||train.state==='end')){
    const it=W.cargo[W.cargo.length-1];let who=null;
    if(PARK.on||W.disc.party){for(const a of[...rabs,...sqs,...guests]){if(a.state==='ride'||a.state==='board')continue;if(!a.gifts.includes(it)){who=a;break;}}}
    if(who&&(ch.closed&&(W.disc.park&&(T-(W.disc.park||0)>12))))return{kind:'gift',item:it,a:who};
  }
  if(!ch.closed){
    const gF=mod(ch.b+1,NS),gB=mod(ch.a-1,NS);const prevF=sl[ch.b],nextB=sl[ch.a];
    const opts=[];
    const want=(g,prev,next)=>{
      if(!D.ice&&LY.adj.includes(g))return['S',5];
      if(prev==='S'&&!D.melt&&W.pond.state==='ice')return['F',5];
      if(prev==='F'&&!D.honey)return['U',4];
      if((prev==='U'||next==='U')&&!D.picnic)return['A',4];
      if(prev==='A'&&!D.party)return['S',4];
      if(next==='S'&&!D.party&&prev!=='A')return['A',3];
      if(prev==='S'&&!D.melt)return['F',3];
      const cnt={};for(const t of TYPES)cnt[t]=0;for(const t of sl)if(cnt[t]!=null)cnt[t]++;
      const c=TYPES.filter(t=>t!==prev).sort((a,b)=>cnt[a]-cnt[b]);return[c[0],1];};
    const f=want(gF,prevF,sl[mod(gF+1,NS)]);opts.push({slot:gF,type:f[0],sc:f[1]+0.5});
    if(gB!==gF){const b=want(gB,sl[mod(gB-1,NS)],nextB);opts.push({slot:gB,type:b[0],sc:b[1]});}
    opts.sort((a,b)=>b.sc-a.sc);return{kind:'place',type:opts[0].type,slot:opts[0].slot};
  }
  // closed: swap to make something new
  const cand=[];
  for(let i=1;i<NS;i++){for(const t of TYPES){if(sl[i]===t)continue;const a=sl[mod(i-1,NS)],b=sl[(i+1)%NS];let sc=rnd()*0.5;
    if(!D.melt&&a==='S'&&t==='F')sc+=3;if(!D.refreeze&&a==='F'&&t==='S'&&W.pond.state==='creek')sc+=3;if(!D.honey&&a==='F'&&t==='U')sc+=3;if(!D.party&&a==='A'&&t==='S')sc+=2.5;if(!D.picnic&&(a==='U'||b==='U')&&t==='A')sc+=2.5;
    if(!D.ice&&LY.adj.includes(i)&&t==='S')sc+=3;if(!D.rebuild){const st=PARK.stalls.find(s=>s.slot===i);if(st)sc+=1.5;}cand.push({slot:i,type:t,sc});}}
  cand.sort((a,b)=>b.sc-a.sc);const c=cand[0];return c?{kind:'swap',type:c.type,slot:c.slot}:null;
}
function hintUpdate(dt){
  HINT.recalc-=dt;if(HINT.recalc<=0||!HINT.sug){HINT.recalc=0.6;const s=suggest();if(!HINT.sug||!s||s.kind!==HINT.sug.kind||s.type!==HINT.sug.type||s.slot!==HINT.sug.slot||s.a!==HINT.sug.a){if(DRAGS.size===0)HINT.sug=s;}}
  HINT.t+=dt;if(HINT.beckon>0)HINT.beckon-=dt;
  const idle=T-lastInput;
  if(idle>10&&!HINT.demoDone&&DRAGS.size===0&&HINT.sug&&HINT.sug.kind!=='gift'){HINT.demoDone=true;HINT.demo=2.2;train.molePoint=2.2;SFX.toot();}
  if(HINT.demo>0)HINT.demo-=dt;
}

const GULLS=[];const CLOUDS=[];
function update(dt){
  T+=dt;excite=Math.max(0,excite-dt*0.35);
  if(W.danceT>0)W.danceT-=dt;
  // tray refill
  for(const c of TRAYC){if(!c.has){c.refill-=dt;if(c.refill<=0){c.has=true;c.hopT=0.45;c.pop=0.3;}}if(c.hopT>0)c.hopT-=dt;if(c.pop>0)c.pop-=dt;}
  DRAG_HINT_F=false;for(const d of DRAGS.values()){if(d.kind==='piece'&&d.type==='F'&&d.snap>=0&&LY.adj.includes(d.snap)&&W.pond.ice>0.3)DRAG_HINT_F=true;}
  trainUpdate(dt);trainSFXUpdate(dt);boarding();
  pondUpdate(dt);animalsUpdate(dt);beesUpdate(dt);
  // mole
  const tr=train;if(tr.moleWave>0)tr.moleWave-=dt;if(tr.moleJump>0)tr.moleJump-=dt;if(tr.molePoint>0)tr.molePoint-=dt;if(tr.moleMoodT>0)tr.moleMoodT-=dt;else tr.moleMood='';if(tr.surprise>0)tr.surprise-=dt*1.2;
  tr.moleBlink-=dt;if(tr.moleBlink<-0.13)tr.moleBlink=rr(1.5,4);
  // ground cells
  for(const c of cells){if(c.tgt&&T>=c.at){const t=c.tgt;c.tgt=null;if(c.cur!==t||t==='P'){c.cur=t;paintCell(c,t);c.pop=T;
      if(rnd()<0.12){if(t==='P')addP('spark',c.x,c.y,0,-10,0.4,'#ffffff');else addP(SEASONP[t],c.x,c.y,rr(-4,4),-8,0.8,pick(SEASONC[t]));}}}}
  // park
  if(PARK.on){PARK.t+=dt;const run=closedNow?1:0;PARK.quiet=approach(PARK.quiet,1-run,dt*0.7);
    PARK.spin=Math.max(0,PARK.spin-dt*0.5);PARK.wheelA+=dt*(0.25*run+PARK.spin*0.6);PARK.carA+=dt*(0.9*run+(PARK.carBoost||0));PARK.carBoost=Math.max(0,(PARK.carBoost||0)-dt);}
  // boundary decor ambient
  for(const k in W.decor){const d=W.decor[k];if(d.key==='FF'&&rnd()<dt*0.5){const p=bPos(+k,12);addP('bfly',p.x+rr(-6,6),p.y+rr(-6,6),rr(-6,6),-4,4,pick(['#ff8fc0','#ffd546','#b48cff']),{bf:true});}
    if(d.key==='SF'&&rnd()<dt*0.8){const p=bPos(+k,13);addP('drop',p.x+rr(-4,4),p.y-2,0,-8,0.4,'#8fdcf7',{g:40});}}
  if(W.picnic>=0&&T-W.picnicT<2.4&&rnd()<dt*6){const p=bPos(W.picnic,17);addP('leaf',p.x+rr(-6,6),p.y-14,rr(-4,4),6,1,'#4a9a40');}
  // particles
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life-=dt;if(p.life<=0){if(p.kind==='throw'&&!p.toPt){}PARTS.splice(i,1);continue;}
    const k=1-p.life/p.max;
    if(p.kind==='throw'||p.kind==='fly'){continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind==='flake'||p.kind==='petal'||p.kind==='leaf'||p.kind==='seed'){p.vx*=1-dt*1.5;p.vy=lerp(p.vy,8,dt*2);p.x+=Math.sin(T*3+p.sway)*dt*8;}
    else if(p.kind==='steam'){p.vx*=1-dt;p.vy*=1-dt*0.8;}
    else if(p.kind==='bfly'){p.x+=Math.sin(T*5+p.sway)*dt*14;p.y+=Math.cos(T*3+p.sway)*dt*8;}
    else if(p.kind==='spark'||p.kind==='dust'||p.kind==='crumb'){p.vx*=1-dt*3;p.vy*=1-dt*3;}
    else if(p.kind==='conf'){p.vx*=1-dt*1.2;p.x+=Math.sin(T*6+p.sway)*dt*6;}}
  // sky
  for(const gl of GULLS){gl.x+=gl.v*dt;}for(let i=GULLS.length-1;i>=0;i--)if(GULLS[i].x>LW+20)GULLS.splice(i,1);
  if(rnd()<dt*0.03&&GULLS.length<3&&OY>30)GULLS.push({x:-10,y:rr(6,OY-12),v:rr(10,16)});
  for(const c of CLOUDS){c.x+=c.v*dt;if(c.x>LW+20)c.x=-30;}
  hintUpdate(dt);musicTick();
}

function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function ellF(cx,cy,rx,ry,c){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/((ry+0.4)*(ry+0.4)))));g.fillRect(cx-hw,cy+dy,hw*2+1,1);}}
function line(x0,y0,x1,y1,c){g.fillStyle=c;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;for(let n=0;n<300;n++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function dS(sp,x,y,flip){g.drawImage(flip?sp.l:sp.r,Math.round(x-sp.w/2),Math.round(y-sp.h));}
function icon(name,x,y){const sp=IC[name];if(sp)g.drawImage(sp.r,Math.round(x-sp.w/2),Math.round(y-sp.h/2));}
function bubble(x,y,ic){x=Math.round(x);y=Math.round(y);R(x-5,y-12,11,9,PAL.K);R(x-4,y-11,9,7,'#ffffff');R(x-1,y-3,2,1,PAL.K);R(x,y-2,1,1,PAL.K);R(x-1,y-3,1,1,'#ffffff');icon(ic,x+0.5,y-7.5);}
function shadow(x,y,w){g.fillStyle='rgba(40,50,40,0.22)';g.fillRect(Math.round(x-w/2),Math.round(y)-1,w,2);}

// car pose: position+view of car i
function carPose(i){const s=train.s-CAR_OFF[i];const p=pathAt(s,{});let view;const ax=Math.abs(p.tx),ay=Math.abs(p.ty);
  if(ax>=ay*0.75)view=p.tx>0?'R':'L';else view=p.ty>0?'D':'U';p.view=view;return p;}

function drawWater(){

    for(let i=0;i<n;i++){const q=LY.creek[i];const iced=P.cIce>i/LY.creek.length;ellF(q.x,q.y,3,2,iced?'#c8ecfa':'#4aa8e8');}
    for(let i=0;i<n;i++){const q=LY.creek[i];const iced=P.cIce>i/LY.creek.length;if(iced){if(i%3===0)R(q.x-1,q.y,2,1,'#ffffff');}else if((i+Math.floor(T*6))%4===0)R(q.x,q.y,2,1,'#a8e4fa');}
    if(P.creek>0.9||P.cIce>0.9){ellF(lg.x,lg.y,lg.rx+1,lg.ry+1,'#7a6a4a');ellF(lg.x,lg.y,lg.rx,lg.ry,P.cIce>0.9?'#c8ecfa':'#4aa8e8');R(lg.x-3+Math.round(Math.sin(T*2)*2),lg.y,3,1,'#a8e4fa');}
  }

  ellF(pd.x,pd.y,pd.rx+1,pd.ry+1,'#8a7a58');

  const cyc=2.6;const t=((idle-4)%cyc)/cyc;let x,y,press=false,alpha=1;
  if(t<0.15){x=from.x;y=from.y+(1-t/0.15)*6;alpha=t/0.15;}else if(t<0.25){x=from.x;y=from.y;press=true;}
  else if(t<0.75){const k=ease((t-0.25)/0.5);x=lerp(from.x,to.x,k);y=lerp(from.y,to.y,k)-Math.sin(k*Math.PI)*12;press=true;}
  else if(t<0.85){x=to.x;y=to.y;}else{x=to.x;y=to.y+((t-0.85)/0.15)*4;alpha=1-(t-0.85)/0.15;}
  if(press&&(s.kind==='place'||s.kind==='swap')&&t>=0.25&&t<0.75){const im=STRAIGHT[s.type];g.globalAlpha=0.55;g.drawImage(im.c,Math.round(x-im.w/2),Math.round(y-14-im.h/2));g.globalAlpha=1;}
  if(press&&s.kind==='gift'&&t>=0.25&&t<0.75){icon(s.item,x,y-12);}
  g.globalAlpha=alpha*0.95;g.drawImage(SPR.hand.r,0,0,SPR.hand.w,SPR.hand.h,Math.round(x-4),Math.round(y+(press?1:0)),SPR.hand.w*2,SPR.hand.h*2);g.globalAlpha=1;
  if(press&&t<0.3){R(x-3,y-2,1,1,'#ffffff');R(x+4,y-2,1,1,'#ffffff');R(x,y-4,1,1,'#ffffff');}
}

// ======================================================================
//  particles draw
// ======================================================================
function drawParts(scr){
  for(const p of PARTS){if(!!p.scr!==scr)continue;const k=1-p.life/p.max;const x=Math.round(p.x),y=Math.round(p.y);
    switch(p.kind){
      case 'flake':R(x,y,1,1,p.col);if(p.life>p.max*0.5){R(x-1,y,1,1,p.col);R(x+1,y,1,1,p.col);R(x,y-1,1,1,p.col);R(x,y+1,1,1,p.col);}break;
      case 'petal':R(x,y,2,1,p.col);break;
      case 'leaf':R(x,y,2,1,p.col);R(x+(Math.floor(T*6)%2),y-1,1,1,p.col);break;
      case 'seed':R(x,y,1,1,p.col);break;
      case 'steam':{const r=Math.round((1+k*3)*p.sz);g.fillStyle=k<0.6?'#ffffff':'#e6ecf6';g.fillRect(x-r,y-r+1,r*2+1,r*2-1);g.fillRect(x-r+1,y-r,r*2-1,r*2+1);break;}
      case 'spark':if(p.life>p.max*0.4){R(x-1,y,3,1,p.col);R(x,y-1,1,3,p.col);}else R(x,y,1,1,p.col);break;
      case 'dust':R(x,y,1,1,p.col);break;
      case 'crumb':R(x,y,1,1,p.col);break;
      case 'drop':R(x,y,1,2,p.col);break;
      case 'conf':R(x,y,Math.floor(T*8+p.sway)%2?2:1,1,p.col);break;
      case 'heart':icon('heart',x,y);break;
      case 'bfly':{const f=Math.floor(T*10+p.sway)%2;R(x-1,y-f,1,1,p.col);R(x+1,y-f,1,1,p.col);R(x,y,1,1,PAL.K);break;}
      case 'ring':{const r=Math.round(k*7);for(let a=0;a<TAU;a+=0.5)R(x+Math.cos(a)*r,y+Math.sin(a)*r*0.6,1,1,'#ffffff');break;}
      case 'throw':{const tx=p.toPt?p.tx2:wagonPos().x,ty=p.toPt?p.ty2:wagonPos().y-6;const e=ease(k);const px=lerp(p.fx,tx,e),py=lerp(p.fy,ty,e)-Math.sin(k*Math.PI)*14;icon(p.item||'nut',px,py);break;}
      case 'fly':{const e=ease(k);const px=lerp(p.fx,p.tx2,e),py=lerp(p.fy,p.ty2,e)-Math.sin(k*Math.PI)*20;const im=STRAIGHT[p.type];const s=1-k*0.3;g.drawImage(im.c,Math.round(px-im.w*s/2),Math.round(py-im.h*s/2),Math.round(im.w*s),Math.round(im.h*s));break;}
    }}
}

// ======================================================================
//  render
// ======================================================================
function render(){
  g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;
  drawSky();
  let wob=0;if(PARK.on&&PARK.t<2.2)wob=Math.round(Math.sin(PARK.t*14)*2*(1-PARK.t/2.2));
  drawIsland(wob);
  g.setTransform(1,0,0,1,OX,OY+wob);
  // park tile pop overlay
  if(PARK.on&&PARK.t<6){for(const c of cells){if(c.cur==='P'&&T-c.pop<0.3){const k=(T-c.pop)/0.3;const lift=Math.round(Math.sin(k*Math.PI)*3);const tt=PARKT[c.tint]||PARKT.base;R(c.cx*CSZ,c.cy*CSZ+CSZ-1,CSZ,1,'rgba(80,60,60,0.25)');R(c.cx*CSZ,c.cy*CSZ-lift,CSZ,CSZ,((c.cx+c.cy)%2===0)?tt[0]:tt[1]);R(c.cx*CSZ,c.cy*CSZ-lift,CSZ,1,'#ffffff');}}}
  drawWater();
  drawTrack();drawPlatform();
  // y-sorted world objects
  const L=[];
  L.push({y:172,f:drawMainStation});
  L.push({y:LY.hive.y,f:()=>drawTree(LY.hive.x,LY.hive.y,'hive')});
  L.push({y:LY.nutTree.y,f:()=>drawTree(LY.nutTree.x,LY.nutTree.y,'nut')});
  for(const t of LY.decoTrees)L.push({y:t.y,f:()=>drawTree(t.x,t.y,'')});
  for(let i=1;i<NS;i++)if(W.slots[i]){const p=slotPos(i,[0,12,15,12,15,12,15,12][i]);L.push({y:p.y+3,f:()=>drawMini(i)});}
  for(const k in W.decor){const d=W.decor[k];const p=bPos(+k,12);L.push({y:p.y,f:()=>drawDecor(+k,d)});}
  if(W.picnic>=0){const p=bPos(W.picnic,17);L.push({y:p.y-1,f:drawPicnic});}
  if(PARK.on){L.push({y:LY.wheel.y+25,f:drawWheelRide});L.push({y:LY.carousel.y,f:drawCarousel});for(const st of PARK.stalls)L.push({y:st.y,f:()=>drawParkStall(st)});L.push({y:LY.duckSpot.y,f:drawDuckBooth});}
  for(const a of animals){if(a.state==='ride')continue;if(a.onWheel!=null&&a.state==='visit')continue;L.push({y:a.y,f:()=>drawAnimal(a)});}
  for(let i=2;i>=0;i--){const p=carPose(i);L.push({y:p.y+0.1*i,f:()=>{if(i===0)drawEngine(p);else drawCarBody(i===1?'coach':'wagon',p,i);}});}
  L.sort((a,b)=>a.y-b.y);for(const o of L)o.f();
  for(const b of bees)drawBee(b);
  drawParts(false);
  g.setTransform(1,0,0,1,0,0);
  drawTray();
  drawParts(true);
  drawDrags();
  drawHintHand();
  // upscale
  ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,LW,LH,0,0,LW*Sd,LH*Sd);
}

// ======================================================================
//  loop & lifecycle
// ======================================================================
let running=false,rafId=0,lastTS=0;
function frame(ts){if(!running)return;rafId=requestAnimationFrame(frame);let dt=(ts-lastTS)/1000;lastTS=ts;if(!(dt>0))dt=1/60;dt=Math.min(dt,0.05);
  try{update(dt);render();}catch(err){if(!frame.errd){frame.errd=true;setTimeout(()=>{frame.errd=false;},2000);console.warn(err);}}}
function start(){if(running)return;running=true;lastTS=performance.now();rafId=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(rafId);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();for(const d of[...DRAGS.keys()])onUp({pointerId:d},true);if(AU.ctx&&AU.ctx.state==='running'){const p=AU.ctx.suspend();if(p&&p.catch)p.catch(()=>{});}}else{start();if(AU.ctx){const p=AU.ctx.resume();if(p&&p.catch)p.catch(()=>{});}}});
window.addEventListener('pagehide',()=>{stop();});
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
window.addEventListener('blur',()=>{for(const d of[...DRAGS.keys()])onUp({pointerId:d},true);});
let rzT=0;function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{resize();render();},60);}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',onResize);

initWorld();resize();
for(let i=0;i<4;i++)CLOUDS.push({x:rr(0,LW),y:rr(4,Math.max(6,OY-20)),v:rr(1.5,4)});
start();

// test hooks (no UI)
window.__G={W,train,PARK,LY,DLOG,HINT,TRAYC,cells,get T(){return T;},
  place:(i,t)=>{placePiece(i,t);},remove:i=>removePiece(i),
  step:(sec)=>{const n=Math.round(sec*30);for(let k=0;k<n;k++)update(1/30);render();},
  lay:()=>({S,Sd,LW,LH,OX,OY,TRAY:{...TRAY}}),
  toScreen:(x,y)=>({x:(x+OX)*S,y:(y+OY)*S}),slotScreen:i=>{const p=slotPos(i,0);return{x:(p.x+OX)*S,y:(p.y+OY+10)*S};},
  trayScreen:t=>{const c=TRAYC.find(q=>q.type===t);return{x:c.cx*S,y:c.cy*S};},
  wagonScreen:()=>{const p=wagonPos();return{x:(p.x+OX)*S,y:(p.y-4+OY)*S};},
  animals,sqs,rabs,bees,get duck(){return duck;},guests,audio:()=>AU.ctx?AU.ctx.state:'none'};
})();
</script>
