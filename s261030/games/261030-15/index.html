const SEED=Q.has('seed')?(parseInt(Q.get('seed'),10)>>>0):((Date.now()^Math.floor(Math.random()*4294967296))>>>0);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(SEED);                 // 来店順・配色・好物など
const rngDance=mulberry32((SEED^0x9E3779B9)>>>0); // 特別な踊り専用（踊りの切替1回につき1回だけ引く）
const SPECIAL_P=0.15;
const TAU=Math.PI*2;
const R=(a,b)=>a+(b-a)*Math.random();       // 見た目だけの揺らぎ
const rr=(a,b)=>a+(b-a)*rng();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const easeOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
function shuffleR(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function pickR(arr){return arr[Math.floor(rng()*arr.length)%arr.length];}
function addTags(arr,tags,cap){cap=cap||4;for(const t of tags){if(!t)continue;if(!arr.includes(t))arr.push(t);}while(arr.length>cap)arr.shift();return arr;}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mixHex(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function rgba(h,a){const A=hexRgb(h);return'rgba('+A[0]+','+A[1]+','+A[2]+','+a+')';}

// ================= 色（リソグラフ風の版色） =================
const INK='#35264a';

const MIS=['rgba(255,94,138,.55)','rgba(31,166,160,.5)','rgba(255,201,60,.6)'];
const TAGS=['swirl','dots','ribbon','zigzag','marble'];
const TAGC={
  swirl:['#1fa6a0','#3d6fd6','#c7f0e8'],
  dots:['#ff4d6a','#ffb3c3','#fff3a8'],
  ribbon:['#ffaa22','#ff6f3c','#fff0b8'],

};

// ================= 音（Web Audio 合成） =================
let AC=null,master=null,noiseBuf=null,inkGain=null,inkFilt=null;
function ensureAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      AC=new C();
      master=AC.createGain(); master.gain.value=.62;
      const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4;
      master.connect(comp); comp.connect(AC.destination);
      const len=Math.floor(AC.sampleRate*1.2); noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
      inkFilt=AC.createBiquadFilter(); inkFilt.type='bandpass'; inkFilt.frequency.value=600; inkFilt.Q.value=2.5;
      inkGain=AC.createGain(); inkGain.gain.value=0;
      src.connect(inkFilt); inkFilt.connect(inkGain); inkGain.connect(master); src.start();
      // iOS の無音アンロック
      const b=AC.createBuffer(1,1,22050); const s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
    }
    if(AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});
  }catch(e){AC=null;}
}
function aOK(){return AC&&AC.state!=='closed';}
function tone(f,dur,o){
  if(!aOK())return; o=o||{};
  try{
    const t=(o.at!=null?Math.max(o.at,AC.currentTime):AC.currentTime)+(o.delay||0);
    const os=AC.createOscillator(),g=AC.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(Math.max(20,f),t);
    if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+dur);
    const v=o.vol==null?.18:o.vol, at=o.attack||.008;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+at);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t+dur+.05);
  }catch(e){}
}
function noise(dur,o){
  if(!aOK()||!noiseBuf)return; o=o||{};
  try{
    const t=(o.at!=null?Math.max(o.at,AC.currentTime):AC.currentTime)+(o.delay||0);
    const s=AC.createBufferSource(); s.buffer=noiseBuf;
    const f=AC.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.freq||1000,t); f.Q.value=o.q||1;
    if(o.slide)f.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
    const g=AC.createGain(); const v=o.vol==null?.15:o.vol;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+(o.attack||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()*.5); s.stop(t+dur+.05);
  }catch(e){}
}
const NOTE=n=>261.63*Math.pow(2,n/12);
const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
const TAGSCALE={swirl:[0,4,7,11,14],dots:[0,2,4,7,9],ribbon:[0,5,9,12,16],zigzag:[0,3,7,10,12],marble:[0,4,7,9,12]};
const SFX={
  hello(){tone(NOTE(12),.22,{vol:.12,type:'triangle'});tone(NOTE(19),.35,{vol:.1,delay:.09});},
  ink(on,speed,y){
    if(!inkGain||!aOK())return;
    try{const t=AC.currentTime;
      inkGain.gain.setTargetAtTime(on?Math.min(.2,.05+speed*.00045):0,t,.035);
      inkFilt.frequency.setTargetAtTime(260+(1-y/Math.max(1,H))*700+Math.min(900,speed*.35),t,.05);}catch(e){}
  },
  squish(){tone(170,.16,{vol:.16,slide:380,type:'sine'});noise(.08,{freq:700,q:3,vol:.05});},
  pop(n){const f=NOTE(PENTA[(n||0)%PENTA.length]+12);tone(f,.12,{type:'triangle',vol:.16,slide:f*1.5});noise(.04,{freq:3200,vol:.05});},
  bake(len,kind){
    noise(.6,{freq:5000,q:.7,type:'highpass',vol:.07});
    const base={swirl:NOTE(9),ribbon:NOTE(4),star:NOTE(16),blob:NOTE(7),loop:NOTE(12),tart:NOTE(14),mega:NOTE(0),cake:NOTE(11)}[kind]||NOTE(7);
    const f=base*Math.pow(2,-clamp(len/(Math.max(1,plate.r)*5),0,1));
    tone(f,.3,{type:'triangle',vol:.14,slide:f*1.5});
    tone(f*1.5,.28,{vol:.07,delay:.11});
    if(kind==='star'){tone(f*2,.08,{vol:.06,delay:.05,type:'square'});tone(f*2.4,.08,{vol:.05,delay:.14,type:'square'});}
    if(kind==='swirl'){tone(f,.4,{vol:.06,delay:.18,slide:f*2});}
  },
  slurp(){noise(.25,{freq:700,q:2,vol:.14,slide:2600});tone(260,.22,{vol:.09,slide:820});},
  munch(i){tone(190-i*14,.13,{vol:.22,slide:110});noise(.07,{freq:480,q:1.4,vol:.1});},
  transform(tags,big){
    const sc=TAGSCALE[tags&&tags[0]]||PENTA; const b=big?12:7;
    for(let i=0;i<5;i++)tone(NOTE(sc[i%sc.length]+b),.32,{type:'triangle',vol:.1,delay:i*.075});
    tone(NOTE(sc[0]+b+24),.6,{vol:.05,delay:.4});
    if(tags&&tags.length>1)for(let i=0;i<3;i++)tone(NOTE((TAGSCALE[tags[1]]||PENTA)[i]+b+12),.3,{vol:.07,delay:.45+i*.07});
  },
  taste(){tone(NOTE(7),.15,{vol:.1});tone(NOTE(4),.2,{vol:.08,delay:.12});},
  growl(){
    if(!aOK())return;
    try{const t=AC.currentTime;const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type='sawtooth';o.frequency.setValueAtTime(78,t);o.frequency.linearRampToValueAtTime(58,t+.8);
      f.type='lowpass';f.frequency.value=260;l.frequency.value=9;lg.gain.value=.06;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+.85);
      l.connect(lg);lg.connect(g.gain);o.connect(f);f.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+.9);l.stop(t+.9);}catch(e){}
  },
  boing(){tone(240,.38,{vol:.18,slide:760});tone(760,.22,{vol:.08,delay:.2,slide:320});},
  hop(){tone(NOTE(16),.1,{vol:.07,slide:NOTE(23)});},
  land(){noise(.05,{freq:400,q:1,vol:.06});},
  tick(){tone(1250,.05,{type:'triangle',vol:.04});},
  giggle(){for(let i=0;i<3;i++)tone(NOTE(19-i*2),.08,{vol:.07,delay:i*.07,type:'triangle'});},
  stamp(){tone(NOTE(5),.08,{vol:.06,type:'triangle'});noise(.04,{freq:900,vol:.05});},
  arrive(sp){const m={zebra:[7,12],rabbit:[12,19],chick:[19,24],cat:[9,16]}[sp]||[7,12];tone(NOTE(m[0]+12),.15,{vol:.1,type:'triangle'});tone(NOTE(m[1]+12),.25,{vol:.1,delay:.12,type:'triangle'});},
  swap(){for(let i=0;i<6;i++)tone(NOTE(PENTA[i]+19),.2,{vol:.06,delay:i*.05});},
  grand(){[0,4,7,12,16].forEach((n,i)=>{tone(NOTE(n),2.4,{type:'sawtooth',vol:.035,attack:.6,delay:i*.04});tone(NOTE(n+12),2,{type:'triangle',vol:.05,attack:.3,delay:.3+i*.12});});for(let i=0;i<8;i++)tone(NOTE(PENTA[i]+24),.4,{vol:.05,delay:.6+i*.09});},
  mega(){[0,4,7,12].forEach((n,i)=>tone(NOTE(n+12),.5,{type:'triangle',vol:.1,delay:i*.09}));noise(.6,{freq:6000,type:'highpass',vol:.05});},
  wobble(){tone(R(500,700),.06,{type:'sine',vol:.035});},
  cloth(){for(let i=0;i<6;i++)tone(NOTE([0,4,7,12,16,19][i]+12),.5,{vol:.07,delay:i*.12,type:'triangle'});},
  whoosh(){noise(.45,{freq:500,slide:2400,q:.8,vol:.08});}
};
// 舞踏会の音楽（踊りの種類で変わる簡易シーケンサー）
const music={on:false,next:0,step:0,kind:'sway'};
const BPM={sway:96,spin:132,hop:138,march:116,spring:124,cake:150,lull:66};
function musicTick(){
  if(!music.on||!aOK()||AC.state!=='running')return;
  const spb=60/(BPM[music.kind]||100)/2;
  if(music.next<AC.currentTime-.3)music.next=AC.currentTime+.05;
  while(music.next<AC.currentTime+.18){playStep(music.kind,music.step,music.next);music.next+=spb;music.step++;}
}
function playStep(k,s,t){
  const m=s%16, mel=[0,4,7,9,12,9,7,4,2,4,7,12,14,12,9,7];
  if(k==='lull'){ if(s%2===0)tone(NOTE([12,16,19,16,14,12,9,12][(s>>1)%8]+12),.9,{at:t,vol:.05,type:'triangle'}); if(m===0)tone(NOTE(0),1.5,{at:t,vol:.04}); return; }
  if(k==='spin'){ const w=s%6; if(w===0)tone(NOTE([0,5,7,0][(s/6|0)%4]-12),.4,{at:t,vol:.13,type:'triangle'}); if(w===2||w===4)tone(NOTE([4,9,11,4][(s/6|0)%4]),.15,{at:t,vol:.05,type:'triangle'}); tone(NOTE(mel[s%16]+12),.18,{at:t,vol:.04}); return; }
  if(m%4===0)tone(NOTE([0,0,5,7][(s/16|0)%4]-12),.3,{at:t,vol:.13,type:'triangle'});
  if(k==='sway'){ if(s%2===0)tone(NOTE(mel[(s>>1)%16]+12),.5,{at:t,vol:.05,attack:.05}); }
  else if(k==='hop'){ tone(NOTE(mel[s%16]+24),.07,{at:t,vol:.05,type:'square'}); if(m%4===2)noise(.04,{at:t,freq:5000,vol:.04,type:'highpass'}); }
  else if(k==='march'){ if(m%4===2)noise(.09,{at:t,freq:1800,q:.6,vol:.08}); if(s%2===0)tone(NOTE(mel[(s>>1)%16]+12),.16,{at:t,vol:.06,type:'triangle'}); }
  else if(k==='spring'){ if(m%4===0)tone(NOTE(12),.25,{at:t,vol:.07,slide:NOTE(24)}); if(m%2===1)tone(NOTE(mel[s%16]+19),.1,{at:t,vol:.04}); }
  else if(k==='cake'){ tone(NOTE(mel[s%16]+24),.2,{at:t,vol:.05,type:'triangle'}); if(m%2===0)tone(NOTE(mel[(s+4)%16]+12),.2,{at:t,vol:.04}); }
}

// ================= 画面配置 =================
let W=0,H=0,DPR=1,S=1,U=40,portrait=true;
const SA={t:0,r:0,b:0,l:0};
const plate={x:0,y:0,r:100};
let homes=[];
const floorR={x0:0,x1:0,y0:0,y1:0,cx:0,cy:0};
let world=null;

function readSA(){
  try{const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
function layout(){
  const top=SA.t, bot=H-SA.b, availH=Math.max(200,bot-top), availW=Math.max(200,W-SA.l-SA.r);
  S=Math.min(W,H); portrait=H>=W*1.05;
  if(portrait){
    plate.r=Math.min(availW*.43,availH*.25); plate.x=SA.l+availW/2; plate.y=top+availH*.46;
    U=Math.min(availW*.12,availH*.066);
    const yb=plate.y+plate.r+(bot-(plate.y+plate.r))*.5, yt=top+(plate.y-plate.r-top)*.58;
    homes=[{x:SA.l+availW*.25,y:yb},{x:SA.l+availW*.75,y:yb},{x:SA.l+availW*.25,y:yt},{x:SA.l+availW*.75,y:yt}];
  }else{
    plate.r=Math.min(availH*.4,availW*.27); plate.x=SA.l+availW/2; plate.y=top+availH*.53;
    U=Math.min(availH*.1,availW*.068);
    const xl=SA.l+(plate.x-plate.r-SA.l)*.5, xr=plate.x+plate.r+(W-SA.r-(plate.x+plate.r))*.5;
    homes=[{x:xl,y:top+availH*.42},{x:xr,y:top+availH*.42},{x:xl,y:top+availH*.8},{x:xr,y:top+availH*.8}];
  }
  floorR.x0=SA.l+U*.9; floorR.x1=W-SA.r-U*.9; floorR.y0=top+availH*.34; floorR.y1=bot-U*.5;
  floorR.cx=(floorR.x0+floorR.x1)/2; floorR.cy=floorR.y0+(floorR.y1-floorR.y0)*.5;
}

// ================= 紙の粒子テクスチャ =================
const grainTile=(function(){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const id=g.createImageData(128,128),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random();
    if(v<.09){d[i]=60;d[i+1]=40;d[i+2]=70;d[i+3]=28+Math.random()*30;}
    else if(v<.15){d[i]=255;d[i+1]=250;d[i+2]=235;d[i+3]=40+Math.random()*40;}}
  g.putImageData(id,0,0);return c;})();
function grain(g,x,y,w,h,a){g.save();g.globalAlpha=a==null?1:a;g.fillStyle=g.createPattern(grainTile,'repeat');g.fillRect(x,y,w,h);g.restore();}
function grainAtop(g,x,y,w,h,a){g.save();g.globalCompositeOperation='source-atop';grain(g,x,y,w,h,a);g.restore();}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*DPR));c.height=Math.max(1,Math.ceil(h*DPR));const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return{c,g};}
function rrect(g,x,y,w,h,r){g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);}
function smoothPath(g,pts){
  const n=pts.length; if(!n)return;
  g.moveTo(pts[0].x,pts[0].y);
  if(n===1){g.lineTo(pts[0].x+.1,pts[0].y);return;}
  if(n===2){g.lineTo(pts[1].x,pts[1].y);return;}
  for(let i=1;i<n-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;g.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);}
  g.lineTo(pts[n-1].x,pts[n-1].y);
}

// ================= 背景（食堂の壁紙 / 舞踏会） =================
let bgD=null,bgB=null,tableC=null;
function buildDiner(){
  const {c,g}=mkCanvas(W,H);
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  // マーブルインクのにじみ
  const blobs=[[.15,.2,'#ff8fb0'],[.85,.15,'#7fd6c8'],[.2,.85,'#ffd36b'],[.82,.8,'#b9a2ef'],[.5,.5,'#ffb0a0']];
  for(const b of blobs){const gr=g.createRadialGradient(b[0]*W,b[1]*H,0,b[0]*W,b[1]*H,S*.7);gr.addColorStop(0,rgba(b[2],.22));gr.addColorStop(1,rgba(b[2],0));g.fillStyle=gr;g.fillRect(0,0,W,H);}
  // ゆるいストライプ壁紙
  const sw=U*1.5;
  for(let x=-sw;x<W+sw;x+=sw*2){g.fillStyle='rgba(255,200,170,.18)';g.beginPath();g.moveTo(x,0);for(let y=0;y<=H;y+=20)g.lineTo(x+Math.sin(y/90)*4,y);g.lineTo(x+sw+Math.sin(H/90)*4,H);for(let y=H;y>=0;y-=20)g.lineTo(x+sw+Math.sin(y/90)*4,y);g.fill();}
  // 小さなキャンディ柄（版ずれ）
  const sp=U*2.3;let k=0;
  for(let y=sp*.5;y<H;y+=sp){for(let x=((k++)%2)*sp*.5+sp*.3;x<W;x+=sp){
    const col=INKS[(Math.floor(x/sp)+Math.floor(y/sp))%INKS.length];
    for(let p=0;p<2;p++){g.save();g.translate(x+(p?1.6:0),y+(p?1.2:0));g.globalAlpha=p?.22:.28;g.strokeStyle=p?'#1fa6a0':col;g.fillStyle=p?'#1fa6a0':col;g.lineWidth=U*.07;
      const m=(Math.floor(x+y)%3);

// ================= 模様（体・スタンプ・テーブルクロス共通） =================
function patternFill(g,tag,ext,ph,dens,withBase){
  const C=TAGC[tag]||TAGC.marble; dens=dens||1;
  if(withBase){g.fillStyle=C[2]||'#fff';g.fillRect(-ext,-ext,ext*2,ext*2);}
  g.lineCap='round';g.lineJoin='round';
  if(tag==='swirl'){
    for(let arm=0;arm<2;arm++){g.strokeStyle=C[arm];g.lineWidth=ext*.13*dens;g.beginPath();
      for(let th=0;th<5*Math.PI;th+=.18){const r=ext*1.25*th/(5*Math.PI);const a=th+ph+arm*Math.PI;const x=Math.cos(a)*r,y=Math.sin(a)*r;th?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  }else if(tag==='dots'){
    const sp=ext*.42/dens;let row=0;
    for(let y=-ext;y<=ext;y+=sp){for(let x=-ext+(row%2)*sp*.5;x<=ext;x+=sp){g.fillStyle=C[(row+Math.round(x/sp))%2?0:1];g.beginPath();g.arc(x+Math.sin(ph+y)*ext*.03,y,sp*.27,0,TAU);g.fill();}row++;}
  }else if(tag==='ribbon'){
    const sp=ext*.4/dens;let k=0;
    for(let y=-ext*1.2;y<=ext*1.2;y+=sp){g.strokeStyle=C[k%2];g.lineWidth=sp*.42;g.beginPath();for(let x=-ext;x<=ext;x+=ext*.1){const yy=y+Math.sin(x/ext*4+ph+k)*sp*.35;x===-ext?g.moveTo(x,yy):g.lineTo(x,yy);}g.stroke();k++;}
  }else if(tag==='zigzag'){
    const sp=ext*.42/dens;let k=0;
    for(let y=-ext*1.2;y<=ext*1.2;y+=sp){g.strokeStyle=C[k%2];g.lineWidth=sp*.32;g.beginPath();let up=0;for(let x=-ext-((ph*ext*.1)%(sp*.5));x<=ext+sp;x+=sp*.5){const yy=y+(up++%2?-1:1)*sp*.28;g.lineTo(x,yy);}g.stroke();k++;}
  }else{ // marble
    for(let i=0;i<7;i++){g.fillStyle=rgba(C[i%4],.75);const a=i*1.7+ph*.5;g.beginPath();g.ellipse(Math.cos(a)*ext*.55,Math.sin(a*1.3)*ext*.5,ext*.32,ext*.2,a,0,TAU);g.fill();}
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=ext*.05;g.beginPath();for(let x=-ext;x<=ext;x+=ext*.1)g.lineTo(x,Math.sin(x/ext*5+ph)*ext*.3);g.stroke();
  }
}
// 小さな模様アイコン（スタンプ・吹き出し・壁の線）

// ================= イチゴ =================

// ================= おやつの描画 =================
const BODY={swirl:'#ecb464',ribbon:'#ffd77a',star:'#e9a44a',blob:'#f6c27a',loop:'#f1b66b'};
function strokeLayer(g,pts,lw,col,dx,dy){g.save();if(dx||dy)g.translate(dx||0,dy||0);g.strokeStyle=col;g.lineWidth=lw;g.beginPath();smoothPath(g,pts);g.stroke();g.restore();}
function offsetPts(pts,amp,freq,ph){const out=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let nx=-(b.y-a.y),ny=b.x-a.x;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;const o=Math.sin(i*freq+ph)*amp;out.push({x:pts[i].x+nx*o,y:pts[i].y+ny*o});}return out;}
function paintPart(g,p,w,puff,sn){
  g.lineCap='round';g.lineJoin='round';
  if(p.kind==='berry'){const rb=sn.rb*(.4+.6*puff);for(const b of p.pts)drawBerry(g,b.x,b.y,rb*(b.s||1));return;}
  if(p.kind==='mega'){paintMega(g,p.r*(.5+.5*puff),sn.tags,sn);return;}
  const pts=p.pts;const lw=w*(.55+.5*puff);
  if(pts.length<2){g.fillStyle=BODY[p.kind]||'#f1b66b';g.beginPath();g.arc(pts[0].x,pts[0].y,lw*.6,0,TAU);g.fill();return;}
  strokeLayer(g,pts,lw*1.34,MIS[0],lw*.08,lw*.06);
  strokeLayer(g,pts,lw*1.3,INK);
  strokeLayer(g,pts,lw*1.16,mixHex('#e9cfa6','#b4632e',puff));
  strokeLayer(g,pts,lw,BODY[p.kind]||'#f6c27a');
  if(p.kind==='swirl'){strokeLayer(g,offsetPts(pts,lw*.12,.5,0),lw*.34,'#7a4a2e');g.save();g.setLineDash([lw*.4,lw*.5]);strokeLayer(g,pts,lw*.16,'#7fe0d2');g.restore();}
  else if(p.kind==='ribbon'){strokeLayer(g,offsetPts(pts,lw*.18,.7,0),lw*.42,'#fff3c6');g.save();g.setLineDash([lw*.25,lw*.35]);strokeLayer(g,offsetPts(pts,lw*.18,.7,0),lw*.12,'#ff7aa0');g.restore();}
  else if(p.kind==='star'){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<pts.length;i+=2){g.beginPath();g.arc(pts[i].x+((i*7)%5-2)*lw*.06,pts[i].y+((i*3)%5-2)*lw*.06,lw*.06,0,TAU);g.fill();}
    for(const c of (p.corners||[])){g.save();g.translate(c.x,c.y);motif(g,'zigzag',lw*.5,0);g.restore();}}
  else if(p.kind==='blob'){strokeLayer(g,offsetPts(pts,lw*.22,.45,0),lw*.18,'#ff6f9a');strokeLayer(g,offsetPts(pts,lw*.22,.45,2.1),lw*.16,'#2fb5ac');strokeLayer(g,offsetPts(pts,lw*.22,.45,4.2),lw*.16,'#ffcf3a');}
  else if(p.kind==='loop'){strokeLayer(g,pts,lw*.62,'#ff8fb3');g.fillStyle='#fff';for(let i=0;i<pts.length;i+=2){const c=INKS[i%INKS.length];g.fillStyle=c;g.save();g.translate(pts[i].x+((i*5)%7-3)*lw*.05,pts[i].y+((i*3)%7-3)*lw*.05);g.rotate(i);g.fillRect(-lw*.1,-lw*.03,lw*.2,lw*.06);g.restore();}}
  strokeLayer(g,pts,lw*.2,'rgba(255,255,255,.62)',-lw*.15,-lw*.2);
  g.fillStyle='rgba(255,255,255,.85)';for(let i=1;i<pts.length;i+=5){g.beginPath();g.arc(pts[i].x-lw*.2,pts[i].y-lw*.24,lw*.07,0,TAU);g.fill();}
}
// 吸収した模様のトッピング
function paintTopping(g,tag,pts,lw,sn){
  if(!pts||pts.length<1)return;
  if(tag==='dots'){for(let i=0;i<pts.length;i+=Math.max(2,Math.floor(pts.length/7)))drawBerry(g,pts[i].x,pts[i].y-lw*.1,sn.rb*.62);}
  else if(tag==='swirl'){for(let i=1;i<pts.length;i+=Math.max(3,Math.floor(pts.length/5))){g.save();g.translate(pts[i].x,pts[i].y);motif(g,'swirl',lw*.42,i);g.restore();}}
  else if(tag==='ribbon'){strokeLayer(g,offsetPts(pts,lw*.25,.6,1),lw*.22,'#ffb020');strokeLayer(g,offsetPts(pts,lw*.25,.6,1),lw*.08,'#fff6d0');}
  else if(tag==='zigzag'){for(let i=0;i<pts.length;i+=Math.max(2,Math.floor(pts.length/6))){g.save();g.translate(pts[i].x,pts[i].y-lw*.15);motif(g,'zigzag',lw*.3,i);g.restore();}}
  else if(tag==='marble'){strokeLayer(g,offsetPts(pts,lw*.2,.5,3),lw*.1,'#8b5bd0');strokeLayer(g,offsetPts(pts,lw*.2,.5,1),lw*.1,'#ff5e8a');}
}
function paintMega(g,r,tags,sn){
  const t=tags.length?tags:['marble'];const h=r*.55,bite=sn?sn.bites||0:0;
  g.fillStyle='rgba(60,30,40,.18)';g.beginPath();g.ellipse(0,r*.35+h*.6,r*1.15,r*.38,0,0,TAU);g.fill();
  const tier=(rx,ry,top,hh,tg,idx)=>{
    const body=()=>{g.beginPath();g.ellipse(0,top+hh,rx,ry,0,0,Math.PI);g.lineTo(-rx,top);g.ellipse(0,top,rx,ry,0,Math.PI,0,true);g.closePath();};
    g.save();g.translate(r*.03,r*.025);body();g.fillStyle=MIS[idx%2];g.fill();g.restore();
    body();g.fillStyle='#fff4e0';g.fill();g.save();body();g.clip();g.translate(0,top+hh*.5);patternFill(g,tg,rx*1.05,idx,1.2,true);g.restore();
    body();g.strokeStyle=INK;g.lineWidth=r*.035;g.stroke();
    g.fillStyle='#fffaf0';g.beginPath();g.ellipse(0,top,rx,ry,0,0,TAU);g.fill();g.stroke();
    // クリームのたれ
    g.fillStyle='#fffaf0';g.beginPath();for(let i=0;i<9;i++){const a=Math.PI*(i/8);const x=-Math.cos(a)*rx*.98,y=top+Math.sin(a)*ry;g.moveTo(x-rx*.07,y);g.quadraticCurveTo(x,y+hh*(.25+.2*(i%2)),x+rx*.07,y);}g.fill();
  };
  tier(r,r*.36,-h*.2,h,t[0],0);
  tier(r*.66,r*.25,-h*1.0,h*.75,t[1%t.length],1);
  if(t.length>2)tier(r*.4,r*.16,-h*1.6,h*.55,t[2],2);
  const topY=t.length>2?-h*1.6:-h*1.0;
  drawBerry(g,0,topY-r*.12,r*.16);drawBerry(g,-r*.2,topY-r*.02,r*.11);drawBerry(g,r*.2,topY-r*.02,r*.11);
  if(bite){g.save();g.globalCompositeOperation='destination-out';for(let i=0;i<bite;i++){const a=-.6+i*1.9;g.beginPath();g.arc(Math.cos(a)*r*.98,Math.sin(a)*r*.3,r*.24,0,TAU);g.fill();}g.restore();}
}
function paintSnack(g,sn,puff){
  for(const p of sn.parts)paintPart(g,p,sn.w,puff,sn);
  const main=sn.parts.find(p=>p.kind!=='berry'&&p.kind!=='mega');
  const native=new Set(sn.parts.map(p=>KIND_TAG[p.kind]));
  if(main){for(const t of sn.tags)if(!native.has(t))paintTopping(g,t,main.pts,sn.w*(.55+.5*puff),sn);}
  else if(!sn.parts.some(p=>p.kind==='mega')){const bp=sn.parts.find(p=>p.kind==='berry');if(bp){for(const t of sn.tags)if(t!=='dots'){for(const b of bp.pts){g.save();g.translate(b.x+sn.rb*.5,b.y-sn.rb*.6);motif(g,t,sn.rb*.38,0);g.restore();}}}}
}
function snackBounds(sn){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of sn.parts){
    if(p.kind==='mega'){x0=Math.min(x0,-p.r*1.2);x1=Math.max(x1,p.r*1.2);y0=Math.min(y0,-p.r*1.5);y1=Math.max(y1,p.r*.9);continue;}
    const m=p.kind==='berry'?sn.rb*1.4:sn.w*.9;
    for(const q of p.pts){x0=Math.min(x0,q.x-m);y0=Math.min(y0,q.y-m);x1=Math.max(x1,q.x+m);y1=Math.max(y1,q.y+m);}
  }
  if(x0>x1){x0=y0=-10;x1=y1=10;}
  return{x0,y0,x1,y1};
}
function buildSnackCache(sn){
  const b=snackBounds(sn),pad=8;const w=b.x1-b.x0+pad*2,h=b.y1-b.y0+pad*2;
  const {c,g}=mkCanvas(w,h);g.translate(pad-b.x0,pad-b.y0);paintSnack(g,sn,1);
  g.setTransform(1,0,0,1,0,0);grainAtop(g,0,0,c.width,c.height,.55);
  sn.cache={c,ox:b.x0-pad,oy:b.y0-pad,w,h};sn.dirty=false;

// ================= テーブルクロス（記念模様） =================
function paintQuilt(g,cloth,r,prog){

  g.save();g.translate(r*.03,r*.03);g.fillStyle=MIS[1];g.beginPath();g.arc(0,0,r,0,TAU);g.fill();g.restore();

// ---- 線の解析（寛容な形判定） ----
function resample(pts,step){
  const out=[{x:pts[0].x,y:pts[0].y}];let acc=0;
  for(let i=1;i<pts.length;i++){let px=pts[i-1].x,py=pts[i-1].y;const qx=pts[i].x,qy=pts[i].y;let d=Math.hypot(qx-px,qy-py);
    while(acc+d>=step&&d>0){const u=(step-acc)/d;px+=(qx-px)*u;py+=(qy-py)*u;out.push({x:px,y:py});d=Math.hypot(qx-px,qy-py);acc=0;}acc+=d;}
  const L=pts[pts.length-1],o=out[out.length-1];if(out.length<2||Math.hypot(o.x-L.x,o.y-L.y)>step*.3)out.push({x:L.x,y:L.y});return out;
}
function analyze(pts){
  let len=0,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<pts.length;i++){const p=pts[i];if(i)len+=Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y);x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
  const diag=Math.hypot(x1-x0,y1-y0),L=pts[pts.length-1],gap=Math.hypot(pts[0].x-L.x,pts[0].y-L.y);
  const A={len,diag,gap,x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,turn:0,sharp:0,signCh:0,very:0,corners:[],straight:len>0?gap/len:1};
  if(len<U*.9){A.type='tap';return A;}
  const rs=resample(pts,Math.max(5,U*.22));A.rs=rs;
  let prev=null;for(let i=1;i<rs.length;i++){const a=Math.atan2(rs[i].y-rs[i-1].y,rs[i].x-rs[i-1].x);if(prev!==null){let d=a-prev;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;A.turn+=d;}prev=a;}
  const k=2;let lastSign=0;
  for(let i=k;i<rs.length-k;i++){const ax=rs[i].x-rs[i-k].x,ay=rs[i].y-rs[i-k].y,bx=rs[i+k].x-rs[i].x,by=rs[i+k].y-rs[i].y;
    const c=(ax*bx+ay*by)/(Math.hypot(ax,ay)*Math.hypot(bx,by)+1e-6);
    if(c<.2){A.sharp++;if(c<-.4)A.very++;const sg=Math.sign(ax*by-ay*bx);if(lastSign&&sg!==lastSign)A.signCh++;lastSign=sg;A.corners.push({x:rs[i].x,y:rs[i].y});i+=k;}}
  const abs=Math.abs(A.turn);
  A.closed=gap<Math.max(U*1.1,diag*.3)&&len>U*3;
  A.closedish=gap<Math.max(U*1.6,diag*.42)&&diag>U*1.4;
  const longT=world&&world.mode==='ball'?U*4:plate.r*.85;
  if((A.sharp>=3&&A.signCh>=2)||(A.very>=4&&abs<TAU*2.2))A.type='star';
  else if(abs>=TAU*1.25)A.type='swirl';
  else if(A.closed&&abs>=TAU*.7)A.type='loop';
  else if(abs>=TAU*.85)A.type='swirl';
  else if(len>longT&&(A.straight>.5||abs<TAU*.6))A.type='ribbon';
  else if(len>longT*1.5)A.type='ribbon';
  else A.type='blob';
  return A;
}
function pointInPoly(x,y,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi))inside=!inside;}return inside;}
function polyArea(poly){let a=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)a+=(poly[j].x+poly[i].x)*(poly[j].y-poly[i].y);return Math.abs(a/2);}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
function distPoly(px,py,pts){let m=1e9;for(let i=1;i<pts.length;i++)m=Math.min(m,distSeg(px,py,pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y));if(pts.length===1)m=Math.hypot(px-pts[0].x,py-pts[0].y);return m;}

      const step=Math.max(4,Math.floor(st.pts.length/5));

// ================= 動物のふるまい =================
function defaultLook(a){
  if(ptr&&ptr.mode==='draw'&&ptr.pts.length){const p=ptr.pts[ptr.pts.length-1];return{x:p.x,y:p.y};}
  const dr=snacks.find(sn=>sn.state==='drag'||sn.state==='fly');if(dr)return{x:dr.x,y:dr.y};
  if(world.idleT>4&&guide.cur&&guide.cur.pt)return guide.cur.pt;
  let best=null,bd=1e9;for(const sn of snacks){if(!isReady(sn))continue;const d=dist(sn.x,sn.y,a.x,a.y);if(d<bd){bd=d;best=sn;}}
  if(best)return{x:best.x,y:best.y};
  if(world.mode==='diner'){
    const mv=animals.find(b=>b!==a&&b.moving);if(mv&&Math.sin(a.t*.7+a.id)>.2)return{x:mv.x,y:mv.y-mv.s*.4};
    return{x:plate.x+Math.sin(a.t*.5+a.id)*plate.r*.3,y:plate.y+Math.cos(a.t*.4)*plate.r*.2};

}
function updateAnimal(a,dt){
  a.s=U*SPEC[a.sp].sc;a.t+=dt;a.stT+=dt;
  a.blinkT-=dt;if(a.blinkT<=0){a.blink=1;a.blinkT=R(2,5);}a.blink=Math.max(0,a.blink-dt*6);
  a.squash*=Math.pow(.0005,dt);a.sparkle=Math.max(0,a.sparkle-dt);a.happy=Math.max(0,a.happy-dt);a.glowT=Math.min(9,a.glowT+dt*1.3);
  a.earTw=Math.max(0,a.earTw-dt*2);a.springC=Math.max(0,a.springC-dt*2.5);a.tickle=Math.max(0,a.tickle-dt);a.peck=Math.max(0,a.peck-dt*3);a.wag=Math.max(0,a.wag-dt);
  a.phase+=dt*(a.tags.includes('swirl')?(1.4+(a.lvl.swirl||1)*.9):.3);
  const et=(a.sp==='rabbit'&&a.tags.includes('ribbon'))?(1.7+.3*Math.min(2,(a.lvl.ribbon||1)-1)):1;a.earLen+=(et-a.earLen)*Math.min(1,dt*3);
  if(a.bubble){a.bubble.t+=dt;if(a.bubble.t>a.bubble.dur)a.bubble=null;}
  a.mouthT=0;a.leanT=0;a.moving=false;
  if(!a.ctrlJump&&(a.jv!==0||a.jump>0)){a.jv-=U*28*dt;a.jump+=a.jv*dt;if(a.jump<=0){if(a.jv<-U*4){a.squash=.18;SFX.land();}a.jump=0;a.jv=0;}}
  a.ctrlJump=false;
  let lk=null;
  if(a.attract){lk={x:a.attract.x,y:a.attract.y};a.mouthT=1;a.leanT=1;a.attract=null;if(a.st==='idle'&&Math.random()<dt*2)a.earTw=1;}
  switch(a.st){
    case 'arrive':{const h=homeOf(a);if(walkTo(a,h.x,h.y,1.4,dt)){a.st='idle';a.jv=U*7;a.happy=.8;SFX.arrive(a.sp);burst(a.x,a.y-a.s,8,['#ff8fb0','#ffd23f'],'heart',U*2);log('arrive:'+a.sp);a.bubble={kind:SPEC[a.sp].fav,t:0,dur:3.5};}break;}
    case 'idle':{
      const h=homeOf(a);if(dist(a.x,a.y,h.x,h.y)>2)walkTo(a,h.x,h.y,1,dt);
      a.idleT+=dt;
      if(world.mode!=='diner')break;
      const fav=SPEC[a.sp].fav;
      const fsn=snacks.find(sn=>isReady(sn)&&(sn.tags.includes(fav)||sn.tags.includes(a.second)));
      if(fsn){lk=lk||{x:fsn.x,y:fsn.y};a.mouthT=Math.max(a.mouthT,.45+.3*Math.sin(a.t*6));a.begT+=dt;if(a.begT>1.5){a.begT=0;if(a.jump===0)a.jv=U*4.5;}
        if(a.sp==='rabbit'&&fsn.tags.includes('ribbon'))a.earTw=1;if(a.sp==='chick'&&fsn.tags.includes('dots')&&Math.random()<dt*2)a.peck=1;if(a.sp==='cat'&&fsn.tags.includes('zigzag'))a.wag=1;}
      if(!a.everAte){a.growlT-=dt;if(a.growlT<=0){a.growlT=rr(5,7);a.tummy=.9;SFX.growl();}
        if(a.tummy>0){a.tummy-=dt;a.mouthT=Math.max(a.mouthT,.85);a.squash=Math.sin(a.tummy*28)*.035;}}
      if(world.idleT>4&&guide.cur&&guide.cur.animal===a){a.mouthT=Math.max(a.mouthT,.7);a.leanT=Math.max(a.leanT,.5);a.begT+=dt;if(a.begT>1.2){a.begT=0;if(a.jump===0)a.jv=U*4;}}
      if(!ptr){a.nextRoutineT-=dt;if(a.nextRoutineT<=0){a.nextRoutineT=rr(16,26);if(!startRoutine(a))maybeVisit(a);}}
      break;}
    case 'path':{
      const n=a.path&&a.path[a.pathI];
      if(!n){endRoutine(a);break;}
      if(n.endLine&&a.line&&!n._done){finalizeLine(a);}
      n._done=true;
      if(n.mode==='walk'){const px=a.x,py=a.y;const done=walkTo(a,n.x,n.y,n.sp||1.15,dt);const md=dist(px,py,a.x,a.y);
        if(n.stamp){a.stampAcc+=md;if(a.stampAcc>=a.stampStep){a.stampAcc=0;dropFoot(a);}}
        if(n.line)extendLine(a);if(done)a.pathI++;}
      else{if(!a.hop){a.hop={fx:a.x,fy:a.y,t:0,dur:n.dur||.42,h:n.h||U*.9};if(Math.abs(n.x-a.x)>2)a.face=n.x>a.x?1:-1;SFX.hop();}
        const hp=a.hop;hp.t+=dt;const u=clamp(hp.t/hp.dur,0,1);a.x=lerp(hp.fx,n.x,u);a.y=lerp(hp.fy,n.y,u);a.jump=Math.sin(Math.PI*u)*hp.h;a.jv=0;a.ctrlJump=true;a.moving=true;
        if(n.line)extendLine(a);
        if(u>=1){a.jump=0;a.hop=null;a.squash=.15;if(n.stamp)dropPrint(a);SFX.land();a.pathI++;}}
      lk=lk||{x:a.x+a.face*U*3,y:a.y+U*.5};
      break;}
    case 'goto':{const g=a.goal;if(!g){a.st='idle';break;}
      const gp=typeof g.pos==='function'?g.pos():g.pos;if(!gp){a.goal=null;a.st='idle';break;}
      if(walkTo(a,gp.x,gp.y,g.sp||1.25,dt)){const f=g.then;a.goal=null;a.st='idle';if(g.face)a.face=g.face();if(f)f(a);}
      if(g.look)lk=g.look();break;}
    case 'eat':{a.mouthT=a.stT<.32?1:.55;a.chew=a.stT>.32;a.cheek=a.chew?(.5+.5*Math.abs(Math.sin(a.stT*9))):0;
      const mt=[.42,.78,1.12];for(let i=0;i<3;i++)if(a.lastMunch<i+1&&a.stT>mt[i]){a.lastMunch=i+1;SFX.munch(i);const m=mouthPos(a);burst(m.x,m.y,4,['#e9b467','#b4632e','#fff3c6'],'dot',U*2);}
      lk={x:a.x+a.face*U*3,y:a.y-U};
      if(a.stT>1.35){a.chew=false;a.cheek=0;digest(a,a.eatSnack);}break;}
    case 'joy':{a.mouthT=.35;if(a.stT>1.1){a.st='idle';if(a.postRoutine&&a.tags.length){a.nextRoutineT=.5;a.postRoutine=false;}}break;}
    case 'await':{const sn=a.reserved;if(!sn||!snacks.includes(sn)||a.stT>4){a.reserved=null;a.st='idle';break;}lk={x:sn.x,y:sn.y};a.mouthT=1;a.leanT=.7;break;}
    case 'bounce':{if(a.stT<.45)a.springC=1;lk=a.bounceTgt?{x:a.bounceTgt.x,y:a.bounceTgt.y}:lk;if(a.stT>1.1){a.st='idle';a.busy=false;}break;}
    case 'seq':{if(a.goal){const gp=typeof a.goal.pos==='function'?a.goal.pos():a.goal.pos;if(gp&&walkTo(a,gp.x,gp.y,a.goal.sp||1.3,dt)){const f=a.goal.then;a.goal=null;if(f)f(a);}}
      if(a.seqLook)lk=typeof a.seqLook==='function'?a.seqLook():a.seqLook;if(a.seqMouth)a.mouthT=a.seqMouth;break;}
    case 'dance':break;
    case 'leave':{walkTo(a,a.leaveX,a.y,1.5,dt);a.happy=.2;if(Math.abs(a.x-a.leaveX)<2)a.gone=true;break;}
  }
  if(a.roll>0){a.roll-=dt;a.rot=(1-Math.max(0,a.roll)/.9)*TAU*a.face;if(a.roll<=0){a.roll=0;a.rot=0;}}
  if(a.tickle>0){a.mouthT=Math.max(a.mouthT,.4);}
  a.look=lk||defaultLook(a);
  if((a.st==='idle'||a.st==='await'||a.st==='eat'||a.st==='seq'||a.st==='bounce')&&!a.moving){const dx=a.look.x-a.x;if(Math.abs(dx)>a.s*.6)a.face=dx>0?1:-1;}
  a.mouth+=(a.mouthT-a.mouth)*Math.min(1,dt*12);a.lean+=(a.leanT-a.lean)*Math.min(1,dt*8);
  const hp=headPos(a);let dx=(a.look.x-hp.x)*a.face,dy=a.look.y-hp.y;const l=Math.hypot(dx,dy)||1;
  a.lx+=(dx/l-a.lx)*Math.min(1,dt*10);a.ly+=(dy/l-a.ly)*Math.min(1,dt*10);
}

// ---- スタンプを押す散歩（種ごとに広がり方が違う） ----
function startRoutine(a){
  if(a.busy||!a.tags.length||world.mode!=='diner')return false;
  const lv=maxLvl(a),P=plate,ang=Math.atan2(a.y-P.y,a.x-P.x),h=homeOf(a),path=[];
  const edge=(an,f)=>({x:P.x+Math.cos(an)*P.r*f,y:P.y+Math.sin(an)*P.r*f-a.s*.55});
  const inner=f=>{const an=R(0,TAU),r=Math.sqrt(Math.random())*P.r*f;return{x:P.x+Math.cos(an)*r,y:P.y+Math.sin(an)*r-a.s*.55};};
  if(a.sp==='zebra'){
    const a1=ang+Math.PI+rr(-.6,.6),p0=edge(ang,.7),p2=edge(a1,.7),side=rng()<.5?1:-1;
    const c={x:P.x+Math.cos(ang+Math.PI/2)*P.r*.5*side,y:P.y+Math.sin(ang+Math.PI/2)*P.r*.5*side-a.s*.55};
    path.push({mode:'walk',x:p0.x,y:p0.y});
    for(let i=1;i<=9;i++){const u=i/9;path.push({mode:'walk',stamp:true,sp:.9,x:(1-u)*(1-u)*p0.x+2*(1-u)*u*c.x+u*u*p2.x,y:(1-u)*(1-u)*p0.y+2*(1-u)*u*c.y+u*u*p2.y});}
    path.push({mode:'walk',x:h.x,y:h.y});a.stampStep=U*(lv>=2?.5:.62);a.stampAcc=0;
  }else if(a.sp==='rabbit'){
    const reps=lv>=2?2:1;
    for(let r=0;r<reps;r++){const a0=ang+(r?.9:0)*(rng()<.5?1:-1),a1=a0+Math.PI+rr(-.4,.4),p0=edge(a0,.74),p2=edge(a1,.74);
      path.push({mode:'walk',x:p0.x,y:p0.y,endLine:true});
      const nx=-(p2.y-p0.y),ny=p2.x-p0.x,nl=Math.hypot(nx,ny)||1;
      for(let i=1;i<=10;i++){const u=i/10,off=Math.sin(u*TAU*1.25)*P.r*.17;path.push({mode:'hop',line:true,h:U*.45,dur:.3,x:lerp(p0.x,p2.x,u)+nx/nl*off,y:lerp(p0.y,p2.y,u)+ny/nl*off});}}
    path.push({mode:'walk',x:h.x,y:h.y,endLine:true});
  }else if(a.sp==='chick'){
    const n=4+lv*2,cc=inner(.4);for(let i=0;i<n;i++){const an=R(0,TAU),rd=Math.sqrt(Math.random())*P.r*.26,p={x:cc.x+Math.cos(an)*rd,y:cc.y+Math.sin(an)*rd};path.push({mode:'hop',stamp:true,h:U*.75,dur:.38,x:p.x,y:p.y});}
    path.push({mode:'hop',h:U*.8,dur:.5,x:h.x,y:h.y});
  }else{
    const n=3+lv;for(let i=0;i<n;i++){const p=inner(.62);path.push({mode:'hop',stamp:true,h:U*(1.8+.3*lv),dur:.62,x:p.x,y:p.y});}
    path.push({mode:'hop',h:U*1.6,dur:.6,x:h.x,y:h.y});
  }
  a.path=path;a.pathI=0;a.st='path';a.hop=null;log('routine:'+a.sp,a.tags.join('+'));
  return true;
}
function endRoutine(a){finalizeLine(a);a.path=null;a.hop=null;a.jump=0;if(a.st==='path')a.st='idle';}
function finalizeLine(a){if(!a.line)return;const L=a.line;a.line=null;if(L.pts.length<4){const i=stamps.indexOf(L);if(i>=0)stamps.splice(i,1);}else{L.done=true;log('ribbonLine',L.tags.join('+'));}}
function stampTags(a){return a.tags.length?a.tags.slice():[SPEC[a.sp].fav];}
function dropFoot(a){const fx=a.x,fy=a.y+a.s*.55;if(!onPlate(fx,fy,.9))return;a.foot*=-1;const lv=maxLvl(a);
  addStamp({kind:'print',shape:'hoof',x:fx+a.foot*a.s*.14,y:fy+a.foot*a.s*.07,r:U*.34*(lv>=2?1.25:1),rot:R(-.3,.3),tags:stampTags(a),src:a.sp});SFX.stamp();}
function dropPrint(a){const fx=a.x,fy=a.y+a.s*.55;if(!onPlate(fx,fy,.9))return;const lv=maxLvl(a);
  if(a.sp==='chick')addStamp({kind:'print',shape:'grain',x:fx,y:fy,r:U*.26,rot:R(0,TAU),tags:stampTags(a),src:a.sp});
  else addStamp({kind:'print',shape:'paw',x:fx,y:fy,r:U*.4*(lv>=2?1.2:1),rot:R(-.4,.4),tags:stampTags(a),src:a.sp});

function extendLine(a){

function maybeVisit(a){

  if(!b)return;
  a.st='goto';a.goal={pos:()=>({x:b.x-(b.x>a.x?1:-1)*b.s*1.9,y:b.y}),sp:1.1,look:()=>({x:b.x,y:b.y-b.s*.4}),then:(a)=>{a.face=b.x>a.x?1:-1;a.jv=U*4;b.jv=U*4;a.happy=.6;b.happy=.6;b.face=a.x>b.x?1:-1;
    burst((a.x+b.x)/2,a.y-a.s,5,['#ff8fb0','#ff5e8a'],'heart',U*1.5);SFX.giggle();log('visit',a.sp+'>'+b.sp);
    const ra=TAGC[a.tags[0]],rb=TAGC[b.tags[0]];if(ra&&rb)aroma((a.x+b.x)/2,a.y-a.s*.6,6,[ra[0],rb[0]]);}};
}

// ---- 食べる ----
function pickFriend(c,sn){
  const cands=animals.filter(b=>b!==c&&canCatch(b));if(!cands.length)return null;
  const fav=cands.filter(b=>sn.tags.includes(SPEC[b.sp].fav));if(fav.length)return fav[0];
  cands.sort((x,y)=>x.tags.length-y.tags.length);return cands[0];
}
function feedStart(a,sn,forced){
  if(ptr&&ptr.snack===sn){ptr.mode='none';ptr.snack=null;}
  if(sn.isMega){startShare(sn,a);return;}
  if(!forced&&a.sp==='cat'&&a.tags.includes('zigzag')&&!sn.tags.includes('zigzag')){const t=pickFriend(a,sn);if(t){catBounce(a,sn,t);return;}}
  if(a.st==='path')endRoutine(a);
  sn.state='suck';sn.suck={t:0,fx:sn.x,fy:sn.y,a};sn.reserved=a;
  a.st='eat';a.stT=0;a.busy=true;a.eatSnack=sn;a.lastMunch=0;a.goal=null;a.bubble=null;SFX.slurp();
}
function catBounce(c,sn,tgt){
  if(c.st==='path')endRoutine(c);
  sn.state='tail';sn.tail={t:0,c,tgt,fx:sn.x,fy:sn.y};c.st='bounce';c.stT=0;c.busy=true;c.bounceTgt=tgt;
  tgt.st='await';tgt.stT=0;tgt.reserved=sn;
}
function tossHalf(a,sn,b){
  const m=mouthPos(a);const c=newSnack(m.x,m.y,sn.parts.map(p=>({kind:p.kind,pts:p.pts,corners:p.corners,r:p.r})),sn.tags);
  c.k=sn.k*.7;c.halved=true;c.state='fly';c.puffT=1;c.dirty=true;c.fly={fx:m.x,fy:m.y,t:0,dur:.8,h:U*3,target:b};
  b.st='await';b.stT=0;b.reserved=c;SFX.whoosh();log('trade',a.sp+'>'+b.sp);
}
function digest(a,sn){
  a.busy=false;a.eatSnack=null;a.everAte=true;
  if(!sn){a.st='idle';return;}
  const fav=SPEC[a.sp].fav,tags=sn.tags.slice(),favHit=tags.includes(fav),big=favHit||tags.includes(a.second);
  const before=a.tags.slice();
  let tossTo=null;
  if(a.sp!=='zebra'&&!favHit&&!sn.halved)tossTo=animals.find(b=>b!==a&&canCatch(b)&&tags.includes(SPEC[b.sp].fav))||null;
  for(const t of tags){if(a.tags.includes(t))a.lvl[t]=(a.lvl[t]||1)+1;else{a.tags.push(t);a.lvl[t]=1;}}
  while(a.tags.length>3){const o=a.tags.shift();delete a.lvl[o];}
  a.hist.push(tags.join('+'));if(a.hist.length>12)a.hist.shift();
  a.glowT=0;a.sparkle=1.6;a.happy=1.1;a.jv=U*(big?9:5.5)*(a.tags.includes('zigzag')?1.3:1);
  const m=mouthPos(a),cols=[];for(const t of tags)cols.push(...(TAGC[t]||TAGC.marble).slice(0,2));
  if(big||tags.some(t=>!before.includes(t)))SFX.transform(tags,big);else SFX.taste();
  burst(m.x,m.y-a.s*.3,big?18:10,cols.length?cols:['#ffd23f'],'star',U*4);
  world.meals++;a.mealCount++;
  log('eat:'+a.sp,tags.join('+'));
  if(a.sp==='zebra'&&tags.includes('swirl'))log('d1:zebraSwirl');
  if(a.sp==='chick'&&tags.includes('dots'))log('d2:chickDots');
  if(a.sp==='rabbit'&&tags.includes('ribbon'))log('d3:rabbitRibbon');
  if(a.sp==='cat'&&tags.includes('zigzag'))log('d4:catSpring');
  if(tags.includes('ribbon')&&tags.includes('dots'))log('d5:ribbonCakeEaten:'+a.sp,tags.join('+'));
  const c=sn.bouncedBy;
  if(c&&animals.includes(c)&&c!==a){c.roll=.9;c.happy=1;SFX.giggle();log('d4:catRoll');}
  else{const cat=animals.find(b=>b.sp==='cat'&&b!==a&&b.st==='idle'&&b.tags.includes('zigzag'));if(cat&&Math.random()<.5){cat.roll=.9;cat.happy=1;}}
  if(tossTo)tossHalf(a,sn,tossTo);
  a.st='joy';a.stT=0;a.postRoutine=true;
  checkArrivals();
}

// ---- おやつの更新 ----
function updateSnacks(dt){
  for(const sn of snacks){
    if(sn.state==='puff'){sn.puffT+=dt/.48;if(sn.puffT>=1){sn.puffT=1;sn.state='ready';}}
    sn.bv+=(-sn.bounce*160-sn.bv*10)*dt;sn.bounce+=sn.bv*dt;
    if(sn.state==='suck'){const s=sn.suck;s.t+=dt;const u=clamp(s.t/.32,0,1),m=mouthPos(s.a);sn.x=lerp(s.fx,m.x,easeInOut(u));sn.y=lerp(s.fy,m.y,easeInOut(u));sn.sc=1-u*.92;if(u>=1)sn.state='gone';}
    else if(sn.state==='tail'){const tl=sn.tail;tl.t+=dt;const c=tl.c,tip={x:c.x-c.face*c.s*.75,y:c.y-c.jump-c.s*.95};const u=clamp(tl.t/.25,0,1);sn.x=lerp(tl.fx,tip.x,u);sn.y=lerp(tl.fy,tip.y,u);
      if(tl.t>=.45){SFX.boing();sn.state='fly';sn.fly={fx:sn.x,fy:sn.y,t:0,dur:.85,h:U*4.5,target:tl.tgt};sn.bouncedBy=c;c.busy=false;c.springC=0;c.jv=U*6;log('d4:springBounce',c.sp+'>'+tl.tgt.sp);}}

function bestEater(sn){

    if(cat&&sn.idleT>9&&!sn.tags.includes('zigzag')){const fr=animals.find(b=>b!==cat&&canCatch(b)&&sn.tags.includes(SPEC[b.sp].fav));
      if(fr){sn.reserved=cat;cat.st='goto';cat.goal={pos:sideGoal(cat,sn),look:()=>({x:sn.x,y:sn.y}),then:(c)=>{sn.reserved=null;if(sn.state==='ready'&&canCatch(fr)){c.face=fr.x>c.x?1:-1;catBounce(c,sn,fr);log('catAuto');}}};continue;}}

  }
}

// ================= お皿の上の調理（線→おやつ） =================
function centroid(pts){let x=0,y=0;for(const p of pts){x+=p.x;y+=p.y;}return{x:x/pts.length,y:y/pts.length};}
function absorbStamps(pts){
  const res=[];
  for(const st of stamps){
    if(st.kind==='line'){if(st.pts.length<4||!st.done)continue;let near=0,n=0;for(let i=0;i<pts.length;i+=2){n++;if(distPoly(pts[i].x,pts[i].y,st.pts)<U*.7)near++;}if(near>=Math.max(4,n*.3))res.push(st);}
    else{let c=0;for(let i=0;i<pts.length;i++){if(dist(pts[i].x,pts[i].y,st.x,st.y)<st.r*.8+U*.1)c++;}if(c>=2)res.push(st);}
  }
  return res;
}
function removeStamps(list){for(const s of list){const i=stamps.indexOf(s);if(i>=0)stamps.splice(i,1);}}
function overlapRatio(sn,pts){let hit=0,n=0;for(let i=0;i<pts.length;i+=2){n++;if(snackDist(sn,pts[i].x,pts[i].y)<sn.w*.3)hit++;}return n?hit/n:0;}
function bakeFx(x,y,tags){const cols=[];for(const t of tags)cols.push(...(TAGC[t]||TAGC.marble).slice(0,2));aroma(x,y,9,cols.concat(['#fff']));}
function bakeDiner(raw){
  const A=analyze(raw),last=raw[raw.length-1];world.strokes++;
  if(A.type==='tap'){doTap(last.x,last.y);return;}
  if((A.closedish&&Math.abs(A.turn)<TAU*1.6&&A.type!=='star')||A.type==='loop'){
    const encSt=stamps.filter(st=>{if(st.kind==='line'){const c=st.pts[Math.floor(st.pts.length/2)];return c&&pointInPoly(c.x,c.y,raw);}return pointInPoly(st.x,st.y,raw);});
    const encSn=snacks.filter(sn=>sn.state==='ready'&&!sn.isMega&&pointInPoly(sn.x,sn.y,raw));
    if(encSt.length||encSn.length){
      const stT=new Set(),srcs=new Set(),all=[];
      encSt.forEach(s=>{s.tags.forEach(t=>stT.add(t));srcs.add(s.src);addTags(all,s.tags,6);});encSn.forEach(s=>addTags(all,s.tags,6));
      if(megaReady()&&stT.size>=2&&srcs.size>=2)makeMega(raw,all,encSt,encSn,srcs);
      else makeTart(raw,all,encSt,encSn,srcs,A);
      return;
    }
  }
  let kind=A.type;const rs=resample(raw,Math.max(4,U*.16));
  const ab=absorbStamps(rs);const tags=[KIND_TAG[kind]];
  const zf=ab.filter(st=>st.src==='zebra'&&st.tags.includes('swirl'));const follow=zf.length>=3?rs.filter(q=>zf.some(st=>dist(q.x,q.y,st.x,st.y)<st.r+U*.6)).length/rs.length:0;
  if(follow>=.5&&kind!=='star'){kind='swirl';tags[0]='swirl';log('d1:traceFootprints',zf.length);}
  if(ab.some(st=>st.kind==='line'))log('d3:traceRibbonLine');
  ab.forEach(st=>addTags(tags,st.tags,4));removeStamps(ab);
  const target=snacks.find(sn=>sn.state==='ready'&&!sn.isMega&&overlapRatio(sn,rs)>=.18);
  if(target){
    target.parts.push({kind,pts:toLocal(target,rs),corners:toLocal(target,A.corners)});addTags(target.tags,tags,4);repuff(target);
    SFX.bake(A.len,'cake');bakeFx(target.x,target.y,target.tags);log('layer',target.tags.join('+'));
    if(target.tags.includes('ribbon')&&target.tags.includes('dots'))log('d5:ribbonCake',target.tags.join('+'));
    if(target.tags.length>=3)log('d5:layered3',target.tags.join('+'));
    return;
  }
  const sn=newSnack(A.cx,A.cy,[],tags);sn.parts.push({kind,pts:toLocal(sn,rs),corners:toLocal(sn,A.corners)});
  SFX.bake(A.len,kind);bakeFx(A.cx,A.cy,tags);log('snack:'+kind,tags.join('+'));
}
function megaReady(){return animals.length>=3&&world.meals>=5;}
function makeMega(poly,tags,encSt,encSn,srcs){
  const c0=centroid(poly),c=clampToPlate(c0.x,c0.y,.45);
  const r=clamp(Math.sqrt(polyArea(poly)/Math.PI)*.7,U*1.6,plate.r*.5);
  removeStamps(encSt);encSn.forEach(s=>s.state='gone');
  const t=[];addTags(t,tags,4);
  const sn=newSnack(c.x,c.y,[{kind:'mega',r,pts:[{x:0,y:0}]}],t);sn.isMega=true;
  SFX.mega();burst(c.x,c.y-r*.5,24,INKS,'confetti',U*5);log('d6:megaCake',t.join('+')+'|'+[...srcs].join('+'));
}
function makeTart(poly,tags,encSt,encSn,srcs,A){
  const c=centroid(poly);const loop=resample(poly,Math.max(4,U*.16));loop.push({x:loop[0].x,y:loop[0].y});
  const sn=newSnack(c.x,c.y,[],[]);
  sn.parts.push({kind:'loop',pts:toLocal(sn,loop)});
  const berries=[];
  for(const o of encSn){for(const p of o.parts){if(p.kind==='mega')continue;const wp=p.pts.map(q=>({x:o.x+q.x*o.k,y:o.y+q.y*o.k,s:q.s}));if(p.kind==='berry')berries.push(...wp);else sn.parts.push({kind:p.kind,pts:toLocal(sn,wp),corners:p.corners?toLocal(sn,p.corners.map(q=>({x:o.x+q.x*o.k,y:o.y+q.y*o.k}))):[]});}o.state='gone';}
  for(const st of encSt){if(st.kind==='line'){sn.parts.push({kind:'ribbon',pts:toLocal(sn,st.pts)});}else if(st.tags.includes('dots')||st.src==='chick'){berries.push({x:st.x,y:st.y,s:.8});}}
  if(berries.length)sn.parts.push({kind:'berry',pts:toLocal(sn,berries).map((q,i)=>({x:q.x,y:q.y,s:berries[i].s||1}))});
  const t=[];if(berries.length)t.push('dots');addTags(t,tags,4);if(!t.length)t.push('marble');sn.tags=t;
  removeStamps(encSt);

  if(srcs.has('chick')||berries.length)log('d2:encircleGrains',t.join('+'));else log('tart',t.join('+'));
}
function addBerryTo(sn,x,y){

  if(sn.parts.length===1){const near=bp.pts.filter(b=>dist(b.x,b.y,l.x,l.y)<sn.rb*1.7).length;l.y-=near*sn.rb*.55;l.x+=(Math.random()-.5)*sn.rb*.5;}
  if(bp.pts.length<40)bp.pts.push(l);
  const had=sn.tags.includes('dots');addTags(sn.tags,['dots'],4);repuff(sn);SFX.pop(bp.pts.length);
  burst(x,y,4,['#ff4d6a','#ffd0da'],'dot',U*1.5);

function doTap(x,y){
  const ls=stamps.find(st=>st.kind==='line'&&st.done&&st.pts.length>3&&distPoly(x,y,st.pts)<U*.8);
  if(ls){const c=centroid(ls.pts);const t=['ribbon'];addTags(t,ls.tags.concat(['dots']),4);removeStamps([ls]);
    const sn=newSnack(c.x,c.y,[],t);sn.parts.push({kind:'ribbon',pts:toLocal(sn,ls.pts)},{kind:'berry',pts:toLocal(sn,[{x,y}]).map(q=>({x:q.x,y:q.y,s:1}))});

  const sn=snacks.find(s=>s.state==='ready'&&!s.isMega&&snackDist(s,x,y)<U*.35);

  const ab=stamps.filter(st=>st.kind!=='line'&&dist(st.x,st.y,x,y)<st.r+U*.4);
  const t=['dots'];ab.forEach(st=>addTags(t,st.tags,4));removeStamps(ab);
  newSnack(x,y,[{kind:'berry',pts:[{x:0,y:0,s:1}]}],t);SFX.pop(0);burst(x,y,5,['#ff4d6a','#ffd0da','#45b36b'],'dot',U*1.6);log('berry',t.join('+'));
}

// ================= 舞踏会の床の絵 =================
const DECOC={spin:'#1fa6a0',hop:'#ff5e8a',march:'#ffaa22',spring:'#8b5bd0',sway:'#ff7a3d'};

function finaleCond(){const c=world.danceChanges,k=world.danceKinds.size;return c>=6||(c>=3&&k>=3)||(c>=4&&k>=2);}

function swayGrid(i,n,cx,cy){const fw=floorR.x1-floorR.x0,cols=(n>2&&fw<U*2.6*n)?2:n,rows=Math.ceil(n/cols),c=i%cols,r=Math.floor(i/cols),sp=Math.min(U*2.8,fw/(cols+.3));return{x:cx+(c-(cols-1)/2)*sp,y:cy+(r-(rows-1)/2)*U*2.2};}
function polyLen(P){let l=0;for(let i=1;i<P.length;i++)l+=dist(P[i].x,P[i].y,P[i-1].x,P[i-1].y);return l;}
function polyAt(P,s){for(let i=1;i<P.length;i++){const d=dist(P[i].x,P[i].y,P[i-1].x,P[i-1].y);if(s<=d||i===P.length-1){const u=d?clamp(s/d,0,1):0;return{x:lerp(P[i-1].x,P[i].x,u),y:lerp(P[i-1].y,P[i].y,u)};}s-=d;}return{x:P[0].x,y:P[0].y};}
function updateDance(dt){

  if(world.special){const sp=world.special;sp.t+=dt;const bt=[2,3.2,4.4,5.6,6.8];for(let i=0;i<bt.length;i++)if(sp.bites<i+1&&sp.t>bt[i]){sp.bites=i+1;const a=animals[i%n];a.jv=U*6;a.happy=.8;SFX.munch(i%3);burst(sp.x,sp.y-sp.r*.6,6,INKS,'star',U*3);}

    else if(d.kind==='hop'&&d.deco){const P=d.deco.pts,m=P.length,per=zz>1?.7:.55,kk=Math.floor(t/per),u=(t/per)%1;let A,B;
      if(m===1){const c=P[0],q=j=>({x:c.x+Math.cos(j*1.7+i*TAU/n)*U*2.2,y:c.y+Math.sin(j*1.7+i*TAU/n)*U*1.2});A=q(kk);B=q(kk+1);}else{A=P[(kk+i)%m];B=P[(kk+1+i)%m];}

const guide={cur:null,demo:null,demoKey:null,demosThisIdle:0};
function computeGuide(){
  if(ptr)return null;
  if(world.mode==='diner'){
    const ready=snacks.filter(s=>s.state==='ready'&&!s.reserved);
    if(ready.length){const sn=ready[ready.length-1];const c=animals.filter(canEat);
      if(c.length){const pref=c.filter(a=>sn.tags.includes(SPEC[a.sp].fav));const pool=pref.length?pref:c;pool.sort((x,y)=>dist(x.x,x.y,sn.x,sn.y)-dist(y.x,y.y,sn.x,sn.y));
        return{key:'feed'+sn.id,kind:'feed',snack:sn,animal:pool[0],pt:{x:sn.x,y:sn.y}};}}
    if(ready.length)return null;
    const tagset=new Set(),srcs=new Set();stamps.forEach(s=>{s.tags.forEach(t=>tagset.add(t));srcs.add(s.src);});
    if(megaReady()&&stamps.length>=2&&tagset.size>=2&&srcs.size>=2)return{key:'enc'+stamps.length,kind:'encircle',stamps:stamps.slice(),pt:centroid(stamps.map(s=>s.kind==='line'?s.pts[Math.floor(s.pts.length/2)]:s))};
    const line=stamps.find(s=>s.kind==='line'&&s.done);
    if(line)return{key:'line'+line.id,kind:'tapLine',stamps:[line],pt:line.pts[Math.floor(line.pts.length/2)]};
    const prints=stamps.filter(s=>s.kind!=='line');
    const grains=prints.filter(s=>s.src==='chick');
    if(grains.length>=2)return{key:'grain'+grains[0].id,kind:'encircle',stamps:grains,pt:centroid(grains)};
    if(prints.length){const src=prints[0].src,list=prints.filter(s=>s.src===src);return{key:'trace'+list[0].id,kind:'trace',stamps:list,pt:{x:list[0].x,y:list[0].y}};}
    return{key:'plate',kind:'draw',pt:{x:plate.x,y:plate.y}};
  }
  if(world.mode==='ball')return{key:'floor'+world.danceChanges,kind:'floor',pt:{x:floorR.cx,y:floorR.cy}};
  return null;
}
function spiralPts(cx,cy,r,turns){const out=[];for(let i=0;i<=40;i++){const u=i/40,th=u*turns*TAU,rr2=r*(.15+.85*u);out.push({x:cx+Math.cos(th)*rr2,y:cy+Math.sin(th)*rr2*.9});}return out;}

  if(d.kind==='hop'){d.pts.forEach((p,i)=>{const bob=Math.sin(world.t*3+i)*U*.12,r=U*(.32+(cur?.06*beat:0));
      ctx.strokeStyle='rgba(53,38,74,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x,p.y+bob+r);ctx.quadraticCurveTo(p.x+U*.15,p.y+r+U*.4,p.x,p.y+r+U*.7);ctx.stroke();
      ctx.fillStyle=INKS[i%INKS.length];ctx.beginPath();ctx.ellipse(p.x,p.y+bob,r,r*1.15,0,0,TAU);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(p.x-r*.35,p.y+bob-r*.35,r*.22,0,TAU);ctx.fill();});
    ctx.restore();return;}
  const P=d.pts;
  ctx.strokeStyle=rgba(col,.25);ctx.lineWidth=U*(.8+(cur?.15*beat:0));ctx.beginPath();smoothPath(ctx,P);ctx.stroke();
  ctx.save();ctx.translate(2,1.5);ctx.strokeStyle=MIS[0];ctx.lineWidth=U*.34;ctx.beginPath();smoothPath(ctx,P);ctx.stroke();ctx.restore();
  ctx.strokeStyle=col;ctx.lineWidth=U*.32;ctx.beginPath();smoothPath(ctx,P);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=U*.08;ctx.beginPath();smoothPath(ctx,P);ctx.stroke();
  const step=Math.max(3,Math.floor(P.length/7));
  for(let i=step>>1;i<P.length;i+=step){const p=P[i];ctx.save();ctx.translate(p.x,p.y);
    if(d.kind==='spin'){ctx.rotate(world.t*3+i);motif(ctx,'swirl',U*.35,0);}
    else if(d.kind==='march'){ctx.fillStyle=INKS[(i/step|0)%INKS.length];ctx.beginPath();ctx.moveTo(-U*.25,-U*.1);ctx.lineTo(U*.25,-U*.1);ctx.lineTo(0,U*.4+Math.sin(world.t*6+i)*U*.05);ctx.closePath();ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.stroke();}
    else if(d.kind==='spring'){ctx.translate(0,-Math.abs(Math.sin(world.t*5+i))*U*.4);motif(ctx,'zigzag',U*.3,0);}
    else{ctx.fillStyle='#ff5e8a';const s=U*.22;ctx.beginPath();ctx.moveTo(0,s*.4);ctx.bezierCurveTo(-s*1.2,-s*.4,-s*.4,-s*1.2,0,-s*.4);ctx.bezierCurveTo(s*.4,-s*1.2,s*1.2,-s*.4,0,s*.4);ctx.fill();}
    ctx.restore();}
  ctx.restore();
}
function drawWallLines(off){
  for(const L of wallLines){const C=TAGC[L.tag]||TAGC.marble,half=W/2*L.prog;
    for(const side of [-1,1]){const x0=W/2+side*off;ctx.save();ctx.lineCap='round';ctx.strokeStyle=rgba(C[0],.75);ctx.lineWidth=U*.22;ctx.beginPath();
      for(let i=0;i<=24;i++){const u=i/24,x=x0+side*half*u,y=L.y+Math.sin(u*10+world.t*2)*U*.25;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
      for(let i=1;i<=4;i++){const u=i/4.5;if(u>L.prog)break;ctx.save();ctx.translate(x0+side*W/2*u,L.y+Math.sin(u*10+world.t*2)*U*.25);motif(ctx,L.tag,U*.3,world.t);ctx.restore();}ctx.restore();}}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;
  const wo=world.wallOpen,t=world.t;
  if(wo>0){if(!bgB)buildBall();ctx.drawImage(bgB,0,0,W,H);
    const beat=music.on?(.5+.5*Math.sin(t*(BPM[music.kind]||100)/60*Math.PI)):0;
    const g=ctx.createRadialGradient(floorR.cx,floorR.cy,0,floorR.cx,floorR.cy,Math.max(W,H)*.5);g.addColorStop(0,'rgba(255,246,200,'+(.35+.15*beat)+')');g.addColorStop(1,'rgba(255,246,200,0)');ctx.fillStyle=g;ctx.fillRect(0,floorR.y0-U,W,H);
    if(guide.cur&&guide.cur.kind==='floor'){const hl=guide.cur.hl||0;ctx.strokeStyle='rgba(255,201,60,'+(.15+.35*hl*(.6+.4*Math.sin(t*2.5)))+')';ctx.lineWidth=U*.25;ctx.beginPath();ctx.ellipse(floorR.cx,floorR.cy,(floorR.x1-floorR.x0)*.3,(floorR.y1-floorR.y0)*.3,0,0,TAU);ctx.stroke();}
    const cd=world.dance&&world.dance.deco;for(const d of decos)drawDeco(d,d===cd,beat);
    if(world.special){const sp=world.special;ctx.save();ctx.translate(sp.x,sp.y);const s=clamp(sp.t/.5,0,1)*clamp((8.5-sp.t)/.5,0,1);ctx.scale(s,s);paintMega(ctx,sp.r,sp.tags,{bites:Math.min(4,sp.bites)});ctx.restore();}
    if(world.newCloth&&(world.mode==='cloth'||world.mode==='rest'||world.mode==='close')){const cp=world.clothPos;ctx.save();ctx.translate(cp.x,cp.y);ctx.scale(1,.6);paintQuilt(ctx,world.newCloth,cp.r,world.mode==='cloth'?world.clothProg:null);ctx.restore();}
  }
  if(wo<1){const off=easeInOut(wo)*W*.56,cw=bgD.width,ch=bgD.height;
    ctx.drawImage(bgD,0,0,cw/2,ch,-off,0,W/2,H);ctx.drawImage(bgD,cw/2,0,cw/2,ch,W/2+off,0,W/2,H);
    if(wo>0){for(const x of [W/2-off,W/2+off]){ctx.fillStyle='#ffc93c';for(let y=0;y<H;y+=U*.6){ctx.beginPath();ctx.arc(x,y,U*.16,0,TAU);ctx.fill();}}}
    drawWallLines(off);}
  if(world.plateA>0){ctx.save();ctx.globalAlpha=world.plateA;const ps=lerp(.6,1,world.plateA),hop=world.plateHop>0?Math.sin(world.plateHop*Math.PI)*U*.25:0;
    ctx.translate(plate.x,plate.y-hop);ctx.scale(ps,ps);
    if(guide.cur&&guide.cur.kind==='draw'){const hl=guide.cur.hl||0;ctx.strokeStyle='rgba(255,201,60,'+(.18+.4*hl*(.6+.4*Math.sin(t*2.5)))+')';ctx.lineWidth=U*.32;ctx.beginPath();ctx.arc(0,0,plate.r*1.04,0,TAU);ctx.stroke();}
    ctx.drawImage(tableC.c,-tableC.sz/2,-tableC.sz/2,tableC.sz,tableC.sz);ctx.restore();
    ctx.save();ctx.globalAlpha=world.plateA;for(const st of stamps)drawStamp(ctx,st);ctx.restore();}
  const lifted=[];
  for(const sn of snacks){if(sn.state==='drag'||sn.state==='fly'||sn.state==='suck'||sn.state==='tail'||sn.state==='return'){lifted.push(sn);continue;}if(world.plateA<1){ctx.save();ctx.globalAlpha=world.plateA;drawSnack(sn);ctx.restore();}else drawSnack(sn);}
  drawLive();
  const order=animals.slice().sort((a,b)=>a.y-b.y);for(const a of order)drawAnimal(a);
  for(const sn of lifted)drawSnack(sn);
  for(const o of orbs)drawOrb(o);
  drawParts();
  drawDemo();
}

// ================= 入力（Pointer Events・一本指） =================
let ptr=null;
function inFloor(x,y){return x>=floorR.x0-U*.5&&x<=floorR.x1+U*.5&&y>=floorR.y0-U*.5&&y<=floorR.y1+U*.5;}
function hitAnimal(x,y){let best=null,bd=1e9;for(const a of animals){const d=dist(x,y,a.x+a.face*a.s*.25,a.y-a.jump-a.s*.25);if(d<a.s*1.05&&d<bd){bd=d;best=a;}}return best;}
function tickle(a){a.tickle=.6;a.squash=.16;if(a.jump===0&&a.st!=='dance')a.jv=U*3.5;a.happy=.5;SFX.giggle();if(world.mode==='ball'&&a.roll<=0)a.roll=.9;log('tickle:'+a.sp);}
function tinyWobble(x,y,first){
  ring(x,y,U*.45,'rgba(53,38,74,.3)');SFX.wobble();
  if(first){for(let i=0;i<10;i++){const an=R(0,TAU),v=R(U*.5,U*2.2);addP({x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,g:0,life:R(.6,1),sz:R(.12,.3)*U,c:INKS[i%INKS.length],type:'splat'});}world.plateHop=1;for(const a of animals){a.jv=a.jump===0?U*3:a.jv;}}
}
function onDown(e){
  if(e.cancelable)e.preventDefault();ensureAudio();
  if(!world.audioHello&&AC){world.audioHello=true;SFX.hello();}
  world.idleT=0;guide.demosThisIdle=0;guide.demo=null;
  const x=e.clientX,y=e.clientY;
  if(ptr){tinyWobble(x,y,false);return;}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const now=performance.now();
  ptr={id:e.pointerId,x,y,sx:x,sy:y,t0:now,lastT:now,pts:[],mode:'none',snack:null,moved:0,speed:0,hue:Math.floor(Math.random()*INKS.length)};
  const first=!world.firstTouch;world.firstTouch=true;
  if(world.mode==='diner'){
    let hit=null,hd=1e9;for(const sn of snacks){if(!isReady(sn))continue;const d=snackDist(sn,x,y);if(d<Math.max(U*.35,10)&&d<hd){hd=d;hit=sn;}}
    if(hit){ptr.mode='press';ptr.snack=hit;ptr.offx=hit.x-x;ptr.offy=hit.y-y;hit.bv=-3;SFX.tick();return;}
    if(onPlate(x,y,.98)){ptr.mode='draw';ptr.pts.push({x,y});SFX.squish();SFX.ink(true,0,y);return;}
    const a=hitAnimal(x,y);if(a){tickle(a);return;}
    tinyWobble(x,y,first);
  }else if(world.mode==='ball'){
    if(inFloor(x,y)){ptr.onAnimal=hitAnimal(x,y);ptr.mode='draw';ptr.pts.push({x:clamp(x,floorR.x0,floorR.x1),y:clamp(y,floorR.y0,floorR.y1)});SFX.squish();SFX.ink(true,0,y);return;}
    const a=hitAnimal(x,y);if(a){tickle(a);return;}tinyWobble(x,y,first);
  }else{const a=hitAnimal(x,y);if(a)tickle(a);else tinyWobble(x,y,first);}
}
function moveTo(x,y){
  const now=performance.now(),d=dist(x,y,ptr.x,ptr.y),dtm=Math.max(1,now-ptr.lastT);
  ptr.speed=lerp(ptr.speed,d/dtm*1000,.3);if(d>.5)ptr.lastT=now;ptr.x=x;ptr.y=y;ptr.moved+=d;world.idleT=0;
  if(ptr.mode==='press'){if(dist(x,y,ptr.sx,ptr.sy)>U*.35&&ptr.snack&&isReady(ptr.snack))startDrag(ptr.snack);else return;}
  if(ptr.mode==='drag'){const sn=ptr.snack;if(!sn||sn.state!=='drag'){ptr.mode='none';return;}sn.x=x+ptr.offx*.6;sn.y=y+ptr.offy*.6-U*.3;return;}
  if(ptr.mode==='draw'){const q=world.mode==='diner'?clampToPlate(x,y,.97):{x:clamp(x,floorR.x0,floorR.x1),y:clamp(y,floorR.y0,floorR.y1)};
    const l=ptr.pts[ptr.pts.length-1];if(!l||dist(l.x,l.y,q.x,q.y)>=3){if(ptr.pts.length<700)ptr.pts.push(q);}SFX.ink(true,ptr.speed,y);}
}
function onMove(e){
  if(!ptr||e.pointerId!==ptr.id)return;if(e.cancelable)e.preventDefault();
  let list=null;try{list=e.getCoalescedEvents?e.getCoalescedEvents():null;}catch(_){list=null;}
  if(!list||!list.length)list=[e];for(const ce of list)moveTo(ce.clientX,ce.clientY);
}
function startDrag(sn){ptr.mode='drag';sn.state='drag';sn.puffT=1;if(sn.reserved&&sn.reserved.st==='goto'){sn.reserved.goal=null;sn.reserved.st='idle';}sn.reserved=null;sn.idleT=0;SFX.squish();}
function onUp(e){if(!ptr||e.pointerId!==ptr.id)return;if(e.cancelable)e.preventDefault();finishPtr(false);}
function onCancel(e){if(!ptr||e.pointerId!==ptr.id)return;finishPtr(true);}
function finishPtr(cancel){
  const P=ptr;ptr=null;SFX.ink(false,0,0);if(!P)return;
  try{cv.releasePointerCapture(P.id);}catch(_){}
  if(P.mode==='press'&&P.snack){const sn=P.snack;if(!cancel&&world.mode==='diner'&&isReady(sn)&&!sn.isMega)addBerryTo(sn,P.x,P.y);return;}
  if(P.mode==='drag'&&P.snack){const sn=P.snack;if(sn.state!=='drag')return;
    let best=null,bd=1e9;if(!cancel)for(const a of animals){if(!canEat(a))continue;const m=mouthPos(a);const d=Math.min(dist(sn.x,sn.y,m.x,m.y),dist(P.x,P.y,m.x,m.y));if(d<bd){bd=d;best=a;}}
    if(best&&bd<best.s*1.9){feedStart(best,sn,false);log('feed:'+best.sp);return;}
    sn.state='return';sn.ret={fx:sn.x,fy:sn.y,t:0,to:clampToPlate(sn.x,sn.y,.62)};return;}
  if(P.mode==='draw'&&P.pts.length){if(world.mode==='diner')bakeDiner(P.pts);else if(world.mode==='ball'){if(P.onAnimal&&P.moved<U*.9&&animals.includes(P.onAnimal))tickle(P.onAnimal);else bakeBall(P.pts);}}
}
function cancelPtr(){if(ptr)finishPtr(true);}
function dragAttract(sn,px,py){
  let best=null,bd=1e9;
  for(const a of animals){if(!canEat(a))continue;const m=mouthPos(a);const d=Math.min(dist(sn.x,sn.y,m.x,m.y),dist(px,py,m.x,m.y));if(d<a.s*2.8)a.attract=sn;if(d<bd){bd=d;best=a;}}
  if(best&&bd<best.s*1.05+snackSize(sn)*.22){feedStart(best,sn,false);log('feed:'+best.sp);}
}
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp,{passive:false});
window.addEventListener('pointercancel',onCancel,{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(ptr&&e.pointerId===ptr.id)finishPtr(false);});
['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
window.addEventListener('blur',()=>cancelPtr());

// ================= 端末保存（記念のテーブルクロスだけ） =================
const SKEY='mogumogu-oekaki-cloth-v1';
function loadCloth(){
  let raw=null;
  try{raw=localStorage.getItem(SKEY);}catch(e){log('cloth:storageBlocked');return null;}
  if(!raw)return null;
  try{const d=JSON.parse(raw);
    if(d&&d.v===1&&Array.isArray(d.cloth)&&d.cloth.length>=1&&d.cloth.length<=4&&d.cloth.every(c=>c&&TAGS.includes(c.tag)&&SPECIES.includes(c.sp))){log('cloth:loaded');return d.cloth.map(c=>({tag:c.tag,sp:c.sp}));}
    throw new Error('bad');
  }catch(e){log('cloth:corrupt');try{localStorage.removeItem(SKEY);}catch(_){}return null;}
}
function saveCloth(cloth){try{localStorage.setItem(SKEY,JSON.stringify({v:1,cloth:cloth.map(c=>({tag:c.tag,sp:c.sp})),at:Date.now()}));return true;}catch(e){return false;}}

// ================= 画面サイズ・回転 =================
let needResize=true;
function remap(o){
  const k=plate.r/o.r,f=(x,y)=>({x:plate.x+(x-o.x)*k,y:plate.y+(y-o.y)*k});
  for(const sn of snacks){const p=f(sn.x,sn.y);sn.x=p.x;sn.y=p.y;sn.k*=k;sn.dirty=true;if(sn.ret)sn.ret.to=clampToPlate(sn.ret.to.x,sn.ret.to.y,.62);}
  for(const st of stamps){if(st.kind==='line')st.pts=st.pts.map(q=>f(q.x,q.y));else{const p=f(st.x,st.y);st.x=p.x;st.y=p.y;st.r*=k;}}
  for(const d of decos){d.pts=d.pts.map(q=>f(q.x,q.y));const c=f(d.cx,d.cy);let dx=0,dy=0;if(c.x<floorR.x0)dx=floorR.x0-c.x;if(c.x>floorR.x1)dx=floorR.x1-c.x;if(c.y<floorR.y0)dy=floorR.y0-c.y;if(c.y>floorR.y1)dy=floorR.y1-c.y;
    d.pts=d.pts.map(q=>({x:clamp(q.x+dx,floorR.x0,floorR.x1),y:clamp(q.y+dy,floorR.y0,floorR.y1)}));d.cx=c.x+dx;d.cy=c.y+dy;d.r*=k;}
  for(const a of animals){const p=f(a.x,a.y);a.s=U*SPEC[a.sp].sc;if(a.st!=='arrive'&&a.st!=='leave'){a.x=clamp(p.x,a.s,W-a.s);a.y=clamp(p.y,SA.t+a.s*1.2,H-SA.b-a.s*.7);}if(a.st==='path')endRoutine(a);a.hop=null;a.trail=[];
    if(a.goal&&a.goal.pos&&typeof a.goal.pos!=='function'){const q=f(a.goal.pos.x,a.goal.pos.y);a.goal.pos={x:clamp(q.x,a.s,W-a.s),y:clamp(q.y,SA.t+a.s,H-SA.b-a.s*.7)};}}
  for(const o of orbs){const p=f(o.fx,o.fy);o.fx=p.x;o.fy=p.y;}
  for(const L of wallLines){L.y=plate.y+(L.y-o.y)*k;}
  if(world.special){world.special.x=floorR.cx;world.special.y=floorR.cy;}
  if(world.clothPos){world.clothPos.x=floorR.cx;world.clothPos.y=floorR.cy+U*.2;world.clothPos.r=Math.max(U*1.6,Math.min(U*3.2,(floorR.y1-floorR.y0)*.4,(floorR.x1-floorR.x0)*.28));}
  parts.length=0;
}
function doResize(){
  const o={x:plate.x,y:plate.y,r:plate.r},had=W>0;
  cancelPtr();
  W=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);H=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();layout();buildDiner();bgB=null;if(world.wallOpen>0||world.mode!=='diner')buildBall();buildTable();
  if(had&&o.r>0)remap(o);
  log('resize',W+'x'+H);
}
window.addEventListener('resize',()=>{needResize=true;});
window.addEventListener('orientationchange',()=>{needResize=true;setTimeout(()=>{needResize=true;},300);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{needResize=true;});

// ================= ループ =================
const ERR=[];
let raf=0,last=performance.now(),running=true;
function update(dt){
  world.t+=dt;world.seqT+=dt;world.idleT+=dt;
  if(world.plateHop>0)world.plateHop=Math.max(0,world.plateHop-dt*2.5);
  if(ptr&&ptr.mode==='drag'&&ptr.snack&&ptr.snack.state==='drag')dragAttract(ptr.snack,ptr.x,ptr.y);
  if(world.mode==='ball')updateDance(dt);
  for(const a of animals){if(a.st==='dance'){a.mouthT=0;}updateAnimal(a,dt);if(a.st==='dance'){a.mouth+=((a.danceMouth||0)-a.mouth)*Math.min(1,dt*10);if(a.danceLook)a.look=a.danceLook;}}
  if(animals.some(a=>a.gone))animals=animals.filter(a=>!a.gone);
  updateSnacks(dt);updateStamps(dt);autonomy(dt);updateOrbs(dt);updateParts(dt);updateArrivals(dt);updateWorldSeq(dt);updateGuide(dt);musicTick();
}
function frame(now){
  raf=requestAnimationFrame(frame);
  if(needResize){needResize=false;try{doResize();}catch(err){ERR.push(String(err&&err.stack||err));}}
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,.05)*TS;
  try{update(dt);render();}catch(err){if(ERR.length<20)ERR.push(String(err&&err.stack||err));if(ERR.length===1)console.warn(err);}
}
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);cancelPtr();SFX.ink(false,0,0);if(AC)try{AC.suspend().catch(()=>{});}catch(_){}log('pause');}
function resume(){if(running)return;running=true;last=performance.now();needResize=true;if(AC)try{AC.resume().catch(()=>{});}catch(_){}if(AC)music.next=AC.currentTime+.15;raf=requestAnimationFrame(frame);log('resume');}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{if(!document.hidden)resume();});

// ================= 開始 =================
world={mode:'diner',t:0,seqT:0,idleT:0,cycle:0,meals:0,arrOrder:shuffleR(['rabbit','chick','cat']),arrIdx:0,pendingArrival:null,lastArrivalT:0,
  wallOpen:0,plateA:1,plateHop:0,firstTouch:false,audioHello:false,cloth:null,danceChanges:0,danceKinds:new Set(),dance:null,specialDone:false,special:null,finaleT:null,strokes:0,mega:null,newCloth:null,clothPos:null};
world.cloth=loadCloth();
doResize();needResize=false;
animals.push(makeAnimal('zebra',0));
if(world.cloth)animals[0].scarf=world.cloth[0].tag;
log('start','seed='+SEED+' order=zebra,'+world.arrOrder.join(','));
raf=requestAnimationFrame(frame);

// 検証用の読み取り口（ゲーム進行には使わない）
window.__mogu={get world(){return world;},get animals(){return animals;},get snacks(){return snacks;},get stamps(){return stamps;},get decos(){return decos;},
  get ptr(){return ptr;},get guide(){return guide;},plate,floor:floorR,get U(){return U;},log:LOG,errors:ERR,seed:SEED,specialP:SPECIAL_P,mouthPos,headPos,homes:()=>homes,
  get audio(){return AC?AC.state:'none';},get size(){return{W,H,DPR,portrait};}};
})();
</script>
