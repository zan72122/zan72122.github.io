(function(){
'use strict';
/* =========================================================
   ぽよん！ロボこいぬのひみつの大サーカス
   - 低解像度バッファに整数倍のドット描画
   - 共通の移動・衝突・反発・装備・キャラ判断で全ての発見が成立
   ========================================================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const sgn=v=>v<0?-1:1;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const G=300; // 重力 px/s^2

/* ---------------- 表示 ---------------- */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const buf=document.createElement('canvas');
const g=buf.getContext('2d');
let DPR=1,PS=4,BW=150,BH=300,roomL=0,RW=150,FY=200,CEIL=-190,TOPY=-100,K_CSS=0.4;
let OX=0,OY=0;
let WD=null; // world

function readSafe(){
  try{const s=getComputedStyle(document.getElementById('sa'));
    return {t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};
  }catch(e){return {t:0,r:0,b:0,l:0};}
}
function layout(){
  const cw=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);
  const ch=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
  DPR=Math.min(window.devicePixelRatio||1,2);
  const dw=Math.round(cw*DPR),dh=Math.round(ch*DPR);
  const land=cw>ch;
  const coreW=land?168:144,coreH=land?112:100;
  PS=Math.max(1,Math.floor(Math.min(dw/coreW,dh/coreH)));
  BW=Math.ceil(dw/PS);BH=Math.ceil(dh/PS);
  cv.width=dw;cv.height=dh;cv.style.width=cw+'px';cv.style.height=ch+'px';
  buf.width=BW;buf.height=BH;
  K_CSS=DPR/PS;
  const sf=readSafe();
  const sl=Math.ceil(sf.l*K_CSS),sr=Math.ceil(sf.r*K_CSS),sb=Math.ceil(sf.b*K_CSS),st=Math.ceil(sf.t*K_CSS);
  const oldRW=RW;
  const avail=Math.max(100,BW-sl-sr);
  const rw=Math.min(avail,212);
  roomL=Math.floor(sl+(avail-rw)/2);RW=rw;
  const fd=Math.max(8,sb+5);
  FY=Math.floor(BH-fd-Math.max(0,(BH-fd-st-114)*0.42));
  CEIL=-(FY-st-2);
  TOPY=Math.max(CEIL+4,-100);
  g.imageSmoothingEnabled=false;ctx.imageSmoothingEnabled=false;
  if(WD&&oldRW!==RW) rescaleWorld(RW/oldRW);
}

/* ---- ドット描画プリミティブ（ワールド座標） ---- */
let lastFill='';
function fs(c){if(c!==lastFill){g.fillStyle=c;lastFill=c;}}
function R(x,y,w,h,c){
  const x0=Math.round(x+OX),y0=Math.round(y+OY),x1=Math.round(x+w+OX),y1=Math.round(y+h+OY);
  if(x1>x0&&y1>y0){fs(c);g.fillRect(x0,y0,x1-x0,y1-y0);}
}
function E(cx_,cy_,rx,ry,c){
  if(rx<=0||ry<=0)return;fs(c);
  const X=cx_+OX,Y=cy_+OY;
  const y0=Math.floor(Y-ry),y1=Math.ceil(Y+ry);
  for(let yy=y0;yy<y1;yy++){
    const dy=(yy+0.5-Y)/ry;if(dy*dy>1)continue;
    const hw=rx*Math.sqrt(1-dy*dy);
    const a=Math.round(X-hw),b=Math.round(X+hw);
    if(b>a)g.fillRect(a,yy,b-a,1);
  }
}
const _xs=[];
function PG(pts,c){
  fs(c);const n=pts.length>>1;let mn=1e9,mx=-1e9;
  for(let i=0;i<n;i++){const y=pts[i*2+1];if(y<mn)mn=y;if(y>mx)mx=y;}
  const y0=Math.floor(mn+OY),y1=Math.ceil(mx+OY);
  for(let yy=y0;yy<y1;yy++){
    const sy=yy+0.5-OY;_xs.length=0;
    for(let i=0;i<n;i++){
      const j=(i+1)%n,xa=pts[i*2],ya=pts[i*2+1],xb=pts[j*2],yb=pts[j*2+1];
      if((ya<=sy&&yb>sy)||(yb<=sy&&ya>sy))_xs.push(xa+(sy-ya)/(yb-ya)*(xb-xa));
    }
    _xs.sort((a,b)=>a-b);
    for(let k=0;k+1<_xs.length;k+=2){
      const a=Math.round(_xs[k]+OX),b=Math.round(_xs[k+1]+OX);
      if(b>a)g.fillRect(a,yy,b-a,1);
    }
  }
}
function LN(x0,y0,x1,y1,c){
  fs(c);x0=Math.round(x0+OX);y0=Math.round(y0+OY);x1=Math.round(x1+OX);y1=Math.round(y1+OY);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;
  while(n++<400){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
}
function rotPts(cx_,cy_,hw,hh,a){
  const c=Math.cos(a),s=Math.sin(a);
  return [cx_+(-hw*c+hh*s),cy_+(-hw*s-hh*c), cx_+(hw*c+hh*s),cy_+(hw*s-hh*c),
          cx_+(hw*c-hh*s),cy_+(hw*s+hh*c), cx_+(-hw*c-hh*s),cy_+(-hw*s+hh*c)];
}
function mkSpr(rows,pal,outline){
  const h=rows.length;let w=0;for(const r of rows)w=Math.max(w,r.length);
  const o=outline?1:0,c=document.createElement('canvas');c.width=w+2*o;c.height=h+2*o;
  const x=c.getContext('2d');
  const on=(i,j)=>j>=0&&j<h&&i>=0&&i<rows[j].length&&rows[j][i]!=='.'&&rows[j][i]!==' ';
  if(outline){x.fillStyle=outline;for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(on(i,j))continue;
    if(on(i-1,j)||on(i+1,j)||on(i,j-1)||on(i,j+1))x.fillRect(i+o,j+o,1,1);}}
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i+o,j+o,1,1);}}
  return c;
}
function SP(img,x,y,flip){
  const X=Math.round(x+OX),Y=Math.round(y+OY);
  if(flip){g.save();g.translate(X+img.width,Y);g.scale(-1,1);g.drawImage(img,0,0);g.restore();}
  else g.drawImage(img,X,Y);
}
function SPR(img,cx_,cy_,ang,flip){
  g.save();g.translate(Math.round(cx_+OX),Math.round(cy_+OY));if(ang)g.rotate(ang);if(flip)g.scale(-1,1);
  g.drawImage(img,-Math.round(img.width/2),-Math.round(img.height/2));g.restore();
}

/* ---------------- 色 ---------------- */
const C={out:'#3b2533',cream:'#fff4e0',cream2:'#f1d9bd',white:'#ffffff',ear:'#ec9a5e',ear2:'#c97442',
  pink:'#ff9fb5',eye:'#24151f',metal:'#c6d4e2',metal2:'#7f95ad',metal3:'#4d5f78',blue:'#7fd0ff',
  red:'#ff5a5f',red2:'#c2303f',gold:'#ffcf4a',gold2:'#d6922b',wood:'#c98a52',wood2:'#a66a3a',wood3:'#7f4c2a'};
const OUT=C.out;
const SPRITES={};
function buildSprites(){
  const bun=[
  '.ww.....ww.','.wpw...wpw.','.wpw...wpw.','.wpw...wpw.','..ww...ww..','..wwwwwww..','.wwwwwwwww.',
  '.wkwwwwwkw.','.pwwwnwwwp.','..wwwwwww..','...rrrrr...','..wbbbbbw..','.wwbbbbbww.','.wwwbbbwww.','..ww...ww..'];

  SPRITES.berry=mkSpr(['..g.g..','.ggggg.','.rrrrr.','rhryrrr','rrrrryr','.ryrrr.','..rrr..'],
    {r:'#ff4d5e',y:'#ffe27a',g:'#4fbf5a',h:'#ffb0b8'},OUT);
  SPRITES.cake=mkSpr(['...g....g....','..rrr..rrr...','..rhr..rhr...','.wwwwwwwwwww.','wwwwwwwwwwwww',
    'yyyyyyyyyyyyy','wrwwwwrwwwwrw','yyyyyyyyyyyyy','.yyyyyyyyyyy.','ccccccccccccc'],
    {w:'#fff8ee',y:'#ffd98a',r:'#ff4d5e',h:'#ffb0b8',c:'#cfe8ff',g:'#4fbf5a'},OUT);
  SPRITES.hand=mkSpr(['...ww....','...ww....','...ww....','...wwww..','.w.wwwwww','.wwwwwwww',
    '.wwwwwwww','..wwwwww.','...wwwww.','...sssss.'],{w:'#ffffff',s:'#ffd9c2'},OUT);
  SPRITES.basket=mkSpr(['.bbbbbbbbb.','bdbdbdbdbdb','.bdbdbdbdb.','..bbbbbbb..'],{b:'#d39a5a',d:'#9a6232'},OUT);
  SPRITES.heart=mkSpr(['.r.r.','rrrrr','rrrrr','.rrr.','..r..'],{r:'#ff6f91'},null);
  SPRITES.note=mkSpr(['..rr','..r.','..r.','rrr.','rr..'],{r:'#ffffff'},null);
}

/* ---------------- 音（Web Audio 合成） ---------------- */
const AU={c:null,m:null,nb:null,ok:false,voices:0,propG:null,propF:null,mt:0,mi:0,music:0};
function audioUnlock(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const c=new AC();AU.c=c;
      const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
      const m=c.createGain();m.gain.value=0.62;m.connect(comp);comp.connect(c.destination);AU.m=m;
      const len=c.sampleRate|0,nb=c.createBuffer(1,len,c.sampleRate),d=nb.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=nb;
      const src=c.createBufferSource();src.buffer=nb;src.loop=true;
      const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=1.4;
      const pg=c.createGain();pg.gain.value=0;src.connect(bp);bp.connect(pg);pg.connect(m);src.start();
      AU.propG=pg;AU.propF=bp;AU.ok=true;
      // iOS の無音解除用
      const o=c.createOscillator(),gg=c.createGain();gg.gain.value=0.0001;o.connect(gg);gg.connect(m);o.start();o.stop(c.currentTime+0.05);
    }
    if(AU.c.state!=='running'&&AU.c.resume)AU.c.resume();
  }catch(e){AU.ok=false;}
}
function live(){return AU.ok&&AU.c&&AU.c.state==='running';}
function aout(node,pan){
  if(pan&&AU.c.createStereoPanner){const p=AU.c.createStereoPanner();p.pan.value=clamp(pan,-0.9,0.9);node.connect(p);p.connect(AU.m);}
  else node.connect(AU.m);
}
function tone(type,f0,f1,dur,vol,o){
  if(!live()||AU.voices>34)return;o=o||{};
  try{
    const c=AU.c,t=c.currentTime+(o.d||0),os=c.createOscillator(),gn=c.createGain();
    os.type=type;os.frequency.setValueAtTime(Math.max(20,f0),t);
    if(f1&&f1!==f0)os.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur*(o.gl||1));
    const a=o.a||0.004;gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+a);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);os.connect(gn);aout(gn,o.p);
    os.start(t);os.stop(t+dur+0.03);AU.voices++;os.onended=()=>{AU.voices--;};
  }catch(e){}
}
function nz(dur,vol,ft,fq,o){
  if(!live()||AU.voices>34)return;o=o||{};
  try{
    const c=AU.c,t=c.currentTime+(o.d||0),s=c.createBufferSource();s.buffer=AU.nb;
    const f=c.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(fq,t);f.Q.value=o.q||1;
    if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
    const gn=c.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+(o.a||0.003));
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(gn);aout(gn,o.p);
    s.start(t,Math.random()*0.5,dur+0.05);AU.voices++;s.onended=()=>{AU.voices--;};
  }catch(e){}
}
const panX=x=>clamp((x/RW)*1.6-0.8,-0.8,0.8);
const SFX={
  poyon(pm,x,big){pm=pm||1;const p=panX(x||RW/2);
    tone('sine',190*pm,95*pm,0.07,0.28,{p});
    tone('sine',260*pm,(big?820:620)*pm,big?0.26:0.18,0.26,{d:0.05,p,gl:0.7});
    tone('triangle',520*pm,1240*pm,0.12,0.07,{d:0.06,p});},
  boing(pm,x){pm=pm||1;const p=panX(x);tone('triangle',110*pm,360*pm,0.34,0.3,{p,gl:0.6});tone('sine',70*pm,150*pm,0.3,0.25,{p});
    tone('sine',300*pm,500*pm,0.2,0.06,{d:0.12,p});},
  fluff(x){nz(0.12,0.12,'lowpass',700,{p:panX(x)});tone('sine',200,150,0.1,0.06,{p:panX(x)});},
  pof(x,v){nz(0.07,0.06+0.06*(v||0),'lowpass',500,{p:panX(x)});},
  clack(x,v){const p=panX(x);v=clamp(v||0.5,0.2,1);tone('square',820+Math.random()*200,560,0.045,0.08*v,{p});nz(0.05,0.12*v,'bandpass',1800,{p,q:2});},
  click(x){tone('square',1300,1300,0.03,0.07,{p:panX(x)});tone('sine',1900,2400,0.07,0.1,{d:0.03,p:panX(x)});},
  unclick(x){tone('square',900,600,0.05,0.06,{p:panX(x)});},
  jingle(x,v){const p=panX(x);v=clamp(v||1,0.3,1.2);for(let i=0;i<4;i++){const f=2400+Math.random()*1200;
    tone('sine',f,f*0.99,0.32,0.07*v,{d:i*0.045,p});tone('triangle',f*1.5,f*1.5,0.18,0.025*v,{d:i*0.045+0.01,p});}},
  eat(){for(let i=0;i<3;i++){tone('square',430,300,0.07,0.06,{d:i*0.16});nz(0.05,0.05,'bandpass',1200,{d:i*0.16+0.02});}},
  bark(x,pm){pm=pm||1;const p=panX(x);tone('square',640*pm,380*pm,0.1,0.09,{p});tone('sine',980*pm,520*pm,0.12,0.09,{p});},
  whine(x){tone('sine',760,520,0.45,0.05,{p:panX(x),a:0.05});},
  tick(x,v){tone('square',1500+Math.random()*300,1200,0.012,0.03+0.03*v,{p:panX(x)});},
  whoosh(x){nz(0.35,0.08,'bandpass',600,{p:panX(x),f1:1600,q:0.8,a:0.06});},
  squeak(x,pm){tone('sine',1100*pm,1700*pm,0.12,0.09,{p:panX(x)});},
  learn(i){const base=[523,659,784][i%3];tone('triangle',base,base,0.12,0.12);tone('triangle',base*1.25,base*1.25,0.12,0.12,{d:0.1});
    tone('triangle',base*1.5,base*1.5,0.22,0.12,{d:0.2});tone('sine',base*2,base*2,0.3,0.05,{d:0.2});},
  sparkle(){for(let i=0;i<3;i++)tone('sine',1800+i*500,2600+i*500,0.12,0.04,{d:i*0.06});},
  rattle(){for(let i=0;i<8;i++){tone('square',220+Math.random()*80,180,0.04,0.06,{d:i*0.09});nz(0.04,0.08,'bandpass',900,{d:i*0.09});}},
  door(){tone('triangle',300,700,0.18,0.16);tone('triangle',450,1050,0.2,0.12,{d:0.08});nz(0.1,0.1,'highpass',3000,{d:0.02});},
  fanfare(big){const n=big?[523,659,784,1047,784,1047,1319]:[523,659,784,1047];
    n.forEach((f,i)=>{tone('square',f,f,0.16,0.07,{d:i*0.13});tone('triangle',f/2,f/2,0.2,0.08,{d:i*0.13});});
    const e=n.length*0.13;[523,659,784].forEach(f=>tone('triangle',f,f,0.9,0.07,{d:e,a:0.02}));},
  clapHi(x,n,d){const p=panX(x);for(let i=0;i<n;i++)nz(0.035,0.14,'highpass',2600,{d:(d||0)+i*0.13,p});},
  clapLo(x,n,d){const p=panX(x);for(let i=0;i<n;i++){nz(0.06,0.16,'lowpass',900,{d:(d||0)+i*0.17,p});tone('sine',140,90,0.07,0.08,{d:(d||0)+i*0.17,p});}},
  yay(x,pm){const p=panX(x);tone('sine',900*pm,1400*pm,0.18,0.06,{p});tone('sine',1400*pm,1100*pm,0.15,0.05,{d:0.15,p});},
  drumroll(){for(let i=0;i<22;i++)nz(0.05,0.05+i*0.004,'lowpass',500,{d:i*0.05});},
  pop(x){tone('sine',600,1200,0.08,0.1,{p:panX(x)});}
};
function updPropSound(level){
  if(!live()||!AU.propG)return;
  try{const t=AU.c.currentTime;AU.propG.gain.setTargetAtTime(clamp(level,0,1)*0.09,t,0.05);
    AU.propF.frequency.setTargetAtTime(300+level*900,t,0.05);}catch(e){}
}
const WALTZ=[76,79,84,83,79,76,74,77,81,79,77,74,72,76,79,77,74,71,72,76,79,84,-1,-1];
const BASS=[48,43,41,43,48,43,48,48];
function music(){
  if(!live()||!AU.music)return;
  const c=AU.c,beat=0.4;
  if(AU.mt<c.currentTime)AU.mt=c.currentTime+0.05;
  while(AU.mt<c.currentTime+0.3){
    const i=AU.mi%WALTZ.length,bar=Math.floor(AU.mi/3)%BASS.length,b=AU.mi%3;
    const d=AU.mt-c.currentTime,v=AU.music;
    const m=WALTZ[i];if(m>0){const f=440*Math.pow(2,(m-69)/12);tone('triangle',f,f,beat*0.9,0.03*v,{d,a:0.01});}
    const r=440*Math.pow(2,(BASS[bar]-69)/12);
    if(b===0)tone('sine',r,r,beat*0.9,0.05*v,{d});
    else{tone('sine',r*2.52,r*2.52,beat*0.5,0.015*v,{d});tone('sine',r*2.997,r*2.997,beat*0.5,0.012*v,{d});}
    AU.mt+=beat;AU.mi++;
  }
}

/* ---------------- パーティクル ---------------- */
const PT=[];const PMAX=230;
function addP(x,y,vx,vy,life,col,kind,size){
  if(PT.length>=PMAX)return;PT.push({x,y,vx,vy,life,max:life,col,kind:kind||'dot',size:size||1,a:Math.random()*TAU});
}
function burst(x,y,n,cols,spd,kind,life){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(0.4+Math.random()*0.8);
    addP(x,y,Math.cos(a)*s,Math.sin(a)*s-spd*0.3,(life||0.6)*(0.6+Math.random()*0.7),pick(cols),kind||'dot',Math.random()<0.3?2:1);}
}
function stepParticles(dt){
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue;}
    if(p.kind==='dot'||p.kind==='crumb'){p.vy+=G*0.6*dt;}
    else if(p.kind==='confetti'){p.vy+=60*dt;p.vy=Math.min(p.vy,26);p.vx+=Math.sin(p.a+=dt*6)*30*dt+WD.wind*0.5*dt;}
    else if(p.kind==='heart'||p.kind==='note'){p.vy=-14;p.vx=Math.sin(p.a+=dt*4)*6;}
    else if(p.kind==='wind'){p.vx*=Math.exp(-1.5*dt);p.vy*=Math.exp(-1.5*dt);}
    else {p.vx*=Math.exp(-2*dt);p.vy*=Math.exp(-2*dt);}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if((p.kind==='dot'||p.kind==='crumb')&&p.y>0){p.y=0;p.vy*=-0.3;p.vx*=0.6;}
  }
}
function drawParticles(){
  for(const p of PT){const f=p.life/p.max;
    if(p.kind==='spark'||p.kind==='star'){const s=f>0.5?1:0;R(p.x-0.5,p.y-0.5,1,1,p.col);
      if(s||p.kind==='star'){R(p.x-1.5,p.y-0.5,1,1,p.col);R(p.x+0.5,p.y-0.5,1,1,p.col);R(p.x-0.5,p.y-1.5,1,1,p.col);R(p.x-0.5,p.y+0.5,1,1,p.col);}}
    else if(p.kind==='heart')SP(SPRITES.heart,p.x-2,p.y-2);
    else if(p.kind==='note')SP(SPRITES.note,p.x-2,p.y-2);
    else if(p.kind==='wind'){const l=Math.max(1,Math.round(Math.abs(p.vx)/14));R(p.x-l/2,p.y,l,1,p.col);}
    else if(p.kind==='confetti'){const w=Math.abs(Math.cos(p.a))>0.4?2:1;R(p.x,p.y,w,1+(w===1?1:0),p.col);}
    else R(p.x-p.size/2,p.y-p.size/2,p.size,p.size,p.col);
  }
}

function rescaleWorld(k){
  const fx=o=>{o.x*=k;};
  WD.cubes.forEach(fx);WD.cushions.forEach(fx);fx(WD.bell);fx(pup);
  for(const t of Object.values(WD.tools))fx(t);
  for(const p of WD.plank.p){p.x*=k;p.ox*=k;}
  WD.aud.forEach(a=>{a.x*=k;a.tx*=k;a.home*=k;});
  WD.cake.x=RW-10;if(WD.gatherX!=null)WD.gatherX*=k;
}

/* ---------------- 面（着地できる上面） ---------------- */
const SURF=[];
function buildSurfaces(){
  SURF.length=0;
  SURF.push({x0:-9999,x1:9999,y:0,k:'floor',ref:null});
  const a=shelfA(),b=shelfB(),c=chestR();
  SURF.push({x0:a.x0,x1:a.x1,y:a.y,k:'shelfA',ref:null});
  SURF.push({x0:b.x0,x1:b.x1,y:b.y,k:'shelfB',ref:null});
  SURF.push({x0:c.x0,x1:c.x1,y:c.y,k:'chest',ref:null});
  for(const q of WD.cubes)if(q.held==null)SURF.push({x0:q.x-q.hw,x1:q.x+q.hw,y:q.y-q.h,k:'cube',ref:q});
  for(const q of WD.cushions)if(q.held==null)SURF.push({x0:q.x-q.hw,x1:q.x+q.hw,y:q.y-q.h,k:'cushion',ref:q});
}
function plankLR(){const p=WD.plank.p;return p[0].x<=p[1].x?[p[0],p[1]]:[p[1],p[0]];}
function plankTopAt(x){
  const pl=WD.plank;if((pl.held!=null&&pl.mode==='mid')||pl.carry)return null;
  const [l,r]=plankLR();if(r.x-l.x<5||x<l.x-0.5||x>r.x+0.5)return null;
  const t=clamp((x-l.x)/(r.x-l.x),0,1);return l.y+(r.y-l.y)*t-2.5;
}
function plankSlope(){const [l,r]=plankLR();return r.x-l.x<5?0:(r.y-l.y)/(r.x-l.x);}
function findSupport(b,yTop,yBot,narrow){
  const cx=b.x,hw=b.hw*(narrow||0.55);let best=null,by=1e9;
  for(const s of SURF){if(s.ref===b)continue;if(cx+hw<s.x0||cx-hw>s.x1)continue;
    if(s.y<yTop||s.y>yBot)continue;if(s.y<by){by=s.y;best=s;}}
  if(b!==WD.plank&&b.kind!=='cube'&&b.kind!=='cushion'){const py=plankTopAt(cx);if(py!=null&&py>=yTop&&py<=yBot&&py<by){by=py;best={k:'plank',y:py,ref:WD.plank,x0:0,x1:0};}}
  return best;
}
function wallsAndChest(b,rest){
  rest=rest||0.3;
  if(b.x-b.hw<0){b.x=b.hw;if(b.vx<0)b.vx=-b.vx*rest;}
  if(b.x+b.hw>RW){b.x=RW-b.hw;if(b.vx>0)b.vx=-b.vx*rest;}
  const c=chestR();
  if(b.y>c.y+1.5&&b.x+b.hw>c.x0&&b.x<c.x0+6){b.x=c.x0-b.hw;if(b.vx>0)b.vx=-b.vx*rest;}
}

/* ---------------- 汎用物体の運動 ---------------- */
function stepBody(b,dt,o){
  if(b.held!=null||b.magnet)return;
  const gs=o.gs==null?1:o.gs;
  b.vy+=G*gs*dt;if(o.term&&b.vy>o.term)b.vy=o.term;
  b.x+=b.vx*dt;wallsAndChest(b,o.wrest);
  const ny=b.y+b.vy*dt;
  const wasG=b.ground;
  if(b.vy>=0){
    const s=findSupport(b,b.y-1.6,ny+0.01);
    if(s){
      const imp=b.vy;b.y=s.y;
      if(!wasG&&imp>o.bmin){b.vy=-imp*o.bounce;b.ground=null;if(o.onBounce)o.onBounce(b,imp,s);}
      else{b.vy=0;if(!wasG&&o.onLand)o.onLand(b,imp,s);b.ground=s;}
      if(b.ground){
        if(s.ref&&s.ref.vx!=null&&s.ref!==b)b.vx+=(s.ref.vx-b.vx)*Math.min(1,dt*8);
        b.vx*=Math.exp(-o.fric*dt);
      }
    }else{b.y=ny;if(wasG&&o.onLeave)o.onLeave(b,wasG);b.ground=null;}
  }else{b.y=ny;b.ground=null;}
  if(b.y-b.h<TOPY-6){b.y=TOPY-6+b.h;if(b.vy<0)b.vy=0;}
}
const CUBE_O={gs:1,fric:7,bounce:0.25,bmin:70,wrest:0.3,
  onLand(b,imp){if(imp>45){SFX.clack(b.x,imp/150);burst(b.x,b.y,3,['#fff1c9','#e6c59a'],20,'dot',0.3);}
    if(b.rotV){b.rotV=0;}},
  onBounce(b,imp){SFX.clack(b.x,imp/150);b.rotV*=0.5;},
  onLeave(b,sup){if(sup&&sup.ref&&sup.ref.vx!=null&&Math.abs(sup.ref.vx-b.vx)>8&&!b.rotV)b.rotV=sgn(sup.ref.vx-b.vx)*-rnd(4,7);
    else if(!b.rotV&&Math.abs(b.vx)>20)b.rotV=sgn(b.vx)*rnd(3,6);}};
const CUSH_O={gs:1,fric:9,bounce:0.2,bmin:90,wrest:0.2,onLand(b,imp){if(imp>40){b.sq=Math.min(1,imp/160);SFX.fluff(b.x);}}};
const BELL_O={gs:1,fric:1.2,bounce:0.35,bmin:50,wrest:0.6,onLand(b,imp){if(imp>40)ring(b,imp/160,'drop');},onBounce(b,imp){ring(b,imp/160,'drop');}};
function boxes(){return BX;}
const BX=[];
function pairResolve(){
  BX.length=0;for(const c of WD.cubes)BX.push(c);for(const c of WD.cushions)BX.push(c);BX.push(WD.bell);
  for(let i=0;i<BX.length;i++)for(let j=i+1;j<BX.length;j++){
    const a=BX[i],b=BX[j];if(a.magnet||b.magnet)continue;
    const ox=(a.hw+b.hw)-Math.abs(a.x-b.x);if(ox<=0)continue;
    const oy=Math.min(a.y,b.y)-Math.max(a.y-a.h,b.y-b.h);if(oy<=2.5)continue;
    if(oy<ox&&oy<5){ // ほぼ上下に重なった → 上のものを持ち上げる
      const up=a.y<b.y?a:b,lo=up===a?b:a;if(up.held!=null)continue;up.y=lo.y-lo.h;if(up.vy>0)up.vy=0;continue;}
    const d=a.x<b.x?-1:1;
    const ha=a.held!=null,hb=b.held!=null;if(ha&&hb)continue;
    let wa=ha?0:b.m/(a.m+b.m),wb=hb?0:a.m/(a.m+b.m);if(ha)wb=1;if(hb)wa=1;
    a.x+=d*ox*wa;b.x-=d*ox*wb;
    const rel=(a.vx-b.vx)*-d;
    if(rel>0){const imp=rel*(1.2);
      if(!ha)a.vx+=d*imp*wa;if(!hb)b.vx-=d*imp*wb;
      if(rel>25){if(a.kind==='bell'||b.kind==='bell')ring(a.kind==='bell'?a:b,rel/90,'hit');else if(a.kind==='cube'||b.kind==='cube')SFX.clack((a.x+b.x)/2,rel/120);}
    }
    wallsAndChest(a);wallsAndChest(b);
  }
}

/* ---------------- 長い積み木（2点の棒） ---------------- */
function stepPlank(dt){
  const pl=WD.plank,P=pl.p;
  const moving=Math.abs(P[0].x-P[0].ox)+Math.abs(P[0].y-P[0].oy)+Math.abs(P[1].x-P[1].ox)+Math.abs(P[1].y-P[1].oy);
  for(let i=0;i<2;i++){const p=P[i];
    if(pl.held!=null&&(pl.mode==='mid'||pl.pinI===i)){const tx=pl.mode==='mid'?pl.pinX+(i?pl.L/2:-pl.L/2):pl.pinX,ty=pl.pinY;
      p.ox=p.x;p.oy=p.y;p.x=lerp(p.x,tx,Math.min(1,dt*28));p.y=lerp(p.y,ty,Math.min(1,dt*28));continue;}
    if(pl.pinI===i&&pl.held==null&&pl.carry){p.ox=p.x;p.oy=p.y;p.x=pl.pinX;p.y=pl.pinY;continue;}
    let vx=clamp((p.x-p.ox)*0.995,-2.5,2.5),vy=clamp((p.y-p.oy)*0.995,-2.5,3);p.ox=p.x;p.oy=p.y;p.x+=vx;p.y+=vy+G*dt*dt;
  }
  const fixed=i=>(pl.held!=null&&(pl.mode==='mid'||pl.pinI===i))||(pl.carry&&pl.pinI===i);
  for(let it=0;it<5;it++){
    // 長さ拘束
    const a=P[0],b=P[1];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.001,df=(d-pl.L)/d;
    const fa=fixed(0),fb=fixed(1);
    if(!(fa&&fb)){const wa=fa?0:(fb?1:0.5),wb=fb?0:(fa?1:0.5);a.x+=dx*df*wa;a.y+=dy*df*wa;b.x-=dx*df*wb;b.y-=dy*df*wb;}
    for(let i=0;i<2;i++){if(fixed(i))continue;const p=P[i];p.c=0;
      // 床
      if(p.y>-2){p.y=-2;p.c=1;}
      // 壁
      if(p.x<1){p.x=1;}if(p.x>RW-1)p.x=RW-1;
      // 箱類（上面に乗る／側面から押し出し）
      const cr=chestR();
      collidePtBox(p,cr.x0,cr.y,cr.x1,0);
      const sa=shelfA(),sb=shelfB();
      if(p.x>=sa.x0&&p.x<=sa.x1&&p.y>sa.y-2&&p.oy<=sa.y-2+0.6){p.y=sa.y-2;p.c=1;}
      if(p.x>=sb.x0&&p.x<=sb.x1&&p.y>sb.y-2&&p.oy<=sb.y-2+0.6){p.y=sb.y-2;p.c=1;}
      for(const q of WD.cubes)if(q.held==null)collidePtBox(p,q.x-q.hw,q.y-q.h,q.x+q.hw,q.y);
      for(const q of WD.cushions)if(q.held==null)collidePtBox(p,q.x-q.hw,q.y-q.h,q.x+q.hw,q.y);
    }
    // 箱の角が棒を下から支える
    if(!(pl.held!=null&&pl.mode==='mid'))cornerSupport();
  }
  for(let i=0;i<2;i++){const p=P[i];if(p.c&&!fixed(i)){p.ox=lerp(p.ox,p.x,0.6);if(p.oy>p.y)p.oy=p.y;}}
  // 着地音
  const sp=Math.abs(P[0].y-P[0].oy)+Math.abs(P[1].y-P[1].oy);
  if(pl.lastSp>1.2&&sp<0.3&&pl.held==null){SFX.clack((P[0].x+P[1].x)/2,0.7);burst((P[0].x+P[1].x)/2,-2,4,['#fff1c9'],16,'dot',0.3);}
  pl.lastSp=sp;pl.moving=moving;
}
function collidePtBox(p,x0,y0,x1,y1){
  if(p.x<=x0||p.x>=x1||p.y<=y0-2||p.y>=y1)return;
  // 上から来たなら上面へ
  if(p.oy<=y0-2+1.2){p.y=y0-2;p.c=1;return;}
  const dl=p.x-x0,dr=x1-p.x,dt_=p.y-(y0-2);
  const m=Math.min(dl,dr,dt_);
  if(m===dt_){p.y=y0-2;p.c=1;}else if(m===dl)p.x=x0;else p.x=x1;
}
function cornerSupport(){
  const pl=WD.plank,[l,r]=plankLR();if(r.x-l.x<4)return;
  const test=(cx_,cy_)=>{
    if(cx_<=l.x+0.8||cx_>=r.x-0.8)return;
    const t=(cx_-l.x)/(r.x-l.x),sy=l.y+(r.y-l.y)*t+2; // 棒の下面
    const pen=sy-cy_;
    if(pen>0&&pen<6){
      const wl=1-t,wr=t,den=wl*wl+wr*wr;const fl=pl.carry&&pl.p[pl.pinI]===l,fr=pl.carry&&pl.p[pl.pinI]===r;
      const hl=(pl.held!=null&&pl.p[pl.pinI]===l)||fl,hr=(pl.held!=null&&pl.p[pl.pinI]===r)||fr;
      if(!hl){l.y-=Math.min(1.5,pen*wl/den*(hr?1.6:1));l.oy=Math.max(l.oy,l.y);}if(!hr){r.y-=Math.min(1.5,pen*wr/den*(hl?1.6:1));r.oy=Math.max(r.oy,r.y);}l.c=1;r.c=1;
    }
  };
  const cr=chestR();test(cr.x0+0.5,cr.y);
  for(const q of WD.cubes)if(q.held==null){test(q.x-q.hw+0.5,q.y-q.h);test(q.x+q.hw-0.5,q.y-q.h);}
  for(const q of WD.cushions)if(q.held==null){test(q.x-q.hw+2,q.y-q.h);test(q.x+q.hw-2,q.y-q.h);}
}
function findRamp(){
  const pl=WD.plank;if(pl.held!=null||pl.carry)return null;
  const P=pl.p,lo=P[0].y>P[1].y?P[0]:P[1],hi=lo===P[0]?P[1]:P[0];
  if(lo.y<-14||hi.y>lo.y-6)return null;if(Math.abs(hi.x-lo.x)<12)return null;
  if(pl.moving>0.6)return null;
  return {lo,hi,dir:sgn(hi.x-lo.x),h:-hi.y};
}

/* ---------------- 鈴と観客 ---------------- */
function ring(b,v,src){
  if(v<0.12)return;b.ring=Math.max(b.ring,0.6);
  const now=TIME;if(now-b.lastRing<0.25)return;b.lastRing=now;
  SFX.jingle(b.x,v);burst(b.x,b.y-6,3+((v*4)|0),['#ffe27a','#ffffff'],24,'spark',0.5);
  if(v>0.25)callAudience(b.x,src);
  if(src==='push'&&pup.tools.wheel)disc(6,'a','車輪で鈴を押した');
}
function callAudience(x,src){
  const gx=clamp(x,16,RW-16);
  const first=!WD.audCalled;
  if(!first&&WD.gatherX!=null&&Math.abs(WD.gatherX-gx)<10)return;
  if(!first&&WD.gatherX!=null){disc(6,'b','鈴を移動して鳴らし観客が移動');}
  WD.audCalled=true;WD.gatherX=gx;
  const order=WD.aud.slice().sort((a,b)=>a.order-b.order);
  order.forEach((a,i)=>{
    const side=i===0?-1:1;
    a.tx=clamp(gx+side*13,8,RW-8);
    a.state='walk';a.delay=first?0.5+i*1.3:0.15+i*0.3;a.face=sgn(a.tx-a.x);
  });
  log('観客を呼んだ x='+gx.toFixed(0));
}
function audWatching(){return WD.aud.filter(a=>a.state==='watch'||a.state==='react');}
function stepAudience(dt){
  for(const a of WD.aud){
    a.blink-=dt;if(a.blink<-0.12)a.blink=rnd(1.5,4.5);
    a.hopV+=G*0.8*dt;a.hop+=a.hopV*dt;if(a.hop>0){a.hop=0;a.hopV=0;}
    if(a.roll>0){a.roll-=dt;}
    if(a.clap>0){a.clap-=dt;}
    a.react=Math.max(0,a.react-dt);
    if(a.state==='walk'){
      if(a.delay>0){a.delay-=dt;if(a.delay<=0){SFX.squeak(a.x,a.kind==='bunny'?1.3:0.8);burst(a.x,-14,3,['#ffffff'],10,'spark',0.4);}continue;}
      const d=a.tx-a.x;a.face=sgn(d);
      const sp=a.kind==='bunny'?22:15;
      if(a.kind==='bunny'&&a.hop===0)a.hopV=-55;
      a.x+=sgn(d)*Math.min(Math.abs(d),sp*dt);
      if(Math.abs(d)<0.6){a.state='watch';a.face=sgn(pup.x-a.x);if(a.kind==='bunny')a.hopV=-70;else a.clap=0.5;
        if(a.kind==='bunny')SFX.clapHi(a.x,2);else SFX.clapLo(a.x,2);}
    }else if(a.state==='watch'){a.face=sgn(pup.x-a.x);}

}
function audienceReact(tr){

function stepPup(dt){
  const p=pup,T=p.tools,hS=!!T.spring,hW=!!T.wheel,hP=!!T.prop;
  p.foot=hS?7:(hW?6:3);p.h=13+p.foot;
  const prevY=p.y,prevVy=p.vy;
  if(p.calmT>0)p.calmT-=dt;
  if(p.dashT>0){p.dashT-=dt;if(p.dashT<=0&&p.mode!=='circus'){p.motor=0;p.mspeed=60;}}
  if(hP){
    if(p.ground&&p.E<0.45)p.E=Math.max(0,p.E-dt*1.6);else p.E=Math.max(0,p.E-dt*0.5);
    T.prop.spin=Math.max(T.prop.spin*Math.exp(-dt*0.6),p.E,p.ground?0:0.35);
    if(p.calmT>0)p.E=Math.min(p.E,0.3);
    if(p.ground&&p.E>0.45){p.ground=null;p.vy=Math.min(p.vy,-18);}
  }else p.E=0;
  if(p.ground){
    let tv=0,acc=0;
    if(p.busy>0){}
    else if(hW&&p.motor){tv=p.motor*p.mspeed;acc=130;}
    else if(p.walk){tv=p.walk*14;acc=90;}
    if(acc){p.vx+=clamp(tv-p.vx,-acc*dt,acc*dt);}
    else p.vx*=Math.exp(-(hW?(p.brake?7:0.9):12)*dt);
    if(p.ground.k==='plank'&&hW){const m=plankSlope();p.vx+=G*m/(1+m*m)*dt;}
  }else{
    // 空中
    let gs=1;
    if(hP){
      if(p.E>0.45){if(p.vy<-30)gs=0.35;else{gs=0;p.vy=lerp(p.vy,-30*clamp((p.E-0.45)/0.15,0.2,1),1-Math.exp(-3*dt));}}
      else{if(p.vy>16){gs=0;p.vy=lerp(p.vy,16,1-Math.exp(-4*dt));}else gs=0.6;}
      p.vx=lerp(p.vx,WD.wind+p.steer*14,1-Math.exp(-0.5*dt));
    }else p.vx+=p.steer*22*dt*p.airCtl;
    if(p.y-p.h<TOPY+8&&p.vy<0&&hP&&p.E>0.45){p.vy*=0.9;}
    p.vy+=G*gs*dt;
  }
  p.x+=p.vx*dt;
  wallsAndChestPup();
  pushThings(dt);
  if(p.ground){
    const s=findSupport(p,p.y-5,p.y+3,0.5);
    if(s){p.y=s.y;p.ground=s;if(s.k==='plank'){p.lastPlankT=TIME;if(hW&&p.vx*plankSlope()<-8&&Math.abs(p.vx)>25)disc(2,'b','車輪で長い積み木の坂を駆け上がった');}}
    else{
      const prev=p.ground;p.ground=null;
      if(prev.k==='plank'){const m=plankSlope();p.vy=p.vx*m;if(p.vy<-8){p.rampFlag=true;p.rampT=TIME;log('坂からジャンプ v='+Math.abs(p.vx).toFixed(0));}}
      else p.vy=0;
    }
  }else{
    p.y+=p.vy*dt;
    if(p.y-p.h<TOPY){p.y=TOPY+p.h;if(p.vy<0)p.vy*=-0.1;}
    if(p.vy>=0){const s=findSupport(p,prevY-1.5,p.y+0.01,0.5);if(s)landPup(s);}
  }
  // 記録用
  if(!p.ground)p.airT+=dt;
  if(hW&&Math.abs(p.vx)>38&&(p.ground||p.motor)){p.runT+=dt;if(p.runT>(p.ground?0.3:0.6))learn('run');}
  if(!p.ground&&hP&&(p.E>0.45||p.vy<=17)&&p.airT>0.15){p.floatT+=dt;if(p.floatT>0.45)learn('float');}
  if(!p.ground&&hS&&p.kicked&&p.airT>0.25)learn('jump');
  // 宙を舞う風
  if(hP&&T.prop.spin>0.3&&Math.random()<T.prop.spin*0.5){const s=socketPos('prop');addP(s.x+rnd(-6,6),s.y+3,rnd(-10,10)+p.vx*0.2,rnd(15,35),0.5,'#e8f7ff','wind');}
  updPropSound(hP?T.prop.spin*(p.ground?0.4:1):0);
  // 車輪の音と回転
  if(hW){p.wheelA+=p.vx*dt/6;p.tickA+=Math.abs(p.vx)*dt;if(p.tickA>7){p.tickA=0;if(p.ground)SFX.tick(p.x,Math.min(1,Math.abs(p.vx)/70));}
    if(p.ground&&Math.abs(p.vx)>45&&Math.random()<0.3)addP(p.x-sgn(p.vx)*6,p.y-1,-p.vx*0.2,-rnd(5,15),0.4,'#e9d8bd','dust');}
  // 耳としっぽ（遅れた揺れ）
  const ay=(p.vy-prevVy)/dt;
  p.earV+=(-(p.earA-p.earT)*90-p.earV*7)*dt+clamp(ay,-3000,3000)*0.0009*dt*60;
  p.earA+=p.earV*dt;p.earA=clamp(p.earA,-0.5,3.2);
  p.sqV+=(-p.sq*260-p.sqV*13)*dt;p.sq+=p.sqV*dt;
  p.sprC+=((p.ground?0:-0.15)-p.sprC)*Math.min(1,dt*14);
  p.tail+=dt*p.wag;
  p.legT+=Math.abs(p.vx)*dt*0.5;
}
function wallsAndChestPup(){
  const p=pup;
  if(p.x<p.hw){p.x=p.hw;if(p.vx<0)p.vx=-p.vx*0.3;if(p.motor<0&&p.mode==='free')p.motor=0;}
  if(p.x>RW-p.hw){p.x=RW-p.hw;if(p.vx>0)p.vx=-p.vx*0.3;if(p.motor>0&&p.mode==='free')p.motor=0;}
  const c=chestR();
  if(p.y>c.y+1.5&&p.x+p.hw>c.x0&&p.x<c.x0+8){
    if(p.ground&&p.y-c.y<=5){/* 段差は乗り越え */}else{p.x=c.x0-p.hw;if(p.vx>0){if(p.vx>45){SFX.clack(c.x0,0.6);p.sq=0.5;}p.vx=-p.vx*0.25;}}
  }
}
function landPup(s){
  const p=pup,T=p.tools,hS=!!T.spring,imp=p.vy;
  p.y=s.y;let out=0;

      SFX.boing(1+p.cbounce*0.04,p.x);burst(p.x,p.y,8,[s.ref.col3,'#ffffff',C.gold],40,'spark',0.6);
      p.perfCush=(p.perfCush||0)+1;log('クッションでばね反発 v='+out.toFixed(0));
      disc(1,'a','ばねでクッションに着地し大きく弾んだ');
      if(T.prop)disc(4,'b','滑空からクッションでばね再跳躍');
    }else{out=imp>45?imp*0.3:0;SFX.fluff(p.x);}
  }else{
    p.cbounce=0;
    if(hS){
      if(p.hopWant){out=110;if(p.ai==='hops'){p.aiN--;if(p.aiN<=0)p.hopWant=false;}}else out=imp>85?imp*0.4:0;
      SFX.poyon(0.85+Math.min(imp,200)/400,p.x,false);
      burst(p.x-p.face*6,p.y,3,['#ffffff','#ffe27a'],18,'dot',0.3);
    }else{if(imp>40)SFX.pof(p.x,imp/150);}

  if(imp>60)p.earV-=imp*0.04;
  if(p.calmT>0&&!p.hopWant)out=Math.min(out,s.k==='cushion'?30:0);
  if(out>25){p.vy=-out;p.ground=null;if(hS)p.kicked=true;if(p.hopWant&&!T.wheel)p.vx=p.hopVx;}
  else{p.vy=0;p.ground=s;if(p.airT>0.35)onLanding(s,imp);p.airT=0;p.floatT=0;p.kicked=false;p.rampFlag=false;}
  if(s.k==='shelfB'&&T.wheel&&T.spring&&T.prop)disc(5,'a','三つの道具で別の棚（右の高い棚）へ到達');
  else if(s.k==='shelfB'&&T.spring&&T.prop)disc(5,'p','ばね＋プロペラで右の高い棚へ');
}
function onLanding(s,imp){

// こいぬが物を押す
function pushThings(dt){
  const p=pup,top=p.y-p.h,hW=!!p.tools.wheel;
  for(const c of BXall()){
    if(c.held!=null||c.magnet)continue;
    if(p.ground&&p.ground.ref===c)continue;
    const ox=(p.hw+c.hw)-Math.abs(c.x-p.x);if(ox<=0)continue;
    const ctop=c.y-c.h;
    if(p.y<=ctop+2.5)continue; // 上に乗っている/上から
    if(top>=c.y)continue;
    if(p.ground&&ctop>=p.y-5&&c.kind!=='bell')continue; // 段差として乗れる
    const dir=sgn(c.x-p.x),rel=p.vx*dir;
    if(rel>0){
      const fast=hW&&rel>42;
      if(c.kind==='cube'){
        c.vx=dir*Math.max(Math.abs(c.vx),rel*(fast?1.25:1.0));
        if(fast&&c.ground){c.vy=-rnd(45,75);c.ground=null;c.rotV=dir*rnd(6,10);SFX.clack(c.x,1);p.sq=0.6;
          burst(c.x-dir*5,c.y-5,6,['#ffffff','#ffe27a'],35,'spark',0.4);
          const above=WD.cubes.filter(q=>q!==c&&q.held==null&&Math.abs(q.x-c.x)<7&&q.y<c.y);
          for(const q of above){const k=1+(c.y-q.y)/22;q.vx=dir*rnd(25,55)*k;q.vy=-rnd(25,55);q.rotV=dir*rnd(4,9);q.ground=null;}
          if(above.length)disc(2,'a','車輪で積み木タワーに衝突し崩した');
          setEmote('wow',1);}
        p.vx*=fast?0.5:0.9;
      }else if(c.kind==='cushion'){c.vx=dir*Math.max(Math.abs(c.vx),rel*1.05);p.vx*=0.8;}
      else if(c.kind==='bell'){c.vx=dir*Math.max(Math.abs(c.vx),rel*1.3+8);ring(c,clamp(rel/50,0.3,1),'push');c.ang+=dir*0.5;}
    }
    const sh=c.kind==='bell'?0.85:c.kind==='cushion'?0.75:0.65;
    c.x+=dir*ox*sh;p.x-=dir*ox*(1-sh);wallsAndChest(c);
    const ox2=(p.hw+c.hw)-Math.abs(c.x-p.x);if(ox2>0)p.x-=dir*ox2;
  }
  // 板の端
  const pl=WD.plank;if(pl.held==null&&!pl.carry){
    const pt=plankTopAt(p.x);const walk=pt!=null&&pt>=p.y-5.5;
    for(const q of pl.p){
      if(q.y<-4.5&&Math.abs(q.x-p.x)<p.hw&&q.y<p.y&&q.y>top&&!walk&&!(p.ground&&p.ground.k==='plank')){
        const dir=sgn(q.x-p.x);if(p.vx*dir>0){q.x+=p.vx*dt*1.1;q.ox=q.x-p.vx*dt*0.9;if(Math.abs(p.vx)>40)SFX.clack(q.x,0.4);p.vx*=0.92;}
      }
    }
  }
}
const BXA=[];function BXall(){BXA.length=0;for(const c of WD.cubes)BXA.push(c);for(const c of WD.cushions)BXA.push(c);BXA.push(WD.bell);return BXA;}

function attachTool(t,byKid){
  const p=pup;if(p.tools[t.tk])return;
  p.tools[t.tk]=t;t.att=true;t.held=null;t.magnet=null;t.vx=t.vy=0;
  SFX.click(p.x);const s=socketPos(t.tk);burst(s.x,s.y,10,['#ffffff','#8fd3ff','#ffe27a'],30,'spark',0.5);
  p.eyes='o';p.earV+=10;setEmote('wow',0.9);
  log('装着: '+t.tk+(byKid?'（子ども）':'（こいぬ）'));
  if(byKid)p.kidGave=TIME;
  if(t.tk==='spring'){
    if(!t.seen){t.seen=true;p.busy=0.25;later((260)/1000,()=>{if(pup.tools.spring&&pup.ground){kick(1.23);pup.hopWant=false;}});}
    else later((200)/1000,()=>{if(pup.tools.spring&&pup.ground)kick(1);});
  }else if(t.tk==='wheel'){
    t.seen=true;const dir=pup.mode==='free'?freeWheelDir():p.face;
    if(pup.mode==='free'){p.face=dir;later((350)/1000,()=>{if(pup.tools.wheel){pup.motor=dir;pup.mspeed=72;pup.dashT=2.6;}});}
  }else if(t.tk==='prop'){t.seen=true;p.E=1;t.spin=1;SFX.whoosh(p.x);}
  if(p.mode==='circus'&&byKid)circusInterrupt();
}
function detachTool(k){
  const p=pup,t=p.tools[k];if(!t)return null;
  p.tools[k]=null;t.att=false;const s=socketPos(k);t.x=s.x;t.y=s.y+t.h*0.5;t.vx=0;t.vy=0;t.ground=null;
  SFX.unclick(p.x);p.eyes='o';setEmote('think',1);p.earV+=5;
  if(k==='wheel'){p.motor=0;}
  if(p.mode==='circus'){CI.removed[k]=TIME;circusInterrupt();}
  log('取り外し: '+k);

const TOOL_O={

/* ---------------- 演技の計測 ---------------- */
function perfStep(dt){
  const p=pup;
  if(!p.perf){
    if(!p.ground||(p.tools.wheel&&Math.abs(p.vx)>40)){
      p.perf={t:0,air:0,maxH:0,gy:p.y,x0:p.x,dist:0,lx:p.x,cush:0,ramp:false,calm:0,speed:Math.abs(p.vx),
        spring:hasT('spring'),wheel:hasT('wheel'),prop:hasT('prop'),auto:p.mode==='circus'&&!!CI.cur,triple:!!(CI.cur&&CI.cur.name==='triple')};
      p.perfCush=0;
    }
    return;
  }
  const f=p.perf;f.t+=dt;
  if(!p.ground)f.air+=dt;f.maxH=Math.max(f.maxH,f.gy-p.y);f.dist+=Math.abs(p.x-f.lx);f.lx=p.x;f.speed=Math.max(f.speed,Math.abs(p.vx));
  if(p.rampFlag)f.ramp=true;f.cush=p.perfCush||0;
  f.spring=f.spring||hasT('spring');f.wheel=f.wheel||hasT('wheel');f.prop=f.prop||hasT('prop');
  if(p.ground&&Math.abs(p.vx)<14){f.calm+=dt;}else f.calm=0;
  if(f.calm>0.45||f.t>14){
    p.perf=null;
    if(f.air>0.35||f.dist>50){
      if(f.cush)p.usedCushion=true;
      const tr={air:f.air,maxH:f.maxH,dist:Math.abs(p.x-f.x0)>f.dist*0.5?Math.abs(p.x-f.x0):f.dist*0.6,cushion:f.cush,ramp:f.ramp,
        spring:f.spring,wheel:f.wheel,prop:f.prop,speed:f.speed,auto:f.auto||(p.mode==='circus'&&!!CI.cur),triple:f.triple};
      tr.type=classify(tr);onPerformance(tr);
    }
  }
}
function classify(t){
  if(t.triple)return 'triple';
  if(t.ramp&&t.spring&&t.prop&&t.wheel)return 'grand';
  if(t.ramp&&t.spring)return 'rampjump';
  if(t.ramp)return 'ramp';
  if(t.cushion&&t.prop)return 'cushionglide';
  if(t.cushion)return 'cushion';
  if(t.wheel&&t.spring&&t.air>0.45)return 'longjump';
  if(t.spring&&t.prop)return 'sky';
  if(t.prop)return 'glide';
  if(t.spring)return 'hop';
  if(t.wheel)return 'run';
  return 'hop';
}

/* ---------------- こいぬの判断（自由モード） ---------------- */
function freeWheelDir(){
  const p=pup;
  if(towerStanding()){return sgn(towerX()-p.x);}
  if(!WD.audCalled)return sgn(WD.bell.x-p.x);
  return p.x<RW/2?1:-1;
}
function towerStanding(){const cs=WD.cubes;let n=0;for(const a of cs)for(const b of cs)if(a!==b&&a.held==null&&b.held==null&&Math.abs(a.x-b.x)<4&&Math.abs(a.y-(b.y-b.h))<1)n++;return n>=1;}
function towerX(){let xs=WD.cubes.map(c=>c.x);return xs.reduce((a,b)=>a+b,0)/xs.length;}
function interest(){
  const p=pup,T=p.tools;
  if(WD.berry.present&&p.y>-35)return {x:WD.berry.x,y:WD.berry.y-4,k:'berry'};
  if(WD.cake.present&&T.prop)return {x:WD.cake.x,y:WD.cake.y-4,k:'cake'};
  const h=HINT.cur;if(h&&h.obj&&h.obj!==pup)return {x:h.obj.x,y:(h.obj.y||0)-6,k:'hint'};
  if(towerStanding())return {x:towerX(),y:-20,k:'tower'};
  return {x:WD.bell.x,y:-5,k:'bell'};
}
function stepFreeAI(dt){
  const p=pup,T=p.tools;
  if(p.busy>0){p.busy-=dt;p.motor=0;return;}
  p.aiT-=dt;
  const it=interest();
  // 視線：指 > 運ばれている物 > 興味
  gaze(dt,it);
  if(TH.on&&!TH.done){p.motor=0;p.hopWant=false;p.walk=0;return;}
  // ばねで跳ぶ連続（いちごを目指す）
  if(p.ai==='hops'){
    const tx=p.aiX;const dx=tx-p.x;
    p.hopWant=p.aiN>0;p.hopVx=clamp(dx*1.4,-30,30);p.face=Math.abs(dx)>2?sgn(dx):p.face;
    if(p.ground&&p.hopWant){kick(p.aiPow||1);p.vx=p.hopVx;p.aiN--;}
    if(!p.ground)p.steer=clamp(dx/20,-1,1);
    if(p.aiN<=0&&p.ground){p.ai=null;p.hopWant=false;p.steer=0;
      if(it.k==='berry'&&WD.berry.present){p.fails++;SFX.whine(p.x);p.earT=0.1;setEmote('sad',1.4);p.lookObj=WD.cushions[0];p.lookT=1.5;}
      p.aiT=rnd(2.2,3.5);}
    return;
  }
  if(p.ai==='walk'){
    const dx=p.aiX-p.x;if(Math.abs(dx)<2||p.aiT<0){p.walk=0;p.ai=null;p.aiT=rnd(1.5,3);
      if(it.k==='berry'&&WD.berry.present&&Math.abs(p.x-it.x)<20){p.lookObj={x:it.x,y:it.y};p.lookT=2;p.earT=0.15;SFX.whine(p.x);setEmote('sad',1.2);}}
    else{p.walk=sgn(dx);p.face=p.walk;}
    // 低い障害物はぴょんと越える
    if(p.ground&&Math.abs(p.vx)<2&&p.walk){p.stuckT=(p.stuckT||0)+dt;if(p.stuckT>0.6){basicHop(p.walk,90);p.stuckT=0;}}
    return;
  }
  if(p.aiT>0)return;
  p.aiT=rnd(2.5,4.5);
  p.steer=0;
  if(T.spring&&!T.wheel){
    // いちごの下へ、だめならクッションを使う
    let tx=it.x;
    const cu=nearestCushion(p.x);
    if(it.k==='berry'&&WD.berry.present&&cu){
      const under=cu.x-cu.hw<shelfA().x1-4;
      if(under)tx=cu.x;else if(p.fails>=2&&Math.random()<0.6)tx=cu.x;
    }
    if(it.k==='cake'&&cu&&p.fails>=1)tx=cu.x;
    p.ai='hops';p.aiX=clamp(tx,10,RW-10);p.aiN=Math.min(6,2+Math.ceil(Math.abs(tx-p.x)/22));p.aiPow=1;
    if(Math.abs(tx-p.x)<6)p.aiN=2;
    return;
  }
  if(T.wheel){
    if(!p.ground)return;
    const dir=freeWheelDir();p.face=dir;p.motor=dir;p.mspeed=T.spring?62:70;p.dashT=rnd(1.6,2.6);
    if(T.spring&&Math.random()<0.7){p.ai='hops';p.aiX=clamp(p.x+dir*60,10,RW-10);p.aiN=3;}
    return;
  }
  if(T.prop){
    if(p.ground&&Math.random()<0.5){spinProp();}
    p.steer=clamp((it.x-p.x)/30,-1,1);
    return;
  }
  // 道具なし：ゆっくり歩いて調べる
  const opts=[];
  if(WD.berry.present)opts.push(clamp(WD.berry.x+8,10,40));
  const h=HINT.cur;if(h&&h.obj&&h.obj.x!=null)opts.push(clamp(h.obj.x-sgn(h.obj.x-p.x)*12,10,RW-10));
  opts.push(clamp(towerX()-14,10,RW-10));
  p.ai='walk';p.aiX=pick(opts);p.aiT=4;
}
function nearestCushion(x){let b=null,bd=1e9;for(const c of WD.cushions){if(c.held!=null)continue;const d=Math.abs(c.x-x);if(d<bd){bd=d;b=c;}}return b;}
function gaze(dt,it){
  const p=pup;p.lookT-=dt;
  let tx=it.x,ty=it.y;
  const ptr=activeHeld();
  if(ptr){tx=ptr.x;ty=ptr.y;}
  else if(p.lookT>0&&p.lookObj){tx=p.lookObj.x;ty=(p.lookObj.y||0)-4;}
  else if(p.mode==='free'&&!p.tools.spring&&!p.tools.wheel&&!p.tools.prop){
    // ばねといちごを交互に見る
    const s=WD.tools.spring;if(!s.att&&WD.berry.present&&Math.floor(TIME/1.8)%2===0){tx=s.x;ty=s.y-5;}
  }
  p.gx=tx;p.gy=ty;
  if(p.ground&&!p.motor&&!p.walk&&p.busy<=0&&Math.abs(tx-p.x)>6&&p.ai!=='hops')p.face=sgn(tx-p.x);
}

const CI={q:[],cur:null,rest:2,first:true,removed:{},routine:0,landX:null,noticeT:0,noticed:null,kidCushionT:0,triple:false,builtRamp:0};
function circusInterrupt(){CI.q.length=0;CI.cur=null;CI.rest=2.2;CI.triple=false;const p=pup;p.hopWant=false;p.walk=0;if(p.dashT<=0)p.motor=0;
  const pl=WD.plank;if(pl.carry){pl.carry=false;pl.pinI=-1;}}
function noticeChange(obj){

  CI.noticed=obj;CI.noticeT=1.1;pup.lookObj=obj;pup.lookT=1.3;setEmote('think',1.3);pup.tilt=1;
  if(obj.kind==='cushion')CI.kidCushionT=TIME;CI.noSupT=-99;

}
function stopPup(){const p=pup;p.motor=0;p.walk=0;p.hopWant=false;p.steer=0;p.brake=true;}
function canEquip(k){const t=WD.tools[k];if(!t||t.att||t.held!=null)return false;if(CI.removed[k]&&TIME-CI.removed[k]<22)return false;
  return LEARN[k==='spring'?'jump':k==='wheel'?'run':'float'];}
function moveToward(tx,dt,st,opt){
  const p=pup;opt=opt||{};const dx=tx-p.x,ad=Math.abs(dx);p.calmT=0.3;
  if(ad<(opt.tol||3)){p.motor=0;p.walk=0;p.hopWant=false;p.brake=true;return p.ground&&Math.abs(p.vx)<14;}
  if(!p.ground)return null;
  const dir=dx>0?1:-1;p.face=dir;p.brake=false;
  if(p.tools.wheel){p.motor=dir;p.mspeed=Math.min(opt.speed||58,10+ad*1.7);}
  else if(p.tools.spring&&!opt.noHop){if(p.ground){kick(0.8);p.vx=dir*Math.min(30,6+ad*1.3);}}
  else p.walk=dir;
  // 前方の障害物は跳び越える
  const ob=obstacleAhead(dir,7);
  if(ob&&ob.o!==opt.push&&ad>ob.d+p.hw+4){if(ob.h<=17){if(p.tools.wheel)p.mspeed=Math.min(p.mspeed,26);if(ob.d<4){basicHop(dir,ob.h>12?108:96);if(p.tools.spring&&!p.ground)p.vy-=10;}}else st.blk=(st.blk||0)+dt;}
  if(Math.abs(p.vx)<2.5&&ad>6){st.stuck=(st.stuck||0)+dt;if(st.stuck>0.8){basicHop(dir,105);st.stuck=0;st.hops=(st.hops||0)+1;}}else st.stuck=0;
  if((st.hops||0)>4||(st.blk||0)>2.5)return "fail";
  return null;
}
function obstacleAhead(dir,dist){

function stepCircus(dt){

const HINT={cur:null,key:'',t:0,demo:null,shown:{},hopT:0};
let lastInput=-99;
function hintTarget(){
  const p=pup,T=p.tools,tl=WD.tools;
  if(TH.on&&!TH.done)return null;
  const berryStage=!WD.berry.eatenOnce&&(!LEARN.jumpT||TIME-LEARN.jumpT<50);
  if(!LEARN.jump||berryStage){
    if(!T.spring)return {obj:tl.spring,key:'spring',to:()=>socketPos('spring')};
    if(WD.berry.present){
      const cu=nearestCushion(15);
      if(cu&&cu.x-cu.hw>shelfA().x1-6&&(p.fails>=1||TIME-lastInput>6))return {obj:cu,key:'cushion',to:()=>({x:16,y:-5})};
      return {obj:p,key:'pup',tap:true};
    }
  }
  if(!LEARN.run){if(!T.wheel)return {obj:tl.wheel,key:'wheel',to:()=>socketPos('wheel')};return {obj:p,key:'pupW',tap:true};}
  if(!LEARN.float){if(!T.prop)return {obj:tl.prop,key:'prop',to:()=>socketPos('prop')};return {obj:p,key:'pupP',tap:true};}
  if(!TH.done)return null;

}
function plankEnd(){const P=WD.plank.p;return P[0].y>P[1].y?P[0]:P[1];}
function stepHint(dt){
  const h=hintTarget();
  if(!h){HINT.cur=null;return;}
  if(!HINT.cur||HINT.cur.key!==h.key){HINT.t=0;HINT.cur=h;}
  else HINT.cur.obj=h.obj,HINT.cur.to=h.to,HINT.cur.from=h.from;
  HINT.t+=dt;
  const idle=TIME-lastInput;
  HINT.hopT-=dt;
  const o=h.obj;
  if(HINT.hopT<=0&&!activeHeld()){
    HINT.hopT=idle>4?1.6:2.6;
    if(o!==pup&&o.held==null){
      if(o.kind==='tool'&&o.ground&&!o.att){o.vy=-(idle>4?60:42);o.ground=null;o.comp=0.8;if(o.tk==='prop')o.spin=Math.max(o.spin,0.6);if(o.tk==='wheel')o.vx=0;}
      else if(o.kind==='cushion'&&o.ground){o.vy=-35;o.ground=null;o.sq=0.6;}
      else if(o.kind==='bell'&&o.ground){o.vy=-30;o.ground=null;o.ring=0.3;}
      else if(o.kind==='plank'){const e=plankEnd();e.oy=e.y+0.9;}
      const pos=o.kind==='plank'?plankEnd():o;
      for(let i=0;i<(idle>4?5:3);i++)addP(pos.x+rnd(-6,6),(pos.y||0)-rnd(4,12),0,-6,0.7,pick(['#ffe27a','#ffffff']),'spark');
    }else if(o===pup&&pup.ground&&(pup.mode==='free'||CI.rest>0.5)&&pup.busy<=0){
      pup.sq=0.3;pup.earV+=6;pup.wag=14;pup.face=pup.x<RW/2?1:-1;
      if(idle>4)addP(pup.x+rnd(-5,5),pup.y-22,0,-8,0.9,'#ffe27a','spark');
    }
    if(idle>4&&o!==pup){pup.lookObj=o.kind==='plank'?plankEnd():o;pup.lookT=1.2;}
  }
  // 指のお手本（放置約9秒、各対象1回、長い放置で再び）
  if(!HINT.demo&&idle>9&&HINT.t>9&&(!HINT.shown[h.key]||TIME-HINT.shown[h.key]>30)&&!activeHeld()){
    HINT.shown[h.key]=TIME;

    HINT.demo={t:0,from:{x:from.x,y:from.y},to:h.to?h.to():null,obj:o,tap:!!h.tap};
    log('お手本表示: '+h.key);
  }
  if(HINT.demo){HINT.demo.t+=dt;if(HINT.demo.t>2.6||TIME-lastInput<0.2)HINT.demo=null;}
}

const PTRS=new Map();const pointerLast={x:null,y:null};
function toWorld(e){const r=cv.getBoundingClientRect();const lx=(e.clientX-r.left)*DPR/PS,ly=(e.clientY-r.top)*DPR/PS;return {x:lx-roomL,y:ly-FY};}
function activeHeld(){for(const s of PTRS.values())if(s.obj&&s.moved)return {x:s.wx,y:s.wy};return null;}
function hitTest(w){
  const rmin=26*K_CSS;let best=null,bs=1e9;
  const consider=(obj,cx_,cy_,rad,kind,pri)=>{const r=Math.max(rad,rmin);const d=Math.hypot(w.x-cx_,w.y-cy_);if(d>r)return;const sc=d/r+(pri||0);if(sc<bs){bs=sc;best={obj,kind};}};
  const p=pup;
  for(const k of ['spring','wheel','prop']){const t=p.tools[k];if(t){const s=socketPos(k);consider(t,s.x,k==='spring'?s.y+3:k==='wheel'?s.y-4:s.y-1,6,'att',0.05);}}
  for(const t of Object.values(WD.tools)){if(t.att)continue;if(t.held!=null)continue;consider(t,t.x,t.y-t.h/2,t.hw+3,'tool',-0.15);}
  consider(WD.bell,WD.bell.x,WD.bell.y-4.5,7,'bell',-0.1);
  consider(p,p.x,p.y-p.foot-7,11,'pup',0.08);
  for(const c of WD.cushions)if(c.held==null)consider(c,c.x,c.y-c.h/2,c.hw,'cushion',0.12);
  for(const c of WD.cubes)if(c.held==null)consider(c,c.x,c.y-c.h/2,c.hw+2,'cube',0.1);
  const pl=WD.plank;if(pl.held==null){for(let i=0;i<2;i++){const q=pl.p[i];consider(pl,q.x,q.y,7,'plankEnd'+i,0.14);}
    consider(pl,(pl.p[0].x+pl.p[1].x)/2,(pl.p[0].y+pl.p[1].y)/2,8,'plankMid',0.18);}
  for(const a of WD.aud)consider(a,a.x,-9+a.hop,8,'aud',0.25);
  if(WD.berry.present)consider(WD.berry,WD.berry.x,WD.berry.y-4,5,'food',0.3);
  if(WD.cake.present)consider(WD.cake,WD.cake.x,WD.cake.y-5,6,'food',0.3);
  return best;
}

    pup.lookObj={x:w.x,y:w.y};pup.lookT=0.8;return;}

  }else if(h.kind==='att'){st.pending=true;pup.sq=0.25;}

    const q=pl.pinI>=0?pl.p[pl.pinI]:{x:(pl.p[0].x+pl.p[1].x)/2,y:(pl.p[0].y+pl.p[1].y)/2};
    st.ox=q.x-w.x;st.oy=q.y-w.y;pl.pinX=q.x;pl.pinY=q.y;SFX.clack(q.x,0.4);}
  else if(h.kind==='aud'){o.hopV=-70;SFX.squeak(o.x,o.kind==='bunny'?1.3:0.8);o.clap=0.4;st.done=true;}

}
function grab(st,o){
  o.held=st.id;o.ground=null;o.magnet=null;
  st.ox=o.x-st.wx;st.oy=(o.y-(o.h||0)/2)-st.wy;
  const lift=-14*K_CSS;st.oy=Math.min(st.oy,lift*0.3);
  o.vx=0;o.vy=0;
  if(pup.mode==='circus'&&CI.cur&&o.kind!=='tool')circusInterrupt();
}
function onMove(e){
  const st=PTRS.get(e.pointerId);if(!st)return;e.preventDefault();
  const w=toWorld(e);pointerLast.x=w.x;pointerLast.y=w.y;
  const dx=w.x-st.sx,dy=w.y-st.sy;
  st.wx=w.x;st.wy=w.y;lastInput=TIME;
  if(!st.moved&&Math.hypot(dx,dy)>Math.max(2.5,10*K_CSS))st.moved=true;
  if(st.pending&&st.moved){ // 付いている道具を引きはがす
    st.pending=false;const k=st.obj.tk;const t=detachTool(k);if(t){st.kind='tool';grab(st,t);st.ox=0;st.oy=-2;}else st.obj=null;
  }
}
function onUp(e){
  const st=PTRS.get(e.pointerId);if(!st)return;e.preventDefault();
  PTRS.delete(e.pointerId);lastInput=TIME;
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  const o=st.obj;if(!o)return;
  if(st.pending){tapPup();return;}
  if(st.done)return;
  if(o.kind==='plank'){const pl=WD.plank;
    if(pl.held===e.pointerId){
      if(pl.mode==='mid'){for(const q of pl.p){q.ox=q.x-clamp(st.vx,-120,120)/120*0.6;q.oy=q.y;}}
      pl.held=null;pl.mode=null;pl.pinI=-1;if(st.moved)noticeChange(pl);}
    return;}
  if(o.held!==e.pointerId)return;
  o.held=null;
  o.vx=clamp(st.vx,-160,160);o.vy=clamp(st.vy,-160,160);
  if(o.kind==='tool'){
    const c=pupCenter(),s=socketPos(o.tk);
    const d=Math.min(Math.hypot(o.x-c.x,o.y-o.h/2-c.y),Math.hypot(o.x-s.x,o.y-o.h/2-s.y));
    if(!pup.tools[o.tk]&&d<Math.max(26,44*K_CSS)){attachTool(o,true);return;}
    if(!st.moved){ // タップ
      if(o.tk==='spring'){o.comp=-0.9;o.compV=0;o.vy=-90-Math.min(5,pup.combo)*8;SFX.poyon(1.1+rnd(-0.05,0.1),o.x,true);
        burst(o.x,o.y-4,7,pick([['#ffe27a','#ffffff'],['#ff9fb5','#ffffff'],['#8fd3ff','#ffffff']]),35,'dot',0.5);pup.lookObj=o;pup.lookT=1.2;pup.earV+=8;}
      else if(o.tk==='wheel'){o.vx=(o.x<RW/2?1:-1)*60;o.spin=1;}
      else{o.spin=1;o.vy=-40;SFX.whoosh(o.x);}
    }
    if(o.tk==='wheel'&&st.moved)o.vx=clamp(st.vx,-120,120);
  }else if(o.kind==='bell'){if(st.moved){noticeChange(o);}}
  else if(o.kind==='cushion'||o.kind==='cube'){if(st.moved)noticeChange(o);if(o.kind==='cube'&&!st.moved){o.vy=-40;o.rotV=rnd(-4,4);}if(o.kind==='cushion'&&!st.moved){o.vy=-30;}}
}
function updateHeld(dt){
  for(const st of PTRS.values()){
    const o=st.obj;if(!o)continue;
    if(o.kind==='plank'){const pl=WD.plank;if(pl.held!==st.id)continue;
      pl.pinX=st.wx+st.ox;pl.pinY=Math.min(st.wy+st.oy,-2.5);
      if(pl.mode==='end'){ // 長さの範囲に制限
        const other=pl.p[1-pl.pinI];const dx=pl.pinX-other.x,dy=pl.pinY-other.y,d=Math.hypot(dx,dy);if(d>pl.L){pl.pinX=other.x+dx/d*pl.L;pl.pinY=other.y+dy/d*pl.L;}}
      if(pl.mode==='mid'){pl.pinX=clamp(pl.pinX,pl.L/2+1,RW-pl.L/2-1);}
      st.vx=(pl.pinX-(st.lx||pl.pinX))/dt;st.lx=pl.pinX;continue;}
    if(o.held!==st.id)continue;
    let tx=st.wx+st.ox,ty=st.wy+st.oy+(o.h||0)/2;
    if(o.kind==='tool'&&!pup.tools[o.tk]){const s=socketPos(o.tk),c=pupCenter();const d=Math.hypot(tx-c.x,ty-o.h/2-c.y);
      if(d<Math.max(22,40*K_CSS)){tx=lerp(tx,s.x,0.35);ty=lerp(ty,s.y+o.h/2,0.35);pup.lookObj=o;pup.lookT=0.3;pup.wag=16;pup.earT=2.5;}}
    tx=clamp(tx,o.hw,RW-o.hw);ty=clamp(ty,TOPY+o.h,0);
    const nx=lerp(o.x,tx,Math.min(1,dt*30)),ny=lerp(o.y,ty,Math.min(1,dt*30));
    st.vx=lerp(st.vx,(nx-o.x)/dt,0.3);st.vy=lerp(st.vy,(ny-o.y)/dt,0.3);
    o.x=nx;o.y=ny;
    if(o.kind==='tool'){if(o.tk==='wheel')o.spin=Math.max(o.spin*0.98,Math.min(1,Math.abs(st.vx)/60));if(o.tk==='prop')o.spin=Math.max(o.spin*0.995,Math.min(1,Math.hypot(st.vx,st.vy)/80),0.3);
      if(o.tk==='spring'){o.comp=lerp(o.comp,0.3+Math.sin(TIME*12)*0.15,0.2);}}
    if(o.kind==='bell'&&Math.hypot(st.vx,st.vy)>90&&TIME-o.lastRing>0.35){ring(o,0.5,'shake');}
  }
}

  const b1=P(px+pxl*w0,py+pyl*w0),b2=P(px-pxl*w0,py-pyl*w0),t2=P(px+dxl*L-pxl*w1,py+dyl*L-pyl*w1),t1=P(px+dxl*L+pxl*w1,py+dyl*L+pyl*w1);
  const o=1;
  const B1=P(px+pxl*(w0+o),py+pyl*(w0+o)),B2=P(px-pxl*(w0+o),py-pyl*(w0+o)),T2=P(px+dxl*(L+o)-pxl*(w1+o),py+dyl*(L+o)-pyl*(w1+o)),T1=P(px+dxl*(L+o)+pxl*(w1+o),py+dyl*(L+o)+pyl*(w1+o));
  PG([B1[0],B1[1],B2[0],B2[1],T2[0],T2[1],T1[0],T1[1]],OUT);
  PG([b1[0],b1[1],b2[0],b2[1],t2[0],t2[1],t1[0],t1[1]],col);
}
function drawEmote(){
  const p=pup;if(!p.emote||p.emoteT<=0)return;
  const x=p.x+p.face*4,y=p.y-p.foot-27-Math.sin(TIME*4)*1;
  if(p.emote==='heart')SP(SPRITES.heart,x-2.5,y-2);
  else if(p.emote==='note')SP(SPRITES.note,x-2,y-2);
  else if(p.emote==='wow'){R(x-0.5,y-3,1,1,'#ffe27a');R(x-3,y-1,1,1,'#ffe27a');R(x+2,y-1,1,1,'#ffe27a');R(x-0.5,y,1,1,'#ffffff');}
  else if(p.emote==='think'){for(let i=0;i<3;i++){if(((TIME*3)|0)%3>=i)R(x-3+i*3,y,1.5,1.5,'#ffffff');}}
  else if(p.emote==='sad'){R(x,y,1,2,'#8fd3ff');R(x-0.5,y+1,2,1,'#8fd3ff');}
}
function drawTheaterFront(){
  const v=TH.v;if(v.curt<=0&&v.stars<=0)return;
  const x0=-roomL,x1=BW-roomL,top=-FY;
  // 星形の照明
  if(v.stars>0){const n=5;for(let i=0;i<n;i++){const sx=RW*(0.12+i*0.19),dy=lerp(top-10,TOPY+10+(i%2)*8,v.stars);
      LN(sx,top,sx,dy-3,'#ffffffaa');
      const cols=SHOW.fin>0?['#ff5a5f','#ffcf4a','#4fb3ff','#6bd67a','#c08cff']:['#ffe27a','#fff1a8'];const c=cols[(((TIME*(SHOW.fin>0?8:1.5))|0)+i)%cols.length];
      starShape(sx,dy,4.5,OUT);starShape(sx,dy,3.6,c);}
    // スポットライト
    if(v.stars>0.8){g.globalAlpha=0.08+(SHOW.fin>0?0.06:0);const sx=RW*0.5;
      PG([sx-2,TOPY+12,sx+2,TOPY+12,pup.x+14,pup.y,pup.x-14,pup.y],'#fff6c8');
      const sx2=RW*0.12;PG([sx2-2,TOPY+12,sx2+2,TOPY+12,pup.x+10,pup.y,pup.x-10,pup.y],'#ffd0f0');g.globalAlpha=1;}
  }
  if(v.curt>0){
    const cw=Math.max(10,(x1-x0)*0.1+4);const k=v.curt;
    const left=x0-cw+cw*k,right=x1-cw*k;
    // 両脇のカーテン：上は広く、タッセルで絞って棚や玩具を隠さない
    const W0=cw*k,ty=-30;
    for(const side of [0,1]){
      const e=side?x1:x0,sg=side?-1:1;
      const pts=[e,top, e+sg*W0,top, e+sg*3,ty, e+sg*6,0, e,0];
      PG(pts,'#b51f35');
      for(let i=2;i<W0;i+=4)LN(e+sg*i,top,e+sg*Math.min(2,i*0.2),ty,'#8f1428');
      LN(e+sg*W0,top,e+sg*3,ty,'#ffcf4a');LN(e+sg*3,ty,e+sg*6,0,'#ffcf4a');
      R(side?e-6:e+1,ty-1,5,3,'#ffcf4a');}
    // 上の飾り幕
    const vh=lerp(-2,12,k);const vy=top+2;
    R(x0,top,x1-x0,vy-top+vh,'#c8243a');
    for(let x=Math.floor(x0/10)*10;x<x1;x+=10){E(x+5,vy+vh,5,3,'#c8243a');R(x+4,vy+vh+2,2,2,'#ffcf4a');}
    R(x0,vy+vh-2,x1-x0,1,'#ffcf4a');
  }
}
function drawHand(){
  const d=HINT.demo;if(!d)return;
  const t=d.t;let x,y,press=false,ghost=false;
  if(d.tap||!d.to){x=d.from.x;y=d.from.y;press=(t%0.8)<0.35&&t>0.4;}
  else{const k=smooth((t-0.5)/1.3);x=lerp(d.from.x,d.to.x,k);y=lerp(d.from.y,d.to.y,k)-Math.sin(k*Math.PI)*10;press=t>0.35&&t<2.0;ghost=t>0.5&&t<1.9;}
  const a=t<0.3?t/0.3:t>2.3?(2.6-t)/0.3:1;
  g.globalAlpha=clamp(a,0,1)*0.9;
  if(ghost&&d.obj&&d.obj.kind==='tool'){g.globalAlpha*=0.5;if(d.obj.tk==='spring')drawSpring(x,y+4,9,true);else if(d.obj.tk==='wheel')drawWheel(x,y-2,TIME*5);else drawProp(x,y-2,TIME*20,1,true);g.globalAlpha=clamp(a,0,1)*0.9;}
  if(ghost&&d.obj&&d.obj.kind==='cushion'){g.globalAlpha*=0.5;E(x,y,12,4,d.obj.col);g.globalAlpha=clamp(a,0,1)*0.9;}
  SP(SPRITES.hand,x-4.5,y+(press?1:3));
  g.globalAlpha=1;
}
function render(){
  OX=roomL;OY=FY;lastFill='';
  g.imageSmoothingEnabled=false;
  drawBackground();
  drawCabinet();
  drawShelves();
  drawFood();
  // 地面の物
  drawPlank();
  for(const c of WD.cubes)if(c.held==null)drawCube(c);
  for(const c of WD.cushions)if(c.held==null)drawCushion(c);
  if(WD.bell.held==null)drawBell(WD.bell);
  for(const t of Object.values(WD.tools))if(!t.att&&t.held==null)drawToolFree(t);
  drawAudience();
  // こいぬ
  drawShadow(pup.x,pup.y,14);
  drawPup();drawEmote();
  // 持っている物（手前）
  for(const c of WD.cubes)if(c.held!=null){drawShadow(c.x,c.y,10);drawCube(c);}
  for(const c of WD.cushions)if(c.held!=null){drawShadow(c.x,c.y,20);drawCushion(c);}
  if(WD.bell.held!=null){drawShadow(WD.bell.x,WD.bell.y,8);drawBell(WD.bell);}
  for(const t of Object.values(WD.tools))if(!t.att&&t.held!=null){drawShadow(t.x,t.y,10);drawToolFree(t);}
  drawParticles();
  drawTheaterFront();
  drawHand();
  if(FIRST.t>0){FIRST.t=Math.max(0,FIRST.t-1/60);}
  // 拡大して表示
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(buf,0,0,BW,BH,0,0,BW*PS,BH*PS);
}

/* ---------------- 更新 ---------------- */
function step(dt){
  TIME+=dt;stepLater();
  buildSurfaces();
  updateHeld(dt);
  if(pup.mode==='circus')stepCircus(dt);else stepFreeAI(dt);
  stepIntro(dt);
  stepPup(dt);
  for(const c of WD.cubes){c.wob*=Math.exp(-dt*4);
    if(!c.ground&&c.held==null)c.rot+=c.rotV*dt;else if(c.held==null){const tgt=Math.round(c.rot/(Math.PI/2))*(Math.PI/2);c.rot=lerp(c.rot,tgt,Math.min(1,dt*14));}
    stepBody(c,dt,CUBE_O);}
  for(const c of WD.cushions){c.wob*=Math.exp(-dt*4);c.sqV+=(-c.sq*220-c.sqV*9)*dt;c.sq+=c.sqV*dt;stepBody(c,dt,CUSH_O);}
  const b=WD.bell;b.ring=Math.max(0,b.ring-dt);stepBody(b,dt,BELL_O);
  if(b.ground&&Math.abs(b.vx)>18&&Math.random()<dt*6)ring(b,0.3,'roll');
  pairResolve();
  stepPlank(dt);
  stepTools(dt);
  stepFood(dt);
  stepAudience(dt);
  stepTheater(dt);
  stepFinale(dt);
  perfStep(dt);
  stepHint(dt);
  // 表情
  const p=pup;p.blink-=dt;if(p.blink<0){if(p.blink<-0.13)p.blink=rnd(2,4.5);}
  p.emoteT-=dt;if(p.emoteT<=0)p.emote=null;
  p.eatT=Math.max(0,p.eatT-dt);p.happy=Math.max(0,p.happy-dt*0.12);
  p.tilt=Math.max(0,p.tilt-dt);
  if(p.eyes==='o'&&Math.random()<dt*1.2)p.eyes='n';
  p.wag=lerp(p.wag,2+p.happy*12+(p.tools.spring||p.tools.wheel||p.tools.prop?3:0),dt*0.8);
  const sad=p.mode==='free'&&WD.berry.present&&!p.tools.spring&&p.happy<0.2;
  if(p.eatT<=0&&!TH.on)p.earT=lerp(p.earT,p.happy>0.5?2.6:sad?0.15:0.55,dt*2);
  else if(TH.done&&p.eatT<=0&&p.mode==='circus')p.earT=lerp(p.earT,p.happy>0.5?2.7:0.7,dt*2);
  if(p.combo>0&&TIME-p.comboT>2)p.combo=0;
  // 放置10秒以降の弱い環境反応
  if(TIME-lastInput>10&&Math.random()<dt*0.5){const all=[...WD.cubes,...WD.cushions,...Object.values(WD.tools).filter(t=>!t.att)];const o=pick(all);if(o&&(!HINT.cur||o!==HINT.cur.obj))o.wob=0.6;}
  if(saveT>0){saveT-=dt;if(saveT<=0)saveNow();}
  if(AU.music&&AU.music<1)AU.music=Math.min(0.9,AU.music+dt*0.05);
}
let running=true,lastT=0,acc=0,raf=0;
function frame(now){
  raf=0;if(!running)return;
  const t=now/1000;let d=lastT?t-lastT:1/60;lastT=t;d=Math.min(d,0.1);acc+=d;
  const h=1/120;let n=0;
  try{
    while(acc>=h&&n<16){step(h);acc-=h;n++;}
    if(n>=16)acc=0;
    stepParticles(d);
    music();
    render();
  }catch(e){if(!frame.err){frame.err=1;log('ERR '+(e&&e.message));}}
  raf=requestAnimationFrame(frame);
}
function start(){if(raf)return;running=true;lastT=0;acc=0;raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf){cancelAnimationFrame(raf);raf=0;}}

/* ---------------- 初期化 ---------------- */
function init(){
  buildSprites();
  layout();
  WD=newWorld();
  pup.x=RW*0.22;pup.face=-1;pup.gx=WD.berry.x;pup.gy=-44;
  SAVED=loadSave();if(SAVED){FAV=Object.assign({},SAVED.fav);const ft=favType();if(ft){pup.intro=ft;pup.introT=0;log('前回のお気に入り: '+ft);}}
  cv.addEventListener('pointerdown',onDown,{passive:false});
  cv.addEventListener('pointermove',onMove,{passive:false});
  cv.addEventListener('pointerup',onUp,{passive:false});
  cv.addEventListener('pointercancel',onUp,{passive:false});
  cv.addEventListener('lostpointercapture',e=>{if(PTRS.has(e.pointerId))onUp(e);});
  const prevent=e=>{if(e.cancelable)e.preventDefault();};
  document.addEventListener('touchstart',e=>{audioUnlock();prevent(e);},{passive:false});
  document.addEventListener('touchmove',prevent,{passive:false});
  document.addEventListener('touchend',e=>{audioUnlock();},{passive:false});
  document.addEventListener('gesturestart',prevent,{passive:false});
  document.addEventListener('gesturechange',prevent,{passive:false});
  document.addEventListener('contextmenu',prevent);
  document.addEventListener('dblclick',prevent,{passive:false});
  document.addEventListener('selectstart',prevent);
  let rT=0;const onResize=()=>{clearTimeout(rT);rT=setTimeout(()=>{layout();},60);};
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',()=>setTimeout(layout,250));
  if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){stop();saveNow();try{if(AU.c&&AU.c.state==='running')AU.c.suspend();}catch(e){}
      for(const st of PTRS.values()){const o=st.obj;if(o&&o.held===st.id)o.held=null;if(o&&o.kind==='plank'){o.held=null;o.mode=null;o.pinI=-1;}}PTRS.clear();}
    else{layout();start();try{if(AU.c&&AU.c.state!=='running')AU.c.resume();}catch(e){}}
  });
  window.addEventListener('pagehide',saveNow);
  window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
  start();
}
// 検証用フック（UIには表示しない）
window.__pp={get pup(){return pup;},get WD(){return WD;},LEARN,DISC,LOG,TH,CI,SHOW,HINT,
  get T(){return TIME;},get dims(){return {BW,BH,PS,RW,FY,roomL,DPR,K_CSS,TOPY};},
  sim(sec){const n=Math.round(sec*120);for(let i=0;i<n;i++)step(1/120);stepParticles(sec);render();},
  attach(k){const t=WD.tools[k];if(t&&!t.att){t.held=null;attachTool(t,true);}},
  detach(k){return detachTool(k);},
  toScreen(x,y){return {x:(x+roomL)*PS/DPR,y:(y+FY)*PS/DPR};},
  tap(){tapPup();},startTheater,plan:planRoutine,findRamp,towerStanding,supportCandidates,finale,pt:PT,render,
  idle(){lastInput=TIME-20;}};
init();
})();
