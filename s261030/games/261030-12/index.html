<script>
'use strict';
(function(){
/* ============ core ============ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,SC=1,VW=390,VH=844,PORT=true,OX=0,OY=0,FX0=0,FX1=390,FY0=0,FY1=844,RES=2;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIn=t=>{t=clamp(t,0,1);return t*t*t};
const easeBack=t=>{t=clamp(t,0,1);const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const hyp=Math.hypot;
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const R=rng((Date.now()^(Math.random()*1e9))>>>0);
const rnd=(a,b)=>b===undefined?R()*(a===undefined?1:a):a+R()*(b-a);
const pick=a=>a[(R()*a.length)|0];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(R()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t}return a}

/* colors */
const CN=['red','blue','yellow'];
const COL={red:'#e35a4d',blue:'#4a83cf',yellow:'#f3c53a',white:'#f7f0e1',orange:'#f08c3a',green:'#62ad5a',purple:'#8d63c0',pink:'#f3a6b6'};
const DK={red:'#a83b31',blue:'#2c5c9c',yellow:'#c3951c',white:'#cdbfa5',orange:'#b8621f',green:'#3f7d3a',purple:'#5f3f8c',pink:'#c9748a'};
const LT={red:'#f6a69b',blue:'#a7c7f0',yellow:'#fae49a',white:'#fffaf0',orange:'#f8c393',green:'#acd8a0',purple:'#c8b0e6',pink:'#fbd3dc'};
function mixName(a,b){if(a===b)return a;const s=[a,b].sort().join('+');return({'blue+red':'purple','red+yellow':'orange','blue+yellow':'green'})[s]||a}

/* ============ audio (Web Audio synth) ============ */
const AU={c:null,m:null,nb:null,on:false,next:0,step:0};
function audioStart(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      AU.c=new AC();
      const comp=AU.c.createDynamicsCompressor();
      AU.m=AU.c.createGain(); AU.m.gain.value=0.55; AU.m.connect(comp); comp.connect(AU.c.destination);
      const len=AU.c.sampleRate|0; AU.nb=AU.c.createBuffer(1,len,AU.c.sampleRate);
      const d=AU.nb.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }
    if(AU.c.state!=='running'){const p=AU.c.resume(); if(p&&p.catch) p.catch(()=>{});}
    const b=AU.c.createBufferSource(); b.buffer=AU.c.createBuffer(1,1,22050); b.connect(AU.m); b.start(0);
    AU.on=true;
  }catch(e){AU.on=false}
}
function aok(){return AU.on&&AU.c&&AU.c.state==='running'}
function tone(f,dur,o){
  if(!aok()) return; o=o||{};
  try{
    const t=AU.c.currentTime+(o.at||0);
    const os=AU.c.createOscillator(), g=AU.c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
    if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
    const v=o.vol||0.15;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g); g.connect(AU.m); os.start(t); os.stop(t+dur+0.05);
  }catch(e){}
}
function noiz(dur,o){
  if(!aok()) return; o=o||{};
  try{
    const t=AU.c.currentTime+(o.at||0);
    const s=AU.c.createBufferSource(); s.buffer=AU.nb;
    const f=AU.c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t);
    if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur); f.Q.value=o.q||1;
    const g=AU.c.createGain(); const v=o.vol||0.1;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(AU.m); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);
  }catch(e){}
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const TUBN={red:60,blue:64,yellow:67,white:62};
const SFX={
  tap(){tone(NOTE(84),0.07,{type:'triangle',vol:0.06})},
  lift(){tone(480,0.12,{to:760,vol:0.08});noiz(0.14,{f:2600,q:0.7,vol:0.05})},
  paper(){noiz(0.35,{f:3200,f2:1500,q:0.6,vol:0.06})},
  splash(c){const n=TUBN[c]||62;noiz(0.5,{f:1100,f2:280,q:0.7,vol:0.24,ft:'lowpass'});tone(230,0.2,{to:85,vol:0.18});tone(NOTE(n+12),0.22,{to:NOTE(n),vol:0.08,at:0.05})},
  plop(c,k){const n=(TUBN[c]||62)+[0,2,4,7,9,12][(k||0)%6]+12;tone(NOTE(n),0.12,{to:NOTE(n+5),vol:0.09});noiz(0.12,{f:800,q:2,vol:0.06})},
  pop(s){const f=800+(1-clamp(s||0.5,0,1))*1000+Math.random()*200;tone(f,0.06,{to:f*1.7,vol:0.07})},
  bubble(){const f=300+Math.random()*300;tone(f,0.12,{to:f*2.2,vol:0.05})},
  boing(p){p=p||1;tone(240*p,0.28,{to:520*p,vol:0.12})},
  jump(c){const n=(TUBN[c]||62)+12;[0,4,7].forEach((d,i)=>tone(NOTE(n+d),0.16,{type:'triangle',vol:0.11,at:i*0.07}))},
  zip(){noiz(0.55,{f:1200,f2:3200,q:2,vol:0.045});tone(560,0.45,{to:980,type:'triangle',vol:0.035})},
  catchIt(){tone(NOTE(76),0.12,{type:'triangle',vol:0.11});tone(NOTE(81),0.18,{type:'triangle',vol:0.11,at:0.08})},
  yip(i){const f=[480,600,780][i||0];tone(f,0.08,{to:f*1.45,type:'square',vol:0.03});tone(f*1.2,0.12,{to:f*0.85,type:'triangle',vol:0.08,at:0.08})},
  giggle(i){const f=[520,640,820][i||0];for(let k=0;k<4;k++)tone(f*(1+0.07*k),0.07,{to:f*(1.15+0.07*k),type:'triangle',vol:0.07,at:k*0.085})},
  sneeze(){tone(620,0.35,{to:900,type:'triangle',vol:0.04,atk:0.2});noiz(0.28,{f:3600,f2:1400,q:0.7,vol:0.18,at:0.38});tone(900,0.1,{to:500,type:'square',vol:0.03,at:0.38})},
  step(c,k){tone(NOTE((TUBN[c]||62)+[0,2,4,7,9,12][k%6]+12),0.08,{type:'sine',vol:0.06})},
  success(){[0,4,7,12,16].forEach((d,i)=>tone(NOTE(72+d),0.32,{type:'triangle',vol:0.12,at:i*0.085}));tone(NOTE(60),0.7,{vol:0.07});tone(NOTE(67),0.7,{vol:0.05,at:0.1})},
  fanfare(){const seq=[[60,64,67],[65,69,72],[67,71,74],[72,76,79,84]];seq.forEach((ch,i)=>ch.forEach(n=>tone(NOTE(n),i===3?1.2:0.32,{type:'triangle',vol:0.07,at:i*0.22})));noiz(1.4,{f:5000,f2:2000,q:0.4,vol:0.04,at:0.66})},
  wipe(){noiz(0.18,{f:1700,f2:2700,q:1.3,vol:0.05})},
  chomp(){noiz(0.07,{f:1300,q:1,vol:0.09});noiz(0.07,{f:1100,q:1,vol:0.09,at:0.14});tone(NOTE(79),0.14,{type:'triangle',vol:0.09,at:0.3});tone(NOTE(84),0.2,{type:'triangle',vol:0.09,at:0.4})},
  wind(){noiz(2.6,{f:350,f2:900,q:0.4,vol:0.08,atk:0.9});noiz(1.4,{f:3000,f2:2000,q:0.6,vol:0.03,at:0.6})},
  shutter(){for(let i=0;i<6;i++)noiz(0.05,{f:2400,q:2,vol:0.05,at:i*0.06});tone(NOTE(72),0.2,{type:'triangle',vol:0.07,at:0.4});tone(NOTE(76),0.3,{type:'triangle',vol:0.07,at:0.5})},
  flash(){tone(1400,0.08,{type:'square',vol:0.025});noiz(0.35,{f:5000,q:0.5,vol:0.08})},
  soft(){const n=[72,74,76,79,81][(Math.random()*5)|0];tone(NOTE(n),0.12,{vol:0.04})},
  clap(){noiz(0.06,{f:1800,q:0.8,vol:0.08})},
  pin(){tone(NOTE(88),0.06,{type:'square',vol:0.02});noiz(0.05,{f:4000,q:2,vol:0.04})},
  night(){[67,64,60,55].forEach((n,i)=>tone(NOTE(n),0.6,{type:'sine',vol:0.06,at:i*0.3}))},
  morning(){[60,64,67,72,76].forEach((n,i)=>tone(NOTE(n),0.4,{type:'triangle',vol:0.06,at:i*0.12}))}
};

/* ============ state ============ */
const S={
  t:0, phase:'wash', cycle:0, items:[], dogs:[], tubs:[], foot:[], parts:[], bubbles:[], washLog:[],
  disc:{}, log:[], win:{fog:1,fade:1,clear:false,grid:null,seed:1}, stall:null, sheet:null, roof:null, party:null, night:null,
  album:[], albumImgs:[], albumOpen:false, bookBounce:0, hint:null, idle:0, handT:-1, hand:null, mimeDone:false, nextHand:4,
  firstTouch:false, sel:null, zoom:1, zoomTo:1, matchKey:null, sheetWait:0, printColors:{}, flash:0, flyFrame:null,
  wig:{}, nextIdleBubble:8, dogBubbleSeen:false, tubTaps:0, sheetOrder:null, lineRiders:[]
};
window.__gf=S;
const L={};
let IID=0;

/* ============ layout ============ */
function layout(){
  if(PORT){
    const fy=VH/844; L.fy=fy; L.ds=1; L.is=1;
    L.lineY=116*fy; L.lineX0=VW*0.03; L.lineX1=VW*0.97; L.sag=24;
    L.horizon=330*fy; L.plazaTop=352*fy; L.plazaBot=602*fy;
    L.dogY=566*fy; L.dogX=[VW*0.2,VW*0.5,VW*0.8];
    const trx=Math.min(66,VW*0.15);
    L.tubs=CN.map((c,i)=>({x:VW*(0.18+0.32*i),y:676*fy,rx:trx,ry:trx*0.42}));
    L.slots=[[0.14,792],[0.32,808],[0.5,790],[0.68,808],[0.86,792],[0.5,760]].map(a=>({x:VW*a[0],y:a[1]*fy}));
    L.basket={x:VW*0.5,y:800*fy,w:VW*0.96,h:74};
    L.win={x:VW*0.29,y:232*fy,w:Math.min(150,VW*0.36),h:112};
    L.pole={x:VW*0.78,base:L.horizon+6,top:L.horizon-150};
    L.sheet={x0:VW*0.1,x1:VW*0.9,h:196*fy,gx0:VW*0.06,gx1:VW*0.94};
    L.roofEnds={y:L.horizon-6,apex:34*fy,thick:74};
    L.clouds=[{x:VW*0.2,y:60*fy,s:1},{x:VW*0.72,y:44*fy,s:0.8},{x:VW*0.52,y:178*fy,s:0.6}];
    L.trees=[{x:VW*0.06,y:L.horizon+4,s:0.9},{x:VW*0.62,y:L.horizon+2,s:0.75}];
    L.sun={x:VW*0.88,y:58*fy,r:26};
  }else{
    const fy=VH/820; L.fy=fy; L.ds=1.22; L.is=1.22;
    L.lineY=96*fy; L.lineX0=VW*0.03; L.lineX1=VW*0.97; L.sag=34;
    L.horizon=360*fy; L.plazaTop=382*fy; L.plazaBot=650*fy;
    L.dogY=622*fy; L.dogX=[VW*0.5,VW*0.665,VW*0.83];
    const trx=80;
    L.tubs=CN.map((c,i)=>({x:VW*(0.43+0.18*i),y:734*fy,rx:trx,ry:trx*0.42}));
    L.slots=[[0.065,600],[0.16,615],[0.255,600],[0.07,735],[0.165,752],[0.26,735]].map(a=>({x:VW*a[0],y:a[1]*fy}));
    L.basket={x:VW*0.165,y:690*fy,w:VW*0.3,h:230};
    L.win={x:VW*0.25,y:262*fy,w:200,h:146};
    L.pole={x:VW*0.9,base:L.horizon+6,top:L.horizon-190};
    L.sheet={x0:VW*0.12,x1:VW*0.88,h:240*fy,gx0:VW*0.08,gx1:VW*0.92};
    L.roofEnds={y:L.horizon-8,apex:26*fy,thick:96};
    L.clouds=[{x:VW*0.12,y:56*fy,s:1.2},{x:VW*0.6,y:40*fy,s:1},{x:VW*0.82,y:150*fy,s:0.8}];
    L.trees=[{x:VW*0.04,y:L.horizon+4,s:1.1},{x:VW*0.46,y:L.horizon+2,s:1}];
    L.sun={x:VW*0.75,y:70*fy,r:34};
  }
  L.tubs.forEach((t,i)=>{t.c=CN[i]});
  if(S.tubs.length) S.tubs.forEach((t,i)=>Object.assign(t,L.tubs[i]));
  L.book={x:30,y:32};
}
function lineYAt(x){
  const mid=(L.lineX0+L.lineX1)/2, half=(L.lineX1-L.lineX0)/2;
  const u=clamp((x-mid)/half,-1,1);
  let y=L.lineY+L.sag*(1-u*u);
  for(const r of S.lineRiders){const d=Math.abs(x-r.x);if(d<120)y+=r.w*(1-d/120)*(1-u*u*0.6)}
  return y;
}

/* ============ resize ============ */
function safeInsets(){
  try{const cs=getComputedStyle(document.getElementById('sa'));
    return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0}}
  catch(e){return{t:0,r:0,b:0,l:0}}
}
let BG=null, BGR={x0:0,y0:0,x1:1,y1:1}, FOOTC=null, FOOTR={x0:0,y0:0,x1:1,y1:1,k:1};
function resize(){
  W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const sa=safeInsets();
  const cw=Math.max(120,W-sa.l-sa.r), ch=Math.max(120,H-sa.t-sa.b);
  PORT=H>=W;
  const mw=PORT?390:1180, mh=PORT?844:820;
  SC=Math.min(cw/mw,ch/mh); VW=cw/SC; VH=ch/SC; OX=sa.l; OY=sa.t;
  FX0=-OX/SC; FX1=(W-OX)/SC; FY0=-OY/SC; FY1=(H-OY)/SC;
  RES=clamp(DPR*SC*1.05,1,3);
  layout();
  SPR.clear();
  buildBG(); buildFootCache();
  for(const it of S.items) if(it.st==='pile'||it.st==='hook'||it.st==='stall'||it.st==='line'){const h=itemHome(it);it.x=h.x;it.y=h.y}
  for(const d of S.dogs){if(d.act&&(d.act.type==='hop'||d.act.type==='walkTo'||d.act.type==='danceGo'||d.act.type==='chase'))d.act=null;d.q=d.q.filter(a=>a.type!=='hop');d.dance=null;if(!d.act){const h=dogHome(d);d.x=h.x;d.y=h.y}}
}

/* world transform with camera zoom around (VW/2, VH*0.56) */
function zc(){return{x:VW/2,y:VH*0.56}}
function setWorld(){
  const k=DPR*SC,z=S.zoom,c=zc();
  ctx.setTransform(k*z,0,0,k*z,(OX+SC*(c.x-c.x*z))*DPR,(OY+SC*(c.y-c.y*z))*DPR);
}
function setVirtual(){const k=DPR*SC;ctx.setTransform(k,0,0,k,OX*DPR,OY*DPR)}
function toWorld(px,py){const z=S.zoom,c=zc();const vx=(px-OX)/SC,vy=(py-OY)/SC;return{x:c.x+(vx-c.x)/z,y:c.y+(vy-c.y)/z,vx,vy}}
function worldBounds(z){const c=zc();return{x0:c.x+(FX0-c.x)/z,x1:c.x+(FX1-c.x)/z,y0:c.y+(FY0-c.y)/z,y1:c.y+(FY1-c.y)/z}}

/* ============ textures ============ */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
const paperTex=(function(){const c=mkCanvas(160,160),g=c.getContext('2d'),r=rng(7);
  for(let i=0;i<1100;i++){g.fillStyle=r()<0.5?'rgba(255,255,255,0.20)':'rgba(90,60,30,0.07)';g.fillRect(r()*160,r()*160,1+r()*1.6,1+r()*1.6)}
  g.lineWidth=0.6;
  for(let i=0;i<80;i++){g.strokeStyle=r()<0.5?'rgba(255,255,255,0.28)':'rgba(110,80,40,0.10)';const x=r()*160,y=r()*160,a=r()*TAU,l=6+r()*18;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+0.6)*l*0.5,y+Math.sin(a+0.6)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  return c})();
const weaveTex=(function(){const c=mkCanvas(48,48),g=c.getContext('2d'),r=rng(11);
  for(let y=0;y<48;y+=3){g.fillStyle='rgba(255,255,255,'+(0.10+r()*0.08)+')';g.fillRect(0,y,48,1)}
  for(let x=0;x<48;x+=3){g.fillStyle='rgba(60,40,20,'+(0.04+r()*0.04)+')';g.fillRect(x,0,1,48)}
  return c})();
function texFill(g,x,y,w,h,a){g.save();g.globalAlpha=a;g.fillStyle=g.createPattern(paperTex,'repeat');g.fillRect(x,y,w,h);g.restore()}

/* ============ paper helpers ============ */
function smoothClosed(g,pts){const n=pts.length;const a0=pts[n-1],b0=pts[0];g.moveTo((a0[0]+b0[0])/2,(a0[1]+b0[1])/2);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}g.closePath()}
function blobPts(cx,cy,rx,ry,seed,amp,n){const r=rng(seed);const pts=[];for(let i=0;i<n;i++){const a=i/n*TAU;const m=1+(r()*2-1)*amp;pts.push([cx+Math.cos(a)*rx*m,cy+Math.sin(a)*ry*m])}return pts}
function blob(g,cx,cy,rx,ry,seed,amp,n){g.beginPath();smoothClosed(g,blobPts(cx,cy,rx,ry,seed,amp===undefined?0.035:amp,n||16))}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot||0,0,TAU)}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function star(g,x,y,r,rot){g.beginPath();for(let i=0;i<10;i++){const a=rot+i/10*TAU-Math.PI/2;const rr2=i%2?r*0.45:r;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}g.closePath()}
function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*0.35);g.bezierCurveTo(x-s*1.1,y-s*0.35,x-s*0.45,y-s*1.05,x,y-s*0.45);g.bezierCurveTo(x+s*0.45,y-s*1.05,x+s*1.1,y-s*0.35,x,y+s*0.35);g.closePath()}
/* paw print */
function paw(g,x,y,a,s,col,rim){
  g.save();g.translate(x,y);g.rotate(a);
  if(rim){g.fillStyle=rim;ell(g,0,1.5*s,5.4*s,4.6*s);g.fill();for(let i=0;i<4;i++){const ang=-0.95+i*0.63;ell(g,Math.sin(ang)*6.2*s,-Math.cos(ang)*5.2*s-1*s,2.7*s,3.2*s);g.fill()}}
  g.fillStyle=col;ell(g,0,1.5*s,4.4*s,3.7*s);g.fill();
  for(let i=0;i<4;i++){const ang=-0.95+i*0.63;ell(g,Math.sin(ang)*6.2*s,-Math.cos(ang)*5.2*s-1*s,1.9*s,2.4*s);g.fill()}
  g.restore();
}

/* ============ pattern layers ============ */
function drawLayer(g,Ly,w,h){
  const r=rng(Ly.seed),c=COL[Ly.c],lt=LT[Ly.c];
  if(Ly.k==='dots'){
    const s=Math.max(w,h)/4.3;let row=0;
    for(let y=-h/2-s;y<h/2+s;y+=s*0.86,row++)for(let x=-w/2-s+(row%2)*s/2;x<w/2+s;x+=s){
      const rad=s*0.25*(0.85+r()*0.35),jx=(r()-0.5)*s*0.2,jy=(r()-0.5)*s*0.2;
      g.fillStyle=c;ell(g,x+jx,y+jy,rad,rad);g.fill();
      g.fillStyle=lt;g.globalAlpha=0.7;ell(g,x+jx-rad*0.3,y+jy-rad*0.3,rad*0.35,rad*0.3);g.fill();g.globalAlpha=1;
    }
  }else if(Ly.k==='mottle'){
    for(let i=0;i<5;i++){const x=(r()-0.5)*w,y=(r()-0.5)*h,rad=(0.09+r()*0.11)*Math.max(w,h);
      g.globalAlpha=0.35;g.fillStyle=c;blob(g,x,y,rad*1.25,rad*1.1,(Ly.seed+i*31)|0,0.22,10);g.fill();
      g.globalAlpha=0.85;blob(g,x,y,rad,rad*0.85,(Ly.seed+i*17)|0,0.25,10);g.fill();g.globalAlpha=1}
  }else{
    g.save();g.rotate(-0.55);const s=Math.max(w,h)/3.6;g.fillStyle=c;
    for(let x=-w*1.2;x<w*1.2;x+=s){g.beginPath();g.moveTo(x,-h*1.3);for(let y=-h*1.3;y<=h*1.3;y+=6)g.lineTo(x+Math.sin(y*0.15+Ly.seed)*2,y);
      for(let y=h*1.3;y>=-h*1.3;y-=6)g.lineTo(x+s*0.38+Math.sin(y*0.15+Ly.seed+1)*2,y);g.closePath();g.fill()}
    g.restore();
  }
}
function drawDirt(g,kind,seed,w,h){
  const r=rng(seed);const m=Math.max(w,h);
  if(kind==='cream'){
    for(let i=0;i<5;i++){g.fillStyle=i%2?'#fff7f2':'#f7c3cf';g.globalAlpha=0.9;blob(g,(r()-0.5)*w*0.8,(r()-0.5)*h*0.8,m*(0.1+r()*0.1),m*(0.08+r()*0.08),seed+i*7,0.3,9);g.fill()}
    g.fillStyle='#d8434f';for(let i=0;i<8;i++){ell(g,(r()-0.5)*w*0.7,(r()-0.5)*h*0.7,1.6,2.2);g.fill()}
  }else{
    g.globalAlpha=0.28;g.fillStyle='#7a5530';g.fillRect(-w,-h,w*2,h*2);
    for(let i=0;i<7;i++){g.globalAlpha=0.75+r()*0.2;g.fillStyle=r()<0.5?'#8a6239':'#6e4b2a';blob(g,(r()-0.5)*w*0.9,(r()-0.5)*h*0.9,m*(0.08+r()*0.13),m*(0.07+r()*0.1),seed+i*13,0.3,9);g.fill()}
    g.fillStyle='#5d3f22';for(let i=0;i<14;i++){g.globalAlpha=0.7;ell(g,(r()-0.5)*w,(r()-0.5)*h,1+r()*2.4,1+r()*2);g.fill()}
  }
  g.globalAlpha=1;
}

/* ============ sprite cache ============ */
const SPR=new Map();
function lookKey(o){let k=o.base+'/'+(o.dirty||'')+'/'+o.seed;for(const l of o.layers)k+='/'+l.c+l.k+l.seed;return k}
function sprite(shape,o){
  const key=shape+'|'+lookKey(o)+'|'+RES.toFixed(2);
  let c=SPR.get(key);if(c)return c;
  if(SPR.size>140)SPR.clear();
  const [w,h]=ISZ[shape],pad=6;
  c=mkCanvas((w+pad*2)*RES,(h+pad*2)*RES);c.lw=w+pad*2;c.lh=h+pad*2;
  const g=c.getContext('2d');g.scale(RES,RES);g.translate(w/2+pad,h/2+pad);
  const sh=SHP[shape](w,h);
  g.save();g.translate(1.6,2.6);g.fillStyle='rgba(70,45,20,0.28)';g.fill(sh.p);g.restore();
  g.fillStyle=COL[o.base]||COL.white;g.fill(sh.p);
  g.save();g.clip(sh.p);
  const gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,'rgba(255,255,255,0.22)');gr.addColorStop(1,'rgba(80,50,20,0.10)');
  for(const l of o.layers)drawLayer(g,l,w,h);
  g.fillStyle=gr;g.fillRect(-w,-h,w*2,h*2);
  g.globalAlpha=0.55;g.fillStyle=g.createPattern(weaveTex,'repeat');g.fillRect(-w,-h,w*2,h*2);
  g.globalAlpha=0.7;g.fillStyle=g.createPattern(paperTex,'repeat');g.fillRect(-w,-h,w*2,h*2);g.globalAlpha=1;
  sh.deco(g,DK[o.base]||DK.white);
  if(o.dirty)drawDirt(g,o.dirty,o.seed,w,h);
  g.restore();
  g.lineWidth=1.1;g.strokeStyle='rgba(255,255,255,0.55)';g.stroke(sh.p);
  SPR.set(key,c);return c;
}
let TMP=mkCanvas(64,64),TMPG=TMP.getContext('2d');
/* draw a fabric sprite centered at x,y with size multiplier; handles dye-spreading animation */
function drawFabric(g,shape,o,x,y,sc,rot,sx,sy){
  const spr=sprite(shape,o);
  const dw=spr.lw*sc*(sx||1),dh=spr.lh*sc*(sy||1);
  g.save();g.translate(x,y);if(rot)g.rotate(rot);
  if(o.dyeT!==undefined&&o.dyeT<1&&o.prev){
    const ps=sprite(shape,o.prev);
    g.drawImage(ps,-dw/2,-dh/2,dw,dh);
    if(TMP.width<spr.width||TMP.height<spr.height){TMP=mkCanvas(Math.max(TMP.width,spr.width),Math.max(TMP.height,spr.height));TMPG=TMP.getContext('2d')}
    const tw=spr.width,th=spr.height;
    TMPG.setTransform(1,0,0,1,0,0);TMPG.globalCompositeOperation='source-over';TMPG.clearRect(0,0,tw+2,th+2);
    TMPG.drawImage(spr,0,0);
    TMPG.globalCompositeOperation='destination-in';
    const lvl=th*(1.15-o.dyeT*1.35);
    const grd=TMPG.createLinearGradient(0,lvl-th*0.12,0,lvl+th*0.1);grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,1)');
    TMPG.fillStyle=grd;TMPG.beginPath();TMPG.moveTo(0,th);
    for(let i=0;i<=12;i++){const xx=tw*i/12;TMPG.lineTo(xx,lvl-th*0.12+Math.sin(i*1.7+o.seed)*th*0.06)}
    TMPG.lineTo(tw,th);TMPG.closePath();TMPG.fill();
    TMPG.globalCompositeOperation='source-over';
    g.drawImage(TMP,0,0,tw,th,-dw/2,-dh/2,dw,dh);
  }else g.drawImage(spr,-dw/2,-dh/2,dw,dh);
  g.restore();
}

/* ============ washing rules ============ */
const KINDS=['dots','mottle','stripe'];
function snapLook(it){return{base:it.base,layers:it.layers.slice(),dirty:it.dirty,seed:it.seed}}
function addLayer(it,c){const k=KINDS[Math.min(it.layers.length,2)];if(it.layers.length>=3)it.layers.shift();it.layers.push({c,k,seed:(R()*1e6)|0})}
/* returns a result tag that drives the dog reaction */
function washRule(it,c){
  const wasDirty=!!it.dirty;it.dirty=null;let res;
  const top=it.layers.length?it.layers[it.layers.length-1].c:null;
  if(it.base==='white'){it.base=c;it.layers=[];res='dye'}
  else if(it.base===c){if(it.layers.length){it.layers=[];res='solid'}else res=wasDirty?'clean':'shine'}
  else if(!wasDirty&&top===c&&it.lastC===c){it.base=c;it.layers=[];res='redye'}
  else{addLayer(it,c);res='pattern'}
  it.lastC=c;it.washes++;S.washLog.push(c);if(S.washLog.length>24)S.washLog.shift();
  return res;
}

/* ============ items ============ */
function makeItem(type,base,dirty){
  return{id:++IID,type,base,layers:[],dirty,lastC:null,washes:0,seed:(R()*1e6)|0,st:'pile',home:'pile',x:0,y:0,rot:0,sc:1,slot:-1,
    dyeT:1,prev:null,vx:0,vy:0,bob:rnd(TAU),wash:null,fly:null,pid:null,tx:0,ty:0,res:null,lineX:0,hop:0,backT:0,bx:0,by:0,wig:0};
}
function findItem(type){for(const it of S.items)if(it.type===type)return it;return null}
function itemShape(it){return it.type}
function itemScale(it){return L.is}
function itemHome(it){
  if(it.home==='pile'){const s=L.slots[it.slot]||L.slots[0];return{x:s.x,y:s.y}}
  if(it.home==='hook'){const w=L.win;return{x:w.x-w.w*0.22,y:w.y-w.h*0.08}}
  if(it.home==='stall'){const w=L.win;return{x:w.x+w.w*0.3,y:w.y+w.h*0.26}}
  if(it.home==='line'){const lx=PORT?VW*0.72:VW*0.56;return{x:lx,y:lineYAt(lx)+ISZ.towel[1]*0.42*L.is}}
  if(it.home==='worn'){const d=ownerDog(it);if(d)return dogPoint(d,'catch');}
  return{x:VW/2,y:VH/2};
}
function ownerDog(it){const m={sock:2,hat:0,shirt:1,towel:1,apron:0};return m[it.type]===undefined?null:S.dogs[m[it.type]]}
function itemAvail(it){return it.st==='pile'||it.st==='sel'||(it.st==='hook'&&S.win.fog<0.35)||(it.st==='stall')||it.st==='line'}
function itemR(it){const z=ISZ[it.type];return Math.max(z[0],z[1])*0.5*L.is*(it.st==='stall'||it.st==='hook'?0.85:1)+10}

/* ============ background (cached) ============ */

  g.fillStyle=sg;g.fillRect(b.x0,b.y0,w,hz-b.y0+4);
  /* far hills */
  [['#c9e0b4',hz-70*s,0.9],['#b4d39a',hz-38*s,1.3]].forEach((hl,j)=>{
    g.fillStyle='rgba(70,50,20,0.12)';g.beginPath();g.moveTo(b.x0,hz+4);

    g.fillStyle=hl[0];g.beginPath();g.moveTo(b.x0,hz+4);
    for(let x=b.x0;x<=b.x1+40;x+=40){g.lineTo(x,hl[1]+Math.sin(x*0.012*hl[2]+j*2)*16*s)}g.lineTo(b.x1+40,hz+4);g.fill();
  });
  /* houses */
  const wl=L.win.x-L.win.w/2-46*s,wr=L.win.x+L.win.w/2+46*s;
  const hc=['#f2c7a5','#e9d9b0','#c9dbe8','#f0bcb6','#d8cbe8','#cfe3c3'],rc=['#c46a4f','#7f9fbf','#a7745a','#d28f6a','#8a7fb5','#6f9f7b'];
  let x=b.x0-20;

/* ---- idle behaviour & personality ---- */
function wantItem(d){
  if(S.phase!=='wash')return null;
  for(const it of S.items){const o=ownerDog(it);if(o===d&&it.dirty&&(it.st==='pile'||it.st==='sel'))return it}
  return null;
}
function chooseIdle(d){
  const others=S.dogs.filter(o=>o!==d);
  const r=R();const w=d.wear;
  if(S.phase==='night')return;
  if(d.i===2&&d.nose>0.2){push(d,{type:'sneeze'});return}
  if(d.i===0&&w.hat&&!w.hat.dirty&&r<0.3){push(d,{type:'mirror'});return}
  if(d.i===1&&w.shirt&&!w.shirt.dirty&&r<0.3){push(d,{type:'show'});return}
  if(d.i===2&&w.socks&&!w.socks.dirty&&r<0.35){push(d,{type:'hop',pts:genHopPath(d,3+((R()*3)|0))});return}
  const mine=dogColor(d);
  const rich=others.find(o=>dogColor(o)&&!mine);
  if(rich&&r<0.6){push(d,{type:'envy',target:rich,dur:1.6});return}
  const o=pick(others);
  if(idleDogOK(o)&&!o.dance&&!d.dance&&r<0.75){push(d,{type:'laugh',other:o,snd:true});push(o,{type:'laugh',other:d});return}
  d.glance={x:o.x,y:o.y-60*dogK(o),until:S.t+1.4};
  if(S.matchKey&&R()<0.5)encore();
}
function idleDog(d,dt,T){
  const h=dogHome(d);
  if(d.dance){dancePose(d,T,dt);if(S.t>d.dance.until)d.dance=null;return}
  if(hyp(d.x-h.x,d.y-h.y)>3){walk(d,h.x,h.y,dt,T);return}
  d.face=1;T.sq=1+Math.sin(S.t*2.2+d.i)*0.015;T.tail=1+(dogColor(d)?0.8:0);
  if(S.phase==='night'){T.eyeC=0.8;T.tail=0.3;return}
  const own=wantItem(d);
  if(own){const side=own.x>=d.x?1:-1;const ang=clamp(armTo(d,own.x,own.y,side),0.3,2.6);if(side>0)T.aR=ang*0.85+Math.sin(S.t*3+d.i)*0.12;else T.aL=ang*0.85+Math.sin(S.t*3+d.i)*0.12;
    T.lean=side*0.05;T.mouth=Math.sin(S.t*0.7+d.i)>0.3?'o':'smile';T.tail=1.6}
  d.idleT-=dt;if(d.idleT<0){d.idleT=rnd(3.5,6.5)*d.spd;chooseIdle(d)}
}
function dancePose(d,T,dt){
  const ds=d.dance;let t=S.t-ds.t0-(ds.mimic?0.3:0)+ds.phase;if(t<0)t=0;const amp=ds.mimic?0.8:1;
  T.eyeH=1;T.mouth='grin';T.tail=3;
  if(ds.style==='red'){T.by=-Math.abs(Math.sin(t*Math.PI*2))*16*amp;T.sx=Math.cos(t*Math.PI*0.5);T.aL=2.4+Math.sin(t*TAU)*0.3;T.aR=2.4-Math.sin(t*TAU)*0.3}
  else if(ds.style==='blue'){T.lean=Math.sin(t*Math.PI*1.5)*0.18*amp;T.aL=1.6+Math.sin(t*5)*0.9;T.aR=1.6+Math.sin(t*5+Math.PI)*0.9;T.by=-Math.abs(Math.sin(t*3))*5}
  else{T.by=-Math.abs(Math.sin(t*Math.PI*2))*9*amp;const cl=Math.sin(t*TAU*2)>0;T.aL=T.aR=cl?-0.55:1.0;if(!ds.mimic&&cl&&!ds.cl){SFX.clap()}ds.cl=cl;T.tilt=Math.sin(t*Math.PI)*0.12}
  if(ds.fancy){const f=(t%2)/2;if(f>0.6){T.sx=Math.cos((f-0.6)/0.4*TAU)}if(R()<dt*3)spark(d.x+rnd(-30,30),d.y-rnd(30,110)*dogK(d),COL[ds.style]||'#fff')}
  if(ds.mimic&&Math.sin(t*0.8)>0.9)T.tilt=0.3;
}
function encore(){
  const k=S.matchKey;if(!k)return;const parts=k.split('|');
  S.dogs.forEach((d,i)=>{if(idleDogOK(d)&&!d.dance)d.dance={style:parts[0],fancy:parts[1]!=='0'||parts[2]!=='0',t0:S.t,until:S.t+2.5,mimic:i===2,phase:0}});
}

function updateDog(d,dt){
  d.blinkT-=dt;if(d.blinkT<0){d.blink=0.15;d.blinkT=rnd(2,5)}if(d.blink>0)d.blink-=dt;
  const T=defPose();
  if(!d.act&&d.q.length){d.act=d.q.shift();d.act.t=0}
  if(d.act){const a=d.act;a.t+=dt;let done=false;try{done=ACT[a.type](d,a,dt,T)}catch(e){done=true}
    if(done||a.t>(a.max||14)){if(a.type==='frame'||a.type==='eat'||a.type==='mirror')d.prop=null;d.act=null;if(a.onEnd)a.onEnd()}}
  else idleDog(d,dt,T);
  /* gaze */
  let lk=null;
  if(d.act&&d.act.look)lk=d.act.look;
  else{let held=null;for(const it of S.items)if(it.st==='held'){held=it;break}
    if(held)lk={x:held.x,y:held.y};else if(d.glance&&S.t<d.glance.until)lk=d.glance;else if(S.hint)lk=S.hint;}
  if(!lk)lk={x:d.x,y:d.y+40};
  d.look.x=lerp(d.look.x,lk.x,Math.min(1,dt*8));d.look.y=lerp(d.look.y,lk.y,Math.min(1,dt*8));
  if(d.blink>0)T.eyeC=Math.max(T.eyeC,1);
  const k=1-Math.exp(-dt*16),P=d.P;
  for(const key in T){if(typeof T[key]==='number')P[key]=lerp(P[key],T[key],key==='eyeC'?(d.blink>0?1:k):k);else P[key]=T[key]}
  d.wagP+=dt*(4+P.tail*5);
  if(d.nose>0&&!(d.act&&d.act.type==='sneeze'))d.nose=Math.min(1,d.nose+dt*0.05);
}

function drawEars(g,d,P,back){

function dogHit(d,x,y){const K=dogK(d);return Math.abs(x-d.x)<28*K&&y<d.y+6&&y>d.y-118*K}

  if(d.wear.socks&&Math.abs(x-d.x)<26*K&&y>by-26*K&&y<d.y+10)return 'socks';

  if(d.wear.shirt&&Math.abs(x-d.x)<26*K&&y>by-62*K&&y<by-8*K)return 'shirt';
  return null;
}

/* ============ particles ============ */
const PMAX=220;
function addPart(p){if(S.parts.length>=PMAX)return;p.t=0;p.rot=p.rot||rnd(TAU);p.vr=p.vr||rnd(-4,4);S.parts.push(p)}
function spark(x,y,c){addPart({k:'star',x,y,vx:rnd(-30,30),vy:rnd(-60,-20),r:rnd(4,7),life:0.8,c})}
function dust(x,y){for(let i=0;i<3;i++)addPart({k:'dust',x:x+rnd(-8,8),y,vx:rnd(-30,30),vy:rnd(-30,-5),r:rnd(3,5),life:0.5})}
function burst(x,y,n,cols,k){for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(80,240);addPart({k:k||'confetti',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,r:rnd(4,8),life:rnd(1.1,1.8),c:pick(cols)})}}
function splashDrops(x,y,c,n){for(let i=0;i<n;i++){const a=-Math.PI/2+rnd(-1.2,1.2),v=rnd(90,230);addPart({k:'drop',x:x+rnd(-12,12),y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(2.5,5),life:rnd(0.6,1),c})}}
function updateParts(dt){
  for(const p of S.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.k==='drop'||p.k==='mud'){p.vy+=520*dt}else if(p.k==='confetti'){p.vy+=160*dt;p.vx*=0.98;p.vy=Math.min(p.vy,90)}
    else if(p.k==='bub'){p.vy-=20*dt;p.vx*=0.97;p.x+=Math.sin(p.t*8+p.r)*0.4}else if(p.k==='star'||p.k==='heart'){p.vy+=30*dt}else if(p.k==='dust'){p.vx*=0.94;p.vy*=0.94}}
  S.parts=S.parts.filter(p=>p.t<p.life);
}
function drawParts(g){
  for(const p of S.parts){const f=p.t/p.life,a=1-f*f;g.globalAlpha=a;
    if(p.k==='drop'){g.fillStyle=COL[p.c]||p.c;ell(g,p.x,p.y,p.r,p.r*1.2);g.fill();g.fillStyle='rgba(255,255,255,0.6)';ell(g,p.x-p.r*0.3,p.y-p.r*0.4,p.r*0.3,p.r*0.3);g.fill()}
    else if(p.k==='mud'){g.fillStyle='#7a5530';ell(g,p.x,p.y,p.r,p.r*0.8);g.fill()}
    else if(p.k==='bub'){g.strokeStyle='rgba(255,255,255,0.95)';g.lineWidth=1.2;g.fillStyle=p.c&&LT[p.c]?'rgba(255,255,255,0.25)':'rgba(255,255,255,0.3)';ell(g,p.x,p.y,p.r,p.r);g.fill();g.stroke()}
    else if(p.k==='star'){g.fillStyle=COL[p.c]||p.c;star(g,p.x,p.y,p.r,p.rot);g.fill()}
    else if(p.k==='heart'){g.fillStyle='#ef6f86';g.save();g.translate(p.x,p.y);g.scale(1,-1);heart(g,0,0,p.r);g.fill();g.restore()}
    else if(p.k==='confetti'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,Math.cos(p.t*9+p.r));g.fillStyle=COL[p.c]||p.c;g.fillRect(-p.r,-p.r*0.5,p.r*2,p.r);g.restore()}
    else if(p.k==='ring'){g.strokeStyle='rgba(255,255,255,'+(a*0.9)+')';g.lineWidth=2;ell(g,p.x,p.y,p.r*(1+f*1.5),p.r*(1+f*1.5));g.stroke()}
    else if(p.k==='dust'){g.fillStyle='rgba(200,170,120,0.6)';ell(g,p.x,p.y,p.r*(1+f),p.r*(1+f));g.fill()}
  }g.globalAlpha=1;
}

/* ============ floating bubbles (tappable) ============ */
function addBubble(x,y,c,dog){if(S.bubbles.length>=24)S.bubbles.shift();S.bubbles.push({x,y,r:dog?(PORT?30:38):rnd(9,17),vx:rnd(-20,20),vy:dog?-28:rnd(-60,-35),c,dog:!!dog,t:0,life:dog?8:rnd(4,6),dead:false})}
function popBubble(b,silent){if(b.dead)return;b.dead=true;if(!silent)SFX.pop(b.r/20);addPart({k:'ring',x:b.x,y:b.y,r:b.r,life:0.35,vx:0,vy:0});
  for(let i=0;i<(b.dog?14:5);i++){const a=rnd(TAU);addPart({k:'drop',x:b.x+Math.cos(a)*b.r,y:b.y+Math.sin(a)*b.r,vx:Math.cos(a)*80,vy:Math.sin(a)*80,r:2,life:0.4,c:b.c})}
  if(b.dog){for(let i=0;i<8;i++)addBubble(b.x+rnd(-20,20),b.y+rnd(-20,20),b.c);S.dogs.forEach(d=>{if(d.act&&d.act.type==='chase'){d.act=null}push(d,{type:'giggle'})})}
  if(S.party)S.party.inter++;}
function updateBubbles(dt){

}
function drawBubbles(g){

    g.fillStyle=gr;
    if(b.dog){g.save();g.translate(b.x,b.y);const s=b.r/30;g.scale(s,s);g.beginPath();g.arc(0,0,26,0,TAU);g.moveTo(-14,-16);g.ellipse(-22,-6,9,16,0.4,0,TAU);g.moveTo(30,-6);g.ellipse(22,-6,9,16,-0.4,0,TAU);
      g.fillStyle='rgba(230,245,255,0.45)';g.fill();g.strokeStyle='rgba(255,255,255,0.95)';g.lineWidth=2;g.stroke();
      g.fillStyle='rgba(60,80,110,0.55)';ell(g,-8,-4,2.5,3);g.fill();ell(g,8,-4,2.5,3);g.fill();ell(g,0,5,4,3);g.fill();g.fillStyle='rgba(255,255,255,0.9)';ell(g,-10,-14,4,3,0.5);g.fill();g.restore()}
    else{ell(g,b.x,b.y,b.r,b.r);g.fill();g.strokeStyle='rgba(255,255,255,0.9)';g.lineWidth=1.3;g.stroke();g.fillStyle='rgba(255,255,255,0.95)';ell(g,b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.22,b.r*0.15,-0.6);g.fill()}
  }g.globalAlpha=1;
}
function tubPuff(t,n){for(let i=0;i<n;i++)addBubble(t.x+rnd(-t.rx*0.5,t.rx*0.5),t.y-6,t.c)}

/* ============ discoveries ============ */
function discover(key,info){

/* ============ the wash cycle ============ */
function startWash(it,t){
  it.st='wash';it.wash={tub:t,t:0,sx:it.x,sy:it.y,stage:0};it.pid=null;if(S.sel&&S.sel.ref===it)S.sel=null;
}
function updateWash(it,dt){
  const w=it.wash,t=w.tub;w.t+=dt;const tt=w.t;
  if(tt<0.22){const f=easeOut(tt/0.22);it.x=lerp(w.sx,t.x,f);it.y=lerp(w.sy,t.y-34,f)-Math.sin(f*Math.PI)*20;it.rot=lerp(it.rot,0,0.2)}
  else if(tt<0.42){const f=(tt-0.22)/0.2;it.x=t.x;it.y=lerp(t.y-34,t.y+ISZ[it.type][1]*0.7*L.is,easeIn(f));it.sc=1-f*0.15;
    if(w.stage===0&&f>0.35){w.stage=1;tubImpulse(t,7);splashDrops(t.x,t.y-4,t.c,14);SFX.splash(t.c);if(it.dirty)for(let i=0;i<5;i++)addPart({k:'mud',x:t.x+rnd(-15,15),y:t.y,vx:rnd(-60,60),vy:rnd(-150,-60),r:rnd(2,4),life:0.7})}}
  else if(tt<1.0){it.y=t.y+ISZ[it.type][1]*0.7*L.is;
    if(R()<dt*30)addPart({k:'bub',x:t.x+rnd(-t.rx*0.6,t.rx*0.6),y:t.y+rnd(-4,4),vx:rnd(-10,10),vy:rnd(-60,-25),r:rnd(2,6),life:rnd(0.4,0.8),c:t.c});
    if(R()<dt*8)SFX.bubble();
    t.dent+=Math.sin(tt*30)*0.03;t.foam=Math.min(1.4,t.foam+dt*0.25);
    if(w.stage===1&&tt>0.7){w.stage=2;it.prev=snapLook(it);it.res=washRule(it,t.c);it.dyeT=0;it.washedIn=t.c}}
  else if(tt<1.5){const f=(tt-1.0)/0.5;if(w.stage===2){w.stage=3;tubImpulse(t,-6);splashDrops(t.x,t.y-6,t.c,12);SFX.jump(t.c);tubPuff(t,2)}
    it.sc=1;it.x=t.x+f*10;it.y=lerp(t.y,t.y-150*L.fy,easeOut(f));it.rot=f*TAU;
    if(R()<dt*20)addPart({k:'drop',x:it.x+rnd(-10,10),y:it.y+10,vx:rnd(-20,20),vy:30,r:rnd(2,4),life:0.6,c:t.c})}
  else{it.rot=0;startFly(it)}
  if(it.dyeT<1&&w.stage>=3)it.dyeT=Math.min(1,it.dyeT+dt*1.1);
}
function flyDest(it){
  if(it.type==='napkin'){const h=itemHome({home:'stall'});return{x:h.x,y:h.y,dog:null}}
  const d=ownerDog(it);return{x:d.x,y:dogPoint(d,'catch').y,dog:d};
}
function startFly(it){
  it.st='fly';const de=flyDest(it);
  const lx=clamp(it.x,L.lineX0+30,L.lineX1-30),dx=clamp(de.x,L.lineX0+30,L.lineX1-30);
  it.fly={t:0,stage:0,p0:{x:it.x,y:it.y},lx,dx,ride:{x:lx,w:0},dur:0.45,slide:0.35+Math.abs(dx-lx)/(PORT?520:900)};
  S.lineRiders.push(it.fly.ride);
}
function updateFly(it,dt){
  const f=it.fly;f.t+=dt;const hang=ISZ[it.type][1]*0.45*L.is;
  if(it.dyeT<1)it.dyeT=Math.min(1,it.dyeT+dt*1.1);
  if(f.stage===0){const u=clamp(f.t/f.dur,0,1);const ty=lineYAt(f.lx)+hang;
    const cx=(f.p0.x+f.lx)/2,cy=Math.min(f.p0.y,ty)-80;const e=easeOut(u);
    it.x=(1-e)*(1-e)*f.p0.x+2*(1-e)*e*cx+e*e*f.lx;it.y=(1-e)*(1-e)*f.p0.y+2*(1-e)*e*cy+e*e*ty;it.rot=Math.sin(u*Math.PI)*0.4;
    if(u>=1){f.stage=1;f.t=0;f.ride.w=10;SFX.pin();SFX.zip();const de=flyDest(it);if(de.dog&&!busyCrit(de.dog)){if(!(de.dog.act&&de.dog.act.type==='catch'))now1(de.dog,{type:'catch',item:it,max:9})}}}
  else if(f.stage===1){const u=ease(clamp(f.t/f.slide,0,1));const de=flyDest(it);f.dx=clamp(de.x,L.lineX0+30,L.lineX1-30);
    it.x=lerp(f.lx,f.dx,u);f.ride.x=it.x;f.ride.w=10+Math.sin(f.t*12)*3;it.y=lineYAt(it.x)+hang;it.rot=Math.sin(f.t*10)*0.15*(1-u*0.5)+(f.dx>f.lx?-0.12:0.12)*Math.sin(u*Math.PI);
    if(f.t>=f.slide){f.stage=2;f.t=0;f.p0={x:it.x,y:it.y};f.ride.w=0;S.lineRiders=S.lineRiders.filter(r=>r!==f.ride);SFX.boing(0.8)}}
  else{const u=clamp(f.t/0.5,0,1);const de=flyDest(it);
    it.x=lerp(f.p0.x,de.x,u);it.y=lerp(f.p0.y,de.y,easeIn(u))-Math.sin(u*Math.PI)*30;it.rot=Math.sin(u*TAU)*0.2;
    if(u>=1)receive(it)}
}
function clearRider(it){if(it.fly&&it.fly.ride)S.lineRiders=S.lineRiders.filter(r=>r!==it.fly.ride)}

/* dog receives a washed item: the reaction depends on item & result */
function receive(it){
  clearRider(it);it.fly=null;
  if(it.type==='napkin'){it.st='stall';it.home='stall';SFX.catchIt();napkinDecor(it);return}
  const d=ownerDog(it);if(d.act&&d.act.type==='catch')d.act.got=true;
  SFX.catchIt();SFX.yip(d.i);it.st='worn';it.home='worn';
  const res=it.res;
  if(it.type==='sock'){d.wear.socks=it;push(d,{type:'wear'});
    const c=it.lastC||it.base;
    push(d,{type:'hop',pts:genHopPath(d,6+((R()*3)|0))});
    if(!S.disc.prints){push(d,{type:'sneeze'})}else if(R()<0.4)push(d,{type:'sneeze'});
    setTimeout0(()=>{const n=Object.keys(S.printColors).length;if(S.printColors[c]>0){if(c==='red'||!S.disc.prints)discover('prints',c);if(n>=2)discover('prints2',Object.keys(S.printColors).join(','))}},2.5);
  }
  else if(it.type==='hat'){d.wear.hat=it;push(d,{type:'wear'});
    if(res==='pattern'){const n=it.layers.length;push(d,{type:'spin',n:n>=2?2:1,big:n>=2});if(n>=1)discover('dots',it.layers.map(l=>l.c+':'+l.k).join(','));if(n>=2)discover('dots2',it.layers.map(l=>l.c+':'+l.k).join(','))}
    else push(d,{type:'mirror'});
  }
  else if(it.type==='shirt'){d.wear.shirt=it;push(d,{type:'wear'});push(d,{type:'show'})}
  else if(it.type==='apron'){d.wear.apron=it;push(d,{type:'wear'});if(S.stall.open<1&&!S.stall.opening){S.stall.opening=true;push(d,{type:'openStall',max:20})}else push(d,{type:'spin',n:1})}
  else if(it.type==='towel'){it.st='prop';d.prop='towel';d.propItem=it;
    if(!S.win.clear)push(d,{type:'wipe',max:20});else push(d,{type:'waveTowel'})}
  if(it.type==='hat'||it.type==='shirt')setTimeout0(checkMatch,1.2);
}
/* tiny scheduler on game time */
const TIMERS=[];function setTimeout0(fn,s){TIMERS.push({at:S.t+s,fn})}
function runTimers(){for(let i=TIMERS.length-1;i>=0;i--){if(S.t>=TIMERS[i].at){const f=TIMERS[i].fn;TIMERS.splice(i,1);try{f()}catch(e){}}}}

function napkinDecor(it){

function checkMatch(){

function startDance(style,fancy){

/* ============ held / selected item handling ============ */
function sendBack(it){it.st='back';it.backT=0;it.bx=it.x;it.by=it.y;it.pid=null;if(S.sel&&S.sel.ref===it)S.sel=null}
function updateBack(it,dt){
  it.backT+=dt;const u=easeOut(it.backT/0.45);let h;
  if(it.home==='worn'){const d=ownerDog(it);h=dogPoint(d,'catch')}else h=itemHome(it);
  it.x=lerp(it.bx,h.x,u);it.y=lerp(it.by,h.y,u)-Math.sin(u*Math.PI)*24;it.rot=lerp(it.rot,0,u);
  if(it.backT>=0.45){
    if(it.home==='worn'){const d=ownerDog(it);it.st='worn';if(it.type==='sock')d.wear.socks=it;else if(it.type==='hat')d.wear.hat=it;else if(it.type==='shirt')d.wear.shirt=it;else if(it.type==='apron')d.wear.apron=it;
      else if(it.type==='towel'){it.st='prop';d.prop='towel';d.propItem=it;push(d,{type:'waveTowel'})}
      push(d,{type:'giggle'});if(it.type==='hat'||it.type==='shirt')checkMatch()}
    else it.st=it.home;
  }
}
function pickUp(it,o){
  if(it.st==='worn'){const d=ownerDog(it);for(const k in d.wear)if(d.wear[k]===it)d.wear[k]=null;now1(d,{type:'surprise'});push(d,{type:'expect',item:it});
    if(it.type==='hat'||it.type==='shirt'){if(S.matchKey){checkMatch()}}}
  if(it.st==='prop'){for(const d of S.dogs)if(d.propItem===it){d.prop=null;d.propItem=null}}
  it.st='held';it.pid=o?o.id:null;it.wig=1;SFX.lift();if(S.sel&&S.sel.ref===it)S.sel=null;
}
function dropItem(it){
  const t=findTub(it.x,it.y);
  if(t){startWash(it,t);return}
  sendBack(it);
}
function findTub(x,y){let best=null,bd=1;for(const t of S.tubs){const dx=(x-t.x)/(t.rx*1.75),dy=(y-(t.y+4))/(t.rx*1.25);const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=t}}return best}
function updateItem(it,dt){
  if(it.hop>0)it.hop=Math.max(0,it.hop-dt*2);
  if(it.wig>0)it.wig=Math.max(0,it.wig-dt*3);
  switch(it.st){

function sheetQuads(){

function lerpQ(a,b,u,wob){const o={};for(const k of['tl','tr','bl','br']){o[k]={x:lerp(a[k].x,b[k].x,u),y:lerp(a[k].y,b[k].y,u)}}

function sheetCornersNow(){

  else if(sh.st==='up'){const u=easeIn(sh.t/0.9);q=lerpQ(Q.hang,Q.hang,0,3+u*20);const c=(Q.hang.tl.x+Q.hang.tr.x)/2;for(const k of['tl','tr','bl','br']){q[k].y-=u*VH*0.8;q[k].x=lerp(q[k].x,c,u*0.6)}}
  else{q=lerpQ(Q.hang,Q.hang,0,3);
    const c=sh.corner;if(c.held||sh.dip||c.back){q.br={x:c.x,y:c.y};const dx=c.x-Q.hang.br.x,dy=c.y-Q.hang.br.y;q.bl={x:q.bl.x+dx*0.22,y:q.bl.y+dy*0.3}}

function updateSheet(dt){
  const sh=S.sheet;if(!sh)return;sh.t+=dt;
  if(sh.st==='fall'){if(sh.t>=3.2){sh.st='ground';sh.t=0;transferPrints();SFX.paper();dust(VW/2,L.plazaBot);
      const Q=sheetQuads().ground;const pts=[Q.tl,Q.tr,{x:(Q.bl.x+Q.br.x)/2,y:Q.bl.y}];
      S.dogs.forEach((d,i)=>{d.q=d.q.filter(a=>CRIT[a.type]);if(!busyCrit(d))d.act=null;push(d,{type:'carry',x:clamp(pts[i].x,VW*0.08,VW*0.92),y:pts[i].y+10,max:30})})}}
  else if(sh.st==='ground'){
    const ready=S.dogs.every(d=>d.act&&d.act.type==='carry'&&d.act.arr);
    if((ready&&sh.t>1.2)||sh.t>7){sh.st='lift';sh.t=0;SFX.wind();S.dogs.forEach(d=>{if(d.act&&d.act.type==='carry')d.act.lift=true})}}
  else if(sh.st==='lift'){if(sh.t>=2.2){sh.st='hang';sh.t=0;SFX.pin();SFX.pin();S.dogs.forEach(d=>{if(d.act&&d.act.type==='carry')d.act.release=true;push(d,{type:'cheer'})})}}
  else if(sh.st==='hang'){
    const c=sh.corner,Q=sheetQuads().hang;
    if(c.held){c.x=lerp(c.x,c.tx,Math.min(1,dt*20));c.y=lerp(c.y,c.ty,Math.min(1,dt*20));const t=findTub(c.x,c.y);if(t)t.hover=Math.min(1,t.hover+dt*8)}

      else if(t<0.8){c.x=dp.tub.x+Math.sin(t*20)*3;c.y=dp.tub.y+6;if(!dp.hit){dp.hit=true;dipSheet(dp.tub)}}

/* affine-textured triangle */
function texTri(g,img,x0,y0,x1,y1,x2,y2,u0,v0,u1,v1,u2,v2){
  g.save();g.beginPath();const cx=(x0+x1+x2)/3,cy=(y0+y1+y2)/3,e=0.6;
  const ex=(x,y)=>{const dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy)||1;return[x+dx/l*e,y+dy/l*e]};
  const a=ex(x0,y0),b=ex(x1,y1),c=ex(x2,y2);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.closePath();g.clip();
  const den=u0*(v1-v2)+u1*(v2-v0)+u2*(v0-v1);if(Math.abs(den)<1e-6){g.restore();return}
  const m11=(x0*(v1-v2)+x1*(v2-v0)+x2*(v0-v1))/den,m12=(x0*(u2-u1)+x1*(u0-u2)+x2*(u1-u0))/den,m13=(x0*(u1*v2-u2*v1)+x1*(u2*v0-u0*v2)+x2*(u0*v1-u1*v0))/den;
  const m21=(y0*(v1-v2)+y1*(v2-v0)+y2*(v0-v1))/den,m22=(y0*(u2-u1)+y1*(u0-u2)+y2*(u1-u0))/den,m23=(y0*(u1*v2-u2*v1)+y1*(u2*v0-u0*v2)+y2*(u0*v1-u1*v0))/den;
  g.transform(m11,m21,m12,m22,m13,m23);g.drawImage(img,0,0);g.restore();
}

function updateRoof(dt){

  else if(it.type==='hat'){if(it.dirty)c=it.base==='yellow'?'blue':'yellow';else c=CN.find(x=>x!==it.base&&!it.layers.some(l=>l.c===x))||CN.find(x=>x!==it.base)}
  else if(it.type==='shirt'){const h=findItem('hat');c=h?h.base:'blue';if(c==='white')c='blue'}
  else if(it.type==='towel')c=it.base==='blue'?'yellow':'blue';

function computeHint(){
  if(S.albumOpen||S.phase==='night'||S.phase==='roof')return null;

  for(const b of S.stall.berries)if(b.st==='held'){const d=bestDog();return{kind:'dog',ref:d,x:d.x,y:d.y-60*dogK(d),r:50*dogK(d)}}
  const sh=S.sheet;
  if(sh){if(sh.st!=='hang'||sh.done||sh.dip)return null;
    if(sh.corner.held||(S.sel&&S.sel.kind==='corner')){const c=S.sheetOrder.find(x=>sh.dips.indexOf(x)<0)||S.sheetOrder[0];return tubHint(S.tubs.find(t=>t.c===c))}
    const p=cornerPos();return{kind:'corner',x:p.x,y:p.y,r:34*L.ds}}
  if(S.phase==='party'){const P=S.party;
    if(P.frame&&!P.frameTaken){const fb=frameBox();return fb?{kind:'frame',x:fb.x,y:fb.y,r:fb.w*0.75}:null}
    if(P.fed<1){const b=S.stall.berries.find(b=>b.st==='on');if(b){const p=berryPos(b.i);return{kind:'berry',ref:b,x:p.x,y:p.y,r:20*L.ds}}}

  return null;
}

  if(S.albumOpen){S.albumOpen=false;SFX.paper();return}
  if(S.album.length&&hyp(o.vx-L.book.x,o.vy-L.book.y)<36&&S.phase!=='night'){S.albumOpen=true;S.bookBounce=1;SFX.paper();return}
  if(S.phase==='night'||S.phase==='roof')return;
  if(S.party&&S.party.frame&&!S.party.frameTaken){const fb=frameBox();if(fb&&Math.abs(o.x-fb.x)<fb.w*0.8&&Math.abs(o.y-fb.y)<fb.h*0.9){takeSnapshot();return}}
  for(let i=S.bubbles.length-1;i>=0;i--){const b=S.bubbles[i];if(hyp(o.x-b.x,o.y-b.y)<b.r+12){popBubble(b);return}}
  const sh=S.sheet;
  if(sh&&sh.st==='hang'&&!sh.dip&&!sh.corner.held&&!sh.done){const c=cornerPos();if(hyp(o.x-c.x,o.y-c.y)<52*L.ds){sh.corner.held=true;sh.corner.pid=o.id;sh.corner.x=c.x;sh.corner.y=c.y;sh.corner.tx=o.x;sh.corner.ty=o.y;sh.corner.back=0;o.grab={kind:'corner'};S.sel=null;SFX.paper();return}}
  if(S.stall.open>=1){for(const b of S.stall.berries){if(b.st!=='on')continue;const p=berryPos(b.i);if(hyp(o.x-p.x,o.y-p.y)<24*L.ds){b.st='held';b.x=p.x;b.y=p.y;b.pid=o.id;o.grab={kind:'berry',b};SFX.lift();return}}}
  let best=null,bd=1e9;
  for(const it of S.items){if(!itemAvail(it)||it.pid!==null)continue;const dd=hyp(o.x-it.x,o.y-it.y);if(dd<itemR(it)&&dd<bd){bd=dd;best=it}}
  if(best){const wasSel=best.st==='sel';pickUp(best,o);best.tx=o.x;best.ty=o.y-16*L.is;o.grab={kind:'item',it:best,wasSel};return}
  for(const d of S.dogs){const w=wornHit(d,o.x,o.y);if(w&&!busyCrit(d)&&d.wear[w]){o.cand={kind:'worn',d,slot:w};return}}
  const t=tubAt(o.x,o.y);if(t){tapTub(t);return}
  for(const d of S.dogs)if(dogHit(d,o.x,o.y)){tapDog(d);return}
  if(flagsHit(o.x,o.y)){S.wig.flag=S.t;SFX.soft();S.dogs.forEach(d=>{d.glance={x:L.pole.x,y:L.pole.top,until:S.t+1.5}});return}
  const sc=sceneryHit(o.x,o.y);if(sc){S.wig[sc]=S.t;SFX.soft();return}
  if(S.sel){if(S.sel.kind==='item'&&S.sel.ref.st==='sel')sendBack(S.sel.ref);S.sel=null}
}
function onMoveStart(o){
  if(o.cand&&o.cand.kind==='worn'){const d=o.cand.d,it=d.wear[o.cand.slot];o.cand=null;if(!it||it.pid!==null)return;pickUp(it,o);it.tx=o.x;it.ty=o.y-16*L.is;o.grab={kind:'item',it}}
}
function onMove(o){
  const g=o.grab;if(!g)return;
  if(g.kind==='item'&&g.it.st==='held'&&g.it.pid===o.id){g.it.tx=o.x;g.it.ty=o.y-16*L.is}
  else if(g.kind==='corner'&&S.sheet){S.sheet.corner.tx=o.x;S.sheet.corner.ty=o.y}
  else if(g.kind==='berry'){g.b.x=o.x;g.b.y=o.y-10}
}
function onUp(o){
  const g=o.grab;
  if(g){
    if(g.kind==='item'){const it=g.it;if(it.st!=='held'||it.pid!==o.id)return;it.pid=null;
      if(!o.moved&&S.t-o.t0<0.45&&it.home!=='worn'){if(g.wasSel)sendBack(it);else{if(S.sel&&S.sel.kind==='item'&&S.sel.ref!==it&&S.sel.ref.st==='sel')sendBack(S.sel.ref);it.st='sel';it.selT=S.t;S.sel={kind:'item',ref:it};it.hop=1;SFX.boing(1.4)}}
      else dropItem(it)}
    else if(g.kind==='corner'){const sh=S.sheet;if(!sh)return;const c=sh.corner;c.held=false;c.pid=null;
      const t=o.moved?findTub(c.x,c.y):null;
      if(t)sh.dip={tub:t,t:0,x0:c.x,y0:c.y};else{c.back=1;c.bx=c.x;c.by=c.y;c.bt=0;if(!o.moved){S.sel={kind:'corner'};SFX.boing(1.4)}}}
    else if(g.kind==='berry'){const b=g.b;b.pid=null;if(b.st!=='held')return;
      if(!o.moved)feedDog(bestDog(),b);
      else{let d=null,bd2=1e9;for(const dd of S.dogs){const k=dogK(dd),q=hyp(b.x-dd.x,b.y-(dd.y-60*k));if(q<80*k&&q<bd2){bd2=q;d=dd}}if(d)feedDog(d,b);else{b.st='on';SFX.soft()}}}
  }else if(o.cand&&o.cand.kind==='worn')tapDog(o.cand.d);
}
function onCancel(o){
  const g=o.grab;
  if(g){if(g.kind==='item'&&g.it.st==='held'&&g.it.pid===o.id)sendBack(g.it);
    else if(g.kind==='corner'&&S.sheet){const c=S.sheet.corner;c.held=false;c.pid=null;c.back=1;c.bx=c.x;c.by=c.y;c.bt=0}
    else if(g.kind==='berry'&&g.b.st==='held')g.b.st='on'}
}
function evPos(e){return toWorld(e.clientX,e.clientY)}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioStart();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=evPos(e);const o={id:e.pointerId,x:p.x,y:p.y,vx:p.vx,vy:p.vy,sx:p.x,sy:p.y,t0:S.t,grab:null,cand:null,moved:false};
  PT.set(e.pointerId,o);S.idle=0;S.nextHand=4;S.hand=null;S.mimeDone=false;
  try{onDown(o)}catch(err){}
},{passive:false});
cv.addEventListener('pointermove',e=>{const o=PT.get(e.pointerId);if(!o)return;e.preventDefault();const p=evPos(e);o.x=p.x;o.y=p.y;
  if(!o.moved&&hyp(o.x-o.sx,o.y-o.sy)>10){o.moved=true;onMoveStart(o)}onMove(o);S.idle=0},{passive:false});
function endPtr(e,cancel){const o=PT.get(e.pointerId);if(!o)return;PT.delete(e.pointerId);try{cancel?onCancel(o):onUp(o)}catch(err){}}
cv.addEventListener('pointerup',e=>{e.preventDefault();endPtr(e,false)},{passive:false});
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('lostpointercapture',e=>endPtr(e,true));
function releaseAll(){for(const o of Array.from(PT.values())){try{onCancel(o)}catch(e){}}PT.clear()}
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
window.addEventListener('blur',releaseAll);

/* ============ main loop ============ */
function checkSheetStart(dt){
  const need=['sock','hat','shirt','towel','apron','napkin'];
  let ok=true;for(const ty of need){const it=findItem(ty);if(!it||it.dirty){ok=false;break}}
  if(ok){for(const it of S.items)if(it.st!=='worn'&&it.st!=='stall'&&it.st!=='line'&&it.st!=='pile'){ok=false;break}}
  if(ok&&S.dogs.some(busyCrit))ok=false;
  if(ok){S.sheetWait+=dt;if(S.sheetWait>(S.fed>0?2:12))startSheet()}else S.sheetWait=0;
}
function update(dt){
  S.t+=dt;S.idle+=dt;runTimers();
  updateTubs(dt);
  for(const it of S.items)updateItem(it,dt);
  for(const d of S.dogs)updateDog(d,dt);
  updateParts(dt);updateBubbles(dt);
  for(const b of S.stall.berries)if(b.st==='gone'&&S.t>b.respawn){b.st='on';b.t0=S.t;SFX.soft()}
  if(S.stall.opening&&!S.dogs.some(d=>(d.act&&d.act.type==='openStall')||d.q.some(a=>a.type==='openStall'))){S.stall.opening=false;if(S.stall.open<1){S.stall.open=1;stallOpened();spawnNapkin()}}
  const tw=findItem('towel');if(tw&&tw.st==='prop'&&!S.dogs.some(d=>d.propItem===tw)){tw.home=S.win.clear?'line':'pile';tw.lineX=(PORT?VW*0.72:VW*0.56);sendBack(tw)}
  if(S.phase==='wash')checkSheetStart(dt);
  if(S.sheet&&S.phase==='sheet')updateSheet(dt);
  if(S.phase==='roof')updateRoof(dt);
  if(S.phase==='party')updateParty(dt);
  if(S.phase==='night')updateNight(dt);
  S.zoom=lerp(S.zoom,S.zoomTo,Math.min(1,dt*1.6));
  S.hint=computeHint();idleGuide(dt);
  S.flash=Math.max(0,S.flash-dt*2.5);S.bookBounce-=dt;
  if(S.flyFrame){S.flyFrame.t+=dt;if(S.flyFrame.t>1.1){S.flyFrame=null;S.bookBounce=1;SFX.paper()}}
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#e9d3ab';ctx.fillRect(0,0,cv.width,cv.height);
  setWorld();const g=ctx;
  if(BG)g.drawImage(BG,BGR.x0,BGR.y0,BGR.x1-BGR.x0,BGR.y1-BGR.y0);
  drawScenery(g);
  if(S.roof)drawRoof(g,S.roof,S.phase==='night'&&S.night?1-clamp(S.night.t/1.6,0,1):1);
  drawFlags(g);
  drawWindow(g);
  if(FOOTC)g.drawImage(FOOTC,FOOTR.x0,FOOTR.y0,FOOTR.x1-FOOTR.x0,FOOTR.y1-FOOTR.y0);
  const sh=S.sheet;if(sh&&(sh.st==='fall'||sh.st==='ground'))drawSheet(g);
  drawLine(g);
  if(S.phase==='party'&&S.roof)drawBunting(g,S.roof.flags.length?S.roof.flags:S.roof.bands,1);
  for(const it of S.items)if(it.st==='line'||(it.st==='fly'&&it.fly&&it.fly.stage===1))drawItem(g,it);
  const lateHalo=S.hint&&(S.hint.kind==='tub'||(S.hint.kind==='item'&&S.hint.ref.st==='pile'));
  if(!lateHalo)drawHalo(g);
  const ds=S.dogs.slice().sort((a,b)=>a.y-b.y);for(const d of ds)drawDog(g,d);
  if(sh&&(sh.st==='hang'||sh.st==='lift'||sh.st==='up'))drawSheet(g);
  for(const t of S.tubs){drawTubBack(g,t);for(const it of S.items)if(it.st==='wash'&&it.wash.tub===t)drawWashing(g,it);drawTubFront(g,t)}
  drawBasket(g);
  if(lateHalo)drawHalo(g);
  for(const it of S.items)if(it.st==='pile')drawItem(g,it);
  for(const it of S.items)if(it.st==='sel'||it.st==='back'||(it.st==='fly'&&it.fly&&it.fly.stage!==1))drawItem(g,it);
  for(const it of S.items)if(it.st==='held')drawItem(g,it);
  for(const b of S.stall.berries)if(b.st==='held')drawBerry(g,b.x,b.y,1.4*L.ds,S.phase==='party');
  drawBubbles(g);drawParts(g);drawHand(g);
  setVirtual();
  const na=nightAlpha();
  if(na>0){g.fillStyle='rgba(38,44,92,'+na+')';g.fillRect(FX0,FY0,FX1-FX0,FY1-FY0);
    if(na>0.3){g.globalAlpha=(na-0.3)*2.5;g.fillStyle='#fff6c8';const r=rng(3);for(let i=0;i<30;i++){star(g,FX0+r()*(FX1-FX0),FY0+r()*VH*0.45,2+r()*2.5,S.t*0.3+i);g.fill()}
      g.fillStyle='#fff3c0';ell(g,VW*0.8,VH*0.1,22,22);g.fill();g.fillStyle='rgba(38,44,92,1)';ell(g,VW*0.8+10,VH*0.1-6,20,20);g.fill();g.globalAlpha=1}}
  if(S.flash>0){g.fillStyle='rgba(255,255,255,'+S.flash*0.8+')';g.fillRect(FX0,FY0,FX1-FX0,FY1-FY0)}
  if(S.flyFrame){const f=S.flyFrame,u=easeIn(f.t/1.1),c=zc();const sx=c.x+(f.x-c.x)*S.zoom,sy=c.y+(f.y-c.y)*S.zoom;
    const x=lerp(sx,L.book.x,u),y=lerp(sy,L.book.y,u)-Math.sin(u*Math.PI)*60,s=lerp(1,0.25,u);
    g.save();g.translate(x,y);g.rotate(u*0.6);g.scale(s,s);g.fillStyle='#e9b949';g.fillRect(-60,-46,120,92);
    if(f.thumb&&f.thumb.complete&&f.thumb.naturalWidth&&!f.thumb.bad)g.drawImage(f.thumb,-52,-38,104,76);else{g.fillStyle='#fff8e8';g.fillRect(-52,-38,104,76);if(S.album.length)drawFlagBands(g,S.album[S.album.length-1].bands,null,-40,-20,80,40,S.t)}
    g.restore()}
  drawBook(g);
  if(S.albumOpen)drawAlbum(g);
}
let raf=0,last=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  try{update(dt);render()}catch(e){if(!S.err){S.err=String(e&&e.stack||e);console.warn(S.err)}}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;releaseAll();if(AU.c&&AU.c.state==='running'){const p=AU.c.suspend();if(p&&p.catch)p.catch(()=>{})}}
  else{last=performance.now();if(!raf)raf=requestAnimationFrame(frame);if(AU.c&&AU.on){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});AU.next=0}}
});
let rzT=0;function onResize(){if(rzT)return;rzT=requestAnimationFrame(()=>{rzT=0;releaseAll();resize()})}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',()=>setTimeout(onResize,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);

/* test hooks (no UI): screen positions of things */
window.__gfApi={
  toScreen(x,y){const z=S.zoom,c=zc();return{x:OX+SC*(c.x+(x-c.x)*z),y:OY+SC*(c.y+(y-c.y)*z)}},
  item(type){const it=findItem(type);return it?this.toScreen(it.x,it.y):null},
  itemState(type){const it=findItem(type);return it?{st:it.st,base:it.base,layers:it.layers.map(l=>l.c+':'+l.k),dirty:it.dirty,lastC:it.lastC}:null},
  tub(c){const t=S.tubs.find(t=>t.c===c);return this.toScreen(t.x,t.y)},
  dog(i,part){const d=S.dogs[i];const p=dogPoint(d,part||'body');return this.toScreen(p.x,p.y)},
  berry(i){const p=berryPos(i);return this.toScreen(p.x,p.y)},
  corner(){if(!S.sheet)return null;const c=cornerPos();return this.toScreen(c.x,c.y)},
  frame(){const f=frameBox();return f?this.toScreen(f.x,f.y):null},
  book(){return{x:OX+SC*L.book.x,y:OY+SC*L.book.y}},
  hintTo(){const t=hintTarget(S.hint);return t?this.toScreen(t.x,t.y):null},
  hint(){return S.hint?Object.assign({kind:S.hint.kind},this.toScreen(S.hint.x,S.hint.y)):null},
  dogsBusy(){return S.dogs.map(d=>d.act?d.act.type:(d.dance?'dance':'idle'))}
};

/* ============ boot ============ */
function init(){
  S.album=loadAlbum();loadAlbumImgs();
  resize();initTubs();
  S.dogs=[0,1,2].map(makeDog);
  newCycle(true);
  S.dogs.forEach(d=>{const h=dogHome(d);d.x=h.x;d.y=h.y;d.look={x:d.x,y:d.y+40}});
  last=performance.now();raf=requestAnimationFrame(frame);
}
init();
})();
</script>
