<script>
'use strict';
(function(){
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const TAU=Math.PI*2, PI=Math.PI;
let W=1,H=1,DPR=1;
const L={T:{x0:0,y0:0,w:1,h:1},G:0,s:1,shirt:{x:0,y:0,w:1,h:1},head:{x:0,y:0,r:1},can:{x:0,y:0,w:1,h:1}};

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,r)=>v<t?Math.min(t,v+r):Math.max(t,v-r);
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const backOut=t=>{t=clamp(t,0,1)-1;const c=1.9;return 1+t*t*((c+1)*t+c);};
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const R=(a,b)=>a+(b-a)*Math.random();
const fx=f=>L.T.x0+f*L.T.w;
const Y=f=>L.T.y0+f*L.T.h;
const xfOf=px=>(px-L.T.x0)/L.T.w;
const xfU=u=>0.02+clamp(u,0,1)*0.96;
const uXf=x=>clamp((x-0.02)/0.96,0,1);

// ---------- colours ----------
const shadeCache=new Map();
function sh(hex,k){
  const key=hex+'|'+k; let v=shadeCache.get(key); if(v) return v;
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  if(k<0){r*=1+k;g*=1+k;b*=1+k;} else {r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}
  v='rgb('+(r|0)+','+(g|0)+','+(b|0)+')'; shadeCache.set(key,v); return v;
}
const dk=c=>sh(c,-0.32), lt=c=>sh(c,0.5);
const PAL={
  dot:{b:'#3f8fe2',d:'#24599f',l:'#a7d4ff'},
  line:{b:'#4b9ce6',d:'#2a63aa',l:'#b0daff'},
  round:{b:'#f6a12c',d:'#c46a10',l:'#ffe08a'},
  sun:{b:'#f8b51a',d:'#d0760c',l:'#fff1a3'},
  swirl:{b:'#47bd77',d:'#24804a',l:'#b9f2c7'},
  snow:{b:'#a597f0',d:'#6a5ac2',l:'#efebff'},
  heart:{b:'#f2659a',d:'#bf386a',l:'#ffc7dc'}
};
const TYPES=['dot','line','sun','swirl','snow','heart'];

// ---------- textures ----------
function makeTex(n,fn){const c=document.createElement('canvas');c.width=c.height=n;fn(c.getContext('2d'),n);return c;}
const paperTex=makeTex(256,(g,n)=>{
  const id=g.createImageData(n,n),d=id.data;
  for(let i=0;i<n*n;i++){const r=Math.random();const v=255-Math.pow(r,5)*80-Math.random()*9;
    d[i*4]=v;d[i*4+1]=v*0.985;d[i*4+2]=v*0.95;d[i*4+3]=255;}
  g.putImageData(id,0,0);
  g.lineWidth=0.8;
  for(let i=0;i<140;i++){g.strokeStyle='rgba(120,100,70,'+R(0.05,0.14)+')';
    const x=Math.random()*n,y=Math.random()*n,a=-0.6+Math.random()*0.4,l=5+Math.random()*18;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
});
const clothTex=makeTex(32,(g,n)=>{
  g.fillStyle='#fff';g.fillRect(0,0,n,n);
  for(let y=0;y<n;y+=2){g.fillStyle='rgba(140,128,105,'+R(0.07,0.13)+')';g.fillRect(0,y,n,1);}
  for(let x=0;x<n;x+=2){g.fillStyle='rgba(140,128,105,'+R(0.04,0.09)+')';g.fillRect(x,0,1,n);}
});
const grainTex=makeTex(64,(g,n)=>{
  for(let i=0;i<160;i++){g.fillStyle='rgba(255,255,250,'+R(0.06,0.25)+')';g.fillRect(Math.random()*n,Math.random()*n,1+Math.random()*3,1);}
  for(let i=0;i<60;i++){g.fillStyle='rgba(40,20,0,'+R(0.05,0.12)+')';g.fillRect(Math.random()*n,Math.random()*n,2,1);}
});
const glowTex=makeTex(128,(g,n)=>{const gr=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);gr.addColorStop(0,'rgba(255,236,140,1)');gr.addColorStop(0.6,'rgba(255,220,120,0.5)');gr.addColorStop(1,'rgba(255,220,120,0)');g.fillStyle=gr;g.fillRect(0,0,n,n);});
let patCloth=null,patGrainPC=null,patClothPC=null;

// ---------- audio ----------
const AU={c:null,m:null,nb:null,last:Object.create(null)};
function audioInit(){
  if(AU.c){ if(AU.c.state==='suspended'&&!document.hidden){try{AU.c.resume();}catch(e){}} return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    const c=new AC(); AU.c=c;
    const comp=c.createDynamicsCompressor(); comp.connect(c.destination);
    const m=c.createGain(); m.gain.value=0.6; m.connect(comp); AU.m=m;
    const len=c.sampleRate|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    AU.nb=b;
    const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
    if(c.resume) c.resume().catch(()=>{});
  }catch(e){AU.c=null;}
}
function okA(key,gap){
  if(!AU.c||AU.c.state==='closed'||document.hidden) return false;
  if(key){const t=performance.now(); if(AU.last[key]&&t-AU.last[key]<gap) return false; AU.last[key]=t;}
  return true;
}
function tone(f,d,type,v,f2,delay,att){
  const c=AU.c,t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(att||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+d+0.05);
}
function nz(d,type,f,q,v,f2,delay){
  const c=AU.c,t=c.currentTime+(delay||0);
  const s=c.createBufferSource(); s.buffer=AU.nb; s.loop=true;
  const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t);
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d); fl.Q.value=q;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+Math.min(0.03,d*0.3)); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl); fl.connect(g); g.connect(AU.m); s.start(t,Math.random()*0.5); s.stop(t+d+0.05);
}
const SFX={
  pop(){if(!okA('pop',40))return; tone(240,0.13,'sine',0.24,640); nz(0.06,'bandpass',2600,1.2,0.05);},
  brush(p){if(!okA('br',75))return; nz(0.07,'bandpass',1500+(p||0)*1500+Math.random()*500,1.6,0.03);},
  drip(lv){if(!okA('drip',55))return; const f=480+lv*950; tone(f,0.12,'sine',0.14,f*0.55);},
  splash(){if(!okA('spl',140))return; nz(0.3,'lowpass',1500,0.7,0.09,280);},
  wind(str){if(!okA('wind',320))return; const f=300+str*650; nz(0.85,'bandpass',f*0.7,3,0.06+str*0.04,f*1.5);},
  sun(){if(!okA('sun',150))return; [523,659,784,1047].forEach((f,i)=>tone(f,0.38,'triangle',0.1,null,i*0.06));},
  snow(){if(!okA('snow',90))return; for(let i=0;i<3;i++) tone(1500+Math.random()*1300,0.28,'sine',0.05,null,i*0.05);},
  heart(){if(!okA('heart',150))return; tone(500,0.18,'sine',0.15,760); tone(760,0.22,'sine',0.12,1020,0.12);},
  success(){if(!okA('succ',650))return; const n=[523,659,784,1047,1319];
    n.forEach((f,i)=>{tone(f,0.55,'square',0.04,null,i*0.08); tone(f,0.65,'triangle',0.1,null,i*0.08);});
    tone(1568,1.0,'sine',0.07,null,0.42); nz(0.7,'highpass',5000,0.5,0.03,null,0.35);},
  quack(){if(!okA('quack',260))return; tone(640,0.09,'square',0.05,420); tone(600,0.1,'square',0.05,400,0.13);},
  meow(){if(!okA('meow',450))return; tone(650,0.32,'triangle',0.08,990); tone(990,0.25,'triangle',0.06,600,0.28);},
  tick(sp){if(!okA('tick',85))return; nz(0.03,'bandpass',800+sp*70,4,0.035);},
  knock(){if(!okA('knock',140))return; tone(230,0.09,'sine',0.12,150);},
  hang(){if(!okA('hang',500))return; nz(0.5,'bandpass',600,2,0.08,2400); [784,988,1175,1568].forEach((f,i)=>tone(f,0.45,'triangle',0.08,null,0.2+i*0.09));},
  chime(lv){if(!okA('chime',120))return; tone(880+lv*300,0.3,'sine',0.08); tone(1320+lv*300,0.3,'sine',0.05,null,0.06);},
  note(f){if(!okA(null))return; tone(f,0.32,'triangle',0.04); },
  boing(){if(!okA('boing',200))return; tone(180,0.25,'sine',0.14,420);}
};

// ---------- world state ----------
const NB=24;
const S={};
function freshWorld(){
  S.t=0;
  S.bucket={level:0,mark:0,ov:0,wob:0};
  S.pond={v:0}; S.ducks=[];
  S.roof={snow:0,slide:0,wet:0};
  S.stream={v:0,melt:0};
  S.boat={on:false,p:0,dir:1,wob:0,fromMelt:false};
  S.road=new Float32Array(NB); S.gsnow=new Float32Array(NB);
  S.flowers=[]; const fc=['#f25c7a','#ffc93c','#ff8a3d','#b276e8','#f2475a'];
  for(let i=0;i<5;i++) S.flowers.push({x:0.75+i*0.035,m:0,open:0,hit:-9,wob:0,col:fc[i],ph:Math.random()*6});
  S.mill={a:0,sp:0.5,wob:0};
  S.kite={h:0,wob:0,up:false};
  S.cat={x:0.95,st:'idle',wet:0,t:0,face:-1,tx:0.93,wob:0,lift:0,slideT:0,jump:0};
  S.girl={x:0.165,home:0.165,umb:0,rainT:0,vx:0,sail:false,face:1,wob:0,sailT:0};
  S.clouds=[]; S.suns=[]; S.gusts=[];
  S.rainbow={a:0,x0:0.3,x1:0.7,on:false};
  S.flags={rain:0,snow:0,wind:0,sun:0,heart:0};
  S.disc={}; S.log=[];
  S.festival=null; S.hang=null; S.replay=[]; S.cycle=0; S.leavers=[];
  S.boy={sur:0,jump:0,cheer:0,hug:0,wob:0,gazeT:0,jy:0,newPop:0};
  S.airRain=0; S.airSnow=0;
}
freshWorld();
S.shirts=[];

// ---------- layout ----------
let bg=null,bgc=null,PC=null,PCg=null,PCD=null,PCDg=null;
function readSA(){
  const cs=getComputedStyle(saEl);
  return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
function layout(){
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  const sa=readSA();
  const top=sa.t, bot=H-Math.max(sa.b,4), left=sa.l, right=W-sa.r;
  const uw=right-left, uh=bot-top;
  const land=W>H*1.05;
  const aspect=land?0.86:1.1;
  let bw=(uw-20)/1.62;
  let hr=clamp(bw*0.14,18,62);
  const legs=clamp(uh*0.03,10,26);
  let bhMax=uh*0.58-hr*1.6-legs;
  let bh=bw*aspect;
  if(bh>bhMax){bh=bhMax;bw=bh/aspect;hr=clamp(bw*0.14,18,62);}
  const cx=left+uw/2;
  const sy=bot-legs-bh;
  const headY=sy-hr*0.72;
  const bTop=headY-hr*0.85;
  L.T={x0:left,y0:top,w:uw,h:Math.max(120,bTop-top)};
  L.land=land;
  L.s=Math.min(L.T.w/7,L.T.h/3.7);
  L.shirt={x:cx-bw/2,y:sy,w:bw,h:bh};
  L.head={x:cx,y:headY,r:hr};
  L.legs=legs; L.bot=bot;
  L.G=Y(0.74); L.ropeY=Y(0.05); L.cloudY=Y(0.3); L.sunY=Y(0.21);
  L.streamY=L.G+L.T.h*0.05; L.roadY=L.G+L.T.h*0.1; L.townBot=Y(1);
  const s=L.s;
  L.mx=fx(0.08); L.mhubY=L.G-s*1.75;
  L.bx=fx(0.27); L.bw2=s*0.36; L.bh=s*0.62; L.btop=L.G-L.bh;
  L.hx=fx(0.5); L.wallW=s*0.8; L.wallH=s*0.95; L.roofHalf=s*1.04; L.roofH=s*0.8;
  L.eaveY=L.G-L.wallH; L.apexY=L.eaveY-L.roofH;
  L.can={x:fx(0.02),y:L.ropeY+L.T.h*0.03,w:L.T.w*0.96,h:L.T.h*0.36};
  L.hsW=Math.max(26,Math.min(L.T.w*0.1,L.T.h*0.15)); L.hsH=L.hsW*0.95;
  L.brush=bw*BR;
  buildBG(); buildBoyCache(); canopyDirty=true; boyDirty=true; buildPaintCanvases(); rebuildThumbs();
  P.length=0; F.length=0;
}
function ropeYAt(px){const a=L.T.x0+L.T.w*0.01,b=L.T.x0+L.T.w*0.99;const t=clamp((px-a)/(b-a),0,1);return L.ropeY+Math.sin(t*PI)*L.T.h*0.035;}
function slotX(i){return fx(0.1+i*0.16);}
function roofY(px){return L.eaveY-L.roofH*Math.max(0,1-Math.abs(px-L.hx)/L.roofHalf);}
function snowThick(px){return S.roof.snow*L.s*0.32*Math.max(0,1-Math.pow(Math.abs(px-L.hx)/L.roofHalf,4));}

// ---------- drawing helpers ----------
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(0.1,r),0,TAU);}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);}
function gp(g,fill,rim){g.fillStyle=fill;g.fill();if(rim){g.lineWidth=rim;g.strokeStyle=dk(fill);g.stroke();}}
function blob(g,x,y,r,c){circ(g,x,y,r*1.12);g.fillStyle=c.d;g.fill();circ(g,x,y,r);g.fillStyle=c.b;g.fill();
  g.globalAlpha*=0.8;circ(g,x-r*0.3,y-r*0.35,r*0.36);g.fillStyle=c.l;g.fill();g.globalAlpha/=0.8;}
function heartPath(g,x,y,r){g.beginPath();g.moveTo(x,y+r*0.9);
  g.bezierCurveTo(x-r*1.3,y+r*0.1,x-r*0.9,y-r*1.0,x,y-r*0.35);
  g.bezierCurveTo(x+r*0.9,y-r*1.0,x+r*1.3,y+r*0.1,x,y+r*0.9);g.closePath();}
function rimW(){return Math.max(1.2,L.s*0.045);}

// ---------- background (static) ----------
function buildBG(){
  if(!bg){bg=document.createElement('canvas');bgc=bg.getContext('2d');}
  bg.width=cv.width; bg.height=cv.height;
  const g=bgc; g.setTransform(DPR,0,0,DPR,0,0);
  const s=L.s, G=L.G, T=L.T, rw=rimW();
  // sky
  let gr=g.createLinearGradient(0,0,0,G);
  gr.addColorStop(0,'#86cdf0');gr.addColorStop(0.7,'#bfe7f7');gr.addColorStop(1,'#e4f5f6');
  g.fillStyle=gr; g.fillRect(0,0,W,G+2);
  // soft painted far clouds
  g.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<5;i++){const x=fx(0.1+i*0.21),y=Y(0.12+(i%2)*0.07);
    for(let k=0;k<4;k++){circ(g,x+(k-1.5)*s*0.35,y+Math.sin(k*2)*s*0.06,s*(0.22+0.08*(k%2)));g.fill();}}
  // hills
  g.fillStyle='#a9d77a'; g.beginPath(); g.moveTo(0,G);
  for(let x=0;x<=W+20;x+=20){g.lineTo(x,G-s*0.55-Math.sin(x/W*7+1)*s*0.28);} g.lineTo(W,G+5);g.lineTo(0,G+5);g.fill();
  g.fillStyle='#8cc764'; g.beginPath(); g.moveTo(0,G);
  for(let x=0;x<=W+20;x+=20){g.lineTo(x,G-s*0.25-Math.sin(x/W*11+3)*s*0.16);} g.lineTo(W,G+5);g.lineTo(0,G+5);g.fill();
  // grass band
  g.fillStyle='#86c45c'; g.fillRect(0,G,W,L.roadY-G+2);
  // stream groove
  g.fillStyle='#b99a68'; g.beginPath();
  g.moveTo(fx(0.57),L.streamY-s*0.07); g.lineTo(W+4,L.streamY-s*0.07); g.lineTo(W+4,L.streamY+s*0.09); g.lineTo(fx(0.57),L.streamY+s*0.09);
  g.quadraticCurveTo(fx(0.555),L.streamY,fx(0.57),L.streamY-s*0.07); g.fill();
  // road
  g.fillStyle='#ead6aa'; g.fillRect(0,L.roadY,W,L.townBot-L.roadY+2);
  g.fillStyle='rgba(190,160,110,0.35)';
  for(let i=0;i<70;i++){ell(g,Math.random()*W,R(L.roadY+4,L.townBot-2),R(2,6),R(1,3));g.fill();}
  g.strokeStyle='rgba(150,120,80,0.5)';g.lineWidth=rw;g.beginPath();g.moveTo(0,L.roadY);g.lineTo(W,L.roadY);g.stroke();
  // meadow under the boy
  gr=g.createLinearGradient(0,L.townBot,0,H);
  gr.addColorStop(0,'#a6d872');gr.addColorStop(1,'#86c257');
  g.fillStyle=gr; g.fillRect(0,L.townBot,W,H-L.townBot);
  g.strokeStyle='rgba(60,110,40,0.5)';g.lineWidth=rw;g.beginPath();g.moveTo(0,L.townBot);g.lineTo(W,L.townBot);g.stroke();
  for(let i=0;i<40;i++){const x=Math.random()*W,y=R(L.townBot+6,H-4);
    g.fillStyle=['#fff6a8','#ffd0e0','#ffffff'][i%3];circ(g,x,y,R(1.5,3.2));g.fill();
    g.strokeStyle='rgba(60,120,40,0.6)';g.lineWidth=1.2;g.beginPath();g.moveTo(x-4,y+6);g.lineTo(x-2,y+1);g.moveTo(x+3,y+6);g.lineTo(x+2,y+1);g.stroke();}
  // clothesline poles
  g.lineCap='round';
  for(const f of [0.01,0.99]){const x=fx(f);g.strokeStyle='#9a6a3e';g.lineWidth=Math.max(3,s*0.09);
    g.beginPath();g.moveTo(x,L.ropeY-4);g.lineTo(x,G+s*0.05);g.stroke();}
  // windmill tower
  const mx=L.mx;
  g.beginPath();g.moveTo(mx-s*0.34,G+2);g.lineTo(mx-s*0.17,L.mhubY+s*0.1);g.lineTo(mx+s*0.17,L.mhubY+s*0.1);g.lineTo(mx+s*0.34,G+2);g.closePath();

function addPoint(u,v){

  squash.x=u; squash.y=v;

  const x=u*s.sx,y=v*s.sy,n=s.cx.length,lx=s.cx[n-1],ly=s.cy[n-1];
  const step=Math.max(6,L.shirt.w*0.035);

  s.cx.push(x); s.cy.push(y);
  const a=Math.atan2(y-ly,x-lx), k=s.ang.length; s.ang.push(a);

    if((Math.abs(d1)>1.5||Math.abs(d2)>2.1)&&k-s.lastCorner>=2){
      const sg=Math.sign(Math.abs(d1)>1.5?d1:d2);
      const pv=s.corners[s.corners.length-1];

  else if((s.cls===null||s.cls==='line')&&ac>=1.25*PI&&s.alt<2) setCls(s,'round');
  if(s.cls==='round'&&ac>=2.45*PI) setCls(s,'swirl');

function resampleList(list){

// ---------- festival ----------

function makeResidents(){

const KEY='otenki-tshirt-v1';

        const pts=[]; for(let i=0;i<s.p.length;i+=2){const u=s.p[i]/1000,v=s.p[i+1]/1000; if(!isFinite(u)||!isFinite(v)) throw new Error('bad'); pts.push({u:clamp(u,0,1),v:clamp(v,0,1)});}

// ---------- guidance ----------
let idleT=0, demo=null, demoShown=false, target=null;
function pickTarget(){
  if(S.hang) return null;
  const f=S.festival;
  if(f){ if(f.rise<1) return null; if(f.invite) return {kind:'peg'}; return {kind:'canopy',g:'dots'}; }
  const d=S.disc;
  const order=[];
  if(!d.duck) order.push('bucket');
  if(!d.rainbow) order.push('rainbow');
  if(!d.bloom) order.push('bloom');
  if(!d.boat) order.push('boat');
  if(!d.kite) order.push('kite');
  if(!d.canopy&&!d.festival) order.push('heart');
  let k=order[0];
  if(!k){ const all=['bucket','rainbow','bloom','boat','kite','heart']; k=all[S.cycle%all.length]; }
  switch(k){
    case 'bucket': return {kind:'shirt',x:0.27,g:'dots',obj:[L.bx,L.btop]};
    case 'rainbow': { let best=-1,bx=0.4; for(let i=0;i<NB;i++){let s=0;for(let j=Math.max(0,i-3);j<=Math.min(NB-1,i+3);j++)s+=S.road[j]; if(s>best){best=s;bx=(i+0.5)/NB;}}
      if(best>=0.5) return {kind:'shirt',x:clamp(bx,0.1,0.9),g:'circle',obj:[fx(bx),L.sunY]};
      return {kind:'shirt',x:0.38,g:'dots',obj:[fx(0.38),L.roadY]}; }
    case 'bloom': { const raining=S.clouds.some(c=>c.rain>0.5&&c.x>0.55&&c.x<0.74);
      if(raining) return {kind:'shirt',x:0.63,g:'swirl',obj:[fx(0.82),L.G-L.s*0.3]};
      return {kind:'shirt',x:0.66,g:'dots',obj:[fx(0.82),L.G-L.s*0.3]}; }
    case 'boat': return S.roof.snow<0.45?{kind:'shirt',x:0.5,g:'zigzag',obj:[L.hx,L.apexY]}:{kind:'shirt',x:0.5,g:'circle',obj:[L.hx,L.apexY]};
    case 'kite': return {kind:'shirt',x:0.09,g:'swirl',obj:[L.mx,L.mhubY]};

}
function targetPoint(t){
  if(!t) return null;
  if(t.kind==='peg'){const x=slotX(Math.min(S.shirts.length,5));return [x,ropeYAt(x)+L.hsH*0.45];}
  if(t.kind==='canopy') return [L.can.x+L.can.w*0.5,L.can.y+L.can.h*0.45];

function demoPath(t,k){ // k in 0..1 -> [x,y,down]
  const tp=targetPoint(t); if(!tp) return null;
  const sw=L.shirt.w,shh=L.shirt.h;
  const g=t.g||'dots';
  if(t.kind==='peg'||g==='dots'){ const ph=(k*3)%1; return [tp[0],tp[1]-(ph<0.4?(0.4-ph)*sw*0.25:0),ph>=0.4&&ph<0.75]; }
  const r=sw*0.13;
  if(g==='circle'){ const a=k*TAU*1.05-PI/2; return [tp[0]+Math.cos(a)*r,tp[1]+r+Math.sin(a)*r,k<0.97]; }
  if(g==='swirl'){ const a=k*TAU*3; const rr=r*(0.35+0.75*k); return [tp[0]+Math.cos(a)*rr,tp[1]+Math.sin(a)*rr,k<0.97]; }
  if(g==='zigzag'){ const x=tp[0]-r*1.4+k*r*2.8; const z=(k*6)%2; const y=tp[1]+(z<1?z:2-z)*r*0.9-r*0.45; return [x,y,k<0.97]; }

  return [tp[0]+hx/17*sw*0.36,tp[1]+hy/17*shh*0.36-shh*0.03,k<0.98];
}

// ---------- input ----------
function hitShirt(x,y){const b=L.shirt;return x>=b.x-8&&x<=b.x+b.w+8&&y>=b.y-4&&y<=b.y+b.h+8;}
function hitCanopy(x,y){const f=S.festival;if(!f||f.rise<1||S.hang)return false;const c=L.can;return x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h;}
function toUV(x,y,src){if(src==='canopy'){const c=L.can;return [(x-c.x)/c.w,(y-c.y)/c.h];} const b=L.shirt;return [(x-b.x)/b.w,(y-b.y)/b.h];}
function onDown(e){
  e.preventDefault();
  audioInit();
  idleT=0; demo=null; demoShown=false;
  if(activeId!==null) return;
  const x=e.clientX,y=e.clientY;
  // clothesline peg (festival finish)
  const f=S.festival;
  if(f&&f.invite&&!S.hang){const px=slotX(Math.min(S.shirts.length,5)),py=ropeYAt(px)+L.hsH*0.45;
    if(Math.abs(x-px)<Math.max(30,L.hsW*0.75)&&Math.abs(y-py)<Math.max(32,L.hsH*0.8)){hangShirt();return;}}
  // hung shirts
  if(!S.hang){for(let i=0;i<S.shirts.length;i++){const px=slotX(i),py=ropeYAt(px)+L.hsH*0.5;
    if(Math.abs(x-px)<Math.max(26,L.hsW*0.6)&&Math.abs(y-py)<Math.max(28,L.hsH*0.65)){restoreShirt(S.shirts[i]);return;}}}
  let src=null;
  if(hitCanopy(x,y)) src='canopy'; else if(hitShirt(x,y)&&!S.hang) src='shirt';
  if(src){
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const uv=toUV(x,y,src); startStroke(e.pointerId,clamp(uv[0],0,1),clamp(uv[1],0,1),src);
    return;
  }

}
function onMove(e){
  if(activeId===null||e.pointerId!==activeId||!cur) return;
  e.preventDefault(); idleT=0;
  const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
  const evs=list.length?list:[e];
  for(const ev of evs){const uv=toUV(ev.clientX,ev.clientY,cur.src); addPoint(uv[0],uv[1]); if(!cur) break;}
}
function onUp(e){
  if(activeId===null||e.pointerId!==activeId) return;
  e.preventDefault();
  if(cur){const uv=toUV(e.clientX,e.clientY,cur.src); if(e.type==='pointerup') addPoint(uv[0],uv[1]); endStroke();}
  activeId=null;
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
}
function poke(x,y){
  // non-target objects: tiny wobble only
  const s=L.s; let hit=false;
  const near=(px,py,r)=>Math.hypot(x-px,y-py)<r;
  if(near(L.bx,L.btop+L.bh*0.4,s*0.6)){S.bucket.wob=1;hit=true;}
  else if(near(fx(S.cat.x),catY(),s*0.5)){S.cat.wob=1;SFX.meow();hit=true;}
  else if(near(fx(S.girl.x),L.G-s*0.4,s*0.5)){S.girl.wob=1;hit=true;}
  else if(near(L.head.x,L.head.y,L.head.r*1.3)){S.boy.wob=1;SFX.boing();hit=true;}
  else if(near(L.mx,L.mhubY,s*0.9)){S.mill.wob=1;hit=true;}
  else{for(const f of S.flowers){if(near(fx(f.x),L.G-s*0.35,s*0.3)){f.wob=1;hit=true;}}
    for(const c of S.clouds){if(near(fx(c.x),L.cloudY,s*0.8)){c.wob=1;hit=true;}}
    for(const sn of S.suns){if(near(fx(sn.x),L.sunY,s*0.7)){sn.wob=1;hit=true;}}
    for(const d of S.ducks){if(near(duckX(d),L.streamY,s*0.35)){d.wob=1;SFX.quack();hit=true;}}}
  if(hit) SFX.knock();
}

// ---------- update ----------
function update(dt){
  S.t+=dt;
  const s=L.s;
  // replay queue
  if(S.replay.length){ for(let i=S.replay.length-1;i>=0;i--){const r=S.replay[i]; if(S.t>=r.t){S.replay.splice(i,1); strokeWeather(r.s,r.amp);}} }
  // hold to grow rain
  if(cur){
    if(S.t-cur.lastMove>0.25&&cur.len<TAPF*L.shirt.w*1.5){
      cur.hold=Math.min(1,cur.hold+dt*0.7); cur.holdAcc+=dt;
      if(cur.holdAcc>=0.35){cur.holdAcc=0; emit('rain',cur.pts[0].u,cur.pts[0].v,2,cur.src); SFX.pop();}
    }
  }
  // squash spring

    if(r.k==='rain'){ const bi=clamp(Math.floor(r.x*NB),0,NB-1); r.y=Math.abs(Math.sin(r.t*5))*L.s*0.3; if(r.y<L.s*0.03&&S.road[bi]>0.15&&Math.random()<0.5) splashAt(fx(r.x),L.roadY+L.T.h*0.06,'#8fd0ff',2); }
    else if(r.k==='snow'&&S.roof.slide>0.4){ r.st='slide'; r.t=0; }

  }

}

function drawRainbow(){

function canopyPath(g,x,y,w,h,k){
  const n=8; g.beginPath(); g.moveTo(x,y+h*0.05);
  for(let i=1;i<=16;i++){const t=i/16; g.lineTo(x+w*t,y+Math.sin(t*PI)*h*0.08+h*0.05*(1-Math.sin(t*PI)));}
  g.lineTo(x+w,y+h*0.85);
  for(let i=n;i>0;i--){const x1=x+w*i/n,x0=x+w*(i-1)/n; g.quadraticCurveTo((x0+x1)/2,y+h*(1.05+0.04*Math.sin(S.t*2+i)*k),x0,y+h*0.85);}
  g.closePath();
}
function drawCanopy(){
  const f=S.festival, hg=S.hang;

    if(hg){ const t=sstep(hg.t/1.2); const sx=slotX(hg.slot), sy=ropeYAt(sx); rect={x:lerp(c.x,sx-L.hsW*0.33,t),y:lerp(c.y,sy+L.hsH*0.12,t),w:lerp(c.w,L.hsW*0.66,t),h:lerp(c.h,L.hsH*0.82,t)}; img=hg.img; }
    else { rect={x:lerp(sb.x,c.x,k),y:lerp(sb.y,c.y,k),w:lerp(sb.w,c.w,k),h:lerp(sb.h,c.h,k)}; img=PCD; alpha=Math.min(1,0.4+k); }
  } else return;

    const c=L.can; ctx.drawImage(canopyImage(),c.x,c.y+(f.touch||0)*2,c.w,c.h*1.12);

  }
  ctx.save(); ctx.globalAlpha=alpha;
  const sw=Math.sin(S.t*1.3)*0.01;
  ctx.translate(rect.x+rect.w/2,rect.y); ctx.scale(1+sw+(f.touch||0)*0.01,1-sw); ctx.translate(-rect.x-rect.w/2,-rect.y);
  canopyPath(ctx,rect.x,rect.y,rect.w,rect.h,1);

  ctx.restore();
  canopyPath(ctx,rect.x,rect.y,rect.w,rect.h,1); ctx.lineWidth=rimW(); ctx.strokeStyle='#c9b48e'; ctx.stroke();
