/* ============================================================

const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const backOut=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

let VW=0,VH=0,DPR=1,SA={t:0,r:0,b:0,l:0};

}

/* ---------------- 保存（端末内のみ・失敗しても遊べる） ---------------- */
const SAVE_KEY='gf261030_19_nezumi_v1';
const KINDS=['glutton','shy','prank','baby'];
let save={ribbons:[],chairs:[null,null,null,null],theme:0,giant:false,cycles:0};
let hadSave=false;
function loadSave(){
  try{
    const raw=window.localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object') throw new Error('bad');
    const ok=k=>KINDS.includes(k);
    save.ribbons=Array.isArray(o.ribbons)?o.ribbons.filter(ok).filter((k,i,a)=>a.indexOf(k)===i).slice(0,4):[];
    save.chairs=[0,1,2,3].map(i=>Array.isArray(o.chairs)&&ok(o.chairs[i])?o.chairs[i]:null);
    save.theme=Number.isInteger(o.theme)?((o.theme%5)+5)%5:0;
    save.giant=!!o.giant;
    save.cycles=Number.isInteger(o.cycles)&&o.cycles>=0?Math.min(o.cycles,99999):0;
    return true;
  }catch(e){
    save={ribbons:[],chairs:[null,null,null,null],theme:0,giant:false,cycles:0};
    return false;
  }
}
let saveTimer=0;

/* ---------------- 音（Web Audio 合成） ---------------- */
let AC=null,master=null,noiseBuf=null,voices=0;
function initAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C) return;
      AC=new C();
      master=AC.createGain();master.gain.value=.6;
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-16;comp.ratio.value=4;
      master.connect(comp);comp.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();
      s.buffer=b;s.connect(AC.destination);s.start(0);
    }
    if(AC.state==='suspended') AC.resume();
  }catch(e){AC=null;}
}
function canPlay(){return AC&&AC.state==='running'&&voices<26;}
function track(d){voices++;setTimeout(()=>{voices--;},(d+.1)*1000);}
function tone(type,f0,f1,dur,vol,delay=0,vib=0){
  if(!canPlay())return;
  const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib;lg.gain.value=f0*.04;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05);}
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.02,dur*.3));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);track(dur+delay);
}
function noise(dur,vol,ft,f0,f1,q=1,delay=0){
  if(!canPlay())return;
  const t=AC.currentTime+delay;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.03,dur*.3));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);track(dur+delay);
}
const SND={
  puff(p=1){noise(.2,.45,'lowpass',900*p,260*p,.8);tone('sine',150*p,70*p,.16,.3);},
  soft(p=1){noise(.12,.22,'lowpass',700*p,300*p,.7);},
  click(){tone('triangle',1900,1500,.035,.22);noise(.025,.15,'highpass',3200,3000,1);},
  tick(i){tone('sine',i%2?1300:980,i%2?1180:900,.07,.28);noise(.02,.08,'bandpass',2500,2500,4);},
  squeak(p=1){tone('sine',1250*p,1900*p,.13,.16,0,28);},
  squeak2(p=1){tone('sine',1700*p,1200*p,.12,.14,0,22);tone('sine',1500*p,2100*p,.1,.12,.12,22);},
  chime(){[523,659,784,1047,1319].forEach((f,i)=>{tone('triangle',f,f,.6,.17,i*.08);tone('sine',f*2,f*2,.35,.05,i*.08+.02);});},
  pop(i=0){tone('sine',620+i*45,980+i*45,.07,.14);},
  thread(){tone('sine',700,1500,.32,.07);noise(.3,.08,'bandpass',2000,4000,3);},
  whoosh(d=1.1){noise(d,.32,'bandpass',260,2600,1.6);},
  bigOpen(){SND.whoosh(1.3);[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone('triangle',f,f,.7,.15,.25+i*.09));tone('sine',130,65,.5,.35,.2);},
  munch(){for(let i=0;i<4;i++)noise(.06,.28,'bandpass',1700-i*120,1200,3,i*.13);},
  cheer(p=1){[0,1,2].forEach(i=>tone('sine',(1300+i*260)*p,(1800+i*300)*p,.12,.13,i*.11,30));for(let i=0;i<4;i++)noise(.04,.22,'highpass',1800,1600,1,.1+i*.14);},
  whee(){tone('sine',600,1700,.45,.12,0,6);},
  bump(p=1){tone('sine',110*p,55,.14,.32);noise(.08,.18,'lowpass',500,200,1);},
  flip(){noise(.35,.25,'lowpass',2000,500,.7);tone('triangle',660,990,.18,.08,.15);},
  call(){tone('sine',1500,2300,.16,.14,0,10);tone('sine',1500,2300,.16,.14,.22,10);tone('sine',1800,2600,.2,.14,.44,10);},
  snore(){noise(.5,.06,'lowpass',400,250,.6);},
  ribbon(){tone('triangle',880,1320,.18,.12);tone('triangle',1320,1760,.18,.1,.1);},
  clink(){tone('sine',2600,2500,.25,.08);tone('sine',3300,3200,.2,.05,.03);},
  giggle(p=1){for(let i=0;i<4;i++)tone('sine',(1500+(i%2)*300)*p,(1700+(i%2)*300)*p,.06,.11,i*.08);},
};

/* ---------------- フェルト・模様のテクスチャ ---------------- */
let feltPat=null,wallPat=null,atticPat=null,floorPat=null;
const ribPats=[];
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function buildTextures(){
  let c=mkCanvas(96,96),g=c.getContext('2d');
  for(let i=0;i<1100;i++){
    const x=Math.random()*96,y=Math.random()*96,a=Math.random()*TAU,l=1.5+Math.random()*4.5;
    g.strokeStyle=Math.random()<.55?'rgba(255,255,255,.20)':'rgba(70,45,30,.09)';
    g.lineWidth=.5+Math.random()*.7;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  feltPat=cx.createPattern(c,'repeat');
  // 起毛した壁紙（ミント＋クリームの小花）
  c=mkCanvas(80,80);g=c.getContext('2d');
  g.fillStyle='#bfe7d4';g.fillRect(0,0,80,80);
  const flower=(x,y,s,col)=>{g.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;g.beginPath();g.ellipse(x+Math.cos(a)*4*s,y+Math.sin(a)*4*s,3.2*s,2.2*s,a,0,TAU);g.fill();}
    g.fillStyle='#f7c873';g.beginPath();g.arc(x,y,1.8*s,0,TAU);g.fill();};
  flower(20,20,1.1,'rgba(255,248,228,.9)');flower(60,60,1.1,'rgba(255,248,228,.9)');
  g.fillStyle='rgba(150,210,188,.9)';[[60,18],[20,62],[40,40]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,2.4,0,TAU);g.fill();});
  for(let i=0;i<500;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.12)':'rgba(40,110,90,.06)';g.fillRect(Math.random()*80,Math.random()*80,1.2,1.2);}
  wallPat=cx.createPattern(c,'repeat');
  // 屋根裏の壁紙（クリーム＋ミントの縦ストライプ刺繍）
  c=mkCanvas(64,64);g=c.getContext('2d');
  g.fillStyle='#fff3d8';g.fillRect(0,0,64,64);
  g.fillStyle='rgba(158,218,196,.55)';g.fillRect(0,0,14,64);
  g.strokeStyle='rgba(110,180,150,.7)';g.setLineDash([4,4]);g.lineWidth=1.4;
  g.beginPath();g.moveTo(22,0);g.lineTo(22,64);g.stroke();
  g.fillStyle='rgba(246,170,150,.6)';g.beginPath();g.arc(42,32,2.6,0,TAU);g.fill();
  atticPat=cx.createPattern(c,'repeat');
  // 床（キャラメルのフェルト板）
  c=mkCanvas(120,40);g=c.getContext('2d');
  g.fillStyle='#ecd2a9';g.fillRect(0,0,120,40);
  g.strokeStyle='rgba(160,110,70,.45)';g.setLineDash([5,4]);g.lineWidth=1.6;
  g.beginPath();g.moveTo(0,38);g.lineTo(120,38);g.moveTo(60,0);g.lineTo(60,38);g.stroke();
  for(let i=0;i<300;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.14)':'rgba(120,70,40,.06)';g.fillRect(Math.random()*120,Math.random()*40,1.5,1);}
  floorPat=cx.createPattern(c,'repeat');
  // リボン模様（ねずみごと固有）
  RIB.forEach((r,i)=>{
    const c2=mkCanvas(20,20),q=c2.getContext('2d');
    q.fillStyle=r.c;q.fillRect(0,0,20,20);q.fillStyle=r.c2;q.strokeStyle=r.c2;
    if(r.pat==='dots'){q.beginPath();q.arc(5,5,2.6,0,TAU);q.arc(15,15,2.6,0,TAU);q.fill();}
    else if(r.pat==='stripes'){q.fillRect(0,0,20,5);q.fillRect(0,10,20,5);}
    else if(r.pat==='zig'){q.lineWidth=3;q.beginPath();q.moveTo(0,12);q.lineTo(5,6);q.lineTo(10,12);q.lineTo(15,6);q.lineTo(20,12);q.stroke();}
    else{star(q,10,10,5,2.2);q.fill();}
    ribPats[i]=cx.createPattern(c2,'repeat');
  });
}
function star(g,x,y,r1,r2,n=5){g.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?r2:r1;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();}

/* ---------------- 描画ヘルパー ---------------- */
function rrp(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function ellp(x,y,rx,ry,rot=0){cx.beginPath();cx.ellipse(x,y,Math.abs(rx)+.01,Math.abs(ry)+.01,rot,0,TAU);}
function vg(y0,y1,c0,c1){const g=cx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g;}
function felt(fill,a=.6){cx.fillStyle=fill;cx.fill();if(feltPat&&a>0){cx.save();cx.globalAlpha*=a;cx.fillStyle=feltPat;cx.fill();cx.restore();}}
function stitch(col,lw=2.2,dash){cx.save();cx.setLineDash(dash||[6,5]);cx.lineWidth=lw;cx.strokeStyle=col;cx.lineCap='round';cx.stroke();cx.restore();}
function edge(col,lw=2){cx.lineWidth=lw;cx.strokeStyle=col;cx.stroke();}
function hilite(x,y,r,a=.35){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.fill();}
function shade(x,y,r,a=.2){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(60,40,40,'+a+')');g.addColorStop(1,'rgba(60,40,40,0)');cx.fillStyle=g;cx.fill();}
function softShadow(x,y,rx,ry,a=.22){if(rx<1)return;cx.save();cx.translate(x,y);cx.scale(1,ry/rx);const g=cx.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(70,50,40,'+a+')');g.addColorStop(1,'rgba(70,50,40,0)');cx.fillStyle=g;cx.beginPath();cx.arc(0,0,rx,0,TAU);cx.fill();cx.restore();}
function puffRR(x,y,w,h,r,c0,c1,thread,inset=7,hl=.32){
  rrp(x,y,w,h,r);felt(vg(y,y+h,c0,c1));hilite(x+w*.32,y+h*.25,Math.max(w,h)*.6,hl);
  if(thread){rrp(x+inset,y+inset,w-inset*2,h-inset*2,Math.max(1,r-inset));stitch(thread);}
}
function puffEl(x,y,rx,ry,c0,c1,thread,inset=6,hl=.35){
  ellp(x,y,rx,ry);felt(vg(y-ry,y+ry,c0,c1));hilite(x-rx*.3,y-ry*.35,Math.max(rx,ry)*.9,hl);
  if(thread){ellp(x,y,rx-inset,ry-inset);stitch(thread);}
}

function mkMouse(kind){return {kind,x:0,y:0,face:1,hop:0,sq:0,rot:0,found:false,spot:null,hs:'hidden',peek:0,floor:'L',q:[],
  pose:'stand',expr:'n',blinkT:rnd(1,4),blink:0,earW:0,lx:0,ly:0,ph:Math.random()*9,tapN:0,tapT:0,cheek:0,act:null,
  attach:null,seatId:null,carry:null,idleT:rnd(1,3),walkPh:0,walking:false,eats:0,lane:rnd(-6,6),crown:0,joy:0,hintT:rnd(3,6),
  spotlit:0,duck:0,shake:0};}

function assignSpots(canonical){
  const lower=['desk','bed','hole'];
  let order=canonical?['glutton','prank','shy']:shuffle(['glutton','prank','shy']);
  order.forEach((k,i)=>{const m=M[k];m.spot=lower[i];});
  S.attic.babySpot=canonical?'box':pick(['box','door']);
  M.baby.spot=S.attic.babySpot;
  KINDS.forEach(k=>{const m=M[k];m.found=false;m.hs='hidden';m.peek=0;m.q=[];m.attach=null;m.seatId=null;m.carry=null;m.act=null;m.pose='stand';m.expr='n';m.rot=0;
    const p=spotPos(m.spot);m.x=p.x;m.y=p.y;m.floor=(m.spot==='box'||m.spot==='door')?'A':'L';});
}

/* ---------------- 位置計算 ---------------- */
function spotPos(sp){
  switch(sp){
    case 'desk':return {x:L.desk.x+L.desk.w/2,y:L.desk.by};
    case 'bed':return {x:L.bed.x+L.bed.w*.55,y:L.bed.by};
    case 'hole':return {x:L.hole.x,y:L.hole.y};
    case 'box':return {x:L.box.x,y:L.AFY};
    case 'door':return {x:L.door.x,y:L.AFY};
  }
  return {x:L.RW/2,y:L.MY};
}
function plateY(){return L.stool.by-70;}
function flHome(id){
  switch(id){
    case 'cushion':return {x:L.cushion.x,y:L.cushion.y-L.cushion.h/2};
    case 'yarn':return {x:L.yarn.x,y:L.yarn.y-L.yarn.r};
    case 'books':return {x:L.books.x,y:L.books.y-24};
    case 'blanket':return {x:L.bed.x+L.bed.w/2+6,y:L.bed.top-4};
  }
}
function flPos(id){const h=flHome(id),f=S.fl[id];return {x:h.x+f.ox,y:h.y+f.oy};}
function flSize(id){switch(id){case 'cushion':return {w:L.cushion.w,h:L.cushion.h};case 'yarn':return {w:L.yarn.r*2,h:L.yarn.r*2};case 'books':return {w:70,h:48};case 'blanket':return {w:194,h:40};}}
function cushionLifted(){return S.fl.cushion.oy<-55;}
function blanketUp(){return S.fl.blanket.oy<-60;}
function lightTarget(i){
  switch(LT[i]){
    case 'desk':return {x:L.desk.x+L.desk.w/2,y:L.desk.by-26};
    case 'bed':return {x:L.bed.x+L.bed.w*.55,y:L.bed.by-14};
    case 'hole':return {x:L.hole.x,y:L.hole.y-14};
    case 'plate':return {x:L.stool.x,y:plateY()};
    case 'up':{const p=flPos('blanket');return {x:p.x,y:p.y-(S.rider?40:0)};}
  }
  return {x:L.lamp.hx+(L.p?110:150),y:L.MY-8};
}
function lampHead(){return {x:L.lamp.hx,y:L.lamp.hy};}
function knobPos(k){
  if(k==='light')return {x:L.lk.x,y:L.lk.y,r:L.lk.r};
  if(k==='weight'){const h=lampHead();return {x:h.x,y:h.y-4,r:44};}
  return {x:L.clock.x,y:L.clock.y,r:L.clock.r};
}
function cakePos(){return {x:L.table.x,y:L.AFY-128};}
function chairX(i){return L.chairs[i]+S.party.chairOff[i];}
function seatPos(id){
  if(id[0]==='c'){const i=+id[1];return {x:chairX(i),y:L.AFY-46,air:false};}
  const i=+id[1],a=L.air[i];return {x:a[0],y:a[1]+Math.sin(T*1.4+i*2)*6,air:true};
}
function floorY(f){return f==='A'?L.AFY:L.MY;}
function airA(){return S.party.airA||0;}

/* ---------------- パーティクル ---------------- */
function addP(o){if(particles.length>=MAXP)particles.shift();particles.push(Object.assign({x:0,y:0,vx:0,vy:0,life:1,max:1,type:'fluff',col:'#fff',s:6,rot:Math.random()*TAU,vr:rnd(-3,3),g:0},o));}
function fluff(x,y,n=4,col='#fffaf0'){for(let i=0;i<n;i++)addP({x:x+rnd(-12,12),y:y+rnd(-10,10),vx:rnd(-50,50),vy:rnd(-70,-10),life:rnd(.7,1.2),max:1.2,type:'fluff',col,s:rnd(4,8),g:-10});}
function sparkle(x,y,n=8,cols){cols=cols||['#ffd56b','#ff9fb8','#8fe0c4','#b9a6ff','#fff3c4'];for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(60,180);addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rnd(.7,1.2),max:1.2,type:'star',col:pick(cols),s:rnd(6,11),g:120});}}
function confetti(x,y,n=12){for(let i=0;i<n;i++)addP({x:x+rnd(-80,80),y:y+rnd(-20,20),vx:rnd(-90,90),vy:rnd(-200,-60),life:rnd(1.2,2),max:2,type:'conf',col:pick(['#f6b26b','#8fd8c0','#f7a1b5','#fff0b0','#b7a8f0']),s:rnd(7,11),g:200});}
function hearts(x,y,n=3){for(let i=0;i<n;i++)addP({x:x+rnd(-14,14),y,vx:rnd(-20,20),vy:rnd(-80,-50),life:1.1,max:1.1,type:'heart',col:pick(['#f48aa4','#f6a46b','#ffd36b']),s:rnd(7,10),g:-10});}
function zzz(x,y){addP({x,y,vx:rnd(6,16),vy:-26,life:1.6,max:1.6,type:'bubble',col:'rgba(255,255,255,.85)',s:rnd(4,7),g:0});}
function crumbs(x,y){for(let i=0;i<4;i++)addP({x,y,vx:rnd(-60,60),vy:rnd(-90,-30),life:.6,max:.6,type:'crumb',col:pick(['#ffd979','#f5c36a','#fff1c0']),s:rnd(3,5),g:300});}
function threads(x,y,n=3){for(let i=0;i<n;i++)addP({x:x+rnd(-6,6),y,vx:rnd(-40,40),vy:rnd(10,60),life:1.2,max:1.2,type:'thread',col:'#f3c64e',s:rnd(8,14),g:60});}

/* ---------------- ねずみの行動（タスクキュー） ---------------- */
function mSpeed(m){
  let s=m.kind==='baby'?95:m.kind==='shy'?105:125;
  if(S.time===1)s*=1.7;
  if(S.time===2)s*=.5;
  if(m.kind==='prank'&&m.sneak)s*=.55;
  return s;
}
function isBusy(m){return m.q.some(k=>k.lock);}
function enq(m,...ts){m.q.push(...ts);}
function replan(m){
  if(m.hs!=='out'||isBusy(m))return;
  m.q=[];m.carry=m.carry&&m.carry==='cake'?m.carry:null;m.act=null;m.sneak=false;
}
function replanAll(){KINDS.forEach(k=>replan(M[k]));}
function pathTo(m,x,floor,yy,sp){
  const ts=[];
  let cf=m.floor;
  if(m.attach&&m.attach.type!=='none'){
    const fy=floorY(cf);
    ts.push({type:'fn',f:mm=>{mm.attach=null;mm.seatId=null;if(S.rider===mm)S.rider=null;if(S.hammock===mm)S.hammock=null;mm.pose='stand';}});
    ts.push({type:'jump',x:clamp(m.x+rnd(-30,30),40,L.RW-40),y:fy+m.lane,d:.45,h:40});
  }
  if(cf!==floor){
    if(S.phase!=='open')return ts;
    const lx=L.ladderX+18;
    ts.push({type:'walk',x:lx,y:floorY(cf),sp});
    ts.push({type:'climb',to:floor});
  }
  ts.push({type:'walk',x,y:yy!=null?yy:floorY(floor)+m.lane,sp});
  return ts;
}
function goTo(m,x,floor,yy,sp){enq(m,...pathTo(m,x,floor,yy,sp));}
function runTasks(m,dt){
  const k=m.q[0];
  if(!k)return;
  if(!k.st){k.st=1;k.t=0;if(k.type==='jump'){k.x0=m.x;k.y0=m.y;}if(k.type==='climb'){k.y0=m.y;k.y1=floorY(k.to);m.x=L.ladderX+18;}if(k.on)k.on(m);}
  k.t+=dt;let done=false;
  switch(k.type){
    case 'walk':{
      const sp=k.sp||mSpeed(m);const dx=k.x-m.x,dy=k.y-m.y,d=Math.hypot(dx,dy);
      if(d<=sp*dt+.5){m.x=k.x;m.y=k.y;done=true;}
      else{m.x+=dx/d*sp*dt;m.y+=dy/d*sp*dt;if(Math.abs(dx)>2)m.face=dx>0?1:-1;m.walking=true;}
      break;}
    case 'jump':{
      const tg=k.tg?k.tg():{x:k.x,y:k.y};
      const p=clamp(k.t/k.d,0,1);
      m.x=lerp(k.x0,tg.x,p);m.y=lerp(k.y0,tg.y,p)-Math.sin(Math.PI*p)*(k.h||50);
      if(Math.abs(tg.x-k.x0)>3)m.face=tg.x>k.x0?1:-1;
      m.sq=p<.15?-.12:p>.85?.1:0;
      if(p>=1)done=true;break;}
    case 'climb':{
      const p=clamp(k.t/(Math.abs(k.y1-k.y0)/110),0,1);
      m.y=lerp(k.y0,k.y1,p);m.pose='climb';
      if(p>=1){m.floor=k.to;m.pose='stand';done=true;}break;}
    case 'wait':if(k.t>=k.d)done=true;break;
    case 'act':m.act=k.name;if(k.t>=k.d){m.act=null;done=true;}break;
    case 'anim':k.f(m,clamp(k.t/k.d,0,1));if(k.t>=k.d)done=true;break;
    case 'fn':k.f(m);done=true;break;
  }
  if(done){if(k.end)k.end(m);m.q.shift();}
}

/* 発見 */
function celebrate(m){
  m.found=true;m.hs='out';m.joy=1;
  sparkle(m.x,m.y-50,12);SND.chime();setTimeout(()=>SND.cheer(MDEF[m.kind].s>1?.9:1.1),250);
  const r=RIB[ribIdx(m.kind)];
  addP({x:m.x,y:m.y-60,tx:garSlot(m.kind).x,ty:garSlot(m.kind).y,type:'ribfly',life:1,max:1,rib:ribIdx(m.kind),col:r.c,s:14});
  if(!save.ribbons.includes(m.kind)){save.ribbons.push(m.kind);}
  S.sessionRib[m.kind]=T;
  writeSave();
}
function discover(m,how){
  if(m.found||m.hs!=='hidden')return;
  m.hs='emerge';m.q=[];
  const sp=spotPos(m.spot);
  const fr=x=>clamp(x,60,L.RW-60);
  const L1=k=>Object.assign(k,{lock:true});
  if(m.spot==='desk'){
    enq(m,L1({type:'anim',d:.55,f:(mm,p)=>{mm.peek=p;mm.earW=1;}}),
      L1({type:'fn',f:mm=>{mm.hs='out';mm.x=sp.x;mm.y=sp.y-18;mm.face=-1;SND.squeak(1.05);fluff(sp.x,sp.y-20,4);}}),
      L1({type:'jump',x:fr(sp.x-70),y:L.MY+m.lane,d:.5,h:60}),
      L1({type:'fn',f:celebrate}),L1({type:'act',name:'clap',d:1.3}));
  }else if(m.spot==='bed'){
    enq(m,L1({type:'anim',d:.6,f:(mm,p)=>{mm.peek=p;}}),
      L1({type:'fn',f:mm=>{mm.hs='out';mm.x=sp.x;mm.y=sp.y-6;mm.face=-1;SND.giggle();fluff(sp.x,sp.y,5);}}),
      L1({type:'anim',d:.6,f:(mm,p)=>{mm.y=lerp(sp.y-6,L.MY+mm.lane,p)-Math.sin(Math.PI*p)*30;mm.x=lerp(sp.x,fr(sp.x-40),p);mm.rot=-p*TAU;}}),
      L1({type:'fn',f:mm=>{mm.rot=0;celebrate(mm);}}),L1({type:'act',name:'wink',d:.6}),L1({type:'act',name:'clap',d:1.0}));
  }else if(m.spot==='hole'){
    const slow=m.kind==='shy'?1:.6;
    enq(m,L1({type:'anim',d:.7*slow,f:(mm,p)=>{mm.peek=lerp(0,.35,p);mm.earW=.6;}}),
      L1({type:'anim',d:.6*slow,f:(mm,p)=>{mm.peek=lerp(.35,.68,p);}}),
      L1({type:'anim',d:.4*slow,f:(mm,p)=>{mm.peek=lerp(.68,.42,p);}}),
      L1({type:'anim',d:.7*slow,f:(mm,p)=>{mm.peek=lerp(.42,1,p);}}),
      L1({type:'fn',f:mm=>{mm.hs='out';mm.x=sp.x;mm.y=sp.y;SND.squeak(1.25);}}),
      L1({type:'jump',x:fr(sp.x+80),y:L.MY+m.lane,d:.5,h:50}),
      L1({type:'fn',f:celebrate}),L1({type:'act',name:m.kind==='shy'?'shyclap':'clap',d:1.4}));
  }else if(m.spot==='box'||m.spot==='door'){
    const isBox=m.spot==='box';
    enq(m,L1({type:'anim',d:.5,f:(mm,p)=>{mm.peek=p;}}),
      L1({type:'fn',f:mm=>{mm.hs='out';mm.floor='A';mm.x=sp.x;mm.y=isBox?L.AFY-L.box.h*.6:L.AFY;mm.face=isBox?1:-1;SND.squeak(1.4);fluff(sp.x,L.AFY-50,5);}}),
      L1({type:'jump',x:isBox?sp.x+80:sp.x-70,y:L.AFY+m.lane*.4,d:.5,h:50}),
      L1({type:'fn',f:celebrate}),L1({type:'act',name:'yawn',d:.9}),L1({type:'act',name:'clap',d:1.0}));
  }
}

/* ねずみの頭（ブレイン）：状態の組み合わせで次の行動を決める */
function brain(m,dt){
  if(m.hs!=='out'||m.q.length)return;
  const open=S.phase==='open';
  // ハンモック
  if(S.time===2&&S.weight===1&&blanketUp()&&(!S.hammock||S.hammock===m)&&S.phase!=='closing'){
    if(S.rider&&S.rider!==m){/* 乗っている子が寝る */}
    else if(S.hammock!==m&&S.rider!==m&&(m.floor==='L'||open)){
      S.hammock=m;
      goTo(m,flPos('blanket').x,'L');
      enq(m,{type:'jump',tg:()=>blanketSeat(),d:.6,h:70,on:()=>SND.whee()},{type:'fn',f:mm=>{mm.attach={type:'blanket'};S.rider=mm;}});
      return;
    }
  }
  if(m.attach&&m.attach.type==='blanket'){
    m.idleT-=dt;if(m.idleT<0){m.idleT=rnd(2,4);if(S.time===2)zzz(m.x+10,m.y-80);}
    if(open&&S.time!==2){enq(m,{type:'jump',x:clamp(m.x,80,L.RW-80),y:L.AFY+m.lane*.4,d:.7,h:60,on:mm=>{mm.attach=null;if(S.rider===mm)S.rider=null;mm.floor='A';SND.whee();}});}
    return;
  }
  if(open&&m.floor==='L'&&!(S.time===2&&S.hammock===m)){goTo(m,L.RW*rnd(.3,.7),'A');return;}
  if(m.floor==='A'){atticBrain(m,dt);return;}
  lowerBrain(m,dt);
}
function blanketSeat(){const p=flPos('blanket');return {x:p.x+(S.hammock?0:-20),y:p.y-(S.time===2?-2:12)};}
function lowerBrain(m,dt){
  if(m.attach&&m.attach.type==='bed'){
    if(S.time===2){m.idleT-=dt;if(m.idleT<0){m.idleT=rnd(2,3.5);zzz(m.x+10,m.y-40);if(Math.random()<.3)SND.snore();}return;}
    enq(m,{type:'fn',f:mm=>{mm.attach=null;mm.pose='stand';}},{type:'jump',x:clamp(m.x+rnd(-40,40),60,L.RW-60),y:L.MY+m.lane,d:.45,h:40});return;
  }
  const px=L.stool.x;
  if(S.time===1){
    // おやつ：性格で行き先と歩き方が変わる
    const near=Math.abs(m.x-(px+offFor(m)))<12;
    if(!near){goTo(m,px+offFor(m),'L');return;}
    m.face=px>m.x?1:-1;
    if(m.kind==='glutton'||m.kind==='baby'){
      if(S.cheese>0&&Math.random()<.5){enq(m,{type:'act',name:'eat',d:1.4,on:mm=>{S.cheese=Math.max(0,S.cheese-1);SND.munch();mm.cheek=1;}},{type:'act',name:'hop',d:.5});}
      else enq(m,{type:'act',name:'beg',d:rnd(1.5,2.5)});
    }else if(m.kind==='prank'){
      enq(m,{type:'act',name:'sneakgrab',d:1,on:()=>{crumbs(px,plateY());SND.giggle(1.1);}},{type:'act',name:'beg',d:1.5});
    }else enq(m,{type:'act',name:'beg',d:rnd(1.6,2.6)});
    return;
  }
  if(S.time===2){
    // おひるね：ねむそうにベッドへ
    const bx=L.bed.x+40+({glutton:0,shy:52,prank:104,baby:150}[m.kind])*(L.bed.w-60)/170;
    goTo(m,bx,'L');
    enq(m,{type:'act',name:'yawn',d:.8},{type:'jump',x:bx,y:L.bed.top+6,d:.55,h:40},{type:'fn',f:mm=>{mm.attach={type:'bed',ox:bx};}});
    return;
  }
  // あそび時間：それぞれのしぐさ
  m.idleT-=dt;
  if(m.idleT>0)return;
  m.idleT=rnd(1.5,3.5);
  const r=Math.random();
  if(m.kind==='prank'&&r<.35){
    const id=pick(['yarn','cushion']);const p=flPos(id);
    m.sneak=true;goTo(m,p.x+(m.x<p.x?-50:50),'L');
    enq(m,{type:'act',name:'poke',d:.6,end:mm=>{mm.sneak=false;poke(id);}},{type:'act',name:'giggle',d:.8});return;
  }
  if(m.kind==='shy'&&r<.4){goTo(m,L.cushion.x+60,'L');enq(m,{type:'act',name:'fidget',d:2});return;}
  if(r<.55){goTo(m,clamp(m.x+rnd(-200,200),70,L.RW-70),'L');return;}
  enq(m,{type:'act',name:{glutton:'belly',shy:'fidget',prank:'rub',baby:'yawn'}[m.kind],d:rnd(1.2,2)});
}
function offFor(m){return {glutton:-62,baby:60,prank:66,shy:-104}[m.kind];}
function poke(id){const f=S.fl[id];f.vx+=rnd(80,140)*(Math.random()<.5?-1:1);f.vy-=S.weight===1?60:120;f.vr+=rnd(-4,4);wob(id,.8);SND.soft(1.3);}

/* 屋根裏のブレイン：お茶会づくり */
function atticBrain(m,dt){
  const P=S.party;
  if(S.time===1){
    if(!P.cakeOn&&!P.bearer){
      const bearer=(M.glutton.found&&M.glutton.floor==='A'&&M.glutton.hs==='out')?M.glutton:m;
      if(bearer===m){
        P.bearer=m;
        goTo(m,L.door.x-44,'A');
        enq(m,{type:'fn',f:()=>{S.attic.doorOn=true;SND.soft(1.4);}},{type:'act',name:'fetch',d:.6},{type:'fn',f:mm=>{mm.carry='cake';SND.squeak(1);}});
        goToPost(m,L.table.x+40);
        enq(m,{type:'act',name:'place',d:.5},{type:'fn',f:mm=>{mm.carry=null;P.cakeOn=true;P.started=true;P.bearer=null;S.attic.doorOn=false;sparkle(cakePos().x,cakePos().y-30,10);SND.chime();SND.clink();rebuild(true);}});
        return;
      }
    }
  }
  const sid=P.assign[m.kind];
  if(S.time!==0&&sid){
    if(m.seatId===sid){
      if(S.time===2){m.idleT-=dt;if(m.idleT<0){m.idleT=rnd(2,3.5);zzz(m.x+10,m.y-70);}return;}
      m.idleT-=dt;
      if(m.idleT<0){m.idleT=rnd(1.6,3.2);
        if(P.cakeOn&&Math.random()<.5){enq(m,{type:'act',name:'nibble',d:1.1,on:mm=>{mm.cheek=.7;SND.munch();}});}
        else if(Math.random()<.4)enq(m,{type:'act',name:'sway',d:1.5});
        else if(m.kind==='prank'&&Math.random()<.4)enq(m,{type:'act',name:'wink',d:.6});
      }
      return;
    }
    goSeat(m,sid);return;
  }
  // 準備（あそび時間）：性格ごとの仕事
  m.idleT-=dt;if(m.idleT>0)return;m.idleT=rnd(1.2,2.6);
  if(m.kind==='shy'){
    const i=[0,1,2,3].find(j=>!save.chairs[j]);
    if(i!=null){goTo(m,chairX(i)+(i<2?-34:34),'A');enq(m,{type:'act',name:'tie',d:1.0,end:()=>tieRibbon(i,'shy')},{type:'act',name:'shyclap',d:.8});return;}
  }
  if(m.kind==='prank'&&Math.random()<.6){
    const i=(Math.random()*4)|0;m.sneak=true;goTo(m,chairX(i)+(i<2?-36:36),'A');

function tieRibbon(i,by){

/* お茶会の作り直し：時計×光×重さの組み合わせで席と飾りが変わる */
function partyKey(){return S.time+'|'+S.K.light.idx+'|'+S.weight;}
function rebuild(quiet){
  const P=S.party;
  P.key=partyKey();
  const li=Math.max(0,S.K.light.idx+1);
  P.theme=(li+S.seed)%5;save.theme=P.theme;writeSave();
  const mice=KINDS.filter(k=>M[k].found&&M[k].hs==='out'&&M[k].floor==='A');
  let seats=['c0','c1','c2','c3'];
  if(S.weight===1){seats=['a0','a1','a2','c1','c2','c0','c3'];}
  const PERM=[[0,1,2,3],[2,0,3,1],[3,2,1,0],[1,3,0,2],[2,3,0,1],[1,0,3,2]][(li+S.seed)%6];
  const order=PERM.filter(i=>i<mice.length).map(i=>mice[i]);
  if(S.weight!==1&&(li%2))seats=['c3','c2','c1','c0'];
  P.assign={};order.forEach((k,i)=>{P.assign[k]=seats[i%seats.length];});
  P.spot=order.length?(li%order.length):-1;
  P.spotKind=order[P.spot]||null;
  if(!quiet){P.flip=1;SND.flip();}
  if(S.phase==='open'){KINDS.forEach(k=>{const m=M[k];if(m.floor==='A'&&m.seatId!==P.assign[k])replan(m);});}
  if(S.weight===1&&S.phase==='open'&&mice.length)S.flags.air=true;
}

/* ---------------- 仕掛けの操作 ---------------- */
function wob(id,a=1){S.wob[id]=Math.max(S.wob[id]||0,a);}
function wv(id){return S.wob[id]||0;}
function setLight(i,quiet){
  const K=S.K.light;if(K.idx===i)return;
  K.idx=i;K.used=true;S.aimHold=0;
  if(!quiet){SND.click();tone2(1+.06*i);}
  const n=LT[i];
  if(n==='desk')wob('desk',.5);else if(n==='bed')wob('bed',.5);else if(n==='hole')wob('cushion',.6);else if(n==='plate')wob('plate',.6);else wob('blanket',.6);
  if(S.phase==='open'){S.flags.lightA=true;}
}
function tone2(p){tone('sine',880*p,1100*p,.08,.06,.03);}
function setWeight(i){
  if(S.weight===i)return;
  const prev=S.weight;S.weight=i;S.K.weight.used=true;SND.click();
  const ids=shuffle(['cushion','blanket','yarn','books']);
  ids.forEach((id,j)=>{const f=S.fl[id];f.delay=j===0?0:rnd(.12,.75)*(j/ids.length+.4);f.landed=false;
    if(i===1&&id==='cushion'){f.sinkT=.3;f.delay=Math.min(f.delay,.15);}
    if(i===2)f.vr+=rnd(-3,3);});
  if(i===1){SND.whee();}
  if(i===2){SND.whoosh(.6);S.heavyKick=1;}
  if(i===0&&prev!==0){tone('sine',500,220,.3,.1);}
  wob('lamp',.8);
  // 乗り手
  if(i===0&&S.rider){const r=S.rider;S.rider=null;if(S.hammock===r)S.hammock=null;r.q=[];r.attach=null;r.pose='stand';
    enq(r,{type:'jump',x:clamp(flPos('blanket').x-80,60,L.RW-60),y:(r.floor==='A'?L.AFY:L.MY)+r.lane,d:.6,h:30});}
  if(i===1&&!S.rider&&S.phase!=='open'&&S.phase!=='closing')setTimeout(()=>pickRider(),500);
  KINDS.forEach(k=>{const m=M[k];if(m.hs==='out'){m.earW=1;if(i===2)m.expr='whee';}});
  if(S.phase==='open'){replanAll();}
}
function pickRider(){
  if(S.rider||S.weight===0||S.phase==='open'||S.phase==='closing')return;
  const bp=flPos('blanket');
  let c=KINDS.map(k=>M[k]).filter(m=>m.found&&m.hs==='out'&&m.floor==='L'&&!isBusy(m)&&m!==S.hammock);
  c.sort((a,b)=>Math.abs(a.x-bp.x)-Math.abs(b.x-bp.x));
  let m=c[0];
  if(!m){
    // ベッドの下に隠れている子が飛び乗る
    const h=KINDS.map(k=>M[k]).find(mm=>mm.hs==='hidden'&&mm.spot==='bed')||KINDS.map(k=>M[k]).find(mm=>mm.hs==='hidden'&&mm.spot==='desk');
    if(!h)return;
    const sp=spotPos(h.spot);
    h.hs='emerge';h.q=[];
    enq(h,{type:'anim',d:.35,lock:true,f:(mm,p)=>{mm.peek=p;}},
      {type:'fn',lock:true,f:mm=>{mm.hs='out';mm.x=sp.x;mm.y=sp.y-8;SND.giggle();fluff(sp.x,sp.y,5);}},
      {type:'jump',lock:true,tg:()=>blanketSeat(),d:.7,h:90,on:()=>SND.whee()},
      {type:'fn',lock:true,f:mm=>{mm.attach={type:'blanket'};S.rider=mm;celebrate(mm);}});
    S.rider=h;return;
  }
  m.q=[];m.attach=null;
  S.rider=m;
  enq(m,...pathTo(m,bp.x-60,'L'));
  enq(m,{type:'jump',tg:()=>blanketSeat(),d:.6,h:80,lock:true,on:()=>SND.whee()},{type:'fn',f:mm=>{mm.attach={type:'blanket'};}});
}
function setTime(i){
  if(S.time===i)return;
  S.time=i;S.K.time.used=true;
  S.K.time.tickQ=3;S.K.time.tickT=0;
  wob('clock',.8);
  KINDS.forEach(k=>{const m=M[k];if(m.hs==='out'){m.earW=1;}});
  if(i!==2&&S.hammock){const h=S.hammock;S.hammock=null;h.q=[];}
  replanAll();
  if(i===1){
    // おやつの匂いで食いしん坊が出てくる
    const g=M.glutton;if(g.hs==='hidden'&&g.floor==='L')setTimeout(()=>{if(S.time===1&&g.hs==='hidden'&&S.phase!=='closing'){g.sniff=1;setTimeout(()=>{if(g.hs==='hidden'&&S.phase!=='closing'){if(g.spot==='hole'&&!cushionLifted()){S.fl.cushion.vy-=260;S.fl.cushion.vr+=2;SND.bump(1.3);}discover(g,'snack');}},900);}},500);
  }
  if(S.phase==='open'&&i===1&&!S.party.started)S.party.bearer=null;
}

/* ---------------- 天井ぱかーん ---------------- */
function startOpen(){

function startClose(){
  if(S.phase!=='open')return;
  S.phase='closing';S.phT=0;SND.flip();SND.whoosh(1);
  // ねずみたちは新しい隠れ場所へ
  const canonical=false;

    if(m.hs!=='out'){m.hs='hidden';m.peek=0;const p=spotPos(m.spot);m.x=p.x;m.y=p.y;m.floor=(m.spot==='box'||m.spot==='door')?'A':'L';return;}
    const p=spotPos(m.spot);

      {type:'fn',lock:true,f:mm=>{fluff(mm.x,mm.y-20,4);mm.hs='hidden';mm.found=false;mm.peek=0;mm.floor=(mm.spot==='box'||mm.spot==='door')?'A':'L';const q=spotPos(mm.spot);mm.x=q.x;mm.y=q.y;mm.q=[];}});

function finishClose(){

function setWeightQuiet(i){S.weight=i;S.K.weight.idx=i;Object.values(S.fl).forEach(f=>{f.delay=rnd(0,.5);f.landed=false;});}

/* ---------------- 食べ物（チーズ・ケーキ） ---------------- */
function startFood(kind,wx,wy,pid){
  const src=kind==='cheese'?{x:L.stool.x,y:plateY()-8}:{x:cakePos().x,y:cakePos().y-20};
  const f={kind,x:src.x,y:src.y,sx:src.x,sy:src.y,state:'drag',pid,t:0,tgt:null};

function foodMice(f){const fl=f.kind==='cheese'?'L':'A';return KINDS.map(k=>M[k]).filter(m=>m.found&&m.hs==='out'&&(m.floor===fl||(m.attach&&m.attach.type==='blanket'&&fl==='L')));}
function releaseFood(f,auto,wx,wy){
  let cand=foodMice(f);

  if(auto){cand.sort((a,b)=>(a.eats-b.eats)||(dist(a.x,a.y,f.x,f.y)-dist(b.x,b.y,f.x,f.y)));m=cand[0];}
  else{let best=150;cand.forEach(c=>{const d=dist(c.x,c.y-40,wx,wy);if(d<best){best=d;m=c;}});}

  else{f.state='back';f.t=0;f.x0=f.x;f.y0=f.y;}
}
function feed(m,f){

  m.q=m.q.filter(k=>k.lock);

    {type:'act',name:n%3===0?'spin':'hop',d:.7,on:mm=>{SND.cheer(1+(n%4)*.06);hearts(mm.x,mm.y-90,3);sparkle(mm.x,mm.y-60,6);}});
}

/* ---------------- 入力（Pointer Events・マルチタッチ） ---------------- */
const P=new Map();
const knobOwner={light:null,weight:null,time:null};
function toWorld(sx,sy){return {x:(sx-cam.x)/cam.s,y:(sy-cam.y)/cam.s};}
function hr(base){return Math.max(base,30/cam.s);}
function mouseHit(m){const s=MDEF[m.kind].s*L.ms;return {x:m.x,y:m.y-45*s,r:hr(56*s)};}
function hitTest(wx,wy){
  if(S.phase==='unravel'||S.phase==='flip'||S.phase==='closing')return {type:'none'};
  const H=[];
  const add=(o,x,y,r)=>{const d=dist(wx,wy,x,y);if(d<r)H.push(Object.assign({d:d/r},o));};
  const K=S.K;
  if(S.curtain.open>.5){const p=knobPos('light');add({type:'knob',k:'light',pri:1},p.x,p.y,hr(76));}
  if(S.shade.open>.5){const p=knobPos('weight');add({type:'knob',k:'weight',pri:1},p.x,p.y,hr(72));}
  if(S.lid.open>.5){const p=knobPos('time');add({type:'knob',k:'time',pri:1},p.x,p.y,hr(L.clock.r+22));}
  KINDS.forEach(k=>{const m=M[k];if(m.hs==='out'){const h=mouseHit(m);add({type:'mouse',m,pri:2},h.x,h.y,h.r);}});
  if(S.cheese>0)add({type:'food',kind:'cheese',pri:2.5},L.stool.x,plateY()-6,hr(60));
  else add({type:'obj',id:'plate',pri:4},L.stool.x,plateY()-6,hr(60));
  if(S.phase==='open'){
    const c=cakePos();
    if(S.party.cakeOn&&S.time===1)add({type:'food',kind:'cake',pri:2.5},c.x,c.y,hr(72));
    else add({type:'stand',pri:3},c.x,c.y+20,hr(80));
    const apexY=-L.AH;
    add({type:'flap',pri:3},L.RW/2,apexY-62,hr(Math.min(L.RW*.32,190)));
    add({type:'box',pri:M.baby.hs==='hidden'&&M.baby.spot==='box'?1.8:3},L.box.x,L.AFY-L.box.h/2,hr(L.box.w*.62));
    add({type:'door',pri:M.baby.hs==='hidden'&&M.baby.spot==='door'?1.8:3},L.door.x,L.AFY-L.door.h/2,hr(L.door.h*.55));
    L.chairs.forEach((x,i)=>add({type:'chair',i,pri:3.2},chairX(i),L.AFY-62,hr(46)));
  }
  if(!S.curtain.on){const w=L.win;if(Math.abs(wx-w.x)<w.w/2+26&&Math.abs(wy-w.y)<w.h/2+30)H.push({type:'curtain',pri:2,d:.2});}
  if(!S.shade.on){const h=lampHead();add({type:'shade',pri:2},h.x,h.y-6,hr(80));}
  if(!S.lid.on)add({type:'lid',pri:2},L.clock.x,L.clock.y,hr(L.clock.r+24));
  ['cushion','blanket','yarn','books'].forEach(id=>{const p=flPos(id),z=flSize(id);add({type:'float',id,pri:5},p.x,p.y,hr(Math.max(z.w,z.h)*.6));});
  // 隠れ場所（手がかりの小さな反応）
  KINDS.forEach(k=>{const m=M[k];if(m.hs==='hidden'&&m.floor==='L'){const p=spotPos(m.spot);add({type:'hidden',m,pri:5.5},p.x,p.y-30,hr(70));}});
  add({type:'obj',id:'desk',pri:7},L.desk.x+L.desk.w/2,L.desk.top+40,hr(L.desk.w*.55));
  add({type:'obj',id:'bed',pri:7},L.bed.x+L.bed.w/2,L.bed.top+40,hr(L.bed.w*.55));
  add({type:'obj',id:'lamp',pri:7},L.lamp.bx,(L.lamp.by+L.lamp.hy)/2,hr(60));
  add({type:'obj',id:'stool',pri:7},L.stool.x,L.stool.by-30,hr(60));
  if(!H.length)return {type:'bg'};
  H.sort((a,b)=>(a.pri-b.pri)||(a.d-b.d));
  return H[0];
}
function onDown(e){
  e.preventDefault();
  initAudio();
  S.idle=0;S.demo=null;
  const w=toWorld(e.clientX,e.clientY);
  const p={id:e.pointerId,sx:e.clientX,sy:e.clientY,wx:w.x,wy:w.y,t0:T,moved:false,grab:null};
  P.set(e.pointerId,p);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const h=hitTest(w.x,w.y);
  switch(h.type){
    case 'knob':{
      if(knobOwner[h.k]!=null){wob('knob'+h.k,.5);break;}
      knobOwner[h.k]=e.pointerId;p.grab={type:'knob',k:h.k};S.K[h.k].press=1;SND.soft(1.8);break;}
    case 'food':{const f=startFood(h.kind,w.x,w.y,e.pointerId);p.grab={type:'food',f};break;}
    case 'mouse':tapMouse(h.m);break;
    case 'curtain':openCurtain(w.x,w.y);break;
    case 'shade':openShade();break;
    case 'lid':openLid();break;
    case 'float':tapFloat(h.id);break;
    case 'hidden':tapHidden(h.m);break;
    case 'obj':wob(h.id,1);SND.soft(rnd(.85,1.2));fluff(w.x,w.y,2);
      if(h.id==='plate'){const g=M.glutton;if(g.found)g.earW=1;}break;
    case 'stand':wob('stand',1);SND.soft(1.3);
      KINDS.forEach(k=>{const m=M[k];if(m.found&&m.floor==='A'&&m.hs==='out'){m.lookAt={x:L.clock.x,y:L.clock.y,t:2};m.earW=1;}});break;
    case 'flap':tapFlap();break;
    case 'box':tapBox();break;
    case 'door':tapDoor();break;
    case 'chair':{const sh=M.shy;
      if(sh.found&&sh.hs==='out'&&sh.floor==='A'&&!isBusy(sh)&&!sh.attach){sh.q=[];goTo(sh,chairX(h.i)+(h.i<2?-34:34),'A');enq(sh,{type:'act',name:'tie',d:.8,end:()=>tieRibbon(h.i)},{type:'act',name:'shyclap',d:.7});wob('chair'+h.i,.6);SND.soft(1.4);}
      else tieRibbon(h.i);break;}
    case 'bg':default:
      if(h.type==='bg'){p.ripple={x:w.x,y:w.y,t:0,held:true};S.ripples.push(p.ripple);if(S.ripples.length>6)S.ripples.shift();SND.soft(rnd(1.6,2));}
  }
}
function onMove(e){
  const p=P.get(e.pointerId);if(!p)return;
  e.preventDefault();
  const w=toWorld(e.clientX,e.clientY);p.wx=w.x;p.wy=w.y;
  if(p.ripple){p.ripple.x=w.x;p.ripple.y=w.y;}
  if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>12)p.moved=true;
  if(!p.grab)return;
  if(p.grab.type==='knob'&&p.moved)knobDrag(p.grab.k,w.x,w.y);
  if(p.grab.type==='food'){const f=p.grab.f;f.x=w.x;f.y=w.y;}
}
function onUp(e,cancel){
  const p=P.get(e.pointerId);if(!p)return;
  P.delete(e.pointerId);
  if(p.ripple){p.ripple.held=false;p.ripple.t=0;}
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(!p.grab)return;
  if(p.grab.type==='knob'){
    const k=p.grab.k,K=S.K[k];knobOwner[k]=null;K.drag=false;
    if(!p.moved&&!cancel)stepKnob(k);
    else{
      if(k==='light'&&S.aimFree){let bi=0,bd=1e9;LT.forEach((n,i)=>{const t=lightTarget(i);const d=dist(t.x,t.y,S.aimFree.x,S.aimFree.y);if(d<bd){bd=d;bi=i;}});setLight(bi);S.aimFree=null;}
      if(k==='weight')K.ang=W_STOP[K.idx];
      if(k==='time')K.ang=T_STOP[K.idx];
    }
  }else if(p.grab.type==='food'){
    const f=p.grab.f;
    if(cancel){f.state='back';f.t=0;f.x0=f.x;f.y0=f.y;}
    else releaseFood(f,!p.moved,p.wx,p.wy);
  }
}
function stepKnob(k){
  const K=S.K[k];K.press=1;
  if(k==='light'){setLight((K.idx+1)%LT.length);}
  else if(k==='weight'){const i=(K.idx+1)%3;K.idx=i;K.ang=W_STOP[i];setWeight(i);}
  else{const i=(K.idx+1)%3;K.idx=i;K.ang=T_STOP[i];setTime(i);}
}
function knobDrag(k,wx,wy){
  const K=S.K[k];K.drag=true;
  const c=knobPos(k);const a=Math.atan2(wy-c.y,wx-c.x);const d=dist(wx,wy,c.x,c.y);
  if(k==='light'){
    const h=lampHead();
    if(d>c.r*1.6){
      // 行き先へドラッグ：光が指を追う
      S.aimFree={x:wx,y:wy};K.disp=Math.atan2(wy-h.y,wx-h.x);
      let bi=0,bd=1e9;LT.forEach((n,i)=>{const t=lightTarget(i);const dd=dist(t.x,t.y,wx,wy);if(dd<bd){bd=dd;bi=i;}});
      if(bd<140)setLight(bi);
    }else{
      S.aimFree=null;K.disp=a;
      let bi=0,bd=1e9;LT.forEach((n,i)=>{const t=lightTarget(i);const ta=Math.atan2(t.y-h.y,t.x-h.x);const dd=Math.abs(angDiff(ta,a));if(dd<bd){bd=dd;bi=i;}});
      setLight(bi);
    }
    return;
  }
  K.ang=a;
  const stops=k==='weight'?W_STOP:T_STOP;
  let bi=0,bd=1e9;stops.forEach((s,i)=>{const dd=Math.abs(angDiff(s,a));if(dd<bd){bd=dd;bi=i;}});
  if(bi!==K.idx){K.idx=bi;if(k==='weight')setWeight(bi);else setTime(bi);}
}
function openCurtain(wx,wy){
  const C=S.curtain;C.on=true;C.t=0;C.dent=1;C.dx=wx;C.dy=wy;
  SND.puff(1);fluff(wx,wy,5);
  setTimeout(()=>SND.thread(),130);
  setTimeout(()=>{SND.puff(1.3);fluff(L.win.x,L.win.y+L.win.h*.3,6);},380);
}
function openShade(){const s=S.shade;s.on=true;s.t=0;SND.puff(1.15);const h=lampHead();fluff(h.x,h.y-20,5);setTimeout(()=>SND.pop(3),260);}
function openLid(){const s=S.lid;s.on=true;s.t=0;SND.puff(1.25);setTimeout(()=>{SND.tick(0);SND.tick(1);},250);fluff(L.clock.x,L.clock.y,4);}
function tapMouse(m){
  m.tapN=m.tapT>0?m.tapN+1:1;m.tapT=1.6;m.earW=1;
  const n=Math.min(m.tapN,8);
  const p=1+n*.07;
  if(m.pose==='sleep'||isAsleep(m)){m.twitch=1;SND.soft(1.8);return;}
  if(isBusy(m)){SND.squeak(p);return;}
  const acts={glutton:['hop','belly','spin'],shy:['shy','hop','shyclap'],prank:['wink','giggle','hop'],baby:['hop','clap','yawn']}[m.kind];
  const a=acts[(n-1)%acts.length];
  m.q=m.q.filter(k=>k.lock);
  m.q.unshift({type:'act',name:a,d:.6+(a==='spin'?.2:0)});
  if(m.kind==='prank'&&a==='giggle')SND.giggle(p);else if(m.kind==='shy')SND.squeak2(p);else SND.squeak(p);
  if(n>=4)hearts(m.x,m.y-90,1);
}
function isAsleep(m){return S.time===2&&(m.attach&&(m.attach.type==='bed'||m.attach.type==='seat'||(m.attach.type==='blanket'&&S.hammock===m)));}
function tapFloat(id){
  const f=S.fl[id];wob(id,1);
  f.vy-=S.weight===1?40:S.weight===2?-30:70;f.vr+=rnd(-1.5,1.5);
  SND.puff(id==='yarn'?1.5:id==='books'?1.2:.9);
  const p=flPos(id);fluff(p.x,p.y,2);
  if(id==='cushion'){const h=KINDS.map(k=>M[k]).find(m=>m.hs==='hidden'&&m.spot==='hole');if(h&&!cushionLifted()){setTimeout(()=>SND.squeak(1.6),180);h.duck=1;}}
  if(id==='blanket'){const h=KINDS.map(k=>M[k]).find(m=>m.hs==='hidden'&&m.spot==='bed');if(h)h.shake=1;}
}
function tapHidden(m){
  m.duck=1;m.shake=1;SND.squeak(1.5);
  if(m.spot==='hole'&&!cushionLifted())wob('cushion',.8);
  if(m.spot==='desk')wob('desk',.4);
  if(m.spot==='bed')wob('bed',.4);
}
function tapFlap(){
  if(S.flapPress>0&&S.flapT>0){startClose();S.flapPress=0;return;}
  S.flapPress=1;S.flapT=2.6;SND.flip();
  KINDS.forEach(k=>{const m=M[k];if(m.found&&m.hs==='out'){m.lookAt={x:L.RW/2,y:-L.AH-60,t:2.2};m.earW=1;}});
}
function tapBox(){
  const A=S.attic;wob('box',1);
  const b=M.baby;
  if(b.hs==='hidden'&&b.spot==='box'){A.boxOn=true;SND.puff(1.3);discover(b,'box');return;}
  A.boxOn=true;A.box=Math.max(A.box,.6);

  addP({x:L.box.x,y:L.AFY-L.box.h,vx:rnd(40,120),vy:-260,life:1,max:1,type:'deco',col:RIB[(S.party.deco)%4].c,s:12,g:240});
  SND.pop(S.party.deco%6);SND.soft(1.4);
}
function tapDoor(){
  const A=S.attic;wob('door',1);A.doorOn=true;S.flags.door=true;SND.soft(1.3);
  const b=M.baby;
  if(b.hs==='hidden'&&b.spot==='door'){discover(b,'door');return;}
  const pr=M.prank;
  if(pr.found&&pr.hs==='out'&&pr.floor==='A'&&!isBusy(pr)){
    pr.q=[];pr.attach=null;pr.seatId=null;
    goTo(pr,L.door.x-46,'A');
    enq(pr,{type:'act',name:'pull',d:1.0,on:()=>SND.giggle(1.2)},{type:'fn',f:()=>pullStreamer(pr)},{type:'act',name:'giggle',d:.8});
  }else{
    pullStreamer(null);
  }
}
function pullStreamer(m){
  const P_=S.party;
  const rare=m&&!P_.giant&&(Math.random()<.14||(!save.giant&&S.cycle>=1&&Math.random()<.3));
  if(rare){P_.giant=.001;save.giant=true;writeSave();SND.bigOpen();confetti(L.RW/2,-L.AH*.6,16);return;}
  const kinds=KINDS.filter(k=>S.sessionRib[k]||save.ribbons.includes(k));
  const rib=kinds.length?ribIdx(pick(kinds)):2;
  P_.streamers.push({rib,t:0,x0:rnd(.05,.45),x1:rnd(.55,.95),sag:rnd(30,70),y:rnd(-.62,-.48)});
  if(P_.streamers.length>5)P_.streamers.shift();
  SND.ribbon();
}

/* ---------------- 更新 ---------------- */
function update(dt){
  S.idle+=dt;S.hintPulse+=dt;
  if(saveTimer>0){saveTimer-=dt;if(saveTimer<=0)flushSave();}
  for(const k in S.wob){S.wob[k]=Math.max(0,S.wob[k]-dt*1.6);}
  // カバーのアニメ
  const C=S.curtain;if(C.on){C.t+=dt;C.dent=Math.max(0,1-C.t/.25);C.thread=clamp((C.t-.1)/.3,0,1);C.open=easeOut((C.t-.3)/.5);if(C.open>.6&&!S.K.light.rev)S.K.light.rev=.001;}
  const Sh=S.shade;if(Sh.on){Sh.t+=dt;Sh.open=backOut((Sh.t-.1)/.5);if(Sh.open>.6&&!S.K.weight.rev)S.K.weight.rev=.001;}
  const Ld=S.lid;if(Ld.on){Ld.t+=dt;Ld.open=backOut((Ld.t-.08)/.5);if(Ld.open>.6&&!S.K.time.rev)S.K.time.rev=.001;}
  ['light','weight','time'].forEach(k=>{const K=S.K[k];if(K.rev>0&&K.rev<1){K.rev=Math.min(1,K.rev+dt*2.4);if(K.rev>=1)SND.pop(4);}K.press=Math.max(0,K.press-dt*4);});
  // 時計の針のコトコト
  const KT=S.K.time;
  if(!KT.drag){if(KT.tickQ>0){KT.tickT-=dt;if(KT.tickT<=0){KT.tickT=.13;KT.tickQ--;SND.tick(KT.tickQ);}}
    const tgt=T_STOP[KT.idx];const step=angDiff(tgt,KT.ang);KT.ang+=KT.tickQ>0?step*.35*(KT.tickT<=.02?1:0)+step*dt*3:step*Math.min(1,dt*10);}
  const KW=S.K.weight;if(!KW.drag){KW.ang+=angDiff(W_STOP[KW.idx],KW.ang)*Math.min(1,dt*10);}
  // 光
  const h=lampHead();
  const tg=S.aimFree||lightTarget(S.K.light.idx);
  if(!S.aim.init){S.aim.x=tg.x;S.aim.y=tg.y;S.aim.init=true;}
  const ak=Math.min(1,dt*(S.aimFree?14:6));
  S.aim.x+=(tg.x-S.aim.x)*ak;S.aim.y+=(tg.y-S.aim.y)*ak;
  S.lampA=Math.atan2(S.aim.y-h.y,S.aim.x-h.x);
  if(!S.K.light.drag)S.K.light.disp+=angDiff(S.lampA,S.K.light.disp)*Math.min(1,dt*8);
  const settled=!S.aimFree&&dist(S.aim.x,S.aim.y,tg.x,tg.y)<26&&S.K.light.idx>=0;
  S.aimHold=settled?S.aimHold+dt:0;
  // 時間帯の色
  S.tint.snack+=((S.time===1?1:0)-S.tint.snack)*Math.min(1,dt*2.5);
  S.tint.nap+=((S.time===2?1:0)-S.tint.nap)*Math.min(1,dt*2.5);
  updateFloats(dt);
  updateLogic(dt);
  KINDS.forEach(k=>updateMouse(M[k],dt));
  updateFood(dt);
  updateOpen(dt);
  // 粒子
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;
    if(p.type==='ribfly'){const q=1-p.life/p.max;p.x=lerp(p.x,p.tx,Math.min(1,dt*4+q*.2));p.y=lerp(p.y,p.ty,Math.min(1,dt*4+q*.2));}
    else{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.type==='fluff'||p.type==='bubble'){p.vx*=.97;}}
    if(p.life<=0)particles.splice(i,1);}
  S.ripples.forEach(r=>r.t+=dt);S.ripples=S.ripples.filter(r=>r.held||r.t<2);
  if(S.cheese<3){S.cheeseT+=dt;if(S.cheeseT>3.5){S.cheeseT=0;S.cheese++;}}
  if(S.flapT>0){S.flapT-=dt;if(S.flapT<=0)S.flapPress=0;}
  S.party.flip=Math.max(0,S.party.flip-dt*1.8);
  if(S.party.giant>0&&S.party.giant<1)S.party.giant=Math.min(1,S.party.giant+dt*.7);
  S.party.airA=(S.party.airA||0)+(((S.weight===1&&S.phase==='open')?1:0)-(S.party.airA||0))*Math.min(1,dt*3);
  S.attic.box+=((S.attic.boxOn?1:0)-S.attic.box)*Math.min(1,dt*6);
  S.attic.door+=((S.attic.doorOn?1:0)-S.attic.door)*Math.min(1,dt*6);
  S.party.streamers.forEach(s=>s.t=Math.min(1,s.t+dt*1.5));
  updateHint(dt);
}
function updateFloats(dt){
  const ceil=CEIL;
  ['cushion','blanket','yarn','books'].forEach(id=>{
    const f=S.fl[id],hm=flHome(id),z=flSize(id);
    let ty=0,tx=0,k=30,c=7;
    if(f.delay>0){f.delay-=dt;}
    let w=S.weight;if(f.delay>0)w=f.lastW!=null?f.lastW:0;else f.lastW=S.weight;
    if(f.sinkT>0){f.sinkT-=dt;f.sq=lerp(f.sq,.22,Math.min(1,dt*14));}
    else f.sq=lerp(f.sq,0,Math.min(1,dt*6));
    const bob=Math.sin(T*1.3+hm.x*.01)*9;
    if(w===1){
      k=6;c=3.2;
      const hov={cushion:-170,yarn:-140,books:-110,blanket:-150}[id];
      ty=hov+bob;
      if(id==='blanket'){
        if(S.rider&&S.rider.attach&&S.rider.attach.type==='blanket'&&S.time!==2)ty=(ceil+104)-hm.y;
        else if(S.time===2&&(S.hammock||S.rider))ty=(L.p?-112:-Math.min(190,hm.y-ceil-200))+bob*.5;
        if(S.phase==='open'&&!(S.time===2&&S.hammock))ty=hov+bob;
      }
      tx=Math.sin(T*.7+hm.x)*12;
    }else if(w===2){
      k=10;c=4;
      ty=(ceil+z.h/2+2)-hm.y+Math.sin(T*2+hm.x)*2;
      if(id==='blanket'&&S.rider)ty=(ceil+104)-hm.y;
      if(S.phase==='open'||S.phase==='flip')ty-=10;
    }
    if(f.sinkT>0)ty=8;
    if(f.delay>0&&w===0)ty=f.oy;
    const ay=(ty-f.oy)*k-f.vy*c,ax=(tx-f.ox)*k*.5-f.vx*c;
    f.vy+=ay*dt;f.vx+=ax*dt;f.oy+=f.vy*dt;f.ox+=f.vx*dt;
    f.vr+=(-f.rot*6-f.vr*3)*dt;f.rot+=f.vr*dt;
    if(w===0&&f.oy>0){if(f.vy>80&&!f.landed){SND.bump(id==='yarn'?1.4:1);fluff(hm.x,hm.y+z.h/2,3);}f.oy=0;f.vy=-f.vy*.3;f.landed=true;}
    f.amp=lerp(f.amp,w===0?0:1,Math.min(1,dt*2));
  });
  S.heavy+=((S.weight===2?1:0)-S.heavy)*Math.min(1,dt*3);
}
function updateLogic(dt){
  if(S.callCD>0)S.callCD-=dt;
  const li=S.K.light.idx,lt=li>=0?LT[li]:null;
  // 光で見つける
  if(S.phase!=='closing'&&S.aimHold>.35&&lt){
    KINDS.forEach(k=>{const m=M[k];if(m.hs!=='hidden'||m.floor!=='L')return;
      if(m.spot===lt){
        if(lt==='hole'&&!cushionLifted()){if(S.aimHold<.5){wob('cushion',.7);SND.squeak(1.7);}return;}
        if(S.aimHold>.55)discover(m,'light');else m.earW=1;
      }});
    // お皿を照らす→食いしん坊が仲間を呼ぶ
    if(lt==='plate'&&S.callCD<=0){
      const g=KINDS.map(k=>M[k]).find(m=>m.found&&m.hs==='out'&&m.floor==='L'&&Math.abs(m.x-L.stool.x)<130&&!isBusy(m)&&(m.kind==='glutton'||!M.glutton.found));
      if(g){
        S.callCD=5;
        const next=['bed','desk','hole'].map(sp=>KINDS.map(k=>M[k]).find(m=>m.hs==='hidden'&&m.spot===sp&&m.floor==='L')).find(Boolean);
        g.q=[];g.face=1;
        enq(g,{type:'act',name:'call',d:1.1,lock:true,on:()=>SND.call()});
        if(next){
          enq(g,{type:'fn',f:()=>{if(next.spot==='hole'&&!cushionLifted()){S.fl.cushion.vy-=280;S.fl.cushion.vr+=2.5;SND.bump(1.3);}discover(next,'call');}});
        }else enq(g,{type:'act',name:'clap',d:1});
      }
    }
  }
  // 毛布＋乗り手→天井の縫い目
  if(S.phase==='closed'){
    const bp=flPos('blanket');
    const r=S.rider;
    const riding=r&&r.attach&&r.attach.type==='blanket';
    if(riding&&bp.y<CEIL+150&&S.time!==2){
      S.seam=Math.min(1,S.seam+dt*.7);
      if(S.seam>=1&&!S.seamFound){S.seamFound=true;SND.chime();sparkle((L.seam.x1+L.seam.x2)/2,CEIL,12,['#ffd56b','#fff3c4']);threads(bp.x,CEIL,3);r.joy=1;}
    }else if(S.weight===2&&!S.seamFound){S.seam=Math.min(.35,S.seam+dt*.4);}
    if(S.seamFound&&S.weight===2&&S.fl.blanket.oy<-(flHome('blanket').y-CEIL-130))startOpen();
  }
  if(S.weight===1&&!S.rider&&S.phase==='closed'&&blanketUp()&&Math.random()<dt*.5)pickRider();
  // 浮いた毛布＋おひるね→乗っている子がそのままハンモックで眠る
  if(S.time===2&&S.weight===1&&S.rider&&!S.hammock&&S.rider.attach&&S.rider.attach.type==='blanket')S.hammock=S.rider;
  // 屋根裏の組み合わせ
  if(S.phase==='open'){
    if(S.party.key!==partyKey())rebuild(false);
    if(S.party.started)S.flags.partyT+=dt;
    if(S.time===1&&S.party.cakeOn&&!S.party.giantDone&&S.flags.partyT>4){S.party.giantDone=true;const pr=M.prank;if(pr.found&&pr.floor==='A'&&Math.random()<.1){tapDoor();}}
  }
}
function updateOpen(dt){
  if(S.phase!=='closed')S.phT+=dt;
  if(S.phase==='unravel'){
    S.unravel=clamp(S.phT/1.4,0,1);
    const n=Math.floor(S.unravel*10);if(n!==S._un){S._un=n;SND.pop(n);const mid=(L.seam.x1+L.seam.x2)/2,hw=(L.seam.x2-L.seam.x1)/2;threads(mid-hw*S.unravel,CEIL-14,1);threads(mid+hw*S.unravel,CEIL-14,1);}
    S.cam=Math.min(1,S.cam+dt/2.4);
    if(S.phT>=1.4){S.phase='flip';S.phT=0;SND.bigOpen();}
  }else if(S.phase==='flip'){
    S.open=easeOut(S.phT/1.1);S.cam=Math.min(1,S.cam+dt/2.4);
    if(S.phT>.3&&S.phT-dt<=.3)confetti(L.RW/2,-L.AH*.5,18);
    if(S.phT>=1.1){S.phase='open';S.phT=0;S.open=1;
      KINDS.forEach(k=>{const m=M[k];if(m.hs==='out'){m.q=m.q.filter(q=>q.lock);m.joy=1;}});
      if(S.rider){const r=S.rider;r.q=[];enq(r,{type:'jump',x:L.RW*.42,y:L.AFY+r.lane*.4,d:.8,h:80,on:mm=>{mm.attach=null;S.rider=null;mm.floor='A';SND.whee();}},{type:'act',name:'clap',d:1});}
      rebuild(true);
    }
  }else if(S.phase==='open'){S.cam=Math.min(1,S.cam+dt/2.4);}
  else if(S.phase==='closing'){
    S.open=1-easeIO(S.phT/1.2);S.cam=Math.max(0,S.cam-dt/1.6);
    if(S.phT>=1.6&&S.cam<=0){finishClose();}
  }
}
function updateMouse(m,dt){
  m.walking=false;
  if(m.tapT>0)m.tapT-=dt;
  m.blinkT-=dt;if(m.blinkT<0){m.blink=.14;m.blinkT=rnd(2,5);}
  if(m.blink>0)m.blink-=dt;
  m.earW=Math.max(0,m.earW-dt*1.5);m.cheek=Math.max(0,m.cheek-dt*.6);m.joy=Math.max(0,m.joy-dt*.6);
  m.duck=Math.max(0,m.duck-dt*.8);m.shake=Math.max(0,m.shake-dt*1.5);m.twitch=Math.max(0,(m.twitch||0)-dt*1.5);
  if(m.lookAt){m.lookAt.t-=dt;if(m.lookAt.t<=0)m.lookAt=null;}
  if(m.hs==='hidden'){
    // 隠れているときのしぐさ（弱いヒント）
    m.hintT-=dt;
    if(m.hintT<0){m.hintT=rnd(3,6);m.earW=1;if(m.spot==='bed')m.shake=.6;
      if(m.spot==='hole'&&cushionLifted()){m.duck=-1;}
      if((m.spot==='box'||m.spot==='door')&&S.phase==='open')wob(m.spot,.7);
      if(S.time===2&&Math.random()<.5){const p=spotPos(m.spot);zzz(p.x,p.y-40);}
    }
    if(m.q.length)runTasks(m,dt);
    return;
  }
  if(m.hs==='emerge'){runTasks(m,dt);return;}
  runTasks(m,dt);
  if(!m.q.length)brain(m,dt);
  // 付着（毛布・ベッド・席）
  if(!m.q.length||(m.q[0]&&m.q[0].type==='act')){
    if(m.attach){
      if(m.attach.type==='blanket'){const p=blanketSeat();m.x=p.x;m.y=p.y;}
      else if(m.attach.type==='bed'){m.x=m.attach.ox;m.y=L.bed.top+6;}
      else if(m.attach.type==='seat'){const p=seatPos(m.attach.id);m.x=p.x;m.y=p.y;}
    }
  }
  // 姿勢と表情
  const asleep=isAsleep(m)||(S.rider===m&&S.hammock===m&&S.time===2);
  m.pose=m.q[0]&&m.q[0].type==='climb'?'climb':asleep?'sleep':m.attach&&m.attach.type==='seat'?'sit':'stand';
  if(m.attach&&m.attach.type==='blanket'&&!asleep)m.pose='ride';
  // 歩くリズム
  if(m.walking){m.walkPh+=dt*(S.time===1?16:S.time===2?6:11);m.hop=Math.abs(Math.sin(m.walkPh))*(S.time===2?3:6)*(S.weight===1&&m.floor==='L'?2.5:1);}
  else m.hop=lerp(m.hop,0,Math.min(1,dt*10));
  if(!(m.q[0]&&m.q[0].type==='jump'))m.sq=lerp(m.sq,0,Math.min(1,dt*8));
  // 視線
  let tx=null,ty=null;
  let near=null;P.forEach(p=>{if(!near||dist(p.wx,p.wy,m.x,m.y)<dist(near.wx,near.wy,m.x,m.y))near=p;});
  const food=S.food.find(f=>f.state==='drag');
  if(food){tx=food.x;ty=food.y;}
  else if(near&&dist(near.wx,near.wy,m.x,m.y)<700){tx=near.wx;ty=near.wy;}
  else if(m.lookAt){tx=m.lookAt.x;ty=m.lookAt.y;}
  else if(S.idle>4&&S.hint){tx=S.hint.x;ty=S.hint.y;}
  if(tx!=null){const dx=tx-m.x,dy=ty-(m.y-60),d=Math.hypot(dx,dy)||1;m.lx=lerp(m.lx,dx/d,Math.min(1,dt*8));m.ly=lerp(m.ly,dy/d,Math.min(1,dt*8));
    if(!m.walking&&!m.attach&&Math.abs(dx)>40&&!(m.q[0]&&m.q[0].type==='jump'))m.face=dx>0?1:-1;}
  else{m.lx=lerp(m.lx,0,dt*3);m.ly=lerp(m.ly,0,dt*3);}
  // 表情
  m.beg=!!food&&foodMice(food).includes(m);
  m.spotlit=0;
  if(S.aimHold>.2&&dist(S.aim.x,S.aim.y,m.x,m.y-30)<100&&m.floor==='L'){m.spotlit=1;if(asleep&&Math.random()<dt*1.5)m.twitch=1;}
  if(S.phase==='open'&&S.party.spotKind===m.kind)m.crown=Math.min(1,m.crown+dt*2);else m.crown=Math.max(0,m.crown-dt*2);
}
function updateFood(dt){
  for(let i=S.food.length-1;i>=0;i--){

      f.x=lerp(f.x0,tx,p);f.y=lerp(f.y0,ty,p)-Math.sin(Math.PI*p)*60;

      if(p>=1){if(f.kind==='cheese')S.cheese=Math.min(3,S.cheese+1);S.food.splice(i,1);SND.soft(1.2);}

/* ---------------- ヒント（言葉なし誘導） ---------------- */
function H(id,x,y,r,kind){return {id,x,y,r,kind:kind||'tap'};}
function computeHint(){
  if(S.phase==='unravel'||S.phase==='flip'||S.phase==='closing')return null;
  if(!S.curtain.on)return H('curtain',L.win.x,L.win.y,110);
  const lk=knobPos('light'),wk=knobPos('weight'),tk=knobPos('time');
  if(!S.K.light.used)return H('klight',lk.x,lk.y,58,'knob');
  if(!S.shade.on)return H('shade',wk.x,wk.y,72);
  if(!S.K.weight.used)return H('kweight',wk.x,wk.y,56,'knob');
  if(!S.lid.on)return H('lid',tk.x,tk.y,L.clock.r+12);
  if(!S.K.time.used)return H('ktime',tk.x,tk.y,L.clock.r+10,'knob');
  const hidL=KINDS.map(k=>M[k]).filter(m=>m.hs==='hidden'&&m.floor==='L');
  const lt=S.K.light.idx>=0?LT[S.K.light.idx]:null;
  const lowerHint=()=>{
    const notHole=hidL.find(m=>m.spot!=='hole');
    if(notHole&&lt!==notHole.spot)return H('klight',lk.x,lk.y,58,'knob');
    const hole=hidL.find(m=>m.spot==='hole');
    if(hole){if(!cushionLifted())return H('kweight',wk.x,wk.y,56,'knob');if(lt!=='hole')return H('klight',lk.x,lk.y,58,'knob');}
    return null;
  };
  if(S.phase==='closed'){
    const lh=lowerHint();if(lh)return lh;
    if(!S.seamFound){if(S.weight!==1)return H('kweight',wk.x,wk.y,56,'knob');if(S.time===2)return H('ktime',tk.x,tk.y,L.clock.r+10,'knob');return null;}
    if(S.weight!==2)return H('kweight',wk.x,wk.y,56,'knob');
    return null;
  }
  // 屋根裏
  const b=M.baby;
  if(b.hs==='hidden'){const sp=b.spot==='box'?{x:L.box.x,y:L.AFY-L.box.h/2,r:80}:{x:L.door.x,y:L.AFY-L.door.h/2,r:80};return H(b.spot,sp.x,sp.y,sp.r);}
  if(!S.party.cakeOn){if(S.time!==1)return H('ktime',tk.x,tk.y,L.clock.r+10,'knob');return null;}
  if(!S.flags.fed&&S.time===1){const c=cakePos();return H('cake',c.x,c.y,70);}
  if(!S.flags.air)return H('kweight',wk.x,wk.y,56,'knob');
  if(!S.flags.lightA)return H('klight',lk.x,lk.y,58,'knob');
  if(!S.flags.door)return H('door',L.door.x,L.AFY-L.door.h/2,80);
  const lh=hidL.length?lowerHint():null;if(lh)return lh;
  if(!S.flags.tied)return H('chair0',chairX(0),L.AFY-62,50);
  if(S.flags.partyT>45)return H('flap',L.RW/2,-L.AH-62,110);
  return null;
}
function updateHint(dt){
  const h=computeHint();
  if(!h||!S.hint||h.id!==S.hint.id)S.hintSince=T;
  S.hint=h;
  if(h&&S.idle>4&&!S.demo&&!S.demoShown[h.id]&&P.size===0){S.demo={h,t:0};S.demoShown[h.id]=true;}
  if(S.demo){S.demo.t+=dt;if(S.demo.t>2.6)S.demo=null;}
  if(h&&S.idle>4){wob(h.id==='curtain'?'curtainHint':h.id,.0);}
}

function computeCam(){
  const k=easeIO(S.cam);
  const m=22;
  const cR=L.p?{x:-m-26,y:-L.AH-110,w:L.RW+2*m+52,h:L.RH+L.AH+110+m+28}:{x:-m-26,y:-m-8,w:L.RW+2*m+52,h:L.RH+2*m+36};
  const oR={x:-m-26,y:-L.AH-200,w:L.RW+2*m+52,h:L.RH+L.AH+200+m+28};
  const r={x:lerp(cR.x,oR.x,k),y:lerp(cR.y,oR.y,k),w:lerp(cR.w,oR.w,k),h:lerp(cR.h,oR.h,k)};
  const aw=VW-SA.l-SA.r,ah=VH-SA.t-SA.b;
  const s=Math.min(aw/r.w,ah/r.h);
  cam.s=s;
  cam.x=SA.l+(aw-r.w*s)/2-r.x*s;
  const oyB=SA.t+(ah-r.h*s)-r.y*s,oyC=SA.t+(ah-r.h*s)/2-r.y*s;
  cam.y=oyC;
}

function mix(a,b,t){const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t,0,1))).toString(16).padStart(2,'0')).join('');}
function drawCurtain(){
  const w=L.win,C=S.curtain,x=w.x-w.w/2-10,y=w.y-w.h/2-24,h=w.h+52;
  const o=C.open,hw=(w.w+20)/2;
  const sway=Math.sin(T*1.6)*3*(1-o)+(wv('curtain')*Math.sin(T*25)*4);
  const hint=S.hint&&S.hint.id==='curtain'&&S.idle>4?Math.sin(T*5)*5:0;
  // カーテンレール
  rrp(x-18,y-14,w.w+56,14,7);felt('#c98f5f');
  ellp(x-18,y-7,10,10);felt('#f6c46b');ellp(x+w.w+38,y-7,10,10);felt('#f6c46b');
  [0,1].forEach(side=>{
    const pw=hw*(1-.66*o)+(side?0:0);
    const px=side?x+w.w+20-pw:x;
    const bulge=(1-o)*(8+Math.sin(T*1.8+side)*3)+hint*(1-o);
    cx.save();
    const ax=side?x+w.w+20:x;
    cx.beginPath();
    cx.moveTo(px,y);cx.lineTo(px+pw,y);
    const bx=side?px:px+pw;
    // 内側の縁（ふくらみ）
    if(side){cx.lineTo(px+pw,y+h);for(let i=4;i>=0;i--){const xx=lerp(px,px+pw,i/4);cx.quadraticCurveTo(xx+pw/8,y+h+10,xx,y+h+(i%2?4:0));}
      cx.quadraticCurveTo(px-bulge+sway,y+h*.5,px,y);}
    else{cx.quadraticCurveTo(px+pw+bulge+sway,y+h*.5,px+pw,y+h);for(let i=4;i>=0;i--){const xx=lerp(px,px+pw,i/4);cx.quadraticCurveTo(xx+pw/8,y+h+10,xx,y+h+(i%2?4:0));}cx.lineTo(px,y);}
    cx.closePath();
    const g=cx.createLinearGradient(px,0,px+pw,0);
    const folds=Math.max(3,Math.round(5*(1-.4*o)));
    for(let i=0;i<=folds;i++){g.addColorStop(i/folds,i%2?'#f2c75e':'#fbe39a');}
    felt(g,.5);
    cx.save();cx.clip();
    for(let i=1;i<folds;i++){const xx=px+pw*i/folds;cx.beginPath();cx.moveTo(xx,y+6);cx.quadraticCurveTo(xx+sway*.5,y+h*.5,xx,y+h);stitch('rgba(200,150,60,.55)',1.6,[5,5]);}
    // レースの裾
    cx.beginPath();cx.moveTo(px,y+h-14);cx.lineTo(px+pw,y+h-14);stitch('#ffffff',2.2,[3,3]);
    // へこみ
    if(C.dent>0){const g2=cx.createRadialGradient(C.dx,C.dy,0,C.dx,C.dy,70);g2.addColorStop(0,'rgba(150,100,30,'+(.35*C.dent)+')');g2.addColorStop(1,'rgba(150,100,30,0)');cx.fillStyle=g2;cx.fillRect(px-10,y,pw+20,h+20);}
    cx.restore();
    // 留めリボン（開いたとき）
    if(o>.5){const ty=y+h*.55,tx=side?px+pw*.5:px+pw*.5;drawBow(tx,ty,2,.6*o);}
    cx.restore();
  });
  // まんなかのしつけ糸（ほどける）
  if(o<.9){
    const mx=x+hw,th=C.thread;
    cx.beginPath();
    const n=9;for(let i=0;i<n;i++){const yy=y+12+i*(h-30)/n;if(i/n<th)continue;cx.moveTo(mx-7,yy);cx.lineTo(mx+7,yy+(h-30)/n*.6);}
    cx.lineWidth=2.4;cx.strokeStyle='#e0603f';cx.lineCap='round';cx.stroke();
    if(th>0&&th<1){cx.beginPath();cx.moveTo(mx,y+12+th*(h-30));cx.quadraticCurveTo(mx+30,y+th*(h-30)-20,mx+46*th,y-10);stitch('#e0603f',2,[]);}
  }
}
function drawClock(){
  const c=L.clock,o=S.lid.open,w=wv('clock');
  cx.save();cx.translate(c.x,c.y);cx.rotate(Math.sin(T*24)*.04*w);

  ellp(0,0,c.r+12,c.r+12);felt(vg(-c.r,c.r,'#e5b585','#c98f5f'));

  // 耳（ベル）
  [-1,1].forEach(s=>{ellp(s*c.r*.62,-c.r-6,16,13);felt(vg(-c.r-18,-c.r+6,'#ffe18a','#f2bc4e'));});

  ellp(0,0,c.r-2,c.r-2);felt(vg(-c.r,c.r,'#fffaf0','#f4e6cc'),.4);
  if(o>.05||S.K.time.rev>0){
    const r=c.r*.62;
    iconSun(Math.cos(T_STOP[0])*r,Math.sin(T_STOP[0])*r,15,S.K.time.idx===0);
    iconSnack(Math.cos(T_STOP[1])*r,Math.sin(T_STOP[1])*r,15,S.K.time.idx===1);
    iconNap(Math.cos(T_STOP[2])*r,Math.sin(T_STOP[2])*r,15,S.K.time.idx===2);
  }
  // 針
  const a=S.K.time.ang,pr=S.K.time.press;
  cx.save();cx.rotate(a);cx.scale(1-pr*.08,1-pr*.08);
  cx.beginPath();cx.moveTo(-8,0);cx.quadraticCurveTo(c.r*.3,-10,c.r*.58,0);cx.quadraticCurveTo(c.r*.3,10,-8,0);felt('#e0603f',.3);
  cx.restore();
  ellp(0,0,9,9);felt('#c98f5f');
  // ふた（ちょうつがいで横に開く）
  if(o<1.05){
    cx.save();cx.translate(-c.r,0);cx.scale(Math.max(-.3,1-o*1.3),1);cx.translate(c.r,0);
    if(1-o*1.3>0){
      ellp(0,0,c.r,c.r);felt(vg(-c.r,c.r,'#bfe7d4','#91cfb6'));hilite(-c.r*.3,-c.r*.35,c.r,.4);
      ellp(0,0,c.r-9,c.r-9);stitch('#ffffff',2.2);
      // 小窓から針がのぞく
      ellp(0,0,16,16);cx.fillStyle='#fffaf0';cx.fill();
      cx.save();cx.rotate(T*1.2);cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,-12);stitch('#e0603f',3,[]);cx.restore();
      // 留め具のボタン
      ellp(c.r-12,0,8,8);felt('#ffd56b');
    }else{ellp(0,0,c.r,c.r);felt('#86c4ab');}
    cx.restore();
  }
  cx.restore();
}

function drawShadowsFromLight(){

    cx.restore();});

function drawBlanket(z,f){
  const W=z.w,Hh=z.h,amp=f.amp;
  const hm=S.time===2&&S.hammock&&blanketUp()?1:0;
  const sag=hm*26;
  const wave=(x,ph)=>Math.sin(x*.05+T*3+ph)*7*amp;
  cx.beginPath();
  const n=10;
  for(let i=0;i<=n;i++){const x=-W/2+W*i/n,u=i/n;const y=-Hh/2+wave(x,0)+sag*Math.sin(Math.PI*u)-(hm*(i===0||i===n?10:0));i?cx.lineTo(x,y):cx.moveTo(x,y);}
  for(let i=n;i>=0;i--){const x=-W/2+W*i/n,u=i/n;const y=Hh/2+wave(x,1)+sag*Math.sin(Math.PI*u)*1.1;cx.lineTo(x,y);}
  cx.closePath();
  cx.save();cx.clip();
  const cols=['#ffd6a5','#bfe7d4','#fff1b8','#f8c3cf'];
  const cw=W/6;
  for(let i=0;i<6;i++)for(let j=0;j<3;j++){cx.fillStyle=cols[(i+j)%4];cx.fillRect(-W/2+i*cw,-Hh/2-20+j*(Hh+40)/3,cw+1,(Hh+40)/3+1);}
  if(feltPat){cx.globalAlpha=.5;cx.fillStyle=feltPat;cx.fillRect(-W/2,-Hh,W,Hh*3);cx.globalAlpha=1;}
  for(let i=1;i<6;i++){cx.beginPath();cx.moveTo(-W/2+i*cw,-Hh);cx.lineTo(-W/2+i*cw,Hh*2);stitch('rgba(255,255,255,.75)',1.4,[4,3]);}
  const g=cx.createLinearGradient(0,-Hh/2,0,Hh/2+sag);g.addColorStop(0,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(120,80,60,.15)');cx.fillStyle=g;cx.fillRect(-W/2,-Hh,W,Hh*3);
  cx.restore();
}
function drawCeiling(){

      if(un>0){cx.beginPath();cx.moveTo(mid-un*hw,CEIL/2);cx.quadraticCurveTo(mid-un*hw+10,CEIL+30,mid-un*hw-20,CEIL+40);cx.moveTo(mid+un*hw,CEIL/2);cx.quadraticCurveTo(mid+un*hw-10,CEIL+30,mid+un*hw+20,CEIL+40);stitch('#e0a43a',2,[]);
        cx.beginPath();cx.moveTo(mid-un*hw,CEIL/2);cx.lineTo(mid+un*hw,CEIL/2);cx.lineWidth=4;cx.strokeStyle='rgba(80,60,50,.5)';cx.stroke();}

  }else{

    const gw=lerp(RW/2,56,o);
    [0,1].forEach(s=>{
      const x0=s?RW-gw:0;
      cx.beginPath();cx.moveTo(x0,-4);cx.lineTo(x0+gw,-4);cx.lineTo(x0+gw,CEIL+8);cx.lineTo(x0,CEIL+8);cx.closePath();
      const g=cx.createLinearGradient(x0,0,x0+gw,0);const nf=Math.max(2,Math.round(gw/20));for(let i=0;i<=nf;i++)g.addColorStop(i/nf,i%2?'#ead7b2':'#fff8e8');
      felt(g,.4);

    cx.fillStyle='rgba(120,80,50,'+(.35*o)+')';cx.fillRect(gw,-4,RW-gw*2,6);
  }
}

function drawMouse(m,o){
  o=o||{};
  const d=MDEF[m.kind],s=d.s*L.ms;
  const x=o.x!=null?o.x:m.x,y=o.y!=null?o.y:m.y;
  const act=m.act;
  const asleep=!o.peek&&m.pose==='sleep';
  cx.save();
  if(!o.peek&&m.pose!=='climb'&&!(m.attach&&m.attach.type==='seat'&&m.attach.id[0]==='a'))softShadow(x,y+2,26*s,6*s,.22);
  let hop=m.hop;
  let rot=m.rot,sq=m.sq;
  if(act==='hop'||act==='spin'){const p=actP(m);hop+=Math.sin(Math.PI*p)*(34+Math.min(m.tapN,6)*4);sq=p<.1?.15:-.08;if(act==='spin')rot=p*TAU;}
  if(act==='clap'||act==='shyclap')hop+=Math.abs(Math.sin(T*9))*6;
  if(act==='eat'||act==='nibble')sq=Math.sin(T*22)*.04;
  if(act==='giggle')rot=Math.sin(T*30)*.08;
  if(m.joy>0)hop+=Math.abs(Math.sin(T*10))*8*m.joy;
  cx.translate(x,y-hop);
  if(rot){cx.translate(0,-36*s);cx.rotate(rot);cx.translate(0,36*s);}
  const face=m.face||1;
  cx.scale(face*s,s);
  cx.scale(1+sq,1-sq);
  if(asleep){drawMouseSleep(m,d);cx.restore();return;}
  const breathe=Math.sin(T*2.4+m.ph)*.02;
  // しっぽ
  const tw=Math.sin(T*3+m.ph)*8*(m.kind==='prank'?1.6:1);
  cx.beginPath();cx.moveTo(-22,-14);
  if(m.kind==='prank')cx.bezierCurveTo(-56,-6+tw,-60,-50,-38,-50+tw*.4);
  else cx.bezierCurveTo(-50,-8+tw,-58,-36-tw,-46,-48+tw);
  cx.lineWidth=5.5;cx.strokeStyle=d.dark;cx.lineCap='round';cx.stroke();
  cx.lineWidth=2;cx.strokeStyle=d.ear;cx.setLineDash([3,4]);cx.stroke();cx.setLineDash([]);
  // 足
  const wk=m.walking?Math.sin(m.walkPh)*5:0;
  ellp(-10+wk,-3,11,6);felt(d.dark,.3);ellp(14-wk,-3,11,6);felt(d.dark,.3);
  // からだ
  cx.save();cx.scale(1+breathe,1-breathe);
  const bw=m.kind==='glutton'?31:27;
  cx.beginPath();cx.moveTo(0,-62);cx.bezierCurveTo(bw+4,-60,bw+6,-4,0,-4);cx.bezierCurveTo(-bw-6,-4,-bw-2,-60,0,-62);cx.closePath();
  felt(vg(-62,-4,d.body,d.dark));hilite(-8,-44,40,.35);
  ellp(6,-26,bw*.55,17);felt(d.belly,.3);ellp(6,-26,bw*.55-4,13);stitch(d.thread,1.3,[3,3]);
  cx.restore();
  // 腕
  drawArms(m,d,act);
  // 頭
  cx.save();cx.translate(7,-66);
  let tilt=m.ly*.12+(act==='beg'||m.beg?-.12:0)+(act==='shy'?.2:0);
  if(act==='call')tilt=-.35;if(m.pose==='ride')tilt=-.25;
  if(act==='yawn')tilt=-.2;
  cx.rotate(tilt);
  // 耳
  const ew=m.earW*Math.sin(T*24)*.35+(m.twitch?Math.sin(T*30)*.4*m.twitch:0);
  const earUp=(S.weight===2&&m.floor==='L'?-.35:0)+(m.pose==='ride'?-.2:0);
  [[-13,-20,-.35],[15,-22,.3]].forEach(([ex,ey,er],i)=>{
    cx.save();cx.translate(ex,ey);cx.rotate(er+(i?ew:-ew)+earUp*(i?-1:1));
    const er2=m.kind==='baby'?17:15;
    ellp(0,-6,er2,er2*1.05);felt(vg(-22,10,d.body,d.dark));
    ellp(0,-5,er2-6,er2-5);felt(d.ear,.25);hilite(-3,-9,10,.3);
    ellp(0,-6,er2-2,er2-1.5);stitch(d.thread,1.2,[3,3]);
    cx.restore();
  });
  // 顔
  ellp(0,0,25,22);felt(vg(-22,22,d.body,d.dark));hilite(-8,-8,24,.4);
  if(d.patch){ellp(9,-4,10,9);cx.fillStyle=d.patch;cx.globalAlpha=.55;cx.fill();cx.globalAlpha=1;}
  ellp(15,5,14,11);felt(d.belly,.25);
  // 鼻
  ellp(27,2,5,4.4);felt('#f07f94',.1);hilite(26,0,4,.6);
  // ほっぺ
  const ck=Math.max(m.cheek,(act==='eat'||act==='nibble')?1:0);
  const blush=(m.kind==='shy'?.55:.3)+(act==='shy'?.4:0);
  if(ck>0){ellp(-2,9,8+ck*7,6+ck*6);felt(vg(0,0,'#fff0f0',d.body),.2);hilite(-4,6,10,.5);ellp(22,11,6+ck*5,5+ck*4);felt(vg(0,0,'#fff0f0',d.body),.2);}
  ellp(-4,9,6,4);cx.fillStyle='rgba(246,130,150,'+blush+')';cx.fill();
  // 目
  drawEyes(m,d,act);
  // 口
  cx.beginPath();
  if(act==='call'||act==='yawn'){ellp(17,13,4,5);cx.fillStyle='#8a4a4a';cx.fill();}
  else if(act==='eat'||act==='nibble'){const mo=Math.abs(Math.sin(T*16))*3;ellp(18,13,3,1+mo);cx.fillStyle='#8a4a4a';cx.fill();}
  else if(m.joy>0||act==='clap'||act==='hop'||act==='giggle'||act==='spin'){cx.moveTo(12,11);cx.quadraticCurveTo(17,19,22,11);cx.fillStyle='#b55a5a';cx.fill();}
  else{cx.moveTo(14,11);cx.quadraticCurveTo(17,14,20,11);cx.quadraticCurveTo(23,14,25,11);cx.lineWidth=1.6;cx.strokeStyle='#7a5040';cx.stroke();}
  // ひげ
  cx.beginPath();[[-3,0],[1,4]].forEach(([dy,dx])=>{cx.moveTo(22,6+dy);cx.lineTo(38+dx,2+dy*2);cx.moveTo(22,8+dy);cx.lineTo(37,9+dy*2.5);});
  cx.lineWidth=1;cx.strokeStyle='rgba(120,90,80,.6)';cx.stroke();
  // リボン（見つけた子）
  if(m.found){drawBow(-10,-20,d.rib,.55);}
  // 花かんむり（スポット席）
  if(m.crown>0){cx.save();cx.globalAlpha=m.crown;for(let i=0;i<5;i++){const a=-Math.PI+i/4*Math.PI;themeShape(0,Math.cos(a)*22,-14+Math.sin(a)*8-6,6,['#ffd56b','#f7a1b5','#8fd8c0'][i%3]);}cx.restore();}
  cx.restore();
  // 運んでいるケーキ
  if(m.carry==='cake'){cx.save();cx.translate(10,-118);rrp(-26,-20,52,30,9);felt(vg(-20,10,'#ffe6ef','#f7bfd0'));ellp(0,-24,8,7);felt('#ef5b6b');cx.restore();}
  cx.restore();
}
function actP(m){const k=m.q[0];if(!k||k.type!=='act')return 0;return clamp(k.t/k.d,0,1);}
function drawArms(m,d,act){
  const arm=(x,y,r)=>{cx.save();cx.translate(x,y);cx.rotate(r);ellp(0,8,6.5,11);felt(vg(0,20,d.body,d.dark),.2);ellp(0,17,5.5,4.5);felt(d.ear,.1);cx.restore();};
  if(act==='clap'||act==='shyclap'){const g=Math.abs(Math.sin(T*(act==='clap'?14:9)))*9;arm(10-g,-48,-1.1);arm(18+g,-48,-2.0);return;}
  if(act==='beg'||m.beg){arm(12,-50,-1.4);arm(18,-50,-1.8);return;}
  if(act==='eat'||act==='nibble'){arm(14,-52,-1.9);arm(20,-50,-2.2);
    cx.save();cx.translate(30,-50);cx.beginPath();cx.moveTo(-8,4);cx.lineTo(8,4);cx.lineTo(4,-8);cx.closePath();felt('#ffd45e',.1);cx.restore();return;}
  if(m.carry||act==='place'||act==='fetch'||m.pose==='ride'||act==='pull'){arm(-10,-58,-3.0+Math.sin(T*8)*.15);arm(18,-58,3.0-Math.sin(T*8)*.15);return;}
  if(act==='call'){arm(18,-56,-2.3);arm(22,-48,-1.6);return;}
  if(act==='tie'||act==='poke'||act==='arrange'||act==='sneakgrab'){const w=Math.sin(T*16)*.5;arm(16,-46,-1.4+w);arm(-12,-44,.3);return;}
  if(act==='shy'){arm(14,-56,-2.4);arm(22,-56,-2.6);return;}
  if(act==='belly'){const w=Math.sin(T*10)*.25;arm(4,-40,-.6+w);arm(14,-38,-1.0-w);return;}
  if(act==='rub'){const w=Math.sin(T*18)*3;arm(12+w,-46,-1.3);arm(18-w,-46,-1.7);return;}
  if(act==='wink'||act==='giggle'){arm(20,-50,-1.9);arm(-14,-44,.4);return;}
  if(m.pose==='climb'){arm(-8,-60,-3.1+Math.sin(T*10)*.3);arm(18,-60,3.0-Math.sin(T*10)*.3);return;}
  if(m.joy>0){arm(-12,-56,-2.7);arm(22,-56,2.7);return;}
  const sw=m.walking?Math.sin(m.walkPh)*.5:Math.sin(T*1.5+m.ph)*.08;
  arm(-14,-46,.35+sw);arm(20,-46,-.35-sw);
}
function drawEyes(m,d,act){
  const lx=clamp(m.lx*(m.face||1),-1,1)*2.2,ly=clamp(m.ly,-1,1)*2.2;

    if(blink){cx.beginPath();cx.moveTo(ex-5,ey);cx.quadraticCurveTo(ex,ey+4,ex+5,ey);cx.lineWidth=2.4;cx.strokeStyle='#3a2a28';cx.stroke();return;}
    const r=big?6.8:(m.kind==='baby'?5.6:5);

    if(big){ellp(ex+lx+2,ey+ly+2,r*.22,r*.22);cx.fill();}

  }

function drawParticles(){
  particles.forEach(p=>{
    const a=clamp(p.life/p.max,0,1);
    cx.save();cx.globalAlpha=Math.min(1,a*1.5);cx.translate(p.x,p.y);cx.rotate(p.rot);
    switch(p.type){
      case 'fluff':ellp(0,0,p.s,p.s*.8);felt(p.col,.3);break;
      case 'star':star(cx,0,0,p.s,p.s*.45);cx.fillStyle=p.col;cx.fill();break;
      case 'conf':rrp(-p.s/2,-p.s/3,p.s,p.s*.66,2);cx.fillStyle=p.col;cx.fill();break;
      case 'heart':cx.rotate(-p.rot);themeShape(2,0,0,p.s,p.col);break;
      case 'bubble':cx.beginPath();cx.arc(0,0,p.s,0,TAU);cx.lineWidth=1.6;cx.strokeStyle=p.col;cx.stroke();break;
      case 'crumb':cx.fillStyle=p.col;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);break;
      case 'thread':cx.beginPath();cx.moveTo(-p.s/2,0);cx.quadraticCurveTo(0,-p.s/2,p.s/2,0);cx.lineWidth=2;cx.strokeStyle=p.col;cx.stroke();break;
      case 'ribfly':cx.rotate(-p.rot);drawBow(0,0,p.rib,1.2);break;
      case 'deco':cx.rotate(-p.rot);themeShape(S.party.theme,0,0,p.s,p.col);break;
    }
    cx.restore();
  });
}

function drawHint(){

  const r=h.r*(1.05+pul*.12+strong*.1);

function drawDemo(){
  const D=S.demo;if(!D)return;
  const h=D.h,t=D.t;
  const sc=74/cam.s/90;
  let x=h.x,y=h.y,press=0,a=1;

  else if(t<2.1){const u=t-.5;
    if(h.kind==='knob'){const ang=u*2.2;x=h.x+Math.cos(ang)*h.r*.55;y=h.y+Math.sin(ang)*h.r*.55;press=1;}
    else{press=(u%0.8)<.3?1:0;}}
  else{a=1-(t-2.1)/.5;}
  cx.save();cx.globalAlpha=clamp(a,0,1)*.9;cx.translate(x,y);cx.scale(sc*(1-press*.08),sc*(1-press*.08));
  if(press){cx.beginPath();cx.arc(0,0,20+((t*3)%1)*30,0,TAU);stitch('rgba(255,255,255,.9)',3,[5,4]);}
  // フェルトの手（人差し指）
  cx.translate(6,8);
  rrp(-8,-6,18,58,9);felt('#fff3e6',.3);
  rrp(-10,34,44,46,18);felt('#fff3e6',.3);
  rrp(12,28,14,30,7);felt('#fde6d4',.3);rrp(24,36,14,28,7);felt('#fde6d4',.3);
  rrp(-22,40,16,30,8);felt('#fde6d4',.3);
  rrp(-6,-2,14,50,7);stitch('#e8b9a0',1.4,[3,3]);
  ellp(1,-1,5,4);cx.fillStyle='rgba(255,190,190,.7)';cx.fill();
  cx.restore();
}

/* ---------------- サイズ・回転・非表示 ---------------- */
function readSA(){
  try{const e=document.getElementById('sa');const cs=getComputedStyle(e);
    SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){SA={t:0,r:0,b:0,l:0};}
}
function resize(){
  VW=Math.max(1,window.innerWidth);VH=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  readSA();
  const p=VH>VW*1.05;
  if(!L||L.p!==p){
    const old=L;L=makeLayout(p);
    if(old)relayout(old);
  }
}
function relayout(old){
  // 回転時：ねずみの位置を新しい部屋に写す（状態は保持）
  KINDS.forEach(k=>{
    const m=M[k];
    const locked=m.q.some(q=>q.lock);
    m.q=[];m.act=null;
    if(m.hs==='emerge'){m.hs='out';m.found=true;if(!S.sessionRib[k]){S.sessionRib[k]=T;if(!save.ribbons.includes(k))save.ribbons.push(k);}}
    if(m.hs!=='out'){const p=spotPos(m.spot);m.x=p.x;m.y=p.y;return;}
    m.x=clamp(m.x/old.RW*L.RW,50,L.RW-50);
    if(m.floor==='L'){m.y=L.MY+m.lane;}else m.y=L.AFY+m.lane*.4;
    if(m.attach&&m.attach.type==='bed')m.attach.ox=clamp(m.attach.ox/old.RW*L.RW,L.bed.x+30,L.bed.x+L.bed.w-30);
    if(S.phase==='closing'&&locked){m.hs='hidden';m.found=false;const p=spotPos(m.spot);m.x=p.x;m.y=p.y;}
  });
  S.aim.init=false;S.food.forEach(f=>{f.state='back';f.t=0;f.x0=f.x;f.y0=f.y;const src=f.kind==='cheese'?{x:L.stool.x,y:plateY()-8}:{x:cakePos().x,y:cakePos().y-20};f.sx=src.x;f.sy=src.y;});
  particles.length=0;S.party.bearer=null;
}
let raf=0,last=null;
function frame(ts){
  raf=requestAnimationFrame(frame);
  const t=ts/1000;let dt=last==null?1/60:t-last;last=t;dt=clamp(dt,0,.05);
  T+=dt;
  update(dt);
  render();
}
function start(){if(!raf){last=null;raf=requestAnimationFrame(frame);}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();flushSave();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}
    P.clear();S.ripples.forEach(r=>{r.held=false;r.t=0;});knobOwner.light=knobOwner.weight=knobOwner.time=null;Object.values(S.K).forEach(K=>K.drag=false);
    S.food.forEach(f=>{if(f.state==='drag'){f.state='back';f.t=0;f.x0=f.x;f.y0=f.y;}});}
  else{try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}start();}
});
window.addEventListener('pagehide',flushSave);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',e=>onUp(e,false),{passive:false});
cv.addEventListener('pointercancel',e=>onUp(e,true),{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(P.has(e.pointerId))onUp(e,true);});
['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------------- 起動 ---------------- */
hadSave=loadSave();
resize();
buildTextures();
initState();
assignSpots(!hadSave||save.ribbons.length===0);
// テスト用の読み取り専用フック（ゲーム外通信なし）
window.__nezumi={get S(){return S;},M,get L(){return L;},cam,toWorld,knobPos,flPos,spotPos,lightTarget,cakePos,chairX,plateY,particles,
  world2screen:(x,y)=>({x:x*cam.s+cam.x,y:y*cam.s+cam.y}),save:()=>save};
start();
})();
</script>
