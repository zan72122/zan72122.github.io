<script>
(function(){
'use strict';
// ================================================================
//  ぺろりん！しろくま店長のアイス色しましま島
//  カウンターのアイス → 目の前の住人が食べる → 服と家の色 → 島の暮らし
// ================================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');

// ---------- 基本ユーティリティ
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eOut=t=>1-(1-t)*(1-t);
const eBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const TAU=Math.PI*2;

const shadeMap=new Map();
function h2r(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function r2h(r,g,b){return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1);}
function shade(h,a){
  const k=h+a; let v=shadeMap.get(k); if(v) return v;
  const c=h2r(h); const t=a>0?255:0; const m=Math.abs(a);
  v=r2h(c[0]+(t-c[0])*m,c[1]+(t-c[1])*m,c[2]+(t-c[2])*m); shadeMap.set(k,v); return v;
}
function mixc(a,b,t){const x=h2r(a),y=h2r(b);return r2h(lerp(x[0],y[0],t),lerp(x[1],y[1],t),lerp(x[2],y[2],t));}

// ---------- 味と住人
const FL=['st','so','gr','va'];
const FC={st:'#ff8c9e',so:'#7ccaf6',gr:'#b898f2',va:'#ffe7a0'};
const PITCH={st:1568,so:1397,gr:1175,va:1047};
const WHITE='#fbf8f2';
const ROOF0='#f1c3a6';
const OUT='rgba(96,70,112,0.26)';
const KINDS=['pig','bird','cat','turtle','rabbit'];
const PERS={
  pig:   {fav:'st',dis:'so',spd:1.0, fly:false, col:'#ffc6d3', dk:'#f39cb2'},
  bird:  {fav:'so',dis:'va',spd:1.25,fly:true,  col:'#ffe37c', dk:'#f2bf45'},
  cat:   {fav:'va',dis:'gr',spd:1.1, fly:false, col:'#f9c993', dk:'#e7a564'},
  turtle:{fav:'gr',dis:'st',spd:0.55,fly:false, col:'#acdd92', dk:'#7fbf6a'},
  rabbit:{fav:'st',dis:null,spd:1.15,fly:false, col:'#fff6f8', dk:'#f3d3dd'}
};

// ---------- 島のワールド配置（家の並び＝隣接関係）
const LAYOUTS={
  wide:{W:1100,H:620,hs:128,
    houses:[[150,262],[350,345],[550,250],[750,345],[950,262]],
    plaza:[550,478],dock:[550,606],
    palms:[[52,400],[1050,400],[255,160],[850,160],[330,545],[775,548],[550,120]],
    shape:{cx:550,cy:340,rx:540,ry:290}},
  tall:{W:640,H:800,hs:122,
    houses:[[175,180],[465,262],[175,392],[465,480],[230,610]],
    plaza:[470,650],dock:[330,786],
    palms:[[52,300],[590,130],[600,380],[50,520],[600,600],[330,96],[90,700]],
    shape:{cx:320,cy:430,rx:316,ry:384}}
};
let LY=LAYOUTS.wide, LYN='wide';
let HSP=[],DOOR=[],HOME=[],MID=[],PLAZA={x:0,y:0},DOCK={x:0,y:0};
function buildWorld(){
  HSP=LY.houses.map(p=>({x:p[0],y:p[1]}));
  DOOR=HSP.map(p=>({x:p.x,y:p.y+22}));
  HOME=HSP.map(p=>({x:p.x+LY.hs*0.44,y:p.y+26}));
  MID=[];for(let i=0;i<4;i++)MID.push({x:(HSP[i].x+HSP[i+1].x)/2,y:(HSP[i].y+HSP[i+1].y)/2+30});
  PLAZA={x:LY.plaza[0],y:LY.plaza[1]};DOCK={x:LY.dock[0],y:LY.dock[1]};
  groundDirty=true;
}

// ================================================================
//  保存（端末内・失敗してもメモリで続行）
// ================================================================
const KEY='gf261030-9-shirokuma-island';
const VER=3;
const Store={ok:true,mem:null,status:'init',
  read(){try{const s=window.localStorage.getItem(KEY);return s;}catch(e){this.ok=false;this.status='denied';return this.mem;}},
  write(s){this.mem=s;if(!this.ok)return;try{window.localStorage.setItem(KEY,s);this.status='saved';}catch(e){this.ok=false;this.status='denied';}}
};
function freshState(){
  // 隣接関係を少し変える：ぶたは常に左から2軒目（最初の客・左右に隣家あり）
  const others=['bird','cat','turtle','rabbit'];
  for(let i=others.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=others[i];others[i]=others[j];others[j]=t;}
  const order=[others[0],'pig',others[1],others[2],others[3]];
  const res={};KINDS.forEach(k=>res[k]={eat:[],hat:null,fr:{}});
  return {v:VER,order,houses:order.map(()=>({c:null,h:[]})),res,ov:false,sign:null,disc:{},armP:true,armR:true,serves:0,cycles:0,sinceGift:0,bearHat:null};
}
const isF=x=>FL.indexOf(x)>=0;
function validate(o){
  if(!o||typeof o!=='object'||o.v!==VER) return null;
  if(!Array.isArray(o.order)||o.order.length!==5) return null;
  const seen={};for(const k of o.order){if(KINDS.indexOf(k)<0||seen[k])return null;seen[k]=1;}
  if(!Array.isArray(o.houses)||o.houses.length!==5) return null;
  const houses=[];
  for(const h of o.houses){
    if(!h||typeof h!=='object') return null;
    const c=h.c==null?null:h.c; if(c!==null&&!isF(c)) return null;
    if(!Array.isArray(h.h)||h.h.length>4||!h.h.every(isF)) return null;
    if(c===null&&h.h.length) return null;
    houses.push({c,h:h.h.slice()});
  }
  if(!o.res||typeof o.res!=='object') return null;
  const res={};
  for(const k of KINDS){
    const r=o.res[k]; if(!r||typeof r!=='object') return null;
    if(!Array.isArray(r.eat)||r.eat.length>40||!r.eat.every(isF)) return null;
    let hat=null; if(r.hat!=null){if(!Array.isArray(r.hat)||r.hat.length<2||r.hat.length>5||!r.hat.every(isF))return null;hat=r.hat.slice();}
    const fr={}; if(r.fr&&typeof r.fr==='object'){for(const q of KINDS){const v=r.fr[q];if(v!=null){if(typeof v!=='number'||!isFinite(v)||v<0)return null;fr[q]=Math.min(9999,Math.floor(v));}}}
    res[k]={eat:r.eat.slice(-20),hat,fr};
  }
  const arr=a=>a==null?null:(Array.isArray(a)&&a.length>=1&&a.length<=5&&a.every(isF)?a.slice():undefined);
  const sign=arr(o.sign),bearHat=arr(o.bearHat); if(sign===undefined||bearHat===undefined) return null;
  const num=(v)=>typeof v==='number'&&isFinite(v)&&v>=0?Math.floor(v):0;
  const painted=houses.filter(h=>h.c).length;
  const disc={};if(o.disc&&typeof o.disc==='object')for(const k in o.disc)if(o.disc[k]===true)disc[k]=true;
  return {v:VER,order:o.order.slice(),houses,res,ov:!!o.ov&&painted>=4,sign,disc,
    armP:o.armP!==false,armR:o.armR!==false,serves:num(o.serves),cycles:num(o.cycles),sinceGift:num(o.sinceGift),bearHat};
}
let S=null, loadInfo='fresh';
function loadState(){
  const raw=Store.read();
  if(raw==null){loadInfo=Store.ok?'fresh':'denied';return freshState();}
  try{const v=validate(JSON.parse(raw));if(v){loadInfo='restored';return v;}loadInfo='invalid';}
  catch(e){loadInfo='corrupt';}
  return freshState();
}
let saveT=-1;
function markSave(){if(saveT<0)saveT=0.4;}
function saveNow(){saveT=-1;try{Store.write(JSON.stringify(S));}catch(e){}}
const houseOf=k=>S.order.indexOf(k);
const D=()=>S.disc;
function disc(name){if(!S.disc[name]){S.disc[name]=true;markSave();}}

// ================================================================
//  音（Web Audio 合成）
// ================================================================
const AU={c:null,m:null,nb:null,
  init(){
    if(this.c){this.resume();return;}
    try{
      const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      const c=new A(); const m=c.createGain(); m.gain.value=0.5;
      const comp=c.createDynamicsCompressor(); m.connect(comp); comp.connect(c.destination);
      const nb=c.createBuffer(1,c.sampleRate*1,c.sampleRate); const d=nb.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      this.c=c;this.m=m;this.nb=nb;this.resume();
    }catch(e){this.c=null;}
  },
  resume(){const c=this.c;if(c&&c.state!=='running'&&!document.hidden){try{const p=c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}},
  suspend(){const c=this.c;if(c&&c.state==='running'){try{const p=c.suspend();if(p&&p.catch)p.catch(()=>{});}catch(e){}}},
  ok(){return this.c&&!document.hidden;},
  tone(f,d,o){
    if(!this.ok())return; o=o||{};
    try{
      const c=this.c,t0=c.currentTime+(o.at||0);
      const os=c.createOscillator(),g=c.createGain();
      os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0);
      if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t0+(o.slide||d));
      const v=o.v==null?0.18:o.v,a=o.a||0.006;
      g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+a);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
      os.connect(g); g.connect(this.m); os.start(t0); os.stop(t0+d+0.05);
    }catch(e){}
  },
  noise(d,o){
    if(!this.ok())return; o=o||{};
    try{
      const c=this.c,t0=c.currentTime+(o.at||0);
      const s=c.createBufferSource(); s.buffer=this.nb;
      const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1200,t0);
      if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t0+d); f.Q.value=o.q||1;
      const g=c.createGain(); const v=o.v==null?0.1:o.v;
      g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+(o.a||0.01));
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
      s.connect(f); f.connect(g); g.connect(this.m); s.start(t0,Math.random()*0.5); s.stop(t0+d+0.05);
    }catch(e){}
  }
};
const ST=n=>Math.pow(2,n/12);
const SND={
  squash(){AU.tone(560,0.09,{to:250,v:0.22});},
  bell(f,k,at){const p=PITCH[f]*ST(k||0);AU.tone(p,0.7,{v:0.12,at});AU.tone(p*2.76,0.32,{v:0.045,at});AU.tone(p*5.4,0.16,{v:0.02,at});},
  slide(){AU.noise(0.36,{f:2600,f2:800,v:0.07,q:1.4});},
  catchB(){AU.tone(300,0.16,{to:560,type:'triangle',v:0.12});},
  nom(){for(let i=0;i<3;i++)AU.tone(230-i*12,0.08,{at:i*0.24,type:'square',v:0.045,to:150});},
  neutral(f){SND.bell(f,0);SND.bell(f,7,0.13);},
  fav(f){[0,4,7,12,16,19].forEach((n,i)=>AU.tone(523*ST(n),0.28,{at:i*0.07,type:'triangle',v:0.12}));SND.bell(f,12,0.45);},
  snort(){AU.tone(150,0.12,{type:'sawtooth',v:0.06,to:110});AU.tone(160,0.12,{type:'sawtooth',v:0.06,to:115,at:0.18});},
  hic(at){AU.tone(380,0.13,{to:960,v:0.16,at});AU.tone(1300,0.06,{to:2300,v:0.05,at:(at||0)+0.1});},
  bubble(){AU.tone(rnd(900,1500),0.07,{to:2300,v:0.05});},
  shiver(){for(let i=0;i<6;i++)AU.tone(880+(i%2)*60,0.06,{at:i*0.07,v:0.05,type:'triangle'});},
  sour(){AU.tone(700,0.25,{to:420,type:'triangle',v:0.09});},
  shell(){AU.tone(300,0.1,{to:180,type:'square',v:0.06});AU.tone(500,0.18,{to:900,v:0.08,at:0.55});},
  boing(){AU.tone(200,0.25,{to:600,type:'triangle',v:0.1});},
  purr(){AU.tone(70,0.6,{type:'sawtooth',v:0.04});},
  paint(f){AU.noise(0.3,{ft:'lowpass',f:2400,f2:500,v:0.11});SND.bell(f,12,0.05);},
  thunk(){AU.tone(170,0.1,{to:90,type:'square',v:0.06});},
  splash(){AU.noise(0.45,{ft:'lowpass',f:2000,f2:300,v:0.16});AU.tone(400,0.2,{to:900,v:0.05});},
  success(){[0,4,7,12].forEach((n,i)=>AU.tone(659*ST(n),0.4,{at:i*0.09,type:'triangle',v:0.13}));AU.tone(1319*2,0.5,{at:0.36,v:0.04});},
  bridge(){[0,2,4,7,9,12].forEach((n,i)=>AU.tone(784*ST(n),0.18,{at:i*0.08,type:'triangle',v:0.1}));},
  hat(){[0,7,12,19].forEach((n,i)=>AU.tone(1047*ST(n),0.2,{at:i*0.06,v:0.06}));},
  call(){AU.tone(700,0.2,{to:1300,type:'triangle',v:0.1});AU.tone(1300,0.15,{to:1000,type:'triangle',v:0.08,at:0.2});},
  grow(){AU.tone(220,1.8,{to:880,type:'triangle',v:0.1,slide:1.6});[0,4,7,12].forEach((n,i)=>AU.tone(523*ST(n),1.2,{at:1.4+i*0.05,v:0.07,type:'triangle'}));},
  drum(at){AU.noise(0.12,{ft:'lowpass',f:500,v:0.18,at});AU.tone(95,0.15,{to:60,v:0.14,at});},
  snare(at){AU.noise(0.1,{ft:'highpass',f:2500,v:0.06,at});},
  note(f,d,at,v){AU.tone(f,d,{at,type:'triangle',v:v||0.08});},
  firework(){AU.noise(0.6,{ft:'bandpass',f:900,f2:200,v:0.09});AU.tone(rnd(900,1400),0.4,{to:300,v:0.03});},
  fanfare(){[[0,0],[4,.15],[7,.3],[12,.45],[7,.75],[12,.9],[16,1.05]].forEach(a=>AU.tone(523*ST(a[0]),0.35,{at:a[1],type:'square',v:0.05}));SND.success();},
  wob(){AU.tone(880,0.05,{v:0.025});}
};

// ================================================================
//  画面・レイアウト
// ================================================================
let VW=0,VH=0,DPR=1;const SA={t:0,r:0,b:0,l:0};
let L=null;
function readSafe(){
  try{const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
let bgCan=document.createElement('canvas');
function resize(){
  VW=Math.max(1,window.innerWidth);VH=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  readSafe();
  const nl=VW>VH*0.95?'wide':'tall';
  if(nl!==LYN||!HSP.length){LYN=nl;LY=LAYOUTS[nl];buildWorld();if(S)relocateResidents();}
  buildBg(); groundDirty=true;
  L=computeLayout(OV.t);
}
function computeLayout(t){
  const W=VW,H=VH,port=H>=W;
  const top=SA.t,bot=H-SA.b,left=SA.l,right=W-SA.r;
  const cH0=port?clamp(H*0.19,104,200):clamp(H*0.22,104,200);
  const cH=lerp(cH0,cH0*0.8,t);
  const cTop=bot-cH;
  const islB=lerp(port&&W/H>0.6?0.5:0.45,port?0.62:0.6,t)*H;
  const iR={x:left+4,y:top+4,w:right-left-8,h:Math.max(60,islB-top-10)};
  const sc=Math.min(iR.w/LY.W,iR.h/(LY.H+30));
  const ox=iR.x+(iR.w-LY.W*sc)/2, oy=iR.y+iR.h-(LY.H+30)*sc;
  const zTop=islB, zH=Math.max(40,cTop-zTop);
  const cs=Math.min(zH*0.8,port?W*0.43:H*0.3,250);
  const ts=cH*0.46;
  const feet=cTop+ts*0.4;
  const cuX=port?left+(right-left)*0.58:W*0.52;
  const beX=port?left+Math.max(cs*0.5,(right-left)*0.2):W*0.3;
  const signS=Math.min(76,zH*0.3,W*0.17);
  const signX=port?right-signS*0.75-6:W*0.83, signY=zTop+6;
  const qX=port?right-cs*0.28:W*0.7, qS=cs*0.58;
  const cw=port?(right-left-16):Math.min(W-40,860);
  const cx0=port?left+8:(W-cw)/2;
  const slotW=cw/4;
  const is=Math.min(slotW*0.66,cH*0.7,128);
  const slots=[];for(let i=0;i<4;i++)slots.push({x:cx0+slotW*(i+0.5),y:cTop+ts*0.86,w:slotW,x0:cx0+slotW*i});
  return {port,W,H,top,bot,left,right,cH,cTop,ts,iR,sc,ox,oy,zTop,zH,cs,feet,cuX,beX,bs:cs*1.12,signS,signX,signY,qX,qS,cw,cx0,slotW,is,slots};
}
const wx=x=>L.ox+x*L.sc, wy=y=>L.oy+y*L.sc;
function buildBg(){
  bgCan.width=Math.round(VW*DPR);bgCan.height=Math.round(VH*DPR);
  const g=bgCan.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const gr=g.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,'#c9eeff');gr.addColorStop(0.12,'#b3e7fb');gr.addColorStop(0.16,'#93dbf1');gr.addColorStop(1,'#6fc6e6');
  g.fillStyle=gr;g.fillRect(0,0,VW,VH);
  // 柔らかな日差し
  const sx=VW*0.86,sy=VH*0.05;const sg=g.createRadialGradient(sx,sy,0,sx,sy,VH*0.3);
  sg.addColorStop(0,'rgba(255,250,215,0.95)');sg.addColorStop(0.15,'rgba(255,244,200,0.55)');sg.addColorStop(1,'rgba(255,244,200,0)');
  g.fillStyle=sg;g.fillRect(0,0,VW,VH);
  // 海のきらめきブロック
  g.fillStyle='rgba(255,255,255,0.18)';
  for(let i=0;i<70;i++){const x=(i*137.5)%VW,y=VH*0.17+((i*71.3)%(VH*0.8));const s=4+(i%3)*3;g.fillRect(x,y,s*2,s*0.6);}
}

// ---------- 地面キャッシュ
let groundCan=document.createElement('canvas'),groundSc=0,groundDirty=true;
function buildGround(sc){
  const w=LY.W*sc,h=(LY.H+30)*sc;
  groundCan.width=Math.max(2,Math.ceil(w*DPR)+2);groundCan.height=Math.max(2,Math.ceil(h*DPR)+2);
  const g=groundCan.getContext('2d');g.setTransform(DPR*sc,0,0,DPR*sc,0,0);
  const sh=LY.shape,B=40;
  const rows=[],rows2=[];
  for(let y=sh.cy-sh.ry;y<sh.cy+sh.ry;y+=B){
    const k=(y+B/2-sh.cy)/sh.ry;if(Math.abs(k)>=1)continue;
    const hw=sh.rx*Math.sqrt(1-k*k);
    rows.push([y,Math.round((sh.cx-hw)/B)*B,Math.round((sh.cx+hw)/B)*B]);
    const k2=(y+B/2-sh.cy)/(sh.ry*0.84);
    if(Math.abs(k2)<1){const hw2=sh.rx*0.86*Math.sqrt(1-k2*k2);rows2.push([y,Math.round((sh.cx-hw2)/B)*B,Math.round((sh.cx+hw2)/B)*B]);}
  }
  // 浅瀬
  g.fillStyle='rgba(200,245,255,0.55)';rows.forEach(r=>g.fillRect(r[1]-20,r[0]-8,r[2]-r[1]+40,B+30));
  // 崖（ブロックの側面）
  g.fillStyle='#e2bd8e';rows.forEach(r=>g.fillRect(r[1],r[0]+24,r[2]-r[1],B));
  g.fillStyle='#d3a977';rows.forEach(r=>{for(let x=r[1];x<r[2];x+=B)g.fillRect(x,r[0]+B+20,2,4);});
  // 砂
  rows.forEach(r=>{for(let x=r[1];x<r[2];x+=B){g.fillStyle=((x/B+r[0]/B)&1)?'#fff1d4':'#fbe7c2';g.fillRect(x,r[0],B,B);}});
  // 草
  rows2.forEach(r=>{for(let x=r[1];x<r[2];x+=B){g.fillStyle=((x/B+r[0]/B)&1)?'#c4ecaa':'#b6e49b';g.fillRect(x,r[0],B,B);}});
  g.fillStyle='rgba(255,255,255,0.25)';rows2.forEach(r=>g.fillRect(r[1],r[0],r[2]-r[1],4));
  // 道
  g.lineCap='round';g.lineJoin='round';
  const road=(pts,w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);g.stroke();};
  const chain=[];for(let i=0;i<5;i++){chain.push(DOOR[i]);if(i<4)chain.push(MID[i]);}
  for(let pass=0;pass<2;pass++){
    const w=pass?24:32,col=pass?'#fff6e2':'#efd9b0';
    road(chain,w,col);
    for(let i=0;i<5;i++)road([DOOR[i],{x:(DOOR[i].x+PLAZA.x)/2,y:Math.max(DOOR[i].y,PLAZA.y-60)},PLAZA],w,col);
    road([PLAZA,DOCK],w+6,col);
  }
  // 桟橋
  g.fillStyle='#e9c79a';g.fillRect(DOCK.x-34,DOCK.y-28,68,46);g.fillStyle='#d7ae7e';
  for(let i=0;i<4;i++)g.fillRect(DOCK.x-34+i*17,DOCK.y-28,2,46);
  groundSc=sc;groundDirty=false;
}

function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
// x,y = 前面の左下。d = 奥行き
function cube(x,y,w,h,d,col,ol){
  if(d>0){
    const dx=d*0.6,dy=d*0.45;
    ctx.fillStyle=shade(col,0.24);
    ctx.beginPath();ctx.moveTo(x+1,y-h);ctx.lineTo(x+dx+1,y-h-dy);ctx.lineTo(x+w+dx-1,y-h-dy);ctx.lineTo(x+w,y-h);ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(col,-0.14);
    ctx.beginPath();ctx.moveTo(x+w,y-h+1);ctx.lineTo(x+w+dx,y-h-dy+1);ctx.lineTo(x+w+dx,y-dy-1);ctx.lineTo(x+w,y-1);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle=col;rr(x,y-h,w,h,Math.min(w,h)*0.16);ctx.fill();
  if(ol!==false){ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(1,Math.min(w,h)*0.045);ctx.stroke();}
}
function shadow(x,y,w){ctx.fillStyle='rgba(70,60,90,0.14)';ctx.beginPath();ctx.ellipse(x,y,w,w*0.3,0,0,TAU);ctx.fill();}
function stripesIn(x,y,w,h,cols,n,diag){
  ctx.save();rr(x,y,w,h,Math.min(w,h)*0.16);ctx.clip();
  const sw=w/n;
  for(let i=0;i<n+2;i++){ctx.fillStyle=cols[i%cols.length];
    if(diag){ctx.beginPath();const x0=x+i*sw-h*0.5;ctx.moveTo(x0,y+h);ctx.lineTo(x0+sw,y+h);ctx.lineTo(x0+sw+h*0.5,y);ctx.lineTo(x0+h*0.5,y);ctx.closePath();ctx.fill();}
    else ctx.fillRect(x+i*sw,y,sw+0.5,h);}
  ctx.restore();
}

// ---------- アイス
function drawIce(x,y,s,f,o){
  o=o||{};
  ctx.save();ctx.translate(x,y);
  const sq=o.sq||0,st=o.st||0;
  ctx.scale((1+sq*0.45)*(1+st*0.5),(1-sq*0.45)*(1-st*0.25));
  if(o.rot)ctx.rotate(o.rot);
  const cw=s*0.56,ch=s*0.3;
  if(!o.noCone){
    cube(-cw/2,0,cw,ch,s*0.14,'#f2cc8e');
    ctx.strokeStyle='rgba(190,130,70,0.45)';ctx.lineWidth=Math.max(1,s*0.025);ctx.beginPath();
    for(let i=1;i<4;i++){ctx.moveTo(-cw/2+cw*i/4,-ch+2);ctx.lineTo(-cw/2+cw*i/4,-2);}
    ctx.moveTo(-cw/2+2,-ch/2);ctx.lineTo(cw/2-2,-ch/2);ctx.stroke();
  }
  const iw=s*0.74,ih=s*0.62,by=o.noCone?0:-ch+s*0.04;
  const col=FC[f];
  const rem=o.rem==null?1:o.rem;
  const ihh=ih*rem;
  ctx.globalAlpha*=0.93;
  cube(-iw/2,by,iw,ihh,s*0.2,col,false);
  // 透明感
  const g=ctx.createLinearGradient(0,by-ihh,0,by);
  g.addColorStop(0,'rgba(255,255,255,0.55)');g.addColorStop(0.5,'rgba(255,255,255,0.08)');g.addColorStop(1,'rgba(255,255,255,0.22)');
  ctx.fillStyle=g;rr(-iw/2,by-ihh,iw,ihh,iw*0.16);ctx.fill();
  ctx.globalAlpha/=0.93;
  ctx.strokeStyle=shade(col,-0.25);ctx.globalAlpha*=0.5;ctx.lineWidth=Math.max(1,s*0.03);rr(-iw/2,by-ihh,iw,ihh,iw*0.16);ctx.stroke();ctx.globalAlpha/=0.5;
  ctx.fillStyle='rgba(255,255,255,0.75)';rr(-iw*0.36,by-ihh+ih*0.1,iw*0.14,ihh*0.55,iw*0.07);ctx.fill();
  // 味の目印（形で区別）
  if(rem>0.3){
    const cy=by-ihh*0.5;
    if(f==='st'){ctx.fillStyle='#e0526c';for(let i=0;i<5;i++){ctx.fillRect(-iw*0.1+((i*37)%5-2)*iw*0.12,cy+((i*23)%3-1)*ihh*0.2,s*0.04,s*0.06);}
      ctx.fillStyle='#ff5a78';ctx.beginPath();ctx.arc(iw*0.18,cy-ihh*0.05,s*0.1,0,TAU);ctx.fill();ctx.fillStyle='#7fcf72';ctx.fillRect(iw*0.14,cy-ihh*0.05-s*0.15,s*0.08,s*0.06);}
    else if(f==='so'){ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=Math.max(1,s*0.03);
      for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-iw*0.05+(i%2)*iw*0.22,cy+ihh*0.25-i*ihh*0.17,s*(0.04+0.015*i),0,TAU);ctx.stroke();}}
    else if(f==='gr'){ctx.fillStyle='#8a63d6';[[0,0],[1,0],[0.5,0.8],[-0.5,0.8],[1.5,0.8],[0.5,1.6]].forEach(p=>{ctx.beginPath();ctx.arc(iw*0.02+p[0]*s*0.075,cy-ihh*0.18+p[1]*s*0.075,s*0.042,0,TAU);ctx.fill();});
      ctx.fillStyle='#77c46a';ctx.fillRect(iw*0.05,cy-ihh*0.18-s*0.1,s*0.07,s*0.05);}
    else {ctx.fillStyle='#8b6a3e';for(let i=0;i<6;i++)ctx.fillRect(-iw*0.15+((i*29)%6)*iw*0.08,cy-ihh*0.2+((i*17)%4)*ihh*0.13,s*0.025,s*0.025);
      ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.arc(iw*0.15,cy-ihh*0.1,s*0.07,0,TAU);ctx.fill();}
  }
  ctx.restore();
}

// ---------- キャラクター（ブロック動物）
function drawHat(u,hx,hy,hs,cols){
  const bw=hs*1.12,bx=-bw/2;
  cube(bx,hy+u*0.5,bw,u*0.6,u*0.5,cols[0]);
  const cw=hs*0.72,cx=-cw/2,ch=u*2.1;
  cube(cx,hy+u*0.05,cw,ch,u*0.6,cols[0],false);
  stripesIn(cx,hy+u*0.05-ch,cw,ch,cols,cols.length>=3?6:4,cols.length>=3);
  ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(1,u*0.2);rr(cx,hy+u*0.05-ch,cw,ch,u*0.3);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,hy+u*0.05-ch-u*0.3,u*0.45,0,TAU);ctx.fill();
}
function drawFace(k,u,hx,hy,hs,o){
  const lx=(o.look||0)*0.55*u,ly=(o.lookUp||0)*-0.5*u;
  const e1x=hx+hs*0.3+lx,e2x=hx+hs*0.7+lx,ey=hy+hs*0.44+ly;

  ctx.fillStyle='#3b2f45';ctx.strokeStyle='#3b2f45';ctx.lineWidth=Math.max(1,u*0.32);ctx.lineCap='round';

  else if(fc==='o'){ctx.beginPath();ctx.arc(e1x,ey,u*0.5,0,TAU);ctx.arc(e2x,ey,u*0.5,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e1x-u*0.2,ey-u*0.3,u*0.25,u*0.25);ctx.fillRect(e2x-u*0.2,ey-u*0.3,u*0.25,u*0.25);}

  else if(fc==='sleep'||o.blink){ctx.beginPath();ctx.moveTo(e1x-u*0.45,ey);ctx.lineTo(e1x+u*0.45,ey);ctx.moveTo(e2x-u*0.45,ey);ctx.lineTo(e2x+u*0.45,ey);ctx.stroke();}
  else {rr(e1x-u*0.36,ey-u*0.5,u*0.72,u*0.95,u*0.25);ctx.fill();rr(e2x-u*0.36,ey-u*0.5,u*0.72,u*0.95,u*0.25);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(e1x-u*0.2,ey-u*0.35,u*0.25,u*0.25);ctx.fillRect(e2x-u*0.2,ey-u*0.35,u*0.25,u*0.25);}
  // ほっぺ（食べるとぷくっ）
  const ck=o.cheek||0;
  ctx.fillStyle=ck>0.05?'rgba(255,150,170,0.9)':'rgba(255,150,170,0.6)';
  const cr=u*(0.55+ck*0.9);
  ctx.beginPath();ctx.ellipse(hx+hs*0.13-ck*u*0.4,hy+hs*0.68,cr,cr*0.8,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(hx+hs*0.87+ck*u*0.4,hy+hs*0.68,cr,cr*0.8,0,0,TAU);ctx.fill();
  const mx=hx+hs*0.5+lx*0.5,my=hy+hs*0.8;
  // 口と鼻（動物ごと）
  if(k==='pig'){ctx.fillStyle='#ff9fb6';rr(mx-u*1.05,hy+hs*0.56,u*2.1,u*1.25,u*0.4);ctx.fill();ctx.fillStyle='#d76c8b';ctx.fillRect(mx-u*0.55,hy+hs*0.56+u*0.4,u*0.32,u*0.45);ctx.fillRect(mx+u*0.23,hy+hs*0.56+u*0.4,u*0.32,u*0.45);}
  else if(k==='bird'){ctx.fillStyle='#ff9a3d';ctx.beginPath();ctx.moveTo(mx-u*0.8,hy+hs*0.58);ctx.lineTo(mx+u*0.8,hy+hs*0.58);ctx.lineTo(mx,hy+hs*0.58+u*(fc==='o'||o.eat?1.4:1.0));ctx.closePath();ctx.fill();}
  else if(k==='cat'){ctx.fillStyle='#ff8fa8';ctx.beginPath();ctx.moveTo(mx-u*0.35,hy+hs*0.6);ctx.lineTo(mx+u*0.35,hy+hs*0.6);ctx.lineTo(mx,hy+hs*0.68);ctx.fill();
    ctx.strokeStyle='rgba(80,60,70,0.55)';ctx.lineWidth=Math.max(1,u*0.15);ctx.beginPath();ctx.moveTo(hx-u*0.3,hy+hs*0.62);ctx.lineTo(hx+hs*0.25,hy+hs*0.66);ctx.moveTo(hx+hs+u*0.3,hy+hs*0.62);ctx.lineTo(hx+hs*0.75,hy+hs*0.66);ctx.stroke();}
  else if(k==='rabbit'){ctx.fillStyle='#ff9fb6';ctx.beginPath();ctx.arc(mx,hy+hs*0.62,u*0.32,0,TAU);ctx.fill();}
  ctx.strokeStyle='#3b2f45';ctx.lineWidth=Math.max(1,u*0.25);
  if(o.eat){const ph=Math.sin(o.eat*20);ctx.beginPath();ctx.moveTo(mx-u*0.5,my+ph*u*0.15);ctx.lineTo(mx+u*0.5,my-ph*u*0.15);ctx.stroke();}
  else if(fc==='o'){ctx.beginPath();ctx.arc(mx,my+u*0.1,u*0.38,0,TAU);ctx.stroke();}
  else if(fc==='sour'){ctx.beginPath();ctx.moveTo(mx-u*0.6,my);ctx.lineTo(mx-u*0.2,my-u*0.2);ctx.lineTo(mx+u*0.2,my);ctx.lineTo(mx+u*0.6,my-u*0.2);ctx.stroke();}
  else if(k!=='bird'){ctx.beginPath();ctx.arc(mx,my-u*0.3,u*(fc==='happy'?0.6:0.42),0.15*Math.PI,0.85*Math.PI);ctx.stroke();}

// x,y = 足元中央, s = 身長(px)
function drawChar(k,x,y,s,o){

  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if(!o.noShadow)shadow(0,0,s*0.26*(1-Math.min(0.5,(o.alt||0)/(s*2))));
  ctx.translate(0,-(o.alt||0));
  if(o.rot)ctx.rotate(o.rot);
  const sq=o.sq||0;ctx.scale((1+sq*0.4)*(o.sx||1),1-sq*0.4);
  const cloth=o.cloth||'#ffffff';
  const head=P.col,dk=P.dk;
  const wk=o.walk||0;
  // かめ：こうらにかくれる
  if(k==='turtle'&&o.hide>0){
    const hh=o.hide;
    cube(-3.4*u,-0.2*u,6.8*u,5.4*u,u*1.2,dk);
    ctx.fillStyle=shade(dk,-0.12);for(let i=0;i<3;i++)for(let j=0;j<2;j++)rr(-2.8*u+i*2*u,-5.1*u+j*2.3*u,1.6*u,1.8*u,u*0.4),ctx.fill();
    if(hh<0.75){ctx.fillStyle='#3b2f45';ctx.fillRect(-1.2*u,-1.2*u,u*0.6,u*0.6);ctx.fillRect(0.6*u,-1.2*u,u*0.6,u*0.6);
      if(o.cheek){ctx.fillStyle='rgba(255,140,165,0.9)';ctx.beginPath();ctx.arc(-2*u,-0.9*u,u*0.6,0,TAU);ctx.arc(2*u,-0.9*u,u*0.6,0,TAU);ctx.fill();}}

  if(k==='turtle'){cube(-3.2*u,-legH+0.3*u,6.4*u,4.2*u,u,dk);ctx.fillStyle=shade(dk,-0.12);for(let i=0;i<3;i++)rr(-2.7*u+i*1.9*u,-legH-3.2*u,1.5*u,1.6*u,u*0.4),ctx.fill();}
  if(k==='pig'){ctx.strokeStyle=dk;ctx.lineWidth=u*0.5;ctx.beginPath();ctx.arc(2.6*u,-2.6*u,u*0.6,0,Math.PI*1.6);ctx.stroke();}
  // あし
  const lc=k==='bird'?'#ff9a3d':dk;
  const l1=Math.max(0,Math.sin(wk))*0.5*u,l2=Math.max(0,-Math.sin(wk))*0.5*u;
  if(k==='bird'){ctx.fillStyle=lc;ctx.fillRect(-1.3*u,-legH-l1,u*0.6,legH);ctx.fillRect(0.7*u,-legH-l2,u*0.6,legH);ctx.fillRect(-1.7*u,-u*0.4-l1,u*1.3,u*0.4);ctx.fillRect(0.4*u,-u*0.4-l2,u*1.3,u*0.4);}

  if(o.fest){ctx.fillStyle='#fff';ctx.fillRect(-bodyW/2,by-bodyH*0.62,bodyW,u*0.55);ctx.fillRect(-u*0.3,by-bodyH,u*0.6,bodyH);}

    if(k==='cat'){ctx.fillStyle='#ffc0cf';ctx.beginPath();ctx.moveTo(hx+0.8*u,hy+0.3*u);ctx.lineTo(hx+0.9*u,hy-0.6*u);ctx.lineTo(hx+1.5*u,hy+0.2*u);ctx.fill();ctx.beginPath();ctx.moveTo(hx+hs-0.8*u,hy+0.3*u);ctx.lineTo(hx+hs-0.9*u,hy-0.6*u);ctx.lineTo(hx+hs-1.5*u,hy+0.2*u);ctx.fill();}}
  if(k==='bird'){ctx.fillStyle='#ff8fb0';for(let i=0;i<3;i++){ctx.save();ctx.translate((i-1)*0.8*u,hy+0.3*u);ctx.rotate((i-1)*0.35);rr(-0.35*u,-1.8*u,0.7*u,1.9*u,u*0.35);ctx.fill();ctx.restore();}}

function drawBear(x,y,s,o){

  ctx.fillStyle='#ffd3df';ctx.beginPath();ctx.arc(hx+0.6*u,hy+0.4*u,0.5*u,0,TAU);ctx.arc(hx+hs-0.6*u,hy+0.4*u,0.5*u,0,TAU);ctx.fill();

  ctx.fillStyle='#3b2f45';rr(hx+hs*0.42+lx*0.3,hy+hs*0.58,hs*0.16,hs*0.1,u*0.2);ctx.fill();

function mkRes(k){return {k,x:0,y:0,state:'home',t:rnd(1.5,4),path:[],after:null,spd:150,walk:0,alt:0,look:0,lookUp:0,lookT:0,
  carry:null,wantShop:false,visit:-1,swim:-1,build:-1,anim:null,animT:0,bounce:0,wave:0,wTimer:rnd(2,6),blinkT:rnd(1,4),flagC:null,fest:null,hatAnim:0};}

}
function relocateResidents(){
  KINDS.forEach(k=>{const r=R[k];if(!r)return;const hi=houseOf(k);
    if(r.state==='shop'||r.state==='queue'||r.state==='fest'||r.state==='gift')return;
    if(r.carry){r.x=DOCK.x;r.y=DOCK.y;r.state='walk';r.path=[{x:PLAZA.x,y:PLAZA.y},HOME[hi]];r.after='paint';return;}
    r.x=HOME[hi].x;r.y=HOME[hi].y;r.state='home';r.path=[];r.t=rnd(1,3);r.visit=-1;r.swim=-1;r.build=-1;});
}
const clothOf=k=>{const e=S.res[k].eat;return e.length?FC[e[e.length-1]]:'#ffffff';};
function patternOf(i){const h=S.houses[i];return h.h.length&&h.c?h.h.concat([h.c]).map(f=>FC[f]):null;}

// ---------- 粒子
function addP(o){if(P.length>=MAXP)return;o.t=0;P.push(o);}
function burst(x,y,col,n,type,sp,sz){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(0.3,1)*(sp||120);addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(sp||120)*0.4,g:260,life:rnd(0.5,0.9),col,type:type||'dot',s:(sz||5)*rnd(0.7,1.3),rot:rnd(0,TAU)});}}
function flavorBurst(x,y,f,n,s){
  const t={st:'drop',so:'bubble',gr:'spark',va:'snow'}[f];
  for(let i=0;i<n;i++){const a=rnd(Math.PI*1.1,Math.PI*1.9),v=rnd(40,140)*(s||1);
    addP({x:x+rnd(-8,8),y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:t==='bubble'?-60:(t==='snow'?30:220),life:rnd(0.6,1.1),col:FC[f],type:t,s:rnd(4,8)*(s||1),rot:rnd(0,TAU)});}
}
function ring(x,y,col,r){addP({x,y,vx:0,vy:0,g:0,life:0.6,col,type:'ring',s:r||40});}
function updP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>=p.life){P.splice(i,1);continue;}
  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*3;if(p.type==='bubble')p.x+=Math.sin(p.t*8+p.rot)*0.6;}}
function drawP(){
  for(const p of P){const k=p.t/p.life;ctx.globalAlpha=k<0.7?1:1-(k-0.7)/0.3;
    const s=p.s;
    switch(p.type){
      case 'bubble':ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=Math.max(1,s*0.22);ctx.fillStyle='rgba(160,220,255,0.35)';ctx.beginPath();ctx.arc(p.x,p.y,s,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(p.x-s*0.45,p.y-s*0.45,s*0.3,s*0.3);break;
      case 'drop':ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,s*0.6,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillRect(p.x-s*0.25,p.y-s*0.3,s*0.25,s*0.25);break;
      case 'spark':ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-s,-s*0.22,s*2,s*0.44);ctx.fillRect(-s*0.22,-s,s*0.44,s*2);ctx.restore();break;
      case 'snow':ctx.fillStyle='#fff';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-s*0.7,-s*0.15,s*1.4,s*0.3);ctx.rotate(1.05);ctx.fillRect(-s*0.7,-s*0.15,s*1.4,s*0.3);ctx.rotate(1.05);ctx.fillRect(-s*0.7,-s*0.15,s*1.4,s*0.3);ctx.restore();break;
      case 'heart':ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x-s*0.3,p.y,s*0.36,0,TAU);ctx.arc(p.x+s*0.3,p.y,s*0.36,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(p.x-s*0.65,p.y+s*0.1);ctx.lineTo(p.x+s*0.65,p.y+s*0.1);ctx.lineTo(p.x,p.y+s*0.8);ctx.fill();break;
      case 'note':ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(p.x,p.y,s*0.45,s*0.35,-0.4,0,TAU);ctx.fill();ctx.fillRect(p.x+s*0.3,p.y-s*1.3,s*0.18,s*1.3);ctx.fillRect(p.x+s*0.3,p.y-s*1.3,s*0.6,s*0.25);break;
      case 'conf':ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-s*0.6,-s*0.3,s*1.2,s*0.6);ctx.restore();break;
      case 'ring':ctx.strokeStyle=p.col;ctx.lineWidth=Math.max(2,s*0.12*(1-k));ctx.beginPath();ctx.arc(p.x,p.y,s*(0.2+k*1.2),0,TAU);ctx.stroke();break;
      case 'block':ctx.fillStyle=p.col;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(p.x-s/2,p.y-s/2,s,s*0.3);break;
      default:ctx.fillStyle=p.col;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
    }}
  ctx.globalAlpha=1;
}

// ================================================================
//  島の仕組み：色 → 施設 → 交流
// ================================================================
function targetFac(i){const A=S.houses[i].c,B=S.houses[i+1].c;if(!A||!B)return {type:'none',a:null,b:null};return A===B?{type:'pool',a:A,b:B}:{type:'bridge',a:A,b:B};}
const FDUR={pool:2.8,bridge:1.6};
function updPairs(dt){
  for(let i=0;i<4;i++){
    const pr=PR[i],tg=targetFac(i);
    const mismatch=pr.type!==tg.type||pr.a!==tg.a||pr.b!==tg.b;
    if(pr.phase==='removing'){
      pr.p+=dt/0.9;
      if(pr.p>=1){pr.type='none';pr.phase='idle';pr.p=1;pr.a=pr.b=null;}
    } else if(mismatch){
      if(pr.type==='none'){
        pr.type=tg.type;pr.a=tg.a;pr.b=tg.b;
        if(tg.type!=='none'){pr.phase='building';pr.p=0;pr.lastBlock=0;startBuild(i);}
      } else {pr.phase='removing';pr.p=0;onRemove(i);}
    } else if(pr.phase==='building'){
      pr.p+=dt/FDUR[pr.type];
      const nb=Math.floor(pr.p*10);
      if(nb>pr.lastBlock&&pr.p<(pr.type==='pool'?0.7:1)){pr.lastBlock=nb;SND.thunk();const m=MID[i];burst(wx(m.x),wy(m.y),'#ffffff',2,'block',60,4);}
      if(pr.type==='pool'&&pr.p>0.68&&!pr.splashed){pr.splashed=true;SND.splash();}
      if(pr.p>=1){pr.p=1;pr.phase='done';pr.splashed=false;onFacDone(i);}
    }
    const fz=pr.type==='none'&&pr.phase!=='removing'?1:0;
    pr.fence+=(fz-pr.fence)*Math.min(1,dt*5);
    const gz=S.ov&&pr.phase==='done'&&pr.type!=='none'?1:0;
    pr.gar+=(gz-pr.gar)*Math.min(1,dt*1.5);
  }
}
function owners(i){return [S.order[i],S.order[i+1]];}
function avail(r){return r.state==='home'||r.state==='visit'||r.state==='look'||r.state==='swim'||(r.state==='walk'&&!r.carry&&r.after!=='dock'&&r.after!=='paint');}
function startBuild(i){
  const m=MID[i];
  owners(i).forEach((k,j)=>{const r=R[k];if(avail(r)&&!r.wantShop&&MODE==='free'){r.build=i;goPath(r,[{x:m.x+(j?36:-36),y:m.y+14}],'build');}});
}
function onRemove(i){
  const m=MID[i];SND.thunk();burst(wx(m.x),wy(m.y),'#bfe6ff',6,'drop',100,5);
  KINDS.forEach(k=>{const r=R[k];if((r.state==='swim'&&r.swim===i)||(r.state==='build'&&r.build===i)){r.swim=-1;r.build=-1;goHome(r);}});
}
function onFacDone(i){
  const pr=PR[i],m=MID[i];const sx=wx(m.x),sy=wy(m.y);
  if(pr.type==='pool'){disc('pool');SND.success();for(let j=0;j<10;j++)addP({x:sx+rnd(-20,20),y:sy,vx:rnd(-60,60),vy:rnd(-200,-90),g:420,life:0.9,col:'#c7ecff',type:'drop',s:6});
    owners(i).forEach((k,j)=>{const r=R[k];if((avail(r)||r.state==='build')&&!r.wantShop&&MODE==='free'){r.build=-1;r.swim=i;goPath(r,[{x:m.x+(j?18:-18),y:m.y+6}],'swim');}});}
  else if(pr.type==='bridge'){disc('bridge');SND.bridge();burst(sx,sy,FC[pr.a],6,'conf',120,6);burst(sx,sy,FC[pr.b],6,'conf',120,6);
    // 互いの家へ渡る
    const ks=owners(i);ks.forEach((k,j)=>{const r=R[k];if((avail(r)||r.state==='build')&&!r.wantShop&&MODE==='free'){r.build=-1;visitHouse(r,j?i:i+1);}});}
  markSave();
}

// ---------- 家を塗る
function paintHouse(i,f,fromK){
  const H=S.houses[i],hr=HR[i];
  const p={x:wx(HSP[i].x),y:wy(HSP[i].y-LY.hs*0.35)};
  ring(p.x,p.y,FC[f],LY.hs*L.sc*0.9);
  if(H.c===f){flavorBurst(p.x,p.y,f,6);SND.bell(f,12);hr.bounce=0.6;markSave();return;}
  hr.prev=H.c;hr.paintP=0;hr.bounce=1;SND.paint(f);
  let striped=false;
  if(H.c){H.h.push(H.c);if(H.h.length>4)H.h.shift();hr.roofP=0;striped=true;}
  H.c=f;
  flavorBurst(p.x,p.y,f,10);
  const ok=S.order[i];
  if(striped){
    disc('stripes');if(new Set(H.h.concat([H.c])).size>=3)disc('stripes3');
    const r=R[ok];r.hatAnim=1.1;r.pendingHat=patternOf(i);
  }
  // 住人が気づいて訪問先を決め直す
  noticeChange(i,f);
  const painted=S.houses.filter(h=>h.c).length;
  if(painted>=4&&!S.ov)startOverview();
  checkFest();
  markSave();
}
function noticeChange(i,f){
  const ok=S.order[i];const own=k=>S.houses[houseOf(k)].c;
  const pull={pig:f==='st',bird:f==='so',cat:f==='gr'||Math.random()<0.3,turtle:f==='va',rabbit:own('rabbit')===f};
  let any=false;
  KINDS.forEach(k=>{
    if(k===ok)return;const r=R[k];
    if(!(r.state==='home'||r.state==='visit'||r.state==='look'))return;
    if(r.wantShop||MODE!=='free')return;
    // 訪問先の色が変わって魅力がなくなったら帰る（遊び相手の決め直し）
    r.state='look';r.t=0.8+Math.random()*0.3;r.lookAtH=i;r.bounce=0.5;
    if(pull[k]&&!any){r.force=i;any=true;} else if(r.visit===i&&!pull[k]){r.force=houseOf(k);} else r.force=null;
  });
}

// ---------- 俯瞰への転換
function startOverview(){S.ov=true;disc('overview');OV.anim=true;OV.at=0;SND.grow();shake=0.6;flash=0.4;markSave();}
function updOverview(dt){
  if(!OV.anim)return;
  OV.at+=dt;const k=clamp(OV.at/2.6,0,1);OV.t=ease(k);
  if(k>0.2&&k<0.9&&Math.random()<0.4){const x=rnd(L.iR.x,L.iR.x+L.iR.w),y=rnd(L.iR.y,L.iR.y+L.iR.h);addP({x,y,vx:0,vy:-30,g:0,life:0.8,col:'#ffffff',type:'spark',s:6,rot:0});}
  if(k>=1){OV.anim=false;OV.t=1;groundDirty=true;prepRun();}
}
function prepRun(){
  // 住人が旗を持って広場へ → 施設をつないで祭りの準備
  const cols=FL.map(f=>FC[f]);let n=0;
  KINDS.forEach(k=>{const r=R[k];if(avail(r)&&!r.wantShop&&MODE==='free'){const hc=S.houses[houseOf(k)].c;r.flagC=hc?FC[hc]:cols[n%4];n++;
    goPath(r,[{x:PLAZA.x+rnd(-60,60),y:PLAZA.y+rnd(-20,20)}],'flag');}});
}

// ---------- 祭り
const scattered=cs=>cs.every(Boolean)&&new Set(cs).size===4&&cs.every((c,i)=>i===0||c!==cs[i-1]);
function festState(){const cs=S.houses.map(h=>h.c);const all=cs.every(Boolean);return {same:all&&cs.every(c=>c===cs[0]),rb:scattered(cs)};}
const festReady=()=>!!(S.disc.pool&&S.disc.bridge&&S.disc.stripes)&&(S.cycles===0||S.sinceGift>=5);
function checkFest(){
  const fs=festState(),same=fs.same,rb=fs.rb;
  if(!same)S.armP=true;if(!rb)S.armR=true;
  if(MODE!=='free'||pendingFest||!S.ov||!festReady())return;
  if(same&&S.armP){pendingFest='parade';S.armP=false;markSave();}
  else if(rb&&S.armR){pendingFest='rainbow';S.armR=false;markSave();}
}
function anyCarry(){return KINDS.some(k=>R[k].carry);}
function updPendingFest(){
  if(!pendingFest||MODE!=='free'||OV.anim)return;
  if(CUR&&(CUR.st==='wait'||CUR.st==='enter')){CUR.st='leave';CUR.t=0;CUR.noPaint=true;}
  if(CUR||FLY||anyCarry()||TRAVEL.some(t=>t.kind==='chunk'))return;
  // 待つ間に色が変わったら取りやめ（島の状態と祭りを一致させる）
  const fs=festState();
  if((pendingFest==='parade'&&!fs.same)||(pendingFest==='rainbow'&&!fs.rb)){if(pendingFest==='parade')S.armP=true;else S.armR=true;pendingFest=null;checkFest();return;}

}
function cancelNext(){

function festPath(){const pts=[{x:PLAZA.x,y:PLAZA.y}];for(let i=0;i<5;i++){pts.push(DOOR[i]);if(i<4)pts.push(MID[i]);}pts.push({x:PLAZA.x,y:PLAZA.y});return pts;}

function pathAt(path,d){
  for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];const l=Math.hypot(b.x-a.x,b.y-a.y);if(d<=l){const k=l?d/l:0;return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),dir:Math.sign(b.x-a.x)};}d-=l;}

}
const FEST_DUR=11;
function stallPos(j){const a=-Math.PI/2+j*TAU/5;return {x:PLAZA.x+Math.cos(a)*92,y:PLAZA.y+Math.sin(a)*40+6};}
function updFest(dt){

    if(F.type==='parade'){const mel=[0,4,7,4,9,7,4,2,0,4,7,12,9,7,4,0];if(s%2===0)SND.drum();else SND.snare();SND.note(523*ST(mel[s%16]),0.22,0,0.07);}
    else{const mel=[0,4,7,11,12,11,7,4,2,5,9,12,14,12,9,5];SND.note(659*ST(mel[s%16]),0.18,0,0.06);if(s%4===0)SND.drum();}}

      else{const p=pathAt(F.path,((Math.max(0,d))%F.len));r.x=p.x;r.y=p.y;}

    } else {

      fs.hk=Math.min(1,(fs.hk||0)+dt*2.2);const kk=ease(fs.hk);r.x=lerp(fs.fx,fs.tx,kk);r.y=lerp(fs.fy,fs.ty,kk);r.alt=Math.sin(kk*Math.PI)*30;r.walk+=dt*10;
    }
  });

  else{F.fw-=dt;if(F.fw<=0){F.fw=rnd(0.6,1.0);SND.firework();const x=rnd(L.iR.x+L.iR.w*0.15,L.iR.x+L.iR.w*0.85),y=rnd(L.iR.y+20,L.iR.y+L.iR.h*0.35);const c=FC[pick(FL)];for(let i=0;i<16;i++){const a=i/16*TAU;addP({x,y,vx:Math.cos(a)*110,vy:Math.sin(a)*110,g:60,life:1.0,col:c,type:'spark',s:4,rot:a});}}}

}
function endFest(){

// ---------- 住人の自律行動
function goPath(r,pts,after,mul){
  r.path=pts.map(p=>({x:p.x,y:p.y}));r.after=after;r.state='walk';
  r.spd=(PERS[r.k].fly?200:160)*PERS[r.k].spd*(mul||1);
}
function pathHouses(i,j){const pts=[];const d=j>i?1:-1;for(let k=i;k!==j;k+=d){pts.push(MID[d>0?k:k-1]);pts.push(DOOR[k+d]);}return pts;}
function nearestHouse(r){let b=0,bd=1e9;for(let i=0;i<5;i++){const d=Math.hypot(r.x-DOOR[i].x,r.y-DOOR[i].y);if(d<bd){bd=d;b=i;}}return b;}
function goHome(r){
  const hi=houseOf(r.k);
  if(PERS[r.k].fly){goPath(r,[HOME[hi]],'home');return;}
  const nh=nearestHouse(r);
  const near=Math.hypot(r.x-DOOR[nh].x,r.y-DOOR[nh].y)<80;
  const pts=near&&nh!==hi?[DOOR[nh]].concat(pathHouses(nh,hi)):[DOOR[hi]];
  pts.push(HOME[hi]);goPath(r,pts,'home');
}
function visitHouse(r,j){
  const hi=houseOf(r.k);if(j===hi){goHome(r);return;}
  r.visit=j;const spot={x:DOOR[j].x-LY.hs*0.32,y:DOOR[j].y+10};
  if(PERS[r.k].fly){goPath(r,[spot],'visit');return;}
  const from=r.state==='home'||Math.hypot(r.x-HOME[hi].x,r.y-HOME[hi].y)<60?hi:nearestHouse(r);
  const pts=[DOOR[from]].concat(pathHouses(from,j));pts.push(spot);goPath(r,pts,'visit',PERS[r.k].fly?1:1);
}
function goDock(r){const pts=PERS[r.k].fly?[DOCK]:[{x:PLAZA.x,y:PLAZA.y},DOCK];goPath(r,pts,'dock',1.6);}
function decide(r,force){
  const hi=houseOf(r.k);
  if(r.wantShop){goDock(r);return;}
  if(force!=null&&force!==hi){visitHouse(r,force);return;}
  if(force===hi){goHome(r);return;}
  const opts=[];const cs=S.houses.map(h=>h.c);const own=cs[hi];
  opts.push({w:r.k==='turtle'?5:2,a:'stay'});
  for(let p=0;p<4;p++)if(PR[p].type==='pool'&&PR[p].phase==='done'&&(p===hi||p+1===hi))opts.push({w:4,a:'swim',p});
  for(let j=0;j<5;j++){if(j===hi)continue;let w=0;const c=cs[j];
    switch(r.k){
      case 'pig':w=c==='st'?3:0.3;break;
      case 'bird':w=(c==='so'?4:0.2)+(S.houses[j].h.length?2:0);break;
      case 'cat':w=c==='gr'?2.5:0.8;break;
      case 'turtle':w=Math.abs(j-hi)===1?(c==='va'?2.5:0.5):0.05;break;
      case 'rabbit':w=own&&c===own?3:0.4;break;
    }
    // 交友：仲良しの家にも行く
    const fr=S.res[r.k].fr[S.order[j]]||0;w+=Math.min(1.5,fr*0.15);
    if(w>0)opts.push({w,a:'visit',j});
  }
  let tot=0;opts.forEach(o=>tot+=o.w);let x=Math.random()*tot;let ch=opts[0];
  for(const o of opts){x-=o.w;if(x<=0){ch=o;break;}}
  if(ch.a==='stay'){r.state='home';r.t=rnd(3,6);if(Math.random()<0.5)r.wave=1;return;}
  if(ch.a==='swim'){const m=MID[ch.p];r.swim=ch.p;goPath(r,[{x:m.x+(ch.p===hi?18:-18),y:m.y+6}],'swim');return;}
  visitHouse(r,ch.j);
}
function arrive(r){

    case 'visit':{r.state='visit';r.t=rnd(3,4.5);const ok=S.order[r.visit];
      const fr=S.res[r.k].fr;fr[ok]=(fr[ok]||0)+1;markSave();

function updRes(r,dt){

    case 'visit':r.t-=dt;r.alt=Math.abs(Math.sin(T*6))*6;if(r.wantShop){r.alt=0;goDock(r);break;}if(r.t<=0){r.alt=0;r.visit=-1;goHome(r);}break;
    case 'swim':r.t-=dt;if(Math.random()<dt*1.5){const m=MID[r.swim]||MID[0];addP({x:wx(r.x+rnd(-12,12)),y:wy(r.y+4),vx:rnd(-20,20),vy:-60,g:200,life:0.5,col:'#d8f3ff',type:'drop',s:4});}
      if(r.wantShop||r.t<=0||PR[r.swim]==null||PR[r.swim].type!=='pool'){r.swim=-1;if(r.wantShop)goDock(r);else goHome(r);}break;
    case 'build':if(Math.random()<dt*3){addP({x:wx(r.x),y:wy(r.y-40),vx:rnd(-30,30),vy:-60,g:200,life:0.4,col:'#fff7c2',type:'spark',s:4,rot:0});}
      {const pr=PR[r.build];if(!pr||pr.phase!=='building'){r.build=-1;goHome(r);}}break;

function stepWalk(r,dt){
  const tg=r.path[0];if(!tg){arrive(r);return;}
  const dx=tg.x-r.x,dy=tg.y-r.y,d=Math.hypot(dx,dy),st=r.spd*dt;
  if(Math.abs(dx)>2)r.look=Math.sign(dx)*0.8;
  r.walk+=dt*12*Math.min(1.6,r.spd/150);
  if(PERS[r.k].fly)r.alt+=(40-r.alt)*Math.min(1,dt*4);else{
    let hop=Math.abs(Math.sin(r.walk*0.5))*5;
    for(let i=0;i<4;i++){const m=MID[i];const dm=Math.hypot(r.x-m.x,r.y-m.y);if(dm<34&&PR[i].fence>0.5)hop+=(1-dm/34)*22;}
    r.alt=hop;}
  if(r.carry&&Math.random()<dt*14)addP({x:wx(r.x),y:wy(r.y-10),vx:rnd(-15,15),vy:rnd(-30,-5),g:20,life:0.7,col:FC[r.carry.f],type:'drop',s:5*Math.max(0.7,L.sc*1.6)});
  if(d<=st){r.x=tg.x;r.y=tg.y;r.path.shift();if(!r.path.length){if(PERS[r.k].fly)r.alt=0;arrive(r);}}
  else{r.x+=dx/d*st;r.y+=dy/d*st;}
}

// ---------- 遠くへ届くもの（帽子の模様→看板、特大アイスのおすそわけ）
function updTravel(dt){
  for(let i=TRAVEL.length-1;i>=0;i--){const t=TRAVEL[i];t.t+=dt;
    const k=Math.min(1,t.t/t.dur);

      else{const ok=S.order[t.to];const e=S.res[ok].eat;e.push(t.f);if(e.length>20)e.shift();R[ok].bounce=1;paintHouse(t.to,t.f,ok);}}

// ================================================================
//  お店：来店 → 提供 → 食べる → 帰宅
// ================================================================
function pickNext(exclude){
  if(S.serves===0&&exclude==null)return 'pig';
  let c=KINDS.filter(k=>k!==exclude&&k!==NEXT&&k!==QUEUE&&R[k].state!=='shop');
  const noCarry=c.filter(k=>!R[k].carry);if(noCarry.length)c=noCarry;
  if(!c.length)c=KINDS.filter(k=>k!==exclude);
  // 仲良しがついてくる
  if(exclude){const fr=S.res[exclude].fr;let best=null,bv=2;for(const k of c){if((fr[k]||0)>bv){bv=fr[k];best=k;}}if(best&&Math.random()<0.3)return best;}
  // 偏らせない：今回の営業で来た回数が少ない住人から
  let mn=1e9;c.forEach(k=>mn=Math.min(mn,sessCount[k]));
  const pool=c.filter(k=>sessCount[k]<=mn);
  return pick(pool);
}
function summon(k){
  const r=R[k];NEXT=k;r.wantShop=true;
  if(r.state==='home'||r.state==='visit'||r.state==='look'||r.state==='swim'||r.state==='build'){r.swim=-1;r.build=-1;goDock(r);}
  else if(r.state==='walk'&&!r.carry&&r.after!=='dock'){goDock(r);}
}
function serve(f){
  const c=CUR;c.st='catch';c.t=0;c.f=f;
  const sl=L.slots[FL.indexOf(f)];
  FLY={f,x0:sl.x,t:0,dur:0.42,giant:c.giant};
  SND.slide();
  S.serves++;S.sinceGift=(S.sinceGift||0)+1;sessCount[c.k]++;lastServed=c.k;
  if(!NEXT&&!QUEUE&&MODE==='free'){const n=pickNext(c.k);summon(n);}
  IDLE=0;GUIDE=null;markSave();
}
function custPos(){return {x:L.cuX,y:L.feet};}
function updCustomer(dt){
  if(FLY){FLY.t+=dt;if(FLY.t>=FLY.dur){FLY=null;if(CUR&&CUR.st==='catch'){CUR.st='eat';CUR.t=0;SND.catchB();const p=custPos();burst(p.x,p.y-L.cs*0.4,'#ffffff',6,'spark',140,5);}}}
  if(!CUR){
    if(MODE==='free'&&!pendingFest){
      if(QUEUE){const k=QUEUE;QUEUE=null;const r=R[k];r.state='shop';r.wantShop=false;
        lastGiant=!lastGiant&&S.serves>=3&&Math.random()<0.24;

      else if(!NEXT){summon(pickNext(lastServed));}
    }
    return;
  }
  const c=CUR;c.t+=dt;const r=R[c.k];
  switch(c.st){
    case 'enter':if(c.t>=0.7){c.st='wait';c.t=0;computeGuide();SND.boing();}break;
    case 'wait':c.thinkT+=dt;c.waveT-=dt;if(c.waveT<=0){c.waveT=rnd(3,5);c.wave=1;}
      if(c.wave>0)c.wave=Math.max(0,c.wave-dt*0.9);break;
    case 'catch':break;
    case 'eat':{
      const p=custPos();
      if(Math.floor(c.t/0.28)!==Math.floor((c.t-dt)/0.28)&&c.t<0.9){SND.nom();flavorBurst(p.x,p.y-L.cs*0.62,c.f,c.giant?6:4,c.giant?1.4:1);}
      if(c.t>=0.62&&!c.dyed){c.dyed=true;const e=S.res[c.k].eat;e.push(c.f);if(e.length>20)e.shift();
        burst(p.x,p.y-L.cs*0.35,FC[c.f],12,'conf',160,6);
        const P0=PERS[c.k];c.react=c.f===P0.fav?'fav':(c.f===P0.dis?'dis':'neu');
        if(c.react==='fav'){disc('fav_'+c.k);SND.fav(c.f);}else if(c.react==='dis'){disc('dis_'+c.k);if(c.k==='pig'&&c.f==='so')disc('hiccup');}else SND.neutral(c.f);
        markSave();}
      if(c.t>=1.0){c.st='react';c.t=0;c.rs=0;}
      break;}
    case 'react':{
      const p=custPos();const dur=c.react==='fav'?1.3:(c.react==='dis'?1.4:0.8);
      reactFx(c,p,dt);
      if(c.t>=dur){c.st='leave';c.t=0;}
      break;}
    case 'leave':
      if(Math.random()<0.6&&!c.noPaint&&c.f){const p=custPos();const k=c.t/0.65;addP({x:lerp(p.x,dockS().x,k),y:lerp(p.y-L.cs*0.4,dockS().y,k),vx:rnd(-20,20),vy:rnd(-20,20),g:0,life:0.6,col:FC[c.f],type:'drop',s:7});}
      if(c.t>=0.65){
        const hi=houseOf(c.k);r.x=DOCK.x;r.y=DOCK.y;
        if(!c.noPaint&&c.f){
          let nb=null;if(c.giant){const cand=[hi-1,hi+1].filter(j=>j>=0&&j<5);const diff=cand.filter(j=>S.houses[j].c!==c.f);nb=(diff.length?pick(diff):pick(cand));}
          r.carry={f:c.f,giant:c.giant,nb};
          const pts=PERS[c.k].fly?[HOME[hi]]:[{x:PLAZA.x,y:PLAZA.y},DOOR[hi],HOME[hi]];goPath(r,pts,'paint',2.2);
        } else goHome(r);
        CUR=null;
      }
      break;
  }
}
function dockS(){return {x:wx(DOCK.x),y:wy(DOCK.y)};}
function reactFx(c,p,dt){

    if(c.rs>0.18){c.rs=0;addP({x:p.x+rnd(-L.cs*0.4,L.cs*0.4),y:hy,vx:rnd(-30,30),vy:-90,g:0,life:1,col:FC[c.f],type:k==='pig'?'note':'heart',s:10,rot:0});}

function computeGuide(){
  if(MODE==='gift'&&GIFT&&GIFT.st==='choose'){
    let best=0,bv=-1;for(let i=0;i<5;i++){const v=S.res[S.order[i]].eat.length+Math.random();if(v>bv){bv=v;best=i;}}
    GUIDE={kind:'house',idx:best};return;
  }
  if(!CUR||CUR.st!=='wait'||MODE!=='free'||pendingFest){GUIDE=null;return;}
  GUIDE={kind:'ice',idx:FL.indexOf(planFlavor(CUR.k,CUR.giant))};
}
function planFlavor(k,giant){
  if(S.serves===0)return 'st';
  const hi=houseOf(k),H=S.houses[hi],cs=S.houses.map(h=>h.c),d=S.disc;
  let best='st',bs=-1e9;
  for(const f of FL){
    let s=Math.random()*3;const n=cs.slice();n[hi]=f;
    for(const p of [hi-1,hi]){if(p<0||p>3)continue;const a=n[p],b=n[p+1],oa=cs[p],ob=cs[p+1];
      if(a&&b&&a===b&&!(oa===ob&&oa===a))s+=d.pool?8:40;
      if(a&&b&&a!==b&&!(oa&&ob&&oa===a&&ob===b))s+=d.bridge?6:(oa&&oa===ob?40:30);}
    if(H.c&&f!==H.c)s+=!d.stripes?32:(!d.stripes3&&H.h.length>=1&&H.h.indexOf(f)<0?30:6);
    if(!H.c)s+=8;
    if(f===PERS[k].fav&&!d['fav_'+k])s+=14;
    if(f===PERS[k].dis&&!d['dis_'+k])s+=(k==='pig'&&!d.hiccup)?28:10;
    if(S.ov&&festReady()){
      // 祭りの準備：どちらかの結末へ向けて誘う（交互に）
      const goal=!d.parade?'p':(!d.rainbow?'r':(lastFest==='parade'?'r':'p'));
      if(goal==='p'){const cnt={};cs.forEach((c,j)=>{if(c&&j!==hi)cnt[c]=(cnt[c]||0)+1;});let mj=null,mv=0;for(const c in cnt)if(cnt[c]>mv){mv=cnt[c];mj=c;}
        if(f===(mj||H.c||'st'))s+=60;}
      else{const nb=[n[hi-1],n[hi+1]];if(nb.indexOf(f)<0)s+=30;s+=new Set(n.filter(Boolean)).size*12;if(scattered(n))s+=40;}
    } else if(f===H.c)s-=12;
    if(s>bs){bs=s;best=f;}
  }
  return best;
}

function tap(x,y){
  // 1) カウンターのアイス（列ごと広く受け付ける）
  if(y>=L.cTop-L.is*1.05){
    for(let i=0;i<4;i++){const s=L.slots[i];if(x>=s.x0&&x<s.x0+s.w){tapIce(i);return;}}
    if(x<L.slots[0].x0){tapIce(0);return;} if(x>=L.slots[3].x0+L.slots[3].w){tapIce(3);return;}
  }
  // 2) 島の家・住人（呼ぶ／贈り物を選ぶ）
  const hh=hitHouse(x,y);
  if(hh>=0){tapHouse(hh);return;}
  // 3) 関係ない物は小さく揺れるだけ
  if(CUR&&Math.abs(x-L.cuX)<L.cs*0.4&&y>L.feet-L.cs&&y<L.feet){CUR.wob=1;return;}
  if(Math.abs(x-L.beX)<L.bs*0.4&&y>L.feet-L.bs&&y<L.feet){OBJW.bear=1;return;}

  // 空白は無反応
}
function hitHouse(x,y){
  let best=-1,bd=1e9;
  for(let i=0;i<5;i++){
    const hw=Math.max(30,LY.hs*L.sc*0.62),top=wy(HSP[i].y)-Math.max(60,LY.hs*1.15*L.sc),bot=wy(HSP[i].y)+Math.max(16,30*L.sc);
    const cx=wx(HSP[i].x+LY.hs*0.08);

  }

    const sx=wx(r.x),sy=wy(r.y)-(r.alt||0)*L.sc;const rad=Math.max(28,30*L.sc);

}

  if(!CUR)return;const c=CUR,r=R[c.k];
  const p=custPos();let x=p.x,y=p.y,s=L.cs;
  const o=resDrawOpts(r);o.walk=0;o.alt=0;
  Object.assign(o,custAnim(c));
  if(o.alt==null)o.alt=0;
  if(c.st==='enter'){const k=ease(Math.min(1,c.t/0.7));const d=dockS();x=lerp(d.x,p.x,k);y=lerp(d.y,p.y,k)-Math.sin(k*Math.PI)*40;s=lerp(58*L.sc,L.cs,k);o.walk=c.t*14;}
  if(c.st==='leave'){const k=ease(Math.min(1,c.t/0.65));const d=dockS();x=lerp(p.x,d.x,k);y=lerp(p.y,d.y,k)-Math.sin(k*Math.PI)*40;s=lerp(L.cs,58*L.sc,k);o.walk=c.t*14;o.face='happy';if(c.f)o.hold=null;}
  if(c.st==='wait'){
    // 誘導：見る・手を振る・家をのぞく・前の味を思い出す
    if(GUIDE&&GUIDE.kind==='ice'){const sl=L.slots[GUIDE.idx];o.look=clamp((sl.x-x)/(L.cs*0.8),-1,1);o.lookUp=-0.7;}
    const ph=c.thinkT%7;
    if(ph>4.2&&ph<5.6){o.lookUp=1;o.look=clamp((wx(HSP[houseOf(c.k)].x)-x)/(VW*0.3),-1,1);}
    if(c.wave>0)o.wave=c.wave;
    o.alt=Math.abs(Math.sin(T*2.4))*s*0.02;
    if(c.giant)o.hold={bowl:true};
  }
  if(c.st==='catch'){o.face='o';o.armL=1.4;o.armR=1.4;if(c.giant)o.hold={bowl:true};}
  if(c.st==='eat'){o.hold={f:c.f,rem:1-Math.min(1,c.t/0.95),bowl:c.giant,scale:c.giant?1:1};
    if(c.t>=0.62)o.cloth=FC[c.f]; else o.cloth=clothOf(c.k)===FC[c.f]?FC[c.f]:prevCloth(c);}
  if(c.st==='react'||c.st==='leave')o.cloth=FC[c.f]||o.cloth;
  if(c.wob>0)o.rot=(o.rot||0)+Math.sin(c.wob*18)*0.08*c.wob;
  drawChar(c.k,x,y,s,o);
  // 前に食べた味を思い出す（絵の吹き出し）
  if(c.st==='wait'){const e=S.res[c.k].eat;const ph=c.thinkT%7;
    if(e.length&&ph>1.4&&ph<3.8){const a=Math.min(1,(ph-1.4)*3,(3.8-ph)*3);ctx.globalAlpha=a;
      const bx=x+s*0.42,by=y-s*1.05;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(bx,by,s*0.2,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(bx-s*0.16,by+s*0.2,s*0.05,0,TAU);ctx.arc(bx-s*0.22,by+s*0.29,s*0.03,0,TAU);ctx.fill();
      drawIce(bx,by+s*0.12,s*0.24,e[e.length-1],{});ctx.globalAlpha=1;}}
}
function prevCloth(c){const e=S.res[c.k].eat;return e.length?FC[e[e.length-1]]:'#ffffff';}
function drawClouds(){
  for(let i=0;i<3;i++){const x=((T*8*(i+1)+i*300)%(VW+240))-120,y=SA.t+14+i*22;ctx.fillStyle='rgba(255,255,255,0.85)';
    const s=18+i*4;ctx.fillRect(x,y,s*4,s);ctx.fillRect(x+s,y-s*0.7,s*2,s*0.8);}
}
function drawHand(){
  if(!HAND)return;const h=HAND;const k=h.t/h.dur;
  let tx,ty;
  if(h.kind==='ice'){const s=L.slots[h.idx];tx=s.x;ty=s.y-L.is*0.45;}
  else{tx=wx(HSP[h.idx].x);ty=wy(HSP[h.idx].y-LY.hs*0.4);}
  const appear=Math.min(1,k*4),press=k>0.35&&k<0.55?Math.sin((k-0.35)/0.2*Math.PI):0;
  const x=tx+(1-appear)*60+18,y=ty+(1-appear)*80+20+press*10;
  const a=k>0.85?(1-k)/0.15:1;
  ctx.save();ctx.globalAlpha=a;
  if(press>0.3){ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(tx,ty,20+press*18,0,TAU);ctx.stroke();}
  const u=Math.max(9,Math.min(16,L.is*0.11));
  ctx.translate(x,y);ctx.rotate(-0.35);ctx.scale(1-press*0.1,1-press*0.1);
  ctx.fillStyle='#ffffff';ctx.strokeStyle='rgba(90,70,110,0.55)';ctx.lineWidth=2.5;
  rr(-u*0.55,-u*2.6,u*1.1,u*2.6,u*0.5);ctx.fill();ctx.stroke();
  rr(-u*1.1,-u*0.6,u*2.8,u*2.6,u*0.8);ctx.fill();ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0;if(shake>0){sx=Math.sin(T*60)*6*shake;sy=Math.cos(T*53)*4*shake;}
  ctx.drawImage(bgCan,0,0,VW,VH);
  ctx.translate(sx,sy);
  drawClouds();
  drawIsland();
  drawShop();
  drawP();
  drawHand();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.8)+')';ctx.fillRect(0,0,VW,VH);}
}

// ================================================================
//  ループ（rAFのみ・非表示で停止）
// ================================================================
let last=0,raf=0,running=false,frames=0;
function loop(now){
  raf=0;if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  const steps=SPEED>1?Math.round(SPEED):1;
  for(let i=0;i<steps;i++)update(dt);
  draw();frames++;
  raf=requestAnimationFrame(loop);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(loop);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();AU.suspend();if(saveT>=0)saveNow();}else{AU.resume();start();}});
window.addEventListener('pagehide',()=>{if(saveT>=0)saveNow();});

// ---------- 起動
S=loadState();
resize();
initRuntime();
L=computeLayout(OV.t);
if(loadInfo!=='restored')saveNow();
draw();
start();

// 自動検査用の読み取り口（画面UIではない）
window.__shirokuma={
  get S(){return S;},get mode(){return MODE;},get cur(){return CUR;},get next(){return NEXT;},get queue(){return QUEUE;},
  get guide(){return GUIDE;},get hand(){return HAND;},get L(){return L;},get ov(){return OV.t;},get loadInfo(){return loadInfo;},get store(){return Store.status;},
  get pairs(){return PR.map(p=>({type:p.type,phase:p.phase,a:p.a,b:p.b}));},get fest(){return FEST&&FEST.type;},get gift(){return GIFT&&GIFT.st;},get particles(){return P.length;},get frames(){return frames;},
  get running(){return running;},get T(){return T;},get disc(){return Object.keys(S.disc);},get res(){const o={};KINDS.forEach(k=>o[k]={state:R[k].state,x:R[k].x,y:R[k].y,carry:!!R[k].carry});return o;},
  iceXY(i){const s=L.slots[i];return {x:s.x,y:s.y-L.is*0.4};},
  houseXY(i){return {x:wx(HSP[i].x),y:wy(HSP[i].y-LY.hs*0.4)};},
  setSpeed(n){SPEED=Math.max(1,Math.min(8,n|0));},
  audio(){return AU.c?AU.c.state:'none';}
};
})();
</script>
