<script>
(function(){
'use strict';
/* =========================================================
   ぱたん！もりもりサンドの青空キッチン楽団
   single-file canvas game: stack / cook / feed / band
   ========================================================= */
var cv=document.getElementById('c');
var g=cv.getContext('2d');
var saEl=document.getElementById('sa');
var TAU=Math.PI*2;
var W=1,H=1,DPR=1,L=null;
var SP={},BG={};
var LW=1;
var PEN='#4b3a30';

function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rr(a){return (Math.random()*2-1)*a}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy)}
function sgn(v){return v<0?-1:1}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:a)+')'}
function shade(h,amt){var c=hex(h);return rgba(c.map(function(v){return amt<0?v*(1+amt):v+(255-v)*amt}))}
function mixc(a,b,t){var A=hex(a),B=hex(b);return [lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t)]}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var TYPES=['bread','cheese','tomato','lettuce'];
var KINDS=['cat','rabbit','bear','bird'];
var PREF={cat:{food:'cheese',sauce:'r'},rabbit:{food:'lettuce',sauce:'m'},bear:{food:'tomato',sauce:'y'},bird:{food:'bread',sauce:null}};
var RED='#d63a2a',YEL='#e9b42a';
var MAXL=16;

/* ---------------- layout ---------------- */
function readSafe(){
  var cs=getComputedStyle(saEl);
  return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
function computeLayout(){
  W=Math.max(1,window.innerWidth|0);H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  var s=readSafe();
  var sx=s.l,sy=s.t,sw=Math.max(120,W-s.l-s.r),sh=Math.max(120,H-s.t-s.b);
  var port=sw<sh*0.95;
  function P(nx,ny){return {x:sx+nx*sw,y:sy+ny*sh}}
  var l={W:W,H:H,sx:sx,sy:sy,sw:sw,sh:sh,port:port};
  var w;
  if(port){
    w=Math.min(0.30*sw,0.145*sh);
    l.tableY=sy+0.565*sh;
    l.plate=P(0.5,0.775);
    l.sup={cheese:P(0.125,0.80),tomato:P(0.11,0.94),lettuce:P(0.30,0.94),bread:P(0.70,0.94)};
    l.mem=P(0.5,0.945);
    l.board=P(0.165,0.655);l.pan=P(0.835,0.655);l.bowl=P(0.855,0.775);
    l.bot={r:P(0.86,0.945),y:P(0.955,0.945)};
    l.winX0=sx+0.15*sw;l.winX1=sx+0.85*sw;
    l.chef=P(0.915,0.565);l.chefPic=P(0.5,0.355);
    l.catHome=P(0.085,0.567);
    l.seatX=[0.09,0.91,0.27,0.73].map(function(v){return sx+v*sw});
    l.chefS=1.6*w;l.chefPicS=1.35*w;l.A=0.95*w;
  }else{
    w=Math.min(0.125*sw,0.19*sh);
    l.tableY=sy+0.56*sh;
    l.plate=P(0.5,0.82);
    l.sup={cheese:P(0.07,0.71),tomato:P(0.185,0.71),lettuce:P(0.07,0.93),bread:P(0.185,0.93)};
    l.mem=P(0.32,0.935);
    l.board=P(0.32,0.72);l.pan=P(0.68,0.72);l.bowl=P(0.85,0.875);
    l.bot={r:P(0.655,0.935),y:P(0.725,0.935)};
    l.winX0=sx+0.31*sw;l.winX1=sx+0.69*sw;
    l.chef=P(0.875,0.56);l.chefPic=P(0.5,0.33);
    l.catHome=P(0.24,0.562);
    l.seatX=[0.08,0.92,0.23,0.77].map(function(v){return sx+v*sw});
    l.chefS=2.0*w;l.chefPicS=1.4*w;l.A=0.95*w;
  }
  l.w=w;
  l.bw=(port?1.1:1.3)*w;l.bh=0.34*w;l.panR=(port?0.42:0.47)*w;l.bowlR=0.43*w;l.supR=Math.max(0.44*w,36);
  l.plateTop=l.plate.y-0.05*w;
  l.sill=clamp(l.plateTop-9*0.25*w,sy+0.22*sh,l.tableY-0.08*sh);
  l.winY0=sy+0.045*sh;l.winY1=l.sill;
  var ww=l.winX1-l.winX0;
  l.peek={
    rabbit:{x:l.winX0+0.13*ww,y:l.sill+0.42*l.A*0.8},
    bear:{x:l.winX1-0.13*ww,y:l.sill+0.36*l.A*0.85},
    bird:{x:l.winX0+0.2*ww,y:l.winY0+0.42*(l.sill-l.winY0)}
  };
  l.sniff={x:l.plate.x-1.0*w,y:l.tableY+0.004*sh};
  l.seatY=l.tableY+0.006*sh;l.plateSeatY=l.tableY+0.03*sh;
  L=l;
}

/* ---------------- art helpers ---------------- */
function smooth(c,pts,j){
  var n=pts.length,q=new Array(n),i;
  for(i=0;i<n;i++)q[i]=[pts[i][0]+rr(j),pts[i][1]+rr(j)];
  c.beginPath();c.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);
  for(i=0;i<n;i++){var a=q[i],b=q[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
  c.closePath();
}
function ellP(cx,cy,rx,ry,n,wob){n=n||22;wob=wob||0;var p=[];for(var i=0;i<n;i++){var a=i/n*TAU,r=1+rr(wob);p.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}return p}
function rrP(x,y,w,h,r,n){n=n||5;r=Math.min(r,w/2,h/2);var p=[];
  var cs=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];
  for(var k=0;k<4;k++){for(var i=0;i<=n;i++){var a=cs[k][2]+i/n*Math.PI/2;p.push([cs[k][0]+Math.cos(a)*r,cs[k][1]+Math.sin(a)*r])}}return p}
function wc(c,pts,col,o){
  o=o||{};var j=o.j===undefined?1:o.j,A=o.a===undefined?1:o.a;
  c.save();c.fillStyle=col;
  c.globalAlpha=0.62*A;smooth(c,pts,j*1.4);c.fill();
  c.globalAlpha=0.32*A;smooth(c,pts,j*2.2);c.fill();
  c.globalAlpha=0.3*A;smooth(c,pts,j*0.8);c.fill();
  c.globalAlpha=0.42*A;c.strokeStyle=o.edge||shade(col,-0.3);c.lineWidth=o.ew||2;smooth(c,pts,j);c.stroke();
  if(o.pencil!==false){
    c.globalAlpha=0.6*A;c.strokeStyle=PEN;c.lineWidth=o.pw||1.1;smooth(c,pts,j*0.6);c.stroke();
    c.globalAlpha=0.2*A;smooth(c,pts,j*1.8);c.stroke();
  }
  c.restore();
}
function speck(c,x,y,w,h,n,col,a){c.save();c.fillStyle=col;for(var i=0;i<n;i++){c.globalAlpha=Math.random()*a;c.fillRect(x+Math.random()*w,y+Math.random()*h,1+Math.random()*1.4,1+Math.random()*1.4)}c.restore()}
function dotE(c,x,y,rx,ry,col,a){c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),0,0,TAU);c.fill();c.restore()}
function mkCan(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*DPR));c.height=Math.max(1,Math.ceil(h*DPR));var x=c.getContext('2d');x.scale(DPR,DPR);x.lineJoin='round';x.lineCap='round';return [c,x]}
function mkSpr(w,h,ax,ay,fn){var r=mkCan(w,h);r[1].translate(ax,ay);fn(r[1]);return {c:r[0],w:w,h:h,ax:ax,ay:ay}}
function spr(s,alpha){
  if(alpha!==undefined){var a=g.globalAlpha;g.globalAlpha=a*alpha;g.drawImage(s.c,-s.ax,-s.ay,s.w,s.h);g.globalAlpha=a}
  else g.drawImage(s.c,-s.ax,-s.ay,s.w,s.h);
}
var GRAIN=null;
function grainPat(x){
  if(!GRAIN){var r=document.createElement('canvas');r.width=r.height=96;var q=r.getContext('2d');var id=q.createImageData(96,96);
    for(var i=0;i<id.data.length;i+=4){var v=Math.random();id.data[i]=id.data[i+1]=id.data[i+2]=v<0.5?90:255;id.data[i+3]=Math.random()*26}
    q.putImageData(id,0,0);GRAIN=r}
  return x.createPattern(GRAIN,'repeat');
}

/* ---------------- sprites ---------------- */
function thick(it){
  var w=L.w;
  if(it.type==='bread')return 0.34*w;
  if(it.type==='cheese')return melted(it)?0.14*w:0.17*w;
  if(it.type==='tomato')return sliced(it)?0.22*w:0.5*w;
  return it.wilt>=0.5?0.16*w:0.24*w;
}
function buildSprites(){
  var w=L.w;
  var hb=0.34*w;
  function breadDraw(crust,crumb,dark){return function(x){
    wc(x,rrP(-w/2,-hb,w,hb,0.17*w),crust,{j:1.1});
    wc(x,rrP(-w/2+0.065*w,-hb+0.07*w,w-0.13*w,hb-0.135*w,0.11*w),crumb,{j:0.9,pencil:false,ew:1.4});
    for(var i=0;i<10;i++)dotE(x,rr(0.36*w),-hb/2+rr(0.07*w),0.012*w+Math.random()*0.012*w,0.008*w+Math.random()*0.007*w,dark,0.4);
    speck(x,-w/2,-hb,w,hb,50,'#7a4a22',0.22);
  }}
  SP.bread=mkSpr(w*1.14,hb*1.3,w*0.57,hb*1.18,breadDraw('#cf9150','#f6dfae','#d6ad70'));
  SP.toast=mkSpr(w*1.14,hb*1.3,w*0.57,hb*1.18,function(x){
    breadDraw('#99561f','#dfa258','#b57334')(x);
    x.save();x.strokeStyle='rgba(100,48,15,0.5)';x.lineWidth=0.032*w;
    for(var i=-2;i<=2;i++){x.beginPath();x.moveTo(i*0.16*w-0.05*w,-hb+0.09*w);x.lineTo(i*0.16*w+0.05*w,-0.08*w);x.stroke()}
    x.restore();
  });
  SP.stain=mkSpr(w*1.14,hb*1.3,w*0.57,hb*1.18,function(x){
    wc(x,rrP(-w/2+0.04*w,-hb+0.05*w,w-0.08*w,hb-0.08*w,0.13*w),'#c4503c',{pencil:false,j:3});
  });
  var hc=0.17*w;
  SP.cheese=mkSpr(w*1.12,hc*1.6,w*0.56,hc*1.3,function(x){
    wc(x,rrP(-0.51*w,-hc,1.02*w,hc,0.03*w,3),'#f7cb48',{j:0.7});
    for(var i=0;i<5;i++)dotE(x,-0.4*w+i*0.2*w+rr(0.03*w),-hc*0.5+rr(hc*0.15),0.03*w,hc*0.2,'#dc9f22',0.55);
    dotE(x,-0.1*w,-hc*0.78,0.3*w,0.02*w,'#fff4c4',0.5);
  });
  var hm=0.14*w;
  SP.cheeseM=mkSpr(w*1.3,hm+0.36*w,w*0.65,hm+0.06*w,function(x){
    var p=[],N=16,i;
    for(i=0;i<=N;i++)p.push([-0.55*w+i/N*1.1*w,-hm+Math.sin(i*1.3)*0.012*w]);
    p.push([0.59*w,-hm*0.35]);p.push([0.58*w,0.05*w]);
    var drips=[0.42,0.18,-0.07,-0.32,-0.5];
    for(i=0;i<drips.length;i++){var dx=drips[i]*w,len=(0.08+Math.random()*0.15)*w;
      p.push([dx+0.065*w,0.012*w]);p.push([dx+0.03*w,len]);p.push([dx-0.03*w,len]);p.push([dx-0.065*w,0.012*w])}
    p.push([-0.58*w,0.04*w]);p.push([-0.59*w,-hm*0.45]);
    wc(x,p,'#f6b42b',{j:0.5});
    x.save();x.globalAlpha=0.55;x.strokeStyle='#fff3c0';x.lineWidth=0.028*w;x.beginPath();
    x.moveTo(-0.42*w,-hm*0.7);x.quadraticCurveTo(0,-hm*0.88,0.36*w,-hm*0.68);x.stroke();x.restore();
  });
  var ht=0.22*w;
  SP.tomS=mkSpr(w*1.16,ht*1.6,w*0.58,ht*1.25,function(x){
    [-0.26*w,0.26*w].forEach(function(cx0){
      wc(x,rrP(cx0-0.27*w,-ht+0.07*w,0.54*w,ht-0.07*w,0.08*w),'#d6382b',{j:0.7});
      wc(x,ellP(cx0,-ht+0.075*w,0.265*w,0.078*w,24,0.02),'#f0634d',{j:0.5});
      for(var k=0;k<5;k++){var a=k/5*TAU+0.4;dotE(x,cx0+Math.cos(a)*0.15*w,-ht+0.075*w+Math.sin(a)*0.038*w,0.05*w,0.018*w,'#f9c46e',0.75)}
      dotE(x,cx0,-ht+0.075*w,0.045*w,0.015*w,'#fde3b7',0.7);
    });
  });
  SP.tomW=mkSpr(w*0.64,w*0.64,w*0.32,w*0.58,function(x){
    wc(x,ellP(0,-0.25*w,0.265*w,0.245*w,26,0.015),'#e3412f',{j:0.9});
    dotE(x,-0.09*w,-0.36*w,0.065*w,0.035*w,'#ffd6c8',0.55);
    var st=[];for(var i=0;i<10;i++){var a=i/10*TAU,r=(i%2?0.04:0.115)*w;st.push([Math.cos(a)*r,-0.48*w+Math.sin(a)*r*0.45])}
    wc(x,st,'#5e9c3a',{j:0.4});
  });
  var hl=0.24*w;
  function letDraw(col,hh,droop){return function(x){
    var p=[],N=14,i,t;
    for(i=0;i<=N;i++){t=i/N;p.push([-0.6*w+t*1.2*w,-hh+Math.sin(t*Math.PI*7)*0.035*w+(Math.abs(t-0.5)>0.42?droop:0)])}
    p.push([0.64*w,-hh*0.3+droop]);p.push([0.61*w,0.03*w+droop]);
    for(i=N;i>=0;i--){t=i/N;p.push([-0.6*w+t*1.2*w,Math.sin(t*Math.PI*6+1)*0.028*w+0.012*w])}
    p.push([-0.64*w,0.03*w+droop]);p.push([-0.64*w,-hh*0.3+droop]);
    wc(x,p,col,{j:0.7});
    x.save();x.strokeStyle=shade(col,-0.3);x.globalAlpha=0.5;x.lineWidth=0.013*w;
    x.beginPath();x.moveTo(-0.5*w,-hh*0.5);x.quadraticCurveTo(0,-hh*0.62,0.5*w,-hh*0.5);x.stroke();
    for(i=-4;i<=4;i++){x.beginPath();x.moveTo(i*0.12*w,-hh*0.55);x.lineTo(i*0.12*w+0.05*w,-hh*0.9);x.stroke();
      x.beginPath();x.moveTo(i*0.12*w,-hh*0.55);x.lineTo(i*0.12*w+0.05*w,-hh*0.15);x.stroke()}
    x.restore();
    dotE(x,-0.2*w,-hh*0.75,0.25*w,0.02*w,'#e6f7c8',0.4);
  }}
  SP.let=mkSpr(w*1.36,hl*1.8,w*0.68,hl*1.35,letDraw('#93cc5c',hl,0));
  SP.letW=mkSpr(w*1.36,hl*1.8,w*0.68,hl*1.35,letDraw('#79a64a',0.16*w,0.07*w));
  /* supplies */
  SP.supCheese=mkSpr(w*1.0,w*0.75,w*0.5,w*0.68,function(x){
    wc(x,[[-0.42*w,0],[0.42*w,0],[0.42*w,-0.26*w],[-0.42*w,-0.52*w]],'#f7cb48',{j:0.8});
    dotE(x,-0.05*w,-0.36*w,0.3*w,0.03*w,'#fff0a8',0.6);
    [[-0.25,-0.22,0.06],[0.05,-0.12,0.05],[0.25,-0.1,0.04],[-0.1,-0.33,0.04],[0.2,-0.21,0.03]].forEach(function(h){dotE(x,h[0]*w,h[1]*w,h[2]*w,h[2]*w*0.8,'#dc9f22',0.6)});
  });
  SP.supTomato=mkSpr(w*1.0,w*0.8,w*0.5,w*0.74,function(x){
    [[-0.2,-0.36],[0.2,-0.36],[0,-0.5]].forEach(function(p){wc(x,ellP(p[0]*w,p[1]*w,0.18*w,0.165*w,20,0.02),'#e3412f',{j:0.7});dotE(x,p[0]*w-0.06*w,p[1]*w-0.07*w,0.04*w,0.025*w,'#ffd6c8',0.6);
      wc(x,ellP(p[0]*w,p[1]*w-0.15*w,0.06*w,0.025*w,10,0.1),'#5e9c3a',{j:0.3})});
    wc(x,[[-0.44*w,-0.3*w],[0.44*w,-0.3*w],[0.36*w,0],[-0.36*w,0]],'#c8995a',{j:0.8});
    x.save();x.strokeStyle='rgba(120,80,40,0.5)';x.lineWidth=1.2;
    for(var i=-3;i<=3;i++){x.beginPath();x.moveTo(i*0.11*w,-0.29*w);x.lineTo(i*0.095*w,-0.01*w);x.stroke()}
    x.beginPath();x.moveTo(-0.4*w,-0.15*w);x.lineTo(0.4*w,-0.15*w);x.stroke();x.restore();
  });
  SP.supLettuce=mkSpr(w*1.0,w*0.8,w*0.5,w*0.74,function(x){
    wc(x,ellP(0,-0.3*w,0.4*w,0.3*w,22,0.06),'#78b24a',{j:1});
    wc(x,ellP(-0.12*w,-0.36*w,0.24*w,0.22*w,18,0.07),'#9ad366',{j:0.8});
    wc(x,ellP(0.14*w,-0.34*w,0.22*w,0.2*w,18,0.07),'#a8dc74',{j:0.8});
    wc(x,ellP(0,-0.42*w,0.15*w,0.13*w,14,0.06),'#c4ea94',{j:0.6});
    x.save();x.strokeStyle='rgba(70,120,40,0.5)';x.lineWidth=1.2;
    for(var i=-2;i<=2;i++){x.beginPath();x.moveTo(i*0.04*w,-0.05*w);x.quadraticCurveTo(i*0.12*w,-0.25*w,i*0.17*w,-0.45*w);x.stroke()}x.restore();
  });
  SP.supBread=mkSpr(w*1.0,w*0.75,w*0.5,w*0.7,function(x){
    var p=[];for(var i=0;i<=16;i++){var a=Math.PI+i/16*Math.PI;p.push([Math.cos(a)*0.42*w,-0.12*w+Math.sin(a)*0.36*w])}

/* ---------------- audio ---------------- */
var AU={ctx:null,master:null,noise:null,load:0};
function audioUnlock(){
  try{
    if(!AU.ctx){
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      var c=new AC();AU.ctx=c;
      AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-14;AU.comp.ratio.value=4;
      AU.master=c.createGain();AU.master.gain.value=0.75;AU.master.connect(AU.comp);AU.comp.connect(c.destination);
      var b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
      var sb=c.createBufferSource();sb.buffer=c.createBuffer(1,1,22050);sb.connect(c.destination);sb.start(0);
    }
    if(AU.ctx.state!=='running'&&!document.hidden){var pr=AU.ctx.resume();if(pr&&pr.catch)pr.catch(function(){})}
  }catch(e){}
}
function aOK(){return AU.ctx&&AU.ctx.state==='running'}
function anow(){return AU.ctx.currentTime}
function budget(){if(AU.load>34)return false;AU.load++;return true}
function envG(gn,t,a,d,v){gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,v),t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function osc(type,f,t,a,d,v,o){
  if(!budget())return;o=o||{};var c=AU.ctx;
  var os=c.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.gl||d));
  var gn=c.createGain();envG(gn,t,a,d,v);var n=os;
  if(o.lp&&o.lp<9000){var fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;fl.Q.value=0.7;os.connect(fl);n=fl}
  n.connect(gn);gn.connect(AU.master);os.start(t);os.stop(t+a+d+0.05);
  if(o.vib){var lf=c.createOscillator(),lg=c.createGain();lf.frequency.value=o.vib;lg.gain.value=o.vd||f*0.03;lf.connect(lg);lg.connect(os.frequency);lf.start(t);lf.stop(t+a+d+0.05)}
}
function noise(t,d,v,o){
  if(!budget())return;o=o||{};var c=AU.ctx;
  var s=c.createBufferSource();s.buffer=AU.noise;
  var f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||2000,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+d);f.Q.value=o.q||1;
  var gn=c.createGain();envG(gn,t,o.a||0.003,d,v);
  s.connect(f);f.connect(gn);gn.connect(AU.master);s.start(t,Math.random()*0.5);s.stop(t+d+0.06);
}
var SC=[0,2,4,7,9,12,14,16,19,21,24];
var TOFF={bread:0,cheese:2,tomato:1,lettuce:3};
function noteF(i){var n=SC.length;i=((i%n)+n)%n;return 261.63*Math.pow(2,SC[i]/12)}
function sauceCat(s){if(!s||s.amt<0.08)return null;return s.red>0.65?'r':s.red<0.35?'y':'m'}
function itemVoice(it,t,v,f){
  var s=it.sauce,round=clamp(s.amt*1.3,0,1),lp=lerp(7000,850,round);
  if(s.amt>0.08)f*=Math.pow(2,(0.5-s.red)*4/12);
  if(it.type==='bread'){
    var crisp=clamp(1-it.soak*1.15+it.toast*0.35,0,1.3);
    osc('sine',f/2,t,0.004,0.16+0.22*it.soak+0.15*round,v*0.85,{f2:f/2*0.8,lp:lp});
    noise(t,0.03+0.05*crisp,v*0.32*crisp*(1-round*0.7),{f:2600+1800*crisp,q:0.8});
  }else if(it.type==='cheese'){
    if(melted(it)){osc('sine',f,t,0.02,0.6,v*0.7,{f2:f*0.84,gl:0.5,lp:lp,vib:5,vd:f*0.012});osc('sine',f*2,t,0.02,0.3,v*0.14,{lp:lp})}
    else{osc('sine',f,t,0.002,0.24,v*0.7,{lp:lp});osc('sine',f*3.99,t,0.002,0.05,v*0.22*(1-round),{lp:lp})}
  }else if(it.type==='tomato'){
    if(sliced(it))osc('sine',f*0.75,t,0.004,0.3,v*0.7,{vib:13,vd:f*0.06,lp:lp*(1-it.toast*0.3)});
    else osc('sine',f*0.5,t,0.003,0.2,v*0.75,{f2:f*0.36,lp:lp});
  }else{
    var wet=clamp(it.pool,0,1);
    noise(t,0.07,v*0.42,{f:lerp(6500,2300,wet)*(1-0.35*round)*(1-0.3*it.wilt),q:1.5});
    noise(t+0.07,0.05,v*0.28,{f:lerp(5000,1900,wet),q:1.5});
    osc('triangle',f,t,0.003,0.1,v*0.18,{lp:lp});
  }
}

function botHome(c){return {x:L.bot[c].x,y:L.bot[c].y-0.33*L.w}}

/* ---------------- picnic / band ---------------- */
function startPicnic(){

  if(aOK()){var t=anow();sCymbal(t,0.3);sCymbal(t+0.35,0.3)}
  S.fed={};S.band=[];S.duet=null;S.duetDone=false;S.concertPending=false;
  KINDS.forEach(function(k){AN[k].joined=false;AN[k].joinIdx=-1;AN[k].eat=null});
  var arr=shuffle(KINDS.slice());arr.forEach(function(k,i){AN[k].seat=i});
  S.queue=shuffle(KINDS.slice());
  setTimeoutFrame(0.6,sWhoosh);
  logEv('picnic open; seats '+arr.join(',')+' queue '+S.queue.join(','));
}
var timers=[];
function setTimeoutFrame(sec,fn){timers.push({t:sec,fn:fn})}
function updTimers(dt){for(var i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){var f=timers[i].fn;timers.splice(i,1);f()}}}
function outdoors(){return S.phase==='picnic'||S.phase==='concert'||(S.phase==='opening'&&S.phT>0.5)}
function requester(){
  if(S.phase!=='picnic')return null;
  for(var i=0;i<S.queue.length;i++){var a=AN[S.queue[i]];if(!S.fed[a.kind]&&!a.eat)return a}
  return null;
}
function chunkCat(items){var c=null;items.forEach(function(it){var s=sauceCat(it.sauce);if(s)c=s});return c}
function judge(kind,items){
  var pr=PREF[kind],has=items.some(function(it){return it.type===pr.food}),sc=has?2:0,cat=chunkCat(items);
  if(cat&&pr.sauce){sc+=cat===pr.sauce?1:-0.6}
  if(kind==='bird'&&items.some(function(it){return it.type==='bread'&&it.soak>0.5}))sc-=0.3;
  return sc>=2.6?'love':sc>=1.4?'like':sc>=0?'ok':'funny';
}
var VOL={love:1,like:0.85,ok:0.6,funny:0.55};
function startEat(a,items,snap,str){
  var react=judge(a.kind,items),big=items.length,soft=items.some(function(i){return melted(i)||(i.type==='bread'&&i.soak>0.5)});
  a.eat={items:items,t:0,dur:0.9+0.45*big+(soft?0.35:0),react:react,str:items.some(melted)};
  sMunch();
  logEv('feed '+a.kind+' <- '+items.map(function(i){return i.type}).join('+')+' => '+react);
  if((react==='love'||react==='like')&&snap)saveFav(snap);
  if(str&&str.len>0.9*L.w&&!S.duetDone&&Math.random()<0.45){
    var best=null,bd=1e9;KINDS.forEach(function(k){var b=AN[k];if(b===a||b.eat)return;var d=Math.abs(b.x-a.x);if(d<bd){bd=d;best=b}});
    if(best){S.duetDone=true;best.eat={items:[],t:0,dur:a.eat.dur,react:'love',str:true,partner:a};a.eat.partner=best;S.duet={a:a.kind,b:best.kind,pending:true,bars:0};logEv('duet '+a.kind+'+'+best.kind)}
  }
}
function finishEat(a){

  if(!a.joined){a.joined=true;S.band.push(a.kind);a.joinIdx=S.band.length-1}

  if(e.react==='love'){hearts(a.x,a.y-a.s,5);sHappy(900)}else if(e.react==='like'){hearts(a.x,a.y-a.s,2);sHappy(700)}else if(e.react==='funny'){sSneeze()}else sBoop(600);
  noteP(a.x,a.y-a.s*1.1);

/* ---------------- sequencer ---------------- */
var STEP=60/100/2;
var ROLES=[[0,3,6],[2,7],[4],[1,5]];
function qv(n,fn){S.vq.push({at:n*STEP,fn:fn})}
function seqUpdate(){
  if(!aOK()){S.nextStep=Math.floor(S.mt/STEP)+1;
    while(S.vq.length&&S.vq[0].at<=S.mt)S.vq.shift().fn();
    var n=Math.floor(S.mt/STEP);if(n!==S.lastVisStep){S.lastVisStep=n;visStep(n)}return}
  if(S.nextStep*STEP<S.mt-0.2)S.nextStep=Math.floor(S.mt/STEP)+1;
  while(S.nextStep*STEP<S.mt+0.12){
    var when=anow()+(S.nextStep*STEP-S.mt);playStep(S.nextStep,Math.max(anow(),when));S.nextStep++;
  }
  while(S.vq.length&&S.vq[0].at<=S.mt)S.vq.shift().fn();
}
function visStep(n){var s=n%8;if(s%2===0)S.beatPulse=1;phaseStep(n)}
function phaseStep(n){
  var s=n%8,bar=Math.floor(n/8);
  if(s!==0)return;
  if(S.concertPending&&S.phase==='picnic'){S.concertPending=false;S.phase='concert';S.concertStart=bar;S.chef.bang=1;logEv('concert')}
  else if(S.phase==='concert'){S.chef.bang=0.8;if(bar-S.concertStart>=4){S.phase='closing';S.phT=0;logEv('closing')}}
  else if(S.phase==='picnic'&&bar%4===0)S.chef.bang=0.5;
  if(S.duet&&S.duet.pending&&!AN[S.duet.a].eat){S.duet.pending=false;S.duet.start=bar}
  if(S.duet&&!S.duet.pending&&bar-S.duet.start>=2)S.duet=null;
}
function playStep(n,when){
  var s=n%8,st=S.stack,ph=S.phase;
  if(s%2===0)hat(when,s===0?0.05:0.03);
  if(s===0)kick(when,0.12);else if(s===4)kick(when,0.06);
  if(st.length){
    if(s===0||s===4){var b0=st[0];itemVoice(b0,when,0.2,noteF(TOFF[b0.type]));qv(n,function(){b0.play=1})}
    for(var k=1;k<st.length;k++){if(((k-1)%8)===s){(function(it,k){itemVoice(it,when,k>8?0.11:0.18,noteF(k+TOFF[it.type]));qv(n,function(){it.play=1})})(st[k],k)}}
  }
  if(S.pan.item&&s%2===1)sSizzle(when,0.06);
  if(S.mixT>0&&s%2===0)sShaka(when,0.09);
  if(S.pourT>0)sPour(when,0.08);
  var concert=ph==='concert',inK=ph==='kitchen'||ph==='closing';
  S.band.forEach(function(kind,idx){
    var a=AN[kind],role=ROLES[idx%4];
    if(role.indexOf(s)>=0||(concert&&(s%2)===(idx%2))){
      instr(kind,when,n,a.vol*(concert?1:0.75)*(inK?0.55:1));
      qv(n,function(){a.play=1;if(Math.random()<0.35)noteP(a.x,a.y-a.s*1.05,['#6a7fd0','#e2708a','#e9a83a','#58a86a'][idx%4])});
    }
  });
  if(S.duet&&!S.duet.pending&&s%2===0){instr(S.duet.a,when,n,0.9);instr(S.duet.b,when+0.01,n+2,0.9)}
  if(s===0){
    var bar=Math.floor(n/8);
    if(concert||(S.concertPending&&ph==='picnic'))sCymbal(when,0.22);
    else if(ph==='picnic'&&bar%4===0)sCymbal(when,0.08);
  }
  qv(n,function(){visStep(n)});
}

/* ---------------- guidance ---------------- */
function computeInvite(){
  var F=S.flags,st=S.stack,w=L.w;
  var toStack={x:S.topX,y:S.topY-0.15*w};
  function supI(k,to,key){return {key:key,obj:'sup:'+k,from:{x:L.sup[k].x,y:L.sup[k].y-0.25*w},to:to||toStack,kind:'drag',ghost:k}}
  if(S.phase==='picnic'){
    var rq=requester();if(!rq)return null;
    var want=PREF[rq.kind].food,idx=-1,lo=st.length>1?1:0;
    for(var i=st.length-1;i>=lo;i--){if(st[i].type===want){idx=i;break}}
    var ap={x:rq.x,y:L.plateSeatY};
    if(idx>=0&&G[idx])return {key:'feed:'+rq.kind+':'+st[idx].id,obj:'layer:'+st[idx].id,from:{x:G[idx].x,y:(G[idx].top+G[idx].bot)/2},to:ap,kind:'drag',ghost:want,who:rq.kind};
    var r=supI(want,null,'want:'+rq.kind+':'+want);r.who=rq.kind;return r;
  }
  if(S.phase!=='kitchen')return null;
  if(S.mem&&S.mem.length&&!F.memUsed)return {key:'mem',obj:'mem',from:{x:L.mem.x,y:L.mem.y-0.15*w},to:toStack,kind:'tap'};
  if(F.placed<2)return supI('cheese',null,'c0');
  if(!F.lettuce)return supI('lettuce',null,'l0');
  var b=S.board.item;
  if(b&&b.type==='tomato'&&b.chop<3)return {key:'chop'+b.id,obj:'board',from:{x:L.board.x,y:L.board.y-0.1*w},to:null,kind:'tap'};
  if(b)return {key:'bi'+b.id,obj:'boardItem',from:{x:L.board.x,y:L.board.y-0.2*w},to:toStack,kind:'drag',ghost:b.type};

  TYPES.forEach(function(t){var p=L.sup[t],sq=S.sup[t].sq,yb=invB('sup:'+t);haloAt('sup:'+t,p.x,p.y-0.28*w,0.8);
    g.save();g.translate(p.x,p.y+yb);g.scale(1+sq*0.18,1-sq*0.25);spr(supS[t]);g.restore()});
  /* bottles & bowl (home) */
  ['r','y'].forEach(function(c){var b=S.bot[c];if(b.held||b.auto)return;var yb=invB('bot:'+c);haloAt('bot:'+c,b.x,b.y,0.6);
    g.save();g.translate(b.x,b.y+yb);g.rotate(b.tilt);spr(c==='r'?SP.botR:SP.botY);g.restore()});
  if(!S.bowl.carry)drawBowl();
  /* plate & stack */
  if(S.held&&S.held.mode==='items'&&!outdoors())haloAt2(S.topX,S.topY-0.1*w,0.8);
  g.save();g.translate(L.plate.x+S.plate.dx,L.plate.y);g.scale(1+S.plate.sq*0.02,1-S.plate.sq*0.04);spr(SP.plate);g.restore();
  if(S.beatPulse>0.01){g.save();g.globalAlpha=S.beatPulse*0.18;g.strokeStyle='#ffffff';g.lineWidth=3;g.beginPath();g.ellipse(L.plate.x+S.plate.dx,L.plate.y,0.8*w*(1.05-S.beatPulse*0.05),0.18*w,0,0,TAU);g.stroke();g.restore()}
  var st=S.stack;
  for(i=0;i<st.length;i++){var q=G[i],it=st[i];
    if(S.invite&&S.invite.obj==='layer:'+it.id&&!S.held)haloAt2(q.x,(q.top+q.bot)/2,0.75);
    drawItem(it,q.x,q.bot,q.sx,q.sy,1)}
  /* loose */
  S.loose.forEach(function(o){drawItem(o.it,o.x,o.y,1,1,0.95,o.rot)});
  /* strings */
  var h=S.held;
  if(h&&h.str&&h.str.ax!==undefined){g.strokeStyle='#f6b42b';g.lineWidth=Math.max(1.5,0.05*w*(1-h.str.len/(2.8*w)));g.beginPath();g.moveTo(h.str.ax,h.str.ay);g.quadraticCurveTo((h.str.ax+h.x)/2,Math.max(h.str.ay,h.y)+0.3*w,h.x,h.y+0.05*w);g.stroke()}
  /* flyers */
  S.flyers.forEach(function(f){drawChunk(f.items,f.x,f.y,1)});
  /* held */
  if(h){
    if(h.mode==='items'){var tilt=clamp((h.x-(h.px||h.x))*0.01,-0.3,0.3);drawChunk(h.items,h.x,h.y+0.1*w,1.06,tilt)}
  }
  ['r','y'].forEach(function(c){var b=S.bot[c];if(!(b.held||b.auto))return;g.save();g.translate(b.x,b.y);g.rotate(b.tilt);spr(c==='r'?SP.botR:SP.botY);g.restore()});
  if(S.bowl.carry)drawBowl();
  drawParticles();
  if(S.demo)drawDemo();
}
function E2(x,y){g.fillStyle='#f27b9b';g.beginPath();var s=0.06*L.w;g.moveTo(x,y+s*0.8);g.bezierCurveTo(x-s*1.4,y-s*0.2,x-s*0.5,y-s*1.2,x,y-s*0.3);g.bezierCurveTo(x+s*0.5,y-s*1.2,x+s*1.4,y-s*0.2,x,y+s*0.8);g.fill()}
function haloAt2(x,y,sc){g.save();g.translate(x,y);var k=sc*(0.9+0.12*Math.sin(S.t*5));g.scale(k,k);spr(SP.halo,0.6);g.restore()}
function drawBowl(){
  var B=S.bowl,r=L.bowlR,yb=invB('bowl');
  haloAt('bowl',B.x,B.y,0.75);
  g.save();g.translate(B.x,B.y+yb);g.rotate(B.tilt);g.scale(1+B.sq*0.08,1-B.sq*0.1);spr(SP.bowl);
  var tot=B.red+B.yel;
  if(tot>0.01){
    var lv=clamp(Math.sqrt(tot),0.3,1),rx=r*0.8*lv,ry=r*0.2*lv,cy=0.03*r;
    var both=B.red>0.02&&B.yel>0.02,mixed=mixc(YEL,RED,B.red/tot);
    if(both&&B.mix<0.98){
      g.fillStyle=rgba(hex(B.red>B.yel?RED:YEL),0.95);g.beginPath();g.ellipse(0,cy,rx,ry,0,0,TAU);g.fill();
      g.save();g.beginPath();g.ellipse(0,cy,rx,ry,0,0,TAU);g.clip();
      g.strokeStyle=rgba(hex(B.red>B.yel?YEL:RED),0.9);g.lineWidth=0.09*r;
      for(var i=0;i<3;i++){g.beginPath();g.ellipse(0,cy,rx*(0.3+i*0.25),ry*(0.3+i*0.25),0,B.swirl+i*2,B.swirl+i*2+2.2);g.stroke()}
      g.restore();
      g.fillStyle=rgba(mixed,B.mix);g.beginPath();g.ellipse(0,cy,rx,ry,0,0,TAU);g.fill();
    }else{g.fillStyle=rgba(mixed,0.95);g.beginPath();g.ellipse(0,cy,rx,ry,0,0,TAU);g.fill()}
    g.fillStyle='rgba(255,255,255,0.45)';g.beginPath();g.ellipse(-rx*0.35,cy-ry*0.3,rx*0.18,ry*0.18,0,0,TAU);g.fill();
  }
  g.restore();
}
function drawParticles(){
  var w=L.w;
  for(var i=0;i<S.parts.length;i++){var p=S.parts[i],a=clamp(p.life/p.max,0,1);
    g.globalAlpha=Math.min(1,a*1.5);
    if(p.type==='spark'){g.strokeStyle=p.col;g.lineWidth=2;var s=p.size*(0.5+a);g.beginPath();g.moveTo(p.x-s,p.y);g.lineTo(p.x+s,p.y);g.moveTo(p.x,p.y-s);g.lineTo(p.x,p.y+s);g.stroke()}
    else if(p.type==='heart'){var hs=p.size;g.fillStyle=p.col;g.beginPath();g.moveTo(p.x,p.y+hs*0.8);g.bezierCurveTo(p.x-hs*1.4,p.y-hs*0.2,p.x-hs*0.5,p.y-hs*1.2,p.x,p.y-hs*0.3);g.bezierCurveTo(p.x+hs*0.5,p.y-hs*1.2,p.x+hs*1.4,p.y-hs*0.2,p.x,p.y+hs*0.8);g.fill()}
    else if(p.type==='note'){g.fillStyle=p.col;g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.ellipse(p.x,p.y,p.size*0.6,p.size*0.45,-0.4,0,TAU);g.fill();g.beginPath();g.moveTo(p.x+p.size*0.5,p.y);g.lineTo(p.x+p.size*0.5,p.y-p.size*1.8);g.lineTo(p.x+p.size*1.1,p.y-p.size*1.4);g.stroke()}
    else if(p.type==='steam'){g.fillStyle='rgba(255,255,255,0.5)';g.beginPath();g.arc(p.x,p.y,p.size*(1.5-a),0,TAU);g.fill()}
    else if(p.type==='petal'){g.save();g.translate(p.x,p.y);g.rotate(p.rot+S.t*2);g.fillStyle=p.col;g.beginPath();g.ellipse(0,0,p.size,p.size*0.5,0,0,TAU);g.fill();g.restore()}
    else if(p.type==='crumb'){g.fillStyle=p.col;g.fillRect(p.x,p.y,p.size*1.4,p.size)}
    else if(p.type==='scent'){g.strokeStyle='rgba(232,72,58,0.5)';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.quadraticCurveTo(p.x+p.size,p.y-p.size,p.x,p.y-p.size*2);g.stroke()}
    else{g.fillStyle=p.col;g.beginPath();g.ellipse(p.x,p.y,p.size*0.8,p.size*(p.vy>0?1.3:1),0,0,TAU);g.fill()}
  }
  g.globalAlpha=1;
}
function drawDemo(){
  var d=S.demo,inv=d.inv,t=d.t,w=L.w,fx=inv.from.x,fy=inv.from.y;
  var al=clamp(Math.min(t/0.3,(d.dur-t)/0.3),0,1)*0.9;
  var x=fx,y=fy,press=0;
  if(inv.kind==='drag'&&inv.to){
    var k=clamp((t-0.6)/1.2,0,1),e=ease(k);press=t>0.35&&t<1.9?1:0;
    x=lerp(fx,inv.to.x,e);y=lerp(fy,inv.to.y,e)-Math.sin(e*Math.PI)*0.5*w;
    if(press&&inv.ghost){g.save();g.globalAlpha=0.5*al;var gi=BUB[inv.ghost];drawItem(gi,x,y-0.05*w,1,1,0.8);g.restore()}
    if(press&&!inv.ghost&&(inv.obj==='bowl'||inv.obj.indexOf('bot:')===0)){g.save();g.globalAlpha=0.35*al;g.beginPath();g.arc(x,y,0.25*w,0,TAU);g.fillStyle='#ffffff';g.fill();g.restore()}
  }else if(inv.kind==='circle'){var a=t*5;x=fx+Math.cos(a)*0.25*w;y=fy+Math.sin(a)*0.1*w;press=t>0.3&&t<2.3?1:0}
  else{press=(t>0.4&&t<0.65)||(t>0.95&&t<1.2)?1:0}
  drawHand(x,y,press,al);
}

/* ---------------- particles update ---------------- */
function updParticles(dt){
  var w=L.w;
  for(var i=S.parts.length-1;i>=0;i--){var p=S.parts[i];p.life-=dt;
    if(p.type==='drop'||p.type==='sdrop'||p.type==='crumb'){p.vy+=14*w*dt;if(p.y>=p.ty){p.life=Math.min(p.life,0.15);p.vy=0;p.vx=0;p.y=p.ty}}
    else if(p.type==='heart'||p.type==='note'||p.type==='steam'||p.type==='scent'){p.vy*=Math.exp(-dt*0.8);p.vx*=Math.exp(-dt*2)}
    else if(p.type==='spark'){p.vx*=Math.exp(-dt*3);p.vy=p.vy*Math.exp(-dt*3)+4*w*dt}
    else if(p.type==='petal'){p.vx+=Math.sin(S.t*2+i)*w*dt}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0)S.parts.splice(i,1);
  }
  if(S.catSniff>0&&S.phase==='kitchen'&&Math.random()<dt*3&&S.stack.length){
    for(var k=S.stack.length-1;k>=0;k--){if(sliced(S.stack[k])&&G[k]){emit('scent',G[k].x-0.4*w,G[k].top,-0.5*w,-0.15*w,1.5,0.08*w,'#e8483a');break}}
  }
}

/* ---------------- main loop ---------------- */
var lastTs=0,rafId=0,running=false,needLayout=false,frameN=0,fpsAcc=0,fpsN=0,FPS=60;
function update(dt){
  S.t+=dt;S.mt+=dt;S.idle+=dt;frameN++;
  AU.load*=Math.exp(-dt*8);
  S.beatPulse=Math.max(0,S.beatPulse-dt*3);
  seqUpdate();updTimers(dt);
  var sub=Math.max(1,Math.ceil(dt/(1/120))),hh=dt/sub;
  for(var i=0;i<sub;i++)physStep(hh);
  computeGeom();checkTopple();computeGeom();
  updTools(dt);updHeld(dt);updFlyers(dt);updLoose(dt);
  updAnimals(dt);updPhase(dt);updParticles(dt);updInvite(dt);
  if(S.slipSnd>0.06*L.w){S.slipSnd=0;if(aOK())osc('sine',700,anow(),0.01,0.08,0.05,{f2:400})}
  if(S.slipSnd>0)S.slipSnd*=Math.exp(-dt*2);
}
function frame(ts){
  if(!running)return;
  rafId=requestAnimationFrame(frame);
  if(needLayout){needLayout=false;relayout()}
  var dt=lastTs?(ts-lastTs)/1000:1/60;lastTs=ts;
  if(dt>0){fpsAcc+=dt;fpsN++;if(fpsAcc>1){FPS=fpsN/fpsAcc;fpsAcc=0;fpsN=0}}
  dt=clamp(dt,0,0.05);
  update(dt);render();
}
function start(){if(running)return;running=true;lastTs=0;rafId=requestAnimationFrame(frame)}
function stop(){running=false;cancelAnimationFrame(rafId);forceRelease()}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){stop();try{if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend()}catch(e){}}
  else{try{if(AU.ctx)AU.ctx.resume()}catch(e){};S.nextStep=Math.floor(S.mt/STEP)+1;start()}
});
window.addEventListener('pagehide',function(){stop()});
window.addEventListener('pageshow',function(){if(!document.hidden)start()});
function relayout(){
  var oW=W,oH=H;forceRelease();
  computeLayout();buildSprites();buildBG();
  S.loose.forEach(function(o){o.x=o.x/oW*W;o.y=groundY(o.y/oH*H);o.gy=o.y;o.rest=true;o.vx=o.vy=0});
  S.flyers.forEach(function(f){f.x0=f.x0/oW*W;f.y0=f.y0/oH*H});
  KINDS.forEach(function(k){var a=AN[k],sp=spotOf(a);a.x=sp.x;a.y=sp.y;a.s=sp.s});
  S.bowl.x=L.bowl.x;S.bowl.y=L.bowl.y;['r','y'].forEach(function(c){var h=botHome(c);S.bot[c].x=h.x;S.bot[c].y=h.y});
  computeGeom();
}
window.addEventListener('resize',function(){needLayout=true});
window.addEventListener('orientationchange',function(){needLayout=true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){needLayout=true});

/* ---------------- init ---------------- */
function init(){
  computeLayout();buildSprites();buildBG();initBub();
  loadStore();
  if(STORE.fav)S.mem=STORE.fav;
  S.stack.push(mkItem('bread'));
  KINDS.forEach(function(k){var a=AN[k],sp=spotOf(a);a.x=sp.x;a.y=sp.y;a.s=sp.s});
  S.bowl.x=L.bowl.x;S.bowl.y=L.bowl.y;['r','y'].forEach(function(c){var h=botHome(c);S.bot[c].x=h.x;S.bot[c].y=h.y});
  computeGeom();
  start();
}
window.__gf={S:S,AN:AN,STORE:STORE,get L(){return L},get G(){return G},get fps(){return FPS},get audio(){return AU.ctx?AU.ctx.state:'none'},SKEY:SKEY,
  startPicnic:function(){startPicnic()}};
init();
})();
</script>
