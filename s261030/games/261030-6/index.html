<div id="sa"></div>
<script>
(()=>{
'use strict';
// ============================================================
//  ぺたぺた！くまちゃんの雲までバースデーケーキ  (sticker_place)
// ============================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');

// ---------- constants ----------
const R=0.9;            // row height (world units, column width = 1)
const BASE_H=2;         // base cake rows
const CLOUD_H=9;        // column height that touches the cloud
const TW=0.85;          // terrace cell width
const MAX_TW=2;         // terrace max cells
const MAX_GUESTS=4;
const MAXP=140;         // particle cap
const MEM_KEY='kuma-cloud-cake-v1';
const LEAD='#5a3a52';
const YT=CLOUD_H*R+0.55; // sky table surface
const GUEST_KINDS=['hedgehog','squirrel','chick','mouse'];
const ACC=['#ff8fb1','#8fd6ff','#ffd36b','#b9f0a8','#d9b3ff'];

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

// ---------- layout ----------
let W=0,H=0,DPR=1,S=40,OX=0,BASEY=0,PLAYTOP=0,PLAYBOT=0,TRAYH=0;
let SAFE={t:0,r:0,b:0,l:0};
let camY=0,camYT=0;
const sx=x=>OX+x*S;
const sy=y=>BASEY-(y-camY)*S;
const wx=px=>(px-OX)/S;
const wy=py=>camY+(BASEY-py)/S;
const colX=i=>i-2;

function layout(){
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const cs=getComputedStyle(saEl);
  SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  TRAYH=clamp(H*0.15,100,150)+SAFE.b;
  PLAYTOP=SAFE.t; PLAYBOT=H-TRAYH;
  const aw=W-SAFE.l-SAFE.r, ah=PLAYBOT-PLAYTOP;
  S=Math.max(18,Math.min(aw/8.9, ah/10.7));
  OX=SAFE.l+aw/2;
  BASEY=PLAYBOT-0.55*S;
  buildSprites();
  if(G){ camYT=camTarget(); camY=camYT; }
}
function halfView(){ return (W/2)/S; }

// ---------- sprite helpers ----------
function mk(wu,hu,pad,fn,ppu){
  ppu=ppu||S;
  const k=ppu*DPR;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil((wu+2*pad)*k)); c.height=Math.max(1,Math.ceil((hu+2*pad)*k));
  const g=c.getContext('2d');
  g.setTransform(k,0,0,k,pad*k,pad*k);
  g.lineJoin='round'; g.lineCap='round';
  fn(g);
  return {c,pad,wu,hu,ppu};
}
// draw sprite anchored at bottom-center (bx,by screen), with scale
function blitB(sp,bx,by,scx,scy,alpha){
  const k=S/sp.ppu*1;
  ctx.save();
  if(alpha!==undefined&&alpha<1) ctx.globalAlpha*=alpha;
  ctx.translate(bx,by); ctx.scale(scx||1,scy||1);
  ctx.drawImage(sp.c,-(sp.wu/2+sp.pad)*S,-(sp.hu+sp.pad)*S,(sp.wu+2*sp.pad)*S,(sp.hu+2*sp.pad)*S);
  ctx.restore();
}
// draw sprite centered at screen point with pixel size per unit
function blitC(sp,cx,cy,ppu,rot,alpha){
  ctx.save();
  if(alpha!==undefined&&alpha<1) ctx.globalAlpha*=alpha;
  ctx.translate(cx,cy); if(rot) ctx.rotate(rot);
  ctx.drawImage(sp.c,-(sp.wu/2+sp.pad)*ppu,-(sp.hu/2+sp.pad)*ppu,(sp.wu+2*sp.pad)*ppu,(sp.hu+2*sp.pad)*ppu);
  ctx.restore();
}
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function rainbow(g,x0,y0,x1,y1){
  const gr=g.createLinearGradient(x0,y0,x1,y1);
  gr.addColorStop(0,'rgba(255,90,120,1)'); gr.addColorStop(0.2,'rgba(255,190,70,1)');
  gr.addColorStop(0.4,'rgba(250,240,110,1)'); gr.addColorStop(0.6,'rgba(110,220,160,1)');
  gr.addColorStop(0.8,'rgba(110,170,255,1)'); gr.addColorStop(1,'rgba(200,120,255,1)');
  return gr;
}
// stained-glass shape: rainbow shadow, puffy white rim, translucent fill, lead line
function glass(g,path,c1,c2,b,o){
  o=o||{};
  g.save(); g.translate(0.05,0.07); path(g); g.globalAlpha=o.sh===undefined?0.33:o.sh;
  g.fillStyle=rainbow(g,b[0],b[1],b[0]+b[2],b[1]+b[3]); g.fill(o.rule||'nonzero'); g.restore();
  path(g); g.strokeStyle='rgba(255,255,255,0.97)'; g.lineWidth=o.rim||0.16; g.stroke();
  const gr=g.createLinearGradient(b[0],b[1],b[0]+b[2]*0.5,b[1]+b[3]);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  path(g); g.fillStyle=gr; g.fill(o.rule||'nonzero');
  g.strokeStyle=LEAD; g.lineWidth=o.lw||0.045; g.stroke();
}
function gloss(g,x,y,rx,ry,a){
  g.save(); g.globalAlpha=a===undefined?0.6:a; g.fillStyle='#fff';
  g.beginPath(); g.ellipse(x,y,rx,ry,-0.5,0,TAU); g.fill(); g.restore();
}
function facet(g,pts){
  g.save(); g.strokeStyle='rgba(90,58,82,0.35)'; g.lineWidth=0.025; g.beginPath();
  for(let k=0;k<pts.length;k+=4){ g.moveTo(pts[k],pts[k+1]); g.lineTo(pts[k+2],pts[k+3]); }
  g.stroke(); g.restore();
}
function seed(g,x,y){
  g.save(); g.fillStyle='rgba(255,226,120,0.95)'; g.strokeStyle='rgba(120,60,40,0.5)'; g.lineWidth=0.015;
  g.beginPath(); g.ellipse(x,y,0.025,0.04,0.3,0,TAU); g.fill(); g.stroke(); g.restore();
}

// icons drawn in unit box centred on 0,0 (radius ~0.5)
function iconBerry(g){
  const p=g2=>{g2.beginPath(); g2.moveTo(0,0.43);
    g2.bezierCurveTo(-0.4,0.2,-0.44,-0.18,-0.22,-0.28);
    g2.bezierCurveTo(-0.09,-0.34,0.09,-0.34,0.22,-0.28);
    g2.bezierCurveTo(0.44,-0.18,0.4,0.2,0,0.43); g2.closePath();};
  glass(g,p,'rgba(255,110,130,0.92)','rgba(214,20,60,0.9)',[-0.42,-0.34,0.84,0.77]);
  facet(g,[0,-0.3,0,0.42, -0.3,-0.05,0.3,0.15, -0.25,0.2,0.25,-0.05]);
  for(const [x,y] of [[-0.2,-0.12],[0.02,-0.16],[0.22,-0.1],[-0.12,0.06],[0.12,0.05],[-0.02,0.22],[0.2,0.22],[-0.22,0.2]]) seed(g,x,y);
  // leaves
  g.save(); g.beginPath();
  for(let k=0;k<5;k++){const a=-Math.PI/2+(k-2)*0.55; g.moveTo(0,-0.3); g.quadraticCurveTo(Math.cos(a-0.3)*0.18,-0.3+Math.sin(a-0.3)*0.12,Math.cos(a)*0.22,-0.3+Math.sin(a)*0.14+0.06);}
  g.strokeStyle='rgba(255,255,255,0.95)'; g.lineWidth=0.1; g.stroke();
  g.strokeStyle='#5fbf5a'; g.lineWidth=0.06; g.stroke(); g.restore();
  g.save(); g.fillStyle='#4aa84a'; g.beginPath(); g.ellipse(0,-0.33,0.05,0.035,0,0,TAU); g.fill(); g.restore();
  gloss(g,-0.17,-0.12,0.08,0.05);
}
function iconCream(g){
  const p=g2=>{g2.beginPath();
    g2.moveTo(-0.38,0.3); g2.quadraticCurveTo(-0.42,0.12,-0.28,0.1);
    g2.quadraticCurveTo(-0.33,-0.06,-0.18,-0.08);
    g2.quadraticCurveTo(-0.2,-0.24,-0.04,-0.26);
    g2.quadraticCurveTo(0.02,-0.4,0.12,-0.38);
    g2.quadraticCurveTo(0.06,-0.3,0.12,-0.24);
    g2.quadraticCurveTo(0.24,-0.2,0.18,-0.08);
    g2.quadraticCurveTo(0.34,-0.06,0.28,0.1);
    g2.quadraticCurveTo(0.42,0.12,0.38,0.3);
    g2.quadraticCurveTo(0,0.4,-0.38,0.3); g2.closePath();};
  glass(g,p,'rgba(255,255,252,0.97)','rgba(244,222,200,0.95)',[-0.42,-0.4,0.84,0.8]);
  g.save(); g.strokeStyle='rgba(200,160,150,0.55)'; g.lineWidth=0.03; g.beginPath();
  g.moveTo(-0.3,0.12); g.quadraticCurveTo(0,0.2,0.3,0.12);
  g.moveTo(-0.18,-0.06); g.quadraticCurveTo(0,0.02,0.2,-0.06); g.stroke(); g.restore();
  gloss(g,-0.14,-0.12,0.08,0.05,0.8);
  g.save(); g.fillStyle='rgba(255,150,180,0.7)'; g.beginPath(); g.arc(0.14,0.2,0.04,0,TAU); g.arc(-0.12,0.24,0.03,0,TAU); g.fill(); g.restore();
}
function iconCandle(g){
  const p=g2=>{rr(g2,-0.11,-0.12,0.22,0.52,0.06);};
  glass(g,p,'rgba(255,200,220,0.95)','rgba(255,160,190,0.92)',[-0.11,-0.12,0.22,0.52]);
  g.save(); rr(g,-0.11,-0.12,0.22,0.52,0.06); g.clip();
  g.strokeStyle='rgba(255,215,90,0.9)'; g.lineWidth=0.06;
  for(let k=-2;k<4;k++){ g.beginPath(); g.moveTo(-0.15,k*0.14); g.lineTo(0.15,k*0.14-0.12); g.stroke(); }
  g.restore();
  g.strokeStyle=LEAD; g.lineWidth=0.03; g.beginPath(); g.moveTo(0,-0.12); g.lineTo(0,-0.19); g.stroke();
  // flame
  const f=g2=>{g2.beginPath(); g2.moveTo(0,-0.44); g2.quadraticCurveTo(0.13,-0.27,0,-0.18); g2.quadraticCurveTo(-0.13,-0.27,0,-0.44); g2.closePath();};
  glass(g,f,'rgba(255,240,150,0.98)','rgba(255,150,40,0.95)',[-0.13,-0.44,0.26,0.26],{sh:0.2,rim:0.1});
  gloss(g,-0.05,0.0,0.03,0.08,0.7);
}
function iconKnife(g){
  g.save(); g.rotate(-0.6);
  const blade=g2=>{g2.beginPath(); g2.moveTo(-0.07,-0.06); g2.lineTo(-0.07,0.44); g2.quadraticCurveTo(0.12,0.4,0.1,0.1); g2.lineTo(0.1,-0.06); g2.closePath();};
  glass(g,blade,'rgba(235,248,255,0.97)','rgba(150,190,230,0.95)',[-0.07,-0.06,0.17,0.5]);
  facet(g,[0,-0.04,0,0.38]);
  const hd=g2=>{rr(g2,-0.085,-0.44,0.2,0.4,0.07);};
  glass(g,hd,'rgba(255,214,120,0.97)','rgba(222,150,60,0.95)',[-0.085,-0.44,0.2,0.4]);
  g.fillStyle='rgba(255,255,255,0.8)'; g.beginPath(); g.arc(0.015,-0.32,0.03,0,TAU); g.arc(0.015,-0.16,0.03,0,TAU); g.fill();
  gloss(g,-0.02,0.15,0.025,0.12,0.7);
  g.restore();
}
function stickerDisc(icon){
  return g=>{
    g.save(); g.translate(0.04,0.06); g.beginPath(); g.arc(0,0,0.48,0,TAU); g.globalAlpha=0.28; g.fillStyle=rainbow(g,-0.5,-0.5,0.5,0.5); g.fill(); g.restore();
    g.beginPath(); g.arc(0,0,0.48,0,TAU); g.fillStyle='rgba(255,255,255,0.96)'; g.fill();
    g.strokeStyle='rgba(200,170,190,0.7)'; g.lineWidth=0.02; g.stroke();
    g.save(); g.scale(0.82,0.82); icon(g); g.restore();
  };
}

// union of circles (+ optional rect) with one outer outline
function puffy(g,circ,rect,b){
  const path=()=>{ g.beginPath(); for(const [x,y,r] of circ){ g.moveTo(x+r,y); g.arc(x,y,r,0,TAU); } if(rect) g.rect(rect[0],rect[1],rect[2],rect[3]); };
  g.save(); g.translate(0.05,0.07); path(); g.globalAlpha=0.28; g.fillStyle=rainbow(g,b[0],b[1],b[0]+b[2],b[1]+b[3]); g.fill(); g.restore();
  path(); g.strokeStyle=LEAD; g.lineWidth=0.24; g.stroke();
  path(); g.strokeStyle='rgba(255,255,255,0.98)'; g.lineWidth=0.17; g.stroke();
  const gr=g.createLinearGradient(b[0],b[1],b[0],b[1]+b[3]); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(228,236,255,1)');
  path(); g.fillStyle=gr; g.fill();
}
let SP={};
function buildSprites(){
  SP={};
  // base cake: 5 wide x 2 rows
  const bh=BASE_H*R;
  SP.base=mk(5,bh,0.25,g=>{
    const sponge=g2=>rr(g2,0.03,0.32,4.94,bh-0.34,0.16);
    glass(g,sponge,'rgba(255,232,170,0.93)','rgba(240,180,95,0.92)',[0,0.3,5,bh-0.3]);
    // jam stripe
    g.save(); sponge(g); g.clip();
    g.fillStyle='rgba(235,60,100,0.55)'; g.fillRect(0,bh*0.62,5,0.16);
    g.fillStyle='rgba(255,255,255,0.55)'; g.fillRect(0,bh*0.62+0.16,5,0.05);
    g.restore();
    facet(g,[1,0.4,1,bh-0.05, 2,0.4,2,bh-0.05, 3,0.4,3,bh-0.05, 4,0.4,4,bh-0.05]);
    // frosting with drips
    const fr=g2=>{g2.beginPath(); g2.moveTo(0.06,0.06); g2.lineTo(4.94,0.06); g2.quadraticCurveTo(5.02,0.06,4.98,0.25);
      let x=4.98; const drips=[4.7,4.3,3.75,3.3,2.8,2.25,1.75,1.2,0.75,0.3];
      for(const dx of drips){ const d=0.12+((dx*7)%3)*0.07; g2.quadraticCurveTo(x-0.05,0.36,dx+0.12,0.36); g2.quadraticCurveTo(dx+0.1,0.36+d,dx,0.36+d); g2.quadraticCurveTo(dx-0.1,0.36+d,dx-0.12,0.36); x=dx-0.12; }
      g2.quadraticCurveTo(0.02,0.36,0.02,0.2); g2.quadraticCurveTo(0.02,0.06,0.06,0.06); g2.closePath();};
    glass(g,fr,'rgba(255,255,253,0.98)','rgba(250,235,222,0.96)',[0,0,5,0.6]);
    for(let k=0;k<5;k++){ g.save(); g.translate(k+0.5,0.6); g.scale(0.36,0.36); iconBerry(g); g.restore(); }
    gloss(g,0.4,0.62,0.16,0.07,0.5);
  });
  // berry step blocks (mirrored)
  for(let m=0;m<2;m++){
    SP['berry'+m]=mk(0.96,R,0.15,g=>{
      if(m){ g.translate(0.96,0); g.scale(-1,1); }
      const p=g2=>{g2.beginPath(); g2.moveTo(0.12,0.02); g2.lineTo(0.52,0.02); g2.quadraticCurveTo(0.56,0.02,0.56,0.08);
        g2.lineTo(0.56,0.28); g2.lineTo(0.84,0.28); g2.quadraticCurveTo(0.94,0.28,0.94,0.38); g2.lineTo(0.94,0.78);
        g2.quadraticCurveTo(0.94,0.88,0.84,0.88); g2.lineTo(0.12,0.88); g2.quadraticCurveTo(0.02,0.88,0.02,0.78);
        g2.lineTo(0.02,0.12); g2.quadraticCurveTo(0.02,0.02,0.12,0.02); g2.closePath();};
      glass(g,p,'rgba(255,120,140,0.9)','rgba(210,25,62,0.88)',[0,0,0.96,0.9]);
      facet(g,[0.02,0.5,0.94,0.58, 0.56,0.28,0.4,0.88, 0.3,0.02,0.2,0.5]);
      g.save(); g.fillStyle='rgba(255,210,220,0.55)'; g.fillRect(0.06,0.05,0.46,0.07); g.fillRect(0.6,0.31,0.3,0.07); g.restore();
      for(const [x,y] of [[0.2,0.3],[0.42,0.42],[0.7,0.55],[0.25,0.68],[0.55,0.75],[0.82,0.72]]) seed(g,x,y);
      gloss(g,0.18,0.22,0.06,0.1,0.55);
    });
  }
  SP.arch=mk(0.96,R,0.15,g=>{
    const p=g2=>{rr(g2,0.02,0.02,0.92,0.86,0.14); g2.moveTo(0.74,0.88); g2.arc(0.48,0.88,0.26,0,Math.PI,true); g2.closePath();};
    glass(g,p,'rgba(255,120,140,0.9)','rgba(210,25,62,0.88)',[0,0,0.96,0.9],{rule:'evenodd'});
    g.save(); g.beginPath(); g.moveTo(0.74,0.88); g.arc(0.48,0.88,0.26,0,Math.PI,true); g.closePath(); g.fillStyle='rgba(255,236,180,0.28)'; g.fill(); g.restore();
    facet(g,[0.48,0.02,0.48,0.6, 0.02,0.4,0.24,0.6, 0.94,0.4,0.72,0.6]);
    for(const [x,y] of [[0.2,0.2],[0.75,0.2],[0.35,0.35],[0.62,0.36],[0.12,0.7],[0.84,0.7]]) seed(g,x,y);
    // leaf crown
    g.save(); g.translate(0.48,0.03); g.scale(0.5,0.5); g.fillStyle='#5fbf5a'; g.strokeStyle='#fff'; g.lineWidth=0.08;
    g.beginPath(); for(let k=0;k<5;k++){const a=Math.PI+k*Math.PI/4; g.moveTo(0,0); g.ellipse(Math.cos(a)*0.2,Math.sin(a)*0.16,0.14,0.06,a,0,TAU);} g.stroke(); g.fill(); g.restore();
    gloss(g,0.2,0.18,0.06,0.09,0.55);
  });
  const creamPath=g2=>{g2.beginPath(); g2.moveTo(0.1,0.05); g2.lineTo(0.86,0.05); g2.quadraticCurveTo(0.94,0.05,0.94,0.15);
    g2.lineTo(0.94,0.78); g2.quadraticCurveTo(0.94,0.88,0.84,0.88); g2.lineTo(0.12,0.88); g2.quadraticCurveTo(0.02,0.88,0.02,0.78);
    g2.lineTo(0.02,0.15); g2.quadraticCurveTo(0.02,0.05,0.1,0.05); g2.closePath();};
  const creamTop=g=>{
    const d=g2=>{g2.beginPath(); g2.moveTo(0.0,0.08); g2.quadraticCurveTo(0.0,-0.04,0.12,-0.02);
      g2.quadraticCurveTo(0.3,-0.08,0.48,-0.03); g2.quadraticCurveTo(0.68,-0.08,0.84,-0.02); g2.quadraticCurveTo(0.96,-0.04,0.96,0.08);
      g2.lineTo(0.96,0.22); g2.quadraticCurveTo(0.9,0.3,0.82,0.24); g2.quadraticCurveTo(0.78,0.42,0.7,0.24);
      g2.quadraticCurveTo(0.56,0.3,0.44,0.24); g2.quadraticCurveTo(0.38,0.46,0.3,0.24); g2.quadraticCurveTo(0.14,0.32,0.0,0.22); g2.closePath();};
    glass(g,d,'rgba(255,255,255,0.99)','rgba(252,240,230,0.97)',[0,-0.08,0.96,0.5],{sh:0.2});
    gloss(g,0.22,0.06,0.09,0.03,0.7);
  };
  SP.cream=mk(0.96,R,0.15,g=>{

// ---------- audio ----------
let AC=null,MASTER=null,NOISE=null;
function initAudio(){
  try{
    if(AC){ if(AC.state==='suspended') AC.resume().catch(()=>{}); return; }
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C();
    MASTER=AC.createGain(); MASTER.gain.value=0.55;
    const comp=AC.createDynamicsCompressor(); MASTER.connect(comp); comp.connect(AC.destination);
    const len=Math.floor(AC.sampleRate*1.2);
    NOISE=AC.createBuffer(1,len,AC.sampleRate);
    const d=NOISE.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    // silent unlock
    const b=AC.createBufferSource(); b.buffer=AC.createBuffer(1,1,22050); b.connect(AC.destination); b.start(0);
    if(AC.state==='suspended') AC.resume().catch(()=>{});
  }catch(e){ AC=null; }
}
function outNode(pan){
  if(AC.createStereoPanner){ const p=AC.createStereoPanner(); p.pan.value=clamp(pan||0,-1,1); p.connect(MASTER); return p; }
  return MASTER;
}
function tone(f,d,o){
  if(!AC||AC.state!=='running') return; o=o||{};
  try{
    const t0=AC.currentTime+(o.at||0);
    const os=AC.createOscillator(), g=AC.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0);
    if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+(o.tt||d));
    if(o.vib){ const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=o.vib; lg.gain.value=f*0.02; l.connect(lg); lg.connect(os.frequency); l.start(t0); l.stop(t0+d+0.05); }
    const v=o.v===undefined?0.2:o.v;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.a||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    os.connect(g); g.connect(outNode(o.pan)); os.start(t0); os.stop(t0+d+0.05);
  }catch(e){}
}
function noise(d,o){
  if(!AC||AC.state!=='running'||!NOISE) return; o=o||{};
  try{
    const t0=AC.currentTime+(o.at||0);
    const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
    const f=AC.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t0); f.Q.value=o.q||1;
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t0+d);
    const g=AC.createGain(); const v=o.v===undefined?0.2:o.v;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.a||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    s.connect(f); f.connect(g); g.connect(outNode(o.pan)); s.start(t0,Math.random()*0.5); s.stop(t0+d+0.05);
  }catch(e){}
}

// ---------- memory ----------
let MEM=null, memStatus='none', saveStatus='none';
const EATC=['berry','cream','mix','plain'];
function loadMem(){
  let s=null;
  try{ s=window.localStorage.getItem(MEM_KEY); }catch(e){ memStatus='read-error'; return null; }
  if(s===null||s===undefined){ memStatus='none'; return null; }
  try{
    const o=JSON.parse(s);
    const m=sanitizeMem(o);
    if(!m){ memStatus='corrupt'; return null; }
    memStatus='restored'; return m;
  }catch(e){ memStatus='corrupt'; return null; }
}
function sanitizeMem(o){
  if(!o||typeof o!=='object'||o.v!==1) return null;
  if(!['berry','cream','candle'].includes(o.fav)) return null;
  if(typeof o.rounds!=='number'||!isFinite(o.rounds)||o.rounds<1||o.rounds>1e7) return null;
  const eat={};
  if(o.eat&&typeof o.eat==='object'){ for(const k of ['rabbit','cat','bird','bear']) if(EATC.includes(o.eat[k])) eat[k]=o.eat[k]; }
  return {v:1,fav:o.fav,rounds:Math.floor(o.rounds),eat};
}
function saveMem(m){
  try{ window.localStorage.setItem(MEM_KEY,JSON.stringify(m)); saveStatus='ok'; return true; }
  catch(e){ saveStatus='refused'; return false; }
}

function seatKey(s){ if(!s) return ''; switch(s.t){case 'c':return 'c'+s.i; case 't':return 't'+s.ti+'_'+s.j; case 'g':return 'g'+Math.round(s.x*4); case 'T':return 'T'+s.k; case 's':return 's'+s.n; case 'p':return 'p'+s.i+'_'+s.j; case 'q':return 'q'; } return '?'; }
function seatPos(s){
  switch(s.t){
    case 'c': return [colX(s.i)+shiftX(s.i),topY(s.i)];
    case 't': { const tr=G.terr[s.ti]; return [cellX(tr,s.j),tr.lev*R-sink(tr.s<0?0:4)]; }
    case 'g': return [s.x,0];
    case 'T': return [TSEAT[s.k],YT];
    case 's': return [G.slots[s.n]!==undefined?G.slots[s.n]:0,(G.slotY[s.n]||YT)+0.24];
    case 'p': { const bl=G.cols[s.i].blocks; const top=s.j===bl.length-1; const y=top?topY(s.i):(BASE_H+s.j)*R-sink(s.i)+0.03; return [colX(s.i)+shiftX(s.i)+(top?0.22:0),y]; }
    case 'q': return [s.x,s.y];
  }
  return [0,0];
}
function seatColor(s){
  if(s.t==='c'){ const c=G.cols[s.i]; if(c.candle) return 'candle'; const b=topBlock(s.i); return b?b.t:'cream'; }
  if(s.t==='t'){ const tr=G.terr[s.ti]; if(tr.cand[s.j]) return 'candle'; return tr.cells[s.j]; }
  return '';
}
function seatOccupied(s,except){ const k=seatKey(s); return G.animals.some(a=>a!==except&&((a.seat&&seatKey(a.seat)===k)||(a.hop&&a.hop.seat&&seatKey(a.hop.seat)===k))); }
function animalsAt(s){ const k=seatKey(s); return G.animals.filter(a=>a.seat&&seatKey(a.seat)===k); }

// ---------- structure recompute ----------
function chooseDir(i){
  const hi=hgt(i); let best=null;
  for(const d of [-1,1]){ const j=i+d; if(j<0||j>4) continue; const hj=hgt(j); if(hj<hi&&(!best||hj<best.h||(hj===best.h&&d===(i<2?-1:1)))) best={d,h:hj}; }
  if(best) return best.d;
  if(i===0) return -1; if(i===4) return 1; return i<2?-1:1;
}
function slidePts(i,dir,e){
  const x0=colX(i)+shiftX(i), y0=topY(i)+0.06;
  let x1,y1;
  if(e>=0){ x1=colX(e)+shiftX(e); y1=topY(e)+0.06; } else { x1=colX(i)+dir*1.45; y1=0.05; }
  const drop=y0-y1, rl=clamp(drop*0.18,0.2,0.4);
  const ax=colX(i)+dir*0.62, ay=y1+Math.max(rl*2+0.1,drop*0.55);
  const pts=[];
  for(let k=0;k<=8;k++){ const u=k/8; const cx=x0+dir*0.5, cy=y0+0.22; pts.push([ (1-u)*(1-u)*x0+2*u*(1-u)*cx+u*u*ax, (1-u)*(1-u)*y0+2*u*(1-u)*cy+u*u*ay ]); }
  const ccx=ax, ccy=ay-rl;
  for(let k=1;k<=18;k++){ const th=Math.PI/2-dir*TAU*k/18; pts.push([ccx+rl*Math.cos(th),ccy+rl*Math.sin(th)]); }
  for(let k=1;k<=10;k++){ const u=k/10; const cx=x1+dir*0.25, cy=ay; pts.push([ (1-u)*(1-u)*ax+2*u*(1-u)*cx+u*u*x1, (1-u)*(1-u)*ay+2*u*(1-u)*cy+u*u*y1 ]); }
  const cum=[0]; for(let k=1;k<pts.length;k++) cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));
  return {pts,cum,len:cum[cum.length-1]};
}
function recompute(){
  G.slides=[]; G.arches=[];
  for(let i=0;i<5;i++){
    const bl=G.cols[i].blocks;
    bl.forEach((b,j)=>{ if(b.shape==='arch') G.arches.push({i,j}); });
    const tb=topBlock(i);
    if(tb&&tb.shape==='slide'){
      const hi=hgt(i); let d=tb.dir, e=i+d;
      const lower=j=>(j<0||j>4)?true:hgt(j)<hi;
      if(!lower(e)){ const d2=-d; if(lower(i+d2)&&i+d2>=0&&i+d2<=4){ d=d2; } else if(i+d2<0||i+d2>4){ d=d2; } else d=0; }
      if(d!==0){ tb.dir=d; e=i+d; if(e<0||e>4) e=-1; const g=slidePts(i,d,e); G.slides.push({i,dir:d,e,...g}); }
    }
  }
}
function slideAt(i){ return G.slides.find(s=>s.i===i); }
function refreshSlidePts(){ for(const s of G.slides){ const g=slidePts(s.i,s.dir,s.e); s.pts=g.pts; s.cum=g.cum; s.len=g.len; } }

// ---------- particles ----------
function part(o){ if(G.parts.length>=MAXP) G.parts.shift(); G.parts.push(Object.assign({x:0,y:0,vx:0,vy:0,life:1,max:1,c:'#fff',s:0.08,ty:'spark',rot:Math.random()*6,g:-2},o)); }
const SPARKC={berry:['#ff6b86','#ffd36b','#ffffff','#ff9fb5'],cream:['#ffffff','#ffe9f2','#ffd36b','#c9f1ff'],candle:['#ffd36b','#ffb347','#fff3b0','#ff9fb5'],rainbow:['#ff6b86','#ffd36b','#fff27a','#7fe0a8','#8fc4ff','#d6a8ff']};
function burst(x,y,n,pal,sp){ const P=SPARKC[pal]||SPARKC.rainbow; sp=sp||2.2; for(let k=0;k<n;k++){ const a=Math.random()*TAU, v=rnd(0.4,1)*sp; part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+1,life:rnd(0.5,1),max:1,c:P[k%P.length],s:rnd(0.05,0.11)}); } }
function notes(x,y,c){ part({x:x+rnd(-0.2,0.2),y,vx:rnd(-0.3,0.3),vy:1.2,life:1.4,max:1.4,c:c||'#ff7fa8',s:0.16,ty:'note',g:0}); }

// ---------- discovery ----------
function discover(k,x,y,big){
  if(G.D[k]) return false;
  G.D[k]=G.t; G.log.push({k,t:+G.t.toFixed(1)});
  if(big) SFX.big(); else SFX.success();
  burst(x,y,26,'rainbow',3);
  G.bear.react={type:'yay',t:0}; G.bear.bounce=1;
  cheer(x);
  return true;
}
function cheer(x){ const n=G.specN; SFX.cheer(n+2,x||0); for(const s of G.specs) s.v=1; }

// ---------- targets ----------
function visRange(){ return [wy(PLAYBOT)-0.3, wy(PLAYTOP)+0.2]; }
function targetsFor(type){
  const T=[]; const [vb,vt]=visRange();
  if(G.phase!=='build'&&G.phase!=='sky'&&G.phase!=='opening') return T;
  if(type==='berry'||type==='cream'){
    for(let i=0;i<5;i++) T.push({k:'col',i,x:colX(i)+shiftX(i),y:topY(i)+0.45});
    for(const s of [-1,1]){ const e=s<0?0:4, he=hgt(e);
      for(let lev=BASE_H;lev<=he;lev++){ const tr=findTer(s,lev); const w=tr?tr.w:0; if(w>=MAX_TW) continue;
        T.push({k:'side',s,lev,x:s*(2.5+0.08+(w+0.5)*TW),y:lev*R-0.21}); } }
  } else if(type==='candle'){
    for(let i=0;i<5;i++) if(!G.cols[i].candle) T.push({k:'ccol',i,x:colX(i)+shiftX(i)+0.28,y:topY(i)+0.3});
    G.terr.forEach((tr,ti)=>{ for(let j=0;j<tr.w;j++) if(!tr.cand[j]) T.push({k:'cter',ti,j,x:cellX(tr,j),y:tr.lev*R+0.25}); });
  }
  return T.filter(t=>t.y>vb&&t.y<vt+0.5);
}
function nearestTarget(type,x,y){
  const T=targetsFor(type); let best=null,bd=Math.max(1.25,58/S);
  for(const t of T){ const d=Math.hypot(t.x-x,(t.y-y)*0.9); if(d<bd){ bd=d; best=t; } }
  return best;
}

// ---------- placing ----------
function place(type,tg){
  G.counts[type]++; G.placed++;
  const B=G.bear; B.spark=0.9; B.bounce=Math.max(B.bounce,0.6);
  let px=tg.x,py=tg.y;
  if(tg.k==='col'){
    const i=tg.i, c=G.cols[i];
    const tb=topBlock(i); const below=tb?tb.t:'cake';
    const shape=type==='berry'?(below==='cream'?'arch':'berry'):(below==='berry'?'slide':'cream');
    const b={t:type,shape,born:G.t,m:(c.blocks.length+i)%2};
    c.blocks.push(b);
    if(shape==='slide') b.dir=chooseDir(i);
    const hh=hgt(i);
    px=colX(i); py=hh*R-0.4;
    SFX.stack(hh-2,px);
    burst(px,py+0.3,10,type);
    for(const a of animalsAt({t:'c',i})){ a.bounce=1; if(a.kind==='rabbit') SFX.hop(px); }
    recompute();
    if(type==='berry'&&below==='berry') discover('stairs',px,py+0.4);
    if(shape==='slide'){ discover('slide',px,py); G.cat.timer=Math.min(G.cat.timer,0.4); }
    if(shape==='arch'){ discover('arch',px,py); G.bird.timer=0; G.bird.perch=null; }
    // slide exit raised?
    for(const s of G.slides) if(s.e===i&&s.i!==i){ G.cat.timer=Math.min(G.cat.timer,0.6); }
    if(G.D.cloud) {} else if(hh>=CLOUD_H) openCloud();
    if(G.specN>0&&hh>=4) SFX.cheer(Math.min(G.specN,4),px);
  } else if(tg.k==='side'){
    let tr=findTer(tg.s,tg.lev); let j;
    if(!tr){ tr={s:tg.s,lev:tg.lev,w:1,cells:[type],cand:[false,false],born:[G.t,0]}; G.terr.push(tr); j=0; }
    else { j=tr.w; tr.w++; tr.cells.push(type); tr.born[j]=G.t; }
    const ti=G.terr.indexOf(tr);
    px=cellX(tr,j); py=tr.lev*R;
    SFX.stick(tr.lev+j,px);
    burst(px,py,10,type);
    if(j===0) discover('terrace',px,py);
    arriveGuest({t:'t',ti,j},true);
  } else if(tg.k==='ccol'||tg.k==='cter'){
    let seat;
    if(tg.k==='ccol'){ G.cols[tg.i].candle=true; G.cols[tg.i].cand=G.t; seat={t:'c',i:tg.i}; }
    else { G.terr[tg.ti].cand[tg.j]=G.t||0.001; seat={t:'t',ti:tg.ti,j:tg.j}; }
    const [x,y]=seatPos(seat); px=x; py=y;
    SFX.chime(x);
    burst(x,y+0.4,12,'candle');
    const occupied=animalsAt(seat).length>0;
    const prev=G.lights.length?G.lights[G.lights.length-1].seat:null;
    G.lights.push({seat,born:G.t});
    // spread light to neighbouring seats
    const nb=neighborSeats(seat);
    for(const n of nb){ G.glow[seatKey(n)]=G.t; G.strings.push({a:seat,b:n,born:G.t}); }
    if(prev) G.strings.push({a:prev,b:seat,born:G.t,long:true});
    if(occupied||G.lights.length>=2){
      const empty=nb.filter(n=>!seatOccupied(n));
      const dest=empty.length?pickPref(empty):(!seatOccupied(seat)?seat:(nb[0]||seat));
      const came=arriveGuest(dest,false);
      if(came&&occupied) discover('chain',x,y+0.5);
    }
  }
  onPlaced(px,py);
}
function onPlaced(x,y){
  hintCache=null;
}
function neighborSeats(s){
  const out=[];
  if(s.t==='t'){
    const tr=G.terr[s.ti];
    for(const j of [s.j-1,s.j+1]) if(j>=0&&j<tr.w) out.push({t:'t',ti:s.ti,j});
    const e=tr.s<0?0:4; if(Math.abs(hgt(e)-tr.lev)<=1) out.push({t:'c',i:e});
    G.terr.forEach((t2,ti)=>{ if(t2!==tr&&t2.s===tr.s&&Math.abs(t2.lev-tr.lev)===1) out.push({t:'t',ti,j:0}); });
  } else if(s.t==='c'){
    for(const i of [s.i-1,s.i+1]) if(i>=0&&i<=4) out.push({t:'c',i});
    if(s.i===0||s.i===4){ const sd=s.i===0?-1:1; G.terr.forEach((t2,ti)=>{ if(t2.s===sd&&Math.abs(t2.lev-hgt(s.i))<=1) out.push({t:'t',ti,j:0}); }); }
  }
  return out;
}
function pickPref(list){
  if(G.fav){ const f=list.filter(s=>seatColor(s)===G.fav); if(f.length) return f[0]; }
  return list[0];
}
function arriveGuest(seat,fromTerrace){
  let g=null;
  if(G.guests.length<MAX_GUESTS){
    const kind=GUEST_KINDS[G.guests.length%4];
    const side=seatPos(seat)[0]<0?-1:1;
    const hv=halfView()+0.8;
    const sy0=G.phase==='build'?0:clamp(seatPos(seat)[1],wy(PLAYBOT),wy(PLAYTOP));
    g=mkA(kind,side*hv,sy0,null); g.v=Math.floor(Math.random()*ACC.length); g.face=-side;
    G.guests.push(g); G.animals.push(g);
    const path=[];
    if(G.phase==='build') path.push({t:'g',x:side*clamp(2.9+Math.random()*0.6,2.9,hv-1)});
    path.push(seat);
    g.home=seat;
    followPath(g,path,a=>{ a.bounce=1; SFX.squeak(a.x); a.react={type:'yay',t:0}; });
    SFX.cheer(2,side*3);
    return g;
  }
  // all guests here: the farthest one moves to the new spot ("gather")
  let far=null,fd=-1; const [x,y]=seatPos(seat);
  for(const a of G.guests){ if(a.task||a.mode!=='idle') continue; const d=Math.hypot(a.x-x,a.y-y); if(d>fd){fd=d;far=a;} }
  if(far&&fd>0.5){ far.home=seat; followPath(far,[seat],a=>{a.bounce=1; a.react={type:'yay',t:0};}); SFX.squeak(far.x); return far; }
  return null;
}

// ---------- cloud opening ----------
function openCloud(){
  discover('cloud',0,CLOUD_H*R+0.4,true);
  G.phase='opening'; G.openT=0;
  for(let k=0;k<40;k++){ const a=Math.random()*TAU; part({x:rnd(-2.5,2.5),y:CLOUD_H*R+rnd(0,1),vx:Math.cos(a)*3,vy:Math.sin(a)*2+1,life:1.4,max:1.4,c:SPARKC.rainbow[k%6],s:rnd(0.07,0.14)}); }
  camYT=camTarget();
  // animals rise to the party
  const B=G.bear; B.struct=B.seat; B.seat=null; B.mode='float'; B.fly={x0:B.x,y0:B.y,t:0,seat:{t:'T',k:0}};
  let k=1;
  const others=[G.cat,...G.guests];
  for(const a of others){ if(a.mode==='slide') { a.task=null; } a.struct=a.seat||a.struct; a.task=null; const s={t:'T',k:k++}; a.home=s; a.path=[]; followPath(a,[s],null); }
  SFX.cheer(10,0);
}
function camTarget(){
  if(!G) return 0;
  if(G.phase==='build') return 0;
  const two=G.two&&(G.phase==='feast'||G.phase==='serve'||G.phase==='finale');
  const tgt=PLAYTOP+(two?0.76:0.6)*(PLAYBOT-PLAYTOP);
  let c=Math.max(YT-(BASEY-tgt)/S, 3.2);
  if(G.phase==='opening'||G.phase==='sky'){
    const mt=maxH()*R; c=Math.max(c,mt+1.1-(BASEY-PLAYTOP)/S);
  }
  return c;
}

// ---------- cutting & feast ----------
const BOUND=[-1.5,-0.5,0.5,1.5];
function knifeMove(px,py,ppx,ppy){
  const x=wx(px), y=wy(py)-0.4, x0=wx(ppx), y0=wy(ppy)-0.4;
  const mt=maxH()*R+0.3; const [vb]=visRange();
  const inside=(xx,yy)=>xx>-2.7&&xx<2.7&&yy>Math.max(0,vb)&&yy<mt;
  if(inside(x,y)&&inside(x0,y0)){ G.knifeAcc+=Math.hypot(x-x0,y-y0); if(Math.random()<0.4) part({x,y,vx:rnd(-0.5,0.5),vy:rnd(0,1),life:0.4,max:0.4,c:'#fff7c2',s:0.06}); }
  if(G.knifeAcc>=0.9){
    G.knifeAcc=0;
    let bi=-1,bd=99; for(let k=0;k<4;k++){ if(G.cuts[k]) continue; const d=Math.abs(BOUND[k]-x); if(d<bd){bd=d;bi=k;} }
    if(bi>=0){ G.cuts[bi]=1; G.cutFx[bi]=G.t; SFX.cut(BOUND[bi]); burst(BOUND[bi],y,12,'cream');
      for(let i=0;i<5;i++){ let g=0; for(let k=0;k<4;k++) if(G.cuts[k]) g+= i<=k?-0.06:0.06; G.cols[i].gapT=g; }
      if(!G.D.cut) discover('cut',BOUND[bi],y);
      if(G.cuts.every(v=>v)) startFeast();
      hintCache=null;
    }
  }
}
function compOf(blocks){ const c={berry:0,cream:0,candle:0}; for(const b of blocks) c[b.t]++; return c; }
function cls(c){ return c.berry>c.cream?'berry':c.cream>c.berry?'cream':(c.berry+c.cream>0?'mix':'plain'); }
function startFeast(){
  G.phase='feast'; G.feastT=0;
  if(drag&&drag.kind==='knife') endDrag(true);
  const [vb,vt]=visRange();
  const sl=[];
  const terSide=s=>{ const ts=G.terr.filter(t=>t.s===s); if(!ts.length) return null; const c={berry:0,cream:0,candle:0}; const layers=[];
    for(const t of ts){ for(let j=0;j<t.w;j++){ c[t.cells[j]]++; layers.push(t.cells[j]); if(t.cand[j]) c.candle++; } }
    const top=ts.reduce((m,t)=>Math.max(m,t.lev),0)*R; return {comp:c,layers,src:'t',side:s,sx:s*3.2,sy:clamp(top,vb+0.5,vt-0.5)}; };
  const L=terSide(-1); if(L) sl.push(L);
  for(let i=0;i<5;i++){ const c=compOf(G.cols[i].blocks); if(G.cols[i].candle) c.candle++; sl.push({comp:c,layers:G.cols[i].blocks.map(b=>b.t),src:'c',i,sx:colX(i),sy:clamp(topY(i)-0.5,vb+0.5,vt-0.3)}); }
  const Rr=terSide(1); if(Rr) sl.push(Rr);
  const n=G.animals.length;
  let ex=0; while(sl.length<n){ const e={comp:{berry:0,cream:1,candle:0},layers:['cream'],src:'x',sx:(ex%2?1:-1)*4,sy:YT+0.6}; if(ex%2) sl.push(e); else sl.unshift(e); ex++; }
  const N=sl.length, span=Math.min(10.2,2*halfView()-0.9), step=N>1?span/(N-1):0;
  G.two=2*halfView()<11&&N>4;
  G.big=G.two?1.35:clamp(step*0.95,1,1.3);
  G.slots=sl.map((s,k)=>N>1?-span/2+k*step:0);
  G.slotY=sl.map((s,k)=>YT+(G.two&&k%2?1.7:0));
  sl.forEach((s,k)=>{ s.hx=G.slots[k]; s.hy=G.slotY[k]+0.05; s.x=s.sx; s.y=s.sy; s.n=k; s.cls=cls(s.comp); s.eaten=false; s.drag=false; s.b=0; });
  G.slices=sl;
  // map animals to slots by their seat on the cake
  const taken=new Array(N).fill(false);
  const want=a=>{ const st=a.struct||a.seat; if(st&&st.t==='c'){ return sl.findIndex(s=>s.src==='c'&&s.i===st.i); }
    if(st&&st.t==='t'){ const tr=G.terr[st.ti]; return sl.findIndex(s=>s.src==='t'&&s.side===tr.s); } return -1; };
  const order=[...G.animals].sort((a,b)=>(want(b)>=0)-(want(a)>=0));
  for(const a of order){
    let w=want(a);
    if(w<0||taken[w]){ let bi=-1,bd=99; for(let k=0;k<N;k++){ if(taken[k]) continue; const d=Math.abs(G.slots[k]-(w>=0?G.slots[w]:a.x)); if(d<bd){bd=d;bi=k;} } w=bi; }
    taken[w]=true; a.slot=w;
  }
  for(const a of G.animals){
    a.task=null; a.path=[]; a.perch=null;
    if(a.kind==='bird'||a.mode==='float'||a.mode==='slide'||a.mode==='fly'){ a.mode='idle'; a.hop=null; }
    const s={t:'s',n:a.slot}; a.home=s;
    const d=0.7+Math.random()*0.5;
    a.delay=d;
  }
  SFX.big();
}

// ---------- feeding ----------
const REACT={
  rabbit:{berry:'dance',cream:'nose',mix:'hop',plain:'hop'},
  cat:{cream:'sing',berry:'roll',mix:'purr',plain:'purr'},
  bird:{berry:'loop',cream:'fluff',mix:'tweet',plain:'tweet'},
  bear:{berry:'spin',cream:'cheeks',mix:'hug',plain:'hug'},
  guest:{berry:'bounce',cream:'sway',mix:'munch',plain:'munch'},
};
function feed(sl,a){
  sl.eaten=true; sl.eatBy=a; sl.eatT=0;
  a.eatT=0.001; a.cls=sl.cls; a.candleSl=sl.comp.candle>0;
  SFX.munch(a.x);
  const key=REACT[a.kind]?a.kind:'guest';
  let r=REACT[key][sl.cls];
  if(a.kind==='bear'&&sl.comp.candle>0) r='wish';
  a.pending=r;
  if(!a.fed){ a.fed=true; }
  if(['rabbit','cat','bird','bear'].includes(a.kind)) G.eatLog[a.kind]=sl.cls;
  if(a.kind==='rabbit'&&sl.cls==='berry') G._fRB=1;
  if(a.kind==='cat'&&sl.cls==='cream') G._fCC=1;
  hintCache=null;
}
function startReaction(a){

function nextHop(a){

  const [x,y]=seatPos(s); const d=Math.hypot(x-a.x,y-a.y);
  const up=Math.max(0,y-a.y);

}
function updHop(a,dt){

  a.x=lerp(h.x0,x1,k); a.y=lerp(h.y0,y1,k)+Math.sin(Math.PI*k)*h.h;

    if(a.kind==='rabbit'||a.kind==='squirrel') SFX.hop(a.x); else SFX.step(a.x);

  }
}
// rabbit graph
function canStep(a,b){
  const ha=hgt(a),hb=hgt(b); if(Math.abs(ha-hb)<=1) return true;
  const lo=Math.min(ha,hb),hi=Math.max(ha,hb),tall=ha>hb?a:b;
  for(let r=lo;r<hi;r++) if(cellType(tall,r)!=='berry') return false;
  return true;
}
function rabbitThink(a){
  const opened=G.D.cloud&&(G.phase==='sky'||G.phase==='opening');
  // nodes 0..4 columns, 5 = sky table
  let start=-1;
  if(a.seat&&a.seat.t==='c') start=a.seat.i; else if(a.seat&&a.seat.t==='T') start=5; else return;
  const H=n=>n===5?YT/R:hgt(n);
  const adj=n=>{ const o=[]; if(n<5){ for(const m of [n-1,n+1]) if(m>=0&&m<=4&&canStep(n,m)) o.push(m);
      if(opened&&(n===0||n===4)&&Math.abs(hgt(n)*R-YT)<=R+0.05) o.push(5); }
    else if(opened){ for(const m of [0,4]) if(Math.abs(hgt(m)*R-YT)<=R+0.05) o.push(m); }
    return o; };
  const prev={}; const dist={}; dist[start]=0; const q=[start];
  while(q.length){ const n=q.shift(); for(const m of adj(n)) if(dist[m]===undefined){ dist[m]=dist[n]+1; prev[m]=n; q.push(m); } }
  let best=start,bs=-1e9;
  for(const k in dist){ const n=+k; let sc=H(n)*100-dist[n];
    if(n<5&&G.fav&&seatColor({t:'c',i:n})===G.fav) sc+=20; if(n===start) sc+=5; if(sc>bs){bs=sc;best=n;} }
  if(opened&&H(best)*R<YT-0.2){ // rabbit wants the party table if it cannot climb higher
    if(start!==5){ const k=freeTSeat(a); if(k>=0){ a.home={t:'T',k}; followPath(a,[{t:'T',k}],null); return true; } }
  }
  if(best!==start){
    const seq=[]; let n=best; while(n!==start){ seq.unshift(n); n=prev[n]; }
    followPath(a,seq.map(n=>n===5?{t:'T',k:Math.max(0,freeTSeat(a))}:{t:'c',i:n}),r=>{
      const hh=r.seat&&r.seat.t==='c'?hgt(r.seat.i):0;
      if(hh>G.maxRabbit){ G.maxRabbit=hh; r.react={type:'yay',t:0}; SFX.giggle(r.x); notes(r.x,r.y+0.8,'#ff7fa8'); if(hh>=5) cheer(r.x); }
    });
    return true;
  }

}
function freeTSeat(a){ for(let k=0;k<TSEAT.length;k++){ if(!seatOccupied({t:'T',k},a)) return k; } return -1; }
function catPathTo(a,i){

function startSlide(a,sl){

function updSlide(a,dt){

}
function invite(cat){
  let best=null,bd=1.8;

    const d=Math.hypot(a.x-cat.x,(a.y-cat.y)*0.8); if(d<bd){bd=d;best=a;} }

    const p=catPathTo(best,s.i); followPath(best,p,g=>{ const sl=slideAt(s.i); if(sl&&g.task) startSlide(g,sl); else g.task=null; });
  }
}

// ---------- animals: think ----------
function think(a,dt){
  a.timer-=dt;
  const ph=G.phase;
  if(ph==='feast'||ph==='serve'||ph==='finale'){
    if(a.delay>0){ a.delay-=dt; if(a.delay<=0&&a.home) followPath(a,[a.home],b=>{b.face=1;}); }
    return;
  }
  if(a.kind==='rabbit'){
    if(a.mode==='idle'&&a.timer<=0){ a.timer=0.7+Math.random()*0.6; if(!rabbitThink(a)){ if(Math.random()<0.45){ a.bounce=1; a.hopT=0.001; } if(Math.random()<0.3) a.face*=-1; } }
  } else if(a.kind==='cat'){
    if(a.mode==='idle'&&a.timer<=0){
      const sl=usableSlides();
      if(sl.length){ const s=sl[Math.floor(Math.random()*sl.length)];
        if(a.seat&&a.seat.t==='c'&&a.seat.i===s.i){ startSlide(a,s); }
        else followPath(a,catPathTo(a,s.i),c=>{ const s2=slideAt(s.i); if(s2&&(G.phase==='build'||G.phase==='sky')) startSlide(c,s2); else c.timer=1; });
        a.timer=2;
      } else {
        a.timer=2+Math.random()*2;
        if(ph==='build'){
          if(a.seat&&a.seat.t==='g'){ if(Math.random()<0.5){ a.play=1.6; } else { const nx=clamp(Math.abs(a.x)+rnd(-0.8,0.8),3.1,4.1)*(a.x<0?-1:1); followPath(a,[{t:'g',x:nx}],null); } }
          else if(a.seat&&a.seat.t==='c'){ if(Math.random()<0.4){ const i=a.seat.i; const j=clamp(i+(Math.random()<0.5?-1:1),0,4); followPath(a,[{t:'c',i:j}],null); } else a.play=1.6; }
          else followPath(a,[{t:'g',x:3.7}],null);
        } else { a.play=1.6; }
      }
    }
  } else if(a.kind==='bird'){
    birdThink(a,dt);
  } else if(a.kind==='bear'){
    if(a.mode==='float'){ const f=a.fly; f.t+=dt/2.6; const k=ease(f.t); const [tx,ty]=seatPos(f.seat);
      a.x=lerp(f.x0,tx,k); a.y=lerp(f.y0,ty,k)+Math.sin(k*Math.PI)*0.4;
      if(f.t>=1){ a.mode='idle'; a.seat=f.seat; a.fly=null; a.bounce=1; a.balloon=1; } }
  } else { // guests
    if(a.task) return;
    if(a.mode==='idle'&&a.timer<=0){
      a.timer=5+Math.random()*5;
      if(G.fav&&Math.random()<0.5&&a.seat&&seatColor(a.seat)!==G.fav){
        const cand=[]; G.terr.forEach((tr,ti)=>{ for(let j=0;j<tr.w;j++){ const s={t:'t',ti,j}; if(seatColor(s)===G.fav&&!seatOccupied(s)) cand.push(s);} });
        for(let i=0;i<5;i++){ const s={t:'c',i}; if(seatColor(s)===G.fav&&!seatOccupied(s)) cand.push(s); }
        if(cand.length&&ph==='build'){ const s=cand[Math.floor(Math.random()*cand.length)]; a.home=s; followPath(a,[s],null); return; }
      }

    }
  }
}
function birdPerches(){
  const P=[]; const [vb,vt]=visRange();
  for(const ar of G.arches){ const s={t:'p',i:ar.i,j:ar.j}; const p=seatPos(s); if(p[1]>vb+0.3&&p[1]<vt) P.push(s); }
  return P;
}
function birdThink(a,dt){
  if(a.mode==='hop'||a.mode==='slide') return;
  const P=birdPerches();
  if(a.mode==='perch'){
    a.timer-=0;
    const still=a.perch&&P.some(s=>seatKey(s)===seatKey(a.perch));
    if(!still){ a.mode='fly'; a.fly={ph:Math.random()*6}; a.perch=null; return; }
    const [x,y]=seatPos(a.perch); a.x=x; a.y=y;
    if(a.timer<=0){ a.timer=4+Math.random()*4; if(Math.random()<0.5&&P.length>1){ const o=P.filter(s=>seatKey(s)!==seatKey(a.perch)); a.perch=null; a.mode='to'; a.to={s:o[Math.floor(Math.random()*o.length)],x0:a.x,y0:a.y,t:0}; SFX.tweet(a.x);} else { a.preen=1.5; if(Math.random()<0.5) SFX.tweet(a.x); } }
    return;
  }
  if(a.mode==='to'){
    const t=a.to; t.t+=dt/1.1; const [x,y]=seatPos(t.s); const k=ease(t.t);
    const nx=lerp(t.x0,x,k), ny=lerp(t.y0,y,k)+Math.sin(k*Math.PI)*0.8;
    if(Math.abs(nx-a.x)>0.001) a.face=nx>a.x?1:-1; a.x=nx; a.y=ny;
    if(t.t>=1){ a.mode='perch'; a.perch=t.s; a.timer=3+Math.random()*3; a.bounce=1; SFX.tweet(a.x); burst(a.x,a.y+0.2,6,'berry',1.2); }
    return;
  }

  const cy=(G.phase==='build'?CLOUD_H*R-0.7:YT+1.6);
  const tx=Math.sin(a.fly.ph)*2.8, ty=cy+Math.sin(a.fly.ph*2)*0.45;
  if(Math.abs(tx-a.x)>0.001) a.face=tx>a.x?1:-1;
  a.x=lerp(a.x,tx,Math.min(1,dt*2)); a.y=lerp(a.y,ty,Math.min(1,dt*2));
  if(a.timer<=0){ a.timer=1.5+Math.random()*2; if(P.length){ const s=pickPerch(P); a.mode='to'; a.to={s,x0:a.x,y0:a.y,t:0}; } else if(Math.random()<0.3) SFX.tweet(a.x); }

function pickPerch(P){ return P[Math.floor(Math.random()*P.length)]; }

// ---------- hint & demo ----------
let hintCache=null, idleT=0, demo=null, demoDone=false;
function hint(){
  if(hintCache&&hintCache.t>G.t-0.25) return hintCache.h;
  const h=computeHint(); hintCache={t:G.t,h}; return h;
}
function colTarget(i){ return {x:colX(i)+shiftX(i),y:topY(i)+0.45}; }
function computeHint(){
  const ph=G.phase;
  if(trans) return null;
  if(ph==='build'||ph==='sky'){
    if(ph==='sky'&&!G.cuts.every(v=>v)){ return {src:'knife',dst:{x:BOUND[G.cuts.indexOf(0)]||0,y:Math.max(visRange()[0]+1.2,YT-0.2)},drag:'down'}; }
    const D=G.D; const tops=[0,1,2,3,4].map(i=>topBlock(i));
    const rab=G.rabbit.seat&&G.rabbit.seat.t==='c'?G.rabbit.seat.i:3;
    if(G.placed===0&&G.fav){ if(G.fav==='candle') return {src:'candle',dst:{x:colX(rab)+0.28,y:topY(rab)+0.3}}; return {src:G.fav,dst:colTarget(rab===2?3:2)}; }
    if(!D.stairs){
      let i=tops.findIndex(b=>b&&b.shape==='berry');
      if(i<0){ i=rab===0?1:rab-1; }
      return {src:'berry',dst:colTarget(i)};
    }
    if(!D.slide||!D.arch){
      if(!D.slide){ let best=-1; for(let i=0;i<5;i++){ if(tops[i]&&tops[i].t==='berry'){ if(best<0) best=i; if(hgt(i)>hgt(best)) best=i; } }
        if(best>=0) return {src:'cream',dst:colTarget(best)}; }
      if(!D.arch){ const i=tops.findIndex(b=>b&&b.shape==='cream'); if(i>=0) return {src:'berry',dst:colTarget(i)};
        let j=-1; for(let k=0;k<5;k++) if(!tops[k]||tops[k].t!=='berry'){ if(!slideAt(k)){ j=k; break; } }
        if(j>=0) return {src:'cream',dst:colTarget(j)}; }
      if(!D.slide){ return {src:'berry',dst:colTarget(1)}; }
    }
    if(!D.terrace){ const he=hgt(4); return {src:'berry',dst:{x:2.5+0.08+0.5*TW,y:he*R-0.21}}; }
    if(!D.chain){
      for(let ti=0;ti<G.terr.length;ti++){ const tr=G.terr[ti]; for(let j=0;j<tr.w;j++){ if(!tr.cand[j]&&animalsAt({t:'t',ti,j}).length) return {src:'candle',dst:{x:cellX(tr,j),y:tr.lev*R+0.25}}; } }
      for(let ti=0;ti<G.terr.length;ti++){ const tr=G.terr[ti]; for(let j=0;j<tr.w;j++){ if(!tr.cand[j]) return {src:'candle',dst:{x:cellX(tr,j),y:tr.lev*R+0.25}}; } }
    }
    if(!D.exit){ const s=G.slides.find(s=>s.e>=0&&hgt(s.e)+1<hgt(s.i)); if(s) return {src:'berry',dst:colTarget(s.e)}; }
    // toward the cloud / the sky seats
    let best=0; for(let i=1;i<5;i++) if(hgt(i)>hgt(best)||(hgt(i)===hgt(best)&&tops[i]&&tops[i].t==='berry')) best=i;
    return {src:'berry',dst:colTarget(best)};
  }
  if(ph==='serve'){
    const un=G.animals.filter(a=>!a.fed&&a.mode==='idle');
    const sl=G.slices.filter(s=>!s.eaten&&!s.drag);
    if(!un.length||!sl.length) return null;
    const pair=(ak,c)=>{ const a=un.find(a=>a.kind===ak); const s=sl.find(s=>s.cls===c); return a&&s?{a,s}:null; };
    const p=pair('rabbit','berry')||pair('cat','cream')||{a:un[0],s:sl.reduce((m,s)=>Math.abs(s.x-un[0].x)<Math.abs(m.x-un[0].x)?s:m,sl[0])};
    return {src:'slice',slice:p.s,dst:{x:p.a.x,y:p.a.y+0.5},animal:p.a};
  }
  return null;
}
function hintSrcScreen(h){
  if(!h) return null;

  const it=trayItems.find(t=>t.type===h.src); if(it) return [it.x,it.y];
  return null;

// ---------- tray ----------
let trayItems=[];
const trayState={};
function trayTypes(){
  const ph=G.phase;
  if(ph==='build'||ph==='opening') return ['berry','cream','candle'];
  if(ph==='sky') return G.cuts.every(v=>v)?['berry','cream','candle']:['berry','cream','candle','knife'];
  return [];
}
function layoutTray(dt){
  const types=trayTypes();
  const n=Math.max(1,types.length);
  const aw=W-SAFE.l-SAFE.r;
  const sp=Math.min(aw/n,170);
  const cy=PLAYBOT+(TRAYH-SAFE.b)/2+4;
  const r=Math.min((TRAYH-SAFE.b)*0.36,52);
  for(const k of ['berry','cream','candle','knife']){ if(!trayState[k]) trayState[k]={vis:0,pop:1,b:0,x:W/2,y:cy,wob:0}; }
  trayItems=[];
  types.forEach((t,k)=>{ const st=trayState[t]; st.x=OX+(k-(n-1)/2)*sp; st.y=cy; st.r=r; st.type=t; trayItems.push(st); });
  for(const k in trayState){ const st=trayState[k]; const on=types.includes(k); st.vis=clamp(st.vis+(on?1:-1)*(dt||0)*3,0,1); if(!dt) st.vis=on?1:0; st.pop=Math.min(1,st.pop+(dt||0)*3); st.wob=Math.max(0,st.wob-(dt||0)*2); }
}

function toWorld(px,py){ return [wx(px),wy(py)]; }
function liftPx(){ return Math.min(46,Math.max(26,S*0.85)); }
function onDown(e){
  initAudio();
  if(activeId!==null||trans){ return; }
  activeId=e.pointerId;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){ }
  idleT=0; demo=null; demoDone=false;
  const px=e.clientX, py=e.clientY; const [x,y]=toWorld(px,py);
  // tray
  for(const it of trayItems){
    if(it.vis<0.5) continue;
    if(Math.hypot(px-it.x,py-it.y)<it.r*1.25){
      if(it.type==='knife'){ drag={kind:'knife',px,py,lx:px,ly:py,t0:G.t}; SFX.peel(); return; }
      drag={kind:'sticker',type:it.type,px,py,t0:G.t,tg:null}; it.pop=0; SFX.peel(); return;
    }
  }
  if(G.phase==='serve'||G.phase==='finale'){
    const m=bigMul(); let best=null,bd=Math.max(0.7,36/S)*m;
    for(const s of G.slices){ if(s.eaten) continue; const d=Math.hypot(s.x-x,s.y+0.25*m-y); if(d<bd){bd=d;best=s;} }
    if(best){ drag={kind:'slice',s:best,px,py}; best.drag=true; SFX.peel(); return; }
  }
  // animals
  let ba=null,bd=Math.max(0.6,30/S);
  for(const a of G.animals){ const sz=(a.kind==='bear'?0.75:0.45)*bigMul(); const d=Math.hypot(a.x-x,(a.y+sz)-y); if(d<bd+ (a.kind==='bear'?0.25:0)){bd=d;ba=a;} }
  if(ba){ tapAnimal(ba); drag={kind:'none'}; return; }
  // cake columns
  if(G.phase==='build'||G.phase==='sky'||G.phase==='opening'){
    for(let i=0;i<5;i++){ const cx=colX(i)+shiftX(i); if(Math.abs(x-cx)<=0.52&&y>=-0.1&&y<=topY(i)+0.25){ squishCol(i,y); drag={kind:'none'}; return; } }
  }
  // scenery: small wobble only
  for(const f of G.flowers){ if(Math.hypot(f.x-x,0.3-y)<0.45){ f.w=1; SFX.pop(f.x); drag={kind:'none'}; return; } }
  for(const t of G.trees){ if(Math.abs(t.x-x)<0.8&&y>0&&y<2.6){ t.w=1; SFX.step(t.x); drag={kind:'none'}; return; } }
  drag={kind:'none'};
}
function squishCol(i,y){
  const c=G.cols[i]; c.sq=0.24; c.sv=0;
  for(const j of [i-1,i+1]) if(j>=0&&j<=4){ G.cols[j].sq=Math.max(G.cols[j].sq,0.1); }
  SFX.squish(colX(i));
  burst(colX(i),Math.min(y,topY(i)),5,'cream',1.2);
  for(const a of animalsAt({t:'c',i})){ a.bounce=1; a.react={type:'yay',t:0}; }
  G.firstTap=G.firstTap||G.t;
}
function tapAnimal(a){
  a.tap=1; a.bounce=1;
  ({rabbit:SFX.hop,cat:SFX.meow,bird:SFX.tweet,bear:SFX.giggle}[a.kind]||SFX.squeak)(a.x);
  if(a.kind==='bear') a.spark=0.6;
}
function onMove(e){
  if(e.pointerId!==activeId||!drag) return;
  const px=e.clientX, py=e.clientY;
  if(drag.kind==='sticker'){ drag.px=px; drag.py=py; const [x,y]=toWorld(px,py-liftPx()); drag.tg=nearestTarget(drag.type,x,y); }
  else if(drag.kind==='knife'){ const ox=drag.px,oy=drag.py; drag.px=px; drag.py=py; knifeMove(px,py,ox,oy); }
  else if(drag.kind==='slice'){ drag.px=px; drag.py=py; const [x,y]=toWorld(px,py-liftPx()*0.6); drag.s.x=x; drag.s.y=y-0.25; }
}
function onUp(e){
  if(e.pointerId!==activeId) return;
  endDrag(false);
}
function onCancel(e){ if(e.pointerId!==activeId) return; endDrag(true); }
function endDrag(cancel){
  const d=drag; drag=null; activeId=null;
  if(!d) return;
  if(d.kind==='sticker'){
    const [x,y]=toWorld(d.px,d.py-liftPx());
    const tg=cancel?null:nearestTarget(d.type,x,y);
    if(tg) place(d.type,tg);
    else { G.returning={type:d.type,x:d.px,y:d.py-liftPx(),t:0}; if(!cancel) SFX.back(); }
  } else if(d.kind==='slice'){
    const s=d.s; s.drag=false;
    const m=bigMul(); let ba=null,bd=1.1*m;
    if(!cancel) for(const a of G.animals){ if(a.mode!=='idle'||a.eatT>0) continue; const dd=Math.hypot(a.x-s.x,(a.y+0.45*m)-(s.y+0.25*m)); if(dd<bd){bd=dd;ba=a;} }
    if(ba) feed(s,ba); else { s.ret=1; if(!cancel) SFX.back(); }
  } else if(d.kind==='knife'){ G.knifeAcc=0; if(trayState.knife) trayState.knife.wob=1; }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); onDown(e); },{passive:false});
cv.addEventListener('pointermove',e=>{ e.preventDefault(); onMove(e); },{passive:false});
cv.addEventListener('pointerup',e=>{ e.preventDefault(); initAudio(); onUp(e); },{passive:false});
cv.addEventListener('pointercancel',e=>{ onCancel(e); });
cv.addEventListener('lostpointercapture',e=>{ if(e.pointerId===activeId) endDrag(true); });
window.addEventListener('blur',()=>{ if(activeId!==null) endDrag(true); });
for(const ev of ['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart','wheel']){
  document.addEventListener(ev,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
}

// ---------- update ----------
function update(dt){
  G.t+=dt;
  const ph=G.phase;
  // springs
  for(const c of G.cols){ const acc=-120*c.sq-9*c.sv; c.sv+=acc*dt; c.sq+=c.sv*dt; if(Math.abs(c.sq)<0.0005&&Math.abs(c.sv)<0.01){c.sq=0;c.sv=0;}
    if(c.gapT!==undefined) c.gap=lerp(c.gap,c.gapT,Math.min(1,dt*8)); }
  if(G.slides.length) refreshSlidePts();
  // camera
  if(ph==='opening'||ph==='sky'||ph==='feast'||ph==='serve'||ph==='finale') camYT=camTarget();
  camY=lerp(camY,camYT,Math.min(1,dt*(ph==='opening'?1.6:3)));
  if(ph==='opening'){ G.openT+=dt; G.cloudOpen=Math.min(1,G.openT/1.8); if(G.openT>2.4){ G.phase='sky'; hintCache=null; } }
  // spectators
  const mh=maxH(); G.specN=clamp(Math.round((mh-2)*1.6),0,14);
  G.specs.forEach((s,k)=>{ s.p=lerp(s.p,k<G.specN?1:0,Math.min(1,dt*3)); s.v=Math.max(0,s.v-dt*1.5); });
  for(const f of G.flowers) f.w=Math.max(0,f.w-dt*1.5);
  for(const t of G.trees) t.w=Math.max(0,t.w-dt*1.5);
  // seat spread offsets
  const groups={};
  for(const a of G.animals){ if(a.seat&&a.mode==='idle'){ const k=seatKey(a.seat); (groups[k]=groups[k]||[]).push(a); } else a.ox=lerp(a.ox,0,Math.min(1,dt*6)); }
  for(const k in groups){ const L=groups[k]; L.forEach((a,i)=>{ const t=(i-(L.length-1)/2)*0.34; a.ox=lerp(a.ox,t,Math.min(1,dt*6)); }); }
  // animals
  for(const a of G.animals){
    a.t+=dt; a.bounce=Math.max(0,a.bounce-dt*2.5); a.tap=Math.max(0,a.tap-dt*2); a.spark=Math.max(0,a.spark-dt);
    if(a.play) a.play=Math.max(0,a.play-dt); if(a.clap) a.clap=Math.max(0,a.clap-dt); if(a.preen) a.preen=Math.max(0,a.preen-dt);
    if(a.react){ a.react.t+=dt; if(a.react.type==='yay'&&a.react.t>1) a.react=null; }
    if(a.sing>0){ a.sing-=dt; if(Math.random()<dt*3) notes(a.x,a.y+0.9); }
    if(a.singAt>0){ a.singAt-=dt; if(a.singAt<=0){ a.sing=3; SFX.note(rnd(520,880),a.x,0.5); } }
    if(a.eatT>0){ a.eatT+=dt; if(a.eatT>0.9){ a.eatT=0; startReaction(a); } }
    if(a.mode==='hop') updHop(a,dt);
    else if(a.mode==='slide') updSlide(a,dt);
    else if(a.mode==='idle'&&a.seat&&a.kind!=='bird'){ const p=seatPos(a.seat); a.x=p[0]+a.ox; a.y=p[1]; }
    else if(a.kind==='bird'&&a.mode==='idle'&&a.seat){ const p=seatPos(a.seat); a.x=p[0]+a.ox; a.y=p[1]; }
    think(a,dt);
    // reaction continuous effects
    if(a.react&&a.react.type!=='yay'){
      const r=a.react.type;
      if(r==='dance'&&Math.random()<dt*2) burst(a.x,a.y+0.6,1,'berry',1);
      if(r==='wish'&&Math.random()<dt*3) part({x:a.x+rnd(-0.5,0.5),y:a.y+1.4,vx:0,vy:0.6,life:1,max:1,c:'#ffe27a',s:0.1,ty:'star',g:0});
      if(r==='cheeks'&&Math.random()<dt*1.5) part({x:a.x,y:a.y+1.2,vx:rnd(-0.3,0.3),vy:0.8,life:1.2,max:1.2,c:'#ff7fa8',s:0.14,ty:'heart',g:0});
      if(r==='nose'&&Math.random()<dt*0.6){ burst(a.x+a.face*0.2,a.y+0.5,4,'cream',0.8); SFX.squeak(a.x); }
      if(r==='tweet'&&Math.random()<dt*1.2){ notes(a.x,a.y+0.5,'#6cc6ff'); }
    }
    if(a.perf>0&&ph==='finale'){ a.perf-=dt; if(a.perf<=0){ a.react={type:a.react&&a.react.type!=='yay'?a.react.type:'hop',t:0}; a.bounce=1; SFX.note(noteF(5+(a.slot%5)),a.x,0.4); burst(a.x,a.y+0.8,8,'rainbow'); } }
  }
  // slices
  if(ph==='feast'){
    G.feastT+=dt;
    for(const s of G.slices){ const k=ease((G.feastT-0.3)/1.2); s.x=lerp(s.sx,s.hx,k); s.y=lerp(s.sy,s.hy,k)+Math.sin(k*Math.PI)*1.0; }
    if(G.feastT>0.4&&G.feastT<1.2&&Math.random()<dt*30) burst(rnd(-2.5,2.5),rnd(visRange()[0],YT),1,'rainbow',1);
    if(G.feastT>1.8){ G.phase='serve'; hintCache=null; for(const s of G.slices){ s.x=s.hx; s.y=s.hy; } }
  }
  for(const s of G.slices){
    if(s.ret){ s.x=lerp(s.x,s.hx,Math.min(1,dt*10)); s.y=lerp(s.y,s.hy,Math.min(1,dt*10)); if(Math.hypot(s.x-s.hx,s.y-s.hy)<0.01){ s.x=s.hx; s.y=s.hy; s.ret=0; } }
    if(s.eaten&&s.eatBy){ s.eatT+=dt; const a=s.eatBy; s.x=lerp(s.x,a.x,Math.min(1,dt*8)); s.y=lerp(s.y,a.y+0.4,Math.min(1,dt*8)); }
  }
  if(ph==='serve'&&G.finWait>0){ G.finWait-=dt; if(G.finWait<=0) startFinale(); }
  if(ph==='finale'){
    G.finT+=dt;
    if(G.songT>0&&G.finT>=G.songT){ G.songT=-1; G.songEnd=G.finT+playSong()+0.5; }
    G.fwT-=dt; if(G.finT>1&&G.fwT<=0){ G.fwT=0.55; const x=rnd(-3.5,3.5), y=YT+rnd(2,3.6); SFX.firework(x); for(let k=0;k<18;k++){ const a=k/18*TAU; part({x,y,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,life:1.1,max:1.1,c:SPARKC.rainbow[k%6],s:0.09,g:-1.2}); } }
    if(G.songEnd&&G.finT>G.songEnd&&!trans) startTransition();
    if(!G.songEnd&&G.finT>22&&!trans) startTransition();
  }
  // returning sticker
  if(G.returning){ G.returning.t+=dt*3.5; if(G.returning.t>=1){ const it=trayState[G.returning.type]; if(it) it.wob=1; G.returning=null; } }
  // particles
  for(let k=G.parts.length-1;k>=0;k--){ const p=G.parts[k]; p.life-=dt; if(p.life<=0){ G.parts.splice(k,1); continue; } p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-dt*1.2; p.rot+=dt*3; }
  // idle → demo once
  const canDemo=(ph==='build'||ph==='sky'||ph==='serve')&&!trans&&!drag;
  if(canDemo&&!demo) idleT+=dt;
  if(canDemo&&idleT>=4&&!demoDone&&!demo){ const h=hint(); const src=hintSrcScreen(h); if(h&&src){ demo={t:0,h,src,dst:[sx(h.dst.x),sy(h.dst.y)]}; demoDone=true; } }
  if(demo){ demo.t+=dt; if(demo.t>2.8) demo=null; }
  layoutTray(dt);
  // transition
  if(trans){ trans.t+=dt; if(trans.t>=1&&!trans.swapped){ trans.swapped=true; newRound(); layoutTray(0); } if(trans.t>=2.1) trans=null; }
}

// ---------- render ----------
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const ph=G.phase;
  // sky
  const k=clamp(camY/7,0,1);
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,mix('#9fd6ff','#7b8ff0',k)); gr.addColorStop(0.6,mix('#d8efff','#d9b8f4',k)); gr.addColorStop(1,mix('#fff0f5','#ffd9e6',k));
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  if(k>0.05){ ctx.save(); ctx.globalAlpha=k*0.8; ctx.fillStyle='#fffbe0'; for(let s=0;s<26;s++){ const x=(s*137.5%1)*W, y=((s*61.8)%1)*(H*0.55)+PLAYTOP; const tw=0.5+0.5*Math.sin(G.t*2+s); const r=1+tw*1.6; ctx.beginPath(); ctx.moveTo(x-r*2,y); ctx.lineTo(x+r*2,y); ctx.moveTo(x,y-r*2); ctx.lineTo(x,y+r*2); ctx.strokeStyle='rgba(255,250,210,'+(0.5+tw*0.5)+')'; ctx.lineWidth=1.2; ctx.stroke(); } ctx.restore(); }
  // sun
  drawSun();
  // background clouds (parallax)
  ctx.save(); ctx.globalAlpha=0.35;
  for(let c=0;c<3;c++){ const x=((c*0.37+G.t*0.006)%1.2-0.1)*W, y=PLAYTOP+(0.04+c*0.035)*H+camY*S*0.15; blitC(SP.cloud,x,y,S*(0.28+c*0.05)); }
  ctx.restore();
  // hills / ground (world)
  drawGround();
  // garland (memory)
  if(G.fav) drawGarland();
  // spectators
  drawSpecs();
  // cloud / table back
  drawCloudTable(false);
  // terraces
  drawTerraces();
  // cake
  drawCake();
  // slides
  drawSlides();
  // lights
  drawLights();
  // table front puffs
  drawCloudTable(true);
  // ghost target
  if(drag&&drag.kind==='sticker'&&drag.tg) drawGhost(drag.type,drag.tg);
  // animals
  const order=[...G.animals].sort((a,b)=>(a.kind==='bird')-(b.kind==='bird'));
  for(const a of order) drawAnimal(a);
  // slices
  drawSlices();
  // particles
  drawParts();
  // tray
  drawTray();
  // dragged things
  if(drag&&drag.kind==='sticker') drawDragSticker(drag);
  if(drag&&drag.kind==='knife') drawDragKnife(drag);
  if(G.returning){ const r=G.returning; const it=trayState[r.type]; const t=ease(r.t); const x=lerp(r.x,it.x,t), y=lerp(r.y,it.y,t); blitC(trayIcon(r.type),x,y,it.r*2*lerp(1.1,1,t)); }
  if(demo) drawDemo();
  if(trans) drawTrans();
}
function mix(a,b,t){ const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]; const A=p(a),B=p(b); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function drawSun(){
  const x=W-SAFE.r-Math.min(70,W*0.14), y=PLAYTOP+Math.min(70,H*0.09)+camY*S*0.1;
  if(y>H+60) return;
  ctx.save(); ctx.translate(x,y); ctx.rotate(G.t*0.1);
  const r=Math.min(34,W*0.07);
  ctx.fillStyle='rgba(255,214,110,0.35)'; for(let k=0;k<10;k++){ ctx.rotate(TAU/10); ctx.beginPath(); ctx.moveTo(r*0.9,-r*0.18); ctx.lineTo(r*1.6,0); ctx.lineTo(r*0.9,r*0.18); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fillStyle='rgba(255,220,120,0.9)'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.stroke();
  ctx.restore();
}
function drawGround(){
  const gy=sy(0); if(gy>H+S*3) return;
  const hv=halfView()+1;
  // far hills
  for(let k=-2;k<=1;k++){ blitB(SP.hill,sx(k*7.5+3.75),gy+S*0.15,1,1); }
  // trees
  for(const t of G.trees){ const w=Math.sin(G.t*14)*t.w*0.06; ctx.save(); ctx.translate(sx(t.x),gy); ctx.rotate(w); blitB(SP.tree,0,0,1,1); ctx.restore(); }
  // ground band
  ctx.save(); ctx.beginPath(); ctx.rect(0,gy,W,H-gy); ctx.fillStyle='rgba(140,210,130,1)'; ctx.fill();
  ctx.fillStyle='rgba(120,195,115,1)'; for(let x=-hv;x<hv;x+=0.9){ ctx.beginPath(); ctx.moveTo(sx(x),gy+S*0.05); ctx.lineTo(sx(x+0.45),gy+S*0.5); ctx.lineTo(sx(x+0.9),gy+S*0.05); ctx.fill(); }
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=Math.max(2,S*0.06); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
  ctx.strokeStyle=LEAD; ctx.lineWidth=Math.max(1,S*0.03); ctx.stroke();
  ctx.restore();
  // flowers
  for(const f of G.flowers){ const w=Math.sin(G.t*16)*f.w*0.35; ctx.save(); ctx.translate(sx(f.x),gy); ctx.rotate(w); const s=S*0.32;
    ctx.strokeStyle='#5aa85a'; ctx.lineWidth=Math.max(1.5,S*0.04); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-s*1.1); ctx.stroke();
    const col=['#ff8fb1','#ffd36b','#c3a8ff','#8fd6ff'][f.k%4];
    for(let p=0;p<5;p++){ const a=p/5*TAU+G.t*0.3; ctx.beginPath(); ctx.ellipse(Math.cos(a)*s*0.32,-s*1.15+Math.sin(a)*s*0.32,s*0.26,s*0.2,a,0,TAU); ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,-s*1.15,s*0.18,0,TAU); ctx.fillStyle='#fff3b0'; ctx.fill(); ctx.restore(); }
}
function drawGarland(){
  const gy=sy(0); if(gy<-S*6) return;
  const hv=Math.min(halfView()-0.25,6.2);
  const x0=-hv,x1=hv,y0=5.0,sag=0.7;
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=Math.max(2,S*0.05); ctx.beginPath();
  for(let k=0;k<=30;k++){ const u=k/30; const x=lerp(x0,x1,u), y=y0-Math.sin(u*Math.PI)*sag; k?ctx.lineTo(sx(x),sy(y)):ctx.moveTo(sx(x),sy(y)); } ctx.stroke();
  ctx.strokeStyle=LEAD; ctx.lineWidth=1; ctx.stroke(); ctx.restore();
  const n=Math.round((x1-x0)/0.75); const ic=G.fav==='berry'?SP.iBerry:G.fav==='cream'?SP.iCream:SP.iCandle;
  for(let k=1;k<n;k++){ const u=k/n; const x=lerp(x0,x1,u), y=y0-Math.sin(u*Math.PI)*sag; const sw=Math.sin(G.t*1.5+k)*0.12;
    if(G.fav==='candle'){ ctx.save(); ctx.globalCompositeOperation='lighter'; blitC(SP.glow,sx(x),sy(y-0.25),S*0.5,0,0.6+0.3*Math.sin(G.t*3+k)); ctx.restore(); }
    blitC(ic,sx(x),sy(y-0.28),S*0.5,sw); }
}
function drawSpecs(){
  const gy=sy(0); if(gy>H+S) return;
  const cols=['#d9a477','#f2f2f2','#f6b26b','#b0b6c8'];
  for(const s of G.specs){ if(s.p<0.02) continue; const b=Math.abs(Math.sin(G.t*8+s.x))*s.v*0.25;
    const x=sx(s.x), y=gy-S*(0.05+b)*s.p; const r=S*0.2*s.p;
    ctx.save(); ctx.globalAlpha=0.9;
    ctx.fillStyle=cols[s.kind]; ctx.strokeStyle=LEAD; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(x,y-r,r,0,TAU); ctx.fill(); ctx.stroke();

  E(0.02,-0.58,0.24,0.2,'#d4d7e2'); guestFace(a,look,-0.6,'#ff8fb1'); guestAcc(a,-0.42);
}

// ---------- loop ----------
let last=0, raf=0, running=true, frames=0;
function frame(ts){
  raf=0; if(!running) return;
  const dt=last?Math.min(0.05,Math.max(0,(ts-last)/1000)):1/60; last=ts;
  try{ update(dt); render(); }catch(err){ if(!frame.err){ frame.err=String(err&&err.stack||err); console.warn(err); } }
  frames++;
  raf=requestAnimationFrame(frame);
}
function start(){ if(!raf&&running) raf=requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; if(activeId!==null) endDrag(true); try{ if(AC&&AC.state==='running') AC.suspend().catch(()=>{}); }catch(e){} }
  else { running=true; last=0; try{ if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); }catch(e){} start(); }
});
let rsT=0;
function onResize(){ clearTimeout(rsT); rsT=setTimeout(()=>{ layout(); layoutTray(0); },60); }
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

// boot
MEM=loadMem();
newRound();
layout();
layoutTray(0);
start();

// read-only hooks for automated checks
window.__kuma={
  get G(){return G;}, get frames(){return frames;}, get mem(){return {memStatus,saveStatus,MEM};},
  get running(){return running;}, get drag(){return drag;},
  toScreen:(x,y)=>[sx(x),sy(y)], tray:()=>trayItems.map(t=>({type:t.type,x:t.x,y:t.y,r:t.r})),
  colTop:i=>[sx(colX(i)+shiftX(i)),sy(topY(i)+0.45)], hint:()=>hint(), get S(){return S;}, lift:()=>liftPx(),
  audio:()=>AC?AC.state:'none', demo:()=>demo, err:()=>frame.err||null,
};
})();
