function auInit(){

      AU.c=new AC();
      const comp=AU.c.createDynamicsCompressor();
      AU.m=AU.c.createGain(); AU.m.gain.value=.75;
      AU.m.connect(comp); comp.connect(AU.c.destination);
      const len=AU.c.sampleRate|0, b=AU.c.createBuffer(1,len,AU.c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.nb=b;
    }
    if(AU.c.state==='suspended'&&!document.hidden)AU.c.resume().catch(()=>{});
  }catch(e){}
}
function auOk(){return !!(AU.c&&AU.m&&!FF&&!document.hidden&&AU.c.state!=='closed')}
function tone(f0,f1,dur,o){
  if(!auOk())return; o=o||{};
  try{
    const c=AU.c,t=c.currentTime+.005+(o.at||0),vol=(o.vol||.2)*VK;
    const os=c.createOscillator(); os.type=o.type||'sine';
    os.frequency.setValueAtTime(f0,t);
    if(f1!==f0)os.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    const g=c.createGain(); const att=o.att||.006;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=os;
    if(o.fq){const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.value=o.fq;f.Q.value=o.q||1;os.connect(f);n=f}
    n.connect(g); g.connect(AU.m);
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05)}
    os.start(t); os.stop(t+dur+.05);
  }catch(e){}
}
function nz(dur,o){
  if(!auOk()||!AU.nb)return; o=o||{};
  try{
    const c=AU.c,t=c.currentTime+.005+(o.at||0),vol=(o.vol||.2)*VK;
    const s=c.createBufferSource(); s.buffer=AU.nb;
    const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.Q.value=o.q||1;
    f.frequency.setValueAtTime(o.fq||1000,t);
    if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
    const g=c.createGain(); const att=o.att||.003;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(AU.m);
    s.start(t,Math.random()*.6,dur+.05);
  }catch(e){}
}

/* ---------------- State & save ---------------- */
const SKEY='konkon-usagi-261030-7';
function defState(){return{v:1,walk:1,arr:0,basket:{water:0,seed:0,feather:0,letter:0},
  got:{water:false,seed:false,feather:false},met:{frog:false,mole:false,owl:false,cat:false,hedge:false},
  moist:false,grown:false,invited:[],letters:0,pairs:[],last:null,party:0,mem:[]}}
function validState(o){
  try{
    if(!o||typeof o!=='object'||o.v!==1)return false;
    if(!Number.isInteger(o.walk)||o.walk<1||o.walk>100000)return false;
    if(!Number.isInteger(o.arr)||o.arr<0||o.arr>=ARR.length)return false;
    if(!o.basket||typeof o.basket!=='object')return false;
    for(const k of['water','seed','feather','letter'])if(o.basket[k]!==0&&o.basket[k]!==1)return false;
    if(!o.got||typeof o.got!=='object')return false;
    for(const k of['water','seed','feather'])if(typeof o.got[k]!=='boolean')return false;
    if(!o.met||typeof o.met!=='object')return false;
    for(const k of RESS)if(typeof o.met[k]!=='boolean')return false;
    if(typeof o.moist!=='boolean'||typeof o.grown!=='boolean')return false;
    if(!Array.isArray(o.invited)||o.invited.length>4)return false;
    const seen={};for(const r of o.invited){if(RESS.indexOf(r)<0||seen[r])return false;seen[r]=1}
    if(!Number.isInteger(o.letters)||o.letters<0||o.letters>99)return false;
    if(!Array.isArray(o.pairs)||o.pairs.length>20)return false;
    for(const p of o.pairs){if(typeof p!=='string')return false;const a=p.split('+');if(a.length!==2||RESS.indexOf(a[0])<0||RESS.indexOf(a[1])<0)return false}
    if(o.last!==null&&RESS.indexOf(o.last)<0)return false;
    if(o.party!==0&&o.party!==1)return false;
    if(!Array.isArray(o.mem)||o.mem.length>3)return false;
    for(const m of o.mem){if(!Array.isArray(m)||m.length>5)return false;for(const r of m)if(RESS.indexOf(r)<0)return false}
    // consistency
    if(o.basket.water&&!o.got.water)return false;
    if(o.basket.seed&&!o.got.seed)return false;
    if(o.basket.feather&&!o.got.feather)return false;
    if(o.grown&&!(o.got.seed&&o.got.water))return false;
    if(o.grown&&(o.basket.seed||o.basket.water))return false;
    if(o.met.cat&&!(o.grown&&o.got.feather))return false;
    if(o.met.cat&&o.basket.feather)return false;
    if(o.invited.indexOf('cat')>=0&&!o.met.cat)return false;
    if(o.party&&!(o.met.cat&&o.invited.length>=2))return false;
    return true;
  }catch(e){return false}
}
let S=defState();
let saveOK=true, loadInfo='new';
function load(){
  let raw=null;
  try{raw=window.localStorage.getItem(SKEY)}catch(e){saveOK=false;loadInfo='denied';return}
  if(raw===null){loadInfo='new';return}
  try{const o=JSON.parse(raw);if(validState(o)){S=o;loadInfo='restored'}else{S=defState();loadInfo='reset'}}
  catch(e){S=defState();loadInfo='reset'}
}
function save(){
  try{window.localStorage.setItem(SKEY,JSON.stringify(S));saveOK=true}catch(e){saveOK=false}
}

/* ---------------- Layout ---------------- */
let W=1,H=1,DPR=1,LAY=PORT,SC=1,OX=0,OY=0,VX0=0,VY0=0,VX1=400,VY1=760;
const safe={t:0,r:0,b:0,l:0};
let SP=PORT.sp,WN=PORT.win;
const PCL=new Map();
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('sa'));
    safe.t=parseFloat(cs.paddingTop)||0;safe.r=parseFloat(cs.paddingRight)||0;safe.b=parseFloat(cs.paddingBottom)||0;safe.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
function layout(){
  W=Math.max(1,window.innerWidth|0);H=Math.max(1,window.innerHeight|0);
  readSafe();
  const dpr=window.devicePixelRatio||1;
  DPR=Math.min(2,dpr,Math.sqrt(2.3e6/(W*H)));DPR=Math.max(1,DPR);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const aw=Math.max(1,W-safe.l-safe.r),ah=Math.max(1,H-safe.t-safe.b);
  const prev=LAY;
  LAY=(aw/ah>1.0)?LAND:PORT;
  SP=LAY.sp;WN=LAY.win;
  SC=Math.min(aw/LAY.w,ah/LAY.h);
  OX=safe.l+(aw-LAY.w*SC)/2;OY=safe.t+(ah-LAY.h*SC)/2;
  VX0=-OX/SC;VY0=-OY/SC;VX1=(W-OX)/SC;VY1=(H-OY)/SC;
  PCL.clear();
  if(prev!==LAY)fastForward();
  buildTargets();

  const cir=(id,kind,cx,cy,r,act,pri)=>TG.push({id,kind,sh:'c',cx,cy,r:Math.max(r,29),act,pri:pri||0});

  const r=L.rabbit;box('rabbit','rabbit',r.x-38,r.y-150*r.s,r.x+38,r.y,()=>!V.trans&&(!S.party||V.partyReady));
  for(const d of L.decor)cir(d.id,'decor',d.x,d.y,d.r,front,.3);

function hitTest(x,y){
  if(S.party)return partyHit(x,y);

  for(const t of TG){if(!t.act())continue;let s;
    if(t.sh==='c'){const d=Math.hypot(x-t.cx,y-t.cy);if(d>t.r)continue;s=d/t.r}
    else{if(x<t.x0||x>t.x1||y<t.y0||y>t.y1)continue;s=Math.max(Math.abs(x-t.cx)/((t.x1-t.x0)/2),Math.abs(y-t.cy)/((t.y1-t.y0)/2))}
    s+=t.pri;if(s<bs){bs=s;best=t}}
  return best;

function partyHit(x,y){

  const P=LAY.party;let best=null,bs=1e9;
  const test=(id,kind,cx,cy,r,extra)=>{const d=Math.hypot(x-cx,y-cy);if(d<=r&&d/r<bs){bs=d/r;best={id,kind,extra}}};
  if(V.partyReady){const f=P.front;test('rabbit','rabbit',f[0],f[1]-70*LAY.rabbit.s,58)}
  test('teapot','teapot',P.pot[0],P.pot[1]-4,32);
  V.guests.forEach(g=>{const p=guestPos(g.res);test('g_'+g.res,'guest',p[0],p[1]-24*LAY.ch,34,g.res)});
  return best;
}

function guideId(){
  if(V.trans)return null;
  if(S.party)return V.partyReady?'rabbit':null;
  const A=ARR[S.arr];
  if(!S.got.water&&!S.got.seed)return A.frog;
  if(!S.grown){if(!S.got.seed)return A.mole;if(!S.got.water)return A.frog;return null}
  if(V.revealT<1)return null;
  if(!S.got.feather)return A.owl;
  if(!S.met.cat)return 'secret';
  if(S.invited.length<2){
    if(!S.basket.letter&&!V.incoming.letter)return 'post';
    for(const w of WIN_ORDER){const r=winRes(w);if(r&&S.invited.indexOf(r)<0)return w}
  }
  return 'home';
}
function partyReadyCond(){return S.met.cat&&S.invited.length>=2}

  const s=SP[id];if(WN[id])return SND.glass(p);
  if(!s)return SND.soft(p);
  const m=s.mat;if(m==='wood')SND.wood(p);else if(m==='bark')SND.bark(p);else if(m==='clay')SND.clay(p);
  else if(m==='metal')SND.metal(p);else if(m==='leaf')SND.leaf(p);else SND.soft(p);

function onTap(t,x,y){
  const id=t.id;const lk=V.lk;
  if(lk.id===id&&now-lk.t<1600)lk.n=Math.min(lk.n+1,5);else lk.n=0;
  lk.id=id;lk.t=now;const st=lk.n,p=Math.pow(2,st*1.6/12);

    const map={trunk:['tree'],frogH:['redDoor','redWin'],homeH:['home'],catH:['catDoor','catWin'],hhH:['hhDoor','hhWin']};
    for(const k of(map[id]||[id]))kick(k,.6+st*.15,.08);SND.soft(p);return}
  kick(id,1+st*.3,kind==='win'?.03:.02);
  switch(kind){

  const s=SP.secret;V.away.cat=now+4200;V.catArrive=now+4200;V.busyUntil=now+4400;
  flight('feather',basketPos(),[s.x,s.y],650,{h:90,cb:()=>{
    V.tickle=now;SND.sneezeHa(0,1);SND.sneezeHa(.45,1.15);
    later(1050,()=>{
      V.tickle=-1e9;SND.sneeze();puff(s.x,s.y,10);confetti(s.x,s.y-10,20,1.1);V.rabHop=now;
      appear('cat','secret',{dur:1300,emo:1.5,sneeze:true});
      later(450,()=>SND.success());
      later(1300,()=>{const d=SP.catDoor;runner('cat',[s.x,s.y+10],[d.x,d.y],700,{h:40,s:LAY.ch*.8,cb:()=>{
        appear('cat','catDoor',{dur:1500,emo:2});voice('cat',1);V.catArrive=now+1500;V.away.cat=0}})});
    });
  }});
}
function partyTap(t,st,p){
  if(t.kind==='guest'){V.gb[t.extra]=now;voice(t.extra,p);return}
  if(t.kind==='teapot'){kick('teapot',1);if(now-V.cups>1200){V.cups=now;SND.pour()}return}
  if(t.kind==='rabbit'&&V.partyReady){newWalk();return}
}
function newWalk(){
  if(V.trans)return;
  V.trans={t0:now,swapped:false};SND.whoosh();V.rabHop=now;
}
function doSwap(){
  const mem=S.mem,walk=S.walk+1;let arr=S.arr;
  const choices=[];for(let i=1;i<ARR.length;i++)if(i!==S.arr)choices.push(i);
  arr=choices[Math.floor(R()*choices.length)];
  S=defState();S.walk=walk;S.arr=arr;S.mem=mem;
  resetVisual();save();
}
function resetVisual(){
  V.apps=[];V.flights=[];V.runners=[];V.birds=[];V.tasks=[];V.parts=[];V.away={};
  for(const k in V.incoming){V.incoming[k]=0;V.ghost[k]=0}
  V.growStart=S.grown?-1e9:-1;V.growT=S.grown?1:0;V.revealT=S.grown?1:0;
  V.seatShown=S.invited.length;V.partyReady=!!S.party;V.partyT0=S.party?now-60000:-1e9;V.guests=S.party?partyGuests():[];
  V.handShown={};V.hand=null;V.greet=null;V.catArrive=-1e9;V.busyUntil=now;V.lastInput=now;V.gph=now;
}
function fastForward(){
  FF=true;
  for(let guard=0;guard<60&&(V.tasks.length||V.flights.length||V.runners.length||V.birds.length);guard++){
    const ts=V.tasks.splice(0);ts.sort((a,b)=>a.t-b.t);for(const t of ts)t.fn();
    const fs=V.flights.splice(0);for(const f of fs){if(f.inc)V.incoming[f.inc]=Math.max(0,V.incoming[f.inc]-1);if(f.cb)f.cb()}
    const rs=V.runners.splice(0);for(const r of rs)if(r.cb)r.cb();
    const bs=V.birds.splice(0);for(const b of bs)if(b.cb)b.cb();
  }
  V.apps=[];V.away={};V.catArrive=-1e9;for(const k in V.ghost)V.ghost[k]=0;
  if(S.grown){V.growStart=-1e9;V.growT=1;V.revealT=1}
  if(S.party){V.partyT0=now-60000;V.partyReady=true;V.guests=partyGuests()}
  V.seatShown=S.invited.length;V.busyUntil=0;
  FF=false;
}

/* ---------------- Update & render ---------------- */
function update(dt){
  now+=dt*1000;
  // tasks
  if(V.tasks.length){const due=[];for(let i=V.tasks.length-1;i>=0;i--)if(V.tasks[i].t<=now)due.push(V.tasks.splice(i,1)[0]);due.sort((a,b)=>a.t-b.t);for(const t of due)t.fn()}
  updFlights();updRunners();updBirds();updParts(dt);
  for(let i=V.apps.length-1;i>=0;i--)if(now-V.apps[i].t0>V.apps[i].dur)V.apps.splice(i,1);
  if(S.grown){
    if(V.growStart>=0||V.growStart<-1e8){const lt=now-V.growStart;V.growT=clamp(lt/2600,0,1);V.revealT=clamp((lt-2450)/1500,0,1)}
    else{V.growT=0;V.revealT=0}
  }else{V.growT=0;V.revealT=0}
  V.ear=Math.max(0,V.ear-dt*.9);V.bask=Math.max(0,V.bask-dt*2.4);
  // guide
  const g=guideId();if(g!==V.gid){V.gid=g;V.gph=now-1200}
  // hint hand (once per idle period, once per guide step)
  if(V.hand&&now-V.hand.t0>1800)V.hand=null;
  if(g&&!V.hand&&!V.trans){const idle=now-Math.max(V.lastInput,V.busyUntil);const key=S.walk+':'+g+':'+S.invited.length+':'+S.basket.letter+':'+S.party+':'+V.lastInput;
    const stepKey=S.walk+':'+g+':'+S.invited.length+':'+S.basket.letter+':'+S.party;
    if(idle>4000&&!V.handShown[stepKey]&&V.flights.length===0){V.handShown[stepKey]=key;V.hand={id:g,t0:now}}}
  // ambient clue peeks for unmet residents
  if(now>V.nextPeek&&!S.party&&!V.trans){V.nextPeek=now+5200+R()*2600;
    const c=[];const A=ARR[S.arr];
    if(!S.got.water)c.push(['frog',A.frog]);if(!S.got.seed)c.push(['mole',A.mole]);if(!S.got.feather)c.push(['owl',A.owl]);
    const pick=c.filter(x=>!isBusy(x[1]));if(pick.length){const k=pick[Math.floor(R()*pick.length)];V.peek[k[1]]=now;if(R()<.6)quietVoice(k[0])}}
  if(!S.met.cat&&V.revealT>=1&&now>V.nextNose&&!S.party){V.nextNose=now+3200+R()*1500;V.nose=now}
  // transition
  if(V.trans){const lt=now-V.trans.t0;if(lt>520&&!V.trans.swapped){V.trans.swapped=true;doSwap()}if(lt>1100){V.trans=null;V.rabHop=now;SND.rabbit(1)}}
}
function render(){
  X=g0;X.setTransform(1,0,0,1,0,0);X.drawImage(bg,0,0);
  X.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  for(const d of LAYD())if(d.k==='sun'||d.k==='cloud')drawDecor(d);
  if(V.revealT>0)drawBackStreet();
  drawHedge();
  drawTree();
  drawHole('treeHole');drawWindow('treeWin');
  drawDoor('redDoor');drawWindow('redWin');
  drawDoor('home');drawHomeExtras();
  drawSeats();
  drawPot(false);drawTower();drawPot(true);
  drawStump(false);drawStump(true);
  drawPost();
  for(const d of LAYD())if(d.k!=='sun'&&d.k!=='cloud')drawDecor(d);
  drawApps();
  drawRunners();drawBirds();
  if(!S.party)drawRabbit(LAY.rabbit.x,LAY.rabbit.y,LAY.rabbit.s,true);
  else drawParty();
  drawFlights();drawParts();
  if(V.hand)drawHand();
  if(V.trans)drawTrans();
}
function LAYD(){return LAY.decor}
function drawHand(){
  const h=V.hand;const lt=now-h.t0;const c=h.id==='rabbit'&&S.party?[LAY.party.front[0],LAY.party.front[1]-80]:spotCenter(h.id);
  const a=Math.min(lt/250,1,(1800-lt)/250);if(a<=0)return;
  const press=lt>700&&lt<1000?Math.sin((lt-700)/300*Math.PI):0;
  const ox=lerp(60,0,eo(lt/650)),oy=lerp(70,0,eo(lt/650));
  X.globalAlpha=a;
  at(c[0]+ox+10,c[1]+oy+14+press*-2,-.35,1-press*.12);
  pf(rough('hand1',[[-5,-30],[5,-30],[6,0],[-6,0]],.3,5),'#fbd9c0',1);
  pf(blob(16,14,.06,190),'#fbd9c0',1);at(-9,-4);pf(blob(6,9,.06,191),'#fbd9c0',.6);done();
  ell(0,-28,4,4,'#fde8d8');
  done();
  if(press>.5){X.strokeStyle='rgba(255,255,255,.9)';X.lineWidth=2.5;X.beginPath();X.arc(c[0],c[1],18+press*10,0,TAU);X.stroke()}
  X.globalAlpha=1;
}
function drawTrans(){
  const lt=now-V.trans.t0;const t=lt/1100;
  const w=VX1-VX0+80;let x;
  if(t<.47)x=lerp(VX0-w-40,VX0-20,eio(t/.47));else x=lerp(VX0-20,VX1+40,eio((t-.47)/.53));
  at(x,0);pf(rough('trans'+LAY.name+Math.round(VX0),[[0,VY0-20],[w,VY0-20],[w+30,VY0+(VY1-VY0)*.3],[w,VY0+(VY1-VY0)*.6],[w+24,VY1+20],[0,VY1+20]],3,20,PCL),'#fbefd6',0);
  for(let i=0;i<8;i++)dot(w*.5+Math.sin(i*1.7)*w*.3,VY0+(VY1-VY0)*(i+.5)/8,5,['#f2c14e','#9cc5e0','#f4a6c0'][i%3]);
  done();
}

/* ---------------- Loop, input, lifecycle ---------------- */
let raf=0,lastT=0,running=false;frame.ms=0;
function frame(t){
  raf=0;if(!running)return;
  let dt=lastT?(t-lastT)/1000:0;lastT=t;dt=clamp(dt,0,.05);
  const fs=performance.now();
  try{update(dt);render()}catch(e){if(!frame.err){frame.err=1;setTimeout(()=>{throw e},0)}}
  frame.ms=frame.ms*.9+(performance.now()-fs)*.1;
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;lastT=0;raf=requestAnimationFrame(frame)}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0}
const ptrs=new Set();
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();auInit();
  ptrs.add(e.pointerId);if(ptrs.size>2)return;
  const d=toDesign(e.clientX,e.clientY);V.lastInput=now;V.hand=null;
  const t=hitTest(d[0],d[1]);if(t)onTap(t,d[0],d[1]);
},{passive:false});
for(const n of['pointerup','pointercancel','pointerleave','lostpointercapture'])cv.addEventListener(n,e=>{ptrs.delete(e.pointerId)});
const prevent=e=>{e.preventDefault()};
for(const n of['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'])document.addEventListener(n,prevent,{passive:false});
document.addEventListener('wheel',prevent,{passive:false});
let rzT=0;
function onResize(){if(rzT)return;rzT=requestAnimationFrame(()=>{rzT=0;layout()})}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',()=>setTimeout(layout,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();try{if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{})}catch(e){}}
  else{try{if(AU.c&&AU.c.state==='suspended')AU.c.resume().catch(()=>{})}catch(e){}V.lastInput=now;start()}
});
window.addEventListener('pagehide',()=>{save()});

/* ---------------- Boot ---------------- */
load();
layout();
resetVisual();
V.lastInput=0;
if(!document.hidden)start();
// test hooks (read-only helpers for automated checks)
window.__konkon={
  get S(){return S},get V(){return V},get now(){return now},
  pos(id){let c;if(id==='rabbit'){c=S.party?[LAY.party.front[0],LAY.party.front[1]-70*LAY.rabbit.s]:[LAY.rabbit.x,LAY.rabbit.y-70*LAY.rabbit.s]}
    else if(id==='teapot')c=LAY.party.pot;else if(id.indexOf('g_')===0)c=(p=>[p[0],p[1]-24*LAY.ch])(guestPos(id.slice(2)));
    else if(id==='tower')c=[LAY.tower.x,(LAY.tower.top+LAY.tower.base)/2-40];else{const d=LAY.decor.find(x=>x.id===id);c=d?[d.x,d.y]:spotCenter(id)}
    return toScreen(c[0],c[1])},
  guide:()=>guideId(),homeOf,resAt,layout:()=>LAY.name,saveOK:()=>saveOK,loadInfo:()=>loadInfo,
  running:()=>running,frameMs:()=>frame.ms,particles:()=>V.parts.length,maxParticles:MAXP
};
})();
</script>
