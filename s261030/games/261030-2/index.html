(()=>{
'use strict';
// ================================================================ utils
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const rnd=(a,b)=>a+Math.random()*(b-a);
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
const mixCache=new Map();
function mixc(c1,c2,t){
  t=Math.round(clamp(t,0,1)*20)/20;const key=c1+c2+t;let r=mixCache.get(key);if(r)return r;
  const a=hex2rgb(c1),b=hex2rgb(c2);
  r='#'+[0,1,2].map(i=>Math.round(lerp(a[i],b[i],t)).toString(16).padStart(2,'0')).join('');
  mixCache.set(key,r);return r;}
function shade(c,f){return f>=1?mixc(c,'#ffffff',f-1):mixc(c,'#6a4a68',1-f);}
function rgba(c,a){const v=hex2rgb(c);return 'rgba('+v[0]+','+v[1]+','+v[2]+','+a+')';}

const COL={stone:'#d3d4da',stoneD:'#bfc0c8',wall:'#e6e4ea',roof:'#b4aec0',blob:'#cdd0d6',trunk:'#c4bab4',
  grass:'#d4efd5',grass2:'#c3e6c8',side:'#f4d3c4',side2:'#e5b9aa',berry:'#ff4a6e',leaf:'#8fd88e',cream:'#fffaf1',
  choco:'#8b5a3c',chocoD:'#673d26',chocoL:'#b07a55',pink:'#ffa3bd',pinkD:'#ff6f96',mallow:'#fff1f6',mallow2:'#ffd9e6',
  wafer:'#f5cd8d',biscuit:'#f2dcc0',plateRim:'#bfe3f2',water:'#bfe6f4',sky1:'#c8e8f7',sky2:'#fde6ef',gold:'#ffe28a'};
const FL={
  s:{cloud:'#ffb6cb',paint:'#ff9cb8',deep:'#ff5d88',wall:'#ffc6d5',roof:'#ff8fb0'},
  m:{cloud:'#fffaf3',paint:'#fffaf0',deep:'#eadcc4',wall:'#fff5e4',roof:'#fffaf0'},
  c:{cloud:'#dcb18e',paint:'#93603f',deep:'#6a3f27',wall:'#a8714d',roof:'#7c4c30'}};

// ================================================================ canvas / sprites
const cv=document.getElementById('c');const ctx=cv.getContext('2d');
const bgc=document.createElement('canvas');const bgx=bgc.getContext('2d');
const saEl=document.getElementById('sa');
let W=1,H=1,DPR=1,bgKey='';
const SA={t:0,r:0,b:0,l:0};
const sprCache=new Map();
function sphereSpr(col){
  let c=sprCache.get(col);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(24,21,2,32,32,32);
  gr.addColorStop(0,mixc(col,'#ffffff',0.6));gr.addColorStop(0.38,col);
  gr.addColorStop(0.86,shade(col,0.84));gr.addColorStop(1,shade(col,0.72));
  g.fillStyle=gr;g.beginPath();g.arc(32,32,31.5,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,0.7)';g.beginPath();g.ellipse(23,18,7.5,4.2,-0.6,0,TAU);g.fill();
  sprCache.set(col,c);return c;}
function ball(x,y,r,col){if(r<0.4)return;ctx.drawImage(sphereSpr(col),x-r,y-r,r*2,r*2);}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ================================================================ audio (Web Audio synth)
const AU={c:null,m:null,nb:null,last:0,cnt:0};
function audioInit(){
  try{
    if(!AU.c){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      AU.c=new AC();const comp=AU.c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;
      AU.m=AU.c.createGain();AU.m.gain.value=0.6;AU.m.connect(comp);comp.connect(AU.c.destination);
      const b=AU.c.createBuffer(1,1,22050);const s=AU.c.createBufferSource();s.buffer=b;s.connect(AU.c.destination);s.start(0);
      const len=(AU.c.sampleRate*0.6)|0;AU.nb=AU.c.createBuffer(1,len,AU.c.sampleRate);const d=AU.nb.getChannelData(0);
      let seed=7;for(let i=0;i<len;i++){seed=(seed*16807)%2147483647;d[i]=seed/1073741823.5-1;}}
    if(AU.c.state==='suspended')AU.c.resume().catch(()=>{});
  }catch(e){AU.c=null;}
}
function budget(){if(!AU.c)return false;const t=performance.now();if(t-AU.last>60){AU.last=t;AU.cnt=0;}return ++AU.cnt<14;}
function osc(f,dur,o){
  const c=AU.c;if(!c)return;o=o||{};const t=c.currentTime+(o.at||0);const g=c.createGain();const v=o.vol||0.15;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const s=c.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(f,t);
  if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+dur*0.9);
  s.connect(g);g.connect(AU.m);s.start(t);s.stop(t+dur+0.03);}
function noise(dur,o){
  const c=AU.c;if(!c||!AU.nb)return;o=o||{};const t=c.currentTime+(o.at||0);
  const s=c.createBufferSource();s.buffer=AU.nb;const f=c.createBiquadFilter();f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1200,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||0.1,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.m);s.start(t);s.stop(t+dur+0.03);}
const PENT=[0,2,4,7,9,12,14,16,19,21,24];
const SFX={
  squish(){if(!budget())return;noise(0.18,{f:900,f2:200,vol:0.14});osc(320,0.2,{to:150,vol:0.12});},
  wake(){if(!budget())return;osc(420,0.35,{to:950,type:'triangle',vol:0.14});osc(1320,0.25,{at:0.18,vol:0.06});osc(1760,0.3,{at:0.26,vol:0.05});},
  paint(fl,combo){if(!budget())return;const base={s:523.25,m:659.25,c:392}[fl];const f=base*Math.pow(2,PENT[combo%PENT.length]/12);
    osc(f,0.17,{type:'triangle',vol:0.1});osc(f*2,0.08,{vol:0.035});},
  pop(n){if(!budget())return;const f=620*Math.pow(2,PENT[n%PENT.length]/12);osc(f,0.12,{to:f*1.9,vol:0.14});noise(0.05,{ft:'highpass',f:2500,vol:0.05});},
  mush(n){if(!budget())return;noise(0.22,{f:700,f2:260,vol:0.12});osc(260+n*30,0.24,{to:420+n*30,type:'sine',vol:0.1});},
  gulp(){if(!budget())return;for(let i=0;i<3;i++)osc(520-i*90,0.1,{at:i*0.09,to:820-i*90,vol:0.11});},
  tick(){if(!budget())return;osc(900,0.05,{type:'triangle',vol:0.06});},
  giggle(){if(!budget())return;osc(1100,0.07,{vol:0.06});osc(1350,0.07,{at:0.08,vol:0.06});},
  deliver(){if(!budget())return;osc(1046.5,0.18,{vol:0.08});osc(1568,0.25,{at:0.08,vol:0.07});},
  pick(){if(!budget())return;osc(780,0.08,{to:1200,vol:0.08});},
  boat(){if(!budget())return;osc(392,0.22,{type:'triangle',vol:0.09});osc(523,0.3,{at:0.22,type:'triangle',vol:0.09});},
  bubble(){if(!budget())return;for(let i=0;i<5;i++)osc(300+i*110,0.09,{at:i*0.07,to:600+i*160,vol:0.07});},
  success(root){if(!AU.c)return;root=root||523.25;const ch=[1,1.26,1.5,2];
    ch.forEach((m,i)=>{osc(root*m,1.1,{at:i*0.075,vol:0.1,type:'sine'});osc(root*m*2,0.6,{at:i*0.075,vol:0.03});});
    noise(0.5,{ft:'highpass',f:5000,vol:0.03,at:0.1});},
  chime(){if(!AU.c)return;[1,1.26,1.5].forEach((m,i)=>osc(784*m,0.5,{at:i*0.06,vol:0.07}));},
  whoosh(){if(!AU.c)return;noise(1.6,{ft:'bandpass',f:300,f2:2400,q:0.8,vol:0.12});},
  fanfare(){if(!AU.c)return;const n=[523.25,659.25,783.99,1046.5,783.99,1046.5];
    n.forEach((f,i)=>{osc(f,0.5,{at:i*0.14,type:'triangle',vol:0.1});osc(f/2,0.6,{at:i*0.14,vol:0.06});});
    [1,1.26,1.5,2].forEach(m=>osc(523.25*m,1.6,{at:0.9,vol:0.07}));},
  partyLoop(k){if(!AU.c)return;const mel=[0,4,7,9,7,4,2,4,0,2,4,7,12,9,7,4];const b=523.25;
    for(let i=0;i<8;i++){const st=mel[(k*8+i)%mel.length];osc(b*Math.pow(2,st/12),0.22,{at:i*0.2,type:'triangle',vol:0.06});}
    osc(b/2*Math.pow(2,[0,5,7,0][k%4]/12),0.8,{vol:0.05});osc(b/2*Math.pow(2,([0,5,7,0][k%4]+4)/12),0.8,{at:0.8,vol:0.04});}
};

// ================================================================ camera
const cam={yaw:0,pitch:0.92,basePitch:0.92,dist:60,tx:0,ty:0,tz:0,f:40,cx:0,cy:0,
  fx:0,fy:1,fz:0,rx:1,ry:0,rz:0,ux:0,uy:0,uz:1,px:0,py:0,pz:0,portrait:false};
function camVectors(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),hx=Math.sin(cam.yaw),hy=Math.cos(cam.yaw);
  cam.fx=hx*cp;cam.fy=hy*cp;cam.fz=-sp;cam.rx=hy;cam.ry=-hx;cam.rz=0;cam.ux=hx*sp;cam.uy=hy*sp;cam.uz=cp;
  cam.px=cam.tx-cam.fx*cam.dist;cam.py=cam.ty-cam.fy*cam.dist;cam.pz=cam.tz-cam.fz*cam.dist;}
function pj(x,y,z){
  const dx=x-cam.px,dy=y-cam.py,dz=z-cam.pz;
  const d=Math.max(0.5,dx*cam.fx+dy*cam.fy+dz*cam.fz);
  const sx=dx*cam.rx+dy*cam.ry,sy=dx*cam.ux+dy*cam.uy+dz*cam.uz;const s=cam.f/d;
  return {x:cam.cx+sx*s,y:cam.cy-sy*s,s,d};}
function depthOf(x,y,z){return (x-cam.px)*cam.fx+(y-cam.py)*cam.fy+(z-cam.pz)*cam.fz;}
function elev(x,y,z){const dx=x-cam.px,dy=y-cam.py,dz=z-cam.pz;return clamp(Math.abs(dz)/Math.hypot(dx,dy,dz),0.2,1);}
function unproj(X,Y,h){
  const a=(X-cam.cx)/cam.f,b=-(Y-cam.cy)/cam.f;
  const dx=cam.fx+cam.rx*a+cam.ux*b,dy=cam.fy+cam.ry*a+cam.uy*b;let dz=cam.fz+cam.rz*a+cam.uz*b;
  if(dz>-0.03)dz=-0.03;const t=(h-cam.pz)/dz;return {x:cam.px+dx*t,y:cam.py+dy*t};}
function frontVec(){return {x:-Math.sin(cam.yaw),y:-Math.cos(cam.yaw)};}
function nextPlatePos(){return cam.portrait?{x:-13.2,y:0}:{x:0,y:-9.2};}
function fitCam(){
  camVectors();
  const pts=[];const B=[[-11,-7],[11,-7],[-11,7],[11,7]];
  for(const b of B){pts.push([b[0],b[1],0],[b[0],b[1],-0.9],[b[0],b[1],2.3]);}
  const k=ease(S.camK);
  if(k>0){const P=S.plate;for(const a of [0,1.57,3.14,4.71])pts.push([P.x+Math.cos(a)*4.4,P.y+Math.sin(a)*4.4,6.6*k]);}
  if(S.nextPlate&&S.nextPlate.a>0){const n=nextPlatePos();pts.push([n.x,n.y,0.5],[n.x,n.y,-1.2]);}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of pts){const dx=p[0]-cam.px,dy=p[1]-cam.py,dz=p[2]-cam.pz;const d=dx*cam.fx+dy*cam.fy+dz*cam.fz;
    const X=(dx*cam.rx+dy*cam.ry)/d,Y=-(dx*cam.ux+dy*cam.uy+dz*cam.uz)/d;
    if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;}
  const pad=Math.min(W,H)*0.025;const ax=SA.l+pad,ay=SA.t+pad,aw=W-SA.l-SA.r-pad*2,ah=H-SA.t-SA.b-pad*2;
  const f=Math.min(aw/(x1-x0),ah/(y1-y0));
  cam.f=f;cam.cx=ax+aw/2-f*(x0+x1)/2;const slack=ah-f*(y1-y0);cam.cy=ay+f*(-y0)+slack*0.72;}

// ================================================================ state
const G={idx:0,cakes:[],saveOk:null,loadState:'none'};
let S=null;
let fade={a:0,dir:0,built:false};
const KEY='fuwarin_cakes_v1';
function validCake(c){
  if(!c||typeof c!=='object'||!Array.isArray(c.t)||c.t.length!==3)return false;
  for(const tier of c.t){if(!Array.isArray(tier)||tier.length<1||tier.length>12)return false;
    for(const w of tier)if(typeof w!=='string'||!/^#[0-9a-f]{6}$/i.test(w))return false;}
  if(!Array.isArray(c.d)||c.d.length>40)return false;
  for(const d of c.d)if(typeof d!=='string'||!/^[smc-]$/.test(d))return false;
  return true;}
function loadCakes(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){G.loadState='denied';return [];}
  if(raw===null){G.loadState='empty';return [];}
  try{const o=JSON.parse(raw);if(!o||o.v!==1||!Array.isArray(o.cakes))throw new Error('bad');
    const ok=o.cakes.filter(validCake).slice(-3);if(!ok.length&&o.cakes.length)throw new Error('bad');
    G.loadState='restored';return ok;}
  catch(e){G.loadState='corrupt';try{localStorage.removeItem(KEY);}catch(_){}return [];}}
function saveCakes(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,cakes:G.cakes.slice(-3)}));G.saveOk=true;}catch(e){G.saveOk=false;}}

function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);}
function sampleRoad(cps,step){
  const pts=[];
  for(let i=0;i<cps.length-1;i++){const p0=cps[Math.max(0,i-1)],p1=cps[i],p2=cps[i+1],p3=cps[Math.min(cps.length-1,i+2)];
    for(let k=0;k<24;k++){const t=k/24;pts.push({x:catmull(p0.x,p1.x,p2.x,p3.x,t),y:catmull(p0.y,p1.y,p2.y,p3.y,t)});}}
  pts.push({x:cps[cps.length-1].x,y:cps[cps.length-1].y});
  const segs=[{x:pts[0].x,y:pts[0].y}];let acc=0;
  for(let i=1;i<pts.length;i++){acc+=dist(pts[i].x,pts[i].y,pts[i-1].x,pts[i-1].y);if(acc>=step){segs.push({x:pts[i].x,y:pts[i].y});acc=0;}}
  segs.forEach((s,i)=>{const a=segs[Math.max(0,i-1)],b=segs[Math.min(segs.length-1,i+1)];
    let tx=b.x-a.x,ty=b.y-a.y;const l=Math.hypot(tx,ty)||1;
    Object.assign(s,{i,tx:tx/l,ty:ty/l,nx:-ty/l,ny:tx/l,st:0,bridge:false,bt:0,pt:0,flow:false,bits:0});
    s.lx=s.x+s.nx*0.62;s.ly=s.y+s.ny*0.62;s.rx2=s.x-s.nx*0.62;s.ry2=s.y-s.ny*0.62;});
  return segs;}

function mkTree(x,y,id){
  return {id,x,y,wig:0,blobs:[[0,0,1.78,0.62],[-0.5,0.14,1.4,0.5],[0.5,-0.1,1.42,0.5],[0.06,-0.46,1.32,0.46],[0.02,0.48,1.36,0.46]]
    .map(b=>({dx:b[0],dy:b[1],dz:b[2],r:b[3],paint:null,pt:0,berries:[],flowers:0}))};}
function mkHouse(x,y,id){
  return {id,x,y,w:1.9,d:1.7,h:1.3,rh:0.72,wall:null,roof:[0,1,2].map(()=>({p:null,mound:0,drz:null,sq:0})),
    creamRoof:false,saucer:[],cake:false,cakeBerry:null,cakeT:0,order:null,puffs:[],wig:0,gone:false,fly:0,touched:0,firstT:1e9};}
function mkAnimal(id,kind,x,y,speed){
  return {id,kind,x,y,z:0,home:{x,y},state:'idle',route:[],goal:null,cargo:[],speed,face:1,walk:0,think:rnd(0.3,1.2),
    t:0,look:null,blocked:false,waited:false,crossing:false,via:null,rv:-1,wt:rnd(2,5),hop:0,giggle:0,holdPlate:false,
    lastMark:{x,y},cool:0,leader:null,seat:null,peek:0};}

function buildVillage(idx,awake){

  const s={idx,m,phase:'town',time:0,flavor:'s',awake:!!awake,wakeT:awake?1:0,camK:0,
    cloud:{x:-8.0,y:-3.8*m,z:awake?2.0:0.7,sq:0,sqv:0,happy:0,blink:2.5,px:0,py:0,pr:40,lpx:0,lpy:0,lookX:0,lookY:0,mvx:0,mvy:0},
    combo:0,lastContact:-9,hits:new Map(),
    done:{berry:false,cream:false,cake:false,stream:false,bridge:false,two:false,mix:false,chocoBerry:false},
    disc:{1:null,2:{creamFirst:false,berryFirst:false},3:{flow:false,curved:false},4:{bridge:false,crossed:false,waitedCross:false},
      5:{coat:false,toPlate:false},6:{two:false,puffL:false,puffR:false},7:{castle:false,deco:0,party:false}},
    berryCount:0,roadV:0,runs:[],boats:[],puffs:[],parts:[],trails:[],log:[],dockCool:0,
    hint:null,hintT:0,idle:0,demo:null,demoDone:false,drag:null,
    castle:null,decoCount:0,partyT:0,partyBeat:0,nextPlate:null,riseT:0,showCakes:G.cakes.slice(-3)};
  s.road=sampleRoad([[3.2,-6.95],[3.2,-4.5],[3.0,-2.0],[2.5,0.2],[3.3,2.2],[4.5,3.6],[3.7,5.0],[3.1,5.75]].map(p=>P(p[0],p[1])),0.62);
  s.road.forEach(g=>{g.curved=g.y*m>-1.0;});
  s.trees=[mkTree(-5.7,-1.2*m,'t1'),mkTree(6.3,-2.9*m,'t2'),mkTree(8.9,1.9*m,'t3')];
  s.houses=[mkHouse(-4.6,-4.9*m,'h1'),mkHouse(-5.4,4.4*m,'h2'),mkHouse(-0.1,5.4*m,'hl'),mkHouse(6.9,5.4*m,'hr'),mkHouse(8.3,-5.0*m,'h4')];
  s.HL=s.houses[2];s.HR=s.houses[3];
  s.plate={x:-1.0,y:0.2*m,items:{s:[null,null,null],m:[null,null,null],c:[null,null,null]},req:{s:['p','p','c'],m:['p','p','t'],c:['p','p','p']},rim:[],wig:0,glow:0};
  s.fountain={x:3.0,y:6.6*m,st:'stone',mix:0,emitT:1,wig:0,tilt:0,pulse:0};
  s.J={x:3.0,y:5.65*m};
  s.bottles=[{fl:'s',x:-9.7,y:-0.6*m,wig:0},{fl:'m',x:-9.7,y:1.8*m,wig:0},{fl:'c',x:-9.7,y:4.2*m,wig:0}];
  s.showcase={x:-8.6,y:6.0*m,wig:0};
  // dock
  let bi=0,bd=1e9;s.road.forEach(g=>{const d=dist(g.x,g.y,s.plate.x,s.plate.y);if(d<bd){bd=d;bi=g.i;}});s.dockI=bi;
  const dg=s.road[bi];const ps=Math.sign((s.plate.x-dg.x)*dg.nx+(s.plate.y-dg.y)*dg.ny)||1;s.plateSide=ps;
  s.animals=[mkAnimal('r1','rabbit',7.6,-0.8*m,2.4),mkAnimal('r2','rabbit',8.3,-1.7*m,2.3),
    mkAnimal('bear','bear',dg.x+dg.nx*ps*1.15,dg.y+dg.ny*ps*1.15,1.8),mkAnimal('cat','cat',1.2,6.0*m,2.2)];
  return s;}

// ================================================================ road helpers
function isWater(g){return g.st==='c'&&!g.bridge;}
function nearestSeg(x,y){let bi=0,bd=1e9;for(const g of S.road){const d=(x-g.x)*(x-g.x)+(y-g.y)*(y-g.y);if(d<bd){bd=d;bi=g.i;}}return {g:S.road[bi],d:Math.sqrt(bd)};}
function roadSide(x,y){const n=nearestSeg(x,y);const g=n.g;return {side:Math.sign((x-g.x)*g.nx+(y-g.y)*g.ny)||1,d:n.d,g};}
function recomputeRuns(){
  const R=S.road;S.runs=[];let a=-1;
  for(let i=0;i<=R.length;i++){const c=i<R.length&&R[i].st==='c';if(c&&a<0)a=i;if(!c&&a>=0){S.runs.push([a,i-1]);a=-1;}}
  R.forEach(g=>g.flow=false);
  S.runs=S.runs.filter(r=>r[1]-r[0]+1>=4);
  for(const r of S.runs)for(let i=r[0];i<=r[1];i++)R[i].flow=true;
  // boats: one per flowing run
  const keep=[];
  for(const r of S.runs){const bs=S.boats.filter(b=>b.u>=r[0]-0.01&&b.u<=r[1]+0.01);
    if(bs.length){bs[0].run=r;keep.push(bs[0]);}
    else{const nb={u:r[0],dir:1,run:r,cargo:true,bob:0,born:0};keep.push(nb);
      if(!S.done.stream){S.done.stream=true;}
      S.disc[3].flow=true;SFX.boat();SFX.success(587.33);const g=S.road[r[0]];ping(g.x,g.y);burst(g.x,g.y,0.3,10,COL.chocoL,'star');}}
  S.boats=keep;}
function roadChanged(){S.roadV++;recomputeRuns();}

function planRoute(a,tx,ty){
  const sa=roadSide(a.x,a.y),sb=roadSide(tx,ty);
  if(sa.side===sb.side||(sa.d>0.9&&sb.d<0.7&&false))return {pts:[{x:tx,y:ty}]};
  let best=null,bc=1e9;
  for(const g of S.road){if(isWater(g))continue;
    const nx=g.x+g.nx*sa.side*0.95,ny=g.y+g.ny*sa.side*0.95,fx=g.x+g.nx*sb.side*0.95,fy=g.y+g.ny*sb.side*0.95;
    const c=dist(a.x,a.y,nx,ny)+dist(fx,fy,tx,ty);if(c<bc){bc=c;best={g,nx,ny,fx,fy};}}
  if(!best){let bg=null;bc=1e9;
    for(const g of S.road){const c=dist(a.x,a.y,g.x,g.y)+dist(g.x,g.y,tx,ty);if(c<bc){bc=c;bg=g;}}
    return {pts:[{x:bg.x+bg.nx*sa.side*1.05,y:bg.y+bg.ny*sa.side*1.05}],blocked:true};}
  return {pts:[{x:best.nx,y:best.ny,tag:'near'},{x:best.fx,y:best.fy,tag:'far'},{x:tx,y:ty}],via:best.g};}

function approachAround(cx,cy,rad,from,side){
  side=side||S.plateSide;let best=null,bd=1e9;
  for(let i=0;i<20;i++){const a=i/20*TAU;const x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;
    if(Math.abs(x)>10.6||Math.abs(y)>6.6)continue;const rs=roadSide(x,y);
    if(rs.side!==side||rs.d<1.0)continue;const d=dist(x,y,from.x,from.y);if(d<bd){bd=d;best={x,y};}}
  return best||{x:cx-rad,y:cy};}

// ================================================================ particles / pings
function burst(x,y,z,n,col,type,spd){
  spd=spd||2.2;
  for(let i=0;i<n;i++){if(S.parts.length>=150)S.parts.shift();const a=Math.random()*TAU;const v=spd*rnd(0.4,1);
    S.parts.push({x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:rnd(1.5,3.6),life:rnd(0.5,0.9),max:0.9,col,type:type||'dot',sz:rnd(0.07,0.13),rot:rnd(0,6)});}}
function ping(x,y){
  for(const a of S.animals){if(a.state!=='idle'||a.cargo.length||S.phase==='party')continue;if(a.kind==='bear'&&needKind('c'))continue;
    if(dist(a.x,a.y,x,y)>7)continue;
    const d=dist(a.x,a.y,x,y)||1;const px=x+(a.x-x)/d*1.8,py=y+(a.y-y)/d*1.8;
    a.state='watch';a.look={x,y};setGoal(a,clamp(px,-10.5,10.5),clamp(py,-6.6,6.6),()=>{a.state='watching';a.t=2.2;a.look={x,y};});}}
function logDelivery(a,item,dest){S.log.push({a:a.id,item,dest,t:S.time});}

// ================================================================ animals
function setGoal(a,x,y,cb){a.goal={x,y,cb};replan(a);}
function replan(a){const g=a.goal;if(!g)return;const r=planRoute(a,g.x,g.y);a.route=r.pts;a.blocked=!!r.blocked;a.via=r.via||null;a.rv=S.roadV;a.wait=0.7;if(a.blocked)a.waited=true;}
function stepAnimal(a,dt){
  if(a.goal&&a.rv!==S.roadV&&!a.crossing)replan(a);
  a.giggle=Math.max(0,a.giggle-dt);a.cool=Math.max(0,a.cool-dt);
  if(a.route.length){
    const p=a.route[0];const dx=p.x-a.x,dy=p.y-a.y;const d=Math.hypot(dx,dy);
    const sp=a.speed*(a.cargo.length>=3?0.75:1)*(a.state==='party'?1.2:1);
    if(d<=sp*dt+0.01){a.x=p.x;a.y=p.y;a.route.shift();
      if(p.tag==='near')a.crossing=true;
      if(p.tag==='far'){a.crossing=false;if(a.via&&a.via.bridge){S.disc[4].crossed=true;if(a.waited)S.disc[4].waitedCross=true;}a.waited=false;}}
    else{a.x+=dx/d*sp*dt;a.y+=dy/d*sp*dt;}
    a.walk+=dt;const sd=pj(a.x+dx,a.y+dy,0),sp0=pj(a.x,a.y,0);if(Math.abs(sd.x-sp0.x)>0.5)a.face=sd.x>sp0.x?1:-1;
    if(dist(a.x,a.y,a.lastMark.x,a.lastMark.y)>0.5){a.lastMark={x:a.x,y:a.y};S.trails.push({x:a.x,y:a.y,k:a.kind});if(S.trails.length>360)S.trails.shift();}
    return false;}
  a.walk=0;
  if(a.goal){if(a.blocked){a.wait-=dt;a.look={x:a.goal.x,y:a.goal.y};faceTo(a,a.goal.x,a.goal.y);if(a.wait<=0)replan(a);return false;}
    const cb=a.goal.cb;a.goal=null;a.look=null;if(cb)cb();return true;}
  return true;}
function faceTo(a,x,y){const p=pj(x,y,0),q=pj(a.x,a.y,0);if(Math.abs(p.x-q.x)>1)a.face=p.x>q.x?1:-1;}
function goHome(a){a.state='idle';setGoal(a,a.home.x,a.home.y,null);}
function wander(a,dt){
  if(a.goal||a.route.length)return;a.wt-=dt;if(a.wt>0)return;a.wt=rnd(3,6);
  const x=a.home.x+rnd(-1.2,1.2),y=a.home.y+rnd(-1.2,1.2);const rs=roadSide(x,y),hs=roadSide(a.home.x,a.home.y);
  if(rs.side===hs.side&&rs.d>1)setGoal(a,clamp(x,-10.5,10.5),clamp(y,-6.6,6.6),null);}

function ripeBerries(){const out=[];for(const t of S.trees)for(const bl of t.blobs)for(const b of bl.berries)if(b.g>=1&&!b.claim)out.push({t,bl,b});return out;}
function otherRabbit(a){return S.animals.find(o=>o.kind==='rabbit'&&o!==a);}
function treeApproach(t,a){const d=dist(a.x,a.y,t.x,t.y)||1;let x=t.x+(a.x-t.x)/d*0.95,y=t.y+(a.y-t.y)/d*0.95;
  const rs=roadSide(x,y),ts=roadSide(t.x,t.y);if(rs.side!==ts.side||rs.d<0.9){x=t.x-0.95*Math.sign(t.x-nearestSeg(t.x,t.y).g.x||1)*-1;y=t.y;}
  return {x:clamp(x,-10.5,10.5),y:clamp(y,-6.6,6.6)};}
function aiRabbit(a,dt){
  if(a.state==='assistGo'||a.state==='assistWait'){stepAnimal(a,dt);return;}
  if(a.state==='assist'){const L=a.leader;if(!L||!L.cargo.length||!L.cargo[0].big){a.state='idle';a.leader=null;goHome(a);return;}
    const dx=L.route.length?L.route[0].x-L.x:1,dy=L.route.length?L.route[0].y-L.y:0;const d=Math.hypot(dx,dy)||1;
    const tx=L.x-dy/d*0.6,ty=L.y+dx/d*0.6;a.x=lerp(a.x,tx,Math.min(1,dt*8));a.y=lerp(a.y,ty,Math.min(1,dt*8));
    a.face=L.face;a.walk=L.walk;return;}
  if(a.state==='pick'){a.t-=dt;faceTo(a,a.job.t.x,a.job.t.y);
    if(a.job.b.big){const o=otherRabbit(a);if(!o||o.state!=='assistWait'){a.t=Math.max(a.t,0.05);return;}}
    if(a.t<=0)harvest(a);return;}
  if(a.state==='watching'){a.t-=dt;if(a.t<=0)goHome(a);return;}
  const arrived=stepAnimal(a,dt);
  if(a.state==='idle'&&arrived){
    if(S.phase==='party')return;
    if(a.cargo.length){deliverNext(a);return;}
    a.think-=dt;if(a.think<=0){a.think=0.35;if(tryRabbitJob(a))return;}wander(a,dt);}}
function tryRabbitJob(a){
  const c=ripeBerries();if(!c.length)return false;let best=null,bd=1e9;const o=otherRabbit(a);
  for(const e of c){if(e.b.big&&(!o||o.state!=='idle'||o.cargo.length||o.goal&&o.goal.cb))continue;
    const d=dist(a.x,a.y,e.t.x,e.t.y)-(e.b.choco?3:0)-(e.b.big?2:0);if(d<bd){bd=d;best=e;}}
  if(!best)return false;
  best.b.claim=a.id;a.job=best;a.holdPlate=!!best.b.choco;a.state='toTree';
  const ap=treeApproach(best.t,a);
  setGoal(a,ap.x,ap.y,()=>{a.state='pick';a.t=0.55;});
  if(best.b.big){o.state='assistGo';o.leader=a;const ap2={x:ap.x+0.5,y:ap.y+0.4};setGoal(o,ap2.x,ap2.y,()=>{o.state='assistWait';});}
  return true;}
function harvest(a){
  const {t,bl,b}=a.job;const take=[];
  const rm=(blob,berry)=>{const i=blob.berries.indexOf(berry);if(i>=0)blob.berries.splice(i,1);};
  if(blob_has(bl,b)){rm(bl,b);take.push(b);}
  if(!b.big){for(const ob of t.blobs){for(const x of ob.berries.slice()){if(take.length>=3)break;if(x.g>=1&&!x.claim&&!x.big){rm(ob,x);take.push(x);}}}}
  a.job=null;
  if(!take.length){a.state='idle';a.holdPlate=false;return;}
  a.cargo=take.map(x=>({k:'s',choco:!!x.choco,big:!!x.big}));
  SFX.pick();burst(t.x,t.y,1.4,5,COL.leaf,'dot',1.4);t.wig=0.5;
  if(take[0].big){const o=otherRabbit(a);if(o){o.state='assist';o.leader=a;}}
  deliverNext(a);}
function blob_has(bl,b){return bl.berries.indexOf(b)>=0;}
function chooseDest(item,a){
  if(S.phase!=='town')return castleDest(a);
  const hs=S.houses.filter(h=>!h.gone);
  const nearest=list=>{let b=null,bd=1e9;for(const h of list){const d=dist(a.x,a.y,h.x,h.y);if(d<bd){bd=d;b=h;}}return b;};
  const cream=hs.filter(h=>h.creamRoof&&!h.cake),sauc=hs.filter(h=>!h.cake&&!h.saucer.length);
  const plateNeed=plateSlotFor('s',itemVar(item))>=0;
  const toPlate=()=>{const p=approachAround(S.plate.x,S.plate.y,2.05,a);return {type:'plate',x:p.x,y:p.y};};
  const toHouse=h=>{const p=houseApproach(h);return {type:'house',h,x:p.x,y:p.y};};
  if(item.choco){if(plateNeed)return toPlate();if(cream.length)return toHouse(nearest(cream));if(sauc.length)return toHouse(nearest(sauc));return toPlate();}
  if(cream.length)return toHouse(nearest(cream));if(sauc.length)return toHouse(nearest(sauc));return toPlate();}
function castleDest(a){const p=approachAround(S.plate.x,S.plate.y,3.75,a);return {type:'castle',x:p.x,y:p.y};}
function deliverNext(a){
  if(!a.cargo.length){a.holdPlate=false;const o=S.animals.find(x=>x.leader===a);if(o){o.state='idle';o.leader=null;goHome(o);}
    a.dest=null;goHome(a);a.think=0.5;return;}
  if(S.phase==='party'){a.cargo=[];return;}
  const d=chooseDest(a.cargo[0],a);a.dest=d;a.state='carry';
  setGoal(a,d.x,d.y,()=>arriveDest(a));}
function arriveDest(a){
  const d=a.dest;
  if(d.type==='house'){const h=d.h;
    if(!h.gone){const it=a.cargo[0];
      if(h.creamRoof&&!h.cake){a.cargo.shift();makeCake(h,it,'creamFirst');logDelivery(a,it,h.id);}
      else if(!h.cake&&!h.saucer.length){a.cargo.shift();h.saucer.push(it);h.wig=0.4;SFX.deliver();logDelivery(a,it,h.id);
        const sp=saucerPos(h);burst(sp.x,sp.y,0.3,6,COL.pink,'star',1.2);ping(h.x,h.y);}
      markDelivered(it,'house');}}
  else if(d.type==='plate'){while(a.cargo.length){const it=a.cargo.shift();plateAccept('s',it,a);markDelivered(it,'plate');}}
  else if(d.type==='castle'){while(a.cargo.length){const it=a.cargo.shift();castleAccept(it.k||'s',it,a);markDelivered(it,'castle');}}
  a.state='idle';deliverNext(a);}
function markDelivered(it,where){if(!S.disc[1])S.disc[1]=where;if(it.choco&&(where==='plate'||where==='castle'))S.disc[5].toPlate=true;}
// plate slots: each empty slot shows (as a ghost) exactly which sweet it wants
function itemVar(it){return it&&it.choco?'c':(it&&it.two?'t':(it&&it.big?'b':'p'));}
function plateSlotFor(k,v){const P=S.plate;const it=P.items[k],rq=P.req[k];
  let i=it.findIndex((x,j)=>!x&&rq[j]===(v==='b'?'p':v));if(i<0&&v!=='p'&&v!=='b')i=it.findIndex((x,j)=>!x&&rq[j]==='p');
  if(i<0&&v==='b')i=-1;return i;}
function plateCount(k){return S.plate.items[k].filter(Boolean).length;}
function plateFull(){return ['s','m','c'].every(k=>plateCount(k)===3);}
function plateAccept(k,it,a){
  const P=S.plate;
  if(S.phase!=='town'){castleAccept(k,it,a);return;}
  const v=itemVar(it);const i=plateSlotFor(k,v);
  if(i>=0){P.items[k][i]=v;P.glow=1;P.wig=0.35;SFX.chime();
    burst(P.x,P.y,0.4,8,k==='s'?COL.berry:k==='m'?COL.cream:COL.choco,'star',1.6);logDelivery(a,k,'plate');
    if(plateFull()&&!S.castlePending){S.castlePending=1.4;}}
  else if(P.rim.length<12){P.rim.push(k);SFX.deliver();}}
function castleAccept(k,it,a){const C=S.castle;if(!C)return;if(C.extra.length<24)C.extra.push(it&&it.choco?'cc':k);SFX.deliver();
  burst(S.plate.x,S.plate.y,3.8,6,k==='s'?COL.berry:k==='m'?COL.cream:COL.choco,'star',1.5);if(a)logDelivery(a,k,'castle');}
function needKind(k,v){if(S.phase==='town')return plateSlotFor(k,v||'p')>=0;if(S.castle)return S.castle.extra.filter(x=>x===k).length<6;return false;}

function aiBear(a,dt){
  if(a.state==='watching'){a.t-=dt;if(a.t<=0)goHome(a);return;}
  const arr=stepAnimal(a,dt);
  if(a.state==='idle'&&arr&&!a.cargo.length&&S.phase!=='party')wander(a,dt);}
function bearTake(a){
  a.cargo=[{k:'c'}];a.state='carry';a.goal=null;a.route=[];SFX.pick();
  const p=S.phase==='town'?approachAround(S.plate.x,S.plate.y,2.05,a):approachAround(S.plate.x,S.plate.y,3.75,a);
  setGoal(a,p.x,p.y,()=>{const it=a.cargo.shift();if(S.phase==='town')plateAccept('c',it,a);else castleAccept('c',it,a);a.state='idle';goHome(a);});}
function aiCat(a,dt){
  if(a.state==='watching'){a.t-=dt;if(a.t<=0)goHome(a);return;}
  if(a.state==='scoop'){a.t-=dt;if(a.t<=0){a.cargo=[{k:'m',two:S.fountain.st==='two'}];SFX.pick();a.state='carry';
      const p=S.phase==='town'?approachAround(S.plate.x,S.plate.y,2.05,a):approachAround(S.plate.x,S.plate.y,3.75,a);
      setGoal(a,p.x,p.y,()=>{const it=a.cargo.shift();if(S.phase==='town')plateAccept('m',it,a);else castleAccept('m',it,a);a.state='idle';a.cool=2.5;goHome(a);});}
    return;}
  const arr=stepAnimal(a,dt);
  if(a.state==='idle'&&arr&&!a.cargo.length&&S.phase!=='party'){
    if(S.fountain.st!=='stone'&&needKind('m',S.fountain.st==='two'?'t':'p')&&a.cool<=0&&(S.phase==='town'||S.phase==='castle')){
      a.state='toF';const p=approachAround(S.fountain.x,S.fountain.y,1.45,a);
      setGoal(a,p.x,p.y,()=>{a.state='scoop';a.t=0.6;faceTo(a,S.fountain.x,S.fountain.y);S.fountain.wig=0.3;});return;}
    wander(a,dt);}}
function aiMouse(a,dt){
  if(a.state==='peek'){a.peek=Math.min(1,a.peek+dt*2);a.t-=dt;if(a.t<=0){a.state='taste';a.t=1.5;const p=houseApproach(a.house);a.x=p.x;a.y=p.y;SFX.giggle();}return;}
  if(a.state==='taste'){a.t-=dt;if(a.t<=0){
      if(needKind('m')&&!a.house.gone){a.cargo=[{k:'m'}];a.state='carry';const p=S.phase==='town'?approachAround(S.plate.x,S.plate.y,2.05,a):approachAround(S.plate.x,S.plate.y,3.75,a);
        setGoal(a,p.x,p.y,()=>{const it=a.cargo.shift();if(S.phase==='town')plateAccept('m',it,a);else castleAccept('m',it,a);a.state='idle';goHome(a);});}
      else{a.state='idle';}}
    return;}
  if(a.state==='watching'){a.t-=dt;if(a.t<=0)goHome(a);return;}
  const arr=stepAnimal(a,dt);if(a.state==='idle'&&arr&&S.phase!=='party')wander(a,dt);}

// ================================================================ houses
function houseFrame(h){const f=frontVec();const ext=h.w/2;const fw=h.d/2;
  return {fx:f.x,fy:f.y,px:-f.y,py:f.x,ext,fw};}
function saucerPos(h){const F=houseFrame(h);return {x:h.x+F.fx*(F.ext+0.5)-F.px*F.fw*0.42,y:h.y+F.fy*(F.ext+0.5)-F.py*F.fw*0.42};}
function houseApproach(h){const sp=saucerPos(h);const F=houseFrame(h);let p={x:sp.x+F.fx*0.55+F.px*0.25,y:sp.y+F.fy*0.55+F.py*0.25};
  const rs=roadSide(p.x,p.y),hs=roadSide(h.x,h.y);if(rs.side!==hs.side||rs.d<0.9){p={x:h.x-F.fx*(F.ext+0.7),y:h.y-F.fy*(F.ext+0.7)};}
  return {x:clamp(p.x,-10.6,10.6),y:clamp(p.y,-6.7,6.7)};}
function windowPos(h){const F=houseFrame(h);return {x:h.x+F.fx*(F.ext+0.05)+F.px*F.fw*0.45,y:h.y+F.fy*(F.ext+0.05)+F.py*F.fw*0.45,z:0.62};}
function checkCreamRoof(h){
  const n=h.roof.filter(r=>r.mound>=0.3).length;
  if(!h.creamRoof&&n>=2){h.creamRoof=true;S.done.cream=true;SFX.success(659.25);burst(h.x,h.y,2.0,10,COL.cream,'star');ping(h.x,h.y);
    if(h.saucer.length&&!h.cake){const it=h.saucer.shift();h.hop={t:0,it};}}}

function doContacts(){

  const hitSet=new Set();
  for(let s=1;s<=steps;s++){const x=lerp(c.lpx,c.px,s/steps),y=lerp(c.lpy,c.py,s/steps);
    for(const t of T){if(hitSet.has(t))continue;const dd=dist(x,y,t.x,t.y);if(dd<(t.k==='bottle'?Rc*0.45+t.r*0.8:Rc+t.r))hitSet.add(t);}}

        pre:src?(src.creamRoof?'m':(src.puffs.length?'c':null)):'m',deco:null,dt:0,rev:src?0:1});}

function visibleWedges(){

      const vx=cam.px-(P.x+nx*T.r),vy=cam.py-(P.y+ny*T.r);if(nx*vx+ny*vy<=Math.hypot(vx,vy)*0.25)continue;

      w.sx=p.x;w.sy=p.y;w.sr=Math.min(T.h*0.5,T.r*0.55)*p.s;w.wx=wx;w.wy=wy;w.wz=wz;out.push(w);}}
  return out;}
function seatsFor(n){
  const P=S.plate;const cand=[];
  for(let i=0;i<28;i++){const a=i/28*TAU;const x=P.x+Math.cos(a)*4.3,y=P.y+Math.sin(a)*4.3;
    if(Math.abs(x)>10.5||Math.abs(y)>6.7)continue;const rs=roadSide(x,y);if(rs.side!==S.plateSide||rs.d<1)continue;cand.push({x,y,d:depthOf(x,y,0)});}

  for(let i=0;out.length<n&&i<cand.length;i++)if(out.indexOf(cand[i])<0)out.push(cand[i]);

function computeHint(){

    const ci=R[i].st!=='c'?i:-1,cj=R[j].st!=='c'?j:-1;if(ci<0&&cj<0)return -1;if(ci<0)return cj;if(cj<0)return ci;

function drawNextPlate(){
  const N=S.nextPlate;if(!N)return;const n=nextPlatePos();const T=S.time;const a=ease(N.a);const z=lerp(-1.5,0.1,a)+Math.sin(T*1.5)*0.08+(isHint(N)||S.hint&&S.hint.k==='next'?Math.abs(Math.sin(T*5))*0.2:0);
  const p=pj(n.x,n.y,z-0.35);const s=p.s;
  for(const o of [[-0.9,0.1,0.7],[0.9,0.1,0.7],[0,0.25,0.9],[-0.4,-0.1,0.7],[0.5,-0.1,0.6]]){ball(p.x+o[0]*s,p.y+o[1]*s,o[2]*s,'#ffffff');}
  const q=pj(n.x,n.y,z);const k=elev(n.x,n.y,z);ctx.fillStyle=COL.plateRim;ctx.beginPath();ctx.ellipse(q.x,q.y,1.05*s,1.05*s*k,0,0,TAU);ctx.fill();
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(q.x,q.y,0.88*s,0.88*s*k,0,0,TAU);ctx.fill();
  for(let i=0;i<3;i++){const an=T*1.5+i*2.1;ctx.fillStyle='rgba(255,240,170,0.9)';star(q.x+Math.cos(an)*1.2*s,q.y+Math.sin(an)*0.5*s-0.3*s,0.12*s);}}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;const rr2=i%2?r*0.35:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}ctx.closePath();ctx.fill();}

function drawCloud(){
  const c=S.cloud;const T=S.time;const R=c.pr;const col=FL[S.flavor].cloud;
  const g=pj(c.x,c.y,0);const kk=elev(c.x,c.y,0);
  ctx.fillStyle='rgba(110,70,100,'+(S.awake?0.14:0.2)+')';ctx.beginPath();ctx.ellipse(g.x,g.y,R*0.75,R*0.75*kk,0,0,TAU);ctx.fill();
  const hintMe=S.hint&&S.hint.k==='cloud';
  let sx=1+c.sq,sy=1-c.sq;const sp=Math.hypot(c.mvx,c.mvy);if(sp>2){const st=Math.min(0.18,sp*0.012);sx+=st;sy-=st*0.6;}
  let y=c.py;if(!S.awake){sy*=0.86+Math.sin(T*2)*0.03;sx*=1.08;}else y+=Math.sin(T*2.2)*R*0.05;
  if(hintMe)y-=Math.abs(Math.sin(T*5))*R*0.18;
  if(hintMe||(!S.awake)){ctx.fillStyle='rgba(255,246,190,'+(0.25+0.2*Math.sin(T*5))+')';ctx.beginPath();ctx.arc(c.px,y,R*1.35,0,TAU);ctx.fill();}
  ctx.save();ctx.translate(c.px,y+R*0.55);ctx.scale(sx,sy);ctx.translate(0,-R*0.55);
  const pf=[[-0.62,0.18,0.62],[0.62,0.18,0.62],[-0.34,-0.38,0.6],[0.36,-0.42,0.58],[0,0.32,0.66],[0,-0.05,0.8]];
  for(const f of pf)ball(f[0]*R,f[1]*R,f[2]*R,col);
  if(S.flavor==='c'){const sp=[['#ff9fbb',-0.6,-0.1],['#a8dcf5',-0.35,-0.55],['#fff3a0',0.55,-0.25],['#c9f0b5',0.7,0.25],['#ff9fbb',0.3,-0.62],['#ffffff',-0.7,0.35]];
    for(const q of sp){ctx.save();ctx.translate(q[1]*R,q[2]*R);ctx.rotate(q[1]*3);ctx.fillStyle=q[0];rr(ctx,-R*0.07,-R*0.025,R*0.14,R*0.05,R*0.025);ctx.fill();ctx.restore();}}
  // hair bow
  const bw=FL[S.flavor].deep;ctx.fillStyle=S.flavor==='m'?'#ff9fbb':bw;
  ctx.beginPath();ctx.moveTo(0.5*R,-0.78*R);ctx.lineTo(0.28*R,-0.95*R);ctx.lineTo(0.3*R,-0.6*R);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0.5*R,-0.78*R);ctx.lineTo(0.75*R,-0.98*R);ctx.lineTo(0.72*R,-0.6*R);ctx.closePath();ctx.fill();ball(0.5*R,-0.78*R,0.09*R,ctx.fillStyle);
  // face
  let lx=0,ly=0;
  if(S.drag){lx=clamp(c.mvx*0.02,-1,1);ly=0;}
  else if(S.hint&&S.hint.k!=='cloud'){const hp=hintPos(S.hint);if(hp){const q=pj(hp.x,hp.y,hp.z);const dx=q.x-c.px,dy=q.y-c.py;const d=Math.hypot(dx,dy)||1;lx=dx/d;ly=dy/d;}}
  const ex=0.27*R,ey=0.02*R;
  if(!S.awake){ctx.strokeStyle='#6b4a5c';ctx.lineWidth=Math.max(1.5,R*0.05);ctx.lineCap='round';
    for(const o of [-1,1]){ctx.beginPath();ctx.arc(o*ex,ey,R*0.09,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}ctx.lineCap='butt';
    // sleep bubbles
    for(let i=0;i<3;i++){const ph=(T*0.5+i/3)%1;ctx.fillStyle='rgba(255,255,255,'+(0.8*(1-ph))+')';ctx.beginPath();ctx.arc(R*(0.7+ph*0.4),-R*(0.6+ph*0.9),R*(0.06+ph*0.08),0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(180,200,230,'+(0.7*(1-ph))+')';ctx.lineWidth=1;ctx.stroke();}}
  else{const blink=c.blink<0;
    for(const o of [-1,1]){const x=o*ex+lx*R*0.05,yy=ey+ly*R*0.04;
      if(blink){ctx.strokeStyle='#4b3442';ctx.lineWidth=Math.max(1.5,R*0.05);ctx.beginPath();ctx.moveTo(x-R*0.08,yy);ctx.lineTo(x+R*0.08,yy);ctx.stroke();}
      else{ctx.fillStyle='#4b3442';ctx.beginPath();ctx.ellipse(x,yy,R*0.085,R*0.115,0,0,TAU);ctx.fill();
        ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(x-R*0.03,yy-R*0.045,R*0.035,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(x+R*0.03,yy+R*0.04,R*0.016,0,TAU);ctx.fill();}}}
  const hp=c.happy>0?Math.min(1,c.happy*2):0;
  ctx.fillStyle='rgba(255,120,160,0.55)';for(const o of [-1,1]){ctx.beginPath();ctx.ellipse(o*R*0.45,R*0.16,R*(0.11+hp*0.07),R*(0.07+hp*0.05),0,0,TAU);ctx.fill();}
  ctx.strokeStyle='#7a4a5e';ctx.lineWidth=Math.max(1.3,R*0.04);ctx.lineCap='round';
  if(hp>0.2){ctx.fillStyle='#ff7a9a';ctx.beginPath();ctx.ellipse(0,R*0.2,R*0.07,R*0.08*hp+R*0.02,0,0,TAU);ctx.fill();}
  else if(S.awake){ctx.beginPath();ctx.arc(0,R*0.13,R*0.08,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  ctx.lineCap='butt';
  ctx.restore();}
function drawParticles(){
  for(const p of S.parts){const q=pj(p.x,p.y,p.z);const a=clamp(p.life/p.max*1.4,0,1);const r=p.sz*q.s*(0.5+0.5*a);
    if(p.type==='dot'){ctx.globalAlpha=a;ball(q.x,q.y,r,p.col);}
    else if(p.type==='star'){ctx.globalAlpha=a;ctx.fillStyle=p.col;star(q.x,q.y,r*1.6);}
    else{ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(p.rot);ctx.fillRect(-r,-r*0.45,r*2,r*0.9);ctx.restore();}}
  ctx.globalAlpha=1;}
function drawHand(){
  const D=S.demo;if(!D||!S.hint)return;const t=D.t;const c=S.cloud;const hp=hintPos(S.hint);if(!hp)return;
  const tg=pj(hp.x,hp.y,hp.z);
  let x,y,press=false,al=1;
  if(S.hint.k==='cloud'){x=c.px;y=c.py;press=(t%0.9)>0.45;al=t<0.2?t/0.2:t>2.5?Math.max(0,(2.9-t)/0.4):1;}
  else{const u=ease((t-0.6)/1.4);x=lerp(c.px,tg.x,u);y=lerp(c.py,tg.y,u);press=t>0.4&&t<2.2;al=t<0.25?t/0.25:t>2.4?Math.max(0,(2.9-t)/0.5):1;
    if(press&&t>0.6){ctx.save();ctx.globalAlpha=al*0.5;ctx.strokeStyle='#ffffff';ctx.setLineDash([6,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c.px,c.py);ctx.lineTo(x,y);ctx.stroke();ctx.restore();}}
  const u=Math.min(W,H)*0.055*(press?0.92:1);
  ctx.save();ctx.globalAlpha=al;ctx.translate(x+u*0.15,y+u*0.1);
  if(press){ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-u*0.15,-u*0.1,u*0.55,0,TAU);ctx.stroke();}
  ctx.fillStyle='#fff7f2';ctx.strokeStyle='#e4a3b5';ctx.lineWidth=Math.max(2,u*0.08);
  rr(ctx,-u*0.42,u*0.62,u*1.15,u*1.05,u*0.42);ctx.fill();ctx.stroke();
  rr(ctx,-u*0.2,-u*0.08,u*0.4,u*1.05,u*0.2);ctx.fill();ctx.stroke();
  for(let i=0;i<3;i++){rr(ctx,u*(0.18+i*0.18),u*(0.45+i*0.04),u*0.22,u*0.55,u*0.11);ctx.fill();ctx.stroke();}
  rr(ctx,-u*0.62,u*0.75,u*0.4,u*0.25,u*0.12);ctx.fill();ctx.stroke();
  ctx.restore();}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const P0=performance.now();
  drawBG();ctx.drawImage(bgc,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);const P1=performance.now();
  drawRoad();drawTrails();drawHintRing();const P2=performance.now();
  // shadows
  for(const t of S.trees)shadow(t.x,t.y,0.95,0.14);
  for(const h of S.houses)if(!h.gone&&h.fly<=0)shadow(h.x,h.y,1.3,0.12);
  for(const a of S.animals)if(!(a.kind==='mouse'&&a.state==='peek'))shadow(a.x,a.y,0.3,0.16);
  for(const b of S.bottles)shadow(b.x,b.y,0.5,0.14);
  for(const h of S.houses)drawSaucer(h);
  if(S.phase==='town'||!S.castle||S.castle.tiers[0].g<0.3)drawPlate();
  const DL=[];
  for(const t of S.trees)DL.push({d:depthOf(t.x,t.y,0),f:()=>drawTree(t)});
  for(const h of S.houses){if(h.gone)continue;
    if(h.fly>0){const u=ease(h.fly);const x=lerp(h.flyFrom.x,h.flyTo.x,u),y=lerp(h.flyFrom.y,h.flyTo.y,u),z=lerp(0,h.flyTo.z,u)+Math.sin(u*Math.PI)*2.2;
      DL.push({d:depthOf(x,y,z)-6,f:()=>drawHouse(h,x,y,z,lerp(1,0.45,u),u>0.85?(1-u)/0.15:1)});}
    else DL.push({d:depthOf(h.x,h.y,0),f:()=>drawHouse(h,h.x,h.y,0,1,1)});}
  DL.push({d:depthOf(S.fountain.x,S.fountain.y,0),f:drawFountain});
  DL.push({d:depthOf(S.J.x,S.J.y,0)-0.5,f:drawGutter});
  for(const b of S.bottles)DL.push({d:depthOf(b.x,b.y,0),f:()=>drawBottle(b)});
  DL.push({d:depthOf(S.showcase.x,S.showcase.y,0),f:drawShowcase});
  for(const a of S.animals)DL.push({d:depthOf(a.x,a.y,0)-0.01,f:()=>drawAnimal(a)});
  for(const b of S.boats)DL.push({d:depthOf(S.road[Math.round(b.u)].x,S.road[Math.round(b.u)].y,0),f:()=>drawBoat(b)});
  for(const g of S.road)if(g.bridge)DL.push({d:depthOf(g.x,g.y,0)+0.01,f:()=>drawBridge(g)});
  if(S.castle){const cd=depthOf(S.plate.x,S.plate.y,0);DL.push({d:cd,f:drawCastle});
    for(const tl of S.castle.tiles){const p=tilePos(tl);const d=depthOf(p.x,p.y,0);const behind=d>cd;DL.push({d:behind?cd+0.5+(d-cd)*0.01:Math.min(d,cd-0.5),f:()=>drawTile(tl)});}}
  if(S.nextPlate)DL.push({d:depthOf(nextPlatePos().x,nextPlatePos().y,0),f:drawNextPlate});
  const P3=performance.now();
  DL.sort((a,b)=>b.d-a.d);for(const e of DL)e.f();const P4=performance.now();
  drawParticles();drawCloud();drawHand();
  if(DBG.prof){const P5=performance.now();const q=DBG.prof;q.n++;q.bg+=P1-P0;q.ground+=P2-P1;q.shadow+=P3-P2;q.obj+=P4-P3;q.top+=P5-P4;}
  if(fade.a>0){ctx.fillStyle='rgba(255,240,246,'+fade.a+')';ctx.fillRect(0,0,W,H);
    const r=Math.max(W,H)*0.12*fade.a;for(let i=0;i<6;i++){const a=i/6*TAU+S.time*2;ball(W/2+Math.cos(a)*r*1.5,H/2+Math.sin(a)*r*1.5,r*0.35,i%2?COL.pink:COL.cream);}}}

// ================================================================ input
function hitCloud(x,y){const c=S.cloud;return dist(x,y,c.px,c.py)<c.pr*1.45;}
function wakeUp(){S.awake=true;S.wakeT=0;S.cloud.sq=0.35;S.cloud.sqv=-3;SFX.squish();setTimeout(()=>SFX.wake(),90);
  burst(S.cloud.x,S.cloud.y,1.0,12,COL.gold,'star',2.2);S.hintT=0;}
function onDown(e){
  e.preventDefault();audioInit();
  S.idle=0;S.demo=null;S.demoDone=false;
  if(S.drag||fade.dir)return;
  const x=e.clientX,y=e.clientY;
  if(hitCloud(x,y)){
    if(!S.awake)wakeUp();else{S.cloud.sqv-=3;SFX.squish();}
    S.cloud.driftTo=null;S.drag={id:e.pointerId,x,y,ox:clamp(S.cloud.px-x,-S.cloud.pr*0.5,S.cloud.pr*0.5),oy:clamp(S.cloud.py-y,-S.cloud.pr*0.5,S.cloud.pr*0.5),lift:0};
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    S.cloud.lpx=S.cloud.px;S.cloud.lpy=S.cloud.py;return;}
  // direct tap on an object: small wiggle only
  const T=buildTargets();let best=null,bd=1e9;for(const t of T){if(t.k==='seg')continue;const d=dist(x,y,t.x,t.y);if(d<t.r*1.1&&d<bd){bd=d;best=t;}}
  if(best){const o=best.o;if(best.k==='blob')o.wig=0.25;else if(best.k==='animal'){o.giggle=0.5;SFX.giggle();return;}else if(o&&'wig'in o)o.wig=0.25;SFX.tick();}}
function onMove(e){if(!S.drag||e.pointerId!==S.drag.id)return;e.preventDefault();S.drag.x=e.clientX;S.drag.y=e.clientY;S.idle=0;}
function onUp(e){if(!S.drag||e.pointerId!==S.drag.id)return;release();}
function release(){if(S&&S.drag){try{cv.releasePointerCapture(S.drag.id);}catch(_){}S.drag=null;S.cloud.sqv+=2;
    // float up off whatever it is covering so the result stays visible
    const c=S.cloud;const over=buildTargets().some(t=>(t.k==='blob'||t.k==='roof'||t.k==='fountain'||t.k==='bottle'||t.k==='wedge')&&dist(c.px,c.py,t.x,t.y)<c.pr*0.9+t.r);
    if(over){const w=unproj(c.px,c.py-c.pr*1.7,c.z);c.driftTo={x:clamp(w.x,-12,11.5),y:clamp(w.y,-8,7.2)};}}}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);
cv.addEventListener('lostpointercapture',onUp);
window.addEventListener('pointerup',e=>{audioInit();onUp(e);});
window.addEventListener('blur',release);
const prevent=e=>{e.preventDefault();};
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('touchmove',prevent,{passive:false});
document.addEventListener('touchend',e=>{audioInit();},{passive:true});
document.addEventListener('gesturestart',prevent,{passive:false});
document.addEventListener('gesturechange',prevent,{passive:false});
document.addEventListener('dblclick',prevent,{passive:false});
document.addEventListener('contextmenu',prevent);
document.addEventListener('selectstart',prevent);

// ================================================================ loop
// adaptive resolution: if frames stay slow (old iPads), lower the internal pixel ratio once or twice
const QUAL={cap:2,ema:16.7,t:0};
function applyDPR(){DPR=Math.min(QUAL.cap,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);bgc.width=cv.width;bgc.height=cv.height;bgKey='';}
function qualityWatch(ms){QUAL.ema=lerp(QUAL.ema,ms,0.05);QUAL.t+=ms;
  if(QUAL.t>3000&&QUAL.ema>24&&DPR>1){QUAL.cap=Math.max(1,DPR-0.5);applyDPR();QUAL.t=0;QUAL.ema=16.7;}}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);applyDPR();
  const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;
  cam.portrait=H>W*1.05;cam.yaw=cam.portrait?Math.PI/2:0;cam.basePitch=cam.portrait?1.08:0.86;
  release();}
function updateCam(){const k=ease(S.camK);cam.pitch=cam.basePitch-0.2*k;cam.dist=60*(1+0.25*k);cam.tx=0;cam.ty=0;cam.tz=0;fitCam();}
let raf=0,last=0,running=true;
function update(dt){
  S.time+=dt;updateCam();updateCloud(dt);
  if(S.drag&&S.awake&&!fade.dir&&S.phase!=='rising')doContacts();
  updateWorld(dt);
  if(fade.dir){fade.a=clamp(fade.a+fade.dir*dt*1.4,0,1);
    if(fade.dir>0&&fade.a>=1&&!fade.built){fade.built=true;release();G.idx++;S=buildVillage(G.idx,true);fade.dir=-1;SFX.chime();}
    if(fade.dir<0&&fade.a<=0)fade.dir=0;}}
function frame(ts){
  if(!running)return;raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=1/60;if(dt<0.25)qualityWatch(dt*1000);dt=Math.min(dt,1/20);
  dt*=DBG.speed;
  try{update(dt);render();}catch(err){console.error(err);}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;cancelAnimationFrame(raf);release();if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{});}
  else{if(!running){running=true;last=performance.now();if(AU.c)AU.c.resume().catch(()=>{});raf=requestAnimationFrame(frame);}}});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

// ================================================================ boot
const DBG={speed:1};
G.cakes=loadCakes();
S=buildVillage(0,false);
resize();updateCam();updateCloud(0);
last=performance.now();raf=requestAnimationFrame(frame);
// test hooks (read-only views + projection helpers for automated checks)
window.__fw={get S(){return S;},G,DBG,cam,pj:(x,y,z)=>pj(x,y,z),fade:()=>fade,
  wedges:()=>visibleWedges().map(w=>({x:w.sx,y:w.sy,deco:w.deco,ti:w.ti})),nextPos:()=>{const n=nextPlatePos();return pj(n.x,n.y,0.2);},
  running:()=>running,dpr:()=>DPR,audio:()=>AU.c?AU.c.state:"none",parts:()=>S.parts.length};
})();
</script>
