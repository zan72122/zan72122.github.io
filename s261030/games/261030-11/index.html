'use strict';
(function(){
/* =========================================================
   ぷるん！かえる車掌と月まで虹ジャンプ
   world coords: x right, y up, ground = 0
   ========================================================= */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOutBack=t=>{t=clamp(t,0,1);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const hyp=Math.hypot;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const FX=Math.random;

/* ---------------- canvas ---------------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const safeProbe=document.getElementById('safe');
let W=1,H=1,DPR=1;const safe={l:0,r:0,t:0,b:0};
let bgDirty=true;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';

  bgDirty=true;
}

/* ---------------- audio ---------------- */
const AU={c:null,m:null,noise:null,chg:null};
function aInit(){
  if(!AU.c){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{AU.c=new AC();}catch(e){return;}
    const comp=AU.c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(AU.c.destination);
    AU.m=AU.c.createGain();AU.m.gain.value=0.55;AU.m.connect(comp);
    const len=(AU.c.sampleRate*0.6)|0;const b=AU.c.createBuffer(1,len,AU.c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
    try{const s=AU.c.createBufferSource();s.buffer=AU.c.createBuffer(1,1,22050);s.connect(AU.c.destination);s.start(0);}catch(e){}
  }
  if(AU.c.state!=='running'&&!document.hidden){try{AU.c.resume().catch(()=>{});}catch(e){}}
}
function aOK(){return !!(AU.c&&AU.c.state==='running');}
function tone(f,d,o){
  if(!aOK())return;o=o||{};
  try{
  const c=AU.c,t0=c.currentTime+(o.delay||0);const g=c.createGain();const os=c.createOscillator();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+(o.bendT||d*0.8));
  const v=o.vol||0.15,at=o.at||0.006;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+at);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  os.connect(g);g.connect(AU.m);os.start(t0);os.stop(t0+d+0.05);
  }catch(e){}
}
function nz(d,o){
  if(!aOK()||!AU.noise)return;o=o||{};
  try{
  const c=AU.c,t0=c.currentTime+(o.delay||0);const s=c.createBufferSource();s.buffer=AU.noise;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||800;f.Q.value=o.q||1;
  const g=c.createGain();g.gain.setValueAtTime(o.vol||0.08,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(AU.m);s.start(t0);s.stop(t0+d+0.05);
  }catch(e){}
}
function glassNote(f,delay,vol){vol=vol||0.11;tone(f,1.1,{vol,delay});tone(f*2.76,0.45,{vol:vol*0.32,delay});tone(f*5.4,0.22,{vol:vol*0.12,delay});}
const PENTA=[392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760,2093];
const SND={
  squish(){tone(240,0.16,{to:140,vol:0.2});nz(0.07,{f:600,q:0.8,vol:0.05});},
  chargeStart(){
    if(!aOK())return;SND.chargeStop();
    try{const c=AU.c;const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='triangle';o.frequency.value=170;l.frequency.value=6;lg.gain.value=5;l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(0.045,c.currentTime+0.08);
    o.connect(g);g.connect(AU.m);o.start();l.start();AU.chg={o,g,l};}catch(e){}
  },
  charge(v){if(AU.chg&&aOK()){try{AU.chg.o.frequency.setTargetAtTime(170+430*v,AU.c.currentTime,0.06);AU.chg.l.frequency.setTargetAtTime(6+8*v,AU.c.currentTime,0.1);}catch(e){}}},
  chargeStop(){if(AU.chg){const ch=AU.chg;AU.chg=null;try{const t=AU.c.currentTime;ch.g.gain.cancelScheduledValues(t);ch.g.gain.setValueAtTime(0.04,t);ch.g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);ch.o.stop(t+0.1);ch.l.stop(t+0.1);}catch(e){}}},
  boing(c){tone(190,0.4,{to:480+520*c,vol:0.18,bendT:0.22});tone(380,0.25,{to:900+600*c,vol:0.05,bendT:0.2,type:'triangle'});},
  hop(){tone(300,0.22,{to:620,vol:0.14,bendT:0.15});},
  land(high){const s=high?[4,6,8,10,12]:[2,4,5,7];s.forEach((k,i)=>glassNote(PENTA[k],i*0.08,0.1));tone(110,0.2,{to:70,vol:0.12});},
  peep(){tone(1900,0.09,{to:2500,vol:0.06});tone(2100,0.09,{to:2700,vol:0.05,delay:0.12});},
  chitter(){for(let i=0;i<3;i++)tone(1400+i*120,0.05,{to:1100,vol:0.04,delay:i*0.06,type:'square'});},
  bloop(){tone(260,0.25,{to:180,vol:0.12});},
  bunny(){tone(700,0.15,{to:1200,vol:0.08});tone(900,0.15,{to:1500,vol:0.06,delay:0.1});},
  bell(d){d=d||0;tone(1318,1.4,{vol:0.09,delay:d});tone(1975,0.9,{vol:0.05,delay:d});tone(3150,0.4,{vol:0.025,delay:d});},
  tick(){tone(1500,0.04,{vol:0.03,type:'triangle'});},
  tink(){tone(2200+FX()*600,0.12,{vol:0.03});},
  plip(){tone(500,0.12,{to:1300,vol:0.07});},
  pop(){tone(600,0.08,{to:1100,vol:0.06});},
  munch(){for(let i=0;i<3;i++)nz(0.06,{f:1200,q:2,vol:0.06,delay:i*0.13});tone(500,0.1,{to:700,vol:0.04,delay:0.4});},
  knot(){tone(600,0.3,{to:1200,vol:0.08});glassNote(PENTA[7],0.2,0.1);glassNote(PENTA[9],0.3,0.1);},
  success(){[2,4,6,7].forEach((k,i)=>glassNote(PENTA[k]*1,i*0.11,0.13));tone(523.25,0.9,{vol:0.06,delay:0.45,type:'triangle'});tone(783.99,0.9,{vol:0.05,delay:0.45,type:'triangle'});},
  reveal(){[0,2,4,5,7,9,11].forEach((k,i)=>glassNote(PENTA[k],i*0.09,0.11));nz(0.8,{f:300,q:0.5,vol:0.05});},
  swap(){glassNote(PENTA[6],0,0.1);glassNote(PENTA[8],0.12,0.1);SND.bell(0.2);},
  moon(){[0,2,4,7,9,12].forEach((k,i)=>glassNote(PENTA[k]/2,i*0.16,0.12));[261.6,329.6,392].forEach(f=>tone(f,2.6,{vol:0.05,at:0.4,type:'triangle'}));},
  rbNote(i){glassNote(PENTA[clamp(3+i,0,12)],0,0.07);},
  whee(){tone(800,0.4,{to:1600,vol:0.04});},
  puff(){nz(0.3,{f:400,q:0.6,vol:0.05});}
};

/* ---------------- persistent stars ---------------- */
const SKEY='gf261030-11-stars';
let STARS=[];
function loadStars(){
  try{const raw=window.localStorage.getItem(SKEY);if(!raw)return;const v=JSON.parse(raw);
    if(Array.isArray(v))STARS=v.filter(s=>s&&typeof s==='object'&&Array.isArray(s.h)).slice(-30).map(s=>({h:s.h.filter(n=>typeof n==='number').slice(0,6),n:+s.n||1,g:+s.g||0}));

/* ---------------- graph / world ---------------- */
let G=null,S=null,T=null,AG=[],PT=[],FLY=[];
let SPEED=1;
function newGraph(){return{nodes:[],nm:new Map(),edges:[],rbs:[],pads:[],lands:{},knots:[],nid:1,eid:1,rid:1,ver:1,adj:null};}
function addNode(x,y,land,tag,o){const n=Object.assign({id:G.nid++,x,y,land,tag,landing:false,hidden:false},o||{});G.nodes.push(n);G.nm.set(n.id,n);G.ver++;G.adj=null;return n;}
function N(id){return G.nm.get(id);}
function addEdge(a,b,type,o){const e=Object.assign({id:G.eid++,a:a.id,b:b.id,type},o||{});G.edges.push(e);G.ver++;G.adj=null;return e;}
function removeEdge(e){const i=G.edges.indexOf(e);if(i>=0)G.edges.splice(i,1);G.ver++;G.adj=null;}
function relinkLand(lid){
  const L=G.lands[lid];if(!L)return;
  for(let i=G.edges.length-1;i>=0;i--){const e=G.edges[i];if(e.type==='ground'&&e.land===lid)G.edges.splice(i,1);}
  const ns=G.nodes.filter(n=>n.land===lid&&!n.hidden).sort((a,b)=>a.x-b.x);
  for(let i=0;i+1<ns.length;i++){const a=ns[i],b=ns[i+1];addEdge(a,b,'ground',{land:lid,pts:[{x:a.x,y:a.y},{x:b.x,y:b.y}]});}
  G.ver++;G.adj=null;
}
function buildAdj(){
  G.adj=new Map();for(const n of G.nodes)G.adj.set(n.id,[]);
  for(const e of G.edges){const A=G.adj.get(e.a),B=G.adj.get(e.b);if(!A||!B)continue;A.push({e,to:e.b,fwd:true});B.push({e,to:e.a,fwd:false});}
}
function edgeGeom(e){
  const ver=e.rb?e.rb.ver:0;
  if(e._g&&e._gv===ver)return e._g;
  let pts;
  if(e.rb){pts=[];const s=e.i0<e.i1?1:-1;for(let i=e.i0;;i+=s){pts.push(e.rb.pts[i]);if(i===e.i1)break;}}
  else pts=e.pts;
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  e._g={pts,cum,len:Math.max(0.001,cum[cum.length-1])};e._gv=ver;return e._g;
}
function edgeLen(e){return edgeGeom(e).len;}
function edgePoint(e,s,fwd){
  const g=edgeGeom(e);let d=fwd?s:g.len-s;d=clamp(d,0,g.len);
  const cum=g.cum,p=g.pts;let lo=0,hi=cum.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=d)lo=m;else hi=m;}
  const seg=Math.max(0.0001,cum[hi]-cum[lo]);const t=(d-cum[lo])/seg;
  const a=p[lo],b=p[hi];let dx=b.x-a.x,dy=b.y-a.y;if(!fwd){dx=-dx;dy=-dy;}
  return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),dx,dy};
}
function edgeOK(kind,e){
  if(e.type==='stairs')return kind!=='turtle'&&kind!=='train'&&S.sweetsOpen;
  if(e.type==='rainbow'){const rb=e.rb;if(!rb.solid)return false;if(kind==='turtle'&&rb.high)return false;}
  const a=N(e.a),b=N(e.b);if(!a||!b||a.hidden||b.hidden)return false;
  return true;
}
function edgeCost(kind,e){
  let L=edgeLen(e);
  if(e.type==='rainbow'){if(e.rb.high&&kind==='chick')L*=0.5;if(!e.rb.high&&kind==='turtle')L*=0.9;}
  if(e.type==='stairs')L*=1.4;
  return L+4;
}
function dijkstra(from,kind){
  if(!G.adj)buildAdj();
  const dist=new Map(),prev=new Map(),done=new Set();dist.set(from,0);
  const open=[from];
  while(open.length){
    let bi=0;for(let i=1;i<open.length;i++)if(dist.get(open[i])<dist.get(open[bi]))bi=i;
    const u=open.splice(bi,1)[0];if(done.has(u))continue;done.add(u);
    const du=dist.get(u);const adj=G.adj.get(u)||[];
    for(const a of adj){if(!edgeOK(kind,a.e))continue;const nd=du+edgeCost(kind,a.e);
      if(!dist.has(a.to)||nd<dist.get(a.to)){dist.set(a.to,nd);prev.set(a.to,a);open.push(a.to);}}
  }
  return{dist,prev};
}
function findPath(from,to,kind){
  if(from==null||to==null)return null;if(from===to)return[];
  const r=dijkstra(from,kind);if(!r.dist.has(to))return null;
  const path=[];let cur=to;
  while(cur!==from){const a=r.prev.get(cur);if(!a)return null;path.unshift({e:a.e,fwd:a.fwd});cur=a.fwd?a.e.a:a.e.b;}
  return path;
}
function canReach(kind,from,to){return findPath(from,to,kind)!==null;}

/* ---------------- world build ---------------- */
const LANDKIND={start:'grass',meadow:'grass',plaza:'plaza',sky:'cloud',sweet:'sweet'};
function buildWorld(seed){
  G=newGraph();const R=mulberry(seed);const J=a=>(R()*2-1)*a;
  const pondR=490+J(18),ravL=980+J(18),ravR=1212+J(12),bakeY=430+J(28),bx0=1060+J(14);
  G.seed=seed;
  G.geo={pondL:290,pondR,ravL,ravR,bakeY,bx0,bx1:bx0+330,plazaEnd:1890,moon:{x:640+J(50),y:1230+J(40)}};
  G.lands={
    start:{id:'start',x0:-560,x1:290,y:0},
    meadow:{id:'meadow',x0:pondR,x1:ravL,y:0},
    plaza:{id:'plaza',x0:ravR,x1:2400,y:0},
    sky:{id:'sky',x0:bx0,x1:bx0+330,y:bakeY},

  };
  const g=G.geo,nd={};G.nd=nd;

  nd.M1=addNode(pondR+104,0,'meadow','land',{landing:true});
  nd.M2=addNode(pondR+228+J(12),0,'meadow','land',{landing:true});
  nd.M3=addNode(ravL-140+J(10),0,'meadow','land',{landing:true});
  nd.padB=addNode(ravL-62,0,'meadow','pad',{hidden:true});
  nd.mEnd=addNode(ravL-14,0,'meadow','edge');
  nd.D=addNode(bx0+22,bakeY,'sky','pad');
  nd.C=addNode(bx0+112,bakeY,'sky','land',{landing:true});
  nd.bakeHome=addNode(bx0+232,bakeY,'sky','home');
  nd.bellT=addNode(bx0+300,bakeY,'sky','bell');
  nd.pStart=addNode(ravR+14,0,'plaza','edge');
  nd.P1=addNode(ravR+72,0,'plaza','land',{landing:true});
  nd.drop=addNode(ravR+190,0,'plaza','drop');
  nd.P2=addNode(ravR+262+J(10),0,'plaza','land',{landing:true});
  nd.P3=addNode(ravR+410+J(10),0,'plaza','land',{landing:true});
  nd.carousel=addNode(ravR+500,0,'plaza','carousel');
  nd.padE=addNode(1838,0,'plaza','pad');
  nd.sL=addNode(ravL+52,-150,'sweet','edge',{hidden:true});
  nd.sMid=addNode((ravL+ravR)/2,-150,'sweet','mid',{hidden:true});
  nd.sR=addNode(ravR-52,-150,'sweet','edge',{hidden:true});
  nd.moon=addNode(g.moon.x,g.moon.y,'moon','moon',{landing:true,hidden:true});
  const pad=(node,dir,kind,o)=>{const p=Object.assign({node:node.id,dir,kind,hidden:!!node.hidden,bounce:0,t:0},o||{});node.pad=p;G.pads.push(p);return p;};
  G.pA=pad(nd.padA,1,'spring');G.pB=pad(nd.padB,1,'petal');G.pD=pad(nd.D,-1,'spoon');G.pE=pad(nd.padE,-1,'turn');G.pM=pad(nd.moon,-1,'home');
  for(const k in G.lands)relinkLand(k);
  G.var={deco:Math.floor(R()*3),bellHue:[48,330,200][Math.floor(R()*3)],rabbit:R()<0.28,cake:Math.floor(R()*3),tint:J(12)};
  G.tiles=genTiles(R);
  G.flowers=genFlowers(R);
}

/* ---------- stained-glass tile generation ---------- */
function jgrid(R,x0,x1,rows,colW,jit,fixTop){
  const xs=[x0];let x=x0;while(x<x1-colW*0.6){x+=colW*(0.75+R()*0.5);xs.push(Math.min(x,x1));}if(xs[xs.length-1]<x1)xs.push(x1);
  const V=[];for(let j=0;j<rows.length;j++){V[j]=[];for(let i=0;i<xs.length;i++){
    const ex=(i===0||i===xs.length-1)?0:J2(R,jit);const ey=(j===0&&fixTop)?0:J2(R,jit*0.7);
    V[j][i]={x:xs[i]+ex,y:rows[j]+ey};}}
  return V;
}
function J2(R,a){return (R()*2-1)*a;}
function gridTiles(V,colorFn){const out=[];for(let j=0;j+1<V.length;j++)for(let i=0;i+1<V[j].length;i++){out.push({p:[V[j][i],V[j][i+1],V[j+1][i+1],V[j+1][i]],c:colorFn(j,i),x0:V[j][i].x,x1:V[j][i+1].x});}return out;}
function pick(R,a){return a[Math.floor(R()*a.length)];}
function genTiles(R){
  const T={};const g=G.geo;
  const grass=['#7fd37a','#9be38a','#6cc58b','#a8e07c','#86d9a0'];
  const soil=[['#e7b77f','#d9a06a','#f0c48e'],['#c98f6b','#b97d64','#d49a76'],['#9e7aa8','#8c6f9f','#ad86b3'],['#6f6aa0','#605d93','#7b74ad'],['#4f5288','#47497c']];
  const plazaTop=['#ffb3c7','#ffd0dc','#ff9eb6','#ffe0b8','#ffc4a8'];
  const rowsG=[0,-24,-90,-170,-260,-380,-540];
  const col=(top)=>(j)=>j===0?pick(R,top):pick(R,soil[Math.min(j-1,soil.length-1)]);
  const L=G.lands;
  T.start=gridTiles(jgrid(R,L.start.x0,L.start.x1,rowsG,52,9,true),col(grass));
  T.meadow=gridTiles(jgrid(R,L.meadow.x0,L.meadow.x1,rowsG,50,9,true),col(grass));
  T.plaza=gridTiles(jgrid(R,L.plaza.x0,L.plaza.x1,rowsG,48,9,true),col(plazaTop));
  // pond (water) and ravine
  T.pond=gridTiles(jgrid(R,g.pondL,g.pondR,[-8,-50,-100,-150],46,8,false),(j)=>pick(R,[['#7fd0f0','#94dcf5','#6cc3ea'],['#5bb2e0','#6bbde6'],['#4a95cf','#5aa2d8']][j]));
  T.pondBed=gridTiles(jgrid(R,g.pondL,g.pondR,[-150,-260,-380,-540],50,8,false),(j)=>pick(R,soil[2+Math.min(j,2)]));
  T.ravine=gridTiles(jgrid(R,g.ravL,g.ravR,[0,-70,-150,-240,-330,-430,-540],46,10,false),(j)=>pick(R,[['#c4b8ef','#b5a8e8'],['#a99be0','#9d90d8'],['#8d82cc','#8378c4'],['#7569b8','#6d62ae'],['#5d5aa0','#55528f'],['#4b4b84']][Math.min(j,5)]));

/* ---------------- rainbows ---------------- */
const RBC=['#ff7d9e','#ffae62','#ffe46e','#8be6a0','#6ecbff','#ab90ff'];
const RBW=30;
function arcPts(o,t,c,special){
  const dx=t.x-o.x,dy=t.y-o.y,adx=Math.abs(dx);
  let h=28+230*c+0.07*adx;if(dy>150)h*=0.5;if(special==='moon')h=160;if(special==='home')h=60;
  const top=Math.max(o.y,t.y)+h;const D=top-o.y,a=dy;const B=4*D-2*a;const b=(B+Math.sqrt(Math.max(0,B*B-4*a*a)))/2;
  const n=clamp(Math.round((adx+h*2+Math.abs(dy))/13),18,170);
  const pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push({x:o.x+dx*u,y:o.y+a*u+b*u*(1-u)});}
  return pts;
}
function newRainbow(o,t,c,special){
  const rb={id:G.rid++,pts:arcPts(o,t,c,special),high:c>=0.45||special==='moon',c,a:o.id,b:t.id,ver:1,solid:false,reveal:0,born:S.t,moon:special==='moon',glow:0,anim:null,tap:-9,cut:[]};
  const R=mulberry(rb.id*977+G.seed);let i=2;while(i<rb.pts.length-2){rb.cut.push(i);i+=3+Math.floor(R()*3);}
  G.rbs.push(rb);return rb;
}
function rbNormals(rb){
  if(rb._n&&rb._nv===rb.ver)return rb._n;
  const p=rb.pts,n=p.length,dir=p[n-1].x>=p[0].x?1:-1;const out=new Array(n);
  for(let i=0;i<n;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(n-1,i+1)];let tx=b.x-a.x,ty=b.y-a.y;const l=hyp(tx,ty)||1;tx/=l;ty/=l;out[i]=dir>0?{x:ty,y:-tx}:{x:-ty,y:tx};}
  rb._n=out;rb._nv=rb.ver;return out;
}
function rbEdges(rb){return G.edges.filter(e=>e.rb===rb);}
function rbNodeIdx(rb){const m=[];for(const e of rbEdges(rb)){m.push({i:e.i0,n:e.a},{i:e.i1,n:e.b});}return m;}
function nearestIdx(rb,x,y){let bi=0,bd=1e9;for(let i=0;i<rb.pts.length;i++){const d=hyp(rb.pts[i].x-x,rb.pts[i].y-y);if(d<bd){bd=d;bi=i;}}return bi;}
function knotOnRainbow(rb,idx){
  for(const m of rbNodeIdx(rb)){if(Math.abs(m.i-idx)<=4)return N(m.n);}
  for(const e of rbEdges(rb)){
    const lo=Math.min(e.i0,e.i1),hi=Math.max(e.i0,e.i1);
    if(idx>lo&&idx<hi){
      const p=rb.pts[idx];const k=addNode(p.x,p.y,null,'knot',{refs:[{rb,i:idx}],born:S.t});
      removeEdge(e);
      const a=N(e.a),b=N(e.b);
      addEdge(a,k,'rainbow',{rb,i0:e.i0,i1:idx});addEdge(k,b,'rainbow',{rb,i0:idx,i1:e.i1});
      return k;
    }
  }
  return null;
}
function linkKnot(k,rb,idx){
  for(const e of rbEdges(rb)){const lo=Math.min(e.i0,e.i1),hi=Math.max(e.i0,e.i1);
    if(idx>lo&&idx<hi){removeEdge(e);addEdge(N(e.a),k,'rainbow',{rb,i0:e.i0,i1:idx});addEdge(k,N(e.b),'rainbow',{rb,i0:idx,i1:e.i1});k.refs.push({rb,i:idx});return true;}}
  return false;
}
function deformRainbow(rb,idx,target){
  finishAnim(rb);
  const n=rb.pts.length,win=Math.max(5,Math.round(n*0.14));const dx=target.x-rb.pts[idx].x,dy=target.y-rb.pts[idx].y;
  const nodes=rbNodeIdx(rb).map(m=>m.i);const base=rb.pts.map(p=>({x:p.x,y:p.y}));const off=rb.pts.map(()=>({x:0,y:0}));
  for(let i=Math.max(1,idx-win);i<=Math.min(n-2,idx+win);i++){
    let w=0.5*(1+Math.cos(PI*(i-idx)/win));
    for(const ni of nodes){if(ni===idx)continue;const d=Math.abs(i-ni);if(d<7)w*=d/7;}
    off[i]={x:dx*w,y:dy*w};
  }

}
function finishAnim(rb){if(rb.anim){const a=rb.anim;for(let i=0;i<rb.pts.length;i++){rb.pts[i].x=a.base[i].x+a.off[i].x;rb.pts[i].y=a.base[i].y+a.off[i].y;}rb.anim=null;rb.ver++;}}
function stepRainbowAnims(dt){
  for(const rb of G.rbs){
    if(rb.anim){const a=rb.anim;a.t+=dt/0.7;const e=easeOutBack(a.t);
      for(let i=0;i<rb.pts.length;i++){rb.pts[i].x=a.base[i].x+a.off[i].x*e;rb.pts[i].y=a.base[i].y+a.off[i].y*e;}

}

/* proximity knots after a new rainbow becomes solid */
function proximityKnots(rb){
  const made=[];
  const n=rb.pts.length;const i0=Math.floor(n*0.15),i1=Math.ceil(n*0.85);
  for(const q of G.rbs){
    if(q===rb||!q.solid||q.moon)continue;if(made.length>=2)break;
    const m=q.pts.length;const j0=Math.floor(m*0.1),j1=Math.ceil(m*0.9);
    let bd=1e9,bi=-1,bj=-1;
    for(let i=i0;i<=i1;i+=1){const p=rb.pts[i];for(let j=j0;j<=j1;j++){const d=Math.abs(p.x-q.pts[j].x)+Math.abs(p.y-q.pts[j].y);if(d<bd){bd=d;bi=i;bj=j;}}}
    if(bi<0)continue;
    const p=rb.pts[bi],qp=q.pts[bj];const d=hyp(p.x-qp.x,p.y-qp.y);if(d>66)continue;
    // skip if both rainbows share an endpoint and closest point is near it
    let near=false;for(const sid of [q.a,q.b]){if(sid===rb.a||sid===rb.b){const sn=N(sid);if(sn&&hyp(sn.x-qp.x,sn.y-qp.y)<170)near=true;}}
    if(near)continue;
    // avoid existing nodes on either rainbow nearby
    let clash=false;for(const mm of rbNodeIdx(q))if(Math.abs(mm.i-bj)<=5)clash=true;for(const mm of rbNodeIdx(rb))if(Math.abs(mm.i-bi)<=5)clash=true;
    if(clash)continue;
    const K={x:(p.x+qp.x)/2,y:(p.y+qp.y)/2};
    if(G.knots.length+made.length>=7||G.knots.some(k=>hyp(k.x-K.x,k.y-K.y)<110)||made.some(k=>hyp(k.x-K.x,k.y-K.y)<110))continue;
    deformRainbow(rb,bi,K);deformRainbow(q,bj,K);
    const k=addNode(p.x,p.y,null,'knot',{refs:[],born:S.t});
    linkKnot(k,rb,bi);linkKnot(k,q,bj);
    k.x=K.x;k.y=K.y;
    made.push(k);
  }
  return made;
}

  for(const a of AG){if(!a.guest&&canReach(a.kind,a.node!=null?a.node:a.last,f.node)){a.guest=true;a.seatIdx=f.guests.length;f.guests.push(a.kind);a.thinkT=Math.min(a.thinkT,0.4);a.happy=1;}}
}
function seatPos(i){const f=S.fest;const off=[-118,118,-62,62,-170,170][i%6];return f.x+off;}
function tapCake(){
  const f=S.fest;if(!f)return;
  if(f.slices<=0){SND.tink();f.shake=0.4;return;}
  const seated=AG.filter(a=>a.seated);
  let tgt=null;if(seated.length){tgt=seated[f.next%seated.length];f.next++;}
  f.slices--;f.eaten++;f.shake=0.3;
  const x1=tgt?tgt.x:T.x,y1=tgt?tgt.y+40:T.y+60;
  FLY.push({kind:'slice',x0:f.x,y0:f.y+70,x1,y1,t:0,dur:0.6,onDone:()=>{if(tgt){tgt.eat=1.6;tgt.happy=1.6;}else{T.happy=1.5;}SND.munch();spark(x1,y1+10,10,'#ff8fb1',90,'heart');}});
  SND.pop();
  if(f.eaten===1)discover('d5b','cake shared');
}

  SND.moon();const m=G.nd.moon;focusBox(Math.min(m.x,G.nd.D.x)-220,G.nd.D.y-160,Math.max(m.x,G.nd.D.x)+220,m.y+160,3.2);
  T.recheck=0.5;S.log.push({k:'moonpad',t:+S.t.toFixed(1)});

function reachMoon(){
  S.moonReached=true;S.moonT=S.t;G.pM.hidden=false;SND.moon();later(1.2,()=>SND.success());
  discover('d7','moon + parade');
  const cols=[];for(const rb of G.rbs)if(rb.solid&&!rb.moon)cols.push((rb.id*53+(rb.high?0:180))%360);
  STARS.push({h:cols.slice(0,6),n:G.rbs.length,g:S.fest?S.fest.guests.length:0});if(STARS.length>30)STARS.shift();saveStars();
  S.newStar=S.t;

function startParade(){
  S.parade=true;
  for(const a of AG){a.job=null;a.route=a.moving?a.route:null;a.seated=false;a.trail=[];a.tour=paradeTour(a);a.tourI=0;a.thinkT=0.2+FX()*0.6;
    if(a.kind==='turtle')a.carry.lantern=true;if(a.kind==='rabbit')a.carry.star=true;if(a.kind==='chick'&&!a.carry.bell&&!agentByKind('squirrel').carry.bell)a.carry.bell=true;if(a.kind==='squirrel'&&a.carry.berry===0)a.carry.berry=1;}
}
function paradeTour(a){
  const pref=a.kind==='chick'?'high':a.kind==='turtle'?'low':'any';
  const ids=new Set();
  for(const rb of G.rbs){if(!rb.solid||rb.moon)continue;if(pref==='high'&&!rb.high)continue;if(pref==='low'&&rb.high)continue;ids.add(rb.a);ids.add(rb.b);}
  let list=[...ids].map(N).filter(n=>n&&!n.hidden).sort((p,q)=>p.x-q.x).slice(0,7);
  if(a.kind!=='turtle')list.push(G.nd.D,G.nd.moon);else list.push(G.nd.carousel);
  return list.map(n=>n.id);
}

/* ---------------- agent brains ---------------- */
function think(a){
  a.thinkT=0.5+FX()*0.4;
  if(a.busy>0||a.moving)return;
  const here=a.node;if(here==null)return;
  const ch=agentByKind('chick'),sq=agentByKind('squirrel');
  if(S.parade){
    while(a.tour&&a.tourI<a.tour.length){const id=a.tour[a.tourI];a.tourI++;if(id===here)continue;if(goTo(a,N(id),{type:'parade'}))return;}
    a.look={x:T.x,y:T.y};if(FX()<0.3)a.hop=1;return;
  }
  // waiting at relay knot
  if(a.job&&a.job.stay){
    const j=a.job;j.wt=(j.wt||0)+0.5;
    if(a.kind==='squirrel'&&j.type==='relay'){
      const chickComing=ch&&ch.job&&ch.job.type==='meet'&&ch.job.node===j.node;
      if((j.wt>14&&!chickComing)||j.wt>40){a.job=null;a.relayBlock=S.t+25;}
      else{a.look={x:ch?ch.x:a.x,y:ch?ch.y:a.y};return;}
    }else if(a.kind==='chick'&&j.type==='meet'){
      if(!(sq&&sq.job&&sq.job.type==='relay'&&sq.job.node===j.node)&&j.wt>3){a.job=null;}
      else{a.look={x:sq.x,y:sq.y};if(FX()<0.15){a.ringT=S.t;if(a.carry.bell)SND.bell();}return;}
    }else if(j.type==='seat'){
      // seated guests re-evaluate
      const want=wantsWork(a);if(!want){return;}
      a.job=null;a.seated=false;
    }else return;
  }
  if(a.kind==='chick')thinkChick(a,sq);
  else if(a.kind==='squirrel')thinkSquirrel(a,ch);
  else if(a.kind==='turtle')thinkTurtle(a);
  else if(a.kind==='rabbit')thinkRabbit(a);
}
function wantsWork(a){
  const sq=agentByKind('squirrel');
  if(a.kind==='chick')return a.carry.berry>0||(sq&&sq.job&&sq.job.type==='relay'&&a.carry.berry===0);
  if(a.kind==='squirrel')return a.carry.berry>0||a.ringPending||(S.fest&&S.fest.slices<4);
  return false;
}
function sitDown(a){
  const f=S.fest;if(!f)return false;
  if(a.node===f.node){a.job={type:'seat',stay:true,node:f.node};a.seated=true;if(S.disc.d5==null){discover('d5','festival cafe + guests');}return true;}
  return goTo(a,N(f.node),{type:'toSeat',onArrive:(b)=>{b.job={type:'seat',stay:true,node:f.node};b.seated=true;b.happy=1.2;SND.pop();if(S.disc.d5==null)discover('d5','festival cafe + guests');}});
}
function thinkChick(a,sq){
  const nd=G.nd;
  if(a.carry.bell&&!S.clockRung){
    if(goTo(a,nd.clock,{type:'clock',onArrive:ringClock})){a.happy=0.8;SND.peep();if(S.firstRainbow&&!S.chickGo){S.chickGo=true;focusBox(0,0,0,0,0,a);S.focus.until=S.t+30;S.focus.follow=a;}return;}
    a.look={x:T.x,y:T.y+30};a.wish=true;return;
  }
  a.wish=false;
  if(a.carry.berry>0){const d=destForBerry();const r=goToward(a,d,{type:'deliver',onArrive:(b)=>{if(b.node===d.id)deliverBerry(b);}});if(r!=='none')return;a.wish=true;return;}
  if(sq&&sq.job&&sq.job.type==='relay'&&a.carry.berry===0){
    const k=N(sq.job.node);if(k&&goTo(a,k,{type:'meet',stay:true,onArrive:(b)=>{b.job={type:'meet',stay:true,node:k.id,wt:0};}}))return;
  }
  if(S.fest&&a.guest&&FX()<0.85){if(sitDown(a))return;}
  // dual-show
  const dn=dualNode();
  if(dn&&FX()<0.7){if(slidePlay(a,dn))return;}
  if(FX()<0.45&&slidePlay(a,null))return;
  wander(a);
}
function slidePlay(a,target){
  const here=a.node;
  const cands=G.rbs.filter(rb=>rb.solid&&rb.high&&!rb.moon&&(!target||rb.a===target.id||rb.b===target.id));
  if(!cands.length)return false;
  const rb=cands[Math.floor(FX()*cands.length)];
  const A=N(rb.a),B=N(rb.b);
  let top,bot;
  if(target){bot=target;top=target.id===A.id?B:A;}else{if(A.y>B.y+50){top=A;bot=B;}else if(B.y>A.y+50){top=B;bot=A;}else{const r=FX()<0.5;top=r?A:B;bot=r?B:A;}}
  if(!canReach('chick',here,top.id))return false;
  const slideDown=(b)=>{
    const p=findPathRb(top.id,bot.id,rb);if(p&&p.length){b.route=p;b.ri=0;b.s=0;b.last=b.node;b.node=null;b.moving=true;b.job={type:'slide',node:bot.id};SND.whee();}
  };
  if(here===top.id){slideDown(a);return true;}
  return goTo(a,top,{type:'toSlide',onArrive:slideDown});
}
function findPathRb(from,to,rb){
  if(!G.adj)buildAdj();
  const prev=new Map();const q=[from];const seen=new Set([from]);
  while(q.length){const u=q.shift();if(u===to)break;for(const x of (G.adj.get(u)||[])){if(x.e.rb!==rb||seen.has(x.to))continue;seen.add(x.to);prev.set(x.to,x);q.push(x.to);}}
  if(!seen.has(to))return null;const p=[];let c=to;while(c!==from){const x=prev.get(c);p.unshift({e:x.e,fwd:x.fwd});c=x.fwd?x.e.a:x.e.b;}return p;
}
function wander(a){
  const here=a.node;const r=dijkstra(here,a.kind);const ids=[...r.dist.keys()].filter(id=>{const n=N(id);return n&&!n.hidden&&n.tag!=='moon'&&id!==here&&r.dist.get(id)<520;});
  if(ids.length&&FX()<0.55){const id=ids[Math.floor(FX()*ids.length)];goTo(a,N(id),{type:'wander'});a.thinkT=1.5+FX()*2;return;}
  a.thinkT=1.2+FX()*2;a.look=null;
}
function thinkSquirrel(a,ch){
  const nd=G.nd;
  if(a.ringPending){const r=goToward(a,nd.bellT,{type:'bell',onArrive:(b)=>{if(b.node===nd.bellT.id){b.ringPending=false;ringBakery(b);}}});if(r!=='none')return;a.ringPending=false;}
  if(a.carry.berry===0){
    if(a.node===nd.bakeHome.id){if(loadBerry(a))return;}
    else{const r=goToward(a,nd.bakeHome,{type:'home'});if(r!=='none')return;}
    if(S.fest&&a.guest&&!(S.fest.slices<4)){if(sitDown(a))return;}
    if(FX()<0.3)wander(a);return;
  }
  // has berries
  if(!S.bakeryConn){a.look={x:nd.drop.x,y:0};a.wish=true;return;}
  a.wish=false;
  if(!(a.relayBlock>S.t)&&ch&&ch.carry.berry===0&&ch.busy<=0&&!(ch.carry.bell&&!S.clockRung)){
    const from=a.node;
    for(let i=G.knots.length-1;i>=0;i--){const k=G.knots[i];
      if(k.id===from)continue;
      if(canReach('squirrel',from,k.id)&&canReach('chick',ch.node!=null?ch.node:ch.last,k.id)){
        if(goTo(a,k,{type:'relay',stay:true,onArrive:(b)=>{b.job={type:'relay',stay:true,node:k.id,wt:0};SND.chitter();}})){ch.thinkT=Math.min(ch.thinkT,0.2);if(S.disc.d2==null)checkD2(a);return;}
      }}
  }
  const d=destForBerry();
  const r=goToward(a,d,{type:'deliver',onArrive:(b)=>{if(b.node===d.id)deliverBerry(b);}});
  if(r!=='none'){if(S.disc.d2==null)checkD2(a);return;}
  a.wish=true;a.look={x:d.x,y:d.y};
}
function checkD2(a){
  if(S.bakeryByLong){S.squirrelDown=true;later(2.5,()=>{if(S.disc.d2==null){discover('d2','long press -> bakery, squirrel brings strawberries');SND.success();}});focusBox(0,0,0,0,0,a);S.focus.until=S.t+5;S.focus.follow=a;}
}
function thinkTurtle(a){
  const nd=G.nd;
  if(!S.turtleCar){
    const r=goToward(a,nd.carousel,{type:'carousel',onArrive:(b)=>{if(b.node===nd.carousel.id)turtleArrive(b);}});
    if(r==='full'){a.happy=0.6;SND.bloop();return;}
    if(r==='part')return;
    a.wish=true;return;
  }
  a.wish=false;
  if(S.fest&&a.guest&&FX()<0.8){if(sitDown(a))return;}
  // stroll low rainbows
  const lows=G.rbs.filter(rb=>rb.solid&&!rb.high&&!rb.moon);
  if(lows.length&&FX()<0.5){const rb=lows[Math.floor(FX()*lows.length)];const tgt=N(FX()<0.5?rb.a:rb.b);if(tgt&&goTo(a,tgt,{type:'stroll'}))return;}
  if(a.node!==nd.carousel.id&&FX()<0.5){goTo(a,nd.carousel,{type:'home'});return;}
  a.thinkT=3;
}
function turtleArrive(a){
  if(S.turtleCar)return;S.turtleCar=true;S.carT=S.t;S.carFig.push('turtle');a.happy=2;a.busy=1.5;
  SND.success();for(let i=0;i<6;i++)glassNote(PENTA[(i*2)%12],0.5+i*0.12,0.07);
  const n=G.nd.carousel;spark(n.x,n.y+120,30,'#fff3a8',160,'star');focusBox(n.x-300,-120,n.x+300,320,3.5);
  discover('d4','turtle via '+a.lowCount+' low rainbows');

function thinkRabbit(a){
  if(S.fest&&a.guest&&FX()<0.6){if(sitDown(a))return;}
  if(FX()<0.5&&slidePlay(a,null))return;
  wander(a);

/* ---------------- train ---------------- */
function newTrain(){
  const n=G.nd.padA;
  return{x:n.x,y:n.y,node:n.id,last:n.id,route:null,ri:0,s:0,face:1,tilt:0,state:'wait',charge:0,holdT:0,pid:null,sq:0,sqv:0,
    hist:[],flight:null,land:0,happy:0,blink:2,look:null,recheck:0,waitT:0,hop:0,hopV:0,spin:0,pending:null};
}
const TSPD=140;
function trainGo(node){
  if(!node||T.state==='fly'||T.state==='charge')return false;
  const from=T.node!=null?T.node:T.last;
  const p=findPath(from,node.id,'train');if(p===null)return false;
  if(p.length===0){T.node=node.id;trainArrive();return true;}
  T.route=p;T.ri=0;T.s=0;T.last=from;T.node=null;T.state='move';return true;
}
function trainArrive(){
  T.route=null;T.state='wait';T.waitT=0;
  const n=N(T.node);if(n&&n.pad){if(T.face!==n.pad.dir){T.spin=1;}T.face=n.pad.dir;n.pad.bounce=0.6;}
}
function landPad(lid){const p=G.pads.find(p=>!p.hidden&&N(p.node).land===lid&&(p.kind!=='home'));return p?N(p.node):null;}
function trainOriginType(){
  if(T.node!=null){const n=N(T.node);if(n.pad&&!n.pad.hidden)return{node:n,kind:n.pad.kind,reach:'pad'};if(n.tag==='knot')return{node:n,kind:'knot',reach:'knot'};return{node:n,kind:'ground',reach:'ground'};}
  return null;
}
function candidates(origin,dir,kind,reach){
  const out=[];const maxDx=reach==='pad'?700:reach==='knot'?620:380;
  for(const n of G.nodes){
    if(!n.landing||n.hidden||n===origin)continue;
    if(n.tag==='moon'){if(kind!=='moon')continue;out.push({n,k:99});continue;}
    if(kind==='home')continue;
    const dx=n.x-origin.x,dy=n.y-origin.y;
    if(dx*dir<70||Math.abs(dx)>maxDx)continue;
    if(reach==='ground'&&dy>120)continue;
    out.push({n,k:Math.abs(dx)/1000+Math.max(0,dy)/450});
  }
  if(kind==='home')out.push({n:G.nd.tHome,k:1});
  out.sort((a,b)=>a.k-b.k);return out;
}
function chooseTarget(origin,dir,c,kind,reach){
  let cs=candidates(origin,dir,kind,reach),d=dir;
  if(!cs.length&&kind!=='home'&&reach!=='pad'){cs=candidates(origin,-dir,kind,reach);d=-dir;}
  if(!cs.length)return null;
  const f=clamp((c-0.15)/0.7,0,1);const idx=Math.round(f*(cs.length-1));
  return{node:cs[idx].n,dir:d,n:cs.length,idx};
}
function chargeFromHold(ms){return clamp((ms-110)/650,0,1);}
function trainPress(pid){
  if(T.state==='fly'||T.state==='land'||S.dawn>=0)return false;
  T.pending={route:T.route,ri:T.ri,s:T.s,node:T.node,state:T.state};
  T.state='charge';T.pid=pid;T.holdT=0;T.charge=0;T.sqv-=0.6;
  SND.squish();SND.chargeStart();S.flash=Math.max(S.flash,0.25);
  return true;
}
function trainCancel(){
  if(T.state!=='charge')return;SND.chargeStop();const p=T.pending;T.pid=null;
  if(p&&p.route){T.route=p.route;T.ri=p.ri;T.s=p.s;T.node=null;T.state='move';}else{T.state='wait';}
}
function trainRelease(){
  if(T.state!=='charge')return;SND.chargeStop();T.pid=null;
  const c=chargeFromHold(T.holdT*1000);T.charge=c;
  // origin
  let o=trainOriginType();
  if(!o){
    const st=T.route&&T.route[T.ri];
    if(st&&st.e.type==='rainbow'){
      const rb=st.e.rb;const idx=nearestIdx(rb,T.x,T.y);const pt=rb.pts[idx];
      const crowded=G.knots.length>=7||G.knots.some(q=>hyp(q.x-pt.x,q.y-pt.y)<110);
      let k=crowded?(()=>{const a=N(st.e.a),b=N(st.e.b);const ka=G.knots.filter(q=>hyp(q.x-pt.x,q.y-pt.y)<110)[0];return ka||(hyp(a.x-T.x,a.y-T.y)<hyp(b.x-T.x,b.y-T.y)?a:b);})():knotOnRainbow(rb,idx);
      if(k){if(k.tag==='knot')registerKnot(k);T.node=k.id;o={node:k,kind:k.tag==='knot'?'knot':(k.pad?k.pad.kind:'ground'),reach:k.tag==='knot'?'knot':(k.pad?'pad':'ground')};}
    }else if(st){
      const e=st.e;const lid=e.land||N(e.a).land;
      if(lid){let near=G.nodes.find(n=>n.land===lid&&!n.hidden&&hyp(n.x-T.x,n.y-T.y)<36);
        if(!near){near=addNode(T.x,G.lands[lid].y,lid,'spot');relinkLand(lid);}
        T.node=near.id;o={node:near,kind:near.pad?near.pad.kind:'ground',reach:near.pad?'pad':'ground'};}
    }
  }
  T.route=null;
  if(!o){trainHop(c);return;}
  if(o.node.pad&&!o.node.pad.hidden){T.face=o.node.pad.dir;}
  const tg=chooseTarget(o.node,T.face,c,o.kind,o.reach);
  if(!tg){trainHop(c);return;}
  if(o.node.id===G.nd.padB.id){if(c<0.3)S.usedB.short=true;if(c>0.7)S.usedB.long=true;}
  T.face=tg.dir;
  const special=tg.node.tag==='moon'?'moon':(o.kind==='home'?'home':null);
  const high=c>=0.45||special==='moon';
  let rb=special?null:findRainbow(o.node.id,tg.node.id,high);
  if(!rb&&!special&&G.rbs.filter(r=>r.solid).length>=24)rb=findRainbow(o.node.id,tg.node.id,!high);
  let reuse=!!rb,pts;
  if(!rb){rb=newRainbow(o.node,tg.node,c,special);}
  pts=rb.a===o.node.id?rb.pts:rb.pts.slice().reverse();
  const len=pts.reduce((s,p,i)=>i?s+hyp(p.x-pts[i-1].x,p.y-pts[i-1].y):0,0);
  T.flight={rb,pts,reuse,t:0,dur:special==='moon'?3.0:special==='home'?2.6:0.75+len/1100,from:o.node.id,to:tg.node.id,c,special};
  T.state='fly';T.node=null;T.sqv=-3.2-2.5*c;
  SND.boing(c);spark(T.x,T.y+20,10+Math.round(c*10),'#ffffff',90+c*80);
  S.lastJumpC=c;
}
function trainHop(c){T.state='wait';T.hopV=260+200*c;T.hop=0.001;SND.hop();T.sqv=-2;const ch=agentByKind('chick');if(ch&&hyp(ch.x-T.x,ch.y-T.y)<400){ch.hop=1;SND.peep();}
  if(T.node==null){const st=T.pending;if(st&&st.route){T.route=st.route;T.ri=st.ri;T.s=st.s;T.state='move';}}}
function trainLand(){
  const f=T.flight;T.flight=null;const rb=f.rb;
  T.node=f.to;T.last=f.to;const n=N(f.to);T.x=n.x;T.y=n.y;T.state='land';T.land=0.45;T.sqv+=3+2*f.c;T.happy=1;T.tilt=0;
  SND.land(rb.high);spark(n.x,n.y+10,16,'#fff4b0',150);
  if(f.special==='home'){startDawn();return;}
  if(!f.reuse){
    rb.solid=true;rb.reveal=1;rb.ver++;
    addEdge(N(rb.a),N(rb.b),'rainbow',{rb,i0:0,i1:rb.pts.length-1});
    S.rbCount++;
    const ks=proximityKnots(rb);for(const k of ks)registerKnot(k);
    onRainbowSolid(rb);
  }else{rb.tap=S.t;const la=landOfNode(rb.a),lb=landOfNode(rb.b);if((la==='plaza'||lb==='plaza')&&S.berries>0&&!S.fest){later(0.6,()=>{if(!S.fest)startFestival(rb);});}}
  if(f.special==='moon'){reachMoon();T.face=-1;return;}
  // cheer nearby
  for(const a of AG){if(hyp(a.x-n.x,a.y-n.y)<260){a.hop=1;a.happy=1;}}
  const ch=agentByKind('chick');if(ch&&hyp(ch.x-n.x,ch.y-n.y)<260)SND.peep();
}
function landOfNode(id){const n=N(id);return n?n.land:null;}
function onRainbowSolid(rb){
  const la=landOfNode(rb.a),lb=landOfNode(rb.b);
  if(!S.firstRainbow){S.firstRainbow=true;S.log.push({k:'first',t:+S.t.toFixed(1),info:rb.high?'high':'low'});}
  const toSky=la==='sky'||lb==='sky',toPlaza=la==='plaza'||lb==='plaza';

/* ---------- train recommendation ---------- */
function turtleNeedsLow(l1,l2){
  if(S.turtleCar)return false;
  const pairs=[['start','meadow'],['meadow','plaza']];
  for(const p of pairs){
    const match=(l1===p[0]&&l2===p[1])||(l1===p[1]&&l2===p[0]);if(!match)continue;
    const have=G.rbs.some(rb=>rb.solid&&!rb.high&&((landOfNode(rb.a)===p[0]&&landOfNode(rb.b)===p[1])||(landOfNode(rb.a)===p[1]&&landOfNode(rb.b)===p[0])));
    if(!have)return true;
  }
  return false;
}
function padValue(p){
  const o=N(p.node);if(!o||o.hidden||p.hidden)return{v:-1};
  let best={v:0,press:'short'};
  for(const c of [0,0.5,1]){
    const tg=chooseTarget(o,p.dir,c,p.kind,'pad');if(!tg)continue;const t=tg.node;const high=c>=0.45;
    let v=0;const exist=t.tag==='moon'?S.moonReached:!!findRainbow(o.id,t.id,high);if(!exist)v+=1;
    const tl=t.land,ol=o.land;
    if(t.tag==='moon')v+=12;
    if(!S.firstRainbow)v+=3;
    if(!S.bakeryConn&&(tl==='sky'||ol==='sky'))v+=5;
    if(!S.plazaConn&&(tl==='plaza'||ol==='plaza'))v+=4;
    if(S.berries>0&&!S.fest&&(tl==='plaza'||ol==='plaza'))v+=7;
    if(!exist&&!high&&turtleNeedsLow(ol,tl))v+=3;
    if(S.knots===0&&ol==='sky'&&!exist)v+=2.5;
    if(S.disc.d6==null&&!exist){const c2=nodeClasses(o.id);if((high&&c2.lo&&!c2.hi)||(!high&&c2.hi&&!c2.lo))v+=2;}
    if(v>best.v+(c===0.5?0.4:0))best={v,press:c===0?'short':c===1?'long':'mid'};
  }
  return best;
}
function bestPad(){
  let bp=null,bv=-1,press='short';const from=T.node!=null?T.node:T.last;
  const r=dijkstra(from,'train');
  for(const p of G.pads){if(p.hidden)continue;if(!r.dist.has(p.node))continue;const pv=padValue(p);const v=pv.v-r.dist.get(p.node)/2500;if(v>bv){bv=v;bp=p;press=pv.press;}}
  return{pad:bp,v:bv,press};
}
function trainDecide(){
  if(T.state!=='wait')return;
  const here=N(T.node);if(!here)return;
  if(S.moonReached){return;}
  const b=bestPad();
  if(!b.pad){const lp=landPad(here.land);if(lp&&lp.id!==here.id)trainGo(lp);return;}
  if(b.pad.node===T.node){S.press=b.press;return;}
  const curV=here.pad&&!here.pad.hidden?padValue(here.pad).v:-1;
  if(curV>=0&&curV>=b.v+0.5&&here.pad){S.press=padValue(here.pad).press;return;}
  trainGo(N(b.pad.node));S.press=b.press;
}

function camTarget(){

  }

    const others=['d3','d4','d6'].filter(k=>S.disc[k]!=null).length;

  for(let i=FLY.length-1;i>=0;i--){const fl=FLY[i];fl.t+=dt/fl.dur;if(fl.kind==='petals'&&FX()<0.6){const p=flyPos(fl);PT.length<240&&PT.push({x:p.x+(FX()-0.5)*30,y:p.y+(FX()-0.5)*30,vx:(FX()-0.5)*30,vy:-10,life:0.8,max:0.8,s:4,c:['#ffb3d1','#ffd6e8','#fff3a8'][i%3],k:'petal',r:FX()*6});}

function updateAgent(a,dt){

  a.blink-=dt;if(a.blink<0)a.blink=2+FX()*3.5;
  if(a.moving&&a.route&&a.busy<=0){
    let st=a.route[a.ri];let g=edgeGeom(st.e);
    let p=edgePoint(st.e,a.s,st.fwd);
    let sp=KSPD[a.kind]*(S.clockRung&&(a.kind==='squirrel'||a.kind==='chick')&&a.carry.berry>0?1.3:1)*(S.parade?1.15:1);
    const l=hyp(p.dx,p.dy)||1;const slope=p.dy/l;a.sliding=false;
    if(st.e.type==='rainbow'){if(slope<-0.25&&(st.e.rb.high&&(a.kind==='chick'||a.kind==='rabbit'))){sp*=2.4;a.sliding=true;}else if(slope>0.3)sp*=0.75;}
    a.s+=sp*dt;
    while(a.s>=g.len){a.s-=g.len;onEdgeDone(a,st);a.ri++;
      if(a.ri>=a.route.length){a.node=st.fwd?st.e.b:st.e.a;a.last=a.node;const n=N(a.node);a.x=n.x;a.y=n.y;arrive(a);break;}
      st=a.route[a.ri];g=edgeGeom(st.e);}
    if(a.moving&&a.route){p=edgePoint(st.e,a.s,st.fwd);a.x=p.x;a.y=p.y;if(Math.abs(p.dx)>0.05)a.face=p.dx>0?1:-1;a.last=st.fwd?st.e.a:st.e.b;
      if(a.trail&&(a.trail.length===0||hyp(a.trail[a.trail.length-1].x-a.x,a.trail[a.trail.length-1].y-a.y)>8)){a.trail.push({x:a.x,y:a.y});if(a.trail.length>420)a.trail.shift();}

}

function drawCar(x,y,tilt,face,engine,hl){

function drawParticles(){

/* ---------------- lifecycle ---------------- */
const HIST=[];
function newCycle(){
  const cycle=S?S.cycle+1:0;if(S)HIST.push({cycle:S.cycle,t:+S.t.toFixed(1),log:S.log,disc:S.disc});
  let seed=(Date.now()^(Math.random()*1e9))>>>0;
  try{const m=/[?&]seed=(\d+)/.exec(location.search);if(m)seed=(+m[1]+cycle)>>>0;}catch(e){}
  buildWorld(seed);S=newState(cycle);T=newTrain();
  AG=[mkAgent('chick',G.nd.chickHome,{carry:{bell:true,berry:0},face:-1}),mkAgent('squirrel',G.nd.bakeHome,{carry:{bell:false,berry:1},face:-1}),mkAgent('turtle',G.nd.turtleHome,{face:1})];
  FLY.length=0;PT.length=0;cam.init=false;S.lastInput=-99;S.newStar=null;
  T.hist=[];for(let i=20;i>=0;i--)T.hist.push({x:T.x-i*5,y:0,tilt:0,face:1});
}
let last=0,raf=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);

}
function start(){
  resize();loadStars();newCycle();
  cv.addEventListener('pointerdown',onDown,{passive:false});
  cv.addEventListener('pointermove',onMove,{passive:false});
  cv.addEventListener('pointerup',onUp,{passive:false});
  cv.addEventListener('pointercancel',onCancel,{passive:false});

  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault());
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(raf);raf=0;if(T&&T.state==='charge')trainCancel();ptrs.clear();try{AU.c&&AU.c.suspend();}catch(e){}}
    else{last=0;if(!raf)raf=requestAnimationFrame(frame);try{AU.c&&AU.c.resume();}catch(e){}}
  });

}
/* test hooks (no UI) */
window.__rj={get G(){return G;},get S(){return S;},get T(){return T;},get AG(){return AG;},get cam(){return cam;},toScreen,toWorld,
  camTarget,padValue,chooseTarget,N:(id)=>G.nm.get(id),
