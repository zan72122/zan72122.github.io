<script>
(()=>{
'use strict';
// ============================================================ utils
const TAU=Math.PI*2, KZ=0.06;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const eob=t=>{t=clamp(t,0,1);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const eoc=t=>1-Math.pow(1-clamp(t,0,1),3);
const eio=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rand=Math.random;
const R=(a,b)=>a+(b-a)*rand(), RI=(a,b)=>Math.floor(a+(b-a+1)*rand()), pick=a=>a[Math.floor(rand()*a.length)];
const MR=(a,b)=>a+(b-a)*Math.random();
const KO=128, K=(x,y)=>(x+KO)*512+(y+KO), KX=k=>Math.floor(k/512)-KO, KY=k=>(k%512)-KO;
const D4=[[1,0],[0,1],[-1,0],[0,-1]];
const mod=(a,n)=>((a%n)+n)%n;
const RGBC=new Map();
function rgb(h){let c=RGBC.get(h);if(!c){const n=parseInt(h.slice(1),16);c=[n>>16&255,n>>8&255,n&255];RGBC.set(h,c);}return c;}
function shade(h,f){const c=rgb(h);return 'rgb('+Math.min(255,c[0]*f|0)+','+Math.min(255,c[1]*f|0)+','+Math.min(255,c[2]*f|0)+')';}
function mixh(a,b,t){const A=rgb(a),B=rgb(b);const r=Math.round(lerp(A[0],B[0],t)),g=Math.round(lerp(A[1],B[1],t)),bl=Math.round(lerp(A[2],B[2],t));return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rpoly(g,P,r){g.beginPath();const n=P.length;for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n];
  const d1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),d2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);const q=Math.min(r,d1/2,d2/2);
  const ax=p1[0]+(p0[0]-p1[0])*q/d1,ay=p1[1]+(p0[1]-p1[1])*q/d1,bx=p1[0]+(p2[0]-p1[0])*q/d2,by=p1[1]+(p2[1]-p1[1])*q/d2;
  if(i===0)g.moveTo(ax,ay);else g.lineTo(ax,ay);g.quadraticCurveTo(p1[0],p1[1],bx,by);}g.closePath();}

// ============================================================ palettes
const FAM=[
 {body:'#ffd447',belly:'#fff4c2',wing:'#ffb01f',acc:'#ff7aa8'},
 {body:'#79c6ff',belly:'#e4f5ff',wing:'#4b9ee6',acc:'#ffd447'},
 {body:'#ff9cc3',belly:'#ffe6f0',wing:'#f2709f',acc:'#7fd8ff'},
 {body:'#8be3a4',belly:'#e8fbe9',wing:'#4fc176',acc:'#ff9c6b'},
 {body:'#c3a3ff',belly:'#f1e9ff',wing:'#9a78f0',acc:'#ffe066'},
 {body:'#ffae73',belly:'#fff0e2',wing:'#ff8a45',acc:'#7ed7c1'},
];
const HOUSEC=[['#ff8fa3','#e0566f'],['#7fc8ff','#3f8fd9'],['#ffd166','#f09a3a'],['#9be7a8','#4fbf6d'],['#c9a7ff','#8a68e6'],['#ffb07a','#ef7f45']];
const BLOCKC=['#ff8fa3','#ffd166','#7fd3ff','#9be7a8','#c9a7ff','#ffb07a'];
const RAINBOW=['#ff5f6d','#ff9f43','#ffd93d','#6bd968','#4cc3ff','#5b7cff','#b07cff'];
const CLOUDC=['#ffffff','#fffaf1','#fff5fa','#f6fcff','#f8fff6'];
const PREF={
 parent:{swing:3,slide:.8,fountain:1,windmill:1,rainbow:1.4,bench:2.4,home:1.2},
 sister:{swing:1.3,slide:1.4,fountain:3.3,windmill:1,rainbow:3,bench:.8,home:.7},
 baby:{swing:2,slide:3.6,fountain:1.1,windmill:.8,rainbow:1.5,bench:.5,home:.9},
 kid:{swing:2.2,slide:2.2,fountain:1.8,windmill:1.4,rainbow:2,bench:.8,home:.8},
 windy:{swing:1.2,slide:1.4,fountain:1.5,windmill:3.8,rainbow:2.4,bench:.8,home:.6},
 cozy:{swing:2.8,slide:1,fountain:1.6,windmill:.8,rainbow:2.6,bench:2.6,home:.9},
};
const TYPES=['house','swing','fountain','windmill','slide'];

// ============================================================ audio (Web Audio synth)
const AU={c:null,m:null,nb:null,last:{}};
function auInit(){
  try{
    if(!AU.c){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;AU.c=new AC();
      const comp=AU.c.createDynamicsCompressor();comp.connect(AU.c.destination);
      AU.m=AU.c.createGain();AU.m.gain.value=.55;AU.m.connect(comp);
      const len=AU.c.sampleRate;const b=AU.c.createBuffer(1,len,AU.c.sampleRate);const d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;}
    if(AU.c.state!=='running'){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
}
const okA=()=>AU.c&&AU.c.state==='running';
function thr(n,ms){const t=performance.now();if(AU.last[n]&&t-AU.last[n]<ms)return false;AU.last[n]=t;return true;}
function tone(f,dur,type,vol,when,f2,att){if(!okA())return;try{const c=AU.c,t=c.currentTime+(when||0);const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+(att||.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.03);}catch(e){}}
function nz(dur,vol,ff,q,ft,when,ff2){if(!okA())return;try{const c=AU.c,t=c.currentTime+(when||0);const s=c.createBufferSource();s.buffer=AU.nb;
  const f=c.createBiquadFilter();f.type=ft||'bandpass';f.frequency.setValueAtTime(ff,t);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+dur);f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.m);s.start(t,Math.random()*.5);s.stop(t+dur+.03);}catch(e){}}
const PENTA=[392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093];
const SFX={
 pop(i,w){const f=PENTA[clamp(i|0,0,PENTA.length-1)];tone(f,.2,'triangle',.2,w);tone(f*3.01,.06,'sine',.05,w);},
 petan(){tone(230,.16,'sine',.45,0,90);nz(.08,.35,900,.8,'lowpass');tone(700,.08,'triangle',.12,.05);},
 lift(){tone(520,.1,'sine',.15,0,860);},
 back(){tone(700,.12,'sine',.12,0,360);},
 flap(){if(!thr('flap',90))return;nz(.06,.16,2400,1.2);nz(.06,.1,2000,1.2,'bandpass',.08);},
 chirp(p){if(!thr('chirp',80))return;p=p||1;tone(2100*p,.07,'sine',.12,0,2900*p);tone(2600*p,.08,'sine',.1,.08,1900*p);},
 drip(){if(!thr('drip',70))return;const f=700+Math.random()*700;tone(f,.06,'sine',.06,0,f*1.6);},
 splash(){tone(1000,.22,'sine',.3,0,180);nz(.3,.28,1600,.7,'bandpass',.02,400);tone(1500,.05,'sine',.1,.18,2300);},
 whee(){if(!thr('whee',500))return;tone(520,.35,'sine',.1,0,840);tone(840,.3,'sine',.07,.3,560);},
 slide(){if(!thr('slide',200))return;tone(1300,.6,'sine',.11,0,420);},
 boing(){tone(300,.18,'sine',.2,0,560);},
 pu(){if(!thr('pu',60))return;tone(330,.09,'sine',.12,0,260);},
 wind(){if(!thr('wind',500))return;nz(.6,.07,600,1.5,'bandpass',0,1300);},
 success(){[2,4,6,9].forEach((i,k)=>{tone(PENTA[i],.45,'triangle',.17,k*.09);tone(PENTA[i]*2,.25,'sine',.05,k*.09);});tone(PENTA[12],.7,'sine',.07,.42);},
 grand(){[2,4,5,6,7,9,10,12].forEach((i,k)=>{tone(PENTA[i],.55,'triangle',.16,k*.13);tone(PENTA[i]/2,.6,'sine',.09,k*.13);});},
 shutter(){nz(.05,.4,3000,1,'highpass');tone(1800,.05,'square',.04,.06);nz(.06,.3,2500,1,'highpass',.1);},
 sparkle(){for(let i=0;i<4;i++)tone(PENTA[8+i],.14,'sine',.05,i*.05);},
 nope(){if(!thr('nope',200))return;tone(260,.08,'sine',.1,0,230);},
};

// ============================================================ canvas & layout
const cv=document.getElementById('c'), G=cv.getContext('2d');
let W=1,H=1,DPR=1;const SA={t:0,r:0,b:0,l:0};
const tray={x:0,y:0,w:0,h:0,items:[]};
let VIEW={x:0,y:0,w:1,h:1};
const TW=64,TH=32,CH=38;
const CAM={x:0,y:0,z:1,vx:0,vy:0,init:false};
let RC=CAM;
let TS=1; // simulation time scale (test hook only)
function readSA(){try{const s=getComputedStyle(document.getElementById('sa'));SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0;}catch(e){}}
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);readSA();
  const port=H>=W;
  const th=port?clamp(H*.125,92,124):clamp(H*.15,96,124);
  const avail=W-SA.l-SA.r-16;
  tray.w=port?avail:Math.min(avail,Math.max(600,W*.6));tray.h=th;
  tray.x=SA.l+8+(avail-tray.w)/2;tray.y=H-SA.b-th-8;
  VIEW={x:SA.l+6,y:SA.t+8,w:W-SA.l-SA.r-12,h:tray.y-SA.t-16};
  tray.items=TYPES.map((t,i)=>{const sw=tray.w/TYPES.length;return {type:t,x:tray.x+sw*(i+.5),y:tray.y+th*.5,s:Math.min(sw*.9,th*.92),press:0,wig:0,hop:0};});
  bgDirty=true;camFit(true);
}

// ============================================================ sprites & projection
const SPR=new Map();
function spr(hex){
  let c=SPR.get(hex);if(c)return c;
  const Kk=2;c=document.createElement('canvas');c.width=TW*Kk;c.height=(TH+CH)*Kk;const g=c.getContext('2d');g.scale(Kk,Kk);
  const hw=TW/2,hh=TH/2;
  rpoly(g,[[hw,0],[TW,hh],[TW,hh+CH],[hw,TH+CH],[0,hh+CH],[0,hh]],9);g.save();g.clip();
  let gr=g.createLinearGradient(0,hh,0,TH+CH);gr.addColorStop(0,shade(mixh(hex,'#d6e4ff',.22),.98));gr.addColorStop(1,shade(mixh(hex,'#b9cdf5',.34),.88));
  g.fillStyle=gr;g.beginPath();g.moveTo(0,hh);g.lineTo(hw,TH);g.lineTo(hw,TH+CH);g.lineTo(0,hh+CH);g.closePath();g.fill();
  gr=g.createLinearGradient(0,hh,0,TH+CH);gr.addColorStop(0,shade(mixh(hex,'#c4d6fb',.3),.91));gr.addColorStop(1,shade(mixh(hex,'#a7bfee',.42),.8));
  g.fillStyle=gr;g.beginPath();g.moveTo(TW,hh);g.lineTo(hw,TH);g.lineTo(hw,TH+CH);g.lineTo(TW,hh+CH);g.closePath();g.fill();
  gr=g.createRadialGradient(hw*.75,hh*.6,2,hw,hh,hw);gr.addColorStop(0,shade(hex,1.1));gr.addColorStop(1,shade(hex,.99));
  g.fillStyle=gr;rpoly(g,[[hw,0],[TW,hh],[hw,TH],[0,hh]],7);g.fill();
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.beginPath();g.moveTo(4,hh+1.5);g.lineTo(hw,TH-.5);g.lineTo(TW-4,hh+1.5);g.stroke();
  g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.5;g.beginPath();g.moveTo(hw,TH+3);g.lineTo(hw,TH+CH-5);g.stroke();
  gr=g.createLinearGradient(0,TH+CH-12,0,TH+CH);gr.addColorStop(0,'rgba(40,60,120,0)');gr.addColorStop(1,'rgba(40,60,120,.13)');g.fillStyle=gr;g.fillRect(0,0,TW,TH+CH);
  g.restore();SPR.set(hex,c);return c;
}
const isoX=(x,y)=>(x-y)*TW/2, isoY=(x,y,z)=>(x+y)*TH/2-z*CH;
const SX=(x,y)=>(isoX(x,y)-RC.x)*RC.z+RC.vx;
const SY=(x,y,z)=>(isoY(x,y,z)-RC.y)*RC.z+RC.vy;
let DL=[];
function cube(x,y,z,s,hex,al,sq){
  sq=sq||1;const X=SX(x,y),Y=SY(x,y,z+s*sq);
  DL.push({k:x+y+s+(z+s*.5)*KZ,img:spr(hex),x:X-TW*.5*s*RC.z,y:Y,w:TW*s*RC.z,h:(TH*s+CH*s*sq)*RC.z,a:al==null?1:al});
}
function fnItem(k,f,o){DL.push({k,f,o});}
function wpath(g,pts){g.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];const X=SX(p[0],p[1]),Y=SY(p[0],p[1],p[2]);if(i)g.lineTo(X,Y);else g.moveTo(X,Y);}g.closePath();}

// ============================================================ world
let world=null, everTouched=false, everPlaced=false;
function emptyWorld(){
  return {cells:new Map(),homes:[],toys:[],benches:[],paths:new Map(),dying:[],birds:[],t:0,nid:1,phase:0,
    disc:{},visits:0,cross:0,occ:new Map(),soft:new Map(),box:{},theme:null,cloudB:null,bridge:null,
    bridgeAvail:false,camAvail:false,photoTaken:false,newCloudAvail:false,photoGather:null,
    firstTouch:false,lastAct:0,hintT:0,demoT:-99,combo:0,lastTap:-9,apT:0,arrT:0,bAnchor:null,
    limitBonus:0,checkT:0,popT:0,pending:[]};
}
function newWorld(){
  const seed=(Date.now()^Math.floor(Math.random()*4e9))>>>0;rand=mulberry(seed);
  world=emptyWorld();world.seed=seed;
  const fams=[0,1,2,3,4,5].sort(()=>rand()-.5);world.famOrder=fams;world.famNext=0;
  world.theme={a:pick(CLOUDC),b:pick(['#fff4fb','#f4f6ff','#fffbea','#f2fffb']),stone:pick(['#ffd9a0','#ffcfd9','#ffe7a1','#d7f0ff']),hs:R(0,1)};
  genA();
  world.lastAct=0;
  if(everTouched){world.pending.push({t:1.2,f:()=>moveIn()});}
}
function addCell(map,x,y,h,bot,cl,col){map.set(K(x,y),{x,y,h,bot,cl,col,vis:null,cc:null,sq:0});}
function boxOf(map,cl){const b={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,s0:1e9,s1:-1e9};for(const c of map.values()){if(c.cl!==cl)continue;b.x0=Math.min(b.x0,c.x);b.x1=Math.max(b.x1,c.x);b.y0=Math.min(b.y0,c.y);b.y1=Math.max(b.y1,c.y);b.s0=Math.min(b.s0,c.x+c.y);b.s1=Math.max(b.s1,c.x+c.y);}return b;}
function computeVis(map){
  for(const c of map.values()){
    c.vis=[];c.cc=[];
    for(let z=c.bot;z<c.h;z++){
      const nx=map.get(K(c.x+1,c.y)),ny=map.get(K(c.x,c.y+1));
      const cx=nx&&nx.bot<=z&&nx.h>z, cy=ny&&ny.bot<=z&&ny.h>z;
      if(z===c.h-1||!cx||!cy){c.vis.push(z);
        let col=c.col;if(z===c.h-1){if((c.x+c.y)&1)col=mixh(col,'#e8f1ff',.18);}else col=mixh(col,'#cfe0ff',clamp(.22+(c.h-1-z)*.08,0,.5));
        c.cc.push(col);}
    }
  }
}
function floodKeep(map,start){const keep=new Set([start]);const st=[start];while(st.length){const k=st.pop();const x=KX(k),y=KY(k);for(const[dx,dy]of D4){const n=K(x+dx,y+dy);if(map.has(n)&&!keep.has(n)){keep.add(n);st.push(n);}}}for(const k of [...map.keys()])if(!keep.has(k))map.delete(k);}
function genA(){
  const m=world.cells,col=world.theme.a;
  const cx=4+R(-.3,.3),cy=4+R(-.3,.3),r=3.25+R(0,.45);
  const ta=-Math.PI*3/4+R(-.75,.75),td=R(1.5,2.1);const tx=cx+Math.cos(ta)*td,ty=cy+Math.sin(ta)*td;
  const ba=ta+Math.PI*(rand()<.5?.6:-.6),bx=cx+Math.cos(ba)*2.2,by=cy+Math.sin(ba)*2.2;
  for(let x=-1;x<=9;x++)for(let y=-1;y<=9;y++){
    let d=Math.hypot(x+.5-cx,y+.5-cy);if(d>r-1)d+=R(-.4,.4);if(d>r)continue;
    const dt=Math.hypot(x+.5-tx,y+.5-ty);let h=1+(dt<2.45?1:0)+(dt<1.3?1:0);
    if(h===1&&Math.hypot(x+.5-bx,y+.5-by)<1.1)h=2;
    addCell(m,x,y,h,d<r-1.3?-2:-1,'A',col);
  }
  floodKeep(m,K(Math.floor(cx),Math.floor(cy)));
  const main=[...m.values()];
  // low satellite to the right (+x)
  const y0=Math.round(cy)+RI(-1,0);let mx=-1e9;for(const c of main)if(c.y===y0||c.y===y0+1)mx=Math.max(mx,c.x);
  const sh=RI(1,2);for(let i=0;i<2;i++)for(let j=0;j<2;j++)addCell(m,mx+3+i,y0+j,sh,sh-2,'A',col);
  // high satellite toward front-left (+y)
  const x0=Math.round(cx)+RI(-2,-1);let my=-1e9;for(const c of main)if(c.x===x0||c.x===x0+1)my=Math.max(my,c.y);
  const hh=RI(3,4);for(let i=0;i<2;i++)for(let j=0;j<2;j++)addCell(m,x0+i,my+3+j,hh,hh-2,'A',col);
  computeVis(m);world.box.A=boxOf(m,'A');
  // nest
  const cand=main.filter(c=>c.h===1&&Math.abs(c.x-c.y)<=2.5&&c.x+c.y>=cx+cy-.5);
  const nc=cand.length?pick(cand):main.filter(c=>c.h===1)[0]||main[0];
  const nest=makeHome('nest',nc.x,nc.y,'A',world.famOrder[world.famNext++],true);world.homes.push(nest);
  spawnFamily(nest,['parent','sister','baby'],true);
  rebuild();
}

// ============================================================ entities
function makeHome(kind,x,y,cl,fam,fixed){const hc=HOUSEC[fam%HOUSEC.length];
  return {id:world.nid++,isHome:true,kind,x,y,cl,fam,fixed,col:hc[0],roofc:hc[1],born:world.t,lifted:false,hide:false,tap:0,door:0,leaf:kind==='nest'?0:1,top:kind==='nest'?3.05:1.8};}
function makeToy(type,x,y,cl){

function heapPush(h,f,k){h.push([f,k]);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;const t=h[p];h[p]=h[i];h[i]=t;i=p;}}

    const x=KX(k),y=KY(k),c0=world.cells.get(k),g0=Gc.get(k);
    for(const d of D4){const nx=x+d[0],ny=y+d[1],nk=K(nx,ny);if(closed.has(nk))continue;const c=world.cells.get(nk);let cost;
      if(c){if(c.cl!==cl)continue;const dz=c0?Math.abs(c.h-c0.h):0;cost=(cur&&cur.has(nk))?.35+dz*.3:1+dz*.9;if(nk!==gk&&world.occ.has(nk))cost+=8;}

function addPathList(np,L,d0,cl){

    if(!p){p={k,x:KX(k),y:KY(k),z:zs[i],kind:world.cells.has(k)?'g':'b',links:new Set(),cl,delay:d0+i*.065,ord:i};np.set(k,p);}

function zAt(k){const p=world.paths.get(k);if(p&&p.kind!=='g')return p.z;const c=world.cells.get(k);return c?c.h:null;}
function walkable(k){if(world.cells.has(k))return true;const p=world.paths.get(k);return !!(p&&p.kind!=='g'&&p.g>=.95);}

  while(h.length&&n++<5000){const it=heapPop(h),k=it[1];if(closed.has(k))continue;closed.add(k);
    if(k===gk){const L=[k];let c=k;while(P.has(c)){c=P.get(c);L.push(c);}return L.reverse();}
    const x=KX(k),y=KY(k),z0=zAt(k),p0=world.paths.get(k),g0=Gc.get(k);

const chutePt=(g,u)=>({x:lerp(g.sx,g.ex,u),y:lerp(g.sy,g.ey,u),z:g.ez+(g.E-g.ez)*(1-u)*(1-u)});
function bridgeCells(d){

  if(!a||!b)return null;const L=[K(a.x,a.y)];let x=a.x,y=a.y;while(x+y-2>b.x+b.y){x--;y--;L.push(K(x,y));}L.push(K(b.x,b.y));

function bridgeLanes(){const out=[];if(!world.box.B)return out;for(let d=-8;d<=8;d++){const r=bridgeCells(d);if(r)out.push({d,r});}return out;}
function rebuild(){
  const w=world;computeOcc();

  for(const cl of ['A','B']){const hs=homesOf(cl);for(let i=1;i<hs.length;i++){let best=null;
    for(let j=0;j<i;j++){const r=buildPath(K(hs[j].x,hs[j].y),K(hs[i].x,hs[i].y),cl,null);if(r&&(!best||r.cost<best.cost))best={r,j};}

    t.homesLinked=[];t.pinfo={air:0,rise:0,len:0};t.shared=false;if(!hs.length)continue;
    const costs=[];for(const h of hs){if(t.roof===h){costs.push({h,cost:0});continue;}const r=buildPath(K(h.x,h.y),tk,t.cl,null);if(r)costs.push({h,cost:r.cost});}

    for(const c of tg){t.homesLinked.push(c.h);if(c.cost===0)continue;const r=buildPath(K(c.h.x,c.h.y),tk,t.cl,np);

      for(let i=0;i<L.length;i++){const k=L[i];const t=i/(L.length-1);let p=np.get(k);
        const z=Math.round((lerp(bc.a.h,bc.b.h,t)+Math.sin(t*Math.PI)*.45)*4)/4;
        if(!p){p={k,x:KX(k),y:KY(k),z:(i===0?bc.a.h:i===L.length-1?bc.b.h:z),kind:(i===0||i===L.length-1)?'g':'x',links:new Set(),cl:i===L.length-1?'B':'A',delay:.35+i*.14,ord:i};np.set(k,p);}

function diffPaths(np){const w=world,old=w.paths;

function interactions(){

      if(!f.rbSpot){let best=null;for(let ddx=-1;ddx<=1;ddx++)for(let ddy=-1;ddy<=1;ddy++){if(!ddx&&!ddy)continue;const k=K(f.x+ddx,f.y+ddy);const cc=w.cells.get(k);if(!cc||cc.cl!==f.cl||w.occ.has(k))continue;
        const sc=ddx*dx+ddy*dy;if(!best||sc>best.sc)best={sc,k,x:f.x+ddx+.5,y:f.y+ddy+.5};}if(best&&best.sc>-.3)f.rbSpot={x:best.x,y:best.y,k:best.k};}

}
function nearestWalkable(x,y,maxR){let best=null,bd=1e9;const r=maxR||4;

function flyTo(b,k){const z1=zAt(k);b.fly={x0:b.x,y0:b.y,z0:b.z,x1:KX(k)+.5+MR(-.15,.15),y1:KY(k)+.5+MR(-.15,.15),z1,t:0,d:.9};b.st='fly';b.route=null;b.u=null;b.hidden=false;b.sleep=0;}

const PART=[];const PMAX=260;

function burst(x,y,z,n,kind,cols){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=MR(.6,2.2);

function updParts(dt){
  for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.life-=dt;
    if(p.scr){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;if(p.life<=0)PART.splice(i,1);continue;}
    if(p.t==='drop'){p.vz-=6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const gz=groundZc(p.x,p.y);
      if(gz!=null&&p.z<=gz&&p.vz<0){if(Math.random()<.3)addP({t:'ring',x:p.x,y:p.y,z:gz+.02,vx:0,vy:0,vz:0,life:.35,max:.35,sz:.1});PART.splice(i,1);continue;}
      if(p.z<-4){PART.splice(i,1);continue;}}
    else if(p.t==='conf'){p.vz-=5*dt;p.vx*=.98;p.vy*=.98;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.rot+=dt*8;const gz=groundZc(p.x,p.y);if(gz!=null&&p.z<gz){p.z=gz;p.vz=0;p.vx=p.vy=0;}}

const DISC_KEYS=['bridge','spiral','rainbow','water','shared','twoclouds','popular'];
function discover(key,t,pos){const w=world;const x=pos?pos.x:t.x+.5,y=pos?pos.y:t.y+.5;const z=(groundZc(x,y)??1)+1.2;

function discChecks(b,t,kind){

// ============================================================ birds AI
const birdPitch=b=>b.role==='baby'?1.25:b.role==='parent'?.85:1.05;
function bridgeBuilt(){const br=world.bridge;if(!br||br.lifted||!br.ok)return false;for(const k of br.L){const p=world.paths.get(k);if(!p||p.g<.95)return false;}return true;}
function busyOf(t){return t.type==='swing'?t.sw.q.length+(t.sw.rider?1:0):t.type==='slide'?t.sl.q.length+(t.sl.act?1:0):t.users.length;}
function think(b){
  const w=world;if(w.photoGather){gatherBird(b);return;}
  if(!b.home.lifted&&!walkRoute(curKey(b),K(b.home.x,b.home.y))){const hk=nearestWalkable(b.home.x+.5,b.home.y+.5,2);if(hk!=null&&hk!==curKey(b)){flyTo(b,hk);b.fly.d=1.4;SFX.flap();return;}}
  const myCl=cloudOfKey(curKey(b))||b.home.cl;const cross=bridgeBuilt();const opts=[];
  for(const t of w.toys){if(t.lifted||t.hide||t.type==='bridge'||w.t-t.born<1.1)continue;if(t.cl!==myCl&&!cross)continue;
    let base=b.pref[t.type]||.6;
    if(t.type==='slide'){if(t.wet)base*=(b.role==='baby'||b.role==='sister')?2.2:1.5;if(t.roof)base*=1.3;}
    if(t.type==='swing'&&t.sw.pusher&&t.sw.pusher.home===b.home&&!t.sw.rider&&b.role!=='parent')base*=2.5;
    if(t.type==='swing'&&t.shared)base*=1.3;
    let wt=base*(1+2.2*t.nov)*(1+.13*Math.min(t.heat,10));const dist=Math.abs(t.x+.5-b.x)+Math.abs(t.y+.5-b.y);wt/=1+dist*.06;
    if(t.cl!==b.home.cl)wt*=b.crossT>0?6:.9;if(t===b.lastToy)wt*=.4;wt/=1+busyOf(t)*.5;
    if(t.type!=='house')opts.push({w:wt,t,kind:t.type});
    if(t.type==='fountain'&&t.rbSpot&&t.rbA>.5){let wr=(b.pref.rainbow||1)*(1+.13*Math.min(t.heat,10))*(1+2*t.rbNov)/(1+dist*.06)/(1+t.users.length*.3);if(t.cl!==b.home.cl)wr*=b.crossT>0?6:.9;opts.push({w:wr,t,kind:'rainbow'});}
    if(t.bench&&t.bench.g>.9&&b.tired>.9&&t.bench.users.length<2)opts.push({w:(b.pref.bench||1)*(.5+b.tired*.4)/(1+dist*.06),t,kind:'bench'});}

  goTo(b,ch);
}
function goTo(b,o){
  const w=world,t=o.t;let dest=null;

    case 'rainbow':dest=t.rbSpot?t.rbSpot.k:null;break;
    case 'bench':dest=K(t.bench.x,t.bench.y);break;
    case 'home':dest=K(b.home.x,b.home.y);break;
    case 'wander':{const here=curKey(b),c=[];for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){const k=K(Math.floor(b.x)+dx,Math.floor(b.y)+dy);if(k!==here&&w.cells.has(k)&&!w.occ.has(k))c.push(k);}dest=c.length?c[Math.floor(Math.random()*c.length)]:null;break;}
    case 'beg':{let best=null;for(const c of w.cells.values()){if(c.cl!==(cloudOfKey(curKey(b))||b.home.cl)||w.occ.has(K(c.x,c.y)))continue;const s=c.x+c.y-Math.abs(c.x-c.y)*.4+Math.random()*.8;if(!best||s>best.s)best={s,k:K(c.x,c.y)};}dest=best&&best.k;break;}
  }
  if(dest==null){b.st='idle';b.tm=MR(1,2.5);return;}
  const route=walkRoute(curKey(b),dest);if(!route){b.st='idle';b.tm=MR(.8,2);return;}
  b.route=route;b.ri=0;b.dest=dest;b.goal=o;b.st='walk';b.sleep=0;b.seg=null;
}
function arrDir(b,t){const L=b.route;let dx=0,dy=0;if(L&&L.length>=2){const p=L[L.length-2];dx=KX(p)-t.x;dy=KY(p)-t.y;}
  if(!dx&&!dy){dx=b.x-(t.x+.5);dy=b.y-(t.y+.5);}const d=Math.hypot(dx,dy);if(d<.01)return {x:.7071,y:.7071};return {x:dx/d,y:dy/d};}
function arrive(b){

  switch(o.kind){
    case 'swing':b.st='wait';b.u={toy:t,kind:'swing',t:0};b.wt=0;b.qdir=qd;t.sw.q.push(b);break;
    case 'slide':b.st='wait';b.u={toy:t,kind:'slide',t:0};b.wt=0;b.qdir=qd;t.sl.q.push(b);break;
    case 'fountain':if(t.users.length>=3){b.st='idle';b.tm=MR(.5,1.5);break;}startPlay(b,t,'fountain',MR(5,7));break;
    case 'rainbow':if(t.users.length>=5||!t.rbSpot){b.st='idle';b.tm=1;break;}startPlay(b,t,'rainbow',MR(4.5,6.5));break;
    case 'windmill':if(t.users.length>=2){b.st='idle';b.tm=1;break;}startPlay(b,t,'windmill',MR(4,5.5));break;
    case 'bench':{const bn=t.bench;if(!bn||bn.users.length>=2){b.st='idle';b.tm=1;break;}bn.users.push(b);b.st='play';b.u={toy:t,bench:bn,kind:'bench',t:0,dur:MR(4,6.5),seat:bn.users.length-1,nap:Math.random()<.35,ph:0};break;}

function startPlay(b,t,kind,dur){t.users.push(b);b.st='play';b.u={toy:t,kind,t:0,dur,ph:Math.random()*TAU,nap:false,float:false,slot:t.users.length-1};

}
function moveToward(b,tx,ty,sp,dt){const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy);if(d<.01)return true;const s=Math.min(d,sp*dt);const nx=b.x+dx/d*s,ny=b.y+dy/d*s;

function idleUpd(b,dt){

function birdUpd(b,dt){

function drawStone(g,o){const p=o.p,s=o.s;const wv=p.wv||0;const half=(.27+.1*wv)*s;const cx=p.x+.5,cy=p.y+.5,z=p.z+.012;

function pathCell(p,s){

    for(const l of p.links){const q=w.paths.get(l);if(!q||q.kind!=='g')continue;const dz=q.z-p.z;if(dz<.9)continue;const dx=q.x-p.x,dy=q.y-p.y;if(Math.abs(dx)+Math.abs(dy)!==1)continue;
      for(const st of [[.34,1],[.67,2]])for(let j=0;j<3;j++){const a=j/3;let x,y;if(dx){x=dx>0?p.x+st[0]:p.x+.66-st[0];y=p.y+a;}else{y=dy>0?p.y+st[0]:p.y+.66-st[0];x=p.x+a;}
        for(let m=0;m<st[1];m++){const ss=.333*s;cube(x+(.333-ss)/2,y+(.333-ss)/2,p.z+m*.333,ss,m===st[1]-1?'#f8cf98':'#f1bb7c');}}}}

      for(const l of p.links){const nz=zAt(l);if(nz==null)continue;const dx=KX(l)-p.x,dy=KY(l)-p.y;const side=(dx>0&&i===1)||(dx<0&&i===0)||(dy>0&&j===1)||(dy<0&&j===0);if(side&&Math.abs(nz-zq)>=.2)z=Math.round(((zq+nz)/2)*4)/4;}
      const ss=.5*s,step=Math.abs(z-zq)>.1;cube(p.x+i*.5+(.5-ss)/2,p.y+j*.5+(.5-ss)/2,z-ss,ss,step?'#f8cf98':((i+j+p.x+p.y)&1?w.theme.a:'#ffffff'));}
    if(s>.8&&((p.x+p.y)&1)){let horiz=false;for(const l of p.links)if(KY(l)===p.y)horiz=true;
      for(const sg of [0,1]){const px=horiz?p.x+.45:p.x+(sg?.92:.0),py=horiz?p.y+(sg?.92:0):p.y+.45;for(let m=0;m<3;m++)cube(px,py,zq+m*.1,.08,m===2?RAINBOW[mod(p.x*3+p.y+sg,7)]:'#ffffff');}}}

    if(s>.8){for(const sg of [-1,1]){const px=cx+sg*.42,py=cy-sg*.42;for(let m=0;m<3;m++)cube(px-.04,py-.04,z+m*.1,.08,m===2?RAINBOW[mod(p.ord+(sg>0?3:0),7)]:'#ffffff');}}}

function addWorld(){
  const w=world;
  addCells(w.cells,0,0,1);
  if(w.cloudB&&w.phase===1){const B=w.cloudB;const e=eio(clamp(B.t/B.dur,0,1));const off=-(1-e)*16;addCells(B.cells,off,off,clamp(B.t*.8,0,1));
    for(const h of B.homes){const c=B.cells.get(K(h.x,h.y));homeModel(h,h.x+off,h.y+off,c.h,9,null);}}
  for(const p of w.paths.values())if(p.g>.01)pathCell(p,eob(p.g));
  for(const p of w.dying){const k=1-(w.t-p.dieT)/.45;if(k>0)pathCell(p,k);}
  const roofOf=new Map();for(const t of w.toys)if(t.roof&&!t.lifted&&!t.hide)roofOf.set(t.roof,t);
  for(const h of w.homes){if(h.lifted)continue;const c=w.cells.get(K(h.x,h.y));homeModel(h,h.x,h.y,c?c.h:1,w.t-h.born,roofOf.get(h));}
  for(const t of w.toys){if(t.lifted||t.hide||t.type==='bridge')continue;const c=w.cells.get(K(t.x,t.y));const bz=c?c.h:1;const bt=w.t-t.born;
    if(t.type==='swing')swingModel(t,t.x,t.y,bz,bt);else if(t.type==='fountain'){fountainModel(t,t.x,t.y,bz,bt);rainbowModel(t);}
    else if(t.type==='windmill')windmillModel(t,t.x,t.y,bz,bt);else if(t.type==='slide')slideModel(t,t.x,t.y,bz,bt,t.geo);
    if(t.bunt>.02&&!t.roof)buntingModel(t,t.x,t.y,bz,t.bunt);}
  for(const bn of w.benches){const c=w.cells.get(K(bn.x,bn.y));benchModel(bn,bn.x,bn.y,c?c.h:1,eob(bn.g));}
  if(w.ghosts){w.ghosts=w.ghosts.filter(gh=>w.t-gh.t0<.5);for(const gh of w.ghosts){const c=w.cells.get(K(gh.o.x,gh.o.y));benchModel(gh.o,gh.o.x,gh.o.y,c?c.h:1,1-(w.t-gh.t0)/.5);}}
  for(const b of w.birds){if(b.hidden)continue;const gz=groundZc(b.x,b.y);const z=b.z+b.jump;
    if(gz!=null&&z>=gz-.05)fnItem(b.x+b.y+gz*KZ+.004,drawShadow,{x:b.x,y:b.y,z:gz,s:b.size*(1-clamp((z-gz)*.25,0,.6))});
    fnItem(b.x+b.y+z*KZ+.012,drawBird,b);}
