<script>
'use strict';
(function(){
// =====================================================================
//  むにゅーん！ひつじの雲パン工房と、おてんき遊園地
//  one-finger cloud dough -> weather -> shared town state -> animals
// =====================================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const R=Math.random;
const rnd=(a,b)=>a+(b-a)*R();
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(R()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

let W=0,H=0,DPR=1,u=1,LAND=false,L=null;
const SA={t:0,r:0,b:0,l:0};
const bgc=document.createElement('canvas');
let fiberPat=null;

// ---------------------------------------------------------------- audio
const AU={ctx:null,on:false,last:{}};
function auInit(){
  if(AU.ctx){ if(AU.ctx.state!=='running'){AU.ctx.resume().catch(()=>{});} return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ AU.ctx=new AC(); }catch(e){ return; }
  const c=AU.ctx;
  AU.master=c.createGain(); AU.master.gain.value=0.55;
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=4;
  AU.master.connect(comp); comp.connect(c.destination);
  const len=c.sampleRate*2|0, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  AU.noise=buf;
  AU.rain=bed('bandpass',1700,.8); AU.snow=bed('highpass',4200,.6); AU.flow=bed('lowpass',420,1.2);
  AU.on=true;
  // silent unlock for iOS
  try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}
  if(c.state!=='running') c.resume().catch(()=>{});
}
function bed(type,f,q){
  const c=AU.ctx,s=c.createBufferSource(); s.buffer=AU.noise; s.loop=true;
  const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  const g=c.createGain(); g.gain.value=0; s.connect(fl); fl.connect(g); g.connect(AU.master); s.start();
  return {g,fl};
}
function bedSet(b,v){ if(!AU.on||AU.ctx.state!=='running') return; b.g.gain.setTargetAtTime(v,AU.ctx.currentTime,.35); }
function ok(name,gap){ if(!AU.on||AU.ctx.state!=='running') return false; const t=AU.ctx.currentTime; if(gap&&AU.last[name]&&t-AU.last[name]<gap) return false; AU.last[name]=t; return true; }
function tone(f,t0,dur,type,vol,bend,att,filt){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(20,bend),t0+dur*.9);
  const a=att||.008;
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  if(filt){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=filt;o.connect(fl);fl.connect(g);} else o.connect(g);
  g.connect(AU.master); o.start(t0); o.stop(t0+dur+.05);
}
function nburst(t0,dur,f,vol,type){
  const c=AU.ctx,s=c.createBufferSource(); s.buffer=AU.noise;
  const fl=c.createBiquadFilter(); fl.type=type||'bandpass'; fl.frequency.value=f; fl.Q.value=1.2;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(t0,Math.random()); s.stop(t0+dur+.05);
}
const SFX={
  squish(p,v){ if(!ok('sq',.06)) return; const t=AU.ctx.currentTime; p=p||1; v=v||1;
    tone(190*p,t,.16,'sine',.16*v,300*p,.01); tone(290*p,t+.05,.14,'triangle',.06*v,170*p,.01,900); nburst(t,.08,600*p,.02*v,'lowpass'); },
  stretch(p,v){ if(!ok('st',.075)) return; const t=AU.ctx.currentTime;
    tone(150*p,t,.12,'triangle',.07*v,210*p,.01,1200); tone(300*p,t,.09,'sine',.03*v,420*p); },
  puru(p){ if(!ok('pu',.12)) return; const t=AU.ctx.currentTime; p=p||1;
    tone(330*p,t,.11,'sine',.12,520*p); tone(440*p,t+.1,.1,'sine',.08,330*p); tone(360*p,t+.19,.1,'sine',.05,300*p); },
  plink(){ if(!ok('pl',.05)) return; const t=AU.ctx.currentTime; const f=rnd(1300,2500);
    tone(f,t,.13,'sine',.035,f*.7,.003); tone(f*2.4,t,.05,'sine',.01); },
  tink(){ if(!ok('tk',.09)) return; const t=AU.ctx.currentTime; const f=rnd(2400,3600); tone(f,t,.35,'sine',.02,f*.98,.01); },
  shine(){ if(!ok('sh',.25)) return; const t=AU.ctx.currentTime; const f=[880,1046,1318][R()*3|0]; tone(f,t,.5,'sine',.025,f,.06); },
  pop(){ if(!ok('pop',.1)) return; const t=AU.ctx.currentTime; tone(420,t,.12,'sine',.12,900); nburst(t,.05,2000,.03); },
  snap(){ if(!ok('sn',.2)) return; const t=AU.ctx.currentTime; tone(820,t,.18,'triangle',.08,260); nburst(t,.06,1500,.04); },
  hop(){ if(!ok('hop',.08)) return; const t=AU.ctx.currentTime; tone(420,t,.1,'sine',.06,820); },
  quack(){ if(!ok('qk',.2)) return; const t=AU.ctx.currentTime; tone(560,t,.12,'sawtooth',.03,400,.01,1400); tone(520,t+.14,.1,'sawtooth',.025,380,.01,1400); },
  squeak(){ if(!ok('sk',.15)) return; const t=AU.ctx.currentTime; tone(900,t,.08,'sine',.05,1400); tone(1200,t+.09,.07,'sine',.04,1600); },
  horn(){ if(!ok('hn',.6)) return; const t=AU.ctx.currentTime; tone(330,t,.22,'triangle',.07,330,.03,900); tone(392,t+.24,.3,'triangle',.07,392,.03,900); },
  whoosh(){ if(!ok('wh',.3)) return; const t=AU.ctx.currentTime; nburst(t,.5,1400,.05,'bandpass'); tone(900,t,.4,'sine',.03,300); },
  creak(){ if(!ok('cr',.5)) return; const t=AU.ctx.currentTime; tone(140,t,.2,'sawtooth',.015,110,.02,500); },
  rainbow(){ if(!ok('rb',1.2)) return; const t=AU.ctx.currentTime; const s=[523,587,659,784,880,1046,1175,1318,1568,1760];
    s.forEach((f,i)=>{tone(f,t+i*.09,.6,'triangle',.05,f,.02); tone(f*2,t+i*.09,.4,'sine',.015);}); },
  success(k){ if(!AU.on||AU.ctx.state!=='running') return; const t=AU.ctx.currentTime;
    const pats={pour:[392,523,659,784,1046],flag:[523,659,784,659,1046],sled:[1046,880,784,659,523,784,1046],
      tent:[523,659,784,1046,1318,1568],keep:[659,784,988,784,1175],melt:[587,740,880,740,1175],again:[784,988,1175]};
    const p=pats[k]||pats.again; const ty=k==='flag'?'square':'triangle';
    p.forEach((f,i)=>{tone(f,t+i*.11,.32,ty,ty==='square'?.035:.075,f,.01,2400); tone(f*.5,t+i*.11,.25,'sine',.04);});
    if(k==='keep') { tone(330,t+.7,.25,'triangle',.06,330); tone(392,t+.95,.35,'triangle',.06,392); }
  },
  wake(){ if(!ok('wk',1)) return; const t=AU.ctx.currentTime; tone(300,t,.25,'sine',.06,480,.04); tone(480,t+.2,.25,'sine',.05,600,.04); },
  yawn(){ if(!ok('yw',3)) return; const t=AU.ctx.currentTime; tone(260,t,.8,'triangle',.035,180,.15,700); }
};

// ---------------------------------------------------------------- layout
const PORT={hor:.385,drop:.205,tol:.07,sheep:[.14,.31],spot:[.47,.405],
  hills:[[.19,.49,1],[.83,.485,-1]],bakery:[.37,.838],house:[.53,.462],
  pond:[.40,.612],mill:[.79,.62],plaza:[.60,.862],laundry:[.155,.815],car:[.895,.765],tree:[.07,.665],pondR:[88,27]};
const LANDS={hor:.40,drop:.19,tol:.066,sheep:[.15,.33],spot:[.315,.47],
  hills:[[.10,.525,1],[.90,.525,-1]],bakery:[.50,.50],house:[.41,.865],
  pond:[.30,.665],mill:[.60,.665],plaza:[.63,.865],laundry:[.18,.865],car:[.81,.75],tree:[.955,.70],pondR:[100,30]};

function readSA(){
  const el=document.getElementById('sa'); const cs=getComputedStyle(el);
  SA.t=parseFloat(cs.paddingTop)||0; SA.r=parseFloat(cs.paddingRight)||0; SA.b=parseFloat(cs.paddingBottom)||0; SA.l=parseFloat(cs.paddingLeft)||0;
}
function layout(){
  W=Math.max(200,window.innerWidth); H=Math.max(200,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  readSA();
  LAND=W/H>1.05;
  const P=LAND?LANDS:PORT;
  const iw=W-SA.l-SA.r, ih=H-SA.t-SA.b;
  u=LAND?Math.min(iw/880,ih/620):Math.min(iw/390,ih/760);
  u=clamp(u,.45,3);
  const X=f=>SA.l+f*iw, Y=f=>SA.t+f*ih;
  const N={};
  N.hor=Y(P.hor); N.drop=P.drop*ih; N.tol=P.tol*ih; N.r0=60*u;
  N.sheep={x:X(P.sheep[0]),y:Y(P.sheep[1])};
  N.spot={x:X(P.spot[0]),y:Y(P.spot[1])};
  N.hills=P.hills.map(h=>({x:X(h[0]),y:Y(h[1]),w:60*u,h:44*u,side:h[2]}));
  N.bakery={x:X(P.bakery[0]),y:Y(P.bakery[1]),w:58*u,h:44*u};
  N.house={x:X(P.house[0]),y:Y(P.house[1]),w:42*u,h:34*u};
  N.pond={x:X(P.pond[0]),y:Y(P.pond[1]),rx:Math.min(P.pondR[0]*u,iw*.24),ry:P.pondR[1]*u};
  N.mill={x:X(P.mill[0]),y:Y(P.mill[1]),r:22*u};
  N.plaza={x:X(P.plaza[0]),y:Y(P.plaza[1]),rx:66*u,ry:19*u};
  N.laundry={x:X(P.laundry[0]),y:Y(P.laundry[1]),hw:44*u,ph:40*u};
  N.car={x:X(P.car[0]),y:Y(P.car[1]),r:28*u};
  N.tree={x:X(P.tree[0]),y:Y(P.tree[1])};
  const p=N.pond,m=N.mill,pl=N.plaza;
  N.chan=[{x:p.x+p.rx*.96,y:p.y},{x:lerp(p.x+p.rx,m.x,.55),y:lerp(p.y,m.y,.5)+4*u},{x:m.x-m.r*.9,y:m.y+m.r*.55},{x:m.x+m.r*.5,y:m.y+m.r*1.5},
    {x:lerp(m.x,pl.x+pl.rx*.9,.5)+6*u,y:lerp(m.y,pl.y,.6)},{x:pl.x+pl.rx*.88,y:pl.y-pl.ry*.4}];
  N.streams=N.hills.map((h,i)=>{
    const s0={x:h.x+h.side*h.w*.35,y:h.y-h.h*.62}, s1={x:h.x+h.side*h.w*.95,y:h.y+3*u};
    let end;
    if(i===0){ const ang=Math.atan2(-.8,-.6); end={x:p.x-p.rx*.86,y:p.y-p.ry*.5}; }
    else end={x:m.x-m.r*.2,y:m.y-m.r*1.05};
    const mid={x:lerp(s1.x,end.x,.5)+h.side*8*u,y:lerp(s1.y,end.y,.5)};
    return [s0,s1,mid,end];
  });
  N.shelters=[{x:N.bakery.x-N.bakery.w*.32,y:N.bakery.y+3*u},{x:N.bakery.x+N.bakery.w*.32,y:N.bakery.y+3*u},
    {x:N.house.x-N.house.w*.25,y:N.house.y+3*u},{x:N.house.x+N.house.w*.3,y:N.house.y+3*u},{x:N.tree.x+4*u,y:N.tree.y+4*u},{x:N.tree.x-6*u,y:N.tree.y+6*u}];
  N.plazaSpots=[]; for(let i=0;i<9;i++){const a=i/9*TAU+.3;N.plazaSpots.push({x:pl.x+Math.cos(a)*pl.rx*.62,y:pl.y+Math.sin(a)*pl.ry*.7+2*u});}
  N.painting={x:N.bakery.x+N.bakery.w*.26,y:N.bakery.y-N.bakery.h*.5,w:20*u,h:15*u};
  N.minY=SA.t+H*.06; N.maxY=H-SA.b-N.drop-4*u;
  const old=L; L=N;
  return old;
}

// ---------------------------------------------------------------- state
const S={time:0,water:.18,over:0,flow:0,millA:0,millS:0,wet:1,lift:0,flagUp:false,flag:0,plazaRain:0,plazaSun:0,fest:0,
  hills:[{snow:0,ramp:0,melt:0},{snow:0,ramp:0,melt:0}],streams:[{carve:0,water:0},{carve:0,water:0}],
  rb:{power:0,x:0,y:0,r:0,a:0,cool:0,formed:false},park:{on:false,t:0,start:0},carA:0,carS:0,windA:0,
  disc:{},discN:0,first:false,pondRainAt:-99,pondRained:false,visitorsCalled:false,parkVisitors:false,
  parade:null,paradeCool:45,hue:rnd(-28,28),sledHills:[false,false],lastInput:0,idleDemo:0,sheepGest:false,camZ:1};
let clouds=[];
const P=[]; const MAXP=340; const RIP=[];
function addP(o){ if(P.length<MAXP){P.push(o);return true;} return false; }

// ---------------------------------------------------------------- memory
const SKEY='gf261030_14_painting_v1';
let saved=null, paintCanvas=null;
function loadSaved(){
  try{
    const raw=window.localStorage.getItem(SKEY); if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object'||o.v!==1) return null;
    const num=(v,a,b,d)=>(typeof v==='number'&&isFinite(v))?clamp(v,a,b):d;
    return {water:num(o.water,0,1.4,.2),snow:Array.isArray(o.snow)?[num(o.snow[0],0,1,0),num(o.snow[1],0,1,0)]:[0,0],
      flag:!!o.flag,park:!!o.park,hue:num(o.hue,-40,40,0),ani:Array.isArray(o.ani)?o.ani.filter(k=>typeof k==='string'&&KINDS[k]).slice(0,8):[],
      carve:Array.isArray(o.carve)?[num(o.carve[0],0,1,0),num(o.carve[1],0,1,0)]:[0,0]};
  }catch(e){ return null; }
}
let lastSave=0;
function saveNow(){
  if(!S.first) return;
  try{
    const ani=animals.filter(a=>a.arrived).map(a=>a.kind);
    const o={v:1,water:+S.water.toFixed(2),snow:S.hills.map(h=>+h.snow.toFixed(2)),flag:S.flagUp,park:S.park.on,hue:+S.hue.toFixed(1),ani,
      carve:S.streams.map(s=>+s.carve.toFixed(2)),t:Date.now()};

// ---------------------------------------------------------------- textures
function makeTextures(){
  const f=document.createElement('canvas'); f.width=f.height=160; const g=f.getContext('2d');
  const rr=mulberry(42);
  g.lineCap='round';
  for(let i=0;i<70;i++){
    g.strokeStyle=rr()<.5?'rgba(255,255,255,.55)':'rgba(150,170,200,.22)'; g.lineWidth=rr()*1.1+.3;
    const x=rr()*160,y=rr()*160,a=rr()*TAU,l=8+rr()*26;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  fiberPat=ctx.createPattern(f,'repeat');
}
function paperTex(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  const id=g.createImageData(256,256), d=id.data, rr=mulberry(9);
  for(let i=0;i<d.length;i+=4){const v=225+rr()*30; d[i]=v; d[i+1]=v-2; d[i+2]=v-8; d[i+3]=255;}
  g.putImageData(id,0,0);
  g.lineCap='round';
  for(let i=0;i<110;i++){
    g.strokeStyle=rr()<.6?'rgba(255,255,255,.7)':'rgba(170,150,120,.25)'; g.lineWidth=rr()*1.2+.3;
    const x=rr()*256,y=rr()*256,a=rr()*TAU,l=6+rr()*30;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a+.8)*l*.5,y+Math.sin(a+.8)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  return c;
}

// ---------------------------------------------------------------- drawing helpers
function smoothClosed(g,pts){
  const n=pts.length/2; g.beginPath();
  let mx=(pts[0]+pts[2*(n-1)])/2, my=(pts[1]+pts[2*(n-1)+1])/2; g.moveTo(mx,my);
  for(let i=0;i<n;i++){const x=pts[2*i],y=pts[2*i+1],j=(i+1)%n; g.quadraticCurveTo(x,y,(x+pts[2*j])/2,(y+pts[2*j+1])/2);}
  g.closePath();
}
function blobPts(cx,cy,rx,ry,rr,rough,n){
  n=n||22; const pts=[];
  for(let i=0;i<n;i++){const t=i/n*TAU, k=1+(rr()-.5)*rough*2; pts.push(cx+Math.cos(t)*rx*k,cy+Math.sin(t)*ry*k);}
  return pts;
}
function wash(g,cx,cy,rx,ry,col,a,rr,layers,rough){
  layers=layers||3; rough=rough||.08;
  g.save(); g.fillStyle=col;
  for(let i=0;i<layers;i++){ g.globalAlpha=a*(i?0.45:0.7); smoothClosed(g,blobPts(cx+(rr()-.5)*3*u,cy+(rr()-.5)*2*u,rx*(1-i*.06),ry*(1-i*.05),rr,rough)); g.fill(); }
  g.globalAlpha=a*.4; g.strokeStyle=col; g.lineWidth=1.3*u; smoothClosed(g,blobPts(cx,cy,rx,ry,rr,rough*.7)); g.stroke();
  g.restore();
}
function hillY(h,xo){ return h.h*Math.exp(-Math.pow(xo/(h.w*.62),2)); }
function hillPath(g,h,lift){
  lift=lift||0; g.beginPath(); const n=34;
  for(let i=0;i<=n;i++){const t=i/n*2-1, xo=t*h.w*1.35, x=h.x+xo, y=h.y-hillY(h,xo)-lift; i?g.lineTo(x,y):g.moveTo(x,y);}
  g.lineTo(h.x+h.w*1.35,h.y+5*u); g.quadraticCurveTo(h.x,h.y+9*u,h.x-h.w*1.35,h.y+5*u); g.closePath();
}
function polyStroke(g,pts){ g.beginPath(); g.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length-1;i++){ g.quadraticCurveTo(pts[i].x,pts[i].y,(pts[i].x+pts[i+1].x)/2,(pts[i].y+pts[i+1].y)/2);} const e=pts[pts.length-1]; g.lineTo(e.x,e.y); }
function roofPath(g,x,y,w,h){ g.beginPath(); g.moveTo(x-w*.62,y); g.quadraticCurveTo(x-w*.3,y-h*.55,x,y-h); g.quadraticCurveTo(x+w*.3,y-h*.55,x+w*.62,y); g.closePath(); }

// ---------------------------------------------------------------- static background
let BGM=0;
function drawBG(){
  BGM=Math.round(Math.max(W,H)*.08);
  bgc.width=Math.round((W+BGM*2)*DPR); bgc.height=Math.round((H+BGM*2)*DPR);
  const g=bgc.getContext('2d'); g.setTransform(DPR,0,0,DPR,BGM*DPR,BGM*DPR);
  const rr=mulberry(1234);
  let gr=g.createLinearGradient(0,-BGM,0,L.hor);

let CID=0;
function newCloud(x,y,pop){
  return {id:CID++,x,y,rx:L.r0*1.2,ry:L.r0*.85,crx:L.r0*1.2*(pop?.3:1),cry:L.r0*.85*(pop?.3:1),vrx:0,vry:0,dense:0,energy:0,
    pinchA:0,pinchX:0,pinchY:0,pvx:0,pvy:0,dents:[],seed:R()*100,lobes:7+(R()*3|0),phase:R()*TAU,
    rain:0,sun:0,snow:0,pow:.8,grab:null,born:pop?0:1,glide:null,jigT:9,jigA:0,acc:0,hover:0,nudgeX:0,nudgeY:0,prevX:0,prevY:0};
}
function shapeW(c){
  const a=c.rx/c.ry, r=c.rx/L.r0;
  const snow=sstep(.3,.75,c.dense);
  const rain=sstep(1.55,2.2,a)*(.55+.45*sstep(1.5,2.8,r))*(1-snow);
  const sun=sstep(1.0,.66,a)*(1-snow);
  return {rain,sun,snow};
}
function landOff(c){ return L.drop+c.ry-L.r0*.85; }
function landY(c){ return c.y+landOff(c); }
function foot(dx,dy){const d=dx*dx+dy*dy; return d>=1?0:d<.45?1:(1-d)/.55;}
function rainHW(c){return c.crx*.95+8*u;}
function sunHW(c){return Math.max(c.crx*1.5,52*u)+8*u;}
function wAt(x,y,skip){
  let r=0,s=0,n=0;
  for(const c of clouds){ if(c.born<.6||c===skip) continue;
    const dy=(y-landY(c))/L.tol; if(dy>1.4||dy<-1.4) continue;
    if(c.rain>.02||c.snow>.02){const f=foot((x-c.x)/rainHW(c),dy); r+=c.rain*c.pow*f; n+=c.snow*c.pow*f;}
    if(c.sun>.02){const f=foot((x-c.x)/sunHW(c),dy/1.3); s+=c.sun*c.pow*f;}
  }
  return {r:Math.min(r,1.6),s:Math.min(s,1.5),n:Math.min(n,1.6)};
}
function wSpan(x,y,hw){ const a=wAt(x,y),b=wAt(x-hw,y),c=wAt(x+hw,y); return {r:Math.max(a.r,b.r,c.r),s:Math.max(a.s,b.s,c.s),n:Math.max(a.n,b.n,c.n)}; }
function clampCloud(c){
  c.x=clamp(c.x,SA.l+c.rx*.25,W-SA.r-c.rx*.25);
  c.y=clamp(c.y,L.minY+c.ry*.3,H-SA.b-4*u-landOff(c));
}
function cloudPts(c,n){
  const pts=new Array(n*2);
  const jt=c.jigT, jig=c.jigA*Math.sin(jt*15)*Math.exp(-jt*2.6);
  const bs=c.born<1?(c.born<.7?c.born/.7*1.12:1.12-(c.born-.7)/.3*.12):1;
  const sx=c.crx*(1+jig)*bs, sy=c.cry*(1-jig*.9)*bs;
  const lob=c.lobes, ph=c.phase, t=S.time;
  const puff=.13+.10*c.snow, rainy=c.rain;
  for(let i=0;i<n;i++){
    const th=i/n*TAU, cs=Math.cos(th), sn=Math.sin(th);
    const f=Math.pow(Math.abs(Math.cos(lob*th*.5+ph)),.55);
    const bottom=Math.max(0,sn);
    let k=1+puff*(f-.55)*(1-bottom*.8);
    k+=c.snow*.14*Math.max(0,-sn)*f;
    const tr=1+c.energy*2.2;
    k+=(.016*Math.sin(t*1.4*(1+c.energy)+th*2+c.seed)+.01*Math.sin(t*2.3*(1+c.energy*1.5)-th*3+c.seed))*tr;
    let x=cs*sx*k, y=sn*sy*k*(1-bottom*.12*(1-rainy));
    y+=bottom*bottom*(4+rainy*6)*u*(1+.3*Math.sin(t*1.1+c.seed)); // weight sag
    for(const d of c.dents){const dd=angDiff(th,d.a), w=Math.exp(-dd*dd/.16); x+=cs*sx*d.amp*w; y+=sn*sy*d.amp*w;}
    if(c.pinchX||c.pinchY){const dd=angDiff(th,c.pinchA), w=Math.exp(-dd*dd/.10); x+=c.pinchX*w; y+=c.pinchY*w;}
    pts[2*i]=c.x+c.nudgeX+x; pts[2*i+1]=c.y+c.nudgeY+y;
  }
  return pts;
}
function edgePt(c,th){ return {x:c.x+Math.cos(th)*c.rx,y:c.y+Math.sin(th)*c.ry}; }

function pondShore(x,y,k){ const p=L.pond; const dx=(x-p.x)/p.rx, dy=(y-p.y)/p.ry; const n=Math.hypot(dx,dy)||1; return {x:p.x+dx/n*p.rx*(k||1.12),y:p.y+dy/n*p.ry*(k||1.12)}; }

const sheep={blink:0,blinkT:2,yawn:0,surp:0,happy:0,puff:0,sleepy:1,lx:0,ly:0,knead:0,kneadT:-1,home:null,reach:0,reachT:0,bub:0};

// ---------------------------------------------------------------- init / resize
let started=false;
function relayout(){
  const old=layout();
  makeTextures(); drawBG();
  if(old && clouds.length){
    const sx=W/old._W, sy=H/old._H, su=u/old._u;
    // re-anchor clouds to nearest feature in old layout
    const feats=o=>[o.pond,o.laundry,o.hills[0],o.hills[1],o.plaza,o.spot,o.mill];
    const fo=feats(old), fn=feats(L);
    for(const c of clouds){
      const lx=c.x, ly=c.y+old.drop; let bi=0,bd=1e9;
      fo.forEach((f,i)=>{const fy=(i===5)?f.y+old.drop:f.y; const d=dist(lx,ly,f.x,fy); if(d<bd){bd=d;bi=i;}});
      const f0=fo[bi], f1=fn[bi]; const f0y=(bi===5)?f0.y+old.drop:f0.y, f1y=(bi===5)?f1.y+L.drop:f1.y;
      c.x=f1.x+clamp((lx-f0.x)*su,-40*u,40*u); c.y=f1y+clamp((ly-f0y)*su,-20*u,20*u)-L.drop;
      c.rx*=su; c.ry*=su; c.crx*=su; c.cry*=su; c.pinchX=c.pinchY=0; c.glide=null;
      clampCloud(c);
    }
    for(const a of animals){ a.x=clamp(a.x*sx,0,W); a.y=clamp(a.y*sy,L.hor+10*u,H); if(a.jump&&a.jump.target&&a.jump.then){ const f=a.jump.then; a.jump=null; f(); } a.jump=null; a.thinkT=0; if(!a.inParade) a.goal='idle'; a.sledS=0; a.st=''; }
    if(S.parade){ for(const a of S.parade.members){ a.inParade=false; a.goal='idle'; } S.parade=null; }
    if(boat.mode!=='sleep'){ boat.mode='loop'; boat.path=null; const lp=loopPos(boat.loopA); boat.x=lp.x; boat.y=lp.y; }
    else { boat.x=L.pond.x-L.pond.rx*.15; boat.y=L.pond.y+2*u; }
    if(boat.req>=0) boat.req=-1;
    for(const a of animals){ if(a.wantBoat>=0){ a.wantBoat=-1; } }
    P.length=0; RIP.length=0;
  }
  L._W=W; L._H=H; L._u=u;
  if(saved) buildPaintCanvas();
}
function start(){
  relayout();
  saved=loadSaved();
  if(saved) buildPaintCanvas();
  const c=newCloud(L.spot.x+rnd(-8,8)*u,L.spot.y+rnd(-5,5)*u,false); clampCloud(c); clouds.push(c); sheep.home=c;
  initAnimals();
  const bp=loopPos(0); boat.x=L.pond.x-L.pond.rx*.15; boat.y=L.pond.y+2*u;
  S.lastInput=performance.now()/1000;
  started=true;
}

// ---------------------------------------------------------------- input
const ptrs=new Map();
const cam={z:1,cx:0,cy:0};
function toWorld(x,y){ return {x:(x-cam.cx)/cam.z+cam.cx,y:(y-cam.cy)/cam.z+cam.cy}; }
const viewer={open:false,t:0,openAt:0};
function hitCloud(x,y){
  let best=null,bq=1;
  for(let i=clouds.length-1;i>=0;i--){const c=clouds[i]; if(c.grab||c.born<.5) continue;
    const ax=c.crx*1.12+16*u, ay=c.cry*1.18+16*u; const q=Math.pow((x-c.x)/ax,2)+Math.pow((y-c.y)/ay,2);
    if(q<bq){bq=q;best=c;}}
  return best;
}
function firstTouchFx(){
  if(S.first) return; S.first=true; sheep.surp=1.4; sheep.sleepy=0; SFX.wake();
}
function startGrab(pid,c,p){
  const ex=(p.x-c.x)/c.crx, ey=(p.y-c.y)/c.cry, q=Math.hypot(ex,ey);
  const coreQ=Math.min(.6,Math.max(.42,30*u/Math.min(c.crx,c.cry)));
  let nx=ex/c.crx, ny=ey/c.cry; const nl=Math.hypot(nx,ny); if(nl<1e-6){nx=1;ny=0;} else {nx/=nl;ny/=nl;}
  const th=Math.atan2(ey,ex);
  const g={pid,c,sx:p.x,sy:p.y,x:p.x,y:p.y,zone:q<coreQ?'core':'edge',mode:'pending',nx,ny,th,rx0:c.rx,ry0:c.ry,x0:c.x,y0:c.y,dense0:c.dense,travel:0,lt:performance.now(),side:1,lastX:p.x,lastY:p.y,speed:0};
  c.grab=g; c.glide=null; ptrs.set(pid,{grab:g});
  // immediate visible squish (<100ms)
  c.dents.push({a:th,amp:-.24,v:0}); if(c.dents.length>5) c.dents.shift();
  addP({t:'ring',x:p.x,y:p.y,r:6*u,life:.5});
  c.jigT=0; c.jigA=.035;
  const first=!S.first; firstTouchFx();
  if(!first) sheep.surp=Math.max(sheep.surp,.6);
  SFX.squish(1+R()*.1,1);
  drizzle(c, first?14:7);
  // bring to front
  const i=clouds.indexOf(c); clouds.splice(i,1); clouds.push(c);
}
function drizzle(c,n){
  const w=c.snow>.4?'s':(c.sun>.5?'k':'r');
  for(let i=0;i<n;i++){
    const x=c.x+rnd(-.7,.7)*c.crx, y=c.y+c.cry*.85+rnd(0,14)*u;
    if(w==='s') addP({t:'s',x,y,vy:rnd(70,110)*u,ty:landY(c)+rnd(-.5,.5)*L.tol,ph:R()*9,life:9});
    else if(w==='k') addP({t:'sk',x,y:y+rnd(0,L.drop*.8),vx:rnd(-10,10)*u,vy:rnd(10,40)*u,life:rnd(.6,1.1),col:'255,236,170'});
    else addP({t:'r',x,y:y+rnd(-5,5)*u,vy:rnd(520,680)*u,ty:landY(c)+rnd(-.55,.55)*L.tol,len:rnd(7,11)*u,big:1});
  }
}
function decideMode(g,D){
  const c=g.c;
  if(g.zone==='core') return 'move';
  const dr=D.x*g.nx+D.y*g.ny, dl=Math.hypot(D.x,D.y);
  if(dr<-.42*dl) return 'squash';
  if(Math.abs(D.x)>=Math.abs(D.y)*.9){ g.side=D.x>=0?1:-1; return 'wide'; }
  g.side=D.y>=0?1:-1; return 'tall';
}
function moveGrab(g,p,now){
  const c=g.c; const D={x:p.x-g.sx,y:p.y-g.sy}; const dl=Math.hypot(D.x,D.y);
  const sp=dist(p.x,p.y,g.lastX,g.lastY)/Math.max(.008,(now-g.lt)/1000); g.speed=lerp(g.speed,sp,.3); g.lt=now; g.lastX=p.x; g.lastY=p.y;
  g.x=p.x; g.y=p.y;
  if(g.mode==='pending'){ if(dl<8*Math.max(1,u*.8)) return; g.mode=decideMode(g,D); if(g.mode==='move'){SFX.squish(.8,.6);} }
  const r0=L.r0; const before={rx:c.rx,ry:c.ry,x:c.x,y:c.y};
  if(g.mode==='move'){
    c.x=g.x0+D.x; c.y=g.y0+D.y; clampCloud(c);
    c.pinchX=0; c.pinchY=0;
  } else if(g.mode==='wide'){
    const ext=D.x*g.side;
    const rx=clamp(g.rx0+ext*.5,r0*.5,r0*3.3), used=(rx-g.rx0)*2;
    c.rx=rx; c.x=g.x0+g.side*used*.5; c.ry=clamp(g.ry0*Math.pow(g.rx0/rx,.35),r0*.42,r0*2.4);
    c.y=g.y0+(g.ry0-c.ry)+D.y*.2; c.dense=g.dense0*clamp(1-Math.max(0,used)/(r0*.7),0,1);
    clampCloud(c);
  } else if(g.mode==='tall'){
    const ext=D.y*g.side;
    const ry=clamp(g.ry0+ext*.5,r0*.42,r0*2.4), used=(ry-g.ry0)*2;
    c.ry=ry; c.y=g.y0+g.side*used*.5; c.rx=clamp(g.rx0*Math.pow(g.ry0/ry,1.1),r0*.38,r0*3.3);
    c.x=g.x0+D.x*.2; c.dense=g.dense0*clamp(1-Math.max(0,used)/(r0*.7),0,1);
    clampCloud(c);
  } else if(g.mode==='squash'){
    const amt=Math.max(0,-(D.x*g.nx+D.y*g.ny));
    const k=clamp(amt/(r0*.85),0,1);
    c.rx=lerp(g.rx0,r0*.74,k); c.ry=lerp(g.ry0,r0*.72,k); c.dense=Math.max(g.dense0*(1-k*.2),k);
    c.y=g.y0+(g.ry0-c.ry); clampCloud(c);
    sheep.puff=Math.max(sheep.puff,k);
  }
  if(g.mode!=='move'){
    const e=edgePt(c,g.th); let px=p.x-e.x, py=p.y-e.y; const pl=Math.hypot(px,py), mx=30*u;
    if(pl>mx){px*=mx/pl;py*=mx/pl;}
    if(g.mode==='squash'){px*=.5;py*=.5;}
    c.pinchA=g.th; c.pinchX=lerp(c.pinchX,px*.85,.6); c.pinchY=lerp(c.pinchY,py*.85,.6);
  }
  const ch=Math.abs(c.rx-before.rx)+Math.abs(c.ry-before.ry)+Math.abs(c.x-before.x)*.25+Math.abs(c.y-before.y)*.25;
  g.travel+=ch; c.energy=Math.min(1,c.energy+ch/(r0*9));
  if(ch>.6){
    const str=(c.rx*c.ry)/(r0*r0*1.02), asp=c.rx/c.ry;
    const pitch=g.mode==='move'?.85:g.mode==='squash'?clamp(1.5-str*.6,.9,1.8):clamp(.75+Math.abs(Math.log(asp))*.55,.75,2);
    SFX.stretch(pitch,clamp(g.speed/(600*u),.4,1.2));
    if(g.speed>500*u&&R()<.5){ sheep.surp=Math.max(sheep.surp,.7); }
    if(g.mode!=='move'&&R()<clamp(g.speed/(900*u),.1,.8)){ const e=edgePt(c,g.th); addP({t:'fb',x:e.x+c.pinchX,y:e.y+c.pinchY,vx:rnd(-30,30)*u,vy:rnd(-30,20)*u,life:rnd(.5,.9),a:R()*TAU}); }
  }
}
function endGrab(g){
  const c=g.c; if(!c||c.grab!==g) return;
  c.grab=null;
  c.jigT=0; c.jigA=g.mode==='pending'?.05:clamp(.05+g.travel/(L.r0*12),.05,.11);
  c.pvx=c.pinchX*-6; c.pvy=c.pinchY*-6;
  if(g.mode==='pending'){ SFX.puru(1.1); }
  else { SFX.puru(clamp(1.25-(c.rx*c.ry)/(L.r0*L.r0*3),.7,1.3)); }
  if(g.mode==='move') magnet(c);
}
function magnet(c){
  const ly=landY(c); let best=null,bd=1e9;
  const feats=[{x:L.pond.x,y:L.pond.y},{x:L.laundry.x,y:L.laundry.y-L.laundry.ph*.4},{x:L.hills[0].x,y:L.hills[0].y-L.hills[0].h*.4},{x:L.hills[1].x,y:L.hills[1].y-L.hills[1].h*.4},{x:L.plaza.x,y:L.plaza.y}];
  for(const f of feats){ const d=Math.hypot((c.x-f.x)/(1.4*u),(ly-f.y)/(1.0*u)); if(d<bd){bd=d;best=f;} }
  if(best&&bd<70){ const o=landOff(c); c.glide={x:lerp(c.x,best.x,.75),y:clamp(lerp(c.y,best.y-o,.85),L.minY+c.ry*.3,H-SA.b-4*u-o)}; }
}
function onDown(e){
  e.preventDefault();

  if(viewer.open){ if(now-viewer.openAt>350){viewer.open=false; SFX.pop();} return; }
  const p=toWorld(e.clientX,e.clientY);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const c=hitCloud(p.x,p.y);

  ptrs.set(e.pointerId,{tap:true});

}
function onMove(e){
  const pr=ptrs.get(e.pointerId); if(!pr||!pr.grab) return;
  e.preventDefault();
  S.lastInput=performance.now()/1000;
  const p=toWorld(e.clientX,e.clientY);

}
function onUp(e){

}
function releaseAll(){ for(const [,pr] of ptrs){ if(pr.grab) endGrab(pr.grab); } ptrs.clear(); }
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});

['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false}));

function tapWorld(p){
  // painting on bakery wall
  if(saved){ const pt=L.painting; if(Math.abs(p.x-pt.x)<pt.w*.9+10*u&&Math.abs(p.y-pt.y)<pt.h*.9+10*u){ viewer.open=true; viewer.openAt=performance.now(); viewer.t=0; SFX.shine(); sheep.happy=1; return; } }
  // animals
  let ba=null,bd=26*u;
  for(const a of animals){ if(!a.arrived) continue; const d=dist(p.x,p.y,a.x,a.y-10*u); if(d<bd){bd=d;ba=a;} }
  if(ba){ ba.cheer=1; ba.look=1.2; if(ba.kind==='duck')SFX.quack(); else SFX.squeak(); return; }
  if(dist(p.x,p.y,boat.x,boat.y)<26*u){ boat.bob=1; if(boat.mode==='sleep'){SFX.snap();} else SFX.horn(); return; }
  if(dist(p.x,p.y,L.sheep.x,L.sheep.y)<36*u){ sheep.happy=1; sheep.blink=.2; SFX.hop(); if(!S.first){firstTouchFx();} return; }
  const pd=Math.pow((p.x-L.pond.x)/(L.pond.rx*1.1),2)+Math.pow((p.y-L.pond.y)/(L.pond.ry*1.4),2);
  if(pd<1){ if(S.water>.25){ RIP.push({x:p.x,y:p.y,r:2*u,life:1}); SFX.plink(); } else { addP({t:'sp',x:p.x,y:p.y,vx:rnd(-20,20)*u,vy:-40*u,life:.4,col:'176,145,106'}); SFX.hop(); } return; }
  if(dist(p.x,p.y,L.mill.x,L.mill.y)<L.mill.r*1.5){ S.millA+=.5; SFX.creak(); return; }
  if(Math.abs(p.x-L.laundry.x)<L.laundry.hw*1.1&&Math.abs(p.y-(L.laundry.y-L.laundry.ph*.6))<L.laundry.ph*.7){ S.laundryPoke=1; SFX.squeak(); return; }
  if(dist(p.x,p.y,L.car.x,L.car.y-L.car.r*.5)<L.car.r*1.3){ S.carA+=.6; S.windA+=.6; SFX.creak(); return; }
  for(const h of L.hills){ if(Math.abs(p.x-h.x)<h.w*1.2&&p.y<h.y+4*u&&p.y>h.y-h.h-8*u){ const k=S.hills[L.hills.indexOf(h)]; h.poke=1; for(let i=0;i<6;i++) addP({t:k.snow>.2?'s':'sp',x:p.x,y:p.y,vx:rnd(-40,40)*u,vy:rnd(-60,-20)*u,ty:p.y+6*u,ph:R()*9,vy2:1,life:.6,col:'120,170,110'}); SFX.hop(); return; } }
}

// ---------------------------------------------------------------- hints & demo
const ghost={on:false,t:0,dur:1.8,x0:0,y0:0,x1:0,y1:0,c:null,type:''};
let hint=null;
function pickCloud(pref){
  // prefer freshest cloud near spot, else nearest to pref point
  let best=null,bd=1e9;
  for(const c of clouds){ if(c.born<.8) continue; const d=pref?dist(c.x,landY(c),pref.x,pref.y):0; if(d<bd){bd=d;best=c;} }
  return best;
}
function cloudOver(fx,fy,tolx){ return clouds.find(c=>Math.abs(c.x-fx)<Math.max(c.crx*.9,tolx||30*u)&&Math.abs(landY(c)-fy)<L.tol*.9); }
function edgeHint(c,type){
  if(type==='wide'){ const s=c.x<W*.5?1:-1; const th=s>0?0:Math.PI; const e=edgePt(c,th); return {type,c,th,x:e.x,y:e.y,dx:s*70*u,dy:0}; }
  if(type==='tall'){ const th=-Math.PI/2; const e=edgePt(c,th); return {type,c,th,x:e.x,y:e.y,dx:0,dy:-70*u}; }
  const s=c.x<W*.5?1:-1; const th=s>0?0:Math.PI; const e=edgePt(c,th); return {type:'squash',c,th,x:e.x,y:e.y,dx:-s*Math.min(45*u,c.crx*.5),dy:0};
}
function moveHint(c,tx,ty){ return {type:'move',c,th:0,x:c.x,y:c.y,dx:clamp(tx-c.x,-W,W),dy:clamp(ty-landY(c),-H,H)}; }
function computeHint(){
  if(!clouds.length) return null;
  const home=clouds.find(c=>c===sheep.home)||clouds[clouds.length-1];
  if(!S.first) return edgeHint(home,'wide');
  const p=L.pond, la=L.laundry, pl=L.plaza;
  const freeOf=(...busy)=>{ const fr=clouds.filter(c=>!busy.includes(c)&&c.born>.8); if(!fr.length) return null; return fr.find(c=>c===sheep.home)||fr[fr.length-1]; };
  const kind=c=>c.snow>.5?'snow':c.rain>.4?'rain':c.sun>.5?'sun':'none';
  // 1 overflow
  if(!S.disc.pour){
    const c=cloudOver(p.x,p.y,p.rx*.6);
    if(c){ if(kind(c)!=='rain') return edgeHint(c,'wide'); return null; }
    const f=freeOf(); if(!f) return null; return kind(f)==='rain'?moveHint(f,p.x,p.y):edgeHint(f,'wide');
  }
  // 5 keep water: thin the rain cloud over the full pond
  const rainP=cloudOver(p.x,p.y,p.rx*.6);
  if(!S.disc.keep && S.water>.9 && rainP && kind(rainP)==='rain') return edgeHint(rainP,'tall');
  // 2 flags
  if(!S.disc.flag){
    const c=cloudOver(la.x,la.y-la.ph*.4); if(c&&kind(c)==='sun') return null;
    if(c&&kind(c)!=='rain') return edgeHint(c,'tall');
    const f=freeOf(rainP); if(!f) return null; return kind(f)==='sun'?moveHint(f,la.x,la.y-la.ph*.4):edgeHint(f,'tall');
  }
  // 3 sled
  const snowyHill=S.hills.findIndex(h=>h.snow>.4);
  if(!S.disc.sled){
    if(snowyHill>=0) return null;
    const hi=L.hills[0]; const c=cloudOver(hi.x,hi.y-hi.h*.4); if(c&&kind(c)==='snow') return null;
    const f=freeOf(rainP)||freeOf(); if(!f) return null; return kind(f)==='snow'?moveHint(f,hi.x,hi.y-hi.h*.4):edgeHint(f,'squash');
  }
  // 6 melt
  if(!S.disc.melt){
    if(snowyHill<0){ const f=freeOf(rainP)||freeOf(); if(!f) return null; return kind(f)==='snow'?moveHint(f,L.hills[0].x,L.hills[0].y-L.hills[0].h*.4):edgeHint(f,'squash'); }
    const hi=L.hills[snowyHill]; const c=cloudOver(hi.x,hi.y-hi.h*.4); if(c&&kind(c)==='sun') return null;
    if(c) return edgeHint(c,'tall');
    const f=freeOf(); if(!f) return null; return kind(f)==='sun'?moveHint(f,hi.x,hi.y-hi.h*.4):edgeHint(f,'tall');
  }
  // 4 rainbow tent
  if(!S.disc.tent){
    const rs=clouds.filter(c=>kind(c)==='rain'), ss=clouds.filter(c=>kind(c)==='sun');
    const rAt=rs.find(c=>Math.abs(c.x-pl.x)<c.crx&&Math.abs(landY(c)-pl.y)<L.tol);
    const sAt=ss.find(c=>Math.abs(c.x-pl.x)<sunHW(c)&&Math.abs(landY(c)-pl.y)<L.tol*1.2);
    if(!rAt){ const f=rs.find(c=>c!==sAt)||clouds.find(c=>c!==sAt&&kind(c)!=='sun'); if(!f) return null; return kind(f)==='rain'?moveHint(f,pl.x-pl.rx*.3,pl.y):edgeHint(f,'wide'); }
    if(!sAt){ const f=ss.find(c=>c!==rAt)||clouds.find(c=>c!==rAt); if(!f) return null; return kind(f)==='sun'?moveHint(f,pl.x+pl.rx*.5,pl.y):edgeHint(f,'tall'); }
    return null;
  }
  if(!S.disc.keep){
    if(S.water<.95){ const c=cloudOver(p.x,p.y,p.rx*.6); if(c&&kind(c)==='rain') return null; const f=c||freeOf(); if(!f) return null; return c?edgeHint(c,'wide'):(kind(f)==='rain'?moveHint(f,p.x,p.y):edgeHint(f,'wide')); }
    return null;
  }
  return null;
}
function startGhost(h){
  ghost.on=true; ghost.t=0; ghost.type=h.type; ghost.c=h.c; ghost.x0=h.x; ghost.y0=h.y; ghost.x1=h.x+h.dx; ghost.y1=h.y+h.dy; ghost.th=h.th;
  ghost.dur=h.type==='move'?2.2:1.6;

// ---------------------------------------------------------------- simulation
function setDisc(k,x,y){
  if(S.disc[k]) return false; S.disc[k]=1; S.discN++;
  celebrate(k,x,y); return true;
}
function celebrate(k,x,y){
  SFX.success(k);
  for(let i=0;i<26;i++){ const a=R()*TAU,s=rnd(40,160)*u; addP({t:'sk',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50*u,life:rnd(.8,1.5),col:['255,230,150','255,190,200','190,230,255','210,255,200'][i%4]}); }
  for(let i=0;i<10;i++) confetti(x,y-10*u,1);
  sheep.happy=1.6;
  for(const a of animals) if(a.arrived&&!a.riding) a.cheer=1;
}
function confetti(x,y,s){
  const cols=['#f19a8e','#f6cf6a','#8fd0b2','#8db6ec','#d3a6ea','#ffffff'];
  addP({t:'cf',x,y,vx:rnd(-90,90)*u*s,vy:rnd(-220,-80)*u*s,rot:R()*TAU,vr:rnd(-6,6),life:rnd(2,3.4),col:cols[R()*cols.length|0],sh:R()<.5?0:1,sz:rnd(3,6)*u});
}
let wPond={r:0,s:0,n:0},wLaundry=wPond,wPlaza=wPond,wHills=[wPond,wPond];
function sim(dt){
  S.time+=dt;
  // ---- clouds
  for(const c of clouds){
    c.born=Math.min(1,c.born+dt*1.8);
    const k=c.grab?520:240, dmp=c.grab?40:5.5;
    c.vrx+=(k*(c.rx-c.crx)-dmp*c.vrx)*dt; c.vry+=(k*(c.ry-c.cry)-dmp*c.vry)*dt;
    c.crx+=c.vrx*dt; c.cry+=c.vry*dt;
    if(!c.grab){
      c.pvx+=(-200*c.pinchX-6*c.pvx)*dt; c.pvy+=(-200*c.pinchY-6*c.pvy)*dt;
      c.pinchX+=c.pvx*dt; c.pinchY+=c.pvy*dt;
      if(Math.abs(c.pinchX)+Math.abs(c.pinchY)<.05&&Math.abs(c.pvx)+Math.abs(c.pvy)<.5){c.pinchX=c.pinchY=0;}
    }
    for(const d of c.dents){ d.v+=(-160*d.amp-5*d.v)*dt; d.amp+=d.v*dt; }
    c.dents=c.dents.filter(d=>Math.abs(d.amp)>.004||Math.abs(d.v)>.05);
    c.jigT+=dt;
    if(c.glide&&!c.grab){ c.x=lerp(c.x,c.glide.x,1-Math.exp(-dt*4)); c.y=lerp(c.y,c.glide.y,1-Math.exp(-dt*4)); if(dist(c.x,c.y,c.glide.x,c.glide.y)<1) c.glide=null; }
    const sw=shapeW(c), rate=1-Math.exp(-dt*3);
    c.rain=lerp(c.rain,sw.rain,rate); c.sun=lerp(c.sun,sw.sun,rate); c.snow=lerp(c.snow,sw.snow,rate);
    c.energy=Math.max(0,c.energy-dt*.02);
    c.pow=.82+.4*c.energy;
    // demo nudge
    let nx=0,ny=0;
    if(ghost.on&&ghost.c===c&&!c.grab){ const gp=ghostPos(); if(ghost.type==='move'){nx=(gp.x-ghost.x0)*.12;ny=(gp.y-ghost.y0)*.12;} else { const pr=ghostPress(); c.pinchA=ghost.th; const e=edgePt(c,ghost.th); const k=ghost.type==='squash'?.35:.55; c.pinchX=lerp(c.pinchX,clamp((gp.x-e.x)*k*pr,-26*u,26*u),.3); c.pinchY=lerp(c.pinchY,clamp((gp.y-e.y)*k*pr,-26*u,26*u),.3);} }
    if(sheep.reach>0&&sheep.reachC===c&&!c.grab){ const r=Math.sin(Math.min(1,sheep.reachT/2.4)*Math.PI); const e=edgePt(c,sheep.reachTh); const dx=L.sheep.x-e.x, dy=L.sheep.y-e.y, dl=Math.hypot(dx,dy)||1; c.pinchA=sheep.reachTh; c.pinchX=lerp(c.pinchX,dx/dl*18*u*r,.2); c.pinchY=lerp(c.pinchY,dy/dl*18*u*r,.2); }
    else if(hint&&hint.c===c&&hint.type!=='move'&&!c.grab&&!ghost.on&&ptrs.size===0&&performance.now()/1000-S.lastInput>1.2){ const b=Math.pow(Math.max(0,Math.sin(S.time*4.2)),2)*7*u; c.pinchA=hint.th; c.pinchX=lerp(c.pinchX,Math.cos(hint.th)*b,.25); c.pinchY=lerp(c.pinchY,Math.sin(hint.th)*b,.25); }
    c.nudgeX=lerp(c.nudgeX,nx,.15); c.nudgeY=lerp(c.nudgeY,ny,.15);
    spawnWeather(c,dt);
  }
  // ---- sheep dough supply
  const home=sheep.home;
  if(home&&clouds.includes(home)){
    const carried=home.grab&&home.grab.mode==='move'&&dist(home.x,home.y,L.spot.x,L.spot.y)>L.r0*1.3;
    if(carried||(!home.grab&&dist(home.x,home.y,L.spot.x,L.spot.y)>L.r0*2.6+home.crx*.4)){ sheep.home=null; SFX.snap(); sheep.surp=1; sheep.kneadT=1.3; for(let i=0;i<6;i++) addP({t:'fb',x:L.sheep.x+24*u,y:L.sheep.y,vx:rnd(-40,60)*u,vy:rnd(-40,20)*u,life:.7,a:R()*TAU}); }
  } else if(sheep.kneadT<0){
    const near=clouds.find(c=>dist(c.x,c.y,L.spot.x,L.spot.y)<L.r0*1.6);
    if(near){ sheep.home=near; }
    else if(clouds.length<3) sheep.kneadT=1.3;
  }
  if(sheep.kneadT>=0){ sheep.kneadT-=dt; sheep.knead=1;
    if(sheep.kneadT<0){ sheep.knead=0;
      const blocked=clouds.some(c=>dist(c.x,c.y,L.spot.x,L.spot.y)<L.r0*1.2);
      if(!blocked&&clouds.length<3){ const c=newCloud(L.spot.x+rnd(-6,6)*u,L.spot.y+rnd(-4,4)*u,true); clampCloud(c); clouds.unshift(c); sheep.home=c; SFX.pop(); sheep.happy=.8; }
    } }
  // ---- weather at features
  const p=L.pond, la=L.laundry, pl=L.plaza;
  wPond=wSpan(p.x,p.y,p.rx*.55);
  wLaundry=wSpan(la.x,la.y-la.ph*.4,la.hw*.6);
  wPlaza=wSpan(pl.x,pl.y,pl.rx*.4);
  wHills=L.hills.map(h=>wSpan(h.x,h.y-h.h*.4,h.w*.5));
  // ---- pond & channel
  let meltIn=0;
  S.hills.forEach((hs,i)=>{
    const w=wHills[i];
    hs.snow=Math.min(1,hs.snow+w.n*.21*dt);
    const melt=Math.min(hs.snow,(w.s*.15+w.r*.05)*dt);

function rainbowSim(dt){

  let best=null,bv=0;

    for(const b of clouds){ if(b===a||b.sun<.25) continue;
      const dy=Math.abs(landY(a)-landY(b)); if(dy>L.tol*2.2) continue;
      const ar=rainHW(a), bs=sunHW(b);

      const v=(hi-lo)*a.rain*b.sun; if(v>bv){bv=v;best={x:(lo+hi)/2,y:(landY(a)+landY(b))/2,span:Math.abs(a.x-b.x)+ar*.5+bs*.3,lo,hi};}
    } }
  if(best){ rb.x=lerp(rb.x||best.x,best.x,1-Math.exp(-dt*4)); rb.y=lerp(rb.y||best.y,best.y,1-Math.exp(-dt*4)); rb.r=lerp(rb.r||40*u,clamp(best.span*.6,45*u,190*u),1-Math.exp(-dt*3)); }

function inPondWater(x,y){ const p=L.pond, lv=clamp(S.water,0,1.1); const rx=p.rx*(.28+.72*lv), ry=p.ry*(.3+.7*lv); return Math.pow((x-p.x)/rx,2)+Math.pow((y-p.y)/ry,2)<1&&S.water>.08; }

function gIdx(x,y){ const gx=Math.floor(x/W*GX), gy=Math.floor((y-L.hor)/(H-L.hor)*GY); if(gx<0||gy<0||gx>=GX||gy>=GY) return -1; return gy*GX+gx; }
function partSim(dt){

}

function boatSim(dt){
  const b=boat; const p=L.pond;
  b.bob=Math.max(0,b.bob-dt*1.5);
  const float=S.water>.35;
  if(b.mode==='sleep'){
    b.x=lerp(b.x,p.x-p.rx*.15,dt); b.y=lerp(b.y,p.y+2*u,dt); b.ang=lerp(b.ang,-.28,dt*2); b.awake=Math.max(0,b.awake-dt);

    return;
  }

  if(b.mode==='loop'){
    if(S.water<.28&&!b.riders.length){ b.mode='sleep'; return; }
    b.loopA+=dt*spd/(p.rx*.5);
    const lp=loopPos(b.loopA); tx=lp.x; ty=lp.y;
    if(b.req>=0&&S.streams[b.req].carve>.4&&S.water>.3){ startTrip(b.req); }
    else if(b.tripCool<=0&&S.flow>.3){ startTrip(S.park.on?'plaza':'mill'); b.tripCool=rnd(9,14); }
    else if(b.tripCool<=0&&S.park.on&&S.flow>.12){ startTrip('plaza'); b.tripCool=rnd(10,16); }
  } else if(b.mode==='out'||b.mode==='back'){

    if(dist(b.x,b.y,tx,ty)<5*u){ b.pi++; if(b.pi>=b.path.length){ if(b.mode==='out'){ b.mode='wait'; b.wait=typeof b.dest==='number'?6:1.2; } else { b.mode='loop'; b.loopA=Math.atan2((b.y-p.y)/p.ry,(b.x-p.x)/p.rx); } } }
  }

    if(b.wait<=0||(typeof b.dest==='number'&&b.req<0&&b.wait<4.5)){ b.mode='back'; b.path=b.full.slice().reverse().concat([loopPos(b.loopA)]); b.pi=0; if(b.req===b.dest) b.req=-1; }

  }

function rainAt(x,y){ return wAt(x,y).r; }
function nearestShelter(a){ let best=L.shelters[0],bd=1e9; for(const s of L.shelters){const d=dist(a.x,a.y,s.x,s.y); if(d<bd){bd=d;best=s;}} return best; }

}
function carSeat(i){ const c=L.car, a=S.carA+i*TAU/4; return {x:c.x+Math.cos(a)*c.r*1.15,y:c.y-c.r*.45+Math.sin(a)*c.r*.32,front:Math.sin(a)>0}; }
function boatSeatFree(){ for(let i=0;i<3;i++) if(!boat.riders.some(r=>r.seat===i)) return i; return -1; }

}
function hillPt(h,s,ramp){ // s: 0 top -> .7 foot -> 1 runout end

function think(a){
  const pl=L.plaza, p=L.pond;
  const raining=!a.riding&&rainAt(a.x,a.y)>.18;
  const best=S.hills.reduce((bi,h,i)=>h.snow>(bi<0?.4:S.hills[bi].snow)?i:bi,-1);
  a.prevGoal=a.goal;
  if(S.parade&&a.inParade){ a.goal='parade'; return; }
  if(a.kind==='rabbit'){
    if(a.goal==='sled'&&a.sledH>=0&&S.hills[a.sledH].snow>.22){
      // curious: try a newly snowed hill
      const j=1-a.sledH; if(S.hills[j].snow>.5&&(!S.sledHills[j]||((a.runs||0)>=3&&R()<.05))&&(a.st==='climbBack'||a.st==='toFoot')){ a.sledH=j; a.st='toFoot'; a.runs=0; a.cheer=1; }
      return; }
    if(best>=0){
      if(a.riding==='boat'){ if(boat.mode==='loop'||(boat.mode==='wait'&&boat.dest===best)) dismount(a); else return; }
      if(a.riding==='car') dismount(a);
      if(a.goal!=='sled'||a.sledH!==best){ a.goal='sled'; a.sledH=best; a.st='toFoot'; }
      return;
    }
    if(a.goal==='sled'&&a.sledH>=0){ const st=S.streams[a.sledH]; if(st.water>.05&&st.carve>.4){ a.goal='waitBoat'; a.wantBoat=a.sledH; a.boatT=0; } else { a.goal='idle'; } a.st=''; }
    if(a.riding==='boat'){ if(S.fest>.8&&S.time-a.boardT>14&&boat.mode==='loop'){ dismount(a); a.goal='plaza'; } else { a.goal='ride'; } return; }
    if(a.goal==='waitBoat'){ if(a.boatT<16) return; a.goal='idle'; boat.req=-1; }
  }
  if(a.kind==='duck'&&a.riding!=='car'){
    if(a.riding==='boat'){ if(S.fest>.8&&boat.mode==='loop'&&S.time-a.boardT>10){ dismount(a); a.goal='plaza'; } else a.goal='ride'; return; }
    if(S.fest>.8&&!(S.time-a.lastRide<6)){ a.goal=S.park.on&&S.carS>.6&&R()<.4?'car':'plaza'; return; }
    if(S.water>.35&&boat.mode!=='sleep'&&boatSeatFree()>=0){ a.goal='boat'; return; }
    a.goal=raining?'pond':'idle'; return;
  }
  if(a.riding==='car'){ if(S.time-a.lastRide>rnd(12,18)){ dismount(a); a.lastRide=S.time; a.goal='plaza'; return; } if(S.carS<.25){ a.carStop=(a.carStop||0)+.4; if(a.carStop>2){ a.carStop=0; dismount(a); a.lastRide=S.time; a.goal='plaza'; } } else a.carStop=0; return; }
  if(a.riding==='boat'){ a.goal='ride'; return; }
  if(raining){ a.goal='shelter'; a.shelterT=0; return; }

  if(S.fest>.8){ if(a.goal==='car') return; if(S.park.on&&S.carS>.6&&S.time-a.lastRide>22&&carSeatFree()>=0&&R()<.5){ a.goal='car'; return; } a.goal='plaza'; return; }
  a.goal='idle';
}
function walkTo(a,tx,ty,dt,run){

  if(d<2*u){ a.moving=false; return true; }
  const sp=a.speed*u*(run?1.7:1)*(S.park.on?1.05:1);
  const s=Math.min(d,sp*dt); a.x+=dx/d*s; a.y+=dy/d*s; a.moving=true; if(Math.abs(dx)>1) a.face=dx>0?1:-1;
  // keep out of pond (unless duck heading to pond edge)
  const p=L.pond; const ex=(a.x-p.x)/(p.rx*1.12), ey=(a.y-p.y)/(p.ry*1.3), q=Math.hypot(ex,ey);
  if(q<1){ const nx=ex/q, ny=ey/q; a.x=p.x+nx*p.rx*1.12; a.y=p.y+ny*p.ry*1.3; const tg=(dx*-ny+dy*nx)>=0?1:-1; a.x+=-ny*tg*sp*dt*.9; a.y+=nx*tg*sp*dt*.5; }

function animalsSim(dt){

    if(S.park.on&&S.fest>.9&&S.paradeCool<=0&&ready.length>=4&&R()<dt*.08){
      const pl=L.plaza; const y=pl.y+pl.ry*.2;
      const path=[{x:SA.l+20*u,y:y+8*u},{x:pl.x-pl.rx,y:y+6*u},{x:pl.x,y:y+pl.ry*1.2},{x:pl.x+pl.rx,y:y},{x:pl.x,y:y-pl.ry*1.1},{x:pl.x-pl.rx*.6,y:y-pl.ry*.3},{x:pl.x,y:y+pl.ry*.3}];

  }

      if(q.t==='cf'){ g.save(); g.translate(q.x,q.y); g.rotate(q.rot); g.globalAlpha=Math.min(1,q.life); g.fillStyle=q.col;
        if(q.sh){ flower(g,0,0,q.sz,q.col); } else { g.scaleX=1; g.fillRect(-q.sz,-q.sz*.6*Math.abs(Math.cos(q.rot*2)),q.sz*2,q.sz*1.2*Math.abs(Math.cos(q.rot*2))+.5); } g.restore(); }
      else if(q.t==='sk'){ g.globalAlpha=Math.min(1,q.life*1.5); g.fillStyle='rgb('+q.col+')'; sparkle(g,q.x,q.y,2.2*u); }
      else if(q.t==='ring'){ g.globalAlpha=q.life*1.6; g.strokeStyle='rgba(255,250,225,.95)'; g.lineWidth=3*u; g.beginPath(); g.arc(q.x,q.y,q.r,0,TAU); g.stroke(); g.globalAlpha=q.life; g.fillStyle='rgba(255,255,240,.5)'; g.beginPath(); g.arc(q.x,q.y,q.r*.6,0,TAU); g.fill(); }
      else if(q.t==='fb'){ g.globalAlpha=q.life; g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=1.2*u; g.beginPath(); g.moveTo(q.x,q.y); g.quadraticCurveTo(q.x+Math.cos(q.a)*5*u,q.y+Math.sin(q.a)*5*u,q.x+Math.cos(q.a+.7)*9*u,q.y+Math.sin(q.a+.7)*9*u); g.stroke(); }
    } else {
      if(q.t==='sp'){ g.globalAlpha=Math.min(1,q.life*3); g.fillStyle='rgb('+q.col+')'; g.beginPath(); g.arc(q.x,q.y,1.5*u,0,TAU); g.fill(); }
      else if(q.t==='dr'){ g.globalAlpha=.7; g.fillStyle='rgb(130,170,215)'; g.beginPath(); g.arc(q.x,q.y,1.4*u,0,TAU); g.fill(); }
    }
  }
  g.restore();
}
function drawHint(g){
  const idle=performance.now()/1000-S.lastInput;
  if(hint&&ptrs.size===0&&idle>1.2&&!ghost.on){
    const h=hint; const c=h.c; let x,y;
    if(h.type==='move'){ x=c.x; y=c.y; } else { const e=edgePt(c,h.th); x=e.x+c.pinchX; y=e.y+c.pinchY; }
    const pulse=.5+.5*Math.sin(S.time*4.2);
    g.save(); const r=(22+8*pulse)*u; const gr=g.createRadialGradient(x,y,2,x,y,r);
    gr.addColorStop(0,'rgba(255,214,120,'+(.55+.25*pulse)+')'); gr.addColorStop(.5,'rgba(255,200,140,'+(.25+.15*pulse)+')'); gr.addColorStop(1,'rgba(255,200,150,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    for(let k=0;k<2;k++){ const t=(S.time*.9+k*.5)%1; g.strokeStyle='rgba(245,170,90,'+(.55*(1-t))+')'; g.lineWidth=2.2*u*(1-t)+.5; g.beginPath(); g.arc(x,y,(8+26*t)*u,0,TAU); g.stroke(); }
    for(let k=0;k<3;k++){ const a=S.time*2.2+k*TAU/3; g.fillStyle='rgba(255,205,90,'+(.7+.3*pulse)+')'; sparkle(g,x+Math.cos(a)*16*u,y+Math.sin(a)*16*u,1.8*u); }
    g.restore();
    // a soft bounce of that edge to say "this one"
    if(h.type!=='move'&&!c.grab&&!(c.pinchX||c.pinchY)){ c.dents.length<2&&Math.sin(S.time*4.2)>.995&&c.dents.push({a:h.th,amp:.06,v:0}); }
  }
  if(ghost.on){
    const p=ghostPos(), pr=ghostPress();
    const a=Math.min(1,ghost.t/.2)*(ghost.t>ghost.dur?Math.max(0,1-(ghost.t-ghost.dur)/.4):1);
    g.save(); g.globalAlpha=a*.85;
    // trail
    g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=5*u; g.lineCap='round'; g.beginPath(); g.moveTo(ghost.x0,ghost.y0); g.lineTo(p.x,p.y); g.stroke();
    // fingertip
    const r=(19-4*pr)*u;
    const hg=g.createRadialGradient(p.x,p.y,r*.5,p.x,p.y,r*2.2); hg.addColorStop(0,'rgba(255,230,170,.55)'); hg.addColorStop(1,'rgba(255,230,170,0)'); g.fillStyle=hg; g.beginPath(); g.arc(p.x,p.y,r*2.2,0,TAU); g.fill();
    g.fillStyle='rgba(255,236,226,.92)'; g.strokeStyle='rgba(170,130,120,.6)'; g.lineWidth=1.4*u;
    g.beginPath(); g.ellipse(p.x+3*u,p.y+4*u,r*.95,r*1.15,-.3,0,TAU); g.fill(); g.stroke();
    g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.ellipse(p.x+1*u,p.y-1*u,r*.45,r*.55,-.3,0,TAU); g.fill();
    if(pr>.5){ g.strokeStyle='rgba(255,255,255,'+(.6*pr)+')'; g.lineWidth=1.5*u; g.beginPath(); g.arc(ghost.x0,ghost.y0,(10+ghost.t*10%10)*u,0,TAU); g.stroke(); }
    g.restore();
  }
}
function buildPaintCanvas(){
  if(!saved) return;
  const w=240,h=180; const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); const rr=mulberry(77);
  g.fillStyle='#f8f2e2'; g.fillRect(0,0,w,h);
  const sky=g.createLinearGradient(0,0,0,h*.5); sky.addColorStop(0,'#cfe4ee'); sky.addColorStop(1,'#f5ecd8'); g.fillStyle=sky; g.fillRect(6,6,w-12,h*.48);
  g.fillStyle='#bcd69c'; g.fillRect(6,h*.5,w-12,h*.5-6);
  // tent arcs
  if(saved.park){ ['#f08c8c','#f6c27a','#f6e282','#96d6a0','#8cbeec','#b4a0e6'].forEach((col,i)=>{ g.strokeStyle=col; g.globalAlpha=.6; g.lineWidth=7; g.beginPath(); g.arc(w*.55,h*.88,h*.62-i*7,Math.PI,TAU); g.stroke(); }); g.globalAlpha=1; }
  // hills
  [[.2,.0],[.82,1]].forEach((q,i)=>{ const x=w*q[0], y=h*.55; g.fillStyle='#8fbf86'; g.beginPath(); g.ellipse(x,y,34,20,0,Math.PI,TAU); g.fill(); if(saved.snow[i]>.25){ g.fillStyle='#ffffff'; g.beginPath(); g.ellipse(x,y-6,24*Math.min(1,saved.snow[i]+.3),12,0,Math.PI,TAU); g.fill(); } });
  // pond
  const lv=Math.min(1,saved.water); g.fillStyle='#c6a982'; g.beginPath(); g.ellipse(w*.4,h*.68,50,13,0,0,TAU); g.fill();
  g.fillStyle='rgba(110,170,215,.9)'; g.beginPath(); g.ellipse(w*.4,h*.68,50*(.3+.7*lv),13*(.3+.7*lv),0,0,TAU); g.fill();
  if(saved.carve[0]>.4){ g.strokeStyle='rgba(110,170,215,.8)'; g.lineWidth=3; g.beginPath(); g.moveTo(w*.24,h*.56); g.lineTo(w*.3,h*.65); g.stroke(); }
  // flags
  const fc=saved.flag?['#f0857a','#f5c24f','#6fc3a0','#6f9fe6']:['#f3c0c8','#bfe0f0','#fbe3a6','#c9e6c1'];
  g.strokeStyle='#8b6b4e'; g.lineWidth=1.5; g.beginPath(); g.moveTo(w*.08,h*.8); g.quadraticCurveTo(w*.18,h*.84,w*.3,h*.8); g.stroke();
  fc.forEach((col,i)=>{ const x=w*(.1+i*.05); g.fillStyle=col; g.beginPath(); if(saved.flag){ g.moveTo(x-4,h*.81); g.lineTo(x+4,h*.81); g.lineTo(x,h*.87); } else g.rect(x-4,h*.81,8,10); g.fill(); });
  // animals as little dots of colour
  const kinds=['duck','rabbit'].concat(saved.ani.filter(k=>k!=='duck'&&k!=='rabbit'));
  kinds.forEach((k,i)=>{ const x=w*(.5+i*.06), y=h*.86; g.fillStyle=KINDS[k]?KINDS[k].c:'#fff'; g.beginPath(); g.arc(x,y,6,0,TAU); g.fill(); g.strokeStyle='rgba(90,70,60,.5)'; g.lineWidth=1; g.stroke(); g.fillStyle='#3a302e'; g.beginPath(); g.arc(x+2,y-1,1.2,0,TAU); g.fill(); });
  // sheep
  g.fillStyle='#fffdf6'; g.beginPath(); g.arc(w*.12,h*.22,12,0,TAU); g.fill(); g.strokeStyle='rgba(150,140,130,.5)'; g.stroke();
  g.fillStyle='#f5e6da'; g.beginPath(); g.arc(w*.12,h*.17,7,0,TAU); g.fill();
  // paper grain
  g.globalAlpha=.25; for(let i=0;i<400;i++){ g.fillStyle=rr()<.5?'#fff':'#c8b89a'; g.fillRect(rr()*w,rr()*h,1,1); } g.globalAlpha=1;
  g.strokeStyle='rgba(120,90,60,.4)'; g.lineWidth=3; g.strokeRect(3,3,w-6,h-6);
  paintCanvas=c;
}
function drawViewer(g){
  viewer.t=Math.min(1,viewer.t+.06);
  if(performance.now()-viewer.openAt>8000){ viewer.open=false; return; }
  const t=viewer.t, e=1-Math.pow(1-t,3);
  g.save(); g.fillStyle='rgba(250,244,230,'+(.6*e)+')'; g.fillRect(0,0,W,H);
  const pt=L.painting; const tw=Math.min(W*.82,H*.6*4/3), th=tw*.75;
  const x=lerp(pt.x,W/2,e), y=lerp(pt.y,H/2,e), w=lerp(pt.w,tw,e), h=lerp(pt.h,th,e);
  g.fillStyle='#9c7a58'; g.fillRect(x-w/2-8*u*e,y-h/2-8*u*e,w+16*u*e,h+16*u*e);
  if(paintCanvas) g.drawImage(paintCanvas,x-w/2,y-h/2,w,h);
  g.restore();
}

// ---------------------------------------------------------------- loop
let raf=0,last=0,running=false;
const SPEED=(()=>{ try{ const v=+(new URLSearchParams(location.search).get('speed')); return v>=1&&v<=8?Math.round(v):1; }catch(e){ return 1; } })();
function frame(ts){
  raf=0;
  if(!running) return;
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000)); last=ts;
  try{ for(let i=0;i<SPEED;i++) sim(dt); render(); }catch(err){ console.error(err); }
  raf=requestAnimationFrame(frame);
}
function run(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stop(); releaseAll(); saveNow(); if(AU.ctx&&AU.ctx.state==='running') AU.ctx.suspend().catch(()=>{}); }
  else { S.lastInput=performance.now()/1000; if(AU.ctx&&AU.ctx.state!=='running') AU.ctx.resume().catch(()=>{}); run(); }
});
window.addEventListener('pagehide',saveNow);
window.addEventListener('pageshow',()=>{ if(!document.hidden) run(); });
let rzT=0;
function onResize(){ clearTimeout(rzT); rzT=setTimeout(()=>{ releaseAll(); relayout(); },120); }
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

start(); run();

// small read-only window for automated checks
window.__gf={landY,S,get clouds(){return clouds;},get animals(){return animals;},boat,get L(){return L;},sheep,get hint(){return hint;},ghost,P};
})();
