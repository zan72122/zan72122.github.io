/* ---------- digger ---------- */
function wiggle(pts,A,B,m){

 for(let i=1;i<=n;i++){const t=i/n;const w=pp.amp*sin(t*PI*k+ph)*sin(t*PI);const p=clampWalk({x:lerp(A.x,B.x,t)+nx*w,y:lerp(A.y,B.y,t)+ny*w});pts.push({x:p.x,y:p.y});}
}
function pondEdge(x,y,inset){const p=L.pond;const a=Math.atan2((y-p.y)/p.ry,(x-p.x)/p.rx);return {x:p.x+cos(a)*(p.rx-inset),y:p.y+sin(a)*(p.ry-inset*0.6)};}

 if(inPondE(m.x,m.y,1.05)){const e=pondEdge(m.x,m.y,-5);m.x=e.x;m.y=e.y;P0.x=e.x;P0.y=e.y;m.lastLand={x:m.x,y:m.y};}
 const trail=[{x:P0.x,y:P0.y}];
 if(!wetAt(P0.x,P0.y,2)){
  const W=nearestWaterPoint(P0.x,P0.y,false)||{x:L.spring.ox,y:L.spring.oy,chan:false};
  const leg=[];wiggle(leg,P0,W,m);pts.push(...leg);
  const back=leg.slice(0,-1).reverse();back.push({x:P0.x,y:P0.y});pts.push(...back);

 }
 let from=P0;
 const dss=seeds.filter(s=>s.st==='dry'&&dst(s.x,s.y,P0.x,P0.y)<64).sort((a,b)=>dst(a.x,a.y,P0.x,P0.y)-dst(b.x,b.y,P0.x,P0.y)).slice(0,2);
 for(const ds of dss){const via=clampWalk({x:ds.x+(ds.x<from.x?3:-3),y:ds.y+2});wiggle(pts,from,via,m);from=via;trail.push(via);}

}
function aiDigger(m,dt){

  if(m.hop)return;
  if(m.curWp&&m.curWp.end){const e=pondEdge(m.x,m.y,-3);stampLine(m.x,m.y,e.x,e.y,2.3);trails.push(m.trail);if(trails.length>3)trails.shift();if(park.on)computeLanes();m.curWp=null;}

}

 if(m.st==='fail'){if(m.hop)return;m.t-=dt;if(m.t<=0){m.st='seek';return;}startHop(m,m.x+R_(-3,3),m.y+R_(-2,2),7,0.32);SFX.flap();burst(m.x,m.y,2,'feather',4);setMood(m,'want',0.6);return;}

/* ---------- climber ---------- */
function pickClimbTree(m){

 if(c.length){c.sort((a,b)=>dst(a.x,a.y,m.x,m.y)-dst(b.x,b.y,m.x,m.y));return {t:c[0],big:true};}

}

 if(m.st==='start'){if(inPlaza(m)){goUp(m);return;}

  const pts=[];const N=7;for(let k=1;k<=N;k++){pts.push({x:t.x+((k%2)?2.5:-2.5)*(k<N?1:0),y:t.y+1,z:topZ*k/N});}

  startRoute(m,pts,sp,()=>{if(big){m.st='top';m.t=0;m.dropT=R_(3,5);}else{m.st='tooSmall';m.t=1.2;setMood(m,'surprise',1);}},{top:true,keep:true,nosh:true});
  return;}

  const t=m.onTree;if(!t||trees.indexOf(t)<0){m.onTree=null;m.st='start';m.z=0;return;}
  m.top=true;m.z=treeTopZ(t)+1;m.x=t.x+sin(T*2)*1.5;m.y=t.y+1;t.bend=0.6+sin(T*2)*0.3;

   else{m.dropT=R_(4,6);const f=t.fruits.find(f=>f.r>=1);if(f){t.sway=0.6;dropFruit(t,f);}}

  }
  return;}

}
function makeBridge(t,m){

}
function bridgePts(b,n){

   if(a.ph===0){m.path=hopPts(m.x,m.y,t.x+R_(-1,1),t.y-2,pp.hopLen);a.ph=1;}else if(a.ph===1){if(!stepPath(m)){a.ph=2;a.t=0;m.hidden=true;}}

function slideStyle(m){
 const b=!!has(m,'boots'),w=!!has(m,'wings'),t=!!has(m,'tail'),h=!!has(m,'hat');
 if(b&&w)return {k:'rocket',sp:60,d:26,h:46,sp2:2.6,dur:1.3};
 if(w&&h)return {k:'float',sp:30,d:58,h:22,sp2:0.3,dur:2.4};
 if(t)return {k:'roll',sp:55,d:34,h:12,sp2:1,skip:2,dur:0.8};
 if(w)return {k:'glide',sp:40,d:62,h:20,sp2:0.5,dur:1.8};
 if(h)return {k:'boat',sp:26,d:20,h:6,sp2:0.15,dur:0.6,boat:true};
 if(b)return {k:'cannon',sp:62,d:16,h:9,sp2:2.2,dur:0.55};
 return {k:'belly',sp:45,d:32,h:13,sp2:1,dur:0.8};
}
function computeLanes(){
 const src=trails.slice(-3);
 if(!src.length)src.push([{x:L.spring.ox,y:L.spring.oy},{x:LW*0.5,y:L.my0+L.MH*0.5},{x:L.pond.x,y:L.pond.y}]);
 lanes=src.map((tr,i)=>{
  const segs=[];let tot=0;for(let k=1;k<tr.length;k++){const d=dst(tr[k-1].x,tr[k-1].y,tr[k].x,tr[k].y);segs.push(d);tot+=d;}
  const at=s=>{let r=s*tot;for(let k=0;k<segs.length;k++){if(r<=segs[k]||k===segs.length-1){const f=segs[k]?clamp(r/segs[k],0,1):0;return {x:lerp(tr[k].x,tr[k+1].x,f),y:lerp(tr[k].y,tr[k+1].y,f)};}r-=segs[k];}return tr[tr.length-1];};
  const n=src.length;const topX=clamp(L.pond.x+(i-(n-1)/2)*10,L.wx0+8,L.wx1-8);
  const pts=[{x:topX,y:L.HY-2}];const N=14;
  for(let j=0;j<=N;j++){const s=j/N;const p=at(s);let x=LW*0.2+(p.x/LW)*LW*0.6;if(j<3)x=lerp(topX,x,j/3);pts.push({x:clamp(x,L.wx0+6,L.wx1-6),y:lerp(L.HY+5,L.plz.lip,s)});}
  const a=pts[pts.length-2],b=pts[pts.length-1];
  return {pts,col:i,lip:b,dir:sgn(b.x-a.x)||(b.x<LW/2?1:-1)};
 });
}
function boardsInfo(){return bridges.filter(b=>b.grow>=1).slice(0,3).map((b,i)=>{const x=clamp(b.tree.x,L.wx0+12,L.wx1-12);const dir=x<LW/2?1:-1;return {x,y:L.plz.board,dir,ex:x+dir*12,b};});}

 if(park.t<0){

}
function autoSwap(){
 const free=m=>!m.drag&&!m.route&&!m.arc&&!m.air&&!m.carriedBy&&!m.onTree&&regionY(m.y)==='meadow'&&!(m.mode==='digger'&&m.st==='trail');
 const A=mochis.filter(m=>free(m)&&m.cos.length);const B=mochis.filter(free);if(!A.length||B.length<2)return;
 const a=pick(A);const bs=B.filter(b=>b!==a);const b=bs.sort((p,q)=>p.cos.length-q.cos.length)[0];
 const c=pick(a.cos.filter(c=>!has(b,c.type)));if(!c)return;
 unwear(c,true);c.st='fly';c.fl={fx:a.x,fy:a.y-8,to:b,t:0};SFX.swap();setMood(a,'happy',1.5);setMood(b,'wow',1.5);a.lookX=b.x;a.lookY=b.y;b.lookX=a.x;b.lookY=a.y;found('swap');
}

/* ---------- fruits ---------- */
function dropFruit(t,f){const i=t.fruits.indexOf(f);if(i<0)return;t.fruits.splice(i,1);const d=treeDims(t);
 if(fruits.length>=12){const old=fruits.find(q=>q.st==='ground');if(old)fruits.splice(fruits.indexOf(old),1);}
 const dy=R_(2,6);fruits.push({kind:'f',x:t.x+f.ox,y:t.y+dy,z:dy+d.h-f.oy,vz:0,st:'fall',gold:!!f.gold,age:0,drag:null});SFX.pop();}
function updFruits(dt){
 for(let i=fruits.length-1;i>=0;i--){const f=fruits[i];
  if(f.st==='fall'){f.vz-=160*dt;f.z+=f.vz*dt;if(f.z<=0){f.z=0;if(abs(f.vz)>30){f.vz=-f.vz*0.35;}else{f.st='ground';f.vz=0;}}}
  else if(f.st==='ground'){f.age+=dt;if(f.age>50){fruits.splice(i,1);}}
 }
}

/* ---------- trees & seeds ---------- */
const STG=[0,2,6,11,16];
function updTrees(dt){
 for(const t of trees){
  t.wetNow=moistAt(t.x,t.y)||moistAt(t.x,t.y+3)||t.rain>0||inPondWater(t.x,t.y);
  if(t.rain>0)t.rain-=dt;
  if(t.wetNow)t.g+=dt;
  let st=0;for(let k=0;k<STG.length;k++)if(t.g>=STG[k])st=k;
  if(st>t.stage){const first=t.stage<0;t.stage=st;if(!first){t.pop=1;SFX.grow(st);burst(t.x,t.y-treeDims(t).h,6,'leaf');}
   if(st>=3)found('tree3');
   if(st===4){if(!first)found('bigtree');for(let k=0;k<4;k++)addFruit(t,0.2);if(t.hs.length<2){t.hs.push({ox:R_(-3,3),oy:R_(-1,1),st:0,w:0});}dirty=true;}}
  if(t.pop>0)t.pop=mx(0,t.pop-dt*2.5);
  if(t.sway>0)t.sway=mx(0,t.sway-dt*1.2);
  if(t.stage>=4){for(const f of t.fruits){if(t.wetNow||f.r<0.5)f.r=mn(1,f.r+dt*(t.wetNow?0.18:0.05));}
   t.regT-=dt;if(t.regT<=0){t.regT=t.wetNow?R_(5,8):R_(14,20);if(t.fruits.length<5)addFruit(t,0);}
   for(const h of t.hs)if(h.st===2&&!t.fruits.some(f=>f.gold&&f.hsr===h)&&rnd()<dt*0.2){t.fruits.push({ox:h.ox,oy:-treeDims(t).r*0.75+h.oy,r:1,gold:true,hsr:h});}}
 }
}
function addFruit(t,r){const d=treeDims(t);for(let k=0;k<8;k++){const a=R_(0,PI*2),rr=R_(0.2,0.8)*d.r;const ox=cos(a)*rr,oy=sin(a)*rr*0.8;if(t.fruits.some(f=>abs(f.ox-ox)<3&&abs(f.oy-oy)<3))continue;t.fruits.push({ox,oy,r,gold:false});return;}}
function updSeeds(dt){
 for(let i=seeds.length-1;i>=0;i--){const s=seeds[i];s.t+=dt;
  if(s.fade>0){s.fade+=dt;if(s.fade>1.6){seeds.splice(i,1);}continue;}
  if(s.st==='fall'){s.vz-=50*dt;s.z+=s.vz*dt;if(rnd()<dt*10)addP(s.x,s.y,0,0,0,0.4,K.d,0,0,s.z);if(s.z<=0){s.z=0;s.t=0;
    const p=clampWalk({x:s.x,y:s.y});s.x=p.x;s.y=p.y;
    if(inPondE(s.x,s.y,1.35)){s.fade=1;if(pond.level>0.05)ring(s.x,s.y,W3,4);continue;}
    if(moistAt(s.x,s.y)){s.st='crack';s.t=0;}else{s.st='dry';SFX.sleep();}}continue;}
  if(s.rain>0)s.rain-=dt;
  if(s.st==='dry'){if(s.t>1)found('sleep');if(moistAt(s.x,s.y)||s.rain>0){s.st='crack';s.t=0;s.wasDry=true;}continue;}
  if(s.st==='crack'){if(s.t>0.7){seeds.splice(i,1);burst(s.x,s.y,4,'shell');
    const near=trees.some(t=>dst(t.x,t.y,s.x,s.y)<16);
    if(near||trees.length>=8||s.y<L.wy0+1){flowers.push({x:s.x,y:s.y,c:pick([K.r,K.y,K.v,K.a,K.w,K.m]),t:0});SFX.sprout();if(flowers.length>40)flowers.shift();}
    else{const t=mkTree(s.x,s.y,0);t.stage=0;t.pop=1;if(s.rain>0)t.rain=s.rain;trees.push(t);SFX.sprout();found('sprout');}
    if(s.wasDry)found('wake');}}
 }
}

/* ---------- residents ---------- */
function resWalk(r,dt,sp){if(!r.path.length)return false;const p=r.path[0];const d=dst(r.x,r.y,p.x,p.y);const s=sp*dt;if(d<=s){r.x=p.x;r.y=p.y;r.path.shift();}else{r.x+=(p.x-r.x)/d*s;r.y+=(p.y-r.y)/d*s;if(abs(p.x-r.x)>0.3)r.face=p.x>r.x?1:-1;}r.bob+=dt*12;return true;}
function resNav(r,tx,ty){r.path=navPts(r,tx,ty,6);}
function updRes(r,dt){
 if(r.moodT>0){r.moodT-=dt;if(r.moodT<=0)r.mood=null;}
 if(r.route){r.vz=0;updRoute(r,dt);r.bob+=dt*10;return;}
 if(r.vz||r.z>0){r.vz-=160*dt;r.z+=r.vz*dt;if(r.z<=0){r.z=0;r.vz=0;}}
 const sh=getShade();const okB=bridges.filter(b=>b.grow>=1);
 r.t-=dt;
 switch(r.st){
 case 'home':{
  if(resWalk(r,dt,10))break;
  if(r.t>0){if(rnd()<dt*0.5){r.path=[{x:clamp(r.home+R_(-14,14),L.wx0,L.wx1),y:R_(L.fb0+8,L.fb1-3)}];}break;}
  if(okB.length){const tgt=sh||{x:r.x,y:L.my0+20};const b=okB.slice().sort((p,q)=>dst(p.tree.x,p.tree.y,tgt.x,tgt.y)-dst(q.tree.x,q.tree.y,tgt.x,tgt.y))[0];
   if(residents.filter(o=>o.br===b&&(o.st==='test'||o.st==='toBridge')).length<1){r.br=b;r.path=[{x:b.bx,y:b.by}];r.st='toBridge';break;}}
  r.t=R_(3,6);r.path=[{x:clamp(r.x+R_(-10,10),L.wx0,L.wx1),y:L.fb1-3}];
  if(sh||trees.some(t=>t.stage>=4)){r.vz=35;setMood(r,'wave',1.5);}
  break;}
 case 'toBridge':{if(!resWalk(r,dt,12)){r.st='test';r.t=1.1;r.br.wob=1;SFX.boing();}break;}
 case 'test':{if(r.t<0.55&&r.t+dt>=0.55){r.br.wob=1;r.vz=20;}if(r.t<=0){r.st='cross';found('res_cross');startRoute(r,bridgeRoute(r.br,true),13,()=>{r.st='visit';r.t=0;},{top:true});}break;}
 case 'visit':{
  if(sh&&!r.carry&&rnd()<0.5||sh&&r.carry){const n=residents.indexOf(r);const ang=n*1.1+2;r.sp_=n;resNav(r,sh.x+cos(ang)*sh.r*0.6,sh.y+sin(ang)*4+4);r.st='toShade';break;}
  if(!r.carry){const gf=fruits.filter(f=>f.st==='ground'&&regionY(f.y)==='meadow').sort((p,q)=>dst(p.x,p.y,r.x,r.y)-dst(q.x,q.y,r.x,r.y))[0];
   if(gf){r.tf=gf;resNav(r,gf.x,gf.y+1);r.st='toFruit';break;}
   const tr=trees.filter(t=>t.fruits.some(f=>f.r>=1)).sort((p,q)=>dst(p.x,p.y,r.x,r.y)-dst(q.x,q.y,r.x,r.y))[0];
   if(tr){r.tt=tr;resNav(r,tr.x+R_(-5,5),tr.y+3);r.st='toTree';break;}}
  r.st='goHome';break;}
 case 'toShade':{if(resWalk(r,dt,12))break;if(!sh){r.st='visit';break;}r.st='rest';r.t=R_(6,11);found('gather');
  if(r.carry){const tgt=mochis.filter(m=>dst(m.x,m.y,r.x,r.y)<30&&!m.drag).sort((p,q)=>dst(p.x,p.y,r.x,r.y)-dst(q.x,q.y,r.x,r.y))[0];const g=r.carry.gold;r.carry=null;if(tgt){eatFruit(tgt,g);found('share');}else{setMood(r,'love',1.5);SFX.eat();}}
  break;}
 case 'rest':{r.sit=true;if(!sh||dst(r.x,r.y,sh.x,sh.y)>sh.r+8){r.sit=false;r.st='visit';break;}if(rnd()<dt*0.2)setMood(r,'love',1);if(r.t<=0){r.sit=false;r.st=rnd()<0.5?'visit':'goHome';}break;}
 case 'toFruit':{if(resWalk(r,dt,12))break;const f=r.tf;if(f&&fruits.indexOf(f)>=0&&f.st==='ground'&&dst(f.x,f.y,r.x,r.y)<8){fruits.splice(fruits.indexOf(f),1);r.carry={gold:f.gold};SFX.pop();}r.st=sh?'visit':'goHome';break;}
 case 'toTree':{if(resWalk(r,dt,12))break;const t=r.tt;if(t){const f=t.fruits.find(f=>f.r>=1);if(f){t.fruits.splice(t.fruits.indexOf(f),1);r.carry={gold:!!f.gold};r.vz=50;t.sway=0.4;SFX.pop();}}r.st=sh&&r.carry?'visit':'goHome';break;}
 case 'goHome':{const b=okB.slice().sort((p,q)=>dst(p.tree.x,p.tree.y,r.x,r.y)-dst(q.tree.x,q.tree.y,r.x,r.y))[0];if(!b){r.st='visit';r.t=2;break;}
  r.br=b;resNav(r,b.tree.x+3,b.tree.y+2);r.st='toBase';break;}
 case 'toBase':{if(resWalk(r,dt,12))break;startRoute(r,bridgeRoute(r.br,false),13,()=>{r.st='walkHome';r.path=[{x:r.home+R_(-4,4),y:L.fb1-3}];},{top:true});break;}
 case 'walkHome':{if(resWalk(r,dt,10))break;if(r.carry){r.carry=null;const h=L.houses.find(h=>abs(h.x-r.home)<2);if(h)h.glow=1.5;burst(r.x,r.y-6,4,'spark');SFX.seed();found('res_home');}r.st='home';r.t=R_(4,9);break;}
 }
}

/* ---------- costume & mochi updates ---------- */
function updCostume(c,dt){
 if(c.pop>0)c.pop=mx(0,c.pop-dt*2.2);
 if(c.st==='drag'){const d=c.drag;const k=mn(1,dt*24);const ox=c.x,oy=c.y;c.x+=(d.tx-c.x)*k;c.y+=(d.ty-c.y)*k;c.z=5;const v=hyp(c.x-ox,c.y-oy)/mx(dt,0.001);c.str+=((clamp(v/160,0,0.55))-c.str)*mn(1,dt*10);return;}
 c.str=mx(0,c.str-dt*3);
 if(c.st==='fly'){const f=c.fl;f.t+=dt/0.9;const b=f.to;const p=mn(1,f.t);c.x=lerp(f.fx,b.x,p);c.y=lerp(f.fy,b.y,p);c.z=sin(PI*p)*22+6*(1-p);if(rnd()<dt*20)addP(c.x,c.y,0,0,0,0.4,K.d,2,0,c.z);if(p>=1){c.fl=null;c.st='ground';if(!b.drag&&!has(b,c.type))wear(b,c);else{c.z=0;}}return;}
 if(c.st==='ground'&&(c.z>0||c.vz)){c.vz-=160*dt;c.z+=c.vz*dt;const floor=(c.type==='hat'&&L.stumpPos&&dst(c.x,c.y,L.stumpPos.x,L.stumpPos.y)<4)?3:0;if(c.z<=floor){c.z=floor;if(abs(c.vz)>25){c.vz=-c.vz*0.35;}else c.vz=0;}}
}
function updMochi(m,dt){
 m.blinkT-=dt;if(m.blinkT<=0){m.blinkT=R_(1.8,4.5);m.blink=0.13;}if(m.blink>0)m.blink-=dt;
 if(m.moodT>0){m.moodT-=dt;if(m.moodT<=0)m.mood=null;}
 if(m.cheeks>0&&m.eatT<=0)m.cheeks=mx(0,m.cheeks-dt*0.07);
 if(m.eatT>0)m.eatT-=dt;if(m.glow>0)m.glow-=dt;
 m.sqv+=(-170*m.sq-10*m.sqv)*dt;m.sq+=m.sqv*dt;m.sq=clamp(m.sq,-0.9,0.9);
 const fly=m.mode==='sower'||m.mode==='parasol'||(m.mode==='flyer'&&m.z>2)||(m.arc&&has(m,'wings'));
 m.flap+=dt*(fly?16:5);
 const hatOn=has(m,'hat')&&!m.drag&&((m.mode==='shade'&&m.st==='sit')||m.mode==='parasol'||(m.idleAct&&m.idleAct.st&&m.idleAct.st.boat&&m.swim));
 m.hatOpen+=((hatOn?1:0)-m.hatOpen)*mn(1,dt*5);
 if(m.drag){const d=m.drag;const k=mn(1,dt*24);m.x+=(d.tx-m.x)*k;m.y+=(d.ty-m.y)*k;m.z=8;m.top=true;return;}
 if(m.carriedBy){const c=m.carriedBy;m.x=c.x;m.y=c.y+1;m.z=mx(0,c.z-9);m.top=true;c.carryT-=dt;if(c.carryT<=0||!c.cos.length)releaseFriend(c);return;}
 if(m.arc){updArc(m,dt);return;}
 if(m.route){const r=m.route;updRoute(m,dt);if(r.opts.slide&&rnd()<dt*25)addP(m.x+R_(-2,2),m.y,R_(-10,10),R_(-3,3),R_(5,20),0.4,pick([W3,W4]),0,120);if(r.opts.swim&&rnd()<dt*3)ring(m.x,m.y,W3,4);
  if(m.mode!=='climber'||m.st!=='climbing'){/* keep */}
  if(m.mode==='climber'&&m.st==='climbing'&&m.onTree)m.onTree.bend=mn(1,m.z/18);
  return;}
 if(m.air){m.vz-=220*dt;m.z+=m.vz*dt;if(m.z<=0){m.z=0;m.vz=0;m.air=false;landed(m,1.3);if(m.dropped){m.dropped=false;refreshMode(m);}}return;}
 if(m.hop){updHop(m,dt);return;}
 m.top=false;
 if(m.mode==='digger')aiDigger(m,dt);
 else if(m.mode==='sower')aiSower(m,dt);
 else if(m.mode==='flyer')aiFlyer(m,dt);
 else if(m.mode==='climber')aiClimber(m,dt);
 else if(m.mode==='shade')aiShade(m,dt);
 else if(m.mode==='parasol')aiParasol(m,dt);
 else{if(m.st==='start'){m.st='idle';m.t=0.5;}aiIdle(m,dt);}
 if(m.carry&&m.mode!=='sower'){releaseFriend(m);}
}

/* ---------- guidance ---------- */
const guide={obj:null,dest:null,key:'',t:0,demo:null,done:{},gest:0};
function freeCos(t){const c=costumes.find(c=>c.type===t);return c&&c.st!=='drag'&&c.st!=='fly'?c:null;}
function nearestMochiTo(x,y,filt){let b=null,bd=1e9;for(const m of mochis){if(filt&&!filt(m))continue;if(m.drag||m.carriedBy)continue;const d=dst(m.x,m.y,x,y);if(d<bd){bd=d;b=m;}}return b;}
function chooseGuide(){
 const boots=freeCos('boots'),wings=freeCos('wings'),tail=freeCos('tail'),hat=freeCos('hat');
 const digging=mochis.some(m=>m.mode==='digger'&&m.st==='trail');
 const cg=(key,c,dest)=>c&&dest&&c.owner!==dest?{key,obj:c,dest}:null;
 if(!inlets.length&&!digging&&boots){const r=cg('boots1',boots,nearestMochiTo(boots.x,boots.y,m=>m!==boots.owner));if(r)return r;}
 const dry=seeds.find(s=>s.st==='dry');
 if(dry&&!digging&&boots){const r=cg('bootsSeed',boots,nearestMochiTo(dry.x,dry.y,m=>m!==boots.owner));if(r)return r;}
 if(inlets.length&&!seeds.length&&!trees.some(t=>t.stage>=2&&t!==trees[0])&&wings&&!wings.owner){const r=cg('wings1',wings,nearestMochiTo(wings.x,wings.y));if(r)return r;}
 const big=trees.find(t=>t.stage>=4&&!t.bridge);
 if(big&&!bridges.length&&tail&&!(tail.owner&&tail.owner.mode==='climber'&&tail.owner.st!=='noTree')){const r=cg('tail1',tail,nearestMochiTo(big.x,big.y,m=>m!==tail.owner));if(r)return r;}
 const ripe=[];for(const t of trees)for(const f of t.fruits)if(f.r>=1)ripe.push({t,f});
 if(bridges.length&&!disc.shade&&hat&&!hat.owner){const b=bridges[0];const r=cg('hat1',hat,nearestMochiTo(b.tree.x,b.tree.y));if(r)return r;}
 if(!disc.eat){const gf=fruits.find(f=>f.st==='ground');const glu=mochis.find(m=>m.pers===2);if(gf&&glu)return {key:'fruit',obj:gf,dest:glu};}
 const hsT=trees.find(t=>t.hs.some(h=>h.st===0));
 if(hsT&&!disc.high&&!mochis.some(m=>m.mode==='flyer')){
  if(wings&&wings.owner&&boots&&!has(wings.owner,'boots')){const r=cg('combo',boots,wings.owner);if(r)return r;}
  if(boots&&boots.owner&&wings&&!has(boots.owner,'wings')){const r=cg('combo',wings,boots.owner);if(r)return r;}
  if(wings&&boots){const r=cg('combo',wings,nearestMochiTo(hsT.x,hsT.y));if(r)return r;}
 }
 if(pond.level<1&&inlets.length<2&&!digging&&boots){let far=null,fd=-1;for(const m of mochis){if(m===boots.owner||m.drag)continue;const w=nearestWaterPoint(m.x,m.y,false);const d=w?dst(w.x,w.y,m.x,m.y):99;if(d>fd){fd=d;far=m;}}const r=cg('boots2',boots,far);if(r)return r;}
 if(bridges.length&&hat&&!hat.owner){const b=bridges[0];const r=cg('hat2',hat,nearestMochiTo(b.tree.x,b.tree.y));if(r)return r;}
 if(!disc.bridge&&tail&&!tail.owner){const r=cg('tail2',tail,nearestMochiTo(tail.x,tail.y));if(r)return r;}
 const list=[boots,wings,tail,hat].filter(Boolean);
 if(list.length){const idx=flo(T/12)%list.length;const c=list[idx];const d=mochis.filter(m=>m!==c.owner&&!m.drag)[flo(T/12)%2];if(d)return {key:'free'+(c.type),obj:c,dest:d};}
 return null;
}
function objPos(o){if(!o)return null;if(o.kind==='c'){if(o.st==='worn'&&o.owner)return {x:o.owner.x,y:o.owner.y-o.owner.z-8};return {x:o.x,y:o.y-o.z-3};}if(o.kind==='m')return {x:o.x,y:o.y-o.z-6};return {x:o.x,y:o.y-(o.z||0)};}
function updGuide(dt){
 guide.t-=dt;if(guide.t<=0){guide.t=0.5;const g=chooseGuide();guide.obj=g?g.obj:null;guide.dest=g?g.dest:null;guide.key=g?g.key:'';}
 const idle=T-lastInput;
 if(guide.obj&&idle>4){guide.gest-=dt;if(guide.gest<=0){guide.gest=3.5;const m=guide.dest;const op=objPos(guide.obj);
   if(m&&op&&!m.hop&&!m.route&&!m.air&&!m.drag&&!m.arc&&m.mode==='idle'){m.lookX=op.x;m.lookY=op.y;setMood(m,'want',2.2);startHop(m,m.x+(op.x>m.x?2:-2),m.y,6,0.32);}
   for(const o of mochis)if(o!==m&&!o.drag){o.lookX=op?op.x:o.lookX;o.lookY=op?op.y:o.lookY;}}}
 if(guide.obj&&idle>10&&!guide.done[guide.key]&&!guide.demo&&!drags.size){guide.done[guide.key]=true;guide.demo={t:0,obj:guide.obj,dest:guide.dest};found('demo_'+guide.key);}
 if(guide.demo){guide.demo.t+=dt;if(guide.demo.t>3.4||idle<0.05)guide.demo=null;}
 if(park.on&&guide.obj&&idle>7&&!drags.size){const op=objPos(guide.obj);if(op&&(op.y-camY<LH*0.12||op.y-camY>LH*0.88))camGoal=clamp(op.y-LH*0.5,0,camMax());}
}

/* ---------- input ---------- */
const drags=new Map();
function toWorld(e){return {x:e.clientX/S,y:e.clientY/S+camY};}
function hitTest(x,y){
