/* ---------- ポップコーン（花のような白いかたまり）と粒 ---------- */
function buildPopcorn() {
  SPR.pop = [];
  var R = L.rP;
  for (var i = 0; i < 10; i++) {
    var lobes = [], n = ri(5, 7), a0 = rnd() * TAU, k;
    lobes.push({ x: rr(-0.08, 0.08) * R, y: rr(-0.08, 0.08) * R, r: R * rr(0.5, 0.6) });
    for (k = 0; k < n; k++) {
      var a = a0 + k / n * TAU + rr(-0.35, 0.35), d = R * rr(0.42, 0.6);
      lobes.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.92, r: R * rr(0.36, 0.54) });
    }
    for (k = 0; k < 3; k++) {
      var a2 = rnd() * TAU, d2 = R * rr(0.62, 0.8);
      lobes.push({ x: Math.cos(a2) * d2, y: Math.sin(a2) * d2, r: R * rr(0.2, 0.3) });
    }
    var hull = { a: rnd() * TAU, d: R * rr(0.12, 0.38) };
    var drawPC = (function (lobes, hull) {
      return function (g, tint) {
        var u = new Path2D(), j, l;
        for (j = 0; j < lobes.length; j++) { l = lobes[j]; u.moveTo(l.x + l.r, l.y); u.arc(l.x, l.y, l.r, 0, TAU); }
        g.save(); g.translate(R * 0.06, R * 0.1); g.fillStyle = '#cfa874'; g.fill(u); g.restore();
        var sorted = lobes.slice().sort(function (p, q) { return p.y - q.y; });
        for (j = 0; j < sorted.length; j++) {
          l = sorted[j];
          var gr = g.createRadialGradient(l.x - l.r * 0.35, l.y - l.r * 0.42, l.r * 0.05, l.x, l.y, l.r * 1.05);
          gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, '#fff6e2'); gr.addColorStop(0.82, '#f1dbb0'); gr.addColorStop(1, '#ddbb84');
          g.fillStyle = gr; g.beginPath(); g.arc(l.x, l.y, l.r, 0, TAU); g.fill();
        }
        g.lineWidth = R * 0.045; g.strokeStyle = 'rgba(185,140,80,0.45)';
        for (j = 0; j < sorted.length; j++) { l = sorted[j]; g.beginPath(); g.arc(l.x, l.y, l.r * 0.9, 0.25, 1.65); g.stroke(); }
        // 皮のかけら（はじける前の名残）
        g.save(); g.translate(Math.cos(hull.a) * hull.d, Math.sin(hull.a) * hull.d); g.rotate(hull.a + 1.2);
        var hp = new Path2D(); hp.moveTo(-R * 0.3, 0); hp.quadraticCurveTo(0, -R * 0.26, R * 0.3, 0); hp.quadraticCurveTo(0, R * 0.12, -R * 0.3, 0); hp.closePath();
        var hg = g.createLinearGradient(0, -R * 0.2, 0, R * 0.1); hg.addColorStop(0, '#f6c35a'); hg.addColorStop(1, '#c0761f');
        g.fillStyle = hg; g.fill(hp); g.restore();
        // つや
        g.fillStyle = 'rgba(255,255,255,0.85)';
        l = sorted[0]; g.beginPath(); g.ellipse(l.x - l.r * 0.3, l.y - l.r * 0.38, l.r * 0.22, l.r * 0.13, -0.6, 0, TAU); g.fill();
        noiseFill(g, u, 0.55);
        if (tint) { g.save(); g.globalCompositeOperation = 'source-atop'; g.fillStyle = tint; g.fillRect(-R * 2, -R * 2, R * 4, R * 4); g.restore(); }
      };
    })(lobes, hull);
    var bx = R * 1.5;
    SPR.pop.push({
      n: makeSprite(-bx, -bx, bx * 2, bx * 2, function (g) { drawPC(g, null); }),
      p: makeSprite(-bx, -bx, bx * 2, bx * 2, function (g) { drawPC(g, 'rgba(255,120,160,0.55)'); }),
      y: makeSprite(-bx, -bx, bx * 2, bx * 2, function (g) { drawPC(g, 'rgba(255,214,80,0.5)'); })
    });
  }
}
function kernelPath(r) {
  var p = new Path2D();
  p.moveTo(0, 1.25 * r);
  p.bezierCurveTo(-0.55 * r, 0.95 * r, -1.05 * r, 0.15 * r, -0.95 * r, -0.4 * r);
  p.bezierCurveTo(-0.85 * r, -1.08 * r, 0.85 * r, -1.08 * r, 0.95 * r, -0.4 * r);
  p.bezierCurveTo(1.05 * r, 0.15 * r, 0.55 * r, 0.95 * r, 0, 1.25 * r);
  p.closePath();
  return p;
}
function buildKernels() {
  SPR.ker = [];
  var r = L.rK, cols = ['#ffc62e', '#ffb726', '#ffd246'];
  for (var i = 0; i < 3; i++) {
    (function (col) {
      SPR.ker.push(makeSprite(-r * 1.4, -r * 1.5, r * 2.8, r * 3, function (g) {

        g.fillStyle = 'rgba(255,246,206,0.8)'; g.beginPath(); g.ellipse(0, 0.32 * r, 0.3 * r, 0.48 * r, 0, 0, TAU); g.fill();
        g.fillStyle = '#b06c22'; g.beginPath(); g.ellipse(0, 1.08 * r, 0.2 * r, 0.16 * r, 0, 0, TAU); g.fill();
      }));

function buildPot() {
  var P = L.pot, a = P.a, b = P.b, h = P.h;

  body.ellipse(0, h - b * 0.62, a * 0.84, b * 0.62, 0, Math.PI, 0, true);
  body.bezierCurveTo(a * 0.99, h * 0.8, a + a * 0.07, h * 0.35, a, 0);
  body.ellipse(0, 0, a, b, 0, 0, Math.PI, false);

  var clip = new Path2D(); clip.rect(-a - 260, -560, 2 * a + 520, 560); clip.ellipse(0, 0, a - 1, b - 1, 0, 0, TAU);
  P.clip = clip;

  SPR.potBack = makeSprite(-a - 12, -b - 16, 2 * a + 24, 2 * b + 26, function (g) {

    innerShadow(g, inner, [-a, -b, 2 * a, 2 * b], 'rgba(30,10,0,0.55)', 10, 0, 6);
    noiseFill(g, inner, 0.5);
    g.lineCap = 'round';
    var rg = g.createLinearGradient(-a, 0, a, 0);
    rg.addColorStop(0, '#b8692c'); rg.addColorStop(0.35, '#f0b06a'); rg.addColorStop(1, '#b0622a');
    g.lineWidth = 9; g.strokeStyle = rg; g.beginPath(); g.ellipse(0, 0, a, b, 0, Math.PI, TAU); g.stroke();

    var hg = new Path2D(); rrect(hg, -13, -b - 10, 26, 12, 4);
    clay(g, hg, [-13, -b - 10, 26, 12], '#bdb9b4', { hi: 0.5, noise: 0.3, sr: 0.4 });
    g.fillStyle = '#86817b'; g.beginPath(); g.arc(-6.5, -b - 4, 1.7, 0, TAU); g.moveTo(8.2, -b - 4); g.arc(6.5, -b - 4, 1.7, 0, TAU); g.fill();
  });

  SPR.potFront = makeSprite(-a - 80, -b - 10, 2 * a + 124, h + b + 22, function (g) {
    var loop = new Path2D(); loop.arc(P.loop.x, P.loop.y, 13, 0, TAU); loop.moveTo(P.loop.x + 6.5, P.loop.y); loop.arc(P.loop.x, P.loop.y, 6.5, 0, TAU, true);
    clay(g, loop, [P.loop.x - 13, P.loop.y - 13, 26, 26], '#c0712f', { noise: 0.5, sr: 0.3 });
    var gr = g.createLinearGradient(-a, 0, a, 0);
    gr.addColorStop(0, '#a3561f'); gr.addColorStop(0.18, '#d98a42'); gr.addColorStop(0.36, '#f3b46c');
    gr.addColorStop(0.68, '#cf823b'); gr.addColorStop(1, '#954a19');
    g.fillStyle = gr; g.fill(body);
    var vg = g.createLinearGradient(0, 0, 0, h);
    vg.addColorStop(0, 'rgba(255,225,175,0.18)'); vg.addColorStop(1, 'rgba(70,25,5,0.32)');
    g.fillStyle = vg; g.fill(body);
    var bb = [-a - 8, 0, 2 * a + 16, h];
    innerShadow(g, body, bb, 'rgba(70,25,0,0.38)', 12, 3, 5);
    innerShadow(g, body, bb, 'rgba(255,232,195,0.45)', 6, -2, -1);
    noiseFill(g, body, 0.95);

    // 大きな木の取っ手

      if (lv.by !== null) break;
      lv.by = id; lv.press = 1;
      g = { kind: 'lever', sx: x, slv: lv.lv, moved: false, ign: false, knob: true };
      if (G.flame === 0) { setFlame(0.45); g.ign = true; g.slv = 0.45; }
      AU.click();
      break;
    case 'groove':
      if (lv.by !== null) break;
      lv.by = id; lv.press = 1;
      var v = clamp((x - L.lever.x0) / (L.lever.x1 - L.lever.x0), 0, 1);
      setFlame(v); AU.click();
      g = { kind: 'lever', sx: x, slv: v, moved: true, ign: true, knob: false };
      break;
    case 'pot':
      if (canTilt() && G.pot.by === null) {
        G.pot.by = id; g = { kind: 'pot', sx: x, sy: y, sth: G.pot.tgt };
        AU.knock(0.6);
      } else {
        G.pot.wobV += 2.4;
        for (i = 0; i < potG.length; i++) { p = potG[i]; p.vy -= rr(70, 170); p.vx += rr(-40, 40); }
        if (LID.mode === 'lift') { LID.vL += 70; LID.wpsi += rr(-0.6, 0.6); }
        AU.lidTap(0.7); AU.knock(0.5); attention();
      }
      break;
    case 'cup':
      if (G.phase === 'serve' && G.cup.by === null) {
        G.cup.by = id; g = { kind: 'cup', ox: G.cup.x - x, oy: G.cup.y - y }; AU.knock(0.5);
        for (i = 0; i < cupG.length; i++) wake(cupG[i]);
      } else { G.cup.wobV += 4; AU.boop(); attention(); }
      break;
    case 'shaker':
      if (canShake() && G.shaker.by === null) {
        G.shaker.by = id; g = { kind: 'shaker', ox: G.shaker.x - x, oy: G.shaker.y - y }; AU.shake(0.5);
      } else { G.shaker.wobV += 4; AU.shake(0.25); attention(); }
      break;
    case 'bowl':
      if (G.bowl.by === null && G.bowl.count > 0) { G.bowl.by = id; g = { kind: 'bowl', ox: G.bowl.x - x, oy: G.bowl.y - y }; AU.knock(0.5); }
      break;
    case 'bear':
      G.bear.giggle = 1; G.bear.bV -= 2; AU.giggle(); attention();
      break;
    case 'crumb':
      p = h.p; wake(p);
      p.vx += clamp((p.x - x) * 7, -160, 160) + rr(-60, 60); p.vy -= rr(220, 360); p.w += rr(-15, 15);
      AU.patter(0.6);
      g = { kind: 'brush', lx: x, ly: y };
      break;
  }
  if (g) { grabs[id] = g; try { cv.setPointerCapture(id); } catch (err) {} }
}

function onMove(e) {
  var g = grabs[e.pointerId];
  if (!g) return;
  if (e.cancelable) e.preventDefault();
  var w = toWorld(e), x = w[0], y = w[1], i, p;
  switch (g.kind) {
    case 'lever':
      var dx = x - g.sx;
      if (Math.abs(dx) > 6) g.moved = true;
      if (g.moved) {
        var prev = G.lever.lv, v = clamp(g.slv + dx / (L.lever.x1 - L.lever.x0), 0, 1);
        setFlame(v);
        if (Math.floor(v * 8) !== Math.floor(prev * 8)) AU.tick(0.7);
      }
      break;
    case 'pot':
      var P = L.pot, pcx = P.x, pcy = P.y + P.h * 0.35;
      var a0 = Math.atan2(g.sy - pcy, g.sx - pcx), a1 = Math.atan2(y - pcy, x - pcx), da = a1 - a0;
      while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      var r0 = Math.sqrt((g.sx - pcx) * (g.sx - pcx) + (g.sy - pcy) * (g.sy - pcy));
      G.pot.tgt = clamp(g.sth + (r0 > 45 ? da * 0.95 : 0) + (x - g.sx) * 0.0045, 0, L.thMax);
      break;
    case 'cup':
      G.cup.x = clamp(x + g.ox, VIEW.x0 + L.cup.tw + 4, VIEW.x1 - L.cup.tw - 4);
      G.cup.y = clamp(y + g.oy, L.backY + 4, L.frontY - 4);
      break;
    case 'shaker':
      G.shaker.x = clamp(x + g.ox, VIEW.x0 + 24, VIEW.x1 - 24);
      G.shaker.y = clamp(y + g.oy, VIEW.y0 + 120, L.frontY - 2);
      break;
    case 'bowl':
      G.bowl.x = clamp(x + g.ox, VIEW.x0 + 46, VIEW.x1 - 46);
      G.bowl.y = clamp(y + g.oy, VIEW.y0 + 70, L.frontY - 2);
      break;
    case 'brush':
      var mx = x - g.lx, my = y - g.ly;
      for (i = 0; i < worldG.length; i++) {
        p = worldG[i];
        var ddx = p.x - x, ddy = p.y - y;
        if (ddx * ddx + ddy * ddy < (p.r + 18) * (p.r + 18)) { wake(p); p.vx += clamp(mx * 30, -300, 300); p.vy += clamp(my * 30, -300, 300) - 60; }
      }
      g.lx = x; g.ly = y;
      break;
  }
}

function endGrab(id, tap) {
  var g = grabs[id];
  delete grabs[id];
  if (!g) return;
  switch (g.kind) {
    case 'lever':
      if (tap && !g.moved && !g.ign && g.knob) {
        if (G.lever.lv >= 0.99) G.lever.wig = 1;
        else { setFlame(Math.min(1, G.lever.lv + 0.25)); AU.click(); }
      }
      if (G.lever.by === id) G.lever.by = null;
      break;
    case 'pot': if (G.pot.by === id) { G.pot.by = null; G.pot.tgt = 0; } break;
    case 'cup': if (G.cup.by === id) G.cup.by = null; break;
    case 'shaker': if (G.shaker.by === id) { G.shaker.by = null; if (G.sprinkled >= 4) G.shakerUsed = true; } break;
    case 'bowl': if (G.bowl.by === id) G.bowl.by = null; break;
  }
}
function onUp(e) { endGrab(e.pointerId, true); delete activePtr[e.pointerId]; G.pointers = ptrCount(); }
function onCancel(e) { endGrab(e.pointerId, false); delete activePtr[e.pointerId]; G.pointers = ptrCount(); }
function releaseAll() { for (var k in grabs) if (grabs.hasOwnProperty(k)) endGrab(k, false); activePtr = {}; G.pointers = 0; }

/* ============================================================
   ループ・リサイズ・起動
   ============================================================ */
var lastT = 0, acc = 0, rafId = 0, running = false, resizeTimer = 0;
function update(dt) {
  G.t += dt;
  if (G.pointers === 0) G.idle += dt;
  var lv = G.lever;
  lv.vis += (lv.lv - lv.vis) * (1 - Math.exp(-dt * 28));
  lv.press = lv.by !== null ? 1 : Math.max(0, lv.press - dt * 6);
  lv.wig = Math.max(0, lv.wig - dt * 3);
  G.flameVis += (G.flame - G.flameVis) * (1 - Math.exp(-dt * 10));
  G.ign = Math.max(0, G.ign - dt * 2.8);
  AU.burner(G.flameVis);
  updatePot(dt); updateLid(dt); updateHeat(dt);
  updateCup(dt); updateShaker(dt); updateBowl(dt);
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 4) {
    G.exits = 0;
    stepPot(STEP); stepCup(STEP); stepWorld(STEP);
    G.flowRate += G.exits * 1.2;
    acc -= STEP; n++;
  }
  if (n >= 4) acc = 0;
  G.flowRate *= Math.exp(-dt * 6);
  AU.flow(G.flowRate / 26);
  updatePhase(dt); updateBear(dt); updateHints(dt); updateFX(dt); cleanupWorld(dt);
}
function frame(ts) {
  rafId = 0;
  if (!running) return;
  var dt = lastT ? (ts - lastT) / 1000 : 1 / 60;
  lastT = ts;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  update(dt);
  render();
  rafId = requestAnimationFrame(frame);
}
function startLoop() { if (!running) { running = true; lastT = 0; } if (!rafId) rafId = requestAnimationFrame(frame); }
function stopLoop() { running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

function applyResize() {
  var oldA = L.pot.a, oldH = L.cup.h, oldRP = L.rP;
  releaseAll();
  computeLayout(); homes(); buildAll();
  var ra = L.pot.a / oldA, rc = L.cup.h / oldH, rp = L.rP / oldRP, i, p;
  if (Math.abs(ra - 1) > 1e-6 || Math.abs(rc - 1) > 1e-6) {
    for (i = 0; i < potG.length; i++) { p = potG[i]; p.x *= ra; p.y *= ra; p.px = p.x; p.py = p.y; }
    for (i = 0; i < cupG.length; i++) { p = cupG[i]; p.x *= rc; p.y *= rc; p.px = p.x; p.py = p.y; }
    worldG.length = 0;
  }
  var all = [potG, cupG];
  for (var a = 0; a < 2; a++) for (i = 0; i < all[a].length; i++) {
    p = all[a][i]; p.rf *= rp; p.r = p.st === 0 ? L.rK : (p.st === 2 ? p.rf : p.r * rp); p.sleep = false;
  }
  for (i = 0; i < worldG.length; i++) { worldG[i].sleep = false; }
  FX.length = 0;
  if (G.cup.state === 'home' || G.cup.state === 'slide') { G.cup.x = G.cup.hx; G.cup.y = G.cup.hy; G.cup.state = 'home'; }
  G.shaker.x = G.shaker.hx; G.shaker.y = G.shaker.hy;
  G.bowl.x = G.bowl.hx; G.bowl.y = G.bowl.hy;
  updatePot(0);
  render();
}
function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(applyResize, 120); }

function init() {
  computeLayout(); homes(); buildAll();
  G.pot.cx = L.pot.x; G.pot.cy = L.pot.y;
  G.cup.x = G.cup.hx; G.cup.y = G.cup.hy;
  G.shaker.x = G.shaker.hx; G.shaker.y = G.shaker.hy;
  G.bowl.x = G.bowl.hx; G.bowl.y = G.bowl.hy;
  spawnKernelsInPot(ri(25, 28));
  startRound();
  cv.addEventListener('pointerdown', onDown, { passive: false });
  cv.addEventListener('pointermove', onMove, { passive: false });
  cv.addEventListener('pointerup', onUp, { passive: false });
  cv.addEventListener('pointercancel', onCancel, { passive: false });
  cv.addEventListener('lostpointercapture', function (e) { if (grabs[e.pointerId]) onCancel(e); });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
  window.addEventListener('blur', releaseAll);
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  var stop = function (e) { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('touchstart', function (e) { if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('touchend', function () { AU.init(); }, { passive: true });
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('gesturechange', stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop, { passive: false });
  document.addEventListener('selectstart', stop, { passive: false });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopLoop(); releaseAll(); AU.suspend(); }
    else { AU.resume(); startLoop(); }
  });
  render();
  startLoop();
}

// 検証用の読み取り専用ハンドル（ゲーム画面には何も表示しない）
window.__popcorn = {
  state: function () {
    var lv = L.lever, kx = lerp(lv.x0, lv.x1, G.lever.vis);
    function scr(x, y) { return [x * S + OX, y * S + OY]; }
    var hp = potToWorld(L.pot.handle.x, L.pot.handle.y);
    return {
      phase: G.phase, round: G.round, flame: G.flame, P: G.P, popped: G.popped, lid: LID.mode, lidAl: LID.al, lidL: LID.L,
      pot: potG.length, potKernels: countIn(potG, 0), potPopped: countIn(potG, 2), cup: cupG.length, cupPopped: cupPopCount(), world: worldG.length,
      fx: FX.length, target: currentTarget(), hint: G.hint.t, cupState: G.cup.state, bowl: G.bowl.count, bowlVis: G.bowl.vis, sprinkled: G.sprinkled, th: G.pot.th,
      knob: scr(kx, lv.y), handle: scr(hp[0], hp[1]), potC: scr(G.pot.cx, G.pot.cy), cupP: scr(G.cup.x, G.cup.y - L.cup.h * 0.5),
      reach: scr(L.reach.x, L.reach.y - L.cup.h * 0.4), shaker: scr(G.shaker.x, G.shaker.y - 46), cupTop: scr(G.cup.x, G.cup.y - L.cup.h - 80),
      bowlP: scr(G.bowl.x, G.bowl.y - 22), potAbove: scr(G.pot.cx - L.pot.a * 0.5, G.pot.cy - L.pot.b - 60), bear: scr(L.bear.x, L.bear.y - 82 * L.bear.sc),
      scale: S, portrait: L.portrait, t: G.t, hot: G.hot, audio: AU.ready()
    };
  }
};

init();
})();
</script>
