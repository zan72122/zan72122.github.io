<script>
(function(){
'use strict';

/* ================================================================
   基本ユーティリティ
   ================================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function hexRgb(h){h=h.slice(1);return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
const _sc={};
function shade(h,a){const k=h+'|'+a;const v=_sc[k];if(v)return v;
  const c=hexRgb(h).map(x=>Math.round(a>=0?x+(255-x)*a:x*(1+a)));
  return _sc[k]='rgb('+c[0]+','+c[1]+','+c[2]+')';}
function rgba(h,al){const c=hexRgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')';}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function hr(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});

let W=0,H=0,DPR=1,FS=1,SS=1,M=400,LOW=false;
let SAFE={t:0,r:0,b:0,l:0};
const LY={},FA={};
let T=0,idle=0,BS=0;

/* ================================================================
   クレヨン描画ヘルパー
   ================================================================ */
const grainC=mk(128,128);
(function(){const g=grainC.getContext('2d');
  for(let i=0;i<650;i++){g.fillStyle='rgba(255,252,246,'+(0.25+Math.random()*0.6).toFixed(2)+')';
    const s=0.7+Math.random()*1.7;g.fillRect(Math.random()*128,Math.random()*128,s,s*(0.5+Math.random()*0.6));}
  g.strokeStyle='rgba(255,250,240,0.5)';g.lineWidth=0.8;
  for(let i=0;i<60;i++){const x=Math.random()*128,y=Math.random()*128,a=Math.random()*TAU,l=2+Math.random()*5;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
})();
const fiberC=mk(200,200);
(function(){const g=fiberC.getContext('2d');
  for(let i=0;i<520;i++){g.fillStyle=Math.random()<0.5?'rgba(120,80,90,0.05)':'rgba(255,255,255,0.07)';
    g.fillRect(Math.random()*200,Math.random()*200,1+Math.random()*2,1);}
  for(let i=0;i<90;i++){g.strokeStyle=Math.random()<0.5?'rgba(130,90,100,0.05)':'rgba(255,255,255,0.08)';g.lineWidth=0.7;
    const x=Math.random()*200,y=Math.random()*200,a=Math.random()*TAU,l=3+Math.random()*9;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+0.5)*l*0.5,y+Math.sin(a+0.5)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
})();
function grainFor(g){return g.__gp||(g.__gp=g.createPattern(grainC,'repeat'));}

function jit(pts,amp,closed,seed){
  const n=pts.length;if(n<2)return pts.slice();
  const out=[];let k=0;
  const R=seed===undefined?Math.random:()=>hr(seed+(k++)*7.13);
  const p1=R()*6.28,p2=R()*6.28;let acc=0;
  const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){
    const a=pts[i],b=pts[(i+1)%n];const dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy);
    const s=Math.max(1,Math.ceil(d/8));
    for(let j=0;j<s;j++){const t=j/s;acc+=d/s;
      out.push([a[0]+dx*t+Math.sin(acc*0.045+p1)*amp*0.8+(R()-0.5)*amp,
                a[1]+dy*t+Math.cos(acc*0.06+p2)*amp*0.8+(R()-0.5)*amp]);}
  }
  if(!closed){const b=pts[n-1];out.push([b[0],b[1]]);}
  return out;
}
function trace(g,pts,closed){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);if(closed)g.closePath();}
function cLine(g,pts,col,w,o){
  o=o||{};const closed=!!o.closed,passes=o.passes||3;
  g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=col;
  for(let p=0;p<passes;p++){
    g.globalAlpha=(o.alpha||0.9)*(p===0?1:0.45);
    g.lineWidth=w*(p===0?1:(o.seed!==undefined?0.7:(0.45+Math.random()*0.5)));
    trace(g,jit(pts,o.amp!==undefined?o.amp:Math.max(0.6,w*0.3),closed,o.seed!==undefined?o.seed+p*31:undefined),closed);
    g.stroke();
  }
  g.restore();
}
function hatch(g,x,y,w,h,col,ang,sp,al,lw){
  g.save();g.strokeStyle=col;g.globalAlpha=al;g.lineWidth=lw||1.3;g.lineCap='round';
  const cx=x+w/2,cy=y+h/2,d=Math.hypot(w,h)/2+4,ca=Math.cos(ang),sa=Math.sin(ang);
  g.beginPath();
  for(let t=-d;t<=d;t+=sp*(0.7+Math.random()*0.6)){
    const l0=-d*(0.8+Math.random()*0.2),l1=d*(0.8+Math.random()*0.2);
    const ox=cx-sa*t,oy=cy+ca*t;
    g.moveTo(ox+ca*l0+(Math.random()-0.5)*2,oy+sa*l0);g.lineTo(ox+ca*l1,oy+sa*l1+(Math.random()-0.5)*2);
  }
  g.stroke();g.restore();
}
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){if(p[0]<a)a=p[0];if(p[1]<b)b=p[1];if(p[0]>c)c=p[0];if(p[1]>d)d=p[1];}return [a,b,c-a,d-b];}
function cFill(g,pts,col,o){
  o=o||{};const bb=bbox(pts);
  g.save();trace(g,jit(pts,o.wob!==undefined?o.wob:1.2,true),true);
  g.fillStyle=col;g.globalAlpha=o.alpha!==undefined?o.alpha:0.95;g.fill();g.globalAlpha=1;g.clip();
  const sp=o.sp||Math.max(2.5,Math.min(bb[2],bb[3])*0.06+2);
  const ang=o.ang!==undefined?o.ang:0.7;
  hatch(g,bb[0],bb[1],bb[2],bb[3],o.dark||shade(col,-0.14),ang,sp,o.ha!==undefined?o.ha:0.4,o.hw);
  hatch(g,bb[0],bb[1],bb[2],bb[3],shade(col,0.3),ang+1.3,sp*1.7,0.3,o.hw);
  if(o.grain!==0){g.fillStyle=grainFor(g);g.globalAlpha=o.grain||0.6;g.fillRect(bb[0],bb[1],bb[2],bb[3]);}
  g.restore();
  if(o.line!==false)cLine(g,pts,o.line||shade(col,-0.38),o.lw||Math.max(1.6,M*0.005),{closed:true,passes:2});
}
/* 形の点列 */
function ell(cx,cy,rx,ry,a0,a1,n){a0=a0||0;a1=a1===undefined?TAU:a1;n=n||Math.max(10,Math.round((rx+ry)*0.45));
  const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}
  if(a1-a0>=TAU-1e-6)o.pop();return o;}
function rect(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];}
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);const o=[];
  const c=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];
  for(const q of c){for(let i=0;i<=5;i++){const t=q[2]+i/5*Math.PI/2;o.push([q[0]+Math.cos(t)*r,q[1]+Math.sin(t)*r]);}}return o;}
function star(cx,cy,ro,ri,n,rot){const o=[];for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n-Math.PI/2;const r=i%2?ri:ro;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return o;}
function heart(cx,cy,s){const o=[];for(let i=0;i<36;i++){const t=i/36*TAU;const x=16*Math.pow(Math.sin(t),3);
  const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));o.push([cx+x*s/34,cy+y*s/34+s*0.03]);}return o;}
function petalPts(cx,cy,s,rot){const o=[];const c=Math.cos(rot),si=Math.sin(rot);
  for(let i=0;i<28;i++){const t=i/28*TAU;const x=Math.cos(t)*s*0.46;const y=Math.sin(t)*s*0.27*Math.pow((1+Math.cos(t))/2,0.55);
    o.push([cx+x*c-y*si,cy+x*si+y*c]);}return o;}
function bez(p0,p1,p2,p3,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;
  o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
function spr(w,h,fn,sc){sc=sc||SS;const c=mk(w*sc,h*sc);const g=c.getContext('2d');g.setTransform(sc,0,0,sc,0,0);fn(g);c.w0=w;c.h0=h;return c;}

/* ================================================================
   音（Web Audio 合成）
   ================================================================ */
const AU={ctx:null,v:[],master:null};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended'){try{AU.ctx.resume();}catch(e){}}return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AU.ctx=new C();}catch(e){AU.ctx=null;return;}
  const A=AU.ctx;
  const comp=A.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.18;
  AU.master=A.createGain();AU.master.gain.value=0.75;AU.master.connect(comp);comp.connect(A.destination);
  const len=A.sampleRate*2;AU.nb=A.createBuffer(1,len,A.sampleRate);const d=AU.nb.getChannelData(0);
  let b=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b=0.6*b+0.4*w;d[i]=w*0.6+b*0.4;}
  // 回転摩擦音
  AU.rs=A.createBufferSource();AU.rs.buffer=AU.nb;AU.rs.loop=true;
  AU.rf=A.createBiquadFilter();AU.rf.type='lowpass';AU.rf.frequency.value=900;AU.rf.Q.value=0.6;
  AU.rg=A.createGain();AU.rg.gain.value=0;AU.rs.connect(AU.rf);AU.rf.connect(AU.rg);AU.rg.connect(AU.master);AU.rs.start();
  // 大きなローラーの低い転がり音
  AU.ro=A.createOscillator();AU.ro.type='sine';AU.ro.frequency.value=60;AU.rog=A.createGain();AU.rog.gain.value=0;
  AU.ro.connect(AU.rog);AU.rog.connect(AU.master);AU.ro.start();
  // 布のすべる音
  AU.ss=A.createBufferSource();AU.ss.buffer=AU.nb;AU.ss.loop=true;
  AU.sf=A.createBiquadFilter();AU.sf.type='bandpass';AU.sf.frequency.value=2300;AU.sf.Q.value=0.9;
  AU.sg=A.createGain();AU.sg.gain.value=0;AU.ss.connect(AU.sf);AU.sf.connect(AU.sg);AU.sg.connect(AU.master);AU.ss.start();
}
function anow(){return AU.ctx.currentTime;}
function voiceOK(){const t=anow();if(AU.v.length>8)AU.v=AU.v.filter(e=>e>t);return AU.v.length<18;}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(f,t,dur,type,vol,f2,att){
  const A=AU.ctx;const o=A.createOscillator(),g=A.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*0.8);
  env(g,t,att||0.005,vol,dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.06);AU.v.push(t+dur+0.06);
}
function noise(t,dur,ft,freq,q,vol){
  const A=AU.ctx;const s=A.createBufferSource();s.buffer=AU.nb;const f=A.createBiquadFilter();f.type=ft;f.frequency.value=freq;f.Q.value=q;
  const g=A.createGain();env(g,t,0.003,vol,dur);s.connect(f);f.connect(g);g.connect(AU.master);
  s.start(t,Math.random()*1.5);s.stop(t+dur+0.06);AU.v.push(t+dur+0.06);
}
function bell(f,t,dur,vol){tone(f,t,dur,'sine',vol,0,0.004);tone(f*2.76,t,dur*0.45,'sine',vol*0.28,0,0.003);tone(f*5.4,t,dur*0.2,'sine',vol*0.1,0,0.002);}
function harp(f,t,vol){tone(f,t,1.1,'triangle',vol,0,0.003);tone(f*2,t,0.5,'sine',vol*0.3,0,0.003);}
const SFX={lp:-1,combo:0,lc:-1,lb:-1,lt:-1,lcl:-1,lsp:-1,lh:-1};
const sfx={
  ok(){return AU.ctx&&AU.ctx.state==='running'&&voiceOK();},
  peta(){if(!this.ok())return;const t=anow();if(t-SFX.lp<0.032)return;
    SFX.combo=(t-SFX.lp<0.45)?Math.min(SFX.combo+1,10):0;SFX.lp=t;
    const semis=[0,2,4,7,9,12,14,16,19,21,24];const f=640*Math.pow(2,semis[SFX.combo]/12)*rnd(0.98,1.02);
    tone(f,t,0.07,'triangle',0.15,f*0.6);noise(t,0.016,'bandpass',4200,1.4,0.09);},
  squish(){if(!this.ok())return;const t=anow();tone(150,t,0.12,'sine',0.16,95);noise(t,0.05,'lowpass',700,0.7,0.06);},
  crinkle(k){if(!this.ok())return;const t=anow();if(t-SFX.lc<0.06)return;SFX.lc=t;
    const n=2+Math.round(k*3);for(let i=0;i<n;i++)noise(t+i*rnd(0.018,0.05),rnd(0.02,0.05),'bandpass',rnd(1800,5200),0.9,0.04+0.1*k);},
  grab(){if(!this.ok())return;const t=anow();tone(392,t,0.12,'triangle',0.12,523);tone(784,t+0.06,0.2,'sine',0.08);noise(t,0.12,'bandpass',2600,0.8,0.12);},
  ribbon(){if(!this.ok())return;const t=anow();tone(330,t,0.25,'sine',0.1,660);tone(990,t+0.08,0.25,'sine',0.05);},
  boing(){if(!this.ok())return;const t=anow();if(t-SFX.lb<0.25)return;SFX.lb=t;tone(170,t,0.28,'sine',0.18,310);tone(250,t+0.03,0.2,'triangle',0.05,190);},
  pin(){if(!this.ok())return;const t=anow();if(t-SFX.lt<0.15)return;SFX.lt=t;tone(880,t,0.1,'triangle',0.07,1100);},
  cloth(){if(!this.ok())return;const t=anow();if(t-SFX.lcl<0.07)return;SFX.lcl=t;noise(t,0.07,'bandpass',1300,0.7,0.07);},
  sparkle(){if(!this.ok())return;const t=anow();if(t-SFX.lsp<0.15)return;SFX.lsp=t;
    const ns=[1568,1760,2093,2349,2637,3136];for(let i=0;i<4;i++)tone(pick(ns),t+i*0.05,0.35,'sine',0.045);},
  shup(){if(!this.ok())return;const t=anow();noise(t,0.12,'highpass',2500,0.7,0.07);tone(523,t,0.14,'sine',0.08,1046);},
  pop(){if(!this.ok())return;const t=anow();noise(t,0.07,'lowpass',900,0.7,0.25);tone(300,t,0.4,'sine',0.13,1200);
    for(let i=0;i<4;i++)tone(pick([1568,2093,2637]),t+0.15+i*0.06,0.3,'sine',0.04);},
  tok(){if(!this.ok())return;const t=anow();if(t-SFX.lh<0.08)return;SFX.lh=t;tone(260,t,0.08,'triangle',0.07,200);},
  hop(){if(!this.ok())return;const t=anow();if(t-SFX.lh<0.06)return;SFX.lh=t;tone(1100,t,0.06,'sine',0.05,1500);},
  giggle(){if(!this.ok())return;const t=anow();for(let i=0;i<3;i++)tone(880+i*130,t+i*0.07,0.07,'sine',0.05,1000+i*130);},
  finale(){if(!AU.ctx)return;const t=anow()+0.1;
    const ar=[523.25,659.25,783.99,1046.5,1318.5,1568];ar.forEach((f,i)=>harp(f,t+i*0.085,0.09));
    harp(261.63,t+0.6,0.08);harp(392,t+0.65,0.07);
    [1046.5,1318.5,1568].forEach(f=>bell(f,t+0.62,2.4,0.06));
    bell(2093,t+1.15,2.0,0.05);bell(2637,t+1.45,1.6,0.035);
    [783.99,987.77,1174.66,1567.98].forEach((f,i)=>bell(f,t+2.0+i*0.12,1.4,0.035));},
  mini(){if(!this.ok())return;const t=anow();[784,988,1175,1568].forEach((f,i)=>bell(f,t+i*0.09,1.0,0.05));}
};
function audioFrame(){
  if(!AU.ctx||AU.ctx.state!=='running')return;
  const t=anow();const g=gOf(RL.mass);
  const sp=Math.min(1,RL.speed/(M*2.5));
  AU.rg.gain.setTargetAtTime(sp*0.07,t,0.05);
  AU.rf.frequency.setTargetAtTime(1500/Math.pow(g,0.7),t,0.1);
  AU.rog.gain.setTargetAtTime(sp*clamp((g-1.6)/2.2,0,1)*0.16,t,0.06);
  AU.ro.frequency.setTargetAtTime(78-g*6,t,0.1);
  AU.sg.gain.setTargetAtTime(Math.min(0.09,RIBWIND*0.0016*400/M),t,0.04);
}
let RIBWIND=0;

/* ================================================================
   状態
   ================================================================ */
const RL={x:0,y:0,vx:0,vy:0,hx:0,hy:0,hdx:0.2,hdy:1,R:20,L:100,R0:20,L0:100,rot:0,sq:0,sqv:0,bend:0,bendv:0,
  holder:null,mode:'body',ox:0,oy:0,fx:0,fy:0,mass:0,press:0,roll:0,speed:0,lsx:-1e9,lsy:-1e9,pullx:0,pully:0,rings:['#eef4f8'],flaps:[]};
const TU=512,TA=160;// ローラー表面テクスチャ（縦:円周 / 横:軸）
let rtex=null,rg=null;
const BA=48,BX=8;const bumps=new Float32Array(BA*BX);
let confetti=[],wraps=[],ropes=[],parts=[],throneRope=null,tailRope=null,sticking=[];
let RIBNEED=52,THRONE_NEED=160;
const RS={x:0,y:0};
const GIFT={lid:0,lidv:0,open:false,timer:0,ready:true,wig:0,wigv:0,spawned:false};
const SK={sy:1,v:0,j:0,jv:0,flip:false};
const CL={on:false,done:false,t:0,beam:0,wind:0,morning:0,fired:null,built:false};
const WAVES=[];
const GL={imp:0,rot:0,rotv:0};
const HINT={t:0,windT:0};
const CAM={blink:0,bt:3,smile:0,giggle:0};
let GN=null;
let bgC,floorVivid,floorDull,floorMorning,cleanC,cleanG,cleanMC=null,cleanMG=null,stampSrc,goldGlowC,glowTmp,glowTmpG;
const SPR={};let CSPR=[];
let grid=null,gcs=20,gcols=1,grows=1,gTotal=1,gClean=0;

   ================================================================ */
function readSafe(){const s=getComputedStyle(document.getElementById('sa'));
  SAFE={t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};}
function computeLayout(){
  const portrait=H>=W*1.05;LY.portrait=portrait;
  M=Math.min(W,H);
  LY.floorTop=Math.round(portrait?Math.max(H*0.25,SAFE.t+M*0.42):Math.max(H*0.31,SAFE.t+M*0.27));
  const ft=LY.floorTop;
  LY.wainH=(ft-SAFE.t)*0.16;
  LY.tw=M*(portrait?0.30:0.25);LY.th=LY.tw*1.22;
  LY.tx=W/2;LY.tb=ft+M*0.11;LY.seatY=LY.tb-LY.th*0.30;
  LY.medX=LY.tx;LY.medY=LY.tb-M*0.045;
  const wallTop=SAFE.t+(ft-SAFE.t)*0.11;
  const span=ft-LY.wainH-wallTop;
  const winH=span*0.86;
  LY.wins=[];
  if(portrait){const ww=Math.min(winH*0.62,W*0.17);
    [0.14,0.86].forEach((f,i)=>LY.wins.push({x:W*f,top:wallTop+span*0.05,w:ww,h:winH,sun:i===0}));}
  else{const ww=Math.min(winH*0.6,W*0.1);
    [0.09,0.25,0.75,0.91].forEach((f,i)=>LY.wins.push({x:W*f,top:wallTop+span*0.05,w:ww,h:winH,sun:i===0}));}
  LY.tableW=M*0.24;LY.tableX=portrait?W*0.15:W*0.15;LY.tableB=ft+M*0.085;
  LY.gw=M*0.13;LY.giftX=portrait?W*0.85:W*0.86;LY.giftB=ft+M*0.1;
  LY.cam={x:LY.tx,y:LY.tb-LY.th*0.62,r:LY.tw*0.2};
  FA.x0=SAFE.l+M*0.05;FA.x1=W-SAFE.r-M*0.05;FA.y0=LY.tb+M*0.05;FA.y1=H-SAFE.b-M*0.05;
  LY.S={x:LY.tx+LY.tw*0.1,y:LY.tb-M*0.025};
  LY.obst=[{x:LY.tx-LY.tw*0.4,y:LY.tb-M*0.01,r:LY.tw*0.055},{x:LY.tx+LY.tw*0.4,y:LY.tb-M*0.01,r:LY.tw*0.055},
    {x:LY.tableX-LY.tableW*0.32,y:LY.tableB-M*0.005,r:M*0.016},{x:LY.tableX+LY.tableW*0.32,y:LY.tableB-M*0.005,r:M*0.016},
    {x:LY.tableX,y:LY.tableB+M*0.005,r:M*0.016},{x:LY.giftX,y:LY.giftB-LY.gw*0.2,r:LY.gw*0.55}];
  LY.rw=M*0.026;LY.seg=M*0.032;
  RL.R0=M*0.05;RL.L0=M*0.25;
  LY.rosettes=portrait?[{x:W*0.32,y:SAFE.t+M*0.1,s:M*0.07,c:'#ffd84d'},{x:W*0.68,y:SAFE.t+M*0.1,s:M*0.07,c:'#7cc8f2'}]
    :[{x:W*0.17,y:SAFE.t+M*0.1,s:M*0.07,c:'#ffd84d'},{x:W*0.36,y:SAFE.t+M*0.085,s:M*0.06,c:'#b69cf0'},
      {x:W*0.64,y:SAFE.t+M*0.085,s:M*0.06,c:'#8fe0c0'},{x:W*0.83,y:SAFE.t+M*0.1,s:M*0.07,c:'#7cc8f2'}];
  LY.gy=SAFE.t+M*0.025;
  // 光る装飾の位置（クライマックスの反射用）
  LY.deco=[];
  const ad=(x,y)=>LY.deco.push({x,y,d:Math.hypot(x-LY.medX,y-LY.medY)});
  ad(LY.tx,LY.tb-LY.th*0.95);ad(LY.tx-LY.tw*0.38,LY.tb-LY.th*0.7);ad(LY.tx+LY.tw*0.38,LY.tb-LY.th*0.7);
  ad(LY.cam.x,LY.cam.y-LY.cam.r);ad(LY.tx-LY.tw*0.45,LY.seatY);ad(LY.tx+LY.tw*0.45,LY.seatY);
  for(const w of LY.wins){ad(w.x,w.top);ad(w.x-w.w*0.5,w.top+w.h*0.6);ad(w.x+w.w*0.5,w.top+w.h*0.6);}
  for(let x=M*0.1;x<W;x+=M*0.22)ad(x,ft-LY.wainH);
  ad(LY.tableX,LY.tableB-LY.tableW*1.15);ad(LY.giftX,LY.giftB-LY.gw*0.9);
  for(const r of LY.rosettes)ad(r.x,r.y);
}

function genGold(){
  GN={paths:[],motifs:[],samples:[]};
  const med={x:LY.medX,y:LY.medY,s:LY.tw*0.55};GN.med=med;
  const sp=[];const ph=Math.random()*6;const yE=H+M*0.05;
  for(let i=0;i<=30;i++){const t=i/30;sp.push([W/2+Math.sin(t*Math.PI*2.4+ph)*M*0.07*Math.min(1,t*3),lerp(med.y,yE,t)]);}
  GN.paths.push({pts:sp,w:M*0.014});
  const cols=LY.portrait?2:4,rows=LY.portrait?3:2;
  const types=['crown','star','flower','heart'];let ti=(Math.random()*4)|0;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const x=FA.x0+(i+0.5)*(FA.x1-FA.x0)/cols+rnd(-1,1)*M*0.03,y=FA.y0+(j+0.5)*(FA.y1-FA.y0)/rows+rnd(-1,1)*M*0.03;
    GN.motifs.push({x,y,s:M*rnd(0.085,0.1),type:types[(ti++)%4],rev:false});
    let best=sp[0],bd=1e9;for(const p of sp){const d=Math.abs(p[1]-(y-M*0.05));if(d<bd){bd=d;best=p;}}
    const p0=best,p3=[x,y];
    const br=bez(p0,[lerp(p0[0],x,0.35),p0[1]-M*0.08],[lerp(p0[0],x,0.7),y+M*0.1],p3,22);
    GN.paths.push({pts:br,w:M*0.009});
    const q=br[11];const dir=x>p0[0]?1:-1;const curl=[];
    for(let k=0;k<=14;k++){const a=k/14*Math.PI*1.6;const rr=M*0.035*(1-k/18);curl.push([q[0]+Math.sin(a)*rr*dir,q[1]-M*0.035+Math.cos(a)*rr]);}
    GN.paths.push({pts:curl,w:M*0.006});
  }
  const ring=ell((FA.x0+FA.x1)/2,(FA.y0+FA.y1)/2+M*0.02,(FA.x1-FA.x0)*0.42,(FA.y1-FA.y0)*0.32,0,TAU,64);ring.push(ring[0]);
  GN.paths.push({pts:ring,w:M*0.007});
  // 玉座の下の曲線
  const arc=ell(med.x,med.y,LY.tw*0.34,M*0.035,0,Math.PI,16);GN.paths.push({pts:arc,w:M*0.008});
  for(const p of GN.paths){let acc=0;for(let i=1;i<p.pts.length;i++){const a=p.pts[i-1],b=p.pts[i];acc+=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(acc>M*0.04){acc=0;GN.samples.push([b[0],b[1]]);}}}
  for(const m of GN.motifs)GN.samples.push([m.x,m.y]);
}
function drawMotif(g,type,x,y,s,bright){
  g.save();g.translate(x,y);g.scale(1,0.8);
  const gold='#efc14a',dk='#a8751c';
  cLine(g,ell(0,0,s*0.66,s*0.66,0,TAU,30).concat([[s*0.66,0]]),dk,s*0.07,{passes:2});
  cLine(g,ell(0,0,s*0.66,s*0.66,0,TAU,30).concat([[s*0.66,0]]),'#f6d75a',s*0.035,{passes:1});
  let p;
  if(type==='crown'){const w=s*0.8,h=s*0.6;p=[[-w/2,h*0.35],[-w/2,-h*0.45],[-w*0.25,-h*0.05],[0,-h*0.6],[w*0.25,-h*0.05],[w/2,-h*0.45],[w/2,h*0.35]];}
  else if(type==='star')p=star(0,0,s*0.5,s*0.22,5,0);
  else if(type==='heart')p=heart(0,0,s*0.85);
  else p=null;
  if(p)cFill(g,p,gold,{line:dk,lw:Math.max(1.5,s*0.05),ha:0.35});
  else{for(let i=0;i<5;i++){const a=i/5*TAU;cFill(g,ell(Math.cos(a)*s*0.24,Math.sin(a)*s*0.24,s*0.17,s*0.17),gold,{line:dk,lw:Math.max(1.4,s*0.04)});}
    cFill(g,ell(0,0,s*0.14,s*0.14),'#f6d75a',{line:dk});}
  cLine(g,[[-s*0.2,-s*0.15],[s*0.05,-s*0.25]],bright?'#ffffff':'#fff3b0',s*0.05,{passes:1,alpha:0.8});
  if(type==='crown'){cFill(g,ell(0,-s*0.36,s*0.07,s*0.07),'#ff7aa8',{line:false});cFill(g,ell(-s*0.4,-s*0.27,s*0.06,s*0.06),'#7cc8f2',{line:false});cFill(g,ell(s*0.4,-s*0.27,s*0.06,s*0.06),'#7cc8f2',{line:false});}
  g.restore();
}
function goldStroke(g,pts,w,bright){
  cLine(g,pts,'#b8862a',w*1.3,{passes:2,alpha:0.9});
  cLine(g,pts,'#efc14a',w*0.85,{passes:2});
  cLine(g,pts,bright?'#ffffff':'#fff3a8',w*0.3,{passes:1,alpha:bright?0.95:0.7});
}

function drawWindow(g,w){
  const x0=w.x-w.w/2,x1=w.x+w.w/2,top=w.top,bot=w.top+w.h,r=w.w/2;
  const shape=[[x0,bot]].concat(ell(w.x,top+r,r,r,Math.PI,TAU,18)).concat([[x1,bot]]);
  g.save();trace(g,shape,true);g.clip();
  const gr=g.createLinearGradient(0,top,0,bot);gr.addColorStop(0,'#86ccf2');gr.addColorStop(0.65,'#d8f1ff');gr.addColorStop(1,'#ffe3cc');
  g.fillStyle=gr;g.fillRect(x0-2,top-2,w.w+4,w.h+4);
  hatch(g,x0,top,w.w,w.h,'#ffffff',0.4,5,0.25);
  if(w.sun){const sx=w.x-r*0.15,sy=top+w.h*0.62;
    const sg=g.createRadialGradient(sx,sy,0,sx,sy,r*1.4);sg.addColorStop(0,'rgba(255,240,170,0.9)');sg.addColorStop(1,'rgba(255,240,170,0)');
    g.fillStyle=sg;g.fillRect(x0,top,w.w,w.h);
    cFill(g,ell(sx,sy,r*0.42,r*0.42),'#ffd35a',{line:'#f0a030',lw:1.8});}
  cFill(g,ell(w.x+r*0.3,top+w.h*0.32,r*0.38,r*0.16),'#ffffff',{line:false,alpha:0.9});
  cFill(g,ell(w.x-r*0.35,top+w.h*0.22,r*0.28,r*0.12),'#ffffff',{line:false,alpha:0.85});
  cFill(g,ell(w.x,bot+r*0.25,r*1.6,r*0.55),'#a7dd9c',{line:'#79b56d'});
  cFill(g,ell(w.x+r*0.55,bot-r*0.28,r*0.22,r*0.22),'#ffb6cf',{line:'#e886a8'});
  g.restore();
  cLine(g,shape,'#ffffff',w.w*0.1,{closed:true});
  cLine(g,shape,'#e0b048',Math.max(1.5,w.w*0.025),{closed:true,passes:2});
  cLine(g,[[w.x,top+2],[w.x,bot]],'#ffffff',w.w*0.05);
  cLine(g,[[x0,top+w.h*0.55],[x1,top+w.h*0.55]],'#ffffff',w.w*0.05);
  cFill(g,rrect(x0-w.w*0.12,bot-2,w.w*1.24,w.w*0.12,4),'#fff3e6',{line:'#d9a8b8'});
  // カーテン
  for(const s of [-1,1]){const ex=s<0?x0:x1;const p=[[ex-s*w.w*0.14,top-w.w*0.06],[ex+s*w.w*0.2,top-w.w*0.06],
      [ex+s*w.w*0.02,top+w.h*0.58],[ex+s*w.w*0.06,bot+w.w*0.04],[ex-s*w.w*0.18,bot+w.w*0.04],[ex-s*w.w*0.12,top+w.h*0.5]];
    cFill(g,p,'#f58fb5',{line:'#c9608a',ang:1.5,sp:3});
    cFill(g,ell(ex+s*w.w*0.0,top+w.h*0.57,w.w*0.08,w.w*0.05),'#f2c04c',{line:'#b8862a'});}
  const val=[];for(let i=0;i<=8;i++){const x=x0-w.w*0.16+(w.w*1.32)*i/8;val.push([x,top-w.w*0.1+(i%2?w.w*0.12:0)]);}
  cFill(g,[[x0-w.w*0.16,top-w.w*0.2]].concat(val).concat([[x1+w.w*0.16,top-w.w*0.2]]),'#ff9fc2',{line:'#c9608a'});
}
function drawWall(g){

  g.fillStyle=gr;g.fillRect(0,0,W,ft+2);
  hatch(g,0,0,W,ft,'#efacc4',1.35,6,0.35,1.6);hatch(g,0,0,W,ft,'#ffe6ee',1.75,9,0.35,1.4);
  const sp=M*0.1;let row=0;
  for(let y=SAFE.t+M*0.09;y<ft-LY.wainH-M*0.02;y+=sp,row++)for(let x=(row%2?sp/2:0)+sp*0.25;x<W;x+=sp)

    cFill(g,ell(fx,fy,M*0.018,M*0.018),'#ffd84d',{line:'#c99a20'});

  g.fillStyle=grainFor(g);g.globalAlpha=0.3;g.fillRect(0,0,W,ft);g.globalAlpha=1;

function drawFloorVivid(g){
  const ft=LY.floorTop;
  const gr=g.createLinearGradient(0,ft,0,H);gr.addColorStop(0,'#fbd5e1');gr.addColorStop(1,'#fff0ea');
  g.fillStyle=gr;g.fillRect(0,ft,W,H-ft);
  hatch(g,0,ft,W,H-ft,'#f3bccd',0.35,5,0.25);hatch(g,0,ft,W,H-ft,'#ffffff',-0.9,7,0.25);
  const vpx=W/2,vpy=ft-(H-ft)*1.1,n=7;
  const ys=k=>ft+(H-ft)*Math.pow(k/n,1.3);
  const tile=M*0.17;const xb=[];for(let x=W/2-tile*12;x<=W/2+tile*12;x+=tile)xb.push(x);
  const xat=(b,y)=>vpx+(b-vpx)*(y-vpy)/(H-vpy);
  for(let r=0;r<n;r++)for(let c=0;c<xb.length-1;c++){if((r+c)%2)continue;
    const y0=ys(r),y1=ys(r+1);const q=[[xat(xb[c],y0),y0],[xat(xb[c+1],y0),y0],[xat(xb[c+1],y1),y1],[xat(xb[c],y1),y1]];
    if(q[1][0]<-20||q[0][0]>W+20&&q[3][0]>W+20)continue;
    cFill(g,q,'#f7c4d6',{line:false,alpha:0.55,grain:0.4});}
  for(let r=1;r<n;r++)cLine(g,[[-5,ys(r)],[W+5,ys(r)]],'#e2a6c8',1.6,{alpha:0.6,passes:2});
  for(const b of xb){const xa=xat(b,ft),xz=b;if(Math.max(xa,xz)<-10||Math.min(xa,xz)>W+10)continue;cLine(g,[[xa,ft],[xz,H]],'#e2a6c8',1.6,{alpha:0.6,passes:2});}
  cFill(g,ell(LY.tx,LY.tb-M*0.03,LY.tw*0.5,M*0.065),'#e7a8c2',{line:false,alpha:0.4});
  for(const p of GN.paths)goldStroke(g,p.pts,p.w,false);
  for(const m of GN.motifs)drawMotif(g,m.type,m.x,m.y,m.s,false);
  drawMotif(g,'crown',GN.med.x,GN.med.y,GN.med.s*0.55,false);
  for(let i=0;i<60;i++){const s=pick(GN.samples);cFill(g,ell(s[0]+rnd(-6,6),s[1]+rnd(-6,6),M*0.006,M*0.006),'#f6d75a',{line:false,grain:0});}
  g.fillStyle=grainFor(g);g.globalAlpha=0.35;g.fillRect(0,ft,W,H-ft);g.globalAlpha=1;
}
function buildFloors(){
  const fw=W*FS,fh=H*FS;
  floorVivid=mk(fw,fh);let g=floorVivid.getContext('2d');g.setTransform(FS,0,0,FS,0,0);drawFloorVivid(g);
  floorDull=mk(fw,fh);g=floorDull.getContext('2d');g.setTransform(FS,0,0,FS,0,0);
  g.drawImage(floorVivid,0,0,W,H);
  const ft=LY.floorTop;
  g.globalCompositeOperation='saturation';g.fillStyle='#808080';g.globalAlpha=0.72;g.fillRect(0,ft,W,H-ft);
  g.globalCompositeOperation='multiply';g.globalAlpha=1;g.fillStyle='#ded2d8';g.fillRect(0,ft,W,H-ft);
  g.globalCompositeOperation='source-over';
  g.fillStyle='rgba(235,220,228,0.18)';g.fillRect(0,ft,W,H-ft);
  for(let i=0;i<Math.round(W*H/2600);i++){const x=rnd(0,W),y=rnd(ft,H);const a=rnd(0,TAU),l=rnd(4,14);
    cLine(g,[[x,y],[x+Math.cos(a)*l,y+Math.sin(a)*l*0.6],[x+Math.cos(a+1)*l,y+Math.sin(a+1)*l*0.6]],'#9d8e96',1.2,{alpha:0.32,passes:1});}
  for(let i=0;i<Math.round(W*H/1800);i++){g.fillStyle='rgba(120,100,110,'+rnd(0.1,0.3).toFixed(2)+')';g.fillRect(rnd(0,W),rnd(ft,H),rnd(1,2.5),rnd(1,2));}
  floorMorning=mk(fw,fh);g=floorMorning.getContext('2d');g.setTransform(FS,0,0,FS,0,0);
  g.drawImage(floorVivid,0,0,W,H);
  const wg=g.createLinearGradient(0,ft,W,H);wg.addColorStop(0,'rgba(255,214,140,0.28)');wg.addColorStop(1,'rgba(255,190,150,0.12)');
  g.fillStyle=wg;g.fillRect(0,ft,W,H-ft);
  for(const p of GN.paths)cLine(g,p.pts,'#fff2a0',p.w*0.55,{passes:1,alpha:0.9});
  for(const m of GN.motifs)drawMotif(g,m.type,m.x,m.y,m.s,true);
  drawMotif(g,'crown',GN.med.x,GN.med.y,GN.med.s*0.55,true);

}

function makeConfettiSprites(){
  CSPR=[];const shapes=['star','heart','circle','petal'];

    CSPR.push({c:spr(40,40,g=>{let p;
      if(sh==='star')p=star(20,21,17,8,5,Math.random()*0.5);else if(sh==='heart')p=heart(20,20,36);

const WRAP_TYPES=['dots','berry','crown','bow','stripe'];
function makeWrapTex(w,h,type,col){
  return spr(w,h,g=>{
    const pts=[];const n=4;const corners=[[2,2],[w-2,2],[w-2,h-2],[2,h-2]];
    for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4];for(let j=0;j<n;j++){const t=j/n;pts.push([a[0]+(b[0]-a[0])*t+rnd(-1.5,1.5),a[1]+(b[1]-a[1])*t+rnd(-1.5,1.5)]);}}
    cFill(g,pts,col,{grain:0.45,lw:Math.max(1.6,M*0.005),sp:4});
    g.save();trace(g,pts,true);g.clip();
    const sp=Math.max(w,h)/rnd(3.6,4.6);let row=0;
    if(type==='stripe'){for(let x=-h;x<w+h;x+=sp*0.6)cFill(g,[[x,-4],[x+sp*0.25,-4],[x+sp*0.25+h,h+4],[x+h,h+4]],'#ffffff',{line:false,alpha:0.7,grain:0.4});}
    else for(let y=sp*0.45;y<h+sp*0.3;y+=sp*0.8,row++)for(let x=(row%2?sp*0.5:0)+sp*0.3;x<w+sp*0.3;x+=sp){
      const s=sp*0.36;
      if(type==='dots')cFill(g,ell(x,y,s*0.5,s*0.5),'#ffffff',{line:false,alpha:0.9});
      else if(type==='berry'){cFill(g,heart(x,y+s*0.1,s*1.1),'#ff5f7e',{line:'#b23a55',lw:1.2});cFill(g,star(x,y-s*0.35,s*0.32,s*0.14,5,0),'#7fcf78',{line:false});
        g.fillStyle='#ffe58a';for(let k=0;k<3;k++)g.fillRect(x+rnd(-s*0.25,s*0.25),y+rnd(-0.05,0.35)*s,1.6,1.6);}
      else if(type==='crown'){const cw=s*1.1,ch=s*0.8;cFill(g,[[x-cw/2,y+ch/2],[x-cw/2,y-ch/2],[x-cw/4,y],[x,y-ch*0.7],[x+cw/4,y],[x+cw/2,y-ch/2],[x+cw/2,y+ch/2]],'#ffd84d',{line:'#b8862a',lw:1.2});}
      else{cFill(g,[[x,y],[x-s*0.7,y-s*0.4],[x-s*0.7,y+s*0.4]],'#ff8fb3',{line:'#c9608a',lw:1.1});cFill(g,[[x,y],[x+s*0.7,y-s*0.4],[x+s*0.7,y+s*0.4]],'#ff8fb3',{line:'#c9608a',lw:1.1});cFill(g,ell(x,y,s*0.18,s*0.18),'#ff6f9f',{line:false});}
    }
    for(let i=0;i<2;i++){const x=rnd(0.2,0.8)*w;const a=rnd(-0.4,0.4);cLine(g,[[x,0],[x+Math.tan(a)*h,h]],'rgba(255,255,255,0.7)',1.4,{passes:1});cLine(g,[[x+2,0],[x+2+Math.tan(a)*h,h]],'rgba(90,40,60,0.18)',1.4,{passes:1});}
    g.restore();
  });
}

  rg.strokeStyle='#b9d1df';rg.lineWidth=2;for(let i=0;i<4;i++){const y=TU*(i+0.3)/4;rg.beginPath();rg.moveTo(0,y);rg.lineTo(TA,y+rnd(-3,3));rg.stroke();}
  rg.fillStyle='rgba(255,255,255,0.8)';for(let i=0;i<40;i++)rg.fillRect(rnd(0,TA),rnd(0,TU),rnd(1,3),rnd(1,2));

function angToU(phi){let u=(phi/TAU)%1;if(u<0)u+=1;return u*TU;}
function texPaint(ax,u,fn){

function addBump(phi,v,amt){

function bumpAt(phi,v){

function inRollerStart(x,y,pad){
  const dx=x-RS.x,dy=y-RS.y;const ax=RL.hdy,ay=-RL.hdx;
  const lx=dx*ax+dy*ay,ly=dx*RL.hdx+dy*RL.hdy;
  return Math.abs(lx)<RL.L0/2+pad&&Math.abs(ly)<RL.R0+pad;
}
function genPath(x,y,a,n,seg,curl){
  const pts=[[x,y]];let turn=rnd(-0.1,0.1);
  for(let i=0;i<n;i++){
    turn+=rnd(-0.08,0.08);turn=clamp(turn,-0.2,0.2);
    const nx=x+Math.cos(a)*seg*3,ny=y+Math.sin(a)*seg*3;
    if(nx<FA.x0+M*0.03||nx>FA.x1-M*0.03||ny<LY.tb+M*0.04||ny>FA.y1){const ta=Math.atan2((FA.y0+FA.y1)/2-y,W/2-x);a+=angDiff(ta,a)*0.4;turn*=0.5;}
    const dx=x-RS.x,dy=y-RS.y;if(Math.hypot(dx*0.7,dy)<M*0.2){a+=angDiff(Math.atan2(dy,dx),a)*0.3;}
    if(i>n-6)turn+=0.14*curl;
    a+=turn;x+=Math.cos(a)*seg;y+=Math.sin(a)*seg;pts.push([x,y]);
  }
  return pts;
}
function mkRope(pts,col,o){
  o=o||{};

    att:false,f:0,side:1,axial:0,held:-1,hx:0,hy:0,pid:null,cool:0,pin:o.pin||null,reserve:o.reserve||0,throne:!!o.throne,
    tas0:!!o.tas0,tas1:!!o.tas1,mp:o.mp||1.3,wound:o.wound||0,keep:o.keep||0,gift:!!o.gift,tail:!!o.tail,lastSt:1,pb:0};
}
function genLevel(){
  confetti=[];wraps=[];ropes=[];parts=[];sticking=[];throneRope=null;tailRope=null;
  RL.mass=0;RL.R=RL.R0;RL.L=RL.L0;RL.rot=0;RL.vx=RL.vy=0;RL.sq=0;RL.sqv=0;RL.bend=0;RL.bendv=0;
  RS.x=W/2;RS.y=H/2;RL.x=RS.x;RL.y=RS.y;
  const hd=[0.22,1];const d=Math.hypot(hd[0],hd[1]);RL.hdx=hd[0]/d;RL.hdy=hd[1]/d;
  const Dh=RL.R+M*0.17;RL.hx=RL.x+RL.hdx*Dh;RL.hy=RL.y+RL.hdy*Dh;
  initRollerTex();
  for(let i=0;i<3;i++){const c=pick(CSPR);texPaint(rnd(30,TA-30),rnd(0,TU),g=>{g.scale(TA/RL.L0,TU/(TAU*RL.R0));g.rotate(rnd(0,TAU));const s=M*0.03;g.drawImage(c.c,-s/2,-s/2,s,s);});}
  // 包装紙

  for(let i=0;i<nW;i++){
    const m=ms[i%ms.length];let w=M*rnd(0.2,0.29),h=w*rnd(0.62,0.85);const a=rnd(-0.6,0.6);
    let x=m.x,y=m.y,ok=false;
    for(let k=0;k<30;k++){x=m.x+rnd(-0.3,0.3)*w*(k>10?2:1);y=m.y+rnd(-0.3,0.3)*h*(k>10?2:1);
      if(k>20){x=rnd(FA.x0+w/2,FA.x1-w/2);y=rnd(FA.y0+h/2,FA.y1-h/2);}
      const pad=Math.hypot(w,h)/2+M*0.04;
      if(Math.abs(x-RS.x)<RL.L0/2+pad&&Math.abs(y-RS.y)<RL.R0+pad)continue;
      if(x<FA.x0+w*0.3||x>FA.x1-w*0.3||y<FA.y0+h*0.3||y>FA.y1-h*0.2)continue;
      let clash=false;for(const o of wraps){if(Math.hypot(o.x-x,o.y-y)<(Math.max(o.w,o.h)+Math.max(w,h))*0.42){clash=true;break;}}
      if(clash&&k<25)continue;ok=true;break;}
    if(!ok)continue;
    const col=WRAP_COLS[i%WRAP_COLS.length];
    wraps.push({x,y,a,w,h,col,tex:makeWrapTex(w,h,WRAP_TYPES[i%WRAP_TYPES.length],col),back:'#fbf6f0',st:'floor',fold:0,foldT:0,fk:0,ft:0,wig:0,
      mass:8+10*(w*h)/(M*M*0.06),need:0,z:0,vz:0,sc:1});
  }
  const ws=wraps.slice().sort((p,q)=>p.w*p.h-q.w*q.h);ws.forEach((w,i)=>w.need=Math.round(lerp(20,55,ws.length>1?i/(ws.length-1):0)));
  // リボン
  const seg=LY.seg,nS=LY.portrait?19:24;
  {const lg=LY.obst[3];const arc=[];for(let k=0;k<=4;k++){const a=Math.PI+k/4*Math.PI*0.9;arc.push([lg.x+Math.cos(a)*(lg.r+LY.rw*0.7),lg.y-Math.sin(a)*(lg.r+LY.rw*0.7)*-1]);}
   const last=arc[arc.length-1];const p=arc.concat(genPath(last[0],last[1]+seg*0.5,0.9,nS-4,seg,1).slice(1));
   ropes.push(mkRope(p,RIB_COLS[0],{}));}
  {const p=genPath(LY.giftX-LY.gw*0.3,LY.giftB+M*0.05,2.2,nS,seg,-1);ropes.push(mkRope(p,RIB_COLS[2],{}));}
  {const sx=Math.random()<0.5?FA.x0+M*0.12:FA.x1-M*0.12;const p=genPath(sx,FA.y1-M*0.06,sx<W/2?-0.5:Math.PI+0.5,nS,seg,sx<W/2?1:-1);ropes.push(mkRope(p,RIB_COLS[1],{}));}
  // 玉座の下から伸びる特別なリボン
  {const S=LY.S;const pts=[[S.x,S.y]];let x=S.x,y=S.y;
   for(let i=0;i<3;i++){y+=seg;pts.push([x+i*seg*0.25,y]);x+=seg*0.25;}
   let a=0.5;const nV=LY.portrait?20:24;
   for(let i=0;i<nV;i++){
     if(i<5)a=lerp(0.3,1.9,i/5);else{a+=rnd(-0.18,0.22)*(i>nV-6?1.6:1);}
     const nx=x+Math.cos(a)*seg,ny=y+Math.sin(a)*seg;
     if(nx<FA.x0+M*0.05||nx>FA.x1-M*0.05)a=Math.PI-a;
     if(Math.hypot(nx-RS.x,(ny-RS.y)*1.4)<M*0.22){a+=angDiff(Math.atan2(ny-RS.y,nx-RS.x),a)*0.4;}
     x+=Math.cos(a)*seg;y+=Math.sin(a)*seg;y=Math.min(y,FA.y1);pts.push([x,y]);}
   pts.reverse();
   throneRope=mkRope(pts,'#ec6a92',{edge:'#b8862a',pin:{x:S.x,y:S.y},reserve:LY.portrait?26:30,throne:true,tas0:true,tas1:true,mp:1.0});
   ropes.push(throneRope);}
  // 紙吹雪

  const nC=Math.round(clamp(area/(M*M)*62,95,150));
  const addC=(x,y,o)=>{const sp=pick(CSPR);confetti.push(Object.assign({x,y,a:rnd(0,TAU),s:M*0.038*rnd(0.8,1.25),spr:sp,col:sp.col,seed:Math.random()*100,st:0,lift:0,z:0,vz:0,vx:0,vy:0,va:0,t:0,gift:false,nudge:null},o||{}));};
  // ローラーにくっつきそうな数枚
  const ax=RL.hdy,ay=-RL.hdx;
  for(let i=0;i<6;i++){const lx=lerp(-RL.L0*0.4,RL.L0*0.4,i/5)+rnd(-4,4);const ly=(i%2?1:-1)*(RL.R0+M*rnd(0.004,0.014));
    addC(RS.x+ax*lx+RL.hdx*ly,RS.y+ay*lx+RL.hdy*ly);}
  let tries=0;
  for(let i=0;i<Math.round(nC*0.28)&&tries<2000;tries++){const a=rnd(0,TAU),r=rnd(RL.R0+M*0.06,M*0.3);
    const x=RS.x+Math.cos(a)*r*1.3,y=RS.y+Math.sin(a)*r;if(inRollerStart(x,y,M*0.035))continue;

  tries=0;
  for(let i=0;i<nC-Math.round(nC*0.28)&&tries<4000;tries++){const x=rnd(FA.x0,FA.x1),y=rnd(FA.y0,FA.y1);

  // しきい値

  // 初めから少しだけ見えている金色
  for(let i=0;i<8;i++){const s=pick(GN.samples);if(s[1]<FA.y0)continue;stampBlob(s[0]+rnd(-8,8),s[1]+rnd(-8,8),M*rnd(0.02,0.035));}

  CL.on=false;CL.done=false;CL.t=0;CL.beam=0;CL.wind=0;CL.morning=0;CL.built=false;CL.fired=new Uint8Array(LY.deco.length);
  SK.sy=1;SK.v=0;SK.j=0;SK.jv=0;SK.flip=false;
  GIFT.ready=true;GIFT.open=false;GIFT.lid=0;GIFT.lidv=0;GIFT.spawned=false;
}

function initClean(){

function stampPoly(pts){

function markCells(test,x0,y0,x1,y1){

  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const i=r*gcols+c;if(grid[i])continue;const x=(c+0.5)*gcs,y=(r+0.5)*gcs;if(test(x,y)){grid[i]=1;if(y>FA.y0&&y<H-SAFE.b)gClean++;}}

function stampBlob(x,y,r){stampPoly(jit(ell(x,y,r,r*0.8,0,TAU,14),r*0.12,true));markCells((px,py)=>Math.hypot(px-x,(py-y)*1.2)<r,x-r,y-r,x+r,y+r);}
function stampRect(cx,cy,ux,uy,hw,hh,rough){
  const vx=-uy,vy=ux;
  const c=[[cx-ux*hw-vx*hh,cy-uy*hw-vy*hh],[cx+ux*hw-vx*hh,cy+uy*hw-vy*hh],[cx+ux*hw+vx*hh,cy+uy*hw+vy*hh],[cx-ux*hw+vx*hh,cy-uy*hw+vy*hh]];

  markCells((px,py)=>{const dx=px-cx,dy=py-cy;return Math.abs(dx*ux+dy*uy)<=hw&&Math.abs(dx*vx+dy*vy)<=hh;},cx-e,cy-f,cx+e,cy+f);

    if(Math.abs(dx*ux+dy*uy)<=hw+m.s*0.2&&Math.abs(dx*vx+dy*vy)<=hh+m.s*0.2){m.rev=true;sfx.sparkle();for(let i=0;i<5;i++)spark(m.x+rnd(-1,1)*m.s*0.5,m.y+rnd(-1,1)*m.s*0.4,SPR.spark,0.8);}}

function cellClean(x,y){const c=Math.floor(x/gcs),r=Math.floor(y/gcs);if(c<0||r<0||c>=gcols||r>=grows)return false;return grid[r*gcols+c]===1;}

/* ================================================================
   ローラーの更新と接触
   ================================================================ */
function rollerDh(){return RL.R+M*0.17;}
function updateRoller(dt){
  const g=gOf(RL.mass);const Rt=RL.R0*g,Lt=RL.L0*(1+0.13*(g-1));
  RL.R+=(Rt-RL.R)*Math.min(1,dt*4);RL.L+=(Lt-RL.L)*Math.min(1,dt*4);
  const Dh=rollerDh();const px=RL.x,py=RL.y;
  const wgt=1+0.12*(g-1);const w=24/Math.sqrt(wgt),z=0.9;
  const n=Math.max(1,Math.ceil(dt/0.008)),h=dt/n;
  const x0=SAFE.l+M*0.06,x1=W-SAFE.r-M*0.06,y0=LY.tb+M*0.02+RL.R*0.75,y1=Math.max(y0+10,H-SAFE.b-M*0.03);
  for(let i=0;i<n;i++){
    if(RL.holder!==null){let tx,ty;
      if(RL.mode==='body'){tx=RL.fx+RL.ox;ty=RL.fy+RL.oy;}
      else{const hx=RL.fx+RL.ox,hy=RL.fy+RL.oy;const dx=RL.x-hx,dy=RL.y-hy;const d=Math.hypot(dx,dy)||1;tx=hx+dx/d*Dh;ty=hy+dy/d*Dh;}
      RL.vx+=(w*w*(tx-RL.x)-2*z*w*RL.vx)*h;RL.vy+=(w*w*(ty-RL.y)-2*z*w*RL.vy)*h;
    }else{const f=Math.exp(-5*h);RL.vx*=f;RL.vy*=f;}
    RL.vx+=RL.pullx*h;RL.vy+=RL.pully*h;
    const sp=Math.hypot(RL.vx,RL.vy),mx=M*7;if(sp>mx){RL.vx*=mx/sp;RL.vy*=mx/sp;}
    RL.x+=RL.vx*h;RL.y+=RL.vy*h;
    if(RL.x<x0){RL.x=x0;if(RL.vx<0)RL.vx=0;}if(RL.x>x1){RL.x=x1;if(RL.vx>0)RL.vx=0;}
    if(RL.y<y0){RL.y=y0;if(RL.vy<0)RL.vy=0;}if(RL.y>y1){RL.y=y1;if(RL.vy>0)RL.vy=0;}
  }
  RL.pullx=0;RL.pully=0;
  let dx,dy;
  if(RL.holder!==null&&RL.mode==='grip'){dx=RL.fx+RL.ox-RL.x;dy=RL.fy+RL.oy-RL.y;}else{dx=RL.hx-RL.x;dy=RL.hy-RL.y;}
  const d=Math.hypot(dx,dy)||1;
  // 持ち手は急に反転しない
  const nhx=dx/d,nhy=dy/d;const da=angDiff(Math.atan2(nhy,nhx),Math.atan2(RL.hdy,RL.hdx));
  const lim=Math.min(Math.abs(da),dt*9);const na=Math.atan2(RL.hdy,RL.hdx)+Math.sign(da)*lim;
  RL.hdx=Math.cos(na);RL.hdy=Math.sin(na);
  RL.hx=RL.x+RL.hdx*Dh;RL.hy=RL.y+RL.hdy*Dh;
  const dX=RL.x-px,dY=RL.y-py;
  const roll=dX*RL.hdx+dY*RL.hdy;RL.rot+=roll/RL.R;RL.roll=Math.abs(roll);
  RL.speed=dt>0?Math.hypot(dX,dY)/dt:0;
  const lat=dt>0?(dX*RL.hdy-dY*RL.hdx)/dt:0;
  const bt=clamp(-lat*0.03,-M*0.05,M*0.05);
  RL.bendv+=((bt-RL.bend)*140-RL.bendv*12)*dt;RL.bend+=RL.bendv*dt;
  RL.sqv+=(-RL.sq*170-RL.sqv*13)*dt;RL.sq+=RL.sqv*dt;
  const dist=Math.hypot(dX,dY);
  if(dist>0.25){const ns=Math.max(1,Math.ceil(dist/(RL.R*0.45)));for(let k=1;k<=ns;k++)contactAt(px+dX*k/ns,py+dY*k/ns,0,dX/ns,dY/ns);}
  if(RL.press>0){RL.press-=dt;contactAt(RL.x,RL.y,M*0.012,0,0);}
}
function inFoot(px,py,mg){const dx=px-RL.x,dy=py-RL.y;const ax=RL.hdy,ay=-RL.hdx;
  return Math.abs(dx*ax+dy*ay)<=RL.L/2+mg&&Math.abs(dx*RL.hdx+dy*RL.hdy)<=RL.R+mg;}
function contactAt(cx,cy,extra,dX,dY){
  const ax=RL.hdy,ay=-RL.hdx,hx=RL.hdx,hy=RL.hdy,Lh=RL.L/2,R=RL.R;const mg=M*0.022+4+extra;
  for(const c of confetti){if(c.st!==0)continue;const dx=c.x-cx,dy=c.y-cy;
    const lx=dx*ax+dy*ay;if(Math.abs(lx)>Lh+mg)continue;const ly=dx*hx+dy*hy;if(Math.abs(ly)>R*0.95+mg)continue;stickConf(c,lx,ly);}
  for(const w of wraps){if(w.st!=='floor'||w.z>1)continue;
    if(wrapOverlap(w,cx,cy,ax,ay,hx,hy,Lh,R,M*0.012+extra)){if(RL.mass>=w.need)captureWrap(w,cx,cy);else pushWrap(w,cx,cy,dX,dY);}}
  for(const r of ropes){if(r.att||r.cool>0)continue;const n=r.p.length;
    for(let i=0;i<n;i++){const q=r.p[i];if(r.throne&&r.pin&&hiddenUnderSkirt(q))continue;
      const dx=q.x-cx,dy=q.y-cy;if(Math.abs(dx*ax+dy*ay)>Lh+mg*0.6)continue;if(Math.abs(dx*hx+dy*hy)>R+mg*0.6)continue;
      const endA=i<n*0.35,endB=!r.throne&&i>n*0.65;
      if(RL.mass>=RIBNEED&&(endA||endB)){attachRope(r,endB&&!endA);}
      else{r.pb=0.3;}
      break;}}
  const ddx=cx-RL.lsx,ddy=cy-RL.lsy;
  if(ddx*ddx+ddy*ddy>(R*0.3)*(R*0.3)||extra>0){stampRect(cx,cy,ax,ay,Lh,R*0.86,M*0.006);RL.lsx=cx;RL.lsy=cy;}
}
function stickConf(c,lx,ly){
  c.st=1;c.t=0;c.lx=clamp(lx,-RL.L*0.47,RL.L*0.47);c.ly0=ly;c.side=ly>RL.R*0.1?1:ly<-RL.R*0.1?-1:(Math.random()<0.5?1:-1);
  c.spin=rnd(-5,5);sticking.push(c);sfx.peta();
}
function finishConf(c){

function wrapPts(w){const ca=Math.cos(w.a),sa=Math.sin(w.a);const o=[];

function hiddenUnderSkirt(q){return q.y<LY.tb+M*0.012&&Math.abs(q.x-LY.tx)<LY.tw*0.38&&SK.sy>0.6;}

/* ================================================================
   紙吹雪・包装紙・リボンの更新
   ================================================================ */
function gust(x,y){return Math.pow(Math.max(0,Math.sin(x/W*3-T*1.1+y/H*1.5)),6)*0.55+Math.pow(Math.max(0,Math.sin(x/W*7+T*0.7)),8)*0.25;}
function updateConfetti(dt){
  const gr=M*3.2;
  for(const c of confetti){
    if(c.st===0){
      const gst=gust(c.x,c.y)*(1+CL.wind);c.lift+=((gst*(0.5+0.5*Math.sin(c.seed+T*6)))-c.lift)*Math.min(1,dt*6);
      if(c.nudge){const nd=c.nudge;nd.t+=dt/1.3;const e=ease(nd.t);c.x=lerp(nd.x0,nd.tx,e);c.y=lerp(nd.y0,nd.ty,e);c.a+=dt*2;c.lift=Math.max(c.lift,Math.sin(nd.t*Math.PI)*0.8);if(nd.t>=1)c.nudge=null;}
    }else if(c.st===2){
      c.vz-=gr*dt;c.z+=c.vz*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.a+=c.va*dt;
      if(c.x<FA.x0){c.x=FA.x0;c.vx=Math.abs(c.vx);}if(c.x>FA.x1){c.x=FA.x1;c.vx=-Math.abs(c.vx);}
      if(c.y>FA.y1){c.y=FA.y1;c.vy=-Math.abs(c.vy)*0.5;}if(c.y<FA.y0){c.y=FA.y0;c.vy=Math.abs(c.vy);}
      if(c.z<=0){c.z=0;if(c.vz<-M*0.6){c.vz=-c.vz*0.3;c.vx*=0.5;c.vy*=0.5;}else{c.st=0;c.vz=0;}}
    }
  }
  for(let i=sticking.length-1;i>=0;i--){const c=sticking[i];c.t+=dt/0.2;if(c.t>=1){finishConf(c);c.st=9;sticking.splice(i,1);}}
  if(confetti.some(c=>c.st===9))confetti=confetti.filter(c=>c.st!==9);
}
function updateWraps(dt){
  for(let i=wraps.length-1;i>=0;i--){const w=wraps[i];
    if(w.st==='floor'){
      if(w.z>0||w.vz!==0){w.vz-=M*3*dt;w.z+=w.vz*dt;w.x+=w.vx*dt;w.y+=w.vy*dt;w.a+=w.va*dt;w.sc=Math.min(1,w.sc+dt*2);
        w.x=clamp(w.x,FA.x0,FA.x1);w.y=clamp(w.y,FA.y0,FA.y1);
        if(w.z<=0){w.z=0;if(w.vz<-M*0.5){w.vz=-w.vz*0.25;}else{w.vz=0;w.sc=1;}sfx.crinkle(0.3);}}
      if(w.ft>0)w.ft-=dt;else w.foldT=Math.min(w.foldT,0.14);

    }else if(w.st==='strip'){const S=w.S;
      const ax=RL.hdy,ay=-RL.hdx;
      const Ax=RL.x+ax*S.axial+RL.hdx*S.side*RL.R*0.88,Ay=RL.y+ay*S.axial+RL.hdy*S.side*RL.R*0.88;S.ax=Ax;S.ay=Ay;
      const wind=Math.min(RL.roll*0.6,M*0.45*dt);
      if(wind>0){const old=S.rem;S.rem=Math.max(0,S.rem-wind);S.acc+=old-S.rem;addMass(w.mass*(old-S.rem)/S.Ls);
        if(S.acc>M*0.012){paintStrip(w,S.acc);S.acc=0;}

function paintStrip(w,amt){

function ropeStrain(r){let s=0;const P=r.p;for(let i=0;i<P.length-1;i++)s+=Math.hypot(P[i+1].x-P[i].x,P[i+1].y-P[i].y);

    const q=P[Math.min(1,P.length-1)];const ax=RL.hdy,ay=-RL.hdx;
    const dot=(q.x-RL.x)*RL.hdx+(q.y-RL.y)*RL.hdy;if(Math.abs(dot)>RL.R*0.4)r.side=dot>=0?1:-1;

    if(it%3===2){for(let i=0;i<n;i++){const q=P[i];
      for(const o of LY.obst){const dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy),rr=o.r+LY.rw*0.45;if(d<rr&&d>1e-4){q.x=o.x+dx/d*rr;q.y=o.y+dy/d*rr;}}
      q.x=clamp(q.x,SAFE.l+2,W-SAFE.r-2);q.y=clamp(q.y,LY.floorTop+M*0.02,H-SAFE.b-2);}}

  }

    const a=P[0],b=P[1];const nx=lerp(a.x,b.x,0.3),ny=lerp(a.y,b.y,0.3);P.splice(1,0,{x:nx,y:ny,px:nx,py:ny,s:Math.random()});r.wound--;if(r.held>=1)r.held++;sfx.cloth();RL.rot-=r.seg/RL.R*0.5;
  }

function startClimax(){
  if(CL.on||CL.done)return;
  CL.on=true;CL.t=0;SK.v=-14;SK.flip=true;
  stampPoly(jit(ell(LY.medX,LY.tb-M*0.035,LY.tw*0.45,M*0.07,0,TAU,20),3,true));
  markCells((x,y)=>Math.hypot((x-LY.medX)/(LY.tw*0.45),(y-LY.tb+M*0.035)/(M*0.07))<1,LY.medX-LY.tw*0.5,LY.tb-M*0.12,LY.medX+LY.tw*0.5,LY.tb+M*0.05);
  for(let i=0;i<10;i++)spark(LY.medX+rnd(-1,1)*LY.tw*0.35,LY.medY+rnd(-1,1)*M*0.03,SPR.spark,1.2,rnd(-80,80)*M/400,rnd(-120,-20)*M/400);
  sfx.sparkle();sfx.finale();
  let mr=0;for(const p of [[0,H],[W,H],[0,LY.floorTop],[W,LY.floorTop]])mr=Math.max(mr,Math.hypot(p[0]-LY.medX,p[1]-LY.medY));CL.maxR=mr;
  WAVES.push({x:LY.medX,y:LY.medY,t:0,dur:2.6,maxR:mr,a:1});
}
function updateClimax(dt){
  if(!CL.on)return;CL.t+=dt;const t=CL.t;
  for(let i=0;i<LY.deco.length;i++){if(CL.fired[i])continue;const d=LY.deco[i];if(t>0.5+d.d/CL.maxR*2.2){CL.fired[i]=1;for(let k=0;k<3;k++)spark(d.x+rnd(-8,8),d.y+rnd(-8,8),k%2?SPR.sparkW:SPR.spark,0.9,rnd(-20,20),rnd(-40,0));}}
  CL.beam=ease((t-1.4)/1.8);
  CL.wind=t<1.8?0:t<2.6?ease((t-1.8)/0.8):Math.max(0.18,1-(t-2.6)/3.5);
  if(t>2.2&&!CL.built){CL.built=true;cleanMC=mk(W*FS,H*FS);cleanMG=cleanMC.getContext('2d');cleanMG.setTransform(FS,0,0,FS,0,0);
    cleanMG.drawImage(floorMorning,0,0,W,H);cleanMG.globalCompositeOperation='destination-in';cleanMG.drawImage(cleanC,0,0,W,H);cleanMG.globalCompositeOperation='source-over';}
  if(CL.built&&cleanMC)CL.morning=ease((t-2.4)/1.6);
  if(t>4.1&&cleanMC){cleanC=cleanMC;cleanG=cleanMG;cleanMC=null;cleanMG=null;stampSrc=floorMorning;CL.morning=0;}
  if(t>5.5&&!CL.done){CL.done=true;ensureTail();}
}
function ensureTail(){
  if(tailRope&&ropes.indexOf(tailRope)>=0)return;
  const ax=RL.hdy,ay=-RL.hdx;const pts=[];
  for(let i=0;i<5;i++){pts.push([RL.x+RL.hdx*(RL.R*0.92+i*LY.seg)+ax*RL.L*0.2,RL.y+RL.hdy*(RL.R*0.92+i*LY.seg)+ay*RL.L*0.2]);}

function giftRemaining(){let n=0;for(const c of confetti)if(c.gift)n++;for(const w of wraps)if(w.gift)n++;for(const r of ropes)if(r.gift)n++;return n;}

  if(wraps.length<12)for(let i=0;i<2;i++){const w=M*rnd(0.18,0.25),h=w*rnd(0.65,0.85);const col=pick(WRAP_COLS);const a=rnd(Math.PI*0.45,Math.PI*0.95),v=rnd(0.3,0.6)*M;
    wraps.push({x:ox,y:oy,a:rnd(-0.6,0.6),w,h,col,tex:makeWrapTex(w,h,pick(WRAP_TYPES),col),back:'#fbf6f0',st:'floor',fold:0,foldT:0,fk:0,ft:0,wig:0,
      mass:6,need:0,z:z0,vz:rnd(0.9,1.3)*M,vx:Math.cos(a)*v,vy:Math.sin(a)*v,va:rnd(-3,3),sc:0.3,gift:true});}
  if(ropes.length<6){const a=rnd(Math.PI*0.55,Math.PI*0.9);const n=14;const pts=[];for(let i=0;i<n;i++)pts.push([ox+Math.cos(a)*i*2,oy+M*0.02+Math.sin(a)*i*2]);
    const r=mkRope(pts,pick(RIB_COLS),{gift:true});for(let i=0;i<n;i++){const q=r.p[i];const sp=i*LY.seg*0.16;q.px=q.x-Math.cos(a+Math.sin(i*0.7)*0.6)*sp;q.py=q.y-Math.sin(a+Math.sin(i*0.7)*0.6)*sp;}ropes.push(r);}
  for(let i=0;i<8;i++)spark(ox+rnd(-1,1)*LY.gw*0.4,oy-z0,i%2?SPR.sparkW:SPR.spark,1,rnd(-120,120)*M/400,rnd(-200,-60)*M/400);

/* ================================================================
   誘導（光る対象・指のお手本・風）
   ================================================================ */
function curTarget(){
  if(CL.on||CL.done){if(CL.done&&GIFT.ready&&floorMess()<40)return 'gift';return 'roller';}
  if(throneRope&&throneRope.pin&&RL.mass>=THRONE_NEED&&!throneRope.att&&throneRope.held<0)return 'tassel';
  return 'roller';
}
function floorMess(){let n=0;for(const c of confetti)if(c.st===0)n++;n+=wraps.length*4;for(const r of ropes)if(!r.tail)n+=6;return n;}
function targetPos(){const t=curTarget();
  if(t==='gift')return {x:LY.giftX,y:LY.giftB-LY.gw*0.5};
  if(t==='tassel'){const q=throneRope.p[0];return {x:q.x,y:q.y};}
  return {x:RL.x,y:RL.y};}
function nearestPickable(){
  let best=null,bd=1e18;

  for(const w of wraps){if(w.st!=='floor'||RL.mass<w.need)continue;const d=((w.x-RL.x)**2+(w.y-RL.y)**2)*0.6;if(d<bd){bd=d;best=w;}}
  if(RL.mass>=RIBNEED)for(const r of ropes){if(r.att||r.tail||(r.throne&&RL.mass<THRONE_NEED))continue;const q=r.p[0];const d=((q.x-RL.x)**2+(q.y-RL.y)**2)*0.5;if(d<bd){bd=d;best=q;}}
  return best;
}
function updateHints(dt){

    let best=null,bd=1e9;const ax=RL.hdy,ay=-RL.hdx;
    for(const c of confetti){if(c.st!==0||c.nudge)continue;const dx=c.x-RL.x,dy=c.y-RL.y;const d=Math.hypot(dx,dy);if(d<bd&&d<M*0.4&&!inFoot(c.x,c.y,M*0.03)){bd=d;best=c;}}
    if(best){const dx=best.x-RL.x,dy=best.y-RL.y;const lx=dx*ax+dy*ay,ly=dx*RL.hdx+dy*RL.hdy;
      const tl=clamp(lx,-RL.L*0.45,RL.L*0.45),tly=(ly>=0?1:-1)*(RL.R+M*0.035+10);
      best.nudge={x0:best.x,y0:best.y,tx:RL.x+ax*tl+RL.hdx*tly,ty:RL.y+ay*tl+RL.hdy*tly,t:0};}}}
  else HINT.windT=1.5;
}
function drawHand(){
  if(idle<4)return;const ph=((idle-4)%2.8)/2.8;const t=curTarget();

  if(t==='gift'){sx=ex=LY.giftX;sy=ey=LY.giftB-LY.gw*0.45;}
  else if(t==='tassel'){const q=throneRope.p[0];sx=q.x;sy=q.y;const dx=RL.x-sx,dy=RL.y-sy,d=Math.hypot(dx,dy)||1;const l=Math.min(d*0.7,M*0.3);ex=sx+dx/d*l;ey=sy+dy/d*l;}
  else{sx=RL.x;sy=RL.y;const p=nearestPickable();let dx=0,dy=-1;if(p){dx=p.x-sx;dy=p.y-sy;}const d=Math.hypot(dx,dy)||1;const l=clamp(d,M*0.15,M*0.3);ex=sx+dx/d*l;ey=sy+dy/d*l;}
  let a=1,x=sx,y=sy,press=0;
  if(ph<0.12){a=ph/0.12;}else if(ph<0.22){press=(ph-0.12)/0.1;}else if(ph<0.72){press=1;const e=ease((ph-0.22)/0.5);x=lerp(sx,ex,e);y=lerp(sy,ey,e);}
  else if(ph<0.85){press=1-(ph-0.72)/0.13;x=ex;y=ey;}else{a=1-(ph-0.85)/0.15;x=ex;y=ey;}
  if(t==='gift'){x=sx;y=sy;press=Math.max(0,Math.sin(ph*Math.PI*4));}
  const s=M*0.16*(1-press*0.08);
  ctx.save();ctx.globalAlpha=0.78*a;
  if(press>0.2){ctx.fillStyle='rgba(255,255,255,'+(0.4*press)+')';ctx.beginPath();ctx.ellipse(x,y,s*0.18,s*0.13,0,0,TAU);ctx.fill();}
  ctx.drawImage(SPR.hand,x-s*0.5,y-s*0.04,s,s*1.3);ctx.restore();
}

/* ================================================================
   入力（Pointer Events）
   ================================================================ */
function nearestRope(x,y){let best=null;
  for(const r of ropes){for(let i=0;i<r.p.length;i++){const q=r.p[i];if(r.throne&&r.pin&&hiddenUnderSkirt(q))continue;
    if(r.att&&i===0)continue;const d=Math.hypot(q.x-x,q.y-y)-(i===0||i===r.p.length-1?LY.rw*0.6:0);
    if(!best||d<best.d)best={r,i,d};}}return best;}
function hitWrap(x,y){for(let i=wraps.length-1;i>=0;i--){const w=wraps[i];if(w.st!=='floor')continue;const dx=x-w.x,dy=y-w.y,ca=Math.cos(w.a),sa=Math.sin(w.a);
  if(Math.abs(dx*ca+dy*sa)<w.w/2+6&&Math.abs(-dx*sa+dy*ca)<w.h/2+6)return w;}return null;}
function onDown(e){
  e.preventDefault();auInit();idle=0;started=true;
  if(PTR.has(e.pointerId))return;
  const x=e.clientX,y=e.clientY;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const free=RL.holder===null;
  const gripD=Math.hypot(x-RL.hx,y-RL.hy);
  const bodyHit=inFoot(x,y,M*0.05+10);
  const rp=nearestRope(x,y);const ropeR=Math.max(M*0.06,24);
  const grabRoller=mode=>{RL.holder=e.pointerId;RL.mode=mode;RL.fx=x;RL.fy=y;
    if(mode==='body'){RL.ox=RL.x-x;RL.oy=RL.y-y;}else{RL.ox=RL.hx-x;RL.oy=RL.hy-y;}
    RL.sqv+=9;RL.press=0.22;RL.vx*=0.3;RL.vy*=0.3;sfx.squish();contactAt(RL.x,RL.y,M*0.012,0,0);PTR.set(e.pointerId,{k:'roller'});};
  const grabRope=()=>{const r=rp.r;if(r.held>=0&&r.pid!==null)return false;r.held=rp.i;r.hx=x;r.hy=y;r.pid=e.pointerId;PTR.set(e.pointerId,{k:'rope',r});sfx.cloth();
    if(r.throne&&r.pin&&RL.mass<THRONE_NEED)SK.jv+=3;return true;};
  if(free&&gripD<Math.max(M*0.085,34)&&!(rp&&rp.d<LY.rw*0.8)){grabRoller('grip');return;}
  if(rp&&rp.d<ropeR&&(!bodyHit||rp.d<LY.rw*1.2)&&!(rp.r.att&&bodyHit&&!rp.r.tail)){if(grabRope())return;}
  if(free&&bodyHit){grabRoller('body');return;}
  if(rp&&rp.d<ropeR){if(grabRope())return;}
  PTR.set(e.pointerId,{k:'none'});
  // 関係ない場所は小さく反応するだけ
  if(Math.abs(x-LY.giftX)<LY.gw*0.75&&y>LY.giftB-LY.gw*1.3&&y<LY.giftB+M*0.03){if(CL.done)openGift();else{GIFT.wigv+=6;sfx.tok();}return;}
  const w=hitWrap(x,y);
  if(w){const cs=wrapCorners(w);let k=0,bd=1e9;for(let i=0;i<4;i++){const d=Math.hypot(cs[i][0]-x,cs[i][1]-y);if(d<bd){bd=d;k=i;}}w.fk=k;w.foldT=0.32;w.ft=0.35;w.wig=0.6;sfx.crinkle(0.3);return;}
  let bc=null,bd=M*0.05+10;for(const c of confetti){if(c.st!==0)continue;const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;bc=c;}}
  if(bc){bc.st=2;bc.vz=M*0.7;bc.z=0.1;bc.vx=rnd(-20,20);bc.vy=rnd(-20,20);bc.va=rnd(-8,8);sfx.hop();return;}
  if(Math.abs(x-LY.tx)<LY.tw*0.55&&y>LY.tb-LY.th&&y<LY.tb+M*0.02){
    if(Math.hypot(x-LY.cam.x,y-LY.cam.y)<LY.cam.r*1.2){CAM.giggle=0.6;CAM.blink=0.15;sfx.giggle();}else{SK.jv+=5;sfx.tok();}return;}
  if(y<LY.floorTop){GL.imp=Math.min(1.2,GL.imp+0.5);GL.rotv+=2;sfx.tok();return;}
  puff(x,y,0.6);
}
function onMove(e){
  const g=PTR.get(e.pointerId);if(!g)return;e.preventDefault();idle=0;
  const x=e.clientX,y=e.clientY;
  if(g.k==='roller'&&RL.holder===e.pointerId){RL.fx=x;RL.fy=y;}
  else if(g.k==='rope'){const r=g.r;if(r.pid===e.pointerId&&r.held>=0&&ropes.indexOf(r)>=0){r.hx=clamp(x,0,W);r.hy=clamp(y,LY.floorTop,H);}else PTR.delete(e.pointerId);}
}
function onUp(e){
  const g=PTR.get(e.pointerId);if(!g)return;PTR.delete(e.pointerId);
  if(g.k==='roller'&&RL.holder===e.pointerId){RL.holder=null;}
  else if(g.k==='rope'){const r=g.r;if(r.pid===e.pointerId){r.held=-1;r.pid=null;}}
}

  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;
  const sw=window.innerWidth,sh=window.innerHeight;
  if(sw!==W||sh!==H){pendT+=dt;if(pendT>0.15){pendT=0;relayout();}}else pendT=0;
  dt=Math.min(dt,0.05);
  try{update(dt);render(dt);}catch(err){if(!frame.err){frame.err=1;setTimeout(()=>{throw err;});}}
  if(!LOW){perfAcc+=dt;perfN++;if(perfN>=90){if(perfAcc/perfN>1/38&&T>4){LOW=true;rebuild(true);}perfAcc=0;perfN=0;}}
}
function setCanvasSize(){
  DPR=Math.min(2,window.devicePixelRatio||1);if(LOW)DPR=Math.min(DPR,1.25);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  FS=LOW?1:Math.min(DPR,1.5);SS=Math.min(DPR,2);
}
function buildAll(){
  computeLayout();genGold();
  bgC=mk(W*FS,H*FS);const g=bgC.getContext('2d');g.setTransform(FS,0,0,FS,0,0);drawWall(g);
  buildFloors();buildSprites();
}
function rebuild(keep){
  const oldClean=cleanC,oW=W,oH=H,oft=LY.floorTop;
  setCanvasSize();buildAll();
  initClean();
  if(oldClean){const sy=(H-LY.floorTop)/(oH-oft);
    cleanG.save();cleanG.setTransform(FS,0,0,FS,0,0);
    cleanG.drawImage(oldClean,0,oft*(oldClean.height/oH),oldClean.width,(oH-oft)*(oldClean.height/oH),0,LY.floorTop,W,(oH-oft)*sy);
    cleanG.globalCompositeOperation='source-in';cleanG.drawImage(stampSrc,0,0,W,H);cleanG.restore();
    rebuildGridFromCanvas();}
}
function rebuildGridFromCanvas(){
  try{const c=mk(gcols,grows);const g=c.getContext('2d');g.drawImage(cleanC,0,0,gcols,grows);const d=g.getImageData(0,0,gcols,grows).data;
    gClean=0;for(let i=0;i<grid.length;i++){grid[i]=d[i*4+3]>120?1:0;const r=Math.floor(i/gcols);const y=(r+0.5)*gcs;if(grid[i]&&y>FA.y0&&y<H-SAFE.b)gClean++;}}catch(e){}
}
function relayout(){
  const o={W,H,ft:LY.floorTop,M,tb:LY.tb};
  W=window.innerWidth;H=window.innerHeight;readSafe();
  rebuild(true);
  const sx=W/o.W;const fy=y=>LY.floorTop+(y-o.ft)*(H-LY.floorTop)/(o.H-o.ft);const sc=M/o.M;
  const mp=p=>{p.x*=sx;p.y=fy(p.y);};
  mp(RL);RL.R*=sc;RL.L*=sc;RL.hx=RL.x+RL.hdx*rollerDh();RL.hy=RL.y+RL.hdy*rollerDh();RL.lsx=-1e9;
  for(const c of confetti){mp(c);c.s*=sc;if(c.nudge)c.nudge=null;}
  for(const w of wraps){mp(w);w.w*=sc;w.h*=sc;if(w.S){const S=w.S;S.Ls*=sc;S.Ws*=sc;S.rem*=sc;S.len*=sc;const f={x:S.fx,y:S.fy};mp(f);S.fx=f.x;S.fy=f.y;S.axial*=sc;}}
  for(const r of ropes){for(const q of r.p){q.x*=sx;q.y=fy(q.y);q.px=q.x;q.py=q.y;}r.seg=LY.seg;r.axial*=sc;if(r.pin){r.pin={x:LY.S.x,y:LY.S.y};}}
  parts.length=0;WAVES.length=0;
  for(const m of GN.motifs)m.rev=cellClean(m.x,m.y);
  if(CL.fired&&CL.fired.length!==LY.deco.length)CL.fired=new Uint8Array(LY.deco.length).fill(CL.done?1:0);
  if(cleanMC){cleanMC=null;cleanMG=null;CL.built=CL.t>2.2;if(CL.t>2.2)stampSrc=floorMorning;}
}
function init(){
  W=window.innerWidth;H=window.innerHeight;readSafe();
  setCanvasSize();buildAll();makeConfettiSprites();initClean();genLevel();
  last=performance.now();raf=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;if(AU.ctx&&AU.ctx.state==='running'){try{AU.ctx.suspend();}catch(e){}}}
  else{if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}if(AU.ctx&&started){try{AU.ctx.resume();}catch(e){}}}
});

/* ================================================================
   テスト用フック（画面には何も出さない）
   ================================================================ */
window.__party={
  info(){return {mass:+RL.mass.toFixed(1),R:+RL.R.toFixed(1),L:+RL.L.toFixed(1),x:+RL.x.toFixed(1),y:+RL.y.toFixed(1),hx:+RL.hx.toFixed(1),hy:+RL.hy.toFixed(1),
    confetti:confetti.filter(c=>c.st===0).length,sticking:sticking.length,wraps:wraps.length,strips:wraps.filter(w=>w.st==='strip').length,ropes:ropes.length,
    attached:ropes.filter(r=>r.att).length,throne:throneRope?{reserve:throneRope.reserve,pin:!!throneRope.pin,len:throneRope.p.length}:null,
    climax:CL.on,done:CL.done,ribNeed:RIBNEED,throneNeed:+THRONE_NEED.toFixed(1),clean:+(gClean/Math.max(1,gTotal)).toFixed(3),low:LOW,target:curTarget()};},
  tassel(){if(!throneRope)return null;const q=throneRope.p[0];return {x:q.x,y:q.y};},
  ropeEnds(){return ropes.map(r=>({x:r.p[0].x,y:r.p[0].y,throne:r.throne,att:r.att}));},
  wrapsPos(){return wraps.map(w=>({x:w.x,y:w.y,w:w.w,h:w.h,need:w.need,st:w.st}));},
  grow(m){addMass(m);},
  tidy(){for(const c of confetti){if(c.st===0||c.st===2){c.st=9;addMass(1);addRing(c.col);}}confetti=confetti.filter(c=>c.st!==9);
    for(const w of wraps.slice()){addMass(w.mass);addRing(w.col);stampRect(w.x,w.y,Math.cos(w.a),Math.sin(w.a),w.w/2,w.h/2,3);}wraps=[];
    for(const r of ropes.slice()){if(r.throne||r.tail)continue;addMass(r.p.length*r.mp);addRing(r.col);ropes.splice(ropes.indexOf(r),1);}
    for(let y=FA.y0;y<H;y+=RL.R0*1.6)for(let x=0;x<W;x+=RL.L0*0.8)stampRect(x,y,1,0,RL.L0*0.5,RL.R0*0.9,3);
    if(RL.mass<THRONE_NEED)RL.mass=THRONE_NEED+1;},
  finish(){this.tidy();if(throneRope){throneRope.reserve=0;}},
  climax(){startClimax();},
  openGift(){openGift();},
  idle(s){idle=s;}
};

init();
})();
