<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return ((s>>>0)%100000)/100000;};}

/* ================= AUDIO (Web Audio synthesis) ================= */
const AU={ctx:null,ok:false};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state!=='running'){try{AU.ctx.resume().catch(()=>{});}catch(e){}}return;}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const a=new AC();AU.ctx=a;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(a.destination);
    const m=a.createGain();m.gain.value=0.85;m.connect(comp);AU.master=m;
    const dl=a.createDelay(1);dl.delayTime.value=0.11;const fb=a.createGain();fb.gain.value=0.38;
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;
    dl.connect(lp);lp.connect(fb);fb.connect(dl);const wet=a.createGain();wet.gain.value=0.4;lp.connect(wet);wet.connect(m);AU.verb=dl;
    const len=a.sampleRate|0;const b=a.createBuffer(1,len,a.sampleRate);const d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
    const ns=a.createBufferSource();ns.buffer=b;ns.loop=true;
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=260;bp.Q.value=2.5;
    const sg=a.createGain();sg.gain.value=0;ns.connect(bp);bp.connect(sg);sg.connect(m);ns.start();
    const o=a.createOscillator();o.type='triangle';o.frequency.value=90;const og=a.createGain();og.gain.value=0;o.connect(og);og.connect(m);o.start();
    const lfo=a.createOscillator();lfo.frequency.value=6;const lg=a.createGain();lg.gain.value=10;lfo.connect(lg);lg.connect(o.frequency);lfo.start();
    const am=a.createGain();am.gain.value=0;lfo.connect(am);am.connect(sg.gain);
    AU.stir={bp,sg,o,og,lfo,am};
    const t=a.createOscillator();t.type='sine';t.frequency.value=700;const tg=a.createGain();tg.gain.value=0;t.connect(tg);tg.connect(m);t.start();
    const t2=a.createOscillator();t2.type='sine';t2.frequency.value=1403;const tg2=a.createGain();tg2.gain.value=0;t2.connect(tg2);tg2.connect(m);t2.start();
    AU.ten={o:t,g:tg,o2:t2,g2:tg2};
    AU.ok=true;
    if(a.state!=='running'){a.resume().catch(()=>{});}
  }catch(e){AU.ctx=null;AU.ok=false;}
}
function envG(g,t0,at,peak,dec){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+at);g.gain.exponentialRampToValueAtTime(0.0001,t0+at+dec);}
function tone(type,f0,f1,dur,peak,delay,verb){
  if(!AU.ok)return;try{const a=AU.ctx,t0=a.currentTime+(delay||0);
  const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=a.createGain();envG(g,t0,0.004,peak,dur);o.connect(g);g.connect(AU.master);
  if(verb){const s=a.createGain();s.gain.value=verb;g.connect(s);s.connect(AU.verb);}
  o.start(t0);o.stop(t0+dur+0.08);}catch(e){}
}
function noiz(freq,q,dur,peak,delay,type){
  if(!AU.ok)return;try{const a=AU.ctx,t0=a.currentTime+(delay||0);
  const s=a.createBufferSource();s.buffer=AU.noise;const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=a.createGain();envG(g,t0,0.003,peak,dur);s.connect(f);f.connect(g);g.connect(AU.master);
  s.start(t0,Math.random()*0.5);s.stop(t0+dur+0.08);}catch(e){}
}
const SFX={
  creak(v){v=v==null?1:v;noiz(1150,9,0.09,0.12*v);noiz(1650,12,0.07,0.08*v,0.045);tone('triangle',190,150,0.07,0.05*v);},
  topun(v){v=clamp(v,0.35,1);tone('sine',330,80,0.3,0.42*v);tone('sine',170,55,0.4,0.22*v,0.02);noiz(420,1,0.22,0.12*v,0,'lowpass');tone('sine',950,420,0.07,0.06*v,0.07);},
  putsun(){tone('sine',2300,650,0.05,0.2);noiz(3800,3,0.025,0.09);tone('sine',520,300,0.08,0.08,0.03);},
  kachin(th){const base=lerp(2700,1250,th),dec=lerp(0.35,1.35,th);
    const P=[1,2.32,4.25,6.8],A=[0.26,0.12,0.07,0.035];
    for(let i=0;i<4;i++)tone('sine',base*P[i],base*P[i]*0.998,dec*(1-i*0.17),A[i],0,0.7);
    tone('sine',base*0.5,base*0.5,dec*0.8,0.05+0.05*th,0,0.4);
    noiz(7000,0.8,0.02,0.12,0,'highpass');
    tone('sine',base*1.5,base*1.5,0.3,0.05,0.09,0.8);tone('sine',base*2,base*2,0.25,0.03,0.17,0.8);},
  kon(th,v){v=clamp(v==null?1:v,0.5,1.2);const f=lerp(640,390,th);tone('sine',f,f*0.82,0.13,0.36*v);tone('triangle',f*2.05,f*1.9,0.06,0.07*v);
    noiz(950,3,0.05,0.2*v);tone('sine',lerp(3100,2100,th),lerp(3100,2100,th),0.3+th*0.3,0.05,0.01,0.5);},
  glass(th){const f=lerp(3000,2000,th||0.4)*(0.95+Math.random()*0.1);tone('sine',f,f,0.45,0.07,0,0.6);tone('sine',f*2.7,f*2.7,0.2,0.025,0,0.5);},
  tap(){tone('sine',250,110,0.18,0.16);noiz(380,1,0.1,0.05,0,'lowpass');},
  paper(){noiz(1600,2,0.05,0.09);tone('triangle',430,380,0.06,0.07);},
  twinkle(v){const f=2800+Math.random()*1200;tone('sine',f,f,0.25,0.025*(v||1),0,0.7);},
  drop(){tone('sine',620,190,0.09,0.09);},
  thud(){tone('triangle',230,150,0.09,0.08);noiz(700,2,0.05,0.06);},
  meow(){tone('triangle',620,880,0.12,0.06);tone('triangle',880,560,0.18,0.05,0.12);},
  swing(){tone('sine',520,560,0.15,0.03);}
};
function audioUpdate(stir,ten,tenOn,tenRate){
  if(!AU.ok)return;try{const t=AU.ctx.currentTime,s=clamp(stir,0,1);
  AU.stir.sg.gain.setTargetAtTime(s*0.2,t,0.06);AU.stir.am.gain.setTargetAtTime(s*0.08,t,0.06);
  AU.stir.og.gain.setTargetAtTime(s*0.045,t,0.06);AU.stir.bp.frequency.setTargetAtTime(180+s*520,t,0.06);
  AU.stir.o.frequency.setTargetAtTime(70+s*70,t,0.08);AU.stir.lfo.frequency.setTargetAtTime(3+s*11,t,0.1);
  const te=clamp(ten,0,1),gg=tenOn?(0.012+te*0.03)*clamp(0.35+tenRate,0,1.3):0;
  AU.ten.g.gain.setTargetAtTime(gg,t,0.04);AU.ten.g2.gain.setTargetAtTime(gg*0.35,t,0.04);
  AU.ten.o.frequency.setTargetAtTime(480+te*1700,t,0.03);AU.ten.o2.frequency.setTargetAtTime((480+te*1700)*2.01,t,0.03);}catch(e){}
}

/* ================= STRAWBERRY GEOMETRY (local units: R=1) ================= */
const BT=-0.95,BH=2.1,BB=BT+BH;
function bw(t){if(t<=0)return 0.557;if(t>=1)return 0;return 1.12*Math.pow(Math.sin(Math.PI*(0.12+0.88*t)),0.7)*Math.pow(1-t,0.33);}
const W0=bw(0);
const yOf=t=>BT+t*BH;
function topY(x){const k=clamp(x/W0,-1,1);return BT-0.17*(1-k*k);}
const berryPath=(()=>{const p=new Path2D(),N=30;p.moveTo(W0,BT);
  for(let i=1;i<=N;i++){const t=i/N;p.lineTo(bw(t),yOf(t));}
  for(let i=N-1;i>=0;i--){const t=i/N;p.lineTo(-bw(t),yOf(t));}
  p.quadraticCurveTo(0,BT-0.34,W0,BT);p.closePath();return p;})();
const MESH=(()=>{const r=rng(7),LAT=[0,0.15,0.31,0.48,0.64,0.8,1],LON=10,v=[];
  for(let i=0;i<LAT.length;i++){const row=[];for(let j=0;j<LON;j++){const jt=(i>0&&i<LAT.length-1)?(r()-0.5)*0.07:0;
    row.push({t:LAT[i]+jt,l:j*TAU/LON+(r()-0.5)*0.35+i*0.31});}v.push(row);}
  const PAL=['#b3122e','#d4173a','#e8323f','#c40f2f','#f04a3a','#9e0d28','#ff5a44','#cc1f3a','#e02a2a','#ff6f4f'];const q=[];
  for(let i=0;i<LAT.length-1;i++)for(let j=0;j<LON;j++)q.push({a:v[i][j],b:v[i][(j+1)%LON],c:v[i+1][(j+1)%LON],d:v[i+1][j],col:PAL[Math.floor(r()*PAL.length)]});
  return {q};})();
const SEEDS=(()=>{const a=[],rows=[[0.17,7],[0.29,8],[0.41,9],[0.53,8],[0.65,7],[0.76,6],[0.87,4]];
  rows.forEach((rw,i)=>{for(let k=0;k<rw[1];k++)a.push({t:rw[0],l:(k+(i%2)*0.5)*TAU/rw[1]});});return a;})();
function pv(vx,ph){const a=vx.l+ph,s=Math.sin(a),c=Math.cos(a),w=bw(vx.t)*1.04;
  const x=c<0?(s<0?-w:w):s*w;return [x,vx.t<=0.001?topY(x)-0.03:(vx.t>=0.999?BB+0.03:yOf(vx.t)),c];}
function drawStar(c,x,y,r,a,rot){c.save();c.translate(x,y);c.rotate(rot||0);c.globalAlpha*=a;c.beginPath();
  for(let i=0;i<8;i++){const rr=i%2?r*0.22:r,an=i*Math.PI/4;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}c.closePath();c.fill();c.restore();}

function drawStick(c,L,bend){c.lineCap='round';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(0,BT-L*0.55,bend,BT-L);
  c.strokeStyle='#3e2410';c.lineWidth=0.16;c.stroke();c.strokeStyle='#ecc98d';c.lineWidth=0.1;c.stroke();
  c.strokeStyle='rgba(255,246,215,0.7)';c.lineWidth=0.03;c.beginPath();c.moveTo(-0.025,0);c.quadraticCurveTo(-0.025,BT-L*0.55,bend-0.025,BT-L);c.stroke();}

function drawBerryBody(c,ph){
  const g=c.createRadialGradient(-0.25,-0.2,0.1,0,0.1,1.25);g.addColorStop(0,'#ff4a55');g.addColorStop(0.6,'#d0102e');g.addColorStop(1,'#7a0820');
  c.fillStyle=g;c.fill(berryPath);
  c.save();c.clip(berryPath);c.lineJoin='round';c.strokeStyle='rgba(45,8,16,0.8)';c.lineWidth=0.035;
  for(const q of MESH.q){const A=pv(q.a,ph),B=pv(q.b,ph),C=pv(q.c,ph),D=pv(q.d,ph);const f=(A[2]+B[2]+C[2]+D[2])*0.25;if(f<-0.2)continue;
    c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.lineTo(C[0],C[1]);c.lineTo(D[0],D[1]);c.closePath();
    c.globalAlpha=0.55+0.42*clamp(f,0,1);c.fillStyle=q.col;c.fill();c.globalAlpha=1;c.stroke();}
  for(const s of SEEDS){const a=s.l+ph,co=Math.cos(a);if(co<0.08)continue;const w=bw(s.t),x=Math.sin(a)*w*0.88,y=yOf(s.t),sz=0.055*(1-s.t*0.35);
    c.fillStyle='rgba(90,0,20,0.45)';c.beginPath();c.ellipse(x,y+0.012,sz*1.25*co+0.012,sz*1.5,0,0,TAU);c.fill();
    c.fillStyle='#ffd65c';c.beginPath();c.ellipse(x,y,sz*0.7*co+0.01,sz,0,0,TAU);c.fill();
    c.strokeStyle='rgba(80,35,0,0.75)';c.lineWidth=0.016;c.stroke();}
  const g2=c.createRadialGradient(-0.05,0,0.3,0,0.1,1.2);g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(1,'rgba(50,0,12,0.55)');
  c.fillStyle=g2;c.fillRect(-1.6,-1.6,3.2,3.2);
  c.globalCompositeOperation='screen';const g3=c.createRadialGradient(-0.3,-0.4,0,-0.3,-0.4,0.75);
  g3.addColorStop(0,'rgba(255,205,195,0.55)');g3.addColorStop(1,'rgba(255,120,120,0)');c.fillStyle=g3;c.fillRect(-1.6,-1.6,3.2,3.2);
  c.globalCompositeOperation='source-over';c.restore();
  c.strokeStyle='#2a0a12';c.lineWidth=0.06;c.stroke(berryPath);
}
function drawCalyx(c,ph){const N=6,ls=[];for(let k=0;k<N;k++){const a=k*TAU/N+ph*0.9+0.3;ls.push({a,co:Math.cos(a)});}
  ls.sort((p,q)=>p.co-q.co);c.lineJoin='round';
  for(const L of ls){const s=Math.sin(L.a),co=L.co,bx=s*0.1,by=BT-0.2,tx=s*0.74,ty=BT+0.04+0.15*co;
    let nx=-(ty-by),ny=tx-bx;const nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;const wd=0.12*(0.55+0.45*Math.abs(co));
    const mx=(bx+tx)/2,my=(by+ty)/2;c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(mx+nx*wd,my+ny*wd,tx,ty);c.quadraticCurveTo(mx-nx*wd,my-ny*wd,bx,by);
    c.fillStyle=co>0?(Math.abs(s)>0.55?'#4cbc5c':'#33a84e'):'#1f6e36';c.fill();c.strokeStyle='#0f2a14';c.lineWidth=0.035;c.stroke();
    if(co>-0.3){c.beginPath();c.moveTo(bx,by);c.lineTo(lerp(bx,tx,0.8),lerp(by,ty,0.8));c.strokeStyle='rgba(190,255,170,0.5)';c.lineWidth=0.02;c.stroke();}}
  c.fillStyle='#2f8f3f';c.beginPath();c.ellipse(0,BT-0.21,0.1,0.065,0,0,TAU);c.fill();c.strokeStyle='#0f2a14';c.lineWidth=0.03;c.stroke();
}
/* ---------- candy coat ---------- */
const coatC=cp=>0.05+cp.thick*0.2;
function coatPath(cp,time,ws){
  const c0=coatC(cp),b=cp.bias,cov=clamp(cp.cover,0,1),full=cov>0.93,t0=full?0:1-cov,N=16,wa=cp.wob*ws*c0*0.5,sp=cp.seed*7;
  const R=[],L=[];
  for(let i=0;i<=N;i++){const t=t0+(1-t0)*i/N,tip=smooth(0.72,1,t),w=bw(t),y=yOf(t)+c0*tip*0.8,tp=full?1:0.2+0.8*smooth(t0,t0+0.16,t);
    R.push([w+c0*tp*(1+b*0.45)*(1-tip*0.55)+wa*tp*Math.sin(t*10-time*4.5+sp),y]);
    L.push([-(w+c0*tp*(1-b*0.45)*(1-tip*0.55))+wa*tp*Math.sin(t*9-time*4.1+sp+2),y]);}
  const p=new Path2D();p.moveTo(R[0][0],R[0][1]);for(let i=1;i<=N;i++)p.lineTo(R[i][0],R[i][1]);
  const dx=b*c0*0.5+wa*0.8*Math.sin(time*3.3+sp),ty=BB+c0*0.8+cp.drip+c0*0.75,dr=(cp.drip+c0)*0.6,rr=c0*0.65+cp.drip*0.18;
  const e=R[N],f=L[N];
  p.bezierCurveTo(e[0],e[1]+dr,dx+rr,ty,dx,ty);p.bezierCurveTo(dx-rr,ty,f[0],f[1]+dr,f[0],f[1]);
  for(let i=N-1;i>=0;i--)p.lineTo(L[i][0],L[i][1]);
  if(full)p.quadraticCurveTo(0,BT-0.34-c0*2.2,R[0][0],R[0][1]);else p.quadraticCurveTo(0,yOf(t0)+0.08+wa*Math.sin(time*5+sp),R[0][0],R[0][1]);
  p.closePath();return p;
}
function sidePath(cp,hs,t0,t1,off){const p=new Path2D(),c0=coatC(cp);
  for(let i=0;i<=10;i++){const t=lerp(t0,t1,i/10),x=hs*(bw(t)+c0*off*(1+hs*cp.bias*0.3)),y=yOf(t);i?p.lineTo(x,y):p.moveTo(x,y);}return p;}
function styleWet(c,p,cp,time,hs,spin){const th=cp.thick,tn=cp.tint,c0=coatC(cp),a=0.3+0.28*th;
  const g=c.createLinearGradient(0,-1.2,0,1.7);
  g.addColorStop(0,`rgba(255,${200-tn*30|0},${90-tn*40|0},${a*0.75})`);g.addColorStop(1,`rgba(255,${172-tn*40|0},${52-tn*30|0},${a})`);
  c.fillStyle=g;c.fill(p);
  c.save();c.clip(p);c.globalCompositeOperation='lighter';c.fillStyle=`rgba(255,40,40,${0.07+0.08*th})`;c.fill(berryPath);
  c.globalCompositeOperation='screen';const t0=cp.cover>0.93?0.06:1-cp.cover+0.04;
  const gp=sidePath(cp,hs,t0,0.88,0.45);c.lineCap='round';
  c.strokeStyle='rgba(255,245,215,0.13)';c.lineWidth=0.22+th*0.15;c.stroke(gp);
  c.setLineDash([0.2,0.15]);c.lineDashOffset=-time*(0.35+Math.min(3,Math.abs(spin))*0.25);
  c.strokeStyle='rgba(255,250,225,0.5)';c.lineWidth=0.07+th*0.07;c.stroke(gp);
  const gp2=sidePath(cp,-hs,Math.max(t0,0.35),0.9,0.3);c.strokeStyle='rgba(255,240,200,0.3)';c.lineWidth=0.04;c.stroke(gp2);
  c.setLineDash([]);c.restore();
  c.strokeStyle='rgba(255,195,80,0.14)';c.lineWidth=0.14;c.stroke(p);
  c.strokeStyle='rgba(255,220,140,0.6)';c.lineWidth=0.04;c.stroke(p);
}
function styleHard(c,p,cp,hs){const th=cp.thick,c0=coatC(cp),a=0.15+0.24*th;
  const g=c.createLinearGradient(-1,-1.2,1,1.7);g.addColorStop(0,`rgba(255,238,195,${a*0.6})`);g.addColorStop(0.5,`rgba(255,212,145,${a*0.45})`);g.addColorStop(1,`rgba(255,190,110,${a})`);
  c.fillStyle=g;c.fill(p);
  c.save();c.clip(p);c.globalCompositeOperation='lighter';c.fillStyle=`rgba(255,30,60,${0.13+0.2*th})`;c.fill(berryPath);
  c.strokeStyle=`rgba(255,235,210,${0.22+0.35*th})`;c.lineWidth=0.025+0.05*th;c.stroke(berryPath);
  c.globalCompositeOperation='source-over';c.lineCap='round';
  const t0=cp.cover>0.93?0.04:1-cp.cover+0.06;
  c.strokeStyle='rgba(255,255,255,0.92)';c.lineWidth=0.045+0.06*th;c.stroke(sidePath(cp,hs,t0,Math.max(t0+0.1,0.75),0.5));
  c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=0.03;c.stroke(sidePath(cp,-hs,Math.max(t0,0.5),0.88,0.35));
  const r=rng(((cp.seed*9973)|0)+3),n=3+Math.round(th*4);c.fillStyle='#fff';

/* ================= GAME STATE ================= */
const newCoat=()=>({cover:0,thick:0,bias:0,drip:0,wob:0,hard:0,tint:0,seed:0});
const item={x:0,y:0,vx:0,vy:0,ang:0,angV:0,bend:0,phase:0.4,spinV:0,spinTot:0,state:'free',held:false,gox:0,goy:0,flip:0,
  overRim:false,coat:null,arrT:1,arrFrom:null,sinceRip:0,dipT:0,hardening:false,hardT:0,kachin:false,glintI:0,dripV:0,shine:0,shineT:0,lastAx:0};
let thread=null;const frags=[],ripples=[],parts=[],bubbles=[],dents=[];
const pot={slosh:0,sloshV:0,swirl:0,swirlPh:0,idleRip:1.5,bub:0.8};
const cup={wob:0,wobV:0,arr:1,breathe:0};
let placed=null;const shelf=[];let made=0;let samples=[];
const cat={blink:0,wig:0,nextBlink:3};
const ptr={id:null,x:0,y:0,dxAcc:0,dyAcc:0};
let lastInput=0,interacted=false,hint=null,hintShown=false,T=0,twk=1;
const SAMPLE_COATS=[{cover:1,thick:0.12,bias:-0.4,drip:0.04,wob:0,hard:1,tint:0.05,seed:0.21},{cover:1,thick:0.5,bias:0.5,drip:0.1,wob:0,hard:1,tint:0.3,seed:0.47},{cover:1,thick:0.88,bias:0,drip:0.18,wob:0,hard:1,tint:0.6,seed:0.83}];
const SAMPLE_PH=[0.6,2.3,4.2];

function wpt(lx,ly,a){const R=L.R,c=Math.cos(a),s=Math.sin(a);return {x:item.x+(lx*c-ly*s)*R,y:item.y+(lx*s+ly*c)*R};}
const itemAng=()=>item.ang+item.flip*Math.PI;
function tipWorld(){const cp=item.coat,c0=cp?coatC(cp):0;return wpt(cp?cp.bias*c0*0.5:0,BB+(cp?c0*1.55+cp.drip:0),itemAng());}
function stickEndWorld(){return wpt(item.bend,BT-L.stick,itemAng());}
const isHard=()=>!!(item.coat&&item.coat.hard>0);
const isDone=()=>!!(item.coat&&item.coat.hard>=1);
function ripple(x,y,str){ripples.push({x,y,r:3*u,str:clamp(str,0.1,1),life:1});if(ripples.length>14)ripples.shift();}
function addPart(p){if(parts.length>=80)parts.shift();parts.push(p);}
function glint(x,y,size,col,life){addPart({type:'glint',x,y,vx:0,vy:0,life:life||0.6,max:life||0.6,size,col:col||'#fff',rot:Math.random()});}

function restTarget(){const P=L.pot;
  if(item.state==='dip')return {x:item.x,y:item.y};
  if(item.state==='lift')return {x:clamp(item.x,P.x-P.lrx*0.5,P.x+P.lrx*0.5),y:P.y+0.3*L.Hb-BB*L.R};
  return {x:L.rack.x,y:L.rack.y};}

function enterDip(){const P=L.pot;item.state='dip';if(!item.coat){item.coat=newCoat();item.coat.seed=((item.spinTot*0.618+made*0.37)%1+1)%1;}
  item.dipT=0;const sp=Math.hypot(item.vx,item.vy)/u;SFX.topun(0.45+sp/900);
  ripple(item.x,P.y,0.9);ripple(item.x,P.y,0.5);pot.sloshV+=clamp(item.vy/u*0.004,0.4,2.5)*(item.x<P.x?-1:1);
  for(let i=0;i<4;i++)bubbles.push({x:item.x+(Math.random()-0.5)*L.R*1.4,y:P.y+(Math.random()-0.2)*P.lry*0.6,r:(1.5+Math.random()*2.5)*u,life:0.6+Math.random()*0.8});
  while(bubbles.length>14)bubbles.shift();}
function startLift(){const P=L.pot,tp=tipWorld(),n=14,pts=[];item.state='lift';
  for(let i=0;i<n;i++){const y=lerp(P.y,tp.y,i/(n-1));pts.push({x:tp.x,y,px:tp.x,py:y});}
  const vari=0.86+0.28*((Math.abs(item.spinTot)*0.37+item.coat.thick*1.7)%1);
  thread={ax:tp.x,ay:P.y,pts,n,len:Math.abs(tp.y-P.y),brk:L.R*(1.1+1.15*item.coat.thick)*vari,rate:0,w:L.R*(0.11+0.13*item.coat.thick)};}
function breakThread(){const th=thread,mid=Math.max(2,Math.floor(th.n*0.3));
  frags.push({pts:th.pts.slice(mid).map(p=>({x:p.x,y:p.y})),toTip:true,t:0,w:th.w*0.5});
  frags.push({pts:th.pts.slice(0,mid+1).map(p=>({x:p.x,y:p.y})),toTip:false,t:0,w:th.w*0.6,ax:th.ax,ay:th.ay});
  thread=null;item.state='free';item.overRim=false;SFX.putsun();
  item.hardening=true;item.hardT=0;item.kachin=false;item.glintI=0;item.dripV=-1.8;
  item.angV+=(Math.random()<0.5?-1:1)*0.6;}
function updThread(dt){if(!thread)return;const P=L.pot,tp=tipWorld(),th=thread;
  th.ax=clamp(th.ax+(tp.x-th.ax)*Math.min(1,dt*1.1),P.x-P.lrx*0.8,P.x+P.lrx*0.8);th.ay=P.y;
  const len=Math.hypot(tp.x-th.ax,tp.y-th.ay);th.rate=lerp(th.rate,Math.abs(len-th.len)/Math.max(dt,1e-3)/(L.R*3),0.2);th.len=len;
  const n=th.n,pts=th.pts;pts[0].x=th.ax;pts[0].y=th.ay;pts[n-1].x=tp.x;pts[n-1].y=tp.y;
  const g=1300*u*dt*dt,st=clamp(len/th.brk,0,1);
  for(let i=1;i<n-1;i++){const p=pts[i],vx=(p.x-p.px)*0.9,vy=(p.y-p.py)*0.9;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g;}
  const seg=len*(1.015+0.09*(1-st)*item.coat.thick)/(n-1)+0.3*u;
  for(let it=0;it<8;it++){for(let i=0;i<n-1;i++){const a=pts[i],b=pts[i+1],ex=b.x-a.x,ey=b.y-a.y,d=Math.hypot(ex,ey)||1e-4,df=(d-seg)/d*0.5,ia=i>0,ib=i+1<n-1;
      if(ia&&ib){a.x+=ex*df;a.y+=ey*df;b.x-=ex*df;b.y-=ey*df;}else if(ia){a.x+=ex*df*2;a.y+=ey*df*2;}else if(ib){b.x-=ex*df*2;b.y-=ey*df*2;}}
    for(let i=1;i<n-1;i++){const p=pts[i];if(Math.abs(p.x-P.x)<P.lrx&&p.y>P.y)p.y=P.y;}}
  item.coat.drip=lerp(item.coat.drip,0.04+item.coat.thick*0.18+st*0.18,Math.min(1,dt*5));
  if(len>th.brk)breakThread();}

function update(dt){
  const P=L.pot,R=L.R;
  // ---------- item ----------
  if(item.state==='arrive'){item.arrT=Math.min(1,item.arrT+dt/0.9);const k=smooth(0,1,item.arrT),f=item.arrFrom;
    item.x=lerp(f.x,L.rack.x,k);item.y=lerp(f.y,L.rack.y,k)-Math.sin(k*Math.PI)*80*u;item.ang=Math.sin(k*Math.PI)*0.45;
    if(item.arrT>=1){item.state='free';item.vx=item.vy=0;item.angV=-1.2;SFX.thud();}}
  else if(item.state!=='gone'){
    const ox=item.x,oy=item.y,hard=isHard();let dPh=0;
    if(item.held&&item.state==='dip'){dPh=ptr.dxAcc/(0.8*R)+Math.abs(ptr.dyAcc)/(3*R)*(item.spinV>=0?1:-1);item.phase+=dPh;item.spinTot+=dPh;
      item.spinV=lerp(item.spinV,dPh/dt,0.25);}
    else{item.spinV*=Math.exp(-dt*(item.state==='dip'?3:1.4));item.phase+=item.spinV*dt;item.spinTot+=item.spinV*dt;}
    ptr.dxAcc=0;ptr.dyAcc=0;
    const steps=Math.ceil(dt/(1/120)),h=dt/steps;
    for(let sI=0;sI<steps;sI++){
      let tx,ty;if(item.held){tx=ptr.x+item.gox;ty=ptr.y+item.goy-6*u;}else{const r=restTarget();tx=r.x;ty=r.y;}
      if(item.state==='free'&&!hard){
        if(Math.abs(tx-P.x)<P.rx*1.35&&ty+BB*R>P.rimY-1.8*R&&ty<P.bot+R*0.6)tx=lerp(tx,clamp(tx,P.x-P.lrx*0.58,P.x+P.lrx*0.58),0.75);
        if(Math.abs(tx-P.x)<P.lrx*0.85&&!item.overRim&&ty+BB*R>P.y-3*u&&ty<P.bot+R*1.2)ty=P.y-BB*R-5*u;}
      if(item.state==='dip'){tx=clamp(tx,P.x-P.lrx*0.58,P.x+P.lrx*0.58);ty=Math.min(ty,P.y+0.9*L.Hb-BB*R);}
      if(item.state==='lift'&&thread){const st=clamp(thread.len/thread.brk,0,1);tx=lerp(tx,thread.ax,0.1*st);ty=lerp(ty,P.y-BB*R,0.12*st*st);}
      const vis=item.state==='dip',k=item.held?(vis?230:520):(vis?40:55),c=2*Math.sqrt(k)*(vis?1.3:(item.held?0.8:0.62));
      const ax=(tx-item.x)*k-item.vx*c,ay=(ty-item.y)*k-item.vy*c;item.vx+=ax*h;item.vy+=ay*h;item.x+=item.vx*h;item.y+=item.vy*h;
      const idle=(!item.held&&item.state==='free')?Math.sin(T*1.4)*0.035:0,inv=1-2*item.flip;
      item.angV+=((ax/u)*0.00045*inv-(item.ang-idle)*(vis?60:62)-item.angV*(vis?14:4.2))*h;item.ang=clamp(item.ang+item.angV*h,-0.75,0.75);}
    item.bend=lerp(item.bend,clamp(-item.vx/u*0.0006,-0.3,0.3)*(1-2*item.flip),Math.min(1,dt*10));
    // flip toward upright near the cup once hardened
    let fT=0;if(isDone()&&item.held){const d=Math.hypot(item.x-L.cup.x,item.y-(L.cup.y-L.cup.h));fT=clamp(1-(d-1.3*R)/(2.6*R),0,1);}
    item.flip=lerp(item.flip,fT,Math.min(1,dt*7));
    // transitions
    const bot=item.y+BB*R*Math.cos(item.ang),inX=Math.abs(item.x-P.x)<P.lrx*0.8;
    if(item.state==='free'&&!hard){if(inX&&bot<P.y-1*u)item.overRim=true;else if(!inX||item.y>P.bot+R)item.overRim=false;
      if(item.overRim&&inX&&bot>P.y+1*u)enterDip();}
    else if(item.state==='dip'){if(bot<P.y-2*u){if(item.coat.cover>0.02)startLift();else item.state='free';}}
    else if(item.state==='lift'){if(bot>P.y+2*u&&inX){thread=null;item.state='dip';ripple(item.x,P.y,0.3);}}
    // coating in liquid
    if(item.state==='dip'){const cp=item.coat,depth=clamp((bot-P.y)/L.Hb,0,1);item.dipT+=dt;
      const crawl=Math.min(0.14,item.dipT*0.05+Math.abs(item.spinV)*0.01),tg=Math.min(1,depth+0.06+crawl);
      if(tg>cp.cover)cp.cover=lerp(cp.cover,tg,Math.min(1,dt*4));
      const dpos=Math.hypot(item.x-ox,item.y-oy)/R;
      cp.thick=Math.max(0.06,clamp(cp.thick+(Math.abs(dPh)*0.018+dpos*0.01+dt*0.02*depth)*(1-cp.thick*0.75),0,1));
      cp.bias=clamp(cp.bias+dPh*0.025,-1,1);cp.tint=clamp(cp.tint+dt*0.025*depth,0,1);
      cp.wob=lerp(cp.wob,clamp(0.45+Math.abs(item.spinV)*0.12,0,1),Math.min(1,dt*3));cp.drip=lerp(cp.drip,0,Math.min(1,dt*2));
      item.sinceRip+=dt;const spd=Math.hypot(item.vx,item.vy)/u+Math.abs(item.spinV)*40;
      if(item.sinceRip>0.14&&spd>30){ripple(item.x+(Math.random()-0.5)*R,P.y+(Math.random()-0.5)*P.lry*0.5,clamp(spd/500,0.15,0.6));item.sinceRip=0;}
      pot.swirl+=(item.spinV*0.4-pot.swirl)*Math.min(1,dt*1.5);pot.sloshV+=item.vx/u*0.00006;}
    updThread(dt);
    if(item.coat&&item.state==='free'&&!item.hardening&&!hard){item.coat.wob=lerp(item.coat.wob,0.4,dt);}
    // hardening
    if(item.hardening){const cp=item.coat;item.hardT+=dt;const D=0.08;
      if(item.hardT<D+0.06){cp.drip+=item.dripV*dt;item.dripV+=(-(cp.drip-(0.05+cp.thick*0.16))*160-item.dripV*7)*dt;cp.drip=Math.max(0,cp.drip);}
      if(item.hardT>=D){if(!item.kachin){item.kachin=true;SFX.kachin(cp.thick);}
        cp.hard=clamp((item.hardT-D)/0.42,0.001,1);
        const marks=[0.12,0.35,0.6,0.85];while(item.glintI<marks.length&&cp.hard>=marks[item.glintI]){const t=1-marks[item.glintI],sd=item.glintI%2?1:-1;
          const pt=wpt(sd*(bw(t)*0.8+coatC(cp)*0.5),yOf(clamp(t,0.05,0.98)),itemAng());glint(pt.x,pt.y,(6+cp.thick*6)*u,'#fff',0.7);item.glintI++;}
        if(cp.hard>=1){item.hardening=false;cp.wob=0;glint(tipWorld().x,tipWorld().y,8*u,'#fff4c0',0.6);}}}
    // cup insertion while dragging
    if(isDone()&&item.held&&item.flip>0.55&&!placed&&cup.arr>=1){const se=stickEndWorld(),my=L.cup.y-L.cup.h;
      if(Math.abs(se.x-L.cup.x)<L.cup.tw*0.7&&se.y>my-4*u&&se.y<L.cup.y+8*u&&item.vy>-200*u)insertCandy();}
    // attention shimmer (only after a quiet moment)
    const quiet=T-lastInput;item.shineT+=dt;
    if(!item.held&&quiet>6&&item.state==='free'&&(!item.coat||isDone())){if(item.shineT>3.6){item.shineT=0;}item.shine=item.shineT<0.7?item.shineT/0.7:0;
      if(isDone()&&item.shineT<dt*1.5){const p=wpt(-0.4,-0.2,itemAng());glint(p.x,p.y,7*u,'#fff',0.5);}}
    else{item.shine=0;if(item.shineT>3.6)item.shineT=0;}
  }
  // ---------- thread fragments recoil ----------
  for(let i=frags.length-1;i>=0;i--){const f=frags[i];f.t+=dt;const tp=f.toTip?tipWorld():{x:f.ax,y:f.ay},k=1-Math.exp(-dt*16);
    for(const p of f.pts){p.x+=(tp.x-p.x)*k;p.y+=(tp.y-p.y)*k+(f.toTip?0:30*u*dt);}
    if(f.t>0.24){frags.splice(i,1);if(!f.toTip){ripple(f.ax,P.y,0.45);SFX.drop();bubbles.push({x:f.ax,y:P.y,r:2.5*u,life:0.5});}}}
  // ---------- placed candy (in the paper cup) ----------
  if(placed)updPlaced(dt);
  if(cup.arr<1)cup.arr=Math.min(1,cup.arr+dt/0.6);
  cup.wobV+=(-cup.wob*120-cup.wobV*6)*dt;cup.wob+=cup.wobV*dt;
  cup.breathe=lerp(cup.breathe,(isDone()&&item.held&&!placed)?1:0,Math.min(1,dt*4));
  // ---------- pot ----------
  pot.sloshV+=(-pot.slosh*40-pot.sloshV*3)*dt;pot.slosh=clamp(pot.slosh+pot.sloshV*dt,-1.5,1.5);
  pot.swirlPh+=pot.swirl*dt*0.6+dt*0.12;pot.swirl*=Math.exp(-dt*0.7);
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=(55+40*r.str)*u*dt*(0.4+r.life);r.life-=dt/1.7;if(r.life<=0)ripples.splice(i,1);}
  for(let i=dents.length-1;i>=0;i--){dents[i].t+=dt;if(dents[i].t>0.6)dents.splice(i,1);}
  pot.idleRip-=dt;if(pot.idleRip<=0){pot.idleRip=2.2+Math.random()*1.8;ripple(P.x+(Math.random()-0.5)*P.lrx*1.1,P.y+(Math.random()-0.5)*P.lry*0.9,0.12);}
  pot.bub-=dt;if(pot.bub<=0){pot.bub=1+Math.random()*1.5;if(bubbles.length<14)bubbles.push({x:P.x+(Math.random()-0.5)*P.lrx*1.3,y:P.y+(Math.random()-0.5)*P.lry*1.2,r:(1.2+Math.random()*2)*u,life:0.8+Math.random()});}
  for(let i=bubbles.length-1;i>=0;i--){bubbles[i].life-=dt;if(bubbles[i].life<=0){const b=bubbles[i];bubbles.splice(i,1);ripple(b.x,b.y,0.12);}}
  // ---------- particles ----------
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.type==='drop'){p.vy+=900*u*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.y>P.y&&Math.abs(p.x-P.x)<P.lrx){ripple(p.x,P.y,0.2);p.life=0;}}
    if(p.life<=0)parts.splice(i,1);}
  // ---------- shelf ----------
  for(let i=shelf.length-1;i>=0;i--){const it=shelf[i],k=Math.min(1,dt*5);it.x=lerp(it.x,it.tx,k);it.y=lerp(it.y,it.ty,k);it.s=lerp(it.s,it.ts,k);

  c.restore();}
function drawShelfItem(it,back){const s=it.s,spr=it.spr,k=s/L.shelfF.s,R=L.R*s;ctx.save();ctx.globalAlpha=clamp(it.alpha,0,1)*(back?0.85:1);
  drawCup(ctx,it.x,it.y,s,it.cw*0.2,(c,h)=>{c.save();c.translate(0,-h*0.12);c.rotate(it.sway*0.5);c.drawImage(spr.can,-spr.ox*k,-(0.95+L.stick)*R-spr.oy*k,spr.w*k,spr.h*k);c.restore();});
  ctx.restore();}
function drawSample(s){const spr=s.spr,R=L.R*s.s;ctx.save();ctx.globalAlpha=0.9;ctx.translate(s.x,s.y);ctx.rotate(s.sway*0.4);
  ctx.drawImage(spr.can,-spr.ox,-(0.95+L.stick)*R-spr.oy,spr.w,spr.h);ctx.restore();}
function candyInCup(p,s){return (c,h)=>{c.save();c.translate(0,-h*0.12);c.rotate(p.sway);drawItem(c,0,-(0.95+L.stick)*L.R*s,L.R*s,Math.PI,{L:L.stick,phase:p.phase,coat:p.cp,time:T,shine:p.shine||0});c.restore();};}
function drawCounterCup(){const p=placed;
  if(p&&p.stage==='settle'){drawCup(ctx,L.cup.x,L.cup.y,1,cup.wob*0.08,candyInCup(p,1));return;}
  const k=smooth(0,1,cup.arr),ox=(1-k)*(W-L.cup.x+60*u),sc=1+cup.breathe*0.04*Math.sin(T*5);
  drawCup(ctx,L.cup.x+ox,L.cup.y,sc,cup.wob*0.08,null);}
function drawParts(){const c=ctx;c.save();c.globalCompositeOperation='lighter';
  for(const p of parts){const a=clamp(p.life/p.max,0,1);
    if(p.type==='glint'){const k=Math.sin(a*Math.PI);c.fillStyle=p.col;drawStar(c,p.x,p.y,p.size*(0.4+0.8*k),k,p.rot);
      c.globalAlpha=k*0.5;c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,p.size*0.25,0,TAU);c.fill();c.globalAlpha=1;}
    else{c.fillStyle=`rgba(255,220,140,${a})`;c.beginPath();c.arc(p.x,p.y,p.size*(0.5+a),0,TAU);c.fill();}}
  c.restore();}
function drawHint(){if(!hint)return;const k=clamp((hint.t-0.3)/(hint.dur-0.7),0,1),p=hint.path(k),a=Math.min(1,hint.t/0.3,(hint.dur-hint.t)/0.3),c=ctx;
  c.save();c.globalAlpha=0.85*clamp(a,0,1);c.translate(p.x,p.y);
  if(hint.t>0.3){c.strokeStyle='rgba(255,255,255,0.55)';c.lineWidth=2*u;c.beginPath();c.arc(0,0,(9+4*Math.sin(hint.t*9))*u,0,TAU);c.stroke();}
  const sc=u*(hint.t>0.25&&hint.t<0.45?0.9:1);c.scale(sc,sc);c.rotate(-0.35);c.lineJoin='round';c.strokeStyle='#3a2028';c.lineWidth=2;c.fillStyle='#fde7cf';
  c.beginPath();c.ellipse(9,44,17,15,0,0,TAU);c.fill();c.stroke();
  for(const [kx,ky] of [[20,32],[24,41],[22,50]]){c.beginPath();c.ellipse(kx,ky,7,5,0.3,0,TAU);c.fill();c.stroke();}
  c.beginPath();c.moveTo(-6,38);c.lineTo(-6,6);c.arc(0,6,6,Math.PI,0);c.lineTo(6,36);c.fill();c.stroke();
  c.fillStyle='rgba(255,180,190,0.7)';c.beginPath();c.ellipse(0,4,3,2.4,0,0,TAU);c.fill();
  c.restore();}
function render(){const c=ctx;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.drawImage(bg,0,0);c.setTransform(DPR,0,0,DPR,0,0);
  const warm=Math.min(1,made/8);drawGarland(c,Math.min(14,made),T);for(const ln of L.lan)drawLantern(c,ln,T,warm);
  const live=shelf.filter(s=>!s.flying),isBack=it=>it.ts<L.shelfF.s*0.95;
  if(live.length){c.save();c.globalCompositeOperation='lighter';for(const it of live){const p=candyTop(it),R=L.R*it.s*2.4,g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
      g.addColorStop(0,`rgba(255,70,90,${0.11*it.alpha})`);g.addColorStop(1,'rgba(255,70,90,0)');c.fillStyle=g;c.fillRect(p.x-R,p.y-R,R*2,R*2);}c.restore();}
  for(const it of live)if(isBack(it))drawShelfItem(it,true);
  for(const it of live)if(!isBack(it))drawShelfItem(it,false);
  for(const s of samples)drawSample(s);
  const fp=focusPoint();drawCat(c,cat,T,fp.x,fp.y);
  drawCounterCup();
  const dip=item.state==='dip';
  drawPotBack(dip?drawItemFull:null);drawPotFront();
  if(thread)drawThread();for(const f of frags)drawStrand(f.pts,f.w*(1-f.t/0.26),0,1-f.t/0.3);
  if(dip){c.save();c.beginPath();c.rect(0,0,W,liqY());c.clip();drawItemFull();c.restore();drawMeniscus();}
  drawCounterLight();
  if(!dip&&item.state!=='gone')drawItemFull();
  if(placed&&placed.stage==='slide')drawItem(c,placed.x,placed.y,L.R,Math.PI+placed.sway,{L:L.stick,phase:placed.phase,coat:placed.cp,time:T});
  if(placed&&placed.stage==='fly')drawCup(c,placed.cx,placed.cy,placed.s,0,candyInCup(placed,placed.s));
  drawParts();drawHint();}

/* ================= INPUT ================= */
function hitItem(x,y){if(!(item.state==='free'||item.state==='dip'||item.state==='lift'||(item.state==='arrive'&&item.arrT>0.5)))return false;
  const a=itemAng(),R=L.R,dx=x-item.x,dy=y-item.y,c=Math.cos(-a),s=Math.sin(-a),lx=(dx*c-dy*s)/R,ly=(dx*s+dy*c)/R;
  if((lx/1.3)**2+((ly-0.1)/1.55)**2<=1)return true;
  if(ly<BT+0.2&&ly>BT-L.stick-0.5&&Math.abs(lx-item.bend*clamp((BT-ly)/L.stick,0,1))<Math.max(0.65,26*u/R))return true;
  return Math.hypot(dx,dy)<1.9*R;}
function tapScene(x,y){const P=L.pot;
  if(placed&&placed.stage==='settle'){const ty=L.cup.y+placedCandyLocal();if(Math.hypot(x-L.cup.x,y-ty)<L.R*1.6){placed.swayV+=(x<L.cup.x?3:-3);SFX.glass(placed.cp.thick);return;}}
  for(const it of shelf){if(it.flying||it.dying)continue;const p=candyTop(it),R=L.R*it.s;
    if(Math.abs(x-it.x)<R*1.3&&y>p.y-R*1.4&&y<it.y+4*u){it.swayV+=(x<it.x?4:-4);it.cw+=x<it.x?0.3:-0.3;SFX.glass(it.cp.thick);glint(p.x,p.y-R*0.3,5*u,'#fff',0.5);return;}}
  for(const s of samples){const R=L.R*s.s,cy=s.y-(0.95+L.stick)*R;if(Math.abs(x-s.x)<R*1.1&&y>cy-R*1.4&&y<s.y+6*u){s.swayV+=(x<s.x?4:-4);SFX.glass(s.cp.thick);return;}}
  if(!placed||placed.stage==='fly'){const cx=L.cup.x,cy=L.cup.y;if(Math.abs(x-cx)<L.cup.tw*0.75&&y>cy-L.cup.h*1.3&&y<cy+6*u){cup.wobV+=x<cx?2.5:-2.5;SFX.paper();return;}}
  const ly=liqY(),ex=(x-P.x)/P.rx,ey=(y-P.rimY)/(P.ry*1.3);
  if(ex*ex+ey*ey<=1.15){const inL=((x-P.x)/P.lrx)**2+((y-ly)/P.lry)**2<=1,px=clamp(x,P.x-P.lrx*0.85,P.x+P.lrx*0.85),py=inL?y:ly;
    ripple(px,py,0.85);ripple(px,py,0.4);dents.push({x:px,y:py,t:0});if(dents.length>4)dents.shift();pot.sloshV+=(x<P.x?-0.6:0.6);SFX.tap();return;}
  if(Math.abs(x-P.x)<P.rx&&y>P.rimY&&y<P.bot){ripple(P.x,ly,0.5);pot.sloshV+=0.9;SFX.tap();return;}
  if(Math.hypot(x-L.cat.x,y-(L.cat.y-30*u))<32*u){cat.wig=1;cat.blink=0.2;SFX.meow();return;}
  for(const ln of L.lan){if(Math.hypot(x-ln.x,y-ln.y)<30*u){ln.v+=x<ln.x?2:-2;SFX.swing();return;}}
}
function onDown(e){if(e.cancelable)e.preventDefault();audioInit();const x=e.clientX,y=e.clientY;lastInput=T;hint=null;hintShown=false;interacted=true;
  if(ptr.id===null&&hitItem(x,y)){ptr.id=e.pointerId;ptr.x=x;ptr.y=y;ptr.dxAcc=0;ptr.dyAcc=0;
    if(item.state==='arrive'){item.state='free';item.arrT=1;}
    item.held=true;item.gox=item.x-x;item.goy=item.y-y;item.vy-=90*u;item.angV+=(x>item.x?-0.8:0.8);
    SFX.creak(item.state==='dip'?0.5:1);try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}
  tapScene(x,y);}
function onMove(e){if(e.pointerId!==ptr.id)return;if(e.cancelable)e.preventDefault();const x=e.clientX,y=e.clientY;
  ptr.dxAcc+=x-ptr.x;ptr.dyAcc+=y-ptr.y;ptr.x=x;ptr.y=y;lastInput=T;}
function onUp(e){if(e.pointerId!==ptr.id)return;release();}
function release(){ptr.id=null;if(!item.held)return;item.held=false;lastInput=T;
  if(isDone()&&!placed&&cup.arr>=1){const se=stickEndWorld(),mx=L.cup.x,my=L.cup.y-L.cup.h;
    if(Math.hypot(se.x-mx,se.y-my)<Math.max(70*u,L.cup.tw*1.3)||Math.hypot(item.x-mx,item.y-my)<3.4*L.R){item.flip=1;insertCandy();}}}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);cv.addEventListener('lostpointercapture',onUp);
window.addEventListener('blur',()=>release());
const stopEv=e=>{if(e.cancelable)e.preventDefault();};
for(const ev of ['touchstart','touchmove','touchend'])cv.addEventListener(ev,stopEv,{passive:false});
document.addEventListener('touchmove',stopEv,{passive:false});
for(const ev of ['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'])document.addEventListener(ev,stopEv,{passive:false});

/* ================= LOOP / LIFECYCLE ================= */
let raf=0,last=0;
function frame(ts){raf=requestAnimationFrame(frame);if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.05)dt=0.05;if(dt<=0)return;T+=dt;update(dt);render();}
function start(){if(raf)return;last=0;raf=requestAnimationFrame(frame);}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();release();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend().catch(()=>{});}
  else{if(AU.ctx)AU.ctx.resume().catch(()=>{});start();}});
function relayout(){computeLayout();renderBG();buildSamples();
  if(placed){if(placed.stage==='fly')placed.target.flying=false;else{const it=addToShelf(placed);it.flying=false;newBerry();}placed=null;cup.arr=1;}
  for(const it of shelf)it.spr=makeSprite(it.cp,it.phase,L.R*L.shelfF.s);arrangeShelf(true);
  if(item.state==='dip'||item.state==='lift'){thread=null;item.state='dip';item.held=false;ptr.id=null;item.x=L.pot.x;item.y=L.pot.y+0.3*L.Hb-BB*L.R;item.overRim=true;}
  else if(item.state==='arrive'){item.arrFrom={x:L.box.x,y:L.box.y-40*u};}
  else if(item.state!=='gone'){item.held=false;ptr.id=null;item.x=L.rack.x;item.y=L.rack.y;item.vx=item.vy=0;}
  frags.length=0;ripples.length=0;bubbles.length=0;parts.length=0;dents.length=0;}
let rzT=0;function onResize(){clearTimeout(rzT);rzT=setTimeout(relayout,120);}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',()=>setTimeout(relayout,300));
computeLayout();renderBG();buildSamples();item.x=L.rack.x;item.y=L.rack.y;start();
window.__ichigo={item,shelf,L,pot,cup,get thread(){return thread;},get placed(){return placed;},get made(){return made;},get hint(){return hint;}};
})();
</script>
