// ---- dents: contact under the girl, the previous contact, the finger ----
vec3 dentDisp(vec3 p) {
  vec3 d = vec3(0.0);
  for (int i = 0; i < 4; i++) {
    vec4 P = uDentP[i];
    vec4 N = uDentN[i];
    if (abs(P.w) < 1e-4) continue;
    vec3 q = p - P.xyz;
    float dn = dot(q, N.xyz);
    vec3 lat = q - dn * N.xyz;
    float x2 = dot(lat, lat) / (N.w * N.w);
    if (x2 > 40.0) continue;
    float prof = (1.0 - 0.62 * x2) * exp(-0.5 * x2);
    float fall = exp(-dn * dn / (N.w * N.w * 3.0));
    d -= N.xyz * P.w * prof * fall;
  }
  return d;
}

  for (int i = 0; i < 4; i++) {

    vec4 N = uDentN[i];
    if (abs(P.w) < 1e-4) continue;
    vec3 q = p - P.xyz;
    float dn = dot(q, N.xyz);
    vec3 lat = q - dn * N.xyz;
    float s2 = N.w * N.w;
    float x2 = dot(lat, lat) / s2;
    if (x2 > 40.0) continue;
    float dprof = exp(-0.5 * x2) * (0.31 * x2 - 1.12);
    float fall = exp(-dn * dn / (s2 * 3.0));
    add += lat * (P.w * fall * dprof * 2.0 / s2) * sat(dot(n, N.xyz));
  }
  return add;
}

float girlAO(vec3 p, vec3 n) {
  vec2 d = p.xz - uGirl.xz;
  float r2 = dot(d, d);
  float above = uGirl.w;
  float dy = abs(p.y - uGirl.y);
  float k = exp(-r2 / (0.16 + above * 0.1)) * sat(1.0 - above / 3.5) * sat(1.0 - dy * 1.5) * sat(n.y);
  return 1.0 - 0.42 * k;
}

vec3 lampLight(vec3 p) {
  if (uNight < 0.01) return vec3(0.0);

// Jelly optics. albedo = the colour a thick block of it appears, milk = how cloudy it is.
struct JMat { vec3 sigA; float sigS; vec3 sigT; vec3 a; vec3 sigE; };
JMat jmat(vec3 albedo, float milk) {
  JMat m;
  m.sigA = -log(clamp(albedo, 0.015, 0.995)) / 1.4;
  m.sigS = milk * uLook.w * 3.2 + 0.04;
  m.sigT = m.sigA + m.sigS;
  m.a = m.sigS / m.sigT;
  m.sigE = sqrt(3.0 * m.sigA * m.sigT);
  return m;
}
// light that comes back out of the volume (no surface diffuse: jelly has none)
// lit: sun entering nearby, through: sun that crossed dS metres of jelly, amb: sky light diffused inside
vec3 jellyScatter(JMat m, float NoL, vec3 shL, float visE, float dS, float fwd, vec3 skyAmb) {
  float wrap = sat((NoL + 0.35) / 1.35);
  vec3 lit = uSunCol * shL * wrap * pow(m.a, vec3(1.25 * uLook2.y)) * uLook.x;
  vec3 through = uSunCol * visE * exp(-m.sigE * dS * 0.3) * pow(m.a, vec3(1.9 * uLook2.y)) * (0.45 + 2.4 * fwd) * uLook.y;
  vec3 amb = skyAmb * pow(m.a, vec3(2.4 * uLook2.y)) * uLook.z;
  return lit + through + amb;
}

// tiny air bubbles suspended in gelatin, seen with parallax near the camera
float bubbles(vec3 P, vec3 d, float dist) {
  if (dist > 10.0 || uQuality < 0.5) return 0.0;
  float acc = 0.0;
  for (int k = 0; k < 3; k++) {
    float t = 0.08 + float(k) * 0.24;
    vec3 q = P + d * t;
    vec3 cell = floor(q / 0.32);
    vec3 h = hash33(cell + 17.0);
    if (h.x > 0.14) continue;
    vec3 c = (cell + 0.2 + 0.6 * h.zyx) * 0.32;
    float r = 0.01 + 0.028 * h.y;
    vec3 w = c - P;
    float tc = max(dot(w, d), 0.0);
    float dd = length(P + d * tc - c);
    float rim = smoothstep(r, r * 0.72, dd) * (0.35 + 0.65 * smoothstep(r * 0.2, r * 0.85, dd));
    acc += rim * exp(-tc * 2.0);
  }
  return acc * sat(1.0 - dist / 10.0);
}

float ggx(float NoH, float a) {
  float a2 = a * a;
  float d = NoH * NoH * (a2 - 1.0) + 1.0;
  return a2 / (PI * d * d);
}
float fresnel(float c, float f0) { return f0 + (1.0 - f0) * pow(1.0 - c, 5.0); }
