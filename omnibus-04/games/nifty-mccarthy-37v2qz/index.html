<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#b9cde1">
<title>ハンググライダーの一日</title>
<style>
  /* one visual world (a sky at dawn); the canvas paints everything */
  :root {
    --bg: #0b0f18;
    --veil: rgba(8, 12, 20, 0.28);
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: block;
    touch-action: none;
    outline: none;
  }
  /* soft lens vignette – a property of the "camera", not UI */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 85% 80% at 50% 50%, rgba(0,0,0,0) 62%, var(--veil) 100%);
  }
  #fade {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: #0b0f18;
    opacity: 1;
    transition: opacity 1.6s ease;
  }
</style>

<script src="/gf-nav.js" defer></script>
