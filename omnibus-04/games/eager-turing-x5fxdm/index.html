<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8c9d4">
<title>ぷにぷにシールの宝物店</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #f8e3e6; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; transition: opacity .6s;
  }
  #boot .h { width: 64px; height: 58px; animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  body.ready #boot { opacity: 0; }
  body.nogl #boot .h { animation: none; opacity: .5; }
</style>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot"><svg class="h" viewBox="0 0 64 58"><path d="M32 56 C10 40 2 30 2 18 C2 8 10 2 18 2 C25 2 30 6 32 11 C34 6 39 2 46 2 C54 2 62 8 62 18 C62 30 54 40 32 56Z" fill="#ff9ec2"/><ellipse cx="20" cy="15" rx="7" ry="4" fill="#fff" opacity=".7"/></svg></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
