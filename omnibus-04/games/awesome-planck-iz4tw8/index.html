<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9fb4c4">
<meta name="description" content="Sideways gravity town delivery — a wordless one-finger 3D game for small children.">
<title>Yokomuki Delivery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='16' width='44' height='34' rx='3' fill='%23c89a64' transform='rotate(20 32 32)'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #aebfcc;
    --ink: #ffffff;
    --veil: #cfd9e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #aebfcc; --ink: #ffffff; --veil: #cfd9e0; }
  }
  :root[data-theme="dark"] { --bg: #aebfcc; --ink: #ffffff; --veil: #cfd9e0; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #veil {
    position: fixed; inset: 0; background: var(--veil);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease; pointer-events: none; z-index: 5;
  }
  #veil.gone { opacity: 0; }
  /* wordless loading: a cardboard box that gently falls sideways */
  #veil .box {
    width: 56px; height: 44px; border-radius: 4px;
    background: linear-gradient(#c89a64, #b3834f);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.12);
    position: relative; animation: slide 1.6s cubic-bezier(.55,0,.9,.6) infinite;
  }
  #veil .box::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; margin-left: -5px; background: rgba(230,215,170,.8); }
  @keyframes slide {
    0% { transform: translateX(-60px) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateX(90px) rotate(40deg); opacity: 0; }
  }
  #hint { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
} }
</script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="hint"></canvas>
<div id="veil"><div class="box"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
