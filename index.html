<script>
(function(){
  try {
    fetch("/days.json", {cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(data){
      if(!data||!data.bundles||!data.bundles.length) return;
      var main=document.getElementById("tiles");
      if(!main) return;
      var html="";
      data.bundles.forEach(function(b){
        if(!b||!b.href||!b.thumb) return;
        function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
        html+='<a class="card" href="'+esc(b.href)+'" aria-label="'+esc(b.label||b.title||b.id)+'"><img src="'+esc(b.thumb)+'" alt=""></a>\n';
      });
      if(html) main.innerHTML=html;
    }).catch(function(){});
  } catch(e) {}
})();
</script>
