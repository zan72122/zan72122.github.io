<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#cfd6dc">
<title>ソファを はこぼう！</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd6dc; font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "BIZ UDPGothic", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; z-index: 2; }
  button { font-family: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #top { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 8px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #dots { display: flex; gap: 6px; }
  .dot { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.6); color: #555; font-size: 20px; line-height: 40px; padding: 0; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  .dot.on { background: #ffd23f; color: #333; transform: scale(1.12); }
  .dot.done { box-shadow: 0 0 0 3px #5fbf7a inset, 0 2px 4px rgba(0,0,0,.15); }
  #stageName { font-size: 16px; white-space: nowrap; color: #333; background: rgba(255,255,255,.7); padding: 6px 12px; border-radius: 20px; }
  .spacer { flex: 1; }
  .round { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.75); font-size: 24px; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  #pose { pointer-events: auto; width: 112px; height: 112px; border-radius: 50%; background: #fff; box-shadow: 0 6px 14px rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #pose:active { transform: scale(.94); }
  #poseIcon { font-size: 52px; line-height: 1; transition: transform .25s; display: inline-block; }
  #poseNext { font-size: 13px; color: #666; }
  #pose.pulse { animation: pulse .6s ease-in-out 5; }
  @keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 6px 14px rgba(0,0,0,.25);} 50% { transform: scale(1.15); box-shadow: 0 0 0 14px rgba(255,210,63,.55);} }
  .overlay { inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: rgba(60,70,80,.35); backdrop-filter: blur(3px); }
  .overlay h1 { color: #fff; font-size: clamp(34px, 8vw, 64px); margin: 0; text-shadow: 0 3px 10px rgba(0,0,0,.4); text-align: center; }
  .overlay p { color: #fff; font-size: clamp(16px, 3.5vw, 22px); margin: 0; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .big { font-size: clamp(26px, 6vw, 40px); padding: 18px 48px; border-radius: 60px; background: #ffd23f; color: #333; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .big:active { transform: scale(.95); }
  body.title #title { display: flex; }
  body.won #won { display: flex; }
  body.title #bottom, body.won #bottom { display: none; }
</style>

<script src="/gf-nav.js" defer></script>
</head>
<body class="title">
<canvas id="c"></canvas>
<div id="top" class="ui">
  <div id="dots"></div>
  <span id="stageName"></span>
  <span class="spacer"></span>
  <button id="mute" class="round" aria-label="おと">🔊</button>
  <button id="restart" class="round" aria-label="やりなおし">↺</button>
</div>
<div id="bottom" class="ui">
  <button id="pose" aria-label="ソファのむきをかえる"><span id="poseIcon">🛋️</span><span id="poseNext">たてる</span></button>
</div>
<div id="title" class="ui overlay">
  <h1>ソファを はこぼう！</h1>
  <p>ゆびで ソファを おして、ひっぱって、まわして。<br>ボタンで たてたり ねかせたり。</p>
  <button id="play" class="big">▶ あそぶ</button>
</div>
<div id="won" class="ui overlay">
  <h1 id="wonTitle">できた！</h1>
  <button id="next" class="big">つぎへ ▶</button>
</div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
