<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1226" />
  <title>サンタのえんとつ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1226;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .menu-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 4%);
      display: flex;
      justify-content: center;
      gap: 2.8vmin;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .menu-wrap.visible {
      opacity: 1;
    }
    .menu-wrap.visible .menu-btn {
      pointer-events: auto;
    }
    .menu-btn {
      width: 17vmin;
      height: 17vmin;
      max-width: 110px;
      max-height: 110px;
      min-width: 64px;
      min-height: 64px;
      border-radius: 50%;
      border: none;
      background: rgba(18, 26, 52, 0.82);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(200, 214, 255, 0.28);
      padding: clamp(8px, 2vmin, 14px);
      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .menu-btn:active {
      transform: scale(0.9);
    }
    .menu-btn[hidden] {
      display: none;
    }
    .menu-btn.featured {
      width: 22vmin;
      height: 22vmin;
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.55), inset 0 0 0 4px rgba(242, 208, 106, 0.55);
      animation: featured-breathe 1.8s ease-in-out infinite;
    }
    @keyframes featured-breathe {
      0%, 100% { box-shadow: 0 4px 22px rgba(0, 0, 0, 0.55), inset 0 0 0 4px rgba(242, 208, 106, 0.45); }
      50% { box-shadow: 0 4px 26px rgba(0, 0, 0, 0.58), 0 0 0 7px rgba(242, 208, 106, 0.2), inset 0 0 0 4px rgba(242, 208, 106, 0.78); }
    }
    .menu-btn svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #exit-free {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      width: 13vmin;
      height: 13vmin;
      max-width: 72px;
      max-height: 72px;
      min-width: 52px;
      min-height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(18, 26, 52, 0.6);
      box-shadow: inset 0 0 0 2px rgba(200, 214, 255, 0.22);
      padding: 16%;
      display: none;
      -webkit-tap-highlight-color: transparent;
    }
    #exit-free.visible {
      display: block;
      pointer-events: auto;
    }
    #debug-overlay {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 6px);
      right: 6px;
      font: 10px/1.5 monospace;
      color: #9fd;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 8px;
      border-radius: 6px;
      white-space: pre;
      display: none;
      z-index: 20;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CsgIxeSN.js"></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="ui-layer">
    <button id="exit-free" aria-label="もどる"></button>
    <div class="menu-wrap" id="menu">
      <button class="menu-btn" id="btn-again" aria-label="はじめての とおりかた"></button>
      <button class="menu-btn" id="btn-newhouse" aria-label="すすの あとを たどる"></button>
      <button class="menu-btn" id="btn-breath" aria-label="ふるい えんとつの いきを きく"></button>
      <button class="menu-btn" id="btn-free" aria-label="じゆうに あそぶ"></button>
    </div>
    <div id="debug-overlay"></div>
  </div>
</body>
</html>
