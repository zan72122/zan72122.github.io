<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#7fb8ec" />
  <title>れんせつバス ぐるん</title>
  <link rel="stylesheet" href="css/style.css" />

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div id="levelDots"><span class="on">1</span><span>2</span><span>3</span></div>
      <div id="levelName"></div>
      <div class="iconBtn" id="soundBtn">🔊</div>
      <div class="iconBtn" id="restartBtn">↻</div>
    </div>
    <div id="legend"><div><i style="background:#ffd23f"></i>まえの タイヤ</div><div><i style="background:#35b8ff"></i>うしろの タイヤ</div></div>
    <div id="hand" class="hidden">👆</div>
    <div id="bubble"></div>
  </div>

  <div id="title" class="overlay">
    <div class="card">
      <div class="busIcon">🚌</div>
      <h1>れんせつバス</h1>
      <p>ながーい バスを<br />きゅうカーブで まげてみよう</p>
      <button class="bigBtn" id="startBtn">はじめる ▶</button>
      <p class="sub">ゆびで みちを なぞると<br />バスが そっちへ いくよ</p>
    </div>
  </div>

  <div id="result" class="overlay">
    <div class="card">
      <h2>ついた！</h2>
      <p id="resultMsg"></p>
      <div class="trailLegend"><div><i style="background:#ffd23f"></i>まえの タイヤ</div><div><i style="background:#35b8ff"></i>うしろの タイヤ</div></div>
      <p class="sub" id="resultSub"></p>
      <button class="bigBtn" id="againBtn">もういちど ↻</button>
      <button class="bigBtn green" id="nextBtn">つぎの みち ▶</button>
    </div>
  </div>
  <div id="fade"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
