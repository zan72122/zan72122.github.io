<!doctype html>
<html lang="ja">
  <head>
<meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#efe9e2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>しろい かべの ひみつ</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --ink: #4a3b34;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #ded5cb;
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic",
          system-ui, -apple-system, sans-serif;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

      #hint {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 3.2vmin);
        padding: 1.5vmin 4vmin;
        border-radius: 999px;
        background: rgba(255, 253, 250, 0.82);
        box-shadow: 0 0.6vmin 2.4vmin rgba(80, 60, 50, 0.18);
        color: var(--ink);
        font-size: clamp(15px, 3.6vmin, 30px);
        font-weight: 700;
        letter-spacing: 0.06em;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      #hint.on { opacity: 1; }
      #hint.remind { animation: hint-remind 0.48s ease-out; }
      @keyframes hint-remind {
        0% { transform: translateX(-50%) scale(1); }
        42% { transform: translateX(-50%) scale(1.055); }
        100% { transform: translateX(-50%) scale(1); }
      }

      #cue { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0;
             --cue-length: 18vmin; transition: opacity 0.35s ease; }
      #cue.on { opacity: 1; }
      #cue svg {
        position: absolute; left: 0; top: 0;
        width: var(--cue-width, 18vmin); height: var(--cue-height, 18vmin);
        overflow: visible; transform: translate(-50%, -50%);
      }
      #cue .gesture-path {
        position: absolute; left: -9vmin; top: 0;
        width: var(--cue-length); height: 0;
      }
      #cue.path .gesture-path { left: 0; }
      #cue .gesture-path::before,
      #cue .gesture-path::after {
        content: ""; position: absolute; left: 8px; right: 8px;
        border-radius: 999px; transform: translateY(-50%);
      }
      #cue .gesture-path::before {
        height: 11px; background: rgba(255, 253, 248, 0.68);
      }
      #cue .gesture-path::after {
        height: 4px;
        background: repeating-linear-gradient(90deg, rgba(74, 59, 52, 0.62) 0 7px, transparent 7px 13px);
      }
      #cue .gesture-arrow {
        position: absolute; right: 3px; top: -9px; width: 18px; height: 18px;
        border-top: 5px solid rgba(74, 59, 52, 0.78);
        border-right: 5px solid rgba(74, 59, 52, 0.78);
        border-radius: 2px; transform: rotate(45deg);
        filter: drop-shadow(0 0 3px rgba(255, 253, 248, 0.9));
      }
      #cue .gesture-dot {
        position: absolute; left: 6px; top: -8px; width: 16px; height: 16px;
        border-radius: 50%; background: rgba(74, 59, 52, 0.86);
        box-shadow: 0 0 0 5px rgba(255, 253, 248, 0.65);
        animation: cue-travel 1.9s ease-in-out infinite;
      }
      @keyframes cue-travel {
        0%, 12% { transform: translateX(0); opacity: 0.9; }
        72% { transform: translateX(calc(var(--cue-length) - 28px)); opacity: 0.5; }
        73%, 100% { transform: translateX(0); opacity: 0; }
      }

      @media (orientation: landscape) and (max-height: 520px) {
        #hint {
          font-size: clamp(13px, 4.4vmin, 22px);
          bottom: calc(env(safe-area-inset-bottom, 0px) + 2vmin);
          padding: 1.2vmin 3.4vmin;
        }
        #cue svg { width: var(--cue-width, 24vmin); height: var(--cue-height, 24vmin); }
        #cue:not(.path) .gesture-path { left: -12vmin; --cue-length: 24vmin; }
      }

      @media (prefers-reduced-motion: reduce) {
        #cue .gesture-dot { animation-duration: 3.2s; }
        #hint, #cue { transition-duration: 0.1s; }
      }

      #boot {
        position: fixed; inset: 0; z-index: 20; display: flex;
        align-items: center; justify-content: center; flex-direction: column; gap: 3vmin;
        background: #e7ded4; color: var(--ink);
        transition: opacity 0.6s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-size: clamp(20px, 5.4vmin, 46px); font-weight: 800; letter-spacing: 0.1em; }
      #bar { width: 44vmin; height: 1.2vmin; border-radius: 999px; background: rgba(120, 96, 84, 0.18); overflow: hidden; }
      #bar > i { display: block; height: 100%; width: 0%; background: #c6544f; transition: width 0.3s ease; }
      #boot p { margin: 0; font-size: clamp(13px, 3vmin, 22px); opacity: 0.75; }
    </style>
    <script type="module" crossorigin src="./assets/index-C7fsYwwG.js"></script>
  
<script src="/gf-nav.js" defer></script>
</head>
  <body>
    <div id="app"></div>
    <div id="hud" aria-hidden="true">
      <div id="hint"></div>
      <div id="cue"></div>
    </div>
    <div id="boot">
      <h1>しろい かべの ひみつ</h1>
      <div id="bar"><i></i></div>
      <p>じゅんび ちゅう</p>
    </div>
  </body>
</html>
