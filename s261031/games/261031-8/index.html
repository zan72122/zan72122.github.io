<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),mainCtx=cv.getContext('2d');let ctx=mainCtx;const cv2=document.createElement('canvas');let bakedK=0,saEl=document.getElementById('sa');
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-(1-t)*(1-t)*(1-t),eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
let W=1,H=1,DPR=1;const cam={s:1,x:0,y:0},SA={l:0,r:0,t:0,b:0};
let T=0;
const OUT='#5b3a22';

/* ---------- audio ---------- */
let AC=null,MG=null,NB=null,voices=0;
function audioUnlock(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
      MG=AC.createGain();MG.gain.value=.55;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);
      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended'&&!document.hidden)AC.resume();
  }catch(e){}
}
function tone(f,dur,o){o=o||{};if(!AC||voices>30)return;try{
  const t0=AC.currentTime+(o.delay||0),os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol||.2,t0+(o.at||.006));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  os.connect(g);g.connect(MG);os.start(t0);os.stop(t0+dur+.03);voices++;os.onended=()=>{voices--;};}catch(e){}}
function noise(dur,o){o=o||{};if(!AC||voices>30)return;try{
  const t0=AC.currentTime+(o.delay||0),s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t0);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+dur);f.Q.value=o.q||1;
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol||.2,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t0,Math.random()*.5);s.stop(t0+dur+.05);voices++;s.onended=()=>{voices--;};}catch(e){}}
const sfx={
  knock(p=1,v=1,d=0){tone(260*p,.13,{type:'triangle',vol:.22*v,to:170*p,delay:d});noise(.05,{vol:.1*v,f:1400*p,q:2,delay:d});},
  soft(p=1){tone(420*p,.09,{type:'triangle',vol:.1,to:300*p});},
  squish(){noise(.3,{vol:.32,f:800,to:200,type:'lowpass'});tone(210,.24,{vol:.12,to:110});},
  creak(k=1){tone(120,.38,{type:'triangle',vol:.13*k,to:72});noise(.26,{vol:.07*k,f:520,q:5});},
  slide(){tone(520,.42,{vol:.11,to:1500});tone(780,.3,{vol:.05,to:2100,delay:.06});},
  roll(){this.knock(1.35,.7);this.knock(1.1,.6,.13);this.knock(1.5,.5,.27);},
  pop(p=1){tone(300*p,.14,{vol:.22,to:950*p});},
  quack(p=1){tone(720*p,.1,{type:'square',vol:.035,to:520*p});tone(660*p,.11,{type:'square',vol:.03,to:470*p,delay:.13});},
  bubble(p=1,v=1){tone(360*p,.07,{vol:.06*v,to:820*p});},
  splash(k=1){noise(.25+.3*k,{vol:.2*k+.05,f:1100,q:.7,to:450});for(let i=0;i<3;i++)this.bubble(rnd(.8,1.6),.8);},
  pour(){noise(.9,{vol:.16,f:900,q:.6,to:600});},
  gurgle(){for(let i=0;i<4;i++)tone(rnd(140,220),.08,{vol:.07,to:rnd(260,380),delay:i*.09});},
  clap(d=0){noise(.07,{vol:.3,f:1900,q:1.2,delay:d});},
  chime(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{tone(f,.7,{vol:.15,delay:i*.08});tone(f*2,.35,{vol:.04,delay:i*.08});});},
  plug(){tone(1100,.09,{vol:.2,to:280});[783.99,1174.66].forEach((f,i)=>tone(f,.55,{vol:.14,delay:.12+i*.1}));},
  open(){[659.25,880,1318.5].forEach((f,i)=>tone(f,.5,{type:'triangle',vol:.12,delay:i*.07}));},
  fanfare(){const n=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5];n.forEach((f,i)=>{tone(f,.5,{type:'triangle',vol:.14,delay:i*.12});tone(f/2,.5,{vol:.07,delay:i*.12});});},
  toot(){tone(330,.32,{type:'square',vol:.04});tone(392,.45,{type:'triangle',vol:.13,delay:.36});},
  whoosh(){noise(.6,{vol:.14,f:300,to:1800,q:1});},
  click(sp){tone(900+sp*90,.03,{type:'triangle',vol:.05});}
};

/* ---------- wood / drawing helpers ---------- */
const woodCache=new Map();
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function wood(col){
  let p=woodCache.get(col);if(p)return p;
  const N=128,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  g.fillStyle=col;g.fillRect(0,0,N,N);const R=mulb(hashStr(col));
  for(let i=0;i<17;i++){const y0=i*N/17+R()*3,a=.05+R()*.11,ph=R()*TAU,amp=1+R()*3;
    g.strokeStyle='rgba(70,35,10,'+a.toFixed(3)+')';g.lineWidth=.6+R()*1.5;
    for(const off of [-N,0,N]){g.beginPath();for(let x=0;x<=N;x+=4){const y=y0+off+Math.sin(x/N*TAU+ph)*amp+Math.sin(x/N*TAU*3+ph*2)*.8;if(x)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();}}
  for(let i=0;i<5;i++){g.strokeStyle='rgba(255,250,235,'+(.06+R()*.08).toFixed(3)+')';g.lineWidth=2+R()*3;const y=R()*N;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(N*.3,y+4,N*.6,y-4,N,y);g.stroke();}
  const kx=R()*N,ky=R()*N;for(let r=2;r<9;r+=2){g.strokeStyle='rgba(70,35,10,.12)';g.lineWidth=1;g.beginPath();g.ellipse(kx,ky,r*1.8,r,0,0,TAU);g.stroke();}
  p=ctx.createPattern(c,'repeat');woodCache.set(col,p);return p;
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function el(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);}
// carved painted wood: grain fill + inner bevel + outline
function carve(path,col,lw,bevel){
  path();ctx.fillStyle=wood(col);ctx.fill();
  if(bevel!==false){ctx.save();ctx.clip();ctx.translate(3,3);path();ctx.strokeStyle='rgba(60,30,10,.2)';ctx.lineWidth=6;ctx.stroke();
    ctx.translate(-6,-6);path();ctx.strokeStyle='rgba(255,250,232,.5)';ctx.lineWidth=5;ctx.stroke();ctx.restore();}
  path();ctx.strokeStyle=OUT;ctx.lineWidth=lw||4;ctx.stroke();
}
// translucent cellophane
function cello(path,col,a){
  ctx.save();ctx.globalAlpha=a==null?.42:a;path();ctx.fillStyle=col;ctx.fill();ctx.restore();
  ctx.save();path();ctx.clip();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;
  ctx.beginPath();for(let i=-6;i<12;i++){ctx.moveTo(i*70,0);ctx.lineTo(i*70+300,1000);}ctx.stroke();ctx.restore();
  ctx.save();ctx.globalAlpha=.55;path();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
}

/* ---------- tasks / particles ---------- */
let tasks=[],gen=0;
function tw(dur,fn,done,delay){const k={t:-(delay||0),dur:Math.max(1e-4,dur),fn,done,g:gen};tasks.push(k);return k;}
function after(d,f){return tw(1e-4,null,f,d);}
function updTasks(dt){const list=tasks;tasks=[];const keep=[];
  for(const k of list){if(k.g!==gen)continue;k.t+=dt;if(k.t<0){keep.push(k);continue;}
    const p=Math.min(1,k.t/k.dur);if(k.fn)k.fn(p);if(p>=1){if(k.done)k.done();}else keep.push(k);}
  tasks=keep.concat(tasks).filter(k=>k.g===gen);}
const P=[],PMAX=170;
function spawn(o){if(P.length>=PMAX)return null;o.life=o.max=o.life||1;P.push(o);return o;}
function drop(x,y,vx,vy,size,col,life){return spawn({k:0,x,y,vx,vy,size:size||6,col:col||'#6cc3f0',life:life||.9});}
function bubbleP(x,y,size){return spawn({k:1,x,y,vx:rnd(-10,10),vy:rnd(-50,-25),size:size||rnd(5,10),life:rnd(.8,1.5),ph:rnd(0,TAU)});}
function sparkle(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(60,200);spawn({k:2,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,size:rnd(6,12),col:col||['#fff27a','#ffb3d1','#9ff0ff','#c8ff9a'][i%4],life:rnd(.6,1.1),rot:rnd(0,TAU)});}}
function ring(x,y,r,col){return spawn({k:3,x,y,vx:0,vy:0,size:r||20,col:col||'rgba(255,255,255,.8)',life:.6});}
function splashAt(x,y,n,pow){for(let i=0;i<n;i++)drop(x+rnd(-12,12),y,rnd(-120,120)*pow,rnd(-260,-90)*pow,rnd(4,8));}
function updParticles(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=dt;if(p.life<=0){P.splice(i,1);continue;}
  if(p.k===0){p.vy+=900*dt;}else if(p.k===1){p.ph+=dt*6;p.vx=Math.sin(p.ph)*18;}else if(p.k===2){p.vx*=.96;p.vy=p.vy*.96+60*dt;p.rot+=dt*4;}else if(p.k===4){p.vy+=200*dt;p.vx*=.99;p.rot+=dt*6;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;}}
function drawParticles(){for(const p of P){const a=clamp(p.life/p.max,0,1);
  if(p.k===0){ctx.globalAlpha=.75*a+.2;ctx.fillStyle=p.col;el(p.x,p.y,p.size*.8,p.size,0);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';el(p.x-p.size*.3,p.y-p.size*.3,p.size*.25,p.size*.3,0);ctx.fill();}
  else if(p.k===1){ctx.globalAlpha=.8*a;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2;el(p.x,p.y,p.size,p.size,0);ctx.stroke();ctx.fillStyle='rgba(200,240,255,.3)';ctx.fill();}
  else if(p.k===2){ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();for(let j=0;j<8;j++){const r=j%2?p.size*.4:p.size;ctx.lineTo(Math.cos(j*PI/4)*r,Math.sin(j*PI/4)*r);}ctx.closePath();ctx.fill();ctx.restore();}
  else if(p.k===3){ctx.globalAlpha=a;ctx.strokeStyle=p.col;ctx.lineWidth=5*a+1;el(p.x,p.y,p.size*(1+(1-a)*2.2),p.size*(1+(1-a)*2.2)*.6,0);ctx.stroke();}
  else if(p.k===4){ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();}}
  ctx.globalAlpha=1;}

/* ---------- state ---------- */
const PIV=[500,900];             // box rocking pivot
const POOLPIV=[430,720];         // garden pool pivot
const TUBUP=140;                 // tub rises to become the pool
const HIDE={towel:[160,830],cabinet:[832,690],hatch:[586,810],shelf:[410,552]};
const PERS=['careful','hasty','wander'];
const S={phase:'bath',cycle:0,mirror:Math.random()<.5,prevAssign:'',tp:0,tubUp:0,hipX:560,
  lastInput:0,demoDone:false,demo:null,lure:null,lastTap:-1,pendingReset:false};
function rotPt(x,y,a,px,py){const c=Math.cos(a),s=Math.sin(a),dx=x-px,dy=y-py;return[px+dx*c-dy*s,py+dx*s+dy*c];}
function inGarden(){return S.phase==='garden'||S.phase==='celebrate';}
function boxToWorld(x,y){return rotPt(x,y,S.tilt.a,PIV[0],PIV[1]);}
function tubToWorld(x,y){if(inGarden())return rotPt(x,y-TUBUP,S.G.pool.a,POOLPIV[0],POOLPIV[1]);return boxToWorld(x,y-TUBUP*S.tubUp);}
function worldToTub(x,y){if(inGarden()){const q=rotPt(x,y,-S.G.pool.a,POOLPIV[0],POOLPIV[1]);return[q[0],q[1]+TUBUP];}const q=rotPt(x,y,-S.tilt.a,PIV[0],PIV[1]);return[q[0],q[1]+TUBUP*S.tubUp];}
function toWorld(x,y,sp){return sp==='box'?boxToWorld(x,y):sp==='tub'?tubToWorld(x,y):[x,y];}
function fromWorld(x,y,sp){return sp==='box'?rotPt(x,y,-S.tilt.a,PIV[0],PIV[1]):sp==='tub'?worldToTub(x,y):[x,y];}
function screenToWorld(sx,sy){let x=(sx-cam.x)/cam.s;const y=(sy-cam.y)/cam.s;if(S.mirror)x=1000-x;return[x,y];}
function worldToScreen(x,y){if(S.mirror)x=1000-x;return[cam.x+x*cam.s,cam.y+y*cam.s];}

function newGarden(){return{pool:{a:0,v:0},dip:0,dipV:0,wheelOn:false,wheelA:0,wheelSp:0,clickA:0,fount:0,canal:0,stream:0,ofCool:0,
  boat:{st:'hidden',x:705,y:712,riders:[],t:0,bob:0,r:0},flowT:0,rainbow:0,celebT:0,wig:{}};}
function newCycle(first){
  gen++;tasks=[];P.length=0;
  S.cycle++;if(!first)S.mirror=!S.mirror;
  let a,tries=0;do{a=shuffle(PERS.slice());tries++;}while(a.join()===S.prevAssign&&tries<10);S.prevAssign=a.join();
  const spots=['towel','sponge','shelf'];
  S.ducks=spots.map((sp,i)=>({id:i,pers:a[i],spot:sp,found:false,st:'hidden',x:0,y:0,space:'box',face:-1,path:[],bob:rnd(0,TAU),tx:0,tm:0,hop:0,look:0,visited:false}));
  S.tilt={a:0,v:0};S.wave=0;S.water=S.water||0;S.plugClosed=false;S.plugX=300;S.plugY=0;S.faucet=0;
  S.towel={dent:0,done:false};S.soap={loc:'rim',x:470,y:577,r:0};
  S.bucket={x:700,y:858,r:0,water:1,busy:false,rv:0};
  S.sponge={loc:'bucket',x:700,y:792,r:0,sq:0};
  S.board=0;S.sinkFirst=false;S.spongeDoor='cabinet';S.cabinet=0;S.hatch=0;S.shelf=0;S.shelfOpen=false;S.bumping=false;
  S.found=0;S.wig={};S.squash={};S.hip={clap:0,jump:0,tilt:0,giggle:0};S.transformQueued=false;S.basin=0;
  S.fillTick=0;S.drainTick=0;S.dripT=0;
  S.G=newGarden();S.hipX=560;
  S.demoDone=false;S.demo=null;S.lastInput=T;
}
newCycle(true);
function wig(id,v){S.wig[id]=Math.min(1.5,(S.wig[id]||0)+(v||1));}
function wv(id){return S.wig[id]||0;}
function impulse(v){S.tilt.v+=v;S.wave=Math.min(14,S.wave+Math.abs(v)*1.6);after(.04,()=>sfx.creak(.6+Math.min(1,Math.abs(S.tilt.a)*6)));}
function duckBySpot(sp){return S.ducks.find(d=>d.spot===sp);}
function hipClap(big){S.hip.clap=big?2.2:1.3;for(let i=0;i<(big?6:3);i++)sfx.clap(.12+i*.2);}

/* ---------- water ---------- */
function tubTilt(){return inGarden()?S.G.pool.a:S.tilt.a;}
function waterTop(){return 780-clamp(S.water,0,1.05)*170;}
function surfY(x){return waterTop()+Math.tan(-tubTilt())*(x-430)+S.wave*(Math.sin(x*.03-T*6)*.6+Math.sin(x*.051+T*4.3)*.35);}
function duckFloatY(x){return S.water>.1?Math.min(768,surfY(x)+2):768;}

/* ---------- duck paths ---------- */
// step: {k:'jump'|'walk'|'wait'|'call', x,y,h,dur,toSpace,tgt,fn}
function stepPath(d,dt){
  const s=d.path[0];
  if(s.k==='call'){d.path.shift();s.fn&&s.fn(d);return;}
  if(s.t==null){s.t=0;if(s.toSpace&&s.toSpace!==d.space){const w=toWorld(d.x,d.y,d.space);const q=fromWorld(w[0],w[1],s.toSpace);d.x=q[0];d.y=q[1];d.space=s.toSpace;}s.x0=d.x;s.y0=d.y;}
  s.t+=dt;const p=Math.min(1,s.t/s.dur);
  if(s.k==='jump'||s.k==='walk'){let tx=s.x,ty=s.y;if(s.tgt){const q=s.tgt();tx=q[0];ty=q[1];}
    const e=s.k==='jump'?p:eIO(p);d.x=lerp(s.x0,tx,e);d.y=lerp(s.y0,ty,e)-(s.k==='jump'?Math.sin(p*PI)*(s.h||40):Math.abs(Math.sin(p*PI*Math.max(1,Math.round(s.dur*5))))*5);
    if(Math.abs(tx-s.x0)>3)d.face=tx>s.x0?1:-1;
    if(s.k==='jump'&&p>=1&&s.land!==false){d.hop=1;}
  }else if(s.k==='wait'){d.look=s.look?Math.sin(s.t*7):0;}
  if(p>=1){d.look=0;d.path.shift();s.fn&&s.fn(d);}
}
function J(x,y,h,dur,o){return Object.assign({k:'jump',x,y,h,dur},o||{});}
function Wk(x,y,dur,o){return Object.assign({k:'walk',x,y,dur},o||{});}
function Wt(dur,look){return{k:'wait',dur,look};}
function C(fn){return{k:'call',fn};}

/* ---------- bath: ducks ---------- */
function routeToTub(d,fx){
  const left=fx<240,rimX=left?240:300+Math.random()*120,steps=[];
  const sp=d.pers==='hasty'?.75:d.pers==='careful'?1.3:1;
  if(d.pers==='wander'){const dt=left?[300,850]:[700,792];steps.push(J(dt[0],dt[1],50,.5*sp),Wt(.7,true));}
  if(d.pers==='careful'){steps.push(Wk(left?205:fx>650?660:fx,850,.6),Wt(1,true));}
  const enter=left?320:Math.max(300,Math.min(480,rimX));
  steps.push(J(left?236:648,583,90,.5*sp),C(()=>sfx.knock(1.6,.5)),J(enter,768,40,.45*sp,{toSpace:'tub'}),
    C(dd=>{dd.st='tub';dd.space='tub';dd.tx=rnd(300,490);if(S.water>.1){splashAt(...tubToWorld(dd.x,surfY(dd.x)),6,.6);sfx.splash(.5);}sfx.pop(1.2);}));
  return steps;
}
function revealDuck(d,from){
  if(d.found)return;d.found=true;S.found++;d.st='path';d.space='box';
  const h=from||HIDE[d.spot];d.x=h[0];d.y=h[1];d.face=d.x>430?-1:1;
  sfx.chime();setTimeout0(()=>sfx.quack(d.pers==='hasty'?1.2:d.pers==='careful'?.9:1.05),.3);hipClap(false);

function updBath(dt){
  const t=S.tilt;t.v+=(-70*t.a-6*t.v)*dt;t.a+=t.v*dt;if(Math.abs(t.a)>.22){t.a=Math.sign(t.a)*.22;t.v*=-.4;}
  S.wave*=Math.exp(-dt*1.1);
  S.towel.dent*=Math.exp(-dt*5);S.basin*=Math.exp(-dt*3);
  const b=S.bucket;b.rk=b.rk||0;b.rv+=(-60*b.rk-5*b.rv)*dt;b.rk+=b.rv*dt;
  // water
  if(S.phase==='bath'||S.phase==='fold'){
    if(S.plugClosed){if(S.water<.88){S.water=Math.min(.88,S.water+.21*dt);S.faucet=1;S.fillTick-=dt;if(S.fillTick<=0){S.fillTick=.13;sfx.bubble(.7+S.water*1.2,.7);const w=tubToWorld(262,surfY(262));bubbleP(w[0]+rnd(-8,8),w[1]);}}else S.faucet=Math.max(0,S.faucet-dt*2);}
    else{S.faucet=0;if(S.water>0){S.water=Math.max(0,S.water-.3*dt);S.drainTick-=dt;if(S.drainTick<=0){S.drainTick=.22;sfx.gurgle();}
      if(Math.random()<.5){const w=boxToWorld(262,935);drop(w[0]+rnd(-4,4),w[1],rnd(-10,10),rnd(40,90),rnd(4,7));}}}
    if(S.water>1){S.water-=.4*dt;}
  }
  // spill over the low rim when water is high and box tilted
  if(S.water>.55){for(const ex of [236,624]){const sy=surfY(ex);if(sy<604&&Math.random()<.5){const w=tubToWorld(ex,600);drop(w[0],w[1],(ex<430?-1:1)*rnd(40,110),rnd(-80,-20),rnd(4,7));}}}
  S.dripT-=dt;if(S.dripT<=0&&!S.faucet&&S.phase==='bath'){S.dripT=rnd(1.4,2.4);const w=boxToWorld(262,560);drop(w[0],w[1],0,40,5);}
  for(const k in S.wig)S.wig[k]*=Math.exp(-dt*5);for(const k in S.squash)S.squash[k]*=Math.exp(-dt*6);
  for(const d of S.ducks){if(d.scoot)d.scoot=Math.max(0,d.scoot-dt*1.5);if(d.found)updBathDuck(d,dt);else d.bob+=dt*3;}
  // a floating duck reaches up to the shelf door
  if(S.phase==='bath'&&!S.shelfOpen&&S.water>=.76&&!S.ducks.some(d=>d.bump)){
    const c=S.ducks.filter(d=>d.st==='tub'&&!d.path.length);
    if(c.length){c.sort((a,b)=>(a.pers==='hasty'?0:1)-(b.pers==='hasty'?0:1));c[0].bump=true;}
  }
  if(S.phase==='bath'&&S.found===3&&!S.transformQueued&&S.ducks.every(d=>d.st==='tub'&&!d.path.length)){
    S.transformQueued=true;hipClap(true);sfx.chime();after(1.4,startTransform);
  }
}

  [.05,.2,.35,.5].forEach((d,i)=>after(d+.3,()=>sfx.knock(.7+i*.2,1)));
  after(1.4,()=>{sfx.fanfare();sfx.whoosh();});
  tw(3.4,p=>{S.tp=p;S.tubUp=eIO(seg(p,.35,.85));S.water=lerp(lv,.86,seg(p,.3,.9));S.hipX=lerp(560,300,eIO(seg(p,.5,.95)));},()=>{
    S.tp=1;S.tubUp=1;S.phase='garden';startGarden();
  },.3);
}

const SL0=[655,465],SLC=[690,720],SL1=[775,745];

function poolTimer(d){const f=S.G.boat.st==='hidden'?1:.5;return (d.pers==='hasty'?rnd(1.4,2.4):d.pers==='wander'?rnd(3,4.5):rnd(5,7))*f;}

function seatPos(i){const b=S.G.boat;return[b.x+(i-1)*24,b.y-16+Math.sin(b.bob)*2];}
function board(d){

}
function updGardenDuck(d,dt){
  const G=S.G,b=G.boat;d.bob+=dt*3;d.hop=Math.max(0,d.hop-dt*4);
  if(d.path.length){stepPath(d,dt);return;}
  if(d.st==='g_pool'){
    const spd=d.pers==='hasty'?45:d.pers==='careful'?16:28;
    if(Math.abs(d.x-d.tx)<4){d.tx=rnd(390,600);}else{const s=Math.sign(d.tx-d.x);d.x+=s*spd*dt;d.face=s;}
    d.y+=(duckFloatY(d.x)-d.y)*Math.min(1,dt*7);

    d.s=Math.min(1,d.s+dt*(.7+d.s*2));const q=slidePt(d.s);d.x=q[0];d.y=q[1]-14;d.face=1;
    if(d.s>=1)landFromSlide(d);

      board(d);return;}

    if(Math.abs(d.x-d.tx)<3){d.tx=SHAL[0]+rnd(-50,40);}else{const s=Math.sign(d.tx-d.x);d.x+=s*14*dt;d.face=s;}

function updGarden(dt){
  const G=S.G,pl=G.pool;
  pl.v+=(-55*pl.a-4.5*pl.v)*dt;pl.a+=pl.v*dt;if(Math.abs(pl.a)>.2){pl.a=Math.sign(pl.a)*.2;pl.v*=-.4;}

function computeLure(){
  if(S.phase==='bath'){
    if(S.ducks.some(d=>d.path.length&&d.found))return null;
    const td=duckBySpot('towel');if(td&&!td.found)return'towel';
    const sp=S.sponge.loc;
    if(sp==='bucket')return'bucket';
    if(sp==='moving')return null;
    if(sp==='underSink'&&S.cabinet<.5)return'sink';
    if(sp==='underTub'&&S.hatch<.5)return'tub';
    if(!S.plugClosed&&S.soap.loc!=='moving')return'tub';
    const sd=duckBySpot('shelf');if(S.shelfOpen&&sd&&!sd.found)return'shelf';
    return null;
  }
  if(S.phase==='garden'){
    const G=S.G,b=G.boat;
    if(!G.wheelOn)return'parasol';
    if(b.st==='hidden')return'slide';
    if((b.st==='moored'||b.st==='canal')&&b.riders.length<3&&S.ducks.some(d=>d.st==='g_pool'))return'pool';
  }
  return null;
}
function lureTarget(){if(!S.lure)return null;return targets().find(t=>t.id===S.lure)||null;}
function hitTest(sx,sy){
  const w=screenToWorld(sx,sy);let best=null,bs=1e9;
  for(const t of targets()){
    const q=t.sp==='box'?fromWorld(w[0],w[1],'box'):w;
    const dx=Math.max(t.x0-q[0],0,q[0]-t.x1),dy=Math.max(t.y0-q[1],0,q[1]-t.y1),dist=Math.hypot(dx,dy);
    const tol=t.id===S.lure?70:t.duck?12:t.pri>=6?10:38;
    if(dist>tol)continue;const sc=(t.id===S.lure&&dist<8)?-100:dist+t.pri*8;if(sc<bs){bs=sc;best=t;}
  }
  return best?{t:best,w}:null;
}
function onTap(sx,sy){
  S.demo=null;S.lastInput=T;S.demoDone=false;
  if(S.phase!=='bath'&&S.phase!=='garden')return;
  const h=hitTest(sx,sy);if(!h)return;            // empty space: no reaction
  const id=h.t.id;const cw=h.t.sp==='box'?boxToWorld(h.t.cx,h.t.cy):[h.t.cx,h.t.cy];
  if(h.t.pri<6)ring(h.w[0],h.w[1],14,'rgba(255,255,255,.7)');
  if(h.t.duck){const d=h.t.duck;d.hop=1;sfx.quack(d.pers==='hasty'?1.25:d.pers==='careful'?.9:1.05);return;}
  if(S.phase==='bath'){
    ({towel:actTowel,tub:actTub,bucket:actBucket,sink:actSink,shelf:actShelf}[id]||(()=>{wig(id,1);sfx.soft(id==='hippo'?.8:1.3);if(id==='hippo'){S.hip.giggle=1;S.hip.jump=.5;}}))();
  }else{
    if(id==='parasol')actParasol();else if(id==='pool')actPool(h.w);else if(id==='slide')actSlide();
    else if(id==='wheel'){wig('wheel',1);S.G.wheelSp+=S.G.wheelOn?.8:0;sfx.knock(1,.6);}
    else if(id==='boat'){wig('boat',1);sfx.toot();}
    else{wig(id,1);sfx.soft(id==='hippo'?.8:1.3);if(id==='hippo'){S.hip.giggle=1;S.hip.jump=.5;}}
  }
  void cw;
}

const bgB=[];for(let i=0;i<7;i++)bgB.push({x:Math.random(),y:Math.random(),r:rnd(12,30),v:rnd(.01,.03),c:['#ffd6e4','#d6f0ff','#fff1bf','#e0ffd6'][i%4]});

let last=0,running=true,rafId=0;
function frame(now){
  rafId=0;if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,1/30);
  T+=dt;

}
