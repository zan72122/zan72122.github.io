<script>
(()=>{
'use strict';
/* ================= 基本ユーティリティ ================= */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3), eIn=t=>t*t*t, eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eLin=t=>t;
const eBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
const rnd=(a=0,b=1)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1)), pick=a=>a[Math.floor(Math.random()*a.length)];

const C={paper:'#f4e7cf',ink:'#2b2135',red:'#e2483b',pink:'#f39ab0',rose:'#e86a85',yellow:'#f6c445',orange:'#ef8b3a',
 teal:'#2a8c88',teal2:'#1d6866',blue:'#3d6fb8',ice:'#bfe8f5',snow:'#fdfcf6',green:'#5fa34a',dgreen:'#2f6e3a',brown:'#9a6a43',
 dbrown:'#6b4630',cream:'#fbe9c4',purple:'#8b62b3',sand:'#efd49c',sea:'#2f80b6',sea2:'#5ab4d6',fur:'#c48a58',muz:'#efd3aa'};
const CONF=[C.red,C.yellow,C.pink,C.teal,C.blue,C.orange,C.purple,C.green];
const PCOL={big:'#c9553f',snow:'#8fc6e3',cake:'#f19ab2',sea:'#3f8fc4'};

/* ================= キャンバスとレイアウト ================= */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=1,H=1,DPR=1,VW=600,VH=1000,SC=1,LAND=false;
const L={st:[]};
function readSA(){const cs=getComputedStyle(saEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function resize(){
 W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
 DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
 LAND=W>H*1.08;
 if(!LAND){ if(W/H<0.6){VW=600;VH=600*H/W;} else {VH=1000;VW=1000*W/H;} }
 else { if(W/H>1100/760){VH=760;VW=760*W/H;} else {VW=1100;VH=1100*H/W;} }
 SC=W/VW;
 const sa=readSA(); layout({t:sa.t/SC,r:sa.r/SC,b:sa.b/SC,l:sa.l/SC});
 buildCaches();
}
function layout(sa){
 const t=sa.t+6,b=VH-sa.b-6,l=sa.l+6,r=VW-sa.r-6,cx=(l+r)/2;
 Object.assign(L,{t,b,l,r,cx});
 L.st=[];
 if(!LAND){
  const hr=Math.min(60,(b-t)*0.062);
  L.gHead={x:cx,y:t+hr*1.65,r:hr};
  const stTop=L.gHead.y+hr*0.95, avail=b-stTop;
  const ds=clamp(avail*0.16,110,150);
  L.dice={x:cx,y:b-ds*0.6,s:ds};
  const stH=clamp(avail*0.4,280,520);
  L.stage={x:l+4,y:stTop,w:r-l-8,h:stH};
  const dTop=stTop+stH+12, dBot=L.dice.y-ds*0.66-4;
  const ps=clamp((dBot-dTop)/300,0.72,1.35);
  const pw=Math.min(128*ps,(r-l)*0.29),ph=pw*0.75,bw=pw*1.32,bh=ph*1.16;
  const dcy=(dTop+dBot)/2+6;
  L.st[0]={x:cx,y:dBot-bh/2,w:bw,h:bh};
  L.st[2]={x:cx,y:dTop+ph/2+pw*0.36,w:pw,h:ph};
  L.st[1]={x:l+pw/2+6,y:dcy,w:pw,h:ph};
  L.st[3]={x:r-pw/2-6,y:dcy,w:pw,h:ph};
  L.paws={x:cx,y:L.gHead.y+hr*1.08,sp:hr*1.15};
  L.yarn={x:cx+(r-l)*0.3,y:stTop+stH*0.55,r:hr*0.42};
  const R=Math.min((r-l)*0.36,(b-t)*0.2);
  L.env={x:cx,y:t+R*1.12,r:R};
  L.basket={x:cx,y:L.env.y+R*1.78,w:Math.min((r-l)*0.62,R*1.65),h:R*0.42};
  const iw=(r-l)*0.33, ih=iw*0.64, bb=L.basket.y+L.basket.h;
  const iy=bb+(b-bb)*0.42;
  L.isl={snow:{x:l+iw*0.56,y:iy,w:iw,h:ih},cake:{x:cx,y:Math.max(iy+ih*0.35,Math.min(b-ih*0.85,iy+ih*0.6)),w:iw,h:ih},sea:{x:r-iw*0.56,y:iy,w:iw,h:ih}};
 } else {
  const hr=Math.min(62,(b-t)*0.082);
  L.gHead={x:l+190,y:t+hr*1.65,r:hr};
  const colR=l+380;
  L.stage={x:colR+10,y:t+4,w:r-colR-14,h:(b-t)-172};
  const ds=clamp((b-t)*0.2,110,150);
  L.dice={x:L.stage.x+L.stage.w*0.5,y:b-ds*0.6,s:ds};
  const dTop=L.gHead.y+hr*1.15, dBot=b-4;
  const ps=clamp((dBot-dTop)/440,0.72,1.22);
  const pw=128*ps,ph=pw*0.75,bw=pw*1.32,bh=ph*1.16, ccx=l+190;
  L.st[0]={x:ccx,y:dBot-bh/2-2,w:bw,h:bh};
  L.st[2]={x:ccx,y:dTop+ph/2+pw*0.36,w:pw,h:ph};
  const dcy=(L.st[2].y+L.st[0].y)/2+10;
  L.st[1]={x:l+pw/2+6,y:dcy,w:pw,h:ph};
  L.st[3]={x:colR-pw/2-6,y:dcy,w:pw,h:ph};
  L.paws={x:L.gHead.x+hr*1.75,y:L.gHead.y+hr*0.55,sp:hr*0.6};
  L.yarn={x:L.stage.x-22,y:L.dice.y+10,r:hr*0.4};
  const R=Math.min((r-l)*0.16,(b-t)*0.21);
  L.env={x:cx,y:t+R*1.1,r:R};
  L.basket={x:cx,y:L.env.y+R*1.78,w:R*1.7,h:R*0.42};
  const iw=(r-l)*0.25, ih=iw*0.64;
  L.isl={snow:{x:l+iw*0.62,y:(b-t)*0.46+t,w:iw,h:ih},cake:{x:r-iw*0.62,y:(b-t)*0.46+t,w:iw,h:ih},sea:{x:cx,y:b-ih*0.62,w:iw,h:ih}};
 }
 const sx=(L.st[0].x+L.st[1].x+L.st[2].x+L.st[3].x)/4, sy=(L.st[0].y+L.st[1].y+L.st[2].y+L.st[3].y)/4;
 L.dc={x:sx,y:sy};
 const top=L.gHead.y+L.gHead.r*0.7;
 L.coat={x:(l+r)/2,y:(top+b+4)/2,ax:(r-l)/2+34,ay:(b+4-top)/2};
 L.balG={x:L.basket.x-L.basket.w*0.3,y:L.basket.y-L.env.r*0.1,r:L.env.r*0.27};
 L.u=Math.min(L.stage.h*0.075,L.stage.w*0.058);
 L.minR=30/SC;
}
// 駒の位置（ポケットの上）とポケット間の道
function tp(i){const s=L.st[i];return{x:s.x,y:s.y-s.h*0.5+6};}
function ctrlPt(i){const a=tp(i),b=tp((i+1)%4);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let dx=mx-L.dc.x,dy=my-L.dc.y;const d=Math.hypot(dx,dy)||1;const len=Math.hypot(b.x-a.x,b.y-a.y);return{x:mx+dx/d*len*0.22,y:my+dy/d*len*0.22};}
function bez(i,p){const a=tp(i),b=tp((i+1)%4),c=ctrlPt(i),q=1-p;return{x:q*q*a.x+2*q*p*c.x+p*p*b.x,y:q*q*a.y+2*q*p*c.y+p*p*b.y};}
const SX=u=>L.stage.x+u*L.stage.w, SY=v=>L.stage.y+v*L.stage.h;

/* ================= 版画風の描画部品 ================= */
const PTS=new Float32Array(96);
let MX=2.2,MY=-1.6;
function smoothClosed(p,P,n){const lx=P[(n-1)*2],ly=P[(n-1)*2+1];p.moveTo((lx+P[0])/2,(ly+P[1])/2);for(let i=0;i<n;i++){const x=P[i*2],y=P[i*2+1],j=(i+1)%n;p.quadraticCurveTo(x,y,(x+P[j*2])/2,(y+P[j*2+1])/2);}p.closePath();}
function blob(cx,cy,rx,ry,seed,j,n,rot){j=j===undefined?0.05:j;n=n||16;rot=rot||0;const p=new Path2D();for(let i=0;i<n;i++){const a=i/n*TAU+rot;const k=1+(hash(seed*13.7+i*7.13)-0.5)*2*j;PTS[i*2]=cx+Math.cos(a)*rx*k;PTS[i*2+1]=cy+Math.sin(a)*ry*k;}smoothClosed(p,PTS,n);return p;}
function poly(arr,closed){const p=new Path2D();p.moveTo(arr[0],arr[1]);for(let i=2;i<arr.length;i+=2)p.lineTo(arr[i],arr[i+1]);if(closed!==false)p.closePath();return p;}
function rpoly(arr,seed,j){const o=arr.slice();for(let i=0;i<o.length;i++)o[i]+=(hash(seed+i*3.1)-0.5)*2*j;return poly(o);}
function rrect(x,y,w,h,r){const p=new Path2D();r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y);p.closePath();return p;}
function fs(c,p,fill,lw){c.fillStyle=fill;c.translate(MX,MY);c.fill(p);c.translate(-MX,-MY);if(lw!==0){c.lineWidth=lw===undefined?3:lw;c.strokeStyle=C.ink;c.stroke(p);}}
function fo(c,p,fill){c.fillStyle=fill;c.fill(p);}
function line(c,x0,y0,x1,y1,col,lw){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.strokeStyle=col;c.lineWidth=lw;c.stroke();}
function carve(c,x,y,w,h,n,seed,col,lw,ang){c.strokeStyle=col;c.lineWidth=lw;c.beginPath();for(let i=0;i<n;i++){const px=x+hash(seed+i)*w,py=y+hash(seed+i*2.3)*h,l=(0.3+hash(seed+i*5.1)*0.7)*Math.min(w,h)*0.35,a=(ang||0)+(hash(seed+i*9)-0.5)*0.5;c.moveTo(px,py);c.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);}c.stroke();}
function dots(c,x,y,w,h,n,seed,col,r){c.fillStyle=col;for(let i=0;i<n;i++){c.beginPath();c.arc(x+hash(seed+i)*w,y+hash(seed+i*1.7)*h,r*(0.6+hash(seed+i*3)*0.6),0,TAU);c.fill();}}
function eyeDots(c,x,y,u,happy,look){const lx=(look||0)*u*0.05;if(happy){c.strokeStyle=C.ink;c.lineWidth=Math.max(1.5,u*0.08);c.lineCap='round';c.beginPath();c.arc(x-u*0.24,y+u*0.04,u*0.1,PI*1.1,PI*1.9);c.moveTo(x+u*0.34,y+u*0.04);c.arc(x+u*0.24,y+u*0.04,u*0.1,PI*1.1,PI*1.9);c.stroke();}else{c.fillStyle=C.ink;c.beginPath();c.ellipse(x-u*0.24+lx,y,u*0.075,u*0.1,0,0,TAU);c.ellipse(x+u*0.24+lx,y,u*0.075,u*0.1,0,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x-u*0.22+lx,y-u*0.04,u*0.025,0,TAU);c.arc(x+u*0.26+lx,y-u*0.04,u*0.025,0,TAU);c.fill();}}
function cheeks(c,x,y,u,col){c.fillStyle=col||'rgba(240,110,130,.55)';c.beginPath();c.ellipse(x-u*0.42,y+u*0.14,u*0.12,u*0.08,0,0,TAU);c.ellipse(x+u*0.42,y+u*0.14,u*0.12,u*0.08,0,0,TAU);c.fill();}
function smile(c,x,y,u,open){c.strokeStyle=C.ink;c.lineWidth=Math.max(1.5,u*0.07);c.lineCap='round';if(open){c.fillStyle='#b33';c.beginPath();c.ellipse(x,y+u*0.05,u*0.11,u*0.09,0,0,PI);c.fill();c.stroke();}else{c.beginPath();c.arc(x-u*0.07,y,u*0.07,0.2,PI-0.2);c.moveTo(x+u*0.14,y);c.arc(x+u*0.07,y,u*0.07,0.2,PI-0.2);c.stroke();}}
function heart(c,x,y,s,col){const p=new Path2D();p.moveTo(x,y+s*0.35);p.bezierCurveTo(x-s*0.9,y-s*0.3,x-s*0.4,y-s*0.9,x,y-s*0.35);p.bezierCurveTo(x+s*0.4,y-s*0.9,x+s*0.9,y-s*0.3,x,y+s*0.35);fs(c,p,col||C.rose,Math.max(1,s*0.15));}
function star(c,x,y,r,col,rot){const a=[];for(let i=0;i<8;i++){const rr=i%2?r*0.4:r;const ang=i/8*TAU+(rot||0);a.push(x+Math.cos(ang)*rr,y+Math.sin(ang)*rr);}c.fillStyle=col;c.fill(poly(a));}

/* ================= キャラクター描画 ================= */
function lwU(u){return Math.max(1.6,u*0.085);}
function drawStraw(c,x,y,u,e){
 c.save();c.translate(x,y);const sq=e?e.sq:0;c.scale(1+sq*0.5,1-sq*0.6);const lw=lwU(u);
 const p=new Path2D();p.moveTo(0,0);p.bezierCurveTo(-u*1.15,-u*0.45,-u*1.1,-u*1.75,0,-u*1.62);p.bezierCurveTo(u*1.1,-u*1.75,u*1.15,-u*0.45,0,0);p.closePath();
 fs(c,p,C.red,lw);
 c.fillStyle=C.yellow;for(let i=0;i<7;i++){const sx=(hash(i*3.3)-0.5)*u*1.2,sy=-u*(0.3+hash(i*7.7)*0.5);if(Math.abs(sx)<u*0.25&&sy<-u*0.6)continue;c.beginPath();c.ellipse(sx,sy,u*0.05,u*0.08,0,0,TAU);c.fill();}
 for(let i=0;i<5;i++){const a=-PI/2+(i-2)*0.55;c.save();c.translate(0,-u*1.58);c.rotate(a+PI/2);fs(c,blob(0,-u*0.22,u*0.13,u*0.26,i+40,0.05,10),C.green,lw*0.8);c.restore();}
 eyeDots(c,0,-u*0.95,u*0.9,e&&e.happy>0);cheeks(c,0,-u*0.95,u*0.8);smile(c,0,-u*0.72,u*0.8,e&&e.happy>0);
 c.restore();
}
function drawRabbit(c,x,y,u,e,kid){
 c.save();c.translate(x,y);if(e.flip<0)c.scale(-1,1);const sq=e.sq;c.scale(1+sq*0.5,1-sq*0.6);if(e.rot){c.translate(0,-u);c.rotate(e.rot);c.translate(0,u);}
 if(kid)u*=0.62;const lw=lwU(u);const ew=Math.sin(T*3+e.t0)*0.08+(e.happy>0?Math.sin(T*18)*0.12:0);
 for(const s of[-1,1]){c.save();c.translate(s*u*0.3,-u*2.15);c.rotate(s*(0.2+ew));fs(c,blob(0,-u*0.6,u*0.22,u*0.62,7+s,0.04,12),'#fffdf8',lw);fo(c,blob(0,-u*0.55,u*0.1,u*0.42,9+s,0.04,10),C.pink);c.restore();}
 fs(c,blob(0,-u*0.75,u*0.78,u*0.72,11),'#fffdf8',lw);
 c.fillStyle='rgba(120,170,210,.35)';c.beginPath();c.ellipse(-u*0.3,-u*0.45,u*0.3,u*0.18,-0.3,0,TAU);c.fill();
 fs(c,blob(0,-u*1.72,u*0.68,u*0.58,12),'#fffdf8',lw);
 if(!kid){fs(c,rpoly([-u*0.6,-u*1.28,u*0.6,-u*1.28,u*0.55,-u*1.08,-u*0.55,-u*1.08],3,u*0.04),C.red,lw*0.8);fs(c,rpoly([u*0.25,-u*1.15,u*0.5,-u*1.15,u*0.6,-u*0.7,u*0.35,-u*0.72],5,u*0.04),C.red,lw*0.8);}
 eyeDots(c,0,-u*1.78,u,e.happy>0,e.look);cheeks(c,0,-u*1.75,u);
 c.fillStyle=C.rose;c.beginPath();c.ellipse(0,-u*1.6,u*0.07,u*0.05,0,0,TAU);c.fill();
 fs(c,blob(-u*0.38,-u*0.05,u*0.25,u*0.13,13),'#fffdf8',lw*0.8);fs(c,blob(u*0.38,-u*0.05,u*0.25,u*0.13,14),'#fffdf8',lw*0.8);
 if(e.item==='snowball'){fs(c,blob(u*0.62,-u*0.75,u*0.24,u*0.24,15),'#f2fbff',lw*0.8);}
 c.restore();
}
function drawChick(c,x,y,u,e){
 c.save();c.translate(x,y);if(e.flip<0)c.scale(-1,1);const sq=e.sq;const proud=e.happy>0?1.07:1;c.scale((1+sq*0.5)*proud,(1-sq*0.6));if(e.rot){c.translate(0,-u);c.rotate(e.rot);c.translate(0,u);}
 const lw=lwU(u);
 fs(c,blob(-u*0.3,-u*0.04,u*0.2,u*0.1,21),C.orange,lw*0.8);fs(c,blob(u*0.3,-u*0.04,u*0.2,u*0.1,22),C.orange,lw*0.8);
 fs(c,blob(0,-u*0.95,u*0.9,u*0.9,23),C.yellow,lw);
 c.save();c.globalAlpha=0.85;dots(c,-u*0.7,-u*1.6,u*1.4,u*1.3,12,24,'#fffaf0',u*0.07);c.restore();
 const wf=e.happy>0?Math.sin(T*16)*0.4:Math.sin(T*2+e.t0)*0.1;
 c.save();c.translate(-u*0.85,-u*0.9);c.rotate(-0.4-wf);fs(c,blob(0,u*0.2,u*0.18,u*0.34,25),'#f3b52f',lw*0.8);c.restore();
 c.save();c.translate(u*0.85,-u*0.9);c.rotate(0.4+wf);fs(c,blob(0,u*0.2,u*0.18,u*0.34,26),'#f3b52f',lw*0.8);c.restore();
 fs(c,rpoly([-u*0.42,-u*1.72,u*0.42,-u*1.72,u*0.38,-u*1.98,-u*0.38,-u*1.98],27,u*0.03),'#fffdf6',lw*0.8);
 fs(c,blob(0,-u*2.25,u*0.55,u*0.38,28,0.12,12),'#fffdf6',lw);
 eyeDots(c,0,-u*1.18,u,e.happy>0,e.look);cheeks(c,0,-u*1.12,u);
 fs(c,rpoly([-u*0.17,-u*0.98,u*0.17,-u*0.98,0,-u*0.76],29,u*0.02),C.orange,lw*0.7);
 if(e.item==='cake')drawCakeSlice(c,u*0.95,-u*0.55,u*0.55);
 c.restore();

function* coRoll(){

 let v;if(!S.rolled){v=1;S.rolled=1;}else if(S.target>=0&&S.target!==S.pos)v=(S.target-S.pos+4)%4;else v=ri(1,3);
 D.roll={t:0,d:0.5,v};
 if(S.open){departRoles();SND.close();tw(S,{so:0},0.28,eIn);yield 0.29;PK[S.pos].flap=1;S.open=null;}
 G.glass=1;G.smile=0.8;
 log('roll',{v,from:S.pos});
 for(let k=0;k<v;k++){const from=S.pos;BT.hop={from,t:0,d:0.36};SND.hop(k);yield 0.4;S.pos=(from+1)%4;PK[S.pos].wob=1;const p=tp(S.pos);burst('paper',p.x,p.y,4,90,4);}

 if(c==='sea'&&S.ship.rider===comp){const f=friendsAt('sea').filter(x=>x!==S.floe.rider);S.ship.rider=f.length?f[0]:null;}
 if(c==='sea'&&S.floe.rider===comp)S.floe.rider=null;

  if(S.ready){S.busy--;yield* coBalloon();return;}

 }
 S.open=c;S.so=0;S.visitPlayed=0;S.visitCharged=0;SND.open();PK[i].flap=0;PK[i].wob=1;
 const sp=SP[c];const comp=companion();syncItems();

 if(comp){const e=E[comp];e.x=sp.dock[0]+0.03;e.y=sp.dock[1];e.hp=null;e.att=null;e.lock=0;e.vis=1;}
 for(const id of present(c))E[id].pop=1;
 if(!S.visited[c]){if(NATIVE[c]!==comp){E[NATIVE[c]].pop=0;}}
 tw(S,{so:1},0.72,eLin);yield 0.74;

 if(BIRD){const p=birdPos(clamp(BIRD.t/2.2,0,1));const f=Math.sin(T*20)*0.6;c.save();c.translate(p.x,p.y);fs(c,blob(0,0,16,10,99),'#fff',2.5);c.strokeStyle=C.ink;c.lineWidth=3;c.beginPath();c.moveTo(-4,-2);c.lineTo(-18,-10-f*12);c.moveTo(4,-2);c.lineTo(18,-10-f*12);c.stroke();fs(c,poly([-16,0,-24,-3,-16,4]),C.orange,1.5);if(BIRD.t>0.85&&BIRD.t<2)drawIceCake(c,-6,12,L.u*0.35);c.restore();}
}
function drawSky(c,m){
 const a=sstep(m);if(a<=0)return;c.save();c.globalAlpha=a;const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#86c6e8');g.addColorStop(0.6,'#cfeaf4');g.addColorStop(1,'#fbeed2');c.fillStyle=g;c.fillRect(0,0,VW,VH);
 fs(c,blob(VW*0.85,VH*0.1,40,40,4),'#ffd65a',3);
 for(let i=0;i<7;i++){const sp=10+hash(i)*14;const x=((hash(i+2)*VW*1.4+T*sp+S.orbit*120*(i%2?1:-1))%(VW*1.4))-VW*0.2;const y=hash(i+5)*VH*0.95+(1-m)*VH*0.6;fs(c,blob(x,y,50+hash(i+8)*40,18+hash(i+1)*10,i+60,0.12),'rgba(255,255,255,.92)',2);}
 c.restore();
}
function drawDemoHand(c){
 if(!(S.demoT>=0&&S.demoT<2.2))return;const t=S.demoT;const d=L.dice;
 const press=t<0.6?0:t<1.0?(t-0.6)/0.4:t<1.3?1:1-(t-1.3)/0.5;const a=t<0.3?t/0.3:t>1.8?1-(t-1.8)/0.4:1;
 const x=d.x+d.s*0.35,y=d.y-d.s*0.75+press*d.s*0.35;
 c.save();c.globalAlpha=clamp(a,0,1);c.translate(x,y);c.rotate(-0.35);const s=d.s*0.32;
 fs(c,rrect(-s*0.22,-s*1.3,s*0.44,s*1.2,s*0.2),'#ffe2c6',3.5);fs(c,blob(0,s*0.35,s*0.62,s*0.55,7),'#ffe2c6',3.5);for(let k=0;k<3;k++)fs(c,rrect(s*(0.0+k*0.2)-s*0.1,-s*0.25,s*0.2,s*0.4,s*0.1),'#ffe2c6',2.5);
 if(press>0.9){c.strokeStyle=C.ink;c.lineWidth=3;c.beginPath();for(let k=0;k<3;k++){const an=-PI*0.8+k*0.4;c.moveTo(Math.cos(an)*s*1.6,-s*1.4+Math.sin(an)*s*0.5);c.lineTo(Math.cos(an)*s*2.1,-s*1.4+Math.sin(an)*s*0.8);}c.stroke();}
 c.restore();
}
function draw(){
 const c=ctx;c.setTransform(1,0,0,1,0,0);c.drawImage(PAPER,0,0);
 const sh=SHAKE>0?SHAKE*10:0;c.setTransform(DPR*SC,0,0,DPR*SC,DPR*SC*(Math.random()-0.5)*sh,DPR*SC*(Math.random()-0.5)*sh);
 c.lineJoin='round';c.lineCap='round';HITS.length=0;
 const m=S.bm;
 drawSky(c,m);
 drawCoat(c,m);
 if(m<1)drawPaths(c,1-m*3);
 // ポケット→島
 for(let i=0;i<4;i++){const s=L.st[i];const ct=ST[i];
  if(i===0){if(m<0.7){const ex=L.env.x,ey=L.env.y+L.env.r*0.9;drawPocket(c,0,lerp(s.x,ex,eIO(m)),lerp(s.y,ey,eIO(m)),s.w,s.h,1-m*0.5,1-m/0.7);if(m<0.05&&S.phase==='board')hitC('pocket0',s.x,s.y,s.w*0.5,()=>tapPocket(0));}continue;}
  const is=L.isl[ct];const q=eIO(m);const x=lerp(s.x,is.x,q),y=lerp(s.y,is.y,q);
  if(m<0.55)drawPocket(c,i,x,y,s.w,s.h,1+q*0.4,1-sstep((m-0.3)/0.25));
  if(m>0.3)drawIsland(c,ct,x,y,lerp(s.w,is.w,q),lerp(s.h,is.h,q),sstep((m-0.3)/0.3));
  if(m<0.05&&S.phase==='board')hitC('pocket'+i,s.x,s.y,s.w*0.5,()=>tapPocket(i));
 }
 // ばあば（盤面）
 if(m<0.5){const g=L.gHead;c.save();c.globalAlpha=1-m*2;
  const sl=Math.min(LAND?L.gHead.r*1.1+S.charge*6:L.stage.h*0.85,L.stage.h*0.3+S.charge*18+(S.cycle?40:0));
  if(!LAND){c.save();drawPaws(c,L.paws.x,L.paws.y,L.paws.sp,g.r,sl);c.restore();}
  else drawPaws(c,L.paws.x,L.paws.y,L.paws.sp,g.r,sl);
  const yb=YARN.y;c.save();c.translate(L.yarn.x,L.yarn.y+yb);c.rotate(YARN.spin+T*0.2);fs(c,blob(0,0,L.yarn.r,L.yarn.r,9),C.red,3);c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.beginPath();for(let k=0;k<4;k++){c.moveTo(-L.yarn.r*0.8,-L.yarn.r*0.6+k*L.yarn.r*0.4);c.quadraticCurveTo(0,-L.yarn.r+k*L.yarn.r*0.5,L.yarn.r*0.8,-L.yarn.r*0.5+k*L.yarn.r*0.4);}c.stroke();c.restore();
  c.restore();
  if(m<0.05&&!S.open)hitC('yarn',L.yarn.x,L.yarn.y,L.yarn.r*1.2,tapYarn);
 }
 if(m<0.6)drawBoardToken(c);
 drawIdleCard(c,(1-clamp(S.open?S.so*1.5:0,0,1))*(1-clamp(m*3,0,1)));
 drawStage(c);
 if(m<=0.001){const g=L.gHead;drawGrandma(c,g.x,g.y,g.r,true);hitC('grandma',g.x,g.y,g.r*0.9,tapGrandma);if(!LAND&&S.open&&S.so>0.3){c.save();c.globalAlpha=clamp(S.so*2,0,1);fs(c,blob(L.paws.x-L.paws.sp*0.55,L.stage.y+4,g.r*0.24,g.r*0.2,81),C.fur,3);fs(c,blob(L.paws.x+L.paws.sp*0.55,L.stage.y+4,g.r*0.24,g.r*0.2,82),C.fur,3);c.restore();}}
 if(m>0.001)drawBasketScene(c,m);
 drawBR(c);
 drawDice(c,1-m*2.2);
 if(S.phase==='board'&&GS.peek>0.5&&!S.open)hitC('grandson',L.st[0].x,L.st[0].y-L.st[0].h*0.6,L.st[0].h*0.4,()=>{GS.wave=1;SND.kid();GS.out=0.6;});
 drawFX(c);drawParts(c);drawDemoHand(c);
 c.setTransform(1,0,0,1,0,0);
 if(FLASH>0){c.fillStyle='rgba(255,255,255,'+(FLASH*0.7)+')';c.fillRect(0,0,cv.width,cv.height);}
 c.globalAlpha=0.6;c.fillStyle=c.createPattern(GRAIN,'repeat');c.fillRect(0,0,cv.width,cv.height);c.globalAlpha=1;
}

/* ================= ループ ================= */
let last=performance.now(),raf=0;
function loop(now){raf=requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,1/30);T+=dt;try{update(dt);draw();}catch(err){console.warn(err);}}
function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}else{start();try{if(AC)AC.resume();}catch(e){}}});
window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,60);});
window.addEventListener('orientationchange',()=>{setTimeout(resize,250);});
resize();lastInput=0;start();

// 自動テスト用の読み取り口（ゲーム進行には影響しない）
window.__gf={S,E,L,AN,get hint(){return HINT;},get phase(){return S.phase;},get particles(){return PS.length;},
 hits(){return HITS.map(h=>({id:h.id,x:(h.rx!==undefined?h.rx+h.w/2:h.x)*SC,y:(h.ry!==undefined?h.ry+h.h/2:h.y)*SC}));},
 hintXY(){const h=HINT;if(!h)return null;const id=h.k==='dice'?'dice':h.k==='pouch'?'pocket0':h.k==='ent'?'e:'+h.id:h.k==='isl'?'isl:'+h.id:h.k==='bf'?'bf:'+h.id:null;const f=HITS.find(x=>x.id===id);if(!f)return null;return{id,x:(f.rx!==undefined?f.rx+f.w/2:f.x)*SC,y:(f.ry!==undefined?f.ry+f.h/2:f.y)*SC};}};
})();
