<script>
(function(){
'use strict';
/* ================= 基本 ================= */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=0,H=0,DPR=1,U=40,PR={x:0,y:0,w:1,h:1},PORT=true,L=null,bg=null;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t,0,1);const c=1.9;t-=1;return 1+(c+1)*t*t*t+c*t*t};
const R=Math.random;

/* ================= レイアウト（正規化座標） ================= */
const LAYOUTS={
 P:{horizon:.25,castle:[.5,.215],castleW:5.2,tree:[.9,.33],perch:[.8,.205],gate:[.5,.45],brideWait:[.13,.49],
   keeper:[.8,.565],door:[.94,.565],fence:[.62,.565],carriage:[.27,.625],stack:[.55,.625],gift:[.12,.715],
   spots:[[.27,.765],[.45,.765],[.63,.765],[.81,.765],[.96,.765]],
   lawn:[.66,.86],
   tray:[[.15,.905],[.38,.905],[.61,.905],[.84,.905]],
   roadBird:[[-.1,.3],[.05,.31],[.19,.355],[.07,.42],[.02,.56],[.1,.69],[.2,.8]],
   roadDoor:[[1.1,.565],[.95,.575],[.86,.66]],
   parade:[[.5,.49],[.3,.56],[.12,.66],[.18,.835],[.5,.85],[.82,.835],[.86,.67],[.7,.56],[.5,.49]],
   photo:[.13,.07]},
 L:{horizon:.42,castle:[.5,.4],castleW:6.2,tree:[.91,.47],perch:[.86,.27],gate:[.5,.61],brideWait:[.13,.62],
   keeper:[.86,.66],door:[.955,.66],fence:[.72,.66],carriage:[.25,.75],stack:[.64,.73],gift:[.08,.79],
   spots:[[.58,.84],[.67,.84],[.76,.84],[.85,.84],[.94,.84]],
   lawn:[.5,.8],
   tray:[[.08,.905],[.18,.905],[.28,.905],[.38,.905]],
   roadBird:[[-.05,.45],[.08,.46],[.22,.5],[.34,.53],[.4,.7],[.5,.76],[.58,.9]],
   roadDoor:[[1.05,.66],[.955,.67],[.9,.74]],
   parade:[[.5,.65],[.36,.69],[.32,.86],[.5,.94],[.72,.95],[.97,.92],[.9,.73],[.68,.68],[.5,.65]],
   photo:[.06,.1]}
};
const NP=n=>({x:PR.x+n[0]*PR.w,y:PR.y+n[1]*PR.h});
const P=name=>NP(L[name]);
const gateP=()=>P('gate');
const archC=()=>{const g=gateP();return{x:g.x,y:g.y-1.7*U}};
const ARCH_R=()=>1.25*U;
const altarL=()=>{const g=gateP();return{x:g.x-.68*U,y:g.y+.06*U}};
const altarR=()=>{const g=gateP();return{x:g.x+.68*U,y:g.y+.06*U}};
const bfHome=()=>{const g=gateP();return{x:g.x-1.95*U,y:g.y-2.3*U}};
const perchPos=()=>P('perch');
const spotPos=i=>NP(L.spots[i]);
const stackPos=i=>{const s=P('stack');return{x:s.x+(i-.5)*.9*U,y:s.y}};
const trayPos=i=>NP(L.tray[i]);

/* ================= 音（Web Audio合成） ================= */
let AC=null,MASTER=null;
function audioInit(){
  try{
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C(); MASTER=AC.createGain(); MASTER.gain.value=.55; MASTER.connect(AC.destination);
    const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource(); s.buffer=b; s.connect(MASTER); s.start(0);
    if(AC.state==='suspended') AC.resume();
  }catch(e){AC=null}
}
function tone(f,dur,type,vol,when,slide){
  if(!AC||AC.state!=='running') return;
  try{
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
function bellTone(f,when,vol){ tone(f,1.1,'sine',vol||.12,when); tone(f*2.76,.6,'sine',(vol||.12)*.35,when); tone(f*5.4,.25,'sine',(vol||.12)*.15,when); }
const SCALE=[523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5,1568,1760];
const SFX={
  lift(){tone(420,.09,'sine',.14,0,1.9);tone(900,.05,'triangle',.05,.02)},
  peel(){tone(300,.06,'triangle',.06,0,1.4)},
  drop(){tone(260,.12,'triangle',.12,0,.6);tone(180,.08,'sine',.08,.02)},
  stick(){ // 関係成立：段階ごとに音程が上がる
    const i=S.harmony%6; S.harmony++;
    tone(150,.09,'sine',.16,0,.5);
    tone(SCALE[i],.22,'triangle',.13,.03); tone(SCALE[i+2],.22,'triangle',.11,.11); tone(SCALE[i+4],.35,'sine',.12,.19);
  },
  big(){ [0,2,4,7].forEach((d,k)=>tone(SCALE[Math.min(9,d)],.4,'triangle',.12,k*.09)); bellTone(1568,.4,.07); },
  reject(){tone(330,.18,'sine',.12,0,.75);tone(300,.2,'sine',.1,.16,.8)},
  wiggle(){tone(660+R()*120,.05,'triangle',.05)},
  pluck(n){tone(SCALE[n%10],.18,'triangle',.08);tone(SCALE[n%10]*2,.08,'sine',.03,.02)},
  bell(){bellTone(1318.5,0,.12);bellTone(1568,.18,.1);bellTone(1318.5,.36,.08)},
  chirp(){for(let i=0;i<3;i++)tone(2300+i*200,.07,'sine',.06,i*.09,1.4)},
  door(){tone(200,.25,'triangle',.08,0,1.3);tone(240,.2,'triangle',.06,.2,.8)},
  clop(){tone(500,.04,'square',.025);tone(380,.04,'square',.02,.12)},
  fanfare(){const seq=[0,2,4,5,7,7,9];seq.forEach((d,k)=>{tone(SCALE[Math.min(9,d)],.35,'triangle',.11,k*.13);tone(SCALE[Math.min(9,d)]/2,.35,'sine',.06,k*.13)});},
  whoosh(){tone(200,.9,'sine',.1,0,4);tone(300,.8,'triangle',.05,.1,3)},
  twinkle(){for(let i=0;i<5;i++)tone(SCALE[5+(i%4)],.25,'sine',.06,i*.07)},
  night(){[0,4,7,9].forEach((d,k)=>bellTone(SCALE[Math.min(9,d)]/2,k*.35,.08))},
  shutter(){tone(1800,.03,'square',.05);tone(900,.06,'square',.04,.05)},
  page(){tone(500,.5,'sine',.05,0,.4)}
};

/* ================= 状態 ================= */
const ORDER=['hedgehog','rabbit','kitten'];
let S=null,A={},AL=[],ST={},STL=[],parts=[],flyers=[];
let photoImg=null,photoMeta=null,demoShown={};
const SPOTS=5;

function mkActor(id,kind,o){return Object.assign({id,kind,x:0,y:0,wp:[],speed:2.2,face:1,moving:false,wait:0,look:null,
  hop:0,hv:0,anim:'',animT:0,state:'',spot:-1,items:[],hidden:false,ride:false,flap:0,walk:0,mode:'',mt:0,pOff:[0,0]},o)}
function mkSticker(id,type,attach,o){return Object.assign({id,type,attach,home:attach,x:0,y:0,lift:0,sq:0,sqv:0,
  locked:false,hidden:false,wig:0,born:1,vx:0,vy:0,special:false,hopY:0,hopV:0},o)}

function newState(keep){
  S={t:0,idle:0,cycle:keep?keep.cycle+1:0,harmony:keep?keep.harmony:0,
    awake:false,blooms:0,gateExtra:0,gateShake:0,gateGlow:0,
    carFlowers:0,carExtra:0,carShake:0,
    fetch:false,brideState:'wait',flowerVeil:false,
    spots:Array.from({length:SPOTS},()=>({chair:null,guest:null})),
    arrivals:[],callT:0,doorT:0,doorHold:0,keeperT:0,
    pairs:{},seatT:0,
    cer:{state:0,t:0,f:{}},popT:0,
    parade:{active:false,t:0},leader:'couple',
    box:'plain',boxT:0,giftCount:0,
    night:null,turn:null,flash:0,polaroid:null,capture:false,
    timers:[],demo:null,hint:null,hintHop:0,lastHintKey:'',needGate:0,needBride:0,
    unlocked:{flower:true},notice:null,stars:0};
}
function after(sec,fn){S.timers.push({t:sec,fn})}

function initWorld(keep){
  newState(keep);
  A={};AL=[];
  const add=(id,kind,o)=>{const a=mkActor(id,kind,o);A[id]=a;AL.push(a);return a};
  add('bride','bride',{speed:1.9});
  add('groom','groom',{speed:1.9});
  add('keeper','keeper');
  add('hedgehog','hedgehog',{state:'away',hidden:true,speed:2.6});
  add('rabbit','rabbit',{state:'away',hidden:true,speed:2.6});
  add('kitten','kitten',{state:'away',hidden:true,speed:2.6});
  add('carriage','carriage',{speed:2.9,wheel:0});
  add('bird','bird',{speed:7,mode:'perch'});
  add('butterfly','butterfly',{speed:5,mode:'sleep'});
  A.bride.pOff=[-.32,.05];A.groom.pOff=[.32,0];
  ST={};STL=[];
  const s=(id,type,attach,o)=>{const k=mkSticker(id,type,attach,o);ST[id]=k;STL.push(k);return k};
  s('flower','flower',{k:'tray',i:0});
  s('bell','bell',{k:'tray',i:1},{locked:true});
  s('ribbon','ribbon',{k:'tray',i:2},{locked:true});
  s('heart','heart',{k:'tray',i:3},{locked:true});
  s('chair1','chair',{k:'spot',i:1},{locked:true}); S.spots[1].chair='chair1';
  s('chair2','chair',{k:'stack',i:0},{locked:true});
  ST.chair1.home={k:'stack',i:1};
  s('crown','crown',{k:'none'},{hidden:true});
  s('gift','gift',{k:'obj',id:'table',ox:0,oy:-.95},{hidden:true});
  s('star','star',{k:'none'},{hidden:true});
  for(const a of AL){const h=home(a);a.x=h.x;a.y=h.y;}
  for(const k of STL){const t=stickerTarget(k);k.x=t.x;k.y=t.y;}
  parts=[];flyers=[];drag=null;selected=null;
}

/* ================= 位置計算 ================= */
function seatPos(i){const c=A.carriage;return{x:c.x+(i?.28:-.28)*U*c.face,y:c.y-.55*U}}
function home(a){
  switch(a.id){
    case 'bride': if(a.ride) return seatPos(0); return S.brideState==='altar'?altarL():P('brideWait');
    case 'groom': if(a.ride) return seatPos(1); return altarR();
    case 'keeper': return P('keeper');
    case 'carriage': return P('carriage');
    case 'bird': return perchPos();
    case 'butterfly': return bfHome();
  }
  if(a.state==='away') return{x:a.x,y:a.y};
  if(a.state==='sitting'){const ch=chairAt(a.spot);if(ch&&!ch.hidden) return{x:ch.x,y:ch.y};}
  return a.spot>=0?spotPos(a.spot):{x:a.x,y:a.y};
}
function chairAt(i){const id=i>=0&&S.spots[i]?S.spots[i].chair:null;return id?ST[id]:null}
function objPos(id){
  if(A[id]) return{x:A[id].x,y:A[id].y+(A[id].hop||0)};
  switch(id){
    case 'gate':return gateP();
    case 'table':return P('gift');
    case 'perch':return perchPos();
    case 'couple':return{x:(A.bride.x+A.groom.x)/2,y:(A.bride.y+A.groom.y)/2};
  }
  return{x:0,y:0};
}
function stickerTarget(s){
  const a=s.attach;
  switch(a.k){
    case 'tray':return trayPos(a.i);
    case 'loose':return NP([a.nx,a.ny]);
    case 'obj':{const o=objPos(a.id);return{x:o.x+a.ox*U,y:o.y+a.oy*U}}
    case 'spot':return spotPos(a.i);
    case 'stack':return stackPos(a.i);
    case 'drag':return{x:drag?drag.x:s.x,y:drag?drag.y:s.y};
    case 'fly':return a.to;
  }
  return{x:s.x,y:s.y};
}
const at=(sid,id)=>{const s=ST[sid];return s&&!s.hidden&&s.attach.k==='obj'&&s.attach.id===id};
function looseAt(p){
  const m=.7*U;
  const x=clamp(p.x,PR.x+m,PR.x+PR.w-m), y=clamp(p.y,PR.y+m,PR.y+PR.h-m);
  return{k:'loose',nx:(x-PR.x)/PR.w,ny:(y-PR.y)/PR.h};
}
function stR(s){return({flower:.82,bell:.6,ribbon:.6,heart:.62,crown:.62,chair:.55,gift:.58,star:.62,star2:.62})[s.type]*U}
function guestArrived(a){return ORDER.includes(a.id)&&a.state!=='away'&&a.state!=='arriving'}
function busyGuest(a){return a.state==='yield'||a.state==='yield2'||a.state==='walking'||a.state==='parade'||a.state==='arriving'||a.state==='away'}

/* ================= 門の形 ================= */
function archPoint(v){ // 0..1 左柱下→アーチ→右柱下
  const g=gateP(),c=archC(),r=ARCH_R(),post=g.y-c.y,arc=Math.PI*r,tot=post*2+arc;
  let d=v*tot;
  if(d<post) return{x:c.x-r,y:g.y-d};
  d-=post;
  if(d<arc){const an=Math.PI-d/r;return{x:c.x+Math.cos(an)*r,y:c.y-Math.sin(an)*r}}
  d-=arc; return{x:c.x+r,y:c.y+d};
}
const BLOOM_V=i=>{const k=Math.floor(i/2),v=.05+k*.083;return i%2?1-v:v};
function gateWeavePt(){return archPoint(BLOOM_V(Math.min(11,S.blooms)))}
function carWeavePt(){const c=A.carriage,n=(S.carFlowers+S.carExtra)%5;return{x:c.x+(-.55+n*.27)*U,y:c.y-1.45*U}}

/* ================= 粒子 ================= */
const PMAX=150;
function emit(type,x,y,n,o){
  o=o||{};
  for(let i=0;i<n&&parts.length<PMAX;i++){
    const an=o.an!=null?o.an+(R()-.5)*(o.spread||TAU):R()*TAU, sp=(o.sp||1.5)*(0.5+R())*U;
    parts.push({type,x:x+(R()-.5)*(o.jx||0),y:y+(R()-.5)*(o.jy||0),vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-(o.up||0)*U,
      life:0,max:(o.life||1)*(0.7+R()*.6),rot:R()*TAU,vr:(R()-.5)*6,size:(o.size||.12)*U*(0.7+R()*.6),
      color:o.colors?o.colors[(R()*o.colors.length)|0]:(o.color||'#f7a8c4'),g:o.g!=null?o.g:1.2});
  }
}
const PETALS=['#f7a8c4','#ffd1e0','#fff3b0','#ffffff','#c9b6f0'];
const CONF=['#f7a8c4','#a8d8f7','#fff09a','#b8e6b0','#c9b6f0','#ffb38a'];
function burst(x,y,big){emit('spark',x,y,big?14:7,{sp:2.2,life:.7,size:.16,color:'#fff6b0',g:0});emit('petal',x,y,big?12:5,{sp:1.6,life:1.2,colors:PETALS,g:.8,up:.6});}
function fly(type,from,to,dur,cb){flyers.push({type,from,to,t:0,dur,cb})}

/* ================= シールのスプライト（ぷっくり樹脂） ================= */
const spriteCache={};
function shapePath(g,type,r){
  g.beginPath();
  switch(type){
    case 'flower':for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2;g.moveTo(Math.cos(a)*r*.55+r*.42,Math.sin(a)*r*.55);g.arc(Math.cos(a)*r*.55,Math.sin(a)*r*.55,r*.42,0,TAU)}g.moveTo(r*.4,0);g.arc(0,0,r*.4,0,TAU);break;
    case 'bell':g.moveTo(0,-r*.95);g.bezierCurveTo(r*.55,-r*.95,r*.62,-r*.2,r*.7,r*.35);g.quadraticCurveTo(r*.95,r*.55,r*.85,r*.68);g.lineTo(-r*.85,r*.68);g.quadraticCurveTo(-r*.95,r*.55,-r*.7,r*.35);g.bezierCurveTo(-r*.62,-r*.2,-r*.55,-r*.95,0,-r*.95);g.moveTo(r*.22,r*.72);g.arc(0,r*.72,r*.22,0,TAU);break;
    case 'ribbon':g.moveTo(0,0);g.bezierCurveTo(-r*.4,-r*.8,-r*1.05,-r*.55,-r*.95,0);g.bezierCurveTo(-r*.9,r*.45,-r*.35,r*.35,0,0);g.bezierCurveTo(r*.35,r*.35,r*.9,r*.45,r*.95,0);g.bezierCurveTo(r*1.05,-r*.55,r*.4,-r*.8,0,0);
      g.moveTo(-r*.1,r*.05);g.lineTo(-r*.55,r*.95);g.lineTo(-r*.25,r*.8);g.lineTo(-r*.05,r*.95);g.lineTo(r*.05,r*.1);g.moveTo(r*.1,r*.05);g.lineTo(r*.55,r*.95);g.lineTo(r*.25,r*.8);g.lineTo(r*.05,r*.95);g.lineTo(-r*.05,r*.1);g.moveTo(r*.24,0);g.arc(0,0,r*.24,0,TAU);break;
    case 'heart':g.moveTo(0,r*.9);g.bezierCurveTo(-r*1.25,r*.05,-r*.75,-r*1.05,0,-r*.42);g.bezierCurveTo(r*.75,-r*1.05,r*1.25,r*.05,0,r*.9);break;
    case 'crown':for(let i=0;i<8;i++){const a=i/8*TAU;g.moveTo(Math.cos(a)*r*.68+r*.32,Math.sin(a)*r*.55);g.arc(Math.cos(a)*r*.68,Math.sin(a)*r*.55,r*.32,0,TAU)}break;
    case 'chair':g.moveTo(-r*.55,-r*1.0);g.lineTo(r*.55,-r*1.0);g.quadraticCurveTo(r*.7,-r*1.0,r*.65,-r*.8);g.lineTo(r*.55,-r*.05);g.lineTo(r*.75,-r*.05);g.lineTo(r*.7,r*.2);g.lineTo(r*.62,r*.2);g.lineTo(r*.62,r*.95);g.lineTo(r*.38,r*.95);g.lineTo(r*.38,r*.2);g.lineTo(-r*.38,r*.2);g.lineTo(-r*.38,r*.95);g.lineTo(-r*.62,r*.95);g.lineTo(-r*.62,r*.2);g.lineTo(-r*.7,r*.2);g.lineTo(-r*.75,-r*.05);g.lineTo(-r*.55,-r*.05);g.lineTo(-r*.65,-r*.8);g.quadraticCurveTo(-r*.7,-r*1.0,-r*.55,-r*1.0);break;
    case 'gift':g.rect(-r*.8,-r*.45,r*1.6,r*1.3);g.rect(-r*.92,-r*.75,r*1.84,r*.4);g.moveTo(0,-r*.7);g.ellipse(-r*.32,-r*.9,r*.34,r*.22,-.4,0,TAU);g.moveTo(r*.66,-r*.9);g.ellipse(r*.32,-r*.9,r*.34,r*.22,.4,0,TAU);break;
    case 'star':case 'star2':for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=i%2?r*.45:r*1.0;i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();break;
  }
}
function paintSticker(g,type,r){
  const fillShape=(c)=>{shapePath(g,type,r);g.fillStyle=c;g.fill()};
  switch(type){
    case 'flower':{fillShape('#f9a3c3');g.fillStyle='#fbc2d8';for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2;g.beginPath();g.arc(Math.cos(a)*r*.6,Math.sin(a)*r*.6,r*.22,0,TAU);g.fill()}
      g.beginPath();g.arc(0,0,r*.36,0,TAU);g.fillStyle='#ffd65c';g.fill();g.fillStyle='#f0a93a';for(let i=0;i<7;i++){const a=i/7*TAU;g.beginPath();g.arc(Math.cos(a)*r*.18,Math.sin(a)*r*.18,r*.05,0,TAU);g.fill()}break}
    case 'bell':{fillShape('#ffd34d');g.fillStyle='#f2b51f';g.beginPath();g.ellipse(0,r*.6,r*.82,r*.12,0,0,TAU);g.fill();g.beginPath();g.arc(0,r*.72,r*.18,0,TAU);g.fillStyle='#c98b10';g.fill();g.strokeStyle='#e89aa8';g.lineWidth=r*.16;g.beginPath();g.moveTo(-r*.3,-r*.95);g.quadraticCurveTo(0,-r*1.2,r*.3,-r*.95);g.stroke();break}

let resizeQueued=true;
function doResize(){
  resizeQueued=false;

  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  let st={paddingTop:'0',paddingRight:'0',paddingBottom:'0',paddingLeft:'0'};

  const sT=parseFloat(st.paddingTop)||0,sR=parseFloat(st.paddingRight)||0,sB=parseFloat(st.paddingBottom)||0,sL=parseFloat(st.paddingLeft)||0;
  PR={x:sL,y:sT,w:Math.max(1,W-sL-sR),h:Math.max(1,H-sT-sB)};
  PORT=PR.h>=PR.w;L=PORT?LAYOUTS.P:LAYOUTS.L;
  U=PORT?Math.min(PR.w/9.4,PR.h/15):Math.min(PR.w/18.5,PR.h/12.8);

function hatch(g,clipFn,color,alpha,spacing,angle,lw){
  g.save();g.beginPath();clipFn(g);g.clip();g.strokeStyle=color;g.lineWidth=lw||1.2;

    g.moveTo(ox-ca*D+R()*2,oy-sa*D);g.lineTo(ox+ca*D,oy+sa*D+R()*2);g.stroke();
  }
  g.restore();
}
function pencil(g,pathFn,color,lw,alpha){

function drawCastlePart(g,p,by,c,mode){

  if(lv>=2){g.save();g.strokeStyle='rgba(140,200,120,.9)';g.lineWidth=2;for(let i=0;i<Math.min(5,lv);i++){const p=archPoint(.3+i*.1);g.beginPath();g.moveTo(p.x,p.y);g.quadraticCurveTo(p.x,p.y+.5*U,p.x+.05*U,p.y+.75*U);g.stroke();bloom(g,p.x+.05*U,p.y+.8*U,.09*U,'#f9a3c3',i)}g.restore();}
  if(lv>=4){for(let i=0;i<3;i++){const p=archPoint(.38+i*.12);g.save();g.translate(p.x,p.y-.25*U);g.scale(U/100,U/100);drawItem(g,'heart',0,0,1.1);g.restore();}}
  if(S.gateGlow>0){g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(c.x,c.y,0,c.x,c.y,r*1.8);gr.addColorStop(0,'rgba(255,240,180,'+(.45*S.gateGlow)+')');gr.addColorStop(1,'rgba(255,240,180,0)');g.fillStyle=gr;g.fillRect(c.x-r*2,c.y-r*2,r*4,r*4);g.restore();}

function bloom(g,x,y,r,col,seed){

  g.beginPath();for(let i=0;i<5;i++){const a=i/5*TAU;g.moveTo(Math.cos(a)*r*.6+r*.5,Math.sin(a)*r*.6);g.arc(Math.cos(a)*r*.6,Math.sin(a)*r*.6,r*.5,0,TAU)}g.fill();g.stroke();

/* ================= お城の飛び出し ================= */
function drawPopup(g){

      for(let i=1;i<6;i++){const tt=i/6,x=lerp(a[0],b[0],tt),y=lerp(a[1],b[1],tt)+Math.sin(tt*Math.PI)*.3*U;const s=eob((gs-i*.05)*1.4);if(s<=0)continue;
        g.save();g.translate(x,y);g.scale(1,s);g.beginPath();g.moveTo(-.16*U,0);g.lineTo(.16*U,0);g.lineTo(0,.36*U);g.closePath();g.fillStyle=CONF[(i+j)%6];g.fill();g.stroke();g.restore();}

/* ================= 入力 ================= */
let drag=null,selected=null;
function locked(){return S.cer.state===1||!!S.night||!!S.turn}
function hitSticker(p){
  let best=null,bd=1e9;
  for(let i=STL.length-1;i>=0;i--){
    const s=STL[i];if(s.hidden||s.attach.k==='fly') continue;
    const r=Math.max(stR(s)*1.25,24);
    let d=dist(p.x,p.y,s.x,s.y-(s.type==='chair'?.1*U:0));
    if(s.type==='chair'){const sp=s.attach.k==='spot'?S.spots[s.attach.i]:null;const occ=sp&&sp.guest&&A[sp.guest].state==='sitting';if(occ){d=Math.min(d,dist(p.x,p.y,s.x,s.y-.95*U))}}
    if(d<r&&d<bd){bd=d;best=s}
  }
  return best;
}
function hitActor(p){
  for(const a of AL){if(a.hidden)continue;const cy=a.y-(a.kind==='butterfly'||a.kind==='bird'?0:.8*U);if(dist(p.x,p.y,a.x,cy)<.8*U) return a;}
  return null;
}
function ptOf(e){return{x:e.clientX,y:e.clientY}}
function pickUp(s,p,e){
  drag={pid:e.pointerId,sid:s.id,sx:p.x,sy:p.y,x:s.x,y:s.y,gx:s.x-p.x,gy:s.y-p.y,t0:performance.now(),moved:false,prev:s.attach};
  s.lift=Math.max(s.lift,.35);s.sqv-=6;SFX.lift();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
}
function onDown(e){
  e.preventDefault();audioInit();S.idle=0;S.demo=null;
  if(drag) return; // 2本目以降の指は無視
  const p=ptOf(e);
  if(locked()){const s=hitSticker(p);if(s){s.wig=1;SFX.wiggle()}return}
  const s=hitSticker(p);
  if(selected&&ST[selected]){
    const sel=ST[selected];
    if(s===sel){selected=null;sel.sqv+=4;SFX.drop();return}
    if(!s||s.locked){ // タップした先へ運ぶ
      selected=null;const from=sel.attach;sel.attach={k:'fly',to:{x:p.x,y:p.y-.2*U}};SFX.peel();
      const toP={x:p.x,y:p.y};after(.22,()=>{if(sel.attach.k==='fly'){sel.attach=from;dropSticker(sel,toP,from)}});return;
    }
    selected=null;
  }
  if(s){
    if(s.locked){s.wig=1;SFX.wiggle();return}
    pickUp(s,p,e);return;
  }
  const a=hitActor(p);
  if(a){a.hv=Math.min(a.hv,-2.2*U);SFX.wiggle();return}
}
function onMove(e){
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  const p=ptOf(e),s=ST[drag.sid];
  if(!drag.moved&&dist(p.x,p.y,drag.sx,drag.sy)>9){
    drag.moved=true;s.attach={k:'drag'};SFX.peel();
    if(s.type==='chair'){const o=occupantOf(s);if(o)o.carried=true;}
  }
  if(drag.moved){
    const k=clamp(dist(p.x,p.y,drag.sx,drag.sy)/(2*U),0,1);
    drag.x=p.x+drag.gx*(1-k);drag.y=p.y+lerp(drag.gy,-.6*U,k);
  }
  S.idle=0;
}
function onUp(e){
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  const s=ST[drag.sid],d=drag;drag=null;
  try{cv.releasePointerCapture(e.pointerId)}catch(err){}
  if(!d.moved){ // タップ：選ぶ
    if(performance.now()-d.t0<600){selected=s.id;}
    return;
  }
  const o=s.type==='chair'?occupantOf(s):null;if(o)o.carried=false;
  dropSticker(s,{x:d.x,y:d.y},d.prev);
}
function cancelDrag(){
  if(!drag) return;
  const s=ST[drag.sid];if(s&&s.attach.k==='drag'){s.attach=drag.prev;s.sqv+=3}
  if(s&&s.type==='chair'){const o=occupantOf(s);if(o)o.carried=false;}
  drag=null;
}
function onCancel(e){if(drag&&e.pointerId===drag.pid) cancelDrag()}
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp,{passive:false});
window.addEventListener('pointercancel',onCancel);
cv.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.pid){/* 指が残る場合はwindowで拾う */}});
['touchstart','touchmove','touchend','gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('blur',cancelDrag);
window.addEventListener('resize',()=>{resizeQueued=true});
window.addEventListener('orientationchange',()=>{resizeQueued=true});

/* ================= 貼る相手（隣接判定） ================= */
function occupantOf(ch){if(ch.attach.k!=='spot'&&ch.attach.k!=='drag')return null;for(const id of ORDER){const g=A[id];if(g.state==='sitting'&&S.spots[g.spot]&&S.spots[g.spot].chair===ch.id)return g}return null}
const RAD=()=>2.0*U;
function candidates(s){
  const c=[],add=(id,pts,extra)=>c.push(Object.assign({id,pts},extra||{}));
  const gp=gateP(),gc=archC();
  const guests=ORDER.map(id=>A[id]).filter(a=>guestArrived(a)&&a.state!=='parade');
  const actorPt=a=>({x:a.x,y:a.y-.8*U});
  switch(s.type==='star2'?'star':s.type){
    case 'flower':add('gate',[{x:gc.x-1.4*U,y:gc.y},bfHome(),{x:gc.x,y:gc.y+.5*U},{x:A.butterfly.x,y:A.butterfly.y}]);add('carriage',[{x:A.carriage.x,y:A.carriage.y-.8*U},{x:A.carriage.x+1.2*U*A.carriage.face,y:A.carriage.y-.6*U}]);break;
    case 'crown':add('carriage',[{x:A.carriage.x,y:A.carriage.y-.9*U}]);if(S.brideState!=='ride')add('bride',[actorPt(A.bride)]);break;
    case 'bell':add('perch',[perchPos(),{x:P('tree').x,y:P('tree').y-1.5*U}]);add('keeper',[actorPt(A.keeper)]);break;
    case 'ribbon':add('carriage',[{x:A.carriage.x,y:A.carriage.y-.8*U},{x:A.carriage.x+1.2*U*A.carriage.face,y:A.carriage.y-.6*U}]);add('table',[{x:P('gift').x,y:P('gift').y-.8*U}]);break;
    case 'heart':
      if(S.cer.state===0) add('couple',[actorPt(A.bride),actorPt(A.groom),{x:gc.x,y:gc.y+.6*U}]);
      else{add('couple',[actorPt(A.bride),actorPt(A.groom)]);guests.forEach(a=>add(a.id,[actorPt(a)]));add('carriage',[{x:A.carriage.x,y:A.carriage.y-.8*U}]);}
      break;
    case 'gift':guests.forEach(a=>add(a.id,[actorPt(a)]));if(S.brideState==='altar'||S.brideState==='wait'){add('bride',[actorPt(A.bride)])}add('groom',[actorPt(A.groom)]);break;
    case 'star':add('gate',[{x:gc.x,y:gc.y-ARCH_R()},gc,{x:gc.x,y:gp.y-.8*U}]);break;
    case 'chair':guests.forEach(a=>{if(occupantOf(s)!==a&&a.state!=='yield'&&a.state!=='yield2')add(a.id,[actorPt(a),{x:a.x,y:a.y}])});break;
  }
  return c;
}
function bestCandidate(s,p,mult){
  let best=null,bd=RAD()*(mult||1);
  for(const c of candidates(s)) for(const q of c.pts){const d=dist(p.x,p.y,q.x,q.y);if(d<bd){bd=d;best=c}}
  return best;
}
function inTray(p){const t0=trayPos(0),t3=trayPos(3);return p.y>t0.y-1.1*U&&p.y<t0.y+1.1*U&&p.x>t0.x-1.2*U&&p.x<t3.x+1.2*U}

function stickOK(s,attach){s.attach=attach;s.sq=0;s.sqv=-9;s.lift=0;SFX.stick();const t=stickerTarget(s);burst(t.x,t.y,false);}
function dropLoose(s,p){
  if(s.home.k==='tray'&&inTray(p)){s.attach=s.home;}
  else s.attach=looseAt(p);
  s.sqv=-6;SFX.drop();
}
function dropSticker(s,p,prev){
  s.lift=0;
  const c=bestCandidate(s,p);
  switch(s.type==='star2'?'star':s.type){
    case 'flower':
      if(c&&c.id==='gate'){stickOK(s,{k:'obj',id:'gate',ox:-1.85,oy:-.65});if(!S.awake)wakeButterfly();return}
      if(c&&c.id==='carriage'){stickOK(s,{k:'obj',id:'carriage',ox:-1.15,oy:-1.2});A.carriage.hv=-2*U;if(!S.awake&&dist(A.butterfly.x,A.butterfly.y,p.x,p.y)<RAD())wakeButterfly();return}
      break;
    case 'crown':
      if(c&&c.id==='carriage'){stickOK(s,{k:'obj',id:'carriage',ox:0,oy:-1.62});A.carriage.hv=-2.5*U;emit('petal',A.carriage.x,A.carriage.y-U,10,{colors:PETALS,up:1});return}
      if(c&&c.id==='bride'){stickOK(s,{k:'obj',id:'bride',ox:0,oy:-1.55});A.bride.anim='happy';A.bride.animT=1.5;return}
      break;
    case 'bell':
      if(c&&c.id==='perch'){stickOK(s,{k:'obj',id:'perch',ox:-.85,oy:.55});S.callT=.4;A.bird.hv=-2*U;return}
      if(c&&c.id==='keeper'){stickOK(s,{k:'obj',id:'keeper',ox:-.72,oy:-1.15});S.callT=.4;A.keeper.anim='happy';A.keeper.animT=.8;return}
      break;
    case 'ribbon':
      if(c&&c.id==='carriage'){stickOK(s,{k:'obj',id:'carriage',ox:1.0*A.carriage.face,oy:-1.05});A.carriage.hv=-2*U;
        if(S.brideState==='wait'&&!S.fetch) after(.5,startFetch); else {S.carShake=1;SFX.clop();}return}
      if(c&&c.id==='table'){stickOK(s,{k:'obj',id:'table',ox:.95,oy:-.75});if(S.box==='plain')wrapGift();return}
      break;
    case 'heart':
      if(S.cer.state===0){
        if(c&&c.id==='couple'){
          if(S.blooms>=12&&S.brideState==='altar'&&!A.bride.ride){stickOK(s,{k:'obj',id:'couple',ox:0,oy:-1.95});startCeremony();return}
          rejectHeart(s);return;
        }
      } else if(S.cer.state===2&&c){
        stickOK(s,{k:'obj',id:c.id,ox:0,oy:c.id==='couple'?-1.95:c.id==='carriage'?-1.9:-1.9});S.leader=c.id;startParade();return;
      }
      break;
    case 'gift':
      if(c){stickOK(s,{k:'obj',id:c.id,ox:.5,oy:-.75});receiveGift(A[c.id]);return}
      break;
    case 'star':
      if(c&&c.id==='gate'&&!S.night){stickOK(s,{k:'obj',id:'gate',ox:0,oy:-3.15});startNight(s.type==='star2');return}
      break;
    case 'chair':
      if(dropChair(s,p,c,prev)) return;
      return;
  }
  dropLoose(s,p);
}
function wakeButterfly(){
  S.awake=true;const b=A.butterfly;b.mode='weave';SFX.big();emit('spark',b.x,b.y,10,{sp:2,life:.8,color:'#fff6b0',g:0});
  A.bride.look=b;
}
function rejectHeart(s){
  s.attach=s.home;s.sqv=8;SFX.reject();
  if(S.blooms<12){S.needGate=2.4;S.gateShake=1;A.butterfly.hv=-2*U;A.groom.anim='worried';A.groom.animT=1.4}
  if(S.brideState!=='altar'){S.needBride=2.4;A.groom.anim='reach';A.groom.animT=1.8;A.bride.anim='wave';A.bride.animT=1.8;S.carShake=1;}
}

/* ================= 椅子 ================= */
function setChairSpot(ch,i){
  for(const sp of S.spots) if(sp.chair===ch.id) sp.chair=null;
  S.spots[i].chair=ch.id;ch.attach={k:'spot',i};
}
function freeSpotNear(i,excl,p){
  let best=-1,bd=1e9;
  for(let j=0;j<SPOTS;j++){if(j===excl||S.spots[j].guest||S.spots[j].chair&&j!==excl&&false)continue;
    if(S.spots[j].guest) continue;
    const d=p?dist(p.x,p.y,spotPos(j).x,spotPos(j).y):Math.abs(j-i)*10;if(d<bd){bd=d;best=j}}
  return best;
}
function moveGuestSpot(g,j){if(S.spots[g.spot]&&S.spots[g.spot].guest===g.id)S.spots[g.spot].guest=null;g.spot=j;S.spots[j].guest=g.id}
function dropChair(ch,p,c,prev){
  const O=occupantOf(ch);
  const oldSpot=prev.k==='spot'?prev.i:-1;
  if(c&&A[c.id]){
    const G=A[c.id];
    if(G.state==='standing'){
      // 立っている客の隣へ：座る（乗っていた客とは席を譲り合う）
      setChairSpot(ch,G.spot);ch.sqv=-9;SFX.stick();burst(ch.x,ch.y-.5*U,false);
      if(O){
        const j=freeSpotNear(G.spot,G.spot,{x:spotPos(G.spot).x,y:spotPos(G.spot).y});
        moveGuestSpot(O,j>=0?j:(oldSpot>=0?oldSpot:G.spot));
        O.state='yield';G.state='yield';O.look=G;G.look=O;O.anim='bow';O.animT=1.8;G.anim='bow';G.animT=1.8;
        emit('heart',(O.x+G.x)/2,G.y-1.5*U,4,{sp:.6,life:1.4,g:-.4});
        after(1.9,()=>{if(G.state==='yield'){G.state=chairAt(G.spot)?'sitting':'standing';G.anim='wave';G.animT=1.6}if(O.state==='yield'){O.state='standing';O.anim='happy';O.animT=1.2}SFX.stick();});
      } else {G.state='sitting';G.anim='wave';G.animT=1.8;G.hv=-2*U;}
      return true;
    }
    if(G.state==='sitting'){
      // 座っている客の隣へ：隣の空き席に置く
      const gi=G.spot;let j=-1;
      const cand=[gi-1,gi+1].filter(k=>k>=0&&k<SPOTS&&!S.spots[k].chair&&(!S.spots[k].guest||(O&&S.spots[k].guest===O.id)));
      if(cand.length){cand.sort((a,b)=>dist(p.x,p.y,spotPos(a).x,spotPos(a).y)-dist(p.x,p.y,spotPos(b).x,spotPos(b).y));j=cand[0]}
      if(j<0){ // 隣が空いていない：一番近い空き
        let bd=1e9;for(let k=0;k<SPOTS;k++){if((S.spots[k].chair&&S.spots[k].chair!==ch.id)||(S.spots[k].guest&&(!O||S.spots[k].guest!==O.id)))continue;const d=Math.abs(k-gi);if(d<bd){bd=d;j=k}}
      }

function updStickers(dt){
  for(const s of STL){
    if(s.hidden) continue;
    const t=stickerTarget(s);

    if(s.attach.k==='drag'){ // 吸着の予感：近い相手へ少し引き寄せ
      const c=bestCandidate(s,t,1.0);
      S.notice=c?{id:c.id,s}:null;
      if(c){let q=c.pts[0];tx=lerp(tx,q.x,.18);ty=lerp(ty,q.y,.18)}
    }
    const k=s.attach.k==='drag'?Math.min(1,dt*28):s.attach.k==='fly'?Math.min(1,dt*16):Math.min(1,dt*12);
    const ox=s.x,oy=s.y;s.x+=(tx-s.x)*k;s.y+=(ty-s.y)*k;
    s.vx=lerp(s.vx,(s.x-ox)/Math.max(dt,1e-3),.3);s.vy=lerp(s.vy,(s.y-oy)/Math.max(dt,1e-3),.3);

    s.lift+=((lifted?1:0)-s.lift)*Math.min(1,dt*(lifted?30:14));

function updParticles(dt){

    p.vy+=p.g*U*dt;p.vx*=1-dt*1.5;p.vy*=1-dt*(p.type==='petal'?1.8:.6);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.type==='firefly'){p.vx+=(R()-.5)*U*dt*3;p.vy+=(R()-.5)*U*dt*3}}

function update(dt){
  if(resizeQueued) doResize();

  const locked_=locked();
  if(!drag&&!locked_) S.idle+=dt;
  for(let i=S.timers.length-1;i>=0;i--){const tm=S.timers[i];tm.t-=dt;if(tm.t<=0){S.timers.splice(i,1);tm.fn()}}
  S.callT-=dt;
  if(S.gateShake>0)S.gateShake=Math.max(0,S.gateShake-dt*1.2);
  if(S.carShake>0)S.carShake=Math.max(0,S.carShake-dt*1.5);
  if(S.gateGlow>0&&!S.night)S.gateGlow=Math.max(S.cer.state===2?.25:0,S.gateGlow-dt*.6);
  if(S.needGate>0)S.needGate-=dt;if(S.needBride>0)S.needBride-=dt;
  if(S.box==='wrap')S.boxT+=dt;
  updCeremony(dt);updParade(dt);updNight(dt);updTurn(dt);
  updButterfly(dt);updBird(dt);updKeeper(dt);updSeating(dt);updPairs(dt);
  for(const a of AL){if(a.kind==='butterfly'||a.kind==='bird'){a.hop+=a.hv*dt;a.hv+=(-a.hop*160-a.hv*9)*dt;continue}moveActor(a,dt);}
  // 花嫁のそわそわ
  const b=A.bride;if(!b.anim&&S.brideState==='wait'&&(S.t%4.2)<dt){b.anim='ear';b.animT=1.1}
  updStickers(dt);updParticles(dt);
  // ヒント
  S.hint=computeHint();
  if(S.hint&&S.hint.key!==S.lastHintKey){S.lastHintKey=S.hint.key;S.idle=Math.min(S.idle,1)}
  if(S.hint&&!drag&&!selected&&S.idle>4&&!demoShown[S.hint.key]&&!S.demo&&!locked_){demoShown[S.hint.key]=1;S.demo={t:0,h:S.hint}}
  if(S.demo){S.demo.t+=dt;if(S.demo.t>2.6||drag)S.demo=null}
  if(S.hint&&S.idle>1.5){S.hintHop-=dt;if(S.hintHop<=0){S.hintHop=2.2;const s=ST[S.hint.sid];if(s&&!s.hidden&&s.attach.k!=='drag'){s.hopV=-3.2*U;s.sqv-=3}const la=S.hint.look&&A[S.hint.look];if(la&&la.kind!=='butterfly')la.hv=-1.6*U;}}
  if(S.flash>0)S.flash=Math.max(0,S.flash-dt*1.6);
  if(S.polaroid)S.polaroid.t+=dt;
}

function drawActor(g,a){

  if(S.hint&&S.hint.look===a.id&&!noticed){const s=ST[S.hint.sid];if(s&&!s.hidden)look=s}

      for(let x=0;x<=W;x+=W/24){const y=PR.y+(1.0+j*.5)*U+Math.sin(x/W*6+S.t*.8+j)*.5*U;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();}

  // 提灯
  g.save();const sp0=spotPos(0),sp4=spotPos(SPOTS-1);
  for(let i=0;i<6;i++){const x=lerp(sp0.x-U,sp4.x+U,i/5),y=sp0.y-2.4*U+Math.sin(i*1.3)*.2*U;const s=eob((n.t-1-i*.15)/.5);if(s<=0)continue;g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle=OUT;g.lineWidth=1.5;g.beginPath();g.moveTo(0,-.4*U);g.lineTo(0,-.2*U);g.stroke();g.fillStyle=['#ffb3c7','#ffe08a','#bfe3f7'][i%3];g.beginPath();g.ellipse(0,0,.18*U,.24*U,0,0,TAU);g.fill();g.stroke();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(0,0,0,0,0,.6*U);gr.addColorStop(0,'rgba(255,220,150,.5)');gr.addColorStop(1,'rgba(255,220,150,0)');g.fillStyle=gr;g.fillRect(-.6*U,-.6*U,1.2*U,1.2*U);g.restore();}
  g.restore();
}
function drawPhotoCorner(g){
  const ph=P('photo'),pw=1.7*U,phh=1.3*U;
  let img=photoImg;
  const pol=S.polaroid;
  if(pol&&pol.t<2.2){
    // 撮った写真が手帳の角へ飛んでいく
    const k=ease((pol.t-.5)/1.4);const cx=lerp(W/2,ph.x,k),cy=lerp(H/2,ph.y,k),sc=lerp(3.2,1,k);
    g.save();g.translate(cx,cy);g.rotate(lerp(0,-.08,k));g.scale(sc,sc);polaroid(g,pol.img,pw,phh);g.restore();
    return;
  }
  if(!img) return;
  g.save();g.translate(ph.x,ph.y);g.rotate(-.08);polaroid(g,img,pw,phh);g.restore();
}
function polaroid(g,img,pw,phh){
  g.fillStyle='rgba(100,80,70,.18)';g.fillRect(-pw/2+3,-phh/2+4,pw,phh);
  g.fillStyle='#fffefa';g.fillRect(-pw/2,-phh/2,pw,phh);
  const ip=.08*U,iw=pw-ip*2,ih=phh-ip*2-.18*U;
  try{const iwh=(img.width||img.naturalWidth),ihh=(img.height||img.naturalHeight);const sc=Math.max(iw/iwh,ih/ihh);const sw=iw/sc,sh=ih/sc;g.drawImage(img,(iwh-sw)/2,(ihh-sh)/2,sw,sh,-pw/2+ip,-phh/2+ip,iw,ih)}catch(e){}
  g.strokeStyle='rgba(150,130,120,.5)';g.lineWidth=1;g.strokeRect(-pw/2,-phh/2,pw,phh);
  g.fillStyle='rgba(255,220,150,.7)';g.save();g.rotate(.15);g.fillRect(-.3*U,-phh/2-.12*U,.6*U,.22*U);g.restore();
}
function drawTurn(g){
  const tr=S.turn;if(!tr) return;
  const t=tr.t;let x;
  if(t<.8)x=lerp(W*1.05,-.05*W,ease(t/.8));else x=lerp(-.05*W,-W*1.1,ease((t-.8)/.9));
  g.save();
  g.fillStyle='#fbf5e8';g.fillRect(x,0,W*1.1,H);
  const gr=g.createLinearGradient(x-30,0,x+20,0);gr.addColorStop(0,'rgba(80,60,50,0)');gr.addColorStop(1,'rgba(80,60,50,.25)');g.fillStyle=gr;g.fillRect(x-30,0,50,H);
  g.strokeStyle='rgba(150,130,110,.4)';g.lineWidth=2;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
  g.restore();
}
function render(){
  const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);
  if(bg) g.drawImage(bg,0,0,W,H);
  drawPopup(g);
  drawGate(g);
  drawDoor(g);
  drawTable(g);
  // y順で並べる（椅子は座る客の後ろ）
  const list=[];
  for(const a of AL){if(a.hidden)continue;if(a.kind==='butterfly'||a.kind==='bird')continue;list.push({y:a.y+(a.ride?.6*U:0)+(a.kind==='carriage'?-.01:0),a})}
  for(const s of STL){if(s.type==='chair'&&!s.hidden&&s.attach.k!=='drag'&&!(selected===s.id))list.push({y:s.y-.02,s})}
  list.sort((p,q)=>p.y-q.y);
  for(const it of list){if(it.a){if(it.a.kind!=='carriage')drawShadow(g,it.a.x,it.a.y,.42*U,.1*U,.15);drawActor(g,it.a)}else drawSticker(g,it.s)}
  // 椅子を運ぶとき座った客もいっしょ
  drawHintGlow(g);
  drawNotice(g);
  const top=[];
  for(const s of STL){if(s.hidden)continue;if(s.type==='chair'&&s.attach.k!=='drag'&&selected!==s.id)continue;if((drag&&drag.sid===s.id)||selected===s.id||s.attach.k==='fly'){top.push(s);continue}drawSticker(g,s)}
  for(const s of top){drawSticker(g,s);if(s.type==='chair'){const o=occupantOf(s);if(o){const ox=o.x,oy=o.y;o.x=s.x;o.y=s.y-s.lift*.28*U;drawActor(g,o);o.x=ox;o.y=oy;}}}
  for(const a of[A.bride,A.groom])if(a.ride)drawActor(g,a);
  drawActor(g,A.butterfly);drawActor(g,A.bird);
  for(const p of parts)drawParticle(g,p);
  drawFlyers(g);
  drawNight(g);
  if(S.capture){S.capture=false;capturePhoto();}
  if(S.flash>0){g.fillStyle='rgba(255,255,255,'+S.flash+')';g.fillRect(0,0,W,H)}
  drawPhotoCorner(g);
  drawDemo(g);
  drawTurn(g);
}

/* ================= ループ ================= */
let raf=0,last=0,running=false;
function frame(ts){
  raf=0;if(!running) return;
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;dt=Math.min(dt,1/20);
  try{update(dt);render();}catch(e){if(!frame.err){frame.err=1;console.warn(e)}}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame)}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();cancelDrag();selected=null;try{if(AC&&AC.state==='running')AC.suspend()}catch(e){}}
  else{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}start()}
});

doResize();initWorld(null);loadPhoto();start();

/* テスト用の観察口（ゲームには影響しない） */
window.__pt={get S(){return S},get A(){return A},get ST(){return ST},get U(){return U},get PR(){return PR},
  hint:()=>computeHint(),parts:()=>parts.length,photo:()=>!!photoImg,
  pos:id=>{const o=ST[id]||A[id];return o?{x:o.x,y:o.y}:null},drag:()=>drag,selected:()=>selected,running:()=>running};
})();
</script>
