<script>
'use strict';
(function(){
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), saEl=document.getElementById('sa');
const Q=new URLSearchParams(location.search);
const FORCE_CROWN=Q.get('crown')==='1';
const TAU=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eob=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const hyp=Math.hypot;
let W=1,H=1,DPR=1,L=null,bg=null,fg=null,WG=null,now=0,needLayout=true;

/* ================= AUDIO (Web Audio synth) ================= */
const AU={c:null,out:null,nb:null,str:null};
function audioStart(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      AU.c=new AC();
      const comp=AU.c.createDynamicsCompressor();
      AU.out=AU.c.createGain(); AU.out.gain.value=.5;
      AU.out.connect(comp); comp.connect(AU.c.destination);
      const n=AU.c.sampleRate|0; AU.nb=AU.c.createBuffer(1,n,AU.c.sampleRate);
      const d=AU.nb.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }
    if(AU.c.state==='suspended'&&!document.hidden){const p=AU.c.resume(); if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
}
const aok=()=>AU.c&&AU.c.state!=='closed'&&!document.hidden;
function tone(f,d,o){o=o||{}; if(!aok())return; try{
  const c=AU.c,t=c.currentTime+(o.at||0),a=o.a||.006;
  const os=c.createOscillator(),g=c.createGain(); os.type=o.type||'sine';
  os.frequency.setValueAtTime(f,t); if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t+a+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.v||.15,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
  os.connect(g); g.connect(AU.out); os.start(t); os.stop(t+a+d+.03);
}catch(e){}}
function noise(d,o){o=o||{}; if(!aok())return; try{
  const c=AU.c,t=c.currentTime+(o.at||0); const s=c.createBufferSource(); s.buffer=AU.nb;
  const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1200,t);
  if(o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo,t+d); f.Q.value=o.q||1;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.v||.15,t+(o.a||.01)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(AU.out); s.start(t,Math.random()*.4); s.stop(t+d+.05);
}catch(e){}}
function strStart(){ if(!aok())return; strStop(); try{const c=AU.c,o=c.createOscillator(),g=c.createGain(); o.type='triangle'; o.frequency.value=300; g.gain.value=.0001; o.connect(g); g.connect(AU.out); o.start(); AU.str={o,g};}catch(e){} }
function strSet(l){ if(!AU.str)return; try{const t=AU.c.currentTime; AU.str.o.frequency.setTargetAtTime(260+l*560,t,.03); AU.str.g.gain.setTargetAtTime(l>.03?.015+l*.045:.0001,t,.05);}catch(e){} }
function strStop(){ if(!AU.str)return; try{const t=AU.c.currentTime; AU.str.g.gain.setTargetAtTime(.0001,t,.03); AU.str.o.stop(t+.25);}catch(e){} AU.str=null; }
const SFX={
  select(){tone(392,.12,{to:660,v:.16}); tone(784,.1,{at:.06,v:.06,type:'triangle'});},
  snap(p){p=p||1; noise(.05,{f:3600,q:.8,v:.22}); tone(900*p,.06,{type:'triangle',to:1600*p,v:.18}); tone(1400*p,.1,{at:.05,v:.07});},
  boing(){tone(270,.3,{to:150,v:.15}); tone(200,.22,{at:.08,type:'triangle',to:250,v:.05});},
  pull(){tone(480,.07,{to:820,v:.08});},
  success(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.24,{type:'triangle',at:i*.075,v:.13})); noise(.7,{f:6500,q:.6,v:.05,at:.12});},
  splash(s){s=s||1; noise(.3*s+.12,{type:'lowpass',f:1500,fTo:300,v:.2*s}); tone(240,.18,{to:90,v:.09*s});},
  quack(p){p=p||1; tone(560*p,.09,{type:'square',to:380*p,v:.05}); tone(520*p,.08,{type:'square',to:350*p,v:.045,at:.12});},
  seal(){tone(280,.12,{to:430,v:.12}); tone(430,.2,{at:.12,to:250,v:.11});},
  ribbit(p){p=p||1; tone(170*p,.06,{type:'square',v:.06}); tone(230*p,.07,{type:'square',v:.06,at:.09});},
  jump(h){tone(300,.22*h+.1,{to:320+760*h,v:.09});},
  stream(s,d){noise(d,{f:300+s*1000,fTo:220+s*500,q:2,v:.05+.1*s,a:.08}); tone(180+s*240,d*.6,{to:240+s*360,v:.035});},
  pop(p){p=p||1; tone(820*p,.04,{to:1500*p,v:.06});},
  fanfare(){const n=[[523,659,784],[587,740,880],[659,831,988],[784,988,1175,1568]]; n.forEach((ch,i)=>ch.forEach(f=>tone(f,i==3?.7:.22,{type:'triangle',at:i*.2,v:.08})));},
  inflate(i){tone(380+i*90,.2,{type:'triangle',to:600+i*130,v:.12}); noise(.12,{f:2600,v:.05});},
  whoosh(){noise(.7,{f:500,fTo:2600,q:1.5,v:.13});},
  crown(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.18,{at:i*.06,v:.08,type:'triangle'}));},
  tick(){tone(1500,.03,{v:.035});},
  plug(){tone(170,.08,{type:'square',v:.07}); noise(.6,{f:900,fTo:2500,q:.7,v:.13,at:.05});},
  rise(){tone(200,1.6,{to:800,v:.06,type:'triangle'}); noise(1.6,{f:600,fTo:3000,q:.8,v:.06});}
};

/* ================= DATA ================= */
const KINDS=['duck','seal','frog'];
const SLOTS={duck:['body','beak','feet'],seal:['body','fin'],frog:['body','legs']};
const DORDER={duck:['feet','body','beak'],seal:['fin','body'],frog:['legs','body']};
const SLOTOFF={duck:{body:[0,-.15],beak:[1.0,-.7],feet:[.07,.82]},seal:{body:[.1,-.05],fin:[-1.32,.05]},frog:{body:[0,-.05],legs:[0,.62]}};
const TYPES=['duckBody','beak','feet','sealBody','finBig','finSmall','frogBody','legLong','legShort'];
const PDEF={duckBody:{an:'duck',slot:'body',c:[0,-.15]},beak:{an:'duck',slot:'beak',c:[1.0,-.7]},feet:{an:'duck',slot:'feet',c:[.07,.82]},
  sealBody:{an:'seal',slot:'body',c:[.1,-.05]},finBig:{an:'seal',slot:'fin',c:[-1.42,.05]},finSmall:{an:'seal',slot:'fin',c:[-1.24,.05]},
  frogBody:{an:'frog',slot:'body',c:[0,-.05]},legLong:{an:'frog',slot:'legs',c:[0,.6]},legShort:{an:'frog',slot:'legs',c:[0,.62]}};
const SWAP={fin:true,legs:true};
const SS={beak:2.1,feet:1.7,finSmall:1.3,legShort:1.2};
const ssOf=t=>SS[t]||1;
const COL={duck:['#ffd95a','#fff8cf','#eeaa2c'],orange:['#ff9d5c','#ffdcbf','#e46c31'],seal:['#9fc3ea','#eef6ff','#6890c4'],
  fin:['#86addf','#dcebff','#587fba'],frog:['#8edb8f','#e6ffdf','#4ca95f'],leg:['#79cf86','#d9ffd6','#46995a']};
const SHC='#7d6cab', SOCK_D='#4f3f86', SOCK_L='#cfc4ee';
const IS={u:.42,v:-.24,r:.17};       // bubble island (normalized water coords)
const WZ={u:.84,v:-.42,r:.3};        // water wheel intake zone
const PW={u:-.6,v:-.62};             // where plug foam enters the water
const SLIDE_N=5;

function mkA(kind,i){return{kind,i,parts:{},st:'shadow',built:false,u:0,v:0,h:0,vu:0,vv:0,vh:0,face:1,sq:0,sqv:0,blink:rnd(1,4),mood:0,
  combo:0,lastTap:-9,trail:[],trailT:0,wob:0,popT:0,sockT:9,X:0,Y:0,RR:10,rot:0,hopT:rnd(1,3),arc:null,cp:null,isT:0,plugT:0,rideT:0,rideCD:0,sl:null,
  seed:Math.random()*10,fu:0,fv:0,ret:null};}
const AN={duck:mkA('duck',0),seal:mkA('seal',1),frog:mkA('frog',2)};
const PT={}; TYPES.forEach(t=>{PT[t]={t,...PDEF[t],st:'shelf',x:0,y:0,vx:0,vy:0,RR:10,wob:0,wv:0,owner:null};});

const G={cycle:0,order:[],lastOrder:[],relation:null,active:null,water:.15,faucet:0,fillFast:false,waterFlash:0,
  blobs:[],ring:{u:-.4,v:.22,vu:0,vv:0,rot:0},contrib:{duck:0,seal:0,frog:0},parkContrib:{duck:0,seal:0,frog:0},
  ov:{st:'none',t:0},slideIdx:0,openT:0,parkEver:false,slideProg:0,slideOpen:false,slides:0,tube:[],
  wheelAng:0,wheelSpd:0,wheelKick:0,carAng:0,stream:null,plugSq:0,decayT:0,
  crown:{st:'none',u:0,v:0,x:0,y:0,t:0,owner:null,spawned:false,px:0,py:0},leader:null,
  fin:{st:'none',t:0,q:[],next:0},parkSwaps:0,
  disc:{1:false,2:false,3:false,4:false,5:false,6:false},F:{},log:[],
  lastInput:0,handShown:{},hand:null,tgt:null,ripples:[],fx:[],P:[],firstTap:false,inputs:0};
const F=G.F;
function logEv(ev){G.log.push({t:+now.toFixed(2),cycle:G.cycle,ev}); if(G.log.length>400)G.log.shift();}
function setDisc(n){ if(!G.disc[n]){G.disc[n]=true; logEv('DISCOVERY '+n);} }

/* ================= LAYOUT ================= */
function layout(){
  needLayout=false;
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight); DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  const cs=getComputedStyle(saEl);
  const sa={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  const port=H>=W;
  const top=sa.t,bot=H-sa.b,left=sa.l,right=W-sa.r,iw=right-left,ih=bot-top;
  const u=port?Math.min(iw/400,ih/760):Math.min(iw/1000,ih/720);
  const o={port,u,top,bot,left,right,iw,ih};
  o.shelfH=port?Math.min(ih*.23,190*u):Math.min(ih*.17,140*u);
  o.wallBot=top+ih*(port?.355:.41);
  o.shelfTop=bot-o.shelfH;
  const mid=o.shelfTop-o.wallBot;
  o.cx=left+iw/2; o.rx=port?iw*.45:iw*.37;
  o.rimY=o.wallBot+mid*.27; o.ry=Math.min(o.rx*(port?.42:.25),mid*.22);
  o.tubBot=o.shelfTop-mid*.07; o.floorY=o.rimY+o.ry*.5;
  o.R=(port?30:36)*u; o.Rb=(port?28:31)*u;
  o.shY=top+(o.wallBot-top)*.56;
  o.shX=port?[left+iw*.2,left+iw*.5,left+iw*.8]:[left+iw*.28,left+iw*.5,left+iw*.72];
  o.op={x:o.cx,y:o.rimY+o.ry*.04,rx:o.rx*.92,ry:o.ry*.86};
  o.plug={x:o.cx-o.rx*.6,y:o.rimY-o.ry*.8};
  o.wheel={x:o.cx+o.rx*.9,y:o.rimY-o.ry*.4,r:(port?28:36)*u};
  o.faucet={x:o.cx+o.rx*.22,y:o.rimY-o.ry*1.0-16*u};
  o.Rs=port?Math.min(19*u,iw/5/4.4):Math.min(25*u,iw/9/4.6);
  o.slots={};
  const place=(arr,y)=>arr.forEach((t,i)=>{o.slots[t]={x:left+iw*(i+.5)/arr.length,y};});
  if(port){ place(TYPES.slice(0,4),o.shelfTop+o.shelfH*.33); place(TYPES.slice(4),o.shelfTop+o.shelfH*.76); o.boards=[o.shelfTop+o.shelfH*.33+o.Rs*1.0,o.shelfTop+o.shelfH*.76+o.Rs*1.0]; }
  else { place(TYPES,o.shelfTop+o.shelfH*.5); o.boards=[o.shelfTop+o.shelfH*.5+o.Rs*1.0]; }
  // park
  const wt=top,wb=o.wallBot,wh=wb-wt;
  o.park={y0:wt,y1:wb,car:{x:left+iw*(port?.68:.7),y:wt+wh*.5,r:(port?56:80)*u},
    sTop:{x:left+iw*(port?.15:.2),y:wt+wh*.24}};
  o.tubeY=wt+wh*.09;
  L=o;
  WG=waterGeom();
  renderBG();
}
function waterGeom(){const o=L.op,lv=G.water; return {x:o.x,y:o.y+(1-lv)*L.ry*.85,rx:o.rx*(.8+.17*lv),ry:o.ry*(.8+.17*lv)};}
const w2s=(u,v)=>({x:WG.x+u*WG.rx*.9,y:WG.y+v*WG.ry*.9});
const s2w=(x,y)=>({u:(x-WG.x)/(WG.rx*.9),v:(y-WG.y)/(WG.ry*.9)});
const nrm=px=>px/(WG.rx*.9);
function slidePts(){const s=L.park.sTop,e=w2s(-.5,-.08); return [s,{x:s.x+L.iw*.22,y:s.y+(L.wallBot-s.y)*.25},{x:e.x-L.iw*.06,y:e.y-(e.y-s.y)*.55},e];}
function bez(P,t){const m=1-t; return {x:m*m*m*P[0].x+3*m*m*t*P[1].x+3*m*t*t*P[2].x+t*t*t*P[3].x,y:m*m*m*P[0].y+3*m*m*t*P[1].y+3*m*t*t*P[2].y+t*t*t*P[3].y};}
function tubePts(){const w=L.wheel,s=L.park.sTop; return [{x:w.x,y:w.y},{x:w.x,y:L.tubeY},{x:s.x,y:L.tubeY},{x:s.x,y:s.y-14*L.u}];}
function polyAt(P,t){let len=0;const seg=[];for(let i=0;i<P.length-1;i++){const l=hyp(P[i+1].x-P[i].x,P[i+1].y-P[i].y);seg.push(l);len+=l;}
  let d=t*len;for(let i=0;i<seg.length;i++){if(d<=seg[i]||i==seg.length-1){const k=seg[i]?clamp(d/seg[i],0,1):0;return{x:lerp(P[i].x,P[i+1].x,k),y:lerp(P[i].y,P[i+1].y,k)};}d-=seg[i];}return P[0];}

/* ================= PRE-RENDER (wall tiles, floor, shelf, tub shell) ================= */
function mul(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function renderBG(){
  const o=L,u=o.u;
  bg=document.createElement('canvas'); bg.width=cv.width; bg.height=cv.height;
  const b=bg.getContext('2d'); b.setTransform(DPR,0,0,DPR,0,0);
  const R=mul(11);
  b.fillStyle='#f6e2e8'; b.fillRect(0,0,W,H);
  // wall mosaic
  const ts=Math.max(15,21*u), gap=Math.max(1.5,2.2*u);
  const pal=['#fde3ea','#e5f3ef','#ece6fa','#fff3df','#e2eefb','#fbe8f6','#f1f7e3'];
  for(let y=-ts*.3,row=0;y<o.floorY;y+=ts,row++){
    for(let x=(row%2)*-ts*.5;x<W;x+=ts){
      let c=pal[(R()*pal.length)|0];
      const yy=y+R()*1.2;
      b.fillStyle=c; rr(b,x+gap/2,yy+gap/2,ts-gap,ts-gap,ts*.22); b.fill();
      b.fillStyle='rgba(255,255,255,.55)'; rr(b,x+gap/2+ts*.12,yy+gap/2+ts*.1,ts*.42,ts*.16,ts*.08); b.fill();
    }
  }
  // flower motif tiles scattered (porcelain decoration)
  for(let i=0;i<14;i++){const x=R()*W,y=R()*(o.wallBot-o.top)+o.top; const s=ts*.32; b.fillStyle=['#f6b9cc','#b8dcd2','#cbbcf0'][i%3];
    for(let k=0;k<5;k++){const a=k/5*TAU; b.beginPath(); b.arc(x+Math.cos(a)*s,y+Math.sin(a)*s,s*.6,0,TAU); b.fill();}
    b.fillStyle='#fff3c4'; b.beginPath(); b.arc(x,y,s*.5,0,TAU); b.fill();}
  b.fillStyle='rgba(253,244,247,.42)'; b.fillRect(0,0,W,o.floorY);
  // wainscot band
  const wy=o.floorY-ts*1.3;
  for(let x=0,i=0;x<W;x+=ts*.75,i++){b.fillStyle=i%2?'#c9e9df':'#f4c6d6'; rr(b,x+1,wy,ts*.75-2,ts*.75,ts*.18); b.fill();}
  // floor
  const fg2=b.createLinearGradient(0,o.floorY,0,o.shelfTop); fg2.addColorStop(0,'#f2d5df'); fg2.addColorStop(1,'#ecc8d6');
  b.fillStyle=fg2; b.fillRect(0,o.floorY,W,o.shelfTop-o.floorY);
  b.strokeStyle='rgba(255,255,255,.45)'; b.lineWidth=1.2*u;
  for(let x=-W;x<W*2;x+=ts*1.6){b.beginPath(); b.moveTo(x,o.floorY); b.lineTo(o.cx+(x-o.cx)*1.8,o.shelfTop); b.stroke();}
  // shelf
  const sg=b.createLinearGradient(0,o.shelfTop,0,H); sg.addColorStop(0,'#dff1ec'); sg.addColorStop(1,'#c7e6de');
  b.fillStyle=sg; b.fillRect(0,o.shelfTop,W,H-o.shelfTop);
  b.fillStyle='rgba(120,150,150,.18)'; b.fillRect(0,o.shelfTop,W,4*u);
  o.boards.forEach(by=>{
    b.fillStyle='rgba(110,130,140,.18)'; rr(b,o.left+6*u,by+6*u,o.iw-12*u,9*u,5*u); b.fill();
    const bgd=b.createLinearGradient(0,by,0,by+10*u); bgd.addColorStop(0,'#fffafc'); bgd.addColorStop(1,'#f3d9e4');
    b.fillStyle=bgd; rr(b,o.left+4*u,by,o.iw-8*u,10*u,5*u); b.fill();
    b.fillStyle='rgba(255,255,255,.9)'; rr(b,o.left+10*u,by+1.5*u,o.iw-20*u,2.5*u,2*u); b.fill();
  });
  // tub floor shadow
  b.fillStyle='rgba(150,100,140,.16)'; b.beginPath(); b.ellipse(o.cx,o.tubBot+3*u,o.rx*1.03,13*u,0,0,TAU); b.fill();
  // tub ring (back) and opening
  const rg=b.createLinearGradient(0,o.rimY-o.ry,0,o.rimY+o.ry); rg.addColorStop(0,'#fffbfd'); rg.addColorStop(1,'#f6d7e3');
  b.fillStyle=rg; b.beginPath(); b.ellipse(o.cx,o.rimY,o.rx,o.ry,0,0,TAU); b.fill();
  const og=b.createLinearGradient(0,o.op.y-o.op.ry,0,o.op.y+o.op.ry); og.addColorStop(0,'#bcd5ea'); og.addColorStop(1,'#eef8fd');
  b.fillStyle=og; b.beginPath(); b.ellipse(o.op.x,o.op.y,o.op.rx,o.op.ry,0,0,TAU); b.fill();
  // tub front
  fg=document.createElement('canvas'); fg.width=cv.width; fg.height=cv.height;
  const f=fg.getContext('2d'); f.setTransform(DPR,0,0,DPR,0,0);
  const cx=o.cx,rx=o.rx,ry=o.ry,rimY=o.rimY,tb=o.tubBot;
  const body=()=>{f.beginPath(); f.moveTo(cx-rx,rimY); f.bezierCurveTo(cx-rx,tb-(tb-rimY)*.3,cx-rx*.97,tb,cx-rx*.82,tb);

/* ================= ANIMAL ACTIONS ================= */
const bathLike=a=>a.built&&(a.st==='bath'||a.st==='island'||a.st==='ride'||a.st==='car'||a.st==='carry'||a.st==='plug');

  G.order.push(a.kind); logEv('built '+a.kind+' order='+G.order.join('>'));

}
function carryDuck(d,big){
  const u0=d.u,v0=d.v; d.trail.length=0;
  if(big){ d.cp={t:0,dur:1.35,u0,v0,cu:(u0+IS.u)/2,cv:Math.min(v0,IS.v)-.3,u1:IS.u,v1:IS.v,big}; }
  else { const sg=v0<0?1:-1; d.cp={t:0,dur:2.4,u0,v0,cu:u0+.32,cv:v0+sg*.32,u1:clamp(u0+.3,-.6,.3),v1:v0+sg*.06,big}; }

}
function tapFrog(a){

  const c=comboOf(a), long=a.parts.legs==='legLong';
  G.contrib.frog++; F.frogTapped=true; if(parkOpen())G.parkContrib.frog++;
  SFX.ribbit(1+.05*c); SFX.jump(long?1:.35); a.sqv-=7;
  if(long){
    startArc(a,()=>({x:L.plug.x,y:L.plug.y-L.Rb*.75,R:L.Rb*.9}),(130+12*c)*L.u,.85,()=>{
      a.st='plug'; a.plugT=.45; G.plugSq=1; SFX.plug(); gush(c); F.frogLong=true; logEv('frog long legs reached plug: foam gush'); if(F.frogShort)setDisc(3);
    });
  } else {
    const tu=lerp(a.u,PW.u,.5), tv=lerp(a.v,PW.v,.45);
    startArc(a,()=>{const p=w2s(tu,tv);return{x:p.x,y:p.y,R:L.Rb*depthS(tv)};},(38+6*c)*L.u,.55,()=>{
      land(a,tu,tv,.55); spawnBlob(tu+.08,tv+.05,parkOpen()?.6:.1,.05,11);
      if(parkOpen()){let nb=null,bd=9; for(const b of G.blobs){const d=hyp(b.u-tu,b.v-tv); if(d<bd){bd=d;nb=b;}} if(nb){nb.vu+=.7;}}

}
function gush(c){

    spawnBlob(PW.u+rnd(-.05,.05),PW.v+rnd(-.05,.05),vu,vv,rnd(11,17));

  const p=L.plug; for(let i=0;i<12;i++) addP({x:p.x,y:p.y-8*L.u,vx:rnd(-60,140)*L.u,vy:rnd(-160,-60)*L.u,g:300*L.u,life:rnd(.6,1),r:rnd(4,8)*L.u,type:'foam'});
}
function tapCarousel(){

}
function seatPos(i){const c=L.park.car,a=G.carAng+i*TAU/3; return {x:c.x+Math.cos(a)*c.r*.82,y:c.y+c.r*.42+Math.sin(a)*c.r*.22,front:Math.sin(a)>0,a};}
function tapSlide(){

  const q=slideQueue(); const n=q.length; let a=null; for(let i=0;i<n;i++){const c=q[(G.slideIdx+i)%n]; if(tappable(c)){a=c; G.slideIdx=(G.slideIdx+i+1)%n; break;}}

function slideQueue(){ const arr=G.order.map(k=>AN[k]); if(G.leader){const i=arr.indexOf(G.leader); if(i>0){arr.splice(i,1); arr.unshift(G.leader);}} return arr; }

function spawnCrown(u,v){ const c=G.crown; c.st='rise'; c.u=u; c.v=v; c.t=0; c.spawned=true; SFX.crown(); logEv('crown appeared from bubble'); }
function wearCrown(a){ const c=G.crown; const prev=G.leader; c.st='worn'; c.owner=a; G.leader=a; a.mood=2; a.sqv+=7; SFX.crown();
  const h=HEAD[a.kind]; burst(a.X+h[0]*a.RR*a.face,a.Y+h[1]*a.RR,12,'spark','#fff2a8',150);

/* ================= SHADOW / PARTS ================= */
function selectShadow(a){
  const was=G.active; G.active=a; a.sqv+=9; a.sockT=0; a.wob=1; SFX.select();
  for(const t of TYPES) if(PT[t].an===a.kind&&PT[t].st==='shelf') PT[t].wv+=9;
  if(!G.firstTap){G.firstTap=true; logEv('first tap on '+a.kind+' shadow');}
  if(was!==a) logEv('select shadow '+a.kind);
}
function shadowSocket(a,slot){const c=SLOTOFF[a.kind][slot]; return {x:L.shX[a.i]+c[0]*L.R,y:L.shY+c[1]*L.R,R:L.R};}
function toySocket(a,slot){const c=SLOTOFF[a.kind][slot]; return {x:a.X+c[0]*a.RR*a.face,y:a.Y+c[1]*a.RR,R:a.RR};}
function findSocket(p,x,y){
  let best=null;
  for(const k of KINDS){const a=AN[k]; if(a.kind!==p.an) continue;
    let s=null,r=0;
    if(a.st==='shadow'&&!(a.parts[p.slot]===p.t)){ s=shadowSocket(a,p.slot); r=Math.max(70*L.u,2.3*L.R); }
    else if(bathLike(a)&&SWAP[p.slot]&&a.parts[p.slot]!==p.t&&G.fin.st==='none'){ s=toySocket(a,p.slot); r=Math.max(80*L.u,3*a.RR); }
    if(s){const d=hyp(s.x-x,s.y-y); if(d<r&&(!best||d/r<best.d/best.r)) best={...s,d,r,a,slot:p.slot};}
  }
  return best;
}
function wrongNear(p,x,y){
  for(const k of KINDS){const a=AN[k]; if(a.kind===p.an) continue;
    if(a.st==='shadow'&&hyp(L.shX[a.i]-x,L.shY-y)<L.R*2) return a;
    if(bathLike(a)&&hyp(a.X-x,a.Y-y)<a.RR*2.2) return a;}
  return null;
}
function attach(p,a){
  const slot=p.slot, old=a.parts[slot];
  const s=a.st==='shadow'?shadowSocket(a,slot):toySocket(a,slot);
  if(old&&old!==p.t){ const op=PT[old]; op.st='ret'; op.owner=null; op.x=s.x; op.y=s.y; op.vx=rnd(-120,120)*L.u; op.vy=-380*L.u; op.RR=s.R; }
  a.parts[slot]=p.t; p.st='att'; p.owner=a;
  a.sqv+=8; a.wob=.6; SFX.snap({body:1,beak:1.25,feet:1.12,fin:p.t==='finBig'?.85:1.3,legs:p.t==='legLong'?.8:1.35}[slot]);
  burst(s.x,s.y,7,'spark','#ffffff',110);
  if(a.st==='shadow'){
    G.active=a; a.sockT=Math.max(a.sockT,.2);
    logEv('attach '+p.t+' to '+a.kind+' shadow');
    if(SLOTS[a.kind].every(sl=>a.parts[sl])) becomeReal(a);
  } else {
    a.mood=1.2; logEv('swap '+(old||'-')+' -> '+p.t+' on '+a.kind+(parkOpen()?' (park)':''));
    if(a.kind==='seal'&&old&&old!==p.t&&parkOpen()){
      G.parkSwaps++; if(p.t==='finSmall')F.pBS=true; else F.pSB=true;
      logEv('park fin swap: wheel base -> '+(p.t==='finBig'?'FAST':'SLOW'));
      if(F.pBS&&F.pSB) setDisc(6);
    }
  }
}

/* ================= INPUT ================= */
let drag=null;
function hitPart(x,y){ let best=null,bd=1e9; for(const t of TYPES){const p=PT[t]; if(p.st!=='shelf'&&p.st!=='ret')continue; const d=hyp(p.x-x,p.y-y), r=Math.max(32*L.u,L.Rs*1.75); if(d<r&&d<bd){bd=d;best=p;}} return best; }
function hitAnimal(x,y){ let best=null,bd=1e9; for(const k of KINDS){const a=AN[k]; if(!a.built||a.st==='pop'||a.st==='ret')continue; const r=Math.max(34*L.u,a.RR*1.6); const d=hyp(a.X-x,a.Y-a.RR*.1-y); if(d<r&&d<bd){bd=d;best=a;}} return best; }
function hitShadow(x,y){ for(const k of KINDS){const a=AN[k]; if(a.st!=='shadow')continue; if(hyp(L.shX[a.i]-x,L.shY-y)<Math.max(52*L.u,L.R*1.8)) return a;} return null; }
function hitSlide(x,y){ if(G.openT<.9)return false; const P=slidePts(); for(let i=0;i<=16;i++){const p=bez(P,i/16); if(hyp(p.x-x,p.y-y)<32*L.u) return true;} return false; }
function onDown(e){
  e.preventDefault(); audioStart();
  const x=e.clientX,y=e.clientY; G.lastInput=now; G.hand=null; G.inputs++;
  if(G.fin.st!=='none'&&G.fin.st!=='train'){ G.fx.push({x,y,t:0}); return; }
  const c=G.crown;
  if(!drag&&(c.st==='float'||c.st==='worn')&&hyp(c.x-x,c.y-y)<36*L.u){
    drag={id:e.pointerId,type:'crown',x,y,sx:x,sy:y,prev:c.st,owner:c.owner,pending:true}; c.px=c.x; c.py=c.y; try{cv.setPointerCapture(e.pointerId);}catch(_){} return;
  }
  if(!drag){ const p=hitPart(x,y); if(p){ drag={id:e.pointerId,type:'part',obj:p,x,y,phase:p.st==='ret'?'free':'pull',sock:null}; if(p.st==='ret'){p.st='drag';} else {p.st='drag'; p.x=L.slots[p.t].x; p.y=L.slots[p.t].y;} p.wv+=5; strStart(); try{cv.setPointerCapture(e.pointerId);}catch(_){} return; } }
  const a=hitAnimal(x,y);
  if(a&&G.fin.st==='none'){ if(a.kind==='duck')tapDuck(a); else if(a.kind==='seal')tapSeal(a); else tapFrog(a); return; }
  if(parkOpen()&&G.fin.st==='none'){ const c2=L.park.car; if(hyp(c2.x-x,c2.y-y)<c2.r*1.15){tapCarousel(); return;} if(hitSlide(x,y)){tapSlide(); return;} }
  const s=hitShadow(x,y); if(s){ selectShadow(s); return; }
  // unrelated: only the touched thing wiggles a little
  if(hyp(L.wheel.x-x,L.wheel.y-y)<L.wheel.r*1.3){G.wheelKick+=.6; SFX.tick(); return;}
  if(hyp(L.plug.x-x,L.plug.y-y)<26*L.u){G.plugSq=.4; SFX.tick(); return;}
  const w=s2w(x,y); if(hyp(w.u,w.v)<1&&y>L.rimY-L.ry){ ripple(w.u,w.v,.4); return; }
  G.fx.push({x,y,t:0}); if(G.fx.length>8)G.fx.shift(); SFX.tick();
}
function onMove(e){ if(!drag||e.pointerId!==drag.id)return; e.preventDefault(); drag.x=e.clientX; drag.y=e.clientY; G.lastInput=now; }
function onUp(e){ if(!drag||e.pointerId!==drag.id)return; endDrag(true); }
function onCancel(e){ if(!drag||e.pointerId!==drag.id)return; endDrag(false); }
function endDrag(drop){
  const d=drag; drag=null; strStop();
  if(d.type==='crown'){
    const c=G.crown;
    if(d.pending){ const a=d.owner||hitAnimal(d.sx,d.sy); if(drop&&a&&tappable(a)&&G.fin.st==='none'){ if(a.kind==='duck')tapDuck(a); else if(a.kind==='seal')tapSeal(a); else tapFrog(a);} return; }
    if(drop){ let best=null,bd=1e9; for(const k of KINDS){const a=AN[k]; if(!bathLike(a))continue; const h=HEAD[a.kind]; const dd=hyp(a.X+h[0]*a.RR*a.face-c.x,a.Y+h[1]*a.RR-c.y); if(dd<Math.max(70*L.u,a.RR*2.2)&&dd<bd){bd=dd;best=a;}}
      if(best){wearCrown(best); return;}
      const w=s2w(c.x,c.y); if(hyp(w.u,w.v)<.9&&!G.leader){c.st='float'; c.u=w.u; c.v=w.v; return;} }
    if(d.prev==='worn'&&d.owner&&bathLike(d.owner)){c.st='worn'; c.owner=d.owner;} else {c.st='float'; c.owner=null; if(G.leader&&!c.owner)G.leader=null;}
    return;
  }
  const p=d.obj;
  if(d.phase==='pull'){ p.st='ret'; p.vx=0; p.vy=0; p.wv+=6; return; }
  const s=drop?findSocket(p,p.x,p.y):null;
  if(s){ attach(p,s.a); return; }
  p.st='ret'; p.vx*=.3; p.vy*=.3;
  const w=drop?wrongNear(p,p.x,p.y):null;
  if(w){ SFX.boing(); w.wob=1; w.sqv-=5; p.vy-=320*L.u; p.wv+=8; logEv('rejected '+p.t+' on '+w.kind); }
}
function cancelDrag(){ if(drag) endDrag(false); }
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp,{passive:false});
window.addEventListener('pointercancel',onCancel,{passive:false});
cv.addEventListener('lostpointercapture',e=>{ if(drag&&e.pointerId===drag.id) endDrag(true); });
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{ if(e.cancelable)e.preventDefault(); },{passive:false}));

/* ================= GUIDANCE ================= */
function partFor(kind,slot){
  if(slot==='body') return kind+'Body';
  if(slot==='beak'||slot==='feet') return slot;
  if(slot==='fin') return (F.d2big&&!F.d2small)?'finSmall':'finBig';
  if(slot==='legs') return (F.frogLong&&!F.frogShort)?'legShort':'legLong';
}
function guide(){
  if(drag||G.fin.st!=='none'||G.ov.st==='spill'||G.ov.st==='opening') return null;
  const a0=G.active;
  if(a0&&a0.st==='shadow'){ for(const s of SLOTS[a0.kind]) if(!a0.parts[s]){ let t=partFor(a0.kind,s); if(PT[t].st!=='shelf'){const alt=TYPES.find(x=>PT[x].an===a0.kind&&PT[x].slot===s&&PT[x].st==='shelf'); if(!alt) continue; t=alt;} return {key:'part',type:'drag',p:PT[t],a:a0,slot:s}; } }
  if(G.crown.st==='float') return {key:'crown',type:'drag'};
  const B=k=>AN[k].built;
  const tapA=k=>tappable(AN[k])?{key:k,type:'tap',a:AN[k]}:null;
  if(!parkOpen()){
    const rec=G.cycle%2?['seal','duck','frog']:['duck','seal','frog'];
    for(const k of rec) if(B(k)&&!F[k+'Tapped']&&tappable(AN[k])) return tapA(k);
    if(B('seal')&&B('duck')&&!(F.d2big&&F.d2small)){
      const cur=AN.seal.parts.fin, seen=cur==='finBig'?F.d2big:F.d2small;
      if(seen){const t=cur==='finBig'?'finSmall':'finBig'; if(PT[t].st==='shelf'&&bathLike(AN.seal)) return {key:'swap',type:'drag',p:PT[t],a:AN.seal,slot:'fin'};}
      else { const r=tapA('seal'); if(r) return r; }
    }
    if(B('frog')&&!(F.frogLong&&F.frogShort)){
      const cur=AN.frog.parts.legs, seen=cur==='legLong'?F.frogLong:F.frogShort;
      if(seen){const t=cur==='legLong'?'legShort':'legLong'; if(PT[t].st==='shelf'&&bathLike(AN.frog)) return {key:'swap',type:'drag',p:PT[t],a:AN.frog,slot:'legs'};}
      else { const r=tapA('frog'); if(r) return r; }
    }
    for(const k of rec) if(AN[k].st==='shadow') return {key:'shadow',type:'tap',a:AN[k]};
    let best=null; for(const k of ['frog','seal','duck']){ if(!tappable(AN[k]))continue; if(!best||G.contrib[k]<G.contrib[best])best=k; }
    return best?tapA(best):null;
  }
  if(!G.slideOpen){
    if(!F.carUsed&&G.parkContrib.seal>0&&(AN.duck.st==='bath')) return {key:'car',type:'tap'};
    let best=null; for(const k of ['seal','duck','frog']){ if(!tappable(AN[k]))continue; if(!best||G.parkContrib[k]<G.parkContrib[best])best=k; }
    return best?tapA(best):null;
  }
  if(!(F.pBS&&F.pSB)&&bathLike(AN.seal)){ const t=AN.seal.parts.fin==='finBig'?'finSmall':'finBig'; if(PT[t].st==='shelf') return {key:'swap',type:'drag',p:PT[t],a:AN.seal,slot:'fin'}; }
  return {key:'slide',type:'tap'};
}
function tgtPos(g){
  if(!g) return null;
  if(g.type==='drag'){
    if(g.key==='crown'){ const c=G.crown; let a=G.order.map(k=>AN[k]).find(bathLike); return {x:c.x,y:c.y,to:a?{x:a.X,y:a.Y-a.RR}:{x:c.x,y:c.y-60}}; }
    const s=g.a.st==='shadow'?shadowSocket(g.a,g.slot):toySocket(g.a,g.slot); return {x:g.p.x,y:g.p.y,to:s};
  }
  if(g.key==='shadow') return {x:L.shX[g.a.i],y:L.shY};
  if(g.key==='car'){const c=L.park.car; return {x:c.x,y:c.y};}
  if(g.key==='slide'){const p=bez(slidePts(),.25); return p;}
  return {x:g.a.X,y:g.a.Y};
}
function gaze(){ if(drag){ if(drag.type==='part')return {x:drag.obj.x,y:drag.obj.y}; return {x:G.crown.x,y:G.crown.y}; } const p=tgtPos(G.tgt); return p; }
const isT=o=>{const g=G.tgt; if(!g)return false; return g.p===o||g.a===o&&g.type==='tap'||(g.key==='crown'&&o==='crown')||(g.key===o);};

/* ================= UPDATE ================= */
function update(dt){
  WG=waterGeom();
  // water filling from faucet
  const fill=(G.active&&G.active.st==='shadow')||G.fillFast||KINDS.some(k=>AN[k].built);
  if(fill&&G.water<1){ G.water=Math.min(1,G.water+dt*(G.fillFast?.55:.07)); if(G.fillFast&&G.water>=.65)G.fillFast=false; G.faucet=Math.min(1,G.faucet+dt*5); }
  else G.faucet=Math.max(0,G.faucet-dt*2);
  G.waterFlash=Math.max(0,G.waterFlash-dt*1.2);
  for(const k of KINDS) updAnimal(AN[k],dt);
  updParts(dt); updDrag(dt);
  updBlobs(dt); updRing(dt); updStream(dt);
  updPark(dt); updCrown(dt); updFinale(dt);
  // guidance
  G.tgt=guide();
  const idle=now-G.lastInput;
  if(!G.hand&&G.tgt&&idle>4&&!G.handShown[G.tgt.key]&&!drag){ const tp=tgtPos(G.tgt); if(tp){ G.hand={key:G.tgt.key,type:G.tgt.type,t:0,from:{x:tp.x,y:tp.y},to:tp.to?{x:tp.to.x,y:tp.to.y}:null,p:G.tgt.p}; G.handShown[G.tgt.key]=true; logEv('hand demo '+G.tgt.key);} }
  if(G.hand){ G.hand.t+=dt; if(G.hand.t>(G.hand.type==='drag'?2.4:1.7)) G.hand=null; }
  // particles
  for(let i=G.P.length-1;i>=0;i--){const p=G.P[i]; p.life-=dt; if(p.life<=0){G.P.splice(i,1);continue;} p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.type==='spark'){p.vx*=Math.pow(.1,dt);p.vy*=Math.pow(.1,dt);} }
  for(let i=G.ripples.length-1;i>=0;i--){const r=G.ripples[i]; r.t+=dt; if(r.t>r.max)G.ripples.splice(i,1);}

function updFinale(dt){
  const f=G.fin;
  if(f.st==='none'){
    if(G.slideOpen&&parkOpen()&&G.slides>=6&&!drag&&KINDS.every(k=>AN[k].st==='bath'||AN[k].st==='island'||AN[k].st==='ride'||AN[k].st==='car')&&now-G.lastInput>1.2){
      f.st='train'; f.t=0; f.q=slideQueue(); f.next=0; logEv('party: slide train, leader='+(f.q[0]&&f.q[0].kind)); }
    return;
  }
  f.t+=dt;
  if(f.st==='train'){
    if(f.q.length&&f.t>=f.next){ const a=f.q[0]; if(a.st==='air'||a.st==='slide'){} else { f.q.shift(); if(a.st==='car'){a.st='bath';} sendSlide(a); f.next=f.t+.55; } }
    if(!f.q.length&&KINDS.every(k=>AN[k].st==='bath')){ f.st='party'; f.t=0; SFX.fanfare(); }
  } else if(f.st==='party'){
    if(Math.random()<dt*14){ const x=rnd(L.left,L.right),y=rnd(L.top,L.wallBot); burst(x,y,6,'spark',['#ffd1e3','#c9f0ff','#fff1b8','#d9ffd6'][(Math.random()*4)|0],150); SFX.pop(rnd(.8,1.8)); }

}
function newCycle(){

    else if(p.type==='spark'){ ctx.fillStyle=p.col||'#fff'; ctx.globalAlpha=k; const s=p.r*(1+.5*Math.sin(now*20+p.x)); ctx.beginPath(); ctx.moveTo(p.x,p.y-s*2); ctx.lineTo(p.x+s*.5,p.y-s*.5); ctx.lineTo(p.x+s*2,p.y); ctx.lineTo(p.x+s*.5,p.y+s*.5); ctx.lineTo(p.x,p.y+s*2); ctx.lineTo(p.x-s*.5,p.y+s*.5); ctx.lineTo(p.x-s*2,p.y); ctx.lineTo(p.x-s*.5,p.y-s*.5); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
    else if(p.type==='bub'){ ctx.strokeStyle='rgba(255,255,255,'+k*.9+')'; ctx.lineWidth=1.2*L.u; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke(); }

}
function doorPath(c){
  const o=L,x0=o.left+o.iw*.04,x1=o.right-o.iw*.04,y0=o.top+(o.wallBot-o.top)*.1,y1=o.wallBot, w=x1-x0;
  c.beginPath(); c.moveTo(x0,y1); c.lineTo(x0,y0+(y1-y0)*.45);
  const tops=[.08,.22,.38,.5,.62,.78,.92], hs=[.38,.22,.3,0,.3,.22,.38];
  for(let i=0;i<tops.length;i++){ const cx=x0+w*tops[i], cy=y0+(y1-y0)*hs[i], r=w*.075; c.arc(cx,cy,r,Math.PI,0); }
  c.lineTo(x1,y0+(y1-y0)*.45); c.lineTo(x1,y1); c.closePath();
}
function drawDoors(){
  if(G.openT>=1) return;
  const o=L, k=G.openT, dx=k*o.iw*.55;
  ctx.save(); ctx.globalAlpha=(1-k*.8);
  [-1,1].forEach(s=>{ ctx.save(); ctx.beginPath(); if(s<0)ctx.rect(0,0,o.cx,o.wallBot+2); else ctx.rect(o.cx,0,W-o.cx,o.wallBot+2); ctx.clip(); ctx.translate(s*dx,0);
    ctx.fillStyle='rgba(125,108,171,.17)'; doorPath(ctx); ctx.fill();
    ctx.fillStyle='rgba(125,108,171,.12)'; el(o.cx-o.iw*.12*s*-1,o.top+(o.wallBot-o.top)*.3,o.iw*.05,o.iw*.05);
    ctx.restore(); });
  if(k>0){ ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2*L.u; ctx.beginPath(); ctx.moveTo(o.cx-dx,o.top); ctx.lineTo(o.cx-dx,o.wallBot); ctx.moveTo(o.cx+dx,o.top); ctx.lineTo(o.cx+dx,o.wallBot); ctx.stroke(); }
  ctx.restore();
}
function drawPark(){
  const o=L,u=o.u,k=G.openT, gw=k*(o.iw*.5+30*u);
  ctx.save(); ctx.beginPath(); ctx.rect(o.cx-gw,0,gw*2,o.rimY); ctx.clip();
  const sky=ctx.createLinearGradient(0,o.top,0,o.wallBot); sky.addColorStop(0,'#ffe2d6'); sky.addColorStop(.5,'#f5dcf6'); sky.addColorStop(1,'#d9efff');
  ctx.fillStyle=sky; rr(ctx,o.left+6*u,o.top+4*u,o.iw-12*u,o.wallBot-o.top-6*u,18*u); ctx.fill();
  // mosaic arches
  for(let i=0;i<6;i++){ const x=o.left+o.iw*(i+.5)/6, y=o.wallBot-4*u, r=o.iw/12*.9; ctx.fillStyle=i%2?'rgba(255,255,255,.4)':'rgba(200,236,224,.45)'; ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.fill(); }
  for(let i=0;i<5;i++){ const x=o.left+((i*137+now*8)%o.iw), y=o.top+20*u+i*9*u; ctx.fillStyle='rgba(255,255,255,.7)'; el(x,y,22*u,7*u); el(x+12*u,y-4*u,12*u,6*u); }
  // belt from wheel to carousel
  const c=o.park.car, w=o.wheel;
  ctx.strokeStyle='#cbb8ee'; ctx.lineWidth=5*u; ctx.setLineDash([7*u,5*u]); ctx.lineDashOffset=-G.wheelAng*w.r;
  ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(c.x+c.r*.2,c.y+c.r*.6); ctx.stroke(); ctx.setLineDash([]);
  // tube
  const TP=tubePts(); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=13*u; ctx.beginPath(); TP.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.strokeStyle='rgba(170,200,240,.6)'; ctx.lineWidth=2*u; ctx.stroke();
  for(const tb of G.tube){ const p=polyAt(TP,tb.t); ctx.fillStyle='rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(p.x,p.y,5.5*u,0,TAU); ctx.fill(); ctx.strokeStyle='rgba(190,180,240,.8)'; ctx.lineWidth=u; ctx.stroke(); }
  // carousel
  drawCarousel();
  ctx.restore();
}
function drawCarousel(){
  const c=L.park.car,u=L.u, tg=isT('car');
  const by=c.y+c.r*.42, bob=tg?-Math.abs(Math.sin(now*4.5))*5*u:0;
  ctx.fillStyle='rgba(120,100,150,.15)'; el(c.x,by+c.r*.3,c.r*1.05,c.r*.22);
  ctx.fillStyle='#bfeee0'; el(c.x,by+c.r*.12,c.r,c.r*.25); ctx.fillStyle='#e4fff6'; el(c.x,by+c.r*.06,c.r*.95,c.r*.22);
  const seats=[0,1,2].map(i=>seatPos(i));
  const drawSeat=s=>{ ctx.strokeStyle='#d8c9f2'; ctx.lineWidth=2*u; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x,c.y-c.r*.55+bob); ctx.stroke();
    ctx.fillStyle=['#ffd1e1','#fff0b8','#cde8ff'][seats.indexOf(s)]; rr(ctx,s.x-10*u,s.y-4*u,20*u,11*u,5*u); ctx.fill(); };
  seats.filter(s=>!s.front).forEach(drawSeat);
  ctx.fillStyle='#f6c7da'; rr(ctx,c.x-4*u,c.y-c.r*.6+bob,8*u,c.r*1.05,4*u); ctx.fill();
  seats.filter(s=>s.front).forEach(drawSeat);
  // canopy with scallops
  const cy=c.y-c.r*.6+bob;
  ctx.fillStyle='#ffb4cd'; ctx.beginPath(); ctx.moveTo(c.x-c.r,cy); ctx.quadraticCurveTo(c.x,cy-c.r*.9,c.x+c.r,cy); ctx.closePath(); ctx.fill();
  for(let i=0;i<8;i++){ const x=c.x-c.r+(i+.5)*c.r/4; ctx.fillStyle=i%2?'#fff4fa':'#ffd9e7'; ctx.beginPath(); ctx.arc(x,cy,c.r/8,0,Math.PI); ctx.fill(); }
  ctx.save(); ctx.translate(c.x,cy-c.r*.45); ctx.rotate(G.carAng*.3); ctx.fillStyle='#fff3b0'; el(0,0,5*u,5*u); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.6)'; el(c.x-c.r*.4,cy-c.r*.2,c.r*.2,c.r*.06,-.4);
}
function drawSlide(){
  const o=L,u=o.u,k=G.openT, gw=k*(o.iw*.5+30*u), P=slidePts(), tg=isT('slide');
  ctx.save(); ctx.beginPath(); ctx.rect(o.cx-gw,0,gw*2,H); ctx.clip();
  // ladder
  const s=P[0]; ctx.strokeStyle='#d8c9f2'; ctx.lineWidth=3*u; ctx.beginPath(); ctx.moveTo(s.x-10*u,s.y); ctx.lineTo(s.x-10*u,o.wallBot); ctx.moveTo(s.x+6*u,s.y); ctx.lineTo(s.x+6*u,o.wallBot); for(let y=s.y+8*u;y<o.wallBot;y+=10*u){ctx.moveTo(s.x-10*u,y); ctx.lineTo(s.x+6*u,y);} ctx.stroke();
  const per=12, cols=['#ffd0e2','#d6c9ff','#c8f0e4','#fff1b8','#cfe8ff'];
  for(let sgi=0;sgi<SLIDE_N;sgi++){
    const built=sgi<G.slideProg;
    for(let j=0;j<per;j++){ const t=(sgi+j/per)/SLIDE_N, p=bez(P,t); const r=(12+3*Math.sin(t*20+now*(built?2:0)))*u*(tg&&built?1+.08*Math.abs(Math.sin(now*5-t*6)):1);
      if(built){ ctx.fillStyle=cols[sgi%cols.length]; ctx.globalAlpha=.92; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill(); ctx.globalAlpha=1; ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(p.x-r*.35,p.y-r*.4,r*.25,0,TAU); ctx.fill(); }
      else if(j%3===0){ ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5*u; ctx.beginPath(); ctx.arc(p.x,p.y,r*.8,0,TAU); ctx.stroke(); }
    }
  }
  ctx.restore();
}
function drawHand(){
  const h=G.hand,u=L.u; let x,y,press=0,alpha=1;
  if(h.type==='tap'){ const t=h.t; const k=clamp(t/.5,0,1); x=h.from.x+(1-ease(k))*40*u; y=h.from.y+(1-ease(k))*50*u; press=t>.55&&t<.85?1:0; alpha=t<.2?t/.2:t>1.4?Math.max(0,(1.7-t)/.3):1;
    if(press){ ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3*u; ctx.beginPath(); ctx.arc(h.from.x,h.from.y,(10+(t-.55)*60)*u,0,TAU); ctx.stroke(); } }
  else { const t=h.t; const to=h.to||h.from;
    if(t<.5){ x=h.from.x+(1-ease(t/.5))*40*u; y=h.from.y+(1-ease(t/.5))*50*u; }
    else if(t<1.9){ const k=ease(clamp((t-.7)/1.1,0,1)); x=lerp(h.from.x,to.x,k); y=lerp(h.from.y,to.y,k); press=1;
      if(h.p&&t>.7){ ctx.save(); ctx.globalAlpha=.45; const c=PDEF[h.p.t].c, R=lerp(L.Rs,L.R*.95,k); ctx.translate(x,y-16*u); ctx.translate(-c[0]*R,-c[1]*R); PDRAW[h.p.t](R,{lx:0,ly:0,mood:0,blink:-1}); ctx.restore(); }
      if(h.key==='crown'&&t>.7){ ctx.save(); ctx.globalAlpha=.45; drawCrown(x,y-16*u,15*u,0); ctx.restore(); } }
    else { x=to.x; y=to.y; }
    alpha=t<.2?t/.2:t>2.1?Math.max(0,(2.4-t)/.3):1; }
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); const s=(press?.9:1)*u;
  ctx.scale(s,s); ctx.rotate(-.35);
  ctx.fillStyle='rgba(90,70,120,.18)'; el(4,30,18,24);
  ctx.fillStyle='#fff7f2'; ctx.strokeStyle='#d9a7bd'; ctx.lineWidth=2;
  rr(ctx,-6,0,12,30,6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(2,34,17,16,0,0,TAU); ctx.fill(); ctx.stroke();
  [[-12,26],[16,22]].forEach(q=>{ctx.beginPath(); ctx.ellipse(q[0],q[1],6,9,q[0]<0?-.5:.4,0,TAU); ctx.fill(); ctx.stroke();});
  ctx.fillStyle='#ffd3e0'; el(0,4,3.5,2.5);
  ctx.restore();
}

/* ================= LOOP / LIFECYCLE ================= */
let lastT=performance.now(), raf=0, running=true;
function frame(ts){
  raf=0; if(!running) return;
  if(needLayout) layout();
  let dt=(ts-lastT)/1000; lastT=ts; if(!(dt>0))dt=0; if(dt>.05)dt=.05;
  now+=dt;
  try{ update(dt); draw(); }catch(e){ console.error(e); }
  raf=requestAnimationFrame(frame);
}
function pause(){ if(!running)return; running=false; if(raf)cancelAnimationFrame(raf); raf=0; cancelDrag(); strStop(); try{ if(AU.c&&AU.c.state==='running') AU.c.suspend().catch(()=>{}); }catch(e){} }
function resume(){ if(running)return; running=true; lastT=performance.now(); needLayout=true; try{ if(AU.c&&AU.c.state==='suspended'){const p=AU.c.resume(); if(p&&p.catch)p.catch(()=>{});} }catch(e){} raf=requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); else resume(); });
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{ if(!document.hidden) resume(); });
layout();
// expose state for automated checks (no UI)
window.__bath={shadowSocket,toySocket,G,AN,PT,L:()=>L,W:()=>WG,w2s,slidePts,bez,seatPos,running:()=>running,now:()=>now};
raf=requestAnimationFrame(frame);
})();
