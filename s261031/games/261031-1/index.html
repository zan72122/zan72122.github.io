  kira() { [1319, 1568, 1976].forEach((f, i) => tone(f, 0.25, { vol: 0.06, delay: i * 0.06 })); },

function droneSet(on, homog, dt) {

    lfo.connect(lg); lg.connect(g.gain); o.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o.start(); o2.start(); lfo.start();

  drone.o.frequency.setTargetAtTime(base, t, 0.12);
  drone.o2.frequency.setTargetAtTime(base * 0.502, t, 0.12);

// ================= 色 =================
const C8 = [[1, 1, 1], [0.93, 0.17, 0.25], [1, 0.86, 0.2], [1, 0.55, 0.12], [0.27, 0.36, 0.86], [0.6, 0.24, 0.72], [0.25, 0.7, 0.35], [0.45, 0.27, 0.18]];

  r /= m; y /= m; b /= m;
  for (let k = 0; k < 3; k++) {
    const x0 = C8[0][k] + (C8[1][k] - C8[0][k]) * r, x1 = C8[2][k] + (C8[3][k] - C8[2][k]) * r;
    const x2 = C8[4][k] + (C8[5][k] - C8[4][k]) * r, x3 = C8[6][k] + (C8[7][k] - C8[6][k]) * r;

}

function shade(c, k) { return [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)]; }

// ================= ミキサー =================
const jar = {
  r: new Float32Array(JW * JH), y: new Float32Array(JW * JH), b: new Float32Array(JW * JH),
  sr: new Float32Array(JW * JH), sy: new Float32Array(JW * JH), sb: new Float32Array(JW * JH), tau: 0, smean: [0, 0, 0],
  level: 0, spin: 0, mixT: 0, homog: 1, chunks: [], wob: { s: 0, v: 0 }, blade: 0, dirty: true, pourAcc: 0,
  recipe: [0, 0, 0], lastRowCol: [255, 200, 200], pouring: 0
};
jar.cnv = document.createElement('canvas'); jar.cnv.width = JW; jar.cnv.height = JH;
jar.cx = jar.cnv.getContext('2d'); jar.img = jar.cx.createImageData(JW, JH);

function addFruit(fi) {

  for (let row = l0; row < l0 + n; row++) for (let x = 0; x < JW; x++) {
    const i = row * JW + x; jar.r[i] = jar.sr[i] = f.ryb[0]; jar.y[i] = jar.sy[i] = f.ryb[1]; jar.b[i] = jar.sb[i] = f.ryb[2];
  }
  jar.level += n; jar.recipe[fi]++;
  softenSrc(Math.max(0, l0 - 3), Math.min(jar.level, l0 + 3));
  srcMean();
  for (let k = 0; k < 6; k++) jar.chunks.push({ x: rnd(3, JW - 3), y: rnd(l0 + 1, l0 + n - 0.5), s: rnd(2.6, 3.8), fi, a: rnd(0, TAU) });
  if (jar.chunks.length > 36) jar.chunks.splice(0, jar.chunks.length - 36);
  jar.wob.v -= 9; jar.dirty = true; jar.mixT = Math.min(jar.mixT, 0.6);

}
function calcHomog() {

  for (let i = 0; i < n; i++) { const a = jar.r[i] - mr, b = jar.y[i] - my, c = jar.b[i] - mb; v += a * a + b * b + c * c; }

// 混ぜ：スナップショットからの回転写像（にじみが溜まらないので渦の筋がくっきり残る）

    glassShape(g, 18, 24); g.save(); g.translate(0, 12); glassShape(g, 18, 24); g.fillStyle = css(c.want); g.fill(); g.strokeStyle = 'rgba(110,160,190,0.9)'; g.lineWidth = 1.6; g.stroke(); g.restore();
    if (c.puzzled > 0) { g.fillStyle = '#ffb347'; ell(g, 18, -16, 3, 3); g.fill(); }
    g.restore();
  }
}

// ================= 描画：お手本の手 =================
function drawHand(x, y, press) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1 - press * 0.1, 1 - press * 0.1); ctx.rotate(-0.35);
  ctx.globalAlpha *= 0.92;
  rr(ctx, -6, -4, 12, 30, 6); felt(ctx, '#fff8f0'); stitch(ctx, '#e6b9a0', 1.2);
  rr(ctx, -16, 16, 34, 34, 13); felt(ctx, '#fff8f0'); stitch(ctx, '#e6b9a0', 1.2);
  ell(ctx, 0, 0, 4, 3); ctx.fillStyle = '#ffd9df'; ctx.fill();
  ctx.restore();
}
function drawDemo() {
  if (!demo || !demo.a) return;
  const d = demo, t = d.t, A = d.a;
  const fade = Math.min(1, t / 0.25) * Math.min(1, (d.dur - t) / 0.3);
  ctx.save(); ctx.globalAlpha = clamp(fade, 0, 1);
  if (d.kind === 'tap' || d.kind === 'hold') {
    const pressStart = 0.55, pressEnd = d.kind === 'tap' ? 0.85 : 1.9;
    const mv = ease(t / pressStart);
    const x = lerp(A.x + 70, A.x, mv), y = lerp(A.y + 90, A.y, mv);
    const pr = t > pressStart && t < pressEnd ? 1 : 0;
    if (pr) { const rt = (t - pressStart) * 2 % 1; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ell(ctx, A.x, A.y, 14 + rt * 26, 14 + rt * 26); ctx.globalAlpha *= 1 - rt; ctx.stroke(); ctx.globalAlpha = clamp(fade, 0, 1); }
    drawHand(x + (pr && d.kind === 'hold' ? Math.sin(T * 40) : 0), y + pr * 4, pr);
  } else if (d.kind === 'drag' && d.b) {
    const B = d.b;
    let x, y, carry = 0;
    if (t < 0.5) { const m = ease(t / 0.5); x = lerp(A.x + 60, A.x, m); y = lerp(A.y + 80, A.y, m); }
    else if (t < 0.7) { x = A.x; y = A.y; carry = 1; }
    else if (t < 2.0) { const m = ease((t - 0.7) / 1.3); x = lerp(A.x, B.x, m); y = lerp(A.y, B.y, m) - Math.sin(m * Math.PI) * 30; carry = 1; }
    else { x = B.x; y = B.y; carry = t < 2.2 ? 1 : 0; }
    if (carry && d.g) { const S = GL[d.g.size]; ctx.save(); ctx.globalAlpha *= 0.5; drawGlassAt(d.g, x, y + S.h / 2, 0, 1); ctx.restore(); }
    drawHand(x + 6, y + 6, carry);
  }
  ctx.restore();
}

// ================= 描画：全体 =================
function draw() {
  // 背景と床の道を一枚にまとめておき、毎フレームの全面描画を1回にする
  if (bgDirty || wetDirty) {
    if (bgDirty) buildBG();
    if (wetDirty) renderWet();
    if (baseC.width !== cv.width || baseC.height !== cv.height) { baseC.width = cv.width; baseC.height = cv.height; }
    baseX.setTransform(1, 0, 0, 1, 0, 0); baseX.drawImage(bgC, 0, 0); baseX.drawImage(wetC, 0, 0);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(baseC, 0, 0);
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * OX, DPR * OY);
  // 植木の揺れ（触ったとき）
  if (decor.plant > 0) for (const p of L.plants) drawPlant(ctx, p.x, p.y, p.s, decor.plant);
  // 流れている液
  for (const pk of packets) {
    const N = nodes[pk.n]; let x = N.x, y = N.y;
    if (N.next >= 0) { const M = nodes[N.next]; x += (M.x - N.x) * pk.t; y += (M.y - N.y) * pk.t; }
    const s = A2S({ x, y }); ell(ctx, s.x, s.y, 8, 6); ctx.fillStyle = css(pk.col, 0.95); ctx.fill();
    ell(ctx, s.x - 2, s.y - 2, 3, 2); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  }
  drawPartyMat();
  drawShelf();
  drawOverflow();
  drawCrates();
  drawBlender();
  // 置いてあるグラス
  for (const g of glasses) if (g.place === 'home' || g.place === 'slot' || g.place === 'floor') drawGlass(g);
  // キャラ（奥から）
  const chars = [bear, kit].sort((a, b) => (a.pos.y + (a === kit ? 14 : 0)) - (b.pos.y + (b === kit ? 14 : 0)));
  for (const c of chars) c === bear ? drawBear(c) : drawKit(c);
  for (const g of glasses) if (g.place === 'drink') drawGlass(g);
  // 飛んでいる果物
  for (const f of flights) {
    const J = L.jar, x1 = J.x + J.w / 2, y1 = J.y + J.h * (1 - (jar.level + FR * 0.5) / JH);
    const t = f.t, x = lerp(f.x0, x1, t), y = lerp(f.y0, y1, t) - Math.sin(t * Math.PI) * 90;
    const vy = (y1 - f.y0) - Math.cos(t * Math.PI) * 90 * Math.PI, vx = x1 - f.x0, ang = Math.atan2(vy, vx);
    const st = 1 + Math.min(0.35, Math.abs(Math.cos(t * Math.PI)) * 0.3);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(st, 1 / st); ctx.rotate(-ang); drawFruit(ctx, f.fi, 0, 0, 0.8); ctx.restore();
  }
  // 持っているグラス
  for (const g of glasses) if (g.place === 'drag') {
    drawDropHint(g);
    drawGlass(g);
  }
  // パーティクル
  for (const p of parts) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = clamp(a * 1.5, 0, 1);
    if (p.k === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); ctx.restore(); }
    else if (p.k === 'spark') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(T * 3); ctx.fillStyle = p.col; ctx.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? p.r * 0.35 : p.r, an = k / 8 * TAU; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.closePath(); ctx.fill(); ctx.restore(); }
    else if (p.k === 'splat') { ell(ctx, p.x, p.y, p.r * 1.8 * (1 + p.t), p.r * 0.7); ctx.fillStyle = p.col; ctx.fill(); }
    else { ell(ctx, p.x, p.y, p.r, p.r * 1.2); ctx.fillStyle = p.col; ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const r of ripple) { ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.5)})`; ctx.lineWidth = 2; ell(ctx, r.x, r.y, 6 + r.t * 30, 6 + r.t * 30); ctx.stroke(); }
  drawDemo();
}
function drawDropHint(g) {
  const S = GL[g.size], cx = g.x, cy = g.y - S.h / 2;
  if (hyp(cx - L.slot.x, cy - (L.slot.by - 40)) < 72) { ctx.save(); ctx.globalAlpha = 0.6; ell(ctx, L.slot.x, L.slot.by, 40, 9); ctx.fillStyle = '#fff9b0'; ctx.fill(); ctx.restore(); return; }
  if (!g.rows.length) return;
  for (const c of [bear, kit]) { if (!canDrink(c)) continue; const m = mouthPos(c); if (hyp(cx - m.x, cy - m.y) < drinkRadius(c)) { c.mouth = 1; return; } }
  const sh = A2S(SHELF);
  if (hyp(cx - sh.x, cy - (sh.y - 40)) < 62) { ctx.save(); ctx.globalAlpha = 0.5; ell(ctx, sh.x, sh.y - 14, 34, 8); ctx.fillStyle = '#fff9b0'; ctx.fill(); ctx.restore(); return; }
  if (g.y > L.ctr.bot - 4) { ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(T * 8); ell(ctx, g.x, g.y - 2, 16, 6); ctx.fillStyle = css(glassAvg(g)); ctx.fill(); ctx.restore(); }
}

// ================= ループ =================
let raf = 0, last = 0, running = false;
function loop(now) {
  if (!running) return;
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  update(dt); draw();
  raf = requestAnimationFrame(loop);
}
function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(loop); }
function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); releaseAll(); if (AC && AC.state === 'running') AC.suspend().catch(() => {}); }
  else { start(); if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); }
});
window.addEventListener('resize', () => { resize(); });
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// 起動
resize();
{ const f = loadFav(); if (f) { fav.size = f.size; fav.rows = f.rows; fav.vis = true; fav.dirty = true; } }
for (const g of glasses) if (g.size) { const hp = homePos(g); g.x = hp.x; g.y = hp.y; }
guide = computeGuide();
draw();
if (!document.hidden) start();

// 自動テスト用の読み取り窓口（画面には何も出さない）
window.__kuma = {
  st: () => ({ T, level: jar.level, mixT: jar.mixT, homog: jar.homog, recipe: jar.recipe.slice(), chunks: jar.chunks.length,
    glasses: glasses.map(g => ({ id: g.id, place: g.place, rows: g.rows.length, size: g.size, vis: g.vis, avg: g.rows.length ? glassAvg(g).map(Math.round) : null })),
    nodes: nodes.length, packets: packets.length, parts: parts.length, gver,
    bear: { mode: bear.mode, x: bear.pos.x, y: bear.pos.y, tongue: bear.tongue, lean: bear.lean },
    kit: { mode: kit.mode, x: kit.pos.x, y: kit.pos.y, want: kit.want, tongue: kit.tongue },
    party: party.active, gather: gather ? gather.phase : null, cycle, partyIdx, stats: { ...stats }, guide: guide ? guide.k + (guide.to ? ':' + guide.to : '') + (guide.i !== undefined ? ':' + guide.i : '') : null,
    demo: demo ? demo.kind : null, branch: lastBranch ? { chain: lastBranch.chain, tip: lastBranch.tip } : null,
    fav: fav.vis ? { size: fav.size, rows: fav.rows.length, place: fav.place } : null, storageOK, orient, running, audio: AC ? AC.state : null, holders: holders.size, spin: jar.spin }),
  pt: name => {
    let p = null;
    const m = /^fruit(\d)$/.exec(name);
    if (m) { const c = L.crates[+m[1]]; p = { x: c.x, y: c.y }; }
    else if (name === 'btn') p = { x: L.btn.x, y: L.btn.y };
    else if (name.startsWith('glass_')) { const g = glasses.find(q => q.id === name.slice(6)); if (g && g.size) p = { x: g.x, y: g.y - GL[g.size].h / 2 }; }
    else if (name === 'slot') p = { x: L.slot.x, y: L.slot.by - 40 };
    else if (name === 'bearMouth') p = mouthPos(bear);
    else if (name === 'kitMouth') p = mouthPos(kit);
    else if (name === 'shelf') { const s = A2S(SHELF); p = { x: s.x, y: s.y - 40 }; }
    else if (name === 'party') p = A2S(PARTY[partyIdx]);
    else if (name === 'target') { const ft = floorTarget(); if (ft) p = A2S(ft); }
    else if (name.startsWith('floor:')) { const [x, y] = name.slice(6).split(',').map(Number); p = A2S({ x, y }); }
    if (!p) return null;
    return { x: p.x * SC + OX, y: p.y * SC + OY };
  },
  nodesA: () => nodes.map(n => ({ x: n.x, y: n.y, next: n.next, chain: n.chain, br: n.br })),
  jarRow: row => { const out = []; for (let x = 0; x < JW; x++) { const i = row * JW + x; out.push(ryb(jar.r[i], jar.y[i], jar.b[i], [0, 0, 0])); } return out; },
  glassRows: id => { const g = glasses.find(q => q.id === id); return g ? g.rows.map(R => Array.from(R.c)) : null; },
  scale: () => ({ SC, OX, OY, VW, VH, DPR }),
  dbg: () => { const e = entryFor(bear), R = e >= 0 ? bfs(e) : null; const pn = nodes.map((n, i) => inParty(n) ? i : -1).filter(i => i >= 0);
    return { e, reach: R ? R.set.length : 0, pnode: R ? R.pnode : null, maxVer: R ? R.maxVer : null, lastVer: bear.lastVer, gver, partyNodes: pn.map(i => [i, nodes[i].links.length, nodes[i].next, Math.round(nodes[i].r)]), bearMode: bear.mode, kitMode: kit.mode, gather: gather && gather.phase, comps: (() => { const seen = new Set(); let c = 0; for (let i = 0; i < nodes.length; i++) if (!seen.has(i)) { c++; for (const j of bfs(i).set) seen.add(j); } return c; })() }; }
};
})();
</script>
