// ================================================================ audio (Web Audio synth)
const AU={ctx:null,master:null,noiseBuf:null,voices:0,vt:0};
function audioInit(){
  try{
    if(AU.ctx){ if(AU.ctx.state!=='running'){ const p=AU.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); } return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    AU.ctx=new AC();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=0.75;
    const comp=AU.ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    AU.master.connect(comp); comp.connect(AU.ctx.destination);
    const len=Math.floor(AU.ctx.sampleRate*0.6); const b=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    AU.noiseBuf=b;
    const p=AU.ctx.resume&&AU.ctx.resume(); if(p&&p.catch)p.catch(()=>{});
    // unlock blip (silent)
    tone(440,0.02,{vol:0.0002});
  }catch(e){ AU.ctx=null; }
}
function voiceOK(){ if(!AU.ctx||AU.ctx.state!=='running') return false; const t=performance.now(); if(t-AU.vt>40){AU.vt=t;AU.voices=0;} if(AU.voices>10) return false; AU.voices++; return true; }
function tone(freq,dur,o){
  o=o||{}; if(!voiceOK()) return;
  try{
    const c=AU.ctx,t=c.currentTime+(o.delay||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(freq,t);
    if(o.slide) os.frequency.exponentialRampToValueAtTime(Math.max(30,freq*o.slide),t+dur);
    const v=Math.max(0.0002,o.vol||0.15),a=o.attack||0.006;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g); g.connect(AU.master); os.start(t); os.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,o){
  o=o||{}; if(!voiceOK()||!AU.noiseBuf) return;
  try{
    const c=AU.ctx,t=c.currentTime+(o.delay||0);
    const src=c.createBufferSource(); src.buffer=AU.noiseBuf; src.loop=true;
    const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.freq||1000,t); f.Q.value=o.q||1;
    if(o.sweep) f.frequency.exponentialRampToValueAtTime((o.freq||1000)*o.sweep,t+dur);
    const g=c.createGain(); const v=o.vol||0.1, a=o.attack||0.01;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(AU.master); src.start(t); src.stop(t+dur+0.03);
  }catch(e){}
}

// ================================================================ Path
class Path{
  constructor(x,y){
    this.id=NID++; this.pts=[{x,y}]; this.cum=[0]; this.k=[0]; this.len=0; this.next=null;
    this.drawing=true; this.wob=0; this.fav=false; this.sea=S.phase!=='belly'; this.alpha=1; this.w=15;
    this.born=gtime; this.trace=null; this.lifted=false;
  }
  recalc(){
    const P=this.pts,n=P.length,c=this.cum,k=this.k;
    c.length=n; c[0]=0;
    for(let i=1;i<n;i++) c[i]=c[i-1]+Math.max(0.001,hyp(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
    this.len=n>1?c[n-1]:0;
    k.length=n; k[0]=0; k[n-1]=0;
    for(let i=1;i<n-1;i++){
      const ax=P[i].x-P[i-1].x,ay=P[i].y-P[i-1].y,bx=P[i+1].x-P[i].x,by=P[i+1].y-P[i].y;
      const la=hyp(ax,ay)||1,lb=hyp(bx,by)||1;
      k[i]=Math.abs(Math.atan2(ax*by-ay*bx,ax*bx+ay*by))/((la+lb)/2);
    }
    if(n>4){ for(let pass=0;pass<2;pass++){ let prev=k[0]; for(let i=1;i<n-1;i++){ const cur=k[i]; k[i]=(prev+cur*2+k[i+1])/4; prev=cur; } } }
  }
  addPoint(x,y){
    const P=this.pts; let last=P[P.length-1]; let d=hyp(x-last.x,y-last.y); const SP=8; let added=0;
    while(d>=SP&&P.length<MAXPTS){
      const f=SP/d; P.push({x:last.x+(x-last.x)*f,y:last.y+(y-last.y)*f}); added++;
      const n=P.length;
      if(n>=3&&n-2>this.lock){ const a=P[n-3],b=P[n-2],c=P[n-1]; b.x=(a.x+b.x*2+c.x)/4; b.y=(a.y+b.y*2+c.y)/4; }
      last=P[P.length-1]; d=hyp(x-last.x,y-last.y);
    }
    if(added) this.recalc();
    return added;
  }
  posAt(s){
    const P=this.pts,c=this.cum,n=P.length;
    if(n<2) return {x:P[0].x,y:P[0].y,tx:1,ty:0,k:0};
    if(s<0)s=0; if(s>this.len)s=this.len;
    let lo=0,hi=n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(c[m]<=s)lo=m; else hi=m; }
    const a=P[lo],b=P[hi],seg=(c[hi]-c[lo])||0.001,f=(s-c[lo])/seg;
    return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,tx:(b.x-a.x)/seg,ty:(b.y-a.y)/seg,k:this.k[lo]*(1-f)+this.k[hi]*f};
  }
  nearest(x,y){
    const P=this.pts; if(P.length<2) return {d:hyp(x-P[0].x,y-P[0].y),s:0};
    let best=1e9,bs=0;
    for(let i=0;i<P.length-1;i++){
      const a=P[i],b=P[i+1],dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;
      const t=clamp(((x-a.x)*dx+(y-a.y)*dy)/l2,0,1),px=a.x+dx*t,py=a.y+dy*t,d=hyp(x-px,y-py);
      if(d<best){best=d;bs=this.cum[i]+t*(this.cum[i+1]-this.cum[i]);}
    }
    return {d:best,s:bs};
  }
  get first(){return this.pts[0];}
  get last(){return this.pts[this.pts.length-1];}
}
const pathById=id=>{ for(const p of S.paths) if(p.id===id) return p; return null; };

// ================================================================ layout & caches
function readSA(){ const cs=getComputedStyle(saEl); SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0}; }
function layout(){
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  readSA();
  const aw=W-SA.l-SA.r, ah=H-SA.t-SA.b; portrait=aw<ah*1.05;
  const ww=FIT.x1-FIT.x0, wh=FIT.y1-FIT.y0;
  let s;
  if(portrait){
    s=Math.min(aw*0.985/ww, ah*0.86/wh);
    const left=SA.l+(aw-ww*s)/2, top=SA.t+ah-wh*s+30*s;
    L.belly={s,ox:left-FIT.x0*s,oy:top-FIT.y0*s};
  }else{
    s=Math.min(aw*0.66/ww, ah*1.0/wh);
    const left=SA.l+(aw-ww*s)/2, top=SA.t+(ah-wh*s)/2+34*s;
    L.belly={s,ox:left-FIT.x0*s,oy:top-FIT.y0*s};
  }
  const s2=Math.min(aw*0.94/BW, ah*0.86/BH);
  L.sea={s:s2,ox:SA.l+(aw-BW*s2)/2,oy:SA.t+ah*0.025};
  L.surf=L.sea.oy+SEA_Y*s2;
  L.ws=Math.min(s2*(portrait?0.42:0.31),(H-L.surf)/560);
  buildBg(); buildWhale();
}
function grain(c,w,h,count,a1,a2){
  for(let i=0;i<count;i++){
    const x=Math.random()*w,y=Math.random()*h;
    c.fillStyle=Math.random()<0.55?'rgba(255,255,255,'+a1+')':'rgba(70,50,90,'+a2+')';
    c.fillRect(x,y,1+Math.random()*3.5,1+Math.random()*0.8);
  }
}
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; }
function buildBg(){
  // underwater (belly view)
  for(const b of [bgBelly,bgSea]){ b.width=Math.round(W*DPR); b.height=Math.round(H*DPR); b.style.width=W+'px'; b.style.height=H+'px'; }
  let c=bgBelly.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#cdf3f8'); g.addColorStop(0.55,'#a4e1ea'); g.addColorStop(1,'#83cddc');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){ const x=W*(i+0.3)/6; c.fillStyle='rgba(255,255,255,0.09)'; c.beginPath(); c.moveTo(x-30,0); c.lineTo(x+40,0); c.lineTo(x+140,H); c.lineTo(x+40,H); c.closePath(); c.fill(); }
  c.fillStyle='#f6e2c2'; c.beginPath(); c.moveTo(0,H); c.lineTo(0,H-40); for(let x=0;x<=W;x+=40) c.quadraticCurveTo(x+20,H-55-Math.sin(x*0.02)*8,x+40,H-40); c.lineTo(W,H); c.closePath(); c.fill();
  for(let i=0;i<Math.max(4,W/90);i++){ const x=Math.random()*W, y=H-20-Math.random()*16; c.fillStyle=['#ffd1dc','#fff2b3','#d4f1ff'][i%3]; c.beginPath(); c.ellipse(x,y,6,4,0,0,TAU); c.fill(); }
  for(let i=0;i<10;i++){ const side=i%2?W-Math.random()*W*0.18:Math.random()*W*0.18; const hgt=60+Math.random()*120; c.strokeStyle=['#9fdcb2','#b9e8a8','#8fd3c0'][i%3]; c.lineWidth=7; c.lineCap='round'; c.beginPath(); c.moveTo(side,H-30); for(let k=1;k<=6;k++) c.lineTo(side+Math.sin(k*1.3+i)*9,H-30-hgt*k/6); c.stroke(); }
  for(let i=0;i<40;i++){ c.strokeStyle='rgba(255,255,255,0.35)'; c.lineWidth=1.5; c.beginPath(); c.arc(Math.random()*W,Math.random()*H*0.9,1.5+Math.random()*5,0,TAU); c.stroke(); }
  grain(c,W,H,Math.floor(W*H/55),0.10,0.05);
  // sea + sky (sea view)
  c=bgSea.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
  const sf=L.surf;
  g=c.createLinearGradient(0,0,0,sf); g.addColorStop(0,'#ffe9f1'); g.addColorStop(0.5,'#fff6e2'); g.addColorStop(1,'#d8f4ff');
  c.fillStyle=g; c.fillRect(0,0,W,sf+2);
  const sx=W*0.84, sy=Math.max(50,sf*0.14);
  g=c.createRadialGradient(sx,sy,8,sx,sy,90); g.addColorStop(0,'rgba(255,240,170,0.95)'); g.addColorStop(0.45,'rgba(255,236,170,0.55)'); g.addColorStop(1,'rgba(255,236,170,0)');
  c.fillStyle=g; c.beginPath(); c.arc(sx,sy,90,0,TAU); c.fill();
  c.fillStyle='#fff3b8'; c.beginPath(); c.arc(sx,sy,30,0,TAU); c.fill();
  for(let i=0;i<5;i++){ const cx=W*(0.1+i*0.21)+rnd(-20,20), cy=sf*(0.12+((i*37)%5)*0.06); cloud(c,cx,cy,22+Math.random()*14); }
  g=c.createLinearGradient(0,sf,0,H); g.addColorStop(0,'#aee9f0'); g.addColorStop(1,'#62bfd6');
  c.fillStyle=g; c.fillRect(0,sf,W,H-sf);
  c.strokeStyle='rgba(255,255,255,0.55)'; c.lineWidth=3;
  for(let row=0;row<5;row++){ const y=sf+14+row*((H-sf)/5); c.beginPath(); for(let x=-20+(row%2)*30;x<W+40;x+=60){ c.moveTo(x,y); c.quadraticCurveTo(x+15,y-6,x+30,y);} c.stroke(); }
  grain(c,W,H,Math.floor(W*H/55),0.10,0.05);
}
function cloud(c,x,y,r){ c.fillStyle='rgba(120,140,190,0.10)'; for(const [dx,dy,k] of [[-1.1,0.3,0.7],[0,0,1],[1.1,0.25,0.75],[0.5,-0.5,0.7]]){ c.beginPath(); c.arc(x+dx*r,y+dy*r+5,r*k,0,TAU); c.fill(); } c.fillStyle='#ffffff'; for(const [dx,dy,k] of [[-1.1,0.3,0.7],[0,0,1],[1.1,0.25,0.75],[0.5,-0.5,0.7]]){ c.beginPath(); c.arc(x+dx*r,y+dy*r,r*k,0,TAU); c.fill(); } }
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function whalePath(c){
  c.beginPath(); c.moveTo(300,-190);
  c.bezierCurveTo(525,-190,652,-62,650,175); c.lineTo(650,630);
  c.bezierCurveTo(650,795,520,835,300,835); c.bezierCurveTo(80,835,-50,795,-50,630);
  c.lineTo(-50,175); c.bezierCurveTo(-52,-62,75,-190,300,-190); c.closePath();
}
function buildWhale(){

// ================================================================ transforms
function lerpT(a,b,t){ return {s:lerp(a.s,b.s,t),ox:lerp(a.ox,b.ox,t),oy:lerp(a.oy,b.oy,t)}; }
function seaWhaleCx(t){
  const ww=700*L.ws;
  if(t<3) return W/2;
  if(t<6) return W/2+ease((t-3)/3)*(W/2+ww);
  if(t<12) return W+ww*2;
  if(t<15) return -ww+ease((t-12)/3)*(W/2+ww);
  return W/2;
}
function seaWhaleT(t,cxOverride){
  const s=L.ws, cx=cxOverride!=null?cxOverride:seaWhaleCx(t);
  return {s,ox:cx-300*s,oy:L.surf+18-300*s+Math.sin(gtime*1.6)*4};
}
function camE(){
  if(S.phase==='belly') return 0;
  if(S.phase==='sneeze') return ease((S.pt-0.9)/2.0);
  if(S.phase==='sea') return 1;
  if(S.phase==='return') return 1-ease(S.pt/1.6);
  return 0;
}
function tfP(){ const e=camE(); return e<=0?L.belly:(e>=1?L.sea:lerpT(L.belly,L.sea,e)); }
function tfW(){
  const e=camE();
  if(S.phase==='belly') return L.belly;
  if(S.phase==='sneeze') return lerpT(L.belly,seaWhaleT(0,W/2),e);
  if(S.phase==='sea') return seaWhaleT(S.seaT);
  return lerpT(L.belly,seaWhaleT(0,W/2),e);
}

function stepRide(r,dt){
  const p=pathById(r.pid); if(!p){ if(r.kind==='fish') fishDive(r,0,0); else toLoose(r); return; }
  if(r.xferT>0) r.xferT-=dt;
  if(r.boingT>0) r.boingT-=dt;
  if(p.len<1){ r.s=0; r.v=0; r.wt+=dt; return; }
  const q=p.posAt(r.s);
  const a=G*q.ty;
  if(r.v===0&&Math.abs(a)<G*r.mus){ r.wt+=dt; checkEnds(r,p,true); return; }
  r.v+=a*dt;
  r.v*=Math.exp(-(r.fric+38*q.k)*dt);
  if(Math.abs(r.v)<5&&Math.abs(a)<G*r.mus) r.v=0;
  r.v=clamp(r.v,-MAXV,MAXV);
  r.wt=Math.abs(r.v)<20?r.wt+dt:0;
  r.s+=r.v*dt;
  r.rot+=r.v*dt/r.r;
  checkEnds(r,p,false);
  if(r.state==='ride'&&!p.sea&&r.boingT<=0&&Math.abs(r.v)>150){
    const th=thickAt(q.x,q.y); if(th>=2){ r.hop=1; r.v*=1.07; r.boingT=0.7; sBoing(); S.stats.boings++; }
  }

function checkEnds(r,p,resting){

  else if(r.s<=0.01&&r.v<=0){ r.s=0; if(r.v<-90) r.v=-r.v*0.15; else r.v=0; if(r.kind==='fish'){ r.stuckT+=1/60; } }
}
function atEnd(r,p,resting){
  if(p.next&&!p.drawing){
    const q=pathById(p.next.pid);

        const qs=clamp(p.next.s,0,q.len),qq=q.posAt(qs),pe=p.posAt(p.len);
        const dot=pe.tx*qq.tx+pe.ty*qq.ty;
        let v=r.v*(dot>=0?Math.max(0.55,dot):Math.min(-0.55,dot)); if(Math.abs(v)<20) v=(dot>=0?20:-20);
        r.pid=q.id; r.s=clamp(qs+(v>=0?0.6:-0.6),0,q.len); r.v=v; r.xferT=0.2; return;
      }
      r.s=p.len; return;
    } else p.next=null;
  }
  const e=p.last;
  if(r.kind==='fish'){ if(!p.drawing){ const q=p.posAt(p.len); fishDive(r,q.tx*Math.max(r.v,60),q.ty*Math.max(r.v,60)); return; } r.s=p.len; r.v=0; return; }
  if(!p.sea){
    const R=roomAt(e.x,e.y);
    if(R){

      r.s=p.len; r.v=0;
      if(!r.rejected){ r.rejected=true; sReject(); S.stats.reject++; S.whale.tilt=0.25; const sp=toScr(tfP(),e.x,e.y); burst(sp.x,sp.y,4,['#ffffff','#d8f3ff'],{min:20,max:60,g:-40,shape:'bubble'}); }

    }
  }

  const th=thickAt(e.x,e.y), b=0.12+0.16*th;
  if(r.v>90){ r.v=-r.v*b; if(th>=2&&r.boingT<=0){ r.hop=1; sBoing(); r.boingT=0.5; S.stats.boings++; } else sClunk(r.v); }
  else r.v=0;
}
function enterRoom(r,R){

function collide(){
  const by=new Map();
  for(const r of S.riders){ if(r.state!=='ride') continue; let a=by.get(r.pid); if(!a){a=[];by.set(r.pid,a);} a.push(r); }
  for(const [pid,arr] of by){
    if(arr.length<2) continue;
    const p=pathById(pid); if(!p) continue;
    arr.sort((a,b)=>a.s-b.s);
    for(let i=0;i<arr.length-1;i++){
      const a=arr[i],b=arr[i+1],min=(a.r+b.r)*0.92,gap=b.s-a.s;
      if(a.link===b&&a.linkT>0){ const v=(a.v+b.v)/2; a.v=b.v=v; if(gap!==min){ const mid=(a.s+b.s)/2; a.s=clamp(mid-min/2,0,p.len); b.s=clamp(mid+min/2,0,p.len);} continue; }
      if(gap<min){
        const rel=a.v-b.v;
        if(rel>0){
          if(Math.abs(b.v)<30&&a.v>70){
            const v=a.v*0.9+70; a.v=b.v=v; a.link=b; b.link=a; a.linkT=b.linkT=1.5; sClunk(a.v); sBoing(); S.stats.pushes++;
            const q=riderPos(b),sp=toScr(tfP(),q.x,q.y); burst(sp.x,sp.y,6,['#fff','#ffd6e6','#fff2b0'],{min:40,max:120,shape:'star'});
          }else if(Math.abs(a.v)<30&&b.v<-70){
            const v=b.v*0.9-70; a.v=b.v=v; a.link=b; b.link=a; a.linkT=b.linkT=1.5; sClunk(v); S.stats.pushes++;
          }else{
            const va=a.v,vb=b.v,m=(va+vb)/2,e=0.35; a.v=m-e*(va-vb)/2; b.v=m+e*(va-vb)/2; if(Math.abs(rel)>80) sClunk(rel);
          }
        }
        const over=min-gap; a.s=clamp(a.s-over/2,0,p.len); b.s=clamp(b.s+over/2,0,p.len);
        if(b.s-a.s<min*0.9){ if(a.s<=0) b.s=Math.min(p.len,a.s+min); else a.s=Math.max(0,b.s-min); }
      }
    }
  }
  for(const r of S.riders){ if(r.linkT>0){ r.linkT-=1/120; if(r.linkT<=0||!r.link||r.link.state!=='ride'||r.link.pid!==r.pid){ r.link=null; r.linkT=0; } } }
}

function foamLift(dt){

  }

      if(sr0.pop<=0&&gtime-sr0.born>0.9&&!IN.stroke){ for(const p of S.paths){ if(!p.drawing&&p.len>16&&hyp(p.first.x-sr0.x,p.first.y-sr0.y)<30&&!S.riders.some(o=>o.state==='ride'&&o.pid===p.id&&o.s<sr0.r*2.5)){ attach(sr0,p,0,0); break; } } }
      continue; }
    sr.empty+=dt;

    if(n<3&&food<MAXFOOD){ sr.cd-=dt; if(sr.cd<=0){ const r=mkRider(k,SRC[k].x,SRC[k].y); r.pop=1; S.riders.push(r); food++; } }

function startFloat(r){ const q=riderPos(r); r.state='float'; r.t=0; r.fx=q.x; r.fy=q.y; r.x=q.x; r.y=q.y; r.v=0; sBubble(); }

// ================================================================ strokes / input
const IN={id:null,stroke:null,lastT:0};
function inBelly(w){ return w.x>-8&&w.x<BW+8&&w.y>-8&&w.y<BH+8; }
function inSky(w){ return w.x>-4&&w.x<BW+4&&w.y>-4&&w.y<SEA_Y-14; }
function inWhale(T,sx,sy){ const l=toWorld(T,sx,sy); return l.x>-60&&l.x<660&&l.y>-200&&l.y<850; }
function down(sx,sy){
  S.idle=0; if(S.demo){ S.demo=null; }
  const P=tfP();
  if(S.phase==='belly'){
    const w=toWorld(P,sx,sy);
    if(inBelly(w)){ startStroke(clampW(w)); return; }
    if(hyp(sx-S.gf.x,sy-S.gf.y)<44){ S.gf.cheer=0.6; sBubble(); return; }
    if(inWhale(tfW(),sx,sy)){ S.whale.squish=0.5; sTap(true); return; }
    return;
  }

    const Wt=tfW();
    if(S.whaleBack&&inWhale(Wt,sx,sy)){ startReturn(); return; }
    const w=toWorld(P,sx,sy);
    if(inSky(w)){ startStroke(clampW(w)); return; }
    for(const r of S.riders){ if(r.kind==='fish'){ const q=riderPos(r),sp=toScr(P,q.x,q.y); if(hyp(sp.x-sx,sp.y-sy)<36){ r.wig=1; sBubble(); return; } } }

}
function clampW(w){ if(S.phase==='belly') return {x:clamp(w.x,10,BW-10),y:clamp(w.y,10,BH-10)}; return {x:clamp(w.x,6,BW-6),y:clamp(w.y,6,SEA_Y-16)}; }
function startStroke(w){
  const th=thickAt(w.x,w.y);

  S.taps++; sTap(false);
  let ext=null,rep=null,trace=null,de=34,ds=26,dt=26;
  for(const p of S.paths){

}
function moveStroke(sx,sy,tStamp){
  const st=IN.stroke; if(!st) return;
  const P=tfP(); const w=clampW(toWorld(P,sx,sy));
  const dd=hyp(w.x-st.lx,w.y-st.ly);
  st.moved+=dd;
  const ang=Math.atan2(w.y-st.ly,w.x-st.lx);
  if(dd>2){ if(st.lastAng!=null){ let da=Math.abs(ang-st.lastAng); if(da>Math.PI) da=TAU-da; st.bend=st.bend*0.7+da*0.3; } st.lastAng=ang; }
  const dtE=Math.max(0.008,(tStamp-(st.lt||tStamp-16))/1000); st.lt=tStamp;
  const speed=dd*P.s/dtE;
  st.lx=w.x; st.ly=w.y;
  if(!st.p){
    if(hyp(w.x-st.x0,w.y-st.y0)<7) return;
    for(const b of S.bumps) if(b.held){ b.held=false; b.rel=gtime; }
    S.everStroke=true;
    let p;
    if(st.ext){ p=st.ext; p.drawing=true; p.next=null; p.lock=p.pts.length-1; p.wob=0; }

      if(S.phase==='belly'){ let best=null,bd=46; for(const r of S.riders){ if(!pickable(r,-1)) continue; const q=riderPos(r),d=hyp(q.x-sx0,q.y-sy0); if(d<bd){bd=d;best=q;} } if(best&&!st.rep){ sx0=best.x; sy0=best.y; } }
      p=new Path(sx0,sy0); p.lock=0; p.trace=st.trace; S.paths.push(p); capPaths();

    }

    }

  }

}
function endStroke(){
  const st=IN.stroke; IN.stroke=null; if(!st) return;

  if(!st.p){
    // a tap: the jelly there grows a little thicker
    const k=tkey(st.x0,st.y0), v=Math.min(4,(S.thick.get(k)||0)+1); S.thick.set(k,v);
    if(S.thick.size>60){ const first=S.thick.keys().next().value; S.thick.delete(first); }
    if(v>=2) sBoing();
    return;
  }
  finishPath(st.p,st);
}
function finishPath(p,st){
  p.drawing=false; p.wob=1;
  if(p.len<16){ removePath(p); return; }
  if(S.phase==='sea'&&st&&st.trace&&pathById(st.trace.id)){
    const t=st.trace; let near=0; for(const pt of p.pts) if(t.nearest(pt.x,pt.y).d<34) near++;
    if(near/p.pts.length>=0.7&&p.len>=60){
      removePath(p); for(const q of S.paths) q.fav=false; t.fav=true; t.wob=1; S.favId=t.id; S.stats.favSet++;
      sSuccess(); const P=tfP(); for(let i=0;i<t.pts.length;i+=4){ const sp=toScr(P,t.pts[i].x,t.pts[i].y); burst(sp.x,sp.y,1,['#ffe27a','#fff6c4','#ffb3c7'],{min:20,max:80,shape:'star',g:40}); }
      return;
    }
  }
  if(st&&st.deferRep&&pathById(st.deferRep.id)) removePath(st.deferRep);
  const e=p.last;
  if(!p.sea){
    for(const k in ROOMS){ const R=ROOMS[k]; if(hyp(e.x-R.mx,e.y-R.my)<52&&!(k==='cup'&&S.cup.domeR>20)){ p.pts.push({x:R.mx,y:R.my}); p.recalc(); break; } }
  }
  let best=null,bd=32,bs=0,toStart=false;
  for(const q of S.paths){ if(q===p||q.alpha<1) continue; const d=hyp(p.last.x-q.first.x,p.last.y-q.first.y); if(d<bd){bd=d;best=q;toStart=true;bs=0;} }
  if(!best){ bd=22; for(const q of S.paths){ if(q===p||q.alpha<1) continue; const n=q.nearest(p.last.x,p.last.y); if(n.d<bd&&n.s>4){bd=n.d;best=q;bs=n.s;toStart=false;} } }
  if(best&&!(best.next&&best.next.pid===p.id)){
    const tp=toStart?best.first:best.posAt(bs); p.pts.push({x:tp.x,y:tp.y}); p.recalc(); p.next={pid:best.id,s:bs};
    const P=tfP(),sp=toScr(P,tp.x,tp.y); burst(sp.x,sp.y,5,['#fff','#ffe0ef'],{min:20,max:70,shape:'star',g:0}); sPop();
  }

}
function removePath(p){
  for(const r of S.riders){ if(r.state==='ride'&&r.pid===p.id){ if(r.kind==='fish') fishDive(r,0,-80); else toLoose(r); } }
  for(const q of S.paths) if(q.next&&q.next.pid===p.id) q.next=null;
  const i=S.paths.indexOf(p); if(i>=0) S.paths.splice(i,1);
  if(S.favId===p.id) S.favId=0;
}
function capPaths(){
  while(S.paths.length>MAXPATHS){
    let victim=null;
    for(const p of S.paths){ if(p.drawing||p.fav) continue; if(!S.riders.some(r=>r.state==='ride'&&r.pid===p.id)){ victim=p; break; } }
    if(!victim) victim=S.paths.find(p=>!p.drawing&&!p.fav);
    if(!victim) break;
    removePath(victim);
  }
}

// ================================================================ phases
function startSneeze(){

  S.phase='sneeze'; S.pt=0; S.sneezed=false; S.demo=null; sInhale();
}
function doAchoo(){
  S.sneezed=true; sAchoo(); S.rainbow=4.5; S.shake=0.35;

  burst(b.x,b.y,40,['#ff9aa8','#ffc98a','#fff09a','#a8eba0','#9fd4ff','#c9b2ff'],{dir:-Math.PI/2,spread:0.9,min:200,max:520,g:300,smin:3,smax:8,life:1.6});

  if(!S.paths.length){ const p=new Path(80,160); for(let i=1;i<=40;i++){ p.pts.push({x:80+i*11,y:160+Math.sin(i/40*Math.PI)*-60+i*9}); } p.recalc(); p.drawing=false; p.sea=true; S.paths.push(p); }
}
function enterSea(){
  S.phase='sea'; S.seaT=0; S.whaleBack=false; S.favId=0; S.idle=0; S.stats.cycles++;
  for(const p of S.paths) p.fav=false;
  const snacks=buildSnacks();

  let si=0;
  for(let i=0;i<nN+3;i++){
    const small=i>=nN, r=mkRider(small?'fishS':'fish',rnd(-80,BW+80),SEA_Y+rnd(16,50));
    r.kind='fish'; r.small=small; r.col=FISHCOL[i%FISHCOL.length]; r.snack=small?(snacks[(si++)%snacks.length]):snacks[(si++)%snacks.length];
    r.state='swim'; r.target=0; r.cool=rnd(0.3,2.5)+(small?0:0.6); r.face=Math.random()<0.5?1:-1; r.wig=0; r.vx=0;

  }
}
function buildSnacks(){
  const g=S.log,a=[];
  for(let i=0;i<Math.max(1,g.toast);i++) a.push('jamtoast');
  if(g.straw) a.push('jam');
  for(let i=0;i<Math.min(2,g.milk);i++) a.push('milk');
  if(g.straw>2) a.push('straw');
  if(g.bread>g.toast) a.push('toast');
  return a;
}
function startReturn(){
  if(IN.stroke){ const p=IN.stroke.p; IN.stroke=null; if(p) finishPath(p,null); }
  S.phase='return'; S.pt=0; sSuccess(); S.whale.happy=1.5;
  S.jar={level:0,full:false,pending:0,flash:0,splash:0}; S.oven={bake:[],pending:0,glow:0,full:false};
  S.cup={level:0,domeR:0,domeT:0,wob:0}; S.plate={jam:false,toast:false,combine:0,stack:0,flash:0}; S.travel=[];
  for(const r of S.riders){ if(r.kind==='fish'&&r.state==='ride'){ const q=riderPos(r); r.state='leave'; r.x=q.x; r.y=q.y; r.vx=rnd(-60,60); r.vy=-120; } else if(r.kind==='fish'){ r.state='leave'; r.vx=rnd(-60,60); r.vy=-60; } }
}
function finishReturn(){
  const keep=S.paths.filter(p=>p.fav);
  S.paths=keep; for(const p of keep){ p.sea=false; p.next=null; p.alpha=1; p.wob=1; p.lifted=false; }
  S.riders=[]; S.log={straw:0,bread:0,milk:0,toast:0};
  S.src={straw:{cd:0.3,empty:0},bread:{cd:0.6,empty:0},milk:{cd:0.9,empty:0}};
  S.phase='belly'; S.pt=0; S.cycle++; S.fullDone=false; S.fullT=0; S.demoDone=false; S.demoSeaDone=false; S.idle=0; S.whaleBack=false; S.favId=0;
  S.everStroke=false;
}

// ================================================================ fish (sea)
function fishDive(r,vx,vy){ const q=riderPos(r); r.state='dive'; r.x=q.x; r.y=q.y; r.vx=vx; r.vy=Math.min(vy,40)-60; r.link=null; }
function choosePath(r){
  const ps=S.paths.filter(p=>p.len>40&&p.alpha>=1&&!p.drawing); if(!ps.length) return null;
  let tot=0; const w=ps.map(p=>{ let n=0; for(const f of S.riders) if(f.kind==='fish'&&f.target===p.id&&f!==r) n++;
    let v=r.small?Math.pow(1/(p.len+60),1.3)*1e4:Math.pow(p.len,2)/1e5; if(!r.small&&n>Math.ceil(p.len/140)) v*=0.15; if(r.small&&n>2) v*=0.2; if(p.fav) v*=1.6; tot+=v; return v; });
  let x=Math.random()*tot; for(let i=0;i<ps.length;i++){ x-=w[i]; if(x<=0) return ps[i]; } return ps[ps.length-1];
}
function updateFish(r,dt){
  r.wig=Math.max(0,(r.wig||0)-dt*2);
  if(r.state==='swim'){
    r.cool-=dt;
    let p=r.target?pathById(r.target):null;
    if(!p&&r.cool<=0){ p=choosePath(r); r.target=p?p.id:0; }
    const tx=p?p.first.x:(r.x+r.face*40);
    const sp=r.small?170:115; const dx=tx-r.x;
    r.vx=lerp(r.vx,clamp(dx*2,-sp,sp),dt*3); r.x+=r.vx*dt; if(Math.abs(r.vx)>5) r.face=r.vx>0?1:-1;
    r.y=lerp(r.y,SEA_Y+28+Math.sin(gtime*2+r.id)*8,dt*3);
    if(!p){ const lim=((W-L.sea.ox)/L.sea.s); if(r.x>lim+40) r.face=-1, r.x=lim+40; if(r.x<-L.sea.ox/L.sea.s-40) r.face=1, r.x=-L.sea.ox/L.sea.s-40; r.x+=r.face*20*dt; }
    if(p&&Math.abs(dx)<26&&r.cool<=0){
      const st=p.first;
      if(st.y>SEA_Y-4){ attach(r,p,0,30); return; }
      r.state='hop'; r.h={x0:r.x,y0:r.y,x1:st.x,y1:st.y,t:0,T:0.55+hyp(st.x-r.x,st.y-r.y)/900,pid:p.id}; sSplash();
      const P=tfP(),s0=toScr(P,r.x,SEA_Y); burst(s0.x,s0.y,6,['#ffffff','#d9f6ff'],{dir:-Math.PI/2,spread:0.8,min:60,max:160,g:400});
      if(!r.small&&Math.random()<0.08){ const buddy=S.riders.find(f=>f.kind==='fish'&&f.state==='swim'&&f!==r&&!f.small); if(buddy){ buddy.state='hop'; buddy.h={x0:buddy.x,y0:buddy.y,x1:st.x,y1:st.y,t:-0.06,T:r.h.T,pid:p.id,buddy:true}; r.buddy=buddy; } }
    }
  }else if(r.state==='hop'){
    const h=r.h; h.t+=dt; const f=clamp(h.t/h.T,0,1);
    r.x=lerp(h.x0,h.x1,f); r.y=lerp(h.y0,h.y1,f)-Math.sin(Math.PI*f)*(70+Math.abs(h.y1-h.y0)*0.25); r.face=h.x1>=h.x0?1:-1;
    if(f>=1){
      const p=pathById(h.pid); if(!p){ fishDive(r,0,0); r.state='dive'; return; }
      if(h.buddy) return; // waits to be placed by its friend
      const occ=S.riders.some(o=>o!==r&&o.state==='ride'&&o.pid===p.id&&o.s<r.r*2.4);
      if(occ){ r.state='queue'; r.t=0; r.qp=p.id; return; }
      if(r.buddy&&r.buddy.state==='hop'){ const b=r.buddy; attach(b,p,0,40); attach(r,p,Math.min(p.len,(r.r+b.r)*0.95),40); r.link=b; b.link=r; r.linkT=b.linkT=2.2; r.buddy=null; }
      else attach(r,p,0,40);
      S.stats.fishRides[p.id]=(S.stats.fishRides[p.id]||0)+1;
    }
  }else if(r.state==='queue'){
    r.t+=dt; const p=pathById(r.qp); if(!p){ fishDive(r,0,0); return; }
    r.x=p.first.x-r.r*0.6+Math.sin(gtime*5+r.id)*3; r.y=p.first.y-r.r-8+Math.sin(gtime*7)*3;
    const occ=S.riders.some(o=>o!==r&&o.state==='ride'&&o.pid===p.id&&o.s<r.r*2.4);
    if(!occ){ attach(r,p,0,40); S.stats.fishRides[p.id]=(S.stats.fishRides[p.id]||0)+1; }
    else if(r.t>3.5){ r.x=p.first.x; r.y=p.first.y; r.state='dive'; r.vx=rnd(-60,60); r.vy=-80; }
  }else if(r.state==='ride'){
    stepRide(r,dt);
    if(r.state==='ride'){ if(r.v===0) r.restT=(r.restT||0)+dt; else r.restT=0; if(r.restT>12||r.stuckT>3){ r.restT=0; r.stuckT=0; fishDive(r,rnd(-50,50),-160); } }
  }else if(r.state==='dive'){
    r.vy+=G*0.8*dt; r.x+=r.vx*dt; r.y+=r.vy*dt; if(Math.abs(r.vx)>5) r.face=r.vx>0?1:-1;
    if(r.y>=SEA_Y+8){ r.state='swim'; r.target=0; r.cool=r.small?rnd(0.1,0.5):rnd(0.8,2.2); r.vx*=0.3; sSplash();
      const P=tfP(),sp=toScr(P,r.x,SEA_Y); burst(sp.x,sp.y,8,['#ffffff','#d9f6ff','#bdefff'],{dir:-Math.PI/2,spread:0.9,min:60,max:200,g:420}); }
  }else if(r.state==='leave'){
    r.vy+=G*0.6*dt; r.x+=r.vx*dt; r.y+=r.vy*dt;
  }
}

// ================================================================ focus / guidance
function computeFocus(){
  S.focus=null;
  if(S.phase==='belly'){
    if(S.cycle===1&&!S.everStroke){ S.focus={kind:'hint',x:HINT.x,y:HINT.y,rider:srcRider('straw')}; return; }
    for(const r of S.riders){ if(isStuck(r)){ const q=riderPos(r); S.focus={kind:'stuck',x:q.x,y:q.y,rider:r}; return; } }
    const breadBusy=S.riders.some(r=>r.kind==='bread'&&(r.state==='ride'&&Math.abs(r.v)>1||r.state==='enter'))||S.oven.bake.length||S.travel.some(t=>t.kind==='toast')||S.plate.toast;
    const strawBusy=S.riders.some(r=>r.kind==='straw'&&(r.state==='ride'&&Math.abs(r.v)>1||r.state==='enter'));
    let k=null;
    if(!S.jar.full&&!strawBusy) k='straw';
    else if(S.log.toast<1&&!breadBusy) k='bread';
    else if(S.cup.level<2) k='milk';
    else if(S.log.toast<1&&!S.plate.jam&&!S.travel.some(t=>t.kind==='jam')&&!strawBusy) k='straw';
    if(k){ const r=srcRider(k); if(r) S.focus={kind:'src',x:r.x,y:r.y,rider:r}; }
  }else if(S.phase==='sea'){
    if(S.whaleBack) S.focus={kind:'whale'};
    else if(!S.favId){ let best=null; for(const p of S.paths){ if(p.alpha>=1&&!p.drawing&&(!best||p.len>best.len)) best=p; } if(best) S.focus={kind:'shimmer',pid:best.id}; }
  }
}
function updateDemo(dt){
  if(S.demo){
    S.demo.t+=dt; if(S.demo.t>2.4){ S.demo=null; }
    return;
  }
  if(IN.stroke) return;
  if(S.phase==='belly'&&!S.demoDone&&S.idle>4){
    const a=srcRider('straw'); const sx=a?a.x:SRC.straw.x, sy=a?a.y:SRC.straw.y;
    const pts=[]; for(let i=0;i<=18;i++){ const f=i/18; pts.push({x:sx+Math.sin(f*2.2)*14,y:sy+f*170}); }
    S.demo={t:0,pts,space:'P'}; S.demoDone=true;
  }else if(S.phase==='sea'&&!S.demoSeaDone&&!S.favId&&!S.whaleBack&&S.idle>4&&S.seaT>3){
    let best=null; for(const p of S.paths) if(p.alpha>=1&&(!best||p.len>best.len)) best=p;
    if(best){ const pts=[]; const n=18; for(let i=0;i<=n;i++){ const q=best.posAt(best.len*0.65*i/n); pts.push({x:q.x,y:q.y}); } S.demo={t:0,pts,space:'P'}; S.demoSeaDone=true; }
  }
}

// ================================================================ update
function update(dt){
  gtime+=dt; S.idle+=dt;
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt);
  if(S.rainbow>0) S.rainbow=Math.max(0,S.rainbow-dt);
  const w=S.whale;
  w.happy=Math.max(0,w.happy-dt); w.squish=Math.max(0,w.squish-dt*1.5);
  w.blinkT-=dt; if(w.blinkT<=0){ w.blink=0.18; w.blinkT=rnd(2.2,4.5); } w.blink=Math.max(0,w.blink-dt);
  for(const p of S.paths){ p.wob=Math.max(0,p.wob-dt*1.6); }
  for(let i=S.bumps.length-1;i>=0;i--){ const b=S.bumps[i]; if(!b.held&&gtime-b.rel>1.3) S.bumps.splice(i,1); }

  if(S.phase==='belly'||S.phase==='sneeze'){
    if(S.phase==='belly'){ updateSources(dt); foamLift(dt); }
    const n=Math.max(1,Math.ceil(dt*120)), h=dt/n;
    for(let k=0;k<n;k++){ for(const r of S.riders) if(r.state==='ride') stepRide(r,h); collide(); }
    for(let i=S.riders.length-1;i>=0;i--){
      const r=S.riders[i];
      r.hop=Math.max(0,r.hop-dt*2.2); r.pop=Math.max(0,r.pop-dt*2.5);
      if(r.state==='enter'){ r.t+=dt; const R=r.room; const f=ease(r.t/0.4); r.x=lerp(r.ex,R.mx,f); r.y=lerp(r.ey,R.my+18,f);
        if(r.t>=0.4){ S.riders.splice(i,1); roomReceive(R,r.kind); } }
      else if(r.state==='float'){ r.t+=dt; const f=ease(r.t/1.6), s=SRC[r.kind]; r.x=lerp(r.fx,s.x,f); r.y=lerp(r.fy,s.y,f)-Math.sin(Math.PI*f)*40;
        if(r.t>=1.6){ if(srcRider(r.kind)){ r.state='loose'; r.looseT=0; r.x=s.x+rnd(-30,30); r.y=s.y+50; } else { r.state='src'; r.x=s.x; r.y=s.y; r.pop=1; } } }
      else if(r.state==='ride'){ const p=pathById(r.pid); if(p&&r.s>=p.len-3&&!r.rejected) r.stuckT+=dt; }
    }
    updateRooms(dt);
    // whale head tilt when something is stuck
    let stuck=null; for(const r of S.riders) if(isStuck(r)){ stuck=r; break; }
    w.tilt=lerp(w.tilt,stuck?0.17:0,dt*3);
    w.bubT-=dt; if(w.bubT<=0&&S.phase==='belly'){ w.bubT=rnd(2.5,4.5); const b=toScr(tfW(),300,-188); for(let i=0;i<3;i++) addPart({x:b.x+rnd(-6,6),y:b.y-i*8,vx:rnd(-10,10),vy:-rnd(30,60),g:-10,t:0,life:rnd(1.4,2.2),size:rnd(3,6),col:'#ffffff',shape:'bubble'}); }
    if(S.phase==='belly'){
      if(!S.fullDone&&S.jar.full&&S.cup.level>=2&&S.log.toast>=1){ S.fullT+=dt; if(S.fullT>1.6&&!IN.stroke){ S.fullDone=true; startSneeze(); } }
      updateGuideFish(dt);
    }
  }
  if(S.phase==='sneeze'){
    S.pt+=dt; w.mouth=S.pt<0.9?S.pt/0.9:Math.max(0,1-(S.pt-0.9)*2);
    if(!S.sneezed&&S.pt>=0.9) doAchoo();
    if(S.pt>=3.0) enterSea();
    updateGuideFish(dt);
  }else if(S.phase==='sea'){
    S.seaT+=dt;
    if(!S.whaleBack&&S.seaT>=15){ S.whaleBack=true; sSuccess(); }
    const n=Math.max(1,Math.ceil(dt*120)), h=dt/n;
    for(let k=0;k<n;k++){ for(const r of S.riders) if(r.state==='ride') stepRide(r,h); collide(); }
    for(const r of S.riders){ r.hop=Math.max(0,r.hop-dt*2.2); if(r.state!=='ride') updateFish(r,dt); else updateFish(r,0); }
    if(S.seaT<3.2&&Math.random()<dt*6){ const b=toScr(tfW(),300,-185); burst(b.x,b.y,2,['#ff9aa8','#fff09a','#9fd4ff','#a8eba0'],{dir:-Math.PI/2,spread:0.5,min:150,max:300,g:300}); }
  }else if(S.phase==='return'){
    S.pt+=dt;
    for(const p of S.paths){ if(!p.fav){ const a=1-ease(S.pt/0.8); if(p.alpha>=1&&a<1){ const P=tfP(); for(let i=0;i<p.pts.length;i+=10){ const sp=toScr(P,p.pts[i].x,p.pts[i].y); burst(sp.x,sp.y,1,['#ffffff','#d9f6ff'],{min:20,max:60,g:-60,shape:'bubble'}); } } p.alpha=Math.min(p.alpha,a); } }
    for(const r of S.riders) updateFish(r,dt);
    if(S.pt>=1.8) finishReturn();
  }
  computeFocus();
  updateDemo(dt);
  for(let i=S.parts.length-1;i>=0;i--){ const p=S.parts[i]; p.t+=dt; if(p.t>=p.life){ S.parts.splice(i,1); continue; } p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-dt*1.2; }
}
function updateGuideFish(dt){
  const f=S.gf, T=tfW();
  let hx,hy;
  if(portrait){ const top=T.oy-195*T.s; hx=W*0.8; hy=Math.max(SA.t+44,(SA.t+top)/2+6); }
  else { hx=T.ox+720*T.s; hy=T.oy+150*T.s; hx=Math.min(hx,W-SA.r-50); }
  let tx=hx,ty=hy,look=null;
  f.point=Math.max(0,f.point-dt);
  const fo=S.focus;
  if(fo&&fo.x!=null) look=toScr(tfP(),fo.x,fo.y);
  if(f.point>0){ const r=srcRider('bread'); if(r) look=toScr(tfP(),r.x,r.y); }
  if(look&&(f.point>0||(fo&&fo.kind!=='hint'))){
    if(portrait){ tx=clamp(look.x,SA.l+40,W-SA.r-40); ty=Math.max(SA.t+40,T.oy-215*T.s); if(ty>T.oy-60*T.s) ty=hy; }
    else { tx=Math.min(W-SA.r-46,T.ox+680*T.s); ty=clamp(look.y,SA.t+40,H-SA.b-40); }
  }
  f.x=lerp(f.x||hx,tx,dt*1.8); f.y=lerp(f.y||hy,ty+Math.sin(gtime*2.1)*6,dt*1.8);
  const lt=look||{x:W/2,y:H/2};
  const ang=Math.atan2(lt.y-f.y,lt.x-f.x); f.face=Math.cos(ang)>=0?1:-1;
  f.poke=(look&&(f.point>0||(fo&&fo.kind!=='hint')))?Math.max(0,Math.sin(gtime*7))*7:0;
  f.wig+=dt*(8+f.cheer*20); f.cheer=Math.max(0,f.cheer-dt);
  f.thought-=dt; if(f.thought<-3.5) f.thought=rnd(3,6);
  f.lookAt=look;
  if(look&&(f.point>0)&&Math.random()<dt*3){ addPart({x:f.x+f.face*20,y:f.y,vx:(lt.x-f.x)*0.5,vy:(lt.y-f.y)*0.5,g:0,t:0,life:1.6,size:rnd(3,5),col:'#ffffff',shape:'bubble'}); }
}

// ================================================================ rendering
function setT(T){ ctx.setTransform(DPR*T.s,0,0,DPR*T.s,DPR*T.ox,DPR*T.oy); }
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const e=camE();
  ctx.clearRect(0,0,cv.width,cv.height);
  const ba=Math.round(e*50)/50; if(ba!==bgAlpha){ bgAlpha=ba; bgSea.style.opacity=String(ba); }
  let shx=0,shy=0; if(S.shake>0){ shx=Math.sin(gtime*60)*S.shake*10; shy=Math.cos(gtime*47)*S.shake*6; }
  const Wt0=tfW(), P0=tfP();
  const Wt={s:Wt0.s,ox:Wt0.ox+shx,oy:Wt0.oy+shy}, P={s:P0.s,ox:P0.ox+shx,oy:P0.oy+shy};
  // whale + belly contents
  drawWhale(Wt);
  if(e>0){ // swimming fish (under water) and front water
    setT(P); for(const r of S.riders) if(r.kind==='fish'&&r.state==='swim') drawRider(r,P);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const sf=P.oy+SEA_Y*P.s;
    const g=ctx.createLinearGradient(0,sf-6,0,H); g.addColorStop(0,'rgba(150,225,238,0.55)'); g.addColorStop(1,'rgba(90,185,210,0.35)');
    ctx.globalAlpha=e; ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,sf);
    for(let x=0;x<=W+30;x+=30) ctx.quadraticCurveTo(x+15,sf-5+Math.sin(gtime*2+x*0.05)*3,x+30,sf); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,sf); for(let x=0;x<=W+30;x+=30) ctx.quadraticCurveTo(x+15,sf-5+Math.sin(gtime*2+x*0.05)*3,x+30,sf); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // thick jelly mounds (belly only)
  setT(P);
  if(e<1){ ctx.globalAlpha=1-e; drawMounds(); ctx.globalAlpha=1; }
  // paths
  const shimmer=S.focus&&S.focus.kind==='shimmer'?S.focus.pid:0;
  for(const p of S.paths) drawPath(p,P,shimmer===p.id);
  drawBumps();
  // riders
  for(const r of S.riders){ if(r.kind==='fish'&&r.state==='swim') continue; drawRider(r,P); }
  // particles
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawParts();
  if(S.rainbow>0) drawRainbowSpout(Wt);
  if(S.phase==='belly'||S.phase==='sneeze'){ ctx.globalAlpha=1-e; drawGuideFish(); ctx.globalAlpha=1; }
  drawFocus(P,Wt);
  drawDemo(P);
}
function drawWhale(T){
  const w=S.whale, s=T.s;
  // fins (dynamic)
  setT(T);
  const flap=Math.sin(gtime*2.4)*0.12;
  ctx.fillStyle='#78b0dc';
  ctx.save(); ctx.translate(-40,460); ctx.rotate(-0.5+flap); ctx.beginPath(); ctx.ellipse(-20,0,34,82,0,0,TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(640,460); ctx.rotate(0.5-flap); ctx.beginPath(); ctx.ellipse(20,0,34,82,0,0,TAU); ctx.fill(); ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  const sq=w.squish>0?Math.sin(w.squish*20)*w.squish*0.03:0;
  const cw=(CACHE.x1-CACHE.x0)*s, ch=(CACHE.y1-CACHE.y0)*s;
  const x=(T.ox+CACHE.x0*s)*DPR, y=(T.oy+CACHE.y0*s)*DPR;
  if(sq){ ctx.drawImage(whaleCache,x-cw*DPR*sq/2,y+ch*DPR*sq,cw*DPR*(1+sq),ch*DPR*(1-sq)); }
  else ctx.drawImage(whaleCache,x,y,cw*DPR,ch*DPR);
  setT(T);
  drawFace();
  drawRooms();
}
function drawFace(){
  const w=S.whale;
  ctx.save(); ctx.translate(300,-80); ctx.rotate(w.tilt); ctx.translate(-300,80);
  // look direction
  let lx=300,ly=300;
  if(IN.stroke){ lx=w.lookX; ly=w.lookY; }
  else if(S.focus&&S.focus.x!=null){ lx=S.focus.x; ly=S.focus.y; }
  else if(S.phase==='sea'||S.phase==='return'){ lx=300; ly=-600; }
  const happy=w.happy>0||S.phase==='sea';
  const sneeze=S.phase==='sneeze'&&S.pt<1.2;
  for(const ex of [200,400]){
    const ey=-88;
    if(happy||sneeze){
      ctx.strokeStyle='#36507a'; ctx.lineWidth=9; ctx.lineCap='round';
      ctx.beginPath(); if(sneeze){ const d=ex<300?1:-1; ctx.moveTo(ex-18*d,ey-12); ctx.lineTo(ex+10*d,ey); ctx.lineTo(ex-18*d,ey+12); } else ctx.arc(ex,ey+10,22,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      continue;
    }
    const bl=w.blink>0?0.15:1;
    ctx.fillStyle='rgba(40,70,110,0.18)'; ctx.beginPath(); ctx.ellipse(ex,ey+5,33,33*bl,0,0,TAU); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(ex,ey,32,32*bl,0,0,TAU); ctx.fill();
    if(bl>0.5){
      const dx=lx-ex, dy=ly-ey, d=hyp(dx,dy)||1, m=Math.min(11,d*0.05);
      const px=ex+dx/d*m, py=ey+dy/d*m;
      ctx.fillStyle='#2f4468'; ctx.beginPath(); ctx.arc(px,py,17,0,TAU); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(px-6,py-7,6,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(px+6,py+5,2.5,0,TAU); ctx.fill();
    }
  }
  // mouth
  ctx.strokeStyle='#36507a'; ctx.lineWidth=7; ctx.lineCap='round';
  if(S.phase==='sneeze'&&w.mouth>0.05){ ctx.fillStyle='#e7708d'; ctx.beginPath(); ctx.ellipse(300,-28,14+w.mouth*10,6+w.mouth*16,0,0,TAU); ctx.fill(); }
  else if(w.happy>0){ ctx.fillStyle='#e7708d'; ctx.beginPath(); ctx.arc(300,-36,24,0.1,Math.PI-0.1); ctx.closePath(); ctx.fill(); }
  else if(w.tilt>0.08){ ctx.beginPath(); ctx.arc(300,-18,12,Math.PI*1.2,Math.PI*1.8); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(300,-42,22,0.25,Math.PI-0.25); ctx.stroke(); }
  ctx.restore();
}

function drawDome(C){

function drawRider(r,P){

  if(r.state==='ride'){ const q=riderPos(r); x=q.x; y=q.y; ang=Math.atan2(q.ty,q.tx); const p=pathById(r.pid); if(p&&!p.sea){ y+=0; } }

  y-=bounce+Math.sin(Math.PI*r.hop)*14;

  let sc=1; if(r.pop>0) sc=1+Math.sin(r.pop*Math.PI)*0.3-(r.pop>0.7?(r.pop-0.7)*3:0);

function hand(x,y){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-0.35);
  ctx.fillStyle='rgba(80,60,100,0.25)'; rr(ctx,-8,4,22,48,11); ctx.fill();
  ctx.fillStyle='#fff7f0'; ctx.strokeStyle='rgba(150,110,130,0.7)'; ctx.lineWidth=2.5;
  rr(ctx,-10,0,20,46,10); ctx.fill(); ctx.stroke();
  rr(ctx,-24,30,48,44,18); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffd9e4'; ctx.beginPath(); ctx.ellipse(0,8,6,5,0,0,TAU); ctx.fill();
  ctx.restore();
}

// ================================================================ loop & events
let raf=0,last=null,running=false;
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(last==null){ last=ts; return; }
  let dt=(ts-last)/1000; last=ts;
  if(dt<=0) return; if(dt>0.05) dt=0.05;
  try{ update(dt); render(); }catch(err){ if(!frame.err){ frame.err=1; console.warn(err); } }
}
function start(){ if(running) return; running=true; last=null; raf=requestAnimationFrame(frame); }
function stop(){ running=false; cancelAnimationFrame(raf); last=null; }
function releaseInput(){ if(IN.id!==null){ IN.id=null; endStroke(); } }
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  audioInit();
  if(IN.id!==null){
    if(performance.now()-IN.lastT>1500){ releaseInput(); } else return; // other fingers are ignored
  }
  IN.id=e.pointerId; IN.lastT=performance.now();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  down(e.clientX,e.clientY);
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==IN.id) return; e.preventDefault(); IN.lastT=performance.now();
  const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
  if(list.length>1){ for(const c of list) moveStroke(c.clientX,c.clientY,c.timeStamp||e.timeStamp); }
  else moveStroke(e.clientX,e.clientY,e.timeStamp);
},{passive:false});
const upH=e=>{ if(e.pointerId!==IN.id) return; IN.id=null; endStroke(); };
cv.addEventListener('pointerup',upH); cv.addEventListener('pointercancel',upH); cv.addEventListener('lostpointercapture',upH);
for(const t of ['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart']){
  document.addEventListener(t,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ releaseInput(); stop(); try{ if(AU.ctx&&AU.ctx.state==='running') AU.ctx.suspend(); }catch(_){} }
  else { start(); try{ if(AU.ctx) { const p=AU.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); } }catch(_){} }
});
let rzT=0;
function onResize(){ releaseInput(); clearTimeout(rzT); rzT=setTimeout(()=>{ layout(); render(); },60); }
window.addEventListener('resize',onResize); window.addEventListener('orientationchange',onResize);
window.addEventListener('blur',releaseInput);

// boot
layout();
for(const k of ['straw','bread','milk']){ const r=mkRider(k,SRC[k].x,SRC[k].y); S.riders.push(r); }
S.gf.x=0;
render();
if(!document.hidden) start();
// read-only hook for automated tests
window.__whale={S,L,IN,tfP,tfW,toScr,pathById,get running(){return running;}};
})();
