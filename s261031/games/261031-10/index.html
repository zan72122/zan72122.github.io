/* ===== 描画プリミティブ ===== */
function ell(x,y,rx,ry,r){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),r||0,0,TAU)}
function ellF(x,y,rx,ry,col,r){if(col)g.fillStyle=col;ell(x,y,rx,ry,r);g.fill()}
function circ(x,y,r){g.beginPath();g.arc(x,y,Math.abs(r),0,TAU)}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function tinS(lw){g.lineWidth=lw||.045;g.strokeStyle='rgba(70,60,110,.55)';g.stroke()}
function shine(x,y,r,a0,a1,lw){g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=lw||.05;g.lineCap='round';g.beginPath();g.arc(x,y,r,a0,a1);g.stroke()}
function rivet(x,y,r){ellF(x,y,r,r,'rgba(255,255,255,.75)');}
function star(x,y,r1,r2,n){g.beginPath();for(let i=0;i<n*2;i++){const a=-PI/2+i*PI/n,r=i%2?r2:r1;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()}
function heart(x,y,s){g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s*.6,y-s*.05,x-s*.3,y-s*.55,x,y-s*.2);g.bezierCurveTo(x+s*.3,y-s*.55,x+s*.6,y-s*.05,x,y+s*.35);g.closePath()}

function dItem(id,x,y,s,rot,sq){

    for(let i=0;i<4;i++){g.fillStyle=i%2?'#fff':'#f7a8c4';g.beginPath();g.moveTo(0,-.42);const a0=PI+i*PI/4,a1=PI+(i+1)*PI/4;g.arc(0,.02,.48,a0,a1);g.closePath();g.fill()}
    g.beginPath();g.arc(0,.02,.48,PI,0);g.closePath();tinS();
    g.fillStyle='#fff';for(let i=0;i<4;i++){ell(-.36+i*.24,.03,.12,.06);g.fill();}

    g.fillStyle='#fbe39a';ell(0,.14,.5,.15);g.fill();tinS();

    g.fillStyle='#f7a8c4';g.fillRect(-.27,.0,.54,.1);

    g.beginPath();g.moveTo(-.22,-.42);g.lineTo(.1,-.42);g.lineTo(.1,.02);g.quadraticCurveTo(.38,.04,.38,.24);g.lineTo(.38,.32);g.lineTo(-.24,.32);g.closePath();g.fill();tinS();

    g.beginPath();g.moveTo(.05,-.12);g.quadraticCurveTo(.32,-.42,.22,-.12);g.closePath();g.fill();tinS();
    ellF(0,-.13,.08,.07,'#f28fb0');break;
  case 'shell':
    g.fillStyle='#fcd0b0';g.beginPath();g.moveTo(0,.32);for(let i=0;i<=6;i++){const a=PI+.25+i*(PI-.5)/6;g.lineTo(Math.cos(a)*.45,Math.sin(a)*.45-.02)}g.closePath();g.fill();tinS();
    g.strokeStyle='rgba(240,150,140,.8)';g.lineWidth=.04;for(let i=1;i<6;i++){const a=PI+.25+i*(PI-.5)/6;g.beginPath();g.moveTo(0,.3);g.lineTo(Math.cos(a)*.4,Math.sin(a)*.4);g.stroke()}
    g.fillStyle='#fcd0b0';rr(-.12,.22,.24,.12,.04);g.fill();tinS();break;
  case 'ribbon':

/* 部品 */
function dPart(id,x,y,s,rot){
  g.save();g.translate(x,y);if(rot)g.rotate(rot);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
  if(id==='rudder')dWheel(0,0,.3,0);
  else if(id==='sail'){g.fillStyle='#f7a8c4';g.beginPath();g.moveTo(-.2,-.45);g.lineTo(.35,.35);g.lineTo(-.2,.35);g.closePath();g.fill();tinS();g.fillStyle='#fff';g.beginPath();g.moveTo(-.2,-.1);g.lineTo(.1,.35);g.lineTo(-.2,.35);g.closePath();g.fill();g.strokeStyle='#b49ad8';g.lineWidth=.06;g.beginPath();g.moveTo(-.22,-.5);g.lineTo(-.22,.45);g.stroke()}
  else if(id==='bell')dBell(0,-.1,.9,0);
  else if(id==='oar')dOar(-.45,0,.45,0,1);
  else if(id==='paddle')dOar(-.25,0,.25,0,.6);
  g.restore();
}
function dWheel(x,y,r,a){
  g.save();g.translate(x,y);g.rotate(a);
  g.strokeStyle='#d99a6c';g.lineWidth=r*.28;for(let i=0;i<6;i++){const q=i*PI/3;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(q)*r*1.25,Math.sin(q)*r*1.25);g.stroke()}
  g.strokeStyle='#f0b98e';g.lineWidth=r*.3;circ(0,0,r);g.stroke();ellF(0,0,r*.3,r*.3,'#fbe39a');
  g.restore();
}
function dBell(x,y,s,sw){
  g.save();g.translate(x,y);g.rotate(sw);g.scale(s,s);
  g.fillStyle='#f6cf62';g.beginPath();g.moveTo(-.08,-.3);g.quadraticCurveTo(-.3,-.25,-.28,.12);g.lineTo(-.36,.2);g.lineTo(.36,.2);g.lineTo(.28,.12);g.quadraticCurveTo(.3,-.25,.08,-.3);g.closePath();g.fill();tinS(.04);
  ellF(0,.26,.08,.08,'#e3a94a');ellF(0,-.32,.07,.05,'#e3a94a');shine(-.05,-.05,.18,-2.8,-2.1,.04);
  g.restore();
}
function dOar(x0,y0,x1,y1,s){
  const a=Math.atan2(y1-y0,x1-x0),len=Math.hypot(x1-x0,y1-y0);
  g.save();g.translate(x0,y0);g.rotate(a);
  g.strokeStyle='#d9a37a';g.lineWidth=.09*s;g.beginPath();g.moveTo(0,0);g.lineTo(len,0);g.stroke();
  g.fillStyle='#9fd3f0';ell(len,0,.22*s,.11*s);g.fill();tinS(.035);
  g.fillStyle='#f7a8c4';g.fillRect(-.02,-.06*s,.12*s,.12*s);
  g.restore();
}
function dFlag(i,x,y,s,t){
  if(i<0)return;const c=FLAGC[i];g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle=c[0];g.beginPath();g.moveTo(0,0);for(let k=0;k<=6;k++){const xx=k/6*.9;g.lineTo(xx,Math.sin(t*6+k)*.05*k/6)}for(let k=6;k>=0;k--){const xx=k/6*.9;g.lineTo(xx,.55+Math.sin(t*6+k)*.05*k/6)}g.closePath();g.fill();tinS(.04);
  g.fillStyle=c[1];
  if(i===0){heart(.42,.3,.38);g.fill()}
  else if(i===1){star(.42,.28,.2,.09,5);g.fill()}
  else{ell(.38,.28,.2,.1);g.fill();g.beginPath();g.moveTo(.55,.28);g.lineTo(.7,.16);g.lineTo(.7,.4);g.closePath();g.fill();ellF(.3,.25,.03,.03,c[0])}
  g.restore();
}

function newItem(id,slot){const it={kind:'item',id,slot,st:'shelf',x:0,y:0,sq:0,hop:0,pop:1,wob:0,rot:0};S.items.push(it);if(slot>=0&&L.cols){const p=slotPos(slot);it.x=p.x;it.y=p.y}return it}

function freeSlot(){const u=new Set();for(const i of S.items)if(i.st==='shelf'||i.st==='fly')u.add(i.slot);for(let i=0;i<L.NS;i++)if(!u.has(i))return i;return -1}

const FL=[];

    o.x=lerp(o.p0.x,to.x,e);o.y=lerp(o.p0.y,to.y,e)-Math.sin(p*PI)*(lg.arc||0)*L.u*2;o.prog=(o.li+p)/o.legs.length;
    if(p>=1){o.li++;o.lt=0;o.p0={x:to.x,y:to.y};if(lg.cb)lg.cb();if(o.li>=o.legs.length){const k=FL.indexOf(o);if(k>=0)FL.splice(k,1);if(o.cb)o.cb()}}}

const PT=[],PMAX=90;

/* ===== キャラクター生成 ===== */
function mk(id,kind,o){const c=Object.assign({id,kind,layer:'port',fx:0,fy:0,s:1,face:1,t:rnd(0,9),seed:rnd(0,9),jump:0,tilt:0,happy:0,sq:0,wear:false,carry:null,ret:false,vis:true,mv:null,bub:0,bubP:0,alpha:1,want:null,busy:false,swim:false,eat:0,point:0,peek:0,lean:0,idleHop:0,look:0,play:false},o);CH[id]=c;return c}
function walk(c,fx,fy,dur,cb,hop){c.mv={x0:c.fx,y0:c.fy,x1:fx,y1:fy,t:0,dur:Math.max(.05,dur),cb,hop:hop!==false};if(Math.abs(fx-c.fx)>.002)c.face=fx<c.fx?-1:1}

  mk('twinB','pen',{want:'bootB',s:.64,body:'#7d8fc4',dark:'#6576b0',cap:'#9fd3f0',face:-1,fx:PORT.twB[0],fy:PORT.twB[1]});

/* ===== 誘導（目立つ誘いは常に1つ） ===== */
function kidsLeft(){if(!S.sea)return 0;return KIDSETS[S.cycle%3].filter(id=>!CH[id]||!CH[id].ret).length}
function homeReady(){return S.phase==='sea'&&CH.seal&&CH.seal.ret&&!CH.seal.busy&&S.sea&&S.sea.island&&kidsLeft()===0&&!KIDSETS[S.cycle%3].some(id=>CH[id]&&CH[id].busy)}
function pendingTry(){const P=S.parts;if(S.phase!=='port')return false;return (P.rudder&&!S.tried.rudder)||(P.sail&&!S.tried.sail)||(P.bell&&!S.bridgeOpen&&(P.sail||!S.tried.bell))||(P.oar&&!S.tried.oar)||S.counter.st!=='shop'}
function getHint(){
  const ph=S.phase;
  if(ph==='flag')return S.flags?{k:'flag',i:S.flagHint}:null;
  if(ph!=='port'&&ph!=='sea')return null;
  const a=S.active&&CH[S.active];
  if(a&&!a.ret&&!a.busy){const it=shelfFind(a.want);if(it)return{k:'item',it}}
  const P=S.parts;
  if(ph==='port'){
    if(S.counter.st==='fly')return null;
    if(P.rudder&&!S.tried.rudder)return{k:'knobR'};
    if(P.sail&&!S.tried.sail)return{k:'sail'};
    if(P.bell&&!S.bridgeOpen&&(P.sail||!S.tried.bell))return(P.sail&&S.puff<=.4)?{k:'sail'}:{k:'bell'};
    if(P.oar&&!S.tried.oar)return{k:'oar'};
    if(S.counter.st==='boat')return{k:'counter'};
    for(const id of S.order){const c=CH[id];if(c&&!c.ret&&!c.busy&&shelfFind(c.want))return{k:'char',c}}
    return null;
  }
  const sea=S.sea;if(!sea||!sea.ready)return null;
  if(!CH.seal.ret)return CH.seal.busy?null:{k:'char',c:CH.seal};
  if(CH.seal.busy||FL.some(o=>o.kind==='item')||sea.leftTaking&&!sea.leftDone||sea.rightTaking&&!sea.rightDone)return null;
  if(sea.island&&!sea.visited&&!CH.seal.busy){if(S.heading!==0)return{k:S.heading>0?'knobL':'knobR'};return{k:'sail'}}
  if(P.oar&&!S.tried.oar)return{k:'oar'};
  if(sea.island&&kidsLeft()>0){const cc=sea.called&&CH[sea.called];if(!cc||cc.ret)return{k:'bell'};if(!cc.busy)return{k:'char',c:cc};return null}
  for(const id of ['bird','turtle','twinA','twinB']){const c=CH[id];if(c&&c.vis&&!c.ret&&!c.busy&&c.layer!=='port'&&shelfFind(c.want))return{k:'char',c}}
  if(!sea.leftDone&&!sea.leftTaking){if(S.heading!==-1)return{k:'knobL'};return{k:'sail'}}
  if(homeReady())return{k:'counter'};
  return null;
}
function flagPos(i){const b=shipXY(),k=shipK(),o=[[-1.8,-2.9],[0,-3.4],[1.8,-2.9]][i];return{x:b.x+o[0]*k,y:b.y+o[1]*k+Math.sin(S.gt*3+i)*4,r:Math.max(34,.9*k)}}
function hintPos(h){
  if(!h)return null;
  if(h.k==='item')return{x:h.it.x,y:h.it.y,r:L.is*.55};
  if(h.k==='char'){const p=cCenter(h.c);return{x:p.x,y:p.y,r:csize(h.c)*.7}}
  if(h.k==='flag')return flagPos(h.i);
  return partPos(h.k);
}
function activate(c,auto){S.active=c.id;c.bubP=1;c.jump=.6;if(!auto)SFX.boop();else tone(880,.08,'sine',.06)}
function autoActivate(){
  if(S.active||pendingTry())return;
  const ok=c=>c&&c.vis&&!c.ret&&!c.busy&&!c.mv&&shelfFind(c.want);
  if(S.phase==='port'){for(const id of S.order){if(ok(CH[id])){activate(CH[id],true);return}}}
  else if(S.phase==='sea'&&S.sea&&S.sea.ready){for(const id of ['seal','bird','turtle','twinA','twinB']){const c=CH[id];if(ok(c)&&c.layer!=='port'&&(id!=='seal'||c.arrived)){activate(c,true);return}}}
}

/* ===== タップ判定 ===== */
function targets(){
  const T=[],ph=S.phase;
  if(ph==='flag'&&S.flags){for(let i=0;i<3;i++){const p=flagPos(i);T.push({k:'flag',i,x:p.x,y:p.y,r:p.r})}return T}
  if(ph!=='port'&&ph!=='sea'&&ph!=='party')return T;
  if(ph!=='party')for(const it of S.items)if(it.st==='shelf')T.push({k:'item',it,x:it.x,y:it.y,r:Math.max(30,Math.min(L.cw,L.ch)*.5)});
  for(const id in CH){const c=CH[id];if(!c.vis||c.alpha<.5)continue;if(c.layer==='port'&&S.trans>.5)continue;if(c.layer==='sea'&&S.trans<.5)continue;const p=cCenter(c),s=csize(c);T.push({k:'char',c,x:p.x,y:p.y,r:Math.max(26,s*.62)})}
  if(ph!=='party'){const P=S.parts,add=n=>{const q=partPos(n);T.push({k:n,x:q.x,y:q.y,r:q.r})};
    if(P.rudder){add('knobL');add('knobR')}if(P.sail)add('sail');if(P.bell)add('bell');if(P.oar)add('oar');if(P.oar===2)add('oar2');if(S.counter.st==='boat')add('counter')}
  return T;
}
function decos(){
  const D=[],o=portOY(),so=seaOY();
  if(S.trans<.5)D.push(['cl1',SP(.32,.08,o)],['cl2',SP(.72,.12,o)],['buoy',SP(.66,.72,o)],['lamp',SP(.25,.72,o)],['crate',SP(.855,.85,o)],['photo',SP(.14,.17,o)]);
  else D.push(['cl3',SP(.2,.07,so)],['island',SP(.5,.15,so)],['arch',SP(.1,.42,so)],['lighthouse',SP(.9,.25,so)]);
  D.push(['scanner',{x:L.scanner.x,y:L.scanner.y-L.su*.4}],['ship',shipXY()]);
  if(S.counter.st==='shop')D.push(['counter',{x:L.counter.x,y:L.counter.y}]);
  return D;
}
function wobbleNear(x,y){
  let best=null,bd=L.u*2.6;for(const [k,p] of decos()){const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best=k}}
  if(x>L.shelf.x&&x<L.shelf.x+L.shelf.w&&y>L.shelf.y-10&&y<L.shelf.y+L.shelf.h){for(const it of S.items)if(it.st==='shelf'&&Math.hypot(it.x-x,it.y-y)<L.cw*1.2)it.wob=.6;SFX.tick();return}
  if(best==='ship')S.ship.wig=.5;else if(best==='counter')S.counter.wob=.7;else if(best)S.wob[best]=.8;
  if(PT.length<PMAX-3)for(let i=0;i<3;i++)PT.push({x,y,vx:rnd(-30,30),vy:rnd(-40,-10),life:.35,m:1,c:'rgba(255,255,255,.9)',s:L.u*.08,sh:1,r:0});
  SFX.tick();
}
let lastTapMs=0;
function onTap(x,y){
  S.lastIn=S.gt;S.demo=null;S.demoDone=false;S.taps=(S.taps||0)+1;
  const T=targets();let best=null,bd=1;for(const t of T){const d=Math.hypot(x-t.x,y-t.y)/t.r;if(d<bd){bd=d;best=t}}
  if(!best){wobbleNear(x,y);return}
  switch(best.k){
    case 'item':tapItem(best.it);break;case 'char':tapChar(best.c);break;
    case 'knobL':tapKnob(-1);break;case 'knobR':tapKnob(1);break;case 'sail':tapSail();break;case 'bell':tapBell();break;
    case 'oar':case 'oar2':tapOar();break;case 'counter':tapCounter();break;case 'flag':tapFlag(best.i);break;
  }
}

/* ===== 返却 ===== */
const scanTop=()=>({x:L.scanner.x,y:L.scanner.y-L.su*.55});
function tapItem(it){
  if(S.phase!=='port'&&S.phase!=='sea')return;
  const c=S.active&&CH[S.active];
  if(c&&!c.ret&&!c.busy){
    it.sq=1;S.scan=1;SFX.pi();
    if(ITEM[it.id].o===c.id){
      S.active=null;c.busy=true;S.streak++;const prev=S.lastRet;S.lastRet=c.id;S.autoAt=S.gt+3;
      if(S.sea&&S.sea.called===c.id)S.sea.called=null;
      fly(it,[{to:scanTop,dur:.11,ez:eOut,cb:()=>{S.scan=1}},{to:()=>handPos(c),dur:.42,arc:.45}],()=>{
        it.st='gone';c.wear=true;c.ret=true;c.happy=1.8;c.jump=1;c.sq=.5;SFX.ret(S.streak-1);
        const hp=handPos(c);burst(hp.x,hp.y,8+Math.min(12,S.streak*2));
        S.returnedLog.push(c.id);if(c.id==='seal'){c.eat=2.2;SFX.munch()}
        after(1.0,()=>partFlow(c,prev));
      });
    }else{
      S.streak=0;
      fly(it,[{to:scanTop,dur:.11,ez:eOut},{to:()=>{const h=handPos(c);return{x:lerp(L.scanner.x,h.x,.5),y:lerp(L.scanner.y,h.y,.5)}},dur:.32,arc:.3,cb:()=>{c.tilt=1;SFX.miss()}},{to:()=>slotPos(it.slot),dur:.45,arc:.35}],()=>{it.st='shelf';it.sq=.7});
    }
  }else{
    it.hop=1;SFX.tick();const h=getHint();if(h&&h.k==='char')h.c.jump=.7;
  }
}
function tapChar(c){
  if(S.phase==='party'){c.jump=1;c.happy=1.2;SFX.boing();return}
  if(c.ret||c.busy){c.jump=.8;c.happy=Math.max(c.happy,.7);SFX.boing();return}
  if(c.id==='seal'&&S.phase==='port'){c.peek=2.4;c.jump=.6;SFX.hmm();return}
  if(c.id==='bird'&&S.phase==='port'){c.jump=.6;c.happy=.5;SFX.chirp();return}
  if(S.phase==='sea'&&KIDITEM[c.id]&&S.sea.called!==c.id){c.jump=.7;SFX.boop();return}
  if(!shelfFind(c.want)){c.jump=.6;SFX.tick();return}
  if(S.active===c.id){c.bubP=1;c.jump=.5;SFX.boop();return}
  activate(c,false);
}
function partFlow(c,prev){
  const id=c.id;
  if(id==='kid'||id==='umb'||id==='hat'){
    const part=ITEM[c.want].p;c.carry=part;
    const d=c.far?PORT.farDock:PORT.dock;
    walkD(c,d[0],d[1],.3,()=>{throwPart(c,part,()=>{const pl=PORT.play[id];walkD(c,pl[0],pl[1],.28,()=>{c.busy=false;c.play=true;c.face=1})})});
    return;
  }
  if(id==='twinA'||id==='twinB'){
    const o=CH[id==='twinA'?'twinB':'twinA'];
    if(!o.ret){c.busy=false;c.play=true;if(!S.active&&!o.busy)activate(o,true);return}
    const combo=prev===o.id,part=combo?'oar':'paddle',atPort=S.phase==='port';
    c.busy=o.busy=true;c.play=o.play=false;
    if(combo)S.oarCarry=1;else{c.carry='paddle';o.carry='paddle'}
    const fin=()=>{const a=cpos(c),b=cpos(o),s=csize(c);S.oarCarry=0;c.carry=o.carry=null;
      throwFrom(part,{x:(a.x+b.x)/2,y:(a.y+b.y)/2-1.6*s},()=>{for(const t of [c,o]){t.busy=false;t.play=true;t.happy=1.5;if(atPort){const pl=PORT.play[t.id];walkD(t,pl[0],pl[1],.25)}}})};
    if(atPort){walkD(c,.44,.875,.28,null);walkD(o,.56,.875,.28,fin)}else after(.8,fin);
    return;
  }
  if(id==='seal'){
    c.point=1;SFX.chirp();const sea=S.sea;sea.island=true;tw(sea,'mist',0,1.6);after(.6,spawnKids);
    after(2.2,()=>{c.point=0;toLayer(c,'ship');c.swim=true;walk(c,-1.95,.9,1.1,()=>{c.busy=false;c.play=true;c.face=1},false)});
    return;
  }
  if(KIDITEM[id]){
    const sea=S.sea,i=sea.deck++%DECK.length,d=DECK[i];c.swim=false;c.jump=1;SFX.boing();
    if(c.layer!=='ship')toLayer(c,'ship');walk(c,d[0],d[1],.8,()=>{c.busy=false;c.play=true;c.onDeck=true;checkHome()},true);

}
function checkHome(){if(homeReady()&&S.sea.homeCue<1){tw(S.sea,'homeCue',1,1.2);SFX.tada()}}
function partTarget(part){return()=>{if(part==='rudder'){const b=shipXY();return{x:b.x,y:b.y+.66*shipK()}}const n=part==='sail'?'sail':part==='bell'?'bell':'oar';return partPos(n)}}
function throwPart(c,part,cb){const p=cpos(c),s=csize(c);c.carry=null;throwFrom(part,{x:p.x,y:p.y-1.65*s},cb)}
function throwFrom(part,from,cb){const o={kind:'part',id:part,x:from.x,y:from.y};SFX.whoosh();fly(o,[{to:partTarget(part),dur:.6,arc:.7}],()=>{attach(part);if(cb)cb()})}
function attach(part){

function hatApproach(){const c=CH.hat;if(!c||!c.far||c.busy||c.ret)return;c.far=false;c.jump=1;walk(c,PORT.hatNear[0],PORT.hatNear[1],1.5,()=>{c.face=-1},true)}
function checkComplete(){const P=S.parts;if(S.phase==='port'&&P.rudder&&P.sail&&P.bell&&S.counter.st==='shop')after(.8,counterToBoat)}

    S.counter.st='boat';S.ship.pop=1.3;SFX.pop();SFX.tada();const q=partPos('counter');burst(q.x,q.y,16)});

/* ===== 船の操作 ===== */
function homeX(){return PORT.home[0]+(S.parts.sail?0:S.heading*.035)}
function trip(x,y,dur,back,cb){S.ship.trip={x0:S.ship.fx,y0:S.ship.fy,x1:x,y1:y,t:0,dur,back,cb,wait:0}}
function tapKnob(dir){

function tapSail(){

  }else seaMove(1);
}
function tapOar(){

  if(S.ship.trip)return;
  const big=S.parts.oar===1;
  if(S.phase==='port'){const h=S.heading,dx=h*(big?.07:.04),dy=h===0?-(big?.08:.045):-.02;trip(S.ship.fx+dx,S.ship.fy+dy,.55,true)}

function seaTarget(){return S.heading<0?'L':S.heading>0?'R':(S.sea.island?'I':'C')}
function seaMove(frac){
  const n=seaTarget(),p=SEAN[n];
  if(S.sea.node===n||Math.hypot(S.ship.fx-p[0],S.ship.fy-p[1])<.02){S.ship.wig=.7;if(S.sea.node!==n)arrive(n);return}
  const x=lerp(S.ship.fx,p[0],frac),y=lerp(S.ship.fy,p[1],frac);S.sea.node=null;
  trip(x,y,frac>=1?1.5:.6,false,()=>{if(Math.hypot(S.ship.fx-p[0],S.ship.fy-p[1])<.025){S.ship.fx=p[0];S.ship.fy=p[1];arrive(n)}});
}
function arrive(n){

  if(n==='R'&&!sea.rightDone&&!sea.rightTaking){sea.rightTaking=true;const p={x:L.sea.x+.84*L.sea.w,y:L.sea.y+.55*L.sea.h+seaOY()};
    collect('glasses',p,1,()=>{sea.rightDone=true;const t=mk('turtle','turtle',{want:'glasses',s:.7,layer:'sea',fx:.86,fy:.66,alpha:0,swim:true,face:-1});tw(t,'alpha',1,.5);t.jump=1;SFX.boop()})}
  if(n==='I'&&!sea.visited){sea.visited=true;SFX.tada();for(const id of KIDSETS[S.cycle%3]){const c=CH[id];if(c&&!c.ret){c.jump=1;c.happy=1}}}
}

function openBridge(){S.bridgeOpen=true;const b=CH.bird;b.happy=1.6;b.jump=1;after(.25,()=>SFX.chirp());tw(S,'bridgeT',1,1.2,.4,eOut);after(1.3,birdToMast);const p=SP(.5,.31);burst(p.x,p.y,10)}
function birdToMast(){const b=CH.bird;if(!b||S.birdMast)return;S.birdMast=true;toLayer(b,'ship');b.flap=true;walk(b,0,-2.3,1.0,()=>{b.flap=false;b.happy=.8;b.face=1},false)}

function tapFlag(i){

    dShip(150,128,30,{parts:S.parts,t:1,hv:0,puff:1,bellSw:0,wheelA:0,flag:S.flag,counter:true,pop:0,wig:0,row:0,net:0,netDir:1,cwob:0,glowC:0,shopDeck:true});

  S.counter={st:'shop',wob:0};S.ship={fx:PORT.home[0],fy:PORT.home[1],sc:1,bobY:0,trip:null,pop:0,wig:0,row:0,net:0,netDir:1};

/* ===== 更新 ===== */
function busy(){if(FL.length||S.ship.trip||S.counter.st==='fly')return true;for(const id in CH){const c=CH[id];if(c.mv&&c.busy)return true}return false}
function updChar(c,dt){
  c.t+=dt;c.jump=Math.max(0,c.jump-dt*1.7);c.tilt=Math.max(0,c.tilt-dt*.9);c.happy=Math.max(0,c.happy-dt);c.eat=Math.max(0,c.eat-dt);c.peek=Math.max(0,c.peek-dt);c.look=Math.max(0,c.look-dt);c.sq*=Math.pow(.02,dt);c.bubP=Math.max(0,c.bubP-dt*3);
  const want=S.active===c.id?1:0;c.bub+=(want-c.bub)*Math.min(1,dt*9);
  if(c.mv){const m=c.mv;m.t+=dt;const p=Math.min(1,m.t/m.dur),e=ease(p);c.fx=lerp(m.x0,m.x1,e);c.fy=lerp(m.y0,m.y1,e);if(p>=1){c.mv=null;if(m.cb)m.cb()}}
  c.idleHop=0;c.lean=0;
  if(c.mv||c.busy&&!c.eat)return;
  const t=S.gt;
  if(c.id==='kid'&&!c.ret)c.idleHop=Math.abs(Math.sin(c.t*7))*.05;
  if((c.id==='twinA'||c.id==='twinB')&&!c.ret&&S.phase!=='party'){const ph=(t*.8)%3;if(ph<1.2)c.lean=(c.id==='twinA'?1:-1)*.2*Math.sin(ph/1.2*PI)}
  if(c.play){
    const k=(c.t+c.seed)%4;
    if(c.id==='kid'&&k<.6)c.idleHop=Math.sin(k/.6*PI)*.25;
    if(c.id==='umb'&&k<1)c.lean=Math.sin(k*PI*2)*.1;
    if((c.id==='twinA'||c.id==='twinB')&&k<.5)c.idleHop=Math.sin(k/.5*PI)*.3;
    if(c.kind==='otter'&&k<.8)c.face=k<.4?-1:1;
    if(c.kind==='crab')c.lean=Math.sin(c.t*3)*.12;
    if(c.kind==='dolphin'&&k<.7)c.idleHop=Math.sin(k/.7*PI)*.5;
    if(c.kind==='octo')c.lean=Math.sin(c.t*2)*.08;
    if(c.kind==='seal'&&k<.6)c.happy=Math.max(c.happy,.1);
  }
}
function update(dt){
  S.gt+=dt;
  updTimers(dt);updFlights(dt);updParticles(dt);
  if(S.wheelKick){S.wheelA+=S.wheelKick*1.2;S.wheelKick=0}
  S.wheelA+=(S.heading*1.6-S.wheelA)*Math.min(1,dt*4);
  S.hv+=(S.heading-S.hv)*Math.min(1,dt*5);
  S.puff=Math.max(0,S.puff-dt);S.puffV+=((S.puff>0?1:0)-S.puffV)*Math.min(1,dt*4);
  S.bellSw=Math.max(0,S.bellSw-dt*.7);S.scan=Math.max(0,S.scan-dt*2.2);S.flash=Math.max(0,S.flash-dt*1.4);
  const sh=S.ship;sh.pop=Math.max(0,sh.pop-dt*2.5);sh.wig=Math.max(0,sh.wig-dt*2);sh.row=Math.max(0,sh.row-dt*1.6);sh.net=Math.max(0,sh.net-dt);
  sh.bobY=Math.sin(S.gt*2)*L.u*(.04+.05*S.trans);
  S.counter.wob=Math.max(0,S.counter.wob-dt*2);for(const k in S.wob)S.wob[k]=Math.max(0,S.wob[k]-dt*2);
  const tr=sh.trip;
  if(tr){if(tr.wait>0)tr.wait-=dt;else{tr.t+=dt;const p=Math.min(1,tr.t/tr.dur),e=ease(p);sh.fx=lerp(tr.x0,tr.x1,e);sh.fy=lerp(tr.y0,tr.y1,e);
    if(p>=1){sh.trip=null;if(tr.back&&S.phase==='port')sh.trip={x0:tr.x1,y0:tr.y1,x1:homeX(),y1:PORT.home[1],t:0,dur:tr.dur,wait:.35};if(tr.cb)tr.cb()}}}
  else if(S.phase==='port'){sh.fx+=(homeX()-sh.fx)*Math.min(1,dt*2);sh.fy+=(PORT.home[1]-sh.fy)*Math.min(1,dt*2)}
  const h=S.hint=getHint();
  for(const it of S.items){it.sq*=Math.pow(.02,dt);it.hop=Math.max(0,it.hop-dt*2.5);it.wob=Math.max(0,it.wob-dt*2);
    if(it.st==='shelf'&&it.slot>=0){const p=slotPos(it.slot);let by=0;if(h&&h.k==='item'&&h.it===it)by=Math.abs(Math.sin(S.gt*4.5))*L.is*.14;it.x=p.x;it.y=p.y-by-Math.sin(it.hop*PI)*L.is*.22}}
  if(S.items.length>14||S.items.some(i=>i.st==='gone'&&!FL.includes(i)))S.items=S.items.filter(i=>i.st!=='gone'||FL.includes(i));
  for(const id in CH)updChar(CH[id],dt);
  if(!S.active&&S.gt>S.autoAt&&(S.phase==='port'||S.phase==='sea'))autoActivate();
  if(S.confetti>0){S.confetti-=dt;if(PT.length<PMAX-2&&Math.random()<.7){PT.push({x:rnd(L.sea.x,L.sea.x+L.sea.w),y:L.sea.y-10,vx:rnd(-20,20),vy:rnd(20,60),life:2.2,m:1,c:CONF[(Math.random()*6)|0],s:L.u*.12,sh:2,r:rnd(0,6)})}}
  if(!S.demo&&!S.demoDone&&S.gt-S.lastIn>4&&h&&!busy()){S.demo={t:0,h};S.demoDone=true}
  if(S.demo){S.demo.t+=dt;if(S.demo.t>1.7)S.demo=null}
}

/* ===== 描画 ===== */
function drawC(c,h,hp){
  const p=cpos(c),s=csize(c);let lk={x:0,y:0},tx=null,ty=0;
  if(c.look>0&&c.id==='bird'){const b=shipXY();tx=b.x;ty=b.y;c.face=b.x<p.x?-1:1}
  else if(c.id==='seal'&&c.point){const q=SP(.5,.17,seaOY());tx=q.x;ty=q.y;c.face=q.x<p.x?-1:1}
  else if(hp){tx=hp.x;ty=hp.y}
  if(tx!==null){const dx=tx-p.x,dy=ty-(p.y-.8*s),d=Math.hypot(dx,dy)||1;lk={x:dx/d,y:dy/d}}
  if(h&&h.k==='char'&&h.c===c){g.fillStyle='rgba(255,236,140,.6)';ell(p.x,p.y,s*.62*(1+.12*Math.sin(S.gt*6)),s*.17);g.fill();c.idleHop+=Math.abs(Math.sin(S.gt*5))*.12}
  dChar(c,p.x,p.y,s,lk);
}
function charsIn(layer){return Object.values(CH).filter(c=>c.layer===layer&&c.vis).sort((a,b)=>cpos(a).y-cpos(b).y)}
function glowAt(p,r){const a=.5+.3*Math.sin(S.gt*6);g.save();g.strokeStyle='rgba(255,236,140,'+a+')';g.lineWidth=Math.max(4,r*.14);circ(p.x,p.y,r*(1+.08*Math.sin(S.gt*6)));g.stroke();g.strokeStyle='rgba(255,255,255,'+(a*.8)+')';g.lineWidth=2;g.stroke();g.restore()}
function drawOarCarry(){if(!S.oarCarry)return;const a=cpos(CH.twinA),b=cpos(CH.twinB),s=csize(CH.twinA);const y1=a.y-1.25*s,y2=b.y-1.25*s;
  g.save();g.lineCap='round';g.strokeStyle='#d9a37a';g.lineWidth=s*.12;g.beginPath();g.moveTo(a.x-s*.5,y1);g.lineTo(b.x+s*.4,y2);g.stroke();g.fillStyle='#9fd3f0';ell(b.x+s*.6,y2,s*.32,s*.15);g.fill();g.restore()}
function render(){
  g=cx;cx.setTransform(DPR,0,0,DPR,0,0);
  let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#fbe9f1');gr.addColorStop(1,'#e8e2f7');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const h=S.hint,hp=hintPos(h),R=L.sea;
  // 海エリア
  g.save();rr(R.x,R.y,R.w,R.h,18);g.clip();
  drawPort(portOY());drawSea(seaOY());
  for(const c of charsIn('port'))drawC(c,h,hp);
  drawCrates(portOY());drawOarCarry();
  for(const c of charsIn('sea'))drawC(c,h,hp);
  const b=shipXY();
  dShip(b.x,b.y,shipK(),{parts:S.parts,t:S.gt,hv:S.hv,puff:S.puffV,bellSw:S.bellSw,wheelA:S.wheelA,flag:S.flag,counter:S.counter.st==='boat',pop:S.ship.pop,wig:S.ship.wig,row:S.ship.row,net:S.ship.net,netDir:S.ship.netDir||1,cwob:S.counter.wob,glowC:h&&h.k==='counter'?1:0,shopDeck:S.trans>.3});
  for(const c of charsIn('ship'))drawC(c,h,hp);
  g.restore();
  acrylic(R,18);
  drawShop();acrylic(L.shop,18);
  drawLink();
  for(const c of charsIn('shop'))drawC(c,h,hp);
  // 棚の品
  for(const it of S.items){if(it.st!=='shelf')continue;const hl=h&&h.k==='item'&&h.it===it;
    if(hl){g.fillStyle='rgba(255,240,160,'+(.35+.2*Math.sin(S.gt*6))+')';circ(it.x,it.y,L.is*.58);g.fill()}
    dItem(it.id,it.x,it.y,L.is*it.pop,Math.sin(it.wob*20)*it.wob*.25,it.sq)}
  // 誘導の光
  if(hp&&h.k!=='item'&&h.k!=='char'&&h.k!=='flag')glowAt(hp,hp.r);
  // 飛んでいるもの
  for(const o of FL){
    if(o.kind==='item')dItem(o.id,o.x,o.y,L.is*(1-.3*Math.min(1,o.prog||0)),Math.sin((o.prog||0)*PI)*.5,o.sq);
    else if(o.kind==='part')dPart(o.id,o.x,o.y,L.u*.95,(o.prog||0)*TAU);
    else if(o.kind==='counter'){const k=shipK(),w=lerp(L.counter.w,.95*k,Math.min(1,o.prog||0)),hh=lerp(L.counter.h,.52*k,Math.min(1,o.prog||0));dCounter(o.x,o.y,w,hh,0,0)}
    else if(o.kind==='flag')dFlag(o.i,o.x,o.y,L.u*.8,S.gt);
  }
  // 吹き出し
  for(const id in CH){const c=CH[id];if(!c.vis)continue;if(c.layer==='port'&&S.trans>.3)continue;if(c.layer==='sea'&&S.trans<.7)continue;
    const p=cpos(c),s=csize(c),bs=Math.max(L.u*1.15,40);
    if(c.bub>.02)dBubble(p.x+s*.25,p.y-s*1.45-bs*.45,bs,c.want,c.bub*(1+c.bubP*.15));
    else if(c.peek>0)dBubble(p.x,p.y-s*1.3-bs*.45,bs*.8,c.want,Math.min(1,c.peek*3));
  }
  // 双子のないしょ話
  {const a=CH.twinA,bb=CH.twinB;if(a&&bb&&!a.ret&&!bb.ret&&S.active!=='twinA'&&S.active!=='twinB'&&(a.layer==='port'&&S.trans<.3||a.layer==='shop')){const ph=(S.gt*.8)%3;if(ph<1.2){const pa=cpos(a),pb=cpos(bb),s=csize(a);for(let i=0;i<3;i++){ellF((pa.x+pb.x)/2-s*.2+i*s*.2,pa.y-s*1.3-Math.sin(ph*6+i)*3,s*.06,s*.06,'rgba(255,255,255,.95)')}}}}
  // 旗えらび
  if(S.phase==='flag'&&S.flags){for(let i=0;i<3;i++){const p=flagPos(i),k=shipK()*1.1,hl=h&&h.k==='flag'&&h.i===i,by=hl?Math.abs(Math.sin(S.gt*4.5))*k*.15:0;
    g.fillStyle='rgba(255,255,255,.55)';circ(p.x,p.y-by,p.r);g.fill();g.strokeStyle=hl?'rgba(255,220,120,.95)':'rgba(255,255,255,.95)';g.lineWidth=hl?5:3;g.stroke();
    g.strokeStyle='#b49ad8';g.lineWidth=4;g.beginPath();g.moveTo(p.x-k*.42,p.y-by-k*.4);g.lineTo(p.x-k*.42,p.y-by+k*.55);g.stroke();dFlag(i,p.x-k*.42,p.y-by-k*.4,k*.85,S.gt)}}
  drawParticles();
  // お手本の手
  if(S.demo){const q=hintPos(S.demo.h);if(q){const t=S.demo.t,u=L.u;let x,y,press=0,al=1;
    if(t<.55){const e=eOut(t/.55);x=lerp(q.x+u*1.3,q.x,e);y=lerp(q.y+u*1.6,q.y,e)}else{x=q.x;y=q.y}
    if(t>.55&&t<.9){press=Math.sin((t-.55)/.35*PI);g.strokeStyle='rgba(255,255,255,'+(1-(t-.55)/.35)+')';g.lineWidth=3;circ(q.x,q.y,u*.3+(t-.55)*u*2);g.stroke()}
    if(t>1.1){al=Math.max(0,1-(t-1.1)/.6);y+=(t-1.1)*u*1.2}
    g.save();g.globalAlpha=al;dHand(x,y+u*.05,u*1.1,press);g.restore()}}
  if(S.night>0){g.fillStyle='rgba(110,96,170,'+(.6*S.night)+')';g.fillRect(0,0,W,H);for(let i=0;i<14;i++){g.fillStyle='rgba(255,250,210,'+S.night+')';star((i*137.5)%W,(i*71)%(H*.6)+20,6,2.5,5);g.fill()}}
  if(S.flash>0){g.fillStyle='rgba(255,255,255,'+(S.flash*.85)+')';g.fillRect(0,0,W,H)}
}

/* ===== 入力・ループ ===== */
function resize(){W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';readSA();layout()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();const now=performance.now();if(now-lastTapMs<70)return;lastTapMs=now;onTap(e.clientX,e.clientY)},{passive:false});
for(const n of ['pointerup','pointercancel','lostpointercapture','pointerleave'])cv.addEventListener(n,()=>{},{passive:true});
cv.addEventListener('touchstart',e=>{e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
document.addEventListener('touchend',()=>audioInit(),{passive:true});
cv.addEventListener('pointerup',()=>audioInit(),{passive:true});
for(const n of ['gesturestart','gesturechange','contextmenu','dblclick','selectstart'])document.addEventListener(n,e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
let last=0,raf=0,running=true;
function loop(now){raf=0;if(!running)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);render();raf=requestAnimationFrame(loop)}
function pause(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;try{if(AC&&AC.state==='running')AC.suspend()}catch(e){}}
function resume(){if(running&&raf)return;running=true;last=performance.now();if(!raf)raf=requestAnimationFrame(loop);try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume()});
window.addEventListener('pagehide',pause);window.addEventListener('pageshow',()=>{if(!document.hidden)resume()});

/* ===== 開始 ===== */
loadSave();S.flag=MEM.flag;setPhoto(MEM.photo);
resize();resetForCycle(false);S.active=S.order[0];CH[S.order[0]].bub=1;S.lastIn=0;S.autoAt=0;
window.__gf={S,CH,FL,L,getHint,hintPos,targets,tap:onTap,cpos,partPos,slotPos,saveState:()=>saveState,MEM,running:()=>running};
raf=requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
