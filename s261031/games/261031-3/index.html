<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
(function(){
'use strict';
/* =========================================================
   とことこ郵便うさぎと、道がつなぐおまつり町
   色鉛筆の紙地図 × つや消し陶器ミニチュアの正射影ジオラマ
   ========================================================= */
var TAU=Math.PI*2, KZ=0.8, KY=0.6, VZ=0.6, VY=0.8;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function dist(ax,az,bx,bz){var dx=ax-bx,dz=az-bz;return Math.sqrt(dx*dx+dz*dz)}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function outBack(t){t=clamp(t,0,1);var c=2.2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- canvas ---------- */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=1,H=1,DPR=1, safe={l:0,t:0,r:0,b:0};
var INK='rgba(96,74,64,0.62)';
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  try{var cs=getComputedStyle(document.getElementById('safe'));
    safe.t=parseFloat(cs.paddingTop)||0; safe.r=parseFloat(cs.paddingRight)||0;
    safe.b=parseFloat(cs.paddingBottom)||0; safe.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}

/* ---------- colors ---------- */
var colCache={};
function hexrgb(h){if(h.charAt(0)!=='#'){var m=h.match(/\d+/g)||[0,0,0];return[+m[0],+m[1],+m[2]]}var n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function shade(h,f){
  f=Math.round(f*50)/50; var k=h+'|'+f; var v=colCache[k]; if(v)return v;
  var c=hexrgb(h),r,g,b;
  if(f>=0){r=c[0]+(255-c[0])*f;g=c[1]+(255-c[1])*f;b=c[2]+(255-c[2])*f}
  else{r=c[0]*(1+f);g=c[1]*(1+f);b=c[2]*(1+f)}
  v='rgb('+(r|0)+','+(g|0)+','+(b|0)+')'; colCache[k]=v; return v;
}
var gradCache={};
function ballGrad(col){
  var g=gradCache[col]; if(g)return g;
  g=ctx.createRadialGradient(-0.4,-0.45,0.05,0,0,1.02);
  g.addColorStop(0,shade(col,0.45)); g.addColorStop(0.45,col); g.addColorStop(1,shade(col,-0.22));
  gradCache[col]=g; return g;
}
function base(){ctx.setTransform(DPR,0,0,DPR,0,0)}
function ball(x,y,rx,ry,rot,col,lw){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.translate(x,y); if(rot)ctx.rotate(rot); ctx.scale(Math.max(rx,0.01),Math.max(ry,0.01));
  ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fillStyle=ballGrad(col); ctx.fill();
  base();
  if(lw!==0){ctx.beginPath();ctx.ellipse(x,y,Math.max(rx,0.01),Math.max(ry,0.01),rot||0,0,TAU);ctx.strokeStyle=INK;ctx.lineWidth=lw||1.2;ctx.stroke()}
}
function flatEll(x,y,rx,ry,rot,fill){ctx.beginPath();ctx.ellipse(x,y,Math.max(rx,0.01),Math.max(ry,0.01),rot||0,0,TAU);ctx.fillStyle=fill;ctx.fill()}

/* ---------- camera / projection ---------- */
var cam={S:30,x:0,su:0,ox:0,oy:0,zoom:1.12,zt:1.12,intro:true,base:30};
function PX(x){return cam.ox+cam.S*(x-cam.x)}
function PY(y,z){return cam.oy+cam.S*(z*KZ-y*KY-cam.su)}
function DEP(y,z){return z*VZ+y*VY}
function unX(sx){return cam.x+(sx-cam.ox)/cam.S}
function unZ(sy){return (cam.su+(sy-cam.oy)/cam.S)/KZ}
var CONT={x0:-6.6,x1:6.6,s0:-10.6*KZ-2.6,s1:10.6*KZ+0.5};
function camUpdate(dt,force){
  var al=safe.l+8, at=safe.t+8, ar=W-safe.r-8, ab=H-safe.b-8;
  var aw=Math.max(50,ar-al), ah=Math.max(50,ab-at);
  var cw=CONT.x1-CONT.x0, ch=CONT.s1-CONT.s0;
  var fitAll=Math.min(aw/cw,ah/ch);
  var b=Math.min(aw/cw*1.38,ah/ch*1.45);
  cam.base=b;
  var zt=cam.zt;
  if(T&&T.phase==='photo')zt=fitAll/b;
  var k=force?1:1-Math.exp(-dt*2.2);
  cam.zoom=lerp(cam.zoom,zt,k);
  cam.S=b*cam.zoom;
  cam.ox=(al+ar)/2; cam.oy=(at+ab)/2;
  var hw=aw/2/cam.S, hh=ah/2/cam.S;
  var rsu=R.z*KZ-0.8*KY;
  var tx,ts;
  if(cam.intro&&T){var bk=T.lots.bakery;tx=lerp(R.x,bk.x,0.22);ts=lerp(rsu,bk.z*KZ-1.2,0.22)}
  else{
    tx=(hw*2>=cw)?(CONT.x0+CONT.x1)/2:clamp(R.x,CONT.x0+hw,CONT.x1-hw);
    ts=(hh*2>=ch)?(CONT.s0+CONT.s1)/2:clamp(rsu,CONT.s0+hh,CONT.s1-hh);
    if(T&&T.phase==='photo'){tx=0;ts=(CONT.s0+CONT.s1)/2}
  }
  var kk=force?1:1-Math.exp(-dt*3);
  cam.x=lerp(cam.x,tx,kk); cam.su=lerp(cam.su,ts,kk);
}

/* ---------- audio (Web Audio synth) ---------- */
var AU={c:null,m:null,nb:null};
function audioStart(){
  try{
    if(!AU.c){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      AU.c=new AC(); AU.m=AU.c.createGain(); AU.m.gain.value=0.6;
      var comp=AU.c.createDynamicsCompressor(); AU.m.connect(comp); comp.connect(AU.c.destination);
      var len=(AU.c.sampleRate*0.6)|0, buf=AU.c.createBuffer(1,len,AU.c.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1; AU.nb=buf;
    }
    if(AU.c.state!=='running'){var p=AU.c.resume(); if(p&&p.catch)p.catch(function(){});}
  }catch(e){AU.c=null}
}
function aok(){return AU.c&&AU.c.state==='running'}
function tone(f,dur,o){
  if(!aok())return; o=o||{};
  try{var c=AU.c,t=c.currentTime+(o.d||0),os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
    if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    var v=o.v===undefined?0.18:o.v;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g); g.connect(AU.m); os.start(t); os.stop(t+dur+0.05);}catch(e){}
}
function noise(dur,o){
  if(!aok()||!AU.nb)return; o=o||{};
  try{var c=AU.c,t=c.currentTime+(o.d||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=AU.nb; f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.ff||1500,t);
    if(o.ff2)f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur); f.Q.value=o.q||1;
    var v=o.v===undefined?0.1:o.v;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(AU.m); s.start(t,Math.random()*0.3); s.stop(t+dur+0.05);}catch(e){}
}
var SND={
  step:function(surf,k){
    if(surf==='stone'){tone(820*k,0.05,{type:'triangle',v:0.07});noise(0.03,{ft:'highpass',ff:3000,v:0.035})}
    else if(surf==='wood'){tone(300*k,0.08,{type:'triangle',v:0.11});tone(610*k,0.04,{type:'sine',v:0.04,d:0.005})}
    else if(surf==='plaza'){tone(990*k,0.06,{type:'triangle',v:0.06});tone(1480*k,0.1,{v:0.02,d:0.02})}
    else {noise(0.04,{ft:'bandpass',ff:1600,v:0.04,q:0.8});tone(430*k,0.035,{v:0.035})}
  },
  boing:function(){tone(250,0.2,{f2:560,v:0.22});tone(560,0.14,{d:0.07,f2:400,v:0.08})},
  swish:function(){noise(0.2,{ft:'bandpass',ff:600,ff2:2400,v:0.05,q:2})},
  stamp:function(){noise(0.06,{ft:'highpass',ff:2400,v:0.3});tone(1700,0.05,{type:'square',v:0.06});tone(170,0.14,{f2:80,v:0.3})},
  rise:function(){tone(300,0.55,{f2:880,type:'triangle',v:0.1});noise(0.4,{ft:'bandpass',ff:500,ff2:3000,v:0.04})},
  success:function(){var n=[523,659,784,1047];for(var i=0;i<4;i++)tone(n[i],0.3,{type:'triangle',v:0.13,d:i*0.08});tone(2093,0.6,{v:0.05,d:0.34})},
  bark:function(){tone(520,0.07,{type:'square',f2:360,v:0.05});tone(560,0.07,{type:'square',f2:380,v:0.05,d:0.13})},
  meow:function(){tone(720,0.32,{f2:520,type:'sine',v:0.08});tone(1440,0.25,{f2:1000,v:0.02})},
  quack:function(){tone(420,0.11,{type:'sawtooth',f2:300,v:0.05});tone(430,0.11,{type:'sawtooth',f2:310,v:0.05,d:0.15})},
  pop:function(k){tone(560*k,0.05,{type:'sine',v:0.035})},
  tick:function(){tone(760,0.05,{type:'triangle',v:0.06});tone(1140,0.04,{v:0.02,d:0.02})},
  ripple:function(){tone(520,0.25,{f2:300,v:0.05})},
  ding:function(i){var sc=[0,2,4,7,9,12,14,16,19,21,24];var f=660*Math.pow(2,sc[i%sc.length]/12);tone(f,0.6,{v:0.06});tone(f*2,0.3,{v:0.02})},
  whoosh:function(){noise(0.7,{ft:'bandpass',ff:300,ff2:2600,v:0.12,q:1.5})},
  fanfare:function(){var n=[392,523,659,784,1047];for(var i=0;i<5;i++)tone(n[i],0.5,{type:'triangle',v:0.12,d:i*0.11});tone(523,1.2,{v:0.06,d:0.6});tone(659,1.2,{v:0.05,d:0.6});tone(784,1.2,{v:0.05,d:0.6})},
  shutter:function(){noise(0.05,{ft:'highpass',ff:2000,v:0.2});tone(2200,0.04,{type:'square',v:0.03,d:0.06});noise(0.05,{ft:'highpass',ff:2500,v:0.15,d:0.1})},
  chirp:function(){tone(2400,0.08,{f2:3200,v:0.04});tone(2600,0.08,{f2:3400,v:0.04,d:0.11})},
  page:function(){noise(0.5,{ft:'bandpass',ff:900,ff2:2400,v:0.12})},
  swap:function(){tone(880,0.12,{type:'triangle',v:0.07});tone(1175,0.16,{type:'triangle',v:0.07,d:0.09})},
  bench:function(){tone(200,0.18,{type:'triangle',v:0.1});tone(400,0.25,{f2:600,v:0.05,d:0.08})}
};
var music={on:false,next:0,i:0,pat:null};
function musicTick(){
  if(!music.on||!aok())return;
  var c=AU.c; if(music.next<c.currentTime)music.next=c.currentTime+0.05;
  var beat=60/116/2;
  while(music.next<c.currentTime+0.25){
    var i=music.i++, n=music.pat[i%music.pat.length], d=music.next-c.currentTime;
    if(n>=0){var f=392*Math.pow(2,n/12);tone(f,beat*1.6,{type:'triangle',v:0.05,d:d});}
    if(i%4===0)tone(130.8*(i%16<8?1:1.122),beat*3,{type:'sine',v:0.07,d:d});
    if(i%2===0)noise(0.05,{ft:'highpass',ff:i%4===0?800:3500,v:i%4===0?0.06:0.025,d:d});
    music.next+=beat;
  }
}

/* ---------- ground canvas (paper map) ---------- */
var GX0=-7.2,GZ0=-11.4,GWd=14.4,GHd=22.8,G=52;
var gcv=document.createElement('canvas'); gcv.width=Math.round(GWd*G); gcv.height=Math.round(GHd*G);
var g=gcv.getContext('2d');
function gx(x){return (x-GX0)*G} function gz(z){return (z-GZ0)*G}
function groundXform(){
  var a=cam.S/G, d=cam.S*KZ/G;
  ctx.setTransform(DPR*a,0,0,DPR*d,DPR*(cam.ox+cam.S*(GX0-cam.x)),DPR*(cam.oy+cam.S*(GZ0*KZ-cam.su)));
}

/* ---------- icons ---------- */
function icon(c,k,x,y,s){
  c.save(); c.translate(x,y); c.lineJoin='round'; c.lineCap='round';
  var lw=Math.max(1,s*0.05);
  if(k==='bread'){
    c.fillStyle='#d99a55'; c.beginPath(); c.ellipse(0,s*0.06,s*0.44,s*0.27,0,0,TAU); c.fill();
    c.fillStyle='#f0c487'; c.beginPath(); c.ellipse(-s*0.04,-s*0.02,s*0.34,s*0.16,0,0,TAU); c.fill();
    c.strokeStyle='#9c6430'; c.lineWidth=lw; c.beginPath(); c.ellipse(0,s*0.06,s*0.44,s*0.27,0,0,TAU); c.stroke();
    c.beginPath(); for(var i=-1;i<=1;i++){c.moveTo(i*s*0.17-s*0.06,s*0.1);c.lineTo(i*s*0.17+s*0.06,-s*0.08)} c.stroke();
  }else if(k==='flower'){
    c.strokeStyle='#4f9a5a'; c.lineWidth=lw*1.4; c.beginPath(); c.moveTo(0,s*0.45); c.quadraticCurveTo(-s*0.05,s*0.15,0,-s*0.02); c.stroke();
    c.fillStyle='#78bf72'; c.beginPath(); c.ellipse(s*0.15,s*0.25,s*0.16,s*0.07,-0.6,0,TAU); c.fill();
    c.fillStyle='#ee7a9b'; c.beginPath(); c.moveTo(-s*0.24,-s*0.32); c.lineTo(-s*0.12,-s*0.14); c.lineTo(0,-s*0.36); c.lineTo(s*0.12,-s*0.14); c.lineTo(s*0.24,-s*0.32);
    c.quadraticCurveTo(s*0.28,s*0.06,0,s*0.06); c.quadraticCurveTo(-s*0.28,s*0.06,-s*0.24,-s*0.32); c.fill();
    c.strokeStyle='#b84e6c'; c.lineWidth=lw; c.stroke();
  }else if(k==='duck'){
    c.fillStyle='#8cc8e8'; c.beginPath(); c.ellipse(0,s*0.33,s*0.46,s*0.08,0,0,TAU); c.fill();
    c.fillStyle='#f7d75e'; c.beginPath(); c.ellipse(s*0.06,s*0.16,s*0.33,s*0.19,0,0,TAU); c.fill();
    c.beginPath(); c.arc(-s*0.18,-s*0.12,s*0.16,0,TAU); c.fill();
    c.fillStyle='#f19437'; c.beginPath(); c.moveTo(-s*0.32,-s*0.14); c.lineTo(-s*0.46,-s*0.08); c.lineTo(-s*0.31,-s*0.05); c.fill();
    c.fillStyle='#4a3a35'; c.beginPath(); c.arc(-s*0.2,-s*0.16,s*0.03,0,TAU); c.fill();
    c.strokeStyle='#c09a2e'; c.lineWidth=lw; c.beginPath(); c.ellipse(s*0.06,s*0.16,s*0.33,s*0.19,0,0,TAU); c.stroke();
  }else if(k==='fountain'){
    c.strokeStyle='#5aa6d6'; c.lineWidth=lw*1.3;
    c.beginPath(); c.moveTo(0,-s*0.05); c.quadraticCurveTo(-s*0.2,-s*0.45,-s*0.34,-s*0.02); c.moveTo(0,-s*0.05); c.quadraticCurveTo(s*0.2,-s*0.45,s*0.34,-s*0.02);
    c.moveTo(0,-s*0.05); c.lineTo(0,-s*0.38); c.stroke();
    c.fillStyle='#a9c7d8'; c.beginPath(); c.ellipse(0,s*0.15,s*0.44,s*0.15,0,0,TAU); c.fill();
    c.fillStyle='#d3e6ef'; c.fillRect(-s*0.44,s*0.15,s*0.88,s*0.12); c.beginPath(); c.ellipse(0,s*0.27,s*0.44,s*0.13,0,0,TAU); c.fill();
    c.fillStyle='#7cc3ea'; c.beginPath(); c.ellipse(0,s*0.15,s*0.36,s*0.1,0,0,TAU); c.fill();
    c.strokeStyle='#6d8796'; c.lineWidth=lw; c.beginPath(); c.ellipse(0,s*0.15,s*0.44,s*0.15,0,0,TAU); c.stroke();
  }else if(k==='lantern'){
    c.fillStyle='rgba(255,210,110,0.45)'; c.beginPath(); c.arc(0,0,s*0.48,0,TAU); c.fill();
    c.strokeStyle='#7a5a44'; c.lineWidth=lw; c.beginPath(); c.moveTo(0,-s*0.48); c.lineTo(0,-s*0.3); c.stroke();
    c.fillStyle='#e2584e'; c.beginPath(); c.ellipse(0,0,s*0.25,s*0.3,0,0,TAU); c.fill();
    c.fillStyle='#ffb36b'; c.beginPath(); c.ellipse(-s*0.05,-s*0.03,s*0.11,s*0.2,0,0,TAU); c.fill();
    c.fillStyle='#5a3f35'; c.fillRect(-s*0.14,-s*0.33,s*0.28,s*0.07); c.fillRect(-s*0.14,s*0.27,s*0.28,s*0.07);
  }else if(k==='town'){
    c.fillStyle='#f4e2c4'; c.fillRect(-s*0.26,-s*0.02,s*0.36,s*0.32);
    c.fillStyle='#d9735f'; c.beginPath(); c.moveTo(-s*0.34,0); c.lineTo(-s*0.08,-s*0.28); c.lineTo(s*0.18,0); c.fill();
    c.fillStyle='#8a6a52'; c.fillRect(-s*0.12,s*0.12,s*0.09,s*0.18);
    c.fillStyle='#f6cf3f'; star(c,s*0.27,-s*0.27,s*0.16,s*0.07); c.fill();
    c.strokeStyle='#8a6a52'; c.lineWidth=lw; c.strokeRect(-s*0.26,-s*0.02,s*0.36,s*0.32);
  }
  c.restore();
}
function star(c,x,y,r1,r2){c.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?r2:r1;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath()}
function envelope(c,x,y,w,rot,k,al){
  var h=w*0.7; c.save(); c.translate(x,y); c.rotate(rot||0); c.globalAlpha=al===undefined?1:al;
  c.fillStyle='rgba(80,60,50,0.18)'; c.fillRect(-w/2+w*0.05,-h/2+w*0.06,w,h);
  c.fillStyle='#fffdf7'; c.fillRect(-w/2,-h/2,w,h);
  c.strokeStyle='#b49a86'; c.lineWidth=Math.max(1,w*0.035); c.strokeRect(-w/2,-h/2,w,h);
  c.beginPath(); c.moveTo(-w/2,-h/2); c.lineTo(0,h*0.05); c.lineTo(w/2,-h/2); c.stroke();
  c.fillStyle='#e8606e'; c.beginPath(); c.arc(0,h*0.05,w*0.06,0,TAU); c.fill();
  if(k)icon(c,k,0,h*0.08,w*0.62);
  c.restore();
}

/* ---------- town / state ---------- */
var T=null, townCount=0;
var R={x:0,z:1.2,h:-Math.PI/2,vx:0,vz:0,spd:0,sq:1,sqv:0,ear:0,earv:0,wig:0,wigv:0,walkPh:0,lastStepPh:0,

/* ---------- pond / collision ---------- */
function inPond(x,z,m){
  if(!T)return false; var L=T.pond.lobes;
  for(var i=0;i<L.length;i++){var a=(x-L[i].x)/(L[i].rx+m),b=(z-L[i].z)/(L[i].rz+m);if(a*a+b*b<1)return true}
  return false;
}
function onBridge(x,z){var B=T.bridge;return B.built&&B.prog>=1&&Math.abs(x-B.x)<0.62&&z>B.z0-0.1&&z<B.z1+0.1}
function groundY(x,z){
  if(T.bridge.built&&Math.abs(x-T.bridge.x)<0.7&&z>T.bridge.z0+0.15&&z<T.bridge.z1-0.15&&inPond(x,z,0.15))return 0.16;
  if(T.plazaRise>0&&dist(x,z,T.lots.plaza.x,T.lots.plaza.z)<T.lots.plaza.r)return 0.2*Math.min(1,T.plazaRise);
  return 0;
}
function solids(){
  var a=[];var L=T.lots;
  ['bakery','flower','duck'].forEach(function(k){if(L[k].open)a.push(L[k])});
  for(var i=0;i<T.houses.length;i++)a.push(T.houses[i]);
  return a;
}
function collide(o,rad){
  // world bounds
  o.x=clamp(o.x,-6.05,6.05); o.z=clamp(o.z,-9.95,10.0);
  // buildings (oriented boxes)
  var S=solids();
  for(var i=0;i<S.length;i++){var b=S[i];
    var dx=o.x-b.x,dz=o.z-b.z,c=Math.cos(b.yaw),s=Math.sin(b.yaw);
    var u=dx*c-dz*s, v=dx*s+dz*c, hw=b.w/2+rad, hd=b.d/2+rad;
    if(Math.abs(u)<hw&&Math.abs(v)<hd){
      var pu=hw-Math.abs(u), pv=hd-Math.abs(v);
      if(pu<pv)u=(u<0?-hw:hw);else v=(v<0?-hd:hd);
      o.x=b.x+u*c+v*s; o.z=b.z-u*s+v*c;
    }
  }
  // circles: trees, post, fountain
  var circ=[];
  for(i=0;i<T.trees.length;i++)circ.push([T.trees[i].x,T.trees[i].z,0.32]);
  circ.push([T.post.x,T.post.z,0.3]);
  if(T.plazaRise>0.5)circ.push([T.lots.plaza.x,T.lots.plaza.z,0.85]);
  for(i=0;i<circ.length;i++){var cx=circ[i][0],cz=circ[i][1],r=circ[i][2]+rad;var d=dist(o.x,o.z,cx,cz);
    if(d<r){if(d<1e-4){o.x+=r;}else{o.x=cx+(o.x-cx)/d*r;o.z=cz+(o.z-cz)/d*r}}}
  // pond
  var B=T.bridge, L2=T.pond.lobes;
  for(var it=0;it<2;it++){
    if(!inPond(o.x,o.z,rad*0.8))break;
    if(B.built&&B.prog>=1&&Math.abs(o.x-B.x)<0.8&&o.z>B.z0-0.3&&o.z<B.z1+0.3){o.x=clamp(o.x,B.x-0.42,B.x+0.42);break}
    var best=null,bq=9;
    for(var k=0;k<L2.length;k++){var lb=L2[k],a2=(o.x-lb.x)/(lb.rx+rad*0.8),b2=(o.z-lb.z)/(lb.rz+rad*0.8),q=a2*a2+b2*b2;if(q<1&&q<bq){bq=q;best=lb}}
    if(best){var qq=Math.sqrt(Math.max(bq,1e-4));o.x=best.x+(o.x-best.x)/qq*1.01;o.z=best.z+(o.z-best.z)/qq*1.01}
  }
  o.x=clamp(o.x,-6.05,6.05); o.z=clamp(o.z,-9.95,10.0);
}

/* ---------- stones & road graph ---------- */
function gkey(x,z){return Math.floor(x)+','+Math.floor(z)}
function addStone(x,z,auto,hidden){
  var id=T.stones.length, rng=Math.random;
  var shp=[],nv=6+((rng()*3)|0);for(var i=0;i<nv;i++)shp.push(0.75+rng()*0.3);
  var s={id:id,x:x,z:z,adj:[],auto:!!auto,hidden:!!hidden,born:T.time,baked:false,shp:shp,rot:rng()*TAU,r:0.2+rng()*0.06,tone:(rng()*3)|0,ri:-1};
  T.stones.push(s); var k=gkey(x,z); (T.grid[k]||(T.grid[k]=[])).push(id);
  if(!auto){s.ri=T.rs.length;T.rs.push(id)}
  T.gver++;
  return id;
}
function link(a,b){
  if(a<0||b<0||a===b)return; var A=T.stones[a],B=T.stones[b];
  if(dist(A.x,A.z,B.x,B.z)>1.3)return;
  if(A.adj.indexOf(b)<0){A.adj.push(b);B.adj.push(a);T.gver++}
}
function nearStones(x,z,r,cb){
  var cx=Math.floor(x),cz=Math.floor(z),rr=Math.ceil(r);
  for(var i=-rr;i<=rr;i++)for(var j=-rr;j<=rr;j++){var a=T.grid[(cx+i)+','+(cz+j)];if(!a)continue;
    for(var k=0;k<a.length;k++){var s=T.stones[a[k]];var d=dist(s.x,s.z,x,z);if(d<=r)cb(s,d)}}
}
function nearestStone(x,z,r){var best=-1,bd=1e9;nearStones(x,z,r,function(s,d){if(d<bd){bd=d;best=s.id}});return best}
function polyArea(ids){var a=0;for(var i=0;i<ids.length;i++){var p=T.stones[ids[i]],q=T.stones[ids[(i+1)%ids.length]];a+=p.x*q.z-q.x*p.z}return Math.abs(a)/2}
function checkLoop(a,b){
  // called before linking a<->b: if they are already connected through the road, that road + new link is a ring
  var A=T.stones[a],B=T.stones[b]; if(!A||!B||A.auto||B.auto)return;
  if(A.adj.indexOf(b)>=0)return;
  var ids=dijkstra(a,b); if(!ids||ids.length<14)return;
  for(var i=0;i<ids.length;i++)if(T.stones[ids[i]].auto)return;
  var ar=polyArea(ids);
  if(ar>=5&&(!T.loop||ar>T.loop.area*1.1)){T.loop={ids:ids.slice(),area:ar};T.loopNew=1}
}
function trailStep(x,z){
  if(T.phase==='trans')return;
  var near=nearestStone(x,z,0.36);
  if(near>=0){
    if(T.lastStone>=0&&near!==T.lastStone){checkLoop(near,T.lastStone);link(T.lastStone,near)}
    T.lastStone=near;
  }else if(T.stones.length<950){
    var id=addStone(x,z,false,false);
    if(T.lastStone>=0)link(T.lastStone,id);
    var self=id;
    nearStones(x,z,0.75,function(s){if(s.id!==self&&s.id!==T.lastStone){checkLoop(s.id,self);link(self,s.id)}});
    T.lastStone=id;
    T.pending.push(id);
    SND.pop(1+T.stones.length%7*0.06);
  }
  T.lastPlace={x:x,z:z};
}
// Dijkstra
var rCache={};
function dijkstra(s,t){
  var key=s+'>'+t+'@'+T.gver; if(rCache[key])return rCache[key];
  var n=T.stones.length, dd=new Float64Array(n), pv=new Int32Array(n), done=new Uint8Array(n);
  for(var i=0;i<n;i++){dd[i]=1e9;pv[i]=-1} dd[s]=0;
  var heap=[[0,s]];
  function push(e){heap.push(e);var i=heap.length-1;while(i>0){var p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;var tmp=heap[p];heap[p]=heap[i];heap[i]=tmp;i=p}}
  function pop(){var top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;var i=0;for(;;){var l=i*2+1,r=l+1,m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;var tmp=heap[m];heap[m]=heap[i];heap[i]=tmp;i=m}}return top}
  while(heap.length){var e=pop(),u=e[1];if(done[u])continue;done[u]=1;if(u===t)break;
    var su=T.stones[u];for(var k=0;k<su.adj.length;k++){var v=su.adj[k];if(done[v])continue;var sv=T.stones[v];var nd=dd[u]+dist(su.x,su.z,sv.x,sv.z);if(nd<dd[v]){dd[v]=nd;pv[v]=u;push([nd,v])}}}
  var res=null;
  if(dd[t]<1e9){res=[];for(var c=t;c>=0;c=pv[c])res.push(c);res.reverse()}
  if(Object.keys(rCache).length>200)rCache={};
  rCache[key]=res; return res;
}
function route(ax,az,bx,bz){
  var s=nearestStone(ax,az,3.2),t=nearestStone(bx,bz,3.2);
  if(s<0||t<0)return [{x:bx,z:bz}];
  var ids=dijkstra(s,t); if(!ids)return [{x:bx,z:bz}];
  var pts=[];for(var i=0;i<ids.length;i++){var st=T.stones[ids[i]];pts.push({x:st.x,z:st.z})}
  pts.push({x:bx,z:bz});
  // skip first point if behind
  if(pts.length>2&&dist(ax,az,pts[1].x,pts[1].z)<dist(pts[0].x,pts[0].z,pts[1].x,pts[1].z))pts.shift();
  return pts;
}
function pathLen(p,ax,az){var L=0,x=ax,z=az;for(var i=0;i<p.length;i++){L+=dist(x,z,p[i].x,p[i].z);x=p[i].x;z=p[i].z}return L}

function mkCritter(kind,x,z){
  var c={kind:kind,x:x,z:z,h:Math.PI/2,spd:1.6,path:[],tasks:[],carry:null,walkPh:Math.random()*4,moving:false,act:null,actT:0,

  T.critters.push(c); return c;

function turnTo(c,a,dt,rate){c.h+=angDiff(c.h,a)*Math.min(1,dt*(rate||9))}
function followPath(c,dt){
  var step=c.spd*dt;
  while(c.path.length){
    var p=c.path[0],dx=p.x-c.x,dz=p.z-c.z,d=Math.sqrt(dx*dx+dz*dz);
    if(d<=step){c.x=p.x;c.z=p.z;step-=d;c.path.shift();continue}
    c.x+=dx/d*step;c.z+=dz/d*step;turnTo(c,Math.atan2(dz,dx),dt);c.moving=true;return false;
  }
  c.moving=false;return true;
}
function runTasks(c,dt){
  var k=c.tasks[0]; if(!k)return false;
  if(k.t==='go'){
    if(!k.st){k.st=1;c.path=k.direct?[{x:k.x,z:k.z}]:route(c.x,c.z,k.x,k.z)}
    if(followPath(c,dt))c.tasks.shift();
  }else if(k.t==='wait'){c.moving=false;k.d-=dt;if(k.face!==undefined)turnTo(c,k.face,dt,5);if(k.d<=0)c.tasks.shift()}
  else if(k.t==='until'){c.moving=false;k.max=(k.max===undefined?15:k.max)-dt;if(k.f()||k.max<=0)c.tasks.shift()}
  else if(k.t==='do'){c.tasks.shift();k.f()}
  else if(k.t==='act'){c.moving=false;c.act=k.a;if(k.face!==undefined)turnTo(c,k.face,dt,6);k.d-=dt;if(k.d<=0){c.act=null;c.tasks.shift()}}
  return true;
}

  var x=e.clientX,y=e.clientY;
  hint.idle=0; hint.t=-1;
  // next town letter
  if(T.next&&T.next.landed){
    var lx=PX(T.next.x),ly=PY(0.2,T.next.z);
    if(dist(x,y,lx,ly)<Math.max(58,1.1*cam.S)){ptr.id=e.pointerId;ptr.mode='letter';ptr.sx=x;ptr.sy=y;ptr.x=x;ptr.y=y;T.next.grab=true;capture(e);SND.swish();return}
  }
  var rs=rabbitScreen();
  if(dist(x,y,rs.x,rs.y)<rabbitHitR()){
    ptr.id=e.pointerId;ptr.mode='rabbit';ptr.sx=x;ptr.sy=y;ptr.x=x;ptr.y=y;ptr.moved=0;ptr.downT=T.time;
    var fy=PY(groundY(R.x,R.z),R.z);
    ptr.offx=clamp(PX(R.x)-x,-30,30); ptr.offy=clamp(fy-y,-10,46);

    SND.boing(); firstTouch=true;

  }

  R.look=clamp(angDiff(R.h,Math.atan2(unZ(y)-R.z,unX(x)-R.x)),-1.2,1.2);
}
function capture(e){try{cv.setPointerCapture(e.pointerId)}catch(_){}}
function onMove(e){

  ptr.x=e.clientX;ptr.y=e.clientY;
  if(ptr.mode==='letter'&&T.next){
    T.next.dx=ptr.x-ptr.sx;T.next.dy=ptr.y-ptr.sy;
    if(dist(ptr.x,ptr.y,ptr.sx,ptr.sy)>70){release();startTransition()}
  }
}
function release(){

  objs.push(T.post);
  for(var i=0;i<objs.length;i++){var o=objs[i];var ox=PX(o.x),oy=PY(o.h?o.h*0.5:0.6,o.z);var d=dist(x,y,ox,oy);var lim=Math.max(30,(o.w?o.w*0.6:0.6)*cam.S);if(d<lim&&d<bd){bd=d;best=o}}
  if(best){best.wig=1;SND.tick();return}

  if(inPond(gxw,gzw,0)){T.ripples.push({x:gxw,z:gzw,t:0});SND.ripple();return}

}

  var b={x:bx,z:bz,mx:mid.x,mz:mid.z,yaw:Math.atan2(nx,nz),pop:0,t:0,wig:0,w:1.0,h:0.5};

function spawnCustomers(){

function planStroll(c){
  var L=T.lots, d=[];
  d.push({p:L.bakery.door,item:'bread'},{p:L.flower.door,item:'bouquet'});
  if(L.duck.open)d.push({p:L.duck.door,item:null});
  d.push({p:{x:T.post.x+0.6,z:T.post.z+0.5},item:null});
  var pick=d[(Math.random()*d.length)|0];
  if(c.lastPick===pick.p)pick=d[(d.indexOf(pick)+1)%d.length];
  c.lastPick=pick.p;
  var p=route(c.x,c.z,pick.p.x+rnd(-0.3,0.3),pick.p.z+0.3);
  // detour to bench if road passes near
  var detour=null;
  for(var i=0;i<T.benches.length&&!detour;i++){var b=T.benches[i];for(var j=0;j<p.length;j++)if(dist(p[j].x,p[j].z,b.mx,b.mz)<1.2){detour=b;break}}
  if(detour&&Math.random()<0.75){var bb=detour;c.tasks.push(go(bb.mx,bb.mz),go(bb.x+rnd(-0.25,0.25),bb.z,true),act('sit',rnd(1.8,3)),go(bb.mx,bb.mz,true))}

}

/* ---------- duck & bridge ---------- */
function spawnDuck(){
  var L=T.lots.duck;
  var c=mkCritter('duck',L.x+0.5,L.z+0.95); c.spd=2.2; c.pop=1; c.arrived=true; c.follow=true; c.followT=0;

function buildBridge(){
  var B=T.bridge; B.built=true; B.prog=0;
  // stones extend from where rabbit stood near duck door across the pond
  var D=T.lots.duck.door, ids=[], last=nearestStone(D.x,D.z,1.5);
  var pts=[];var z;
  for(z=D.z-0.45;z>B.z1+0.05;z-=0.42)pts.push({x:lerp(D.x,B.x,0.5),z:z,h:false});
  for(z=B.z1;z>=B.z0-0.01;z-=0.42)pts.push({x:B.x,z:z,h:true});
  var northEnd={x:B.x,z:B.z0-0.42};
  pts.push({x:northEnd.x,z:northEnd.z,h:false});
  // connect to the nearest existing stone on the north side
  var target=-1,bd=1e9;
  for(var i=0;i<T.stones.length;i++){var s=T.stones[i];if(s.z<B.z0-0.2&&!s.auto){var d=dist(s.x,s.z,northEnd.x,northEnd.z);if(d<bd){bd=d;target=i}}}
  if(target>=0&&bd>0.6){var ts=T.stones[target],n=Math.floor(bd/0.42);for(i=1;i<n;i++)pts.push({x:lerp(northEnd.x,ts.x,i/n),z:lerp(northEnd.z,ts.z,i/n),h:false})}
  var prev=last;
  pts.forEach(function(p,k){
    setTimeout2(0.09*k,function(){
      var near=nearestStone(p.x,p.z,0.3);var id;
      if(near>=0&&!p.h){id=near}else{id=addStone(p.x,p.z,true,p.h);if(!p.h)T.pending.push(id)}
      if(prev>=0)link(prev,id); prev=id;
      if(p.h){B.prog=clamp((B.z1-p.z)/(B.z1-B.z0),0,1);SND.step('wood',1+k*0.03)}else SND.pop(1.2+k*0.02);
      if(k===pts.length-1){if(target>=0)link(id,target);B.prog=1;SND.success();sparkle(B.x,0.6,(B.z0+B.z1)/2,12)}
    });
  });
}
function duckUpdate(c,dt){
  if(!c.follow)return;
  c.followT+=dt;
  // follow rabbit's history
  var h=R.hist, tgt=null, acc=0;
  for(var i=h.length-1;i>0;i--){acc+=dist(h[i].x,h[i].z,h[i-1].x,h[i-1].z);if(acc>1.1){tgt=h[i-1];break}}
  if(tgt){var d=dist(c.x,c.z,tgt.x,tgt.z);if(d>0.15){var sp=Math.min(4.6,0.8+d*2.2);c.x+=(tgt.x-c.x)/d*Math.min(d,sp*dt);c.z+=(tgt.z-c.z)/d*Math.min(d,sp*dt);turnTo(c,Math.atan2(tgt.z-c.z,tgt.x-c.x),dt);c.moving=true}else c.moving=false}
  else c.moving=false;
  if(onBridge(c.x,c.z))c.wasOnBridge=true;
  var B=T.bridge, P=T.lots.plaza;
  if(c.wasOnBridge&&c.z<B.z0-0.1&&!T.duckPlaza){
    // crossed the short-cut first
    T.duckBridge=true;c.follow=false;var D=T.lots.duck.door;
    c.tasks.push(act('happy',0.8),doit(SND.quack),go(D.x+0.4,D.z+0.4),doit(function(){c.home=true}));
  }else if(!T.duckBridge&&!c.wasOnBridge&&(dist(R.x,R.z,P.x,P.z)<P.r+0.6||dist(R.x,R.z,T.post.x,T.post.z)<1.8)&&R.z<B.z0-0.5&&dist(c.x,c.z,R.x,R.z)<3){
    T.duckPlaza=true;c.follow=false;
    c.tasks.push(go(P.x-1.2,P.z+0.9,true),act('happy',0.8),doit(SND.quack));
  }else if(c.followT>70){
    c.follow=false;var D2=T.lots.duck.door;c.tasks.push(go(D2.x+0.4,D2.z+0.4));
  }
}

function plazaSpot(i,n,r){var P=T.lots.plaza;var a=Math.PI*0.5+i/n*TAU;return{x:P.x+Math.cos(a)*(r||1.35),z:P.z+Math.sin(a)*(r||1.35)}}
function startFestival(){

function paradePoints(withLoop){

    pts.push({x:lp[0].x,z:lp[0].z});

}
function hatch(c,x0,y0,x1,y1,col,step,ang,clipFn){

  for(var t=-L;t<L;t+=step){var cx=(x0+x1)/2+(-dy)*t,cy=(y0+y1)/2+dx*t;c.moveTo(cx-dx*L+rnd(-2,2),cy-dy*L);c.lineTo(cx+dx*L,cy+dy*L+rnd(-2,2))}
  c.stroke();c.restore();
}

    (function(px,pz,rr){hatch(c,gx(px)-rr,gz(pz)-rr,gx(px)+rr,gz(pz)+rr,'rgba(130,180,110,0.18)',5,-0.7,function(cc){cc.ellipse(gx(px),gz(pz),rr,rr*0.7,rng()*3,0,TAU)})})(px,pz,rr)}

  var lobes=T.pond.lobes;
  c.save();c.beginPath();lobes.forEach(function(l){c.moveTo(gx(l.x+l.rx),gz(l.z));c.ellipse(gx(l.x),gz(l.z),l.rx*G,l.rz*G,0,0,TAU)});

    if(inside){if(pts.length>1)pencilStroke(c,pts,'rgba(70,130,170,0.6)',2,2,2);pts=[]}else pts.push([gx(px),gz(pz)])}

    c.save();c.translate(gx(L.x),gz(L.z));c.rotate(-L.yaw);
    c.setLineDash([9,7]);c.strokeStyle='rgba(150,115,95,0.55)';c.lineWidth=2.2;

    c.rotate(L.yaw);icon(c,L.icon,0,0,Math.min(L.w,L.d)*G*0.95);
    hatch(c,-60,-60,60,60,'rgba(255,255,255,0.25)',4,0.8);
    c.restore();

    c.fillStyle='rgba(255,250,235,0.5)';c.fill();icon(c,'fountain',gx(P.x),gz(P.z)-0.15*G,1.9*G)}
  c.restore();

function roundRect(c,x,y,w,h,r){c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y)}
var STC=['#e6ddcc','#ddd3c2','#ebe2d2'];
function drawStone(c,s,sc){

  c.beginPath();for(var i=0;i<n;i++){var a=s.rot+i/n*TAU;c.lineTo(x+Math.cos(a)*r*s.shp[i],y+Math.sin(a)*r*s.shp[i])}c.closePath();
  c.fillStyle=STC[s.tone];c.fill();c.strokeStyle='rgba(120,100,85,0.55)';c.lineWidth=1.6;c.stroke();

var LIGHT=(function(){var x=-0.45,y=0.75,z=0.5,l=Math.hypot(x,y,z);return[x/l,y/l,z/l]})();

  ctx.beginPath();for(var i=0;i<pts.length;i++){var p=pts[i];var X=PX(p[0]),Y=PY(p[1],p[2]);if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y)}ctx.closePath();

function drawItem(k,x,y,s){
  if(!k)return;

  else if(k==='fbread'){ctx.fillStyle='#f7c6d2';ctx.beginPath();ctx.moveTo(x-s*0.45,y-s*0.1);ctx.lineTo(x+s*0.45,y-s*0.1);ctx.lineTo(x+s*0.32,y+s*0.35);ctx.lineTo(x-s*0.32,y+s*0.35);ctx.closePath();ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.stroke();

    icon(ctx,'bread',x,y-s*0.15,s*0.7)}

    var n=k==='flower1'?1:3;
    ctx.fillStyle='#fff7ec';ctx.beginPath();ctx.moveTo(x-s*0.3,y-s*0.15);ctx.lineTo(x+s*0.3,y-s*0.15);ctx.lineTo(x,y+s*0.45);ctx.closePath();ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.stroke();
    var fc=['#ef7c9a','#f6d36b','#b998e0'];for(i=0;i<n;i++){ctx.fillStyle=fc[i];ctx.beginPath();ctx.arc(x+(i-1)*s*0.18*(n>1?1:0),y-s*0.25-(i%2)*s*0.1,s*0.13,0,TAU);ctx.fill()}
    if(k==='gift2')drawItem('fbread',x+s*0.35,y+s*0.15,s*0.6);
  }
  else if(k==='flag'){ctx.strokeStyle='#8a6a52';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+s*0.4);ctx.lineTo(x,y-s*0.6);ctx.stroke();ctx.fillStyle=T.delivered[0]==='flower'?'#ef7c9a':'#e8a07a';ctx.beginPath();ctx.moveTo(x,y-s*0.6);ctx.lineTo(x+s*0.5,y-s*0.45+Math.sin(T.time*6)*s*0.05);ctx.lineTo(x,y-s*0.3);ctx.fill()}
  else if(k==='lantern'){icon(ctx,'lantern',x,y-s*0.2,s*0.9)}
}
function featurePt(cx,cy,cz,r,hf,hs,a,b,c){
  // normal = hf*a + hs*b + up*c
  var nx=hf[0]*a+hs[0]*b,nz=hf[1]*a+hs[1]*b,ny=c,l=Math.hypot(nx,ny,nz);nx/=l;ny/=l;nz/=l;
  return{x:PX(cx+nx*r),y:PY(cy+ny*r,cz+nz*r),vis:ny*VY+nz*VZ};
}
function drawCritter(c){
  var K=CK[c.kind],sz=K.size*(c.march?0.85:1)*(c.pop<1?outBack(c.pop):1),S=cam.S;
  var gy=groundY(c.x,c.z);
  var bob=c.moving?Math.abs(Math.sin(c.walkPh))*0.08*sz:0;
  if(c.hop)bob+=Math.abs(Math.sin(c.hop))*0.18*sz;
  if(c.act==='sit')bob-=0.0;
  var sitY=c.act==='sit'?0.3:0;
  var fx=Math.cos(c.h),fz=Math.sin(c.h),sx=-fz,sz2=fx;
  var X=PX(c.x),Yg=PY(gy+sitY,c.z);
  flatEll(X,PY(gy,c.z),0.5*sz*S,0.5*sz*S*KZ,0,'rgba(80,60,40,0.16)');
  var parts=[];
  function wp(f,s,u){return[c.x+fx*f*sz+sx*s*sz,gy+sitY+u*sz+bob,c.z+fz*f*sz+sz2*s*sz]}
  function add(p,fn){parts.push({d:DEP(p[1],p[2]),fn:fn,p:p})}
  var duck=c.kind==='duck'||c.kind==='duckling';
  // feet
  var ph=Math.sin(c.walkPh)*(c.moving?0.18:0);
  [-1,1].forEach(function(sd){var p=wp(ph*sd,sd*0.2,0.06);add(p,function(){ball(PX(p[0]),PY(p[1],p[2]),0.15*sz*S,0.1*sz*S,0,duck?'#f2993a':K.body,1)})});

  if(c.kind==='dog'){var dt2=wp(-0.48,0,0.6);add(dt2,function(){ball(PX(dt2[0])+Math.sin(T.time*12)*0.05*S,PY(dt2[1],dt2[2]),0.1*sz*S,0.14*sz*S,0,K.earC,1)})}
  // head
  var hd=wp(duck?0.32:0.12,0,duck?0.95:1.12);var hr=(duck?0.3:0.42)*sz;

    else if(K.snout){var sn=featurePt(hd[0],hd[1],hd[2],hr,hf,hs,1,0,-0.3);if(sn.vis>0.05){flatEll(sn.x,sn.y,0.17*sz*S,0.12*sz*S,0,K.snout);flatEll(sn.x,sn.y-0.05*sz*S,0.06*sz*S,0.045*sz*S,0,K.nose)}}
    [-1,1].forEach(function(sd){var e=featurePt(hd[0],hd[1],hd[2],hr,hf,hs,0.8,sd*0.42,0.18);if(e.vis>0.08){flatEll(e.x,e.y,0.055*sz*S,0.07*sz*S,0,'#3d2f2b');flatEll(e.x-0.015*S,e.y-0.025*S,0.018*S,0.018*S,0,'#ffffff')}
      var ck=featurePt(hd[0],hd[1],hd[2],hr,hf,hs,0.6,sd*0.65,-0.15);if(ck.vis>0.1&&!duck)flatEll(ck.x,ck.y,0.07*sz*S,0.045*sz*S,0,'rgba(240,140,150,0.45)')});
    drawEars(c,K,hd,hr,hf,hs,false);

  });

  }

  parts.sort(function(a,b){return a.d-b.d});

  if(b.t<2.2){x=lerp(b.x0,b.x1,smooth(k));z=lerp(b.z0,b.z1,smooth(k));y=3+Math.sin(k*Math.PI)*1.5}else{var k2=(b.t-2.2)/2.3;x=lerp(b.x1,7.5,k2);z=lerp(b.z1,-11,k2);y=3+k2*3}
  var X=PX(x),Y=PY(y,z),f=Math.sin(T.time*18);
  ball(X,Y,0.32*S,0.24*S,0,'#7fb3e0',1);ball(X+0.25*S,Y-0.12*S,0.17*S,0.17*S,0,'#8cc0ea',1);
  ctx.fillStyle='#f2993a';ctx.beginPath();ctx.moveTo(X+0.4*S,Y-0.12*S);ctx.lineTo(X+0.55*S,Y-0.08*S);ctx.lineTo(X+0.4*S,Y-0.04*S);ctx.fill();
  flatEll(X+0.28*S,Y-0.15*S,0.03*S,0.03*S,0,'#333');
  ctx.fillStyle='#6aa0d0';ctx.beginPath();ctx.moveTo(X-0.1*S,Y-0.05*S);ctx.lineTo(X-0.25*S,Y-0.5*S*f);ctx.lineTo(X+0.15*S,Y-0.05*S);ctx.fill();
  if(b.t<2.2)envelope(ctx,X+0.1*S,Y+0.3*S,0.5*S,0.2,'town');
}
function drawHint(){
  if(hint.t<0)return;
  var tg=currentTarget();if(!tg)return;
  var t=hint.t,a=t<0.25?t/0.25:t>1.9?1-(t-1.9)/0.3:1;
  var st,X,Y;
  if(tg.kind==='next'){X=PX(T.next.x);Y=PY(0.2,T.next.z)}else{var rs=rabbitScreen();X=rs.x;Y=rs.y}
  var ang=tg.kind==='next'?-0.8:Math.atan2(PY(0,tg.z)-PY(0,R.z),PX(tg.x)-PX(R.x));
  var pull=smooth((t-0.5)/1.0)*90;
  X+=Math.cos(ang)*pull;Y+=Math.sin(ang)*pull;
  var press=t>0.3&&t<1.7?0.88:1;
  ctx.save();ctx.globalAlpha=a*0.92;ctx.translate(X+10,Y+18);ctx.scale(press,press);
  // hand: palm + index finger pointing up-left
  ctx.scale(1.25,1.25);ctx.fillStyle='#ffd3b8';ctx.strokeStyle='rgba(150,90,70,0.95)';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.ellipse(10,26,20,18,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(-2,2,7,20,-0.25,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(10,26,19,17,0,0,TAU);ctx.fill();
  ctx.restore();
  if(t>0.3&&t<1.7){ctx.strokeStyle='rgba(255,190,80,'+(0.7*a)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(X,Y,16+Math.sin(t*10)*3,0,TAU);ctx.stroke()}
}
function drawPhoto(){
  var t=T.photoT, fl=t<0.35?1-t/0.35:0;
  if(fl>0){ctx.fillStyle='rgba(255,255,255,'+(fl*0.85)+')';ctx.fillRect(0,0,W,H)}
  var a=t<0.3?t/0.3:t>3.2?1-(t-3.2)/0.4:1;a=clamp(a,0,1);
  var m=Math.min(W,H)*0.035+6,l=safe.l+m,tp=safe.t+m,r=W-safe.r-m,b=H-safe.b-m;
  ctx.globalAlpha=a;ctx.strokeStyle='#fffdf6';ctx.lineWidth=m*0.9;ctx.strokeRect(l,tp,r-l,b-tp);
  ctx.strokeStyle='rgba(120,95,70,0.35)';ctx.lineWidth=1.5;ctx.strokeRect(l+m*0.45,tp+m*0.45,r-l-m*0.9,b-tp-m*0.9);
  // corner tapes
  ctx.fillStyle='rgba(240,200,140,0.75)';[[l,tp,-0.6],[r,tp,0.6],[l,b,0.6],[r,b,-0.6]].forEach(function(c){ctx.save();ctx.translate(c[0],c[1]);ctx.rotate(c[2]);ctx.fillRect(-m*1.6,-m*0.5,m*3.2,m);ctx.restore()});
  ctx.globalAlpha=1;
}
function drawTrans(){
  var t=globalTrans.t,k=t<0.75?smooth(t/0.75):1-smooth((t-0.75)/0.85);
  var x=W*(1-k);
  ctx.fillStyle='#fbf7ee';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(W+20,0);ctx.lineTo(W+20,H);ctx.lineTo(x-60*k,H);ctx.closePath();ctx.fill();
  var gr=ctx.createLinearGradient(x-40,0,x+30,0);gr.addColorStop(0,'rgba(120,90,60,0)');gr.addColorStop(1,'rgba(120,90,60,0.25)');ctx.fillStyle=gr;ctx.fillRect(x-40,0,70,H);
  if(k>0.6){icon(ctx,'town',W/2,H/2,Math.min(W,H)*0.25*k)}
}

/* ---------- main loop ---------- */
var last=0,raf=0,running=false,timeScale=1,frameN=0,fpsAcc=0,fps=60;
function frame(ts){
  raf=0; if(!running)return;
  var dt=last?(ts-last)/1000:0.016; last=ts;
  if(dt>0.05)dt=0.05; if(dt<0)dt=0;
  fpsAcc=fpsAcc*0.95+dt*0.05; fps=1/Math.max(fpsAcc,1e-3); frameN++;
  var steps=timeScale>1?Math.round(timeScale):1;
  for(var i=0;i<steps;i++){update(dt);}
  camUpdate(dt,false);
  render();
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=0;raf=requestAnimationFrame(frame)}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;release()}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){stop();try{if(AU.c&&AU.c.state==='running')AU.c.suspend()}catch(e){}}
  else{start();try{if(AU.c&&firstTouch)AU.c.resume()}catch(e){}}
});
window.addEventListener('pagehide',stop);
window.addEventListener('pageshow',function(){if(!document.hidden)start()});
window.addEventListener('resize',function(){resize();camUpdate(0,true)});
window.addEventListener('orientationchange',function(){setTimeout(function(){resize();camUpdate(0,true)},120)});

resize(); newTown(); camUpdate(0,true); start();

  setTimeScale:function(s){timeScale=s},
  fps:function(){return fps},
  frames:function(){return frameN},
  phase:function(){return T.phase},
  ptr:ptr
};
