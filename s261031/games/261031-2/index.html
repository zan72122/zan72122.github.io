<script>
'use strict';
(function(){
// =====================================================================
//  helpers
// =====================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const sq=v=>v*v;
const hyp=(x,y)=>Math.sqrt(x*x+y*y);
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
let seedV=1;function srand(s){seedV=s|0||1;}function rnd(){seedV=(seedV*16807)%2147483647;return seedV/2147483647;}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saDiv=document.getElementById('sa');

// =====================================================================
//  audio (Web Audio synthesis only)
// =====================================================================
let AC=null,master=null,noiseBuf=null,audioOK=false;
function audioInit(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      AC=new C(); master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);
    }
    if(AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});
    audioOK=true;
  }catch(e){AC=null;}
}
function now(){return AC?AC.currentTime:0;}
function tone(type,f0,f1,dur,vol,delay,attack){
  if(!AC||AC.state!=='running')return;
  const t=now()+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const a=attack||0.008;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,ftype,f0,f1,delay,q){
  if(!AC||AC.state!=='running')return;
  const t=now()+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=ftype||'lowpass';f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.2);s.stop(t+dur+0.05);
}
const SFX={
  squish(st){const f=150+clamp(st,0,1.4)*230;tone('sine',f*1.35,f*0.75,0.16,0.22);noise(0.12,0.05,'lowpass',900,300);},
  press(){tone('sine',260,150,0.14,0.22);noise(0.1,0.06,'lowpass',700,250);},
  fold(){noise(0.18,0.12,'lowpass',1200,200);tone('sine',200,120,0.18,0.16);},
  pop(){tone('sine',700,320,0.12,0.2);},
  tick(){tone('triangle',520,480,0.05,0.07);},
  roll(){tone('sine',95,70,0.16,0.22);noise(0.08,0.04,'lowpass',400,150);},
  whoosh(){noise(0.6,0.12,'bandpass',300,1400,0,1.2);},
  bubble(){tone('sine',380+Math.random()*200,900+Math.random()*300,0.07,0.07);},
  crack(){noise(0.05,0.35,'highpass',2500,1800);tone('triangle',1900,1100,0.07,0.16);noise(0.18,0.1,'bandpass',900,400,0.03,2);},
  cheer(){for(let i=0;i<7;i++){const b=700+Math.random()*700;tone('sine',b,b*1.5,0.16+Math.random()*0.1,0.05,0.05+i*0.045+Math.random()*0.03);}},
  chime(){[523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,0.35,0.13,i*0.09));},
  big(){[392,523,659,784,1047,1319].forEach((f,i)=>tone('triangle',f,f,0.5,0.12,i*0.11));tone('sine',130,130,1,0.12);},
  peep(){tone('sine',2300,3000,0.06,0.07);tone('sine',2400,3200,0.06,0.07,0.09);},
  meow(){tone('sawtooth',500,700,0.12,0.03);tone('sine',700,450,0.25,0.08,0.1);},
  sniff(){noise(0.06,0.06,'bandpass',2500,3000,0,3);noise(0.06,0.06,'bandpass',2500,3000,0.1,3);},
  ding(){tone('sine',1320,1320,0.4,0.1);tone('sine',1980,1980,0.3,0.05,0.02);},
  sprinkle(){for(let i=0;i<4;i++)tone('sine',1800+i*300,1800+i*300,0.06,0.04,i*0.06);},
  hmm(){tone('sine',420,360,0.18,0.06);tone('sine',380,440,0.18,0.06,0.2);},
  swap(){tone('triangle',600,900,0.12,0.08);tone('triangle',900,600,0.12,0.08,0.13);},
  grow(){tone('sine',300,600,0.25,0.08);},
  fanfare(){[523,659,784,659,784,1047].forEach((f,i)=>tone('triangle',f,f,i==5?0.6:0.2,0.12,i*0.14));},
};
let lastSquish=0;

// =====================================================================
//  canvas & layout
// =====================================================================
let W=0,H=0,DPR=1,S=1,VW=0,VH=0,portrait=false;
const safe={t:0,r:0,b:0,l:0};
let L=null;
function readSafe(){
  const cs=getComputedStyle(saDiv);
  safe.t=parseFloat(cs.paddingTop)||0;safe.r=parseFloat(cs.paddingRight)||0;
  safe.b=parseFloat(cs.paddingBottom)||0;safe.l=parseFloat(cs.paddingLeft)||0;
}
function buildLayout(){
  readSafe();
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  portrait=H>W*1.05;
  const DW=portrait?600:1200,DH=portrait?1060:800;
  const aw=W-safe.l-safe.r,ah=H-safe.t-safe.b;
  S=Math.min(aw/DW,ah/DH);VW=W/S;VH=H/S;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const x0=safe.l/S,x1=VW-safe.r/S,y0=safe.t/S,y1=VH-safe.b/S,cw=x1-x0,ch=y1-y0;
  const l={x0,x1,y0,y1,cw,ch,cx:(x0+x1)/2,portrait};
  if(!portrait){
    l.R0=Math.min(cw*0.088,ch*0.13);
    l.doughX=x0+cw*0.5;l.doughY=y0+ch*0.67;
    l.tableL=x0+cw*0.23;l.tableR=x0+cw*0.77;l.tableTop=y0+ch*0.5;l.tableFront=y0+ch*0.86;
    l.src=[{k:'s',x:x0+cw*0.095,y:y0+ch*0.44},{k:'e',x:x0+cw*0.095,y:y0+ch*0.65},{k:'b',x:x0+cw*0.095,y:y0+ch*0.86}];
    l.oven={x:x0+cw*0.885,y:y0+ch*0.47,s:l.R0/100*1.12};
    l.plates={x:x0+cw*0.69,y:y0+ch*0.43};
    l.kitten={x:x0+cw*0.31,y:y0+ch*0.5};
    l.shelf={x:x0+cw*0.27,x2:x0+cw*0.66,y:y0+ch*0.22,n:5};
    l.win={x:x0+cw*0.035,y:y0+ch*0.05,w:cw*0.17,h:ch*0.25};
    l.chickHome={x:x0+cw*0.29,y:y0+ch*0.8};
    l.gGround=y0+ch*0.82;
    l.gsrc=[{k:'s',x:x0+cw*0.07,y:y0+ch*0.6},{k:'e',x:x0+cw*0.07,y:y0+ch*0.77},{k:'b',x:x0+cw*0.16,y:y0+ch*0.9}];
    l.gKitten={x:x0+cw*0.17,y:y0+ch*0.74};
  }else{
    l.R0=Math.min(cw*0.15,ch*0.088);
    l.doughX=x0+cw*0.5;l.doughY=y0+ch*0.62;
    l.tableL=x0+cw*0.03;l.tableR=x1-cw*0.03;l.tableTop=y0+ch*0.47;l.tableFront=y0+ch*0.77;
    l.src=[{k:'s',x:x0+cw*0.18,y:y0+ch*0.885},{k:'e',x:x0+cw*0.5,y:y0+ch*0.885},{k:'b',x:x0+cw*0.82,y:y0+ch*0.885}];
    l.oven={x:x0+cw*0.8,y:y0+ch*0.33,s:l.R0/100*0.95};
    l.plates={x:x0+cw*0.56,y:y0+ch*0.415};
    l.kitten={x:x0+cw*0.3,y:y0+ch*0.415};
    l.shelf={x:x0+cw*0.1,x2:x0+cw*0.9,y:y0+ch*0.13,n:4};
    l.win={x:x0+cw*0.04,y:y0+ch*0.19,w:cw*0.25,h:ch*0.12};
    l.chickHome={x:x0+cw*0.13,y:y0+ch*0.73};
    l.gGround=y0+ch*0.7;
    l.gsrc=[{k:'s',x:x0+cw*0.18,y:y0+ch*0.89},{k:'e',x:x0+cw*0.5,y:y0+ch*0.89},{k:'b',x:x0+cw*0.82,y:y0+ch*0.89}];
    l.gKitten={x:x0+cw*0.14,y:y0+ch*0.77};
  }
  l.ground=l.doughY+l.R0*0.36;
  l.ovenMouth={x:l.oven.x,y:l.oven.y+18*l.oven.s,r:68*l.oven.s};
  const oldL=L;L=l;
  if(oldL)remap(oldL,l);
  bgCanvas=null;
}

// =====================================================================
//  textures (prerendered once per layout)
// =====================================================================
let grainPat=null,bgCanvas=null;
function makeGrain(){
  const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
  srand(7);
  for(let i=0;i<1400;i++){
    const x=rnd()*180,y=rnd()*180,r=rnd()*1.4+0.3,l=rnd();
    g.fillStyle=l<0.5?'rgba(255,250,235,'+(0.05+rnd()*0.12)+')':'rgba(60,40,30,'+(0.03+rnd()*0.07)+')';
    g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  }
  for(let i=0;i<60;i++){
    const x=rnd()*180,y=rnd()*180,a=rnd()*TAU,l=6+rnd()*16;
    g.strokeStyle='rgba(255,248,230,0.05)';g.lineWidth=1+rnd()*2;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  grainPat=ctx.createPattern(c,'repeat');
}
function strokes(g,x,y,w,h,col,n,len,wid,alpha,sd){
  srand(sd);
  for(let i=0;i<n;i++){
    const px=x+rnd()*w,py=y+rnd()*h,a=(rnd()-0.5)*0.6,l=len*(0.5+rnd());
    g.strokeStyle=col;g.globalAlpha=alpha*(0.4+rnd()*0.6);g.lineWidth=wid*(0.5+rnd());g.lineCap='round';
    g.beginPath();g.moveTo(px,py);g.quadraticCurveTo(px+l*0.5,py+(rnd()-0.5)*wid,px+l*Math.cos(a),py+l*Math.sin(a));g.stroke();
  }
  g.globalAlpha=1;
}
function buildBg(){
  const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
  const g=c.getContext('2d');g.setTransform(DPR*S,0,0,DPR*S,0,0);
  const l=L;
  // wall
  const wg=g.createLinearGradient(0,0,0,VH);wg.addColorStop(0,'#88a59c');wg.addColorStop(1,'#6f8f86');
  g.fillStyle=wg;g.fillRect(0,0,VW,VH);
  strokes(g,0,0,VW,VH,'#a3bdb2',260,60,10,0.25,3);
  strokes(g,0,0,VW,VH,'#5f7e76',160,50,8,0.18,4);
  // wainscot / floor
  const fy=l.tableTop+l.R0*0.4;
  g.fillStyle='#a77b5b';g.fillRect(0,fy,VW,VH-fy);
  strokes(g,0,fy,VW,VH-fy,'#c39572',140,80,9,0.25,5);
  strokes(g,0,fy,VW,VH-fy,'#835a40',90,70,7,0.2,6);
  g.fillStyle='rgba(60,40,30,0.18)';g.fillRect(0,fy,VW,6);
  // window frame with garden painted
  const w=l.win;
  g.fillStyle='#e9dcc0';rr(g,w.x-10,w.y-10,w.w+20,w.h+20,14);g.fill();
  const sg=g.createLinearGradient(0,w.y,0,w.y+w.h);sg.addColorStop(0,'#cfe2e0');sg.addColorStop(1,'#e8ecd0');
  g.fillStyle=sg;rr(g,w.x,w.y,w.w,w.h,8);g.fill();
  g.save();rr(g,w.x,w.y,w.w,w.h,8);g.clip();
  g.fillStyle='#93b37f';g.beginPath();g.ellipse(w.x+w.w*0.3,w.y+w.h*1.05,w.w*0.7,w.h*0.45,0,0,TAU);g.fill();
  g.fillStyle='#7aa06c';g.beginPath();g.ellipse(w.x+w.w*0.9,w.y+w.h*1.1,w.w*0.6,w.h*0.5,0,0,TAU);g.fill();
  strokes(g,w.x,w.y+w.h*0.6,w.w,w.h*0.4,'#a9c78e',30,14,4,0.4,8);
  g.restore();
  g.strokeStyle='#e9dcc0';g.lineWidth=6;g.beginPath();g.moveTo(w.x+w.w/2,w.y);g.lineTo(w.x+w.w/2,w.y+w.h);g.stroke();
  g.fillStyle='#d9c7a2';g.fillRect(w.x-16,w.y+w.h+8,w.w+32,10);
  // shelf board
  const sh=l.shelf,R=l.R0;
  g.fillStyle='#8b5e3f';rr(g,sh.x-R*0.5,sh.y+R*0.28,sh.x2-sh.x+R,R*0.16,4);g.fill();
  g.fillStyle='#6d4630';g.fillRect(sh.x-R*0.3,sh.y+R*0.42,R*0.1,R*0.25);g.fillRect(sh.x2+R*0.2,sh.y+R*0.42,R*0.1,R*0.25);
  // plate shelf nook
  g.fillStyle='#8b5e3f';rr(g,l.plates.x-R*0.85,l.plates.y+R*0.32,R*1.7,R*0.12,4);g.fill();
  // grain on top
  g.fillStyle=grainPat;g.globalAlpha=0.9;g.fillRect(0,0,VW,VH);g.globalAlpha=1;
  bgCanvas=c;
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function blob(x,y,rx,ry,sd,amp,n){
  n=n||14;amp=amp==null?0.06:amp;ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*TAU,k=1+amp*Math.sin(a*3+sd)+amp*0.6*Math.sin(a*5+sd*2.3);
    const px=x+Math.cos(a)*rx*k,py=y+Math.sin(a)*ry*k;
    if(i===0)ctx.moveTo(px,py);else{const pa=(i-0.5)/n*TAU,pk=1+amp*Math.sin(pa*3+sd)+amp*0.6*Math.sin(pa*5+sd*2.3);
      ctx.quadraticCurveTo(x+Math.cos(pa)*rx*pk*1.02,y+Math.sin(pa)*ry*pk*1.02,px,py);}
  }
  ctx.closePath();
}
function ell(x,y,rx,ry,col,rot){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);ctx.fill();}
function circ(x,y,r,col){ell(x,y,r,r,col);}

// =====================================================================
//  game state
// =====================================================================
const N=40;              // dough rim samples
const RMAX=1.95;         // max stretch (R0 units)
const PR_OVEN=1.22, PR_GARDEN=1.32, PR_GIANT=4.2;
const FAV={rabbit:'jam',hedgehog:'cookie',bird:'egg',mouse:'plain'};
const KIND_OF={jam:'rabbit',cookie:'hedgehog',egg:'bird',plain:'mouse',bread:'mouse'};

const G={
  scene:'kitchen',phase:'prep',t:0,idle:0,demo:null,demoDone:0,
  dough:null,food:null,plate:null,carry:null,
  chicks:[],shelf:[],decor:0,cycles:0,
  items:[],parts:[],wig:{},drag:null,
  kit:{x:0,tx:0,lean:0,mood:'idle',mt:0,look:{x:0,y:0},blink:0,arm:0,decoT:0},
  visitors:{},
  found:{},log:[],
  garden:null,party:null,trans:null,
  partyMem:{last:null,count:0,regulars:[]},
  hint:null,
};

function newDough(drop){
  return {x:L.doughX,y:L.doughY,r:new Float32Array(N).fill(1),d:new Float32Array(N),
    wo:new Float32Array(N),wv:new Float32Array(N),fills:[],dents:[],state:'flat',
    pr:0,rot:0,gather:0,gaps:[],sealed:false,pleats:[],touched:false,vy:0,
    drop:drop?0:1,press:null,streak:null,bake:0,brown:0,puff:1,leak:0,leaks:[],
    oven:0,lift:false,grow:0,rolled:0,gx:0,onStand:0,seed:Math.random()*100,id:Math.random()};
}
function remap(o,n){
  const k=n.R0/o.R0;
  const D=G.dough;
  if(D){
    if(D.state==='flat'){D.x=n.doughX;D.y=n.doughY;}
    else if(G.scene==='kitchen'){D.x=n.doughX+(D.x-o.doughX)*k;D.x=clamp(D.x,n.tableL+D.pr*n.R0,n.tableR-D.pr*n.R0);D.y=n.ground-D.pr*n.R0;}
  }
  if(G.food){G.food.x=n.doughX;G.food.y=n.ground-0.55*n.R0;}
  if(G.plate){G.plate.x=n.doughX+(G.plate.x-o.doughX)*k;G.plate.y=n.doughY+(G.plate.y-o.doughY)*k;}
  G.items.length=0;
  G.chicks.forEach((c,i)=>{c.x=n.chickHome.x+i*n.R0*0.5;c.y=n.chickHome.y;});
  G.kit.x=G.kit.tx=n.kitten.x;
  if(G.drag){G.drag=null;}
  G.parts.length=0;
}

// =====================================================================
//  dough model
// =====================================================================
function fIdx(a){return (((a%TAU)+TAU)%TAU)/TAU*N;}
function sampleA(arr,a){const f=fIdx(a),i=Math.floor(f)%N,j=(i+1)%N,t=f-Math.floor(f);return arr[i]*(1-t)+arr[j]*t;}
function edgeAt(D,a){return sampleA(D.r,a)-sampleA(D.d,a);}
function tipAt(D,a){return sampleA(D.r,a)-2*sampleA(D.d,a);}
function meanR(D){let s=0;for(let i=0;i<N;i++)s+=D.r[i]*D.r[i];return Math.sqrt(s/N);}
function anyFold(D){for(let i=0;i<N;i++)if(D.d[i]>0.12)return true;return false;}
function coverage(D){let c=0;for(let i=0;i<N;i++)if(D.r[i]-2*D.d[i]<0.32)c++;return c/N;}
function fillCovered(D,f){return tipAt(D,f.a)<f.rho-0.12||(f.rho<0.4&&coverage(D)>0.7);}
function openRuns(D){
  const open=[];for(let i=0;i<N;i++)open.push(D.r[i]-2*D.d[i]>=0.32);
  const runs=[];if(open.every(v=>v))return [{a:0,w:TAU}];if(!open.some(v=>v))return [];
  let st=0;while(open[st])st=(st+1)%N; // st is closed
  let i=st,cur=null;
  for(let n=0;n<N;n++){const j=(st+n)%N;
    if(open[j]){if(!cur)cur={s:j,c:0};cur.c++;}else if(cur){runs.push(cur);cur=null;}}
  if(cur)runs.push(cur);
  return runs.map(r=>({a:(r.s+(r.c-1)/2)/N*TAU,w:r.c/N*TAU}));
}
function applyGrab(D,g,tipT,aS){
  const delta=g.baseTip-tipT;
  const ext=tipT-sampleA(g.br,g.a0)+2*sampleA(g.bd,g.a0)*0; // beyond original rim
  const rimBase=sampleA(g.br,g.a0);
  for(let j=0;j<N;j++){
    const aj=j/N*TAU;
    let r=g.br[j];
    const e=tipT-rimBase;
    if(e>0&&sampleA(g.bd,g.a0)<0.05){const ws=Math.exp(-sq(angDiff(aj,aS)/0.55));r=Math.min(RMAX,g.br[j]+e*ws*0.95);}
    const wf=clamp(1.4*Math.exp(-sq(angDiff(aj,g.a0)/0.85)),0,1);
    let d=g.bd[j]+(delta/2)*wf;
    d=clamp(d,0,(r+0.14)/2);
    D.r[j]=r;D.d[j]=d;
  }
}
function commitGrab(D,g){
  for(let j=0;j<N;j++){
    const rr0=D.r[j],rc=g.br[j]+(rr0-g.br[j])*0.9;
    D.wo[j]+=rr0-rc;D.r[j]=rc;
    const tip=D.r[j]-2*D.d[j];
    if(D.d[j]>0.04&&tip<0.42)D.d[j]=D.r[j]/2;   // snap closure (adsorption)
  }
  // fill tiny holes
  for(let j=0;j<N;j++){
    const op=k=>D.r[(k+N)%N]-2*D.d[(k+N)%N]>=0.32;
    if(op(j)&&!op(j-1)&&!op(j+1))D.d[j]=D.r[j]/2;
    if(op(j)&&op(j+1)&&!op(j-1)&&!op(j+2)){D.d[j]=D.r[j]/2;D.d[(j+1)%N]=D.r[(j+1)%N]/2;}
  }
}
function gather(D){
  D.state='parcel';D.gather=0;
  D.gaps=openRuns(D);D.sealed=D.gaps.length===0;
  const m=meanR(D);
  D.pr=clamp(0.5*m+0.06*D.fills.length,0.42,1.2);
  D.flatR=m;
  D.fills.forEach(f=>{f.covered=fillCovered(D,f);f.rho=clamp(f.rho/Math.max(m,0.5),0,0.7);});
  D.x0=D.x;D.y0=D.y;
  SFX.fold();
  logFound('wrap',{sealed:D.sealed,gaps:D.gaps.length,pr:+D.pr.toFixed(2)});
}
function counts(fills){const c={s:0,e:0,b:0};fills.forEach(f=>c[f.k]++);return c;}

const PMAX=150;

  if(G.parts.length>=PMAX)G.parts.shift();

function updParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*2;
    if(p.type==='flour'){p.vy+=60*dt;p.vx*=0.96;}
    else if(p.type==='spark'){p.vy+=120*dt;}
    else if(p.type==='jam'){p.vy+=200*dt;}
    else if(p.type==='petal'){p.vx+=Math.sin(G.t*2+p.rot)*20*dt;}
    else if(p.type==='steam'){p.vx*=0.98;p.size+=dt*8;}

  for(const p of G.parts){const a=clamp(p.life/p.max,0,1);

    if(p.type==='petal'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ell(0,0,p.size,p.size*0.55,p.col);ctx.restore();}

}

// pie / parcel drawing (ball).  x,y center px, Rp radius px

    ctx.fillStyle=brown>0.3?'#7a3a20':'#efdcb8';ctx.beginPath();ctx.ellipse(0,0,hr*0.62,hr*0.86,0,0,TAU);ctx.fill();

  if(D.sealed){ell(0,0,Rp*0.12,Rp*0.1,rgb(mixC([232,212,176],[190,120,50],brown)));

// cracked pie food (on table or plate)
function drawFood(F,x,y,sc,onPlate){
  const R=L.R0*sc;
  const Rp=F.pr*F.puff*R;
  const k=easeOut(F.ct*1.4);
  // jam puddle
  if(F.jamR>0){
    const jr=F.jamR*R*easeOut(F.ct*0.8);

      jamBlob(x+R*0.55,y+R*0.25,R*0.12+over*0.7,2);jamBlob(x-R*0.6,y+R*0.22,R*0.08+over*0.5,5);

    }

  if(F.bread){ell(sx,sy-Rp*0.05,Rp*0.7,Rp*0.22,'#fff3d8');}
  if(F.eggs>0)ell(sx+Rp*0.2,sy,Rp*0.35,Rp*0.12,'#fff8e8');

  if(F.jamR>0){const fl=easeOut(F.ct*1.2);ctx.fillStyle='#b5263a';
    ctx.beginPath();ctx.ellipse(sx+Rp*0.1,sy+Rp*0.3*fl,Rp*0.22,Rp*0.32*fl+1,0,0,TAU);ctx.fill();
    ell(sx-Rp*0.3,sy+Rp*0.18*fl,Rp*0.12,Rp*0.2*fl+1,'#b5263a');circ(sx+Rp*0.05,sy+Rp*0.2*fl,Rp*0.05,'rgba(255,200,200,0.7)');}
  // zigzag rim
  ctx.fillStyle='#e8b062';ctx.beginPath();

  ctx.lineTo(sx+Rp*0.98,sy+Rp*0.06);ctx.lineTo(sx-Rp*0.98,sy+Rp*0.06);ctx.fill();
  // lid
  ctx.save();ctx.translate(x+Rp*0.55*k,y-Rp*0.35-Rp*0.45*k);ctx.rotate(0.55*k);
  ctx.fillStyle='#a8622e';ctx.beginPath();ctx.ellipse(0,0,Rp*0.98,Rp*0.85,0,Math.PI,TAU);ctx.fill();
  ctx.fillStyle=rgb(mixC([214,150,72],[226,166,84],0.5));ctx.beginPath();ctx.ellipse(0,-Rp*0.03,Rp*0.94,Rp*0.8,0,Math.PI,TAU);ctx.fill();
  ctx.globalAlpha=0.45;ell(-Rp*0.3,-Rp*0.45,Rp*0.3,Rp*0.16,'#f6c766',-0.4);ctx.globalAlpha=1;
  srand(Math.floor(F.seed*100));for(let i=0;i<8;i++){ctx.globalAlpha=0.5;ell((rnd()-0.5)*Rp*1.4,-rnd()*Rp*0.6,Rp*0.08,Rp*0.05,rnd()<0.5?'#f2be5c':'#9a5426');}ctx.globalAlpha=1;
  ctx.fillStyle='#e8b062';ctx.beginPath();
  for(let i=0;i<=10;i++){const px=-Rp*0.98+i*Rp*0.196,py=(i%2?Rp*0.1:0);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.lineTo(Rp*0.98,-Rp*0.05);ctx.lineTo(-Rp*0.98,-Rp*0.05);ctx.fill();
  (F.leaks||[]).forEach(lk=>{if(lk.amt>0.05)jamBlob(Math.cos(lk.a)*Rp*0.6,-Math.abs(Math.sin(lk.a))*Rp*0.45-Rp*0.1,Rp*(0.08+lk.amt*0.2),lk.a);});

function logFound(k,info){G.found[k]=(G.found[k]||0)+1;G.log.push({k,info,t:+G.t.toFixed(1)});if(G.log.length>200)G.log.shift();}
function makeFood(D){
  const c=counts(D.fills);
  const leakFrac=clamp(D.leak,0,0.7);
  const F={x:D.x,y:D.y,pr:D.pr,puff:D.puff,seed:D.seed,ct:0,leaks:D.leaks.map(l=>({a:l.a+D.rot,amt:l.amt})),
    jamR:0,jamIn:0,cookies:[],eggs:c.e,bread:false,s:c.s,b:c.b,e:c.e,sealed:D.sealed};
  // jam pattern on bear cookies follows where jam can escape
  const gapAngles=D.gaps.map(g=>g.a+D.rot);
  for(let i=0;i<Math.min(3,c.b);i++){
    const share=c.b?Math.floor(c.s/c.b)+(i<c.s%c.b?1:0):0;
    const pat={cheeks:0,streaks:[]};
    if(share>0){
      if(D.sealed)pat.cheeks=Math.min(2,share);
      else{pat.cheeks=share>1?1:0;gapAngles.forEach(a=>pat.streaks.push(a));}
    }
    F.cookies.push({pat,decor:0});
  }
  let jam=c.b>0?Math.max(0,c.s-2*c.b):c.s;
  jam*=(1-leakFrac);
  if(jam>0.05){F.jamR=0.5*Math.sqrt(jam);F.jamIn=1;}
  if(c.s+c.e+c.b===0)F.bread=true;
  F.kind=F.cookies.length?'cookie':(c.s?'jam':(c.e?'egg':'bread'));
  return F;
}

function startKitchenCycle(first){
  G.scene='kitchen';G.phase='prep';G.dough=newDough(!first);G.food=null;G.plate=null;G.carry=null;
  if(!first){SFX.pop();setTimeout(()=>{if(G.dough)flour(G.dough.x,G.dough.y,14,1.5);},0);}
  G.kit.mood='idle';G.kit.tx=L.kitten.x;
  updateVisitors();
}
function updateVisitors(){
  const has={};G.shelf.forEach(it=>{const k=it.kind==='giant'?null:KIND_OF[it.kind];if(k)has[k]=1;});
  if(G.chicks.length)has.bird=1;
  G.partyMem.regulars.forEach(k=>has[k]=1);
  ['rabbit','hedgehog','bird','mouse'].forEach(k=>{if(!G.visitors[k])G.visitors[k]={on:false,a:0,excite:0,look:0};G.visitors[k].on=!!has[k];});
}
function exciteFor(fk){
  const kind={s:'rabbit',b:'hedgehog',e:'bird'}[fk];const v=G.visitors[kind];
  if(v&&v.on){v.excite=1.6;}
  if(fk==='s')G.chicks.forEach(c=>c.hopT=0.8);
}
function suggestedSource(){
  const f=G.found;
  if(!f.jam)return 's';
  if(!f.chick)return 'e';
  if(!f.cookie)return 'b';
  if(!f.cheeks)return 's';  // after bear cookie, kitten looks at strawberries
  // later: look at what visitors want
  const ks=['s','e','b'];return ks[(G.cycles)%3];
}
function bakeStart(D){
  G.phase='bake';D.inOven=true;D.ovenT=0;D.bake=0;D.from={x:D.x,y:D.y};
  SFX.whoosh();G.kit.mood='sniff';G.kit.mt=0;
  logFound('bake',{pr:+D.pr.toFixed(2),sealed:D.sealed,fills:D.fills.map(f=>f.k).join('')});
}
function crackPie(){
  const D=G.dough;
  G.food=makeFood(D);G.food.x=D.x;G.food.y=D.y+D.pr*D.puff*L.R0*0.35;
  G.dough=null;G.phase='cracked';G.phaseT=0;
  SFX.crack();setTimeout(SFX.cheer,120);
  sparkle(G.food.x,G.food.y-L.R0*0.4,16);flour(G.food.x,G.food.y,10,2);
  G.kit.mood='surprise';G.kit.mt=0;
  const F=G.food;

function finishCarry(){

function startGarden(){
  const D=G.dough;
  G.trans={type:'toGarden',t:0,from:{x:D.x,y:D.y}};
  G.garden={camX:0,z:1,standX:10,standUp:0,entryPr:D.pr};
  D.gx=0;D.onStand=0;
  G.scene='toGarden';SFX.big();
  logFound('garden',{pr:+D.pr.toFixed(2)});
}
function gardenZoom(pr){
  const g=G.garden;const endR=Math.min(0.3*L.ch,0.36*L.cw)/L.R0;
  const p=clamp((pr-g.entryPr)/(PR_GIANT-g.entryPr),0,1);
  const sr=lerp(g.entryPr,endR,p);return sr/pr;
}
function startParty(){
  const D=G.dough;const c=counts(D.fills);
  // guests: visitors on window plus friends, ordered by last party seats
  updateVisitors();
  let kinds=['rabbit','hedgehog','bird','mouse'].filter(k=>G.visitors[k]&&G.visitors[k].on);
  const pool=['rabbit','hedgehog','bird','mouse'];
  for(const k of pool){if(kinds.length>=3)break;if(kinds.indexOf(k)<0)kinds.push(k);}
  const last=G.partyMem.last;
  if(last){kinds.sort((a,b)=>{const ia=last.indexOf(a),ib=last.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);});}
  const n=kinds.length;
  // slices from the giant pie contents
  const types=[];if(c.s)types.push('jam');if(c.b)types.push('cookie');if(c.e)types.push('egg');
  const M=n+1;const list=types.slice();
  const w={jam:c.s,cookie:c.b,egg:c.e};
  while(list.length<M){
    if(!types.length||list.length===M-1&&list.indexOf('plain')<0){list.push('plain');continue;}
    let best=types[0],bv=-1;types.forEach(t=>{const v=w[t]/(1+list.filter(x=>x===t).length);if(v>bv){bv=v;best=t;}});list.push(best);
  }
  G.party={guests:kinds.map((k,i)=>({kind:k,seat:i,x:i%2?L.x1+L.R0:L.x0-L.R0,y:0,mood:'n',look:0,hop:0,state:'arrive',t:-i*0.3,cmp:0})),
    plates:new Array(n).fill(null),board:list.map((t,i)=>({type:t,i})),boardN:M,contents:c,t:0,phase:'arrive',stable:0,feastT:0};
  G.party.guests.forEach(g=>{g.y=partyLayout().tableY-L.R0*0.45;});
  logFound('party',{guests:kinds.join(','),slices:list.join(',')});
}
function giveSlice(seat,sl){
  const P=G.party;const old=P.plates[seat];
  if(old){P.board.push({type:old.type,i:sl.i});}
  P.board.splice(P.board.indexOf(sl),1);
  P.plates[seat]={type:sl.type,amt:1};
  const g=P.guests.find(x=>x.seat===seat);
  SFX.pop();
  if(g){g.cmp=0;
    if(FAV[g.kind]===sl.type){g.mood='happy';g.hop=0;g.hopT=0.6;SFX.chime();sparkle(partyLayout().seats[seat].x,partyLayout().plateY,8);}
    else{g.mood='compare';g.cmp=1.4;SFX.hmm();}
  }
  logFound('serve',{to:g&&g.kind,type:sl.type});
}
function trySwap(g){
  const P=G.party;const want=FAV[g.kind];
  const j=P.plates.findIndex((p,i)=>p&&p.type===want&&i!==g.seat);
  if(j<0){g.mood='want';return;}
  const h=P.guests.find(x=>x.seat===j);if(!h||h.state==='walk')return;
  const si=g.seat;g.seat=j;h.seat=si;g.state='walk';h.state='walk';g.mood='happy';
  h.mood=P.plates[si]&&FAV[h.kind]===P.plates[si].type?'happy':'n';
  SFX.swap();
  logFound('swap',{a:g.kind,b:h.kind});
  if(h.mood!=='happy'&&P.plates[si]){h.mood='compare';h.cmp=1.6;}
}
function endParty(){
  const P=G.party;
  const order=P.guests.slice().sort((a,b)=>a.seat-b.seat).map(g=>g.kind);
  G.partyMem.last=order;G.partyMem.count++;
  G.partyMem.regulars=P.guests.filter(g=>g.mood==='happy'||g.mood==='eat').map(g=>g.kind);
  const top=P.contents.s?'jam':P.contents.b?'cookie':P.contents.e?'egg':'plain';
  G.shelf.push({kind:'giant',top,arrive:0});while(G.shelf.length>L.shelf.n)G.shelf.shift();
  logFound('partyEnd',{order:order.join(',')});
  G.dough=null;
  G.trans={type:'toKitchen',t:0};G.scene='toKitchen';
}

function doughEdgePoint(D,a){const e=edgeAt(D,a)*L.R0;return {x:D.x+Math.cos(a)*e,y:D.y+Math.sin(a)*e};}
function mostOpenAngle(D){
  let best=0,bv=-1;const fa=D.fills.length?Math.atan2(D.fills.reduce((s,f)=>s+Math.sin(f.a),0),D.fills.reduce((s,f)=>s+Math.cos(f.a),0)):0;
  for(let j=0;j<N;j++){const a=j/N*TAU,v=D.r[j]-2*D.d[j]-Math.abs(angDiff(a,fa+Math.PI))*0.05+(Math.sin(a)>0.3?0.05:0);if(v>bv){bv=v;best=a;}}
  return best;
}
function computeHint(){
  const D=G.dough,R=L.R0;
  if(G.drag)return G.hint;

    if(G.phase==='prep'&&D&&D.drop>=1){
      if(D.state==='flat'){
        if(!D.fills.length){
          if(!D.touched&&G.cycles===0){const a=-0.5,p=doughEdgePoint(D,a);return {key:'dough',x:p.x,y:p.y,demo:{from:p,to:{x:p.x+R*0.9,y:p.y-R*0.5}}};}
          const k=suggestedSource();const s=L.src.find(s=>s.k===k);return {key:'src:'+k,x:s.x,y:s.y,demo:{from:s,to:{x:D.x,y:D.y}},look:s};
        }
        if(coverage(D)<0.6){const a=mostOpenAngle(D),p=doughEdgePoint(D,a);return {key:'dough',x:p.x,y:p.y,demo:{from:p,to:{x:D.x-Math.cos(a)*R*0.1,y:D.y-Math.sin(a)*R*0.1}}};}
        return {key:'dough',x:D.x,y:D.y,demo:{from:{x:D.x,y:D.y},to:L.ovenMouth}};
      }
      if(D.state==='parcel'&&!D.inOven){
        const rollHint=D.pr>PR_OVEN||(D.rolled>1.2&&!G.found.garden)||(G.cycles>=3&&!G.found.garden&&G.found.cheeks);
        if(rollHint){const y=D.y;return {key:'parcel',x:D.x,y,demo:{from:{x:D.x,y},to:{x:D.x+(D.x<L.doughX?1:-1)*R*1.8,y},roll:true}};}
        return {key:'oven',x:L.ovenMouth.x,y:L.ovenMouth.y,demo:{from:{x:D.x,y:D.y},to:L.ovenMouth}};
      }
    }
    if(G.phase==='baked'&&D)return {key:'pie',x:D.x,y:D.y,demo:{tap:{x:D.x,y:D.y}}};
    if(G.phase==='plate'){
      const ch=G.chicks.find(c=>c.state==='idle');
      const to=ch?{x:ch.x+R*0.5,y:ch.y}:{x:G.food.x+R*1.1,y:G.food.y+R*0.2};
      return {key:'plates',x:L.plates.x,y:L.plates.y,demo:{from:L.plates,to},look:ch?{x:ch.x,y:ch.y}:L.plates};
    }
    return null;
  }
  if(G.scene==='garden'){
    if(G.phase==='roll'&&D){const [x,y]=gToS(D.gx,-D.pr);
      if(D.pr<PR_GIANT)return {key:'parcel',x,y,demo:{from:{x,y},to:{x:x+R*1.8,y},roll:true}};
      const [sx,sy]=gToS(G.garden.standX,-0.5);return {key:'stand',x:sx,y:sy,demo:{from:{x,y},to:{x:sx,y:y}}};}
    if(G.phase==='gbaked'&&D){const [x,y]=gToS(D.gx,-D.pr-0.9);return {key:'pie',x,y,demo:{tap:{x,y}}};}
    return null;
  }
  if(G.scene==='party'&&G.party.phase==='serve'){
    const P=G.party,LY=partyLayout();
    let target=P.guests.find(g=>P.plates[g.seat]==null);
    if(!target)target=P.guests.find(g=>g.mood==='want');
    if(!target||!P.board.length)return null;
    const st=LY.seats[target.seat];
    return {key:'board',x:LY.board.x,y:LY.board.y,demo:{from:{x:LY.board.x,y:LY.board.y-LY.board.r*0.3},to:{x:st.x,y:LY.plateY}}};
  }
  return null;
}
function drawHint(){

function drawHand(){

  if(press){ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-6,18+((G.t*3)%1)*10,0,TAU);ctx.stroke();}

// =====================================================================

function toL(e){return {x:e.clientX/S,y:e.clientY/S};}
function wiggle(key){G.wig[key]=0.3;SFX.tick();}
function hitSrc(p,list){const R=L.R0;for(const s of list){if(hyp(p.x-s.x,p.y-s.y)<R*0.62)return s;}return null;}
function onDown(e){
  e.preventDefault();
  audioInit();
  if(G.drag)return;  // one finger at a time
  const p=toL(e);
  G.idle=0;G.demo=null;
  const d=pick(p);
  if(d){d.id=e.pointerId;d.sx=p.x;d.sy=p.y;d.x=p.x;d.y=p.y;d.moved=0;G.drag=d;try{cv.setPointerCapture(e.pointerId);}catch(_){}}
}
function pick(p){
  const R=L.R0,D=G.dough;
  if(G.scene==='kitchen'){
    // sources
    const s=hitSrc(p,L.src);
    if(s){ if(G.phase==='prep'&&D&&D.drop>=1&&!D.inOven){SFX.pop();return {kind:'fill',k:s.k,src:s,item:{k:s.k,x:p.x,y:p.y}};}
      wiggle('src:'+s.k);return null;}
    if(G.phase==='prep'&&D&&D.drop>=1){
      if(D.state==='flat'){
        const dx=p.x-D.x,dy=p.y-D.y,rho=hyp(dx,dy)/R,a=Math.atan2(dy,dx);
        const e=edgeAt(D,a),t=tipAt(D,a);
        if(rho<e+0.5){
          D.touched=true;
          D.press={x:dx/R,y:dy/R,t:0};SFX.press();flour(p.x,p.y,6,0.8);
          const folded=anyFold(D);
          if(rho>e-0.4||(!folded&&rho>t-0.1&&sampleA(D.d,a)>0.05)){
            return {kind:'edge',a0:a,br:D.r.slice(),bd:D.d.slice(),baseTip:sampleA(D.d,a)>0.05?t:sampleA(D.r,a)};
          }
          if(!folded)for(const f of D.fills){const fx=D.x+Math.cos(f.a)*f.rho*R,fy=D.y+Math.sin(f.a)*f.rho*R;
            if(hyp(p.x-fx,p.y-fy)<R*0.34&&!fillCovered(D,f)){f.held=true;D.press=null;return {kind:'fill',k:f.k,existing:f,item:{k:f.k,x:p.x,y:p.y}};}}
          if(anyFold(D))return {kind:'parcel',ox:0,oy:0,gatherPending:true};
          return {kind:'pull'};
        }
      }else if(D.state==='parcel'&&!D.inOven){
        const Rp=D.pr*R;
        if(hyp(p.x-D.x,p.y-D.y)<Rp+R*0.45){D.squishT=0.25;SFX.press();return {kind:'parcel',ox:p.x-D.x,oy:p.y-D.y};}
      }
    }
    if(G.phase==='baked'&&D&&hyp(p.x-D.x,p.y-D.y)<D.pr*D.puff*R+R*0.5){crackPie();return null;}
    if(hyp(p.x-L.plates.x,p.y-L.plates.y)<R*0.8){
      if(G.phase==='plate'){SFX.tick();return {kind:'plate',item:{x:p.x,y:p.y}};}
      wiggle('plates');return null;}
    if(hyp(p.x-L.ovenMouth.x,p.y-L.ovenMouth.y)<R*1.1){wiggle('oven');if(G.phase==='bake')SFX.sniff();return null;}
    if(hyp(p.x-G.kit.x,p.y-(L.kitten.y-R*0.8))<R*0.6){G.kit.mood=G.kit.mood==='idle'?'happy':G.kit.mood;G.kit.mt=0;SFX.meow();return null;}
    for(const c of G.chicks){if(hyp(p.x-c.x,p.y-c.y)<R*0.4){c.hopT=0.6;SFX.peep();return null;}}
    return null;
  }
  if(G.scene==='garden'){
    const s=hitSrc(p,L.gsrc);
    if(s){if(G.phase==='roll'){SFX.pop();return {kind:'fill',k:s.k,src:s,item:{k:s.k,x:p.x,y:p.y}};}wiggle('gsrc:'+s.k);return null;}
    if(D){const g=G.garden;const [x,y]=gToS(D.gx,-D.pr*D.puff-D.onStand*0.9);const Rp=D.pr*D.puff*g.z*R;
      if(hyp(p.x-x,p.y-y)<Rp+R*0.4){
        if(G.phase==='roll'){D.squishT=0.25;SFX.press();return {kind:'groll',ox:p.x-x};}
        if(G.phase==='gbaked'){startOpening();return null;}
      }}
    return null;
  }
  if(G.scene==='party'&&G.party.phase==='serve'){
    const LY=partyLayout(),B=LY.board,P=G.party;
    if(hyp(p.x-B.x,(p.y-B.y)/0.62)<B.r*1.1&&P.board.length){
      // pick the wedge under the finger, else the first one
      const a=Math.atan2((p.y-B.y)/0.62,p.x-B.x)+Math.PI/2;let idx=Math.floor(((a%TAU+TAU)%TAU)/TAU*P.boardN);
      let sl=P.board.find(s=>s.i===idx)||P.board[0];sl.held=true;SFX.pop();
      return {kind:'slice',sl};
    }
    for(const g of P.guests){if(hyp(p.x-g.x,p.y-g.y)<R*0.6){g.hopT=0.5;SFX.tick();return null;}}
  }
  return null;
}
function onMove(e){
  const d=G.drag;if(!d||e.pointerId!==d.id)return;
  e.preventDefault();
  const p=toL(e);const R=L.R0,D=G.dough;
  const mdx=p.x-d.x,mdy=p.y-d.y;
  d.moved=Math.max(d.moved,hyp(p.x-d.sx,p.y-d.sy));
  d.x=p.x;d.y=p.y;G.idle=0;
  if(d.kind==='edge'||d.kind==='pull'){
    if(d.kind==='pull'){
      if(d.moved<R*0.08)return;
      if(d.a0==null){d.a0=Math.atan2(p.y-d.sy,p.x-d.sx);d.br=D.r.slice();d.bd=D.d.slice();d.baseTip=sampleA(D.r,d.a0);}
    }
    const proj=(p.x-d.sx)*Math.cos(d.a0)+(p.y-d.sy)*Math.sin(d.a0);
    const tipT=Math.max(-0.14,d.baseTip+proj/R);
    const ca=Math.atan2(p.y-D.y,p.x-D.x);
    const aS=hyp(p.x-D.x,p.y-D.y)>R*0.5?ca:d.a0;
    applyGrab(D,d,tipT,aS);
    const ext=tipT-sampleA(d.br,d.a0);
    D.streak={a:aS,amt:clamp(ext,0,1)};
    if(G.t-lastSquish>0.07&&Math.abs(mdx)+Math.abs(mdy)>1.5){lastSquish=G.t;
      if(ext>0)SFX.squish(meanR(D)-1+ext);else SFX.squish(0.2+(d.baseTip-tipT)*0.3);
      flour(p.x,p.y,1,0.5);}
    if(d.baseTip-tipT>0.3&&D.fills.length)G.kit.lean=1;
    return;
  }
  if(d.kind==='fill'){d.item.x=p.x;d.item.y=p.y;
    if(G.scene==='kitchen'&&D&&D.state==='flat'){const near=hyp(p.x-D.x,p.y-D.y)<(meanR(D)+0.5)*R;G.kit.lean=near?0.6:0;}
    return;}
  if(d.kind==='plate'){d.item.x=p.x;d.item.y=p.y;return;}
  if(d.kind==='slice'){return;}
  if(d.kind==='parcel'){
    if(d.gatherPending){if(d.moved<R*0.12)return;d.gatherPending=false;gather(D);
      D.y=L.ground-D.pr*R;d.ox=0;d.oy=0;D.x=clamp(D.x,L.tableL+D.pr*R,L.tableR-D.pr*R);}
    moveParcel(D,p.x-d.ox,p.y-d.oy,mdx);
    return;
  }
  if(d.kind==='groll'){
    const g=G.garden;const dxw=mdx/(g.z*R);
    const maxX=D.pr>=PR_GIANT?g.standX:g.standX-3.4-D.pr;
    const nx=clamp(D.gx+dxw,-7,maxX);const moved=nx-D.gx;D.gx=nx;
    if(Math.abs(moved)>0){D.rot+=moved/D.pr;
      if(D.onStand<0.5){const before=D.pr;D.pr=Math.min(PR_GIANT*1.04,D.pr+Math.abs(moved)*0.055);D.rolled+=Math.abs(moved);
        rollFx(D,Math.abs(moved));
        if(before<PR_GIANT&&D.pr>=PR_GIANT){SFX.big();sparkle(p.x,p.y-R,20);logFound('giant',{pr:+D.pr.toFixed(2)});}}
    }
    return;
  }
}
function rollFx(D,amt){
  D.rollAcc=(D.rollAcc||0)+amt;
  if(D.rollAcc>D.pr*1.4){D.rollAcc=0;SFX.roll();
    if(G.scene==='garden'){const [x,y]=gToS(D.gx,0);flour(x,y,3,1);}else flour(D.x,L.ground,3,1);}
  D.growPulse=0.15;
}
function moveParcel(D,tx,ty,mdx){
  const R=L.R0,Rp=D.pr*R,gy=L.ground-Rp;
  const ny=Math.min(gy,ty);
  const grounded=ny>=gy-R*0.15;
  let nx;

function onUp(e){

  if(d.kind==='edge'||d.kind==='pull'){
    if(D.press)D.press=null;
    if(d.moved<R*0.08||d.a0==null){ // tap: dent + spread a bit
      if(D.state==='flat'){D.dents.push({x:(d.sx-D.x)/R,y:(d.sy-D.y)/R,age:0});if(D.dents.length>8)D.dents.shift();
        for(let j=0;j<N;j++){const o=D.r[j];D.r[j]=Math.min(RMAX,D.r[j]*1.03+0.01);D.wo[j]+=0.02;}SFX.squish(0.1);flour(d.sx,d.sy,8,1);}
    }else{
      const before=coverage(D);
      commitGrab(D,d);D.streak=null;
      const folded=d.baseTip-(Math.max(-0.14,d.baseTip+((d.x-d.sx)*Math.cos(d.a0)+(d.y-d.sy)*Math.sin(d.a0))/R));
      if(folded>0.25){D.pleats.push(d.a0);SFX.fold();if(coverage(D)>=0.999&&before<0.999){SFX.chime();sparkle(D.x,D.y,10);}}
      else{for(let j=0;j<N;j++)D.wv[j]+=0.6;}
    }
    G.kit.lean=0;
    return;
  }
  if(d.kind==='fill'){
    G.kit.lean=0;
    const it=d.item;
    if(G.scene==='kitchen'&&D&&G.phase==='prep'){
      if(D.state==='flat'){
        const dx=it.x-D.x,dy=it.y-D.y,rho=hyp(dx,dy)/R,a=Math.atan2(dy,dx),e=edgeAt(D,a);
        if(rho<e+0.65){

          if(D.fills.length<5){
            D.fills.push({k:d.k,a,rho:clamp(Math.min(rho,e-0.35),0,1.5),pop:0});relaxFills(D);SFX.pop();exciteFor(d.k);
            flour(it.x,it.y,5,1);logFound('place',{k:d.k});return;}
        }

      }

      if(hyp(it.x-x,it.y-y)<Rp+R*0.7&&D.fills.length<14){tuck(D,d.k,Math.atan2(it.y-y,it.x-x));return;}
    }

  }

      const dd=Math.min(hyp(p.x-s.x,p.y-LY.plateY),hyp(p.x-s.x,p.y-gy));if(dd<bd){bd=dd;best=i;}});
    if(best>=0&&P.phase==='serve'){giveSlice(best,d.sl);}else SFX.tick();
    return;
  }
  if(d.kind==='parcel'){
    if(d.gatherPending){ // tap on folded dough interior → dent
      D.press=null;D.dents.push({x:(d.sx-D.x)/R,y:(d.sy-D.y)/R,age:0});SFX.squish(0.1);return;}
    D.lift=false;
    const m=L.ovenMouth;
    if(hyp(D.x-m.x,D.y-m.y)<R*1.5){
      if(D.pr<=PR_OVEN){bakeStart(D);return;}
      wiggle('oven');SFX.hmm();

    return;
  }
  if(d.kind==='groll'){
    const g=G.garden;
    if(D.pr>=PR_GIANT&&Math.abs(D.gx-g.standX)<3.4){D.gx=g.standX;G.phase='gbakeIn';G.phaseT=0;SFX.whoosh();}

  }
}
function relaxFills(D){
  for(let it=0;it<6;it++)for(let i=0;i<D.fills.length;i++)for(let j=i+1;j<D.fills.length;j++){
    const a=D.fills[i],b=D.fills[j];let ax=Math.cos(a.a)*a.rho,ay=Math.sin(a.a)*a.rho,bx=Math.cos(b.a)*b.rho,by=Math.sin(b.a)*b.rho;
    let dx=bx-ax,dy=by-ay,dd=hyp(dx,dy);if(dd<0.42){if(dd<0.01){dx=1;dy=0;dd=1;}const push=(0.42-dd)/2;
      ax-=dx/dd*push;ay-=dy/dd*push;bx+=dx/dd*push;by+=dy/dd*push;
      a.a=Math.atan2(ay,ax);a.rho=hyp(ax,ay);b.a=Math.atan2(by,bx);b.rho=hyp(bx,by);}}
}

      const F=P.food;if(F.jamR>0.62){logFound('overflow',{jamR:+F.jamR.toFixed(2)});}
      C.stage='wait';C.t=0;
      if(C.who==='chick'){const c=G.chicks.find(c=>c.state==='idle');if(c){c.state='walk';c.tx=P.x-R*0.5;c.ty=P.y+R*0.2;
        c.onArrive=()=>{c.plateHeld=true;G.carry=null;c.state='walk';const sl=shelfSlot(Math.min(G.shelf.length,L.shelf.n-1));
          c.tx=clamp(sl.x,L.tableL,L.tableR);c.ty=L.tableTop+R*0.2;c.onArrive=()=>{c.state='lift';c.t=0;};};}else C.who='kitten';}
    }
  }else if(C.stage==='wait'){
    if(C.who==='kitten'&&C.t>0.7){C.stage='up';C.t=0;C.from={x:P.x,y:P.y};G.kit.tx=P.x;G.kit.mood='happy';G.kit.mt=0;}
  }else if(C.stage==='up'){
    const sl=shelfSlot(Math.min(G.shelf.length,L.shelf.n-1));const k=easeOut(C.t*1.4);
    P.x=lerp(C.from.x,sl.x,k);P.y=lerp(C.from.y,sl.y,k)-Math.sin(k*Math.PI)*R;P.sc=lerp(1,0.5,k);
    if(C.t>=0.72){finishCarry();}
  }
}
function updParty(dt){
  const P=G.party,LY=partyLayout(),R=L.R0;
  P.t+=dt;
  P.guests.forEach(g=>{
    g.t+=dt;const s=LY.seats[g.seat];const ty=LY.tableY-R*0.45;
    if(g.hopT>0){g.hopT-=dt;g.hop=Math.abs(Math.sin(g.hopT*12))*R*0.15;}else g.hop=0;
    if(g.state==='arrive'||g.state==='walk'){
      if(g.t<0)return;
      const dx=s.x-g.x,d=Math.abs(dx),sp=R*3.2*dt;
      if(d<sp){g.x=s.x;g.state='sit';if(g.mood==='happy'){g.hopT=0.6;sparkle(g.x,LY.plateY,6);SFX.chime();}}
      else{g.x+=Math.sign(dx)*sp;g.hop=Math.abs(Math.sin(g.t*12))*R*0.1;g.y=ty-R*0.25;}
    }else{g.y+=(ty-g.y)*dt*6;}
    if(g.mood==='compare'){g.cmp-=dt;g.look=Math.sin(g.t*5);if(g.cmp<=0){g.look=0;trySwap(g);}}
    else if(g.mood==='want'){const fav=FAV[g.kind];g.look=P.board.some(b=>b.type===fav)?0:Math.sin(g.t*2)*0.5;
      // someone else may now hold what this one wants
      if(P.plates.some((p,i)=>p&&p.type===fav&&i!==g.seat)){g.mood='compare';g.cmp=1.0;}}
    else if(g.state==='sit'&&g.mood!=='eat'){g.look=(L.cx-g.x)/L.cw;}
  });
  if(P.phase==='arrive'){if(P.guests.every(g=>g.state==='sit')){P.phase='serve';SFX.chime();}}
  else if(P.phase==='serve'){
    const full=P.plates.every(p=>p);const calm=P.guests.every(g=>g.state==='sit'&&g.mood!=='compare');
    const allHappy=P.guests.every(g=>g.mood==='happy');
    if(full&&calm&&(allHappy||!P.board.some(b=>P.guests.some(g=>g.mood==='want'&&FAV[g.kind]===b.type))))P.stable+=dt;else P.stable=0;
    if(P.stable>1.4){P.phase='feast';P.feastT=0;SFX.fanfare();petals(30);P.guests.forEach(g=>{g.mood='eat';});logFound('feast',{});}
  }else if(P.phase==='feast'){
    P.feastT+=dt;P.plates.forEach(p=>{if(p)p.amt=Math.max(0,1-P.feastT/2.4);});
    if(P.feastT>2.6&&!P.cheer){P.cheer=1;P.guests.forEach(g=>{g.mood='happy';g.hopT=1;});SFX.cheer();petals(20);}
    if(P.feastT>4.6){P.phase='bye';endParty();}
  }
}

// =====================================================================
//  render
// =====================================================================
function render(){
  ctx.setTransform(DPR*S,0,0,DPR*S,0,0);
  if(!bgCanvas)buildBg();
  const R=L.R0,D=G.dough;
  if(G.scene==='kitchen'){
    drawKitchen(0);
    drawKitchenDynamic(0);
  }else if(G.scene==='toGarden'){
    const k=ease(G.trans.t);
    drawGarden(VW*(1-k));
    drawKitchen(-VW*k);
    // the parcel travels with the board
    const tx=G.trans.from.x-VW*k*0.0;
    const [gx,gy]=gToS(0,-D.pr);
    const x=lerp(G.trans.from.x,gx,k),y=lerp(G.trans.from.y,gy,k);
    drawTableMoving(x,k);
    drawParcel(D,x,y,D.pr*R);
  }else if(G.scene==='garden'){
    drawGarden(0);
    if(G.phase==='opening')drawOpening();
  }else if(G.scene==='party'){
    drawParty(1);
  }else if(G.scene==='toKitchen'){
    const k=ease(G.trans.t);
    drawParty(1);
    ctx.save();ctx.beginPath();ctx.arc(L.cx,L.y0+L.ch*0.5,Math.max(VW,VH)*k*0.8,0,TAU);ctx.clip();
    drawKitchen(0);drawKitchenDynamic(0);ctx.restore();
  }
  drawParts();
  drawHint();
  drawHand();
  // matte gouache grain
  ctx.globalAlpha=0.55;ctx.fillStyle=grainPat;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;
}
function drawTableMoving(x,k){
  const R=L.R0;ctx.fillStyle='#c99a6b';rr(ctx,x-R*1.8,L.ground*(1-k)+L.gGround*k-R*0.08,R*3.6,R*0.2,R*0.05);ctx.fill();
}
function drawOpening(){
  const D=G.dough,g=G.garden,R=L.R0,t=G.phaseT/2.2;
  const [x,y]=gToS(D.gx,-D.pr*D.puff-0.9);const Rp=D.pr*D.puff*g.z*R;
  const zoom=1+ease(t)*2.5;const k=ease(t*1.5);
  ctx.save();ctx.translate(x,y);ctx.scale(zoom,zoom);
  // inner light
  const gl=ctx.createRadialGradient(0,0,Rp*0.1,0,0,Rp*1.2);gl.addColorStop(0,'rgba(255,250,220,1)');gl.addColorStop(1,'rgba(255,220,150,0.6)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,Rp*0.95,0,TAU);ctx.fill();
  // halves
  [-1,1].forEach(s=>{ctx.save();ctx.translate(s*Rp*k*0.9,-Rp*k*0.3);ctx.rotate(s*k*0.5);
    ctx.beginPath();ctx.arc(0,0,Rp,s<0?Math.PI*0.5:-Math.PI*0.5,s<0?Math.PI*1.5:Math.PI*0.5);ctx.closePath();
    ctx.fillStyle='#d9964a';ctx.fill();ctx.fillStyle='#e8b062';ctx.beginPath();ctx.arc(-s*Rp*0.3,-Rp*0.4,Rp*0.25,0,TAU);ctx.fill();
    ctx.restore();});
  ctx.restore();
  ctx.globalAlpha=clamp((t-0.55)*2.5,0,1);if(ctx.globalAlpha>0){drawParty(ctx.globalAlpha);}ctx.globalAlpha=1;
}
function drawKitchenDynamic(dx){
  const R=L.R0,D=G.dough;
  // jam stain/food on table
  if(G.food&&!(G.plate&&G.plate.food===G.food))drawFood(G.food,G.food.x,G.food.y,1,false);
  if(G.plate){const P=G.plate;const sc=P.sc||1;
    if(P.food){drawPlate(P.x,P.y+R*0.25*sc,R*0.9*sc);drawFood(P.food,P.x,P.y,sc,true);}
    else drawPlate(P.x,P.y,R*0.9*sc);}
  // dough / parcel
  if(D){
    if(D.state==='flat')drawFlat(D);
    else if(!(D.inOven&&D.ovenT>=1)){
      const g=easeOut(D.gather);let Rp=lerp(D.flatR||1,D.pr,g)*D.puff*R;if(D.inOven)Rp=lerp(Rp,ovenRp(D),easeOut(D.ovenT));
      const sq=(D.squishT>0?Math.sin(D.squishT*30)*0.06:0)+(D.growPulse>0?0.03:0);
      const hl=G.hint&&(G.hint.key==='parcel'||G.hint.key==='pie')?Math.abs(Math.sin(G.t*4))*R*0.04:0;
      drawParcel(D,D.x,D.y-hl,Rp,{squash:sq});
    }
    if(G.hint&&G.hint.key==='dough'&&D.state==='flat'){const h=G.hint;const b=Math.abs(Math.sin(G.t*5));
      ctx.globalAlpha=0.3+b*0.4;circ(h.x,h.y,R*(0.12+b*0.05),'#fff6d0');ctx.globalAlpha=1;}
  }
  // chicks
  G.chicks.forEach(c=>{drawChick(c,c.x,c.y,R/100*1.0);});
  // sources (front)
  L.src.forEach(s=>drawSource(s,G.hint&&G.hint.key==='src:'+s.k,G.wig['src:'+s.k]));
  // flying / held items
  G.items.forEach(it=>drawFill(it.k,it.x,it.y,R/100*1.15));
  if(G.drag&&G.drag.kind==='fill'){const it=G.drag.item;ell(it.x,it.y+R*0.35,R*0.2,R*0.06,'rgba(60,40,20,0.2)');drawFill(it.k,it.x,it.y-R*0.15,R/100*1.3);}
  if(G.drag&&G.drag.kind==='plate'){const it=G.drag.item;drawPlate(it.x,it.y,R*0.75);}
}
function drawGardenHeld(){
  if(G.drag&&G.drag.kind==='fill'){const it=G.drag.item,R=L.R0;drawFill(it.k,it.x,it.y-R*0.15,R/100*1.3);}
  G.items.forEach(it=>drawFill(it.k,it.x,it.y,L.R0/100*1.15));
}

// =====================================================================
//  main loop
// =====================================================================
let last=0,raf=0,running=false;
function frame(ts){
  raf=0;if(!running)return;
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;
  try{update(dt);render();if(G.scene==='garden')drawGardenHeld();}catch(err){console.warn(err);}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(G.drag)onCancel({pointerId:G.drag.id});try{AC&&AC.state==='running'&&AC.suspend();}catch(_){}}
  else{start();try{AC&&AC.state==='suspended'&&AC.resume();}catch(_){}}
});
let rzT=0;
function onResize(){buildLayout();}
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,60);});
window.addEventListener('orientationchange',()=>{setTimeout(onResize,200);});

makeGrain();buildLayout();
G.kit.x=G.kit.tx=L.kitten.x;G.kit.look={x:L.doughX,y:L.doughY};
startKitchenCycle(true);
updateVisitors();
// test/debug hook (no UI)
window.__gf={G,get L(){return L;},get S(){return S;},gToS,partyLayout,shelfSlot,counts,PR:{PR_OVEN,PR_GARDEN,PR_GIANT}};
if(!document.hidden)start();
})();
</script>
