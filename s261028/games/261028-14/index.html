<script>
/*
 もぐらとほたるの、あえた！すごろく  (games/261028-14)
 ----------------------------------------------------------------
 盤面: 12マスの馬蹄形の道 (0=もぐらの家/昼の端, 11=ほたるの家/夜の端)。
   夕焼けマス s (1..10)。 i<s 昼 / i==s 夕焼け / i>s 夜。
 操作: 太陽 → s+1 (昼が伸びる) → もぐらが s の方向へ1〜3マス跳ぶ。
       月   → s-1 (夜が伸びる) → ほたるが s の方向へ1〜3マス跳ぶ。
   途中のマスも判定。端は折り返し。音楽会の後は鳥の枝道で 11→枝道→0 が輪になる。
 発見:
   1 大根   : 太陽の手番でもぐらが「昼の畑」を通過 → 大根が飛び出し、夕焼けマスへ運ばれる
   2 ランタン: 大根のマスが夜になる → ほたるが潜って光る → タップ/ドラッグでコマに渡す
   3 飛び石 : 月の手番でほたるが「夜の池」を通過 → 波紋。 夕焼けが池に来る → 飛び石 → アヒルが渡る
   4 橋     : もぐら(昼側)とほたる(夜側)が夕焼けを挟んで隣り合う → 橋。 新しい場所で再会 → 延長
   5 合唱   : 直前と違うさいころで鐘のマスを夕焼けにする → 鐘+歌。住人が楽器を持って集まる
   6 宝箱   : ランタンが井戸から1マス以内にある時、井戸が夕焼け → もぐらが掘る → 宝石 → 舞台へ
   7 音楽会 : 橋 + 合唱 (前回の音楽会以降に再会と合唱) → 島が開いて音楽会 → 鳥が枝道へ引っ越す
 状態は純粋関数 step(state, die, roll) で更新し、演出はイベント列を再生する。
*/
'use strict';
(() => {
// ================================================================ utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const E = {
  lin: t => t,
  outQ: t => 1 - (1 - t) * (1 - t),
  outC: t => 1 - Math.pow(1 - t, 3),
  inQ: t => t * t,
  ioS: t => -(Math.cos(Math.PI * t) - 1) / 2,
  ioC: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outB: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outEl: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
};
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const QS = location.search || '';
const TEST = /[?&]test\b/.test(QS);
const qsNum = (k) => { const m = QS.match(new RegExp('[?&]' + k + '=(\\d+)')); return m ? +m[1] : null; };

// ================================================================ save
const DISC_KEYS = ['radish', 'lantern', 'stones', 'bridge', 'chorus', 'treasure', 'concert'];
const SAVE_KEY = 'mogura-hotaru-sugoroku-261028-14';
const Store = {
  ok: true, mem: null,
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { this.ok = false; return this.mem; }
    if (!raw) return null;
    try {
      const d = sanitize(JSON.parse(raw));
      if (!d) this.clear();
      return d;
    } catch (e) { this.clear(); return null; }
  },
  save(d) {
    this.mem = d;
    if (!this.ok) return;
    try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { this.ok = false; }
  },
  clear() { try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage refused */ } },
};
function sanitize(d) {
  if (!d || typeof d !== 'object' || d.v !== 1) return null;
  const int = (x, a, b) => (Number.isFinite(x) ? clamp(Math.round(x), a, b) : a);
  const num = (x, a, b) => (Number.isFinite(x) ? clamp(x, a, b) : 0);
  const out = { v: 1 };
  out.bridge = int(d.bridge, 0, 3);
  let dirs = Array.isArray(d.bridgeDirs) ? d.bridgeDirs.filter(x => x === 'N' || x === 'W' || x === 'E') : [];
  if (dirs.length !== out.bridge || dirs[0] !== 'N' || new Set(dirs).size !== dirs.length) dirs = ['N', 'W', 'E'].slice(0, out.bridge);
  out.bridgeDirs = dirs;
  out.stones = Array.isArray(d.stones)
    ? d.stones.filter(s => s && Number.isFinite(s.u) && Number.isFinite(s.v)).slice(0, 5).map(s => ({ u: num(s.u, -0.75, 0.75), v: num(s.v, -0.75, 0.75) }))
    : [];
  const lan = Array.isArray(d.lanterns) ? d.lanterns.filter(h => h === 'mole' || h === 'fly' || h === 'stage').slice(0, 3) : [];
  const seen = {};
  out.lanterns = lan.map(h => { if (h !== 'stage' && seen[h]) return 'stage'; seen[h] = 1; return h; });
  out.gems = int(d.gems, 0, 15);
  out.bellAwake = !!d.bellAwake;
  out.birdsMoved = !!d.birdsMoved;
  out.birdPair = !!d.birdPair;
  out.shortcut = !!d.shortcut;
  out.concerts = int(d.concerts, 0, 9999);
  out.duckTrips = int(d.duckTrips, 0, 99999);
  out.visits = int(d.visits, 0, 99999);
  out.disc = {};
  for (const k of DISC_KEYS) out.disc[k] = !!(d.disc && d.disc[k]);
  return out;
}

// ================================================================ world geometry (world units)
const CONTENT = { x: 104, y: 22, w: 792, h: 892 };
const PATH = { cx: 500, cy: 588, rx: 318, ry: 256, a0: 215, span: 250 };
const WOB = [0, 10, -8, 9, -6, 3, -3, 6, -9, 8, -10, 0];
const TS = 98;           // tile size
const BTS = 80;          // bird-road tile size
const RING = 16;         // 12 path tiles + 4 bird-road tiles (when the loop is open)
const GEO = {
  tiles: [], center: { x: 500, y: 588 },
  stage: { x: 500, y: 600, r: 58 },
  tree: { x: 500, y: 462 },
  islets: { N: { x: 500, y: 96, r: 66 }, W: { x: 212, y: 160, r: 60 }, E: { x: 788, y: 160, r: 60 } },
  bridgeRoot: { x: 500, y: 268 },
  houses: [{ x: 372, y: 706, k: 'rabbit' }, { x: 628, y: 706, k: 'frog' }, { x: 500, y: 742, k: 'hedgehog' }],
};
(function buildGeo() {
  for (let i = 0; i < 12; i++) {
    const a = ((PATH.a0 - (i * PATH.span) / 11) * Math.PI) / 180;
    const w = WOB[i];
    const x = PATH.cx + (PATH.rx + w) * Math.cos(a);
    const y = PATH.cy - (PATH.ry + w * 0.8) * Math.sin(a);
    let tx = PATH.rx * Math.sin(a), ty = PATH.ry * Math.cos(a);
    const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
    let nx = GEO.center.x - x, ny = GEO.center.y - 10 - y;
    const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    GEO.tiles.push({ i, x, y, ang: Math.atan2(ty, tx), tx, ty, nx, ny, size: TS, bird: false });
  }
  // the bird road: 11 -> 12 -> 13 -> 14 -> 15 -> 0
  const bp = [[676, 806], [560, 838], [440, 838], [324, 806]];
  for (let k = 0; k < 4; k++) {
    const [x, y] = bp[k];
    const prev = k === 0 ? GEO.tiles[11] : { x: bp[k - 1][0], y: bp[k - 1][1] };
    const next = k === 3 ? GEO.tiles[0] : { x: bp[k + 1][0], y: bp[k + 1][1] };
    let tx = next.x - prev.x, ty = next.y - prev.y; const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
    GEO.tiles.push({ i: 12 + k, x, y, ang: Math.atan2(ty, tx), tx, ty, nx: -ty, ny: tx, size: BTS, bird: true });
  }
})();
const tileXY = (p) => GEO.tiles[p];
const annex = (i, d) => { const t = GEO.tiles[i]; return { x: t.x + t.nx * d, y: t.y + t.ny * d }; };
// pond frame: origin = pond centre, u = inward (toward plaza), v = along the path
function pondFrame(i) {
  const t = GEO.tiles[i];
  const c = annex(i, 118);
  return { x: c.x, y: c.y, ux: t.nx, uy: t.ny, vx: t.tx, vy: t.ty, ru: 46, rv: 74 };
}
const pondPt = (pf, u, v) => ({ x: pf.x + pf.ux * u * pf.ru + pf.vx * v * pf.rv, y: pf.y + pf.uy * u * pf.ru + pf.vy * v * pf.rv });

// ================================================================ audio (all synthesized with Web Audio)
const Snd = (() => {
  let ctx = null, master = null, dry = null, wet = null, noiseBuf = null, unlocked = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function impulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { ctx = null; return false; }
    try {
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.25;
      master = ctx.createGain(); master.gain.value = 0.0001;
      master.connect(comp); comp.connect(ctx.destination);
      dry = ctx.createGain(); dry.connect(master);
      const conv = ctx.createConvolver(); conv.buffer = impulse(1.5, 2.8);
      wet = ctx.createGain(); wet.gain.value = 0.25; wet.connect(conv); conv.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; return false; }
    return true;
  }
  function unlock() {
    if (!init()) return;
    try {
      if (ctx.state !== 'running') { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
      if (!unlocked) {
        const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
        s.buffer = b; s.connect(ctx.destination); s.start(0);
        unlocked = true;
        master.gain.setValueAtTime(0.0001, ctx.currentTime);
        master.gain.exponentialRampToValueAtTime(0.62, ctx.currentTime + 0.35);
      }
    } catch (e) { /* audio is optional */ }
  }
  function suspend() { try { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); } catch (e) {} }
  function resume() { try { if (ctx && unlocked && ctx.state !== 'running') ctx.resume().catch(() => {}); } catch (e) {} }
  const ok = () => !!(ctx && unlocked && ctx.state === 'running');
  const T = () => ctx.currentTime;

  // ---- primitives
  function voice(o) {
    const t0 = T() + (o.t || 0), a = o.a || 0.004, h = o.h || 0, d = o.d || 0.3, vol = o.vol == null ? 0.15 : o.vol;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.f2), t0 + (o.glide || a + d * 0.6));
    if (o.det) osc.detune.setValueAtTime(o.det, t0);
    if (o.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vibF || 5.5; lg.gain.value = o.vib;
      l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + a + h + d + 0.1);
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + a);
    if (h) g.gain.setValueAtTime(vol, t0 + a + h);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + h + d);
    let node = osc;
    if (o.filt) {
      const f = ctx.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.value = o.filt; f.Q.value = o.q || 0.7;
      osc.connect(f); node = f;
    }
    node.connect(g);
    let out = g;
    if (o.pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); out = p; }
    out.connect(dry);
    if (o.rev) { const s = ctx.createGain(); s.gain.value = o.rev; out.connect(s); s.connect(wet); }
    osc.start(t0); osc.stop(t0 + a + h + d + 0.08);
  }
  function noise(o) {
    const t0 = T() + (o.t || 0), a = o.a || 0.003, d = o.d || 0.2;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f || 1200, t0);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + a + d);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(o.vol || 0.08, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    src.connect(f); f.connect(g); g.connect(dry);
    if (o.rev) { const s = ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(wet); }
    src.start(t0, Math.random() * 0.4); src.stop(t0 + a + d + 0.05);
  }
  const safe = fn => (...args) => { if (!ok()) return; try { fn(...args); } catch (e) { /* never break the game for sound */ } };

  // ---- instruments
  function ceramicRaw(f, t, vol, pan) {
    voice({ f, t, d: 0.22, vol, pan, rev: 0.25 });
    voice({ f: f * 2.76, t, d: 0.1, vol: vol * 0.45, pan });
    voice({ f: f * 5.4, t, d: 0.05, vol: vol * 0.22, pan });
    noise({ t, d: 0.025, vol: vol * 0.35, f: 3200, q: 1.5 });
  }
  function bellRaw(f, t, vol, d) {
    const t0 = T() + t, car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
    car.frequency.value = f; mod.frequency.value = f * 3.5;
    mg.gain.setValueAtTime(f * 2.2, t0); mg.gain.exponentialRampToValueAtTime(f * 0.05, t0 + d);
    mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    car.connect(g); g.connect(dry);
    const s = ctx.createGain(); s.gain.value = 0.5; g.connect(s); s.connect(wet);
    car.start(t0); mod.start(t0); car.stop(t0 + d + 0.05); mod.stop(t0 + d + 0.05);
  }
  const SCALES = { day: [0, 2, 4, 7, 9], dusk: [0, 4, 6, 7, 11], night: [0, 3, 5, 7, 10], dawn: [0, 2, 5, 7, 9] };
  const BASE = { day: 72, dusk: 69, night: 64, dawn: 74 };
  function degree(time, step) {
    const sc = SCALES[time] || SCALES.day, n = sc.length;
    const oct = Math.floor(step / n), deg = ((step % n) + n) % n;
    return mtof(BASE[time] + sc[deg] + 12 * clamp(oct, -1, 2));
  }
  const api = {
    unlock, suspend, resume, ok, mtof, degree,
    diePress: safe((die) => {
      if (die === 'sun') { ceramicRaw(784, 0, 0.16, -0.3); voice({ f: 1175, t: 0.03, d: 0.12, vol: 0.05, pan: -0.3 }); }
      else { ceramicRaw(587, 0, 0.15, 0.3); voice({ f: 880, t: 0.04, d: 0.18, vol: 0.05, pan: 0.3, rev: 0.4 }); }
    }),
    hop: safe((f, terrain, pan) => {
      voice({ f: f * 0.75, f2: f, glide: 0.05, d: 0.16, vol: 0.12, pan, rev: 0.2 });
      voice({ f: f * 2, d: 0.08, vol: 0.03, pan });
      if (terrain === 'water') voice({ f: f * 1.5, f2: f * 0.6, t: 0.03, d: 0.14, vol: 0.06, pan });
      else if (terrain === 'field') voice({ f: f * 0.5, type: 'triangle', filt: 900, d: 0.1, vol: 0.06, pan });
      else if (terrain === 'bell') bellRaw(f * 2, 0.02, 0.03, 0.5);
      else if (terrain === 'well') voice({ f, t: 0.16, d: 0.2, vol: 0.03, pan, rev: 0.8 });
    }),
    land: safe((pan) => { for (let k = 0; k < 3; k++) voice({ f: rand(2100, 3300), t: 0.02 + k * 0.035, d: 0.08, vol: 0.022, pan, rev: 0.3 }); }),
    flip: safe(() => { noise({ d: 0.05, vol: 0.06, f: 1800, q: 2 }); voice({ f: 330, f2: 250, d: 0.07, vol: 0.06 }); }),
    thud: safe(() => { voice({ f: 140, f2: 90, d: 0.12, vol: 0.12 }); noise({ d: 0.08, vol: 0.04, f: 500 }); }),
    tick: safe((f, pan) => { ceramicRaw(f || 1200, 0, 0.05, pan); }),
    pop: safe(() => {
      voice({ f: 170, f2: 560, glide: 0.07, d: 0.1, vol: 0.2 });
      voice({ f: 560, f2: 280, t: 0.08, d: 0.16, vol: 0.12 });
      noise({ d: 0.09, vol: 0.08, f: 700, f2: 300 });
      for (let k = 0; k < 4; k++) voice({ f: 1300 + k * 260, t: 0.12 + k * 0.04, d: 0.1, vol: 0.03, rev: 0.4 });
    }),
    boing: safe(() => { voice({ f: 220, f2: 330, glide: 0.12, d: 0.3, vol: 0.08, type: 'triangle', vib: 30, vibF: 12 }); }),
    chime: safe((f, t, vol) => { const v = vol || 0.06; voice({ f, t: t || 0, d: 1.2, vol: v, rev: 0.7 }); voice({ f: f * 2.01, t: t || 0, d: 0.6, vol: v * 0.4, rev: 0.7 }); voice({ f: f * 3.02, t: t || 0, d: 0.3, vol: v * 0.2 }); }),
    glow: safe(() => { [0, 4, 7, 12, 16].forEach((s, k) => voice({ f: mtof(76 + s), t: k * 0.07, d: 0.9, vol: 0.045, rev: 0.8 })); }),
    ripple: safe(() => { voice({ f: 760, f2: 300, d: 0.18, vol: 0.09, rev: 0.5 }); voice({ f: 980, f2: 520, t: 0.09, d: 0.14, vol: 0.05, rev: 0.5 }); }),
    stone: safe((k) => { ceramicRaw(392 + (k || 0) * 60, 0, 0.1, 0); voice({ f: 120, f2: 80, d: 0.1, vol: 0.08 }); }),
    bridge: safe((k) => { const f = degree('day', k); voice({ f, d: 0.5, vol: 0.06, rev: 0.6, type: 'triangle', filt: 2600 }); voice({ f: f * 2, d: 0.25, vol: 0.025, rev: 0.6 }); }),
    bell: safe((f, vol, d) => bellRaw(f, 0, vol || 0.08, d || 2.2)),
    sing: safe((f, d, t) => {
      voice({ f, t: t || 0, a: 0.12, h: d * 0.6, d: d * 0.5, vol: 0.05, vib: 5, vibF: 5.5, rev: 0.7 });
      voice({ f: f * 2, t: t || 0, a: 0.15, h: d * 0.5, d: d * 0.4, vol: 0.012, type: 'triangle', filt: 1800, rev: 0.6 });
    }),

function targetScreen() {
  if (G.target === 'sun' || G.target === 'moon') return VIEW.dice[G.target];
  if (G.target === 'lantern') { const p = lanternPos(G.targetLantern); return worldToScreen(p.x, p.y); }
  return null;
}
function startHandDemo() {
  const q = targetScreen();
  if (!q) return;
  G.demoDone = true;
  const tx = q.x + 6, ty = q.y + 10, h = { x: tx + 90, y: ty + 120, a: 0, s: clamp(VIEW.dieSize / 105, 0.9, 1.9) };
  G.hand = h;
  run(async () => {
    await tween(600, (k) => { h.a = k; h.x = lerp(tx + 90, tx, k); h.y = lerp(ty + 120, ty, k); }, E.outC);
    await tween(170, (k) => { h.y = ty + k * 8; h.s *= 0.995; });
    if (G.hand === h) {
      if (G.target === 'sun' || G.target === 'moon') { V.dice[G.target].sq = 0.86; V.dice[G.target].glow = 1; }
      Snd.tick(700);
    }
    await tween(240, (k) => { h.y = ty + 8 - k * 14; });
    await wait(350);
    await tween(450, (k) => { h.a = 1 - k; });
    if (G.hand === h) G.hand = null;
  });
}
function updateGuidance(dt) {
  if (!G.busy) G.idle += dt;
  if (G.idle > 10000 && !G.demoDone && !G.concert && !G.busy && !G.drag) startHandDemo();
}

// ================================================================ overlays (hand-holding light, hints)
function drawOverlays(c) {
  const st = G.st;
  if (st.radish && V.radish && V.radish.st === 'placed' && tileTime(st.radish.t) !== 'night') {
    const t = tileXY(st.radish.t), ph = 0.5 + 0.5 * Math.sin(Clock.t / 420), dir = st.loop ? 1 : 1;
    c.save(); c.translate(t.x + t.tx * 34 * dir, t.y + t.ty * 34 * dir);
    const g = c.createRadialGradient(0, 0, 4, 0, 0, 62);
    g.addColorStop(0, `rgba(36,46,140,${0.45 + 0.3 * ph})`); g.addColorStop(0.6, `rgba(36,46,140,${0.2 + 0.15 * ph})`); g.addColorStop(1, 'rgba(36,46,140,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 62, 0, TAU); c.fill();
    c.fillStyle = `rgba(255,236,170,${0.55 + 0.35 * ph})`; c.beginPath(); c.arc(8, -4, 9, 0, TAU); c.fill();
    c.fillStyle = `rgba(36,46,140,0.9)`; c.beginPath(); c.arc(13, -7, 8, 0, TAU); c.fill();
    c.fillStyle = `rgba(230,236,255,${0.5 + 0.4 * ph})`;
    for (let k = 0; k < 3; k++) { const a = Clock.t / 1300 + k * 2.1; star4(c, Math.cos(a) * 22, Math.sin(a) * 14 - 6, 3); }
    c.restore();
  }
  if (G.target === 'lantern' && !G.drag) {
    const p = lanternPos(G.targetLantern), ph = 0.5 + 0.5 * Math.sin(Clock.t / 260);
    const g = c.createRadialGradient(p.x, p.y, 6, p.x, p.y, 54);
    g.addColorStop(0, `rgba(255,240,150,${0.35 + 0.3 * ph})`); g.addColorStop(1, 'rgba(255,240,150,0)');
    c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, 54, 0, TAU); c.fill();
  }
  if (V.link && V.link.k > 0) {
    const m = V.mole, f = V.fly, a = { x: m.x + m.face * 20, y: m.y - 30 - m.hy }, b = { x: f.x + f.face * 14, y: f.y - 50 };
    c.save(); c.globalAlpha = V.link.k;
    c.strokeStyle = 'rgba(255,248,200,0.9)'; c.lineWidth = 7; c.lineCap = 'round';
    c.beginPath(); c.moveTo(a.x, a.y); c.quadraticCurveTo((a.x + b.x) / 2, Math.min(a.y, b.y) - 18, b.x, b.y); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 2.5; c.stroke();
    c.restore(); c.lineCap = 'butt';
  }
  for (const o of V.orbs) {
    const g = c.createRadialGradient(o.x, o.y, 1, o.x, o.y, 26);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,240,180,0.7)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    c.fillStyle = g; c.beginPath(); c.arc(o.x, o.y, 26, 0, TAU); c.fill();
  }
  if (V.birdPair && V.birds.length > 1) {
    const a = V.birds[0], b = V.birds[1];
    c.strokeStyle = '#ff7fa8'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(a.x + 6, a.y - a.hy - 8); c.quadraticCurveTo((a.x + b.x) / 2, (a.y - a.hy + b.y - b.hy) / 2 + 12, b.x - 6, b.y - b.hy - 8); c.stroke();
  }
}

// ================================================================ input (Pointer Events; one finger is enough, extra fingers never break the state)
function hitLantern(w) {
  const r = Math.max(42, 34 / camScale());
  let best = -1, bd = r;
  G.st.lanterns.forEach((l, i) => {
    if (l.h === 'stage' || !V.lanterns[i] || !V.lanterns[i].ready || V.lanterns[i].fly) return;
    const p = lanternPos(i), d = dist(w.x, w.y, p.x, p.y);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function pokeAt(w) {
  const near = (x, y, r) => dist(w.x, w.y, x, y) < Math.max(r, 22 / camScale());
  const L = V.layShown;
  if (near(V.mole.x, V.mole.y - 26, 40)) { V.mole.sq = 0.84; V.mole.wide = 0.6; Snd.squeak(900); return; }
  if (near(V.fly.x, V.fly.y - 42, 40)) { V.fly.sq = 0.84; V.fly.pulse = 0.7; Snd.squeak(1300); return; }
  for (const r of V.residents) if (near(r.x, r.y - 18, 28)) { r.hop = 1; Snd.squeak(RES_LOOK[r.kind].note); return; }
  if (V.duck && near(V.duck.x, V.duck.y - 14, 28)) { V.duck.waddle += 3; Snd.quack(); return; }
  for (const b of V.birds) if (near(b.x, b.y - 10 - b.hy, 26)) { b.hop = 1; Snd.chirp(panOf(b.x)); return; }
  const bt = annex(L.bell, 36);
  if (near(bt.x, bt.y - 40, 34)) { V.bell.swing = Math.max(V.bell.swing, 0.12); Snd.bell(Snd.mtof(86), 0.02, 0.6); return; }
  const wt = annex(L.well, 88);
  if (near(wt.x, wt.y - 16, 36)) { Snd.tick(420); return; }
  const pf = pondFrame(L.pond);
  if (near(pf.x, pf.y, 52)) { Snd.tick(1500); return; }
  const ft = tileXY(L.field);
  if (near(ft.x, ft.y, 40)) { if (V.radish && V.radish.st === 'ready') { V.radish.shake = 0.4; setTimeout(() => { if (V.radish) V.radish.shake = 0; }, 260); } Snd.tick(800); return; }
  if (near(GEO.stage.x, GEO.stage.y, 60)) { Snd.tick(1100); return; }
}
function pointerXY(e) { return { x: e.clientX, y: e.clientY }; }
function onDown(e) {
  if (e.cancelable) e.preventDefault();
  Snd.unlock(); G.started = true;
  const { x, y } = pointerXY(e), w = screenToWorld(x, y);
  G.idle = 0; G.hand = null; G.demoDone = false;
  G.touch = { wx: w.x, wy: w.y, t: Clock.t };
  for (const k of ['sun', 'moon']) {
    const P = VIEW.dice[k];
    if (Math.abs(x - P.x) < VIEW.dieSize * 0.64 && Math.abs(y - P.y) < VIEW.dieSize * 0.64) { pressDie(k); return; }
  }
  if (G.concert) return;
  if (!G.drag) {
    const li = hitLantern(w);
    if (li >= 0) {
      G.drag = { id: e.pointerId, idx: li, x0: x, y0: y, moved: false };
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      Snd.tick(1300);
      return;
    }
  }
  pokeAt(w);
}
function onMove(e) {
  const d = G.drag;
  if (!d || e.pointerId !== d.id) return;
  if (e.cancelable) e.preventDefault();
  const { x, y } = pointerXY(e);
  if (!d.moved && dist(x, y, d.x0, d.y0) > 12) d.moved = true;
  if (d.moved) {
    const w = screenToWorld(x, y), lv = V.lanterns[d.idx];
    if (lv) { lv.fly = { x: w.x, y: w.y - 14 }; lv.x = w.x; lv.y = w.y - 14; }
    G.touch = { wx: w.x, wy: w.y, t: Clock.t };
    G.idle = 0;
  }
}
function endDrag(e, cancel) {
  const d = G.drag;
  if (!d || e.pointerId !== d.id) return;
  G.drag = null;
  try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const l = G.st.lanterns[d.idx], lv = V.lanterns[d.idx];
  if (!l || !lv) return;
  if (cancel) { lv.fly = null; return; }
  if (!d.moved) {
    if (l.h === 'tile') {
      const t = tileXY(l.t);
      const dm = dist(V.mole.x, V.mole.y, t.x, t.y), df = dist(V.fly.x, V.fly.y, t.x, t.y);
      giveLanternTo(d.idx, dm <= df ? 'mole' : 'fly');
    } else { const pc = V[l.h]; if (pc) { pc.spin = 0.01; pc.proud = 1; Snd.chime(Snd.mtof(86), 0, 0.04); } }
    return;
  }
  const { x, y } = pointerXY(e), w = screenToWorld(x, y), R = Math.max(70, 40 / camScale());
  const dm = dist(w.x, w.y, V.mole.x, V.mole.y - 30), df = dist(w.x, w.y, V.fly.x, V.fly.y - 40);
  if (Math.min(dm, df) < R) { giveLanternTo(d.idx, dm <= df ? 'mole' : 'fly'); return; }
  let bt = -1, bd = R;
  for (let i = 0; i < 12; i++) { const t = tileXY(i), dd = dist(w.x, w.y, t.x, t.y); if (dd < bd) { bd = dd; bt = i; } }
  if (bt >= 0) dropLanternAt(d.idx, bt);
  else lv.fly = null;
}
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
cv.addEventListener('pointerup', (e) => endDrag(e, false), { passive: false });
cv.addEventListener('pointercancel', (e) => endDrag(e, true), { passive: false });
cv.addEventListener('lostpointercapture', (e) => { if (G.drag && e.pointerId === G.drag.id) endDrag(e, true); });
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart']) {
  document.addEventListener(ev, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
}
document.addEventListener('touchend', () => Snd.unlock(), { passive: true });
cv.addEventListener('pointerup', () => Snd.unlock());

// ================================================================ memory of play (localStorage; falls back to this session only)
function serialize(st) {
  return {
    v: 1, bridge: st.bridge, bridgeDirs: st.bridgeDirs.slice(),
    stones: st.stones.map(o => ({ u: +o.u.toFixed(3), v: +o.v.toFixed(3) })),
    lanterns: st.lanterns.map(l => (l.h === 'tile' ? 'stage' : l.h)),
    gems: st.gems, bellAwake: st.bellAwake, birdsMoved: st.birdsMoved, birdPair: !!st.birdPair, shortcut: st.loop,
    concerts: st.concerts, duckTrips: st.duckTrips, visits: G.visits || 0, disc: Object.assign({}, st.disc),
  };
}
function saveNow() { if (G.st) { Store.save(serialize(G.st)); G.saveDue = false; } }
let saveClock = 0;

// ================================================================ main loop (requestAnimationFrame only; stops while hidden)
let lastT = 0, raf = 0, running = true, needLayout = false;
function update(dt) {
  tickClock(dt);
  updateGuidance(dt);
  updatePiece(V.mole, dt); updatePiece(V.fly, dt);
  updateItems(dt);
  updateResidents(dt); updateDuck(dt); updateBirds(dt); updateGems(dt);
  updateParticles(dt);
  if (CAM.shake > 0) { CAM.sx = (Math.random() - 0.5) * CAM.shake * 2; CAM.sy = (Math.random() - 0.5) * CAM.shake * 2; } else { CAM.sx = CAM.sy = 0; }
  Snd.tickMusic();
  saveClock += dt;
  if (saveClock > 1000) { saveClock = 0; if (G.saveDue) saveNow(); }
}
function draw() {
  if (Cache.dirty) buildCaches();
  setScreenTransform();
  ctx.drawImage(Cache.sea, 0, 0, VIEW.W, VIEW.H);
  setWorldTransform();
  drawWorld(ctx);
  drawOverlays(ctx);
  setScreenTransform();
  drawDice(ctx);
  for (const p of SPART) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; star4(ctx, p.x, p.y, p.size); }
  ctx.globalAlpha = 1;
  drawHand(ctx);
}
function frame(now) {
  raf = 0;
  if (!running) return;
  if (needLayout) { needLayout = false; layout(); }
  let dt = lastT ? now - lastT : 16;
  lastT = now;
  dt = clamp(dt, 0, 100) * DBG.timeScale;
  try {
    while (dt > 0) { const d = Math.min(dt, 50); update(d); dt -= d; }
    draw();
  } catch (e) { DBG.errors.push(String(e && e.stack || e)); }
  raf = requestAnimationFrame(frame);
}
function start() { if (!raf && running) { lastT = 0; raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; Snd.suspend(); saveNow(); }
  else { running = true; start(); Snd.resume(); }
});
window.addEventListener('pagehide', saveNow);
window.addEventListener('resize', () => { needLayout = true; });
window.addEventListener('orientationchange', () => { needLayout = true; setTimeout(() => { needLayout = true; }, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { needLayout = true; });

// ================================================================ boot
function boot() {
  const save = Store.load();
  const seed = qsNum('seed') != null ? qsNum('seed') : ((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
  G.visits = save ? (save.visits || 0) + 1 : 1;
  G.st = Rules.newState(save, seed);
  syncVisualFromState(G.st);
  initAgents();
  layout();
  updateTarget();
  bellModeMusic();
  markSave();
  start();
}
if (TEST) {
  window.__MH = {
    G, V, VIEW, Clock, CAM, DBG, Rules, Store,
    st: () => G.st,
    press: (die) => pressDie(die),
    give: (idx, who) => giveLanternTo(idx, who),
    drop: (idx, t) => dropLanternAt(idx, t),
    setTimeScale: (x) => { DBG.timeScale = x; },
    forceRoll: (r) => { DBG.forceRoll = r; },
    diceScreen: () => ({ sun: VIEW.dice.sun, moon: VIEW.dice.moon, size: VIEW.dieSize }),
    toScreen: (x, y) => worldToScreen(x, y),
    tileScreen: (i) => worldToScreen(GEO.tiles[i].x, GEO.tiles[i].y),
    lanternScreen: (i) => { const p = lanternPos(i); return worldToScreen(p.x, p.y); },
    pieceScreen: (k) => worldToScreen(V[k].x, V[k].y - 30),
    errors: () => DBG.errors.slice(),
    busy: () => G.busy || G.concert || G.queue.length > 0,
    counts: () => ({ particles: PART.length, foot: FOOT.length, tweens: Clock.tweens.length, waits: Clock.waits.length }),
  };
}
boot();
})();
</script>
