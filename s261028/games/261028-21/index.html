<script>
(function(){
'use strict';
/* =========================================================
   お天気ぺったん！あひる町の虹色大パレード
   ステンドグラス調・天気シール × 小さな町の相互作用ゲーム
   ========================================================= */

// ---------- utilities ----------
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function rr(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rr(a,b+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hsl(h,s,l,a){return a===undefined?'hsl('+h+','+s+'%,'+l+'%)':'hsla('+h+','+s+'%,'+l+'%,'+a+')';}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function easeOutBack(t){var c=1.9;t=clamp(t,0,1)-1;return 1+(c+1)*t*t*t+c*t*t;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function now(){return performance.now()/1000;}

// ---------- persistence ----------
var SKEY='ahiru-otenki-261028-21';
var DUCK_IDS=['swim','red','green','chef','baby'];
var ITEM_TYPES=['boat','sled','skates'];
var Store={
  ok:true,
  load:function(){
    var raw=null;
    try{ raw=window.localStorage.getItem(SKEY); }catch(e){ this.ok=false; return null; }
    if(!raw) return null;
    try{ var d=JSON.parse(raw); var v=validateSave(d); if(!v) throw new Error('bad'); return v; }
    catch(e){ try{ window.localStorage.removeItem(SKEY); }catch(_){ } return null; }
  },
  save:function(d){
    if(!this.ok) return false;
    try{ window.localStorage.setItem(SKEY,JSON.stringify(d)); return true; }
    catch(e){ this.ok=false; return false; }
  }
};
function validateSave(d){
  if(!d||typeof d!=='object'||d.v!==1) return null;
  var o={v:1,hues:null,items:{},plays:{},fav:{},parades:0,park:false,visits:0,snowDuck:false};
  if(Array.isArray(d.hues)&&d.hues.length===5&&d.hues.every(function(h){return typeof h==='number'&&isFinite(h);}))
    o.hues=d.hues.map(function(h){return ((h%360)+360)%360;});
  DUCK_IDS.forEach(function(id){
    var a=d.items&&d.items[id];
    o.items[id]=Array.isArray(a)?a.filter(function(x,i){return ITEM_TYPES.indexOf(x)>=0&&a.indexOf(x)===i;}):[];
    var p=d.plays&&d.plays[id];
    o.plays[id]=(typeof p==='number'&&isFinite(p))?clamp(Math.floor(p),0,99999):0;
    var f=d.fav&&d.fav[id]; o.fav[id]={boat:0,sled:0,skates:0};
    if(f&&typeof f==='object') ITEM_TYPES.forEach(function(t){var n=f[t]; if(typeof n==='number'&&isFinite(n)) o.fav[id][t]=clamp(Math.floor(n),0,99999);});
  });
  if(typeof d.parades==='number'&&isFinite(d.parades)) o.parades=clamp(Math.floor(d.parades),0,9999);
  if(typeof d.visits==='number'&&isFinite(d.visits)) o.visits=clamp(Math.floor(d.visits),0,99999);
  o.park=d.park===true; o.snowDuck=d.snowDuck===true;
  return o;
}

// ---------- audio (Web Audio synthesis) ----------
var AU={
  ctx:null,out:null,nb:null,bb:null,ready:false,loops:null,kicked:false,lastPlink:0,lastTick:0,
  init:function(){
    if(this.ctx) return;
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var c; try{ c=new AC(); }catch(e){ return; }
    this.ctx=c;
    var comp=c.createDynamicsCompressor();
    try{ comp.threshold.value=-16; comp.knee.value=16; comp.ratio.value=3.5; comp.attack.value=0.004; comp.release.value=0.25; }catch(e){}
    var out=c.createGain(); out.gain.value=0.78; out.connect(comp); comp.connect(c.destination); this.out=out;
    var len=Math.floor(c.sampleRate*2), i;
    var nb=c.createBuffer(1,len,c.sampleRate), ch=nb.getChannelData(0);
    for(i=0;i<len;i++) ch[i]=Math.random()*2-1;
    this.nb=nb;
    var bb=c.createBuffer(1,len,c.sampleRate), bc=bb.getChannelData(0), last=0;
    for(i=0;i<len;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; bc[i]=last*3.4; }
    this.bb=bb;
    this.loops={rain:this.mkLoop('bandpass',2300,0.55),wind:this.mkLoop('bandpass',620,1.3),
      sled:this.mkLoop('bandpass',900,1.1),water:this.mkLoop('lowpass',540,0.7)};
    this.ready=true;
  },
  mkLoop:function(type,f,q){
    var c=this.ctx, s=c.createBufferSource(); s.buffer=this.nb; s.loop=true;
    var fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    var g=c.createGain(); g.gain.value=0; s.connect(fl); fl.connect(g); g.connect(this.out);
    try{ s.start(0,Math.random()); }catch(e){ try{s.start(0);}catch(_){} }
    return {s:s,f:fl,g:g,base:f};
  },
  unlock:function(){
    this.init(); var c=this.ctx; if(!c) return;
    if(c.state!=='running'&&c.resume){ try{ var p=c.resume(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
    if(!this.kicked){ this.kicked=true;
      try{ var b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
  },
  suspend:function(){ var c=this.ctx; if(c&&c.state==='running'&&c.suspend){ try{ var p=c.suspend(); if(p&&p.catch) p.catch(function(){}); }catch(e){} } },
  resume:function(){ var c=this.ctx; if(c&&c.state!=='running'&&c.resume){ try{ var p=c.resume(); if(p&&p.catch) p.catch(function(){}); }catch(e){} } },
  on:function(){ return !!(this.ctx&&this.ctx.state==='running'&&this.ready); },
  env:function(g,t,a,peak,d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); },
  osc:function(type,f,t,a,peak,d,f2){
    var c=this.ctx, o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
    var g=c.createGain(); this.env(g,t,a,peak,d); o.connect(g); g.connect(this.out); o.start(t); o.stop(t+a+d+0.05);
  },
  nz:function(t,a,peak,d,type,f,q,f2,buf){
    var c=this.ctx, s=c.createBufferSource(); s.buffer=buf||this.nb;
    var fl=c.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+a+d); fl.Q.value=q;
    var g=c.createGain(); this.env(g,t,a,peak,d); s.connect(fl); fl.connect(g); g.connect(this.out);
    s.start(t,Math.random()*1.5); s.stop(t+a+d+0.05);
  },
  note:function(n){ var sc=[0,2,4,7,9]; var o=Math.floor(n/5), k=((n%5)+5)%5; return 523.25*Math.pow(2,(sc[k]+12*o)/12); },
  glass:function(f,t,v){ this.osc('sine',f,t,0.004,v,0.95); this.osc('sine',f*2.76,t,0.003,v*0.33,0.42); this.osc('triangle',f*5.4,t,0.002,v*0.1,0.2); },
  petan:function(n){ if(!this.on()) return; var t=this.ctx.currentTime;
    this.osc('sine',240,t,0.006,0.3,0.15,62); this.nz(t,0.002,0.07,0.05,'lowpass',900,0.7);
    this.glass(this.note(n),t+0.012,0.19); this.glass(this.note(n+2),t+0.07,0.07); },
  pop:function(n){ if(!this.on()) return; var t=this.ctx.currentTime; var f=this.note(n); this.osc('sine',f*0.5,t,0.005,0.15,0.09,f); },
  tick:function(){ if(!this.on()) return; var t=this.ctx.currentTime; if(t-this.lastTick<0.06) return; this.lastTick=t; this.osc('sine',1900+Math.random()*500,t,0.002,0.04,0.05); },
  plink:function(v){ if(!this.on()) return; var t=this.ctx.currentTime; if(t-this.lastPlink<0.045) return; this.lastPlink=t;
    var f=1300+Math.random()*1600; this.osc('sine',f,t,0.002,0.045*(v||1),0.07,f*1.45); },
  splash:function(sz){ if(!this.on()) return; var t=this.ctx.currentTime, v=0.1+0.17*sz;
    this.nz(t,0.004,v,0.32+0.22*sz,'bandpass',1500,0.8,260);
    for(var i=0;i<3;i++){ var f=360+Math.random()*520; this.osc('sine',f,t+0.06+i*0.05,0.004,0.055,0.08,f*2.2); } },
  quack:function(p,happy){ if(!this.on()) return; var c=this.ctx, t=c.currentTime, n=happy?2:1;
    for(var k=0;k<n;k++){ var t0=t+k*0.13, o=c.createOscillator(); o.type='sawtooth'; var f0=430*p;
      o.frequency.setValueAtTime(f0*0.85,t0); o.frequency.linearRampToValueAtTime(f0*1.3,t0+0.04); o.frequency.exponentialRampToValueAtTime(f0*0.74,t0+0.15);
      var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1250*p; bp.Q.value=2.4;
      var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2700;
      var g=c.createGain(); this.env(g,t0,0.012,0.19,0.14); o.connect(bp); bp.connect(lp); lp.connect(g); g.connect(this.out); o.start(t0); o.stop(t0+0.2); } },
  drum:function(k,v){ if(!this.on()) return; var t=this.ctx.currentTime; v=v||1;
    if(k==='don'){ this.osc('sine',132,t,0.004,0.48*v,0.36,48); this.nz(t,0.002,0.11*v,0.07,'lowpass',520,0.8); }
    else { this.nz(t,0.001,0.11*v,0.05,'highpass',2600,0.7); this.osc('triangle',900,t,0.002,0.06*v,0.05); } },
  rumble:function(soft){ if(!this.on()) return; var c=this.ctx, t=c.currentTime, s=c.createBufferSource(); s.buffer=this.bb;
    var fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=210; var g=c.createGain(); var pk=soft?0.13:0.24;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(pk,t+0.2); g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start(t,Math.random()); s.stop(t+1.7);
    for(var i=0;i<4;i++) this.glass(this.note(10+i*2),t+0.06+i*0.07,0.045); },
  ding:function(){ if(!this.on()) return; var t=this.ctx.currentTime; this.glass(this.note(12),t,0.1); this.glass(this.note(14),t+0.12,0.06); },
  chime:function(base){ if(!this.on()) return; var t=this.ctx.currentTime, b=base||5; var self=this; [0,2,4].forEach(function(n,i){ self.glass(self.note(b+n),t+i*0.06,0.09); }); },
  fanfare:function(){ if(!this.on()) return; var t=this.ctx.currentTime, self=this;
    [0,2,4,5,7,9].forEach(function(n,i){ self.glass(self.note(n+5),t+i*0.085,0.15); self.osc('triangle',self.note(n),t+i*0.085,0.01,0.06,0.35); });
    this.glass(this.note(15),t+0.6,0.13); this.glass(this.note(12),t+0.6,0.09);
    for(var i=0;i<6;i++) this.osc('sine',this.note(14+Math.floor(Math.random()*6)),t+0.66+i*0.06,0.002,0.03,0.25); },
  swoosh:function(){ if(!this.on()) return; var t=this.ctx.currentTime; this.nz(t,0.08,0.09,0.75,'bandpass',500,1.2,2600);
    for(var i=0;i<6;i++) this.glass(this.note(14-i),t+i*0.09,0.035); },
  freeze:function(){ if(!this.on()) return; var t=this.ctx.currentTime; for(var i=0;i<7;i++) this.glass(this.note(18-i*2),t+i*0.05,0.05);
    this.nz(t,0.002,0.05,0.4,'highpass',4200,0.7); },
  melt:function(){ if(!this.on()) return; var t=this.ctx.currentTime; for(var i=0;i<6;i++) this.glass(this.note(6+i*2),t+i*0.07,0.05);
    for(var k=0;k<4;k++){ var f=1100+Math.random()*1400; this.osc('sine',f,t+0.1+k*0.11,0.002,0.04,0.07,f*1.5); } },
  knock:function(){ if(!this.on()) return; var t=this.ctx.currentTime; this.osc('triangle',300+Math.random()*60,t,0.002,0.2,0.08,180); this.nz(t,0.001,0.06,0.03,'bandpass',1800,1.5); },
  hug:function(){ if(!this.on()) return; var t=this.ctx.currentTime; this.glass(this.note(9),t,0.1); this.glass(this.note(12),t+0.1,0.1); this.glass(this.note(14),t+0.2,0.08); },
  boing:function(){ if(!this.on()) return; var t=this.ctx.currentTime; this.osc('sine',300,t,0.005,0.16,0.22,620); },
  crunch:function(){ if(!this.on()) return; var t=this.ctx.currentTime; this.nz(t,0.003,0.07,0.12,'bandpass',3000,0.9,1400); },
  bell:function(n,v,t){ if(!this.on()) return; t=t||this.ctx.currentTime; this.glass(this.note(n),t,v||0.08); },
  setLoops:function(rain,wind,sled,water){
    if(!this.ready||!this.ctx) return; var t=this.ctx.currentTime, L=this.loops;
    L.rain.g.gain.setTargetAtTime(Math.min(0.1,rain*0.04),t,0.3);
    L.wind.g.gain.setTargetAtTime(Math.min(0.085,wind*0.038),t,0.4);
    L.wind.f.frequency.setTargetAtTime(L.wind.base*(1+0.45*Math.sin(t*0.9)),t,0.3);
    L.sled.g.gain.setTargetAtTime(Math.min(0.11,sled*0.075),t,0.06);
    L.sled.f.frequency.setTargetAtTime(700+Math.min(1,sled)*1000,t,0.08);
    L.water.g.gain.setTargetAtTime(Math.min(0.055,water*0.018),t,0.5);
  }
};

// ---------- canvas & layout ----------
var Z=5, NC=60, NS=120, POOLV=0.5, SNOWV=0.13;
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var L={};
var LEAD='#2a2244';
var TYPES=['rain','sun','wind','snow','thunder'];
var BLD=['house','tall','gazebo','kitchen','house2'];
var SPR={stk:{},houses:[],shed:null,bg:null};

function mkCanvas(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h)); return c; }
function ux(u){ return L.wx0+u*L.ww; }
function vy(v){ return L.midTop+v*L.mh; }
function zoneU(z){ return (z+0.5)/Z; }
function uZone(u){ return clamp(Math.floor(u*Z),0,Z-1); }
function xToU(x){ return (x-L.wx0)/L.ww; }
function yToV(y){ return (y-L.midTop)/L.mh; }
function readSafe(){
  var s=getComputedStyle(document.getElementById('sa'));
  return {t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};
}
function doLayout(){
  var W=Math.max(200,window.innerWidth||document.documentElement.clientWidth||375);
  var H=Math.max(200,window.innerHeight||document.documentElement.clientHeight||667);
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
  var sa=readSafe(), S, i;
  L.W=W; L.H=H; L.dpr=dpr; L.sa=sa; L.portrait=W<H*0.95;
  if(L.portrait){
    S=clamp(Math.min(W*0.158,H*0.088),44,112);
    var sy0=sa.t+5;
    L.shelf={x0:sa.l+5,y0:sy0,x1:W-sa.r-5,y1:sy0+S*1.2};
    L.wx0=sa.l; L.wx1=W-sa.r; L.skyY0=L.shelf.y1+S*0.08;
  } else {
    S=clamp(Math.min(H*0.125,W*0.085),44,112);
    L.shelf={x0:sa.l+5,y0:sa.t+5,x1:sa.l+5+S*1.26,y1:H-sa.b-5};
    L.wx0=L.shelf.x1+2; L.wx1=W-sa.r; L.skyY0=sa.t+S*0.15;
  }
  L.S=S; L.ww=L.wx1-L.wx0; L.zw=L.ww/Z;
  L.T0=H*0.5; L.T1=H-sa.b; L.TH=L.T1-L.T0;
  L.houseBase=L.T0+L.TH*0.15;
  L.houseH=Math.min(L.zw*1.05,L.TH*0.45);
  L.houseW=L.zw*0.66;
  L.midTop=L.houseBase+L.TH*0.035;
  L.midBot=L.houseBase+L.TH*0.52;
  L.mh=L.midBot-L.midTop;
  L.frontY=L.houseBase+L.TH*0.66;
  L.gutH=Math.max(14,L.TH*0.1);
  L.D=clamp(Math.min(L.TH*0.105,L.zw*0.45),22,60);
  L.bandBottom=L.houseBase-L.houseH-S*0.08;
  L.stackGap=Math.max(S*0.3,Math.min(S*0.46,(L.bandBottom-S-L.skyY0)/3));
  L.slots=[];
  for(i=0;i<5;i++){
    if(L.portrait){ var span=L.shelf.x1-L.shelf.x0; L.slots.push({x:L.shelf.x0+span*(i+0.5)/5,y:(L.shelf.y0+L.shelf.y1)/2}); }
    else { var gap=Math.min(S*1.32,(L.shelf.y1-L.shelf.y0-S*0.3)/5), yc=(L.shelf.y0+L.shelf.y1)/2; L.slots.push({x:(L.shelf.x0+L.shelf.x1)/2,y:yc+gap*(i-2)}); }
  }
  L.shedU=0.075; L.shedV=0.86;
  L.shedW=Math.max(46,L.zw*0.52); L.shedH=L.shedW*0.78;
}

// ---------- glass drawing helpers ----------
function rrect(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function lg(c,x0,y0,x1,y1,st){ var g=c.createLinearGradient(x0,y0,x1,y1); for(var i=0;i<st.length;i+=2) g.addColorStop(st[i],st[i+1]); return g; }
function rg(c,x,y,r0,r1,st){ var g=c.createRadialGradient(x,y,r0,x,y,r1); for(var i=0;i<st.length;i+=2) g.addColorStop(st[i],st[i+1]); return g; }
function leadStroke(c,w,col){ c.lineWidth=w; c.strokeStyle=col||LEAD; c.lineJoin='round'; c.lineCap='round'; c.stroke(); }
function gloss(c,x,y,rx,ry,a,rot){ c.save(); c.globalAlpha=a; c.fillStyle='#fff'; c.beginPath(); c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||-0.5,0,TAU); c.fill(); c.restore(); }

  for(j=0;j<ny;j++) for(i=0;i<nx;i++){
    var a=P[j][i], b=P[j][i+1], c2=P[j+1][i+1], d=P[j+1][i];
    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c2[0],c2[1]); g.lineTo(d[0],d[1]); g.closePath();
    g.fillStyle=colFn((a[0]+c2[0])/2,(a[1]+c2[1])/2,i,j); g.fill();

    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c2[0],c2[1]); g.lineTo(d[0],d[1]); g.closePath(); leadStroke(g,lw,leadCol);
  }
}
function hill(g,base,top,amp,freq,ph,ca,cb){

  g.lineTo(L.W,base); g.closePath(); g.fillStyle=lg(g,0,top-amp,0,base,[0,ca,1,cb]); g.fill(); leadStroke(g,1.8,'rgba(30,60,50,0.55)');

function islandRu(){ return G.park.st>0? (poolRx(2)*0.58*G.park.rise)/L.ww : 0; }

}

function computeInfluence(){
  var i,z,k; G.rainAt.fill(0); G.snowAt.fill(0); G.sunAt.fill(0); G.thunderAt.fill(0); G.windAt.fill(0);
  var n={rain:0,snow:0,sun:0,wind:0,thunder:0};
  for(i=0;i<G.stickers.length;i++){ var s=G.stickers[i]; if(s.st!=='placed') continue; n[s.type]++;
    if(s.type==='rain') G.rainAt[s.zone]+=1; else if(s.type==='snow') G.snowAt[s.zone]+=1; else if(s.type==='sun') G.sunAt[s.zone]+=1; else if(s.type==='thunder') G.thunderAt[s.zone]+=1;
    else if(s.type==='wind'){ for(z=0;z<Z;z++){ var d=z-s.zone, dir=d===0?s.side:(d>0?1:-1); G.windAt[z]+=dir*[1,0.75,0.45,0.22,0.1][Math.abs(d)]; } } }
  for(z=0;z<Z;z++){ G.windAt[z]=clamp(G.windAt[z],-1.6,1.6); var su=0,sn=0; for(k=0;k<Z;k++){ var f=INF[Math.abs(z-k)]; su+=G.sunAt[k]*f; sn+=G.snowAt[k]*f; } G.sunInf[z]=su; G.snowInf[z]=sn; }
  G.counts=n;
}

function simWeather(dt){
  var z,i;
  for(z=0;z<Z;z++) G.windS[z]+=(G.windAt[z]-G.windS[z])*Math.min(1,dt*2.4);
  var wt=clamp((G.counts.snow-1)*1.0-G.counts.sun*0.8,0,1); G.winter+=(wt-G.winter)*Math.min(1,dt*0.35);
  G.rainLand.fill(0);

  var want=false, dz=-1, D=G.drum;

    D.timer-=dt; if(D.timer<=0){ drumBeat(); D.timer+=G.parade.on?0.28:0.3; } }
}

    if(s.st==='drag'){ var px=s.x, py=s.y, f=Math.min(1,dt*28); s.x+=(s.tx-s.x)*f; s.y+=(s.ty-s.y)*f; s.vx=lerp(s.vx,(s.x-px)/Math.max(dt,0.001),0.3); s.vy=lerp(s.vy,(s.y-py)/Math.max(dt,0.001),0.3); s.sct=1.24; }

      if(s.st==='fly'&&dist(s.x,s.y,s.tx,s.ty)<L.S*0.1){ s.st='placed'; onStickerLand(s); }
      if(s.st==='ret'&&dist(s.x,s.y,s.tx,s.ty)<L.S*0.18) s.dead=true; }
    var ks=300, cs=2*Math.sqrt(ks)*0.42; s.scv+=((s.sct-s.sc)*ks-s.scv*cs)*dt; s.sc+=s.scv*dt;
    s.rot+=(clamp(s.vx*0.0008,-0.4,0.4)-s.rot)*Math.min(1,dt*10);

  AU.petan((s.zone*2+s.k*3+G.combo.n)%14);
  G.fx.push({k:'flash',x:s.x,y:s.y,t:0,life:0.5,col:STK_COL[s.type]});
