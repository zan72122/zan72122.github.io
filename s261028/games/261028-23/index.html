<script>
"use strict";
// ===== 1. utilities ==========================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const springPop = t => t <= 0 ? 0 : t >= 1.6 ? 1 : 1 - Math.exp(-5.2 * t) * Math.cos(9.5 * t);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// cosmetic randomness only (never decides a marble route)
const SEED = (Math.random() * 1e9) | 0;
const rnd = mulberry32(SEED);
const R = (a, b) => b === undefined ? rnd() * a : a + rnd() * (b - a);
const pick = arr => arr[(rnd() * arr.length) | 0];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}

// ----- geometry: sampled path --------------------------------------------------
class Path {
  constructor(pts) {
    this.pts = pts;
    this.cum = [0];
    let L = 0;
    for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); this.cum.push(L); }
    this.L = Math.max(L, 0.0001);
  }
  at(s) {
    const pts = this.pts, cum = this.cum;
    if (s <= 0) return { x: pts[0].x, y: pts[0].y, a: this.ang(0) };
    if (s >= this.L) { const n = pts.length - 1; return { x: pts[n].x, y: pts[n].y, a: this.ang(n - 1) }; }
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m; else hi = m; }
    const t = (s - cum[lo]) / Math.max(cum[hi] - cum[lo], 1e-6);
    return { x: lerp(pts[lo].x, pts[hi].x, t), y: lerp(pts[lo].y, pts[hi].y, t), a: this.ang(lo) };
  }
  ang(i) {

  }
}
// Catmull-Rom through control points -> Path
function curvePath(cp, per = 10) {

  for (let i = 0; i < cp.length - 1; i++) {
    const p0 = cp[Math.max(0, i - 1)], p1 = cp[i], p2 = cp[i + 1], p3 = cp[Math.min(cp.length - 1, i + 2)];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),

}
function qbez(p0, p1, p2, t) {
  const u = 1 - t;
  return { x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y };
}
// control point so that the quadratic passes through m at t = tm
function qctrlThrough(p0, m, p2, tm) {
  const u = 1 - tm;
  return { x: (m.x - u * u * p0.x - tm * tm * p2.x) / (2 * u * tm), y: (m.y - u * u * p0.y - tm * tm * p2.y) / (2 * u * tm) };

// ----- colour helpers ------------------------------------------------------------
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

// ===== 2. storage (device-local, failure tolerant) ===============================
const STORE = {
  key: 'marble-triplets-park-v1',
  usable: true,
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(this.key); }
    catch (e) { this.usable = false; return { data: null, status: 'blocked' }; }
    if (!raw) return { data: null, status: 'empty' };
    try {
      const d = JSON.parse(raw);
      const clean = sanitizeSave(d);
      return clean ? { data: clean, status: 'ok' } : { data: null, status: 'corrupt' };
    } catch (e) { return { data: null, status: 'corrupt' }; }
  },
  save(obj) {
    if (!this.usable) return false;
    try { window.localStorage.setItem(this.key, JSON.stringify(obj)); return true; }
    catch (e) { return false; }
  }
};
const PART_TYPES = ['funnel', 'tramp', 'branch', 'magnet', 'wind', 'bell'];
const SOCKET_IDS = ['c1', 'c2', 'c3', 'c4', 'l2', 'l3', 'l4', 'r2', 'r3', 'r4'];
const RIDE_IDS = ['wheel', 'cups', 'boat'];

  if (!d || typeof d !== 'object' || d.v !== 1) return null;

  out.placed = {};
  const used = new Set();
  if (d.placed && typeof d.placed === 'object') {
    for (const k of Object.keys(d.placed)) {
      const p = d.placed[k];
      if (SOCKET_IDS.includes(k) && PART_TYPES.includes(p) && !used.has(p)) { out.placed[k] = p; used.add(p); }
    }
  }
  out.unlocked = Array.isArray(d.unlocked) ? d.unlocked.filter(p => PART_TYPES.includes(p)) : ['funnel'];
  if (!out.unlocked.includes('funnel')) out.unlocked.unshift('funnel');
  for (const p of used) if (!out.unlocked.includes(p)) out.unlocked.push(p);
  out.found = {};
  if (d.found && typeof d.found === 'object') for (let i = 1; i <= 7; i++) if (d.found['d' + i] === true) out.found['d' + i] = true;
  out.repaired = d.repaired === true;
  out.phase = d.phase === 'park' ? 'park' : 'flat';
  out.cycle = Number.isFinite(d.cycle) ? clamp(d.cycle | 0, 0, 9999) : 0;
  out.cycleRides = {};
  if (d.cycleRides && typeof d.cycleRides === 'object') for (const r of RIDE_IDS) out.cycleRides[r] = d.cycleRides[r] === true;
  out.animals = [];
  if (Array.isArray(d.animals)) for (const a of d.animals.slice(0, 12)) {
    if (a && SPECIES.includes(a.sp)) out.animals.push({ sp: a.sp, ride: RIDE_IDS.includes(a.ride) ? a.ride : null, fav: RIDE_IDS.includes(a.fav) ? a.fav : null });
  }
  out.specials = [];
  if (Array.isArray(d.specials)) for (const s of d.specials.slice(-4)) {
    if (s && Array.isArray(s.rides) && s.rides.length === 2 && s.rides.every(r => RIDE_IDS.includes(r))) {
      out.specials.push({ rides: s.rides.slice(), animals: Array.isArray(s.animals) ? s.animals.filter(x => SPECIES.includes(x)).slice(0, 6) : [], lead: RIDE_IDS.includes(s.lead) ? s.lead : s.rides[0] });
    }
  }
  out.lineup = Array.isArray(d.lineup) ? d.lineup.filter(x => typeof x === 'string' && /^(wheel|cups|boat)(\+(wheel|cups|boat))?$/.test(x)).slice(0, 6) : [];
  out.visits = Number.isFinite(d.visits) ? clamp(d.visits | 0, 0, 99999) : 0;
  out.runs = Number.isFinite(d.runs) ? clamp(d.runs | 0, 0, 999999) : 0;

// ===== 3. audio (Web Audio synthesis, unlocked by the first touch) ===============
const AU = (() => {

    init();

      try {
        const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();

  function tone(o) {
    if (!ok() || voices >= MAXV) return;

    penta,
    pick() { noise({ f: 2600, q: 1.4, d: 0.05, v: 0.1 }); tone({ f: 520, f2: 860, d: 0.09, v: 0.11, type: 'triangle' }); },
    drop(i) {
      noise({ type: 'highpass', f: 3200, d: 0.03, v: 0.18 });
      tone({ f: penta(i), type: 'triangle', d: 0.24, v: 0.2 });
      tone({ f: penta(i + 2), type: 'sine', t: 0.07, d: 0.2, v: 0.1 });
      tone({ f: 140, f2: 80, d: 0.1, v: 0.22 });
    },
    back() { tone({ f: 360, f2: 190, d: 0.32, v: 0.14, vib: 9, vibAmt: 14 }); noise({ f: 900, d: 0.1, v: 0.05 }); },
    wake() { [5, 7, 9, 12].forEach((p, i) => tone({ f: penta(p), t: i * 0.07, d: 0.3, v: 0.1, type: 'triangle' })); },
    tick(spd) { noise({ type: 'highpass', f: 3500 + spd * 900, d: 0.016, v: 0.035 + spd * 0.02 }); },
    tap() { noise({ f: 1700, q: 2.5, d: 0.05, v: 0.07 }); tone({ f: 300, f2: 260, d: 0.06, v: 0.05 }); },
    funnel() { tone({ f: 380, f2: 1350, d: 1.0, v: 0.08, vib: 7, vibAmt: 16 }); noise({ f: 700, f2: 2600, d: 1.0, v: 0.045 }); },
    tramp(level) {

    split() {

    whirr(str) { noise({ f: 480, f2: 900 + 1500 * str, q: 2.2, d: 0.45 + str * 0.7, v: 0.05 + 0.07 * str }); },
    horn() {

    ride(kind) {

    } else if (a.type === 'home') {
      a.t += dt;
      const k = Math.min(1, a.t / a.dur);
      const seat = L.seats[m.idx];
      const tx = m.mini ? seat.x + (m.side === 'L' ? -1 : 1) * L.mr * 0.6 : seat.x, ty = seat.y;
      const c = { x: lerp(a.x0, tx, 0.5), y: Math.min(a.y0, ty) - L.S * (a.oops ? 1.1 : 2.0) };
      const q = qbez({ x: a.x0, y: a.y0 }, c, { x: tx, y: ty }, easeInOut(k));
      m.x = q.x; m.y = q.y; m.gx = lerp(a.x0, tx, k); m.gy = lerp(a.y0, ty, k); m.z = Math.max(0, m.gy - m.y);

G.playT = 3;
// waiting siblings bump, giggle and beg (cosmetic, never changes a route)
function tripletPlay(dt) {
  G.playT -= dt;
  if (G.playT > 0) return;
  G.playT = R(2.5, 5);
  const w = G.marbles.filter(m => m.state === 'wait' && !m.mini);
  if (w.length >= 2) {
    const i = (rnd() * (w.length - 1)) | 0, a = w[i], b = w[i + 1];
    if (b.idx === a.idx + 1) { a.nudge = 1; b.nudge = -1; a.squash = 0.3; b.squash = 0.3; setMood(a, 'joy', 0.8); setMood(b, 'joy', 0.8); if (G.woke) AU.tick(0.2); }
  }
  const red = w.find(m => m.color === 'r');
  if (red && G.unlocked.has('tramp') && !socketOf('tramp') && rnd() < 0.6) { red.hop = 1; setMood(red, 'joy', 0.9); }
  const blue = w.find(m => m.color === 'b');

function idleMarble(m, dt) {
  const seat = L.seats[m.idx];
  m.wob += dt * (1.6 + m.idx * 0.3);
  const fidget = Math.sin(m.wob * 3.1) * 0.6 + Math.sin(m.wob * 7.7) * 0.25;
  m.nudge *= Math.exp(-5 * dt);
  m.x = seat.x + fidget * L.mr * 0.07 + m.nudge * L.mr * 0.35;
  m.y = seat.y - Math.max(0, Math.sin(m.wob * 2.3)) * L.mr * 0.06 - m.hop * L.mr * 1.1 * Math.sin(m.hop * Math.PI);

}

function arriveNode(m, node, how) {
  if (node.startsWith('st_')) { arriveStation(m, node); return; }
  if (L.sock[node] && !socketActive(node)) { sendHome(m, true); return; }
  const part = partAt(node);
  const boost = m.boost; m.boost = 0;
  m.at = node;
  sockKick(node, boost ? 1 : 0.6);
  if (!part) { plainPass(m, node, boost); return; }
  const fn = PART_DO[part];
  fn(m, node, boost, how);
}
function plainPass(m, node, boost) {
  AU.tick(boost ? 1 : 0.4);
  const v = boost ? lerp(V1(), V0(), 0.35) : V0();
  startSeg(m, node, nextNode(node), v, { max: v });
}
function abortPart(m) {

  m.act = null;
  startSeg(m, a.sid, nextNode(a.sid), V0());
}
// generic in-socket action with an eased entry from wherever the marble is
function partAct(m, part, sid, dur, pos, done, extra) {
  const e0 = { x: m.x, y: m.y };
  m.act = Object.assign({
    type: 'part', part, sid, t: 0, dur, done,
    step: (mm, a, k) => {
      const s = L.sock[sid];
      const p = pos(s, k, a);
      const blend = Math.min(1, a.t / 0.12);
      mm.x = lerp(e0.x, p.x, easeOut(blend)); mm.y = lerp(e0.y, p.y, easeOut(blend));
      mm.gx = s.x; mm.gy = s.y + L.S * 0.1; mm.z = 0;
    }
  }, extra || {});
}

// ----- per part behaviour --------------------------------------------------------
const PART_DO = {
  funnel(m, sid, boost, how) {
    const S = L.S, th0 = Math.PI / 2;
    AU.funnel();
    partKick('funnel', 1);
    partAct(m, 'funnel', sid, how === 'drop' ? 1.3 : 1.12, (s, k) => {
      const e = Math.pow(k, 1.5);
      const th = th0 + e * TAU * 2.4;
      const r = S * 0.34 * (1 - Math.pow(k, 1.15)) + S * 0.02;
      const cy = s.y - S * 0.44 + k * S * 0.36;
      return { x: s.x + r * Math.cos(th), y: cy + r * 0.34 * Math.sin(th) };
    }, (mm) => {
      mm.boost = 1;
      const s = L.sock[sid];
      sparkle(s.x, s.y - L.S * 0.1, 5, mm.color);
      AU.tick(1);
      startSeg(mm, sid, nextNode(sid), V1());
      logEv('funnel', { sid, color: mm.color, mini: mm.mini });
    });
  },
  tramp(m, sid, boost, how) {
    const S = L.S;
    const depth = boost ? 1 : 0.55;
    const ps = G.parts.tramp;
    partAct(m, 'tramp', sid, boost ? 0.3 : 0.2, (s, k) => {
      const d = Math.sin(Math.min(1, k * 1.15) * Math.PI) * depth;
      ps.dent = Math.max(ps.dent, d);
      return { x: s.x, y: s.y - S * 0.2 + d * S * 0.16 };
    }, (mm) => {
      mm.squash = 0.5;
      const high = !!boost;
      AU.tramp(high ? 2 : 1);
      ps.twang = 1;
      if (mm.color === 'r') { setMood(mm, 'joy', 1.4); sparkle(mm.x, mm.y, 5, 'r'); }
      logEv('bounce', { sid, high, color: mm.color, mini: mm.mini });
      if (high) highJump(mm, sid);
      else hopTo(mm, sid, nextNode(sid));
    });
  },
  magnet(m, sid, boost, how) {
    const S = L.S;
    const pull = m.color === 's';
    if (pull) { AU.magnet(); setMood(m, 'wow', 1.3); G.parts.magnet.glow = 1; }
    else partKick('magnet', 0.3);
    partAct(m, 'magnet', sid, pull ? (how === 'mag' ? 0.5 : 0.75) : 0.14, (s, k, a) => {
      if (!pull) return { x: s.x, y: s.y - S * 0.05 };
      const jit = Math.sin(a.t * 60) * S * 0.012 * (1 - k);
      return { x: s.x + jit, y: s.y - S * 0.3 };
    }, (mm) => {
      if (pull) logEv('magnetCling', { sid, color: mm.color });
      startSeg(mm, sid, nextNode(sid), V0());
    });
  },
  branch(m, sid, boost, how) {
    const S = L.S, ps = G.parts.branch;
    const ex = sideExits(sid);
    let dir = 'C';
    if (boost) dir = 'X';
    else {
      const want = LOVES[m.color];
      if (partAt(ex.L) === want) dir = 'L';
      else if (partAt(ex.R) === want) dir = 'R';
    }
    ps.flapT = dir === 'L' ? -1 : dir === 'R' ? 1 : 0;
    partAct(m, 'branch', sid, dir === 'X' ? 0.28 : 0.16, (s, k) => ({ x: s.x, y: s.y - S * 0.12 }), (mm) => {
      if (dir === 'X') { splitMarble(mm, sid); return; }
      if (dir === 'C') { startSeg(mm, sid, nextNode(sid), V0()); return; }
      const to = ex[dir];
      if (mm.color === 's') {
        AU.magnet(); G.parts.magnet.glow = 1.4; setMood(mm, 'wow', 1.6);
        startSeg(mm, sid, to, V0() * 0.95, { mag: true, how: 'mag' });
        logEv('magnetTurn', { side: dir, sid, to });
        discover('d2', L.sock[to].x, L.sock[to].y);
      } else {
        if (mm.color === 'b') setMood(mm, 'love', 1.5);
        if (mm.color === 'r') setMood(mm, 'joy', 1.5);
        startSeg(mm, sid, to, V0());
        logEv('branchTurn', { side: dir, color: mm.color });
      }
    }, { onStart: dir });
    if (dir === 'X') { ps.open = 1; AU.split(); }
  },
  wind(m, sid, boost, how) {
    const S = L.S, W = G.wind;
    const drop = how === 'drop';
    if (drop) { W.w = Math.max(W.w, 0) + 30; W.dropT = G.t; AU.whirr(1); puff(L.sock[sid].x, L.sock[sid].y, 8); }
    else { W.w += boost ? 9 : 5.5; AU.whirr(boost ? 0.55 : 0.35); }
    logEv('wind', { drop, sid, color: m.color });

      const b = drop ? Math.abs(Math.sin(k * Math.PI * 2)) * (1 - k) * S * 0.22 : 0;
      return { x: s.x, y: s.y - S * 0.05 - b };
    }, (mm) => startSeg(mm, sid, nextNode(sid), V0()));
  },
  bell(m, sid, boost, how) {
    const love = m.color === 'b';
    ringBell('marble', { strength: boost || how === 'drop' ? 1 : 0.7, by: m.color });
    if (love) { setMood(m, 'love', 1.6); heart(m.x, m.y - L.mr, 3); }
    partAct(m, 'bell', sid, love ? 0.85 : 0.18, (s, k, a) => {

function hopTo(m, from, to) {

  const toPos = () => nodePos(to);
  m.act = {
    type: 'jump', t: 0, dur: 0.66, to, events: [],
    p0: fromPos, p2: toPos,
    p1: (a, b) => ({ x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - S * (m.color === 'r' ? 1.35 : 1.15) }),
    land: (mm) => {

function splitMarble(m, sid) {
  const ex = sideExits(sid);
  m.state = 'split'; m.vis = 0; m.act = null; m.kids = 2;
  const pid = ++G.pairSeq;
  G.pairs[pid] = { t: G.t, color: m.color, sid, arr: {} };
  for (const side of ['L', 'R']) {
    const k = makeMarble(m.color, m.idx);
    k.mini = true; k.parent = m; k.state = 'move'; k.batch = m.batch; k.pairId = pid; k.side = side;
    k.x = m.x; k.y = m.y; k.hop = 0;

function sendHome(m, oops) {

}
function landHome(m) {

    const p = m.parent;
    const i = G.marbles.indexOf(m);
    if (i >= 0) G.marbles.splice(i, 1);
    if (p) {
      p.kids--;
      if (p.kids <= 0) {
        p.state = 'wait'; p.vis = 1; p.hop = 1; p.squash = 0.6;
        AU.merge(); sparkle(L.seats[p.idx].x, L.seats[p.idx].y, 6, p.color);
        if (p.again) { p.again = false; queueLaunch(p); }
      }
    }

function arriveStation(m, st) {

  if (G.arrivals.length > 60) G.arrivals.splice(0, 20);

function checkPair(m, ride) {

  if (P.arr.L && P.arr.R) {

// ===== 7. world: rides, windmill, bells, discoveries, phases ====================
G.rides = {
  wheel: { ang: 0, w: 0, on: 0, lit: {}, music: 0, wob: 0 },
  cups: { ang: 0, w: 0, on: 0, spin: 0, music: 0, wob: 0 },
  boat: { s: 0, on: 0, music: 0, wob: 0, paddle: 0, launchT: -9 }
};
G.sockAnim = {};
G.countedBatches = new Set();
G.unlockCount = 0;
G.firstArrival = false;

function sockKick(id, k) { G.sockAnim[id] = Math.max(G.sockAnim[id] || 0, k); }
function partKick(p, k) { const s = G.parts[p]; if (s) s.kick = Math.max(s.kick || 0, k); }

// ----- ride geometry ---------------------------------------------------------------
function gondolaPos(i) {
  const g = wheelGeo(), r = G.rides.wheel;
  const th = r.ang + i * TAU / 6;
  return { x: g.x + g.R * Math.cos(th), y: g.cy + g.R * Math.sin(th) + L.S * 0.1, th };
}
function gondolaNear(target) {
  let best = 0, bd = 9;
  for (let i = 0; i < 6; i++) {
    const th = ((G.rides.wheel.ang + i * TAU / 6) % TAU + TAU) % TAU;
    const d = Math.min(Math.abs(th - target), TAU - Math.abs(th - target));
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function cupPos(i) {
  const k = lerp(1, 1.18, G.riseK), r = G.rides.cups;
  const a = r.ang + i * TAU / 3;
  const rr = L.cups.r * 0.6 * k;
  return { x: L.cups.x + rr * Math.cos(a), y: L.cups.y - L.S * 0.12 * k + rr * 0.42 * Math.sin(a), a };
}
function boatPos() {
  const b = G.rides.boat;
  const a = b.s + Math.PI;
  return { x: L.boat.x + L.pond.rx * 0.5 * Math.cos(a), y: L.boat.y + L.pond.ry * 0.42 * Math.sin(a) - L.S * 0.06, a };
}
function rideSeatPos(ride, seat) {
  if (ride === 'wheel') {
    if (seat === 'top') { const g = wheelGeo(); return { x: g.x, y: g.cy - g.R + L.S * 0.06 }; }
    const p = gondolaPos(seat | 0); return { x: p.x, y: p.y + L.S * 0.04 };
  }
  if (ride === 'cups') { const p = cupPos(seat | 0); return { x: p.x, y: p.y - L.S * 0.06 }; }
  const p = boatPos(); return { x: p.x + L.S * 0.08, y: p.y - L.S * 0.12 };
}
function rideArriveSeat(ride) {
  if (ride === 'wheel') return gondolaNear(Math.PI / 2);
  if (ride === 'cups') {
    let best = 0, bd = 1e9;
    for (let i = 0; i < 3; i++) { const p = cupPos(i); const d = dist(p.x, p.y, L.st.st_cups.x, L.st.st_cups.y); if (d < bd) { bd = d; best = i; } }
    return best;
  }
  return 0;
}
function rideCenter(ride) {
  if (ride === 'wheel') { const g = wheelGeo(); return { x: g.x, y: g.cy }; }
  if (ride === 'cups') return { x: L.cups.x, y: L.cups.y - L.S * 0.15 };
  return { x: L.boat.x, y: L.boat.y - L.S * 0.1 };
}

function activateRide(ride, info) {
  const r = G.rides[ride];
  info = info || {};
  r.on = Math.max(r.on, info.top ? 8 : 6.5);
  r.wob = 1;

    r.lit[gi] = 7;

  }
  if (ride === 'cups' && info.marble && info.marble.act) info.marble.act.seat = rideArriveSeat('cups');
  if (ride === 'boat') { AU.horn(); r.launchT = G.t; }
  AU.ride(ride);
  if (!G.cycleRides[ride]) { G.cycleRides[ride] = true; G.saveDirty = true; progress(); logEv('rideFirst', { ride }); }
  const c = rideCenter(ride);

  if (info.top) {

  checkUnlocks(info);

function firstSurprise(ride) {

  const a = G.animals.find(x => x.state !== 'ride');
  if (a) { a.state = 'go'; a.goRide = ride; a.tx = queuePos(ride).x; a.ty = queuePos(ride).y; a.speed *= 1.6; a.hopT = 0.5; }
  confetti(rideCenter(ride).x, rideCenter(ride).y, 24);

function updateRides(dt) {
  const w = G.rides.wheel;
  const wTarget = w.on > 0 ? 0.62 : (G.phase === 'night' ? 0.18 : 0);
  w.w += (wTarget - w.w) * (1 - Math.exp(-1.6 * dt));
  w.ang += w.w * dt;
  w.on = Math.max(0, w.on - dt); w.wob *= Math.exp(-3 * dt);
  for (const k in w.lit) { w.lit[k] -= dt; if (w.lit[k] <= 0) delete w.lit[k]; }
  const c = G.rides.cups;
  const cTarget = c.on > 0 ? 1.4 : (G.phase === 'night' ? 0.3 : 0);
  c.w += (cTarget - c.w) * (1 - Math.exp(-1.5 * dt));
  c.ang += c.w * dt * 0.6; c.spin += c.w * dt * 3.2;
  c.on = Math.max(0, c.on - dt); c.wob *= Math.exp(-3 * dt);
  const b = G.rides.boat;
  if (b.on > 0) { b.s += dt * 1.15; b.paddle += dt * 9; }
  else {
    const home = Math.round(b.s / TAU) * TAU;
    b.s += (home - b.s) * (1 - Math.exp(-1.2 * dt));
    b.paddle += dt * 0.5;
  }
  b.on = Math.max(0, b.on - dt); b.wob *= Math.exp(-3 * dt);
  for (const id of RIDE_IDS) G.rides[id].music = Math.max(0, G.rides[id].music - dt);
}

// ----- windmill, ribbon and shaft --------------------------------------------------------
function updateWind(dt) {
  const W = G.wind;
  const sid = socketOf('wind');
  W.gust -= dt;
  if (W.gust <= 0) {
    W.gust = R(5, 8);
    if (sid) { W.w += 3.4; G.gustFx = 1.4; AU.gust(); }
  }
  W.ang += W.w * dt;
  W.w *= Math.exp(-0.75 * dt);
  const linked = windBellLinked();
  W.tension += ((linked ? clamp(0.35 + W.w / 8, 0, 1) : 0) - (W.tension || 0)) * (1 - Math.exp(-5 * dt));

  if (d.tap) {
    const press = Math.abs(Math.sin(t * 5)) > 0.7 ? 1 : 0;
    drawHand(d.from.x + S * 0.12, d.from.y + S * 0.05, press);
  } else {
    const k = easeInOut(clamp((t - 0.45) / 1.2, 0, 1));
    const x = lerp(d.from.x, d.to.x, k), y = lerp(d.from.y, d.to.y, k) - Math.sin(k * Math.PI) * S * 0.4;
    if (t > 0.35 && t < 1.85 && d.part) { ctx.globalAlpha = fade * 0.5; drawPart(d.part, x, y - S * 0.15, lerp(G.parts[d.part].sc, 1, k), {}); ctx.globalAlpha = fade; }
    if (k > 0.98) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = S * 0.04; ctx.setLineDash([S * 0.08, S * 0.06]); ctx.beginPath(); rr(d.to.x - S * 0.5, d.to.y - S * 0.5, S, S, S * 0.16); ctx.stroke(); ctx.setLineDash([]); }
    drawHand(x + S * 0.1, y + S * 0.08, t > 0.3 && t < 1.75 ? 1 : 0);
  }
  ctx.restore();
}

// ===== 15. part display, misc animation, composition ======================================
function magnetFace() {
  const mg = socketOf('magnet'), b = branchAt();
  if (!mg || !b) return 0;
  const ex = sideExits(b);
  return mg === ex.R ? Math.PI / 2 : mg === ex.L ? -Math.PI / 2 : 0;
}
function updateParts(dt) {
  const S = L.S;
  for (const p of PART_TYPES) {
    const ps = G.parts[p];
    let tx, ty, tsc, lift = 0, rate = 13;
    if (G.drag && G.drag.part === p) {
      const d = G.drag;
      tx = d.x; ty = d.y - S * 0.3; tsc = 1.06; lift = 1; rate = 34;
      if (d.snap) { const s = L.sock[d.snap]; tx = lerp(tx, s.x, 0.6); ty = lerp(ty, s.y, 0.6); }
    } else if (G.sel && G.sel.part === p) {
      const o = G.sel.origin;
      const h = o && L.sock[o] ? { x: L.sock[o].x, y: L.sock[o].y, sc: 1 } : { x: L.trayPos[p].x, y: L.trayPos[p].y, sc: L.trayScale };
      tx = h.x; ty = h.y - S * 0.22 - Math.abs(Math.sin(G.t * 5)) * S * 0.06; tsc = Math.max(h.sc * 1.12, h.sc + 0.06); lift = 1;
    } else { const h = homeOf(p); tx = h.x; ty = h.y; tsc = h.sc; }
    const k = 1 - Math.exp(-rate * dt);
    ps.x += (tx - ps.x) * k; ps.y += (ty - ps.y) * k; ps.sc += (tsc - ps.sc) * k;
    ps.lift += (lift - ps.lift) * (1 - Math.exp(-14 * dt));
    ps.press *= Math.exp(-7 * dt); ps.kick *= Math.exp(-3.5 * dt); ps.hop = Math.max(0, ps.hop - dt * 2.4);
    ps.wig *= Math.exp(-5 * dt); ps.dent *= Math.exp(-7 * dt); ps.twang *= Math.exp(-4 * dt);
    ps.open *= Math.exp(-1.6 * dt); ps.glow *= Math.exp(-1.8 * dt);
    ps.flap += (ps.flapT - ps.flap) * (1 - Math.exp(-10 * dt));
    if (p === 'magnet') ps.face += (magnetFace() - ps.face) * (1 - Math.exp(-8 * dt));
  }
  for (const A of [G.bellAnim, G.ubellAnim]) {
    A.v -= A.swing * 42 * dt; A.v *= Math.exp(-2.2 * dt); A.swing += A.v * dt;
  }
  G.parts.bell.swing = G.bellAnim.swing;
}
function updateMisc(dt) {
  for (const k in G.sockAnim) { G.sockAnim[k] = Math.max(0, G.sockAnim[k] - dt * 2.5); if (!G.sockAnim[k]) delete G.sockAnim[k]; }
  if (placedBranch()) G.sideUnfold = Math.min(1.2, G.sideUnfold + dt * 1.6);
  G.flash = Math.max(0, G.flash - dt * 1.6);
  if (G.gustFx > 0) {
    G.gustFx -= dt;
    if (rnd() < dt * 10) addP({ k: 'leaf', x: -10, y: L.horizon + R(0, L.H - L.horizon - L.tray.h), vx: L.S * R(2, 3.5), vy: R(-0.2, 0.2) * L.S, life: L.W / (L.S * 2.2), t: 0, rot: R(TAU), s: L.S * 0.06, c: pick(['#8fd37a', '#ffc93c', '#ff8a6a']) });
  }
  if (G.phase === 'night' && G.nightT > 2.5) {
    G.fwT = (G.fwT == null ? 1 : G.fwT) - dt;
    if (G.fwT <= 0) {
      G.fwT = R(1.6, 3.2);
      const x = L.playL + R(0.12, 0.88) * (L.playR - L.playL), y = L.top + R(0.15, 0.6) * (L.horizon - L.top + L.S * 0.4);
      const n = 14, base = R(TAU);
      for (let i = 0; i < n; i++) {
        const a = base + i * TAU / n, v = L.S * R(1.1, 1.5);
        const c = DECO.bunting[i % 4];
        if (FW_STYLE === 'heart') addP({ k: 'heart', x, y, vx: Math.cos(a) * v * 0.6, vy: Math.sin(a) * v * 0.6, life: 1.3, t: 0, s: L.S * 0.08 });
        else addP({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.9, 1.3), t: 0, c, s: L.S * (FW_STYLE === 'big' ? 0.13 : 0.09) });
      }
      addP({ k: 'ring', x, y, life: 0.8, t: 0 });
      AU.pop(10 + ((rnd() * 5) | 0)); AU.sparkle();
    }
  }
  G.creases = G.creases.filter(c => G.t - c.t < 0.9);
  flushLineup();
  if (G.saveDirty && G.t - G.saveT > 2) saveNow();
  // a rare paper bird crosses the sky now and then (cosmetic)
  G.birdT = (G.birdT == null ? R(30, 70) : G.birdT) - dt;
  if (G.birdT <= 0) { G.birdT = R(45, 90); G.bird = { t: 0, y: R(0.15, 0.6) * (L.horizon - L.top) + L.top, dir: rnd() < 0.5 ? 1 : -1 }; }
  if (G.bird) { G.bird.t += dt; if (G.bird.t > 7) G.bird = null; }
}
function drawBird() {
  const b = G.bird;
  if (!b) return;
  const S = L.S, k = b.t / 7, x = b.dir > 0 ? lerp(-S, L.W + S, k) : lerp(L.W + S, -S, k), y = b.y + Math.sin(b.t * 3) * S * 0.2;
  const fl = Math.sin(b.t * 12) * 0.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(b.dir, 1);
  paper(() => { ctx.moveTo(-S * 0.2, 0); ctx.lineTo(S * 0.22, -S * 0.02); ctx.lineTo(-S * 0.05, S * 0.08); ctx.closePath(); }, '#ffffff', '#c8d6e0', { th: S * 0.02 });
  paper(() => { ctx.moveTo(-S * 0.05, 0); ctx.lineTo(S * 0.05, -S * 0.22 * fl - S * 0.05); ctx.lineTo(S * 0.1, 0); ctx.closePath(); }, '#ffc93c', '#c9921d', { th: S * 0.015, shadow: false });
  ctx.restore();
}
function drawCreases() {
  for (const c of G.creases) {
    const nx = nextNode(c.sid);
    const p = segPath(c.sid, nx);
    const k = clamp((G.t - c.t) / 0.45, 0, 1), a = 1 - clamp((G.t - c.t - 0.45) / 0.45, 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = L.S * 0.05; ctx.lineCap = 'round';
    ctx.beginPath(); strokePathPartial(p, Math.max(0.05, k)); ctx.stroke(); ctx.restore();
  }
}
function partState(p) {
  const ps = G.parts[p];
  const hop = Math.sin(ps.hop * Math.PI) * L.S * 0.25;
  return {
    lift: ps.lift * L.S * 0.16 + hop, press: ps.press, kick: ps.kick, dent: ps.dent, twang: ps.twang, open: ps.open,
    flap: ps.flap, glow: ps.glow, swing: ps.swing, face: ps.face, linked: windBellLinked(),
    tilt: Math.sin(G.t * 22) * ps.wig * 0.12
  };
}
function drawPartAt(p) {
  const ps = G.parts[p];
  const h = G.hint && G.hint.part === p && !G.drag && !G.sel;
  let bob = 0;
  if (h) { drawHintGlow(ps.x, ps.y - L.S * ps.sc * 0.1, L.S * Math.max(ps.sc, 0.7) * 0.62); bob = Math.max(0, Math.sin(G.t * 4.2)) * L.S * 0.12 * Math.max(ps.sc, 0.7); }
  const st = partState(p);
  st.lift += bob;
  drawPart(p, ps.x, ps.y, ps.sc, st);
}
function drawTrayParts() {
  const S = L.S;
  for (const p of PART_TYPES) {
    if (G.where[p] !== 'tray') continue;
    const tp = L.trayPos[p];
    if (!G.unlocked.has(p)) {
      // folded paper flap waiting to open
      const sc = L.trayScale;
      ctx.save(); ctx.translate(tp.x, tp.y); ctx.scale(sc, sc);
      paper(() => rr(-S * 0.38, -S * 0.3, S * 0.76, S * 0.6, S * 0.1), '#d9b27a', '#a87f48', { th: S * 0.04 });
      foldLine(-S * 0.38, 0, S * 0.38, 0, 0.8);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); starPath(0, 0, S * 0.08, 5, 0.5); ctx.fill();
      ctx.restore();
      continue;
    }
    const nt = G.newPart[p];
    if (nt != null && G.t - nt < 1.2) {
      const k = (G.t - nt) / 1.2;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(tp.x, tp.y); ctx.scale(L.trayScale, L.trayScale * (1 - k));
      paper(() => rr(-S * 0.38, -S * 0.3, S * 0.76, S * 0.6, S * 0.1), '#d9b27a', '#a87f48', { th: S * 0.04 });
      ctx.restore();
      if (k < 0.1) sparkle(tp.x, tp.y, 2, 'gold');
    }
    drawPartAt(p);
  }
}
function draw() {
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  LIGHTS = [];
  drawSky();
  drawBird();
  drawTable();
  drawCity();
  drawTowers();
  drawUpperBell();
  drawAvenue();
  const gridTop = L.rowY(4) - L.S * 0.45;
  const back = [
    { y: L.wheelBase, f: drawWheel }, { y: L.cups.y, f: drawCups }, { y: L.boat.y, f: drawBoat }
  ];
  for (const a of G.animals) if (a.state !== 'ride' && a.state !== 'parade' && a.state !== 'cross') back.push({ y: a.y, f: () => drawAnimal(a, a.x, a.y) });
  back.sort((a, b) => a.y - b.y);
  for (const o of back) o.f();
  for (const f of G.floats) drawFloat(f);
  drawShaft();
  drawTrack();
  drawSockets();
  drawCreases();
  for (const p of PART_TYPES) { const w = G.where[p]; if (w && L.sock[w]) drawPartAt(p); }
  drawRibbon();
  drawHill();
  drawGarage();
  drawBridge();
  for (const a of G.animals) if (a.state === 'cross') drawAnimal(a, a.x, a.y);
  for (const m of G.marbles) if (m.vis) drawMarbleShadow(m);
  if (G.hint && G.hint.tap && !G.drag) drawHintGlow(L.seats[1].x, L.seats[1].y, L.mr * 3.2);
  for (const m of G.marbles) if (m.vis) {
    let r = radiusOf(m);
    if (G.hint && G.hint.tap && m.state === 'wait') r *= 1 + Math.max(0, Math.sin(G.t * 4.2 + m.idx)) * 0.08;
    drawMarble(m, m.x, m.y, r);
  }
  drawNotes();
  drawParticles();
  drawNight();
  drawTrayParts();
  if (G.sel) drawPartAt(G.sel.part);
  if (G.drag) drawPartAt(G.drag.part);
  drawDemo();
}

// ===== 16. save / load, loop, lifecycle ================================================
function saveNow() {
  G.saveT = G.t; G.saveDirty = false;
  const placed = {};
  for (const k in G.placed) placed[k] = G.placed[k];
  const park = G.phase === 'park' || G.phase === 'night' || G.phase === 'rising';
  const d = {
    v: 1, placed, unlocked: [...G.unlocked], found: Object.assign({}, G.found), repaired: G.repaired,
    phase: park ? 'park' : 'flat', cycle: G.cycle + (G.phase === 'dawn' || G.phase === 'fold' ? 1 : 0),
    cycleRides: park || G.phase === 'flat' ? Object.assign({}, G.cycleRides) : { wheel: false, cups: false, boat: false },
    animals: G.animals.map(a => ({ sp: a.sp, ride: a.state === 'ride' ? a.ride : (a.state === 'parade' && a.flt ? a.flt.rides[0] : null), fav: a.fav })),
    specials: G.specials.slice(-4), lineup: G.lineup.slice(), visits: G.visits, runs: G.runs
  };
  G.saveOk = STORE.save(d);
  logEv('save', { ok: G.saveOk });
}
function onLayoutChanged() {
  if (!G.parts.funnel) return;
  for (const p of PART_TYPES) { const h = homeOf(p); const ps = G.parts[p]; ps.x = h.x; ps.y = h.y; ps.sc = h.sc; }
  buildBG();
}
function onParkStart() {
  if (G.animals.length < 9) spawnAnimals(9 - G.animals.length, true);
}
let lastTS = 0, rafId = 0, running = false;
function update(dt) {
  G.t += dt;
  updateMarbles(dt);
  updateRides(dt);
  updateWind(dt);
  updateNotes(dt);
  updateAnimals(dt);
  updateParade(dt);
  updateBridge(dt);
  updateParticles(dt);
  updateTrails(dt);
  updatePhase(dt);
  updateParts(dt);
  updateHint(dt);
  updateMisc(dt);
}
function frame(ts) {
  if (!running) return;
  rafId = requestAnimationFrame(frame);
  let dt = (ts - lastTS) / 1000; lastTS = ts;
  if (!(dt > 0) || dt > 0.25) dt = 0.016;
  G.frameEMA += (dt * 1000 - G.frameEMA) * 0.05;
  if (G.frameEMA > 26) G.slowT += dt; else G.slowT = Math.max(0, G.slowT - dt * 0.5);
  if (G.slowT > 3 && G.q > 0 && !G.qLock) {
    G.q--; G.slowT = 0; G.frameEMA = 16;
    L.dprCap = G.q === 1 ? 1.5 : 1;
    computeLayout();
    logEv('quality', { q: G.q, dpr: L.dpr });
  }
  dt = Math.min(dt, 0.05);
  const sdt = dt * G.timeScale;
  const steps = Math.max(1, Math.ceil(sdt / 0.034)), h = sdt / steps;
  try {
    for (let i = 0; i < steps; i++) update(h);
    draw();
  } catch (err) { G.lastError = String(err && err.stack || err); console.error(err); }
  AU.update();
}
function start() { if (running) return; running = true; lastTS = performance.now(); rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
function onVisibility() {
  if (document.hidden) { stop(); AU.suspend(); if (G.drag) onCancel({ pointerId: G.drag.pid }); saveNow(); }
  else { AU.resume(); G.slowT = 0; G.frameEMA = 16; start(); G.lastInput = G.t; }
}
function onResize() {
  if (G.drag) onCancel({ pointerId: G.drag.pid });
  if (G.sel) { const s = G.sel; G.sel = null; dropBack(s.part, s.origin, false); }
  computeLayout();
  logEv('resize', { w: L.W, h: L.H, portrait: L.portrait });
}
function init() {
  makePaperPattern();
  initClouds();
  const res = STORE.load();
  G.loadStatus = res.status;
  const d = res.data;
  const rest = shuffle(PART_TYPES.filter(p => p !== 'funnel'));
  G.trayOrder = d && d.repaired ? shuffle(PART_TYPES.slice()) : ['funnel'].concat(rest);
  computeLayout();
  if (d) {
    for (const k in d.placed) { G.placed[k] = d.placed[k]; G.where[d.placed[k]] = k; }
    G.unlocked = new Set(d.unlocked);
    G.found = d.found; G.repaired = d.repaired || Object.keys(d.placed).length > 0;
    G.cycle = d.cycle; G.cycleRides = Object.assign({ wheel: false, cups: false, boat: false }, d.cycleRides);
    G.specials = d.specials; G.lineup = d.lineup; G.visits = d.visits + 1; G.runs = d.runs;
    if (d.phase === 'park') { G.phase = 'park'; G.riseK = 1; }
    // a part on a side port needs the branch: anything inconsistent goes back to the tray
    foldInactiveSides();
  } else G.visits = 1;
  G.memFloat = G.specials.length ? G.specials[G.specials.length - 1] : null;
  initMarbles();
  initParts();
  if (d && d.animals.length) restoreAnimals(d.animals); else spawnAnimals(6, false);
  if (G.phase === 'park') onParkStart();
  bindInput();
  buildBG();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('pagehide', () => saveNow());
  G.lastProgress = 0;
  logEv('init', { load: G.loadStatus, visits: G.visits, w: L.W, h: L.H });
  start();
}
// hooks for automated checks (no visible UI)
window.__MT = {
  get G() { return G; }, get L() { return L; },
  state() {
    return {
      phase: G.phase, placed: Object.assign({}, G.placed), found: Object.assign({}, G.found), unlocked: [...G.unlocked],
      cycleRides: Object.assign({}, G.cycleRides), lineup: G.lineup.slice(), counts: rideCounts(), sky: +G.sky.toFixed(2),
      marbles: G.marbles.map(m => m.color + (m.mini ? 'm' : '') + ':' + m.state), floats: G.floats.map(f => f.key), hint: G.hint,
      repaired: G.repaired, woke: G.woke, cycle: G.cycle, runsSinceRise: G.runsSinceRise, audio: AU.state, loadStatus: G.loadStatus, saveOk: G.saveOk, err: G.lastError || null
    };
  },
  place(part, sid) { G.unlocked.add(part); const o = G.where[part]; placeFrom(part, sid, o === 'hand' ? 'tray' : o); },
  tray(part) { toTray(part, G.where[part]); },
  tapTriplets() { tapReact(L.seats[1].x, L.seats[1].y); },
  speed(k) { G.timeScale = k; },
  lockQuality(on) { G.qLock = !!on; if (on && G.q < 2) { G.q = 2; L.dprCap = 2; computeLayout(); } },
  events(type) { return G.events.filter(e => !type || e.type === type); },
  clearEvents() { G.events.length = 0; },
  unlockAll() { unlock(PART_TYPES); },
  save() { saveNow(); return G.saveOk; },
  sockPos(id) { const s = L.sock[id]; return s ? { x: s.x, y: s.y } : null; },
  partPos(p) { const s = G.parts[p]; return { x: s.x, y: s.y, sc: s.sc }; }
};
init();
</script>
