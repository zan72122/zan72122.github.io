/* ---------- effective weather from worn clothes (one consistent rule set) ----------
   sun  = hat
   cold = scarf AND no hat          (sun beats cold -> thaw priority)
   snow = cold ; boots add big flakes (cold turns rain into snow)
   rain = boots AND not cold
   rainbow = hat + boots (sun-shower) ; hat + scarf = sparkling thaw (melting x1.6)        */
function computeWeather() {
  const w = G.worn, lv = G.lv;
  const cold = w.scarf && !w.hat;
  WE.sun = w.hat ? LV[lv.hat] : 0;
  WE.snow = cold ? LV[lv.scarf] * (1 + (w.boots ? 0.45 * LV[lv.boots] : 0)) : 0;
  WE.heavy = cold && w.boots;
  WE.rain = (w.boots && !cold) ? LV[lv.boots] : 0;
  WE.rainbow = !!(w.hat && w.boots);
  WE.thaw = !!(w.hat && w.scarf);
  WE.thawLv = WE.thaw ? LV[lv.scarf] : 0;
  WE.kind = WE.rainbow ? 'rainbow' : WE.snow > 0 ? 'snow' : WE.rain > 0 ? 'rain' : WE.sun > 0 ? 'sun' : 'calm';
  WE.outfit = (w.hat ? 'H' : '') + (w.boots ? 'B' : '') + (w.scarf ? 'S' : '');
}

/* ---------- garden physics (no worn weather = no drift) ---------- */
function simGarden(dt) {
  const R = WE.rain, S = WE.snow, SUN = WE.sun;
  if (R > 0) {
    const boost = G.disc.boat ? 1 : 1.5;
    G.water += 0.035 * R * dt * boost * (G.ice > 0.6 ? 0.4 : 1);
    G.soil += 0.07 * R * dt;
    if (G.water >= 0.999) G.soil += 0.03 * R * dt;     // full pond spills into the field
  }
  if (G.water > 0.88) G.lily = Math.min(1, G.lily + dt * 0.3);   // lily pads & frogs: memento of a full pond
  if (SUN > 0) { G.water -= 0.025 * SUN * dt; G.soil -= 0.005 * SUN * dt; }
  if (WE.thaw) G.soil += 0.02 * WE.thawLv * dt;            // sparkling flakes melt into droplets
  if (S > 0) {
    G.snowCover += 0.05 * S * dt;
    if (G.water >= 0.5 && G.mound < 0.3) G.ice += 0.075 * S * dt;
    else G.mound += 0.065 * S * dt;
  }
  const warm = SUN > 0 ? SUN * (WE.thaw ? 1.6 : 1) : (R > 0 ? 0.3 * R : 0);
  let meltIn = 0;
  if (warm > 0) {
    const mc = Math.min(G.snowCover, 0.06 * warm * dt); G.snowCover -= mc; meltIn += mc * 6; G.soil += mc * 0.9;
    const mm = Math.min(G.mound, 0.05 * warm * dt); G.mound -= mm; G.water += mm * 0.6; meltIn += mm * 5;
    const mi = Math.min(G.ice, 0.085 * warm * dt); G.ice -= mi;
    if (mi > 0 && vr() < dt * 2) AU.play('crack');
  }
  G.melt += meltIn - (G.melt * 0.55 + 0.04) * dt;
  G.water = clamp(G.water, 0.03, 1); G.soil = clamp(G.soil, 0, 1);
  G.snowCover = clamp(G.snowCover, 0, 1); G.ice = clamp(G.ice, 0, 1); G.mound = clamp(G.mound, 0, 1); G.melt = clamp(G.melt, 0, 1.1);
  // waterwheel & lift (only melt water reaches the wheel channel)
  const targetV = G.melt > 0.04 ? 1.2 + G.melt * 3.2 : 0;
  G.wheelV = approach(G.wheelV, targetV, 2, dt);
  const prevA = G.wheelA; G.wheelA += G.wheelV * dt;
  if (Math.floor(G.wheelA / (TAU / 8)) !== Math.floor(prevA / (TAU / 8)) && G.wheelV > .3) AU.play('clack');
  G.wheelTurns += G.wheelV * dt / TAU;
  const prevLift = G.lift;
  if (G.wheelV > 0.4) G.lift += 0.08 * G.wheelV * dt;
  else G.lift -= 0.04 * dt;
  G.lift = clamp(G.lift, 0, 1);
  if (G.lift > 0.3 && G.wheelV > 0.4) discover('wheel', L.wheel.x, L.wheel.y);
  if (G.lift >= 1 && prevLift < 1) onLiftTop();
  if (G.lift < 0.15) G.liftTopDone = false;
  if (G.memento.fountain) G.fountain = Math.min(1, G.fountain + dt);

  // strawberries: rain -> leaves & white flowers; sun + wet soil -> plump red berries; sun + dry soil -> thirsty (never shrinks)
  let ripeCount = 0;
  for (const p of G.plants) {
    if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 1.5);
    if (p.taken) continue;
    if (S > 0) { p.frost = approach(p.frost, 1, 1.5, dt); continue; }
    p.frost = approach(p.frost, 0, .8, dt);
    if (p.ripe) { ripeCount++; p.thirst = approach(p.thirst, 0, 2, dt); continue; }
    if (SUN > 0 && G.soil > 0.2) {
      const rate = 0.085 * SUN * (p.pollen > 0 ? 1.7 : 1) * (0.85 + p.var * 0.3);
      p.g += rate * dt; G.soil -= 0.012 * SUN * dt;
      p.thirst = approach(p.thirst, 0, 3, dt);
      if (p.g >= 1) { p.g = 1; p.ripe = true; p.pop = 1; AU.play('pop'); const pp = plantPos(p); burst(pp.x, pp.y - 1.5 * u, 'sparkle', 8, C.berry); onBerryRipe(p); }
    } else if (SUN > 0) {
      p.thirst = approach(p.thirst, 1, 1.2, dt);
      if (vr() < dt * 0.5) puff(plantPos(p).x + vrr(-1, 1) * u, plantPos(p).y + 0.5 * u, C.soilDry);
    } else if (R > 0) {
      p.thirst = approach(p.thirst, 0, 2, dt);
      if (p.g < 0.4) p.g = Math.min(0.4, p.g + 0.04 * R * dt);
    }
    if (WE.rainbow && p.rainbowBloom < 1 && G.disc.rainbow) p.rainbowBloom = Math.min(1, p.rainbowBloom + dt * 0.3);
    if (p.pollen > 0) p.pollen = Math.max(0, p.pollen - dt * 0.05);
  }
  if (ripeCount > 0) { if (G.ripeSince < 0) G.ripeSince = simT; } else G.ripeSince = -1;
  if (!G.cakeDone && G.mode === 'garden' && baseReady() && topValve()) checkCake();
  // animal joy relaxes slowly
  for (const k in G.joy) G.joy[k] = Math.max(0, G.joy[k] - dt * 0.04);
}

function plantPos(p) { const q = L.plants[p.id]; return { x: q.x, y: q.y }; }
function anyRipe() { return G.plants.some(p => p.ripe && !p.taken); }

/* ---------- discoveries ---------- */
const DISC_LIST = ['boat', 'berry', 'skate', 'rainbow', 'wheel', 'sled', 'castle'];
let showUntil = 0;   // discovery "show" in progress -> guide waits
function discover(k, x, y) {
  if (G.disc[k]) return false;
  G.disc[k] = simT; STAMPS[k] = 1; logEv('discover:' + k);
  AU.play('success');
  burst(x, y, 'star', 18, C.gold);
  burst(x, y, 'blot', 6, pick([C.pink, C.gold, C.sky, C.leaf]));

/* ---------- cargo: ingredients first, then toppings ---------- */

}

}

  if (!c) return;
  const gp = giftPilePos();
  flyItem(c.gift ? 'gift:' + via : (c.item || c.top), x, y, () => {
    releaseCargo(c);
    if (c.gift) { G.gifts.push(via); G.jobs[via] = (G.jobs[via] || 0) + 1; if (G.jobs[via] === 1) addMemento(via); AU.play('pop'); burst(gp.x, gp.y, 'sparkle', 8, C.gold); logEv('deliver:gift:' + via); return; }

    else addTopping(c.top, via);
    G.jobs[via] = (G.jobs[via] || 0) + 1;
    if (G.jobs[via] === 1) addMemento(via);
    catReceive(c.item ? 'item' : 'top');
    logEv('deliver:' + (c.item || c.top) + ':' + via);
    checkCake();

}
function giftPilePos() { return { x: L.pedestal.x - 6 * u * CS(), y: L.castle.y + 0.4 * u }; }

  G.tops.push({ kind, via }); G.cakePop = 1; logEv('top:' + kind);
}

function checkCake() {

  if (!G.cakeDone && cakeReady() && G.mode === 'garden') {
    G.cakeDone = true; G.cakePop = 1;
    logEv('cakeDone');
    AU.play('fanfare');
    burst(L.lift.x, liftY() - 4 * u, 'star', 16, C.gold);
    burst(L.lift.x, liftY() - 4 * u, 'confetti', 24);

function onLiftTop() {
  AU.play('ding');
  logEv('liftTop');

  if (!G.liftTopDone && !G.cakeDone && G.mode === 'garden') {
    G.liftTopDone = true;
    setTimeoutSim(0.8, () => {

      addTopping('cream', 'lift');
      AU.play('sparkle'); burst(L.lift.x, L.lift.yt - 3 * u, 'sparkle', 14, C.pink); burst(L.lift.x, L.lift.yt - 3 * u, 'blot', 3, C.cream);
      catReceive('top'); checkCake();

/* sim-time timers (paused while hidden) */
const TIMERS = [];
function setTimeoutSim(sec, fn) { TIMERS.push({ t: simT + sec, fn }); }
function runTimers() {
  for (let i = TIMERS.length - 1; i >= 0; i--) {
    if (TIMERS[i].t <= simT) { const f = TIMERS[i].fn; TIMERS.splice(i, 1); try { f(); } catch (e) { console.warn(e); } }
  }
}

/* ---------- weather levels: tapping a worn item strengthens; slowly relaxes ---------- */
function intensify(k) {
  if (!G.worn[k]) return;
  const was = G.lv[k];
  if (G.lv[k] < 3) G.lv[k]++;
  G.lvT[k] = simT;
  computeWeather();
  AU.play('intensify', G.lv[k]);
  fairyPose('power');
  // animals who love this weather get happier with every tap
  const fav = { hat: ['hedge', 'cat'], boots: ['duck'], scarf: ['rabbit'] }[k] || [];
  for (const a of fav) cheerAnimal(a, 0.6);
  if (was === 3) weatherFlare(k);
  logEv('intensify:' + k + ':' + G.lv[k]);
}
function relaxLevels() {
  for (const k of CLOTHES) if (G.lv[k] > 1 && simT - G.lvT[k] > 14 && !(hint.target && hint.target.k === k)) { G.lv[k]--; G.lvT[k] = simT; computeWeather(); }
}
function cheerAnimal(a, amt) {
  G.joy[a] = Math.min(3, (G.joy[a] || 0) + amt);
  const pos = animalPos(a); if (!pos) return;
  burst(pos.x, pos.y - 4 * u, 'heart', 1 + Math.floor(G.joy[a]), C.rose);
  if (a === 'duck') duck.flap = 1; else if (a === 'rabbit') rabbit.happy = 1.5; else if (a === 'cat') cat.jump = Math.max(cat.jump, 0.7); else if (a === 'hedge') hedge.joyT = 1;
}
/* ===================== actors: autonomous animals & the fairy ===================== */
// Anchors are recomputed from the layout every frame, so rotation/resizing never breaks a walk.
function moundH() { return G.mound * (L.portrait ? 7.5 : 9) * u; }
function waterRX() { return L.pond.rx * (0.42 + 0.58 * G.water); }
function waterSurfY() { return L.pond.y + (1 - G.water) * L.pond.ry * 0.35; }
function liftY() { return lerp(L.lift.yb, L.lift.yt, G.lift); }
function A(n) {
  if (Array.isArray(n)) return n;
  const P = L.pond;
  switch (n) {
    case 'rHome': return [L.rabbitHome.x, L.rabbitHome.y];
    case 'pantry': return [L.pantry.x + 2.5 * u, L.pantry.y + 2.6 * u];
    case 'pantryDoor': return [L.pantry.x + 1.5 * u, L.pantry.y + 2.4 * u];
    case 'iceL': return [P.x - P.rx * 0.82, P.y + P.ry * 0.35];
    case 'iceFar': return [P.x - P.rx * 0.6, P.y + P.ry * 0.05];
    case 'iceMid': return [P.x, P.y + P.ry * 0.45];
    case 'iceNear': return [P.x + P.rx * 0.62, P.y + P.ry * 0.1];
    case 'moundL': return [P.x - P.rx * 0.55, P.y + P.ry * 0.3];
    case 'moundTop': return [P.x, P.y + P.ry * 0.2 - moundH()];
    case 'moundR': return [P.x + P.rx * 0.7, P.y + P.ry * 0.35];
    case 'dock': return [L.dock.x, L.dock.y + 0.8 * u];
    case 'frontL': return [P.x - P.rx * 0.85, L.shoreFront];
    case 'frontR': return [P.x + P.rx * 0.85, L.shoreFront];
    case 'hHome': return [L.hedgeHome.x, L.hedgeHome.y];
    case 'kitchen': return [L.cat.x, L.cat.y];
    case 'stairsB': return [L.stairs.x0, L.stairs.y0];
    case 'stairsT': return [L.stairs.x1, L.stairs.y1];
    case 'pedestal': return [L.pedestal.x + 4.5 * u, L.pedestal.y + 0.5 * u];
  }
  return [W / 2, H / 2];
}
function routePts(r) { return r.map(A); }
function routeLen(r) { const p = routePts(r); let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s; }
function routePos(r, t) {
  const pts = routePts(r), n = pts.length; if (n === 1) return pts[0];
  let total = 0; const seg = [];
  for (let i = 1; i < n; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }

    if (k <= seg[i] || i === seg.length - 1) { const f = seg[i] > 0 ? clamp(k / seg[i], 0, 1) : 1; const dx = pts[i + 1][0] - pts[i][0]; return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f), Math.abs(dx) < 0.5 ? 0 : (dx < 0 ? -1 : 1)]; }

/* generic walker: e.route (anchor names or [x,y]), e.rt 0..1, e.speed in u/s */
function walk(e, route, speedU, next) { e.route = route; e.rt = 0; e.speed = speedU; e.onArrive = next; }

  if (e.rt >= 1) { const f = e.onArrive; e.route = null; e.onArrive = null; if (f) f(); }
  return true;
}
function restAfter(via) { return (G.jobs[via] || 0) <= 1 ? 10 : 24; }

/* ---------------- duck & boat ---------------- */
const duck = { state: 'sleep', t: 0, p: 0.3, cargo: null, rest: 0, flap: 0, face: 1, prev: null, peek: 0, play: 0 };
function duckSet(s) { duck.prev = duck.state; duck.state = s; duck.t = 0; }
function duckPos() {
  const P = L.pond;
  const x = lerp(L.boatFar.x, L.boatNear.x, duck.p) + (duck.state === 'play' ? Math.sin(duck.play) * P.rx * 0.14 : 0);
  if (duck.state === 'sleep') {
    const lift = clamp((G.water - 0.12) / 0.38, 0, 1);  // boat side starts lifting as water rises
    return { x, y: P.y + P.ry * 0.38 - lift * 0.6 * u, tilt: -0.2 + lift * 0.14, float: 0 };
  }

}
function duckUpdate(dt) {

/* fairy anchor points (rest pose; used for hit boxes too) */
function fairyPt(x, y) { const k = u * FS(); return { x: L.fairy.x + x * k, y: L.fairy.y + y * k }; }
function wornAnchor(k) {
  const fu = u * FS();
  if (k === 'hat') { const p = fairyPt(0, -23.4); return { x: p.x, y: p.y, r: 6.5 * fu }; }
  if (k === 'scarf') { const p = fairyPt(0, -15.4); return { x: p.x, y: p.y, r: 5 * fu }; }
  const p = fairyPt(0, -1.6); return { x: p.x, y: p.y, r: 5 * fu };
}

function poseParams(F, t) {
  const p = { aL: 0.32 + Math.sin(t * 1.3) * 0.05, aR: 0.32 + Math.sin(t * 1.3 + 1) * 0.05, lean: Math.sin(simT * 0.8) * 0.03, tilt: Math.sin(simT * 0.6) * 0.05, jump: 0, spin: 1, mouth: 'smile', eyes: 'open', shiver: 0, look: null };

  if (pose.endsWith('2')) { pose = pose.slice(0, -1); mirrorSide = -1; }
  const pt = F.poseT;
  switch (pose) {
    case 'bounce': p.aL = p.aR = 1.2; p.mouth = 'open'; break;
    case 'mirror': { const s = L.mirror.x > L.fairy.x ? 1 : -1; p.lean = 0.12 * s; p.tilt = 0.2 * s; if (s > 0) { p.aR = 2.3; p.aL = 0.5; } else { p.aL = 2.3; p.aR = 0.5; } p.eyes = 'happy'; p.look = [L.mirror.x, L.mirror.y]; break; }
    case 'brim': p.aR = 2.85; p.aL = 0.95; p.tilt = 0.14; p.eyes = 'happy'; break;
    case 'stomp': p.jump = pt < 1.2 ? Math.abs(Math.sin(pt * 7)) * 1.4 : 0; p.aL = p.aR = 1.35; p.mouth = 'open'; break;
    case 'hug': p.aL = p.aR = -0.55; p.shiver = pt < 1.6 ? Math.sin(pt * 40) * 0.12 : 0; p.tilt = -0.1; p.eyes = 'happy'; break;
    case 'arms': p.aL = p.aR = 2.55 + Math.sin(pt * 6) * 0.1; p.jump = Math.max(0, Math.sin(pt * 4)) * 0.8; p.mouth = 'open'; p.eyes = 'happy'; break;
    case 'twirl': p.spin = pt < 1.4 ? Math.cos(pt * 9) : 1; p.aL = p.aR = 1.6; p.mouth = 'open'; break;
    case 'catch': p.aL = p.aR = 2.1 + Math.sin(pt * 5) * 0.15; p.look = [L.fairy.x, 0]; p.mouth = 'open'; break;
    case 'spin': p.spin = pt < 1.6 ? Math.cos(pt * 12) : 1; p.aL = p.aR = 2.8; p.jump = pt < 1.6 ? Math.sin(pt / 1.6 * PI) * 1.5 : 0; p.mouth = 'open'; p.eyes = 'happy'; break;
    case 'power': p.aR = 3.0; p.aL = 0.8; p.jump = Math.max(0, Math.sin(pt * 5)) * 0.6; p.mouth = 'open'; break;
    case 'cheer': p.aL = p.aR = 2.6; p.jump = Math.abs(Math.sin(pt * 5)) * 1.6 * Math.max(0, 1 - pt / 2); p.mouth = 'open'; p.eyes = 'happy'; break;
    case 'wave': p.aR = 2.4 + Math.sin(pt * 12) * 0.45; p.aL = 0.4; p.mouth = 'open'; p.eyes = 'happy'; break;
    case 'curtsy': p.jump = -Math.sin(Math.min(pt, 1.2) / 1.2 * PI) * 0.7; p.aL = p.aR = 0.75; p.tilt = 0.15; p.eyes = 'happy'; break;
  }
  if (mirrorSide < 0) { const a = p.aL; p.aL = p.aR; p.aR = a; p.tilt = -p.tilt; p.lean = -p.lean; }
  // pleading: reach toward the wanted garment
  if (F.plead > 0.01 && (F.pose === 'idle')) {
    const sh = fairyPt(0, -15);
    const th = Math.atan2(-(F.reachX - sh.x), F.reachY - sh.y);
    const reachL = clamp(th, -0.5, 2.6), reachR = clamp(-th, -0.5, 2.6);

}
function drawFairy() {
  const F = fairy, fs = FS(), k = u * fs;
  const p = poseParams(F, simT);
  const bob = Math.sin(simT * 2.1) * 0.35;
  const b = F.bounce, sq = Math.sin((1 - b) * PI * 3) * b * 0.16;
  const sx = (1 + sq) * p.spin, sy = 1 - sq;
  const fx = L.fairy.x + p.shiver * k, fy = L.fairy.y - (p.jump + 0.6 + bob) * k;
  // shadow
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#6a7a4a'; ctx.beginPath(); ctx.ellipse(L.fairy.x, L.fairy.y + 0.2 * k, 5 * k * (1 - p.jump * 0.1), 1 * k, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(fx, fy); ctx.rotate(p.lean); ctx.scale(sx, sy); ctx.translate(-fx, -fy);
  const P = (x, y) => [fx + x * k, fy + y * k];
  // wings
  const fl = Math.sin(simT * 9) * 0.12;
  let q = P(-1, -14.4); dArtP('fWing', q[0], q[1], 0, 3.6, fs, -0.35 - fl, 0.95, false);
  q = P(1, -14.4); dArtP('fWing', q[0], q[1], 0, 3.6, fs, 0.35 + fl, 0.95, true);
  // back hair
  const ht = p.tilt;
  q = P(0, -20.2); dArt('fHairBack', q[0], q[1], fs, ht);
  // legs + boots
  for (const sd of [-1, 1]) {
    q = P(sd * 1.15, -2.4);
    if (G.worn.boots && !dragOwns('boots')) dArtP('bootW', q[0] + (sd > 0 ? 0 : 0), q[1] + 1.2 * k, 0, 0, fs * (1 + clothPop('boots') * 0.25), 0, 1, sd < 0);
    else dArt('fLeg', q[0], q[1], fs, 0, 1, sd < 0);
  }
  // dress
  q = P(0, -9.6); dArt('fDress', q[0], q[1], fs);
  // scarf tails behind the head, band at the neck
  if (G.worn.scarf && !dragOwns('scarf')) {
    const pop = clothPop('scarf');
    q = P(1.6, -14.6); dArtP('scarfTail', q[0], q[1], 0, -2.3, fs * (1 + pop * .2), 0.15 + Math.sin(simT * 3) * 0.08 + (WX.snow > 0.3 ? 0.1 : 0));
    q = P(0, -15.5); dArt('scarfW', q[0], q[1], fs * (1 + pop * 0.25), 0, 1, false, null, 1 - pop * 0.15);
  }
  // head
  q = P(0, -20.2);
  ctx.save(); ctx.translate(q[0], q[1]); ctx.rotate(ht); ctx.translate(-q[0], -q[1]);

function drawFairyFace(x, y, k, p) {
  const F = fairy;
  let ex = F.eyeX, ey = F.eyeY;
  if (p.look) { const dx = p.look[0] - x, dy = p.look[1] - y, d = Math.max(1, Math.hypot(dx, dy)); ex = dx / d; ey = dy / d; }

function drawCat() {
  const K = cat, ks = KS(), k = u * ks;
  const jy = Math.abs(Math.sin(K.jump * PI * 1.5)) * K.jump * 2.2 * k + Math.max(0, G.joy.cat - 1) * Math.abs(Math.sin(simT * 5)) * 0.4 * k;
  const walking = !!K.route; const wb = walking ? Math.abs(Math.sin(simT * 10)) * 0.4 * k : 0;
  const x = K.x, y = K.y - jy - wb, f = K.face < 0;
  // shadow
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#5a6a3a'; ctx.beginPath(); ctx.ellipse(K.x, K.y + 0.2 * k, 2.4 * k, 0.6 * k, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  dArtP('catTail', x + (f ? 1.6 : -1.6) * k, y - 1.5 * k, 0, 2.3, ks, (f ? 1 : -1) * (0.3 + Math.sin(simT * 2.4) * 0.25), 1, !f);
  dArt('catBody', x, y - 4 * k + 4 * k, ks, 0, 1, !f);
  // head (looks toward target)
  const hx = x, hy = y - 6.4 * k;
  const ang = Math.atan2(K.lookY - hy, K.lookX - hx);
  const tilt = clamp(Math.sin(ang) * 0.15, -0.15, 0.15) * (f ? -1 : 1) + Math.sin(simT * 1.2) * 0.04;
  dArt('catHead', hx, hy, ks, tilt, 1, !f);
  // eyes follow the gaze target
  const ex = Math.cos(ang) * 0.3 * k, ey = Math.sin(ang) * 0.25 * k;
  ctx.fillStyle = '#3e3a3e';
  const happy = K.happy > 0.5 || K.jump > 0.3;
  for (const sd of [-1, 1]) {
    const cx = hx + sd * 0.85 * k, cy = hy - 0.2 * k;
    if (happy) { ctx.strokeStyle = '#3e3a3e'; ctx.lineWidth = Math.max(1, 0.2 * k); ctx.beginPath(); ctx.arc(cx, cy + 0.2 * k, 0.4 * k, PI * 1.1, PI * 1.9); ctx.stroke(); }
    else { ctx.beginPath(); ctx.ellipse(cx + ex, cy + ey, 0.3 * k, 0.42 * k, 0, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + ex - 0.1 * k, cy + ey - 0.15 * k, 0.11 * k, 0, TAU); ctx.fill(); ctx.fillStyle = '#3e3a3e'; }
  }
  // arms: bowl + whisk while stirring, raised when holding the cake, reaching out for a berry
  if (K.hold === 'cake') {
    dArtP('catArm', x - 1.5 * k, y - 4 * k, 0, -1.2, ks, 2.7); dArtP('catArm', x + 1.5 * k, y - 4 * k, 0, -1.2, ks, -2.7, 1, true);
    drawCake(x, y - 9.6 * k, 0.8, 1);
  } else if (K.hold === 'berry') {
    dArtP('catArm', x + (f ? -1.5 : 1.5) * k, y - 4 * k, 0, -1.2, ks, (f ? 1 : -1) * 1.6, 1, !f);
    dArt('berry', x + (f ? -3.4 : 3.4) * k, y - 4.4 * k, 0.8 * ks, 0, 1, false, 'r');
  } else if (K.can > 0.3) {
    dArtP('catArm', x + (f ? -1.5 : 1.5) * k, y - 4 * k, 0, -1.2, ks, (f ? 1 : -1) * 2.4, 1, !f);
    dArt('wateringCan', x + (f ? -3 : 3) * k, y - 7.6 * k + Math.sin(simT * 6) * 0.2 * k, ks * K.can, (f ? 0.4 : -0.4), 1, f);
  } else if (K.reach > 0.2) {
    dArtP('catArm', x - 1.5 * k, y - 4 * k, 0, -1.2, ks, 1.2 + K.reach * 0.6); dArtP('catArm', x + 1.5 * k, y - 4 * k, 0, -1.2, ks, -1.2 - K.reach * 0.6, 1, true);
    dArt('bowl', x, y - 3 * k, ks);
  } else {
    dArt('bowl', x + (f ? -1.2 : 1.2) * k, y - 2.6 * k, ks);
    const st = K.state === 'stir' ? K.stir : 0;
    dArtP('whisk', x + (f ? -1.2 : 1.2) * k + Math.cos(st) * 0.7 * k, y - 3.8 * k + Math.sin(st) * 0.25 * k, 0, 1, ks, Math.cos(st) * 0.3);

/* ---------- the cake (built live from the state) ---------- */
function cakeStage() { return Math.round(Math.min(G.delivered.length, G.need.items) / G.need.items * 4); }
function drawCake(x, y, s, mode) {
  // y = bottom of the plate
  const k = u * s * (1 + (G.cakePop || 0) * 0.12);
  if (G.cakePop > 0) G.cakePop = Math.max(0, G.cakePop - 0.02);
  const st = cakeStage();
  // plate
  ctx.globalAlpha = 0.95; ctx.fillStyle = '#fbf6ec'; ctx.beginPath(); ctx.ellipse(x, y, 3.6 * k, 0.9 * k, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = C.pinkDeep; ctx.globalAlpha = 0.6; ctx.lineWidth = Math.max(1, 0.15 * k); ctx.stroke();
  ctx.globalAlpha = 1;
  if (st === 0 && G.berriesIn === 0 && G.tops.length === 0) { // empty plate with a little bowl of batter-to-be
    ctx.fillStyle = '#f6e8cc'; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.ellipse(x, y - 0.4 * k, 1.6 * k, 0.5 * k, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; return;
  }
  const layers = Math.max(1, st >= 4 ? 3 : st >= 2 ? 2 : 1);
  const lh = 1.25 * k, rw = 2.9 * k;
  let top = y - 0.2 * k;
  for (let i = 0; i < layers; i++) {
    const w = rw * (1 - i * 0.16), yb = top, yt = top - lh;
    const isCream = st >= 3;
    ctx.fillStyle = isCream ? '#fffaf2' : (st === 0 ? '#f3e2be' : '#f1cf8f');
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(x - w, yb); ctx.lineTo(x - w, yt); ctx.ellipse(x, yt, w, 0.55 * k, 0, PI, TAU); ctx.lineTo(x + w, yb); ctx.ellipse(x, yb, w, 0.55 * k, 0, 0, PI); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.45; ctx.strokeStyle = isCream ? '#d9c6a8' : '#c99a52'; ctx.lineWidth = Math.max(1, 0.12 * k); ctx.stroke();
    if (!isCream && st >= 1) { ctx.globalAlpha = 0.6; ctx.fillStyle = C.berryLight; ctx.fillRect(x - w, yb - lh * 0.55, w * 2, 0.25 * k); }
    if (isCream) { ctx.globalAlpha = 0.9; ctx.fillStyle = '#ffffff'; for (let d = 0; d < 6; d++) { const dx = x - w + (d + 0.5) / 6 * w * 2; ctx.beginPath(); ctx.ellipse(dx, yt + 0.5 * k, 0.32 * k, 0.55 * k, 0, 0, TAU); ctx.fill(); } }
    ctx.globalAlpha = 0.9; ctx.fillStyle = isCream ? '#ffffff' : '#f6dca6'; ctx.beginPath(); ctx.ellipse(x, yt, w, 0.55 * k, 0, 0, TAU); ctx.fill();
    top = yt;
  }
  ctx.globalAlpha = 1;
  const topW = rw * (1 - (layers - 1) * 0.16);
  // toppings
  const has = {}; for (const t of G.tops) has[t.kind] = (has[t.kind] || 0) + 1;
  if (has.snowsugar) { ctx.fillStyle = '#ffffff'; for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.arc(x + Math.cos(i * 2.39) * topW * 0.85 * ((i % 5) / 5 + 0.2), top + Math.sin(i * 2.39) * 0.4 * k, 0.12 * k, 0, TAU); ctx.fill(); } }
  if (has.sprinkle) { for (let i = 0; i < 14; i++) { ctx.fillStyle = C.rainbow[i % 6]; ctx.fillRect(x + Math.cos(i * 2.1) * topW * 0.75 * ((i % 4) / 4 + 0.25), top + Math.sin(i * 2.1) * 0.35 * k, 0.3 * k, 0.12 * k); } }
  if (has.cream) { ctx.fillStyle = '#fffdf6'; ctx.strokeStyle = '#e1d2b8'; ctx.lineWidth = 1; for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; const cx = x + Math.cos(a) * topW * 0.75, cy = top + Math.sin(a) * 0.38 * k; ctx.beginPath(); ctx.arc(cx, cy - 0.15 * k, 0.38 * k, 0, TAU); ctx.fill(); ctx.stroke(); } }
  // strawberries on top
  const nb = Math.min(8, G.berriesIn);
  for (let i = 0; i < nb; i++) { const a = PI * 0.15 + i / Math.max(1, nb) * PI * 1.7; dArt('berry', x + Math.cos(a) * topW * 0.6, top - 0.3 * k + Math.sin(a) * 0.3 * k, s * 0.45, 0, 1, false, 'r'); }
  if (has.flower) for (let i = 0; i < 3; i++) dArt('icon_flower', x - topW + (i + 0.5) * topW * 0.66, top + lh * 0.9, s * 0.28);
  if (has.icecandy) for (let i = 0; i < 2; i++) dArt('icon_icecandy', x + (i ? 0.9 : -0.9) * k, top - 0.9 * k, s * 0.3, (i ? .2 : -.2));
  const candles = (has.candle || 0) + (G.cakeDone ? 1 : 0);
  for (let i = 0; i < Math.min(3, candles); i++) {
    const cx = x + (i - (Math.min(3, candles) - 1) / 2) * 1.1 * k;
    dArt('icon_candle', cx, top - 1 * k, s * 0.42);
    if (G.cakeDone || mode) { softDot(ctx, cx, top - 1.75 * k, 1 * k, '#ffe9a0', 0.4 + 0.2 * Math.sin(simT * 12 + i)); }
  }
}

/* ---------------- hit testing ---------------- */

    if (dist(x, y, L.camera.x, L.camera.y) < Math.max(56, 6 * u)) return { kind: 'camera' };

    if (G.party.slicesLeft > 0 && dist(x, y, ct.x, ct.y) < Math.max(56, 6.5 * u)) return { kind: 'cake' };
  }
  if (G.mode === 'gate') {
    const c = L.castle;
    if (x > c.x - c.w * 0.62 && x < c.x + c.w * 0.62 && y > c.y - c.h * 1.05 && y < L.terraceFront + 2 * u) return { kind: 'gate' };
  }

  let best = null, bd = 1e9;
  for (const k of CLOTHES) {
    if (G.worn[k] && !dragOwns(k)) {
      const a = wornAnchor(k); const r = Math.max(38, a.r); const d = dist(x, y, a.x, a.y);
      if (d < r && d < bd) { bd = d; best = { kind: 'worn', k }; }
    } else if (!G.worn[k] && !dragOwns(k)) {
      const s = shelfPos(k); const r = Math.max(46, L.itemSize * 0.62); const d = dist(x, y, s.x, s.y);

    for (const p of G.plants) if (p.ripe && !p.taken) { const b = berryPos(p); const d = dist(x, y, b.x, b.y); if (d < bd) { bd = d; bp = p; } }
    if (bp) return { kind: 'berry', p: bp };

  cancelAllDrags();
  PS.length = 0; for (const k in PCOUNT) PCOUNT[k] = 0;
  logEv('resize:' + W + 'x' + H);
}
let resizeT = 0;
function scheduleResize() { clearTimeout(resizeT); resizeT = setTimeout(() => { resize(); if (!running) renderOnce(); }, 120); }

function smoothWeather(dt) {
  const tr = WE.rain > 0 ? Math.min(1, 0.45 + WE.rain * 0.3) : 0;
  const ts = WE.snow > 0 ? Math.min(1, 0.45 + WE.snow * 0.28) : 0;
  const tsun = WE.sun > 0 ? Math.min(1, 0.55 + WE.sun * 0.2) : 0;
  WX.rain = approach(WX.rain, tr, 4, dt);
  WX.snow = approach(WX.snow, ts, 3, dt);
  WX.sun = approach(WX.sun, tsun, 3, dt);
  WX.rainbow = approach(WX.rainbow, WE.rainbow ? 1 : 0, WE.rainbow ? 0.7 : 1.1, dt);
  WX.grey = approach(WX.grey, WE.rain > 0 && !WE.sun ? 1 : WE.snow > 0 ? 0.35 : WE.rain > 0 ? 0.25 : 0, 3, dt);
  WX.cloud = approach(WX.cloud, (WE.rain > 0 || WE.snow > 0) ? 1 : WE.kind === 'calm' ? 0.4 : 0.15, 2, dt);
  WX.thaw = approach(WX.thaw, WE.thaw ? 1 : 0, 3, dt);
}
function update(dt) {
  simT += dt; G.modeT += dt;
  runTimers();
  relaxLevels();
  smoothWeather(dt);
  if (!pageTurn.on) {
    simGarden(dt);
    if (G.mode !== 'party') { duckUpdate(dt); rabbitUpdate(dt); hedgeUpdate(dt); }
    catUpdate(dt);
    bfUpdate(dt);
    updateGate(dt);
    updateParty(dt);
  }
  fairyUpdate(dt);
  flyUpdate(dt);
  updateClothes(dt);
  updateHint(dt);
  spawnWeather(dt);
  updateParticles(dt);
  if (wake.on) { wake.t += dt / 0.9; if (wake.t >= 1) { wake.on = false; G.wake = 1; } }
  wash.t += dt;
  // audio
  const mode = G.mode === 'party' && G.party ? G.party.type : WE.kind;
  AU.tick(mode, G.mode === 'party');
  AU.setAmb('rain', WX.rain * 0.09);
  AU.setAmb('wind', WX.snow * 0.05);
  AU.setAmb('stream', clamp(G.melt, 0, 1) * 0.08);
  AU.setAmb('crowd', G.mode === 'party' ? 0.015 : 0);
}
const DBG = {};   // test-only switches for profiling
function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (bgCanvas && !DBG.bg) ctx.drawImage(bgCanvas, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!DBG.sky) drawSky();
  drawCastleDyn(dt);
  drawCastleBloom();
  if (G.snowCover > 0.01 && snowCanvas) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = smooth(G.snowCover); ctx.drawImage(snowCanvas, 0, 0); ctx.globalAlpha = 1; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  if (!DBG.rainbow) drawRainbow();
  const partyOn = G.mode === 'party' || G.mode === 'reveal';
  if (partyOn) { drawPartyDeco(smooth(Math.min(1, G.modeT / 1.5))); drawBallroom(G.mode === 'reveal' ? G.modeT / 1.6 : 1); }
  drawTerraceDyn(dt);
  drawStreamWheelLift(dt);
  if (!DBG.pond) drawPond(dt);
  drawField(dt);
  drawParticlesLow();
  drawDecor(dt);
  // animals sorted by depth
  if (G.mode !== 'party') {
    const ents = [{ y: duckPos().y, f: drawDuck }, { y: rabbit.y, f: drawRabbit }, { y: hedge.y, f: drawHedge }, { y: cat.y, f: drawCat }];
    ents.sort((a, b) => a.y - b.y); for (const e of ents) e.f();
  } else { drawPartyFloorFx(); drawPartyCake(); drawGuests(); }
  for (const b of G.butterflies) drawButterfly(b);
  drawMirror();
  if (!DBG.fairy) drawFairy();
  drawClothItems();
  if (G.mode === 'party') dArt('camera', L.camera.x, L.camera.y + Math.sin(simT * 2) * 0.2 * u, L.portrait ? 1 : 1.2, 0, 1);
  drawLanterns();
  if (!DBG.ph) drawParticlesHigh();
  for (const f of FLY) { const p = flyPos(f); const gift = f.item.indexOf('gift:') === 0; const nm = f.item === 'berry' ? 'berry' : f.item === 'slice' ? 'slice' : gift ? 'icon_gift' : 'icon_' + f.item; dArt(nm, p[0], p[1], nm === 'berry' ? 1 : 0.9, Math.sin(f.t * 6) * 0.2, 1, false, nm === 'berry' ? 'r' : gift ? f.item.slice(5) : null); }
  if (!photoPending) { drawHintGlow(); }
  drawDragged();
  if (!photoPending) drawHintHand();
  if (pageCornerActive()) drawPageCorner(hint.target && hint.target.kind === 'page');
  drawPhotoFly(dt);
  // weather change: a wash of colour bleeding out from the fairy
  if (wash.t < 1) { const r = easeOut(wash.t) * Math.max(W, H) * 1.1; ctx.globalAlpha = 0.22 * (1 - wash.t); ctx.strokeStyle = wash.col; ctx.lineWidth = 14 * u * (1 - wash.t * 0.5); ctx.beginPath(); ctx.arc(wash.x, wash.y, r, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  // paper grain over everything
  if (paperCanvas && !DBG.paper) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = PERF.level >= 2 ? 0.7 : 1; ctx.drawImage(paperCanvas, 0, 0); ctx.globalAlpha = 1; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  if (photoPending) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); capturePhoto(); }
  // first tap: the pale page wakes up with colour from the touch point
  if (G.wake < 1) {
    const a = 0.2;
    ctx.fillStyle = 'rgba(250,244,230,' + a + ')';
    ctx.beginPath(); ctx.rect(0, 0, W, H);
    if (wake.on) ctx.arc(wake.x, wake.y, easeOut(clamp(wake.t, 0, 1)) * Math.hypot(W, H), 0, TAU, true);
    ctx.fill('evenodd');
  }
  if (G.party && G.party.flash > 0) { ctx.fillStyle = 'rgba(255,248,230,' + (0.35 * G.party.flash).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  drawPageTurn(dt);
}
function renderOnce() { try { render(0); } catch (e) { console.error(e); } }
function frame(t) {
  rafId = requestAnimationFrame(frame);
  let dt = lastFrame ? (t - lastFrame) / 1000 : 1 / 60;
  lastFrame = t;
  if (!(dt > 0)) dt = 1 / 60;
  const ft = dt * 1000;
  dt = Math.min(dt, 0.05);
  try { update(dt); render(dt); } catch (e) { console.error(e); }
  // adaptive quality: only ever steps down
  PERF.frames++;
  if (ft < 100) { PERF.acc += ft; PERF.n++; }
  if (PERF.n >= 60) { PERF.avg = PERF.acc / PERF.n; PERF.acc = 0; PERF.n = 0; if (PERF.avg > 24 && document.visibilityState === 'visible') { PERF.slowT++; if (PERF.slowT >= 3 && PERF.level < 2 && PTRS.size === 0 && !QS.has('noq')) { PERF.level++; PERF.slowT = 0; fxScale = PERF.level >= 2 ? 0.6 : 0.8; resize(); logEv('quality:' + PERF.level); } } else PERF.slowT = 0; }
}
function start() { if (running) return; running = true; lastFrame = 0; rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
function onVisibility() {
  if (document.hidden) { stop(); cancelAllDrags(); AU.suspend(); logEv('hidden'); }
  else { AU.resume(); start(); logEv('visible'); }
}

/* ---------- boot ---------- */
function boot() {
  resize();
  initClouds();
  loadAlbum();
  newDay(true);
  buildBackground();   // flower colours depend on the day
  bindInput();
  window.addEventListener('resize', scheduleResize);
  window.addEventListener('orientationchange', scheduleResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('pagehide', () => { stop(); cancelAllDrags(); AU.suspend(); });
  window.addEventListener('pageshow', () => { if (!document.hidden) { AU.resume(); start(); } });
  window.addEventListener('blur', () => cancelAllDrags());
  start();
}

/* ---------- inspection hooks for automated tests (no UI) ---------- */
window.__otenki = {
  get G() { return G; }, get WE() { return WE; }, get L() { return L; }, get EV() { return EV; }, get PERF() { return PERF; },
  get hint() { return { kind: hint.target && hint.target.kind, k: hint.target && hint.target.k, x: hint.tx, y: hint.ty, demo: hint.demoT > 0 }; },
  dbg: DBG,
  get particles() { return PS.length; }, get simT() { return simT; },
  actors() { return { duck: { state: duck.state, p: duck.p, cargo: duck.cargo }, rabbit: { state: rabbit.state, gear: rabbit.gear, x: rabbit.x, y: rabbit.y }, hedge: { state: hedge.state }, cat: { state: cat.state, x: cat.x, y: cat.y, hold: cat.hold }, butterflies: G.butterflies.length }; },
  spots() {
    const o = { shelf: {}, worn: {}, berries: [], cat: { x: cat.x, y: cat.y - 4 * u }, gate: { x: L.gate.x, y: L.gate.y - L.gate.h * 0.5 }, fairy: fairyCenter(), camera: L.camera, cake: G.mode === 'party' ? partyCakePos() : null, page: { x: L.pageCorner.x - L.pageCorner.s * 0.4, y: L.pageCorner.y - L.pageCorner.s * 0.4 } };
    for (const k of CLOTHES) { o.shelf[k] = shelfPos(k); o.worn[k] = wornAnchor(k); }
    for (const p of G.plants) if (p.ripe && !p.taken) o.berries.push(berryPos(p));
    if (G.party) o.guests = G.party.guests.map(g => ({ type: g.type, x: g.x, y: g.y - 2.5 * u, served: g.served }));
    return o;
  },
  step(sec) { const n = Math.ceil(sec / 0.05); for (let i = 0; i < n; i++) update(0.05); renderOnce(); },
  set(obj) { Object.assign(G, obj); },
  wear(k, on) { if (on) equip(k); else unequip(k); },
  newDay() { startPageTurn(); },
  // test-only: perform what the glowing target asks for (simulates a child following the guide)
  autoAct() {
    const t = hint.target; lastInput = simT; if (!t) return 'none';
    switch (t.kind) {
      case 'cloth': clothFly.push({ k: t.k, x0: shelfPos(t.k).x, y0: shelfPos(t.k).y, t: 0, dur: 0.2, mode: 'wear' }); break;
      case 'remove': unequip(t.k); break;
      case 'worn': intensify(t.k); break;
      case 'berry': { const p = t.p; const b = berryPos(p); harvestPlant(p); flyItem('berry', b.x, b.y, () => giveBerry(), cat.x, cat.y - 4 * u, 0.4); break; }
      case 'gate': gatePush(0.25, 1); break;
      case 'cake': { const c = partyCakePos(); const g = nextUnserved(c.x, c.y); if (g) { G.party.slicesLeft--; serveGuest(g, c.x, c.y); } break; }
      case 'camera': takePhoto(); break;
      case 'page': startPageTurn(); break;
    }
    return t.kind + ':' + (t.k || '');
  },
  forceCake() { for (const it of G.order) if (!G.delivered.some(d => d.item === it) && G.delivered.length < G.need.items) G.delivered.push({ item: it, via: 'boat' }); G.berriesIn = Math.max(G.berriesIn, G.need.berries); ['candle', 'flower', 'cream'].forEach(k => { if (topsCount() < G.need.tops) addTopping(k, 'boat'); }); checkCake(); },
  photoImgs() { const o = {}; for (const k in PHOTO_IMG) o[k] = PHOTO_IMG[k].ok; return o; },
  bench(n) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); render(1 / 60); } return { ms: (performance.now() - t0) / n, particles: PS.length, sprites: SPR.size, dpr: DPR }; },
  randomAct(r) { const k = CLOTHES[Math.floor(r * 3) % 3]; if (G.worn[k]) unequip(k); else equip(k); return 'rand:' + k; },
};

boot();
})();
