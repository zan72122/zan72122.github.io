<script>
'use strict';
/* ===== 基本ユーティリティ ===== */
var TAU = Math.PI * 2, PI = Math.PI;

var QS = (function () {

  return o;
})();
var SEED = QS.seed ? (+QS.seed | 0) : ((Date.now() ^ (Math.random() * 1e9)) >>> 0);
var R = mulberry(SEED);

  lin: function (t) { return t; },

/* ===== ゲーム時計・逐次演出 ===== */
var G = { t: 0, dt: 0, scale: +(QS.speed || 1) || 1, frame: 0 };

}

var ERR = [];

    g.gain.exponentialRampToValueAtTime(v, t + a);

  nudge: function () { tone(240, 0.06, { type: 'triangle', vol: 0.12, to: 200 }); },
  clack: function (k) { var f = 260 + R() * 160; tone(f, 0.05, { type: 'square', vol: 0.04 + 0.02 * (k || 0), to: f * 0.7 }); noise(0.04, { type: 'bandpass', f: 2400, q: 3, vol: 0.13 }); },

  cast: function () { noise(0.35, { type: 'bandpass', f: 500, fto: 2600, q: 1.4, vol: 0.12 }); },
  plop: function () { tone(520, 0.14, { vol: 0.22, to: 170 }); },
  splash: function (sz) { sz = sz || 1; noise(0.22 + 0.3 * sz, { type: 'lowpass', f: 3000, fto: 400, vol: 0.14 + 0.1 * sz }); tone(240 / sz, 0.22, { vol: 0.12, to: 80 }); },
  bigSplash: function () { noise(1.1, { type: 'lowpass', f: 2600, fto: 220, vol: 0.4, a: 0.02 }); tone(110, 0.6, { vol: 0.35, to: 45 }); tone(70, 0.8, { vol: 0.25, type: 'triangle', to: 40, at: 0.05 }); },
  tink: function (k) { var b = 1400 + (k || 0) * 90 + R() * 300; tone(b, 0.16, { vol: 0.05 }); tone(b * 1.5, 0.2, { vol: 0.04, at: 0.04 }); },
  pop: function () { tone(880, 0.1, { vol: 0.26, to: 280 }); noise(0.05, { type: 'highpass', f: 2200, vol: 0.1 }); },
  supon: function () { tone(300, 0.08, { vol: 0.2, to: 900 }); tone(1100, 0.12, { vol: 0.22, to: 420, at: 0.07 }); noise(0.08, { type: 'highpass', f: 2500, vol: 0.12, at: 0.06 }); },
  boing: function () { tone(140, 0.45, { vol: 0.25, to: 420, tr: 0.5 }); tone(420, 0.3, { vol: 0.12, to: 160, at: 0.22 }); },
  slide: function () { tone(1300, 0.55, { vol: 0.1, to: 260 }); },
  fall: function () { tone(330, 0.25, { type: 'triangle', vol: 0.2, to: 90 }); noise(0.12, { type: 'lowpass', f: 700, vol: 0.18, at: 0.18 }); },
  quack: function (p) { p = p || 1; tone(520 * p, 0.12, { type: 'sawtooth', vol: 0.05, to: 380 * p }); noise(0.1, { type: 'bandpass', f: 1300 * p, q: 6, vol: 0.06 }); },

  munch: function () { noise(0.06, { type: 'bandpass', f: 900 + R() * 400, q: 3, vol: 0.08 }); },
  grow: function (k) { var f = 330 + (k || 0) * 60; tone(f, 0.22, { type: 'triangle', vol: 0.12, to: f * 1.5 }); },

  chime: function (base, n, gap) { n = n || 5; gap = gap || 0.09; for (var i = 0; i < n; i++) tone(PENTA[(base + i) % PENTA.length], 0.35, { vol: 0.09, at: i * gap }); },
  fanfare: function (kind) {
    var seqs = {
      boot: [0, 2, 4, 7], parade: [2, 3, 4, 5, 7], scale: [4, 6, 8], giant: [0, 4, 7, 8, 7, 8],
      boat: [0, 2, 4, 5, 7, 8], island: [3, 5, 7, 8, 6, 8], round: [4, 7], fest: [0, 2, 4, 7, 4, 7, 8], turtle: [1, 3, 1, 5]

/* ===== 遊びの記憶（端末内保存） ===== */
var SAVE_KEY = 'kappa-pochan-tsuribori';
var SAVE_VER = 2;

function memValidate(d) {

  for (i = 0; i < d.planters.length; i++) {
    var p = d.planters[i];
    if (!p || typeof p !== 'object' || typeof p.s !== 'number' || typeof p.x !== 'number') return null;
    if (!(p.s >= 0 && p.s <= 3) || !(p.x >= 0 && p.x <= 99)) return null;
    m.planters.push({ s: Math.floor(p.s), x: Math.floor(p.x) });
  }

      m.pumps.push(Math.floor(d.pumps[i]));

var MEM = memLoad();

/* ===== 画面配置 ===== */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var saEl = document.getElementById('sa');
var L = { W: 0, H: 0, dpr: 1 };
function layout() {

  var sB = parseFloat(cs.paddingBottom) || 0, sL = parseFloat(cs.paddingLeft) || 0;

  L.sT = sT; L.sR = sR; L.sB = sB; L.sL = sL;

  L.ds = clamp(m * 0.2, 70, 128);

    L.fc = { x: x0 + w * 0.5, y: y1 - fieldH * 0.5 };
