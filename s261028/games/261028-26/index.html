(function(){

/* ===================== 基本ユーティリティ ===================== */
var TAU=Math.PI*2, PI=Math.PI;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function sm(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function eo(t){t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);}
function eio(t){t=clamp(t,0,1);return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function eback(t){t=clamp(t,0,1);var c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function damp(a,b,k,dt){return a+(b-a)*(1-Math.exp(-k*dt));}
function hyp(x,y){return Math.sqrt(x*x+y*y);}
function wnow(){return performance.now()/1000;}
function makeRng(seed){var a=(seed>>>0)||1;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function spr(k,c){return {x:0,v:0,k:k,c:c};}
function sprStep(s,dt){s.v+=(-s.k*s.x-s.c*s.v)*dt;s.x+=s.v*dt;}
function has(arr,v){return arr.indexOf(v)>=0;}

/* ===================== 宝石色 ===================== */

  amber:'#ffb655', amberL:'#ffe3ad', amberD:'#ee9a45',

  {roofs:[COL.ruby,COL.sap,COL.emer,COL.violet],walls:[COL.cream,COL.pinkL,COL.lemonL,COL.aquaL],glow:'#ffe45e',plaza:[COL.cream,COL.pinkL,COL.lemonL,COL.aquaL]},
  {roofs:[COL.violet,COL.aqua,COL.ruby,COL.amber],walls:[COL.lemonL,COL.cream,COL.emerL,COL.pinkL],glow:'#ffc4ec',plaza:[COL.lemonL,COL.violetL,COL.cream,COL.emerL]},
  {roofs:[COL.emer,COL.amber,COL.sap,COL.pink],walls:[COL.aquaL,COL.violetL,COL.cream,COL.lemonL],glow:'#bff4ff',plaza:[COL.aquaL,COL.cream,COL.pinkL,COL.amberL]}

/* ===================== 音（Web Audio 合成） ===================== */
var AU={ctx:null,out:null,noise:null,ok:false,failed:false,voices:0,unlocked:false,tryT:-9};
function auInit(){
  if(AU.ctx||AU.failed)return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){AU.failed=true;return;}
  try{
    var c=new AC();AU.ctx=c;
    var comp=c.createDynamicsCompressor();
    comp.threshold.value=-16;comp.knee.value=14;comp.ratio.value=3.5;comp.attack.value=0.003;comp.release.value=0.25;
    var g=c.createGain();g.gain.value=0.85;g.connect(comp);comp.connect(c.destination);AU.out=g;
    var n=Math.floor(c.sampleRate*0.6),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    AU.noise=b;AU.ok=true;
  }catch(e){AU.failed=true;AU.ctx=null;AU.ok=false;}
}
function auUnlock(){
  auInit();var c=AU.ctx;if(!c)return;
  AU.tryT=wnow();
  if(c.state!=='running'){try{var p=c.resume();if(p&&p.catch)p.catch(function(){});}catch(e){}}
  if(!AU.unlocked){try{var b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);AU.unlocked=true;}catch(e){}}
}
function auSuspend(){var c=AU.ctx;if(c&&c.state==='running'){try{var p=c.suspend();if(p&&p.catch)p.catch(function(){});}catch(e){}}}
function vOK(n){
  if(!AU.ok||!AU.ctx)return false;
  // 再開待ちの間に音を溜め込まない（解放直後の1打だけは予約を許す）
  if(AU.ctx.state!=='running'&&wnow()-AU.tryT>0.7)return false;
  return AU.voices+(n||1)<=46;
}
function auT(d){return AU.ctx.currentTime+0.005+(d||0);}
function vPlay(src,t,stop){AU.voices++;var done=false;src.onended=function(){if(!done){done=true;AU.voices--;}};src.start(t);src.stop(stop);}
function envG(t,a,peak,d){var g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);return g;}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function noiseSrc(){var n=AU.ctx.createBufferSource();n.buffer=AU.noise;n.loop=true;return n;}

function sfxSmall(p){ // 小太鼓「ポン」
  if(!vOK(3))return;var c=AU.ctx,t=auT(),f0=560+(p||0)*24;
  var g=envG(t,0.003,0.36,0.2),o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(340,t+0.08);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.26);
  g=envG(t,0.002,0.11,0.09);o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(f0*2.1,t);o.frequency.exponentialRampToValueAtTime(700,t+0.05);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.14);
  var n=noiseSrc(),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=0.9;g=envG(t,0.001,0.08,0.035);n.connect(bp);bp.connect(g);g.connect(AU.out);vPlay(n,t,t+0.06);
}
function sfxBig(){ // 大太鼓「ドン」
  if(!vOK(3))return;var c=AU.ctx,t=auT();
  var g=envG(t,0.004,0.8,0.55),o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(52,t+0.16);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.64);
  g=envG(t,0.003,0.28,0.25);o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(96,t);o.frequency.exponentialRampToValueAtTime(60,t+0.2);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.32);
  var n=noiseSrc(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;g=envG(t,0.002,0.32,0.09);n.connect(lp);lp.connect(g);g.connect(AU.out);vPlay(n,t,t+0.14);
}
function sfxBell(m,vol,d){ // うさぎの鈴
  if(!vOK(2))return;var c=AU.ctx,t=auT(d),f=mtof(m);vol=vol||0.14;
  var g=envG(t,0.002,vol,0.55),o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.6);
  g=envG(t,0.001,vol*0.3,0.18);o=c.createOscillator();o.type='sine';o.frequency.value=f*2.76;o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.22);
}
function sfxHorn(m,dur,vol,d){ // 象のラッパ
  if(!vOK(3))return;var c=AU.ctx,t=auT(d),f=mtof(m);vol=vol||0.12;dur=dur||0.32;
  var o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f*0.94,t);o.frequency.linearRampToValueAtTime(f,t+0.05);
  var lfo=c.createOscillator();lfo.frequency.value=5.5;var lg=c.createGain();lg.gain.value=f*0.012;lfo.connect(lg);lg.connect(o.frequency);
  var lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.4;lp.frequency.setValueAtTime(300,t);lp.frequency.linearRampToValueAtTime(1700,t+0.06);lp.frequency.exponentialRampToValueAtTime(700,t+dur+0.1);
  var g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.035);g.gain.linearRampToValueAtTime(vol*0.85,t+dur);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.14);
  o.connect(lp);lp.connect(g);g.connect(AU.out);vPlay(o,t,t+dur+0.18);vPlay(lfo,t,t+dur+0.18);
}
function sfxFlute(m,dur,vol,d){ // ふくろうの笛
  if(!vOK(3))return;var c=AU.ctx,t=auT(d),f=mtof(m);vol=vol||0.1;dur=dur||0.4;
  var o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,t);
  var lfo=c.createOscillator();lfo.frequency.value=4.8;var lg=c.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.01,t+0.25);lfo.connect(lg);lg.connect(o.frequency);
  var g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.07);g.gain.linearRampToValueAtTime(vol*0.8,t+dur);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.18);
  o.connect(g);g.connect(AU.out);
  var n=noiseSrc(),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*2;bp.Q.value=3;var ng=c.createGain();ng.gain.setValueAtTime(0.0001,t);ng.gain.linearRampToValueAtTime(vol*0.22,t+0.04);ng.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.6+0.1);
  n.connect(bp);bp.connect(ng);ng.connect(AU.out);
  vPlay(o,t,t+dur+0.22);vPlay(lfo,t,t+dur+0.22);vPlay(n,t,t+dur+0.22);
}
function sfxCymbal(vol,d){ // 亀のシンバル
  if(!vOK(2))return;var c=AU.ctx,t=auT(d);vol=vol||0.07;
  var n=noiseSrc(),hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=5200;var g=envG(t,0.002,vol,0.95);n.connect(hp);hp.connect(g);g.connect(AU.out);vPlay(n,t,t+1.05);
  var o=c.createOscillator();o.type='square';o.frequency.value=587;var g2=envG(t,0.001,vol*0.14,0.3);o.connect(g2);g2.connect(AU.out);vPlay(o,t,t+0.34);
}
function sfxGlass(m,vol,d,len){ // ガラスの鍵盤
  if(!vOK(2))return;var c=AU.ctx,t=auT(d),f=mtof(m);vol=vol||0.12;len=len||0.9;
  var car=c.createOscillator();car.type='sine';car.frequency.value=f;
  var mod=c.createOscillator();mod.type='sine';mod.frequency.value=f*3.5;var mg=c.createGain();mg.gain.setValueAtTime(f*1.5,t);mg.gain.exponentialRampToValueAtTime(1,t+len*0.65);mod.connect(mg);mg.connect(car.frequency);
  var g=envG(t,0.003,vol,len);car.connect(g);g.connect(AU.out);vPlay(car,t,t+len+0.08);vPlay(mod,t,t+len+0.08);
}
function sfxPop(d){ // 扉が「ぱかっ」
  if(!vOK(2))return;var c=AU.ctx,t=auT(d);
  var g=envG(t,0.002,0.2,0.09),o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(480,t);o.frequency.exponentialRampToValueAtTime(1300,t+0.07);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.12);
  var n=noiseSrc(),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;g=envG(t,0.001,0.08,0.04);n.connect(bp);bp.connect(g);g.connect(AU.out);vPlay(n,t,t+0.06);
}
function sfxBoko(d){ // 飛び石が「ぼこっ」
  if(!vOK(2))return;var c=AU.ctx,t=auT(d);
  var g=envG(t,0.004,0.24,0.2),o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(105,t+0.16);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.26);
  var n=noiseSrc(),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=0.8;g=envG(t,0.003,0.08,0.16);n.connect(bp);bp.connect(g);g.connect(AU.out);vPlay(n,t,t+0.22);
}
function sfxSplash(d,vol){
  if(!vOK(1))return;var c=AU.ctx,t=auT(d);
  var n=noiseSrc(),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=0.7;var g=envG(t,0.004,vol||0.09,0.24);n.connect(bp);bp.connect(g);g.connect(AU.out);vPlay(n,t,t+0.3);
}
function sfxWhee(up,d,vol){
  if(!vOK(1))return;var c=AU.ctx,t=auT(d);
  var o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(up?380:950,t);o.frequency.exponentialRampToValueAtTime(up?950:380,t+0.45);
  var g=envG(t,0.03,vol||0.07,0.45);o.connect(g);g.connect(AU.out);vPlay(o,t,t+0.52);
}
function sfxTick(m){sfxGlass(m||88,0.035,0,0.3);}
function sfxSuccess(){ // 成功のときだけ鳴るきらめき和音
  var r=MUS.root+12,iv=[0,4,7,12,16,19];
  for(var i=0;i<iv.length;i++){sfxGlass(r+iv[i],0.1,i*0.07,0.9);}
  sfxBell(r+24,0.07,0.45);
}

/* ===================== 音楽（合奏） ===================== */
var MUS={root:60,mel:0,step:0};
var PENTA=[0,2,4,7,9];
function deg(d){var o=Math.floor(d/5),i=((d%5)+5)%5;return MUS.root+12*o+PENTA[i];}
var MELS=[
  [5,7,6,5,7,8,7,5,6,5,4,5,7,6,5,5],
  [7,6,5,6,7,7,8,7,6,5,6,7,5,6,7,5],
  [5,5,7,8,7,6,5,6,7,8,9,8,7,6,5,5],
  [8,7,5,7,8,9,8,7,5,6,7,6,5,4,5,5]
];
var CHORDS=[0,5,7,0];
var KEYS=[60,62,65,57];
function chordRoot(st){return CHORDS[Math.floor(st/4)%4];}

/* ===================== 画面レイアウト ===================== */
var cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
var W=390,H=844,DPR=1,QUAL=1;
var SA={t:0,r:0,b:0,l:0};
var LY={portrait:true,dS:{x:100,y:700,r:60},dB:{x:280,y:700,r:80},view:{x:0,y:0,w:390,h:600,cx:195,cy:300},zO:1,zBall:1};
var snapCam=true;
function readSA(){try{var s=getComputedStyle(document.getElementById('sa'));SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0;}catch(e){}}
function doLayout(){
  W=Math.max(240,Math.round(window.innerWidth||document.documentElement.clientWidth||390));
  H=Math.max(240,Math.round(window.innerHeight||document.documentElement.clientHeight||700));
  readSA();
  DPR=Math.max(0.75,Math.min(2,window.devicePixelRatio||1)*QUAL);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  var por=H>W*1.08;LY.portrait=por;
  if(por){
    var zone=clamp(H*0.27,160,330);
    var rS=Math.min(W*0.175,zone*0.4,124),rB=Math.min(W*0.225,zone*0.5,156);
    var by=H-SA.b-zone*0.5;
    LY.dS={x:Math.max(SA.l+rS*1.15+8,W*0.25),y:by+rS*0.12,r:rS};
    LY.dB={x:Math.min(W-SA.r-rB*1.08-8,W*0.73),y:by,r:rB};
    LY.view={x:0,y:SA.t,w:W,h:Math.max(200,H-SA.t-SA.b-zone*0.8)};
  }else{
    var rS2=clamp(H*0.145,58,150),rB2=clamp(H*0.185,72,186);
    LY.dS={x:SA.l+rS2*1.3+12,y:H-SA.b-rS2*1.05-8,r:rS2};
    LY.dB={x:W-SA.r-rB2*1.2-12,y:H-SA.b-rB2*0.95-8,r:rB2};
    LY.view={x:SA.l,y:SA.t,w:W-SA.l-SA.r,h:Math.max(200,H-SA.t-SA.b-rB2*0.45)};
  }
  var v=LY.view;v.cx=v.x+v.w/2;v.cy=v.y+v.h/2;
  LY.zO=Math.min(v.w/(por?440:490),v.h/520);
  LY.zBall=Math.min(v.w/400,v.h/600);
  buildSky();
  snapCam=true;
}

/* ===================== カメラ ===================== */
var cam={x:0,y:-150,z:1},camT={x:0,y:-150,z:1,k:3};
function camOverview(){var v=LY.view,z=LY.zO;return {x:0,y:110-0.46*v.h/z,z:z};}
function camApply(){var z=cam.z*DPR;ctx.setTransform(z,0,0,z,DPR*(LY.view.cx-cam.x*cam.z),DPR*(LY.view.cy-cam.y*cam.z));}
function s2w(sx,sy){return {x:(sx-LY.view.cx)/cam.z+cam.x,y:(sy-LY.view.cy)/cam.z+cam.y};}
function w2s(wx,wy){return {x:(wx-cam.x)*cam.z+LY.view.cx,y:(wy-cam.y)*cam.z+LY.view.cy};}
function camRect(){var v=LY.view;return {x0:cam.x-(v.cx)/cam.z,x1:cam.x+(W-v.cx)/cam.z,y0:cam.y-(v.cy)/cam.z,y1:cam.y+(H-v.cy)/cam.z};}

/* ===================== 道・経路 ===================== */
function dsAt(y){return clamp(1+y*0.00105,0.66,1.12);}
function chaikin(pts,it){for(var k=0;k<it;k++){var out=[pts[0]];for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1];out.push([a[0]*0.75+b[0]*0.25,a[1]*0.75+b[1]*0.25]);out.push([a[0]*0.25+b[0]*0.75,a[1]*0.25+b[1]*0.75]);}out.push(pts[pts.length-1]);pts=out;}return pts;}
function mkPath(pts,tag){var cum=[0];for(var i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {pts:pts,cum:cum,len:cum[cum.length-1],tag:tag||''};}
function pathAt(p,s){
  s=clamp(s,0,p.len);var c=p.cum,lo=0,hi=c.length-1;
  if(hi<1)return {x:p.pts[0][0],y:p.pts[0][1],dx:1,dy:0};
  while(hi-lo>1){var mid=(lo+hi)>>1;if(c[mid]<=s)lo=mid;else hi=mid;}
  var a=p.pts[lo],b=p.pts[hi],L=(c[hi]-c[lo])||1,u=(s-c[lo])/L;
  return {x:a[0]+(b[0]-a[0])*u,y:a[1]+(b[1]-a[1])*u,dx:(b[0]-a[0])/L,dy:(b[1]-a[1])/L};
}

var SKY=null;
function buildSky(){
  try{
    var sc=Math.min(DPR,1.5),w=Math.max(2,Math.round(W*sc)),h=Math.max(2,Math.round(H*sc));
    if(!SKY)SKY=document.createElement('canvas');
    SKY.width=w;SKY.height=h;
    var g=SKY.getContext('2d'),rnd=makeRng(77),cell=Math.max(46,Math.min(W,H)/6.5)*sc;
    var nx=Math.ceil(w/cell)+1,ny=Math.ceil(h/cell)+1,P=[];
    for(var j=0;j<=ny;j++){P[j]=[];for(var i=0;i<=nx;i++){var jx=(i>0&&i<nx)?(rnd()-0.5)*cell*0.7:0,jy=(j>0&&j<ny)?(rnd()-0.5)*cell*0.7:0;P[j][i]=[i*cell+jx,j*cell+jy];}}
    var top=[205,222,255],mid=[236,224,255],bot=[255,228,240];
    function colAt(y){var t=clamp(y/h,0,1),a,b,u;if(t<0.5){a=top;b=mid;u=t/0.5;}else{a=mid;b=bot;u=(t-0.5)/0.5;}return [lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}
    g.lineJoin='round';
    for(j=0;j<ny;j++)for(i=0;i<nx;i++){
      var a=P[j][i],b=P[j][i+1],c=P[j+1][i+1],d=P[j+1][i];
      var tris=((i+j)%2)?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]];
      for(var k=0;k<2;k++){var t=tris[k],cy=(t[0][1]+t[1][1]+t[2][1])/3,col=colAt(cy),v=(rnd()-0.5)*16,br=rnd()<0.12?18:0;
        g.beginPath();g.moveTo(t[0][0],t[0][1]);g.lineTo(t[1][0],t[1][1]);g.lineTo(t[2][0],t[2][1]);g.closePath();
        g.fillStyle='rgb('+Math.round(clamp(col[0]+v+br,0,255))+','+Math.round(clamp(col[1]+v+br,0,255))+','+Math.round(clamp(col[2]+v*0.5+br,0,255))+')';g.fill();
        g.lineWidth=1.6*sc;g.strokeStyle='rgba(120,100,160,0.22)';g.stroke();}
    }
  }catch(e){SKY=null;}
}

function rhythmTap(d,t){
  var n=RH.taps.length,p=n?RH.taps[n-1]:null,gap=p?t-p.t:99,res={gap:gap,rest:false,alt:false,streak:1};
  if(n>=2){var q=RH.taps[n-2],iso=n<3||(q.t-RH.taps[n-3].t)>=Math.max(0.6,(p.t-q.t)*1.6);if(p.t-q.t<1.0&&gap>=0.8&&gap<=4.8){res.restAny=true;if(iso)res.rest=true;}}
  RH.streak=(p&&p.d===d&&gap<1.8)?RH.streak+1:1;res.streak=RH.streak;
  RH.taps.push({d:d,t:t});if(RH.taps.length>12)RH.taps.shift();
  var tr=0,cnt=0;n=RH.taps.length;
  for(var i=n-1;i>0&&cnt<4;i--){var a=RH.taps[i],b=RH.taps[i-1];if(a.t-b.t>1.8)break;if(a.d!==b.d)tr++;cnt++;}

    var slow=G.adapt.rabbit==='slow';

    else if(slow){sfxBell(deg(mel),0.06);sfxBell(deg(mel+1),0.05,0.09);sfxBell(deg(mel),0.05,0.18);CH.rabbit.play=0.8;}

var SPR=null;
function specialPos(c,tx,ty,dt){
  var E_=CH.elephant;

  var ds=dsAt(E_.y);
  // 象が先：川では象の背中を踏み台にして飛び石へ
  if(G.first==='elephant'&&WORLD.stones.length===3){

      SPR={t:0,x0:c.x,y0:c.y};G.sp_spring=true;logEv('special',{kind:'springboard'});
    }
    if(SPR){
      SPR.t+=dt;var t=SPR.t,st=WORLD.stones,pe=P_CROSS[P_CROSS.length-1];
      var pts=[[SPR.x0,SPR.y0,0],[E_.x,E_.y,52*ds],[st[0].x,st[0].y,0],[st[1].x,st[1].y,0],[st[2].x,st[2].y,0],[pe[0],pe[1],0]];

        if(!c['_l'+i]){c['_l'+i]=true;}

        return {x:hx,y:hy,hop:hh,dy:hy,face:b[0]>=a[0]?1:-1};
      }}
    }
    if(G.road==='candy'&&G.adapt.rabbit==='slow'){
      if(!G.sp_backride){G.sp_backride=true;logEv('special',{kind:'backride'});}
      return {x:E_.x-E_.face*4*ds,y:E_.y,hop:(54+Math.abs(Math.sin(E_.walkPh))*5)*1,dy:E_.y+0.5,face:E_.face};
    }
  }
  // うさぎが先：象があとから来ると、うさぎを頭にのせて川を渡る

  }
  return null;
}

  else{
    var L=CH.tanuki,ov=camOverview();
    if(G.road==='slope'&&L.y<-120){var zc=ov.z*1.25;tg={x:L.x*0.6,y:L.y-0.12*v.h/zc,z:zc};k=2.5;}
    else{var zf=1+0.1*sm((40-L.y)/220);tg={x:L.x*0.32,y:ov.y+(L.y-HOME.y)*0.14,z:ov.z*zf};}
  }
  if(snapCam){cam.x=tg.x;cam.y=tg.y;cam.z=tg.z;snapCam=false;}
  else{cam.x=damp(cam.x,tg.x,k,dt);cam.y=damp(cam.y,tg.y,k,dt);cam.z=damp(cam.z,tg.z,k,dt);}
}
function update(dt){
  updateDrums(dt);stepParts(PARTS,dt);stepParts(SPARTS,dt);updateHoming(dt);
  updateHints(dt);updateLights(dt);
  if(TR.on)updateTransition(dt);
  if(isBallPhase()){updateBall(dt);}
  else{
    if(G.phase==='town')moveBand(dt);
    updateRest();updateBridge(dt);updateTownBits(dt);updateWaves(dt);
    if(G.phase==='town'){updateMembersTown(dt);paintTiles(dt);updateTurtle(dt);}
    updateWaiters(dt);updateReturners(dt);updatePasser(dt);
    if(G.phase==='enter')updateEnter(dt);
    if(G.phase==='slide')updateSlide(dt);
  }
  updateChars(dt);updateCamera(dt);
}

/* ===================== 描画 ===================== */
var DRAWS=[];
function renderTown(){
  var alt=clamp((-cam.y-320)/650,0,1);
  drawSky('#cfd6ff',alt*0.4);
  camApply();var R=camRect(),i;
  for(i=0;i<WORLD.clouds.length;i++){var c=WORLD.clouds[i],cx=c.x+Math.sin(T*0.05+c.ph)*30;if(cx<R.x0-90||cx>R.x1+90||c.y<R.y0-60||c.y>R.y1+60)continue;drawCloud(cx,c.y,c.s,0.95);}
  if(CASTLE.up<0.05)drawCastle(CASTLE.x,CASTLE.y,CASTLE.s,false);
  drawLand();
  if(CASTLE.up>=0.05){drawCastle(CASTLE.x,CASTLE.y,CASTLE.s,true);var u=CASTLE.up;
    for(i=0;i<5;i++){var cc=[[-120,6,1.2],[-50,20,1.5],[40,22,1.4],[115,8,1.2],[0,34,1.7]][i];drawCloud(CASTLE.x+cc[0]*CASTLE.s,CASTLE.y+cc[1]*CASTLE.s,cc[2]*CASTLE.s,u);}}
  drawRiver();drawPlaza();
  drawTileSet(WORLD.tiles.candy);drawTileSet(WORLD.tiles.river);
  drawTileSet(WORLD.tiles.slope,function(t,j){var k=BR.keys[j];return k?k.lift:0;});
  drawFlowers();drawWaves();
  drawSlopeKeys();drawRainbow();
  DRAWS.length=0;
  for(i=0;i<WORLD.houses.length;i++){var h=WORLD.houses[i];if(h.x+h.w<R.x0-20||h.x-h.w>R.x1+20)continue;DRAWS.push({y:h.y,t:1,o:h});}
  for(i=0;i<WORLD.trees.length;i++){var tr=WORLD.trees[i];if(tr.x<R.x0-40||tr.x>R.x1+40)continue;DRAWS.push({y:tr.y,t:2,o:tr});}
  DRAWS.push({y:SHOP.y,t:3,o:SHOP});DRAWS.push({y:LAMP.y,t:4,o:LAMP});
  for(i=0;i<POLES.length;i++)if(POLES[i].flag)DRAWS.push({y:POLES[i].y,t:5,o:POLES[i]});
  for(var ak in WORLD.arches)DRAWS.push({y:WORLD.arches[ak].y,t:6,o:WORLD.arches[ak]});
  var names=['tanuki','rabbit','elephant','owl','turtle'];
  for(i=0;i<5;i++){var ch=CH[names[i]];if(ch.hidden||ch.state==='away')continue;DRAWS.push({y:(ch.depthY!==null&&ch.depthY!==undefined?ch.depthY:ch.y)+(i===0?0.05:0),t:7,o:ch});}
  DRAWS.push({y:PASS.y,t:8,o:PASS});
  DRAWS.sort(function(a,b){return a.y-b.y;});
  for(i=0;i<DRAWS.length;i++){var d=DRAWS[i];
    switch(d.t){case 1:drawHouse(d.o);break;case 2:drawTree(d.o);break;case 3:drawShop();break;case 4:drawLamp();break;case 5:drawPole(d.o);break;case 6:drawArch(d.o);break;case 7:drawChar(d.o);break;case 8:drawPasser(d.o);break;}}
  drawHoming();drawParts(PARTS,1);
}
function renderBall(){
  drawSky('#ffe0f0',0.5);
  camApply();
  drawBallroom();
  var list=[CH.tanuki].concat(G.members.map(function(m){return CH[m];}));
  if(!isM('owl')&&CH.owl.state==='wait')list.push(CH.owl);
  if(CH.turtle.state==='coming')list.push(CH.turtle);
  list.sort(function(a,b){var ay=a.depthY!==null&&a.depthY!==undefined?a.depthY:a.y,by=b.depthY!==null&&b.depthY!==undefined?b.depthY:b.y;return ay-by;});
  for(var i=0;i<list.length;i++){var c=list[i];if(c.kind==='owl'&&c.state==='wait'){drawChar(c);continue;}
    if(BALL.show==='moon'&&c.kind==='owl'&&G.phase==='ball'){ctx.globalAlpha=0.3;E(c.x,c.y,46,15);ctx.fillStyle=COL.lemonL;ctx.fill();ctx.globalAlpha=1;}
    drawChar(c);}
  drawFinFlag();
  drawParts(PARTS,1);
}
function render(){
  if(isBallPhase())renderBall();else renderTown();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var ballish=isBallPhase(),dim=G.phase==='flagReady'?0.25:0;
  if(dim>0)ctx.globalAlpha=1-dim;
  // 太鼓の膜（ガイドの手のときは少しだけへこむ）
  ['S','B'].forEach(function(k){var s=DRUM[k],keep=s.dent.x;s.dent.x=keep+s.ghost*0.35;drawDrum(k);s.dent.x=keep;});
  ctx.globalAlpha=1;
  drawParts(SPARTS,1);
  var h=handInfo();if(h)drawHand(h.x,h.y,h.press,h.a);
  drawIris();
}

/* ===================== 保存（前回の旗だけ） ===================== */
var SKEY='ponpoko-gakutai-flag-v1';
function sanitizeFlag(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return null;
  var okK=['rabbit','elephant','owl','turtle'];
  var f={first:(o.first==='rabbit'||o.first==='elephant')?o.first:null,members:[],roads:[],pattern:(o.pattern==='stripe'||o.pattern==='diamond')?o.pattern:null,shows:[],gems:[],m:0};
  if(Array.isArray(o.members))o.members.forEach(function(m){if(okK.indexOf(m)>=0&&f.members.indexOf(m)<0&&f.members.length<4)f.members.push(m);});
  if(Array.isArray(o.roads))o.roads.forEach(function(r){if((r==='candy'||r==='river')&&f.roads.indexOf(r)<0)f.roads.push(r);});
  if(Array.isArray(o.shows))o.shows.slice(0,8).forEach(function(s){if(['circle','stomp','cross','moon'].indexOf(s)>=0)f.shows.push(s);});
  if(Array.isArray(o.gems))o.gems.slice(0,8).forEach(function(g){if(g&&(g.k==='S'||g.k==='B')&&typeof g.c==='number'&&isFinite(g.c))f.gems.push({k:g.k,c:Math.abs(Math.floor(g.c))%8});});
  f.m=(typeof o.m==='number'&&isFinite(o.m))?clamp(Math.floor(o.m),0,9999):0;
  if(!f.first||f.members.indexOf(f.first)<0)return null;
  return f;
}
function loadFlag(){
  try{var ls=window.localStorage;if(!ls)return {status:'denied'};var s=ls.getItem(SKEY);if(s===null)return {status:'none'};
    var o=null;try{o=JSON.parse(s);}catch(e){o=null;}
    var f=sanitizeFlag(o);if(!f){try{ls.removeItem(SKEY);}catch(e2){}return {status:'corrupt'};}
    return {status:'ok',flag:f};
  }catch(e){return {status:'denied'};}
}
function saveFlag(f){
  try{window.localStorage.setItem(SKEY,JSON.stringify({v:1,first:f.first,members:f.members,roads:f.roads,pattern:f.pattern,shows:f.shows,gems:f.gems,m:f.m}));return true;}catch(e){return false;}
}

/* ===================== 入力 ===================== */
function hitDrum(x,y){
  var best=null,bq=1e9;
  ['S','B'].forEach(function(k){var d=k==='S'?LY.dS:LY.dB,cy=d.y+d.r*(k==='B'?0.3:0.25),dx=(x-d.x)/(d.r*1.3),dy=(y-cy)/(d.r*1.08),q=dx*dx+dy*dy;if(q<bq){bq=q;best=k;}});
  if(bq<=1)return best;
  if(bq<=2.1&&y>H*0.55)return best;
  return null;
}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  auUnlock();
  HINT.idle=0;HINT.leaderDone=false;
  if(!G.firstTouch){G.firstTouch=true;logEv('firstTouch');}
  if(TR.on)return;
  var x=e.clientX,y=e.clientY,k=hitDrum(x,y);
  var w=s2w(x,y);G.lastTouch={x:w.x,y:w.y,t:T};
  if(k&&G.phase==='flagReady'&&flagHit(x,y)){startNewMarch();return;}
  if(k&&G.phase!=='leave'&&G.phase!=='enter'&&G.phase!=='slide'){onDrum(k,x,y);return;}
  if(k){onDrumPassive(k,x,y);return;}
  onBgTap(x,y);
}
function onDrumPassive(k,x,y){ // 場面転換中：音と膜だけ
  var st=DRUM[k],t=wnow();if(t-(st.lastT||-9)<0.045)return;st.lastT=t;
  st.dent.v+=k==='S'?15:12;st.sq.v+=6;st.flash=1;if(k==='S')sfxSmall(0);else sfxBig();
}
function onMove(e){if(e.cancelable)e.preventDefault();if(e.buttons||e.pointerType==='touch'){var w=s2w(e.clientX,e.clientY);G.lastTouch={x:w.x,y:w.y,t:T};}}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
['pointerup','touchend','mouseup','click','keydown'].forEach(function(n){window.addEventListener(n,function(){auUnlock();},{passive:true});});
function stop(e){if(e.cancelable)e.preventDefault();}
document.addEventListener('touchstart',stop,{passive:false});
document.addEventListener('touchmove',stop,{passive:false});
document.addEventListener('gesturestart',stop,{passive:false});
document.addEventListener('gesturechange',stop,{passive:false});
document.addEventListener('gestureend',stop,{passive:false});
document.addEventListener('dblclick',stop,{passive:false});
document.addEventListener('contextmenu',stop,{passive:false});
document.addEventListener('selectstart',stop,{passive:false});
window.addEventListener('wheel',function(e){if(e.ctrlKey&&e.cancelable)e.preventDefault();},{passive:false});

/* ===================== ループ・復帰・回転 ===================== */
var RUN=true,lastFrame=0,ftAvg=16.7,qT=0,goodT=0,rafId=0,errOnce=false;
function loop(now){
  if(!RUN)return;
  rafId=requestAnimationFrame(loop);
  var dtw=(now-lastFrame)/1000;lastFrame=now;if(!(dtw>0)||dtw>1)dtw=0.016;
  var dt=Math.min(dtw,0.05);T+=dt;
  ftAvg=lerp(ftAvg,dtw*1000,0.05);qT+=dtw;
  if(qT>2.5){qT=0;
    if(ftAvg>27&&QUAL>0.55){QUAL=Math.max(0.55,QUAL-0.15);goodT=0;doLayout();}
    else if(ftAvg<19){goodT+=2.5;if(goodT>=10&&QUAL<1){QUAL=Math.min(1,QUAL+0.1);goodT=0;doLayout();}}
    else goodT=0;}
  try{update(dt);render();}
  catch(err){if(!errOnce){errOnce=true;G.err=String(err&&err.stack||err);if(window.console)console.error(err);}}
}
function resume(){if(!RUN){RUN=true;lastFrame=performance.now();rafId=requestAnimationFrame(loop);}}
function pause(){RUN=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;auSuspend();}
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();else{resume();auUnlock();HINT.idle=0;}});
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',function(){resume();});
var rzT=0;function onResize(){clearTimeout(rzT);rzT=setTimeout(function(){doLayout();},60);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(doLayout,120);setTimeout(doLayout,450);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);

/* ===================== 起動 ===================== */
function boot(){
  CH.tanuki.size=1;CH.rabbit.size=0.95;CH.elephant.size=0.92;CH.owl.size=0.9;CH.turtle.size=0.9;
  G.startW=wnow();
  var seed=0;try{seed=(Math.random()*1e9)>>>0;}catch(e){seed=12345;}
  G.baseSeed=seed||1;G.flags=[];
  var lf=loadFlag();G.storage=lf.status;
  if(lf.status==='ok'){G.flags=[lf.flag];G.prevFlag=lf.flag;G.march=Math.min(9999,(lf.flag.m||0)+1);}
  logEv('boot',{storage:lf.status});
  buildBall();
  doLayout();
  setupFirstMarch();
  buildSky();snapCam=true;
  lastFrame=performance.now();rafId=requestAnimationFrame(loop);
}
window.__ponpoko={
  state:function(){return {phase:G.phase,march:G.march,members:G.members.slice(),first:G.first,road:G.road,roads:G.roads.slice(),formation:G.formation,stonesUp:G.stonesUp,shopOpen:G.shopOpen,archOpen:G.archOpen,bridge:BR.state,show:BALL.show,done:BALL.done.slice(),fin:FIN.state,gems:FIN.gems.length,storage:G.storage,audio:AU.ctx?AU.ctx.state:'none',voices:AU.voices,parts:PARTS.length+SPARTS.length,qual:QUAL,dpr:DPR,leader:{x:Math.round(CH.tanuki.x),y:Math.round(CH.tanuki.y)},flags:G.flags.length,poles:POLES.map(function(p){return !!p.flag;}),turtle:G.turtleStage,owl:G.owlState,paint:G.paint?G.paint.k:null,adapt:G.adapt,restPending:G.restPending,quiet:Math.round(LIGHT.quiet*100)/100,energy:Math.round(LIGHT.energy*100)/100,pal:G.pal,decor:G.decor,root:MUS.root,passer:PASS.kind,hint:HINT.target,idle:Math.round(HINT.idle*10)/10,err:G.err||null,cam:{x:Math.round(cam.x),y:Math.round(cam.y),z:Math.round(cam.z*100)/100}};},
  log:function(){return G.log.slice();},
  drums:function(){return {S:{x:LY.dS.x,y:LY.dS.y,r:LY.dS.r},B:{x:LY.dB.x,y:LY.dB.y,r:LY.dB.r},view:LY.view,W:W,H:H,sa:SA};},
  flagPoint:function(){var r=finFlagRect();return w2s(r.x+r.w/2,r.y+r.h/2);},
  w2s:function(x,y){return w2s(x,y);},
  forceTurtle:function(v){G.forceTurtle=v;G.turtlePlan=v;}
};
boot();
})();
