(function(){
'use strict';
/* =========================================================

/* ---------- S0 utils ---------- */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const eOut=t=>1-(1-t)*(1-t);
const eIn=t=>t*t;
const eIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const eEl=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1;
const sat=t=>clamp(t,0,1);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(7);
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rv=(a,b)=>a+rng()*(b-a);
const rpick=arr=>arr[Math.floor(rng()*arr.length)%arr.length];
function shuffleR(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const ERR=[];
function guard(fn){try{fn();}catch(e){ERR.push(String(e&&e.stack||e));}}

let T=0, timeScale=1;
let timers=[], roundToken=1;
function after(sec,fn,keep){timers.push({t:T+sec,fn:fn,tok:keep?-1:roundToken});}
function runTimers(){
  for(let i=0;i<timers.length;i++){
    const tm=timers[i];
    if(T>=tm.t){timers.splice(i,1);i--; if(tm.tok===-1||tm.tok===roundToken) guard(tm.fn);}
  }
}
const EVLOG=[];
function evlog(id,info){EVLOG.push({t:+T.toFixed(2),id:id,info:info||''}); if(EVLOG.length>400)EVLOG.shift();}

/* ---------- S1 storage (端末内のみ) ---------- */
const SKEY='kagekko-merry-go-round-v1';
const MEM={v:1,rounds:0,visits:0,friends:{rabbit:0,bird:0,mouse:0,cat:0},combos:{rb:0,mb:0,rm:0},bows:[],stars:0,lastCombo:'',hat:0,order:[]};
let storeOK=true, storeState='first';
function sanitizeMem(d){
  if(!d||typeof d!=='object'||d.v!==1) throw new Error('bad');
  const n=(x,max)=>{x=Math.floor(Number(x));return isFinite(x)?clamp(x,0,max):0;};
  const out={v:1,rounds:n(d.rounds,9999),visits:n(d.visits,99999),friends:{},combos:{},bows:[],stars:n(d.stars,99),lastCombo:'',hat:n(d.hat,1),order:[]};
  const f=d.friends&&typeof d.friends==='object'?d.friends:{};
  ['rabbit','bird','mouse','cat'].forEach(k=>out.friends[k]=f[k]?1:0);
  const c=d.combos&&typeof d.combos==='object'?d.combos:{};
  ['rb','mb','rm'].forEach(k=>out.combos[k]=c[k]?1:0);
  if(Array.isArray(d.bows)) out.bows=d.bows.map(x=>n(x,7)).slice(-6);
  if(['rb','mb','rm'].indexOf(d.lastCombo)>=0) out.lastCombo=d.lastCombo;
  if(Array.isArray(d.order)) out.order=d.order.filter(x=>['rabbit','bird','mouse','cat'].indexOf(x)>=0).slice(0,4);
  return out;
}
function loadMem(){
  let raw=null;
  try{raw=window.localStorage.getItem(SKEY);}catch(e){storeOK=false;storeState='denied';return;}
  if(raw===null||raw===undefined){storeState='first';return;}
  try{const d=sanitizeMem(JSON.parse(raw));Object.assign(MEM,d);storeState='restored';}
  catch(e){storeState='corrupt';try{window.localStorage.removeItem(SKEY);}catch(_){}}
}
function saveMem(){
  if(!storeOK) return;
  try{window.localStorage.setItem(SKEY,JSON.stringify(MEM));}catch(e){storeOK=false;if(storeState!=='denied')storeState='savefail';}
}

/* ---------- S2 audio (Web Audio 合成) ---------- */
const AU={c:null,m:null,nb:null};
function audioUnlock(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      AU.c=new AC();
      const comp=AU.c.createDynamicsCompressor();
      comp.threshold.value=-16;comp.knee.value=16;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
      AU.m=AU.c.createGain();AU.m.gain.value=.6;AU.m.connect(comp);comp.connect(AU.c.destination);
      const len=Math.floor(AU.c.sampleRate*1.2);const b=AU.c.createBuffer(1,len,AU.c.sampleRate);const d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.nb=b;
      const o=AU.c.createBufferSource();o.buffer=AU.c.createBuffer(1,1,22050);o.connect(AU.c.destination);o.start(0);
      evlog('audio','created');
    }
    if(AU.c.state!=='running'&&AU.c.state!=='closed'&&!document.hidden){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
}
function tone(f,dur,o){
  if(!AU.c) return; o=o||{};
  try{
    const t0=(o.at||AU.c.currentTime)+(o.delay||0);
    const osc=AU.c.createOscillator(), g=AU.c.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+(o.slide||dur));
    const v=Math.max(.0002,o.vol||.15);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.atk||.006)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(g); g.connect(AU.m); osc.start(t0); osc.stop(t0+dur+.03);
  }catch(e){}
}
function noise(dur,o){
  if(!AU.c||!AU.nb) return; o=o||{};
  try{
    const t0=AU.c.currentTime+(o.delay||0);
    const src=AU.c.createBufferSource(); src.buffer=AU.nb;
    const f=AU.c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.value=o.f||2000; f.Q.value=o.q||1;
    const g=AU.c.createGain(); const v=o.vol||.08;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.atk||.004)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(AU.m); src.start(t0,Math.random()*.6); src.stop(t0+dur+.03);
  }catch(e){}
}
const P2=n=>Math.pow(2,n/12);
const SFX={
  tap(p){p=p||1;tone(520*p,.12,{vol:.1,to:700*p,slide:.07});},
  paper(){noise(.08,{f:3400,q:.7,vol:.045});},
  wobble(){tone(300,.09,{type:'triangle',vol:.05,to:260});noise(.06,{f:2600,q:.8,vol:.03});},
  click(){tone(1500,.03,{type:'square',vol:.03});noise(.03,{f:4200,q:2,vol:.04});},
  lightUp(){tone(660,.16,{type:'triangle',vol:.1});tone(990,.26,{vol:.09,delay:.06});tone(1320,.3,{vol:.05,delay:.12});},
  lightDown(){tone(440,.22,{vol:.1,to:330});tone(262,.3,{type:'triangle',vol:.05,delay:.05});},
  boing(p){p=p||1;tone(210*p,.34,{vol:.2,to:640*p,slide:.24});tone(420*p,.22,{type:'triangle',vol:.05,to:950*p});},
  hop(p){p=p||1;tone(380*p,.12,{vol:.09,to:620*p,slide:.08});},
  clack(i){const f=[520,610,470,690,560,430][(i||0)%6];tone(f,.07,{type:'triangle',vol:.14,to:f*.7});noise(.04,{f:1600,q:3,vol:.07});},
  bell(p,v){p=p||1;v=v===undefined?1:v;const f=1250*p;[1,2.01,2.76,4.07].forEach((m,i)=>tone(f*m,1.3/(i*.7+1),{vol:.1*v/(i+1),atk:.002}));},
  dingdong(p){p=p||1;SFX.bell(p,.9);setTimeout(()=>SFX.bell(p*.84,.8),210);},
  chirp(p){p=p||1;tone(2300*p,.07,{vol:.07,to:3300*p});tone(2700*p,.08,{vol:.06,to:3700*p,delay:.09});},
  squeak(p){p=p||1;tone(1900*p,.07,{vol:.06,to:2600*p});tone(2250*p,.06,{vol:.05,to:2950*p,delay:.08});},
  eek(){tone(2600,.09,{vol:.06,to:3400});tone(2900,.12,{vol:.05,to:2200,delay:.08});},
  shimmer(){[0,4,7,12,16].forEach((n,i)=>tone(1046*P2(n),.5,{vol:.045,delay:i*.05}));},
  pop(){tone(300,.1,{vol:.13,to:900,slide:.05});noise(.05,{f:2500,vol:.05});},
  whoosh(){noise(.45,{f:900,q:.6,vol:.07,atk:.15});},
  patter(){for(let i=0;i<6;i++)tone(1700+i*60,.03,{type:'triangle',vol:.035,delay:i*.09});},
  crinkle(){for(let i=0;i<5;i++)noise(.05,{f:2800+i*300,q:1.5,vol:.05,delay:i*.07});},
  creak(){tone(140,.4,{type:'sawtooth',vol:.03,to:110});noise(.3,{f:500,q:4,vol:.03});},
  meow(big){
    if(!AU.c) return;
    try{
      const t0=AU.c.currentTime,o=AU.c.createOscillator(),f=AU.c.createBiquadFilter(),g=AU.c.createGain();
      o.type='sawtooth';f.type='bandpass';f.Q.value=3;const b=big?440:860;
      o.frequency.setValueAtTime(b,t0);o.frequency.linearRampToValueAtTime(b*1.45,t0+.18);o.frequency.linearRampToValueAtTime(b*1.05,t0+.5);
      f.frequency.setValueAtTime(900,t0);f.frequency.linearRampToValueAtTime(1900,t0+.2);f.frequency.linearRampToValueAtTime(1000,t0+.5);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(big?.1:.07,t0+.06);g.gain.exponentialRampToValueAtTime(.0001,t0+.55);
      o.connect(f);f.connect(g);g.connect(AU.m);o.start(t0);o.stop(t0+.6);
    }catch(e){}
  },
  success(){[0,4,7,12].forEach((n,i)=>{tone(784*P2(n),.38,{type:'triangle',vol:.12,delay:i*.08});tone(1568*P2(n),.26,{vol:.035,delay:i*.08});});},
  merge(){[0,3,7,10,14].forEach((n,i)=>tone(523*P2(n),.3,{type:'triangle',vol:.07,delay:i*.05}));setTimeout(()=>SFX.success(),260);},
  attach(){tone(880,.08,{type:'square',vol:.04});tone(1320,.3,{type:'triangle',vol:.1,delay:.05});},
  fanfare(){[0,4,7,12,16,19,24].forEach((n,i)=>{tone(523*P2(n),.5,{type:'triangle',vol:.1,delay:i*.09});});[0,4,7].forEach(n=>tone(262*P2(n),1.4,{type:'sine',vol:.07,delay:.7}));},
  note(n,v){tone(784*P2(n),.3,{type:'triangle',vol:v||.08});tone(1568*P2(n),.18,{vol:.025});}
};
const MUS={on:false,next:0,step:0,tempo:.25,mel:[],bass:[]};
function musicMake(seed){
  const r=mulberry32(seed|0), sc=[0,2,4,7,9,12,14,16];
  const mel=[];for(let i=0;i<32;i++){mel.push(i%8===7?null:sc[Math.floor(r()*sc.length)]);}
  mel[0]=0;mel[16]=4;mel[31]=null;MUS.mel=mel;MUS.bass=[0,0,7,7,5,5,7,7];
}
function musicStart(){if(!AU.c)return;MUS.on=true;MUS.next=AU.c.currentTime+.08;MUS.step=0;}
function musicStop(){MUS.on=false;}
function musicTick(){
  if(!MUS.on||!AU.c||AU.c.state!=='running') return;
  if(MUS.next<AU.c.currentTime-.5) MUS.next=AU.c.currentTime+.05;
  while(MUS.next<AU.c.currentTime+.3){
    const n=MUS.mel[MUS.step%MUS.mel.length];
    if(n!==null&&n!==undefined){tone(1046*P2(n),.45,{at:MUS.next,vol:.045,type:'sine',atk:.003});tone(2093*P2(n),.2,{at:MUS.next,vol:.012});}
    if(MUS.step%4===0){const b=MUS.bass[(MUS.step/4|0)%MUS.bass.length];tone(262*P2(b),.6,{at:MUS.next,vol:.04,type:'triangle'});}
    MUS.next+=MUS.tempo*(PARADE.fast>0?.75:1);MUS.step++;
  }
}

/* ---------- S3 layout ---------- */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d'), saEl=document.getElementById('sa');
let W=1,H=1,DPR=1,R={x:0,y:0,w:1,h:1},s=1,portrait=true,LY=null;
const LP={D:[400,780],floor:.60,
  mirror:{x:.17,w:108,h:176}, blocks:{x:.175,y:.66},
  car:{x:.475,y:.625,w:118,h:196},
  shelf:{x0:.655,x1:.975,top:.12,mid:.31,low:.505,foot:.612},
  box:{x:.25,y:.80,w:146,h:64}, ped:{x:.77,y:.80,w:128},
  flash:{x:.5,y:.935,w:270}, sunS:.235, sunB:.765, win:{x:.42,y:.095,r:40}, cord:.30};
const LL={D:[1100,780],floor:.62,
  mirror:{x:.115,w:136,h:206}, blocks:{x:.12,y:.70},
  car:{x:.50,y:.648,w:172,h:262},
  shelf:{x0:.79,x1:.975,top:.11,mid:.315,low:.515,foot:.632},
  box:{x:.245,y:.835,w:168,h:74}, ped:{x:.715,y:.835,w:150},
  flash:{x:.495,y:.94,w:300}, sunS:.405, sunB:.585, win:{x:.31,y:.13,r:52}, cord:.36};
const LLW=Object.assign({},LL,{D:[1100,600]});
const G={};
const X=f=>R.x+f*R.w, Y=f=>R.y+f*R.h;
function buildGeo(){
  const L=LY;
  G.floorY=Y(L.floor);
  const mh=L.mirror.h*s, mw=L.mirror.w*s;
  G.mir={cx:X(L.mirror.x),w:mw,h:mh,by:G.floorY+4*s}; G.mir.top=G.mir.by-mh; G.mir.cy=G.mir.by-mh/2;
  G.blk={cx:X(L.blocks.x),by:Y(L.blocks.y)};
  G.car={cx:X(L.car.x),by:Y(L.car.y),w:L.car.w*s,h:L.car.h*s}; G.car.top=G.car.by-G.car.h;
  const sh=L.shelf; G.sh={x0:X(sh.x0),x1:X(sh.x1),top:Y(sh.top),mid:Y(sh.mid),low:Y(sh.low),foot:Y(sh.foot),bt:9*s};
  G.sh.w=G.sh.x1-G.sh.x0; G.sh.cx=(G.sh.x0+G.sh.x1)/2;
  G.box={cx:X(L.box.x+(V.boxShift||0)),cy:Y(L.box.y),w:L.box.w*s,h:L.box.h*s}; G.box.top=G.box.cy-G.box.h/2; G.box.bot=G.box.cy+G.box.h/2; G.box.x0=G.box.cx-G.box.w/2; G.box.x1=G.box.cx+G.box.w/2;
  G.ped={cx:X(L.ped.x),cy:Y(L.ped.y),w:L.ped.w*s}; G.ped.top=G.ped.cy-14*s;
  G.fl={cx:X(L.flash.x),cy:Y(L.flash.y),w:L.flash.w*s,h:58*s};
  const sr=Math.max(30*s,24);
  G.sunS={x:X(L.sunS),y:G.fl.cy+4*s,r:sr}; G.sunB={x:X(L.sunB),y:G.fl.cy+4*s,r:sr};
  G.fl.w=Math.max(G.fl.w,(G.sunB.x-G.sunS.x)+sr*2+20*s);
  G.pivot={x:G.fl.cx,y:G.fl.cy-G.fl.h*.42};
  G.win={x:X(L.win.x),y:Y(L.win.y),r:L.win.r*s};
  G.cordX=X(L.cord);
  const gx0=G.sh.x0+G.sh.w*.08, gx1=G.sh.x1-G.sh.w*.08;
  G.spots=[0,1,2].map(i=>({x:lerp(gx0,gx1,(i+.5)/3),y:G.sh.foot-12*s}));
  G.under={x0:G.sh.x0,x1:G.sh.x1,y0:G.sh.low+G.sh.bt,y1:G.sh.foot+6*s};
}
function anchor(n){
  const fy=G.floorY;
  switch(n){
    case 'boxIn': return {x:G.box.cx+G.box.w*.12,y:G.box.top+16*s};
    case 'roof': return {x:G.blk.cx+4*s,y:G.blk.by-118*s};
    case 'mirrorFront': return {x:G.mir.cx+4*s,y:G.blk.by-46*s};
    case 'pedL': return {x:G.ped.cx-G.ped.w*.23,y:G.ped.top+2*s};
    case 'pedR': return {x:G.ped.cx+G.ped.w*.23,y:G.ped.top+2*s};
    case 'pedC': return {x:G.ped.cx,y:G.ped.top+2*s};
    case 'rest0': return {x:G.ped.cx-G.ped.w*.62,y:G.ped.top-30*s};
    case 'rest1': return {x:G.ped.cx+G.ped.w*.15,y:G.ped.cy+42*s};
    case 'rest2': return {x:G.ped.cx+G.ped.w*.2,y:G.ped.top-40*s};
    case 'rest3': return {x:lerp(G.box.x1,G.ped.cx-G.ped.w/2,.5),y:G.box.cy+20*s};
    case 'nearCar': return {x:G.car.cx-G.car.w*.62,y:G.car.by+60*s};
    case 'dropBell': return {x:G.car.cx-G.car.w*.32,y:G.car.by+34*s};
    case 'dropKey': return {x:G.car.cx+G.car.w*.32,y:G.car.by+34*s};
    case 'dropBow': return {x:G.car.cx,y:G.car.by+84*s};
    case 'dropStar': return {x:G.car.cx+G.car.w*.62,y:G.car.by+70*s};
    case 'dropRibbon': return {x:G.ped.cx-G.ped.w*.3,y:G.ped.cy+44*s};
    case 'ribbonShelf': return {x:G.sh.x0+G.sh.w*(V.keySide?.30:.70),y:G.sh.top-8*s};
    case 'keyShelf': return {x:G.sh.x0+G.sh.w*(V.keySide?.80:.20),y:G.sh.top-10*s};
    case 'starShelf': return {x:G.sh.x0+G.sh.w*.5,y:G.sh.low-12*s};
    case 'hole': return {x:G.spots[V.holeIdx].x,y:G.sh.foot-4*s};
    case 'bell': return {x:G.spots[V.bellIdx].x,y:G.sh.foot-9*s};
    case 'carTop': return {x:G.car.cx,y:G.car.top-14*s};
    case 'carHook': return {x:G.car.cx+G.car.w*.42,y:G.car.by-G.car.h*.8+4*s};
    case 'carKey': return {x:G.car.cx,y:G.car.by-G.car.h*.06};
    case 'floorSpot': return {x:G.box.x1+40*s,y:G.box.cy-4*s};
    case 'perchShelf': return {x:G.sh.x0+G.sh.w*(V.keySide?.30:.70)+16*s,y:G.sh.top-4*s};
    case 'perchCar': return {x:G.car.cx-16*s,y:G.car.top+6*s};
    case 'perchFloor': return {x:G.box.x1+78*s,y:G.box.top-30*s};
    case 'perchPed': return {x:G.ped.cx+G.ped.w*.23,y:G.ped.top+2*s};
    case 'perchBlocks': return {x:G.blk.cx+30*s,y:G.blk.by-30*s};
    case 'tunnel': return {x:G.mir.cx,y:fy+14*s};
    case 'stage': return {x:G.sh.cx,y:G.sh.low-2*s};
  }
  return {x:W/2,y:H/2};
}

/* ---------- S4 background (静的レイヤーを一度だけ描く) ---------- */
let bg=null, texPat=null;
function makeTexture(g){
  const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  const id=x.createImageData(96,96);
  for(let i=0;i<id.data.length;i+=4){const v=200+Math.random()*55|0;id.data[i]=v;id.data[i+1]=v*.96|0;id.data[i+2]=v*.9|0;id.data[i+3]=Math.random()*60|0;}
  x.putImageData(id,0,0);

function moveTo(o,to,dur,opt){opt=opt||{};o.mv={fx:o.x,fy:o.y,to:to,t0:T,dur:Math.max(.05,dur),arc:opt.arc||0,hops:opt.hops||0,done:opt.done||null,ease:opt.ease||eIO};o.at=null;}

function updMove(o){
  const m=o.mv; if(!m) return;

  o.x=lerp(m.fx,p.x,e); o.y=lerp(m.fy,p.y,e);
  if(m.arc) o.y-=Math.sin(PI*t)*m.arc*s;
  o.hopY=0;

/* ---------- S12 regions & light ---------- */
function inRect(x,y,x0,y0,x1,y1){return x>=x0&&x<=x1&&y>=y0&&y<=y1;}

function regionAt(x,y){
  if(PARADE.on) return paradeRegion(x,y);
  for(let k=0;k<4;k++){if(!cornerVisible(k))continue;const c=cornerPos(k);if(dist(x,y,c.x,c.y)<Math.max(30*s,26))return {id:'corner',k:k,key:'corner'+k};}
  const S=G.sh;
  if(inRect(x,y,S.x0-12*s,S.top-64*s,S.x1+12*s,S.top+S.bt+8*s)){const kp=anchor('keyShelf'),rp=anchor('ribbonShelf');return dist(x,y,kp.x,kp.y)<dist(x,y,rp.x,rp.y)?{id:'key',key:'key'}:{id:'ribbon',key:'ribbon'};}
  const sp=anchor('starShelf');
  if(Math.abs(x-sp.x)<32*s&&y>S.low-46*s&&y<S.low+S.bt+2*s) return {id:'star',key:'star'};
  const UN=G.under;
  if(inRect(x,y,UN.x0-10*s,UN.y0-4*s,UN.x1+10*s,UN.y1+12*s)) return {id:'under',key:'under'};
  if(inRect(x,y,S.x0-10*s,S.top-20*s,S.x1+10*s,S.foot)) return {id:'shelf',key:'shelf'};
  if(inBox(x,y)) return {id:'box',key:'box'};
  if(inBlocks(x,y)) return {id:'blocks',key:'blocks'};
  const m=G.mir; if(Math.abs(x-m.cx)<m.w/2+8*s&&y>m.top-8*s&&y<m.by) return {id:'mirror',key:'mirror'};
  const b=G.box;
  if(y>G.floorY-4*s&&inRect(x,y,b.x0-72*s,b.top-62*s,b.x1+72*s,b.bot+50*s)&&!inFlash(x,y)&&!inPed(x,y)&&!inCar(x,y)) return {id:'nearBox',key:'nearBox'};
  if(inCar(x,y)) return {id:'car',key:'car'};

function shineAt(x,y,cause,objHit){
  LT.tx=x;LT.ty=y;LT.flash=1;LT.moveT=T;
  const reg=objHit?{id:'obj',key:'obj'}:regionAt(x,y);
  LT.region=reg;LT.lastRegionKey=reg.key;
  if(cause==='tap'){LT.use[LT.level]++;REGION_USE[reg.id]=(REGION_USE[reg.id]||0)+1;
    LT.streak=(T-(LT.lastTapT||-9)<.9&&reg.key===LT.streakKey)?Math.min(10,(LT.streak||0)+1):0;LT.lastTapT=T;LT.streakKey=reg.key;
    ripple(x,y);if(LT.streak>0){for(let i=0;i<Math.min(6,LT.streak);i++)spawn('conf',x,y,{vx:rnd(-90,90)*s,vy:-rnd(60,160)*s,life:.8,size:rnd(3,5)*s*(1+LT.streak*.08)});}}
  applyShine(reg,cause,x,y);
  const ra=AN.rabbit;
  if(!objHit&&ra.vis&&!ra.inCombo&&ra.state==='idle'){const c=animalCenter(ra);if(dist(c.x,c.y,x,y)<spotR()*1.3)ra.shy=Math.max(ra.shy,.8);}

const REGION_USE={};
function applyShine(reg,cause,x,y){
  if(reg.id!=='corner') LT.reflect=null;
  if(reg.id!=='blocks'&&reg.id!=='tower') catAway();
  if(FIN.on&&!PARADE.on){if(cause==='tap'){SFX.tap(1.1);sparkle(x,y,3,10);}return;}
  switch(reg.id){
    case 'box': shineBox(cause);break;
    case 'nearBox': if(cause!=='level') shineNearBox(x,y);break;
    case 'under': shineUnder(x,y,cause);break;
    case 'blocks': shineBlocks(cause);break;
    case 'corner': if(cause!=='level') shineCorner(reg.k);break;
    case 'mirror': if(cause!=='level') shineMirror();break;
    case 'ribbon': if(cause!=='level') shineRibbon();break;
    case 'key': if(cause!=='level') shineKey();break;
    case 'star': if(cause!=='level') shineStar();break;

function interactable(a){return a.vis&&!a.inCombo&&a.state==='idle'&&!a.mv;}

let PTR=null;
function toWorld(cx,cy){const z=FIN.zoom||1,ox=W/2,oy=H*.52;return {x:ox+(cx-ox)/z,y:oy+(cy-oy)/z};}
function toScreen(x,y){const z=FIN.zoom||1,ox=W/2,oy=H*.52;return {x:ox+(x-ox)*z,y:oy+(y-oy)*z};}
function hitAt(x,y){
  const sr=r=>Math.max(r*1.3,28);
  if(dist(x,y,G.sunS.x,G.sunS.y)<sr(G.sunS.r)) return {act:'sun',big:false};
  if(dist(x,y,G.sunB.x,G.sunB.y)<sr(G.sunB.r)) return {act:'sun',big:true};
  if(PARADE.on){if(inFlash(x,y))return {act:'flash'};return null;}
  if(FIN.on) {if(inFlash(x,y))return {act:'flash'};return null;}
  let best=null,bs=1e9;
  const cand=(o,d,r)=>{if(d<r){const q=d/r;if(q<bs){bs=q;best=o;}}};
  for(const k of ['bow','key','bell','star']){const it=IT[k];if(it.state==='delivered'){const p=itemXY(it);cand({act:'item',it:it},dist(x,y,p.x,p.y),Math.max(36*s,30));}}
  if(PED.combo){const cb=PED.combo;cand({act:'combo'},dist(x,y,cb.x,cb.y-28*s),Math.max(42*s,34));}
  ['rabbit','bird','mouse'].forEach(k=>{const a=AN[k];if(!a.vis||a.inCombo)return;if(a.kind==='mouse'&&['emerge','hide','hole'].indexOf(a.state)>=0)return;if(a.kind==='bird'&&a.state==='emerge')return;

  for(let k=0;k<4;k++){if(!cornerVisible(k))continue;const c=cornerPos(k);const d=dist(x,y,c.x,c.y),r=Math.max(30*s,26);if(d<r&&d/r<bs)return null;}
  if(best) return best;
  for(const sl of ['carHook','carKey','carTop']){const p=sl==='carHook'?slotXY('bell'):anchor(sl);if(dist(x,y,p.x,p.y)<Math.max(26*s,24))return {act:'slot',slot:sl};}
  if(inPed(x,y)&&(PED.slots[0]||PED.slots[1]||PED.combo||y<G.ped.cy+10*s)) return {act:'ped'};
  if(inFlash(x,y)) return {act:'flash'};
  if(inCar(x,y)) return {act:'car'};
  return null;
}
function onDown(sx,sy){
  const p=toWorld(sx,sy), x=p.x, y=p.y;
  HINT.lastInput=T;HINT.demo=null;
  evlog('tap',Math.round(sx)+','+Math.round(sy));
  if(CUR.v>.05) return {mode:'none'};
  const h=hitAt(x,y);
  if(h&&h.act==='sun'){setLevel(h.big?2:0);return {mode:'none'};}
  if(h&&h.act==='flash'){SFX.click();G.pivot.bob=1;ripple(x,y);return {mode:'aim',x:x,y:y};}
  shineAt(x,y,'tap',!!h);
  if(h){
    if(h.act==='item'){h.it.lift=1;SFX.tap(1.25);return {mode:'item',it:h.it,x:x,y:y,sx:sx,sy:sy};}
    if(h.act==='animal') tapAnimal(h.a);
    else if(h.act==='combo') tapCombo();
    else if(h.act==='slot') tapSlot(h.slot);
    else if(h.act==='ped') tapPed();
    else if(h.act==='car') tapCar();
  }
  return {mode:'aim',x:x,y:y,sx:sx,sy:sy};
}

document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){audioUnlock();}});

/* ---------- S20 frame loop ---------- */
function updBox(dt){
  BOX.squash=Math.max(0,BOX.squash-dt*3.5);BOX.glow=Math.max(0,BOX.glow-dt*1.2);BOX.kick=Math.max(0,BOX.kick-dt*2);
  BOX.lid=lerp(BOX.lid,BOX.lidTo,1-Math.exp(-dt*9));
  if(AN.rabbit.state==='box'){
    BOX.nextPeek-=dt;
    if(BOX.nextPeek<=0&&BOX.peekT===undefined){BOX.peekT=T;}
    if(BOX.peekT!==undefined){
      const t=(T-BOX.peekT)/1.5;
      const k=t<.2?eOut(t/.2):t<.75?1:t<1?1-eIO((t-.75)/.25):0;
      BOX.peek=k;BOX.peekPhase=k;
      if(t>=1){BOX.peekT=undefined;const idle=T-HINT.lastInput;BOX.nextPeek=(idle>10||!DISC.d1&&HINT.lastInput<=HINT.roundStart)?rnd(1,1.6):rnd(2.2,3.4);}
      if(t>.2&&t<.24&&!BOX.peeped){BOX.peeped=1;SFX.tap(.6);}
      if(t>=1) BOX.peeped=0;
    }
  } else {BOX.peek=0;BOX.peekPhase=0;}
}
function update(dt){
  runTimers();musicTick();
  updLight(dt);updBox(dt);updBlocks(dt);
  MIR.shimmer=Math.max(0,MIR.shimmer-dt);MIR.flash=Math.max(0,MIR.flash-dt*2);MIR.hintBird=Math.max(0,MIR.hintBird-dt);
  SHELF.sway=Math.max(0,SHELF.sway-dt);SHELF.wob=Math.max(0,SHELF.wob-dt*2);SHELF.toyWob=Math.max(0,SHELF.toyWob-dt);
  if(IT.key.state!=='hidden') SHELF.keyBox=Math.min(1,SHELF.keyBox+dt*2);
  if(IT.star.state==='shelf'&&SHELF.starWob>0){SHELF.starWob=Math.max(0,SHELF.starWob-dt*2);}
  UNDER.lit=Math.max(0,UNDER.lit-dt);UNDER.glint=Math.max(0,UNDER.glint-dt);UNDER.eyes=Math.max(0,UNDER.eyes-dt);
  updCat(dt);updCar(dt);
  PED.lean=lerp(PED.lean,PED.leanTo,1-Math.exp(-dt*6));PED.glow=Math.max(0,PED.glow-dt);
  ['rabbit','bird','mouse'].forEach(k=>updAnimal(AN[k],dt));
  updCombo(dt);updItems(dt);updFootprints();updParticles(dt);
  updFinale(dt);updParade(dt);updHint(dt);updCurtain(dt);updDrag();
  if(G.pivot.bob) G.pivot.bob=Math.max(0,G.pivot.bob-dt*3);
}
function drawOuter(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe3ee');g.addColorStop(1,'#fff1d2');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const n=Math.ceil(W/(24*s));
  for(let i=0;i<=n;i++){const x=i*W/n,y=10*s+Math.sin(i*.9)*4*s;ctx.fillStyle=(i+Math.floor(T*3))%3===0?'#fff4a8':CEL[CEL_LIST[i%7]];ctx.beginPath();ctx.arc(x,y,4*s,0,TAU);ctx.fill();}
  for(let i=0;i<=n;i++){const x=i*W/n,y=H-12*s;ctx.fillStyle=(i+Math.floor(T*3))%3===1?'#fff4a8':CEL[CEL_LIST[(i+3)%7]];ctx.beginPath();ctx.arc(x,y,4*s,0,TAU);ctx.fill();}
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const z=FIN.zoom;
  if(z<.999) drawOuter();
  ctx.save();
  if(z<.999){ctx.translate(W/2,H*.52);ctx.scale(z,z);ctx.translate(-W/2,-H*.52);}
  ctx.drawImage(bg,0,0,W,H);
  if(z<.999){ctx.strokeStyle='#f3b26a';ctx.lineWidth=16;ctx.strokeRect(-8,-8,W+16,H+16);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.strokeRect(-14,-14,W+28,H+28);}
  drawParadeLights();
  drawGarland();
  drawRainbow();
  drawMirror();
  drawShelfDyn();
  drawWallShadows();
  drawCatShadow();
  drawStageDeco();
  drawUnder();
  drawCarousel();
  if(FIN.tower<1){ctx.save();ctx.globalAlpha=1-FIN.tower;drawBlocks(false);ctx.restore();}
  drawTower();
  drawPedestal();
  drawBox();
  drawFootprints();
  // 奥→手前の順で
  const list=[];
  ['rabbit','bird','mouse'].forEach(k=>{const a=AN[k];if(a.vis&&!a.inCombo)list.push({y:a.y+(a.state==='fly'?40*s:0),f:()=>drawAnimal(a)});});
  if(PED.combo) list.push({y:PED.combo.y,f:drawCombo});
  list.sort((p,q)=>p.y-q.y).forEach(o=>o.f());
  drawItems();
  if(PARADE.on) drawParade();
  drawBeam();
  drawFlashlight();
  drawParticles();
  drawCord();
  drawHint();
  drawHand();
  ctx.restore();
  drawCurtains();
}
let raf=0,lastNow=0,FRAMES=0,FT_SUM=0,FT_MAX=0;
function frame(now){
  raf=0;
  if(document.hidden) return;
  let dt=lastNow?(now-lastNow)/1000:.016;lastNow=now;
  if(dt>.25) dt=.016;
  const ft0=performance.now();
  dt=Math.min(.05,dt)*timeScale;
  T+=dt;
  guard(()=>update(dt));
  guard(draw);
  const ft=performance.now()-ft0;FRAMES++;FT_SUM+=ft;FT_MAX=Math.max(FT_MAX,ft);
  raf=requestAnimationFrame(frame);
}
function startLoop(){if(!raf&&!document.hidden){lastNow=0;raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}if(PTR){const o=PTR;guard(()=>onUp(o.sx0,o.sy0,true));PTR=null;}try{if(AU.c&&AU.c.state==='running')AU.c.suspend();}catch(e){}evlog('hidden');}
  else{try{if(AU.c&&AU.c.state!=='running'&&AU.c.state!=='closed'){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}}catch(e){}HINT.lastInput=T;if(MUS.on&&AU.c)MUS.next=AU.c.currentTime+.1;evlog('visible');startLoop();}
});
let rzPending=false;
function resize(){
  const oldR=Object.assign({},R),hadGeo=!!G.box;
  W=Math.max(1,Math.round(window.innerWidth));H=Math.max(1,Math.round(window.innerHeight));
  DPR=Math.min(2,window.devicePixelRatio||1);
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);cvs.style.width=W+'px';cvs.style.height=H+'px';
  const cs=getComputedStyle(saEl);
  const sl=parseFloat(cs.paddingLeft)||0,st=parseFloat(cs.paddingTop)||0,sr=parseFloat(cs.paddingRight)||0,sb=parseFloat(cs.paddingBottom)||0;
  const pad=4;
  R={x:sl+pad,y:st+pad,w:Math.max(50,W-sl-sr-pad*2),h:Math.max(50,H-st-sb-pad*2)};
  portrait=R.h>=R.w;LY=portrait?LP:(R.w/R.h>1.75?LLW:LL);
  s=Math.min(R.w/LY.D[0],R.h/LY.D[1]);
  buildGeo();renderBG();
  if(hadGeo){
    const remap=o=>{if(!o)return;if(!o.at){o.x=R.x+(o.x-oldR.x)/oldR.w*R.w;o.y=R.y+(o.y-oldR.y)/oldR.h*R.h;}if(o.mv){o.mv.fx=R.x+(o.mv.fx-oldR.x)/oldR.w*R.w;o.mv.fy=R.y+(o.mv.fy-oldR.y)/oldR.h*R.h;}};
    ['rabbit','bird','mouse'].forEach(k=>remap(AN[k]));for(const k in IT)remap(IT[k]);remap(PED.combo);
    LT.tx=R.x+(LT.tx-oldR.x)/oldR.w*R.w;LT.ty=R.y+(LT.ty-oldR.y)/oldR.h*R.h;LT.x=LT.tx;LT.y=LT.ty;
    PART.length=0;
    const rx=v=>R.x+(v-oldR.x)/oldR.w*R.w, ry=v=>R.y+(v-oldR.y)/oldR.h*R.h;
    FP.forEach(fp_=>{fp_.x=rx(fp_.x);fp_.y=ry(fp_.y);});
    if(FP_END){FP_END.x=rx(FP_END.x);FP_END.y=ry(FP_END.y);}
    UNDER.glintX=rx(UNDER.glintX);UNDER.glintY=ry(UNDER.glintY);
    if(HINT.demo) HINT.demo=null;
  }
  evlog('resize',W+'x'+H+(portrait?' P':' L'));
}
function queueResize(){if(rzPending)return;rzPending=true;requestAnimationFrame(()=>{rzPending=false;guard(resize);});}
window.addEventListener('resize',queueResize);
window.addEventListener('orientationchange',()=>{setTimeout(queueResize,60);setTimeout(queueResize,350);});
if(window.visualViewport) window.visualViewport.addEventListener('resize',queueResize);

/* ---------- S21 boot & test hooks ---------- */
function boot(){
  loadMem();
  MEM.visits=Math.min(99999,MEM.visits+1);
  sessionStartMem=JSON.parse(JSON.stringify(MEM));
  saveMem();
  resize();
  setupRound(true);
  HINT.roundStart=T;
  startLoop();
}
window.__kg={
  pos(id){
    let p=null;
    const A=n=>anchor(n);
    if(id==='box')p={x:G.box.cx,y:G.box.cy};
    else if(id==='boxEdgeFloor'){p=anchor('floorSpot');}
    else if(id==='under')p={x:G.sh.cx,y:(G.under.y0+G.under.y1)/2};
    else if(id==='bell')p=IT.bell.state==='hidden'?A('bell'):itemXY(IT.bell);
    else if(id==='hole')p={x:A('hole').x,y:A('hole').y-8*s};
    else if(id==='blocks')p={x:G.blk.cx,y:G.blk.by-(BLK.state==='house'?50:2)*s};
    else if(/^corner\d$/.test(id))p=cornerPos(+id[6]);
    else if(id==='mirror')p={x:G.mir.cx,y:G.mir.cy};
    else if(id==='sunS'||id==='sunB')p={x:G[id].x,y:G[id].y};
    else if(id==='ped')p={x:G.ped.cx,y:G.ped.cy};
    else if(id==='rabbit'||id==='bird'||id==='mouse'){const a=AN[id];if(!a.vis)return null;p=animalCenter(a);}
    else if(id==='combo'){if(!PED.combo)return null;p={x:PED.combo.x,y:PED.combo.y-28*s};}
    else if(id.indexOf('item:')===0){const it=IT[id.slice(5)];p=itemXY(it);}
    else if(id==='carHook')p=slotXY('bell');else if(id==='carKey'||id==='carTop')p=A(id);
    else if(id==='car')p={x:G.car.cx,y:G.car.by-G.car.h*.5};
    else if(id==='ribbon')p=A('ribbonShelf');else if(id==='key')p=A('keyShelf');else if(id==='star')p={x:A('starShelf').x,y:G.sh.low-14*s};
    else if(id==='cord'){if(!PARADE.cordShown)return null;p=cordPos();p={x:p.x,y:p.y+10*s};}
    else if(id==='ferris')p={x:G.box.cx,y:G.box.top-72*s};
    else if(id==='tower')p={x:G.blk.cx,y:G.blk.by-130*s};
    else if(id==='tunnel')p={x:G.mir.cx+G.mir.w*.34,y:G.mir.top+G.mir.w*.45};
    else if(id==='stage')p={x:G.sh.cx,y:G.sh.mid};
    else if(id==='wall')p={x:lerp(G.car.cx,G.sh.x0,.5),y:Y(.45)};
    else if(id==='floor')p={x:lerp(G.car.cx,G.ped.cx,.5),y:lerp(G.floorY,G.ped.top,.5)};
    else if(id.indexOf('member:')===0){const m=PARADE.members[+id.slice(7)];if(!m)return null;const d=memberDraw(m);if(!d)return null;p={x:d.x,y:d.y-18*s};}
    if(!p) return null;
    const q=toScreen(p.x,p.y);return {x:Math.round(q.x),y:Math.round(q.y)};
  },
  get disc(){return Object.assign({},DISC);}, get order(){return DISC_ORDER.slice();},
  get ev(){return EVLOG.slice();}, get err(){return ERR.slice();},
  get mem(){return JSON.parse(JSON.stringify(MEM));}, get store(){return storeState;},
  get level(){return LT.level;}, get hint(){return {id:HINT.id,amp:HINT.amp,demo:!!HINT.demo,grace:!!HINT.grace};},
  get state(){return {rabbit:AN.rabbit.state,bird:AN.bird.state,mouse:AN.mouse.state,bell:IT.bell.state,key:IT.key.state,ribbon:IT.ribbon.state,bow:IT.bow.state,star:IT.star.state,ped:PED.slots.map(a=>a&&a.kind),combo:PED.combo&&PED.combo.type,comboState:PED.combo&&PED.combo.state,parts:Object.assign({},CAR.parts),finale:FIN.on,parade:PARADE.on,cord:PARADE.cordShown,blocks:BLK.state,mirror:MIR.revealed,cat:CAT.mode+':'+CAT.visTo,fp:FP_SHOWN,portrait:portrait,s:s,zoom:FIN.zoom,curtain:CUR.v,round:MEM.rounds,hat:V.hat,particles:PART.length,ptint:PARADE.tunnelTint,phue:PARADE.towerHue,members:PARADE.members.map(m=>m.kind+(m.combo?'/'+m.combo.kind:'')+(m.tint>=0?'#'+m.tint:''))};},
  get perf(){return {frames:FRAMES,avg:FRAMES?FT_SUM/FRAMES:0,max:FT_MAX};},
  resetPerf(){FRAMES=0;FT_SUM=0;FT_MAX=0;},
  set timeScale(v){timeScale=clamp(+v||1,.1,8);}, get timeScale(){return timeScale;},
  get T(){return T;}, get running(){return !!raf;},
  get V(){return JSON.parse(JSON.stringify(V));},
  get audio(){return AU.c?AU.c.state:'none';},
  get R(){return Object.assign({},R);}
};
guard(boot);

})();
