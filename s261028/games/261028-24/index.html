let layoutGen = 0;

function readSafe() {
  try {
    const s = getComputedStyle(document.getElementById('sa'));
    SAFE.t = parseFloat(s.paddingTop) || 0; SAFE.r = parseFloat(s.paddingRight) || 0;
    SAFE.b = parseFloat(s.paddingBottom) || 0; SAFE.l = parseFloat(s.paddingLeft) || 0;

  // 縦に余るときは少し上寄せ（屋根と空を多めに）

  bellMain(x) { if (AU.gate('bm', 150)) bellTone(1568, 0.22, 2.2, panOf(x)); },

  if (t < 0.5) { x = d.a.x + 30; y = d.a.y + 60 - t * 80; al = t / 0.5 * 0.85; }
  else if (t < 0.8) { x = d.a.x; y = d.a.y + 20; press = (t - 0.5) / 0.3; }
  else if (t < 2.3) {
    const k = ease((t - 0.8) / 1.5); press = 1;
    if (d.lift) { const mx = lerp(d.a.x, d.b.x, k), my = lerp(d.a.y, d.b.y, k) - Math.sin(k * Math.PI) * 80; x = mx; y = my + 20; }
    else { x = lerp(d.a.x, d.b.x, k); y = lerp(d.a.y, d.b.y, k) + 20 - Math.sin(k * Math.PI) * 30; }
  } else { x = d.b.x; y = d.b.y + 20 + (t - 2.3) * 40; press = Math.max(0, 1 - (t - 2.3) / 0.3); al = Math.max(0, 0.85 * (1 - (t - 2.3) / 0.7)); }

// ===== 端末内の保存（初回・復元・破損・拒否）=====
const SAVE_KEY = 'nekoasa24_v1';

  if (!saveOK) return;

    magnet: [TOOLS.magnet.x, TOOLS.magnet.y], spring: [TOOLS.spring.x, TOOLS.spring.y], windmill: [TOOLS.windmill.x, TOOLS.windmill.y],
    plates: PLATES.map((p) => ({ x: p.x, y: p.y, slot: p.slot, water: +p.water.toFixed(3), big: !!p.big, from: p.from || null, col: p.col, rim: p.rim, hw: p.hw })),
    curtain: S.curtain, flag: +S.flag.toFixed(3), shelfOpen: S.shelfOpen, doorOpen: S.doorOpen, catSpot: S.catSpot,
    served: S.served, rounds: S.rounds, kettle: +KET.water.toFixed(3), found: S.found, pal: SES.pal, bp: !!bp,

}
const num = (v, a, b) => typeof v === 'number' && isFinite(v) && v >= a && v <= b;
const pt = (v) => Array.isArray(v) && v.length === 2 && num(v[0], -100, 820) && num(v[1], -200, 1000);
function validSave(d) {
  if (!d || typeof d !== 'object' || d.v !== 1) return false;
  if (['kitchen', 'stall'].indexOf(d.phase) < 0 || ['L', 'R'].indexOf(d.spoonSlot) < 0) return false;
  if (!pt(d.magnet) || !pt(d.spring) || !pt(d.windmill)) return false;
  if (!Array.isArray(d.plates) || d.plates.length > 6) return false;
  for (const p of d.plates) { if (!p || !num(p.x, -100, 820) || !num(p.y, -200, 1000) || !num(p.water, 0, 2) || [null, 'seesaw', 'bracket'].indexOf(p.slot) < 0) return false; }
  if (!num(d.curtain, 0, 1) || !num(d.flag, 0, 1) || !num(d.kettle, 0, 1)) return false;
  if (Object.keys(SPOTS).indexOf(d.catSpot) < 0) return false;
  return true;
}
function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { saveOK = false; return 'denied'; }
  if (!raw) return 'first';
  let d = null;
  try { d = JSON.parse(raw); } catch (e) { d = null; }
  if (!validSave(d)) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} return 'corrupt'; }

  const cl = (v, a, b) => clamp(v, a, b);
  TOOLS.magnet.x = cl(d.magnet[0], 16, 704); TOOLS.magnet.y = cl(d.magnet[1], -30, 896);
  TOOLS.spring.x = cl(d.spring[0], 16, 704); TOOLS.spring.y = surfaceBelow(TOOLS.spring.x, cl(d.spring[1], -30, 896) - 4, true);
  TOOLS.windmill.x = cl(d.windmill[0], 16, 704); TOOLS.windmill.y = cl(d.windmill[1], -30, 896);
  PLATES.length = 0;
  const cols = [C.white, C.skyL, C.ygL, C.yamL, C.verL], rims = [C.ver, C.yg, C.sky, C.yam];
  for (const p of d.plates) {
    const pl = mkPlate({ x: cl(p.x, 16, 704), y: cl(p.y, -30, 900), slot: p.slot, water: cl(p.water, 0, 1.2), big: !!p.big, from: typeof p.from === 'string' ? p.from : null,
      col: cols.indexOf(p.col) >= 0 ? p.col : C.white, rim: rims.indexOf(p.rim) >= 0 ? p.rim : C.sky, hw: p.big ? 54 : 40 });
    if (!pl.slot) pl.y = surfaceBelow(pl.x, pl.y - 4, true);
  }
  if (!PLATES.some((p) => p.big)) mkPlate({ x: 392, y: 812, big: true, hw: 54, col: C.white, rim: C.sky });
  S.curtain = d.curtain > 0.5 ? 1 : 0; S.flag = d.flag; S.shelfOpen = d.shelfOpen ? 1 : 0; S.doorOpen = d.doorOpen ? 1 : 0;
  S.catSpot = d.catSpot; S.served = num(d.served, 0, 1e6) ? d.served : 0; S.rounds = num(d.rounds, 0, 1e6) ? d.rounds : 0;
  KET.water = Math.max(0.5, d.kettle); // 再訪時は少し補充されている

}
function sessionDefaults() {
  // 毎回少しだけ違う（因果は変えない安全な位置だけ）
  const mg = pick([[672, 770], [676, 758], [668, 782]]); TOOLS.magnet.x = mg[0]; TOOLS.magnet.y = mg[1];
  const wm = pick([[300, 92], [246, 96], [292, 120]]); TOOLS.windmill.x = wm[0]; TOOLS.windmill.y = wm[1];
  const sp = pick([[596, 198], [482, 198], [560, 198]]); TOOLS.spring.x = sp[0]; TOOLS.spring.y = sp[1];
  mkPlate({ x: 392 + rnd(-14, 14), y: 812, big: true, hw: 54, col: C.white, rim: pick([C.sky, C.ver, C.yg]) });
  KET.water = SES.kettle0;
}

// ===== 効果（粒）=====
function fxStep(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i]; f.t += dt;
    if (f.k === 'puff' || f.k === 'spark' || f.k === 'heart') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 1 - dt * 2.5; f.vy = f.k === 'spark' ? f.vy + 500 * dt : f.vy * (1 - dt * 2); }
    else if (f.k === 'drip' || f.k === 'crumb') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 1400 * dt; }
    else if (f.k === 'drop') { f.vy += 1200 * dt; f.y += f.vy * dt; if (f.y >= f.y1) { FX.splice(i, 1); continue; } }
    else if (f.k === 'lidFly') { if (f.t >= f.life) { LID.on = true; SFX.clink(POT.x); } }
    if (f.t >= f.life) FX.splice(i, 1);
  }
}
function drawFX() {
  for (const f of FX) {
    const k = clamp(f.t / f.life, 0, 1);
    if (f.k === 'puff') { g.save(); g.globalAlpha = 0.85 * (1 - k); circ(f.x, f.y, f.r * (1 + k), f.col, 2.5, { shade: false }); g.restore(); }
    else if (f.k === 'spark') { g.save(); g.globalAlpha = 1 - k * 0.7; sparkle(f.x, f.y, f.r * (1 - k * 0.4), f.col, f.rot + f.t * 6); g.restore(); }
    else if (f.k === 'ring') { g.save(); g.globalAlpha = 1 - k; strokeP(() => g.arc(f.x, f.y, lerp(f.r0, f.r1, easeOut(k)), 0, TAU), 4 * (1 - k) + 1, f.col === C.white ? C.ink : f.col); g.restore(); }
    else if (f.k === 'drip' || f.k === 'drop') { dot(f.x, f.y, f.r || 4, C.sky); }
    else if (f.k === 'crumb') { dot(f.x, f.y, f.r, f.col); }
    else if (f.k === 'heart') { g.save(); g.globalAlpha = 1 - k * k; heart(f.x, f.y, f.r, f.col); g.restore(); }
    else if (f.k === 'slide') { g.save(); g.globalAlpha = 1 - k; drawFoodIcon('bread', TOAST.x, TOAST.y - 30 - (1 - k) * 30, 0, 0.8); g.restore(); }
    else if (f.k === 'lidFly') { const e = ease(k), h = LID.home(); const x = lerp(f.x0, h.x, e), y = lerp(f.y0, h.y, e) - Math.sin(e * Math.PI) * 120; g.save(); g.translate(x, y); g.rotate(e * TAU); drawLidShape(); g.restore(); }
  }
}

// ===== 描画 =====
function render() {
  if (CACHE.gen !== layoutGen) buildCaches();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(CACHE.garden, 0, 0);
  worldTf(g);
  drawGardenLife();
  drawGuests(true);
  drawWall();
  drawWindow(); drawDoor(); drawCupboard(); drawCeiling(); drawFlag(); drawStrings();
  drawTable(); drawGuests(false);
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(CACHE.front, 0, 0); worldTf(g);
  drawShelves(); drawBells(); drawPot(); drawKettle(); drawSeesaw(); drawWheel(); drawToaster();
  drawAwning();
  drawSpoon(); drawBodies(); drawWater();
  for (const pl of PLATES) drawPlate(pl);
  drawSpring(); drawWindmill(); drawMagnet(); drawTray();
  drawCat();
  drawFX();
  drawHint();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = GRAIN_PAT; g.fillRect(0, 0, cv.width, cv.height);
}
// ===== 更新 =====
function update(h) {
  T += h;
  timersStep();
  spoonStep(h); potStep(h); kettleStep(h); steamStep(h); waterStep(h); wheelStep(h); toasterStep(h); seesawStep(h);
  for (const pl of PLATES) plateStep(pl, h);
  toolsStep(h);
  for (const b of BODIES) stepBody(b, h);
  foodStep(h); bellsStep(h); cordStep(h);
  catStep(h); guestsStep(h); trayStep(h); gardenStep(h); paradeStep(h); morphStep(h);
  fxStep(h); PUDDLE.step(h);
  if (WHEEL.jig > 0) WHEEL.jig = Math.max(0, WHEEL.jig - h * 3);
  roundStep(h); hintStep(h);

}
let lastTS = 0, loopOn = false, rafId = 0, frames = 0;
function frame(ts) {

  rafId = requestAnimationFrame(frame);
  let dt = (ts - lastTS) / 1000; lastTS = ts;
  if (!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 1 / 20) * timeScale;
  const n = Math.max(1, Math.ceil(dt / (1 / 120)));

}

function stopLoop() { loopOn = false; try { cancelAnimationFrame(rafId); } catch (e) {} }
document.addEventListener('visibilitychange', () => {

  else { AU.resume(); startLoop(); }

  newMandarin(false);
  const sp = SPOTS[S.catSpot] || SPOTS.cushion; CAT.x = sp.x; CAT.y = sp.y; CAT.face = sp.face;

}
window.__NK = { S, CAT, SPOON, TOOLS, PLATES, POT, KET, WHEEL, TOAST, SEE, BELLS, GUESTS, ROUND, BODIES, HINT, CORD, LID, SES, VIS: () => VIS,

init();
