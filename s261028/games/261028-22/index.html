<script>
'use strict';
/* =========================================================
   ぶたシェフのぱくぱく変身食堂
   単一ファイル・外部依存なし・文字UIなし
   ========================================================= */

/* ---------- 基本ユーティリティ ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = t => t * t * (3 - 2 * t);
function damp(cur, target, k, dt) { return lerp(cur, target, 1 - Math.exp(-k * dt)); }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32((Date.now() ^ 0x5bd1e995) >>> 0);
const rand = (a = 0, b = 1) => a + (b - a) * rng();
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
/* 揺れ(見た目専用)は別系列の乱数で、因果の乱数と混ぜない */
const vrng = mulberry32(12345);
const vrand = (a = 0, b = 1) => a + (b - a) * vrng();

/* 色ユーティリティ */
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const _rgbCache = new Map();
function rgb(h) { let v = _rgbCache.get(h); if (!v) { v = hexToRgb(h); _rgbCache.set(h, v); } return v; }
function rgba(h, a) { const c = rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mix(h1, h2, t) {
  const a = rgb(h1), b = rgb(h2);
  const r = Math.round(lerp(a[0], b[0], t)), g = Math.round(lerp(a[1], b[1], t)), bl = Math.round(lerp(a[2], b[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function darken(h, t) { return mix(h, '#3a2a22', t); }
function lighten(h, t) { return mix(h, '#ffffff', t); }

/* 1次元のなめらかなノイズ(輪郭のにじみ用) */
const NOISE = new Float32Array(1024);
(() => { const r = mulberry32(777); for (let i = 0; i < 1024; i++) NOISE[i] = r() * 2 - 1; })();
function noise1(x) {
  const i = Math.floor(x), f = x - i;
  const a = NOISE[i & 1023], b = NOISE[(i + 1) & 1023];
  return lerp(a, b, smooth(f));
}

/* ---------- 音(Web Audio 合成) ---------- */
const AU = {
  ctx: null, master: null, musicBus: null, sfxBus: null, noiseBuf: null,
  sizzle: null, sizzleGain: null, ready: false, lastPitch: 0, combo: 0, comboT: 0,
  musicNext: 0, musicStep: 0, musicMode: 'day',
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.8;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.22; this.musicBus.connect(this.master);
      const len = this.ctx.sampleRate * 1.5;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      /* iOS の無音解除用に極短の無音を鳴らす */
      const b = this.ctx.createBuffer(1, 1, 22050); const s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); s.start(0);
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      this.ready = true;
      this.musicNext = this.ctx.currentTime + 0.3;
    } catch (e) { this.ctx = null; this.ready = false; }
  },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },
  ok() { return this.ready && this.ctx && this.ctx.state === 'running'; },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  env(g, t0, a, peak, d, end = 0.0001) {
    g.gain.cancelScheduledValues(t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0 + a);
    g.gain.exponentialRampToValueAtTime(end, t0 + a + d);
  },
  tone(freq, dur = 0.2, type = 'sine', vol = 0.3, when = 0, glideTo = 0, bus) {
    if (!this.ok()) return;
    const t0 = this.t + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    this.env(g, t0, Math.min(0.012, dur * 0.2), vol, dur);
    o.connect(g); g.connect(bus || this.sfxBus);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur = 0.2, vol = 0.2, f0 = 1200, f1 = 0, q = 1, when = 0, type = 'bandpass') {
    if (!this.ok()) return;
    const t0 = this.t + when;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = this.ctx.createGain();
    this.env(g, t0, Math.min(0.02, dur * 0.3), vol, dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  },
  /* 連続タップで音程が上がる(五音音階) */
  scaleNote(step) { const sc = [0, 2, 4, 7, 9]; const o = Math.floor(step / 5); return 523.25 * Math.pow(2, (sc[((step % 5) + 5) % 5] + o * 12) / 12); },
  bump() { const now = performance.now(); if (now - this.comboT > 1400) this.combo = 0; this.comboT = now; this.combo = Math.min(this.combo + 1, 9); return this.combo; },
  pop(pitch = 0) { const c = this.bump(); const f = this.scaleNote(c + pitch); this.tone(f, 0.12, 'triangle', 0.22); this.tone(f * 2, 0.06, 'sine', 0.06, 0.01); },
  tick() { this.tone(900 + Math.random() * 200, 0.05, 'sine', 0.06); },
  wiggle() { this.tone(620 + Math.random() * 80, 0.09, 'sine', 0.07, 0, 520); },
  slide() { this.noise(0.28, 0.12, 2400, 600, 0.8); this.tone(700, 0.22, 'sine', 0.12, 0, 1100); },
  place() { this.tone(330, 0.08, 'triangle', 0.18); this.noise(0.05, 0.08, 3000, 0, 2); },
  eat() { this.tone(250, 0.07, 'square', 0.08, 0, 140); this.noise(0.05, 0.12, 900, 0, 1.5); this.tone(520, 0.06, 'sine', 0.14, 0.12); this.tone(470, 0.06, 'sine', 0.14, 0.24); },
  sparkle(base = 0) { for (let i = 0; i < 5; i++) this.tone(this.scaleNote(5 + base + i), 0.25, 'sine', 0.1, i * 0.06); },
  success() { const n = [0, 4, 7, 12, 16]; n.forEach((s, i) => this.tone(659.25 * Math.pow(2, s / 12), 0.5, 'triangle', 0.14, i * 0.08)); this.tone(1318.5, 0.9, 'sine', 0.06, 0.4); },
  chill() { for (let i = 0; i < 4; i++) this.tone(1800 + Math.random() * 1600, 0.35, 'sine', 0.05, i * 0.05); },
  mixSnd() { for (let i = 0; i < 4; i++) this.tone(180 + i * 30, 0.18, 'sine', 0.12, i * 0.09, 120 + i * 40); },
  boing(h = 1) { this.tone(180 * h, 0.35, 'sine', 0.25, 0, 520 * h); this.tone(90 * h, 0.3, 'triangle', 0.08, 0, 260 * h); },
  thud() { this.tone(70, 0.4, 'sine', 0.35, 0, 40); this.noise(0.2, 0.1, 300, 80, 1, 0, 'lowpass'); },
  squeak() { this.tone(1500, 0.08, 'sine', 0.12, 0, 2100); this.tone(1900, 0.07, 'sine', 0.1, 0.09, 2500); },
  bubble() { for (let i = 0; i < 3; i++) this.tone(400 + Math.random() * 500, 0.12, 'sine', 0.08, i * 0.07, 900 + Math.random() * 400); },
  swish() { this.noise(0.4, 0.1, 4000, 1500, 0.6); },
  wood() { this.tone(420, 0.1, 'triangle', 0.2); this.tone(300, 0.12, 'triangle', 0.16, 0.1); },
  bell() {
    if (!this.ok()) return;
    const parts = [1, 2.0, 2.76, 5.4, 8.9];
    parts.forEach((p, i) => this.tone(392 * p, 2.6 - i * 0.35, 'sine', 0.22 / (i + 1), 0));
    this.tone(196, 2.2, 'sine', 0.12);
  },
  ding() { this.tone(1568, 0.25, 'sine', 0.08); },
  sneeze() { this.noise(0.12, 0.12, 2000, 3000, 2); this.noise(0.35, 0.3, 1600, 500, 1.2, 0.18); this.tone(300, 0.2, 'sawtooth', 0.04, 0.18, 150); },
  camera() { this.noise(0.05, 0.2, 5000, 0, 3); this.noise(0.09, 0.12, 2500, 0, 3, 0.08); },
  page() { this.noise(0.5, 0.12, 900, 3000, 0.7); },
  whoosh() { this.noise(0.6, 0.12, 400, 2000, 0.7); },
  fanfare() { const m = [0, 4, 7, 12, 7, 12, 16]; m.forEach((s, i) => this.tone(523.25 * Math.pow(2, s / 12), 0.3, 'triangle', 0.12, i * 0.12)); },
  /* 鉄板のじゅうじゅう(ループ) */
  setSizzle(level) {
    if (!this.ok()) return;
    if (!this.sizzle) {
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
      const g = this.ctx.createGain(); g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(this.sfxBus); s.start();
      this.sizzle = s; this.sizzleGain = g;
    }
    const target = level > 0 ? 0.03 + 0.05 * Math.min(1, level) * (0.7 + Math.random() * 0.6) : 0;
    this.sizzleGain.gain.setTargetAtTime(target, this.t, 0.05);
  },
  /* 音楽(rAF から先読みで予約) */
  musicTick() {
    if (!this.ok()) return;
    const now = this.t;
    if (this.musicNext < now - 0.5) this.musicNext = now + 0.05;
    const fest = this.musicMode === 'fest';
    const stepDur = fest ? 0.19 : 0.36;
    const mel = fest ? [0, 2, 4, 7, 9, 7, 4, 2, 4, 7, 9, 12, 9, 7, 4, 2]
                     : [0, -1, 4, -1, 7, -1, 4, 2, -1, 0, -1, 9, 7, -1, 4, -1];
    while (this.musicNext < now + 0.35) {
      const i = this.musicStep % 16, n = mel[i];
      if (n >= 0) {
        const f = 392 * Math.pow(2, n / 12);
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = fest ? 'triangle' : 'sine'; o.frequency.value = f;
        const t0 = this.musicNext;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(fest ? 0.5 : 0.35, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + stepDur * 1.8);
        o.connect(g); g.connect(this.musicBus); o.start(t0); o.stop(t0 + stepDur * 2);
      }
      if (fest && i % 4 === 0) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(140, this.musicNext); o.frequency.exponentialRampToValueAtTime(60, this.musicNext + 0.15);
        g.gain.setValueAtTime(0.6, this.musicNext); g.gain.exponentialRampToValueAtTime(0.0001, this.musicNext + 0.18);
        o.connect(g); g.connect(this.musicBus); o.start(this.musicNext); o.stop(this.musicNext + 0.2);
      }
      if (!fest && i % 8 === 0) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = 196 * (i === 8 ? 1.335 : 1);
        g.gain.setValueAtTime(0.0001, this.musicNext); g.gain.exponentialRampToValueAtTime(0.25, this.musicNext + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, this.musicNext + 1.4);
        o.connect(g); g.connect(this.musicBus); o.start(this.musicNext); o.stop(this.musicNext + 1.5);
      }
      this.musicNext += stepDur; this.musicStep++;
    }
  },
};

/* ---------- 端末内保存(絵本写真のみ) ---------- */
const SAVE_KEY = 'butachef-ehon-v1';
const Save = {
  ok: true, day: 1, photos: [], images: [],
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { this.ok = false; return; }
    if (!raw) return;
    let d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !Array.isArray(d.photos)) { this.reset(); return; }
    this.day = Number.isInteger(d.day) && d.day > 0 && d.day < 100000 ? d.day : 1;
    this.photos = d.photos.filter(p => typeof p === 'string' && p.startsWith('data:image/') && p.length < 400000).slice(-6);
    this.images = [];
    this.photos.forEach((p, i) => this.decode(p, i));
  },
  decode(p, i) {
    const img = new Image();
    img.onload = () => { this.images[i] = img; };
    img.onerror = () => { this.images[i] = null; };
    img.src = p;
  },
  reset() { this.day = 1; this.photos = []; this.images = []; this.store(); },
  store() {
    if (!this.ok) return false;
    try { window.localStorage.setItem(SAVE_KEY, JSON.stringify({ day: this.day, photos: this.photos })); return true; }
    catch (e) {
      /* 容量不足なら古い写真を減らして再試行、それでも駄目なら保存なしで続行 */
      if (this.photos.length > 1) { this.photos.shift(); this.images.shift(); return this.store(); }
      this.ok = false; return false;
    }
  },
  addPhoto(url) {
    if (!url) return;
    this.photos.push(url); if (this.photos.length > 6) this.photos.shift();
    this.images = []; this.photos.forEach((p, i) => this.decode(p, i));
    this.store();
  },
};

/* ---------- 画面とレイアウト ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const safeEl = document.getElementById('safe');
let W = 1, H = 1, DPR = 1, DPR_CAP = 2;
const L = { portrait: true, s: 1, sa: { t: 0, r: 0, b: 0, l: 0 }, TH: 300, tu: 1 };

function readSafe() {
  const cs = getComputedStyle(safeEl);
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}

function computeLayout() {
  W = Math.max(1, Math.round(window.innerWidth)); H = Math.max(1, Math.round(window.innerHeight));
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  const sa = L.sa = readSafe();
  const uw = W - sa.l - sa.r, uh = H - sa.t - sa.b;
  const ux = f => sa.l + f * uw;
  L.portrait = H >= W * 0.9;
  if (L.portrait) {
    const s = L.s = clamp(Math.min(uw / 390, uh / 760), 0.55, 2.6);
    L.TH = Math.round(sa.t + uh * 0.38);
    L.counterY = L.TH + 92 * s;
    L.seatX = [ux(0.2), ux(0.5), ux(0.8)];
    L.animalScale = 1.0 * s;
    const kTop = L.counterY + 44 * s, avail = H - sa.b - kTop;
    L.toolY = kTop + avail * 0.30;
    const tr = Math.min(42 * s, avail * 0.14);
    L.tools = { grill: { x: ux(0.44), y: L.toolY, r: tr }, cool: { x: ux(0.66), y: L.toolY, r: tr * 0.95 }, bowl: { x: ux(0.875), y: L.toolY, r: tr * 0.95 } };
    L.binY = kTop + avail * 0.76;
    L.binX = [ux(0.13), ux(0.375), ux(0.625), ux(0.87)];
    L.binR = Math.min(40 * s, avail * 0.13);
    L.chef = { x: sa.l + 58 * s, y: L.toolY + 2 * s, s: 0.92 * s, face: 1 };
  } else {
    const s = L.s = clamp(Math.min(uw / 760, uh / 640), 0.45, 2.4);
    L.TH = Math.round(sa.t + uh * 0.44);
    L.counterY = L.TH + 112 * s;
    L.seatX = [ux(0.40), ux(0.60), ux(0.80)];
    L.animalScale = 1.12 * s;
    const kTop = L.counterY + 44 * s, avail = H - sa.b - kTop;
    L.toolY = kTop + avail * 0.5;
    const tr = Math.min(50 * s, avail * 0.36, uw * 0.05);
    L.tools = { grill: { x: ux(0.31), y: L.toolY, r: tr }, cool: { x: ux(0.425), y: L.toolY, r: tr * 0.95 }, bowl: { x: ux(0.54), y: L.toolY, r: tr * 0.95 } };
    L.binY = L.toolY + 4 * s;
    L.binX = [ux(0.665), ux(0.76), ux(0.855), ux(0.95)];
    L.binR = Math.min(44 * s, avail * 0.32, uw * 0.042);
    L.chef = { x: sa.l + uw * 0.11, y: L.toolY - 6 * s, s: Math.min(1.15 * s, avail / 150), face: 1 };
  }
  const s = L.s;
  L.tu = L.TH / 300;
  L.plateY = L.counterY + 12 * s;
  L.seats = L.seatX.map(x => ({ x, y: L.counterY, plateX: x, plateY: L.plateY }));
  L.plateR = 34 * s;
  /* 窓(変身前の町の見え方) */
  L.win = { x: sa.l + uw * 0.05, y: sa.t + L.TH * 0.06, w: uw * 0.90, h: L.TH - (sa.t + L.TH * 0.06) + 2 };
  L.corner = { x: W - sa.r, y: H - sa.b, size: 72 * s };
  L.hitMin = Math.max(30, 30 * s);
  layoutVersion++;
}
let layoutVersion = 0;

/* 町座標(0..1)→画面。変身前は窓越しに少し拡大して見える */
const TownView = { zoom: 1.1 };
function townToScreen(fx, fy) {
  const z = TownView.zoom;
  const ax = W * 0.5, ay = L.TH;
  return [ax + (fx * W - ax) * z, ay + (fy * L.TH - ay) * z];
}
function screenToTown(x, y) {
  const z = TownView.zoom;
  const ax = W * 0.5, ay = L.TH;
  return [(ax + (x - ax) / z) / W, (ay + (y - ay) / z) / L.TH];
}
function townScale() { return L.tu * TownView.zoom; }

/* ---------- 水彩の描画道具 ---------- */
const _pts = [];
function wobblePath(c, x, y, rx, ry, seed, wob = 0.07, rot = 0, n = 18, t = 0) {
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const k = 1 + wob * (noise1(seed * 5.31 + i * 1.37) * 0.8 + noise1(seed * 2.1 + i * 3.7 + t) * 0.35);

  g.bezierCurveTo(x0, y0 - r * 0.05, x0 + (x1 - x0) * 0.22, y0, (x0 + x1) / 2, y0);
  g.bezierCurveTo(x1 - (x1 - x0) * 0.22, y0, x1, y0 - r * 0.05, x1, y0 + r * 0.55);
  g.lineTo(x1, y1); g.closePath();
}

/* 動かない部品は先に描いておく(古い端末向けの負荷対策) */
const SPR = new Map();
function sprite(key, w, h, draw) {
  let sp = SPR.get(key);
  if (!sp) { const [cv, g] = makeCanvas(w, h); g.translate(w / 2, h / 2); draw(g); sp = { cv, w, h }; SPR.set(key, sp); }
  return sp;
}
function drawSprite(c, sp, x, y) { c.drawImage(sp.cv, x - sp.w / 2, y - sp.h / 2, sp.w, sp.h); }
function rebuildCaches() {
  SPR.clear(); caches.snowN = -1;
  let g;
  [caches.townFull, g] = makeCanvas(W, L.counterY + 6); drawTownBase(g, false);
  [caches.townPale, g] = makeCanvas(W, L.counterY + 6); g.drawImage(caches.townFull, 0, 0, W, L.counterY + 6); g.fillStyle = rgba(COL.paper, 0.3); g.fillRect(0, 0, W, L.counterY + 6);
  [caches.wall, g] = makeCanvas(W, L.counterY + 6); drawWall(g);
  [caches.kitchen, g] = makeCanvas(W, H - L.counterY + 2); drawKitchen(g);
  caches.ver = layoutVersion;
}

/* 台所(カウンターより下)の静的部分 */
function drawKitchen(g) {
  const s = L.s, h = H - L.counterY + 2;
  g.fillStyle = '#f0dcc0'; g.fillRect(0, 0, W, h);
  /* 床タイル */
  for (let y = 40 * s; y < h; y += 34 * s) for (let x = ((y / (34 * s)) % 2) * 17 * s; x < W; x += 34 * s) {
    g.fillStyle = rgba('#e3c49c', 0.35); g.fillRect(x, y, 17 * s, 17 * s);
  }
  granulate(g, 0, 0, W, h, '#b98d62', Math.round(W * h / 800), 11);
  /* カウンター天板 */
  paintRect(g, -6, -2, W + 12, 30 * s, 8 * s, COL.counter, { lw: 1.6 });
  g.fillStyle = rgba('#ffffff', 0.18); g.fillRect(0, 4 * s, W, 4 * s);
  g.fillStyle = rgba(COL.counterFront, 0.85); g.fillRect(0, 28 * s, W, 12 * s);
  g.fillStyle = rgba('#7a4a2c', 0.35); g.fillRect(0, 38 * s, W, 3 * s);
  paperOverlay(g, 0, 0, W, h, 0.55);
}

/* ---------- 料理(食材・調理状態) ---------- */
/* ings: 'S'いちご 'C'チーズ 'K'にんじん 'M'ミルク / steps: 'g'焼く 'c'冷やす */
let foodId = 1;
const ING_COLOR = { S: COL.strawberry, C: COL.cheese, K: COL.carrot, M: COL.milk };
function makeFood(ings, steps = [], special = false) {
  return {
    id: foodId++, ings: ings.slice(), steps: steps.slice(-2), special,
    x: 0, y: 0, tx: 0, ty: 0, vx: 0, vy: 0, scale: 1, sq: 0, rot: 0,
    loc: null,          // {type:'bin'|'tool'|'plate'|'drag'|'fly'|'select', id}
    heat: 0, cold: 0, stir: 0, mixT: 0, cookT: 0, glow: 0, wob: 0, born: now(),
    tint: 0,            // 日ごとの色ゆらぎ
  };
}
function lastStep(f) { return f.steps.length ? f.steps[f.steps.length - 1] : ''; }
function hasIng(f, i) { return f.ings.includes(i); }
function isMix(f) { return f.ings.length > 1; }
function stepsKey(f) { return f.steps.join(''); }

/* 料理 → 変身の種類(因果は常に一定) */
function familyOf(f) {
  if (f.special) return 'rainbow';
  if (hasIng(f, 'M')) return 'foam';
  const uniq = [...new Set(f.ings)];
  if (uniq.length > 1) return 'swirl';
  const i = uniq[0], k = stepsKey(f), ls = lastStep(f);
  if (i === 'C') {
    if (k === 'gc') return 'plank';
    if (k === 'cg') return 'stretchy';
    if (ls === 'g') return 'giant';
    if (ls === 'c') return 'square';
    return 'holes';
  }
  if (i === 'K') return ls === 'g' ? 'spring' : ls === 'c' ? 'skate' : 'propeller';
  if (i === 'S') return ls === 'c' ? 'tiny' : ls === 'g' ? 'puffy' : 'blush';
  return 'blush';
}
/* 泡の色 */
function foamColorOf(f) {
  if (hasIng(f, 'S')) return COL.foamP;
  if (hasIng(f, 'K')) return '#ffd9b0';
  if (hasIng(f, 'C')) return '#fff0b0';
  return COL.foamW;
}

/* 料理の絵 */
function drawFood(c, f, x, y, sc, t, alpha = 1) {
  const r = 17 * sc;
  const ls = lastStep(f);
  const warm = f.steps.includes('g'), cold = f.steps.includes('c');
  c.save(); c.translate(x, y); c.rotate(f.rot || 0);
  const sq = f.sq || 0;
  c.scale(1 + sq * 0.25, 1 - sq * 0.25);
  if (f.glow > 0.01) softGlow(c, 0, 0, r * 2.4, '#fff3b0', 0.45 * f.glow * alpha);
  if (f.special) {
    /* くしゃみの虹パフェ */
    paint(c, 0, r * 0.35, r * 1.0, r * 0.62, '#fbf2ff', 501, { alpha });
    ['#f5a3b5', '#ffe08a', '#a8dcf0', '#c3e8a5', '#d3b3f2'].forEach((col, i) => paint(c, (i - 2) * r * 0.36, -r * 0.1 - Math.abs(i - 2) * -r * 0.06, r * 0.32, r * 0.45, col, 510 + i, { alpha, lw: 1 }));
    dot(c, 0, -r * 0.65, r * 0.2, COL.strawberry, alpha);
    c.restore(); return;
  }
  if (isMix(f)) {
    /* 混ぜた料理: とろりとした渦 */
    const a = f.ings[0], b = f.ings[1];
    const ca = ING_COLOR[a], cb = ING_COLOR[b];
    const base = hasIng(f, 'M') ? mix(ca === COL.milk ? cb : ca, '#ffffff', 0.45) : mix(ca, cb, 0.5);
    paint(c, 0, r * 0.15, r * 1.05, r * 0.8, base, 300 + f.id % 7, { alpha, hi: true });
    c.globalAlpha = alpha;
    for (let k = 0; k < 2; k++) {
      c.beginPath();
      for (let i = 0; i < 26; i++) { const aa = i * 0.42 + t * 1.5 + k * Math.PI; const rr = i / 26 * r * 0.8; const px = Math.cos(aa) * rr, py = Math.sin(aa) * rr * 0.7 + r * 0.15; i ? c.lineTo(px, py) : c.moveTo(px, py); }
      c.strokeStyle = rgba(k ? ca : cb, 0.75); c.lineWidth = 2.4 * sc; c.lineCap = 'round'; c.stroke();
    }
    if (hasIng(f, 'M')) for (let i = 0; i < 5; i++) dot(c, Math.cos(i * 1.3 + t) * r * 0.7, -r * 0.35 + Math.sin(i * 2.1) * r * 0.2, r * 0.18, '#ffffff', 0.85);
    c.globalAlpha = 1;
  } else {
    const i = f.ings[0];
    if (i === 'S') {
      const col = warm ? '#d8344a' : COL.strawberry;
      const sz = ls === 'c' ? 0.95 : ls === 'g' ? 1.08 : 1;
      paint(c, 0, r * 0.12, r * 0.82 * sz, r * 0.95 * sz, col, 11, { alpha, hi: true });
      for (let k = 0; k < 7; k++) dot(c, Math.cos(k * 2.4) * r * 0.45, r * 0.15 + Math.sin(k * 2.4) * r * 0.5, 1.4 * sc, '#ffe9a6', alpha);
      paint(c, 0, -r * 0.78, r * 0.48, r * 0.2, '#6fb15a', 12, { alpha, lw: 1 });
    } else if (i === 'C') {
      const col = warm && ls === 'g' ? '#f3b23a' : COL.cheese;
      c.globalAlpha = alpha;
      c.beginPath(); c.moveTo(-r * 0.95, r * 0.55); c.lineTo(r * 0.95, r * 0.55); c.lineTo(r * 0.85, -r * 0.35); c.lineTo(-r * 0.6, -r * 0.6); c.closePath();
      c.fillStyle = rgba(col, 0.9); c.fill(); c.strokeStyle = rgba('#a07a20', 0.6); c.lineWidth = 1.4; c.stroke();
      [[-0.3, 0.05, 0.16], [0.35, 0.15, 0.12], [0.05, -0.25, 0.1]].forEach(h => dot(c, h[0] * r, h[1] * r, h[2] * r, '#d9a42a', 0.8));
      if (stepsKey(f) === 'cg' || (ls === 'g' && f.heat > 1.6)) { /* 伸びるチーズ */
        curve(c, r * 0.6, r * 0.5, r * 0.9, r * (0.9 + Math.sin(t * 3) * 0.1), r * 0.4, r * 1.05, col, 3 * sc, 0.9);
        curve(c, -r * 0.5, r * 0.5, -r * 0.7, r * 1.0, -r * 0.2, r * 1.1, col, 2.5 * sc, 0.85);
      }
      if (stepsKey(f) === 'gc') { /* かちかちの板 */
        c.strokeStyle = rgba('#b8860b', 0.7); c.lineWidth = 2; c.strokeRect(-r * 0.75, -r * 0.2, r * 1.5, r * 0.5);
      }
      c.globalAlpha = 1;
    } else if (i === 'K') {
      const col = ls === 'g' ? '#d9692a' : COL.carrot;
      c.save(); c.rotate(-0.5);
      c.globalAlpha = alpha;
      c.beginPath(); c.moveTo(-r * 0.32, -r * 0.8); c.quadraticCurveTo(r * 0.38, -r * 0.82, r * 0.3, -r * 0.6); c.quadraticCurveTo(r * 0.12, r * 0.5, 0, r * 1.05); c.quadraticCurveTo(-r * 0.2, r * 0.4, -r * 0.32, -r * 0.8); c.closePath();
      c.fillStyle = rgba(col, 0.92); c.fill(); c.strokeStyle = rgba(darken(col, 0.5), 0.6); c.lineWidth = 1.4; c.stroke();
      for (let k = 0; k < 3; k++) curve(c, -r * 0.2, -r * 0.3 + k * r * 0.35, -r * 0.05, -r * 0.25 + k * r * 0.35, r * 0.12, -r * 0.32 + k * r * 0.35, darken(col, 0.3), 1, 0.6);
      paint(c, -r * 0.1, -r * 1.0, r * 0.18, r * 0.32, '#6fb15a', 21, { alpha, lw: 1, rot: -0.4 });
      paint(c, r * 0.15, -r * 1.0, r * 0.16, r * 0.3, '#7cc066', 22, { alpha, lw: 1, rot: 0.4 });
      c.restore();
    } else if (i === 'M') {
      /* ミルクの小びん */
      paint(c, 0, r * 0.2, r * 0.62, r * 0.85, '#fbfbf6', 31, { alpha, lc: '#8aa0b8', hi: true });
      paint(c, 0, -r * 0.62, r * 0.32, r * 0.18, '#9dc3e6', 32, { alpha, lw: 1 });
      dot(c, 0, r * 0.25, r * 0.22, '#9dc3e6', 0.6 * alpha);
    }
    if (ls === 'g' && i !== 'M') { /* 焼き目 */
      c.globalAlpha = alpha * 0.6;
      for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(-r * 0.4 + k * r * 0.3, -r * 0.2); c.lineTo(-r * 0.1 + k * r * 0.3, r * 0.4); c.strokeStyle = '#6b3a1f'; c.lineWidth = 2 * sc; c.stroke(); }
      c.globalAlpha = 1;
    }
  }
  if (cold && ls === 'c') {
    /* 霜と氷の結晶 */
    c.globalAlpha = alpha;
    for (let k = 0; k < 4; k++) { const a = k * 1.7 + 0.4, px = Math.cos(a) * r * 0.7, py = Math.sin(a) * r * 0.7; snowflake(c, px, py, 3.2 * sc, t * 0.5 + k); }
    paint(c, 0, 0, r * 0.95, r * 0.95, '#e6f6ff', 41, { alpha: 0.35 * alpha, line: false });
    c.globalAlpha = 1;
  }
  if (warm && ls === 'g') {
    c.globalAlpha = alpha * 0.5;
    for (let k = 0; k < 2; k++) { const ph = (t * 0.8 + k * 0.5) % 1; curve(c, (k - 0.5) * r * 0.6, -r * 0.8 - ph * r, (k - 0.5) * r * 0.6 + r * 0.3, -r * 1.1 - ph * r, (k - 0.5) * r * 0.6, -r * 1.4 - ph * r, '#ffffff', 2 * sc, 0.8 * (1 - ph)); }
    c.globalAlpha = 1;
  }
  c.restore();
}
function snowflake(c, x, y, r, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = Math.max(1, r * 0.3); c.lineCap = 'round';
  c.beginPath();
  for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; c.moveTo(Math.cos(a) * r, Math.sin(a) * r); c.lineTo(-Math.cos(a) * r, -Math.sin(a) * r); }
  c.stroke();
  c.strokeStyle = 'rgba(140,200,235,0.7)'; c.lineWidth = 0.8; c.stroke();
  c.restore();
}

/* ---------- 台所の道具・食材箱・料理皿 ---------- */
const K = {
  bins: [],            // {ing, x, y, r, wob, bob}
  tools: {},           // grill/cool/bowl: {items:[], wob, heat, foam, steam}
  plate: null,         // 料理皿 {x,y,food,seat,slide...}
  foods: [],           // 画面上の全料理
};
function initKitchen(order) {
  K.bins = order.map((ing, i) => ({ ing, i, x: 0, y: 0, r: 0, wob: 0, bob: 0, press: 0 }));
  K.tools = {
    grill: { id: 'grill', items: [], wob: 0, heat: 0, steam: 0, press: 0 },
    cool: { id: 'cool', items: [], wob: 0, frost: 0, press: 0 },
    bowl: { id: 'bowl', items: [], wob: 0, swirl: 0, foam: 0, press: 0, mixing: 0 },
  };
  K.plate = { x: 0, y: 0, food: null, seat: 1, wob: 0, slide: 0, press: 0, homeSeat: 1, color: pick(['#ffffff', '#fdf3e3', '#eef6ff', '#fff0f3']), rim: pick(['#8fb4d9', '#e48f7a', '#86bb79', '#d6a64a']) };
  K.foods = [];
  placeKitchen();
}
function placeKitchen() {
  K.bins.forEach((b, i) => { b.x = L.binX[i]; b.y = L.binY; b.r = L.binR; });
  for (const k in K.tools) { const t = K.tools[k], p = L.tools[k]; t.x = p.x; t.y = p.y; t.r = p.r; }
  const ps = L.seats[K.plate.seat];
  if (!K.plate.moving) { K.plate.x = ps.plateX; K.plate.y = ps.plateY; }
}
function toolSlot(tool, idx, n) {
  if (tool.id === 'bowl') return [tool.x + (n > 1 ? (idx ? 1 : -1) * tool.r * 0.32 : 0), tool.y - tool.r * 0.18];
  return [tool.x + (n > 1 ? (idx ? 1 : -1) * tool.r * 0.4 : 0), tool.y - tool.r * 0.12];
}

/* ---------- 動物の絵(正面向き・足元が原点・高さおよそ100) ---------- */
const SKIN = {
  rabbitA: { sp: 'rabbit', body: '#c99f78', belly: '#f6e8d2', inner: '#f3b0b4', line: '#6e4a33' },
  rabbitB: { sp: 'rabbit', body: '#f6f0e6', belly: '#ffffff', inner: '#f7b9c4', line: '#8a7468' },
  mouseA: { sp: 'mouse', body: '#b7b0bf', belly: '#ece6ee', inner: '#f5b8c2', line: '#5d5566' },
  mouseB: { sp: 'mouse', body: '#e1c6a1', belly: '#f8ecdc', inner: '#f5b8c2', line: '#7a5c3e' },
  alpacaA: { sp: 'alpaca', body: '#f3e5c9', belly: '#fbf3e4', inner: '#e9c6a6', line: '#8a6a4e' },
  alpacaK: { sp: 'alpaca', body: '#dcb089', belly: '#f1dcc4', inner: '#c98f6a', line: '#7a5236' },
};
const FAM_TINT = { skate: '#cfeaff', puffy: '#ffb3b8', plank: '#f6d36a', stretchy: '#f9d65c', square: '#ffe28a', blush: '#ffc0cb', rainbow: null, swirl: null };

function drawAnimal(c, a, x, y, u, o = {}) {
  const sk = a.skin, sp = sk.sp, t = o.t != null ? o.t : now() / 1000;
  const m = a.morph || 0, fam = a.fam;
  const alpha = o.alpha != null ? o.alpha : 1;
  if (alpha <= 0.01) return;
  c.save();
  c.translate(x, y);
  let gs = (a.kid ? 0.8 : 1);
  if (fam === 'tiny') gs *= lerp(1, 0.42, m);
  if (fam === 'puffy') gs *= lerp(1, 1.18, m);
  if (fam === 'giant') gs *= lerp(1, o.seated ? 1.35 : 2.4, m);
  c.scale(gs * (a.flip ? -1 : 1), gs);
  const sq = a.squash || 0;
  c.scale(1 + sq * 0.22, 1 - sq * 0.22);
  if (a.tilt) c.rotate(a.tilt);
  c.scale(u / 1, u / 1);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const tint = FAM_TINT[fam] && m > 0 ? mix(sk.body, FAM_TINT[fam], 0.45 * m) : sk.body;
  const bellyC = FAM_TINT[fam] && m > 0 ? mix(sk.belly, FAM_TINT[fam], 0.3 * m) : sk.belly;
  const breathe = Math.sin(t * 2.2 + a.id) * 1.2;
  const lean = a.lean || 0;
  /* ---- 体型パラメータ ---- */
  let bRX = sp === 'alpaca' ? 30 : sp === 'mouse' ? 25 : 27;
  let bRY = sp === 'alpaca' ? 26 : 27;
  let bY = -40;
  if (fam === 'puffy') { bRX = lerp(bRX, 40, m); bRY = lerp(bRY, 38, m); bY = lerp(bY, -46, m); }
  if (fam === 'plank') { bRX = lerp(bRX, 34, m); bRY = lerp(bRY, 30, m); }
  if (fam === 'stretchy') { bRY = lerp(bRY, 27 + 10 * (1 + Math.sin(t * 5)) , m); bY = lerp(bY, -48, m); }
  let legType = fam === 'spring' ? 'spring' : fam === 'skate' ? 'skate' : 'normal';
  const legLen = legType === 'spring' ? lerp(12, 26 + 6 * Math.sin(t * 9) * (a.moving ? 1 : 0.3), m) : 12;
  bY -= legLen - 12;
  const headY = (sp === 'alpaca' ? bY - 62 : bY - 40) + breathe * 0.5 + (fam === 'stretchy' ? -14 * m * (1 + Math.sin(t * 4)) : 0);
  const headX = lean * 6;
  const headR = sp === 'alpaca' ? 17 : sp === 'mouse' ? 21 : 22;
  /* ---- 足 ---- */
  if (!o.seated || o.standing) {
    const step = a.moving ? Math.sin(t * 14) : 0;
    for (let s = -1; s <= 1; s += 2) {
      const lx = s * (sp === 'alpaca' ? 15 : 11), ly = bY + bRY * 0.75;
      if (legType === 'spring') {
        const len = (0 - ly) * (1 + s * step * 0.12);
        c.beginPath(); const coils = 5;
        for (let i = 0; i <= coils * 2; i++) { const yy = ly + len * i / (coils * 2); const xx = lx + (i % 2 ? 7 : -7) * m; i ? c.lineTo(xx, yy) : c.moveTo(lx, yy); }
        c.strokeStyle = rgba('#8a8f99', alpha); c.lineWidth = 3.2; c.stroke();
        c.strokeStyle = rgba('#d8dde6', alpha * 0.8); c.lineWidth = 1.2; c.stroke();
        paint(c, lx, -2, 9, 4, sk.body, a.id * 3 + s, { alpha });
      } else {
        const lift = step * s * 3;
        if (sp === 'alpaca') {
          c.strokeStyle = rgba(darken(sk.body, 0.15), alpha); c.lineWidth = 7;
          c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx, -3 - lift); c.stroke();
          dot(c, lx, -2 - lift, 4.5, darken(sk.body, 0.45), alpha);
        } else paint(c, lx + s * 3, -5 - lift, sp === 'rabbit' ? 11 : 8, 6, sk.body, a.id * 3 + s, { alpha });
        if (legType === 'skate') {
          c.strokeStyle = rgba('#7fb6e0', alpha * m); c.lineWidth = 2.4;
          c.beginPath(); c.moveTo(lx - 11, 1); c.quadraticCurveTo(lx + s * 2, 4, lx + 12, 0); c.stroke();
        }
      }
    }
  }
  /* ---- しっぽ ---- */
  if (sp === 'mouse') {
    const ta = Math.sin(t * 3 + a.id) * 0.4;
    c.beginPath(); c.moveTo(18, bY + 18);
    c.bezierCurveTo(44, bY + 26, 40 + ta * 20, bY - 18, 30 + ta * 14, bY - 30);
    c.strokeStyle = rgba(fam === 'plank' ? '#e6b84a' : '#e3a6b0', alpha); c.lineWidth = fam === 'plank' ? 6 * (1 - m) + 3 : 3; c.stroke();
  } else if (sp === 'rabbit') {
    paint(c, 22, bY + 14, fam === 'foam' ? 9 + 8 * m : 9, fam === 'foam' ? 8 + 7 * m : 8, '#ffffff', a.id + 50, { alpha, lc: sk.line });
  }
  /* ---- 体 ---- */
  if (fam === 'square' && m > 0.01) {
    const s2 = lerp(bRX, 30, m);
    paintRect(c, -s2, bY - s2 * 0.95, s2 * 2, s2 * 1.9, lerp(s2, 7, m), tint, { alpha, lc: sk.line });
  } else if (fam === 'plank' && m > 0.01) {
    paintRect(c, -bRX, bY - bRY, bRX * 2, bRY * 2, lerp(bRX, 5, m), tint, { alpha, lc: '#a8801e' });
    c.strokeStyle = rgba('#c9971f', 0.5 * alpha * m); c.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(-bRX + 3, bY + i * 9); c.lineTo(bRX - 3, bY + i * 9); c.stroke(); }
  } else if (sp === 'alpaca') {
    const fluff = fam === 'foam' ? 1 + 0.35 * m : 1;
    for (let i = 0; i < 6; i++) { const aa = i / 6 * TAU + 0.3; paint(c, Math.cos(aa) * bRX * 0.62 * fluff, bY + Math.sin(aa) * bRY * 0.5 * fluff, bRX * 0.52 * fluff, bRY * 0.5 * fluff, tint, a.id * 10 + i, { alpha, lc: sk.line, t: t * 0.6 }); }
    paint(c, 0, bY, bRX * 0.8 * fluff, bRY * 0.72 * fluff, lighten(tint, 0.12), a.id * 10 + 7, { alpha, line: false });

  A.forEach(b => { if (b !== a && b.place === 'town' && (b.st === 'queue' || b.st === 'wander')) { b.saw = { fam, sig: { ings: f.ings.slice(), steps: f.steps.slice() } }; b.sawT = GT; b.sparkle = 1; b.mimic = fam; b.mimicT = 2.6; } });
  world.chef.react = fam;
}
function sameSig(s, f) { return s.ings.slice().sort().join('') === f.ings.slice().sort().join('') && s.steps.join('') === f.steps.join(''); }
function famColors(fam, a) {
  switch (fam) {
    case 'foam': return [a.foamCol, '#ffffff', '#e8f4ff'];
    case 'spring': return ['#f08a3c', '#ffd36b', '#d9dde6'];
    case 'skate': return ['#bfe6ff', '#ffffff', '#9fd0f0'];
    case 'tiny': return ['#ff9fb2', '#bfe6ff', '#ffffff'];
    case 'puffy': return ['#ff8fa0', '#ffd0a8', '#ffffff'];
    case 'giant': case 'plank': case 'stretchy': case 'square': case 'holes': return ['#f6c945', '#ffe9a0', '#f3a93a'];
    case 'rainbow': return ['#f5a3b5', '#ffd27a', '#a8d8f0', '#b9e6a3', '#c9b0f0'];
    default: return ['#ff9fb2', '#ffd36b', '#b8f0a0'];
  }
}

/* 席での1フレーム */
function updateSeated(a, dt) {
  a.stT += dt;
  if (a.enter < 1) a.enter = Math.min(1, a.enter + dt * 2.6);
  const p = seatPos(a);
  /* 視線: ドラッグ中の物 → 調理中の物 → 指 */
  const fp = world.focus;
  const tf = world.townFocus && world.townFocus.until > GT ? world.townFocus : null;
  if (fp) { a.lookX = damp(a.lookX, clamp((fp.x - p.x) / (120 * p.u), -1, 1), 8, dt); a.lookY = damp(a.lookY, clamp((fp.y - (p.y - 80 * p.u)) / (160 * p.u), -1, 1), 8, dt); if (a.st === 'sit') a.headTilt = damp(a.headTilt, 0, 4, dt); }
  else if (tf && a.st === 'sit') { const [tx] = townToScreen(tf.x, tf.y); a.lookX = damp(a.lookX, clamp((tx - p.x) / (100 * p.u), -1, 1), 6, dt); a.lookY = damp(a.lookY, -1, 6, dt); a.headTilt = damp(a.headTilt, clamp((tx - p.x) / W, -0.3, 0.3), 4, dt); a.sparkle = Math.max(a.sparkle, 0.5); }
  else { a.lookX = damp(a.lookX, Math.sin(GT * 0.4 + a.id) * 0.4, 2, dt); a.lookY = damp(a.lookY, 0.2, 2, dt); if (a.st === 'sit') a.headTilt = damp(a.headTilt, 0, 3, dt); }
  a.mouth = damp(a.mouth, 0, 6, dt);
  a.sparkle = Math.max(0, a.sparkle - dt * 0.5);
  if (a.st === 'sit') {
    /* 匂い: 好物の焼ける匂いに身を乗り出す */
    const sm = world.smell;
    let leanT = 0;
    if (sm && sm.ing === FAVORITE[a.sp]) { leanT = 1; a.noseTwitch = 1; a.sparkle = Math.max(a.sparkle, 0.6); a.mood = 'wow'; }
    else { a.noseTwitch = 0; if (a.mood === 'wow' && a.stT > 0.6) a.mood = 'idle'; }
    if (world.dragging && world.dragging.over === a) { leanT = 1.2; a.mouth = Math.max(a.mouth, 0.6); a.mood = 'wow'; }
    a.lean = damp(a.lean, leanT * (sm && sm.x < p.x ? -1 : 1) * (sm || world.dragging ? 1 : 0), 5, dt);
    a.squash = damp(a.squash, Math.max(0, Math.sin(GT * 9) * 0.06 * leanT), 10, dt);
    /* 種ごとの待ち仕草: ウサギ足踏み・ネズミ背伸び・アルパカ毛ゆらし */
    a.idleT -= dt;
    if (a.idleT <= 0) { a.idleKind = a.sp; a.idleAmt = 1; a.idleT = rand(3, 7); }
    a.idleAmt = Math.max(0, a.idleAmt - dt * 0.8);
    if (a.idleAmt > 0) {
      if (a.sp === 'rabbit') a.squash = Math.max(a.squash, Math.abs(Math.sin(GT * 16)) * 0.1 * a.idleAmt);
      if (a.sp === 'mouse') a.squash = -0.18 * Math.sin(a.idleAmt * Math.PI);
      if (a.sp === 'alpaca') a.tilt = Math.sin(GT * 7) * 0.05 * a.idleAmt;
    } else a.tilt = damp(a.tilt, 0, 4, dt);
    a.wantT += dt;
    if (a.pokeT > 0) { a.pokeT -= dt; a.squash = Math.sin(a.pokeT * 20) * 0.15 * a.pokeT; }
  } else if (a.st === 'eat') {
    const k = a.stT;
    a.mouth = k < 0.18 ? 1 : 0; a.cheeks = clamp(k * 3, 0, 1); a.mood = k < 0.18 ? 'wow' : 'joy';
    a.squash = Math.sin(k * 26) * 0.08;
    if (k > 0.15 && !a.ateSnd) { a.ateSnd = true; AU.eat(); }
    if (a.food) { const mp = mouthPos(a); a.food.x = lerp(a.food.x, mp.x, 0.35); a.food.y = lerp(a.food.y, mp.y, 0.35); a.food.scale = Math.max(0, 1 - k * 3.5); }
    if (k > 0.55) startMorph(a);
  } else if (a.st === 'morph') {
    const k = a.stT;
    a.morph = clamp(easeOutBack(clamp(k / 0.9, 0, 1)), 0, 1.15);
    a.cheeks = Math.max(0, 1 - k * 0.8);
    a.sparkle = 1;
    a.mood = k < 0.5 ? 'wow' : 'joy';
    a.squash = Math.sin(k * 14) * 0.12 * Math.max(0, 1 - k);
    if (a.fav || a.expected) { a.armsUp = Math.abs(Math.sin(k * 10)); a.tilt = Math.sin(k * 12) * 0.12; }
    else { a.armsUp = k < 0.7 ? 0.6 : 0.2; a.headTilt = Math.sin(k * 5) * 0.15; }
    if (k > 1.9) { a.morph = 1; a.armsUp = 0; a.tilt = 0; a.headTilt = 0; setState(a, 'leave'); AU.swish(); }
  } else if (a.st === 'leave') {
    a.exit = Math.min(1, a.exit + dt * 2.2);
    if (a.exit >= 1) {
      /* 町へ出ていく */
      a.place = 'town'; a.seat = -1; a.x = TOWN.door.x + rand(-0.03, 0.03); a.y = TOWN.door.y; a.z = 0; a.exit = 0;
      setState(a, 'act'); a.script = planTownAction(a); a.step = null;
      onCustomerLeft(a);
    }
  }
  a.blinkT -= dt; if (a.blinkT < 0) { a.blink = 0.12; a.blinkT = rand(2, 5); }
  a.blink = Math.max(0, a.blink - dt);
}

/* ---------- 町の中の移動 ---------- */
const go = (x, y, mode = 'walk', speed = 0) => ({ type: 'go', x, y, mode, speed });
const arc = (x, y, h, dur, z1 = 0, extra) => Object.assign({ type: 'arc', x, y, h, dur, z1 }, extra || {});
const wait = (dur, pose) => ({ type: 'wait', dur, pose });
const call = fn => ({ type: 'call', fn });

function townDistTU(x0, y0, x1, y1) { return Math.hypot((x1 - x0) * W, (y1 - y0) * L.TH) / L.tu; }
function sideOf(x, y) { return x < creekX(y) ? 'L' : 'R'; }

/* 小川の渡り方は町の状態で変わる: 橋→歩く / トランポリン→はねる / なし→飛び石 */
function routeTo(a, x, y, mode = 'walk', speed = 0, from) {
  const S = [];
  let cx = from ? from.x : a.x, cy = from ? from.y : a.y;
  if (cy > 0.93) { S.push(go(cx, TOWN.streetY + 0.03, mode, speed)); cy = TOWN.streetY + 0.03; }
  if (sideOf(cx, cy) !== sideOf(x, y)) {
    const toLeft = sideOf(cx, cy) === 'R';
    let kind = 'stones', cyy = 0.68;
    if (T.bridge) { kind = 'bridge'; cyy = TOWN.bridgeY; }
    else if (T.tramp) { kind = 'tramp'; cyy = TOWN.trampY; }
    const bx = creekX(cyy), bw = creekW(cyy) / 2 + 0.035;
    const near = toLeft ? bx + bw : bx - bw, far = toLeft ? bx - bw : bx + bw;
    S.push(go(near, cyy, mode, speed));
    if (kind === 'bridge') { S.push(Object.assign(go(far, cyy, mode, speed), { onBridge: true })); }
    else if (kind === 'tramp') { S.push(arc(bx, cyy - 0.005, 10, 0.3, 0)); S.push(call(() => { T.trampWob = 1; AU.boing(1.3); logEv('use', { what: 'tramp', by: a.sp }); })); S.push(arc(far, cyy, 55, 0.95, 0)); }
    else { S.push(arc(bx, cyy + 0.01, 12, 0.32)); S.push(arc(far, cyy, 12, 0.32)); }
  }
  S.push(go(x, y, mode, speed));
  return S;
}

function onSnow(x, y) {
  for (let i = 0; i < T.snow.length; i++) { const p = T.snow[i]; if (Math.abs(p.x - x) * W / L.tu < 12 && Math.abs(p.y - y) * L.TH / L.tu < 9) return true; }
  return false;
}
function addSnow(x, y) {
  const last = T.snow[T.snow.length - 1];
  if (last && townDistTU(last.x, last.y, x, y) < 5) return;
  if (T.snow.length > 220) return;
  T.snow.push({ x, y, r: rand(0.8, 1.2), t: GT });
}

function runStep(a, dt) {
  if (!a.step) {
    a.step = a.script.shift();
    if (!a.step) { a.moving = false; return false; }
    const s = a.step; s.t = 0; s.x0 = a.x; s.y0 = a.y; s.z0 = a.z;
  }
  const s = a.step; s.t += dt;
  if (s.type === 'go') {
    const dTU = townDistTU(a.x, a.y, s.x, s.y);
    let sp = (s.speed || (a.fam === 'giant' ? 34 : a.fam === 'tiny' ? 46 : 58)) * a.speedMul;
    let slide = false;
    if (onSnow(a.x, a.y) && s.mode !== 'fly') { sp *= 1.9; slide = true; }
    if (s.mode === 'skate') { sp *= 1.35; addSnow(a.x, a.y); }
    a.sliding = slide || s.mode === 'skate';
    if (slide && !a.slideLogged) { a.slideLogged = true; logEv('use', { what: 'snow_slide', by: a.sp, fam: a.fam }); if (a.carry === 'stall') logEv('use', { what: 'stall_slide' }); }
    const stepTU = sp * dt;
    if (dTU <= stepTU || dTU < 0.01) { a.x = s.x; a.y = s.y; a.step = null; a.moving = false; }
    else {
      const k = stepTU / dTU;
      a.flip = s.x < a.x; a.x += (s.x - a.x) * k; a.y += (s.y - a.y) * k; a.moving = true;
    }
    /* 泡山は踏み台: 通りかかるとぽよんと弾む */
    if (a.z <= 0.01 && s.mode !== 'fly' && a.carry !== 'stall') {
      const h = T.hills.find(h => townDistTU(h.x, h.y, a.x, a.y) < 14 * h.size);
      if (h && GT - (a.lastHillT || 0) > 0.8) { a.lastHillT = GT; a.vz = 140 + 30 * h.size; h.squash = 1; AU.boing(1.6); logEv('use', { what: 'hill_bounce', by: a.sp }); }
    }
    if (s.mode === 'fly') a.z = damp(a.z, s.z || 50, 3, dt);
    else if (s.onBridge) a.z = damp(a.z, 4, 10, dt);
  } else if (s.type === 'arc') {
    const k = clamp(s.t / s.dur, 0, 1);
    a.x = lerp(s.x0, s.x, k); a.y = lerp(s.y0, s.y, k);
    a.z = lerp(s.z0, s.z1, k) + Math.sin(k * Math.PI) * s.h;
    a.moving = true; if (Math.abs(s.x - s.x0) > 0.002) a.flip = s.x < s.x0;
    if (k >= 1) { a.step = null; a.moving = false; if (s.z1 <= 0) { a.squash = 0.35; a.z = 0; } }
  } else if (s.type === 'wait') {
    a.moving = false;
    if (s.pose) s.pose(a, clamp(s.t / s.dur, 0, 1), dt);
    if (s.t >= s.dur) a.step = null;
  } else if (s.type === 'call') {
    a.step = null; s.fn(a);
  }
  return true;
}

/* ---------- 町の出来事 ---------- */
function townFocus(x, y, dur = 2.5) { world.townFocus = { x, y, until: GT + dur }; }
function ringBell(a) {
  T.bellSwing = 1; T.bellRings++; T.bellV = 6;
  AU.bell(); townFocus(TOWN.bell.x, TOWN.bell.top, 4);
  const [px, py] = townToScreen(TOWN.bell.x, TOWN.bell.top);
  ring(px, py, '#ffe9a0'); ring(px, py, '#ffffff', 0.4);
  growFlowers(TOWN.bell.x + 0.08, 0.6, 6);
  A.forEach(b => { if (b.place === 'town' && b !== a) { b.vz = 90; b.sparkle = 1; b.mood = 'joy'; } });
  world.chef.react = 'bell';
  logEv('bell', { by: a ? a.sp : 'tap', via: a && a.viaHill ? 'hill' : 'none' });
}
function unfurlFlag(a) {
  const first = !T.flag;
  T.flag = Math.min(3, T.flag + 1); T.flagT = 0;
  townFocus(TOWN.flag.x, TOWN.flag.top, 3);
  if (first) T.garlands.push({ from: 'flag', to: 'bell', t: GT, col: '#f39ab0' });
  else if (T.garlands.length < 6) T.garlands.push({ from: 'flag', to: pick(['stall', 'bench', 'tree']), t: GT, col: pick(['#8fc6e8', '#ffd36b', '#b8e09a']) });
}
function growFlowers(x, y, n) {
  for (let i = 0; i < n; i++) { if (T.flowers.length > 60) T.flowers.shift(); T.flowers.push({ x: x + rand(-0.06, 0.06), y: clamp(y + rand(-0.04, 0.05), 0.47, 0.98), col: pick(['#f49ab0', '#fff2a6', '#c7a6f0', '#ffffff', '#ffb38a']), t: GT, s: rand(0.8, 1.3) }); }
}
function makeHill(x, y, col, by) {
  let h = hillAt(x, y, 0.07);
  if (h) { if (h.size < 3) { h.size++; h.squash = 1; h.col = mix(h.col, col, 0.5); return h; } 
    const alt = TOWN.lots.B; if (!hillAt(alt.x, alt.y) && T.stall.spot !== 'B') { h = null; x = alt.x; y = alt.y; } else { h.squash = 1; return h; } }
  h = { x, y, size: 1, col, squash: 1, t: GT };
  T.hills.push(h);
  return h;
}
function stallDestination() {
  const order = [];
  if (T.bridge) order.push('A');
  order.push('B', 'C');
  if (T.bridge === 0) order.push('A');
  for (const id of order) { if (id === 'A' && !T.bridge) continue; if (lotFree(id)) return id; }
  return T.stall.spot === 'home' ? 'B' : (T.stall.spot === 'B' ? 'C' : 'B');
}
function spawnNewcomer() {
  if (world.newcomer) return;
  const k = makeAnimal('alpacaK', true);
  k.x = TOWN.farRoad.x; k.y = TOWN.farRoad.y; k.place = 'town';
  setState(k, 'act');
  k.saw = { fam: 'foam', sig: { ings: ['M'], steps: [] } }; k.sawT = GT; k.sparkle = 1;
  k.script = [go(TOWN.stallHome.x, TOWN.stallHome.y + 0.02, 'walk', 40), wait(1.2, (b, q) => { b.sparkle = 1; b.mood = 'wow'; b.lookX = Math.sin(q * 9); }), call(b => { b.want = { ings: ['M'], steps: [] }; })];
  world.newcomer = k;
  logEv('newcomer', { sp: 'alpaca' });
}
function onCustomerLeft(a) {
  if (!a.lastFamFresh) return;
  a.lastFamFresh = false;
  world.leftCount++;
  /* 世界の転換: 変身したお客が退店した瞬間、発見の進み具合で町が動き出す */
  if (world.phase === 0 && (world.progress >= 8 || LOG.families.size >= 7 || world.leftCount >= 9)) startOpening(a);
}

/* ---------- 変身ごとの町での行動(町の状態を見て決まる) ---------- */
function crouch(a, q) { a.squash = 0.3 * Math.sin(q * Math.PI); }
function planTownAction(a) {
  a.slideLogged = false;
  const S = [], sp = a.sp, fam = a.fam;
  const add = (...st) => { for (const s of st) Array.isArray(s) ? S.push(...s) : S.push(s); };
  const B = TOWN.bench, F = TOWN.flag, BL = TOWN.bell;
  a.viaHill = false;
  switch (fam) {
    case 'spring': {
      if (sp === 'rabbit') {
        const hill = T.hills.slice().sort((p, q) => Math.abs(p.x - BL.x) - Math.abs(q.x - BL.x))[0];
        /* ばね脚はいつも高い飾り旗に届く。泡山があれば、そのまま山を踏み台に鐘まで */
        if (!T.flag || !hill) {
          add(routeTo(a, F.x + 0.035, F.y + 0.01, 'walk', 70, null));
          add(arc(F.x + 0.045, F.y + 0.012, 18, 0.32), arc(F.x + 0.03, F.y + 0.01, 26, 0.36));
          add(wait(0.3, crouch));
          const topZ = (F.y - F.top) * 300 - 14;
          add(arc(F.x + 0.012, F.y, 30, 0.85, topZ));
          add(call(b => { unfurlFlag(b); discover('spring_flag', F.x, F.top); b.armsUp = 1; }));
          add(wait(0.45, (b, q) => { b.armsUp = 1; }));
          add(arc(F.x + 0.06, F.y + 0.03, 12, 0.8, 0));
        }
        if (hill) {
          add(call(b => { b.script.unshift(...routeTo(b, hill.x + 0.06, hill.y + 0.02, 'walk', 70, null)); }));
          /* 泡山の大ジャンプ: 山を踏み台にして鐘へ */
          a.viaHill = true;
          add(wait(0.35, crouch));
          add(arc(hill.x, hill.y, 26, 0.45, 8 * hill.size));
          add(call(b => { hill.squash = 1.4; AU.boing(0.8); b.squash = 0.5; }));
          add(wait(0.18, crouch));
          const bellZ = (BL.y - BL.top) * 300 - 6;
          add(arc(BL.x + 0.025, BL.y, 40, 1.0, bellZ));
          add(call(b => { ringBell(b); discover('bell_jump', BL.x, BL.top); b.armsUp = 1; }));
          add(wait(0.5, (b, q) => { b.armsUp = 1; b.z = bellZ - q * 4; }));
          add(arc(hill.x + 0.05, hill.y + 0.04, 10, 0.8, 0));
        }
      } else if (sp === 'mouse') {
        add(routeTo(a, B.x - 0.03, B.y + 0.02, 'walk', 70, null));
        add(arc(B.x, B.y, 30, 0.5, 9), arc(B.x + 0.02, B.y, 55, 0.6, 9), arc(B.x + 0.06, B.y + 0.03, 30, 0.5, 0));
      } else {
        const cy = 0.63, cx = creekX(cy);
        add(routeTo(a, cx + 0.07, cy, 'walk', 60, null));
        add(arc(cx - 0.07, cy, 60, 0.9, 0, { leap: true }));
        add(call(b => logEv('use', { what: 'leap_creek', by: b.sp })));
        add(arc(cx + 0.08, cy + 0.02, 55, 0.9, 0));
      }
      break;
    }
    case 'skate': {
      const y = TOWN.streetY;
      const pts = sp === 'rabbit' ? [[0.5, y], [0.36, y + 0.01], [0.62, y - 0.012], [0.95, y - 0.02], [0.72, y + 0.012]]
        : sp === 'mouse' ? [[0.5, y], [0.62, y - 0.01], [0.44, y + 0.01]] : [[0.5, y], [0.78, y - 0.012], [0.55, y + 0.01]];
      add(go(a.x, y + 0.03, 'walk', 60));
      pts.forEach(p => add(go(p[0], p[1], 'skate', sp === 'rabbit' ? 72 : 55)));
      add(call(b => { if (T.snow.length > 6) discover('skate_snow', 0.6, TOWN.streetY); }));
      break;
    }
    case 'tiny': {
      if (sp === 'mouse') {
        add(routeTo(a, B.x - 0.03, B.y + 0.03, 'walk', 50, null));
        add(go(B.x + 0.01, B.y + 0.008, 'walk', 30));
        add(wait(0.6, (b, q) => { b.lookY = 1; }));
        add(call(b => {
          if (!T.lost.taken) { T.lost.taken = true; b.carry = T.lost.kind; AU.squeak(); discover('tiny_fetch', B.x, B.y); logEv('fetch', { item: T.lost.kind }); }
          else { b.sparkle = 1; AU.squeak(); logEv('fetch', { item: 'crumb' }); }
        }));
        add(go(B.x - 0.02, B.y + 0.035, 'walk', 40));
        add(call(b => {
          if (b.carry === 'hat') { b.script.unshift(...routeTo(b, 0.5, 1.06, 'walk', 55, null), call(c => { c.carry = null; world.chef.hatBack = 1; AU.success(); logEv('hat_back', {}); })); }
          else if (b.carry) { const st = T.stall; b.script.unshift(...routeTo(b, st.x - 0.03, st.y + 0.02, 'walk', 55, null), call(c => { T.lanterns.push({ kind: c.carry, x: st.x, y: st.y, t: GT, attach: 'stall' }); c.carry = null; AU.ding(); })); }
        }));
      } else {
        const fx = rand(0.4, 0.62), fy = rand(0.6, 0.7);
        add(routeTo(a, fx, fy, 'walk', 45, null), wait(1.0, (b, q) => { b.alphaHide = Math.sin(q * Math.PI) * 0.6; }), call(() => growFlowers(fx, fy, 5)));
      }
      break;
    }
    case 'puffy': {
      if (sp === 'mouse') {
        add(routeTo(a, B.x - 0.03, B.y + 0.03, 'walk', 50, null));
        add(go(B.x, B.y + 0.02, 'walk', 30));
        add(call(b => { world.benchWob = 1; AU.thud(); b.squash = 0.4; b.mood = 'wow'; logEv('bench_bump', { by: 'puffy_mouse' }); }));
        add(wait(0.5, crouch));
        add(arc(B.x + 0.02, B.y - 0.02, 20, 1.2, 70));

}

function townThingAt(x, y) {

    else if (ch.mood === 'wow') { dot(c, ex, ey, 5, ink); dot(c, ex - 1.5, ey - 1.8, 2, '#ffffff'); }
    else { dot(c, ex, ey, 4, ink); dot(c, ex - 1.2, ey - 1.4, 1.6, '#ffffff'); }
  }

  /* 大きな鼻: ひくひく */

  c.save(); c.translate(ch.look * 6, 10); c.scale(1 + tw, 1 + tw * 0.6);

  for (let sd = -1; sd <= 1; sd += 2) paint(c, sd * 6.5, 0, 3.4 + ch.sniff * 1.2 + sneezeBack * 2, 5 + ch.sniff * 1.5, '#b4566a', 1124 + sd, { line: false });
  c.restore();

  else { c.beginPath(); c.moveTo(-9 + ch.look * 4, 28); c.quadraticCurveTo(ch.look * 4, 35, 9 + ch.look * 4, 28); c.strokeStyle = rgba(ink, 0.8); c.lineWidth = 2; c.stroke(); }

/* 料理長の手のお手本 */
function drawChefHand(c) {
  const ch = world.chef; if (!ch.hand) return;

/* ページの角(めくると次の一日) */
function drawPageCorner(c) {
  const k = world.pageCorner; if (k <= 0.01) return;

  const size = (56 + Math.sin(GT * 2.5) * 8) * s * easeOutBack(k);
  c.save();

  c.fillStyle = rgba('#5b4a3a', 0.25); c.fill();
  c.beginPath(); c.moveTo(x, y - size); c.quadraticCurveTo(x - size * 0.55, y - size * 0.55, x - size, y); c.lineTo(x - size * 0.92, y - size * 0.92 + size * 0.05); c.closePath();
  const g = c.createLinearGradient(x - size, y - size, x - size * 0.4, y - size * 0.4);
  g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#e8d8bf');
  c.fillStyle = g; c.fill(); c.strokeStyle = rgba('#a08a70', 0.6); c.lineWidth = 1.2; c.stroke();
  /* 次の日の朝の絵が少しのぞく */

}
function drawPageTurn(c) {
  if (!(world.pageTurn > 0)) return;
  const p = easeInOut(clamp(world.pageTurn, 0, 1));
  const snap = world.pageSnap;
  const fold = W * (1.05 - p * 1.6);
  const flapW = W - fold;
  if (snap && fold > 0) {
    c.save(); c.beginPath(); c.rect(0, 0, Math.max(0, fold - flapW * 0.6), H); c.clip();
    c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(snap, 0, 0); c.restore();
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  /* めくれた紙の裏 */
  const x0 = Math.max(0, fold - flapW * 0.6), x1 = Math.max(0, fold);
  if (x1 > x0) {
    const g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#e9dcc6'); g.addColorStop(0.7, '#fbf4e6'); g.addColorStop(1, '#d9c8ae');
    c.fillStyle = g; c.fillRect(x0, 0, x1 - x0, H);
  }
  const sg = c.createLinearGradient(x1, 0, x1 + 40 * L.s, 0);
  sg.addColorStop(0, 'rgba(60,40,30,0.3)'); sg.addColorStop(1, 'rgba(60,40,30,0)');
  c.fillStyle = sg; c.fillRect(x1, 0, 40 * L.s, H);
}

/* ---------- メインループ ---------- */
let lastT = 0, running = true, frameN = 0, fpsAcc = 0, fpsN = 0, fps = 60, slowSec = 0;
function update(dt) {
  GT += dt;
  runTimers();
  for (const a of A) { if (a.place === 'seat') updateSeated(a, dt); else updateTownAnimal(a, dt); }
  fillSeats(dt);
  updateKitchen(dt);
  updateChef(dt);
  updateGuide(dt);
  updatePhases(dt);
  updateParticles(dt);
  /* 視線の的 */
  const d = world.dragging;
  world.focus = d ? (d.kind === 'plate' ? { x: K.plate.x, y: K.plate.y } : { x: d.food.x, y: d.food.y })
    : world.selected ? { x: world.selected.x, y: world.selected.y }
    : world.pointer && GT - world.pointer.t < 1.5 ? world.pointer : null;
  if (world.selected && GT - world.selected.selT > 9) returnSelected(world.selected);
  if (world.pageTurn > 0) { world.pageTurn += dt / 1.3; if (world.pageTurn >= 1) { world.pageTurn = 0; world.pageSnap = null; } }
  if (AU.ok()) AU.musicTick();
}
function render() {
  if (caches.ver !== layoutVersion) rebuildCaches();
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = COL.paper; c.fillRect(0, 0, W, H);
  drawTownLayer(c);
  drawWallLayer(c);
  drawSeated(c);
  c.drawImage(caches.kitchen, 0, L.counterY - 2, W, H - L.counterY + 2);
  drawKitchenDyn(c);
  drawFoods(c, 'base');
  drawChef(c);
  drawWantBubble(c);
  drawFoods(c, 'top');
  drawParticles(c);
  drawChefHand(c);
  drawPageCorner(c);
  drawPhotoView(c);
  drawPageTurn(c);
}
function frame(ts) {
  if (!running) return;
  requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000; lastT = ts;
  const raw = dt;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  if (raw > 0 && raw < 0.25) fpsAcc += raw, fpsN++;
  if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; slowSec = fps < 42 ? slowSec + 1 : Math.max(0, slowSec - 1); if (QUAL && slowSec >= 3) { QUAL = 0; DPR_CAP = 1.5; applyDPR(); slowSec = 0; logEv('quality', { q: 0, fps: +fps.toFixed(1) }); } else if (!QUAL && DPR_CAP > 1 && slowSec >= 4) { DPR_CAP = 1; applyDPR(); slowSec = 0; logEv('quality', { q: -1, fps: +fps.toFixed(1) }); } }
  update(dt);
  render();
  frameN++;
}

/* ---------- 起動・画面の向き・非表示 ---------- */
/* 解像度だけを下げる(配置は同じなので、持っている物やドラッグはそのまま) */
function applyDPR() { DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1); canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); layoutVersion++; }
function onResize() {
  const oldW = W, oldH = H;
  computeLayout(); placeKitchen();
  if (world.dragging) cancelDrag();
  world.selected && returnSelected(world.selected);
  for (const f of K.foods) { if (f.loc && f.loc.type === 'tool') { f.x = f.loc.tool.x; f.y = f.loc.tool.y; } if (f.loc && f.loc.type === 'plate') { f.x = K.plate.x; f.y = K.plate.y; } }
  if (oldW !== W || oldH !== H) logEv('resize', { w: W, h: H });
}
window.addEventListener('resize', () => { onResize(); if (!running) render(); });
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; AU.suspend(); if (world.dragging) cancelDrag(); ptr.id = null; logEv('hidden', {}); }
  else if (!running) { running = true; lastT = 0; AU.resume(); onResize(); requestAnimationFrame(frame); logEv('shown', {}); }
});
window.addEventListener('pagehide', () => { running = false; AU.suspend(); });
window.addEventListener('pageshow', () => { if (!running && !document.hidden) { running = true; lastT = 0; requestAnimationFrame(frame); } });

canvas.addEventListener('contextmenu', e => e.preventDefault());
['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

/* ---------- 自動テスト用の窓口(遊びには影響しない) ---------- */
window.__bc = {
  get state() { return { GT, phase: world.phase, festival: T.festival, disc: Object.assign({}, LOG.disc), served: world.servedToday, ready: world.festReady, day: Save.day, photos: Save.photos.length, saveOk: Save.ok, fps, particles: P.length, wallOpen: world.wallOpen }; },
  log: LOG, T, A, K, L, world, TOWN,
  step(sec, dtStep = 1 / 30) { const n = Math.ceil(sec / dtStep); for (let i = 0; i < n; i++) update(dtStep); render(); },
  pos(name, i) {

    if (name === 'bin') { const b = K.bins.find(b => b.ing === i); return { x: b.x, y: b.y }; }
    if (name === 'tool') { const t = K.tools[i]; return { x: t.x, y: t.y }; }
    if (name === 'seat') { const a = seatAnimal(i); if (!a) return null; const p = seatPos(a); return { x: p.x, y: p.y - 60 * p.u, sp: a.sp, st: a.st }; }
    if (name === 'toolFood') { const f = K.tools[i].items[0]; return f ? { x: f.x, y: f.y, steps: f.steps.join(''), ings: f.ings.join(''), mixed: !!f.mixed } : null; }
    if (name === 'corner') return { x: W - L.sa.r - 20 * L.s, y: H - L.sa.b - 20 * L.s };
    if (name === 'queue') { const a = A.find(a => a.place === 'town' && a.st === 'queue' && (!i || a.sp === i)); if (!a) return null; const [x, y] = townAnimalScreen(a); return { x, y: y - 20 * townScale(), sp: a.sp }; }
    return null;
  },
  seats() { return [0, 1, 2].map(i => { const a = seatAnimal(i); return a ? { sp: a.sp, st: a.st, want: a.want } : null; }); },
  serveDirect(seat, ings, steps = [], special = false) { const a = seatReady(seat); if (!a) return false; const f = makeFood(ings, steps, special); K.foods.push(f); const mp = mouthPos(a); f.x = mp.x; f.y = mp.y; return feed(a, f); },
  forceOpen() { startOpening(A[0]); },
  audio() { return AU.ctx ? AU.ctx.state : 'none'; },
  perf(n = 60) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); render(); } return +((performance.now() - t0) / n).toFixed(2); },
  setQual(q) { QUAL = q; },
  animals() { return A.map(a => ({ id: a.id, sp: a.sp, place: a.place, st: a.st, fam: a.fam, x: +a.x.toFixed(3), y: +a.y.toFixed(3), z: +a.z.toFixed(1), seat: a.seat })); },
};
</script>
