<script>
(function(){
'use strict';

/* =========================================================
   宝石色の雲のまちと渡り鳥のおひっこし
   単一ファイル・外部通信なし・文字なしUI
   ========================================================= */

// ---------- 基本ユーティリティ ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = t => Math.pow(clamp(t, 0, 1), 2);
const easeOutBack = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let seed0 = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
let rnd = mulberry32(seed0);
const R = (a, b) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const pick = arr => arr[Math.floor(rnd() * arr.length) % arr.length];
const chance = p => rnd() < p;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// ---------- 定数 ----------
const LW = 100;      // 区画の幅
const LH = 86;       // 1段の高さ
const EDGE = 22;     // 島の端の余白
const PART_TYPES = ['bridge', 'stairs', 'roof', 'garden', 'windmill', 'swing', 'bowl', 'prism'];
const COL = {
  lead: '#2b2531', leadS: 'rgba(43,37,49,0.85)',
  ruby: '#d4204c', rubyL: '#ff7c98', rubyD: '#8c0f2e',
  sap: '#2458cc', sapL: '#7fa9ff', sapD: '#152f7d',
  emer: '#12a366', emerL: '#72e8ab', emerD: '#0a6a40',
  amb: '#f2a417', ambL: '#ffd979', ambD: '#ad6c05',
  ame: '#8b52d4', ameL: '#c7a3ff',
  rose: '#f06aa0', roseL: '#ffc0da',
  milk: '#f8f4ef', milk2: '#e9e2ec', milk3: '#ffffff', milkS: '#d9d2e3',
  water: '#3f8ff0', waterL: '#a6d4ff', waterD: '#1d5bb8',
  clear: 'rgba(228,244,255,0.42)'
};
const RAINBOW = ['#ff3b5c', '#ff8a1e', '#ffd21e', '#3fd06a', '#2fb6ff', '#3d5cff', '#a34dff'];

// ---------- 毎回少し変わる要素 ----------
const SESS = {
  windDir: chance(0.5) ? 1 : -1,
  rainDur: R(6.2, 9.0),
  rainAmt: R(0.78, 1.06),
  gustDur: R(5.0, 7.5),
  gyOff: { A: R(-16, 8), B: R(-6, 18), C: R(-26, 6), D: R(-14, 12) },
  cWho: pick([['duck', 'duck', 'sparrow'], ['sparrow', 'duck', 'swallow'], ['duck', 'sparrow', 'sparrow'], ['sparrow', 'sparrow', 'duck']]),
  fest: RI(0, 2),
  bandKind: pick(['drum', 'bell', 'horn']),
  garland: pick([[COL.ruby, COL.amb, COL.emer], [COL.sap, COL.rose, COL.amb], [COL.ame, COL.emer, COL.ruby]]),
  rare: rnd(),
  cDelay: R(-12, 12)
};

// ---------- 保存（バージョン付き・失敗しても遊べる） ----------
const SAVE_KEY = 'cloudtown-261028-11';
const SAVE_VER = 2;
const Store = {
  ok: true, fails: 0, loadedBroken: false,
  probe() {
    try {
      const ls = window.localStorage;
      const k = SAVE_KEY + '-probe';
      ls.setItem(k, '1'); ls.removeItem(k);
      this.ok = true;
    } catch (e) { this.ok = false; }
    return this.ok;
  },
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { this.ok = false; return null; }
    if (!raw) return null;
    let d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (d && typeof d === 'object' && d.v !== SAVE_VER) d = migrateSave(d);
    if (!d || typeof d !== 'object' || d.v !== SAVE_VER || !Array.isArray(d.parts) || !Array.isArray(d.birds) || typeof d.flags !== 'object' || !d.flags) {
      this.loadedBroken = true;
      try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { }
      return null;
    }
    return d;
  },
  save(d) {
    if (!this.ok) return false;
    try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(d)); this.fails = 0; return true; }
    catch (e) { this.fails++; if (this.fails >= 3) this.ok = false; return false; }
  }
};
function migrateSave(d) {
  // v1: 部品と旗のみの古い形式 → 鳥を作り直して引き継ぐ
  if (d && d.v === 1 && Array.isArray(d.parts) && d.flags) {
    return { v: SAVE_VER, t: d.t || 0, flags: d.flags, unlocked: d.unlocked || ['bridge'], parts: d.parts, birds: [], water: {}, furn: null, fruit: {} };
  }
  return null;
}

// ---------- 音（Web Audio 合成・最初のタッチで開始） ----------
const PENTA = [0, 2, 4, 7, 9];
function nf(deg, base) { base = base || 523.25; const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5; return base * Math.pow(2, (PENTA[i] + 12 * o) / 12); }
const Snd = {
  ctx: null, master: null, revIn: null, noise: null, started: false, voices: 0,
  rainG: null, windG: null, windF: null, flowG: null,
  musNext: 0, musStep: 0, musMode: 'none',
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') { try { this.ctx.resume(); } catch (e) { } } return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    try {
      this.master = c.createGain(); this.master.gain.value = 0.62;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
      this.master.connect(comp); comp.connect(c.destination);
      const conv = c.createConvolver(); conv.buffer = this.impulse(2.4);
      this.revIn = c.createGain(); this.revIn.gain.value = 0.34;
      this.revIn.connect(conv); conv.connect(this.master);
      const len = c.sampleRate * 2, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = nb;
      this.rainG = this.loopNoise('bandpass', 2600, 0.6);
      this.windG = this.loopNoise('bandpass', 520, 0.8, true);
      this.flowG = this.loopNoise('bandpass', 1300, 2.2);
      const sb = c.createBuffer(1, 1, c.sampleRate), s = c.createBufferSource(); s.buffer = sb; s.connect(c.destination); s.start(0);
      if (c.state !== 'running') c.resume();
      this.started = true;
    } catch (e) { this.started = false; }
  },
  get now() { return this.ctx ? this.ctx.currentTime : 0; },
  ok() { return this.started && this.ctx && this.ctx.state === 'running'; },
  impulse(sec) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    return b;
  },
  loopNoise(ft, f, q, lfo) {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const fl = c.createBiquadFilter(); fl.type = ft; fl.frequency.value = f; fl.Q.value = q;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(fl); fl.connect(g); g.connect(this.master); g.connect(this.revIn);
    src.start();
    if (lfo) this.windF = fl;
    return g;
  },
  env(g, t, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
  },
  tone(f, o) {
    if (!this.ok() || this.voices > 46) return;
    o = o || {};
    const c = this.ctx, t = (o.at || c.currentTime) + 0.002;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.slide || o.dur || 0.3));
    if (o.det) osc.detune.value = o.det;
    this.env(g, t, o.a || 0.006, o.g || 0.12, o.dur || 0.4);
    osc.connect(g); g.connect(this.master);
    if (o.wet !== 0) { const s = c.createGain(); s.gain.value = o.wet == null ? 0.5 : o.wet; g.connect(s); s.connect(this.revIn); }
    osc.start(t); osc.stop(t + (o.a || 0.006) + (o.dur || 0.4) + 0.05);
    this.voices++; osc.onended = () => { this.voices--; };
  },
  noiseHit(o) {
    if (!this.ok() || this.voices > 46) return;
    const c = this.ctx, t = (o.at || c.currentTime) + 0.002;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const fl = c.createBiquadFilter(); fl.type = o.ft || 'bandpass'; fl.frequency.setValueAtTime(o.f || 2000, t); fl.Q.value = o.q || 1;
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + (o.dur || 0.2));
    const g = c.createGain(); this.env(g, t, o.a || 0.003, o.g || 0.1, o.dur || 0.15);
    s.connect(fl); fl.connect(g); g.connect(this.master);
    if (o.wet) { const w = c.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(this.revIn); }
    s.start(t, Math.random()); s.stop(t + (o.a || 0.003) + (o.dur || 0.15) + 0.05);
    this.voices++; s.onended = () => { this.voices--; };
  },
  bell(f, g, dur, at) {
    g = g || 0.1; dur = dur || 1.4;
    this.tone(f, { g: g, dur: dur, at: at, wet: 0.7 });
    this.tone(f * 2.01, { g: g * 0.35, dur: dur * 0.6, at: at, wet: 0.7 });
    this.tone(f * 3.03, { g: g * 0.14, dur: dur * 0.35, at: at, wet: 0.8 });
  },
  ting(f, g) { f = f || 2093; this.tone(f, { g: g || 0.07, dur: 0.35, wet: 0.8 }); this.tone(f * 2.76, { g: (g || 0.07) * 0.3, dur: 0.18, wet: 0.9 }); },
  grab() { this.ting(1760 + Math.random() * 400, 0.06); this.tone(3520, { g: 0.02, dur: 0.12, wet: 0.9 }); },
  combo: 0, comboT: -9, root: 0,
  snap(now) {
    // 連続接続で和音が育つ
    if (now - this.comboT < 4.2) this.combo = Math.min(this.combo + 1, 6); else { this.combo = 1; this.root = [0, 3, 4, 0, 5][Math.floor(Math.random() * 5)]; }
    this.comboT = now;
    this.noiseHit({ f: 3800, q: 0.8, g: 0.12, dur: 0.05, ft: 'highpass' });
    this.tone(1300, { g: 0.05, f2: 2400, dur: 0.06, wet: 0.2 });
    const chord = [0, 2, 4, 5, 7, 9];
    const c = this.ctx ? this.ctx.currentTime : 0;
    for (let i = 0; i < this.combo; i++) this.bell(nf(this.root + chord[i], 523.25), 0.075 / (1 + i * 0.25), 1.6, c + 0.03 + i * 0.06);
    return this.combo;
  },
  plank(i) { this.bell(nf(i, 659.25), 0.05, 0.6); this.noiseHit({ f: 900, q: 1.5, g: 0.04, dur: 0.04 }); },
  boing() { this.tone(330, { g: 0.08, f2: 190, slide: 0.3, dur: 0.35, type: 'sine', wet: 0.3 }); this.tone(495, { g: 0.03, f2: 300, slide: 0.3, dur: 0.25, wet: 0.3 }); },
  soft(f) { this.tone(f || 880, { g: 0.04, dur: 0.25, type: 'triangle', wet: 0.4 }); },
  pop() { this.tone(620, { g: 0.08, f2: 980, slide: 0.08, dur: 0.12, wet: 0.3 }); },
  chirp(sp, mul) {
    if (!this.ok()) return;
    mul = mul || 1; const c = this.ctx.currentTime;
    if (sp === 'duck') {
      for (let i = 0; i < 2; i++) { this.tone(300 * mul, { at: c + i * 0.17, g: 0.05, f2: 230 * mul, slide: 0.12, dur: 0.13, type: 'sawtooth', wet: 0.2 }); this.noiseHit({ at: c + i * 0.17, f: 900 * mul, q: 4, g: 0.03, dur: 0.1 }); }
    } else if (sp === 'sparrow') {
      for (let i = 0; i < 2; i++) this.tone(3300 * mul, { at: c + i * 0.11, g: 0.035, f2: 2500 * mul, slide: 0.05, dur: 0.07, wet: 0.35 });
    } else if (sp === 'chick') {
      this.tone(4300 * mul, { at: c, g: 0.035, f2: 5200 * mul, slide: 0.1, dur: 0.14, wet: 0.35 });
    } else {
      for (let i = 0; i < 3; i++) this.tone((2900 + i * 220) * mul, { at: c + i * 0.08, g: 0.03, f2: (3900 - i * 200) * mul, slide: 0.05, dur: 0.06, wet: 0.35 });
    }
  },
  whoosh(dur, g) { this.noiseHit({ f: 380, f2: 1500, q: 0.7, g: g || 0.12, a: dur * 0.3, dur: dur * 0.7, wet: 0.3 }); },
  plink() { this.tone(1800 + Math.random() * 1600, { g: 0.018, f2: 900, slide: 0.05, dur: 0.07, wet: 0.6 }); },
  splash() { this.noiseHit({ f: 1600, q: 0.9, g: 0.06, dur: 0.18, wet: 0.3 }); this.tone(700, { g: 0.03, f2: 1400, slide: 0.06, dur: 0.1 }); },
  sparkle() { const c = this.ctx ? this.ctx.currentTime : 0; for (let i = 0; i < 4; i++) this.tone(nf(10 + i * 2, 523.25), { at: c + i * 0.05, g: 0.025, dur: 0.3, wet: 0.9 }); },
  joy() { const c = this.ctx ? this.ctx.currentTime : 0; [0, 2, 4, 7].forEach((d, i) => this.bell(nf(5 + d, 523.25), 0.05, 0.9, c + i * 0.09)); },
  rainbow() { const c = this.ctx ? this.ctx.currentTime : 0; for (let i = 0; i < 7; i++) this.bell(nf(3 + i, 523.25), 0.05, 1.8, c + i * 0.08); },
  fanfare() {
    const c = this.ctx ? this.ctx.currentTime : 0;
    [0, 2, 4, 5, 7, 9, 10].forEach((d, i) => this.bell(nf(d, 392), 0.07, 2.4, c + i * 0.11));
    [0, 4, 7].forEach((s) => this.tone(196 * Math.pow(2, s / 12), { at: c + 0.8, g: 0.06, a: 0.4, dur: 2.6, type: 'triangle', wet: 0.6 }));
  },
  bellRing() { const c = this.ctx ? this.ctx.currentTime : 0; this.bell(1046.5, 0.1, 2.2, c); this.bell(1318.5, 0.06, 2, c + 0.15); },
  setLoops(rain, wind, flow) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.rainG.gain.setTargetAtTime(rain * 0.11, t, 0.3);
    this.windG.gain.setTargetAtTime(wind * 0.16, t, 0.2);
    if (this.windF) this.windF.frequency.setTargetAtTime(380 + wind * 600, t, 0.3);
    this.flowG.gain.setTargetAtTime(flow * 0.035, t, 0.4);
  },
  // パレード・お祭りの音楽（requestAnimationFrame から先読みで予約）
  music(mode, dt) {
    if (!this.ok()) return;
    if (mode !== this.musMode) { this.musMode = mode; this.musNext = Math.max(this.musNext, this.ctx.currentTime + 0.05); }
    if (mode === 'none') return;
    const c = this.ctx.currentTime, step = mode === 'fest' ? 0.24 : 0.3;
    if (this.musNext < c - 0.5) this.musNext = c + 0.05;
    while (this.musNext < c + 0.25) {
      const s = this.musStep++, at = this.musNext; this.musNext += step;
      const melA = [0, 2, 4, 2, 3, 4, 5, -1, 4, 3, 2, 3, 4, 2, 0, -1];
      const melC = [7, -1, 6, 5, -1, 6, 7, 9, -1, 7, 6, -1, 5, 4, 5, -1];
      const i = s % 16;
      if (mode === 'ab' || mode === 'both' || mode === 'merged' || mode === 'fest') {
        if (melA[i] >= 0) this.tone(nf(melA[i] + 5, 523.25), { at: at, g: mode === 'fest' ? 0.05 : 0.04, dur: 0.28, type: 'triangle', wet: 0.5 });
      }
      if (mode === 'c' || mode === 'both') {
        if (melC[i] >= 0) this.tone(nf(melC[i] + (mode === 'both' ? 1 : 0), 523.25), { at: at, g: 0.03, dur: 0.2, type: 'square', wet: 0.3 });
      }
      if (mode === 'merged' || mode === 'fest') {
        if (melC[i] >= 0) this.tone(nf(melC[i], 523.25), { at: at, g: 0.025, dur: 0.22, type: 'sine', wet: 0.6 });
        if (i % 4 === 0) this.tone(nf([0, 3, 4, 0][(i / 4) | 0], 130.81), { at: at, g: 0.07, dur: 0.9, type: 'triangle', wet: 0.3 });
      }
      if (mode !== 'c' && i % 2 === 0) this.noiseHit({ at: at, f: i % 4 === 0 ? 180 : 2400, ft: i % 4 === 0 ? 'lowpass' : 'highpass', q: 0.7, g: i % 4 === 0 ? 0.06 : 0.015, dur: 0.07 });
      if (mode === 'fest' && i % 8 === 6) this.bell(nf(10 + (s % 3), 523.25), 0.03, 1, at);
    }
  }
};

// ---------- 世界のかたち（位相モデル：島・区画・すき間・橋の上） ----------
const ISLDEF = { A: ['pillar', null, null, 'nest'], B: [null, 'houseB', null, null], C: [null, 'houseC', null], D: [null, null] };
const GAPDEF = { AB: { L: 'A', R: 'B', w: 180, segs: 1 }, BC: { L: 'B', R: 'C', w: 290, segs: 2 }, CD: { L: 'C', R: 'D', w: 190, segs: 1 } };
const GAP_IDS = ['AB', 'BC', 'CD'];
const ISL_IDS = ['A', 'B', 'C', 'D'];
const PARK_Y = 430;
const PARK_LOTS = [210, 1030, 1500];
const RIDES = { ferris: { x: 392, y: 300, r: 118 }, carousel: { x: 846, y: 372 }, swingride: { x: 1342, y: 334 } };
const G = {
  t: 0, realT: 0, W: 390, H: 844, dpr: 1, safe: { t: 0, r: 0, b: 0, l: 0 }, trayH: 110, skyH: 90, portrait: true,
  cam: { x: 534, y: -40, s: 0.7, tx: 534, ty: -40, ts: 0.7, manualT: -99, panVX: 0 },
  isl: null, parts: {}, slots: {}, S: null,
  flags: {}, unlocked: ['bridge'], unlockT: {}, birds: [], boats: [], furn: [], particles: [], pulses: [], ripples: [],
  weather: { rain: 0, rainT: 0, wind: 0, windT: 0, sun: 0.55, moist: 0, afterRain: 0, cloudPuff: 0, windPuff: 0, sunPuff: 0 },
  basins: { AB: 0, BC: 0, CD: 0 }, pond: 0, streams: [],
  graph: null, gver: 0, power: null, rainbows: [], skyIslet: 0,
  log: [], disc: {}, lastInput: 0, focus: null, hintDone: {}, hint: null,
  park: { t: 0 }, fest: { on: false, t: 0, n: 0, next: 0, deco: 0 }, parade: null,
  excite: 0, structT: 0, dirty: false, saveT: 0, timeScale: 1, started: false, restored: false,
  festDeco: 0, gardenFruit: {}, partyCount: 0
};
let partSeq = 1, birdSeq = 1;

function makeIslands() {
  const isl = {};
  let x = 0;
  const after = { A: 'AB', B: 'BC', C: 'CD' };
  for (const id of ISL_IDS) {
    const lots = ISLDEF[id], w = EDGE * 2 + LW * lots.length;
    isl[id] = {
      id: id, lots: lots.map(f => ({ fixed: f })), n: lots.length, x0: x, x1: x + w,
      gy0: ({ A: 0, B: 8, C: -10, D: 2 })[id] + SESS.gyOff[id], bob: R(0, TAU), bobA: R(1.8, 3.2),
      present: id === 'A' || id === 'B', dock: (id === 'A' || id === 'B') ? 1 : 0, xo: 0, yo: 0,
      puffs: null

// ---------- 粒・光・波紋・花火 ----------
function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i]; p.age += dt;
    if (p.age >= p.life) { G.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'drop') p.vy += 520 * dt; else if (p.kind === 'heart' || p.kind === 'steam') p.vy *= 0.98; else if (p.kind === 'petal') { p.vy += Math.sin(p.age * 5) * 30 * dt; } else { p.vx *= 0.94; p.vy *= 0.94; }
  }
  for (let i = G.ripples.length - 1; i >= 0; i--) { const r = G.ripples[i]; r.age += dt; if (r.age > r.life) G.ripples.splice(i, 1); }
  if (G.fireworks) for (let i = G.fireworks.length - 1; i >= 0; i--) { const f = G.fireworks[i]; f.t += dt; if (f.t > 2.2) G.fireworks.splice(i, 1); }
}
let pulseNotes = 0;
function updatePulses(dt) {
  for (let i = G.pulses.length - 1; i >= 0; i--) {
    const p = G.pulses[i]; p.t += dt / p.dur;
    if (p.t >= 1) {
      G.pulses.splice(i, 1);
      const q = G.parts[p.q]; if (q) { q.glow = 1; q.bounce = Math.max(q.bounce, 0.35); }
      if (pulseNotes < 6) { pulseNotes++; Snd.bell(nf(p.deg + 2, 523.25), 0.03, 0.8); }
    }
  }

    const k = (G.realT - G.preview.t) / 1.6;
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.sin(k * Math.PI) * 0.7; c.fillStyle = '#fff6c8'; star(c, sp.x, sp.y - 10, 16 + 8 * Math.sin(k * 12)); c.fill(); c.restore();
  }
}

// ---------- 世界の描画順 ----------
function render(dt) {
  const c = ctx, d = G.dpr;
  c.setTransform(d, 0, 0, d, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  if (skyCv) c.drawImage(skyCv, 0, 0, G.W, G.H); else { c.fillStyle = '#d9e6f4'; c.fillRect(0, 0, G.W, G.H); }
  drawSun(c);
  drawFarClouds(c);
  const v = viewRect(), cam = G.cam;
  c.save();
  c.translate((v.x0 + v.x1) / 2, (v.y0 + v.y1) / 2); c.scale(cam.s, cam.s); c.translate(-cam.x, -cam.y);
  drawPark(c);
  drawCloudSea(c);
  drawBasins(c);
  for (const id of ISL_IDS) if (G.isl[id].present) drawIsland(c, G.isl[id]);
  const A = G.isl.A;
  drawPillar(c, A);
  drawNest(c, lotX(A, 3), GY(A) + 2, 0.95);
  drawHouse(c, lotX(G.isl.B, 1), GY(G.isl.B), 'houseB');
  if (G.isl.C.present) drawHouse(c, lotX(G.isl.C, 1), GY(G.isl.C), 'houseC');
  drawStreams(c);
  if (G.park.start && G.park.t > 0.4) for (const g of GAP_IDS) if (G.graph.N[g + ':m'] && gapDone(g) && G.graph.N['P:g' + g]) drawGate(c, g);
  for (const id in G.parts) { const p = G.parts[id]; if (p.type === 'bridge' && p.slot) drawBridgeSeg(c, p); }
  const S = G.S;
  for (const slot in G.slots) {
    if (slot[0] !== 'L') continue;
    const st = G.slots[slot]; let lvl = 0;
    for (const pid of st) {
      const p = G.parts[pid]; if (!p) continue;
      const b = partBase(p);
      const terr = p.type === 'garden' && S ? S.terr.find(t => t.garden.p === p) : null;
      drawPartAt(c, p.type, b.x, b.y, 1, p, { lvl: lvl, terrace: terr });
      if (p.type === 'stairs') lvl++;
    }
  }
  for (const slot in G.slots) { if (slot[0] !== 'K') continue; for (const pid of G.slots[slot]) { const p = G.parts[pid]; if (p) { const b = partBase(p); drawPartAt(c, p.type, b.x, b.y, 1, p, {}); } } }
  drawRopes(c);
  drawRainbows(c);
  drawFurniture(c);
  for (const bt of G.boats) drawBoat(c, bt);
  const vis = G.birds.filter(b => !b.gone && onScreen(b.x, b.y, 80)).sort((a, b) => a.y - b.y);
  for (const b of vis) drawBird(c, b);
  // 巣のふち（中の鳥が巣にすっぽり入って見える）
  for (const id of ['high', 'nest']) {
    const x = id === 'high' ? lotX(A, 0) : lotX(A, 3), y = id === 'high' ? GY(A) - 2 * LH + 4 : GY(A) + 2;
    c.save(); c.translate(x, y); c.scale(0.95, 0.95); c.beginPath(); c.ellipse(0, -10, 40, 16, 0, 0, Math.PI); c.closePath(); glass(c, '#b9772c', 0.96, 2.6);
    for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 11 - 6, -10); c.lineTo(i * 11 + 8, 0); c.strokeStyle = 'rgba(43,37,49,0.6)'; c.lineWidth = 2; c.stroke(); }
    c.restore();
  }
  drawFruitFly(c);
  drawParticles(c);
  c.restore();
  drawSunbeams(c);
  drawRainWind(c);
  drawSkyObjects(c);
  drawTray(c);
  drawUiFx(c, dt);
  drawGhost(c);
  drawHint(c);
}

// ---------- 1フレームの進行 ----------
function step(dt) {
  G.t += dt;
  runTimers();
  updateIslands(dt); rideBirdsPos();
  updateNodes();
  updateWeather(dt); updateWater(dt);
  if (updateRainbows(dt)) { buildGraph(); updateNodes(); birdsOnGraphChange(); }
  updatePower(dt); updateRides(dt);
  updateBuild(dt); updateGlides(dt);
  updateReunion(dt); updateFamily(); updateArrivals(); updatePark(dt); updateMigrants();
  updateFurniture(dt); updateGardens(dt); updateFruitFly(dt); updateBoats(dt);
  for (const b of G.birds) if (!b.gone) birdUpdate(b, dt);
  updateParade(dt); updateParadeSchedule(); updateFestival(dt);
  updateGuide();
  updateParticles(dt); updatePulses(dt);
  updateRainWind(dt);
  G.excite = Math.max(0, G.excite - dt * 0.06);
  let mm = 'none';
  if (G.fest.on) mm = 'fest';
  else if (G.parade && G.parade.groups.length) {
    const keys = G.parade.groups.map(g => g.key);
    const hasC = keys.some(k => k.indexOf('C') >= 0), hasAB = keys.some(k => /[AB]/.test(k));
    mm = G.parade.groups.length >= 2 ? 'both' : (hasC && hasAB) ? 'merged' : hasC ? 'c' : 'ab';
  }
  G.musicMode = mm;
  Snd.music(mm);
  if ((G.dirty && G.t - G.saveT > 2) || G.t - G.saveT > 15) saveNow();
}
let lastNow = 0, rafId = 0, running = false;
function frame(now) {
  if (!running) return;
  rafId = requestAnimationFrame(frame);
  if (window.innerWidth !== G.W || window.innerHeight !== G.H) resize();
  let dt = lastNow ? (now - lastNow) / 1000 : 0.016; lastNow = now;
  if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.05);
  G.realT += dt;
  let sdt = dt * G.timeScale;
  try {
    while (sdt > 1e-6) { const h = Math.min(sdt, 0.05); step(h); sdt -= h; }
    updateCamera(dt);
    render(dt);
  } catch (e) {
    if (!G.errOnce) { G.errOnce = true; G.lastError = String(e && e.stack || e); }
  }
}
function startLoop() { if (running) return; running = true; lastNow = 0; rafId = requestAnimationFrame(frame); }
function stopLoop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }
function cancelGestures() {
  if (G.drag) { const d = G.drag; G.drag = null; dropDrag(d, true); }
  G.press = null; G.pan = null; G.ptr.active = false;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelGestures(); saveNow(); stopLoop(); if (Snd.ctx && Snd.ctx.state === 'running') { try { Snd.ctx.suspend(); } catch (e) { } } }
  else { startLoop(); if (Snd.ctx) { try { Snd.ctx.resume(); } catch (e) { } } }
});
window.addEventListener('pagehide', () => { saveNow(); });
window.addEventListener('blur', () => { cancelGestures(); });
window.addEventListener('resize', () => resize());
window.addEventListener('orientationchange', () => resize());

// ---------- はじまり ----------
function freshState() {
  G.t = 0; G.parts = {}; G.slots = {}; G.birds = []; G.boats = []; G.flags = {}; G.unlocked = ['bridge']; G.unlockT = {};
  G.basins = { AB: 0, BC: 0, CD: 0 }; G.pond = 0; G.disc = {}; G.parade = null; G.fest = { on: false, t: 0, n: 0, next: 0, deco: 0 };
  G.park = { t: 0 }; G.rainbows = []; G.isl = makeIslands(); initFurniture(); G.festDeco = 0; G.rainCloud = 0; G.windCloud = 0;
  timers.length = 0;
}
function init() {
  G.isl = makeIslands(); initFurniture();
  Store.probe();
  const saved = Store.ok ? Store.load() : null;
  let ok = false;
  if (saved) { try { restore(saved); ok = true; } catch (e) { ok = false; G.restoreError = String(e); } }
  if (!ok) {
    freshState();
    analyze(); waterRoutes(); buildGraph(); buildPower();
    setupStart();
    G.log.push({ t: 0, k: saved ? 'restore-failed-fresh' : (Store.loadedBroken ? 'broken-save-fresh' : 'fresh'), storage: Store.ok });
  }
  analyze(); waterRoutes(); buildGraph(); buildPower(); updateNodes();
  resize();
  const t = camTarget(); G.cam.x = t.x; G.cam.y = t.y; G.cam.s = t.s;
  G.lastInput = 0; G.trayReady = true;
  for (const b of G.birds) { const n = nodeXY(b.node); if (n) { b.x = n.x; b.y = n.y; } }
  startLoop();
}
if (/[?&]test\b/.test(location.search)) {
  window.__CT = {
    G: G, Snd: Snd, Store: Store,
    slotScreen: s => { const ps = parseSlot(s); const a = ps.k === 'G' ? bridgePoint(ps.a, segMidU(ps.a, ps.i)) : slotAnchor(s); return worldToScreen(a.x, a.y); },
    trayScreen: t => { const it = trayLayout().find(o => o.type === t); return it ? { x: it.x, y: it.y, size: it.size } : null; },
    skyScreen: k => skyLayout()[k],
    partScreen: id => { const p = G.parts[id]; if (!p || !p.slot) return null; const c = partCenter(p); return worldToScreen(c.x, c.y); },
    partsOf: t => Object.values(G.parts).filter(p => p.slot && p.type === t).map(p => ({ id: p.id, slot: p.slot, angle: p.angle })),
    nodeScreen: id => { const n = G.graph.N[id]; return n ? worldToScreen(n.x, n.y) : null; },
    worldToScreen: worldToScreen, setSpeed: k => { G.timeScale = k; },
    canPlace: canPlace, allSlots: allSlots, islandsLinked: islandsLinked, gapDone: gapDone,
    saveNow: saveNow, serialize: serialize,
    summary: () => ({
      t: +G.t.toFixed(1), flags: G.flags, unlocked: G.unlocked, disc: Object.keys(G.disc), birds: G.birds.filter(b => !b.gone).map(b => ({ id: b.id, sp: b.sp, home: b.home, mode: b.mode, node: b.node, act: b.goal ? b.goal.act : null, carry: b.carry, x: Math.round(b.x), y: Math.round(b.y) })),
      dw: G.S.dw.map(d => ({ id: d.id, kind: d.kind, res: birdsAt(d.id).map(b => b.sp) })), basins: G.basins, pond: +G.pond.toFixed(2), boats: G.boats.map(b => ({ basin: b.basin, state: b.state })),
      rainbows: G.rainbows.map(r => ({ from: r.from, to: r.to, lv: +r.lv.toFixed(2) })), party: G.party, park: G.park.t, fest: G.fest, focus: G.focus, hint: G.hint ? G.hint.key : null,
      cam: { x: Math.round(G.cam.x), y: Math.round(G.cam.y), s: +G.cam.s.toFixed(3) }, parade: G.parade ? G.parade.groups.map(g => ({ key: g.key, n: g.members.length, j: g.joiners.length, route: routeSummary(g.route) })) : null,
      music: G.musicMode, particles: G.particles.length, err: G.lastError || null, store: Store.ok, saveOK: G.lastSaveOK, power: G.power ? Object.keys(G.power.el).filter(k => G.power.el[k].kind === 'sink').map(k => ({ id: k, lvl: +G.power.el[k].lvl.toFixed(2), towers: G.power.el[k].towers, amp: +G.power.el[k].amp.toFixed(2) })) : null
    })
  };
}
init();
})();
