      #hud {

        overflow: hidden;
      }
      .hud-btn {
        position: absolute;
        left: 50%;
        width: min(30vmin, 180px);
        height: min(30vmin, 180px);
        margin-left: calc(min(30vmin, 180px) / -2);
        border-radius: 50%;
        border: none;
        padding: 0;
        background: radial-gradient(circle at 35% 30%, #ff8a7a, #e0453a 60%, #b8322b);

        cursor: pointer;
        opacity: 0;
        transform: scale(0.6);
        transition: opacity 0.4s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1);
        pointer-events: none;
        touch-action: none;
      }
      .hud-btn.show {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
        animation: breathe 1.6s ease-in-out infinite;
      }
      .hud-btn svg {
        width: 56%;
        height: 56%;
        margin: 22%;
        display: block;
        pointer-events: none;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      #hand {
        position: absolute;
        left: 0;
        top: 0;
        width: 84px;
        height: 84px;
        margin: -8px 0 0 -30px;
        opacity: 0;
        transition: opacity 0.35s;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
        will-change: transform, opacity;
      }
      .ripple {
        position: absolute;
        left: 0;
        top: 0;
        width: 76px;
        height: 76px;
        margin: -38px 0 0 -38px;
        border-radius: 50%;
        border: 5px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        pointer-events: none;
        animation: rip 0.5s ease-out forwards;
      }
      @keyframes rip {
        from {
          transform: var(--p) scale(0.3);
          opacity: 1;
        }
        to {
          transform: var(--p) scale(1.35);
          opacity: 0;
        }
      }
      #ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 96px;
        height: 96px;

        opacity: 0;
        transition: opacity 0.35s;
        will-change: transform, opacity;
      }
