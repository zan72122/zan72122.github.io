<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>やわらかそざいあそび - ぷにぷにランド</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">

<!-- やわらかそざいあそび
     依存ライブラリゼロ: 物理は自前の 2D MLS-MPM、描画は生 WebGL2。
     classic scripts が GAME 名前空間に登録され、最後の inline module が boot する。 -->
<script defer src="src/core/utils.js"></script>
<script defer src="src/core/input.js"></script>
<script defer src="src/core/motion.js"></script>
<script defer src="src/audio/audio.js"></script>
<script defer src="src/audio/squish.js"></script>
<script defer src="src/audio/music.js"></script>
<script defer src="src/sim/materials.js"></script>
<script defer src="src/sim/colliders.js"></script>
<script defer src="src/sim/shapes.js"></script>
<script defer src="src/sim/mpm.js"></script>
<script defer src="src/gfx/shaders.js"></script>
<script defer src="src/gfx/renderer.js"></script>
<script defer src="src/gfx/canvas2d.js"></script>
<script defer src="src/gfx/face.js"></script>
<script defer src="src/gfx/fx.js"></script>
<script defer src="src/ui/hud.js"></script>
<script defer src="src/ui/quests.js"></script>
<script defer src="src/ui/screens.js"></script>
<script defer src="src/core/game.js"></script>

<!-- Bootstrap: runs after every defer'd classic script above. -->
<script type="module">
  window.GAME.boot();
</script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div id="ui-root"></div>
</div>
</body>
</html>
