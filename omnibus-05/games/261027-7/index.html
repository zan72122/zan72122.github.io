<!doctype html>
<html lang="ja">
<head>

<title>かいじゅうヘアサロン大行進</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fde8a8;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

<script src="/gf-nav.js" defer></script>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
(function(){
// =====================================================================
//  基本ユーティリティ
// =====================================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const easeO=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const bump=t=>Math.sin(PI*clamp(t,0,1));
const easeBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const plateau=(t,k)=>clamp(Math.min(t*k,(1-t)*k),0,1);
const INK='#241a3d';
const MIS='rgba(255,60,150,0.28)';
const COLS={coral:'#ff6b5e',turq:'#2ec4b6',cream:'#fff3cf',yellow:'#ffd23f',blue:'#3a5fd9',lilac:'#b9a0ff',orange:'#ff9f1c',pink:'#ff8fc7',mint:'#8de8c6',red:'#ef3e4a',gold:'#ffc23a',navy:'#2a2466'};
const PARTY=['#ff6b5e','#ffd23f','#2ec4b6','#3a5fd9','#b9a0ff','#ff9f1c','#ff8fc7','#7be07b'];

function dotCanvas(sz,r,col){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');g.fillStyle=col;
  for(const [x,y] of [[sz/4,sz/4],[sz*3/4,sz*3/4]]){g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}return c;}
const PSRC={dk:dotCanvas(10,1.9,'rgba(36,26,61,0.20)'),lt:dotCanvas(10,1.7,'rgba(255,255,255,0.5)'),pk:dotCanvas(8,1.8,'rgba(255,70,130,0.5)'),
  big:dotCanvas(18,3.4,'rgba(36,26,61,0.16)'),red:dotCanvas(12,2.6,'rgba(120,0,30,0.28)'),gold:dotCanvas(10,2,'rgba(150,80,0,0.28)')};
function pat(g,n){if(!g._pt)g._pt={};return g._pt[n]||(g._pt[n]=g.createPattern(PSRC[n],'repeat'));}

// Path2D を太線＋網点＋版ずれで塗る
function inkFill(g,p,fill,lw,dots,shift,box){
  if(shift){g.save();g.translate(3,2.5);g.fillStyle=MIS;g.fill(p);g.restore();}
  g.fillStyle=fill;g.fill(p);
  if(dots){g.save();g.clip(p);g.fillStyle=pat(g,dots);const b=box||400;g.fillRect(-b,-b,b*2,b*2);g.restore();}
  if(lw){g.lineWidth=lw;g.strokeStyle=INK;g.lineJoin='round';g.lineCap='round';g.stroke(p);}
}
function ellP(x,y,rx,ry,rot){const p=new Path2D();p.ellipse(x,y,rx,ry,rot||0,0,TAU);return p;}
function rrP(x,y,w,h,r){const p=new Path2D();r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();return p;}
function starPath(g,x,y,r,rot,pts,inner){pts=pts||5;inner=inner||0.48;g.moveTo(x+Math.cos(rot)*r,y+Math.sin(rot)*r);
  for(let i=1;i<pts*2;i++){const a=rot+i*PI/pts;const rr=i%2?r*inner:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}

// =====================================================================
//  音（Web Audio 合成）
// =====================================================================
const AU={ctx:null,out:null,nb:null,buzzG:null,buzzO:null,music:false,next:0,step:0,mStart:0,last:{}};
function audioInit(){
  try{
    if(!AU.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const a=new AC();AU.ctx=a;
      const comp=a.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;comp.knee.value=12;
      const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      const out=a.createGain();out.gain.value=0.5;out.connect(lp);lp.connect(comp);comp.connect(a.destination);AU.out=out;
      const nb=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;AU.nb=nb;
      // バリカンの振動音（常時鳴らし、音量で制御）
      const o=a.createOscillator();o.type='sawtooth';o.frequency.value=112;
      const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=480;f.Q.value=3;
      const am=a.createGain();am.gain.value=0.6;const lfo=a.createOscillator();lfo.frequency.value=34;const lg=a.createGain();lg.gain.value=0.35;
      lfo.connect(lg);lg.connect(am.gain);
      const g=a.createGain();g.gain.value=0;o.connect(f);f.connect(am);am.connect(g);g.connect(out);o.start();lfo.start();
      AU.buzzG=g;AU.buzzO=o;
    }
    if(AU.ctx.state!=='running')AU.ctx.resume();
  }catch(e){}
}
function aOK(){return AU.ctx&&AU.ctx.state==='running';}
function thr(key,gap){const t=performance.now();if(AU.last[key]&&t-AU.last[key]<gap*1000)return false;AU.last[key]=t;return true;}
function envG(g,t,att,vol,dur){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dur);}
function tone(f,dur,type,vol,delay,f2,att,at){
  if(!aOK())return;const a=AU.ctx,t=(at||a.currentTime)+(delay||0);att=att||0.008;
  const o=a.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+att+dur);
  const g=a.createGain();envG(g,t,att,vol,dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+att+dur+0.05);
}
function noise(dur,ft,freq,q,vol,delay,f2,att,at){
  if(!aOK())return;const a=AU.ctx,t=(at||a.currentTime)+(delay||0);att=att||0.004;
  const s=a.createBufferSource();s.buffer=AU.nb;const fl=a.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(freq,t);fl.Q.value=q;
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+att+dur);
  const g=a.createGain();envG(g,t,att,vol,dur);s.connect(fl);fl.connect(g);g.connect(AU.out);s.start(t,Math.random()*0.5);s.stop(t+att+dur+0.05);
}
function setBuzz(v){if(!aOK()||!AU.buzzG)return;const t=AU.ctx.currentTime;AU.buzzG.gain.setTargetAtTime(v*0.06,t,0.03);AU.buzzO.frequency.setTargetAtTime(105+v*25,t,0.05);}
const SFX={
  snip(kind){
    if(!thr('snip',0.065))return;
    if(kind==='lion'){noise(0.13,'bandpass',2400,1.1,0.10,0,1300);noise(0.3,'lowpass',800,0.7,0.05,0.04);}
    else if(kind==='dragon'){noise(0.05,'bandpass',2800,2,0.08);tone(380,0.1,'sine',0.05,0.02,700);}
    else{noise(0.045,'bandpass',3000,1.6,0.11);noise(0.2,'lowpass',650,0.7,0.07,0.02);}
  },
  pom(v){if(!thr('pom',0.05))return;tone(R(230,290),0.12,'sine',0.11*clamp(v,0.2,1),0,105);},
  boing(){if(!thr('boing',0.18))return;tone(260,0.18,'sine',0.08,0,640);tone(640,0.22,'sine',0.05,0.13,300);},
  coil(){if(!thr('coil',0.06))return;tone(R(500,640),0.09,'triangle',0.05,0,900);},
  voice(kind,mood){
    if(!thr('voice',0.35))return;
    const base=kind==='dino'?330:kind==='lion'?440:600;
    if(mood==='giggle'){for(let i=0;i<3;i++)tone(base*R(1.3,1.6),0.07,'triangle',0.06,i*0.09,base*1.2);}
    else if(mood==='wow'){tone(base,0.16,'triangle',0.07,0,base*1.9);}
    else if(mood==='cheer'){tone(base,0.12,'triangle',0.08,0,base*1.6);tone(base*1.6,0.22,'triangle',0.07,0.12,base*2.1);}
    else{tone(base*1.1,0.12,'triangle',0.07,0,base*1.7);tone(base*1.6,0.18,'triangle',0.06,0.11,base*1.3);}
  },
  pet(level){if(!thr('pet',0.14))return;const f=440*(1+level*0.6);tone(f,0.35,'sine',0.05);tone(f*1.25,0.35,'sine',0.035,0.05);tone(f*1.5,0.4,'sine',0.025,0.1);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>{tone(f,i===3?0.6:0.12,'triangle',0.09,i*0.11);tone(f/2,i===3?0.6:0.12,'square',0.025,i*0.11);});noise(0.6,'highpass',5000,0.5,0.02,0.33);},
  sparkle(){if(!thr('spk',0.15))return;tone(1175,0.16,'triangle',0.035);tone(1568,0.2,'triangle',0.03,0.07);},
  tock(){if(!thr('tock',0.08))return;tone(420,0.06,'triangle',0.08,0,300);tone(820,0.03,'sine',0.03);},
  whoosh(d){noise(d||0.8,'bandpass',300,0.9,0.12,0,1800,0.4);},
  thump(){if(!thr('thump',0.12))return;tone(105,0.16,'sine',0.16,0,48);},
  step(){if(!thr('step',0.12))return;tone(190,0.05,'triangle',0.04,0,130);},
  hop(){if(!thr('hop',0.15))return;tone(420,0.12,'sine',0.06,0,820);},
  pop(){tone(520,0.08,'sine',0.09,0,260);noise(0.05,'bandpass',1500,1,0.05);},
  drum(){for(let i=0;i<10;i++)noise(0.05,'bandpass',900,1,0.04+i*0.004,i*0.06);},
  click(){tone(300,0.04,'square',0.03,0,200);}
};
// 行進曲
const BPM=116;
const MEL=[67,0,72,0,76,0,79,0, 81,0,79,77,76,0,72,0, 74,0,77,0,71,0,74,0, 72,76,79,76,72,0,0,0];
const ROOT=[48,53,55,48];
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicStart(){AU.music=true;if(AU.ctx){AU.step=0;AU.next=AU.ctx.currentTime+0.08;AU.mStart=AU.next;}G.musicT0=G.time;}
function musicStop(){AU.music=false;}
function musicTick(){
  if(!AU.music||!aOK())return;const spb=60/BPM/2;
  if(AU.next<AU.ctx.currentTime-0.5){AU.next=AU.ctx.currentTime+0.05;}
  while(AU.next<AU.ctx.currentTime+0.15){
    const i=AU.step,t=AU.next,pos=i%8,bar=((i/8)|0)%4,root=ROOT[bar];
    if(pos%2===0){tone(mf(root+(pos%4?7:0)-12),0.18,'triangle',0.11,0,null,0.005,t);}
    if(pos===0||pos===4){tone(140,0.14,'sine',0.16,0,45,0.003,t);}
    if(pos===2||pos===6){noise(0.09,'bandpass',1700,0.8,0.06,0,null,0.002,t);}
    if(pos%2===1){noise(0.03,'bandpass',5200,1.5,0.018,0,null,0.002,t);}
    const n=MEL[i%32];if(n){tone(mf(n),0.16,'square',0.025,0,null,0.006,t);tone(mf(n+12),0.22,'sine',0.03,0,null,0.003,t);}
    AU.next+=spb;AU.step++;
  }
}
function beatNow(){if(aOK()&&AU.music)return Math.max(0,(AU.ctx.currentTime-AU.mStart)/(60/BPM));return (G.time-(G.musicT0||0))/(60/BPM);}

// =====================================================================
//  レイアウト
// =====================================================================
let W=1,H=1,DPR=1,L={S:1};
const bgC=document.createElement('canvas'),bgG=bgC.getContext('2d');
const stC=document.createElement('canvas'),stG=stC.getContext('2d');
const foldC=document.createElement('canvas'),foldG=foldC.getContext('2d');
function layout(){
  W=Math.max(200,Math.round(window.innerWidth));H=Math.max(200,Math.round(window.innerHeight));
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const port=H>W*1.08;const S=clamp(Math.min(W/370,H/640),0.5,1.7);
  L={port,S};
  if(port){
    L.seat={x:W*0.5,y:H*0.46};
    L.mirror={x:W*0.745,y:H*0.15,rx:W*0.215,ry:H*0.112};
    L.curtain={x:W*0.035,y:H*0.045,w:W*0.42,h:H*0.235};
    L.bench={x:W*0.02,y:H*0.875,w:W*0.42};L.benchS=S*0.34;
    L.tray={x:W*0.81,y:H*0.875};
    L.floorY=H*0.6;L.plant={x:W*0.93,y:H*0.6};
  }else{
    L.seat={x:W*0.5,y:H*0.435};
    const mrx=Math.min(W*0.12,140*S),mry=H*0.25;
    L.mirror={x:Math.min(W-mrx-24,Math.max(W*0.83,W*0.5+230*S+mrx*0.6)),y:H*0.32,rx:mrx,ry:mry};
    L.curtain={x:W*0.04,y:H*0.06,w:Math.min(W*0.25,W*0.5-240*S),h:H*0.5};
    L.bench={x:W*0.03,y:H*0.885,w:W*0.27};L.benchS=S*0.42;
    L.tray={x:W*0.81,y:H*0.87};
    L.floorY=H*0.62;L.plant={x:W*0.965,y:H*0.62};
  }
  L.curtain.w=Math.max(L.curtain.w,90);
  L.lamp={x:W*0.5,y:0,len:Math.min(H*0.05,40)};
  L.cs=L.curtain.h/470;
  L.clipRest={x:L.tray.x-14*S,y:L.tray.y-46*S};
  // ステージ
  L.yb=H*(port?0.34:0.31);L.yf=H*0.965;
  L.wb=W*(port?0.13:0.08);L.wf=W*(port?0.48:0.3);
  L.sb=S*(port?0.36:0.42);L.sf=S*(port?0.7:0.78);
  L.slotP=port?0.46:0.52;L.slotDX=port?W*0.27:Math.min(W*0.27,200*S);
  L.backDX=port?W*0.2:W*0.09;
  L.cc={s:S*(port?0.34:0.42)};L.cc.x=W*0.915-118*L.cc.s-6;L.cc.y=H-14-318*L.cc.s;
  bgC.width=Math.round(W*DPR);bgC.height=Math.round(H*DPR);bgG.setTransform(DPR,0,0,DPR,0,0);drawSalonBG(bgG);
  stC.width=Math.round(W*DPR);stC.height=Math.round(H*DPR);stG.setTransform(DPR,0,0,DPR,0,0);drawStageStatic(stG);
  PH.length=0;
}

// =====================================================================
//  背景（美容室）
// =====================================================================
function drawSalonBG(g){
  const fy=L.floorY,S=L.S;
  g.fillStyle='#fde3a0';g.fillRect(0,0,W,fy);
  // 縦ストライプ壁紙
  const sw=Math.max(34,W/12);
  for(let x=0;x<W+sw;x+=sw*2){g.fillStyle='rgba(255,140,120,0.18)';g.fillRect(x,0,sw*0.55,fy);}
  // 大小の網点グラデーション
  const sp=Math.max(13,Math.min(W,H)/30);
  g.fillStyle='rgba(255,107,94,0.33)';
  for(let y=sp/2,row=0;y<fy;y+=sp,row++){const k=1-y/fy;const r=sp*(0.07+0.3*k*k);
    if(r<0.6)continue;g.beginPath();for(let x=(row%2)*sp/2;x<W+sp;x+=sp){g.moveTo(x+r,y);g.arc(x,y,r,0,TAU);}g.fill();}
  // 腰壁
  const wy=fy-Math.min(H*0.1,80*S);
  g.fillStyle='#2ec4b6';g.fillRect(0,wy,W,fy-wy);
  g.save();g.beginPath();g.rect(0,wy,W,fy-wy);g.clip();g.fillStyle=pat(g,'dk');g.fillRect(0,wy,W,fy-wy);g.restore();
  g.strokeStyle=INK;g.lineWidth=4;
  const pw=Math.max(60,W/8);
  for(let x=pw*0.15;x<W;x+=pw){const p=rrP(x,wy+10,pw*0.7,fy-wy-20,8);g.fillStyle='rgba(255,255,255,0.18)';g.fill(p);g.lineWidth=2.5;g.stroke(p);}
  g.lineWidth=5;g.beginPath();g.moveTo(0,wy);g.lineTo(W,wy);g.stroke();
  g.fillStyle='#ffd23f';g.fillRect(0,wy-7,W,7);g.lineWidth=3;g.strokeRect(-5,wy-7,W+10,7);
  // 床：遠近チェック
  g.fillStyle='#fff3cf';g.fillRect(0,fy,W,H-fy);
  const vx=W/2,vy=fy-H*0.9,rows=9,cols=14;
  const ys=[];for(let i=0;i<=rows;i++)ys.push(fy+(H-fy)*Math.pow(i/rows,1.35));
  const xAt=(c,y)=>{const x0=(c/cols)*W*2.2-W*0.6;return vx+(x0-vx)*((y-vy)/(H-vy));};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if((r+c)%2)continue;
    g.beginPath();g.moveTo(xAt(c,ys[r]),ys[r]);g.lineTo(xAt(c+1,ys[r]),ys[r]);g.lineTo(xAt(c+1,ys[r+1]),ys[r+1]);g.lineTo(xAt(c,ys[r+1]),ys[r+1]);g.closePath();
    g.fillStyle='#c4b0ff';g.fill();}
  g.save();g.beginPath();g.rect(0,fy,W,H-fy);g.clip();g.fillStyle=pat(g,'dk');g.globalAlpha=0.6;g.fillRect(0,fy,W,H-fy);g.restore();
  g.strokeStyle='rgba(36,26,61,0.35)';g.lineWidth=1.5;
  for(let r=0;r<=rows;r++){g.beginPath();g.moveTo(0,ys[r]);g.lineTo(W,ys[r]);g.stroke();}
  g.strokeStyle=INK;g.lineWidth=5;g.beginPath();g.moveTo(0,fy);g.lineTo(W,fy);g.stroke();
  // 額縁（星の絵・くしの絵）
  const fr=(x,y,w,h,kind)=>{
    const p=rrP(x,y,w,h,6);inkFill(g,p,'#fff8e4',4,null,true);
    g.save();g.clip(p);g.fillStyle=kind?'#b9a0ff':'#3a5fd9';g.fillRect(x+6,y+6,w-12,h-12);g.fillStyle=pat(g,'lt');g.fillRect(x,y,w,h);g.restore();
    g.beginPath();if(kind){g.ellipse(x+w/2,y+h*0.52,w*0.28,h*0.22,0,0,TAU);}else starPath(g,x+w/2,y+h/2,Math.min(w,h)*0.32,-PI/2);
    g.fillStyle=kind?'#ff8fc7':'#ffd23f';g.fill();g.lineWidth=3;g.strokeStyle=INK;g.stroke();
    g.lineWidth=4;g.strokeRect(x+6,y+6,w-12,h-12);
  };
  if(!L.port){fr(W*0.31,H*0.12,52*S,64*S,0);fr(W*0.66,H*0.1,48*S,58*S,1);}
  // 紙の質感（そばかす状のノイズ）
  for(let i=0;i<W*H/900;i++){g.fillStyle=Math.random()<0.5?'rgba(120,80,40,0.07)':'rgba(255,255,255,0.12)';g.fillRect(Math.random()*W,Math.random()*H,R(1,2.4),R(1,2.4));}
}

// ステージ（静的部分）
function drawStageStatic(g){
  const gr=g.createRadialGradient(W/2,H*0.25,10,W/2,H*0.35,Math.max(W,H)*0.8);
  gr.addColorStop(0,'#5b74ff');gr.addColorStop(0.5,'#3a3fbf');gr.addColorStop(1,'#231a66');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // 放射ストライプ
  g.save();g.translate(W/2,L.yb);for(let i=0;i<24;i++){g.rotate(TAU/24);g.beginPath();g.moveTo(0,0);g.lineTo(Math.max(W,H)*1.2,-60);g.lineTo(Math.max(W,H)*1.2,60);g.closePath();g.fillStyle=i%2?'rgba(255,255,255,0.06)':'rgba(255,120,200,0.07)';g.fill();}g.restore();
  // 床

// 房の点列（root→tip）
function tuftPts(m,t,rest,ox,oy){
  let Ln=rest?t.max:t.len*t.str;
  if(!rest&&t.layer==='back'&&m.p.mane>0)Ln*=1+m.p.mane*0.4;
  if(Ln<1)return 0;
  const st=10,n=Math.min(44,Math.ceil(Ln/st));
  let a=t.a,x=t.rx,y=t.ry,off=0;
  if(!rest){
    off=Math.sin(G.time*t.f*m.p.swayF+t.ph)*m.p.sway*t.swayK+t.push;
    if(m.p.part>0&&t.zone==='bangs'){const ex=m.def.eyes[m.p.partSide][0];const d=t.rx-ex;if(Math.abs(d)<46)off+=-(d<0?1:-1)*m.p.part*0.75*(1-Math.abs(d)/46);}
    if(t.layer==='back'&&m.p.mane>0){a+=Math.sin(t.ph)*0.15*m.p.mane;}
  }
  ox[0]=x;oy[0]=y;
  for(let i=1;i<=n;i++){
    const sl=i<n?st:Ln-(n-1)*st;
    a+=t.curve*sl/10*2;
    let d=PI/2-a;d=Math.atan2(Math.sin(d),Math.cos(d));a+=d*t.grav*sl/10;
    const aa=a+off*Math.min(1,(i*st)/50);
    x+=Math.cos(aa)*sl;y+=Math.sin(aa)*sl;ox[i]=x;oy[i]=y;
  }
  return n+1;
}
const CUT_R=27,INKW=5,GS=8,GN=50;
const TX=new Float32Array(64),TY=new Float32Array(64);

  const c0=Math.max(0,Math.floor((x-r+200)/GS)),c1=Math.min(GN-1,Math.floor((x+r+200)/GS));
  const r0=Math.max(0,Math.floor((y-r+200)/GS)),r1=Math.min(GN-1,Math.floor((y+r+200)/GS));
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
    const px=cx*GS-200+GS/2,py=cy*GS-200+GS/2;const d=Math.hypot(px-x,py-y);if(d>r)continue;
    const c=cy*GN+cx;let a=m.cells[c];if(!a)a=m.cells[c]=[];
    let k=0;for(;k<a.length;k+=3)if(a[k]===ti)break;
    if(k>=a.length){a.push(ti,u,Infinity);}else if(u<a[k+1])a[k+1]=u;
    if(d<=r*0.6+2&&u<a[k+2])a[k+2]=u;
  }
}
function buildGrid(m){
  m.cells=new Array(GN*GN).fill(null);m.cut=new Uint8Array(GN*GN);
  m.tufts.forEach((t,ti)=>{
    const n=tuftPts(m,t,true,TX,TY);let u=0;
    for(let i=0;i<n-1;i++){const x0=TX[i],y0=TY[i],x1=TX[i+1],y1=TY[i+1];const l=Math.hypot(x1-x0,y1-y0)||0.001;
      for(let s=0;s<l;s+=4){const q=s/l;markCell(m,ti,x0+(x1-x0)*q,y0+(y1-y0)*q,u+s,covR(t,u+s));}u+=l;}
    markCell(m,ti,TX[n-1],TY[n-1],u,covR(t,u));
  });
  m.hairCells=[];m.frontCells=[];
  for(let c=0;c<GN*GN;c++)if(covered(m,c)){m.hairCells.push(c);}
  m.covInit=Math.max(1,m.hairCells.length);
  m.eyeCells=m.def.eyes.map(([ex,ey])=>{const l=[];const r=m.def.eyeR*0.95;
    for(let cy=0;cy<GN;cy++)for(let cx=0;cx<GN;cx++){const px=cx*GS-200+GS/2,py=cy*GS-200+GS/2;if(Math.hypot(px-ex,py-ey)<=r)l.push(cy*GN+cx);}return l;});
}

function hairAt(m,x,y,rad){rad=rad||10;for(const [dx,dy] of [[0,0],[rad,0],[-rad,0],[0,rad],[0,-rad]]){const c=cellOf(x+dx,y+dy);if(c>=0&&covered(m,c))return true;}return false;}
function evalHair(m){

  m.eyeClear=m.eyeCells.map(l=>{let u=0;for(const c of l)if(!covered(m,c))u++;return u/Math.max(1,l.length);});
  const prevReady=m.ready;
  let sw=0;for(const c of m.hairCells)if(m.cut[c])sw++;m.swept=sw/m.covInit;
  m.ready=m.eyeClear[0]>=0.6&&m.eyeClear[1]>=0.6&&m.swept>=m.def.need;
  for(let e=0;e<2;e++){const lv=m.eyeClear[e]>0.6?2:m.eyeClear[e]>0.3?1:0;if(lv>m.eyeLv[e]){m.eyeLv[e]=lv;m.rt.blink2=0.5;m.rt.wide=0.8;m.rt.sparkle=0.8;SFX.voice(m.kind,'wow');}}
  return prevReady!==m.ready;

// 座標変換（頭ローカル ⇔ 画面）
function sxOf(m,flip){const c=Math.cos(m.p.spin*TAU);return (flip||1)*m.s*(c<0?-1:1)*Math.max(0.04,Math.abs(c));}
function toLocal(m,x,y){
  const p=m.p,sx=sxOf(m);let lx=(x-m.X)/sx,ly=(y-m.Y)/m.s-m.oy;
  ly-=80+p.lean*14;const c=Math.cos(-p.tilt),s=Math.sin(-p.tilt);let rx=lx*c-ly*s,ry=lx*s+ly*c;

//  毛の描画（オフスクリーン合成：太線インク層＋彩色層、刈り取りマスク）

function ensureHC(m){
  const k=clamp(Math.round(m.s*DPR*1.05*10)/10,0.35,1.5);
  if(!m.hc.k||k>m.hc.k+0.05||k<m.hc.k*0.55){
    const sz=Math.ceil(400*k);
    for(const layer of(m.hasBack?['front','back']:['front'])){
      const o=m.hc[layer]||(m.hc[layer]={});
      for(const nm of['ink','col']){if(!o[nm]){o[nm]=document.createElement('canvas');o[nm+'G']=o[nm].getContext('2d');}o[nm].width=sz;o[nm].height=sz;o[nm+'G']._pt=null;o[nm+'G']._gr=null;}
    }

function fluffR(t,i){return t.w*(1-0.32*Math.min(1,i*10*t.str/t.max))*(0.74+0.34*Math.abs(Math.sin(i*1.25+t.ph)));}
function ribbon(g,t,e){
  const n=t.n;if(n<2)return;const cut=t.len<t.max-0.5;
  const Lx=[],Ly=[],Rx=[],Ry=[];
  for(let i=0;i<n;i++){
    const a=Math.max(0,i-1),b=Math.min(n-1,i+1);let tx=t.cx[b]-t.cx[a],ty=t.cy[b]-t.cy[a];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const q=Math.min(1,i*10*t.str/t.max);let hw=t.w*0.5*(1-0.8*Math.pow(q,1.5));if(i===n-1&&!cut)hw=0.6;hw+=e;
    Lx.push(t.cx[i]-ty*hw);Ly.push(t.cy[i]+tx*hw);Rx.push(t.cx[i]+ty*hw);Ry.push(t.cy[i]-tx*hw);
  }

}
function offLine(g,t,k,i0,i1){

    const q=Math.min(1,i*10*t.str/t.max);const hw=t.w*0.5*(1-0.8*Math.pow(q,1.5))*k;const x=t.cx[i]-ty/l*hw,y=t.cy[i]+tx/l*hw;

}
const CX=new Float32Array(1200),CY=new Float32Array(1200);
function coilPts(t){
  const n=t.n;if(n<2)return 0;const A=t.w*0.42;let cnt=0,u=0;
  for(let i=0;i<n-1;i++){
    const x0=t.cx[i],y0=t.cy[i],x1=t.cx[i+1],y1=t.cy[i+1];const l=Math.hypot(x1-x0,y1-y0)||0.001;const tx=(x1-x0)/l,ty=(y1-y0)/l;
    for(let s=0;s<l&&cnt<1190;s+=2.6){const uu=u+s;const ph=uu/t.str*0.34+t.ph;const amp=A*(0.55+0.45*Math.min(1,uu/18));

function silhouette(g,t,e){

function colTuft(g,m,t){

function maskStroke(m,ax,ay,bx,by){
  const len=Math.hypot(bx-ax,by-ay);
  for(const [g,red] of [[m.gO,0],[m.gI,INKW]]){g.strokeStyle='#000';g.fillStyle='#000';g.lineCap='round';g.lineWidth=(CUT_R-red)*2;
    g.beginPath();g.moveTo(ax+200,ay+200);g.lineTo(bx+200+0.01,by+200+0.01);g.stroke();}
  const steps=Math.max(1,Math.ceil(len/10));
  for(let i=0;i<=steps;i++){const q=i/steps,x=ax+(bx-ax)*q+200,y=ay+(by-ay)*q+200;
    for(let j=0;j<2;j++){const a=Math.random()*TAU,cx=x+Math.cos(a)*CUT_R*0.86,cy=y+Math.sin(a)*CUT_R*0.86,r=CUT_R*R(0.26,0.36);
      m.gO.beginPath();m.gO.arc(cx,cy,r,0,TAU);m.gO.fill();if(r-INKW>0.5){m.gI.beginPath();m.gI.arc(cx,cy,r-INKW,0,TAU);m.gI.fill();}}}
}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=clamp(t,0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t);}
function stamp(m,ax,ay,bx,by,mvx,mvy){
  maskStroke(m,ax,ay,bx,by);
  const r=CUT_R+1;
  const c0=Math.max(0,Math.floor((Math.min(ax,bx)-r+200)/GS)),c1=Math.min(GN-1,Math.floor((Math.max(ax,bx)+r+200)/GS));
  const r0=Math.max(0,Math.floor((Math.min(ay,by)-r+200)/GS)),r1=Math.min(GN-1,Math.floor((Math.max(ay,by)+r+200)/GS));
  let removed=0,sx=0,sy=0;const tr={};
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
    const px=cx*GS-200+GS/2,py=cy*GS-200+GS/2;if(distSeg(px,py,ax,ay,bx,by)>r)continue;
    const c=cy*GN+cx;if(!m.cut[c]){if(covered(m,c)){removed++;sx+=px;sy+=py;}m.cut[c]=1;}
    const a=m.cells[c];if(a)for(let k=0;k<a.length;k+=3){const ti=a[k],cu=a[k+2];if(cu<m.tufts[ti].len&&(tr[ti]===undefined||cu<tr[ti]))tr[ti]=cu;}
  }
  let tc=0;
  for(const key in tr){const t=m.tufts[key],u=Math.max(tr[key],Math.min(16,t.max*0.3));if(u<t.len-1){spawnPiece(m,t,u,t.len,mvx,mvy);t.len=u;tc++;removed+=2;}}
  if(removed>0&&tc===0){const n=Math.min(2,Math.ceil(removed/5));const lx=sx/Math.max(1,removed),ly=sy/Math.max(1,removed);
    for(let i=0;i<n;i++)spawnBit(m,lx||bx,ly||by,m.def.hair[i%2],mvx,mvy,null);}
  return {removed,tc};
}
function tuftPointAt(m,t,u){
  if(!t.n){t.n=tuftPts(m,t,false,t.cx,t.cy);}const fi=clamp(u/(10*t.str),0,Math.max(0,t.n-1));const i=Math.floor(fi),f=fi-i,j=Math.min(t.n-1,i+1);
  return {x:t.cx[i]+(t.cx[j]-t.cx[i])*f,y:t.cy[i]+(t.cy[j]-t.cy[i])*f};
}
function spawnPiece(m,t,u0,u1,mvx,mvy){
  const d=m.def;
  if(t.style==='silky'&&u1-u0>14){
    const pts=[];for(let u=u0;u<=u1+0.1;u+=Math.max(8,(u1-u0)/8)){const lp=tuftPointAt(m,t,u);const sp=toScreen(m,lp.x,lp.y);pts.push(sp.x,sp.y);}
    if(pts.length<4)return;let cx=0,cy=0;for(let i=0;i<pts.length;i+=2){cx+=pts[i];cy+=pts[i+1];}cx/=pts.length/2;cy/=pts.length/2;
    for(let i=0;i<pts.length;i+=2){pts[i]-=cx;pts[i+1]-=cy;}
    const q=Math.min(1,u0/t.max);
    addHair({k:'rib',x:cx,y:cy,vx:-mvx*0.25+R(-40,40),vy:R(-90,-30),pts,w:t.w*0.5*(1-0.8*Math.pow(q,1.5))*m.s,col:d.hair[t.col],hi:d.hairHi,dk:d.hairDk,rot:0,ph:Math.random()*TAU,s:1});
  }else if(t.style==='curly'){
    const c=Math.min(3,Math.max(1,Math.round((u1-u0)/34)));
    for(let i=0;i<c;i++){const lp=tuftPointAt(m,t,lerp(u0,u1,(i+0.5)/c));spawnBit(m,lp.x,lp.y,d.hair[t.col],mvx,mvy,'coil');}
    SFX.coil();
  }else{
    const c=Math.min(3,Math.max(1,Math.round((u1-u0)/26)));
    for(let i=0;i<c;i++){const lp=tuftPointAt(m,t,lerp(u0,u1,(i+0.5)/c));spawnBit(m,lp.x,lp.y,d.hair[t.col],mvx,mvy,null,fluffR(t,0)*0.8);}
  }
}
function spawnBit(m,lx,ly,col,mvx,mvy,kind,size){
  const sp=toScreen(m,lx,ly);const ml=Math.hypot(mvx||0,mvy||0)||1;const bx=-(mvx||0)/ml,by=-(mvy||0)/ml;
  const sp0=R(60,150);
  addHair({k:kind||'puff',x:sp.x,y:sp.y,vx:bx*sp0+R(-90,90),vy:by*sp0*0.6-R(150,280),r:(size||R(9,13))*m.s*R(0.8,1.1),col,hi:m.def.hairHi,dk:m.def.hairDk,rot:Math.random()*TAU,vr:R(-6,6),s:1});
}
function cutAt(m,ax,ay,bx,by){
  const mvx=bx-ax,mvy=by-ay;
  pushTufts(m,bx,by,mvx,mvy,1.2,52);
  if(m.kind==='dragon'){
    for(const t of m.tufts){if(!t.n||t.len<4||t.bcd>G.time)continue;const mx=t.cx[Math.min(t.n-1,(t.n/2)|0)],my=t.cy[Math.min(t.n-1,(t.n/2)|0)];
      if(Math.hypot(mx-bx,my-by)<46){t.sv+=7;t.bcd=G.time+0.45;SFX.boing();}}
    m.pend.push({ax,ay,bx,by,t:0.12,mvx,mvy});
  }else doStamp(m,ax,ay,bx,by,mvx,mvy);
}
function doStamp(m,ax,ay,bx,by,mvx,mvy){
  const r=stamp(m,ax,ay,bx,by,mvx,mvy);
  if(r.removed>0){
    CL.contact=0.18;SFX.snip(m.kind);m.dirty=true;
    react(m,regionOf(m,bx,by));
  }
  return r;
}
function pushTufts(m,lx,ly,vx,vy,str,rad){
  const vl=Math.hypot(vx,vy);
  for(const t of m.tufts){if(!t.n)continue;const i=Math.min(t.n-1,(t.n*0.6)|0);const dx=t.cx[i]-lx,dy=t.cy[i]-ly;const d=Math.hypot(dx,dy);if(d>rad)continue;
    const a=Math.min(t.n-1,i+1),b=Math.max(0,i-1);const tx=t.cx[a]-t.cx[b],ty=t.cy[a]-t.cy[b];
    let sgn;if(vl>0.5)sgn=Math.sign(tx*vy-ty*vx)||1;else sgn=Math.sign(tx*dy-ty*dx)||1;
    t.pv+=sgn*str*(1-d/rad)*(vl>0.5?Math.min(2,0.4+vl/20):1);}
}
function regionOf(m,x,y){
  for(const e of m.def.ears)if(Math.hypot(x-e[0],y-e[1])<42)return 'ear';
  if(y<-58)return 'top';if(Math.abs(x)>56&&y>-20)return 'cheek';return 'bangs';
}
function react(m,reg){
  if(reg!=='bangs'){m.rt.tickle=Math.max(m.rt.tickle||0,0.22);}
  if((m.rcd[reg]||0)>0)return;m.rcd[reg]=0.5;
  if(reg==='bangs'){m.rt.wide=0.5;m.rt.brow=0.5;}
  else if(reg==='cheek'){m.rt.puff=0.65;m.rt.laughD=0.65;SFX.voice(m.kind,'hm');}
  else if(reg==='top'){m.rt.squish=0.5;m.rt.tickle=0.5;SFX.voice(m.kind,'giggle');}
  else if(reg==='ear'){m.rt.twitch=0.55;m.rt.surprise=0.45;SFX.voice(m.kind,'wow');}
}

const PH=[],FX=[];
function addHair(o){o.age=0;o.rest=false;o.roll=false;o.b=0;o.wob=0;
  o.landY=Math.min(H-8,L.seat.y+R(262,338)*L.S);
  let fl=0;for(const p of PH)if(!p.rest)fl++;if(fl>60)return;
  PH.push(o);let rc=0;for(const p of PH)if(p.rest)rc++;
  if(rc>85){const i=PH.findIndex(p=>p.rest&&!p.fade);if(i>=0)PH[i].fade=1;}
}
function updHair(dt){
  for(let i=PH.length-1;i>=0;i--){const p=PH[i];p.age+=dt;
    if(p.fade!==undefined){p.fade-=dt*2;if(p.fade<=0){PH.splice(i,1);continue;}}
    if(p.rest){p.wob*=Math.max(0,1-dt*3);continue;}
    if(p.k==='rib'){p.vy+=240*dt;p.vy*=1-1.6*dt;p.vx+=Math.sin(G.time*3+p.ph)*90*dt;p.vx*=1-1.2*dt;p.rot=Math.sin(G.time*2.4+p.ph)*0.5;}
    else{p.vy+=950*dt;p.vx*=1-0.3*dt;if(!p.roll)p.rot+=p.vr*dt;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<8){p.x=8;p.vx=Math.abs(p.vx)*0.5;}if(p.x>W-8){p.x=W-8;p.vx=-Math.abs(p.vx)*0.5;}
    if(p.y>=p.landY){p.y=p.landY;
      if(p.k==='rib'){p.rest=true;p.rot=R(-0.25,0.25);}
      else if(p.vy>120&&p.b<3){p.vy*=-(p.k==='coil'?0.62:0.4);p.vx*=0.75;p.b++;if(p.b===1)SFX.pom(p.vy/-200);if(p.k==='coil')p.wob=1;}
      else{p.vy=0;p.roll=true;}
    }
    if(p.roll){p.vx*=Math.max(0,1-3.2*dt);p.rot+=p.vx*dt/Math.max(4,p.r);if(Math.abs(p.vx)<6){p.rest=true;}}
    if(p.age>9)p.rest=true;
  }
}
function drawHairBits(g){

function drawHead(g,m){

function drawFace(g,m){

  for(const [x,y] of d.cheeks){const r=13+f.puff*8+f.smile*2;g.save();const c=ellP(x,y,r*1.2,r*0.85);g.fillStyle='rgba(255,120,150,0.55)';g.fill(c);g.clip(c);g.fillStyle=pat(g,'pk');g.fillRect(x-30,y-30,60,60);g.restore();}

function drawEye(g,m,e){
  const d=m.def,f=m.f;const [ex,ey]=d.eyes[e];const r=d.eyeR*(1+f.wide*0.16);const side=e?1:-1;
  const closed=Math.max(f.happy,e===0?f.wink:0);
  g.save();g.translate(ex,ey);
  g.lineCap='round';g.lineJoin='round';g.strokeStyle=INK;
  // まゆ
  const by=-r*1.32-f.brow*7-(m.kind==='dragon'?0:0);g.beginPath();
  if(m.kind==='dragon'&&f.wide<0.5){g.moveTo(-side*r*0.7,by+3);g.quadraticCurveTo(0,by-6,side*r*0.8,by-2);}else{g.moveTo(-r*0.65,by+2);g.quadraticCurveTo(0,by-7,r*0.65,by+2);}
  g.lineWidth=5;g.stroke();
  if(f.tickle>0.5&&closed<0.55){
    g.beginPath();const k=r*0.62;if(e===0){g.moveTo(-k,-k);g.lineTo(k*0.7,0);g.lineTo(-k,k);}else{g.moveTo(k,-k);g.lineTo(-k*0.7,0);g.lineTo(k,k);}g.lineWidth=7;g.stroke();
  }else if(closed>0.55){
    g.beginPath();g.arc(0,r*0.35,r*0.72,PI*1.12,PI*1.88);g.lineWidth=7;g.stroke();
    g.beginPath();g.moveTo(side*r*0.66,-r*0.08);g.lineTo(side*r*0.95,-r*0.3);g.lineWidth=4;g.stroke();
  }else{
    const open=clamp(f.open,0.06,1);g.scale(1,open);
    const sc=ellP(0,0,r*0.98,r*1.1);g.fillStyle='#fff';g.fill(sc);
    g.save();g.clip(sc);
    const lx=f.lookX*r*0.32,ly=f.lookY*r*0.3;
    g.beginPath();g.arc(lx,ly+r*0.05,r*0.7,0,TAU);g.fillStyle=d.iris;g.fill();
    g.beginPath();g.arc(lx,ly+r*0.08,r*0.5,0,TAU);g.fillStyle=COLS.navy;g.fill();
    g.beginPath();g.arc(lx-r*0.24,ly-r*0.24,r*0.27,0,TAU);g.fillStyle='#fff';g.fill();
    g.beginPath();g.arc(lx+r*0.22,ly+r*0.28,r*0.12,0,TAU);g.fill();
    if(f.surprise<0.5&&m.rt.sparkle>0){g.beginPath();starPath(g,lx+r*0.25,ly-r*0.3,r*0.25,0,4,0.3);g.fill();}
    if(d.lid&&f.wide<0.5){g.fillStyle=d.body;g.fillRect(-r*1.2,-r*1.2,r*2.4,r*(0.2+d.lid*2.2)*0.5+r*0.0);g.beginPath();g.moveTo(-r,-r*1.2+r*(0.2+d.lid*2.2)*0.5);g.lineTo(r,-r*1.2+r*(0.2+d.lid*2.2)*0.5-side*3);g.lineWidth=4;g.stroke();}
    g.restore();
    g.lineWidth=5;g.stroke(sc);
    g.beginPath();g.moveTo(side*r*0.72,-r*0.75);g.lineTo(side*r*1.08,-r*1.05);g.moveTo(side*r*0.9,-r*0.45);g.lineTo(side*r*1.25,-r*0.6);g.lineWidth=4;g.stroke();
  }

    g.beginPath();g.moveTo(-24,-6);g.lineTo(-20,1);g.moveTo(24,-6);g.lineTo(20,1);g.lineWidth=3.5;g.stroke();}

}

function drawBench(g){

const G={time:0,frame:0,mode:'salon',phase:'cut',idx:0,pt:0,idle:0,mons:[],wig:{plant:0,lamp:0,tray:0,chair:0,drape:0},curtPart:0,curtWob:0,mirSpark:0,

function walkTo(m,from,to,dur,style,o){o=o||{};m.walk={from,to,t:0,dur,style:style||'walk',endHop:o.endHop||0,arc:o.arc||0,behindAt:o.behindAt,frontUntil:o.frontUntil,done:o.done};m.loc='walk';m.behind=false;}
function updWalk(m,dt){
  const w=m.walk;if(!w)return;if(!m.act)w.t+=dt;const q=clamp(w.t/w.dur,0,1);const a=w.from(),b=w.to();
  const e=w.style==='hop'?easeIO(q):(q<0.1?q*q*5:q>0.9?1-(1-q)*(1-q)*5:q-0.05)/(0.9);
  m.X=lerp(a.x,b.x,clamp(e,0,1));m.Y=lerp(a.y,b.y,clamp(e,0,1));m.s=lerp(a.s,b.s,clamp(e,0,1));
  if(w.arc)m.p.jump+=bump(q)*w.arc;
  if(w.endHop&&q>0.72)m.p.jump+=bump((q-0.72)/0.28)*w.endHop;
  m.behind=(w.behindAt!==undefined&&q>=w.behindAt)||(w.frontUntil!==undefined&&q<w.frontUntil);

function walkAnim(m,dt,style){
  const p=m.p;const rate=m.kind==='dino'?1.7:m.kind==='lion'?1.9:2.2;const prev=m.wph;m.wph+=dt*rate;
  const st=Math.sin(m.wph*TAU);const crossed=Math.floor(prev*2)!==Math.floor(m.wph*2);
  if(m.kind==='dino'){p.bob-=Math.abs(st)*12;p.sqy*=1-0.05*(1-Math.abs(st));p.legL=Math.max(0,st)*0.9;p.legR=Math.max(0,-st)*0.9;p.armL=0.3+st*0.4;p.armR=0.3-st*0.4;p.tilt+=st*0.05;if(crossed&&m.vis){SFX.thump();if(G.mode==='parade')G.shake=0.15;}}
  else if(m.kind==='lion'){p.bob-=Math.abs(st)*6;p.legL=Math.max(0,st)*0.7;p.legR=Math.max(0,-st)*0.7;p.tilt+=st*0.11;p.tailSpin=G.time*6%TAU;p.armL=0.2-st*0.2;p.armR=0.2+st*0.2;if(crossed&&m.vis)SFX.step();}
  else{p.jump+=Math.abs(st)*22;p.legL=p.legR=0.4*(1-Math.abs(st));p.wing=Math.sin(G.time*18)*0.4;p.armL=p.armR=0.6+Math.abs(st)*0.4;if(crossed&&m.vis&&Math.random()<0.5)SFX.hop();}

// 決めポーズ（種類×3バリエーション）
function poseApply(m,v,t){
  const p=m.p,f=m.ft,env=plateau(t,6);f.smile=1;
  if(m.kind==='dino'){
    if(v===0){p.jump+=bump(t*2.2)*40;p.legR=env;p.armL=2.3*env;p.armR=0.5*env;p.tilt+=0.15*env;f.wink=env;f.mouthO=0.45;}
    else if(v===1){const s=Math.sin(t*TAU*3);p.legL=Math.max(0,s)*env;p.legR=Math.max(0,-s)*env;p.bob-=Math.abs(s)*12*env;p.armL=p.armR=1.4*env;f.mouthO=0.85;f.wide=0.6;if(Math.abs(s)>0.98&&thr('st'+m.kind,0.2))SFX.thump();}
    else{p.spin=easeIO(t*1.4);p.jump+=bump(t)*55;p.armL=p.armR=2.6*env;f.happy=1;f.mouthO=0.7;}
  }else if(m.kind==='lion'){
    if(v===0){p.mane=Math.max(p.mane,env);p.armR=1.9*env;p.tilt-=0.18*env;p.tailSpin=t*TAU*3;f.happy=0.6;f.wink=env*0.7;}
    else if(v===1){p.tilt+=Math.sin(t*TAU*2)*0.25*env;p.mane=Math.max(p.mane,0.7*env);p.armL=0.4*env;p.armR=0.4*env;p.tailSpin=t*TAU*2;f.mouthO=0.6;f.happy=1;}
    else{p.jump+=bump(t)*65;p.armL=p.armR=1.8*env;p.mane=Math.max(p.mane,env);p.legL=p.legR=0.5*env;f.mouthO=0.9;f.happy=1;}
  }else{
    if(v===0){p.spin=easeIO(t*1.3);p.float+=30*env;p.wing=Math.sin(G.time*26)*0.55;p.armL=p.armR=1.2*env;f.mouthO=0.5;}
    else if(v===1){p.float+=70*env;p.wing=Math.sin(G.time*28)*0.6;p.armL=p.armR=2.4*env;f.happy=1;f.mouthO=0.6;}
    else{p.jump+=Math.abs(Math.sin(t*TAU*1.5))*48*env;p.spin=t*2;p.wing=Math.sin(G.time*22)*0.5;f.mouthO=0.7;f.wide=0.5;}
  }
}
function startAct(m,v,dur,type){m.act={v,t:0,dur:dur||1.5,type:type||'pose'};m.lastPose=v;SFX.voice(m.kind,'cheer');}

function update(dt){
  G.time+=dt;G.frame++;G.pt+=dt;G.idle+=dt;
  for(const k in G.wig)G.wig[k]=Math.max(0,G.wig[k]-dt*1.6);
  G.mirSpark=Math.max(0,G.mirSpark-dt);G.curtWob=Math.max(0,G.curtWob-dt*1.2);G.shake=Math.max(0,(G.shake||0)-dt);
  for(const m of G.mons){resetP(m);baseFT(m);}
  if(G.mode==='salon')updSalon(dt);
  else if(G.mode==='transform')updTransform(dt);
  else if(G.mode==='parade')updParade(dt);
  else if(G.mode==='closing')updClosing(dt);
  for(const m of G.mons)finishMon(m,dt);
  updClipper(dt);updHair(dt);updFX(dt);musicTick();
}
function finishMon(m,dt){
  const rt=m.rt,p=m.p,ft=m.ft;
  for(const k in rt)rt[k]=Math.max(0,rt[k]-dt);for(const k in m.rcd)m.rcd[k]=Math.max(0,m.rcd[k]-dt);
  // 保留中の刈り取り（ドラゴンの「びよん」後）
  for(let i=m.pend.length-1;i>=0;i--){const s=m.pend[i];s.t-=dt;if(s.t<=0){m.pend.splice(i,1);doStamp(m,s.ax,s.ay,s.bx,s.by,s.mvx,s.mvy);}}
  if(m.dirty&&G.time-m.lastEval>0.1){m.dirty=false;m.lastEval=G.time;evalHair(m);}
  if(m.act){m.act.t+=dt;const q=m.act.t/m.act.dur;if(q>=1)m.act=null;else{if(m.act.type==='pose')poseApply(m,m.act.v,q);}}
  m.nextBlink-=dt;if(m.nextBlink<=0){rt.blinkS=0.16;m.nextBlink=R(2.2,4.8);}
  if(rt.tickle>0){ft.tickle=1;ft.smile=1;ft.mouthO=Math.max(ft.mouthO,0.45);p.tilt+=Math.sin(G.time*38)*0.025;}
  if(rt.tickleSoft>0){ft.smile=1;}

      PT.lx=lp.x;PT.ly=lp.y;
      if(onHair||hairAt(m,lp.x,lp.y,CUT_R*0.7))cutAt(m,lp.x,lp.y,lp.x,lp.y);
      return;
    }
    if(ph==='cut'&&monHit(m,x,y,120)){m.rt.tickle=0.4;SFX.voice(m.kind,'giggle');return;}
  }
  const M=L.mirror;
  if(Math.pow((x-M.x)/(M.rx+16*L.S),2)+Math.pow((y-M.y)/(M.ry+16*L.S),2)<1){G.mirSpark=0.6;SFX.sparkle();starBurst(x,y,5,['#fff','#bdf3ff','#ffd23f'],140,0.8);if(m&&m.loc==='chair'){m.rt.lookMir=1.4;m.rt.wave=0.9;}return;}
  for(const k of G.mons){if(k.loc==='bench'&&monHit(k,x,y,140)){k.rt.wave=1.0;k.rt.hop=0.45;SFX.voice(k.kind,'hm');return;}}
  const c=L.curtain;if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h){G.curtWob=1;SFX.whoosh(0.35);const backs=G.mons.filter(k=>k.loc==='back');if(backs.length){const b=pick(backs);b.peek=1.8;G.peekT=R(6,9);}return;}
  const pl=L.plant;if(Math.abs(x-pl.x)<36*L.S&&y>pl.y-100*L.S&&y<pl.y+30*L.S){G.wig.plant=1;SFX.tock();return;}
  if(Math.abs(x-L.lamp.x)<34*L.S&&y<L.lamp.len+60*L.S){G.wig.lamp=1;SFX.tock();return;}
  const t=L.tray;if(Math.abs(x-t.x)<60*L.S&&y>t.y-20*L.S&&y<t.y+90*L.S){G.wig.tray=1;SFX.tock();return;}
  const s=L.seat;if(Math.abs(x-s.x)<120*L.S&&y>s.y+200*L.S&&y<s.y+320*L.S){G.wig.chair=1;SFX.tock();return;}
}
function moveSalon(x,y,dx,dy){
  const m=cur();
  if(PT.mode==='none'&&G.phase==='cut'&&m.loc==='chair'){const lp=toLocal(m,x,y);if(hairAt(m,lp.x,lp.y,10)){PT.mode='clip';CL.held=true;CL.demo=null;CL.x=x;CL.y=y;PT.lx=lp.x;PT.ly=lp.y;SFX.click();cutAt(m,lp.x,lp.y,lp.x,lp.y);return;}}
  if(PT.mode==='clip'){
    if(m.loc==='chair'&&(G.phase==='cut'||G.phase==='offer')){const lp=toLocal(m,x,y);
      const seg=Math.hypot(lp.x-PT.lx,lp.y-PT.ly);
      if(seg>0.5){
        if(hairAt(m,lp.x,lp.y,CUT_R)||hairAt(m,PT.lx,PT.ly,CUT_R)||seg>CUT_R)cutAt(m,PT.lx,PT.ly,lp.x,lp.y);
        PT.lx=lp.x;PT.ly=lp.y;}}
  }else if(PT.mode==='pet'){
    if(G.phase!=='offer')return;const lp=toLocal(m,x,y);const d=Math.hypot(lp.x-PT.lx,lp.y-PT.ly);
    const onHead=Math.hypot(lp.x/1.25,lp.y+10)<175;
    if(onHead){m.petAmt+=d*1.0;PT.acc+=d;pushTufts(m,lp.x,lp.y,lp.x-PT.lx,lp.y-PT.ly,0.8,70);m.p.tilt+=clamp((lp.x-PT.lx)*0.01,-0.1,0.1);
      if(PT.acc>32){PT.acc=0;petFx(m,x,y,lp,dx,dy);}}
    PT.lx=lp.x;PT.ly=lp.y;
  }
}
function petFx(m,x,y,lp,dx,dy){
  addFX({k:Math.random()<0.5?'heart':'star',x,y,vx:R(-60,60),vy:R(-160,-90),r:R(9,13)*L.S,col:pick(['#ff9f1c','#ffd23f','#ff6b5e','#ff8fc7']),rot:R(-0.3,0.3),vr:R(-2,2),ttl:0.9,gr:60});
  starBurst(x,y,2,['#ffd23f','#ff9f1c','#ff6b5e'],140,0.8);
  SFX.pet(clamp(m.petAmt/PET_NEED,0,1));m.rt.squish=Math.max(m.rt.squish||0,0.3);
  pushTufts(m,lp.x,lp.y,dx||1,dy||0,1.0,80);
}
function downParade(x,y){
  const pr=G.par;
  if(pr.chairOn){const c=L.cc;if(Math.abs(x-c.x)<130*c.s&&y>c.y&&y<c.y+320*c.s){SFX.fanfare();starBurst(x,y,10,PARTY,260,1);startClosing();PT.mode='none';return;}}
  const order=G.mons.slice().sort((a,b)=>(b.Y+255*b.s)-(a.Y+255*a.s));
  for(const m of order){if(monHit(m,x,y,150)){
    let v;do{v=(Math.random()*3)|0;}while(v===m.lastPose);
    startAct(m,v,1.3,'pose');PT.mode='pmon';PT.mon=m;const s=toScreen(m,0,-40);starBurst(s.x,s.y,6,PARTY,220,0.9);return;}}
  if(y>L.yb-10){PT.mode='trail';starBurst(x,y,5,PARTY,200,0.9);confetti(x,y,4,10,-120);SFX.sparkle();return;}
  G.wig.drape=1;SFX.whoosh(0.3);
}
function moveParade(x,y,dx,dy){
  if(PT.mode==='trail'){PT.acc+=Math.hypot(dx,dy);if(PT.acc>22){PT.acc=0;starBurst(x,y,2,PARTY,120,0.8);confetti(x,y,2,6,-80);if(Math.random()<0.3)SFX.sparkle();}}
  else if(PT.mode==='pmon'){const m=PT.mon;const lp=toLocal(m,x,y);PT.acc+=Math.hypot(dx,dy);
    if(PT.acc>10){m.stroke=0.6;pushTufts(m,lp.x,lp.y,dx,dy,1.4,90);if(m.kind==='dragon')for(const t of m.tufts)t.sv+=0.5;if(m.kind==='lion')m.p.mane=Math.max(m.p.mane,0.6);
      if(PT.acc>40){PT.acc=0;SFX.voice(m.kind,'giggle');addFX({k:'heart',x,y,vx:R(-40,40),vy:-120,r:11*L.S,col:'#ff8fc7',rot:0,vr:0,ttl:0.9,gr:40});}}}
}

// =====================================================================
//  描画
// =====================================================================
function renderSalon(g,o){
  o=o||{};
  g.drawImage(bgC,0,0,W,H);
  drawLamp(g);
  const cr=G.curtRect||L.curtain;
  if(!o.noCurtain){
    drawCurtainBack(g,cr);
    if(!o.noMons){g.save();g.beginPath();g.rect(cr.x,cr.y,cr.w,cr.h);g.clip();
      for(const m of G.mons){if(m.loc==='back'&&m.peek>0){const q=1-m.peek/1.8;const e=plateau(q,4);m.vis=true;m.p.jump+=0;drawMonster(g,m,m.X,m.Y+ (1-e)*120*m.s,m.s,1);}}
      g.restore();
      for(const m of G.mons)if(m.behind&&m.loc==='walk')drawMonster(g,m,m.X,m.Y,m.s,1,{shadow:true});}
    const open=Math.max(G.curtPart*0.55,G.mons.some(m=>m.loc==='back'&&m.peek>0)?0.32:0);
    drawCurtainFront(g,cr,open,G.mode==='transform'?G.curtInflate:0,G.curtWob);
  }
  drawMirror(g);
  drawPlant(g);
  if(G.speed>0&&!o.noMons)drawSpeed(g,G.speedX,G.speedY,G.speed*0.8,60*L.S);
  const m=cur();
  if(!o.noMons&&m&&G.phase==='offer'&&m.loc==='chair'){const hs=toScreen(m,0,-20);drawHalo(g,hs.x,hs.y,170*m.s,0.55+0.2*Math.sin(G.time*4));}
  drawChair(g,L.seat.x,L.seat.y,L.S,G.wig.chair,m&&m.loc==='chair');
  if(!o.noMons){
    const list=G.mons.filter(k=>(k.loc==='chair'||k.loc==='stand'||k.loc==='line'||(k.loc==='walk'&&!k.behind)));
    list.sort((a,b)=>(a.Y+255*a.s)-(b.Y+255*b.s));
    for(const k of list){if(k.loc==='walk'&&k.walk&&k.walk.from===P.bench(k.slot))continue;k.vis=true;drawMonster(g,k,k.X,k.Y,k.s,1,{shadow:k.loc!=='chair'});}
  }
  drawHairBits(g);
  drawBench(g);
  if(!o.noMons)for(const k of G.mons)if(k.loc==='bench'){k.vis=true;drawMonster(g,k,k.X,k.Y,k.s,1);}
  drawTray(g);
  if(!o.noClip)drawClipper(g);
}
function drawStage(g,lights,ext){
  g.drawImage(stC,0,0,W,H);
  // 拍に合わせて躍る網点
  const beat=G.beat||0;const pulse=0.5+0.5*Math.abs(Math.sin(beat*PI));
  g.save();g.fillStyle='rgba(255,210,63,0.5)';const cx=W/2,cy=L.yb*0.75;
  for(let ring=1;ring<6;ring++){const n=10+ring*5,rr=ring*Math.max(W,H)*0.11;for(let i=0;i<n;i++){const a=i/n*TAU+ring*0.3+G.time*0.05*(ring%2?1:-1);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*0.6;if(y>L.yb)continue;
    const r=(3+ring*1.2)*(ring%2?pulse:1.5-pulse)*L.S;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}}
  g.restore();
  // 吊り星
  for(let i=0;i<7;i++){const x=W*(i+0.5)/7,len=H*(0.06+0.05*((i*37)%3))*(ext>0?1:0.0)+(G.mode==='parade'?0:0);if(len<=0)continue;const sw=Math.sin(G.time*1.5+i)*0.15;
    g.save();g.translate(x,0);g.rotate(sw);g.strokeStyle=INK;g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(0,len);g.stroke();g.beginPath();starPath(g,0,len+14*L.S,15*L.S,-PI/2+G.time*(i%2?1:-1)*0.6);g.fillStyle=PARTY[i%PARTY.length];g.fill();g.lineWidth=3;g.stroke();g.restore();}
  // ランウェイ
  if(ext>0){
    const yb=L.yb,yf=lerp(yb,H+10,ext);const wAt=y=>lerp(L.wb,L.wf,(y-yb)/(L.yf-yb));
    const p=new Path2D();p.moveTo(W/2-L.wb,yb);p.lineTo(W/2+L.wb,yb);p.lineTo(W/2+wAt(yf),yf);p.lineTo(W/2-wAt(yf),yf);p.closePath();
    g.save();g.translate(4,3);g.fillStyle=MIS;g.fill(p);g.restore();
    g.fillStyle='#ef3e4a';g.fill(p);
    g.save();g.clip(p);const n=12;for(let i=0;i<n;i++){const y0=lerp(yb,L.yf+40,Math.pow(i/n,1.3)),y1=lerp(yb,L.yf+40,Math.pow((i+0.5)/n,1.3));
      g.fillStyle=(i+Math.floor(beat))%2?'#ffd23f':'#ff9f1c';g.beginPath();g.moveTo(W/2-wAt(y0),y0);g.lineTo(W/2+wAt(y0),y0);g.lineTo(W/2+wAt(y1),y1);g.lineTo(W/2-wAt(y1),y1);g.closePath();g.fill();}
    g.fillStyle=pat(g,'red');g.fillRect(0,yb,W,H);
    g.fillStyle='rgba(255,255,255,0.25)';g.beginPath();g.moveTo(W/2-L.wb*0.15,yb);g.lineTo(W/2+L.wb*0.15,yb);g.lineTo(W/2+wAt(yf)*0.15,yf);g.lineTo(W/2-wAt(yf)*0.15,yf);g.fill();
    g.restore();g.lineWidth=5;g.strokeStyle=INK;g.stroke(p);
    for(let i=0;i<=10;i++){const y=lerp(yb,L.yf,i/10);if(y>yf)break;const w=wAt(y);for(const sd of[-1,1]){const on=((i+Math.floor(beat*2))%2)===0;g.beginPath();g.arc(W/2+sd*(w+6*L.S),y,(3+i*0.5)*L.S,0,TAU);g.fillStyle=on?'#fffbe0':'#ffb52f';g.fill();g.lineWidth=2;g.strokeStyle=INK;g.stroke();}}
  }
}
function drawSpots(g,lights){
  if(lights<=0)return;g.save();g.globalCompositeOperation='lighter';
  const src=[[W*0.12,-10],[W*0.5,-10],[W*0.88,-10]];
  G.mons.forEach((m,i)=>{const fx=m.X,fy=m.Y+255*m.s;const [sx,sy]=src[i];const w=110*m.s;
    g.globalAlpha=0.13*lights;g.fillStyle='#fff6c0';g.beginPath();g.moveTo(sx-8,sy);g.lineTo(sx+8,sy);g.lineTo(fx+w,fy);g.lineTo(fx-w,fy);g.closePath();g.fill();
    g.globalAlpha=0.22*lights;g.beginPath();g.ellipse(fx,fy,w,w*0.22,0,0,TAU);g.fill();});
  g.restore();
}
function renderTransform(g){
  const t=G.tt;
  if(t<1.2){G.curtInflate=easeO(t/1.1);G.curtRect=null;renderSalon(g,{});return;}
  const op=easeO((t-1.2)/0.55),rq=easeIO((t-1.2)/0.7),fold=easeIO((t-1.35)/0.9),ext=easeO((t-2.3)/0.9),lights=clamp((t-3.0)/0.6,0,1);
  drawStage(g,lights,ext);
  if(fold<1){const fw=W/2*(1-fold);const k=foldC.width/W;
    g.save();g.drawImage(foldC,0,0,W/2*k,H*k,0,H*fold*0.04,Math.max(1,fw),H*(1-fold*0.08));g.fillStyle='rgba(20,10,40,'+(fold*0.5)+')';g.fillRect(0,H*fold*0.04,fw,H*(1-fold*0.08));
    g.drawImage(foldC,W/2*k,0,W/2*k,H*k,W-fw,H*fold*0.04,Math.max(1,fw),H*(1-fold*0.08));g.fillRect(W-fw,H*fold*0.04,fw,H*(1-fold*0.08));
    g.lineWidth=5;g.strokeStyle=INK;g.strokeRect(-3,H*fold*0.04,fw+3,H*(1-fold*0.08));g.strokeRect(W-fw,H*fold*0.04,fw+3,H*(1-fold*0.08));g.restore();}
  drawSpots(g,lights);
  if(G.speed>0)drawSpeed(g,G.speedX,G.speedY,G.speed*0.6,40*L.S);
  const list=G.mons.slice().sort((a,b)=>(a.Y+255*a.s)-(b.Y+255*b.s));for(const m of list)drawMonster(g,m,m.X,m.Y,m.s,1,{shadow:true});
  drawFX(g);
  const c=L.curtain;const full={x:0,y:0,w:W,h:H};
  const r={x:lerp(c.x,full.x,rq),y:lerp(c.y,full.y,rq),w:lerp(c.w,full.w,rq),h:lerp(c.h,full.h,rq)};
  drawCurtainFront(g,r,op,(1-rq)*1,0);
}
function renderParade(g){
  const pr=G.par;
  let sh=0;if(G.shake>0)sh=Math.sin(G.time*60)*2*L.S;g.save();g.translate(0,sh);
  drawStage(g,1,1);
  if(G.speed>0)drawSpeed(g,G.speedX,G.speedY,G.speed*0.5,50*L.S);
  if(pr.chairOn){const c=L.cc;const e=easeBack(Math.min(1,pr.chairT/0.6));const b=Math.abs(Math.sin(G.time*3))*8*L.S*(G.idle>6?1.6:1);
    g.save();g.translate(c.x,c.y+320*c.s);g.scale(e,e);g.translate(-c.x,-c.y-320*c.s);
    drawHalo(g,c.x,c.y+150*c.s,190*c.s,0.35+0.15*Math.sin(G.time*4));
    drawChair(g,c.x,c.y-b,c.s,0);
    // 椅子の上で待つバリカン
    g.save();g.translate(c.x,c.y+190*c.s-b);g.rotate(-0.9);const r=CUT_R*c.s*1.6;g.beginPath();g.arc(0,0,r,0,TAU);g.fillStyle='#dfe7f2';g.fill();g.lineWidth=3;g.strokeStyle=INK;g.stroke();
    const hp=rrP(-r*0.7,r*0.5,r*1.4,r*2.4,r*0.6);inkFill(g,hp,'#ff6b5e',3,'dk');g.restore();
    if(Math.random()<0.05)addFX({k:'spark',x:c.x+R(-60,60)*c.s,y:c.y+R(60,220)*c.s,vx:0,vy:-20,r:10*L.S,col:'#fff',rot:0,vr:2,ttl:0.6,gr:0});
    g.restore();}
  const list=G.mons.slice().sort((a,b)=>(a.Y+255*a.s)-(b.Y+255*b.s));for(const m of list){m.vis=true;drawMonster(g,m,m.X,m.Y,m.s,1,{shadow:true});}
  drawSpots(g,1);
  drawFX(g);
  drawCurtainFront(g,{x:0,y:0,w:W,h:H},1,0,G.wig.drape);
  g.restore();
}
function renderClosing(g){
  if(!G.closed){renderParade(g);const q=easeIO(G.tt/0.8);drawCurtainFront(g,{x:0,y:0,w:W,h:H},1-q,0,0);}
  else{const q=easeIO((G.tt-0.8)/0.9);const c=L.curtain;G.curtRect={x:lerp(0,c.x,q),y:lerp(0,c.y,q),w:lerp(W,c.w,q),h:lerp(H,c.h,q)};
    renderSalon(g,{noCurtain:true});drawCurtainFront(g,G.curtRect,0,0,0);G.curtRect=null;}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.mode==='salon')renderSalon(ctx,{});
  else if(G.mode==='transform')renderTransform(ctx);
  else if(G.mode==='parade')renderParade(ctx);
  else if(G.mode==='closing')renderClosing(ctx);
  if(G.mode==='salon'||G.mode==='closing')drawFX(ctx);
}

// =====================================================================
//  ループ
// =====================================================================
let last=performance.now(),raf=0,running=false;
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0.001;if(dt>0.05)dt=0.05;
  update(dt);render();
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();setBuzz(0);if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend().catch(()=>{});PT=null;CL.held=false;}else{if(AU.ctx)AU.ctx.resume().catch(()=>{});start();}});
let rsT=0;function onResize(){clearTimeout(rsT);rsT=setTimeout(()=>{layout();PT=null;CL.held=false;},60);}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',onResize);

layout();newSalon();
for(const m of G.mons){resetP(m);baseFT(m);}
update(0.016);render();start();
window.__kaiju={G,L,CL,cur,PH,FX};
})();
</script>
