<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#cfe6f2">
<meta name="format-detection" content="telephone=no">
<title>にじのみち</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 46a26 26 0 0 1 52 0' fill='none' stroke='%23ff8a8a' stroke-width='5'/%3E%3Cpath d='M12 46a20 20 0 0 1 40 0' fill='none' stroke='%23ffd36b' stroke-width='5'/%3E%3Cpath d='M18 46a14 14 0 0 1 28 0' fill='none' stroke='%2384d38a' stroke-width='5'/%3E%3Cpath d='M24 46a8 8 0 0 1 16 0' fill='none' stroke='%2378b6ff' stroke-width='5'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #cfe6f2;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #veil {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 40% 35%, #f4f1e6 0%, #cfe6f2 70%);
    transition: opacity 2.2s ease;
  }
  #veil .drop {
    position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px;
    border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #bfe3f6 45%, #7fb8dc 100%);
    box-shadow: 0 0 18px rgba(255,255,255,0.8);
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-45deg); } 50% { transform: translateY(-10px) rotate(-45deg); } }
  #fps { position: fixed; left: 6px; top: 6px; font: 11px monospace; color: #234; background: rgba(255,255,255,0.6); padding: 2px 4px; display: none; }
</style>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><div class="drop"></div></div>
<div id="fps"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
