<!doctype html>
<html data-guide="zen-ride-vgggok" lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
    <script data-guide-runtime src="../catalog/guide/clock.js"></script>
    <script data-guide-runtime src="../catalog/guide/bridge.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#a8d8ff">
<meta name="format-detection" content="telephone=no">
<title>今日はわたしが運転手！</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #a8d8ff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#8fd0ff, #d8f0ff 60%, #8fd17a 60%);
    transition: opacity .5s; pointer-events: none;
  }
  #boot .wheel {
    width: 92px; height: 92px; border-radius: 50%;
    border: 14px solid #1e1f23; box-sizing: border-box; position: relative;
    animation: spin 1.6s ease-in-out infinite alternate;
  }
  #boot .wheel::before {
    content: ''; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px;
    border-radius: 50%; background: #d9182b;
  }
  #boot .wheel::after {
    content: ''; position: absolute; left: 50%; top: -14px; width: 10px; height: 14px; margin-left: -5px; background: #ffcc1a;
  }
  @keyframes spin { from { transform: rotate(-70deg); } to { transform: rotate(70deg); } }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 20px sans-serif; }
</style>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="boot"><div class="wheel"></div></div>
<noscript>JavaScript を有効にしてください</noscript>
<script type="module" src="./src/main.js"></script>
<script data-autoplay type="module" src="../catalog/autoplay/entry.js"></script>
</body>
</html>
