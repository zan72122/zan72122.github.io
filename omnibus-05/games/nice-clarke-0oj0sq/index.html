<!doctype html>
<html lang="ja">
  <head>
<meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="夜のスーパーで、今夜だけレジ係になる。4歳からの、ことばのいらないゲーム。" />
    <title>ピッ！ ― 今夜は、わたしがレジ係</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M8 32h48' stroke='%23ff3030' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      /* Loading: a single red scan line, nothing to read. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070d;
        transition: opacity 1.2s ease;
        pointer-events: none;
        z-index: 5;
      }
      #boot i {
        display: block;
        width: min(60vw, 420px);
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #ff2a2a 20%, #ff6a5a 50%, #ff2a2a 80%, transparent);
        box-shadow: 0 0 18px 4px rgba(255, 40, 40, 0.55), 0 0 60px 10px rgba(255, 40, 40, 0.25);
        animation: sweep 1.6s ease-in-out infinite;
      }
      @keyframes sweep {
        0%,
        100% {
          transform: translateY(-40px) scaleX(0.6);
          opacity: 0.5;
        }
        50% {
          transform: translateY(40px) scaleX(1);
          opacity: 1;
        }
      }
      #boot.gone {
        opacity: 0;
      }
      /* A barely-there replay control for grown-ups, shown only after the ending. */
      #again {
        position: fixed;
        right: max(14px, env(safe-area-inset-right));
        top: max(14px, env(safe-area-inset-top));
        width: 44px;
        height: 44px;
        border-radius: 22px;
        border: 0;
        background: rgba(255, 255, 255, 0.12);
        display: none;
        z-index: 4;
        padding: 0;
        cursor: pointer;
      }
      #again svg {
        width: 22px;
        height: 22px;
        margin: 11px;
      }
      #again.show {
        display: block;
      }
      /* a soft lens vignette: the frame breathes like a film, not a web page */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        background: radial-gradient(ellipse 120% 95% at 50% 52%, rgba(0, 0, 0, 0) 55%, rgba(4, 6, 14, 0.42) 100%);
        transition: opacity 1.5s ease;
      }
      #fail {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #aaa;
        font: 14px/1.6 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/": "./vendor/addons/",
          "cannon-es": "./vendor/cannon-es.js"
        }
      }
    </script>
  
<script src="/gf-nav.js" defer></script>
</head>
  <body>
    <div id="stage"></div>
    <div id="vignette"></div>
    <div id="boot"><i></i></div>
    <button id="again" aria-label="もういちど">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12a8 8 0 1 1-2.4-5.7" />
        <path d="M20 4v5h-5" />
      </svg>
    </button>
    <div id="fail">この端末では 3D 表示が使えないようです。</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
