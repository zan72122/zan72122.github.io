<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="そらのはな">
<meta name="theme-color" content="#d9ecf6">
<meta name="format-detection" content="telephone=no">
<title>そらのはな</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9eedf; }
  body {
    position: fixed; inset: 0;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* 読み込み中: 黒ではなく朝の光 */
  #veil {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 30% 20%, #fff8e6 0%, #f3ead2 40%, #d6e9ef 100%);
    transition: opacity 1.8s ease;
    display: flex; align-items: center; justify-content: center;
  }
  #veil.gone { opacity: 0; }
  .seedling { position: relative; width: 64px; height: 90px; }
  .seedling .soil { position: absolute; bottom: 0; left: 4px; width: 56px; height: 16px; border-radius: 50%; background: #8a6544; }
  .seedling .stem { position: absolute; bottom: 10px; left: 30px; width: 4px; height: 0; background: #8cc152; border-radius: 3px; animation: grow 1.6s ease-out infinite alternate; }
  .seedling .leaf { position: absolute; width: 18px; height: 10px; background: #a3d46a; border-radius: 0 100% 0 100%; bottom: 46px; opacity: 0; animation: leaf 1.6s ease-out infinite alternate; }
  .seedling .l1 { left: 13px; transform: rotate(-20deg); }
  .seedling .l2 { left: 33px; transform: scaleX(-1) rotate(-20deg); }
  @keyframes grow { from { height: 0; } to { height: 40px; } }
  @keyframes leaf { 0%, 60% { opacity: 0; } 100% { opacity: 1; } }
  #fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; }
</style>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><div class="seedling"><div class="soil"></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
