<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#94DDF4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>どうぶつタクシー</title>
<style>
:root{--cream:#FFF3D6;--sky:#94DDF4;--coral:#FF8E94;--sun:#FFD35A;--mint:#83D9B0;--lav:#B5A2EE;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sky);overflow:hidden;font-family:-apple-system,"Hiragino Sans",sans-serif}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#94DDF4,#CFF1FB);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#field{position:absolute;inset:0;touch-action:none}
button{font:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
.ctl{position:absolute;touch-action:none;display:flex;align-items:center;justify-content:center;transition:opacity .25s,transform .08s}
.ctl svg{width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(80,60,120,.25))}
#accel{right:calc(var(--sr) + 10px);top:var(--pedal-top);width:var(--aw);height:var(--ah);transform:translateY(-50%);opacity:.88}
#brake{left:calc(var(--sl) + 10px);top:var(--pedal-top);width:var(--bw);height:var(--bh);transform:translateY(-50%);opacity:.88}
#horn{left:50%;bottom:calc(var(--sb) + 14px);width:var(--horn);height:var(--horn);transform:translateX(-50%);opacity:.92}
#horn.pressed{transform:translateX(-50%) scale(.9)}
#accel:active,#brake:active{opacity:1}
#app[data-drive=dim] #accel,#app[data-drive=dim] #brake{opacity:.25}
#app[data-drive=off] #accel,#app[data-drive=off] #brake{opacity:0;pointer-events:none}
#app[data-drive=off] #horn{opacity:.35}
.drag-arc{position:absolute;left:-60%;right:-60%;top:-22%;height:40%;opacity:0;transition:opacity .3s;pointer-events:none}
#app[data-mode=touch] .drag-arc,#app[data-mode=keyboard] .drag-arc{opacity:.75}
.corner{position:absolute;width:56px;height:56px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.corner .mini{width:40px;height:40px;display:block;pointer-events:none}
.corner .mini.tiny{width:30px;height:30px;opacity:.75}
.corner svg{width:100%;height:100%}
#reset{right:calc(var(--sr) + 6px);top:calc(var(--st) + 6px)}
#mode{right:calc(var(--sr) + 66px);top:calc(var(--st) + 6px)}
#sound{left:calc(var(--sl) + 6px);top:calc(var(--st) + 6px)}
#parentBtn{left:calc(var(--sl) + 66px);top:calc(var(--st) + 6px)}
.hold-ring{position:absolute;inset:0;pointer-events:none}
.hold-ring circle{fill:none;stroke:#B5A2EE;stroke-width:4;stroke-dasharray:164;stroke-dashoffset:164}
#parentBtn.holding .hold-ring circle{transition:stroke-dashoffset 1.2s linear;stroke-dashoffset:0}
#mode.offer{animation:pulse 1.2s ease-in-out infinite}
#mode.nope{animation:shake .4s}
#bubble{position:absolute;left:50%;top:calc(var(--st) + 8px);transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(80,60,120,.25);pointer-events:none;padding:6px}
#bubble canvas{width:100%;height:100%;display:block}
#pointer{position:absolute;width:64px;height:64px;pointer-events:none;opacity:.9;animation:bob 1s ease-in-out infinite}
#pointer svg{width:100%;height:100%}
.hint{position:absolute;pointer-events:none}
.hint .hand{position:absolute;width:76px;height:76px;transform:translate(-30%,-10%);animation:tap 1.4s ease-in-out infinite}
.hint .hand svg{width:100%;height:100%}
.hint .hand.slide{animation:slide 1.8s ease-in-out infinite}
.hint-tilt,.hint-calibrate{left:50%;top:calc(var(--st) + 104px)}
.hint .pic{position:absolute;transform:translateX(-50%);width:170px;background:rgba(255,255,255,.85);border-radius:28px;padding:10px;box-shadow:0 4px 10px rgba(80,60,120,.2)}
.hint .pic svg{width:100%;display:block}
.tilt .tilt-tab{transform-origin:100px 70px;animation:tilt 2.4s ease-in-out infinite}
.calib .flat-tab{display:none}
.dots{display:flex;justify-content:center;gap:10px;margin-top:4px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--lav);animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
#app[data-hint=accel] #accel,#app[data-hint=brake] #brake{animation:glow 1.4s ease-in-out infinite}
#progress{position:absolute;left:50%;top:calc(var(--st) + 100px);width:96px;height:96px;transform:translateX(-50%);pointer-events:none}
#progress svg{width:100%;height:100%}
#progress .bg{fill:#fff;stroke:#EDE7FA;stroke-width:8}
#progress .fg{fill:none;stroke:var(--coral);stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:40px 40px;transition:stroke-dashoffset .15s}
#progress .heart{fill:var(--coral);animation:beat .8s ease-in-out infinite;transform-origin:40px 42px}
#upright{position:absolute;left:50%;top:calc(var(--st) + 100px);transform:translateX(-50%);width:230px;background:rgba(255,255,255,.9);border-radius:30px;padding:12px;pointer-events:none;box-shadow:0 4px 10px rgba(80,60,120,.2)}
#upright svg{width:100%;display:block}
#upright.context{width:130px;left:auto;right:calc(var(--sr) + 10px);top:calc(var(--st) + 70px);transform:none;opacity:.9}
#upright .up-tab{animation:rise 2s ease-in-out infinite;transform-origin:100px 104px}
#wash{position:absolute;left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);display:flex;gap:min(3vw,22px)}
#wash .shower{width:min(22vw,124px);height:min(22vw,124px);touch-action:none;border-radius:50%;transition:transform .15s,opacity .3s}
#wash .shower svg{width:100%;height:100%;filter:drop-shadow(0 5px 8px rgba(80,60,120,.3))}
#wash .shower.chosen{transform:scale(1.15)}
#wash.done .shower:not(.chosen){opacity:.25}
#wash.done{pointer-events:none}
#deco{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:min(4vw,30px)}
.deco-card{width:min(26vw,150px);height:min(26vw,150px);background:#fff;border-radius:34px;box-shadow:0 6px 12px rgba(80,60,120,.3);padding:14px;touch-action:none;animation:pop .5s backwards}
.deco-card:nth-child(2){animation-delay:.12s}.deco-card:nth-child(3){animation-delay:.24s}
.deco-card canvas{width:100%;height:100%;display:block;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(255,248,230,.92),rgba(191,234,248,.55) 70%)}
#gl{background:radial-gradient(circle at 50% 40%,#FFF8E6,#BFEAF8 70%)}
.screen[hidden],#parent[hidden],[hidden]{display:none!important}
.big{width:min(46vmin,260px);height:min(46vmin,260px);animation:pulse 1.6s ease-in-out infinite;touch-action:manipulation}
.big svg{width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(80,60,120,.3))}
#embed{position:absolute;right:calc(var(--sr) + 20px);bottom:calc(var(--sb) + 20px);width:110px;height:110px}
#embed svg{width:100%;height:100%}
.deco-dots{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 20%,#FFD35A 0 10px,transparent 11px),radial-gradient(circle at 85% 25%,#FF8E94 0 14px,transparent 15px),radial-gradient(circle at 20% 80%,#83D9B0 0 12px,transparent 13px),radial-gradient(circle at 80% 78%,#B5A2EE 0 10px,transparent 11px)}
#gl.failed .big{animation:none}
#parent{position:absolute;inset:0;background:rgba(255,248,230,.97);overflow:auto;-webkit-user-select:text;user-select:text;touch-action:auto;color:#3B3350}
#parent .panel{max-width:640px;margin:0 auto;padding:calc(var(--st) + 20px) 20px 40px}
#parent h1{font-size:22px}#parent p{line-height:1.6}#parent label{display:block;margin:12px 0}
#parent select,#parent input[type=range]{font-size:16px;margin-left:8px}
#parent .row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
#parent button{background:#fff;border:2px solid var(--lav);border-radius:12px;padding:10px 14px;font-size:15px}
#parent .close{background:var(--mint);border-color:var(--mint)}
#parent .small{font-size:13px;opacity:.8}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25) drop-shadow(0 0 14px #fff)}}
@keyframes tap{0%,100%{transform:translate(-30%,-10%) scale(1)}50%{transform:translate(-30%,-2%) scale(.9)}}
@keyframes slide{0%,100%{transform:translate(-90%,-10%)}50%{transform:translate(30%,-10%)}}
@keyframes tilt{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes rise{0%,30%{transform:rotate(-80deg)}60%,100%{transform:rotate(0)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes bob{0%,100%{opacity:.9}50%{opacity:.55}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.big,.hint .hand,#pointer{animation-duration:3s}}
</style>

<script src="../../gf-playlog.js" defer></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<div id="app" data-drive="off" data-hint="none">
  <canvas id="scene" aria-label="どうぶつタクシーの町"></canvas>
  <div id="field" aria-hidden="true"></div>
  <div id="bubble" hidden></div>
  <div id="pointer" hidden></div>
  <div id="progress" hidden></div>
  <div id="upright" hidden></div>
  <div id="brake" class="ctl" role="button" aria-label="ブレーキ"></div>
  <div id="accel" class="ctl" role="button" aria-label="アクセル"></div>
  <button id="horn" class="ctl" aria-label="クラクション"></button>
  <button id="reset" class="corner" aria-label="傾きのまんなかを合わせ直す"></button>
  <button id="mode" class="corner" aria-label="操作方法の切り替え"></button>
  <button id="sound" class="corner" aria-label="音"></button>
  <button id="parentBtn" class="corner" aria-label="保護者向け設定（長押し）"></button>
  <div id="hint" class="hint"></div>
  <div id="wash" hidden></div>
  <div id="deco" hidden></div>
  <div id="start" class="screen"><div class="deco-dots"></div><button id="engine" class="big" aria-label="はじめる"></button><a id="embed" hidden target="_blank" rel="noopener noreferrer" aria-label="新しいウィンドウで開く"></a></div>
  <div id="pause" class="screen" hidden><div class="deco-dots"></div><button id="resumeBtn" class="big" aria-label="つづける"></button></div>
  <div id="gl" class="screen" hidden><div class="deco-dots"></div><button id="glRetry" class="big" aria-label="もういちど"></button></div>
  <div id="parent" hidden></div>
</div>
<script src="./assets/game.js"></script>
</body>
</html>
