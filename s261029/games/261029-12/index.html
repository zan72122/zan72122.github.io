<script>
"use strict";
/* ===== utilities ===== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = v => v < 0 ? -1 : 1;
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
let seed = QS.has('seed') ? (parseInt(QS.get('seed'), 10) || 1) : ((Date.now() ^ (Math.random() * 1e9)) >>> 0);
function rnd() { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// visual-only randomness (keeps physics seed stable)
const vr = (a, b) => a + (b - a) * Math.random();

/* ===== audio (Web Audio synthesis) ===== */
const AU = {
  ctx: null, master: null, wet: null, duck: 1, last: {},
  start() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }

    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }

    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    this.master = c.createGain(); this.master.gain.value = 0.8;
    this.master.connect(comp); comp.connect(c.destination);
    // small room reverb
    const len = c.sampleRate * 1.4 | 0, buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const conv = c.createConvolver(); conv.buffer = buf;
    this.wet = c.createGain(); this.wet.gain.value = 0.28;
    this.wet.connect(conv); conv.connect(this.master);
    const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noise = nb;
    if (c.state === 'suspended') c.resume().catch(() => {});
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  // rate limiter per sound key
  gate(key, ms) { const t = performance.now(); if (this.last[key] && t - this.last[key] < ms) return false; this.last[key] = t; return true; },
  out(wet) { const g = this.ctx.createGain(); g.connect(this.master); if (wet) { const w = this.ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(this.wet); } return g; },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * this.duck), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tone(type, f0, f1, t, a, d, vol, wet, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), ny = c.sampleRate / 2 - 200;
    f0 = Math.min(f0, ny); f1 = Math.min(f1, ny);
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + a + d);
    this.env(g, t, a, vol, d); o.connect(g); g.connect(dest || this.out(wet)); o.start(t); o.stop(t + a + d + 0.05);

  },
  nz(f, q, t, a, d, vol, wet, type) {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true; fl.type = type || 'bandpass'; fl.frequency.value = Math.min(f, c.sampleRate / 2 - 200); fl.Q.value = q;
    this.env(g, t, a, vol, d); s.connect(fl); fl.connect(g); g.connect(this.out(wet));
    s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);
  },
  // ---- sound palette ----
  wood(vol = 0.5, f = 220) { // "コトン"
    if (!this.ok() || !this.gate('wood' + (f | 0), 40)) return; const t = this.ctx.currentTime;
    this.tone('sine', f * 1.6, f, t, 0.002, 0.12, vol * 0.6, 0.1);
    this.tone('triangle', f * 3.1, f * 2.6, t, 0.001, 0.05, vol * 0.25, 0.1);
    this.nz(f * 6, 3, t, 0.001, 0.03, vol * 0.3);
  },
  tick(vol, f) { // marble clatter grain
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.tone('sine', f, f * 0.9, t, 0.001, 0.025, vol, 0.05);
    this.nz(f * 2.2, 6, t, 0.001, 0.015, vol * 0.5);
  },
  thud(vol = 0.6) { // heavy block "ゴトン"
    if (!this.ok() || !this.gate('thud', 70)) return; const t = this.ctx.currentTime;
    this.tone('sine', 140, 55, t, 0.003, 0.22, vol, 0.15);
    this.nz(380, 1.2, t, 0.002, 0.12, vol * 0.5, 0.1, 'lowpass');
    this.tone('triangle', 330, 240, t, 0.001, 0.06, vol * 0.2);
  },
  boing(vol = 0.5, f = 170) { // jelly
    if (!this.ok() || !this.gate('boing', 60)) return; const t = this.ctx.currentTime, c = this.ctx;
    const o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f * 0.6, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.12); o.frequency.exponentialRampToValueAtTime(f, t + 0.45);
    lfo.frequency.value = 13; lg.gain.value = f * 0.12; lfo.connect(lg); lg.connect(o.frequency);
    this.env(g, t, 0.01, vol, 0.5); o.connect(g); g.connect(this.out(0.15)); o.start(t); lfo.start(t); o.stop(t + 0.6); lfo.stop(t + 0.6);
    this.nz(500, 0.8, t, 0.01, 0.12, vol * 0.25, 0, 'lowpass');
  },
  squish(vol = 0.35) { if (!this.ok() || !this.gate('squish', 80)) return; const t = this.ctx.currentTime; this.nz(300, 1, t, 0.02, 0.15, vol, 0, 'lowpass'); this.tone('sine', 90, 140, t, 0.02, 0.15, vol * 0.6); },
  xylo(f, vol = 0.5, wet = 0.35) { // clear wooden bar
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.tone('sine', f, f, t, 0.002, 1.2, vol, wet);
    this.tone('sine', f * 3.98, f * 3.98, t, 0.001, 0.25, vol * 0.25, wet);
    this.tone('sine', f * 9.2, f * 9.2, t, 0.001, 0.06, vol * 0.12, wet);
    this.nz(f * 4, 4, t, 0.001, 0.02, vol * 0.15);
  },
  bell(vol = 0.6, base = 784) { if (!this.gate('bell', 90)) return; this.xylo(base, vol, 0.5); const b = base; setTimeout(() => this.xylo(b * 1.5, vol * 0.55, 0.5), 90); },
  pop(vol = 0.5) { if (!this.ok()) return; const t = this.ctx.currentTime; this.tone('sine', 500, 1400, t, 0.003, 0.08, vol, 0.2); this.nz(2500, 2, t, 0.001, 0.03, vol * 0.4); },
  creak(vol = 0.25) { if (!this.ok()) return; const t = this.ctx.currentTime, c = this.ctx;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(110, t + 0.5); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 6;
    this.env(g, t, 0.05, vol, 0.5); o.connect(f); f.connect(g); g.connect(this.out(0.2)); o.start(t); o.stop(t + 0.6); },
  slam(vol = 0.9) { // big "ぱたん！"
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.tone('sine', 120, 40, t, 0.004, 0.5, vol, 0.4);
    this.nz(600, 0.9, t, 0.002, 0.35, vol * 0.7, 0.4, 'lowpass');
    this.tone('triangle', 260, 180, t, 0.002, 0.12, vol * 0.3, 0.3);
  },
  giggle(vol = 0.3, p = 1) { if (!this.ok() || !this.gate('gig', 260)) return; const t0 = this.ctx.currentTime, n = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) { const t = t0 + i * 0.085, f = (900 + Math.random() * 300) * p; this.tone('triangle', f, f * 1.25, t, 0.01, 0.06, vol * (1 - i / (n + 1)), 0.1); } },
  oh(vol = 0.3, p = 1) { if (!this.ok() || !this.gate('oh', 300)) return; const t = this.ctx.currentTime; this.tone('triangle', 700 * p, 1100 * p, t, 0.02, 0.18, vol, 0.1); },
  yawn(vol = 0.2, p = 1) { if (!this.ok() || !this.gate('yawn', 1500)) return; const t = this.ctx.currentTime; this.tone('triangle', 600 * p, 260 * p, t, 0.15, 0.7, vol, 0.2); },
  hop(vol = 0.2, p = 1) { if (!this.ok() || !this.gate('hop', 120)) return; const t = this.ctx.currentTime; this.tone('sine', 400 * p, 800 * p, t, 0.005, 0.08, vol); },
  drum(vol = 0.5, f = 150) { if (!this.ok()) return; const t = this.ctx.currentTime; this.tone('sine', f * 1.8, f, t, 0.002, 0.18, vol, 0.2); this.nz(f * 8, 2, t, 0.001, 0.04, vol * 0.4, 0.1); },
  clack(vol = 0.4) { if (!this.ok()) return; const t = this.ctx.currentTime; this.tone('square', 1800, 1500, t, 0.001, 0.02, vol * 0.3, 0.2); this.nz(3000, 3, t, 0.001, 0.03, vol * 0.5, 0.2); },
  sparkle(vol = 0.3) { if (!this.ok() || !this.gate('spk', 200)) return; const s = [1568, 1760, 2093, 2349, 2637]; for (let i = 0; i < 5; i++) setTimeout(() => this.xylo(s[i], vol * (1 - i * 0.12), 0.6), i * 70); },
  // master duck for the "hush" before the wall falls
  hush(ms) { if (!this.ctx) return; const g = this.master.gain, t = this.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.25, t + 0.08); g.linearRampToValueAtTime(0.8, t + ms / 1000 + 0.05); },
};
// pentatonic scale for festival / music mapping
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
/* ===== physics (house-local frame, y down; gravity rotates with tilt) ===== */
const G = 1300;
const P = {
  bodies: [], statics: [], onHit: null, gx: 0, gy: G, nid: 1,
  add(b) {
    b.id = this.nid++; b.vx = b.vx || 0; b.vy = b.vy || 0; b.ang = b.ang || 0; b.av = 0;
    b.invm = b.m ? 1 / b.m : 0; b.e = b.e ?? 0.2; b.mu = b.mu ?? 0.3; b.mus = b.mus ?? b.mu;
    b.gN = null; b.gObj = null; b.touch = []; b.px = b.x; b.py = b.y; b.air = 0; b.visAng = 0;
    if (b.shape === 'c') { b.hw = b.r; b.hh = b.r; } else { b.hw = b.w / 2; b.hh = b.h / 2; }
    this.bodies.push(b); return b;
  },
  box(x0, y0, x1, y1, o = {}) { const s = Object.assign({ t: 'box', x0, y0, x1, y1, on: true }, o); this.statics.push(s); return s; },
  seg(ax, ay, bx, by, o = {}) { const s = Object.assign({ t: 'seg', ax, ay, bx, by, on: true, oneway: true }, o); this.statics.push(s); return s; },
  circ(x, y, r, o = {}) { const s = Object.assign({ t: 'circ', x, y, r, on: true }, o); this.statics.push(s); return s; },

  step(dt) {
    const B = this.bodies, gx = this.gx, gy = this.gy;
    for (const b of B) {
      b.gN = null; b.gObj = null; b.px = b.x; b.py = b.y;
      if (b.kin || b.ghost) continue;
      b.vx += gx * dt; b.vy += gy * dt;
      const damp = b.drag || 0.02; b.vx *= 1 - damp * dt; b.vy *= 1 - damp * dt;
      const sp = Math.hypot(b.vx, b.vy); if (sp > 1800) { b.vx *= 1800 / sp; b.vy *= 1800 / sp; }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    for (let it = 0; it < 3; it++) {
      for (const b of B) { if (b.kin || b.ghost) continue; for (const s of this.statics) if (s.on) this.solveStatic(b, s, dt, it); }
      for (let i = 0; i < B.length; i++) { const a = B[i]; if (a.ghost) continue;
        for (let j = i + 1; j < B.length; j++) { const b = B[j]; if (b.ghost) continue; if (a.kin && b.kin) continue;
          if (Math.abs(a.x - b.x) > a.hw + b.hw + 2 || Math.abs(a.y - b.y) > a.hh + b.hh + 2) continue;
          this.solvePair(a, b, it); } }
    }
    for (const b of B) {
      if (b.kin || b.ghost) continue;
      if (b.gN) b.air = 0; else b.air += dt;
      if (b.shape === 'c') { if (b.gN) b.av = (b.vx * -b.gN.y + b.vy * b.gN.x) / b.r; b.ang += b.av * dt; }
    }
  },
  // generic contact response. n points from obstacle into a. o = other body or null(static)
  resolve(a, o, nx, ny, depth, mu, mus, e, it, sObj) {
    const ia = a.kin ? 0 : a.invm, ib = o ? (o.kin ? 0 : o.invm) : 0, sum = ia + ib;
    if (sum <= 0) return;
    const corr = Math.max(0, depth - 0.15) * 0.9 / sum;
    a.x += nx * corr * ia; a.y += ny * corr * ia;

    if (o && -up > 0.55) { o.gN = { x: -nx, y: -ny }; o.gObj = a; }

    if (vn >= 0) return;

    const ee = -vn > 70 ? e : 0;
    const jn = -(1 + ee) * vn / sum;
    a.vx += jn * nx * ia; a.vy += jn * ny * ia;
    if (o) { o.vx -= jn * nx * ib; o.vy -= jn * ny * ib; }

    const tx = -ny, ty = nx;
    const vt = (a.vx - (o ? o.vx : 0)) * tx + (a.vy - (o ? o.vy : 0)) * ty;
    let jt = -vt / sum; const lim = (Math.abs(vt) < 12 ? mus : mu) * jn;
    jt = clamp(jt, -lim, lim);

  },
  solveStatic(b, s, dt, it) {
    if (s.only && !s.only(b)) return;

      let nx, ny, d;

        const qx = clamp(b.x, s.x0, s.x1), qy = clamp(b.y, s.y0, s.y1);
        let dx = b.x - qx, dy = b.y - qy, dist = Math.hypot(dx, dy);
        if (dist >= b.r) return;
        if (dist > 1e-6) { nx = dx / dist; ny = dy / dist; d = b.r - dist; }
        else { const r = boxPush(b.x, b.y, 0, 0, s); nx = r[0]; ny = r[1]; d = r[2] + b.r; }
      } else {
        const ox = Math.min(b.x + b.hw, s.x1) - Math.max(b.x - b.hw, s.x0);
        const oy = Math.min(b.y + b.hh, s.y1) - Math.max(b.y - b.hh, s.y0);

      this.resolve(b, null, nx, ny, d, b.mu * (s.mu ?? 0.35) / 0.35, b.mus * (s.mu ?? 0.35) / 0.35, Math.max(b.e, s.e ?? 0.1), it, s);

        const t = clamp(((b.x - ax) * ex + (b.y - ay) * ey) / L2, 0, 1);
        const qx = ax + ex * t, qy = ay + ey * t; let dx = b.x - qx, dy = b.y - qy; const dist = Math.hypot(dx, dy);

        this.resolve(b, null, dx / dist, dy / dist, b.r - dist, b.mu * (s.mu ?? 0.6), b.mus * (s.mu ?? 0.6), b.e, it, s);
      } else {
        const side = (b.x - ax) * nx + (b.y - ay) * ny; if (side < 0) return;

        for (const [cx, cy] of [[b.x - b.hw, b.y + b.hh], [b.x + b.hw, b.y + b.hh], [b.x, b.y + b.hh], [b.x - b.hw, b.y - b.hh], [b.x + b.hw, b.y - b.hh]]) {
          const t = ((cx - ax) * ex + (cy - ay) * ey) / L2; if (t < 0 || t > 1) continue;
          const dd = (cx - ax) * nx + (cy - ay) * ny; if (dd < best) best = dd;

      const rr2 = b.shape === 'c' ? b.r + s.r : s.r;
      let dx = qx - s.x, dy = qy - s.y; const dist = Math.hypot(dx, dy);
      if (dist >= rr2 || dist < 1e-6) return;

    }
  },
  solvePair(a, b, it) {
    let nx, ny, d;
    if (a.shape === 'c' && b.shape === 'c') {
      const dx = a.x - b.x, dy = a.y - b.y, dist = Math.hypot(dx, dy), R = a.r + b.r;
      if (dist >= R) return; if (dist < 1e-6) { nx = 0; ny = -1; } else { nx = dx / dist; ny = dy / dist; } d = R - dist;
    } else if (a.shape === 'b' && b.shape === 'b') {
      const ox = Math.min(a.x + a.hw, b.x + b.hw) - Math.max(a.x - a.hw, b.x - b.hw);
      const oy = Math.min(a.y + a.hh, b.y + b.hh) - Math.max(a.y - a.hh, b.y - b.hh);
      if (ox <= 0 || oy <= 0) return;
      if (ox < oy) { nx = a.x < b.x ? -1 : 1; ny = 0; d = ox; } else { nx = 0; ny = a.y < b.y ? -1 : 1; d = oy; }
      // a flat plank on the floor acts like a low step: other boxes slide up onto it instead of being stopped
      const pl = a.kind === 'plank' && !a.kin ? a : b.kind === 'plank' && !b.kin ? b : null;
      if (pl && ny === 0) { const o = pl === a ? b : a, step = o.y + o.hh - (pl.y - pl.hh);
        if (step > 0 && step < 14 && o.y < pl.y) { d = step; nx = 0; ny = o === a ? -1 : 1; } }
    } else {
      const flip = a.shape === 'b'; const c = flip ? b : a, bx = flip ? a : b;

  W.shake = Math.max(0, W.shake - dt); W.wig = Math.max(0, (W.wig || 0) - dt * 3);

  for (const m of [M1, M2, BALL]) {

    m.tick = (m.tick || 0) + sp * dt; if (m.tick > (m.kind === 'ball' ? 60 : 24) && sp > 40) { m.tick = 0; if (m.kind === 'ball') AU.wood(clamp(sp / 2500, 0.03, 0.12), 160); else AU.tick(clamp(sp / 5000, 0.03, 0.14), 2200 + m.note * 180 + Math.random() * 300); }

  drawHouseBack();

  drawBell();
  for (const b of P.bodies) if (b.kind !== 'gnome' && (!b.ghost || b.cap || b.bridge || b.carriedBy)) drawBody(b);

let last = 0, running = false, rafId = 0;
function frame(ts) {

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopLoop(); W.drag = null; W.tTarget = 0; if (AU.ctx) AU.ctx.suspend().catch(() => {}); }
  else { if (AU.ctx) AU.ctx.resume().catch(() => {}); startLoop(); }

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---- boot ---- */
layout(); initPatterns(); buildWorld();
W.model = loadSave();
updateCam(0);
startLoop();
// automated-test hooks (only used by the test harness)
window.__game = {
  W, P, GN, get b() { return { M1, M2, TRI, JEL, KB, PLANK, CUBE, BALL }; },
  step(n, deg) { W.manual = true; for (let i = 0; i < n; i++) { if (deg !== undefined) { W.drag = deg === null ? null : { side: deg < 0 ? 'L' : 'R', id: -1 }; W.tTarget = deg === null ? 0 : deg * Math.PI / 180; if (deg === null) W.drag = null; W.lastInput = W.t; } update(1 / 60); } },
  auto() { W.manual = false; },
  toScreen, toLocal, gripAt,
};
