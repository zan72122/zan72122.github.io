<script>
(()=>{'use strict';
/* =========================================================
   くじらのすけすけおなかと、海のおやつ大パーティー
   透明セロファン重ね貼り絵ふうの、さわって発見するおやつ工場
   ========================================================= */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const NOISE=new Float32Array(4096);for(let i=0;i<4096;i++)NOISE[i]=Math.random()*2-1;
const nz1=i=>NOISE[(i|0)&4095];

let W=1,H=1,DPR=1;const SA={t:0,r:0,b:0,l:0};
let T=0;          // game clock (seconds)
let TS=1;         // time scale (tests)

/* ---------------- stage geometry (whale interior, 900x800) ---------------- */
const ST={w:900,h:800};
const MOUTH=[112,512];
const THROAT=[[112,512],[160,500],[184,440],[190,360],[205,292],[245,256]];
const MY=256, RT=400, RB=615;
const RM={
  bread:{x0:305,x1:445,cx:375,col:'255,206,110',ln:'#9a6a18'},
  fruit:{x0:461,x1:601,cx:531,col:'255,138,170',ln:'#b0405f'},
  cream:{x0:617,x1:757,cx:687,col:'140,195,255',ln:'#3a6ea8'}};
const WIN1=[453,566],WIN2=[609,540];
const TOWER={x:256,lh:30,w:58};
const CELLAR={x:540,y:708,rx:200,ry:48};
const GEAR1=[412,326],GEAR2=[456,302],GEAR3=[372,330];
const PERCH=[453,388];
const EYE=[128,336],CHEEK=[170,436],NOSE=[64,398];
const HATCH=[531,584];
const SECRET=[[687,MY],[742,MY],[778,288],[778,520],[748,612],[690,668]];
const RETURN_Y=RB+27;
const CAP=8;
const KIND={berry:'fruit',banana:'fruit',rainbow:'fruit',bread:'bread',cream:'cream'};
const BASES=['berry','banana','bread','cream'];
const DISH_IDS=['jam','roll','parfS','parfB','parfR','tower','bun','cake','sando','giant'];
const DCOL={jam:'#ef4a6a',roll:'#ffcf3a',parfS:'#ff6f91',parfB:'#ffd84a',parfR:'#b48cff',tower:'#e8a050',bun:'#f0b860',cake:'#ff9fb5',sando:'#ffe08a',giant:'#8fcaff'};

/* ---------------- layout ---------------- */
let L={};
function readSA(){try{const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function computeLayout(){
  const x0=SA.l,y0=SA.t,aw=Math.max(50,W-SA.l-SA.r),ah=Math.max(50,H-SA.t-SA.b);
  const portrait=aw<ah*1.02;
  L={portrait,x0,y0,aw,ah};
  if(portrait){
    const trayH=clamp(ah*.19,104,230);
    const cx0=48,cw=812;
    const s=Math.min(aw/cw,(ah-trayH-80)/ST.h);
    const stH=ST.h*s;
    const shelfH=clamp(ah-trayH-stH,70,128);
    const gap=Math.max(0,ah-trayH-stH-shelfH);
    L.s=s;L.ox=x0+(aw-cw*s)/2-cx0*s;L.oy=y0+shelfH+gap*.3;
    L.shelf={x:x0+10,y:y0+6+gap*.15,w:aw-20,h:shelfH-12};
    const fr=Math.min(aw/9.2,trayH*.31);
    L.fr=fr;L.trayRect={x:x0,y:y0+ah-trayH,w:aw,h:trayH};
    L.tray=[0,1,2,3].map(i=>({x:x0+aw*(i+.5)/4,y:y0+ah-trayH*.5}));
  }else{
    const trayW=clamp(aw*.17,110,240);
    const shelfH=clamp(ah*.15,64,140);
    const areaX=x0+trayW,areaW=aw-trayW,areaH=ah-shelfH;
    const s=Math.min(areaW/ST.w,areaH/ST.h);
    L.s=s;L.ox=areaX+(areaW-ST.w*s)/2;L.oy=y0+shelfH+(areaH-ST.h*s)/2;
    L.shelf={x:areaX+10,y:y0+6,w:areaW-20,h:shelfH-10};
    const fr=Math.min(trayW*.3,ah/10.5);
    L.fr=fr;L.trayRect={x:x0,y:y0,w:trayW,h:ah};
    L.tray=[0,1,2,3].map(i=>({x:x0+trayW*.5,y:y0+ah*(i+.5)/4}));
  }
  computePartyGeom();
}
const toScr=(x,y,tf)=>{tf=tf||L;return [tf.ox+x*tf.s,tf.oy+y*tf.s];};
const toStage=(x,y,tf)=>{tf=tf||L;return [(x-tf.ox)/tf.s,(y-tf.oy)/tf.s];};

/* ---------------- audio (Web Audio synth) ---------------- */
let AC=null,MG=null,NB=null;
function audioInit(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();MG=AC.createGain();MG.gain.value=.55;const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);}
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){AC=null;}
}
function aok(){return AC&&AC.state!=='closed';}
function tone(f,d,type,v,w,slide){
  if(!aok())return;
  try{const t=AC.currentTime+(w||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05);}catch(e){}
}
function noise(d,v,f,w,q,f2,att){
  if(!aok())return;
  try{const t=AC.currentTime+(w||0);
    if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.setValueAtTime(f,t);
    if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t+d);bf.Q.value=q||1;const g=AC.createGain();
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(att||Math.min(.04,d*.3)));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(bf);bf.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.05);}catch(e){}
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28];
const nf=s=>523.25*Math.pow(2,s/12);
const SFX={
  squish(){tone(420,.13,'sine',.16,0,1.8);tone(840,.06,'triangle',.04,.03);},
  pop(){tone(330,.22,'sine',.32,0,.42);tone(990,.06,'triangle',.06,.01);},
  bump(){tone(760+Math.random()*520,.045,'triangle',.045);},
  land(n){const f=nf(PENTA[Math.min(n,PENTA.length-1)]-12);tone(f,.32,'sine',.2);tone(f*2,.16,'triangle',.05,.02);noise(.1,.04,900);},
  success(){[0,4,7,12].forEach((s,i)=>tone(nf(s),.36,'triangle',.13,i*.075));tone(nf(16),.7,'sine',.1,.3);tone(nf(19),.7,'sine',.06,.38);},
  giggle(){for(let i=0;i<8;i++)tone(620+(i%2?190:0)+i*18,.09,'sine',.12,i*.085,1.25);},
  whee(){tone(360,.7,'sine',.15,0,2.6);},
  munch(){for(let i=0;i<3;i++)noise(.07,.13,1500,i*.13,2);},
  flow(){tone(420+Math.random()*80,.25,'sine',.07,0,1.6);},
  sparkle(){tone(nf(19),.22,'sine',.06);tone(nf(24),.26,'sine',.05,.06);},
  inhale(){noise(1.3,.12,280,0,1.2,1600,1.1);tone(220,1.3,'sine',.04,0,2);},
  sneeze(){noise(.55,.32,1150,0,.8,420);tone(300,.45,'triangle',.16,0,.45);tone(180,.5,'sine',.15,.05,.6);},
  boom(i){tone(240+i*50,.45,'sine',.11,0,3.2);noise(.35,.05,3200,.06,1.5);tone(nf(PENTA[(i*3)%9]+12),.3,'sine',.05,.1);},
  wobble(){tone(260,.16,'sine',.07,0,1.35);},
  open(){tone(640,.1,'triangle',.06,0,1.4);},
  tick(){tone(1250,.03,'square',.018);},
  chomp(){tone(210,.12,'square',.04,0,.6);noise(.08,.06,700);},
  bubble(){tone(500+Math.random()*400,.08,'sine',.06,0,1.8);},
  love(){[7,12,16,19,24].forEach((s,i)=>tone(nf(s),.3,'sine',.1,i*.06));},
  hum(){tone(nf(-5),.4,'sine',.06,0,1.05);}
};
let musicT=0,musicI=0;
const MEL=[0,4,7,4,9,7,4,2,0,2,4,7,12,9,7,4];
function musicTick(dt){
  if(!aok()||AC.state!=='running')return;
  musicT-=dt;if(musicT>0)return;
  const party=G.scene==='party';
  musicT=party?.32:.62;
  const n=MEL[musicI%MEL.length];musicI++;
  tone(nf(n+(party?0:-12)),party?.35:.6,'sine',party?.045:.03);
  if(musicI%4===0)tone(nf(n-12-(party?0:12)),.7,'triangle',.025);
}

/* ---------------- drawing primitives (cellophane / pencil) ---------------- */
function cello(fill,line,lw){
  const ga=ctx.globalAlpha;ctx.fillStyle=fill;ctx.fill();
  if(line){ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=line;ctx.lineWidth=lw;ctx.globalAlpha=ga*.85;ctx.stroke();ctx.lineWidth=lw*2.6;ctx.globalAlpha=ga*.1;ctx.stroke();ctx.globalAlpha=ga;}
}
function pencil(line,lw,a){const ga=ctx.globalAlpha;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=line;ctx.lineWidth=lw;ctx.globalAlpha=ga*(a==null?.85:a);ctx.stroke();ctx.globalAlpha=ga;}
function blob(cx,cy,rx,ry,seed,amp,n,rot){
  n=n||12;amp=amp==null?.06:amp;rot=rot||0;rx=Math.max(.01,rx);ry=Math.max(.01,ry);
  const xs=[],ys=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+rot;const k=1+nz1(seed*37+i)*amp;xs.push(cx+Math.cos(a)*rx*k);ys.push(cy+Math.sin(a)*ry*k);}
  ctx.beginPath();ctx.moveTo((xs[n-1]+xs[0])/2,(ys[n-1]+ys[0])/2);
  for(let i=0;i<n;i++){const j=(i+1)%n;ctx.quadraticCurveTo(xs[i],ys[i],(xs[i]+xs[j])/2,(ys[i]+ys[j])/2);}
  ctx.closePath();
}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(.01,r),0,TAU);}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);}
function shine(x,y,rx,ry,rot,a){ell(x,y,rx,ry,rot);ctx.fillStyle='rgba(255,255,255,'+(a||.35)+')';ctx.fill();}
function tube(pts,w,alpha,glow){
  if(alpha<=0.01)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.lineJoin='round';ctx.lineCap='round';
  poly(pts);ctx.strokeStyle='rgba(40,90,150,.55)';ctx.lineWidth=w+6;ctx.stroke();
  ctx.strokeStyle=glow?'rgba(255,248,200,.86)':'rgba(222,244,255,.78)';ctx.lineWidth=w;ctx.stroke();
  poly(pts.map(p=>[p[0]-w*.18,p[1]-w*.2]));ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=w*.16;ctx.stroke();
  ctx.restore();
}
function rainbowGrad(x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);['#ff6b8a','#ffb347','#ffe066','#7fe0a0','#7ab8ff','#c39bff'].forEach((c,i,a)=>g.addColorStop(i/(a.length-1),c));return g;}
function star(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i/10*TAU-Math.PI/2;const rr2=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}ctx.closePath();}
function heart(x,y,r){ctx.beginPath();ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*1.4,y,x-r*.7,y-r*1.1,x,y-r*.35);ctx.bezierCurveTo(x+r*.7,y-r*1.1,x+r*1.4,y,x,y+r*.9);ctx.closePath();}

/* ---------------- foods ---------------- */
const SEEDS=[[-.45,-.3],[0,-.4],[.45,-.3],[-.55,.08],[-.18,-.02],[.2,-.02],[.55,.08],[-.32,.36],[.05,.38],[.35,.38],[-.1,.66],[.15,.66]];
function berryPath(){ctx.beginPath();ctx.moveTo(0,.95);ctx.bezierCurveTo(-.85,.5,-1.02,-.5,-.42,-.62);ctx.bezierCurveTo(-.18,-.7,.18,-.7,.42,-.62);ctx.bezierCurveTo(1.02,-.5,.85,.5,0,.95);ctx.closePath();}
function fBerry(rb){
  berryPath();cello(rb?rainbowGrad(-1,-.7,1,.9):'rgba(238,58,86,.88)',rb?'#7a4fa0':'#9c1f38',.07);
  berryPath();ctx.save();ctx.clip();ell(.25,.35,.7,.55,0);ctx.fillStyle=rb?'rgba(255,255,255,.12)':'rgba(170,20,50,.22)';ctx.fill();ctx.restore();
  shine(-.4,-.18,.14,.28,-.4,.4);
  ctx.fillStyle=rb?'rgba(255,255,255,.95)':'#ffe28a';
  for(const s of SEEDS){ell(s[0],s[1],.045,.075,s[0]*.6);ctx.fill();}
  ctx.beginPath();const A=[-2.75,-2.15,-1.57,-1,-.4];
  for(const a of A){ctx.moveTo(0,-.62);ctx.quadraticCurveTo(Math.cos(a-.4)*.32,-.62+Math.sin(a-.4)*.22,Math.cos(a)*.5,-.58+Math.sin(a)*.3);ctx.quadraticCurveTo(Math.cos(a+.4)*.32,-.62+Math.sin(a+.4)*.22,0,-.62);}
  cello('rgba(84,184,92,.9)','#2f7a3a',.05);
  ctx.beginPath();ctx.moveTo(0,-.66);ctx.quadraticCurveTo(.05,-.85,.12,-.92);pencil('#2f7a3a',.07);
  if(rb){star(.55,-.55,.18,T*2);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();}
}
function fBanana(){
  ctx.beginPath();ctx.moveTo(-.92,-.42);ctx.bezierCurveTo(-.58,.78,.45,.86,.96,-.2);ctx.bezierCurveTo(.6,.36,-.3,.4,-.62,-.5);ctx.closePath();
  cello('rgba(255,212,56,.9)','#a8780c',.07);
  ctx.beginPath();ctx.moveTo(-.84,-.36);ctx.bezierCurveTo(-.5,.55,.4,.6,.9,-.14);ctx.bezierCurveTo(.5,.66,-.55,.6,-.84,-.36);ctx.fillStyle='rgba(230,160,20,.3)';ctx.fill();
  ctx.beginPath();ctx.moveTo(-.7,-.3);ctx.bezierCurveTo(-.4,.4,.35,.45,.82,-.12);pencil('rgba(190,140,20,.6)',.035);
  ell(-.82,-.48,.11,.08,.4);cello('rgba(120,86,40,.95)',null);
  ell(.95,-.2,.06,.05,0);cello('rgba(90,64,30,.95)',null);
  shine(-.2,.18,.28,.07,.35,.45);
}
function breadPath(k){ctx.beginPath();ctx.moveTo(-.72*k,.78*k);ctx.lineTo(-.74*k,-.1*k);ctx.bezierCurveTo(-1*k,-.35*k,-.86*k,-.9*k,-.4*k,-.8*k);ctx.bezierCurveTo(-.15*k,-.98*k,.15*k,-.98*k,.4*k,-.8*k);ctx.bezierCurveTo(.86*k,-.9*k,1*k,-.35*k,.74*k,-.1*k);ctx.lineTo(.72*k,.78*k);ctx.quadraticCurveTo(0,.88*k,-.72*k,.78*k);ctx.closePath();}
function fBread(){
  breadPath(1);cello('rgba(200,124,46,.92)','#7a4a1a',.07);
  ctx.save();ctx.translate(0,.06);breadPath(.78);cello('rgba(255,238,196,.96)','rgba(190,140,70,.55)',.035);ctx.restore();
  ctx.fillStyle='rgba(222,180,110,.55)';
  [[-.3,-.2],[.25,-.35],[.1,.2],[-.25,.4],[.35,.45]].forEach(p=>{ell(p[0],p[1],.06,.04,.3);ctx.fill();});
  shine(-.45,-.55,.18,.08,-.5,.35);
}
function fCream(){
  ctx.beginPath();ctx.moveTo(-.64,.22);ctx.lineTo(.64,.22);ctx.lineTo(.46,.94);ctx.lineTo(-.46,.94);ctx.closePath();
  cello('rgba(100,170,240,.75)','#3a6ea8',.06);
  ctx.beginPath();for(let i=-2;i<=2;i++){ctx.moveTo(i*.22,.26);ctx.lineTo(i*.16,.9);}pencil('rgba(255,255,255,.55)',.05);
  const tiers=[[0,.12,.74,.25],[0,-.18,.57,.22],[0,-.44,.38,.18]];
  for(const t of tiers){ell(t[0],t[1],t[2],t[3],0);cello('rgba(255,252,246,.96)','#8aa6c8',.05);}
  ctx.beginPath();ctx.moveTo(-.2,-.5);ctx.quadraticCurveTo(-.02,-.98,.16,-.98);ctx.quadraticCurveTo(.05,-.7,.2,-.5);ctx.closePath();cello('rgba(255,252,246,.98)','#8aa6c8',.05);
  ctx.beginPath();ctx.moveTo(-.55,.08);ctx.quadraticCurveTo(0,.25,.5,.02);ctx.moveTo(-.4,-.24);ctx.quadraticCurveTo(0,-.08,.4,-.25);pencil('rgba(140,170,210,.6)',.035);
  shine(-.3,-.25,.12,.06,-.3,.6);
}
function drawFood(type,x,y,r,o){
  ctx.save();ctx.translate(x,y);
  if(o){if(o.rot)ctx.rotate(o.rot);if(o.sx||o.sy)ctx.scale(o.sx||1,o.sy||1);if(o.a!=null)ctx.globalAlpha*=o.a;}
  ctx.scale(r,r);
  if(type==='berry')fBerry(false);else if(type==='rainbow')fBerry(true);else if(type==='banana')fBanana();else if(type==='bread')fBread();else if(type==='cream')fCream();
  ctx.restore();
}

/* ---------------- dishes ---------------- */
function triPath(y,k){ctx.beginPath();ctx.moveTo(-.85*k,y+.5*k);ctx.quadraticCurveTo(-.95*k,y+.62*k,-.75*k,y+.62*k);ctx.lineTo(.75*k,y+.62*k);ctx.quadraticCurveTo(.95*k,y+.62*k,.85*k,y+.5*k);ctx.lineTo(.08*k,y-.72*k);ctx.quadraticCurveTo(0,y-.82*k,-.08*k,y-.72*k);ctx.closePath();}
function dJam(rb){
  triPath(.12,1);cello('rgba(205,135,60,.92)','#7a4a1a',.06);
  ctx.beginPath();ctx.moveTo(-.86,.56);for(let i=0;i<=8;i++){ctx.lineTo(-.86+i*.215,.6+(i%2?.12:0));}ctx.lineTo(.86,.5);ctx.lineTo(-.86,.5);ctx.closePath();
  cello(rb?rainbowGrad(-.9,0,.9,0):'rgba(225,30,70,.9)',rb?'#7a4fa0':'#8a1030',.04);
  triPath(-.02,1);cello('rgba(200,124,46,.95)','#7a4a1a',.06);
  triPath(.02,.8);cello('rgba(255,236,196,.97)',null);
  ell(-.15,.12,.12,.08,0);ctx.fillStyle=rb?'rgba(180,140,255,.6)':'rgba(230,40,80,.45)';ctx.fill();
  shine(-.3,-.1,.08,.18,.5,.4);
}
function dRoll(){
  ell(0,0,.88,.86,0);cello('rgba(196,120,44,.92)','#7a4a1a',.06);
  ell(0,0,.74,.72,0);cello('rgba(255,240,205,.97)',null);
  ctx.beginPath();for(let a=0;a<TAU*2.2;a+=.2){const r=.12+a*.045;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}pencil('rgba(200,150,80,.85)',.07);

/* ---------------- background textures ---------------- */
let FBG=null,PBG=null,GRAIN=null;
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));const g=c.getContext('2d');g.scale(DPR,DPR);return [c,g];}
function grain(g,w,h,n){
  for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?'rgba(120,100,70,.05)':'rgba(255,255,255,.12)';const x=Math.random()*w,y=Math.random()*h;g.fillRect(x,y,1+Math.random()*2,1+Math.random()*1.5);}
  g.strokeStyle='rgba(150,130,100,.05)';g.lineWidth=1;for(let i=0;i<n/40;i++){const x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);g.lineTo(x+rand(-14,14),y+rand(-5,5));g.stroke();}
}
function paperBlob(g,cx,cy,rx,ry,fill,seed){
  const n=11,xs=[],ys=[];for(let i=0;i<n;i++){const a=i/n*TAU;const k=1+nz1(seed*13+i)*.12;xs.push(cx+Math.cos(a)*rx*k);ys.push(cy+Math.sin(a)*ry*k);}
  g.beginPath();g.moveTo((xs[n-1]+xs[0])/2,(ys[n-1]+ys[0])/2);for(let i=0;i<n;i++){const j=(i+1)%n;g.quadraticCurveTo(xs[i],ys[i],(xs[i]+xs[j])/2,(ys[i]+ys[j])/2);}g.closePath();g.fillStyle=fill;g.fill();
}
function buildBG(){
  // factory: underwater paper
  let [c,g]=makeCanvas(W,H);
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#cdeef2');gr.addColorStop(.6,'#d9f0e8');gr.addColorStop(1,'#efeedd');g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<7;i++)paperBlob(g,rand(0,W),rand(0,H*.7),rand(60,180),rand(40,110),'rgba(150,210,235,.18)',i+3);
  for(let i=0;i<5;i++)paperBlob(g,rand(0,W),rand(H*.4,H),rand(60,160),rand(30,80),'rgba(255,200,220,.12)',i+20);
  // seaweed
  g.lineCap='round';
  for(let i=0;i<9;i++){const x=(i<5?rand(0,W*.18):rand(W*.82,W));const h=rand(H*.12,H*.3);g.strokeStyle=pick(['rgba(110,200,140,.35)','rgba(90,180,160,.3)','rgba(160,215,120,.3)']);g.lineWidth=rand(10,20);g.beginPath();g.moveTo(x,H);for(let k=1;k<=6;k++)g.lineTo(x+Math.sin(k*1.3+i)*14,H-h*k/6);g.stroke();}
  // sand
  g.fillStyle='rgba(240,222,180,.5)';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=W/10)g.lineTo(x,H-18-Math.sin(x*.02)*8);g.lineTo(W,H);g.closePath();g.fill();
  grain(g,W,H,Math.min(9000,W*H/90));
  FBG=c;
  // party: beach
  [c,g]=makeCanvas(W,H);
  const hz=PG.hz;
  gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#ffe6ef');gr.addColorStop(1,'#fff6da');g.fillStyle=gr;g.fillRect(0,0,W,hz+2);

  const sea=['rgba(120,190,240,.75)','rgba(100,175,230,.55)','rgba(140,215,235,.5)','rgba(90,160,225,.45)'];
  const seaB=PG.sand;
  g.fillStyle='#bfe3f4';g.fillRect(0,hz,W,seaB-hz+4);
  sea.forEach((col,i)=>{const y=hz+(seaB-hz)*i/4;g.fillStyle=col;g.beginPath();g.moveTo(0,y);for(let x=0;x<=W+20;x+=20)g.lineTo(x,y+Math.sin(x*.03+i*2)*5);g.lineTo(W,seaB+10);g.lineTo(0,seaB+10);g.closePath();g.fill();});
  g.fillStyle='rgba(246,226,180,1)';g.beginPath();g.moveTo(0,seaB);for(let x=0;x<=W+20;x+=20)g.lineTo(x,seaB+Math.sin(x*.025)*8);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();for(let x=0;x<=W+20;x+=20)g.lineTo(x,seaB+Math.sin(x*.025)*8-3);for(let x=W+20;x>=0;x-=20)g.lineTo(x,seaB+Math.sin(x*.025)*8+5);g.closePath();g.fill();
  for(let i=0;i<40;i++){g.fillStyle='rgba(200,170,120,.35)';g.fillRect(rand(0,W),rand(seaB+10,H),2,2);}
  for(let i=0;i<4;i++)paperBlob(g,rand(0,W),rand(seaB+20,H),rand(10,22),rand(8,14),pick(['rgba(255,170,190,.5)','rgba(255,220,150,.5)','rgba(200,220,255,.5)']),i+70);
  grain(g,W,H,Math.min(9000,W*H/90));

/* ---------------- particles ---------------- */
function addP(p){if(parts.length>=MAXP)parts.shift();p.age=0;parts.push(p);return p;}
function burst(x,y,n,cols,sp,space,opt){
  for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(sp*.3,sp);
    addP(Object.assign({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:rand(.6,1.1),sz:rand(4,9),col:pick(cols),sh:pick(['paper','paper','dot','star']),rot:rand(0,TAU),vr:rand(-6,6),g:sp*1.2,space:space||'stage'},opt||{}));}
}
function bubbleP(x,y,space,sz){addP({x,y,vx:rand(-10,10),vy:rand(-60,-30),life:rand(1,1.8),sz:sz||rand(4,9),col:'rgba(255,255,255,.7)',sh:'bubble',rot:0,vr:0,g:-10,space:space||'stage'});}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;
    if(p.home){const k=easeOut(p.age/p.life);p.x=lerp(p.sx,p.tx,k)+Math.sin(k*Math.PI)*p.arcx;p.y=lerp(p.sy,p.ty,k)-Math.sin(k*Math.PI)*p.arcy;}
    else{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*.8;}
    p.rot+=p.vr*dt;if(p.age>=p.life)parts.splice(i,1);}
}
function drawParts(space){
  for(const p of parts){if(p.space!==space)continue;const k=p.age/p.life;const a=p.home?1-Math.max(0,(k-.85)/.15):1-k*k;
    ctx.globalAlpha=clamp(a,0,1);
    if(p.sh==='bubble'){circ(p.x,p.y,p.sz);ctx.strokeStyle='rgba(120,180,230,.7)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();circ(p.x-p.sz*.35,p.y-p.sz*.35,p.sz*.25);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();}
    else if(p.sh==='star'){star(p.x,p.y,p.sz,p.rot);ctx.fillStyle=p.col;ctx.fill();}
    else if(p.sh==='dot'){circ(p.x,p.y,p.sz*.6);ctx.fillStyle=p.col;ctx.fill();}
    else if(p.sh==='heart'){heart(p.x,p.y,p.sz);ctx.fillStyle=p.col;ctx.fill();}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.beginPath();ctx.moveTo(-p.sz,-p.sz*.6);ctx.lineTo(p.sz*.9,-p.sz*.4);ctx.lineTo(p.sz*.6,p.sz*.7);ctx.lineTo(-p.sz*.8,p.sz*.5);ctx.closePath();ctx.fill();ctx.restore();}
  }
  ctx.globalAlpha=1;
}

/* ---------------- routes & travelers ---------------- */
const loafTop=()=>RB-14-G.loafs.length*22;
const foamTop=()=>RB-8-G.foamV*32;
const towerTop=()=>RB-G.tower.layers*TOWER.lh;
function routeFor(type){
  const k=KIND[type];const pts=THROAT.map(p=>p.slice());const evs={};let dest=k;let flip=false;
  if(k==='fruit'&&G.tower.layers>0&&!G.tower.closing){
    pts.push([TOWER.x,MY],[TOWER.x,towerTop()-24]);dest='tower';G.tower.closing=true;
  }else if(G.fill[k]>=CAP){
    pts.push([375,MY],[531,MY]);
    for(const p of SECRET)pts.push(p.slice());
    evs[pts.length-SECRET.length+1]=()=>{G.secretFlash=1;SFX.open();};
    pts.push([CELLAR.x+rand(-50,50),CELLAR.y-6]);dest='secret';
  }else if(type==='bread'&&G.flipped){
    flip=true;
    pts.push([375,MY],[531,MY],[687,MY],[687,RT-6]);
    pts.push([687,Math.max(RT+20,foamTop()+4)]);evs[pts.length-1]=tr=>{if(G.foam>0){tr.coat=true;G.foam--;burst(687,foamTop(),8,['rgba(255,255,255,.95)','rgba(200,225,255,.9)'],120);SFX.flow();}};
    pts.push([687,RB-4],[687,RETURN_Y]);
    pts.push([531,RETURN_Y]);evs[pts.length-1]=tr=>pickFruit(tr);
    pts.push([375,RETURN_Y],[375,RB-2],[375,Math.max(RT+30,loafTop()-6)]);
    G.flipT=1;
  }else{
    const cx=RM[k].cx;const ly=k==='bread'?loafTop()-4:k==='fruit'?HATCH[1]-10:foamTop()-10;
    pts.push([cx,MY],[cx,RT-6],[cx,Math.max(RT+20,ly)]);
  }
  return {pts,evs,dest,flip};
}
function pickFruit(tr){
  if(!G.fruits.length)return;
  const f=G.fruits.pop();tr.fruit=f.type;G.roomWob.fruit=1;
  addP({x:HATCH[0],y:HATCH[1],sx:HATCH[0],sy:HATCH[1],tx:531,ty:RETURN_Y,home:true,arcx:0,arcy:-10,life:.35,sz:10,col:f.type==='banana'?'rgba(255,212,56,.9)':'rgba(238,58,86,.9)',sh:'dot',rot:0,vr:0,space:'stage'});
  SFX.flow();
}
function eat(type,sx,sy){
  // sx,sy in screen; spawn traveler at mouth
  WH.chew=1;WH.mo=1;WH.happy=Math.max(WH.happy,.4);SFX.pop();
  const r=routeFor(type);
  const tr={type,pts:r.pts,evs:r.evs,dest:r.dest,flip:r.flip,seg:0,u:0,x:r.pts[0][0],y:r.pts[0][1],v:330,rot:0,sq:0,coat:false,fruit:null,t:0};
  G.trav.push(tr);
  const [mx,my]=toScr(MOUTH[0],MOUTH[1]);burst(mx,my,8,['rgba(255,255,255,.9)','rgba(160,210,255,.8)'],160,'screen');
  if(KIND[type]==='fruit'&&type!=='banana'){G.streak++;}else G.streak=0;
  if(G.streak>=3){G.streak=0;after(.45,tickle);}
  if(type==='rainbow')disc('rainbow');

/* ---------------- hints ---------------- */
let hintCache=null,hintT=-9;
function hintType(){
  if(hintCache&&T-hintT<.5)return hintCache;
  hintCache=hintCalc();hintT=T;return hintCache;
}
function hintCalc(){
  // projected state: ingredients still rolling in the pipes count as already arrived
  const d=G.disc;let top=G.fruits.length?G.fruits[G.fruits.length-1].type:null;let foam=G.foam;
  let nf=G.fruits.length;
  for(const tr of G.trav){const k=KIND[tr.type];if(tr.dest==='fruit'){top=tr.type;nf++;}else if(tr.dest==='cream')foam++;else if(k==='bread'&&tr.dest==='bread'&&nf>0){nf--;}}
  while(foam>=2&&nf>0){foam--;nf--;}
  if(nf<=0)top=null;
  const f=G.fill;const bOK=f.bread<CAP,fOK=f.fruit<CAP,cOK=f.cream<CAP;
  if(bOK&&fOK){
    if(!d.jam)return top?'bread':'berry';
    if(!d.roll)return top==='banana'?'bread':(top?'bread':'banana');
  }
  if(fOK&&(cOK||foam>=2)){
    if(!d.parfS&&!d.parfR)return foam<2?'cream':'berry';
    if(!d.parfB)return foam<2?'cream':'banana';
  }
  if(!d.tickle&&bOK)return 'berry';
  if(bOK&&G.flipped&&!d.creamRoute)return (foam<1&&cOK)?'cream':'bread';
  if(bOK&&!d.tower)return 'bread';
  if(!d.towerDeco&&G.tower.layers>0)return 'banana';
  if(!d.tickle)return 'berry';
  if(!d.overflow){let best='bread';for(const k of ['fruit','cream'])if(f[k]>f[best])best=k;return best==='fruit'?'berry':best;}
  let least='bread';for(const k of ['fruit','cream'])if(f[k]<f[least])least=k;
  return least==='fruit'?(G.hintCycle++%2?'banana':'berry'):least;
}
function hintItem(){
  if(G.scene==='factory'){
    const ht=hintType();
    for(const it of G.items)if(it.kind==='food'&&it.phase==='idle'&&(it.type===ht||(ht==='berry'&&it.type==='rainbow')))return it;
    for(const it of G.items)if(it.kind==='food'&&it.phase==='idle'&&KIND[it.type]===KIND[ht])return it;
    return null;
  }
  if(G.scene==='party'&&P){
    if(P.ending){for(const it of G.items)if(it.kind==='food'&&it.phase==='idle')return it;return null;}
    const a=focusAnimal();if(!a)return null;
    for(const it of G.items)if(it.kind==='dish'&&it.phase==='idle'&&it.dish.type===a.want)return it;
  }
  return null;
}

const holds=new Map();
function grab(it,e,px,py){
  it.phase='drag';it.pid=e.pointerId;it.s=-.38;it.sv=0;it.t=0;
  it.offx=it.x-px;it.offy=it.y-py;
  holds.set(e.pointerId,it);SFX.squish();
  if(!G.firstTouch){G.firstTouch=true;}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
}
function releaseBack(it){
  if(it.slot==null&&it.kind==='food'&&!it.stand){ // hatch fruit: return to tray slot
    const base=it.type==='rainbow'?0:BASES.indexOf(it.type);
    if(base>=0&&!G.slots[base]){it.slot=base;G.slots[base]=it;}
    else{it.phase='gone';burst(it.x,it.y,8,['rgba(255,255,255,.9)','rgba(255,200,220,.9)'],120,'screen');return;}
  }
  it.phase='back';it.t=0;it.bx=it.x;it.by=it.y;it.pid=null;SFX.wobble();
}
function cancelHolds(){for(const [,it] of holds){if(it.phase==='drag')releaseBack(it);}holds.clear();}
function evPos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function inHead(sx,sy,tf){const [x,y]=toStage(sx,sy,tf);return dist(x,y,MOUTH[0],MOUTH[1])<150||(((x-175)/155)**2+((y-430)/210)**2<1);}
function onDown(e){
  e.preventDefault();audioInit();G.idle=0;
  if(G.demo)G.demo=null;
  const [px,py]=evPos(e);
  if(holds.has(e.pointerId))return;
  if(G.scene==='sneeze'||G.scene==='dive'){bubbleP(px,py,'screen',8);SFX.bubble();return;}
  // items
  let best=null,bd=1e9;
  for(const it of G.items){if(it.phase==='drag'||it.phase==='gone')continue;const d=dist(px,py,it.x,it.y);if(d<it.r*1.35&&d<bd){bd=d;best=it;}}
  if(best){grab(best,e,px,py);return;}
  if(G.scene==='factory'){
    const [sx,sy]=toStage(px,py);
    // hatch fruit
    if(G.fruits.length&&dist(sx,sy,HATCH[0],HATCH[1])<46&&!G.cooks.some(c=>c.type[0]==='p')){
      const f=G.fruits.pop();G.hatch=1;SFX.open();disc('swap');
      const it={type:f.type,kind:'food',slot:null,x:px,y:py,phase:'drag',t:0,s:0,sv:0,lift:0,pid:null,r:L.fr,rot:0,src:'hatch'};
      G.items.push(it);grab(it,e,px,py);it.offx=0;it.offy=0;return;
    }
    // small reactions only
    if(inHead(px,py)){WH.wig=.6;WH.mo=.5;SFX.hum();bubbleP(px,py,'screen',7);return;}
    for(const k of ['bread','fruit','cream']){const R=RM[k];if(sx>R.x0&&sx<R.x1&&sy>RT&&sy<RB){G.roomWob[k]=.6;SFX.wobble();bubbleP(px,py,'screen',6);return;}}
    if(sx>60&&sx<850&&sy>80&&sy<780){WH.wig=.35;SFX.wobble();bubbleP(px,py,'screen',6);return;}
  }
  if(G.scene==='party'&&P){for(const a of P.animals){if(dist(px,py,a.x,a.y)<PG.R){if(!a.react){a.react='like';a.rt=.5;}SFX.hum();return;}}}
  bubbleP(px,py,'screen',8);bubbleP(px+6,py-4,'screen',5);SFX.bubble();
}
function onMove(e){
  const it=holds.get(e.pointerId);if(!it)return;e.preventDefault();
  const [px,py]=evPos(e);G.idle=0;
  it.x=clamp(px+it.offx*.5,it.r*.5,W-it.r*.5);it.y=clamp(py+it.offy*.5-it.r*.25,it.r*.5,H-it.r*.5);
}
function onUp(e){
  const it=holds.get(e.pointerId);if(!it)return;holds.delete(e.pointerId);
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(it.phase!=='drag')return;
  if(e.type==='pointercancel'){releaseBack(it);return;}
  if(G.scene==='factory'&&it.kind==='food'&&inHead(it.x,it.y)){
    it.phase='gone';if(it.slot!=null){G.slots[it.slot]=null;refill(it.slot,.55);}
    eat(it.type,it.x,it.y);return;
  }
  if(G.scene==='party'&&P){
    const pw=PW();
    if(inHead(it.x,it.y,pw)||dist(it.x,it.y,...toScr(450,400,pw))<PG.ws*300){
      if(it.kind==='food'||!P.ending){it.phase='gone';if(it.slot!=null)G.slots[it.slot]=null;if(it.stand)it.stand.pop=-.8;feedWhale(it);return;}
    }

      if(best){it.phase='gone';if(it.stand)it.stand.pop=-.8;feedAnimal(best,it);return;}
    }
  }
  releaseBack(it);
}

const SKEY='kujira-oyatsu-fav-v1';
let storageState='init';
function loadFav(){
  try{
    const s=window.localStorage.getItem(SKEY);
    if(s==null){storageState='first';return null;}
    const o=JSON.parse(s);
    if(o&&typeof o==='object'&&typeof o.fav==='string'&&DISH_IDS.includes(o.fav)){storageState='restored';return {fav:o.fav,rb:!!o.rb};}
    storageState='corrupt';try{window.localStorage.removeItem(SKEY);}catch(_){}
    return null;
  }catch(e){

    try{window.localStorage.removeItem(SKEY);}catch(_){}
    return null;
  }
}

function update(dt){

  G.rbCool-=dt;
  for(let i=G.timers.length-1;i>=0;i--){if(T>=G.timers[i].t){const f=G.timers[i].fn;G.timers.splice(i,1);f();}}
  // whale
  WH.blink-=dt;WH.nextBlink-=dt;if(WH.nextBlink<=0){WH.blink=.16;WH.nextBlink=rand(2,4.5);}
  WH.happy=Math.max(0,WH.happy-dt*.9);WH.giggle=Math.max(0,WH.giggle-dt);WH.wig=Math.max(WH.giggle>0?.6:0,WH.wig-dt*1.2);WH.chew=Math.max(0,WH.chew-dt*1.3);WH.jump=Math.max(0,WH.jump-dt*1.5);WH.spout=Math.max(0,WH.spout-dt*.5);

  G.gear+=G.gearV*dt;G.gearV=lerp(G.gearV,.4,dt*.8);

  G.flipT=Math.max(0,G.flipT-dt*.5);G.secretFlash=Math.max(0,G.secretFlash-dt);G.shake=Math.max(0,G.shake-dt*2);
  G.w1t=Math.max(0,G.w1t-dt);G.w1=lerp(G.w1,G.w1t>0?1:0,dt*8);G.w2=lerp(G.w2,G.foam>=2?1:0,dt*4);
  G.hatch=Math.max(0,G.hatch-dt*1.5);G.tower.bump=Math.max(0,G.tower.bump-dt*3);
  for(const k in G.roomWob)G.roomWob[k]=Math.max(0,G.roomWob[k]-dt*2);
  for(const k in G.fillV)G.fillV[k]=lerp(G.fillV[k],G.fill[k],dt*5);
  G.foamV=lerp(G.foamV,G.foam,dt*4);
  for(const d of G.shelf)if(d.ft<1)d.ft+=dt/.9;
  for(const f of G.fruits)f.t=Math.min(1,f.t+dt*3);for(const l of G.loafs)l.t=Math.min(1,l.t+dt*3);
  // gaze

  if(gx==null&&G.trav.length&&G.scene==='factory'){const tr=G.trav[G.trav.length-1];[gx,gy]=toScr(tr.x,tr.y);}
  if(gx==null){const h=hintItem();if(h){gx=h.x;gy=h.y;}}
  if(gx!=null){const [ex,ey]=toScr(EYE[0],EYE[1],tf);const dx=gx-ex,dy=gy-ey;const d=Math.hypot(dx,dy)||1;WH.gx=lerp(WH.gx,dx/d,dt*8);WH.gy=lerp(WH.gy,dy/d,dt*8);}
  // anticipation

  WH.expect=lerp(WH.expect,ex2,dt*8);
  const baseMo=G.scene==='factory'?.18+Math.max(0,Math.sin(T*2.2))*.12:.1;
  if(WH.chew<=0)WH.mo=lerp(WH.mo,Math.max(baseMo,WH.expect*1.05,WH.want*.8),dt*6);
  if(G.scene==='factory'){
    if(!G.slots.some(s=>s)&&!G.items.length)initTray();

    if(G.foam>=2&&!G.cooks.length){G.foamFlowT-=dt;if(G.foamFlowT<=0){G.foamFlowT=.35;addP({x:WIN2[0]+8,y:WIN2[1],vx:rand(-40,-20),vy:rand(-5,5),life:.7,sz:rand(4,7),col:'rgba(255,255,255,.9)',sh:'bubble2',rot:0,vr:0,g:10,space:'stage'});}}
    if(Math.random()<dt*.6){const [x,y]=toScr(rand(120,780),rand(120,700));bubbleP(x,y,'screen',rand(3,6));}

    if(P){drawParty(1-k);}
    const pw=PW();const s=lerp(pw.s,L.s,k);const cx=lerp(pw.ox+450*pw.s,L.ox+450*L.s,k),cy=lerp(pw.oy+430*pw.s,L.oy+430*L.s,k);
    drawWhale({s,ox:cx-450*s,oy:cy-430*s},k);
  }
  drawItems();
  drawParts('screen');
  if(G.scene==='factory')drawDemo();
  drawFingerHint();
  ctx.restore();
}
function frame(ts){
  if(!running)return;
  raf=requestAnimationFrame(frame);
  let dt=last?(ts-last)/1000:1/60;last=ts;dt=clamp(dt,0,1/20)*TS;
  try{
    // large time-scale steps are subdivided for stable physics
    let rem=dt;while(rem>0){const s=Math.min(rem,1/30);update(s);rem-=s;}
    draw();
  }catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
}
function start(){if(running)return;running=true;last=0;raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();cancelHolds();try{if(AC&&AC.state==='running')AC.suspend();}catch(_){}}
  else{try{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}catch(_){}start();}
});
window.addEventListener('pagehide',()=>{stop();cancelHolds();});
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
let rzT=0;
function onResize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();computeLayout();buildBG();if(P)layoutParty();
  for(const it of G.items){if(it.phase==='drag'){it.x=clamp(it.x,0,W);it.y=clamp(it.y,0,H);}}
}
window.addEventListener('resize',()=>{clearTimeout(rzT);onResize();rzT=setTimeout(onResize,250);});
window.addEventListener('orientationchange',()=>setTimeout(onResize,300));

/* ---------------- boot ---------------- */
G.memory=loadFav();
onResize();initTray();start();

/* test / inspection hook (no effect on play) */
window.__wsf={G,P:()=>P,L:()=>L,PG:()=>PG,WH,OT,setTS:v=>{TS=v;},storage:()=>storageState,
  traySlot:t=>{const it=G.items.find(i=>i.kind==='food'&&i.type===t&&i.phase==='idle');return it?[it.x,it.y]:null;},
  mouth:()=>mouthScreen(),hatch:()=>toScr(HATCH[0],HATCH[1]),hint:()=>{const h=hintItem();return h?{type:h.type,kind:h.kind,x:h.x,y:h.y,dish:h.dish&&h.dish.type}:null;},
  dishItem:t=>{const it=G.items.find(i=>i.kind==='dish'&&i.dish.type===t&&i.phase==='idle');return it?[it.x,it.y]:null;},
  animals:()=>P?P.animals.map(a=>({id:a.id,x:a.x,y:a.y,want:a.want,react:a.react,fed:a.fed})):[],
  forceRainbow:()=>{const i=0;const it=G.slots[i];if(it){it.type='rainbow';}},
  scene:()=>G.scene};
})();
</script>
