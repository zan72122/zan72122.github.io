// ============================================================
//  ループ
// ============================================================
function update(dt) {
  T += dt;
  updateTrain(dt);
  updateRain(dt);
  simWater(dt);
  updatePond(dt);
  updateWheel(dt);
  updatePlaza(dt);
  updateBerries(dt);
  updateRabbit(dt);
  updateBeds(dt);
  updateBird(dt);
  updateButterflies(dt);
  updateParts(dt);
  updateClimax(dt);

let raf = 0, last = 0, acc = 0, running = false, frames = 0;
