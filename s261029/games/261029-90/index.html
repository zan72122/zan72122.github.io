<script>
'use strict';
/* ===== テスト用ログ（smoke が読む） ===== */
window.__gf = window.__gf || {};
if (!Array.isArray(window.__gf.log)) window.__gf.log = [];
function glog(o) { window.__gf.log.push(o); }

/* ===== 小道具 ===== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOutBack = (t, s) => { t = clamp(t, 0, 1); s = s == null ? 1.70158 : s; const u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let rnd = rng((Date.now() ^ 0x9e3779b9) >>> 0);
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const uiNow = () => performance.now() / 1000;
function hash32(n) { n = Math.imul(n ^ 0x5bd1e995, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0); }

/* ===== 演奏表現の定数 =====
 * BREATH_MS: k265.performance-reference.json の各フレーズ clock.knots（0.25拍刻み）から
 * 「理想時刻からのずれ(ms)」を抜き出したもの。A/Aprime と B/coda1 で形が違い、終止(coda2)だけゆるむ。
 * フレーズの総時間は（終止以外）楽譜どおり 4分=120 のまま。tempoControl=false に従い実行中に変えない。 */
const BREATH_MS = {
  A16: [0,-0.9,-1.7,-2.4,-3,-3.5,-4,-4.3,-4.6,-4.8,-5,-5.1,-5.1,-5.1,-5.1,-5.1,-5,-5,-5,-4.9,-5,-5,-5.1,-5.2,-5.5,-5.7,-6.1,-6.5,-7.1,-7.7,-8.4,-9.2,-10.1,-11.1,-12.2,-13.3,-14.6,-16,-17.5,-19,-20.6,-22.3,-24,-25.8,-27.5,-29.3,-31,-32.5,-33.9,-34.9,-35.5,-35.6,-35,-33.7,-31.7,-28.9,-25.6,-21.7,-17.7,-13.7,-9.9,-6.6,-3.8,-1.6,0],
  B16: [0,0,0.2,0.4,0.8,1.2,1.7,2.3,3,3.7,4.5,5.4,6.3,7.2,8.2,9.2,10.2,11.2,12.2,13.1,14.1,15,15.8,16.6,17.4,18.1,18.7,19.2,19.6,19.9,20.2,20.3,20.4,20.3,20.2,19.9,19.6,19.2,18.7,18.1,17.4,16.6,15.8,15,14.1,13.1,12.2,11.2,10.2,9.2,8.2,7.2,6.3,5.4,4.5,3.7,3,2.3,1.7,1.2,0.8,0.4,0.2,0,0],
  A24: [0,-0.9,-1.8,-2.5,-3.3,-3.9,-4.5,-5.1,-5.5,-6,-6.3,-6.6,-6.9,-7.1,-7.3,-7.5,-7.6,-7.6,-7.7,-7.7,-7.7,-7.7,-7.6,-7.6,-7.6,-7.5,-7.5,-7.4,-7.4,-7.4,-7.4,-7.5,-7.5,-7.6,-7.8,-8,-8.2,-8.5,-8.8,-9.1,-9.6,-10,-10.6,-11.2,-11.8,-12.6,-13.3,-14.2,-15.1,-16.1,-17.1,-18.2,-19.4,-20.6,-21.9,-23.3,-24.7,-26.2,-27.7,-29.3,-30.9,-32.6,-34.3,-36,-37.7,-39.5,-41.3,-43.1,-44.8,-46.5,-48,-49.5,-50.8,-51.9,-52.8,-53.3,-53.5,-53.3,-52.6,-51.4,-49.7,-47.5,-44.9,-41.8,-38.3,-34.6,-30.6,-26.6,-22.5,-18.6,-14.9,-11.5,-8.4,-5.7,-3.4,-1.5,0],
  B24: [0,0,0.1,0.3,0.5,0.8,1.2,1.6,2,2.6,3.2,3.8,4.5,5.2,6,6.8,7.6,8.5,9.4,10.4,11.3,12.3,13.3,14.3,15.3,16.3,17.3,18.3,19.2,20.2,21.1,22,22.9,23.8,24.6,25.4,26.1,26.8,27.4,28,28.5,29,29.4,29.7,30,30.3,30.4,30.5,30.6,30.5,30.4,30.3,30,29.7,29.4,29,28.5,28,27.4,26.8,26.1,25.4,24.6,23.8,22.9,22,21.1,20.2,19.2,18.3,17.3,16.3,15.3,14.3,13.3,12.3,11.3,10.4,9.4,8.5,7.6,6.8,6,5.2,4.5,3.8,3.2,2.6,2,1.6,1.2,0.8,0.5,0.3,0.1,0,0],
  END9: [0,-0.9,-1.5,-2.1,-2.5,-2.7,-2.8,-2.9,-2.9,-2.8,-2.8,-2.8,-2.8,-3,-3.2,-3.6,-4.1,-4.8,-5.7,-6.7,-7.9,-9.1,-9.5,-8.6,-5.4,0.6,10.4,24.8,44.9,71.7,106.2,149.1,201.1,262,332,411.2,500]
};
/* 「played」トラックの節ごとの平均ベロシティ比（未操作に対する倍率）。主題は弱く、華やかな変奏は強く。 */
const PLAY_LEVEL = { theme: 0.80, var1: 1.24, var3: 1.16, var7: 1.25, var10: 1.28, var8: 0.81, var12: 1.32 };
const SLOT_OF = { 'A.p1': 0, 'A.p2': 1, 'B.p1': 2, 'Aprime.p1': 3, 'B.p2': 4, 'Aprime.p2': 5, 'coda1.p1': 6, 'coda2.p1': 7 };
const SEC_TIER = { theme: 1, var3: 2, var10: 3, var7: 3, var1: 4, var12: 5, var8: 3 };

function breathMs(curve, b) {
  const arr = BREATH_MS[curve];
  if (!arr) return 0;
  const x = b / 0.25;
  if (x <= 0) return 0;
  const n = arr.length - 1;
  if (x >= n) return arr[n];
  const i = Math.floor(x), f = x - i;
  return arr[i] + (arr[i + 1] - arr[i]) * f;
}

/* ===== 音楽データ ===== */
const MUS = { ready: false };
let musicReadyResolve;
const musicReady = new Promise(r => { musicReadyResolve = r; });

async function loadMusic() {
  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
  const [music, notesJ, expr, smap] = await Promise.all([
    get('assets/music/music.json'), get('assets/music/k265.notes.json'),
    get('assets/music/k265.expression.json'), get('assets/piano/sample-map.json')]);
  buildMusic(music, notesJ, expr, smap);
  MUS.ready = true;
  musicReadyResolve();
}

function buildMusic(music, notesJ, expr, smap) {
  const notes = notesJ.notes;
  const exprById = {};
  for (const p of expr.phrases) exprById[p.phraseId] = p;
  MUS.live = expr.liveControls;
  const clm = music.chainLengthMap;
  MUS.SEC = {};
  for (const s of music.sections) {
    MUS.SEC[s.id] = { id: s.id, key: s.key.name, meter: s.meter, bpm: s.tempo.quarterBpm, special: s.special, paths: clm.sectionPaths[s.id] };
  }
  MUS.PH = {};
  for (const p of music.phraseMap) {
    const e = exprById[p.id];
    const [a, b] = p.noteRange;
    const mh = p.noteDensity.melodyHand;
    const melSet = new Set(e.voicing.melodyNoteIndices);
    const ns = [];
    for (let i = a; i < b; i++) {
      const n = notes[i];
      ns.push({ b: n.b - p.fullStartBeat, d: n.d, m: n.m, h: n.h, v: n.v, cls: melSet.has(i) ? 0 : (n.h === mh ? 1 : 2), i });
    }
    ns.sort((x, y) => x.b - y.b || x.cls - y.cls || y.m - x.m);
    /* onsetDefinition: 旋律の手の打鍵（同時の和音は1つ）。倒れるドミノの1枚＝1オンセット */
    const om = new Map();
    for (const n of ns) {
      if (n.h !== mh) continue;
      const k = Math.round(n.b * 1e6);
      const o = om.get(k);
      if (!o || n.m > o.m) om.set(k, { b: n.b, m: n.m });
    }
    const onsets = [...om.values()].sort((x, y) => x.b - y.b);
    if (onsets.length !== p.noteDensity.melodyHandOnsetCount) console.warn('onset count mismatch', p.id);
    const key = p.id.split('.').slice(1).join('.');
    let curve;
    if (p.id === 'var12.coda2.p1') curve = 'END9';
    else if (p.role === 'A' || p.role === 'Aprime') curve = p.beats > 20 ? 'A24' : 'A16';
    else curve = p.beats > 20 ? 'B24' : 'B16';
    const ped = e.pedal.events.map(ev => ({ b: ev.b, rel: !!ev.release, after: ev.pressAfterBeats || 0, depth: ev.depth || 0 })).sort((x, y) => x.b - y.b);
    MUS.PH[p.id] = {
      id: p.id, sec: p.section, role: p.role, tpl: p.templateId, slot: SLOT_OF[key], beats: p.beats,
      fullStart: p.fullStartBeat, meter: p.meter, bpm: p.tempo.quarterBpm, nextRole: p.nextRole,
      notes: ns, onsets, pedal: ped, vcurve: e.velocityCurve.points, voicing: e.voicing,
      base: e.dynamics.baselineVelocity, curve, bar: p.meter === '3/4' ? 3 : 2
    };
  }
  /* switchTable: 対称なペア。safe だけを自動切替に使う */
  MUS.PAIR = {};
  for (const pr of music.switchTable.pairs) {
    const v = { safe: pr.status === 'safe', allowed: pr.allowedNextRoles || [] };
    MUS.PAIR[pr.a + '|' + pr.b] = v;
    MUS.PAIR[pr.b + '|' + pr.a] = v;
  }
  MUS.policy = music.switchTable.transitionPolicy;
  MUS.ranges = clm.ranges.map(r => ({ min: r.minDominoes, max: r.maxDominoes, sec: r.section, alts: r.alternativeSections || [] }));
  const fin = clm.specialActivations.find(s => s.section === 'var12');
  MUS.giantMin = fin.minDominoes;
  MUS.finalePath = clm.sectionPaths.var12.withoutRepeats.slice();
  MUS.finaleCounts = MUS.finalePath.map(id => MUS.PH[id].onsets.length);
  MUS.finaleTotal = MUS.finaleCounts.reduce((a, b) => a + b, 0);
  /* フレーズ単位で差し替えてよいのは選ばれた通常の節だけ（第8・11・12変奏は除外、2・4・5・6・9は不使用） */
  const excluded = new Set([...(clm.excludedFromAutomaticPhraseSelection || []), ...(clm.excludedForLowerContrast || [])]);
  MUS.SUBSECS = clm.selectedRegularSections.filter(s => !excluded.has(s));
  MUS.SECTION_TARGETS = [...MUS.SUBSECS, 'var8', 'var12'];
  MUS.noteToRoot = {};
  for (const k in smap.noteToRoot) MUS.noteToRoot[k] = smap.noteToRoot[k];
  MUS.files = {};
  for (const f of smap.files) MUS.files[f.midi + '_' + f.layer] = f.file;
  MUS.layers = smap.layers.slice();
  /* 主題の音域（最初にデコードする根音） */
  const roots = new Set();
  for (const id of MUS.SEC.theme.paths.full) for (const n of MUS.PH[id].notes) roots.add(MUS.noteToRoot[n.m]);
  MUS.themeRoots = [...roots].sort((a, b) => a - b);
  const all = new Set();
  for (const s of MUS.SECTION_TARGETS) for (const pth of ['full', 'withoutRepeats']) for (const id of MUS.SEC[s].paths[pth]) for (const n of MUS.PH[id].notes) all.add(MUS.noteToRoot[n.m]);
  MUS.allRoots = [...all].sort((a, b) => a - b);
  /* brillianceOrder: 画面のきらめきの量に使う（主題=控えめ … 第12変奏=最大） */
  MUS.brill = {};
  const bm = music.brillianceOrder.metrics;
  const lo = Math.min(...bm.map(m => m.score)), hi = Math.max(...bm.map(m => m.score));
  for (const m of bm) MUS.brill[m.section] = (m.score - lo) / Math.max(1e-6, hi - lo);
}
</script>
<script>
'use strict';
/* ===================== オーディオ ===================== */
const AU = { ctx: null, buffers: new Map(), raw: new Map(), failed: new Set(), voices: [], vol: 1, dropped: 0, decoding: false };
try { const v = parseFloat(localStorage.getItem('kd.vol')); if (!isNaN(v)) AU.vol = clamp(v, 0, 1); } catch (e) {}
/* 層ごとの代表ベロシティと（C4 で測った）ピーク音量。ベロシティ→音量を連続にし、層の切替で段差を作らない */
const LAYER_PTS = [[0.30, -12.2], [0.52, -7.9], [0.71, -3.9], [0.88, -1.3]];
const LAYER_DB = { 4: -12.2, 8: -7.9, 12: -3.9, 16: -1.3 };
const LAYER_ORDER = { 4: [4, 8, 12, 16], 8: [8, 12, 4, 16], 12: [12, 8, 16, 4], 16: [16, 12, 8, 4] };
const VOICE_GAIN = 0.6;
const MAXV = 32;

function layerFor(v) { return v < 0.41 ? 4 : v < 0.615 ? 8 : v < 0.795 ? 12 : 16; }
function velDb(v) {
  const P = LAYER_PTS, n = P.length - 1;
  if (v <= P[0][0]) return P[0][1] + (v - P[0][0]) * (P[1][1] - P[0][1]) / (P[1][0] - P[0][0]);
  for (let i = 1; i <= n; i++) if (v <= P[i][0]) return lerp(P[i - 1][1], P[i][1], (v - P[i - 1][0]) / (P[i][0] - P[i - 1][0]));
  return P[n][1] + (v - P[n][0]) * (P[n][1] - P[n - 1][1]) / (P[n][0] - P[n - 1][0]);
}

function createAudio() {
  if (AU.ctx) return AU.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  let ctx;
  try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); }
  AU.ctx = ctx;
  window.__gf.ctx = ctx;
  const bus = ctx.createGain();
  const dry = ctx.createGain();
  const send = ctx.createGain(); send.gain.value = 0.15;
  const conv = ctx.createConvolver(); conv.buffer = makeIR(ctx);
  const wlp = ctx.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 6500; wlp.Q.value = 0.5;
  const master = ctx.createGain(); master.gain.value = AU.vol;
  const shelf = ctx.createBiquadFilter(); shelf.type = 'highshelf'; shelf.frequency.value = 3200; shelf.gain.value = 0;
  /* マスターのリミッター（クリップさせない） */
  const lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -4; lim.knee.value = 3; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.15;
  /* 音量はリミッターの手前。最終段は余裕を残して 0dBFS に届かせない */
  const out = ctx.createGain(); out.gain.value = 0.84;
  const an = ctx.createAnalyser(); an.fftSize = 2048;
  bus.connect(dry); dry.connect(master);
  bus.connect(send); send.connect(conv); conv.connect(wlp); wlp.connect(master);
  master.connect(shelf); shelf.connect(lim); lim.connect(out); out.connect(an); an.connect(ctx.destination);
  Object.assign(AU, { bus, send, shelf, lim, out, an, master });
  window.__gf.analyser = an;
  ctx.onstatechange = () => { if (ctx.state !== 'running' && !document.hidden) G.needResume = true; };
  return ctx;
}

function unlockAudio() {
  const ctx = createAudio();
  if (!ctx) return;
  if (ctx.state !== 'running' && !document.hidden) { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
}

/* 小さな部屋の残響（ノイズから生成。外部素材は使わない） */
function makeIR(ctx) {
  const sr = ctx.sampleRate, len = Math.floor(sr * 2.0);
  const b = ctx.createBuffer(2, len, sr);
  const r = rng(265);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const env = Math.exp(-t / 0.30) * (t < 0.015 ? t / 0.015 : 1);
      const a = 0.18 + 0.7 * Math.exp(-t / 0.35);
      lp += ((r() * 2 - 1) - lp) * a;
      d[i] = lp * env;
    }
    const taps = [[9, 0.5], [14, 0.38], [21, 0.3], [29, 0.24], [38, 0.18], [51, 0.13]];
    for (const [ms, g] of taps) { const i = Math.floor((ms + (ch ? 2.3 : 0)) * sr / 1000); if (i < len) d[i] += g * (ch ? -0.9 : 1); }
  }
  return b;
}

function setVolume(v) {
  AU.vol = v;
  try { localStorage.setItem('kd.vol', String(v)); } catch (e) {}
  if (AU.ctx && AU.master) AU.master.gain.setTargetAtTime(v, AU.ctx.currentTime, 0.05);
}

/* ---- サンプル：取得は先に、デコードは段階的に ---- */
function prefetch(key) {
  let p = AU.raw.get(key);
  if (!p) {
    const f = MUS.files && MUS.files[key];
    if (!f) return Promise.resolve(null);
    p = fetch('assets/' + f).then(r => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
    AU.raw.set(key, p);
  }
  return p;
}
function decodeAB(ab) {
  return new Promise((res, rej) => {
    let done = false;
    const ok = b => { if (!done) { done = true; res(b); } };
    const ng = e => { if (!done) { done = true; rej(e); } };
    try { const pr = AU.ctx.decodeAudioData(ab, ok, ng); if (pr && pr.then) pr.then(ok, ng); } catch (e) { ng(e); }
  });
}
function trimBuffer(buf, root) {
  /* 実際に鳴る長さより後ろは捨ててメモリを節約（最後はなめらかにフェード） */
  const maxSec = root < 48 ? 5.0 : root < 72 ? 4.2 : 3.4;

  const un = uiNow();
  g2.setTransform(1, 0, 0, 1, 0, 0);
  g2.globalAlpha = 1; g2.globalCompositeOperation = 'source-over';
  g2.drawImage(BG, 0, 0);
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky(V, bi);
  drawBushes(V, bi);
  drawGround(V, bi);
  const objs = [];
  for (const c of G.chains) {
    for (let i = 0; i < c.ds.length; i++) {
      const d = c.ds[i];
      if (d.bloom) continue;
      const age = un - d.born;
      if (age < 0) continue;
      const geo = dominoGeo(d, dominoAngle(d, V, c), age);
      objs.push({ k: geo.key, t: 0, d, geo, c, i, bi });
    }
  }
  /* 影 */
  g2.beginPath();
  for (const o of objs) addShadowPoly(o.geo);
  const rbx = RB.x, rby = RB.y;
  g2.moveTo(rbx + LY.S * 1.05, rby); g2.ellipse(rbx, rby, LY.S * 1.05, LY.S * 0.36, 0, 0, TAU);
  g2.fillStyle = 'rgba(70,130,105,0.16)'; g2.fill();
  for (const g of G.gifts) { const p = giftPos(g); objs.push({ k: KZ * p[1] + giftSize() * 0.3, t: 1, g }); }
  for (const c of G.chains) if (c.ds.length && (c.state === 'ready' || c.state === 'pressed' || c.state === 'armed' || (c.state === 'falling' && V < c.t0 + 1.2))) objs.push({ k: KZ * V2Y(c.btn.v) + btnRadius() * 0.3, t: 2, c });
  objs.push({ k: KZ * RB.y + LY.S * 1.3, t: 3 });
  objs.sort((a, b) => a.k - b.k);
  for (const o of objs) {
    if (o.t === 0) drawDomino(o, V);
    else if (o.t === 1) drawGift(o.g, V);
    else if (o.t === 2) drawButton(o.c, V, bi);
    else drawRabbit(V, bi);
  }
  drawSparks(V);
  drawBeams(V);
  drawParticles();
  drawHint(V, bi);
  drawTint(V, bi);
  drawMeter(V);
  drawGear();
}
</script>
<script>
'use strict';
/* ===================== 起動・入力・ライフサイクル ===================== */
let parentOpen = false, activePointer = null, resizeTimer = 0;

function onResize() {
  if (PEN.active) penUp(null);
  computeLayout();
  layoutDecor();
  cv.width = Math.round(LY.vw * LY.dpr); cv.height = Math.round(LY.vh * LY.dpr);
  cv.style.width = LY.vw + 'px'; cv.style.height = LY.vh + 'px';
  buildBG(); buildTextures(); buildSprites();
  for (const c of G.chains) for (const d of c.ds) { d.x = U2X(d.u); d.y = V2Y(d.v); d.hd = Math.atan2(d.dv * LY.gh, d.du * LY.gw); }
  RB.x = U2X(RB.u); RB.y = V2Y(RB.v);
  G.hintKey = '';
}
function queueResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 120); }
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => { queueResize(); setTimeout(onResize, 450); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);

function setupTitle() {
  /* 最初の絵：光る最初のドミノ（押すと主題の最初のフレーズに合わせて倒れる） */
  const g = spawnFreeGift();
  g.dropT = -10;
  const hint = currentHint();
  const c = newChain();
  for (const p of hint.pts) makeDomino(c, p.x, p.y, Math.cos(p.h), Math.sin(p.h), false).born = uiNow() - 1;
  placeChainProps(c);
  c.state = 'ready';
  c.readyU = uiNow() - 1;
  G.titleHint = true;
}

async function startGame() {
  if (G.started) return;
  G.started = true;
  G.startT = uiNow();
  G.lastAct = uiNow();
  unlockAudio();
  const tut = G.chains.find(c => c.state === 'ready');
  /* 最初のタップで最初の鎖はすぐ「押された」見た目に。データが揃ったら正式に押す */
  if (tut) { tut.state = 'pressed'; tut.pendingPress = true; tut.btn.pressT = uiNow(); tut.pressV = null; }
  await musicReady;
  if (tut && tut.pendingPress) { tut.pendingPress = false; tut.state = 'ready'; pressChain(tut); }
  const plan = decodePlan();
  await Promise.race([decodeList(plan.first, 3), new Promise(r => setTimeout(r, 5000))]);
  if (AU.ctx.state !== 'running') { try { await AU.ctx.resume(); } catch (e) {} }
  G.musicStarted = true;
  audioTick();
  const v = vNow();
  for (const c of G.chains) if (c.state === 'pressed' || c.state === 'armed') c.pressV = v;
  decodeList(plan.rest, 2);
}

function pointerPos(e) { return [e.clientX, e.clientY]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  if (parentOpen) return;
  const [x, y] = pointerPos(e);
  if (Math.hypot(x - LY.gear.x, y - LY.gear.y) < LY.gear.r + 12) { G.gearHold = { t: uiNow(), id: e.pointerId }; return; }
  if (!G.started) { startGame(); return; }
  if (activePointer !== null) return;
  const c = hitButton(x, y);
  if (c) { pressChain(c); return; }
  const busyBtn = G.chains.find(k => (k.state === 'pressed' || k.state === 'armed' || (k.state === 'falling' && G.V < k.t0 + 1.2)) && Math.hypot(x - U2X(k.btn.u), y - V2Y(k.btn.v)) < btnRadius() * 1.6 + 14);
  if (busyBtn) { busyBtn.btn.bumpT = uiNow(); return; }
  if (penDown(x, y)) { activePointer = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (er) {} }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (G.gearHold && e.pointerId === G.gearHold.id) {
    if (Math.hypot(e.clientX - LY.gear.x, e.clientY - LY.gear.y) > LY.gear.r + 36) G.gearHold = null;
    return;
  }
  if (e.pointerId !== activePointer) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (evs && evs.length) for (const ev of evs) penMove(ev.clientX, ev.clientY);
  else penMove(e.clientX, e.clientY);
}, { passive: false });
function endPointer(e) {
  if (G.gearHold && e.pointerId === G.gearHold.id) G.gearHold = null;
  if (e.pointerId === activePointer) { penUp(e.type === 'pointercancel' ? null : e.clientX, e.clientY); activePointer = null; }
  unlockAudio();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('lostpointercapture', e => { if (e.pointerId === activePointer) { penUp(null); activePointer = null; } });
window.addEventListener('touchend', () => unlockAudio(), { passive: true });
window.addEventListener('click', () => unlockAudio(), { passive: true });
document.addEventListener('touchmove', e => { if (!parentOpen) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---- 保護者ページ ---- */
const CREDIT_FALLBACK = '音楽: モーツァルト《きらきら星変奏曲》K.265/300e — 楽譜データ: MuseScore 6281151 / PDMX / Piano: Soloist（CC0 1.0）。強弱・ペダル・声部バランスの提案を追加。\n\nピアノの音: “Salamander Grand Piano” by Alexander Holm — CC BY 3.0 — 短く切り詰めて圧縮しています。出典: https://github.com/sfzinstruments/SalamanderGrandPiano / https://freepats.zenvoid.org/Piano/acoustic-grand-piano.html';
function setCredit(text) {
  const el = document.getElementById('credit');
  el.textContent = '';
  text.trim().split(/\n\s*\n/).forEach(par => { const p = document.createElement('p'); p.textContent = par.trim(); el.appendChild(p); });
}
setCredit(CREDIT_FALLBACK);
fetch('assets/LICENSES.md').then(r => (r.ok ? r.text() : null)).then(t => {
  if (!t) return;
  const parts = t.split(/^##\s*保護者ページ用クレジット\s*$/m);
  if (parts.length < 2) return;
  const body = parts[1].split(/^##\s/m)[0];
  if (body.trim()) setCredit(body);
}).catch(() => {});
function refreshVol() { document.querySelectorAll('#vol button').forEach(b => b.classList.toggle('on', Math.abs(parseFloat(b.dataset.v) - AU.vol) < 0.01)); }
function openParent() { parentOpen = true; if (PEN.active) { penUp(null); activePointer = null; } document.getElementById('parent').classList.add('open'); refreshVol(); }
function closeParent() { parentOpen = false; document.getElementById('parent').classList.remove('open'); }
document.getElementById('pclose').addEventListener('click', closeParent);
document.getElementById('vol').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setVolume(parseFloat(b.dataset.v)); unlockAudio(); refreshVol(); });

/* ---- 中断からの復帰 ---- */
document.addEventListener('visibilitychange', () => {
  if (!AU.ctx) return;
  if (document.hidden) { if (AU.ctx.state === 'running') AU.ctx.suspend().catch(() => {}); }
  else { AU.ctx.resume().then(() => { G.needResume = false; }).catch(() => { G.needResume = true; }); }
});
window.addEventListener('pageshow', () => { if (AU.ctx && !document.hidden) AU.ctx.resume().catch(() => { G.needResume = true; }); });
window.addEventListener('focus', () => { if (AU.ctx && !document.hidden && AU.ctx.state !== 'running') AU.ctx.resume().catch(() => {}); });

/* ---- メインループ（演出の時刻は音楽の時計から。rAF は描画のきっかけだけ） ---- */
/* 重い端末では描画解像度を一段ずつ下げる（最大2回、音楽の時計とは無関係の計測） */
const FR = { last: 0, acc: 0, n: 0, drops: 0, t0: 0 };
function watchFrameRate(ts) {
  if (document.hidden || !G.started) { FR.last = ts; FR.acc = 0; FR.n = 0; return; }
  if (FR.last) { const d = ts - FR.last; if (d < 250) { FR.acc += d; FR.n++; } }
  FR.last = ts;
  if (FR.n >= 150) {
    const avg = FR.acc / FR.n;
    FR.acc = 0; FR.n = 0;
    if (avg > 26 && (G.perf || 0) > 9 && FR.drops < 2 && LY.dpr > 1.5 && !PEN.active) { FR.drops++; G.dprCap = Math.max(1.5, LY.dpr - 0.75); onResize(); }
  }
}
function frame(ts) {
  requestAnimationFrame(frame);
  watchFrameRate(ts || performance.now());
  const un = uiNow();
  try {
    audioTick();
    G.V = G.musicStarted && AU.ctx ? vNow() : un;
    const dt = clamp(G.V - G.lastV, 0, 0.05); G.lastV = G.V;
    const udt = clamp(un - G.lastU, 0, 0.05); G.lastU = un;
    if (G.gearHold && un - G.gearHold.t >= 2) { G.gearHold = null; openParent(); }
    if (G.needResume && AU.ctx && !document.hidden && AU.ctx.state !== 'running' && un - (G.resumeTry || 0) > 1) {
      G.resumeTry = un;
      AU.ctx.resume().then(() => { G.needResume = false; }).catch(() => {});
    }
    const pt0 = performance.now();
    update(dt, udt);
    render();
    const pms = performance.now() - pt0;
    G.perf = (G.perf || pms) * 0.95 + pms * 0.05;
    G.perfMax = Math.max((G.perfMax || 0) * 0.995, pms);
  } catch (err) { console.error(err); }
}
setInterval(audioTick, 25);

window.__gf.debug = () => ({
  started: G.started, music: G.musicStarted, ctx: AU.ctx ? AU.ctx.state : null, t: AU.ctx ? AU.ctx.currentTime : 0,
  chains: G.chains.map(c => ({ id: c.id, state: c.state, n: c.ds.length, target: c.target, predicted: c.predicted })),
  tl: TL.ph.map(p => ({ id: p.id, start: +p.start.toFixed(3), end: +p.end.toFixed(3) })), voices: AU.voices.length,
  dropped: AU.dropped, buffers: AU.buffers.size, failed: AU.failed.size, play: +G.play.toFixed(2), parts: G.parts.length,
  perf: +(G.perf || 0).toFixed(2), perfMax: +(G.perfMax || 0).toFixed(2)
});
window.__gf.layout = () => ({ vw: LY.vw, vh: LY.vh, gx: LY.gx, gy: LY.gy, gw: LY.gw, gh: LY.gh, S: LY.S, gear: LY.gear, portrait: LY.portrait });
window.__gf.buttonPos = () => { const c = G.chains.find(k => k.state === 'ready'); return c ? { x: U2X(c.btn.u), y: V2Y(c.btn.v) } : null; };

function boot() {
  onResize();
  const H = homeUV();
  RB.u = H.r[0]; RB.v = H.r[1]; RB.x = U2X(RB.u); RB.y = V2Y(RB.v);
  setupTitle();
  requestAnimationFrame(frame);
  loadMusic().then(() => {
    const p = decodePlan();
    p.first.forEach(prefetch);
    p.rest.slice(0, 14).forEach(prefetch);
  }).catch(err => console.error('music load failed', err));
}
boot();
</script>
