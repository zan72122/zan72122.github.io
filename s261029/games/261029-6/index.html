<script>
(()=>{
'use strict';
/* ================= utils ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),saEl=document.getElementById('sa');
const TAU=Math.PI*2;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hsl=(h,s,l,a)=>a===undefined?`hsl(${h},${s}%,${l}%)`:`hsla(${h},${s}%,${l}%,${a})`;
function E(c,x,y,rx,ry,r){rx=Math.max(.3,rx);ry=Math.max(.3,ry);r=r||0;c.moveTo(x+rx*Math.cos(r),y+rx*Math.sin(r));c.ellipse(x,y,rx,ry,r,0,TAU)}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ================= geometry ================= */
let W=1,H=1,DPR=1,GW=1,GH=1,U=1,S=1;
const SA={l:0,t:0,r:0,b:0};
const X=n=>SA.l+n*GW,Y=n=>SA.t+n*GH,NX=p=>(p-SA.l)/GW,NY=p=>(p-SA.t)/GH;
const dpx=(a,b)=>Math.hypot((a.x-b.x)*GW,(a.y-b.y)*GH);
const GB={x0:.07,x1:.93,y0:.37,y1:.95};
const clampG=p=>{p.x=clamp(p.x,GB.x0,GB.x1);p.y=clamp(p.y,GB.y0,GB.y1);return p};
function stepTo(e,tx,ty,sp,dt){
  const dx=(tx-e.x)*GW,dy=(ty-e.y)*GH,d=Math.hypot(dx,dy);
  if(d<1.5){e.x=tx;e.y=ty;return true}
  const m=Math.min(d,sp*dt);e.x+=dx/d*m/GW;e.y+=dy/d*m/GH;
  if(Math.abs(dx)>1)e.face=dx>0?1:-1;e.moving=true;return m>=d-.5;
}
function pathAt(path,prog,closed){
  const n=path.length;let p,dir=1;
  if(closed){p=((prog%n)+n)%n}else{const m=n-1;let q=((prog%(2*m))+2*m)%(2*m);if(q>m){q=2*m-q;dir=-1}p=q}
  let i=Math.floor(p),f=p-i;
  if(!closed&&i>=n-1){i=n-2;f=1}
  const a=path[i],b=path[closed?(i+1)%n:i+1];
  return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,dx:(b.x-a.x)*dir,dy:(b.y-a.y)*dir,seg:Math.max(5,Math.hypot((b.x-a.x)*GW,(b.y-a.y)*GH))};
}
function nearestIdx(path,e){let bi=0,bd=1e9;for(let i=0;i<path.length;i++){const d=dpx(path[i],e);if(d<bd){bd=d;bi=i}}return bi}
function runAlong(e,path,closed,speed,dt,side){
  if(!path||path.length<2)return false;
  if(e.curPath!==path){e.curPath=path;e.prog=nearestIdx(path,e);e.joining=true}
  const P=pathAt(path,e.prog,closed);
  let nx=-P.dy*GH,ny=P.dx*GW;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
  const tx=P.x+nx*side/GW,ty=P.y+ny*side/GH;
  if(e.joining){e.prog+=speed*dt/P.seg*.25;if(stepTo(e,tx,ty,speed*1.8,dt))e.joining=false}
  else{e.prog+=speed*dt/P.seg;const k=Math.min(1,dt*14);if(Math.abs(P.dx*GW)>.01)e.face=P.dx>0?1:-1;e.x+=(tx-e.x)*k;e.y+=(ty-e.y)*k;e.moving=true}
  return true;
}
function segInt(a,b,c,d){
  const ax=a.x*GW,ay=a.y*GH,bx=b.x*GW,by=b.y*GH,cx=c.x*GW,cy=c.y*GH,dx=d.x*GW,dy=d.y*GH;
  const r1x=bx-ax,r1y=by-ay,r2x=dx-cx,r2y=dy-cy,den=r1x*r2y-r1y*r2x;
  if(Math.abs(den)<1e-6)return null;
  const t=((cx-ax)*r2y-(cy-ay)*r2x)/den,u=((cx-ax)*r1y-(cy-ay)*r1x)/den;
  if(t>=-.02&&t<=1.02&&u>=-.02&&u<=1.02)return{x:(ax+r1x*t)/GW,y:(ay+r1y*t)/GH};
  return null;
}

/* ================= palette ================= */
const PALS=[
 {sky:['#f4a3a0','#f8c0a6','#fde2c0'],glow:'255,240,205',hill:['#e8bccb','#d8bfd9'],grass:['#d9e8b9','#c6dca9','#b4d2a0'],sh:'118,86,172',plaza:'#f7e2cf',water:'#bfd9ec'},
 {sky:['#ec9db8','#f5bdc2','#fcdccb'],glow:'255,236,216',hill:['#d9b5d6','#c9b8de'],grass:['#d0e6c0','#bcd9b1','#abcfa6'],sh:'112,84,170',plaza:'#f6e0d8',water:'#c4d7f0'},
 {sky:['#f2ad8c','#f6c8a0','#f6e2c6'],glow:'255,244,212',hill:['#e4c0bc','#cdbada'],grass:['#dce9b6','#cadea6','#b8d49c'],sh:'124,90,174',plaza:'#f8e5cc',water:'#bbdbe7'}
];
let PAL=PALS[0];
const DUSTC=['#f7c6d9','#fbe3a8','#d9c6f0','#c6e6d6','#fff3e6','#f9d0b8'];

/* ================= audio ================= */
const AU={c:null,m:null,nb:null};
function audioInit(){
  try{
    if(navigator.userActivation&&!navigator.userActivation.isActive)return;
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      AU.c=new AC();AU.m=AU.c.createGain();AU.m.gain.value=.55;
      const comp=AU.c.createDynamicsCompressor();AU.m.connect(comp);comp.connect(AU.c.destination);
      const len=AU.c.sampleRate|0;AU.nb=AU.c.createBuffer(1,len,AU.c.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(AU.c.state!=='running'&&!document.hidden)AU.c.resume().catch(()=>{});
  }catch(e){AU.c=null}
}
const canPlay=()=>AU.c&&AU.c.state==='running'&&!document.hidden;
function tone(f,dur,type,vol,f2,delay,lp){
  if(!canPlay())return;
  try{
    const c=AU.c,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=o;if(lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
    n.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
function noise(dur,vol,freq,q,delay,f2,type){
  if(!canPlay())return;
  try{
    const c=AU.c,t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=AU.nb;
    const fl=c.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(freq||1500,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q||.8;
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(t,Math.random()*.4);s.stop(t+dur+.03);
  }catch(e){}
}
function vib(f,dur,vol,type,rate,depth,f2,lp,delay){
  if(!canPlay())return;
  try{
    const c=AU.c,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+dur*.7);
    l.frequency.value=rate;lg.gain.value=depth;l.connect(lg);lg.connect(o.frequency);
    let n=o;if(lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(g);g.connect(AU.m);o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05);
  }catch(e){}
}
const NOTE=(s,b)=>(b||523.25)*Math.pow(2,s/12);
const KP={rabbit:1.12,cat:1.0,duck:.9,bear:.8,mouse:1.25};
const SFX={
  pon(p){p=p||1;tone(600*p,.15,'sine',.32,250*p);tone(1200*p,.06,'triangle',.06);noise(.06,.05,2600*p,1)},
  chime(ns,v,base){(ns||[0,4,7]).forEach((n,i)=>{tone(NOTE(n,base||784),.5,'triangle',v||.1,0,i*.085);tone(NOTE(n+12,base||784),.25,'sine',(v||.1)*.3,0,i*.085)})},
  discover(k){SFX.pon(KP[k]||1);SFX.chime([0,4,7,12],.09,NOTE(0,659)*(KP[k]||1))},
  tick(){tone(760+rnd(160),.05,'sine',.05)},
  rustle(){noise(.16,.05,3200,1.2)},
  step(heavy){heavy?tone(260+rnd(40),.07,'sine',.12,170):tone(1250+rnd(250),.04,'triangle',.06,800)},
  pout(){tone(380,.12,'triangle',.1,300);tone(300,.16,'triangle',.1,250,.12)},
  meow(){vib(640,.32,.08,'triangle',7,12,880,1800);vib(860,.2,.05,'triangle',7,10,700,1800,.25)},
  quack(){tone(470,.09,'square',.05,380,0,900);tone(440,.11,'square',.05,340,.13,900)},
  splash(v){v=v||1;noise(.35,.14*v,1300,.7,0,500);noise(.18,.06*v,3500,1,.05)},
  drip(){tone(1400+rnd(300),.08,'sine',.08,600)},
  puff(r){tone(180+r*90,.2,'sawtooth',.04,260+r*120,0,700);noise(.15,.04,900,1)},
  boing(){vib(300,.55,.13,'sine',11,40,170)},
  click(){tone(1700,.03,'square',.03,0,0,3000);tone(900,.04,'sine',.05)},
  secret(){SFX.chime([0,2,4,7,9,12,16],.09,659);noise(.6,.03,6000,2)},
  gift(){SFX.chime([7,12,16],.09,880)},
  trumpet(){vib(233,.7,.1,'sawtooth',5.5,6,349,1100);vib(350,.5,.05,'sawtooth',5.5,6,0,1300,.35)},
  slurp(){noise(.4,.06,500,2,0,2500)},
  spray(){noise(.7,.08,4000,.6,0,1500);SFX.chime([12,14,16,19,21],.06,784)},
  big(){vib(110,1.2,.07,'sine',3,4,138)},
  whoosh(){noise(.5,.07,500,1.4,0,2400)},
  sniff(){noise(.05,.04,3000,2);noise(.05,.04,3200,2,.09)},
  giggle(k){const p=KP[k]||1;tone(900*p,.07,'triangle',.06,1100*p);tone(1000*p,.07,'triangle',.06,1250*p,.09)},
  bird(){const f=rnd(2200,2800);tone(f,.08,'sine',.025,f*1.3);tone(f*1.1,.08,'sine',.02,f*1.4,.12)},
  reveal(){tone(330,.3,'sine',.05,440);noise(.2,.02,2000,1)},
  marimba(f,v){tone(f,.28,'sine',v||.09);tone(f*4,.06,'sine',(v||.09)*.25)}
};

/* ================= state ================= */
const KINDS=['rabbit','cat','duck','bear','mouse'];

const LMS=['hedge','bench','pond','tree','stand'];

const PLAZA={x:.5,y:.64};
const HOP={rabbit:[9,.42],cat:[10,.1],duck:[8,.06],bear:[7,.08],mouse:[12,.22]};
const SAVE_KEY='kagepare-261029-6';
const G={t:0,cycle:0,cycleId:0,phase:'explore',lm:{},skewC:-.32,sunX:.14,seed:1,
  chars:{},sh:{},order:[],stages:[],petals:[],flower:[],paws:[],pawPath:[],puddles:[],gardens:[],
  water:null,rest:null,umb:null,ribbon:null,balloons:[],lift:null,race:null,bfly:null,knot:null,big:null,ele:null,parade:null,fw:null,
  timers:[],parts:[],lastInput:0,demoDone:false,demo:null,hlIdx:0,hlT:0,focus:null,finger:null,shake:0,wash:0,washDir:0,

function logEv(s){G.log.push(Math.round(G.t*10)/10+' '+s);if(G.log.length>300)G.log.shift()}
function later(d,fn){G.timers.push({t:G.t+d,fn,id:G.cycleId})}
function makeChar(k){return{kind:k,x:.5,y:.5,face:1,state:'hidden',found:false,mood:'idle',moodT:0,blink:0,blinkT:rnd(1,4),sq:0,sqv:0,z:0,vz:0,hz:0,hopPh:0,hopK:0,moving:false,lx:0,ly:0,ph:rnd(TAU),scale:1,task:'',tt:0,prog:0,curPath:null,joining:false,carry:null,decor:[],joyN:0,outT:0,pop:null,lastPetal:null,lastPaw:null,pawSide:1,ride:false,swim:false,tail:0,data:{},boostT:0,puddleT:0}}
function makeShadow(k){return{kind:k,x:.5,y:.5,face:1,state:'hidden',grow:0,sq:0,sqv:0,z:0,hz:0,hopPh:0,moving:false,blink:0,blinkT:rnd(2,5),tw:0,twT:rnd(1,3),taps:0,lastTap:-9,trail:[],trailUntil:-9,dash:null,prog:0,curPath:null,joining:false,ph:rnd(TAU),lastPetal:null,ms:null,spin:0,alpha:1}}
KINDS.forEach(k=>{G.chars[k]=makeChar(k);G.sh[k]=makeShadow(k)});
function setMood(o,m,d){o.mood=m;o.moodT=d}
function jump(o,v){if(o.z<S*.3)o.vz=S*v}
function spring(o,dt){o.sqv+=(-130*o.sq-9*o.sqv)*dt;o.sq+=o.sqv*dt;if(o.sq>.6)o.sq=.6;if(o.sq<-.6)o.sq=-.6}

/* ================= memory ================= */
function loadMem(){
  try{
    const s=window.localStorage.getItem(SAVE_KEY);if(!s)return null;
    const o=JSON.parse(s);if(!o||typeof o!=='object')return null;
    const hue=Number(o.hue),cycles=Number(o.cycles);
    if(!isFinite(hue)||!isFinite(cycles))return null;
    return{hue:((hue%360)+360)%360,cycles:clamp(Math.floor(cycles),0,9999),fancy:!!o.fancy};
  }catch(e){return null}
}
function saveMem(o){try{window.localStorage.setItem(SAVE_KEY,JSON.stringify(o))}catch(e){}}

/* ================= layout ================= */
function genLayout(fixed){
  let a=null;
  if(fixed)a={hedge:0,bench:1,pond:2,stand:3,tree:4};
  else for(let i=0;i<40;i++){const s=shuffle([0,1,2,3,4,5]);a={hedge:s[0],bench:s[1],pond:s[2],tree:s[3],stand:s[4]};if(a.tree!==5&&a.pond!==4&&a.hedge!==5)break}
  const lm={};for(const k of LMS){const sl=SLOTS[a[k]];lm[k]={x:sl.x+(fixed?0:rnd(-.02,.02)),y:sl.y+(fixed?0:rnd(-.01,.01)),wob:0,name:k}}
  return{lm,seed:(Math.random()*1e9)|0,sunX:fixed?.14:pick([.14,.86,.28,.72])};
}
function hidePos(k){const L=G.lm[LMK[k]];return k==='duck'?{x:L.x-.02,y:L.y-.03}:{x:L.x,y:L.y-.03}}
function peekPos(k){const p=peekPos0(k);p.x=clamp(p.x,.07,.93);p.y=clamp(p.y,GB.y0-.02,GB.y1);return p}
function peekPos0(k){const L=G.lm[LMK[k]],sd=k==='duck'?(L.x<.5?1:-1):(G.skewC<0?1:-1);
  switch(k){case'rabbit':return{x:L.x+.025*sd,y:L.y+.055};case'cat':return{x:L.x+.01,y:L.y+.035};case'duck':return{x:L.x+(S*2.9/GW)*sd,y:L.y+.01};case'bear':return{x:L.x+.035*sd,y:L.y+.05};default:return{x:L.x+.05*sd,y:L.y+.04}}}
function popPos(k){const L=G.lm[LMK[k]];return clampG({x:L.x+(L.x<.5?.07:-.07),y:L.y+.075})}

function addP(p){if(G.parts.length>=PMAX)G.parts.shift();p.life=0;G.parts.push(p);return p}
function dust(x,y,n,sp,col){for(let i=0;i<n;i++){const a=rnd(TAU),v=S*rnd(1.5,4.5)*(sp||1);addP({t:'dust',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.7-S*1.2,max:rnd(.5,.9),r:S*rnd(.07,.18),col:col||pick(DUSTC),g:S*2})}}
function sparkle(x,y,n,sp){for(let i=0;i<n;i++){const a=rnd(TAU),v=S*rnd(.8,3)*(sp||1);addP({t:'spark',x:x+rnd(-1,1)*S*.3,y:y+rnd(-1,1)*S*.3,vx:Math.cos(a)*v,vy:Math.sin(a)*v-S,max:rnd(.6,1.1),r:S*rnd(.1,.2),col:pick(['#fff7d8','#ffe0f0','#e8f4ff','#fff']),g:S*.5})}}
function hearts(x,y,n){for(let i=0;i<n;i++)addP({t:'heart',x:x+rnd(-1,1)*S*.5,y,vx:rnd(-1,1)*S*.6,vy:-S*rnd(1.5,2.6),max:rnd(.9,1.3),r:S*rnd(.13,.2),col:pick(['#f7a8c0','#f9b9a0','#e7a6dc']),g:-S*.2})}
function petalBurst(x,y,n,hues,vx,vy){for(let i=0;i<n;i++)addP({t:'petal',x,y,vx:(vx||0)+rnd(-1,1)*S*2.4,vy:(vy||-S*2.5)+rnd(-1,1)*S*1.5,g:S*2.2,max:rnd(1.2,2),r:S*rnd(.12,.18),h:pick(hues||[340,350,20,280]),rot:rnd(TAU),vr:rnd(-6,6)})}
function drops(x,y,n,sp){for(let i=0;i<n;i++){const a=-Math.PI/2+rnd(-1.1,1.1),v=S*rnd(2,5)*(sp||1);addP({t:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:S*14,max:rnd(.5,.8),r:S*rnd(.07,.12)})}}

/* ================= background ================= */
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const grain=document.createElement('canvas');grain.width=grain.height=128;
(()=>{const g=grain.getContext('2d'),id=g.createImageData(128,128);for(let i=0;i<id.data.length;i+=4){const v=Math.random()<.5?255:90;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()*22}g.putImageData(id,0,0)})();

  G.lm[LMK[k]].wob=1.2;focusAt(sh.x,sh.y);
  const n=G.order.length;
  if(G.stages[n])G.stages[n].forEach((kk,i)=>reveal(kk,(n===1&&G.cycle===0&&!G.saved?5:1.4)+i*1.6));
  for(const o of KINDS){const c2=G.chars[o];if(c2.state==='out'){later(.3+rnd(.3),()=>{setMood(c2,'surprise',.5);later(.5,()=>{setMood(c2,'happy',1.2);jump(c2,7)})})}}
  if(n>=4&&!G.big&&G.phase==='explore')later(3.5,spawnBig);

}

  case'cat':ch.task=(G.race&&G.race.mode==='loop'&&G.flower.length>=3)?'sniff':'roam';

    logEv('cat task '+ch.task);break;

/* ================= rabbit race ================= */
function makeLoop(start,avoidAng){
  const ang=avoidAng==null?rnd(TAU):avoidAng+Math.PI*(.55+rnd(.9));
  const rx=.19,ry=.12;
  let cx=start.x+Math.cos(ang)*rx,cy=start.y+Math.sin(ang)*ry;
  cx=clamp(cx,GB.x0+rx*.9,GB.x1-rx*.9);cy=clamp(cy,GB.y0+ry*.9,GB.y1-ry*.9);
  const a0=Math.atan2((start.y-cy)/ry,(start.x-cx)/rx),dir=Math.random()<.5?1:-1,n=16,ph=rnd(TAU),pts=[];
  for(let k=0;k<n;k++){const a=a0+dir*k/n*TAU,w=1+.12*Math.sin(k*1.7+ph);pts.push(clampG({x:cx+Math.cos(a)*rx*w,y:cy+Math.sin(a)*ry*w}))}
  pts.ang=ang;return pts;
}
function startRace(mode){
  const ch=G.chars.rabbit,sh=G.sh.rabbit;
  G.race={mode,path:null,lead:'rabbit',leadT:G.t,ahead:'rabbit'};
  if(mode==='loop'){const p=makeLoop(ch,null);G.race.path=p;ch.curPath=p;ch.prog=.8;ch.joining=true;sh.curPath=p;sh.prog=0;sh.joining=true}
  logEv('race '+mode);
}
function updateRace(dt){
  const r=G.race,ch=G.chars.rabbit,sh=G.sh.rabbit;
  if(ch.state!=='out')return;
  if(r.mode==='paw'&&G.pawPath.length<2)return;
  const path=r.mode==='paw'?G.pawPath:r.path,closed=r.mode!=='paw';
  const base=S*3.1,shRuns=sh.state==='free'&&!sh.dash&&!sh.chase;
  const gap=shRuns?ch.prog-sh.prog:0,bt=G.t-r.leadT<3?.5:0;
  let vr=base*(1+.2*Math.sin(G.t*.7)+(r.lead==='rabbit'?bt:0)),vs=base*(1+.2*Math.sin(G.t*.7+2.4)+(r.lead==='shadow'?bt:0));
  if(gap>2.2)vr*=.62;if(gap<-2.2)vs*=.62;if(gap>4)vs*=1.3;if(gap<-4)vr*=1.3;
  if(ch.boostT>0)vr*=1.4;
  runAlong(ch,path,closed,vr,dt,-S*.3);
  if(shRuns){runAlong(sh,path,closed,vs,dt,S*.38);
    const ahead=ch.prog>=sh.prog?'rabbit':'shadow';
    if(ahead!==r.ahead){r.ahead=ahead;if(ahead==='shadow'){setMood(ch,'pout',2.6);SFX.pout()}else{setMood(ch,'happy',1.6)}logEv('race ahead '+ahead)}
  }
  const leader=(!shRuns||r.ahead==='rabbit')?ch:sh;
  dropPetal(leader,leader===ch?'pink':'lilac');
}

    ch.curPath=p;sh.curPath=p;ch.prog=nl==='rabbit'?1.1:0;sh.prog=nl==='shadow'?1.1:0;ch.joining=sh.joining=true;
  }else{
    const m=G.pawPath.length-1;if(m>0){const a=2*m-(((ch.prog%(2*m))+2*m)%(2*m)),b=2*m-(((sh.prog%(2*m))+2*m)%(2*m));const hi=Math.max(a,b)+.8,lo=Math.min(a,b);ch.prog=nl==='rabbit'?hi:lo;sh.prog=nl==='shadow'?hi:lo;ch.joining=sh.joining=true}

const PAIRS=['bear-cat','bear-duck','bear-mouse','bear-rabbit','cat-duck','cat-mouse','cat-rabbit','duck-mouse','duck-rabbit','mouse-rabbit'];
const GTYPES=[{sh:'tulip',h:[345,20,50]},{sh:'daisy',h:[0,48,330]},{sh:'bell',h:[265,215,295]},{sh:'star',h:[45,320,190]},{sh:'lily',h:[205,175,290]}];
function makeGarden(p,key,bf){
  const i=bf?0:Math.max(0,PAIRS.indexOf(key)),gt=bf?{sh:'forget',h:[205,215,195]}:GTYPES[i%5],n=bf?18:20,fl=[];
  const hs=bf?gt.h:(i>=5?gt.h.map(h=>(h+25)%360):gt.h);
  for(let k=0;k<n;k++){const a=rnd(TAU),r=Math.sqrt(Math.random());fl.push({dx:Math.cos(a)*r*1.6,dy:Math.sin(a)*r*.75,h:pick(hs)+rnd(-8,8),sz:rnd(.75,1.15),ph:rnd(TAU)})}
  fl.sort((a,b)=>a.dy-b.dy);
  return{x:p.x,y:p.y,key,sh:gt.sh,hue:hs[0],fl,t:G.t,gift:true,bf:!!bf};
}
function secretAt(p,k1,k2,bf){
  const key=bf?'butterfly':[k1,k2].sort().join('-');
  clampG(p);
  if(G.mem.pairs[key]||G.gardens.length>=9){sparkle(X(p.x),Y(p.y),6);SFX.tick();logEv('secret repeat '+key);return false}
  G.mem.pairs[key]=1;G.mem.secrets++;
  const g=makeGarden(p,key,bf);G.gardens.push(g);
  SFX.secret();focusAt(p.x,p.y);G.shake=.25;sparkle(X(p.x),Y(p.y),14,1.5);
  const rec=[k1,k2].filter(k=>k&&G.chars[k]&&G.chars[k].state==='out');
  rec.forEach((k,i)=>later(.9+i*.3,()=>giveJoy(G.chars[k],g.hue)));
  KINDS.filter(k=>!rec.includes(k)&&G.chars[k].state==='out').forEach((k,i)=>{later(1.6+i*.25,()=>setMood(G.chars[k],'beg',1.6));later(3+i*.3,()=>giveJoy(G.chars[k],g.fl[0].h,true))});
  later(1.4,()=>{g.gift=false});
  logEv('secret '+key);return true;
}
function recordTrail(sh){
  if(G.t>sh.trailUntil)return;
  const tr=sh.trail,last=tr[tr.length-1];
  if(last&&dpx(last,sh)<S*.22)return;
  const pt={x:sh.x,y:sh.y,t:G.t};tr.push(pt);
  if(last)checkCross(sh,last,pt);
}
function checkCross(sh,a,b){
  if(G.phase!=='explore')return;
  for(const k of KINDS){if(k===sh.kind)continue;const o=G.sh[k],tr=o.trail;if(!tr.length||G.t-tr[tr.length-1].t>4.5)continue;
    for(let i=0;i<tr.length;i++){const c=tr[i];if(G.t-c.t>4.5)continue;
      if(i>0){const ip=segInt(a,b,tr[i-1],c);if(ip){crossHit(sh,o,ip);return}}
      if(dpx(c,b)<S*.3){crossHit(sh,o,{x:(c.x+b.x)/2,y:(c.y+b.y)/2});return}}}
}

function buildCourse(){

  const cx=X(PLAZA.x),cy=Y(PLAZA.y),rmin=Math.min(GW,GH)*.16,rmaxX=Math.max(GW*.12,Math.min(GW*.38,GW*.5-S*3.4)),rmaxY=GH*.25;

  ang.sort((p,q)=>p.a-q.a);
  const merged=[];for(const p of ang){const l=merged[merged.length-1];if(l&&p.a-l.a<.3){l.dx=(l.dx+p.dx)/2;l.dy=(l.dy+p.dy)/2}else merged.push(p)}
  if(merged.length>1&&merged[0].a+TAU-merged[merged.length-1].a<.3)merged.pop();
  const full=[];
  for(let i=0;i<merged.length;i++){full.push(merged[i]);const n=merged[(i+1)%merged.length],gap=((n.a-merged[i].a)+TAU)%TAU||TAU;
    if(gap>1.1){const steps=Math.floor(gap/.9);for(let s=1;s<=steps;s++){const a=merged[i].a+gap*s/(steps+1);full.push({a,dx:Math.cos(a)*rmaxX*.75,dy:Math.sin(a)*rmaxY*.85})}}}
  if(full.length<4){full.length=0;for(let i=0;i<8;i++){const a=i/8*TAU;full.push({a,dx:Math.cos(a)*rmaxX*.8,dy:Math.sin(a)*rmaxY*.8})}}
  const ctl=full.map(p=>({x:NX(cx+p.dx),y:NY(cy+p.dy)})),out=[],n=ctl.length;
  for(let i=0;i<n;i++){const p0=ctl[(i-1+n)%n],p1=ctl[i],p2=ctl[(i+1)%n],p3=ctl[(i+2)%n];
    for(let s=0;s<6;s++){const t=s/6,t2=t*t,t3=t2*t;
      out.push(clampG({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)}))}}

      if(sh.kind==='rabbit'&&G.race&&own.state==='out'){/* race moves it */}
      else if(own.state==='out'||own.state==='pop'){const a=G.t*(.7+KINDS.indexOf(sh.kind)*.13)+sh.ph;stepTo(sh,own.x+(G.skewC<0?1:-1)*.03+Math.cos(a)*.03,own.y+.018+Math.sin(a)*.018,S*3,dt)}
    }else if(G.phase==='parade'){stepTo(sh,own.x+(G.skewC<0?1:-1)*S*.6/GW,own.y+S*.35/GH,S*7,dt)}
  }else if(sh.state==='lift'){/* updateLift */}
  else if(sh.state==='drop'){if(stepTo(sh,own.x+.03,own.y+.018,S*3,dt)){sh.state='free';sh.sqv+=5;sh.joining=true;sh.curPath=null}}
  else if(sh.state==='merge'){const m=sh.ms,B=G.big||G.ele||PLAZA,u=Math.min(1,(G.t-m.t0)/1.5),dx=(m.x-B.x)*GW,dy=(m.y-B.y)*GH,rot=u*4.5,k=1-ease(u);
    sh.x=B.x+(dx*Math.cos(rot)-dy*Math.sin(rot))*k/GW;sh.y=B.y+(dx*Math.sin(rot)+dy*Math.cos(rot))*k/GH;sh.spin=rot;sh.alpha=1-u*.8;sh.moving=true}
  if(sh.moving){const h=HOP[sh.kind];sh.hopPh+=dt*h[0];sh.hz=Math.abs(Math.sin(sh.hopPh))*S*h[1]*.8}else sh.hz*=.8;

function updateBalloons(dt){
  const L=G.lm.stand;
  G.balloons.forEach((b,i)=>{
    b.wob=Math.max(0,b.wob-dt*1.2);
    if(b.tether==='stand'){const tx=L.x+(i-1)*S*.7/GW,ty=L.y-(S*4.6+i*S*.4)/GH+Math.sin(G.t*1.3+b.ph)*S*.15/GH;b.x+=(tx-b.x)*Math.min(1,dt*3);b.y+=(ty-b.y)*Math.min(1,dt*3)}
    else if(b.tether==='hover'){b.x+=(b.tx-b.x)*Math.min(1,dt*1.5);b.y+=(b.ty-b.y)*Math.min(1,dt*1.5)}

  });
}
function currentTarget(){
  if(G.phase==='explore'){
    if(G.knot)return{x:G.knot.x,y:G.knot.y,kind:'knot'};
    if(G.big&&G.big.grow>.5)return{x:G.big.x,y:G.big.y,kind:'big'};
    const av=KINDS.filter(k=>G.sh[k].state==='peek'&&G.sh[k].grow>.6);
    if(av.length){if(G.t-G.hlT>7){G.hlIdx++;G.hlT=G.t}const k=av[G.hlIdx%av.length];return{x:G.sh[k].x,y:G.sh[k].y,kind:'peek',k}}
    if(G.order.length){const k=G.order[G.order.length-1],s=G.sh[k];if(s.state==='free')return{x:s.x,y:s.y,kind:'free',k}}
    return null;
  }
  if(G.phase==='parade'&&G.ele)return{x:G.ele.x,y:G.ele.y,kind:'ele'};
  return null;
}
function update(dt){
  G.t+=dt;
  if(G.timers.length){const due=[];G.timers=G.timers.filter(t=>{if(t.t<=G.t){due.push(t);return false}return true});for(const t of due)if(t.id===G.cycleId)t.fn()}
  for(const k of LMS){const l=G.lm[k];if(l&&l.wob>0)l.wob=Math.max(0,l.wob-dt*2)}
  if(G.oldRibbon)G.oldRibbon.wob=Math.max(0,G.oldRibbon.wob-dt*1.5);
  for(const k of KINDS){updateChar(G.chars[k],dt)}
  for(const k of KINDS){updateShadow(G.sh[k],dt)}
  updateBalloons(dt);updateLift(dt);updateBfly(dt);
  if(G.big){G.big.grow=Math.min(1,G.big.grow+dt/4.5)}
  if(G.phase==='explore'){
    if(G.order.length>=2&&!G.bfly&&!G.knot&&G.t>G.nextBfly){G.nextBfly=G.t+rnd(40,70);if(Math.random()<(G.cycle>0?.55:.4))spawnBfly()}
    G.birdT-=dt;if(G.birdT<0){G.birdT=rnd(8,16);SFX.bird()}
  }
  const e=G.ele;
  if(e){spring(e,dt);e.scale+=(1-e.scale)*Math.min(1,dt*(G.phase==='farewell'&&G.fw.stage==='jump'&&G.fw.st>2.2?0:4));
    e.trunkUp=Math.max(0,e.trunkUp-dt);e.trunk+=((e.trunkUp>0?1:e.slurp>0?-.2:.15+.1*Math.sin(G.t*1.5))-e.trunk)*Math.min(1,dt*6);e.slurp=Math.max(0,e.slurp-dt);
    e.blinkT-=dt;if(e.blinkT<0){e.blink=.15;e.blinkT=rnd(2,5)}if(e.blink>0)e.blink-=dt;e.moving=false;
    if(G.phase==='parade')updateParade(dt);else if(G.phase==='farewell')updateFarewell(dt);
    if(e.moving){e.hopPh+=dt*5;e.hz=Math.abs(Math.sin(e.hopPh))*S*.12;const kk=Math.floor(e.hopPh/Math.PI);if(kk!==e.hopK){e.hopK=kk;tone(120+rnd(20),.12,'sine',.08,80);if(G.phase==='parade')for(const k of KINDS){const o=G.chars[k];if(o.ride)o.sqv+=1}}}else e.hz*=.85}
  if(G.phase==='farewell'&&!e)G.washDir=1;
  // wash transition
  if(G.washDir===1){G.wash=Math.min(1,G.wash+dt*1.1);if(G.wash>=1){G.cycle++;newCycle(G.nextLay);G.nextLay=null;G.washDir=-1}}
  else if(G.washDir===-1){G.wash=Math.max(0,G.wash-dt*.9);if(G.wash<=0)G.washDir=0}
  G.shake=Math.max(0,G.shake-dt*1.6);
  // particles
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;
    if(p.t==='dust'||p.t==='spark'||p.t==='mist'){p.vx*=1-dt*2;p.vy*=1-dt*1.5}
    if(p.t==='petal'){p.vx*=1-dt*1.5;p.vy=Math.min(p.vy,S*1.5);p.rot+=p.vr*dt}
    if(p.t==='wind'){const k=Math.min(1,p.life/p.max);p.x=lerp(p.x0,p.tx,ease(k))+Math.sin(p.life*4)*S*.4;p.y=lerp(p.y0,p.ty,k)+Math.sin(k*Math.PI)*-S*1.5;p.rot+=dt*4}
    let dead=p.life>=p.max;
    if(p.t==='drop'&&p.ly&&p.y>=p.ly)dead=true;
    if(dead){if(p.land){addPuddle(p.land.x,p.land.y);drops(p.x,p.y,3,.4)}G.parts.splice(i,1)}}
  // hints
  const tgt=currentTarget();G.tgt=tgt;
  const idle=G.t-G.lastInput;
  if(tgt&&idle>10&&G.phase!=='merge'){G.windT-=dt;if(G.windT<0){G.windT=1.8;for(let i=0;i<2;i++){const fromL=G.sunX<.5;const x0=fromL?-S:W+S,y0=Y(rnd(.3,.8));addP({t:'wind',x:x0,y:y0,x0,y0,tx:X(tgt.x)+rnd(-1,1)*S,ty:Y(tgt.y)-S*.5,vx:0,vy:0,max:2.2+i*.3,r:S*.15,h:pick([340,20,280]),rot:0})}}}
  if(tgt&&idle>10&&!G.demoDone&&G.phase!=='merge'){G.demoDone=true;G.demo={t:0,tgt}}
  if(G.demo){G.demo.t+=dt;if(G.demo.t>2.6)G.demo=null}
}

/* ================= input ================= */
function shadowHitPt(sh){return{x:X(sh.x)-G.skewC*S*.5,y:Y(sh.y)-S*.7-sh.hz}}
function handleTap(px,py){
  G.lastInput=G.t;G.demo=null;G.finger={x:px,y:py,t:G.t};
  const tryHit=(pt,r)=>{const d=Math.hypot(px-pt.x,py-pt.y);return d<=r?d:-1};
  const minR=Math.max(S*1.35,30);
  if(G.phase==='merge'||G.washDir!==0||G.phase==='farewell'){dust(px,py,4,.5);SFX.tick();return'busy'}
  if(G.phase==='parade'){
    const e=G.ele,h=eleHit();
    let best=null,bd=1e9;
    for(const k of KINDS){const ch=G.chars[k],sh=G.sh[k];
      const d1=tryHit(shadowHitPt(sh),minR),d2=tryHit({x:X(ch.x),y:Y(ch.y)-S*1.1-ch.z},Math.max(S*1.1,26));
      const d=Math.min(d1<0?1e9:d1,d2<0?1e9:d2);if(d<bd&&!(k===G.parade.rider&&d2>=0&&d1<0)){bd=d;best=k}}
    const de=tryHit(h,h.r);
    if(best&&(de<0||bd<de*.8)){G.sh[best].sqv+=7;dust(px,py,8);promote(best);return'promote'}
    if(de>=0){tapElephant();dust(px,py,10);return'ele'}
    dust(px,py,4,.5);SFX.tick();return'none';
  }
  // explore
  if(G.knot){const d=tryHit({x:X(G.knot.x),y:Y(G.knot.y)-S*.3},Math.max(S*1.7,34));if(d>=0){tapKnot();return'knot'}}
  let best=null,bd=1e9;
  if(G.big){const b=bigHit(),db=tryHit(b,b.r);if(db>=0){let near=false;for(const k of KINDS){const sh=G.sh[k];if(sh.state!=='free'&&sh.state!=='peek')continue;const d=tryHit(shadowHitPt(sh),minR);if(d>=0&&d<db)near=true}
    if(!near){transform();dust(px,py,12,1.2);return'big'}}}
  for(const k of KINDS){const sh=G.sh[k];if(sh.state!=='peek'||sh.grow<.12)continue;const d=tryHit(shadowHitPt(sh),Math.max(S*1.6,34));if(d>=0&&d<bd){bd=d;best=k}}
  if(best){discover(best);return'discover'}
  if(G.lift){const sh=G.sh[G.lift.kind];const d=tryHit({x:X(sh.x),y:Y(sh.y)-S*.7},minR*1.1);if(d>=0){tapLifted(sh);return'lifted'}}
  for(const k of KINDS){const sh=G.sh[k];if(sh.state!=='free')continue;const d=tryHit(shadowHitPt(sh),minR);if(d>=0&&d<bd){bd=d;best=k}}
  if(best){tapShadow(G.sh[best]);return'shadow'}
  for(const k of KINDS){const ch=G.chars[k];if(ch.state!=='out')continue;const d=tryHit({x:X(ch.x),y:Y(ch.y)-S*1.1-ch.z-ch.hz},Math.max(S*1.1,26));if(d>=0&&d<bd){bd=d;best=k}}
  if(best){const ch=G.chars[best];jump(ch,6);setMood(ch,'happy',.9);SFX.giggle(best);ch.sqv+=3;return'char'}
  if(G.oldRibbon){const L=G.lm[LMK[G.oldRibbon.kind]],rp=oldRibbonPt(L);if(tryHit(rp,Math.max(S*1.2,28))>=0){G.oldRibbon.wob=1;SFX.tick();const sh=G.sh[G.oldRibbon.kind];if(sh.state==='peek'){sh.tw=1;sh.sqv+=4}L.wob=.6;return'oldribbon'}}
  if(G.ribbon&&G.ribbon.owner==='ground'&&tryHit({x:X(G.ribbon.x),y:Y(G.ribbon.y)},Math.max(S,26))>=0){G.ribbon.wob=1;SFX.tick();const c=G.chars.cat;if(c.state==='out'){c.tail=1;setMood(c,'surprise',.6)}return'ribbon'}
  for(const k of LMS){const L=G.lm[k];if(Math.abs(px-X(L.x))<S*1.8&&py<Y(L.y)+S*.3&&py>Y(L.y)-S*(k==='tree'?6:2.4)){L.wob=.8;SFX.rustle();dust(px,py,3,.4);return'landmark'}}
  dust(px,py,4,.5);SFX.tick();return'none';
}
function oldRibbonPt(L){return{x:X(L.x)+(L.x<.5?1:-1)*S*1.3,y:Y(L.y)-S*1.3}}
function tapShadow(sh){
  const now=G.t;sh.taps=(now-sh.lastTap<1.6)?Math.min(4,sh.taps+1):0;sh.lastTap=now;
  const amp=1+sh.taps*.25;sh.sqv+=7*amp;sh.mood='happy';sh.moodT=1;
  const hp=shadowHitPt(sh);dust(hp.x,hp.y,6+sh.taps*3,amp,'#d6c4f2');SFX.pon((KP[sh.kind]||1)*(1.1+sh.taps*.08));

  sh.trail=[];sh.trailUntil=now+2.2;
  let dest=null;
  switch(sh.kind){
  case'rabbit':rabbitSwap();break;
  case'cat':catShadowTap();break;
  case'duck':duckShadowTap();break;
  case'bear':dest=bearRelocate();break;
  case'mouse':mouseShadowTap();break;

function drawFlower(c,x,y,sz,h,shape,t,ph){
  const r=S*.22*sz,sw=Math.sin(t*1.6+ph)*r*.15;
  c.strokeStyle='#8fbf8a';c.lineWidth=Math.max(1,r*.22);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x,y-r*.8,x+sw,y-r*1.5);c.stroke();
  const fx=x+sw,fy=y-r*1.6;
  c.fillStyle=hsl(h,72,80);c.beginPath();
  switch(shape){
  case'tulip':E(c,fx-r*.3,fy,r*.32,r*.5,-.2);E(c,fx+r*.3,fy,r*.32,r*.5,.2);E(c,fx,fy-r*.08,r*.3,r*.52);c.fill();break;
  case'daisy':for(let i=0;i<7;i++){const a=i/7*TAU;E(c,fx+Math.cos(a)*r*.5,fy+Math.sin(a)*r*.5,r*.32,r*.18,a)}c.fill();c.fillStyle='#fde08e';c.beginPath();E(c,fx,fy,r*.25,r*.25);c.fill();break;
  case'bell':c.moveTo(fx-r*.45,fy+r*.35);c.quadraticCurveTo(fx-r*.45,fy-r*.5,fx,fy-r*.5);c.quadraticCurveTo(fx+r*.45,fy-r*.5,fx+r*.45,fy+r*.35);c.quadraticCurveTo(fx+r*.22,fy+r*.2,fx,fy+r*.35);c.quadraticCurveTo(fx-r*.22,fy+r*.2,fx-r*.45,fy+r*.35);c.fill();break;
  case'star':for(let i=0;i<10;i++){const a=-Math.PI/2+i/10*TAU,rad=i%2?r*.28:r*.62;i?c.lineTo(fx+Math.cos(a)*rad,fy+Math.sin(a)*rad):c.moveTo(fx+Math.cos(a)*rad,fy+Math.sin(a)*rad)}c.closePath();c.fill();c.fillStyle='#fff6d0';c.beginPath();E(c,fx,fy,r*.14,r*.14);c.fill();break;
  case'lily':for(let i=0;i<3;i++){const a=-Math.PI/2+(i-1)*.7;E(c,fx+Math.cos(a)*r*.35,fy+Math.sin(a)*r*.35,r*.5,r*.18,a)}c.fill();c.fillStyle='#fde08e';c.beginPath();E(c,fx,fy+r*.05,r*.1,r*.1);c.fill();break;
  default:for(let i=0;i<5;i++){const a=i/5*TAU;E(c,fx+Math.cos(a)*r*.3,fy+Math.sin(a)*r*.3,r*.24,r*.24)}c.fill();c.fillStyle='#fde08e';c.beginPath();E(c,fx,fy,r*.13,r*.13);c.fill();
  }

function drawGarden(c,g){

    c.strokeStyle=`rgba(${PAL.sh},${(1-k)*.8})`;c.lineWidth=S*.12;c.lineCap='round';
    for(let i=0;i<7;i++){const a=i/7*TAU+k*5,r0=S*(.3+k*2.4);c.beginPath();c.ellipse(x,y,r0,r0*.45,0,a,a+.9);c.stroke()}c.restore();

  if(g.bf){for(let i=0;i<2;i++){const a=G.t*1.3+i*Math.PI;drawButterfly(c,x+Math.cos(a)*S*1.3,y-S*1.2+Math.sin(a*2)*S*.4,S*.5,200+i*80)}}

function drawButterfly(c,x,y,s,h){

  c.fillStyle=hsl(h,75,80);c.beginPath();E(c,-s*.35*f,-s*.15,s*.38*f,s*.32,-.3);E(c,s*.35*f,-s*.15,s*.38*f,s*.32,.3);E(c,-s*.25*f,s*.2,s*.25*f,s*.22,.3);E(c,s*.25*f,s*.2,s*.25*f,s*.22,-.3);c.fill();

function drawBalloon(c,b,ax,ay){
  const x=X(b.x),y=Y(b.y),wb=Math.sin(G.t*14)*b.wob*.15,rx=S*.55*b.r*(1+wb),ry=S*.68*b.r*(1-wb);
  if(ax!=null){c.strokeStyle='rgba(150,130,150,.7)';c.lineWidth=Math.max(1,S*.03);c.beginPath();c.moveTo(x,y+ry);c.quadraticCurveTo(x+Math.sin(G.t*2+b.ph)*S*.4,(y+ry+ay)/2,ax,ay);c.stroke()}
  c.fillStyle=hsl(b.hue,70,80);c.beginPath();E(c,x,y,rx,ry);c.fill();

    else drawBalloon(c,b,null,null);
  }
  if(G.lift){const sh=G.sh[G.lift.kind];sh.spin=Math.max(0,sh.spin-.02);drawShadowSil(c,sh.kind,X(sh.x),Y(sh.y),S*.9,{alpha:.5,sq:sh.sq,tw:sh.tw,tail:G.t*3,face:sh.face,eyes:1,blink:sh.blink>0,mood:'happy',rot:sh.spin*TAU})}
  if(G.phase==='parade'&&G.parade.sky&&G.balloons.length){
    const P=G.parade,n=P.order.length;
    for(let i=0;i<n;i++){const u=((G.t*.03+i*.065)%1.3)-.15,x=X(u),y=Y(.13+.035*Math.sin(u*7+G.t))-S*.5;drawShadowSil(c,P.order[i],x,y,S*.55,{alpha:.4,face:1,eyes:1,tail:G.t*3,tw:Math.sin(G.t*4+i),mood:'happy'});
      if(i===0){const b=G.balloons[0];c.save();drawBalloon(c,{x:NX(x+S*.9),y:NY(y-S*2),r:.7,hue:b.hue,ph:b.ph,wob:0,ribbon:true},x+S*.3,y-S*.9);c.restore()}}
  }
  if(G.bfly&&G.bfly.state!=='land')drawButterfly(c,X(G.bfly.x),Y(G.bfly.y),S*.55,G.bfly.hue);
  if(G.parade&&G.t-G.parade.rainbow<3&&G.ele){const k=(G.t-G.parade.rainbow)/3,e=G.ele,x=X(e.x)+e.face*S*4,y=Y(e.y)+S*.5;c.lineWidth=S*.22;for(let i=0;i<6;i++){c.strokeStyle=hsl(i*55,85,80,Math.sin(k*Math.PI)*.55);c.beginPath();c.arc(x,y,S*(3.2+i*.24),Math.PI*1.05,Math.PI*1.95);c.stroke()}}
  drawParticles(c);
  if(G.demo)drawHand(c,G.demo);
  c.restore();
  if(G.wash>0){c.fillStyle=`rgba(253,226,214,${ease(G.wash)})`;c.fillRect(0,0,W,H);if(G.wash>.3){c.globalAlpha=ease(G.wash);for(let i=0;i<5;i++){const a=G.t*.6+i*1.25;c.fillStyle=hsl(330+i*20,70,86);c.beginPath();E(c,W/2+Math.cos(a)*U*.25,H/2+Math.sin(a)*U*.12,S*.3,S*.18,a);c.fill()}c.globalAlpha=1}}
}
let grainPat2=null;

/* ================= loop / resize ================= */
let last=0,raf=0,running=false,resizeT=0;
function frame(ts){raf=0;if(!running)return;const now=ts/1000;let dt=last?now-last:1/60;last=now;dt=Math.min(Math.max(dt,0),.05);
  try{update(dt);render()}catch(e){console.error(e)}
  raf=requestAnimationFrame(frame)}
function start(){if(running)return;running=true;last=0;raf=requestAnimationFrame(frame)}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0}
function resize(){
  const nw=Math.max(1,window.innerWidth|0),nh=Math.max(1,window.innerHeight|0);
  W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;
  GW=Math.max(1,W-SA.l-SA.r);GH=Math.max(1,H-SA.t-SA.b);U=Math.min(GW,GH*.8);S=U*.074;
  G.parts.length=0;buildSprites();grainPat=null;
  if(G.lm.hedge)renderBG();
  grainPat=grainPat||true;grainPat2=null;
}
function scheduleResize(){clearTimeout(resizeT);resizeT=setTimeout(()=>{resize();if(!running)render()},80)}
window.addEventListener('resize',scheduleResize);
window.addEventListener('orientationchange',()=>{scheduleResize();setTimeout(scheduleResize,350)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();try{if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{})}catch(e){}}else{start();try{if(AU.c)AU.c.resume().catch(()=>{})}catch(e){}}});
window.addEventListener('pagehide',()=>{stop()});
window.addEventListener('pageshow',()=>{if(!document.hidden)start()});

// boot
G.saved=loadMem();
resize();
newCycle(null);
start();

// test hooks (no UI)
window.__kage={G,AU,running:()=>running,render:()=>render(),
  scr:o=>({x:X(o.x),y:Y(o.y)}),
  shadowPt:k=>shadowHitPt(G.sh[k]),
  liftPt:()=>{const sh=G.lift&&G.sh[G.lift.kind];return sh?{x:X(sh.x),y:Y(sh.y)-S*.7}:null},
  charPt:k=>{const c=G.chars[k];return{x:X(c.x),y:Y(c.y)-S*1.1-c.z}},
  bigPt:()=>G.big?bigHit():null,elePt:()=>G.ele?eleHit():null,knotPt:()=>G.knot?{x:X(G.knot.x),y:Y(G.knot.y)-S*.3}:null,
  tap:(x,y)=>handleTap(x,y),
  step:sec=>{for(let i=0;i<sec*60;i++)update(1/60);render()},
  spawnBfly,S:()=>S,target:()=>G.tgt
};
})();
</script>
