<script>
'use strict';
(function(){
/* ============================================================
   かいがら家具の海底アトリエと、ぷかぷかおまつり島
   一枚完結。外部通信なし。Canvas2D + Web Audio 合成。
   ============================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const easeOut=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const easeBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const sgn=v=>v<0?-1:1;

/* ---------------- 音（Web Audio 合成） ---------------- */
const A={
  c:null,m:null,nb:null,voices:0,music:0,nextBeat:0,beat:0,amb:null,muted:false,
  init(){
    if(this.c){ if(this.c.state!=='running'){ try{this.c.resume().catch(()=>{});}catch(e){} } return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.c=new AC(); }catch(e){ this.c=null; return; }
    const c=this.c;
    try{
      this.m=c.createGain(); this.m.gain.value=.55;
      const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4;
      this.m.connect(comp); comp.connect(c.destination);
      const len=Math.floor(c.sampleRate*1.2), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.nb=b;
      const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
      if(c.resume) c.resume().catch(()=>{});
      this.startAmb();
    }catch(e){}
  },
  get ok(){ return !!(this.c&&this.c.state==='running'&&this.m); },
  startAmb(){
    try{
      const c=this.c, s=c.createBufferSource(); s.buffer=this.nb; s.loop=true;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
      const g=c.createGain(); g.gain.value=.035;
      s.connect(f); f.connect(g); g.connect(this.m); s.start();
      this.amb={s,f,g};
    }catch(e){}
  },
  tone(f,d,o){
    o=o||{}; if(!this.ok||this.voices>30) return;
    try{
      const c=this.c,t=c.currentTime+(o.delay||0),a=o.a||.006;
      const os=c.createOscillator(); os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
      if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.slide||d));
      const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.v||.2,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
      let n=os; if(o.lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; os.connect(fl); n=fl; }
      n.connect(g); g.connect(this.m); os.start(t); os.stop(t+a+d+.05);
      this.voices++; os.onended=()=>{this.voices--;};
    }catch(e){}
  },
  noise(d,o){
    o=o||{}; if(!this.ok||this.voices>30) return;
    try{
      const c=this.c,t=c.currentTime+(o.delay||0);
      const s=c.createBufferSource(); s.buffer=this.nb;
      const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t); f.Q.value=o.q||1;
      if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+d);
      const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.v||.15,t+(o.a||.01)); g.gain.exponentialRampToValueAtTime(.0001,t+(o.a||.01)+d);
      s.connect(f); f.connect(g); g.connect(this.m); s.start(t, Math.random()*.5); s.stop(t+d+.08);
      this.voices++; s.onended=()=>{this.voices--;};
    }catch(e){}
  },
  koto(p){ p=p||1; this.tone(560*p,.09,{type:'triangle',v:.26,to:320*p}); this.tone(1300*p,.035,{v:.07}); this.noise(.035,{f:2600,q:1.4,v:.1}); },
  thud(p){ p=p||1; this.tone(260*p,.12,{type:'triangle',v:.22,to:150*p}); this.noise(.06,{f:700,q:.8,v:.08}); },
  kachin(){ this.tone(1568,.12,{type:'triangle',v:.2}); this.tone(2349,.2,{v:.11,delay:.03}); this.tone(3136,.1,{v:.05,delay:.05}); this.koto(1.3); },
  poko(lv){ const f=300*Math.pow(2,(lv||0)/12); this.tone(f,.08,{to:f*2.3,v:.15}); },
  pop(){ this.tone(680,.05,{to:1500,v:.12}); },
  splash(){ this.noise(.38,{f:1100,q:.6,v:.2,to:280}); this.tone(620,.16,{to:170,v:.1}); },
  bigSplash(){ this.noise(1.1,{f:1600,q:.5,v:.32,to:200,a:.02}); this.tone(300,.6,{to:90,v:.18}); this.noise(.5,{f:4000,q:.7,v:.1,delay:.15}); },
  chime(big){
    const base=big?659.25:880, notes=big?[0,4,7,12,16,19]:[0,7,12];
    notes.forEach((n,i)=>{ const f=base*Math.pow(2,n/12); this.tone(f,.55,{v:big?.16:.1,delay:i*.085}); this.tone(f*3.98,.12,{v:.025,delay:i*.085}); });
  },
  giggle(){ for(let i=0;i<4;i++) this.tone(920+i*130,.06,{type:'triangle',v:.07,delay:i*.075,to:1250+i*110}); },
  boing(){ this.tone(200,.35,{to:460,v:.17,slide:.12}); },
  whoosh(d){ this.noise(d||1,{f:260,to:2600,q:.7,v:.2,a:.2}); },
  creak(){ this.tone(118,.45,{type:'sawtooth',v:.045,to:86,lp:520}); this.tone(176,.3,{type:'sawtooth',v:.02,to:150,lp:700,delay:.12}); },
  boom(){ this.tone(120,.28,{to:62,v:.26}); this.noise(.08,{f:300,q:.8,v:.08}); },
  note(f,v,d,delay,type){ this.tone(f,d||.3,{v:v||.12,delay:delay||0,type:type||'sine'}); },
  call(){ [0,5,9].forEach((n,i)=>this.tone(988*Math.pow(2,n/12),.18,{type:'triangle',v:.09,delay:i*.12})); },
  firework(){ this.noise(.5,{f:2400,q:.5,v:.1,to:900}); this.tone(1200,.3,{to:500,v:.06}); },
  musicTick(){
    if(!this.ok) return; const c=this.c;
    if(!this.music){ this.nextBeat=c.currentTime+.1; return; }
    const bt=this.music>1?.26:.34;
    const mel=[0,2,4,7,9,7,4,2, 4,7,9,12,9,7,4,0];
    const bass=[0,0,7,7,5,5,7,7];
    while(this.nextBeat<c.currentTime+.2){
      const dl=Math.max(0,this.nextBeat-c.currentTime), i=this.beat%16;
      if(this.music>1||i%2===0){ const f=523.25*Math.pow(2,mel[i]/12); this.tone(f,.22,{v:this.music>1?.075:.045,delay:dl,type:'triangle'}); }
      if(i%4===0) this.tone(130.8*Math.pow(2,bass[(this.beat>>2)%8]/12),.35,{v:.08,delay:dl});
      if(this.music>1&&i%4===2) this.noise(.05,{f:5000,q:1,v:.05,delay:dl});
      if(this.music>1&&i%8===0) this.tone(90,.18,{to:55,v:.14,delay:dl});
      this.nextBeat+=bt; this.beat++;
    }
  },
  suspend(){ try{ if(this.c&&this.c.state==='running') this.c.suspend(); }catch(e){} },
  resume(){ try{ if(this.c&&this.c.state!=='running') this.c.resume().catch(()=>{}); }catch(e){} }
};

/* ---------------- キャンバスと配置 ---------------- */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let c=ctx; // 現在の描画先
let SW=0,SH=0,DPR=1,K=1,W=700,H=1000;
let L=null;
function readSafe(){
  const e=document.getElementById('sa'); const cs=getComputedStyle(e);
  const f=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
  return {t:f(cs.paddingTop),r:f(cs.paddingRight),b:f(cs.paddingBottom),l:f(cs.paddingLeft)};
}
function computeLayout(){
  const sw=Math.max(200,window.innerWidth||document.documentElement.clientWidth||390);
  const sh=Math.max(200,window.innerHeight||document.documentElement.clientHeight||844);
  SW=sw; SH=sh; DPR=Math.min(2,window.devicePixelRatio||1);
  K=Math.min(sw,sh)/700; W=sw/K; H=sh/K;
  cv.width=Math.round(sw*DPR); cv.height=Math.round(sh*DPR);
  cv.style.width=sw+'px'; cv.style.height=sh+'px';
  const sa=readSafe(); const st=sa.t/K,sb=sa.b/K,sl=sa.l/K,sr=sa.r/K;
  const n={};
  n.safe={t:st,b:sb,l:sl,r:sr};
  n.roomW=Math.min(W-56-sl-sr,880);
  n.wallL=(W-n.roomW)/2+(sl-sr)/2; n.wallR=n.wallL+n.roomW; n.cx=(n.wallL+n.wallR)/2;
  const bottom=Math.max(100,H*.13)+sb;
  n.floorY=H-bottom;
  n.roofH=Math.min(120,n.roomW*.15);
  n.roomH=clamp(H-bottom-n.roofH-46-st,360,780); n.ceilY=n.floorY-n.roomH;
  n.ledgeH=Math.round(n.roomH*.5); n.ledgeY=n.floorY-n.ledgeH;
  n.ledgeX1=n.wallR-16; n.ledgeX0=n.ledgeX1-Math.min(236,n.roomW*.32);
  n.doorX0=n.wallL+16; n.doorW=112; n.doorH=Math.min(256,n.roomH*.5); n.hookX=n.doorX0+n.doorW/2; n.hookY=n.floorY-n.doorH-6;
  n.ventX=n.wallL+n.roomW*.6;
  n.octoHome=n.wallL+n.roomW*.1;
  n.winR=Math.min(54,(n.ledgeY-n.ceilY)*.28); n.winX=(n.ledgeX0+n.ledgeX1)/2; n.winY=n.ledgeY-Math.max(n.winR+30,(n.ledgeY-n.ceilY)*.5);
  n.stageH=64;
  n.zI=clamp(W/(n.roomW+240),.5,1);
  n.seaY=n.floorY+34;
  n.camIy=n.floorY-((H>W?.2:.12)*H)/n.zI;
  n.bridgeLen=clamp((W/n.zI-n.roomW)/2-14,90,168);
  const old=L; L=n;
  if(old&&S) remapAll(old,n);
  cacheDirty=true;
}
function mapX(x,o,n){ return n.wallL+(x-o.wallL)*n.roomW/o.roomW; }
function mapY(y,o,n){ return n.floorY-(o.floorY-y); }

/* ---------------- 状態 ---------------- */
const DIM={seat:{w:140,h:100},legsS:{w:130,h:72},legsT:{w:130,h:150},shelf:{w:200,h:132},dish:{w:124,h:42},curtain:{w:124,h:236},kelp:{w:46,h:262}};
const SAVE_KEY='kaigara-atelier-261029-18';
let S=null;
let cacheDirty=true;
const isLegs=p=>p&&(p.type==='legsS'||p.type==='legsT');
function P(id){ for(const p of S.pieces) if(p.id===id) return p; return null; }
function newPiece(id,type,x,y,o){
  const d=DIM[type];
  return Object.assign({id,type,x,y,w:d.w,h:d.h,rot:0,vy:0,mode:'rest',support:'floor',upright:true,on:null,seat:null,uses:0,sq:0,sqv:0,fl:0,link:false,linkTo:null,stillT:9,availT:0,dir:1,th:0,om:0,hop:0,tx:x,ty:y,restY:y,flip:0,lift:0,busy:0,bridge:0,usedBy:{},hintHop:0},o||{});
}
function defaultPieces(){
  const j=()=>rnd(-.025,.025);
  const u=v=>L.wallL+L.roomW*v;
  const ps=[];
  ps.push(newPiece('curtain','curtain',u(.72+j()),L.floorY,{flip:0}));
  ps.push(newPiece('legsS','legsS',u(.34+j()),L.floorY));
  ps.push(newPiece('seat','seat',u(.52+j()),L.floorY,{rot:-.28}));
  ps.push(newPiece('dish','dish',u(.86+j()),L.floorY,{upright:false}));
  ps.push(newPiece('shelf','shelf',clamp(u(.97),L.wallL+90,L.wallR-80),L.floorY,{upright:false}));
  const lx=L.ledgeX0, lw=L.ledgeX1-L.ledgeX0;
  ps.push(newPiece('legsT','legsT',lx+lw*.36,L.ledgeY,{support:'ledge'}));
  ps.push(newPiece('kelp','kelp',lx+lw*.82,L.ledgeY,{support:'ledge'}));
  for(const p of ps){ p.restY=p.y; p.tx=p.x; }
  return ps;
}
const FISH_KINDS={
  red:{body:'#ff7a6b',stripe:'#fff1d6',fin:'#ffb347',size:1},
  yellow:{body:'#ffd54a',stripe:'#5ec6e8',fin:'#ff9f68',size:.92},
  blue:{body:'#59c7ff',stripe:'#fff6e0',fin:'#8b7bff',size:.96},
  puffer:{body:'#f7d58b',stripe:'#c9874a',fin:'#f6a96b',size:1},
  f1:{body:'#ff9ecb',stripe:'#ffffff',fin:'#ffd1e6',size:.72},
  f2:{body:'#a6f0c6',stripe:'#ffffff',fin:'#6fd3a0',size:.7},
  f3:{body:'#c8b6ff',stripe:'#fff7c2',fin:'#9e86ff',size:.74}
};
function newFish(kind,x,y){
  const k=FISH_KINDS[kind];
  return {kind,x,y,vx:0,vy:0,dir:1,tilt:0,size:k.size,state:'wander',st:0,tx:x,ty:y,lookX:x+50,lookY:y,blink:0,nextBlink:rnd(1,4),
    face:'normal',faceT:0,fav:null,mem:{},wig:rnd(0,6),puff:0,cautious:kind==='puffer',data:{},hidden:false,riding:null,actCool:rnd(1,3),hop:0,want:0,friend:kind[0]==='f'};
}
function freshState(){
  return {
    phase:'sea',t:0,pieces:[],fish:[],octo:null,guests:[],parts:[],
    found:{},cur:Math.random()<.5?1:-1,light:.8,touched:false,lastInput:0,idleReach:false,
    float:{seed:null,fill:0,lift:0,n:0,hold:0,creak:0,members:[],bubbleLv:0},
    trans:null,houseShake:0,creak:0,friendsCalled:0,visitors:{},festivals:0,climax:0,climaxCool:0,
    centerId:null,centerT:0,guestT:3,pendingHat:null,hatCool:0,seekCool:3,saveT:0,notes:[],
    ripple:[],hint:{t:0,k:0},islandT:0,seedRand:Math.random()
  };
}
function makeChars(){
  S.octo={x:L.octoHome,y:L.floorY,tx:L.octoHome,state:'idle',st:0,face:'normal',faceT:0,blink:0,nextBlink:2,lookX:L.cx,lookY:L.floorY-100,
    ph:rnd(0,6),climb:0,climbT:0,stretch:0,squat:0,spin:0,dir:1,walk:0,hat:null,hatK:0,hatTilt:0,hatVar:'snug',hatX:0,hatY:0,hatRot:0,
    arm:0,armX:0,armY:0,reach:null,lean:0,data:{wt:7},present:0};
  const sx=P('seat').x;
  S.fish=[newFish('red',sx+20,L.floorY-170),newFish('yellow',sx-90,L.floorY-260),newFish('blue',L.wallL+L.roomW*.75,L.floorY-300),newFish('puffer',L.wallL+L.roomW*.86,L.floorY-160)];
  S.fish[0].dir=-1;
}
function remapAll(o,n){
  for(const p of S.pieces){
    p.x=mapX(p.x,o,n); p.tx=mapX(p.tx,o,n);
    if(p.support==='ledge'&&S.phase==='sea'){ p.y=n.ledgeY; p.restY=n.ledgeY; }
    else if(p.support==='ledge'){ p.y=n.floorY-n.stageH; p.restY=p.y; }
    else { p.y=mapY(p.y,o,n); p.restY=mapY(p.restY,o,n); }
    p.ty=mapY(p.ty,o,n);
    clampPieceX(p);
  }
  const m=a=>{ a.x=mapX(a.x,o,n); a.y=mapY(a.y,o,n); if(a.tx!==undefined) a.tx=mapX(a.tx,o,n); if(a.ty!==undefined) a.ty=mapY(a.ty,o,n); };
  if(S.octo){ m(S.octo); S.octo.y=n.floorY; }
  S.fish.forEach(m); S.guests.forEach(m);
  S.parts.length=0;
}
function clampPieceX(p){
  if(p.mode==='drag') return;
  const hw=pieceHalfW(p);
  if(S.phase==='island'&&p.type==='shelf'&&p.bridge) return;
  p.x=clamp(p.x,L.wallL+hw+4,L.wallR-hw-4);
  p.tx=p.x;
}
function pieceHalfW(p){
  if(p.type==='shelf') return p.upright?104:68;
  if(p.type==='kelp') return 24;
  return p.w/2;
}

/* ---------------- 保存と復元（端末内のみ） ---------------- */
function saveNow(){
  try{
    const ps=S.pieces.map(p=>{
      let y=p.restY, sup=p.support;
      if(p.mode==='worn'||p.link){ y=sup==='ledge'?(S.phase==='sea'?L.ledgeY:L.floorY-L.stageH):L.floorY; }
      return {id:p.id,type:p.type,u:+((p.x-L.wallL)/L.roomW).toFixed(4),sup,up:!!p.upright,on:p.on,seat:p.seat,uses:Math.min(9999,p.uses|0)};
    });
    const fav={}; S.fish.forEach(f=>{ if(f.fav) fav[f.kind]=f.fav; });
    const data={v:1,phase:(S.phase==='island'||S.phase==='rise')?'island':'sea',cur:S.cur,pieces:ps,fav,friends:S.friendsCalled,visitors:S.visitors,found:S.found,festivals:S.festivals,at:Date.now()};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadSave(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ return null; }
  if(!raw) return null;
  try{
    const d=JSON.parse(raw);
    if(!d||d.v!==1||!Array.isArray(d.pieces)) return null;
    return d;
  }catch(e){ return null; }
}
function applySave(d){
  try{
    const ids=['curtain','legsS','seat','dish','shelf','legsT','kelp'];
    const byId={};
    for(const q of d.pieces){ if(q&&ids.indexOf(q.id)>=0&&q.type===q.id&&isFinite(q.u)) byId[q.id]=q; }
    if(Object.keys(byId).length<4) return false;
    const island=d.phase==='island';
    for(const p of S.pieces){
      const q=byId[p.id]; if(!q) continue;
      p.x=L.wallL+clamp(+q.u,0,1)*L.roomW;
      p.support=q.sup==='ledge'?'ledge':'floor';
      p.upright=!!q.up||p.type==='seat'||isLegs(p)||p.type==='curtain'||p.type==='kelp';
      p.uses=clamp(q.uses|0,0,9999);
      p.on=null; p.seat=null; p.rot=0;
      const y=p.support==='ledge'?(island?L.floorY-L.stageH:L.ledgeY):L.floorY;
      p.y=y; p.restY=y; clampPieceX(p);
    }
    const seat=P('seat'), q=byId.seat;
    if(q&&(q.on==='legsS'||q.on==='legsT')){ const lg=P(q.on); if(lg){ seat.on=lg.id; lg.seat=seat.id; } }
    const kq=byId.kelp; if(kq&&kq.on==='shelf'&&!island){ const sh=P('shelf'); if(sh&&sh.upright){ P('kelp').on='shelf'; } }
    const cq=byId.curtain; if(cq&&cq.on==='door'&&!island){ P('curtain').on='door'; }
    if(island){ P('kelp').on=null; P('curtain').on=null; }
    for(const p of S.pieces){ p.flip=(p.on?1:0); if(p.type==='shelf') p.dir=shelfDirFor(p); }
    S.cur=d.cur===-1?-1:1;
    if(d.found&&typeof d.found==='object') for(const k in d.found) if(typeof d.found[k]==='number') S.found[k]=d.found[k];
    if(d.visitors&&typeof d.visitors==='object') for(const k in d.visitors){ const v=d.visitors[k]|0; if(v>0) S.visitors[k]=Math.min(v,9999); }
    S.friendsCalled=clamp(d.friends|0,0,3);
    S.festivals=clamp(d.festivals|0,0,9999);

function bead(x,y,r,col){

    drawKelpRibbon(pts,20);

      c.lineCap='round'; c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(const q of pts) c.lineTo(q[0],q[1]);
      c.strokeStyle=['#53c48a','#3daf78','#6fd39b','#45b982','#5fcb90'][i]; c.lineWidth=14; c.stroke();

function drawBridge(p,k){
  const side=p.bridge, e=side>0?L.wallR:L.wallL;
  const x0=e-side*30, y0=L.floorY-8, x1=e+side*L.bridgeLen*k, y1=lerp(L.floorY-8,L.seaY-6,k);
  // 支柱（さんご）
  coralPost(x1-side*18,L.seaY+60,y1+2,18);
  coralPost(lerp(x0,x1,.5),L.seaY+60,lerp(y0,y1,.5)+4,16);
  c.save(); c.translate(x0,y0); c.rotate(Math.atan2(y1-y0,x1-x0));
  const len=Math.hypot(x1-x0,y1-y0);
  woodBox(0,-8,len,16,8,'#f7c173');
  for(let i=1;i<len/22;i++){ c.strokeStyle='rgba(140,90,40,.35)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(i*22,-7); c.lineTo(i*22,7); c.stroke(); }
  c.strokeStyle='#ff7c88'; c.lineWidth=5; c.lineCap='round'; c.beginPath(); c.moveTo(4,-30); c.quadraticCurveTo(len/2,-18,len-6,-30); c.stroke();
  for(let i=0;i<=4;i++){ const xx=i*(len-8)/4+4; c.beginPath(); c.moveTo(xx,-8); c.lineTo(xx,-30+Math.sin(i/4*Math.PI)*8); c.stroke(); }
  c.restore();
}
function drawPiece(p){
  if(p.type==='seat'&&p.on) return; // 椅子として描く
  const b=by(p);
  c.save();
  const lifted=p.mode==='drag';
  const s=1+p.sq*.11;
  // 影
  if(p.type!=='kelp'&&p.on!=='door'&&!(p.type==='shelf'&&p.bridge&&S.phase==='island')&&p.mode!=='worn'){
    const gy=p.support==='ledge'?(S.phase==='sea'?L.ledgeY:L.floorY-L.stageH):L.floorY;
    const hgt=gy-b; const a=clamp(.22-hgt*.0007,.05,.22);
    c.fillStyle='rgba(20,50,80,'+a+')'; c.beginPath(); c.ellipse(p.x,gy+2,(p.w*.45)*(1+hgt*.001),7,0,0,TAU); c.fill();
  }
  if(p.hintHop>0){ c.translate(0,-Math.sin(p.hintHop*Math.PI)*16); }
  switch(p.type){
    case 'seat':
      c.translate(p.x,b); c.rotate(p.rot); c.scale(s,2-s); if(lifted) c.scale(1.06,1.06);
      drawSeatLocal(); break;
    case 'legsS': case 'legsT':{
      if(p.mode==='worn') break;
      c.translate(p.x,b); c.rotate(p.rot); c.scale(s,2-s); if(lifted) c.scale(1.05,1.05);
      drawChairLocal(p); break;
    }
    case 'shelf':{
      if(S.phase==='island'&&p.bridge){ drawBridge(p,p.bridgeK||0); if((p.bridgeK||0)<1){ c.globalAlpha=1-(p.bridgeK||0); c.translate(p.x,b); c.scale(p.dir,1); drawShelfLocal(p);} break; }
      if(!p.upright){ c.translate(p.x+70,b-106); c.rotate(-Math.PI/2); drawShelfLocal(p); break; }
      c.translate(p.x,b); c.scale(p.dir*s,2-s); if(lifted) c.scale(1.04,1.04); drawShelfLocal(p); break;
    }
    case 'dish':{
      c.translate(p.x,b); c.rotate(p.rot); c.scale(s,2-s); if(lifted) c.scale(1.06,1.06);
      if(!p.upright){ c.translate(0,-40); c.scale(1,-1); }
      drawDishLocal(p,S.phase==='island'&&p.upright); break;
    }
    case 'curtain':{
      if(p.on==='door'){ const bul=curtainBulge(); c.translate(L.hookX,L.hookY); drawCurtainLocal(p,1,.4+bul.k*.5,p.lift,bul); break; }
      if(S.phase==='island'&&p.mode!=='drag'&&(S.flagK||0)>.02){ drawFlagPole(p,b,S.flagK); break; }
      const k=p.flip;
      if(k>.5){ c.translate(p.x,b-p.h+4); c.scale(s,2-s); drawCurtainLocal(p,k,.6,0,null); }
      else { c.translate(p.x,b-8); c.scale(s,2-s); drawCurtainLocal(p,k,.3,0,null); }
      break;
    }
    case 'kelp':{
      if(p.on){ drawKelpHung(p); break; }
      if(S.phase==='island'&&p.mode!=='drag'&&(S.flagK||0)>.02){ drawFlagPole(p,b,S.flagK); break; }
      drawKelpFree(p,b,p.flip); break;
    }
  }
  c.restore();
}
function curtainBulge(){
  let k=0,dx=0,n=0;
  for(const f of S.fish){ if(f.hidden){ k+=1; dx+=f.x-L.hookX; n++; } }
  return {k:Math.min(1.4,k*.7)+(S.octo&&S.octo.state==='peek'?.3:0),dx:n?dx/n:0};
}

function eyes(x,y,r,lx,ly,face,blink,scale){
  // 目：白目・黒目（視線）・まばたき・表情
  scale=scale||1;
  if(face==='happy'){
    c.strokeStyle='#3a2a2a'; c.lineWidth=3.2*scale; c.lineCap='round';
    c.beginPath(); c.arc(x,y+r*.25,r*.75,Math.PI*1.15,Math.PI*1.85); c.stroke(); return;
  }
  const rr2=face==='surprise'?r*1.25:r;
  const bl=blink>0?Math.max(.12,1-blink):1;
  c.fillStyle='#fff'; c.beginPath(); c.ellipse(x,y,rr2,rr2*bl,0,0,TAU); c.fill();
  c.strokeStyle='rgba(60,40,40,.5)'; c.lineWidth=1.2*scale; c.stroke();
  if(bl>.3){
    const d=Math.hypot(lx,ly)||1, m=rr2*.38; const px=x+lx/d*m, py=y+ly/d*m*bl;
    c.fillStyle='#2b2230'; c.beginPath(); c.ellipse(px,py,rr2*.52,rr2*.52*bl,0,0,TAU); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.arc(px-rr2*.18,py-rr2*.2*bl,rr2*.17,0,TAU); c.fill();
  }
  if(face==='ask'||face==='sad'){ c.strokeStyle='#5a3a3a'; c.lineWidth=2*scale; c.beginPath(); c.moveTo(x-r*.9,y-r*1.45+(face==='sad'?-2:2)); c.lineTo(x+r*.7,y-r*1.6+(face==='sad'?3:-1)); c.stroke(); }
}
function tentacle(x0,y0,x1,y1,cx,cy,n,r0,r1,colA,colB){
  for(let i=n;i>=0;i--){
    const t=i/n, it=1-t;
    const x=it*it*x0+2*it*t*cx+t*t*x1, y=it*it*y0+2*it*t*cy+t*t*y1;
    bead(x,y,lerp(r0,r1,t),i%2?colA:colB);
  }
}
function drawOcto(o){
  const base=o.y-o.climb;
  const bob=Math.sin(S.t*2.3+o.ph)*3*(o.state==='idle'?1:.5);
  const hy=base-96-o.stretch*36+bob+o.squat*18;
  const spinS=Math.cos(o.spin);

  c.save(); c.translate(o.x,0);
  // 影
  c.fillStyle='rgba(20,50,80,.18)'; c.beginPath(); c.ellipse(0,o.y+2,70,9,0,0,TAU); c.fill();
  // 足（木のビーズ）
  for(let i=0;i<6;i++){
    const k=i-2.5;
    let sx=k*15*spinS, sy=hy+34, ex=k*28+Math.sin(S.t*3+i+o.walk)*6, ey=base-6-(o.stretch>0?0:0);
    let cx=k*24+Math.sin(S.t*2+i)*8, cy=lerp(sy,ey,.6);
    if(o.walk>0&&o.state!=='idle'){ ey-=Math.max(0,Math.sin(o.walk*2+i*1.7))*10; }
    if(o.stretch>0){ ex=k*14; cx=k*10; }
    if(i===4&&o.arm>0){ ex=lerp(ex,o.armX-o.x,o.arm); ey=lerp(ey,o.armY,o.arm); cx=lerp(cx,(o.armX-o.x)*.6+30,o.arm); cy=lerp(cy,hy-10,o.arm); }
    if(i===5&&o.reach){ const r=o.reach, kk=r.k; ex=lerp(ex,r.x-o.x,kk); ey=lerp(ey,r.y,kk); cx=lerp(cx,(r.x-o.x)*.5,kk); cy=lerp(cy,Math.min(sy,r.y)-30,kk); }
    tentacle(sx,sy,ex,ey,cx,cy,8,14,6.5,colA,colB);
  }
  // 頭
  c.save(); c.translate(0,hy); c.scale(spinS<0?-1:1,1); c.scale(Math.max(.25,Math.abs(spinS)),1);
  const g=c.createRadialGradient(-18,-24,8,0,0,64);

  // ぽつぽつ模様
  c.fillStyle='rgba(255,230,238,.7)'; [[-36,-6,5],[38,-14,4],[30,-46,3.5],[-6,-50,3]].forEach(q=>{c.beginPath();c.arc(q[0],q[1],q[2],0,TAU);c.fill();});
  // 顔
  const lx=o.lookX-o.x, ly=o.lookY-hy;
  eyes(-19,-2,11,lx,ly,o.face,o.blink); eyes(19,-2,11,lx,ly,o.face,o.blink);
  c.fillStyle='rgba(255,110,140,.55)'; c.beginPath(); c.ellipse(-34,14,9,5.5,0,0,TAU); c.ellipse(34,14,9,5.5,0,0,TAU); c.fill();
  c.strokeStyle='#8a3048'; c.lineWidth=3; c.lineCap='round';
  if(o.face==='surprise'){ c.fillStyle='#8a3048'; c.beginPath(); c.ellipse(0,20,6,8,0,0,TAU); c.fill(); }
  else if(o.face==='sad'){ c.beginPath(); c.arc(0,26,8,Math.PI*1.15,Math.PI*1.85); c.stroke(); }
  else if(o.face==='ask'){ c.beginPath(); c.moveTo(-6,20); c.quadraticCurveTo(0,24,6,20); c.stroke(); }
  else { c.beginPath(); c.arc(0,14,10,Math.PI*.15,Math.PI*.85); c.stroke(); }
  // 真珠のネックレス（おばさんらしさ）
  for(let i=0;i<9;i++){ const a=Math.PI*(.2+i*.075); bead(Math.cos(a)*46,32+Math.sin(a)*12-8,5,'#fff6ea'); }
  // 花のかみかざり
  if(!o.hat){ c.save(); c.translate(30,-50); for(let i=0;i<5;i++){ c.rotate(TAU/5); c.fillStyle='#ffe066'; c.beginPath(); c.ellipse(0,-8,5,8,0,0,TAU); c.fill(); } bead(0,0,5,'#ff8f3d'); c.restore(); }
  c.restore();
  c.restore();
  // 帽子（椅子）
  if(o.hat){ const lg=P(o.hat); if(lg){ c.save(); c.translate(o.hatX,o.hatY); c.rotate(o.hatRot); drawChairLocal(lg); c.restore(); } }
}

  } else if(g.type==='star'){

    c.rotate(-S.t*(g.state==='party'?2:.5)); eyes(-5,-2,3.6,1,0,g.face,0,.6); eyes(5,-2,3.6,1,0,g.face,0,.6);
  } else if(g.type==='horse'){

    c.beginPath(); c.moveTo(0,-50); c.quadraticCurveTo(18,-46,12,-30); c.quadraticCurveTo(4,-18,10,-8); c.quadraticCurveTo(16,4,0,0); c.quadraticCurveTo(-8,-6,2,-14); c.quadraticCurveTo(-10,-30,0,-50); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(10,-50,8,6,.3,0,TAU); c.fill(); c.stroke(); eyes(8,-52,3.4,1,0,g.face,0,.6);
  }

}

/* ---------------- つぶつぶ（上限つき） ---------------- */
const MAXP=170;
function addP(o){ if(S.parts.length>=MAXP) S.parts.shift(); S.parts.push(o); return o; }
function bubbles(x,y,n,spread,big){
  for(let i=0;i<n;i++) addP({k:'bub',x:x+rnd(-spread,spread),y:y+rnd(-spread*.4,spread*.4),vx:rnd(-12,12)+S.cur*6,vy:rnd(-90,-40),r:rnd(3,big?11:7),life:0,max:rnd(1,2.2)});
}
function sparkles(x,y,n,cols){
  cols=cols||['#fff6a8','#ffffff','#ffc1e3','#a8f0ff'];
  for(let i=0;i<n;i++){ const a=rnd(0,TAU), s=rnd(60,200); addP({k:'spk',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,r:rnd(4,9),life:0,max:rnd(.6,1.1),col:pick(cols),rot:rnd(0,3)}); }
}
function sandPuff(x,y,n,w){ for(let i=0;i<n;i++) addP({k:'puff',x:x+rnd(-w,w),y:y-rnd(0,6),vx:rnd(-40,40),vy:rnd(-40,-10),r:rnd(6,13),life:0,max:rnd(.5,.9)}); }
function drops(x,y,n,pow){ for(let i=0;i<n;i++){ const a=rnd(-Math.PI*.9,-Math.PI*.1); const s=rnd(120,320)*(pow||1); addP({k:'drop',x:x+rnd(-20,20),y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(3,7),life:0,max:rnd(.6,1.2)}); } }
function noteP(x,y,col){ addP({k:'note',x,y,vx:rnd(-20,20),vy:-60,r:10,life:0,max:1.4,col:col||'#fff3a0',rot:rnd(-.3,.3)}); }
function heartP(x,y){ addP({k:'heart',x,y,vx:rnd(-15,15),vy:-55,r:8,life:0,max:1.2,col:'#ff7aa2'}); }
function ringP(x,y,r,col){ addP({k:'ring',x,y,vx:0,vy:0,r:r||10,life:0,max:.6,col:col||'rgba(255,255,255,.8)'}); }
function fireworkP(x,y){
  const cols=['#ff7aa2','#ffd23f','#7ee8ff','#b9f28c','#d3a6ff'];
  const col=pick(cols); for(let i=0;i<16;i++){ const a=i/16*TAU; addP({k:'spk',x,y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:rnd(5,8),life:0,max:1,col,rot:a,fric:2}); }
  addP({k:'ring',x,y,vx:0,vy:0,r:20,life:0,max:.7,col:'rgba(255,255,255,.8)'});
}
function updParts(dt){
  const ps=S.parts; let w=0;
  for(let i=0;i<ps.length;i++){
    const p=ps[i]; p.life+=dt; if(p.life>=p.max) continue;
    if(p.k==='bub'){ p.vy-=(p.vy>200?-0:30)*dt; p.vx+=Math.sin(S.t*3+i)*20*dt; if(S.phase==='island'&&p.y<L.seaY){ p.life=p.max; continue; } }
    else if(p.k==='drop'){ p.vy+=700*dt; if(S.phase==='island'&&p.y>L.seaY&&p.vy>0){ p.life=p.max; continue; } }
    else if(p.k==='spk'){ const fr=p.fric||3; p.vx*=1-fr*dt; p.vy*=1-fr*dt; p.vy+=40*dt; }
    else if(p.k==='puff'){ p.vx*=1-2*dt; p.vy*=1-2*dt; p.r+=10*dt; }
    else if(p.k==='ring'){ p.r+=90*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; ps[w++]=p;
  }
  ps.length=w;
}
function drawParts(){
  for(const p of S.parts){
    const a=1-p.life/p.max;
    if(p.k==='bub'){
      c.strokeStyle='rgba(255,255,255,'+(.75*a+.1)+')'; c.lineWidth=1.6; c.fillStyle='rgba(200,240,255,'+(.18*a)+')';
      c.beginPath(); c.arc(p.x,p.y,p.r,0,TAU); c.fill(); c.stroke();
      c.fillStyle='rgba(255,255,255,'+(.8*a)+')'; c.beginPath(); c.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.25,0,TAU); c.fill();
    } else if(p.k==='spk'){
      c.save(); c.translate(p.x,p.y); c.rotate(p.rot+p.life*3); c.globalAlpha=a; c.fillStyle=p.col;
      const r=p.r*(.6+.4*a); c.beginPath(); c.moveTo(0,-r); c.quadraticCurveTo(0,0,r,0); c.quadraticCurveTo(0,0,0,r); c.quadraticCurveTo(0,0,-r,0); c.quadraticCurveTo(0,0,0,-r); c.fill(); c.restore();
    } else if(p.k==='puff'){
      c.fillStyle='rgba(255,240,210,'+(.45*a)+')'; c.beginPath(); c.arc(p.x,p.y,p.r,0,TAU); c.fill();
    } else if(p.k==='drop'){
      c.fillStyle='rgba(225,250,255,'+(.9*a)+')'; c.beginPath(); c.ellipse(p.x,p.y,p.r*.75,p.r,Math.atan2(p.vy,p.vx)+Math.PI/2,0,TAU); c.fill();
    } else if(p.k==='ring'){
      c.strokeStyle=p.col; c.globalAlpha=a; c.lineWidth=3; c.beginPath(); c.arc(p.x,p.y,p.r,0,TAU); c.stroke(); c.globalAlpha=1;
    } else if(p.k==='note'){
      c.save(); c.translate(p.x+Math.sin(p.life*6)*6,p.y); c.rotate(p.rot); c.globalAlpha=a; c.fillStyle=p.col; c.strokeStyle=p.col; c.lineWidth=3;
      c.beginPath(); c.ellipse(0,0,7,5,-.4,0,TAU); c.fill(); c.beginPath(); c.moveTo(6,-2); c.lineTo(6,-22); c.quadraticCurveTo(12,-18,14,-12); c.stroke(); c.restore();
    } else if(p.k==='heart'){
      c.save(); c.translate(p.x,p.y); c.globalAlpha=a; c.fillStyle=p.col; const r=p.r;
      c.beginPath(); c.moveTo(0,r*.8); c.bezierCurveTo(-r*1.6,-r*.3,-r*.6,-r*1.4,0,-r*.5); c.bezierCurveTo(r*.6,-r*1.4,r*1.6,-r*.3,0,r*.8); c.fill(); c.restore();
    }
  }
  c.globalAlpha=1;
}

  const pc=['#ff9eb5','#9fd8ff','#ffe08a','#b5f0c0','#d6b8ff'];
  for(let i=0;i<22;i++){ const x=(i*97.3)%W, y=L.floorY+30+((i*53.7)%Math.max(20,H-L.floorY-50)); bead(x,y,4+(i%3)*2,pc[i%5]); }
  // ひとで・貝（飾り）
  c.save(); c.translate(W*.08,H-40-L.safe.b); c.fillStyle='#ffb347'; c.beginPath(); for(let i=0;i<10;i++){ const a=i/10*TAU-Math.PI/2,r=i%2?7:17; c.lineTo(Math.cos(a)*r,Math.sin(a)*r);} c.closePath(); c.fill(); c.restore();

function drawHouse(op){

    c.strokeStyle='#d9a066'; c.lineWidth=13; c.beginPath(); c.arc(winX,winY,winR+5,0,TAU); c.stroke();
    c.strokeStyle='#f6dca8'; c.lineWidth=3; c.beginPath(); c.arc(winX,winY,winR+9,Math.PI*1.1,Math.PI*1.6); c.stroke();

    c.fillStyle='rgba(120,220,180,.35)'; for(let i=0;i<3;i++){ c.beginPath(); c.ellipse(dx+20+i*34,floorY-8,10,28+i*8,0,0,TAU); c.fill(); }
    c.strokeStyle='#7fd1c4'; c.lineWidth=12; c.beginPath(); c.moveTo(dx,floorY); c.lineTo(dx,floorY-dh+dw/2); c.arc(dx+dw/2,floorY-dh+dw/2,dw/2,Math.PI,0); c.lineTo(dx+dw,floorY); c.stroke();

  c.strokeStyle='rgba(120,70,30,.25)'; c.lineWidth=1.5; for(let x=wallL;x<wallR;x+=60){ c.beginPath(); c.moveTo(x,floorY+2); c.lineTo(x,floorY+20); c.stroke(); }

  const ly=lerp(L.ledgeY,floorY-L.stageH,op), lx0=L.ledgeX0, lx1=L.ledgeX1;

}
function drawRoofHalf(side,op){

  const g=c.createLinearGradient(0,-roofH,0,0); g.addColorStop(0,'#ff8a76'); g.addColorStop(1,'#e2574c');

  c.strokeStyle='rgba(255,220,200,.55)'; c.lineWidth=2.5;
  for(let y=-roofH+16;y<0;y+=20){ c.beginPath(); for(let x=Math.min(0,ax);x<Math.max(0,ax);x+=24){ c.moveTo(x,y); c.arc(x+12,y,12,Math.PI,0,true); } c.stroke(); }

  c.restore();
  c.strokeStyle='#ffe0a8'; c.lineWidth=9; c.lineCap='round'; c.beginPath(); c.moveTo(0,0); c.lineTo(ax,-roofH); c.stroke();
  c.strokeStyle='#c9902f'; c.lineWidth=2; c.stroke();

  c.restore();
}

}
function islandView(){
  const z=L.zI; return {x0:L.cx-W/2/z-10,x1:L.cx+W/2/z+10,y0:L.camIy-H/2/z-10,y1:L.camIy+H/2/z+10};
}
function waveLine(y,amp,alpha){

const cam={x:350,y:500,z:1};
function curView(){ return {x0:cam.x-W/2/cam.z,x1:cam.x+W/2/cam.z,y0:cam.y-H/2/cam.z,y1:cam.y+H/2/cam.z}; }
function setCam(){ const s=DPR*K*cam.z; drawScale=s; ctx.setTransform(s,0,0,s,DPR*K*(W/2-cam.x*cam.z),DPR*K*(H/2-cam.y*cam.z)); }
function toWorld(px,py){ return {x:(px/K-W/2)/cam.z+cam.x,y:(py/K-H/2)/cam.z+cam.y}; }
function toScreen(x,y){ return {x:((x-cam.x)*cam.z+W/2)*K,y:((y-cam.y)*cam.z+H/2)*K}; }
function transVis(q){
  return {
    env:1900*ease((q-.06)/.55),
    surf:lerp(L.floorY-1700,L.seaY,ease((q-.08)/.6)),
    zk:ease((q-.56)/.34),
    open:ease((q-.7)/.26),
    tone:ease(q)

}
function updateCam(){
  if(S.phase==='sea'){ cam.x=W/2; cam.y=H/2; cam.z=1; }
  else if(S.phase==='island'){ cam.x=L.cx; cam.y=L.camIy; cam.z=L.zI; }
  else { const v=transVis(S.trans.q); cam.x=lerp(W/2,L.cx,v.zk); cam.y=lerp(H/2,L.camIy,v.zk); cam.z=lerp(1,L.zI,v.zk); }
  if(S.houseShake>0){ cam.x+=Math.sin(S.t*47)*S.houseShake*3; cam.y+=Math.cos(S.t*39)*S.houseShake*2; }
}

/* ---------------- キャッシュ ---------------- */
let cA=null,cB=null,cacheKey='';
function mkCanvas(){ const k=document.createElement('canvas'); k.width=cv.width; k.height=cv.height; return k; }
function buildCaches(){
  const key=S.phase+'|'+cv.width+'x'+cv.height;
  if(!cacheDirty&&cacheKey===key) return;
  cacheKey=key; cacheDirty=false;
  if(S.phase!=='sea'&&S.phase!=='island'){ return; }
  if(!cA||cA.width!==cv.width||cA.height!==cv.height){ cA=mkCanvas(); cB=mkCanvas(); }
  const save=c;
  const sx=DPR*K;
  for(const [cvx,fn] of [[cA,'env'],[cB,'house']]){
    const g=cvx.getContext('2d'); c=g; g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cvx.width,cvx.height);
    if(S.phase==='sea'){ drawScale=sx; g.setTransform(sx,0,0,sx,0,0); if(fn==='env') drawSeaEnv(); else drawHouse(0); }
    else { const z=L.zI, s=sx*z; drawScale=s; g.setTransform(s,0,0,s,sx*(W/2-L.cx*z),sx*(H/2-L.camIy*z)); if(fn==='env'){ drawIslandEnv(islandView()); drawHouse(1); } }
  }

/* ============================================================
   遊びのしくみ（家具の状態を共有する一つの世界）

const LOG=[];
function discover(key,x,y){
  const first=!S.found[key];
  if(first){ S.found[key]=Date.now(); A.chime(true); sparkles(x,y,20); ringP(x,y,18,'rgba(255,250,200,.95)'); saveSoon(); }
  else if(Math.random()<.5){ sparkles(x,y,5); }
  LOG.push({k:key,t:+S.t.toFixed(2),first});
  if(LOG.length>400) LOG.shift();
  return first;
}
function saveSoon(){ S.saveT=.8; }
function anyDragged(){ for(const p of S.pieces) if(p.mode==='drag') return p; return null; }
function freeLegs(){ return S.pieces.filter(p=>isLegs(p)&&!p.seat&&p.mode!=='worn'&&p.mode!=='drag'); }
function supportFor(p,yb){
  const ly=S.phase==='sea'?L.ledgeY:L.floorY-L.stageH;
  if(p.x>L.ledgeX0+8&&p.x<L.ledgeX1+8&&yb<ly+46) return {y:ly,s:'ledge'};
  return {y:L.floorY,s:'floor'};
}
function surfaceYAt(x){ return (x>L.ledgeX0&&x<L.ledgeX1+8)?(S.phase==='sea'?L.floorY:L.floorY-L.stageH):L.floorY; }

/* ---------- つかむ ---------- */
function hitPiece(x,y){
  let best=null,bs=1e9;
  for(const p of S.pieces){
    if(p.mode==='drag'||p.mode==='snap') continue;
    if(p.type==='seat'&&p.on){ continue; }
    if(S.phase==='island'&&p.type==='shelf'&&p.bridge&&(p.bridgeK||0)<.95) continue;
    const b=aabb(p), pad=26;
    if(x<b.x0-pad||x>b.x1+pad||y<b.y0-pad||y>b.y1+pad) continue;
    const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2, area=(b.x1-b.x0)*(b.y1-b.y0);
    const inside=x>=b.x0&&x<=b.x1&&y>=b.y0&&y<=b.y1;
    const sc=(inside?0:1.2)+Math.hypot(x-cx,y-cy)/Math.hypot(b.x1-b.x0,b.y1-b.y0)+area/90000+(p.type==='kelp'?-0.25:0)+(p.type==='shelf'?.15:0)+(S.hint.g&&S.hint.g.p===p?-.45:0);
    if(sc<bs){ bs=sc; best=p; }
  }
  return best;
}
function grab(p,wx,wy){
  if(p.type==='seat'&&p.on) p=P(p.on);
  if(!p||p.mode==='drag') return null;
  const o=S.octo;
  if(p.mode==='worn'){
    const bx=o.hatX, byy=o.hatY;
    octoDropHat(true);
    p.x=bx; p.y=byy+p.h+80; p.rot=0;
  }
  if(S.float.seed===p.id) dissolveFloat(p.id);
  else if(p.link) unlinkPiece(p);
  if(p.type==='kelp'&&p.on){
    const sw=p.swinger; if(sw){ sw.state='surprise'; sw.st=0; sw.face='surprise'; sw.vy=-80; p.swinger=null; }
    p.on=null;
  }
  if(p.type==='curtain'&&p.on==='door'){
    p.on=null; p.lift=0;
    for(const f of S.fish) if(f.hidden){ f.hidden=false; f.state='surprise'; f.st=0; f.face='surprise'; f.vx=160; f.vy=-60; }
    if(o.state!=='idle'&&o.data&&o.data.seek) octoIdle(1);
  }
  if(p.type==='shelf'){ p.bridge=0; p.bridgeK=0; }
  if(isLegs(p)&&o.data&&o.data.step===p.id){ o.climb=0; octoIdle(.5); o.face='surprise'; o.faceT=.8; }
  p.mode='drag'; p.fl=0; p.rot=0; p.vy=0; p.stillT=0;
  if(p.type==='curtain'||p.type==='kelp'){
    p.flip=1; p.x=wx; p.y=wy+(p.type==='curtain'?226:252);
  }
  p.offX=p.x-wx; p.offY=p.y-wy; p.tx=p.x; p.ty=p.y;
  p.sq=.9; p.sqv=0; p.hintHop=0;
  A.koto(p.type==='shelf'?.8:(p.type==='dish'?1.3:1));
  bubbles(wx,wy,3,12);
  if(p.mode==='drag') for(const f of S.fish) if(f.fav===p.id&&canFollow(f)){ f.state='follow'; f.st=0; f.data={p:p.id,ox:rnd(-80,80)}; }
  return p;
}
function canFollow(f){ return ['wander','gather','inDish','roll','iswim'].indexOf(f.state)>=0; }
function moveDrag(p,wx,wy){
  let tx=wx+p.offX, ty=wy+p.offY;
  const v=curView();
  tx=clamp(tx,v.x0+30,v.x1-30);
  ty=clamp(ty,v.y0+60+(p.type==='curtain'||p.type==='kelp'?200:p.h),L.floorY+4);
  // 吸いつき
  const sn=snapTarget(p,tx,ty);
  if(sn){ const d=dist(tx,ty,sn.x,sn.y); const k=clamp(1-d/sn.r,0,1)*.75; tx=lerp(tx,sn.x,k); ty=lerp(ty,sn.y,k); p.magnet=k; } else p.magnet=0;
  p.tx=tx; p.ty=ty;
}
function snapTarget(p,tx,ty){
  if(p.type==='seat'){
    let best=null,bd=1e9;
    for(const lg of freeLegs()){ if(lg.mode!=='rest') continue; const sx=lg.x, sy=legsTopY(lg)+6; const d=dist(tx,ty,sx,sy); if(d<bd){bd=d;best={x:sx,y:sy,r:190};} }
    if(best&&bd<190) return best;
  }
  if(p.type==='curtain'&&S.phase==='sea'){ const sx=L.hookX, sy=L.hookY+226; if(dist(tx,ty,sx,sy)<200) return {x:sx,y:sy,r:200}; }
  if(p.type==='kelp'&&S.phase==='sea'){ const sh=P('shelf'); if(sh.upright&&sh.mode==='rest'){ const tp=shelfTip(sh); const sx=tp.x, sy=tp.y+252; if(dist(tx,ty,sx,sy)<190) return {x:sx,y:sy,r:190}; } }
  if(isLegs(p)&&p.seat&&S.phase==='sea'&&!S.float.seed){ if(Math.abs(tx-L.ventX)<130&&ty>L.floorY-120) return {x:L.ventX,y:ty,r:130}; }
  if(isLegs(p)&&p.seat&&S.phase==='island'){ if(Math.abs(tx-L.ventX)<120&&ty>L.floorY-110) return {x:L.ventX,y:ty,r:120}; }
  if(p.type==='seat'||isLegs(p)) return null;
  // 浮いている家具へ連結
  if(S.phase==='sea'&&S.float.seed&&S.float.fill>=1){
    const b=aabb(Object.assign({},p,{x:tx,y:ty,fl:0,mode:'rest'}));
    for(const id of S.float.members){ const m=P(id); if(!m) continue; const mb=aabb(m); const d=boxDist(b,mb); if(d<150){ const mc=boxCenter(mb); const side=tx<mc.x?-1:1; const sx=side<0?mb.x0-(b.x1-b.x0)/2+6:mb.x1+(b.x1-b.x0)/2-6; return {x:sx,y:clamp(ty,mb.y0+40,L.floorY),r:150}; } }
  }
  return null;
}
function dropPiece(p){
  if(p.mode!=='drag') return;
  LOG.push({k:'drop:'+p.id,t:+S.t.toFixed(2),x:Math.round(p.x),y:Math.round(p.y)});
  p.mode='rest'; p.magnet=0;
  const sea=S.phase==='sea';
  p.stillT=0; p.availT=0;
  if(p.type==='seat'){
    let best=null,bd=1e9;
    for(const lg of freeLegs()){ if(lg.mode!=='rest') continue; const top=legsTopY(lg); const dx=Math.abs(p.x-lg.x), dy=p.y-top; if(dx<130&&dy>-180&&dy<150){ const d=dx+Math.abs(dy)*.6; if(d<bd){bd=d;best=lg;} } }
    if(best){ attachSeat(p,best); return; }
  }
  if(isLegs(p)&&p.seat){
    for(const lg of freeLegs()){ if(lg.mode!=='rest') continue; if(Math.abs(p.x-lg.x)<105&&p.y<by(lg)+40&&p.y>legsTopY(lg)-170){ transferSeat(p,lg); return; } }
  }
  if(sea&&S.float.seed&&S.float.fill>=1&&!(isLegs(p)&&p.seat)&&p.type!=='seat'){
    const b=aabb(p);
    let near=null,nd=1e9;
    for(const id of S.float.members){ const m=P(id); if(!m||m===p) continue; const d=boxDist(b,aabb(m)); if(d<nd){nd=d;near=m;} }
    if(near&&nd<110){ if((p.type==='shelf'||p.type==='dish')&&!p.upright) p.upright=true; linkPiece(p,near); return; }
  }
  if(p.type==='curtain'&&sea){
    const rx=p.x, ry=p.y-226;
    if(dist(rx,ry,L.hookX,L.hookY)<190||(p.x<L.doorX0+L.doorW+70&&ry<L.floorY-60&&ry>L.hookY-140)){ attachCurtain(p); return; }
  }
  if(p.type==='kelp'&&sea){
    const sh=P('shelf');
    if(sh.upright&&sh.mode==='rest'){
      const tp=shelfTip(sh), rx=p.x, ry=p.y-252, b=aabb(sh);
      if(dist(rx,ry,tp.x,tp.y)<180||(rx>b.x0-40&&rx<b.x1+40&&ry>b.y0-120&&ry<b.y1)){ attachKelp(p,sh); return; }
    }
  }
  if((p.type==='shelf'||p.type==='dish')&&!p.upright){ p.upright=true; A.boing(); sparkles(p.x,p.y-60,6); }
  startFall(p);
}
function startFall(p){
  const hw=pieceHalfW(p);
  p.x=clamp(p.x,L.wallL+hw+4,L.wallR-hw-4); p.tx=p.x;
  if(p.type==='curtain'&&p.flip>.5){ p.y=p.y-226+10; }
  if(p.type==='curtain'||p.type==='kelp') p.flip=0;
  const sup=supportFor(p,p.y);
  p.restY=sup.y; p.support=sup.s; p.vy=0; p.mode='fall';
  if(p.type==='shelf') p.dir=shelfDirFor(p);
  if(p.y>p.restY) p.y=p.restY;
}
function landed(p){
  p.mode='rest'; p.y=p.restY; p.sq=.75; p.sqv=0; p.stillT=0; p.availT=0;
  A.thud(p.type==='shelf'?.7:p.type==='dish'?1.3:1);
  sandPuff(p.x,p.y,p.type==='shelf'?7:4,p.w*.35);
  for(const f of S.fish){ if(!f.hidden&&dist(f.x,f.y,p.x,p.y-40)<130&&f.state==='wander'){ f.state='surprise'; f.st=0; f.face='surprise'; f.vy=-90; } }
  if(p.type==='shelf') p.dir=shelfDirFor(p);
  const o=S.octo;
  if(S.phase==='sea'){
    if(isLegs(p)&&!p.seat){
      const st=P('seat'); if(st&&!st.on&&st.mode==='rest'&&Math.abs(st.x-p.x)<120&&Math.abs(st.y-p.y)<60){ hopSeatOnto(st,p); }
    }
    if(isLegs(p)&&p.seat){
      if(Math.abs(p.x-L.ventX)<80&&p.support==='floor'){ /* 泡の噴出口：updFloat が拾う */ }
      else if(o.state==='idle'&&S.hatCool<=0&&Math.abs(p.x-o.x)<190) S.pendingHat=p.id;
    }
  } else if(S.phase==='island'){
    if(p.type==='shelf'){
      const dl=p.x-L.wallL, dr=L.wallR-p.x;
      if(dr<190||dl<190){ const side=dr<dl?1:-1; p.bridge=side; p.bridgeK=0; p.dir=side; p.x=side>0?L.wallR-70:L.wallL+70; A.kachin(); A.boing(); discover('bridge',p.x+side*90,L.floorY-40); for(const g of S.guests) if(g.state==='wait'){ g.state='swim'; g.face='happy'; } }
    }
    if((p.type==='curtain'||p.type==='kelp')){ A.koto(1.4); sparkles(p.x,p.y-230,5,['#9ff0b8','#fff6a8']); }
    if(isLegs(p)&&p.seat&&Math.abs(p.x-L.ventX)<85){ startSink(); }
    else if(isLegs(p)&&p.seat&&o.state!=='hat'&&S.hatCool<=0&&Math.abs(p.x-o.x)<170&&!S.trans) S.pendingHat=p.id;
  }
  saveSoon();
}
function hopSeatOnto(st,lg){
  st.mode='snap'; st.snap={t:0,dur:.32,x0:st.x,y0:st.y,x1:lg.x,y1:legsTopY(lg)+6,r0:st.rot,then:()=>attachSeat(st,lg,true)};
  A.boing();
}
function attachSeat(st,lg){
  st.on=lg.id; lg.seat=st.id; st.mode='attached'; st.rot=0; st.sq=1; st.sqv=0; lg.sq=.9; lg.sqv=0;
  st.x=lg.x; st.y=legsTopY(lg)+6;
  A.kachin(); sparkles(lg.x,legsTopY(lg)-30,8,['#ffffff','#ffd0dc']); bubbles(lg.x,legsTopY(lg),4,30);
  for(const f of S.fish) if(!f.hidden&&dist(f.x,f.y,lg.x,legsTopY(lg))<320){ f.lookX=lg.x; f.lookY=legsTopY(lg)-40; }
  chairMade(lg);
}
function transferSeat(from,to){
  const st=P(from.seat);
  from.seat=null; from.mode='rest';
  const side=from.x<to.x?-1:1;
  from.x=clamp(to.x+side*150,L.wallL+70,L.wallR-70);
  if(Math.abs(from.x-to.x)<120) from.x=clamp(to.x-side*150,L.wallL+70,L.wallR-70);
  from.y=Math.min(from.y,L.floorY-20);
  startFall(from);
  attachSeat(st,to);
}
function chairMade(lg){
  if(S.phase==='sea'||S.phase==='island'){ S.pendingHat=lg.id; S.hatCool=0; }
}
function attachCurtain(p){
  p.on='door'; p.mode='rest'; p.flip=1; p.lift=0; p.availT=0; p.stillT=0; p.sq=.6;
  A.kachin(); bubbles(L.hookX,L.hookY,5,40); sparkles(L.hookX,L.hookY,6,['#9ff0b8','#ffffff']);
}
function attachKelp(p,sh){
  p.on=sh.id; p.mode='rest'; p.flip=1; p.th=sgn(p.x-shelfTip(sh).x)*.5; p.om=0; p.availT=0; p.stillT=0; p.stretch=1; p.swinger=null;
  A.kachin(); const tp=shelfTip(sh); bubbles(tp.x,tp.y,4,20);
}

/* ---------- 泡で浮く ---------- */
function floatCount(){
  const F=S.float; let n=0;
  for(const id of F.members){ const m=P(id); if(!m) continue; n++; if(m.type==='shelf'){ const k=P('kelp'); if(k.on===m.id) n++; } }
  return n;
}
function linkPiece(p,near){
  const F=S.float;
  const sup=supportFor(p,p.y);
  p.restY=sup.y; p.support=sup.s;
  p.fl=p.restY-p.y; p.y=p.restY; p.mode='rest';
  if(p.type==='curtain'||p.type==='kelp'){ p.flip=0; }
  p.link=true; p.linkTo=near.id; F.members.push(p.id);
  if(p.type==='shelf') p.dir=shelfDirFor(p);
  A.kachin(); F.bubbleLv+=3; A.poko(F.bubbleLv); A.poko(F.bubbleLv+4);
  bubbles(p.x,by(p),10,40,true);
  const n=floatCount();
  if(n>=2) discover('floatLink',p.x,by(p)-60);
  for(const f of S.fish) if(!f.hidden&&dist(f.x,f.y,p.x,by(p))<360&&f.state==='wander'){ f.state='surprise'; f.st=0; f.face='surprise'; }
}
function unlinkPiece(p){
  const F=S.float; const i=F.members.indexOf(p.id); if(i>=0) F.members.splice(i,1);
  p.y=by(p); p.fl=0; p.link=false; p.linkTo=null;
  for(const id of F.members){ const m=P(id); if(m&&m.linkTo===p.id) m.linkTo=F.seed; }
  A.pop();
}
function dissolveFloat(keepId){
  const F=S.float;
  for(const id of F.members){
    const m=P(id); if(!m) continue;
    m.link=false; m.linkTo=null;
    if(m.id===keepId){ m.y=by(m); m.fl=0; continue; }
    if(m.mode==='rest'){ m.y=by(m); m.fl=0; if(m.y<m.restY-2){ startFall(m); } }
  }
  for(const f of S.fish) if(f.state==='ride'||f.state==='toRide'){ f.state='wander'; f.st=0; }
  if(F.fill>.5){ bubbles(L.ventX,L.floorY-40,12,60,true); A.pop(); }
  F.seed=null; F.members=[]; F.fill=0; F.lift=0; F.hold=0; F.bubbleLv=0;
  S.houseShake=0; S.houseLift=0;
}
function updFloat(dt){
  const F=S.float;
  if(S.phase!=='sea') return;
  // 噴出口の泡
  F.ventT=(F.ventT||0)-dt;
  if(F.ventT<=0){ F.ventT=F.seed?.06:.22; addP({k:'bub',x:L.ventX+rnd(-12,12),y:L.floorY-12,vx:S.cur*10,vy:rnd(-110,-70),r:rnd(3,8),life:0,max:F.seed?.7:2.2}); }
  let seed=F.seed?P(F.seed):null;
  if(seed){
    if(!(isLegs(seed)&&seed.seat&&seed.mode==='rest'&&seed.support==='floor'&&Math.abs(seed.x-L.ventX)<95)){ dissolveFloat(); return; }
  } else {
    const ch=chairOf();
    if(ch&&ch.mode==='rest'&&ch.support==='floor'&&Math.abs(ch.x-L.ventX)<85&&S.pendingHat!==ch.id){
      F.seed=ch.id; F.members=[ch.id]; ch.link=true; F.fill=0; F.lift=0; F.bubbleLv=0; F.pokoT=0;
      ch.x=lerp(ch.x,L.ventX,.5);
    }
    S.houseShake=Math.max(0,S.houseShake-dt*2);
    S.houseLift=Math.max(0,(S.houseLift||0)-dt*20);
    return;
  }
  seed.x+=(L.ventX-seed.x)*Math.min(1,dt*3);
  const wasFull=F.fill>=1;
  F.fill=Math.min(1,F.fill+dt*.42);
  F.pokoT=(F.pokoT||0)-dt;
  if(F.pokoT<=0){ F.pokoT=F.fill<1?.2:.55; F.bubbleLv=Math.min(F.bubbleLv+1,26); A.poko(F.bubbleLv*.7); }
  if(!wasFull&&F.fill>=1){ discover('float',seed.x,by(seed)-seed.h-60); A.boing(); for(const f of S.fish) if(f.state==='wander'){ f.actCool=Math.min(f.actCool,.3); } }
  const n=floatCount(); F.n=n;
  const tgt=F.fill<1?F.fill*14:[0,42,98,150,170][Math.min(n,4)];
  F.lift+=(tgt-F.lift)*Math.min(1,dt*1.5);
  F.members.forEach((id,i)=>{ const m=P(id); if(!m) return; const bob=Math.sin(S.t*2.2+i*1.3)*4*F.fill; const t=F.lift+bob+(m===seed?0:0); m.fl+=(t-m.fl)*Math.min(1,dt*(m===seed?6:2.4)); });
  // 家の柱と屋根に力が伝わる

    F.creak=(F.creak||0)-dt;
    if(F.creak<=0){ F.creak=n>=4?.9:2.2; A.creak(); sandPuff(L.wallL,L.floorY,5,14); sandPuff(L.wallR,L.floorY,5,14); bubbles(L.cx,L.ceilY+10,6,L.roomW*.3); }
    S.houseLift=(n>=4?10:4)*(.5+.5*Math.sin(S.t*(n>=4?9:4)));
    S.houseShake=n>=4?.35+F.hold*.4:.08;
  } else { S.houseLift=Math.max(0,(S.houseLift||0)-dt*20); S.houseShake=Math.max(0,S.houseShake-dt); }
  if(n>=4&&F.fill>=1){
    F.hold+=dt;
    if(F.hold>1.7) startRise();
  } else F.hold=Math.max(0,F.hold-dt);
  // 下から泡がたまる
  if(Math.random()<dt*14){ const tx=seed.x+rnd(-40,40); addP({k:'bub',x:L.ventX+rnd(-8,8),y:L.floorY-10,vx:(tx-L.ventX)*.6,vy:-160,r:rnd(3,7),life:0,max:.5}); }
}

/* ---------- 浮上・潜水 ---------- */
function releaseAll(){ for(const [id,s] of ptrs){ if(s.p&&s.p.mode==='drag') dropPiece(s.p); } ptrs.clear(); }
function startRise(){
  if(S.trans) return;

  S.phase='rise'; S.trans={q:0,dur:8.5,kind:'rise',splashed:false};
  A.whoosh(3.5); A.creak(); A.boom();
  S.houseShake=1;
  const o=S.octo; o.face='surprise'; o.faceT=1.5; o.reach=null;
  if(o.hat) octoDropHat(false);
  octoIdle(0);
  for(const f of S.fish){ f.hidden=false; f.state='transit'; f.st=0; f.face='surprise'; f.faceT=1; }
  const cu=P('curtain'); cu.lift=0;
  cacheDirty=true;
}
function startSink(){
  if(S.trans) return;
  releaseAll();
  S.phase='sink'; S.trans={q:1,dur:6.5,kind:'sink',splashed:false};
  A.whoosh(2.4); A.music=0;
  const o=S.octo; if(o.hat) octoDropHat(false); octoIdle(0); o.face='happy'; o.faceT=2;
  for(const g of S.guests){ g.state='leave'; g.wave=true; g.face='happy'; }
  for(const f of S.fish){ f.state='transit'; f.st=0; }
  const sh=P('shelf'); if(sh.bridge){ sh.bridge=0; sh.bridgeK=0; sh.x=clamp(sh.x,L.wallL+110,L.wallR-110); sh.dir=shelfDirFor(sh); }
  cacheDirty=true;
}
function updTrans(dt){
  const T=S.trans; if(!T) return;
  const rise=T.kind==='rise';
  T.q=clamp(T.q+(rise?dt/T.dur:-dt/T.dur),0,1);
  const q=T.q, v=transVis(q);
  S.flagK=v.open;
  S.houseShake=rise?(q<.12?1:(q<.6?.3:0)):(q>.85?.2:0);
  if(rise&&q>.05&&q<.62&&Math.random()<dt*30){ const v2=curView(); addP({k:'bub',x:rnd(v2.x0,v2.x1),y:v2.y0+rnd(0,(v2.y1-v2.y0)*.3),vx:rnd(-10,10),vy:rnd(380,620),r:rnd(4,12),life:0,max:1.6}); }
  const roofTop=L.ceilY-L.roofH-10;
  if(rise&&!T.splashed&&v.surf>roofTop){ T.splashed=true; A.bigSplash(); drops(L.cx,v.surf,40,1.3); for(let i=0;i<10;i++) drops(L.wallL+i*L.roomW/9,v.surf,3,.8); }
  if(!rise&&!T.splashed&&q<.5){ T.splashed=true; A.splash(); bubbles(L.cx,L.ceilY,30,L.roomW*.4,true); }
  const ly=lerp(L.ledgeY,L.floorY-L.stageH,v.open);
  for(const p of S.pieces){
    if(p.support==='ledge'&&p.mode!=='drag'){ p.y=ly; p.restY=ly; }
    if(rise&&q>.5){ p.fl+=(0-p.fl)*Math.min(1,dt*2); }
    if(p.mode==='fall'){ p.y=p.restY; p.mode='rest'; }
  }
  // 魚：家の外の海へ
  for(const f of S.fish){
    if(rise){
      if(q<.7){ f.x+=Math.sin(S.t*3+f.wig)*20*dt; f.y+=(Math.cos(S.t*2+f.wig))*10*dt; }
      else if(!f.moved){ f.appear=clamp(1-(q-.7)/.08,0,1); if(q>.8){ f.moved=true; f.x=L.cx+rnd(-L.roomW*.5,L.roomW*.5); f.y=L.seaY+rnd(80,220); f.appear=0; } }
      else f.appear=clamp((q-.82)/.12,0,1);
    } else {
      if(q>.6){ f.appear=clamp((q-.6)/.2,0,1); }
      else if(!f.moved){ f.moved=true; f.appear=0; f.x=L.wallL+rnd(80,L.roomW-80); f.y=L.floorY-rnd(120,L.roomH*.6); }
      else f.appear=clamp((.45-q)/.2,0,1);
    }
  }
  for(const g of S.guests){ g.x+=sgn(g.x-L.cx)*120*dt; g.alpha=Math.max(0,(g.alpha==null?1:g.alpha)-dt*.6); }
  if(rise&&q>=1) enterIsland();
  if(!rise&&q<=0) enterSea();
}
function enterIsland(){
  S.phase='island'; S.trans=null; S.flagK=1; S.houseShake=0; S.houseLift=0;
  const F=S.float; for(const id of F.members){ const m=P(id); if(m){ m.link=false; m.linkTo=null; m.fl=0; } } F.seed=null; F.members=[]; F.fill=0; F.lift=0; F.hold=0;
  const cu=P('curtain'); if(cu.on==='door'){ cu.on=null; cu.x=L.hookX+30; cu.y=L.floorY; cu.restY=cu.y; cu.support='floor'; }
  const kp=P('kelp'); if(kp.on){ const sh=P(kp.on); kp.on=null; kp.swinger=null; kp.x=clamp(sh.x+sh.dir*110,L.wallL+30,L.wallR-30); kp.support=sh.support; kp.y=sh.y; kp.restY=kp.y; }
  for(const p of S.pieces){ p.fl=0; p.flip=0; if(p.mode!=='worn'&&p.mode!=='attached'){ p.mode='rest'; p.y=p.support==='ledge'?L.floorY-L.stageH:L.floorY; p.restY=p.y; } if(p.type==='shelf') p.dir=shelfDirFor(p); p.lift=0; }
  for(const f of S.fish){ f.moved=false; f.appear=1; f.state='iswim'; f.st=0; f.hidden=false; f.face='happy'; f.faceT=1.5; if(f.y<L.seaY+40) f.y=L.seaY+rnd(80,200); }
  S.guests=[]; S.guestT=1.5; S.centerId=null; S.centerT=0; S.climax=0; S.climaxCool=4;
  S.octo.y=L.floorY; S.octo.climb=0; S.octo.face='happy'; S.octo.faceT=2;
  A.music=1; A.chime(true);
  discover('rise',L.cx,L.ceilY);
  sparkles(L.cx,L.ceilY,24);
  cacheDirty=true; saveSoon();
}
function enterSea(){
  S.phase='sea'; S.trans=null; S.flagK=0; S.houseShake=0;
  S.guests=[];
  for(const p of S.pieces){ p.fl=0; p.flip=p.on?1:0; if(p.mode!=='worn'&&p.mode!=='attached'){ p.mode='rest'; p.y=p.support==='ledge'?L.ledgeY:L.floorY; p.restY=p.y; } if(p.type==='shelf'){ p.bridge=0; p.dir=shelfDirFor(p);} }

  // 次のサイクル：座面がぽんと外れて、もう一方の脚の近くへ

    ch.seat=null; st.on=null; st.mode='rest';
    st.x=clamp(other.x+(other.x<L.cx?150:-150),L.wallL+80,L.wallR-80); st.y=Math.min(by(other)-40,L.floorY-60); st.rot=-.25;
    if(Math.abs(st.x-L.ventX)<90) st.x=clamp(st.x+(st.x<L.ventX?-100:100),L.wallL+80,L.wallR-80);

  const o=S.octo; o.x=L.octoHome; o.y=L.floorY; octoIdle(1); o.face='happy'; o.faceT=2;
  S.hatCool=1; S.seekCool=4; S.pendingHat=null;

/* ---------- 島：来客とおまつり ---------- */
function bridgePiece(){ const sh=P('shelf'); return (S.phase==='island'&&sh.bridge&&sh.mode==='rest'&&(sh.bridgeK||0)>.9)?sh:null; }
function bridgeEnd(sh){ const e=sh.bridge>0?L.wallR:L.wallL; return {x:e+sh.bridge*L.bridgeLen,y:L.seaY-6,bx:e-sh.bridge*24,by:L.floorY}; }
function flags(){ return S.pieces.filter(p=>(p.type==='curtain'||p.type==='kelp')&&p.mode==='rest'); }
function flagNearBridge(){ const br=bridgePiece(); if(!br) return null; const be=bridgeEnd(br); return flags().find(f=>Math.abs(f.x-be.bx)<280)||null; }
function centerPiece(){ return S.centerId?P(S.centerId):null; }
function pickCenter(){
  let best=null,bs=-1;
  for(const p of S.pieces){
    if(p.mode!=='rest') continue;
    if(p.type==='shelf'&&p.bridge) continue;
    if(p.type==='seat'&&p.on) continue;
    const pr=(isLegs(p)&&p.seat)?.6:(p.type==='dish'?.4:(p.type==='curtain'||p.type==='kelp')?.2:0);
    const s=p.uses+pr;
    if(s>bs){bs=s;best=p;}
  }
  return best;
}
function spawnGuest(){
  const br=bridgePiece();
  const side=br?br.bridge:(Math.random()<.5?-1:1);
  const seen=S.visitors;
  let type=Math.random()<.07?'horse':pick(GUEST_TYPES);
  const unseen=GUEST_TYPES.filter(t=>!seen[t]); if(unseen.length&&Math.random()<.6) type=pick(unseen);
  const e=side>0?L.wallR:L.wallL;
  const g={type,x:e+side*rnd(330,420),y:L.seaY,side,dir:-side,state:'swim',st:0,ph:rnd(0,6),size:type==='turtle'?1.05:(type==='horse'?.9:.95),face:'normal',wave:false,jump:0,spin:0,slot:0,alpha:1,tx:0};
  S.guests.push(g);
}
function updGuests(dt){
  if(S.phase!=='island') return;
  const br=bridgePiece(); const fl=flagNearBridge();
  const active=S.guests.filter(g=>g.state!=='leave');
  S.guestT-=dt;
  if(S.guestT<=0){
    S.guestT=fl?rnd(2,3):(br?rnd(6,8):rnd(6,9));
    const cap=br?(fl?9:4):3;
    if(active.length<cap) spawnGuest();
    else if(br&&fl&&active.length>=9){ const old=active.find(g=>g.state==='party'); if(old){ old.state='leave'; old.wave=true; } }
  }
  // おまつりの中心
  S.centerT-=dt;
  if(S.centerT<=0){
    S.centerT=2;
    const cp=pickCenter();
    if(cp&&cp.id!==S.centerId){
      const had=S.centerId;
      S.centerId=cp.id;
      if(had&&S.guests.some(g=>g.state==='party')){ discover('centerShift',cp.x,by(cp)-100); }
      sparkles(cp.x,by(cp)-60,8);
      for(const g of S.guests) if(g.state==='party'||g.state==='use'){ g.state='walk'; }
    }
  }
  const cp=centerPiece();
  let slotI=0;
  const party=S.guests.filter(g=>g.state==='party');
  for(const g of S.guests){
    g.st+=dt;
    g.jump=Math.max(0,g.jump-dt*60);
    const e=g.side>0?L.wallR:L.wallL;
    switch(g.state){
      case 'swim':{
        g.wave=false;
        let tx,ty=L.seaY+Math.sin(S.t*3+g.ph)*3;
        if(br){ const be=bridgeEnd(br); tx=be.x+br.bridge*10; g.side=br.bridge; }
        else tx=e+g.side*rnd(150,160);
        const d=tx-g.x; g.x+=sgn(d)*Math.min(Math.abs(d),75*dt); g.y=ty; g.dir=sgn(d)||g.dir;
        if(Math.abs(d)<6){ if(br){ g.state='climb'; g.st=0; g.bs=0; A.koto(1.5); drops(g.x,L.seaY,5,.6); } else { g.state='wait'; g.st=0; } }
        break;
      }
      case 'wait':{
        g.y=L.seaY+Math.sin(S.t*3+g.ph)*4; g.dir=-g.side; g.wave=Math.sin(S.t*1.3+g.ph)>.2; g.face=g.wave?'ask':'normal';
        if(br) { g.state='swim'; g.face='happy'; }
        break;
      }
      case 'climb':{
        if(!br){ g.state='swim'; g.y=L.seaY; break; }
        const be=bridgeEnd(br);
        g.bs=Math.min(1,g.bs+dt*.55);
        g.x=lerp(be.x,be.bx,g.bs); g.y=lerp(be.y,be.by,g.bs); g.dir=-br.bridge; g.jump=Math.abs(Math.sin(g.bs*20))*6;
        if(g.bs>=1){ g.state='walk'; g.st=0; S.visitors[g.type]=(S.visitors[g.type]||0)+1; g.face='happy'; A.note(784,.08,.15); if(fl) discover('flag',fl.x,by(fl)-200); saveSoon(); }
        break;
      }
      case 'walk':{
        if(!cp){ g.state='party'; break; }
        const k=slotI++; const off=(k%2?1:-1)*(80+Math.floor(k/2)*46);
        let tx=clamp(cp.x+off,L.wallL+24,L.wallR-24);
        const d=tx-g.x; g.x+=sgn(d)*Math.min(Math.abs(d),110*dt); g.dir=sgn(d)||g.dir;
        g.y=surfaceYAt(g.x);
        // じゃまな家具はぴょんと越える
        for(const p of S.pieces){ if(p===cp||p.mode!=='rest'||(p.type==='shelf'&&p.bridge)) continue; const b=aabb(p); if(g.x>b.x0+10&&g.x<b.x1-10&&b.y1>=L.floorY-L.stageH-4){ g.jump=Math.max(g.jump,Math.min(70,(g.y-b.y0)*.55)); } }
        if(Math.abs(d)<5){ g.state='party'; g.st=0; g.tx=tx; }
        break;
      }
      case 'party':{
        slotI++;
        g.y=surfaceYAt(g.x); g.dir=sgn(cp?cp.x-g.x:1); g.face='happy';
        if(S.climax>0){ g.jump=Math.abs(Math.sin(S.t*6+g.ph*.2))*26; g.spin=Math.sin(S.t*6)*.2; } else { g.spin*=.9; if(Math.sin(S.t*4+g.ph)>.95) g.jump=Math.max(g.jump,10); }
        if(cp&&Math.abs(g.tx-cp.x)>260){ g.state='walk'; }
        break;
      }
      case 'use':{
        if(!cp){ g.state='party'; break; }
        g.ut+=dt; const u=g.ut;
        if(isLegs(cp)&&cp.seat){ const sx=cp.x, sy=legsTopY(cp)-4; g.x=lerp(g.ux,sx,ease(u/.5)); g.y=lerp(surfaceYAt(g.ux),sy,ease(u/.5)); g.jump=u<.5?Math.sin(u/.5*Math.PI)*50:0; if(u>2){ g.state='walk'; } }
        else if(cp.type==='dish'){ g.x=lerp(g.ux,cp.x,ease(u/.5)); g.y=lerp(surfaceYAt(g.ux),by(cp)-20,ease(u/.5)); g.jump=u<.5?Math.sin(u/.5*Math.PI)*60:Math.abs(Math.sin(u*8))*8; if(u>.5&&!g.spl){ g.spl=1; A.splash(); drops(cp.x,by(cp)-36,10,.7); } if(u>1.8) g.state='walk'; }
        else if(cp.type==='curtain'||cp.type==='kelp'){ const a=u*3.2; g.x=cp.x+Math.cos(a)*60; g.y=surfaceYAt(g.x); g.dir=-Math.sin(a)>0?1:-1; g.jump=Math.abs(Math.sin(a*2))*14; if(u>2) g.state='walk'; }
        else if(isLegs(cp)){ g.x=lerp(g.ux,cp.x,ease(u/.4)); g.y=lerp(surfaceYAt(g.ux),legsTopY(cp),ease(u/.4)); if(u>.4&&!g.spl){ g.spl=1; A.boom(); } g.jump=u>.4?Math.abs(Math.sin(u*9))*16:Math.sin(u/.4*Math.PI)*40; if(u>1.8) g.state='walk'; }
        else if(cp.type==='shelf'){ const h=shelfHigh(cp), t=shelfTip(cp); if(u<.6){ g.x=lerp(g.ux,h.x,u/.6); g.y=lerp(surfaceYAt(g.ux),h.y,u/.6); } else { const s=Math.min(1,(u-.6)/.5); g.x=lerp(h.x,t.x,s); g.y=lerp(h.y,t.y,s); } if(u>1.3) g.state='walk'; }
        else { if(u>1) g.state='walk'; }
        break;
      }
      case 'leave':{
        g.x+=g.side*90*dt; g.dir=g.side; g.y=lerp(g.y,L.seaY,dt*3); g.alpha=Math.max(0,(g.alpha==null?1:g.alpha)-dt*.25);
        break;
      }
    }
  }
  S.guests=S.guests.filter(g=>!(g.state==='leave'&&(g.alpha<=0||Math.abs(g.x-L.cx)>W/L.zI)));
  // 中心の家具をかわるがわる使う
  S.useT=(S.useT||0)-dt;
  if(cp&&S.useT<=0&&party.length){
    S.useT=S.climax>0?1:2.4;
    const g=pick(party); g.state='use'; g.ut=0; g.ux=g.x; g.spl=0;
    cp.uses++; cp.sq=.7; noteP(cp.x,by(cp)-120);
    if(isLegs(cp)) A.koto(1.2);
  }
  // 大もりあがり
  S.climaxCool=Math.max(0,S.climaxCool-dt);
  if(S.climax>0){
    S.climax-=dt;
    if(Math.random()<dt*3) { A.firework(); fireworkP(L.cx+rnd(-L.roomW*.4,L.roomW*.4),L.ceilY-rnd(0,L.roofH+80)); }
    if(S.climax<=0){ A.music=1; }
  } else if(party.length>=5&&S.climaxCool<=0){
    S.climax=5; S.climaxCool=22; S.festivals++; A.music=2;
    discover('festival',cp?cp.x:L.cx,L.ceilY);
    if(cp&&isLegs(cp)&&cp.seat&&S.octo.state==='idle') S.pendingHat=cp.id;
    saveSoon();
  }
}

/* ---------- ガイド（次に触るものを一つだけ） ---------- */
function guideTarget(){
  if(S.trans) return null;
  if(S.phase==='sea'){
    const seat=P('seat'), ch=chairOf(), sh=P('shelf'), di=P('dish'), kp=P('kelp'), cu=P('curtain');
    if(!ch){ const lgs=freeLegs().filter(l=>l.mode==='rest'); let lg=lgs.sort((a,b)=>Math.abs(a.x-seat.x)-Math.abs(b.x-seat.x))[0]; if(lg&&seat.mode==='rest') return {p:seat,x:lg.x,y:legsTopY(lg)-40}; return null; }
    if(S.octo.hat||S.pendingHat) return null;
    if(!S.found.slide){ if(!sh.upright||sh.support!=='floor') return {p:sh,x:L.wallL+L.roomW*.42,y:L.floorY-70}; }

function updPieces(dt){

    } else if(p.mode==='fall'){

      if(p.type==='curtain'&&p.on!=='door'&&p.mode!=='drag') p.flip=Math.max(0,p.flip-dt*3);
    }

}

}
function updFishIsland(f,dt){
  f.tilt*=1-Math.min(1,dt*4);
  const lo=L.seaY+46, hi=L.seaY+260;
  switch(f.state){
    case 'iswim':{
      f.data.t=(f.data.t||0)-dt;
      if(f.data.t<=0||f.data.tx===undefined){ f.data.t=rnd(1.5,3.5); const fp=f.fav?P(f.fav):null; const bx=fp&&fp.mode==='rest'?fp.x:L.cx; f.data.tx=bx+rnd(-L.roomW*.45,L.roomW*.45); f.data.ty=rnd(lo,hi); }
      swimTo(f,f.data.tx,f.data.ty,70,dt);
      f.y=Math.max(f.y,lo-6);
      f.actCool-=dt;
      if(f.actCool<=0){
        f.actCool=rnd(2,5);
        const di=dishOK(); const cp=centerPiece();
        if(di&&Math.random()<(f.fav===di.id?.7:.4)){ f.state='ijump'; f.st=0; f.x=clamp(di.x+rnd(-140,140),L.wallL-60,L.wallR+60); f.y=L.seaY+6; launchToward(f,f.x,f.y,-560,di.x,by(di)-34,0); f.data={target:di.id}; A.splash(); drops(f.x,L.seaY,6,.6); }
        else { const fp=f.fav&&P(f.fav)?P(f.fav):cp; const x=fp?clamp(fp.x+rnd(-100,100),L.wallL-120,L.wallR+120):f.x; f.state='ijump'; f.st=0; f.x=x; f.y=L.seaY+6; f.vx=rnd(-120,120); f.vy=-rnd(420,560); f.data={target:null}; A.splash(); drops(f.x,L.seaY,6,.6); }
      }
      break;
    }
    case 'ijump':{
      f.vy+=900*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.dir=sgn(f.vx)||f.dir; f.tilt=tiltFor(f.vx,f.vy,f.dir);
      if(Math.random()<dt*3) sparkles(f.x,f.y,1);
      const di=f.data.target?P(f.data.target):null;
      if(di&&di.mode==='rest'&&f.vy>0&&Math.abs(f.x-di.x)<66&&f.y>=by(di)-40&&f.y<by(di)){ landInDish(f,di,'island'); f.state='idish'; f.st=0; break; }
      if(f.vy>0&&f.y>=L.seaY+4){ const deck=f.x>L.wallL-20&&f.x<L.wallR+20&&f.y<L.floorY+30; if(!deck||f.y>L.seaY+30){ f.state='iswim'; f.st=0; A.splash(); drops(f.x,L.seaY,6,.5); f.data={}; } }
      if(f.vy>0&&f.x>L.wallL-10&&f.x<L.wallR+10&&f.y>=L.floorY-16&&f.y<L.floorY+10){ f.vx=sgn(f.x-L.cx)*220; f.vy=-260; f.y=L.floorY-17; A.thud(1.6); }
      break;
    }
    case 'idish':{
      const di=P('dish');
      if(!di||di.mode!=='rest'){ f.state='ijump'; f.vx=sgn(f.x-L.cx)*260; f.vy=-300; f.data={}; break; }
      f.x+=(di.x-f.x)*dt*3; f.y=by(di)-30+Math.sin(S.t*4+f.wig)*3;
      if(Math.random()<dt*2) drops(f.x,f.y-6,1,.4);
      if(f.st>1.8){ f.state='ijump'; f.st=0; f.vx=sgn(f.x-L.cx||1)*rnd(260,330); f.vy=-380; f.data={}; }
      break;
    }
    default: f.state='iswim'; f.st=0; f.data={};
  }
}

const ptrs=new Map();
function firstTouch(){
  A.init();
  if(!S.touched){ S.touched=true; if(S.phase==='island') A.music=1; }
}
function tapEmpty(x,y){
  const o=S.octo;
  if(!S.trans&&Math.abs(x-o.x)<70&&y>octoHeadTop(o)-10&&y<o.y-o.climb){ if(o.state==='idle'){ o.face='happy'; o.faceT=1.2; o.squat=-.4; A.giggle(); heartP(o.x,octoHeadTop(o)-20);} return; }
  for(const f of S.fish){ if(!f.hidden&&dist(x,y,f.x,f.y)<44&&(f.state==='wander'||f.state==='iswim')){ f.face='surprise'; f.faceT=.6; f.hop=1; f.vy-=80; A.pop(); if(f.cautious) f.puffT=1; return; } }
  ringP(x,y,6,'rgba(255,255,255,.6)'); bubbles(x,y,2,6);
  for(const f of S.fish){ if(!f.hidden&&dist(x,y,f.x,f.y)<260){ f.lookX=x; f.lookY=y; } }
  o.lookX=x; o.lookY=y;
}
function onDown(e){
  if(e.cancelable) e.preventDefault();
  firstTouch(); S.lastInput=S.t; S.idleReach=false;
  if(ptrs.has(e.pointerId)) return;
  const w=toWorld(e.clientX,e.clientY);
  if(!S.trans&&(S.phase==='sea'||S.phase==='island')){
    const p=hitPiece(w.x,w.y);
    if(p){ const g=grab(p,w.x,w.y); if(g){ ptrs.set(e.pointerId,{p:g}); try{ cv.setPointerCapture(e.pointerId); }catch(_){} return; } }
  }
  tapEmpty(w.x,w.y);
  ptrs.set(e.pointerId,{p:null});
}
function onMove(e){
  const s=ptrs.get(e.pointerId); if(!s||!s.p) return;
  if(e.cancelable) e.preventDefault();
  if(s.p.mode!=='drag'){ ptrs.delete(e.pointerId); return; }
  const w=toWorld(e.clientX,e.clientY); moveDrag(s.p,w.x,w.y); S.lastInput=S.t;
}
function onUp(e){
  const s=ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if(s&&s.p&&s.p.mode==='drag'){ dropPiece(s.p); S.lastInput=S.t; }
}

   ループ・非表示/復帰・回転

let raf=0,last=0,running=true;
const ERR=[];
function update(dt){
  S.t+=dt;
  if(S.touched&&S.light<1) S.light=Math.min(1,S.light+dt*1.8);
  updTimers(dt);
  if(S.trans) updTrans(dt);
  updPieces(dt);
  updFloat(dt);
  updOcto(dt);
  for(const f of S.fish) updFish(f,dt);
  updGuests(dt);
  if(S.phase==='island'&&Math.random()<dt*3) addP({k:'drop',x:L.ventX+rnd(-6,6),y:L.floorY-30,vx:rnd(-50,50),vy:rnd(-220,-140),r:rnd(2.5,4.5),life:0,max:.8});
  updParts(dt);
  updHint(dt);
  A.musicTick();
  if(S.saveT>0){ S.saveT-=dt; if(S.saveT<=0) saveNow(); }
}
function frame(ts){
  raf=0; if(!running) return;
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0)); last=ts;
  if(Math.abs(window.innerWidth-SW)>1||Math.abs(window.innerHeight-SH)>1){ releaseAll(); computeLayout(); }
  try{ update(dt); draw(); }catch(err){ if(ERR.length<20) ERR.push(String(err&&err.stack||err)); }
  raf=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ running=false; try{ releaseAll(); }catch(_){} saveNow(); A.suspend(); if(raf){ cancelAnimationFrame(raf); raf=0; } }
  else { running=true; last=performance.now(); if(S.touched) A.resume(); if(!raf) raf=requestAnimationFrame(frame); }
});
window.addEventListener('pagehide',()=>saveNow());
window.addEventListener('orientationchange',()=>{ cacheDirty=true; });

function restoreChars(){
  const fav=S._fav||{};

  for(let i=0;i<S.friendsCalled;i++){ const k=['f1','f2','f3'][i]; const nf=newFish(k,rnd(L.wallL+60,L.wallR-60),rnd(L.floorY-L.roomH*.7,L.floorY-80)); const id=fav[k]; if(id&&P(id)){ nf.fav=id; nf.mem[id]=3; } S.fish.push(nf); }
  if(S.phase==='island'){
    S.flagK=1;
    for(const p of S.pieces){ if(p.type==='shelf'){ const dl=p.x-L.wallL, dr=L.wallR-p.x; if(dr<190||dl<190){ const side=dr<dl?1:-1; p.bridge=side; p.bridgeK=1; p.dir=side; p.x=side>0?L.wallR-70:L.wallL+70; } else p.dir=shelfDirFor(p); } }
    for(const f of S.fish){ f.state='iswim'; f.x=L.cx+rnd(-L.roomW*.5,L.roomW*.5); f.y=L.seaY+rnd(80,220); }
    S.guestT=1.5; S.climaxCool=4;
  }
}
function init(){
  S=freshState();
  computeLayout();
  S.pieces=defaultPieces();
  let restored=false;
  const d=loadSave();
  if(d){ restored=applySave(d); if(!restored){ S=freshState(); S.pieces=defaultPieces(); } }
  makeChars();
  if(restored) restoreChars();
  S.restored=restored;
  cacheDirty=true;
  last=performance.now();
  raf=requestAnimationFrame(frame);
}
// 検証用（UIには出さない）
window.__kg={
  get S(){return S;}, get L(){return L;}, get cam(){return cam;}, log:LOG, errors:ERR,
  P, toScreen, toWorld, guide:()=>{const g=guideTarget(); return g?{id:g.p.id,x:g.x,y:g.y}:null;},
  advance(sec){ const n=Math.round(sec*60); for(let i=0;i<n;i++){ update(1/60); } draw(); },
  aabb, kelpEnd, debugRise:()=>startRise(), debugSink:()=>startSink(), shelfTip, legsTopY, by, chairOf, parts:()=>S.parts.length, audio:()=>A.c?A.c.state:'none'
};
init();
})();
</script>
