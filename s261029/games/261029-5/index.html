function projPts(list) { return list.map(p => { proj(p[0], p[1], p[2], _p); return [_p.x, _p.y]; }); }
function circle3(x, y, z, r, n) { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([x + Math.cos(a) * r, y, z + Math.sin(a) * r]); } return o; }

function drawIsland(c, is, vis, now) {
  const pop = is.id === 'sora' ? vis.teaRise : 1;
  if (pop <= 0.01) return;
  const h = is.h * pop, r = is.r * (0.6 + 0.4 * pop);
  const base = projPts(circle3(is.x, -0.1, is.z, r * 1.04, 22));
  const top = projPts(circle3(is.x, h, is.z, r, 22));
  // water ring
  c.globalAlpha = 0.5;
  stamp(c, projPts(circle3(is.x, 0, is.z, r * 1.18, 22)), '#d5f0fb', { tex: false });
  c.globalAlpha = 1;
  // cliff: lower ring + top ring hull
  const cliff = [];
  for (let i = 0; i <= 11; i++) cliff.push(base[i]);
  for (let i = 11; i >= 0; i--) cliff.push(top[i]);
  const cliffCol = is.id === 'sora' ? '#f3d9ef' : is.id === 'cookie' ? '#d7a466' : '#b98a5a';
  stamp(c, cliff, cliffCol, { smooth: false, line: 'rgba(90,60,40,0.6)', lw: 1.3, seed: 70 });
  const topCol = { ichigo: '#bde39a', mikan: '#c8e69a', cookie: '#e8c88e', kinoko: '#b5dfa0', sora: '#fff4fb' }[is.id];
  stamp(c, top, topCol, { line: 'rgba(70,110,60,0.6)', lw: 1.4, seed: 71 });
  proj(is.x, h, is.z, _p);
  const s = _p.s, cx = _p.x, cy = _p.y;
  return { cx, cy, s, h };
}
function islandDecor(c, is, vis, now, info) {
  if (!info) return;
  const s = info.s * (is.id === 'sora' ? vis.teaRise : 1);
  const P = (dx, dz) => { proj(is.x + dx, info.h, is.z + dz, _p2); return [_p2.x, _p2.y, _p2.s]; };
  if (is.id === 'ichigo') {
    for (const d of [[-1.6, 0.9, 1.1], [1.5, 1.2, 0.9], [-0.2, 1.9, 1.3]]) {
      const q = P(d[0], d[1]); const k = q[2] * d[2];
      stamp(c, [[q[0], q[1]], [q[0] - k * 0.5, q[1] - k * 0.7], [q[0], q[1] - k * 1.0], [q[0] + k * 0.5, q[1] - k * 0.7]], '#e8394f', { line: 'rgba(120,30,40,0.7)', lw: 1.2, seed: 72 });

      stamp(c, [[q[0] - k * 0.3, q[1] - k * 0.95], [q[0], q[1] - k * 1.15], [q[0] + k * 0.3, q[1] - k * 0.95], [q[0], q[1] - k * 0.85]], '#4caa4a', { tex: false });
    }
  } else if (is.id === 'mikan') {

      line(c, q[0], q[1], q[0], q[1] - k * 0.9, '#8a5a3a', Math.max(1.5, k * 0.15));
      stamp(c, ellPts(q[0], q[1] - k * 1.3, k * 0.7, k * 0.55, 14, 0.15, 73), '#5fb54a', { line: 'rgba(40,90,40,0.6)', lw: 1.2 });
      for (let i = 0; i < 5; i++) dot(c, q[0] + (hs(i, 5) - 0.5) * k, q[1] - k * (1.0 + hs(i, 6) * 0.6), k * 0.12, '#f59a2b');
    }
  } else if (is.id === 'cookie') {
    for (const d of [[-1.0, 0.6, 0.7], [1.1, 0.5, 0.55]]) {
      const q = P(d[0], d[1]); const k = q[2] * d[2];
      stamp(c, ellPts(q[0], q[1] - k * 0.5, k * 0.6, k * 0.55, 14, 0.12, 74), '#e0b071', { line: 'rgba(110,70,30,0.7)', lw: 1.2 });
      for (let i = 0; i < 4; i++) dot(c, q[0] + (hs(i, 7) - 0.5) * k * 0.7, q[1] - k * (0.3 + hs(i, 8) * 0.5), k * 0.08, '#6a3a20');
    }
  } else if (is.id === 'kinoko') {
    for (const d of [[-1.0, 0.6, 0.8], [1.0, 0.7, 0.65]]) {
      const q = P(d[0], d[1]); const k = q[2] * d[2];
      stamp(c, [[q[0] - k * 0.15, q[1]], [q[0] + k * 0.15, q[1]], [q[0] + k * 0.12, q[1] - k * 0.6], [q[0] - k * 0.12, q[1] - k * 0.6]], '#fff3df', { smooth: false, line: 'rgba(110,80,60,0.6)', lw: 1 });
      const cap = []; for (let i = 0; i <= 10; i++) { const a = Math.PI + i / 10 * Math.PI; cap.push([q[0] + Math.cos(a) * k * 0.55, q[1] - k * 0.6 + Math.sin(a) * k * 0.45]); }
      stamp(c, cap, '#e2506e', { line: 'rgba(110,30,50,0.7)', lw: 1.2 });
      for (let i = 0; i < 3; i++) dot(c, q[0] + (i - 1) * k * 0.25, q[1] - k * 0.82, k * 0.07, '#ffffff');
    }
  } else if (is.id === 'sora') {
    const q = P(1.8, 1.2); const k = q[2];
    stamp(c, ellPts(q[0], q[1] - k * 0.45, k * 0.5, k * 0.42, 14), '#9fd2f0', { line: 'rgba(40,90,140,0.6)', lw: 1.2 });
    line(c, q[0] + k * 0.45, q[1] - k * 0.5, q[0] + k * 0.85, q[1] - k * 0.8, '#9fd2f0', Math.max(1.5, k * 0.12));
    dot(c, q[0], q[1] - k * 0.9, k * 0.1, '#f5d36a');
    // runway landing pad
    const p0 = P(-0.0, -3.4);
    c.globalAlpha = 0.8; ell(c, p0[0], p0[1], p0[2] * 1.3, p0[2] * 0.35, '#f7e3a8'); c.globalAlpha = 1;
  }
}
function drawFlag(c, x, y, s, col, t) {

  const wv = Math.sin(t * 4 + x) * s * 0.08;

function drawTable(c, x, y, s, plates, cake) {
  c.globalAlpha = 0.35; ell(c, x, y, s * 0.8, s * 0.2, '#3a4a2a'); c.globalAlpha = 1;
  line(c, x - s * 0.45, y, x - s * 0.45, y - s * 0.45, '#9a6a44', Math.max(1.2, s * 0.08));

function drawHouse(c, Wd, vis, now) {
  const Hh = Wd.house;
  const x0 = Hh.x - Hh.hw, x1 = Hh.x + Hh.hw, ov = Hh.ov;
  // back slope (visible from above)
  const eY = Hh.eave - 0.12;
  stamp(c, projPts([[x0 - ov, Hh.ridge, Hh.zc], [x1 + ov, Hh.ridge, Hh.zc], [x1 + ov, eY, Hh.z1 + ov], [x0 - ov, eY, Hh.z1 + ov]]), '#c9504a', { smooth: false, line: 'rgba(90,30,30,0.6)', lw: 1.3, seed: 80 });
  // chimney
  const ch = projPts([[x1 - 1.0, Hh.ridge - 0.3, Hh.zc + 0.5], [x1 - 0.55, Hh.ridge - 0.3, Hh.zc + 0.5], [x1 - 0.55, Hh.ridge + 0.6, Hh.zc + 0.5], [x1 - 1.0, Hh.ridge + 0.6, Hh.zc + 0.5]]);
  stamp(c, ch, '#b07a5a', { smooth: false, line: 'rgba(80,40,30,0.7)', lw: 1.1 });
  // front wall
  const wall = projPts([[x0, 0, Hh.z0], [x1, 0, Hh.z0], [x1, Hh.eave, Hh.z0], [x0, Hh.eave, Hh.z0]]);
  stamp(c, wall, '#fbe9c9', { smooth: false, line: 'rgba(110,80,50,0.7)', lw: 1.3, seed: 81 });
  // door and windows
  const door = projPts([[-0.35, 0, Hh.z0 - 0.01], [0.35, 0, Hh.z0 - 0.01], [0.35, 0.8, Hh.z0 - 0.01], [-0.35, 0.8, Hh.z0 - 0.01]]);
  stamp(c, door, '#8fc0e6', { smooth: false, line: 'rgba(60,80,120,0.7)', lw: 1.1 });
  for (const sx of [-1, 1]) {
    const win = projPts([[sx * 1.2 - 0.32, 0.38, Hh.z0 - 0.01], [sx * 1.2 + 0.32, 0.38, Hh.z0 - 0.01], [sx * 1.2 + 0.32, 0.85, Hh.z0 - 0.01], [sx * 1.2 - 0.32, 0.85, Hh.z0 - 0.01]]);
    stamp(c, win, '#fff4a0', { smooth: false, line: 'rgba(110,80,50,0.7)', lw: 1.1 });
  }
  // front slope with shingle rows
  const fs = projPts([[x0 - ov, eY, Hh.z0 - ov], [x1 + ov, eY, Hh.z0 - ov], [x1 + ov, Hh.ridge, Hh.zc], [x0 - ov, Hh.ridge, Hh.zc]]);
  stamp(c, fs, '#ea6a5e', { smooth: false, line: 'rgba(110,30,30,0.7)', lw: 1.4, seed: 82 });
  c.strokeStyle = 'rgba(150,40,40,0.45)'; c.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const t = i / 4, yy = lerp(eY, Hh.ridge, t), zz = lerp(Hh.z0 - ov, Hh.zc, t);
    const a = projPts([[x0 - ov, yy, zz], [x1 + ov, yy, zz]]);
    c.beginPath(); c.moveTo(a[0][0], a[0][1]); c.lineTo(a[1][0], a[1][1]); c.stroke();
    for (let k = 0; k < 9; k++) { const xx = lerp(x0 - ov, x1 + ov, (k + (i % 2) * 0.5) / 9); const b = projPts([[xx, yy, zz], [xx, lerp(eY, Hh.ridge, t - 0.25), lerp(Hh.z0 - ov, Hh.zc, t - 0.25)]]); c.beginPath(); c.moveTo(b[0][0], b[0][1]); c.lineTo(b[1][0], b[1][1]); c.stroke(); }
  }
  // spring bounce stamps left on the roof
  for (const st of vis.roofStamps) {
    const rh = SIM.roofH(Wd, st.x, st.z);
    if (rh <= 0) continue;
    proj(st.x, rh + 0.01, st.z, _p);
    const k = _p.s * 0.45 * (st.age < 0.3 ? easeBack(st.age / 0.3) : 1);
    c.globalAlpha = 0.75;
    c.strokeStyle = '#f6e7a0'; c.lineWidth = Math.max(1.2, k * 0.18);
    c.beginPath();
    for (let i = 0; i <= 20; i++) { const t = i / 20; const xx = _p.x + Math.sin(t * TAU * 2.5) * k * 0.5; const yy = _p.y + (t - 0.5) * k * 0.8; if (!i) c.moveTo(xx, yy); else c.lineTo(xx, yy); }
    c.stroke();
    c.globalAlpha = 0.5; c.strokeStyle = '#fff8d0';
    c.beginPath(); c.ellipse(_p.x, _p.y, k * 0.75, k * 0.32, 0, 0, TAU); c.stroke();
    c.globalAlpha = 1;
  }
  // chimney puff hint
  if (vis.chimney > 0) {
    proj(x1 - 0.78, Hh.ridge + 0.9 + (1 - vis.chimney) * 1.2, Hh.zc + 0.5, _p);
    c.globalAlpha = vis.chimney * 0.8;
    stamp(c, ellPts(_p.x, _p.y, _p.s * 0.35, _p.s * 0.28, 12, 0.2, 83), '#ffffff', { tex: false, line: 'rgba(120,140,160,0.5)', lw: 1 });
    c.globalAlpha = 1;
  }
}

function boxLidPts(B, a, yb) {
  const hz = B.z + B.hd, d = B.hd * 2, lh = B.h - yb;
  const rot = (dy, dz) => [dy * Math.cos(a) - dz * Math.sin(a), dz * Math.cos(a) + dy * Math.sin(a)];
  const P = (x, dy, dz) => { const r = rot(dy, dz); return [x, yb + r[0], hz + r[1]]; };
  const x0 = B.x - B.hw - 0.04, x1 = B.x + B.hw + 0.04;
  return {
    front: projPts([P(x0, 0, -d - 0.04), P(x1, 0, -d - 0.04), P(x1, lh, -d - 0.04), P(x0, lh, -d - 0.04)]),
    top: projPts([P(x0, lh, -d - 0.04), P(x1, lh, -d - 0.04), P(x1, lh, 0), P(x0, lh, 0)]),
    inner: projPts([P(x0 + 0.08, 0, -d + 0.05), P(x1 - 0.08, 0, -d + 0.05), P(x1 - 0.08, 0, -0.05), P(x0 + 0.08, 0, -0.05)]),
    band: projPts([P(B.x - 0.18, 0, -d - 0.05), P(B.x + 0.18, 0, -d - 0.05), P(B.x + 0.18, lh, -d - 0.05), P(B.x - 0.18, lh, -d - 0.05)]),
  };
}
function drawBox(c, Wd, vis, now) {

    c.save(); c.translate(x, y); c.scale(C.dir, 1);
    stamp(c, [[-k, 0], [0, -k * 0.2], [k * 1.2, -k * 0.6], [k * 0.2, k * 0.25]], COL.trail[i % 6], { smooth: false, tex: false });
    stamp(c, [[-k * 0.2, -k * 0.1], [k * 0.1, -k * (0.9 + f)], [k * 0.4, -k * 0.1]], '#ffffff', { smooth: false, tex: false });
    c.restore();
  }
}

// ============================================================
// main loop, visibility, resize
// ============================================================
let rafId = 0, lastT = 0, running = true;
function frame(ts) {
  rafId = 0;
  if (!running) return;
  const dt = Math.min(0.05, Math.max(0, (ts - lastT) / 1000));
  lastT = ts;
  try { update(dt); render(); } catch (e) { if (!frame.err) { frame.err = true; console.warn(e); } }
  rafId = requestAnimationFrame(frame);
}
function start() {
  if (rafId) return;
  lastT = performance.now();
  rafId = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    setWhoosh(0, 0); setMill(0, 200);
    try { if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); } catch (e) { }
    save();
  } else {
    running = true;
    try { if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); } catch (e) { }
    start();
  }
});
let resizeT = 0;
function onResize() {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (G.drag) { const d = G.drag; G.drag = null; if (d.kind === 'plane') G.stk.push(d.orig); else if (d.kind === 'pocket') { if (d.type === 'k') G.cargo.cake = 1; else G.cargo.candy++; } }
    G.anims.length = 0;
    computeLayout();
    WZ.fx = 0; WZ.fy = 0;
    if (G.party) { const is = G.world.islands.find(i => i.id === G.party.id); if (is) { proj(is.x, is.h, is.z, _p); WZ.tfx = _p.x; WZ.tfy = _p.y - 30; } }
    // particles in screen space would drift away from their anchors
    for (let i = PT.length - 1; i >= 0; i--) if (PT[i].wx == null) PT.splice(i, 1);
  }, 60);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
window.addEventListener('pagehide', save);

// boot
computeLayout();
if (!load()) newWorld(false);
G.lastInput = 0;
window.__G = G; window.__VIS = VIS; window.__LY = LY; window.__PRJ = PRJ; window.__RES = RES;
start();
</script>
