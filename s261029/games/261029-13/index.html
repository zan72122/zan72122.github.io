<script>
(function(){
'use strict';
/* ============================================================
   やどかりのサンゴ島、ころころ海のおしろ
   一本指で砂浜に線を描く → 線が貝殻模様の丸太になって転がる →
   鐘・風車・橋・水車・噴水・真珠・貝殻ドミノがつながり、島はウミガメのお城になる。
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const easeOut = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - (1 - t) * (1 - t) * (1 - t);
const hyp = Math.hypot;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rr = (a, b) => a + Math.random() * (b - a);
function hsl(h, s, l, a) { return a === undefined ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`; }

/* ---------------- 端末内保存（初回・復元・破損・拒否に耐える） ---------------- */
const SAVE_KEY = 'yadokari-coral-island-v1';
const DECOR_KINDS = ['pearl', 'rainbow', 'spiral', 'round', 'star', 'crown', 'ribbon'];
function loadSave() {
  try {
    const s = window.localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    const o = JSON.parse(s);
    if (!o || typeof o !== 'object' || o.v !== 1) return null;
    const island = (Number.isInteger(o.island) && o.island >= 0 && o.island < 1e6) ? o.island : 0;
    let decor = null;
    if (o.decor && typeof o.decor === 'object' && DECOR_KINDS.indexOf(o.decor.kind) >= 0) {
      const hue = Number(o.decor.hue);
      decor = { kind: o.decor.kind, hue: isFinite(hue) ? clamp(hue, 0, 360) : 330 };
    }
    const seed = (typeof o.seed === 'number' && isFinite(o.seed)) ? (o.seed >>> 0) : 0;
    return { island, decor, seed };
  } catch (e) { return null; }
}
function writeSave() {
  try {
    window.localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, island: G.islandNo, decor: G.decor, seed: G.seed }));
  } catch (e) { /* 保存拒否でも遊び続ける */ }
}

/* ---------------- 音（Web Audio 合成、最初のタッチで開始） ---------------- */
const AU = { ctx: null, master: null, wet: null, noise: null, roll: null, water: null, wind: null, last: {} };
function audioStart() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended' && !document.hidden) AU.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const c = new AC();
    AU.ctx = c;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
    comp.connect(c.destination);
    const m = c.createGain(); m.gain.value = 0.75; m.connect(comp); AU.master = m;
    const d = c.createDelay(1.0); d.delayTime.value = 0.17;
    const fb = c.createGain(); fb.gain.value = 0.32;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    d.connect(lp); lp.connect(fb); fb.connect(d);
    const wo = c.createGain(); wo.gain.value = 0.42; lp.connect(wo); wo.connect(m);
    AU.wet = d;
    const len = Math.floor(c.sampleRate * 1.2);
    const b = c.createBuffer(1, len, c.sampleRate);
    const ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    AU.noise = b;
    AU.roll = loopNoise('bandpass', 380, 0.9);
    AU.water = loopNoise('lowpass', 700, 0.5);
    AU.wind = loopNoise('bandpass', 900, 2.5);
    if (c.resume) c.resume().catch(() => {});
  } catch (e) { AU.ctx = null; }
}
function loopNoise(type, f, q) {
  const c = AU.ctx;
  const src = c.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = c.createGain(); g.gain.value = 0;
  src.connect(fl); fl.connect(g); g.connect(AU.master);
  src.start();
  return { fl, g };
}
function okRate(key, ms) {
  const n = performance.now();
  if (AU.last[key] && n - AU.last[key] < ms) return false;
  AU.last[key] = n; return true;
}
function tone(o) {
  const c = AU.ctx; if (!c || c.state !== 'running') return;
  const f = o.f || 440, dur = o.dur || 0.3, vol = o.vol || 0.15, at = o.at || 0.004;
  const t0 = c.currentTime + (o.t || 0);
  const osc = c.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * o.slide), t0 + (o.slideT || dur));
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + at);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(AU.master);
  if (o.wet) { const w = c.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(AU.wet); }
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function noise(o) {
  const c = AU.ctx; if (!c || c.state !== 'running') return;
  const t0 = c.currentTime + (o.t || 0), dur = o.dur || 0.15;
  const src = c.createBufferSource(); src.buffer = AU.noise;
  const fl = c.createBiquadFilter(); fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 1000, t0); fl.Q.value = o.q || 1;
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.at || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(fl); fl.connect(g); g.connect(AU.master);
  if (o.wet) { const w = c.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(AU.wet); }
  src.start(t0, Math.random() * 0.8); src.stop(t0 + dur + 0.05);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
const nf = (base, i) => base * Math.pow(2, PENTA[clamp(i, 0, PENTA.length - 1)] / 12);
const SND = {
  bell(f, v, t) { // 澄んだ「カラン」
    const parts = [1, 2.01, 2.76, 4.07, 5.43], vols = [1, 0.5, 0.36, 0.2, 0.12], durs = [1.8, 1.1, 0.9, 0.55, 0.4];
    for (let i = 0; i < 5; i++) tone({ f: f * parts[i], dur: durs[i] * (0.7 + v), vol: v * 0.22 * vols[i], t: t || 0, wet: 0.5 });
    tone({ f: f * 0.5, dur: 0.12, vol: v * 0.08, type: 'triangle', t: t || 0 });
  },
  giant(v) {
    const f = 98;
    const parts = [0.5, 1, 1.2, 1.5, 2, 2.74, 3.01, 4.2, 5.3];
    parts.forEach((p, i) => tone({ f: f * p, dur: 4.2 - i * 0.3, vol: v * 0.2 / (1 + i * 0.35), at: 0.01, wet: 0.6 }));
    for (let i = 0; i < 6; i++) tone({ f: nf(784, i * 2), dur: 0.6, vol: 0.04, t: 0.25 + i * 0.09, wet: 0.7 });
  },
  tiny(f) { tone({ f: f, dur: 0.5, vol: 0.09, wet: 0.5 }); tone({ f: f * 2.7, dur: 0.25, vol: 0.04, wet: 0.5 }); },
  thump(v) { noise({ type: 'lowpass', f: 380, dur: 0.16, vol: 0.25 * v }); tone({ f: 120, slide: 0.5, dur: 0.16, vol: 0.18 * v }); },
  clack(v, f) { if (!okRate('clack', 35)) return; noise({ f: f || 1600, q: 5, dur: 0.06, vol: 0.22 * v }); tone({ f: (f || 1600) * 0.32, type: 'triangle', dur: 0.08, vol: 0.12 * v }); },
  knock(v) { if (!okRate('knock', 45)) return; tone({ f: 330, slide: 0.7, type: 'triangle', dur: 0.08, vol: 0.16 * v }); noise({ f: 1300, q: 4, dur: 0.04, vol: 0.12 * v }); },
  plink(v) { if (!okRate('plink', 50)) return; tone({ f: rr(900, 1500), slide: 1.7, dur: 0.11, vol: 0.09 * v, wet: 0.4 }); },
  splash(v) { noise({ type: 'bandpass', f: 1500, f2: 500, q: 0.8, dur: 0.4, vol: 0.18 * v }); },
  pop(f, v) { tone({ f: f || 700, slide: 1.9, dur: 0.09, vol: 0.13 * (v || 1) }); },
  grain() { if (!okRate('grain', 70)) return; noise({ type: 'highpass', f: 3000, dur: 0.05, vol: 0.05 }); },
  draw(p) { if (!okRate('draw', 60)) return; tone({ f: 500 + p * 0.6, type: 'sine', dur: 0.07, vol: 0.035 }); },
  puff() { tone({ f: 300, slide: 2.2, dur: 0.18, vol: 0.12 }); noise({ type: 'lowpass', f: 900, dur: 0.15, vol: 0.06 }); },
  chirp(who) {
    if (!okRate('chirp' + who, 250)) return;
    if (who === 'red') { tone({ f: 1200, slide: 1.5, dur: 0.08, vol: 0.07 }); tone({ f: 1400, slide: 1.4, dur: 0.08, vol: 0.07, t: 0.1 }); }
    else if (who === 'blue') { tone({ f: 620, slide: 0.8, dur: 0.3, vol: 0.07, type: 'triangle' }); }
    else if (who === 'yellow') { [880, 1100, 1320].forEach((f, i) => tone({ f, dur: 0.12, vol: 0.06, t: i * 0.08 })); }
    else tone({ f: 1000 + Math.random() * 600, slide: 1.3, dur: 0.08, vol: 0.05 });
  },
  note(i, v, base) { const f = nf(base || 523, i); tone({ f, type: 'triangle', dur: 0.4, vol: 0.12 * (v || 1), wet: 0.35 }); tone({ f: f * 2, dur: 0.18, vol: 0.04 * (v || 1) }); },
  fanfare() { [0, 2, 4, 5, 7].forEach((k, i) => SND.note(k, 0.9, 392 * 1.0)); [0, 4, 7, 12].forEach((k, i) => tone({ f: 523 * Math.pow(2, k / 12), dur: 0.5, vol: 0.08, t: i * 0.11, type: 'triangle', wet: 0.5 })); },
  joy() { [0, 2, 4, 7].forEach((k, i) => tone({ f: 784 * Math.pow(2, PENTA[k] / 12), dur: 0.25, vol: 0.06, t: i * 0.07, wet: 0.4 })); },
  creak(v) { if (!okRate('creak', 300)) return; tone({ f: 180, slide: 0.6, type: 'sawtooth', dur: 0.3, vol: 0.04 * v }); },
  rumble(d) { noise({ type: 'lowpass', f: 140, dur: d, vol: 0.25, at: 0.4 }); tone({ f: 55, dur: d, vol: 0.12, at: 0.5 }); },
  sparkle() { for (let i = 0; i < 5; i++) tone({ f: rr(1800, 3200), dur: 0.2, vol: 0.03, t: i * 0.05, wet: 0.6 }); },
  whoosh() { noise({ type: 'bandpass', f: 400, f2: 2400, q: 1.2, dur: 0.5, vol: 0.12 }); },
  drum(f) { tone({ f: f, slide: 0.55, dur: 0.22, vol: 0.2 }); noise({ type: 'lowpass', f: 800, dur: 0.05, vol: 0.08 }); },
  pad() { [0, 4, 7, 11, 14].forEach((k, i) => tone({ f: 196 * Math.pow(2, k / 12), dur: 3.5, vol: 0.06, at: 0.8, t: i * 0.15, wet: 0.6 })); },
  song() { [0, 4, 7, 4, 9, 7, 12].forEach((k, i) => tone({ f: 392 * Math.pow(2, k / 12), dur: 0.35, vol: 0.06, t: i * 0.16, type: 'triangle', wet: 0.4 })); },
  wobble() { if (!okRate('wobble', 90)) return; tone({ f: 1500, slide: 0.8, dur: 0.06, vol: 0.04 }); }
};

/* ---------------- 島の配置（毎回少し変わる） ---------------- */
function mkTrack(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hyp(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, cum, len: cum[cum.length - 1] };
}
function trackAt(tr, s) {
  s = clamp(s, 0, tr.len);
  let i = 1;
  while (i < tr.cum.length - 1 && tr.cum[i] < s) i++;
  const a = tr.pts[i - 1], b = tr.pts[i];
  const seg = tr.cum[i] - tr.cum[i - 1] || 1;
  const t = (s - tr.cum[i - 1]) / seg;
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), dx: (b.x - a.x) / seg, dy: (b.y - a.y) / seg };
}
function trackNearestS(tr, x, y) {
  let best = 1e9, bs = 0;
  for (let i = 1; i < tr.pts.length; i++) {
    const a = tr.pts[i - 1], b = tr.pts[i];
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((x - a.x) * dx + (y - a.y) * dy) / l2, 0, 1);
    const px = a.x + dx * t, py = a.y + dy * t;
    const d = hyp(px - x, py - y);
    if (d < best) { best = d; bs = tr.cum[i - 1] + t * Math.sqrt(l2); }
  }
  return bs;
}

function makeLayout(seed, n) {
  const R = mulberry32(seed || 1);
  const j = a => (R() - 0.5) * 2 * a;
  const mir = (n % 2) === 1;            // 島ごとに風車と水車の左右が入れかわる
  const S = mir ? -1 : 1;
  const mx = x => mir ? 720 - x : x;
  const P = (x, y) => ({ x: mx(x), y });
  const L = { seed, n, mir, S, mx, R };
  L.hue = j(14);                         // 砂と珊瑚の色あい
  L.isl = { x: 360, y: 580, rx: 330, ry: 500 };
  const bxc = 362 + j(42);               // 橋の位置（接続先）
  L.BX = mx(bxc);
  L.canal = { x0: Math.min(mx(36), mx(652)), x1: Math.max(mx(36), mx(652)), y0: 352, y1: 408, wheelX: mx(652), farX: mx(36) };
  L.bridge = { x: L.BX, y0: 352, y1: 408, hw: 28 };
  L.pulley = P(bxc - 40, 414);
  L.beach = { x: 360, y: 612, rx: 192, ry: 150 };
  L.dome = { x: mx(360 + j(26)), y: 612 + j(22), A: 44, s: 108 };
  L.tilt = { x: j(0.03), y: j(0.022) };
  L.wind = { x: mx(92), y: 600, hx: mx(150), hy: 574, hr: 34 };
  L.wind.hubX = L.wind.x; L.wind.hubY = L.wind.y - 128; L.wind.blade = 96;
  L.wheel = { x: mx(622), y: 560, r: 50, hx: mx(576), hy: 592, hr: 30 };
  L.stream = { x0: Math.min(mx(594), mx(662)), x1: Math.max(mx(594), mx(662)), y0: 404, y1: 612, bankX: mx(594) };
  L.bell = { x: mx(212 + j(6)), y: 776, hx: mx(222), hy: 750, hr: 24 };
  L.blueSleep = P(166, 808);
  L.newShell = P(262, 800);
  L.wall = { y: 834, x0: 60, x1: 660, dx: mx(360 + j(22)), dw: 34 };
  L.newBeach = { x: 352, y: 922, rx: 168, ry: 66 };
  L.nSlots = 8;
  L.row0 = P(250, 990); L.rowDx = 27 * S;
  L.slotPos = [];
  for (let i = 0; i < L.nSlots; i++) L.slotPos.push({ x: L.row0.x + L.rowDx * i, y: L.row0.y - Math.sin(i / 7 * Math.PI) * 6 });
  L.giant = P(250 + 27 * 8 + 24, 984);
  L.funnel = P(214, 976);
  L.pile = P(186, 930);
  L.fountain = P(546 + j(18), 214);
  L.dam = { x: L.BX, y: 334 };
  L.flap = { x: L.BX, y: 440 };
  L.nest = P(542, 478);
  L.front = P(330, 768);
  L.docks = {
    bridge: { bx: L.BX - 74 * S, by: 380, cx: L.BX - 74 * S, cy: 428 },
    cove: { bx: mx(178), by: 380, cx: mx(176), cy: 326, kind: 'round' },
    far: { bx: mx(70), by: 386, cx: mx(66), cy: 442, kind: 'spiral' }
  };
  L.doorN = { x: L.wall.dx, y: 812 }; L.doorS = { x: L.wall.dx, y: 860 };
  L.pierS = { x: L.BX, y: 446 }; L.pierN = { x: L.BX, y: 318 };
  // 真珠の通り道
  L.tN = mkTrack([P(522, 248), P(474, 288), P(bxc + 46, 316), { x: L.BX, y: 334 }]);
  L.tB = mkTrack([{ x: L.BX, y: 334 }, { x: L.BX, y: 440 }]);
  L.tW = mkTrack([{ x: L.BX, y: 440 }, P(bxc - 56, 452), P(232, 456), P(180, 500), P(160, 560), P(170, 640), P(206, 718), P(258, 790), { x: L.wall.dx, y: 812 }, { x: L.wall.dx, y: 862 }, P(320, 902)]);
  L.tE = mkTrack([{ x: L.BX, y: 440 }, P(bxc + 58, 452), P(494, 458), P(542, 478)]);
  L.tW_wind = trackNearestS(L.tW, L.wind.hx, L.wind.hy);
  L.tW_bell = trackNearestS(L.tW, L.bell.hx, L.bell.hy);
  L.tW_door = trackNearestS(L.tW, L.wall.dx, 818);
  // 毎回少し変わる好みと位置
  const kinds = ['round', 'spiral'];
  L.fav = { red: kinds[R() < 0.5 ? 0 : 1], blue: kinds[R() < 0.5 ? 0 : 1], yellow: kinds[R() < 0.5 ? 0 : 1] };
  L.redStart = P(430 + j(40), 560 + j(30));
  L.yellowStart = P(530 + j(10), 500 + j(10));
  L.rainbowPearl = R() < 0.18 ? 2 + Math.floor(R() * 5) : -1;  // まれに虹色の真珠
  L.shellHue = [R() * 360, R() * 360, R() * 360];
  // 静的な当たり判定
  const segs = [], circs = [];
  const seg = (ax, ay, bx, by, kind, on) => segs.push({ ax, ay, bx, by, kind, on: on || null });
  const cir = (x, y, r, kind, on) => circs.push({ x, y, r, kind, on: on || null });
  const c = L.canal, hw = L.bridge.hw, BX = L.BX;
  const sx0 = Math.min(L.stream.x0, L.stream.x1);
  // 運河の岸（橋が下りたところだけ通れる）
  seg(c.x0, c.y1, BX - hw, c.y1, 'bank'); seg(BX + hw, c.y1, c.x1, c.y1, 'bank');
  seg(c.x0, c.y0, BX - hw, c.y0, 'bank'); seg(BX + hw, c.y0, c.x1, c.y0, 'bank');
  seg(BX - hw, c.y1, BX + hw, c.y1, 'bridgeS', () => !G.M.bridge.down);
  seg(BX - hw, c.y0, BX + hw, c.y0, 'bridgeN', () => !G.M.bridge.down);
  seg(BX - hw - 3, c.y0, BX - hw - 3, c.y1, 'rail', () => G.M.bridge.down);
  seg(BX + hw + 3, c.y0, BX + hw + 3, c.y1, 'rail', () => G.M.bridge.down);
  // 水車の水路
  const bk = L.stream.bankX;
  seg(bk, c.y1, bk, 540, 'bank'); seg(bk, 640, bk, L.stream.y1, 'bank');
  seg(L.stream.x0, L.stream.y1, L.stream.x1, L.stream.y1, 'bank');
  // 珊瑚の壁と小さな扉
  const W = L.wall;
  seg(W.x0, W.y, W.dx - W.dw, W.y, 'wall'); seg(W.dx + W.dw, W.y, W.x1, W.y, 'wall');
  seg(W.dx - W.dw, W.y, W.dx + W.dw, W.y, 'door', () => !G.M.door.open);
  cir(W.dx - W.dw, W.y, 8, 'rock'); cir(W.dx + W.dw, W.y, 8, 'rock');
  cir(L.wind.hx, L.wind.hy, L.wind.hr, 'wind');
  cir(L.wind.x, L.wind.y + 4, 22, 'rock');
  cir(L.wheel.hx, L.wheel.hy, L.wheel.hr, 'wheel');
  cir(L.bell.hx, L.bell.hy, L.bell.hr, 'bell');
  cir(L.pulley.x, L.pulley.y + 4, 7, 'rock');

/* 砂浜の傾き（高さ）。中央の丘から外向きに転がり、近くの仕掛けへ向かう */
function heightAt(x, y) {
  const L = G.L;
  if (y < 352) { // 北の台地は橋の北のたもとへ
    return 0.11 * hyp(x - L.dam.x, (y - L.dam.y) * 1.2);
  }
  if (y > 834) { // 新しい砂浜は貝殻の列の始まりへ
    return 0.13 * hyp(x - L.funnel.x, (y - L.funnel.y) * 1.6);
  }
  const d = L.dome;
  const dx = x - d.x, dy = y - d.y;
  return d.A * Math.exp(-(dx * dx + dy * dy) / (2 * d.s * d.s)) + L.tilt.x * (x - 360) + L.tilt.y * (y - 612)

}

}

    if (G.M.door.open && inEll(x, y, G.L.newBeach)) return 'new';
    return null;
  }
  if (G.phase === 'parade') {

}

  if (G.M.bridge.down && Math.abs(x - L.BX) < L.bridge.hw + 4 && y > 348 && y < 412) return 'wood';

}

  for (const p of G.parts) {
    const a = 1 - p.t / p.life;
    if (p.k === 'grain') { g.fillStyle = hsl(p.hue, 60, 88, a); ell(g, p.x, p.y - p.z, p.r, p.r); g.fill(); g.fillStyle = 'rgba(255,255,255,' + a * 0.8 + ')'; ell(g, p.x - p.r * 0.3, p.y - p.z - p.r * 0.3, p.r * 0.35, p.r * 0.35); g.fill(); }
    else if (p.k === 'spark') { g.fillStyle = hsl(p.hue, 90, 85, a); const r = p.r * (0.6 + a * 0.6); g.beginPath(); g.moveTo(p.x, p.y - p.z - r * 2); g.lineTo(p.x + r * 0.6, p.y - p.z); g.lineTo(p.x, p.y - p.z + r * 2); g.lineTo(p.x - r * 0.6, p.y - p.z); g.closePath(); g.fill(); }
    else if (p.k === 'drop') { g.fillStyle = 'rgba(225,255,252,' + a + ')'; ell(g, p.x, p.y - p.z, p.r, p.r * 1.2); g.fill(); }
    else if (p.k === 'ring') { g.strokeStyle = hsl(p.hue, 90, 88, a * 0.8); g.lineWidth = 3; const r = p.r * (1 + (1 - a) * 1.6); ell(g, p.x, p.y, r, r * 0.6); g.stroke(); }
    else if (p.k === 'conf') { g.save(); g.translate(p.x, p.y - p.z); g.rotate(p.rot); g.globalAlpha = a; drawScallop(g, 0, 0, p.r, hsl(p.hue, 80, 75), 0); g.restore(); }
    else if (p.k === 'note') { g.fillStyle = hsl(p.hue, 85, 75, a); ell(g, p.x, p.y - p.z, 4.5, 3.6); g.fill(); g.strokeStyle = hsl(p.hue, 85, 60, a); g.lineWidth = 1.6; g.beginPath(); g.moveTo(p.x + 4, p.y - p.z); g.lineTo(p.x + 4, p.y - p.z - 13); g.stroke(); }
    else if (p.k === 'shellwob') { const w = Math.sin(p.t * 40) * 0.4 * a; g.globalAlpha = Math.min(1, a * 2); drawScallop(g, p.x, p.y, p.r, hsl(p.hue, 60, 85), w); g.globalAlpha = 1; }
  }
  // パレードの終わり：お気に入りを一つ選ぶ
  if (G.parade && (G.phase === 'parade' || G.phase === 'depart')) drawChoice(g);
  // お手本の手
  const dm = G.guide.demo;
  if (dm) {
    const go = dm.goal, t = dm.t;
    if (go.a) {
      const p = clamp((t - 0.35) / 1.3, 0, 1);
      const x = lerp(go.a.x, go.b.x, p), y = lerp(go.a.y, go.b.y, p);
      g.globalAlpha = Math.min(1, t * 3) * (1 - clamp((t - 2.0) / 0.4, 0, 1));
      for (let k = 0; k <= 12; k++) { const q = k / 12 * p; g.fillStyle = 'rgba(255,255,255,0.75)'; ell(g, lerp(go.a.x, go.b.x, q), lerp(go.a.y, go.b.y, q), 3.4, 3.4); g.fill(); }
      drawHand(g, x, y, p > 0 && p < 1 ? 1 : 0);
      g.globalAlpha = 1;
    } else if (go.tap) {
      const press = Math.max(0, Math.sin(t * 5));
      g.globalAlpha = Math.min(1, t * 3) * (1 - clamp((t - 2.0) / 0.4, 0, 1));
      drawHand(g, go.tap.x, go.tap.y - press * 8, press);
      g.globalAlpha = 1;
    }
  }
  g.restore();
  // 画面の切りかえ
  if (G.fade > 0) { g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = 'rgba(110,205,198,' + G.fade + ')'; g.fillRect(0, 0, VW, VH); }
}
function drawChoice(g) {
  const P = G.parade;
  const by = P.boatY;
  g.save(); g.translate(360, by); drawBoatShape(g, 1.8); g.restore();
  if (G.phase === 'depart' && P.chosen) { g.save(); g.translate(360 + 46, by - 12); drawShellIcon(g, 0, 0, P.chosen.kind, P.chosen.hue, 1); g.restore(); }
  if (!P.choice || G.phase !== 'parade') return;
  const app = ease(P.choice.t / 0.8);
  for (const [i, o] of P.choice.opts.entries()) {
    const y = o.y + Math.sin(G.t * 2 + i) * 5 + (1 - app) * 40;
    g.globalAlpha = app;
    g.fillStyle = 'rgba(220,250,255,0.45)'; g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2.5;
    ell(g, o.x, y, 42, 42); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.7)'; ell(g, o.x - 16, y - 18, 8, 5); g.fill();
    drawShellIcon(g, o.x, y + 2, o.kind, o.hue, 1.9);
    g.globalAlpha = 1;
  }
}

/* ---------------- カメラ・画面 ---------------- */
function readSA() {
  try {
    const cs = getComputedStyle(document.getElementById('sa'));
    SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0; SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) { }
}
function fitRect(r) {
  const aw = Math.max(50, VW - SA.l - SA.r - 12), ah = Math.max(50, VH - SA.t - SA.b - 12);
  const z = Math.min(aw / (r[2] - r[0]), ah / (r[3] - r[1]));
  const cx = (r[0] + r[2]) / 2, cy = (r[1] + r[3]) / 2;
  return { z, x: cx - (SA.l - SA.r) / 2 / z, y: cy - (SA.t - SA.b) / 2 / z };
}
function updateCamera(dt, snap) {
  const zo = (G.phase === 'parade' || G.phase === 'depart') ? 1 : G.phase === 'reveal' ? (G.zoomOut || 0) : 0;
  const r = ISL_RECT.map((v, i) => lerp(v, TURTLE_RECT[i], zo));
  const f = fitRect(r);
  if (snap) { cam.x = f.x; cam.y = f.y; cam.z = f.z; }
  else { const k = 1 - Math.exp(-dt * 5); cam.x = lerp(cam.x, f.x, k); cam.y = lerp(cam.y, f.y, k); cam.z = lerp(cam.z, f.z, k); }
  G.shake *= Math.exp(-dt * 7);
  if (G.shake < 0.05) G.shake = 0;
  cam.sx = (Math.random() - 0.5) * G.shake * 1.5; cam.sy = (Math.random() - 0.5) * G.shake * 1.5;
  const want = clamp(cam.z * DPR, 0.5, 2.2);
  if (cacheDirty || (G.phase !== 'reveal' && Math.abs(want - cacheScale) / cacheScale > 0.3)) buildCache(want);
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(1, window.innerWidth); VH = Math.max(1, window.innerHeight);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  readSA();
  for (const st of G.strokes.values()) if (st.pts.length > 1 && st.len >= 14 && interactive()) makeLog(st);
  G.strokes.clear();
  updateCamera(0, true);
}

/* ---------------- 旅立ち ---------------- */
function updateDepart(dt) {
  const P = G.parade;
  for (const c of G.crabs) {
    const d = c.depart; if (!d) continue;
    d.t += dt;
    if (d.t < 0) continue;
    const k = Math.min(1, d.t / 0.8);
    const i = G.crabs.indexOf(c);
    const tx = 360 - 40 + (i % 6) * 16, ty = P.boatY - 8;
    c.x = lerp(d.x0, tx, ease(k)); c.y = lerp(d.y0, ty, ease(k)); c.z = Math.sin(k * Math.PI) * 70;
    if (k >= 1) { c.y = ty; c.z = 0; c.x = tx; }
    c.moving = false;
    if (k < 1) c.expr = 'happy';
  }
}
/* ---------------- 音の連続部分 ---------------- */
function updateAudio() {
  if (!AU.ctx || AU.ctx.state !== 'running' || !AU.roll) return;
  const t = AU.ctx.currentTime, M = G.M;
  let best = 0, surf = 'sand', mass = 0;
  for (const lg of G.logs) {
    if (lg.state !== 'roll') continue;
    const s = hyp(lg.vx, lg.vy) * (lg.z > 1 ? 0.3 : 1);
    if (s * Math.sqrt(lg.m) > best * Math.sqrt(mass || 1)) { best = s; surf = lg.surf || 'sand'; mass = lg.m; }
  }
  const base = surf === 'wood' ? 650 : surf === 'tile' ? 1500 : 360;
  AU.roll.fl.frequency.setTargetAtTime(base * (0.55 + best / 320) / (0.7 + mass * 0.15), t, 0.05);
  AU.roll.fl.Q.setTargetAtTime(surf === 'wood' ? 5 : surf === 'tile' ? 2.5 : 0.8, t, 0.1);
  AU.roll.g.gain.setTargetAtTime(Math.min(0.24, best / 1100 * (0.7 + mass * 0.25)), t, 0.05);
  if (surf === 'wood' && best > 30 && okRate('plank', 6000 / best)) SND.clack(0.4, 500);
  AU.water.g.gain.setTargetAtTime(Math.min(0.12, M.wheel.w * 0.018 + M.canal.flow * 0.0015 + M.fountain.spray * 0.03), t, 0.2);
  AU.water.fl.frequency.setTargetAtTime(500 + M.wheel.w * 120, t, 0.2);
  AU.wind.g.gain.setTargetAtTime(M.wind.released ? Math.min(0.04, M.wind.w * 0.008) : 0, t, 0.3);
}

/* ---------------- ループ ---------------- */
let last = 0, rafId = 0;
function step(dt) {
  G.t += dt;
  updateLogs(dt);
  updateMech(dt);
  updatePearls(dt);
  if (G.phase === 'parade') updateParade(dt);
  updateCrabs(dt);
  if (G.phase === 'depart') updateDepart(dt);
  updateParts(dt);
  updateGuide(dt);
  updatePhase(dt);
  updateCamera(dt, false);
  updateAudio();
}
function frame(ts) {
  rafId = requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);
  step(dt);
  render();
}
function pause() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend().catch(() => {}); }
function resume() { last = 0; if (!rafId) rafId = requestAnimationFrame(frame); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume().catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else resume(); });
window.addEventListener('pagehide', pause);
window.addEventListener('pageshow', () => { if (!document.hidden) resume(); });
let rzPending = false;
function onResize() { if (rzPending) return; rzPending = true; requestAnimationFrame(() => { rzPending = false; resize(); }); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
cv.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
cv.addEventListener('lostpointercapture', onUp);
const stop = e => { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchstart', stop, { passive: false });
document.addEventListener('touchmove', stop, { passive: false });
document.addEventListener('touchend', stop, { passive: false });
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });
document.addEventListener('contextmenu', stop);
document.addEventListener('dblclick', stop);
document.addEventListener('selectstart', stop);
window.addEventListener('wheel', stop, { passive: false });

/* ---------------- はじまり ---------------- */
(function init() {
  const sv = loadSave();
  if (sv) { G.decor = sv.decor; newIsland(sv.island, sv.seed || ((Math.random() * 4294967295) >>> 0), false); }
  else newIsland(0, (Math.random() * 4294967295) >>> 0, false);
  resize();
  rafId = requestAnimationFrame(frame);
})();
// 自動テスト用の読み取り口（画面には何も出さない）
window.__yc = { G, cam, toScreen, toWorld, heightAt, step, render, SAVE_KEY };
})();
</script>
