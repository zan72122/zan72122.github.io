(()=>{
'use strict';
// ============================================================
//  utilities
// ============================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const gauss=(x,m,s)=>Math.exp(-(x-m)*(x-m)/(2*s*s));
const hyp=Math.hypot;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
const R=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[Math.min(a.length-1,Math.floor(rnd()*a.length))];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const V=(a,b)=>a+(b-a)*Math.random(); // visual-only randomness
function easeBack(t){t=clamp(t,0,1);const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}

// ============================================================
//  persistence (minimal, failure tolerant)
// ============================================================
const BIRD_TYPES=['curious','cautious','glutton'];
const SKEY='nemunemu-hitsuji-niji-v1';
function loadSave(){
  try{
    const raw=window.localStorage.getItem(SKEY);
    if(!raw||raw.length>4000)return null;
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object'||o.v!==1)return null;
    let rb=Array.isArray(o.rb)?o.rb.filter(n=>typeof n==='number'&&isFinite(n)).slice(0,24).map(n=>clamp(n,-1,1)):[];
    if(rb.length<6)rb=null;
    const fr=Array.isArray(o.fr)?o.fr.filter((s,i,a)=>BIRD_TYPES.includes(s)&&a.indexOf(s)===i).slice(0,3):[];
    const cy=(typeof o.cy==='number'&&isFinite(o.cy))?clamp(Math.floor(o.cy),0,99999):0;
    return {rb,fr,cy};
  }catch(e){return null;}
}
function writeSave(d){
  try{window.localStorage.setItem(SKEY,JSON.stringify({v:1,rb:(d.rb||[]).map(n=>Math.round(n*100)/100),fr:d.fr||[],cy:d.cy|0}));}catch(e){/* storage refused or full: keep playing */}
}

// ============================================================
//  audio (Web Audio synthesis only)
// ============================================================
const AU={ctx:null,master:null,noise:null,last:{}};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended'&&!document.hidden){AU.ctx.resume().catch(()=>{});}return;}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=new AC();AU.ctx=c;
    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-20;comp.knee.value=14;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.25;
    const m=c.createGain();m.gain.value=0.5;m.connect(comp);comp.connect(c.destination);AU.master=m;
    const len=Math.floor(c.sampleRate*0.8);const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
    const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);
    if(c.state==='suspended')c.resume().catch(()=>{});
  }catch(e){AU.ctx=null;}
}
function ok(key,gap){
  const c=AU.ctx;if(!c||c.state!=='running')return false;
  const now=c.currentTime;if(AU.last[key]!==undefined&&now-AU.last[key]<gap)return false;AU.last[key]=now;return true;
}
function envG(t,a,peak,dec){const g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);return g;}
function osc(type,f0,f1,dur,peak,when,glide){
  const c=AU.ctx,t=c.currentTime+(when||0);
  const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+(glide||dur*0.6));
  const g=envG(t,0.006,peak,dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.08);return o;
}
function noise(dur,peak,ftype,f0,f1,when,q){
  const c=AU.ctx,t=c.currentTime+(when||0);
  const s=c.createBufferSource();s.buffer=AU.noise;
  const f=c.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||0.8;
  const g=envG(t,0.03,peak,dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+0.1);
}
const PENTA=[1047,1175,1319,1568,1760,2093,2349];
const SND={
  poyon(h){ if(!ok('poyon',0.055))return; const f=230+clamp(h,0,1)*380+V(-10,10); const c=AU.ctx,t=c.currentTime;
    const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(f*1.65,t);o.frequency.exponentialRampToValueAtTime(f*0.82,t+0.08);o.frequency.exponentialRampToValueAtTime(f,t+0.2);
    const g=envG(t,0.005,0.2,0.28);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+0.4);
    osc('triangle',f*2.01,f*1.99,0.12,0.03);},
  step(h){ if(!ok('step',0.09))return; const f=420+clamp(h,0,1)*300+V(-15,15); osc('sine',f*1.3,f,0.09,0.045);},
  sparkle(){ if(!ok('sparkle',0.07))return; const a=PENTA[Math.floor(V(0,PENTA.length))]; osc('sine',a,0,0.22,0.05); osc('sine',a*1.5,0,0.18,0.03,0.05);},
  tiny(){ if(!ok('tiny',0.08))return; osc('sine',740+V(-40,40),620,0.07,0.035);},
  chirp(type){ if(!ok('chirp'+type,0.12))return;
    if(type==='curious'){osc('sine',2300,3300,0.07,0.06);osc('sine',2500,3500,0.07,0.05,0.09);}
    else if(type==='cautious'){osc('sine',1600,2200,0.11,0.06);}
    else {osc('sine',1900,2500,0.08,0.06);osc('sine',2500,1800,0.1,0.05,0.08);} },
  success(){ if(!ok('success',0.25))return; [523,659,784,1047].forEach((f,i)=>{osc('triangle',f,0,0.34,0.1,i*0.085);}); osc('sine',2093,0,0.6,0.04,0.34);},
  big(){ if(!ok('big',0.8))return; [392,523,659,784,1047,1319].forEach((f,i)=>{osc('triangle',f,0,0.5,0.09,i*0.11);osc('sine',f*2,0,0.4,0.025,i*0.11+0.03);}); noise(1.2,0.03,'bandpass',2000,6000,0.2,2);},
  bend(){ if(!ok('bend',0.15))return; osc('sine',300,180,0.22,0.08);},
  pop(){ if(!ok('pop',0.06))return; osc('sine',950,260,0.07,0.08,0,0.05);},
  munch(){ if(!ok('munch',0.12))return; osc('sine',150,90,0.09,0.12); osc('sine',140,85,0.09,0.1,0.14);},
  splash(){ if(!ok('splash',0.2))return; noise(0.45,0.09,'lowpass',2200,500); osc('sine',600,300,0.15,0.03,0.05);},
  whoosh(){ if(!ok('whoosh',0.3))return; noise(0.7,0.05,'bandpass',500,2400,0,1.5);},
  breath(inh){ if(!ok('breath',1.2))return; noise(1.4,0.016,'lowpass',inh?300:700,inh?900:250);},
  shiver(){ if(!ok('shiver',0.4))return; const c=AU.ctx,t=c.currentTime; const o=c.createOscillator();o.type='sine';o.frequency.value=330;
    const l=c.createOscillator();l.frequency.value=22;const lg=c.createGain();lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);
    const g=envG(t,0.02,0.07,0.8);o.connect(g);g.connect(AU.master);o.start(t);l.start(t);o.stop(t+0.9);l.stop(t+0.9);},
  roll(){ if(!ok('roll',1))return; [190,160,210,240].forEach((f,i)=>osc('sine',f*1.5,f,0.3,0.12,i*0.22));},
  talk(v){ if(!ok('talk',0.6))return; const c=AU.ctx,t=c.currentTime;
    const pat=v==='hiccup'?[[200,0.18],[260,0.14],[230,0.14]]:v==='sigh'?[[230,0.9]]:v==='giggle'?[[300,0.1],[340,0.1],[320,0.1],[360,0.12]]:[[210,0.25],[250,0.3],[190,0.35]];
    let w=0;for(const [f,d] of pat){const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t+w);o.frequency.linearRampToValueAtTime(f*(v==='sigh'?0.7:1.15),t+w+d);
      const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=4;bp.frequency.setValueAtTime(520,t+w);bp.frequency.linearRampToValueAtTime(900,t+w+d*0.5);bp.frequency.linearRampToValueAtTime(600,t+w+d);
      const g=envG(t+w,0.03,0.09,d);o.connect(bp);bp.connect(g);g.connect(AU.master);o.start(t+w);o.stop(t+w+d+0.1);w+=d+0.06;}
  },
  yawn(){ if(!ok('yawn',2))return; const c=AU.ctx,t=c.currentTime;const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(260,t);o.frequency.linearRampToValueAtTime(170,t+1.1);
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=3;bp.frequency.setValueAtTime(500,t);bp.frequency.linearRampToValueAtTime(1100,t+0.5);bp.frequency.linearRampToValueAtTime(400,t+1.1);
    const g=envG(t,0.15,0.08,1.0);o.connect(bp);bp.connect(g);g.connect(AU.master);o.start(t);o.stop(t+1.3);},
  chime(k){ if(!ok('chime',0.1))return; const f=PENTA[(k|0)%PENTA.length]*0.5; osc('sine',f,0,0.5,0.07); osc('sine',f*2,0,0.3,0.02,0.02);},
};
function play(name,...a){try{if(AU.ctx&&SND[name])SND[name](...a);}catch(e){}}

// ============================================================
//  balloon sprites (cached radial-gradient spheres)
// ============================================================
const SPR={};
function hexRGB(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function sprite(col,glow){
  const key=col+(glow?'*':'');let c=SPR[key];if(c)return c;
  c=document.createElement('canvas');const N=96;c.width=c.height=N;const g=c.getContext('2d');
  const base=hexRGB(col),WH=[255,255,255],dark=mixc(base,[90,60,110],0.3);
  const a0=glow?0.96:1,a1=glow?0.74:1;
  const gr=g.createRadialGradient(N*0.4,N*0.36,N*0.02,N*0.5,N*0.5,N*0.5);
  gr.addColorStop(0,rgba(mixc(base,WH,glow?0.9:0.62),a0));
  gr.addColorStop(0.42,rgba(mixc(base,WH,glow?0.42:0.14),a0));
  gr.addColorStop(0.84,rgba(base,a1));
  gr.addColorStop(1,rgba(dark,a1));
  g.fillStyle=gr;g.beginPath();g.arc(N/2,N/2,N/2-0.5,0,TAU);g.fill();
  const gb=g.createRadialGradient(N*0.58,N*0.84,1,N*0.58,N*0.84,N*0.32);
  gb.addColorStop(0,rgba(mixc(base,WH,0.75),glow?0.6:0.42));gb.addColorStop(1,rgba(base,0));
  g.fillStyle=gb;g.beginPath();g.arc(N/2,N/2,N/2-1,0,TAU);g.fill();
  if(glow){const gi=g.createRadialGradient(N/2,N/2,N*0.05,N/2,N/2,N*0.32);gi.addColorStop(0,'rgba(255,255,240,0.55)');gi.addColorStop(1,'rgba(255,255,240,0)');g.fillStyle=gi;g.beginPath();g.arc(N/2,N/2,N*0.34,0,TAU);g.fill();}
  g.fillStyle='rgba(255,255,255,0.88)';g.beginPath();g.ellipse(N*0.34,N*0.26,N*0.13,N*0.065,-0.65,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,0.6)';g.beginPath();g.arc(N*0.53,N*0.19,N*0.032,0,TAU);g.fill();
  SPR[key]=c;return c;
}
function ball(col,x,y,rx,ry,rot,a,glow){
  const s=sprite(col,glow);
  if(a!==undefined&&a<1){ctx.globalAlpha=a;}
  if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(s,-rx,-ry,rx*2,ry*2);ctx.restore();}
  else ctx.drawImage(s,x-rx,y-ry,rx*2,ry*2);
  if(a!==undefined&&a<1)ctx.globalAlpha=1;
}
function shadow(x,y,rx,ry,a){ctx.fillStyle='rgba(70,60,110,'+(a||0.14)+')';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function tube(xs,ys,n,r0,r1,col,a,glow){
  // chain of twisted balloon segments along a polyline
  let acc=0;const seg=Math.max(8,((r0+r1)/2)*1.5);let lastX=xs[0],lastY=ys[0];
  const pts=[[xs[0],ys[0],0]];let tot=0;
  for(let i=1;i<n;i++){tot+=hyp(xs[i]-xs[i-1],ys[i]-ys[i-1]);pts.push([xs[i],ys[i],tot]);}
  if(tot<1)return;
  const cnt=Math.max(1,Math.round(tot/seg));const sl=tot/cnt;let j=0;
  for(let k=0;k<cnt;k++){
    const sm=(k+0.5)*sl;while(j<pts.length-2&&pts[j+1][2]<sm)j++;
    const p=pts[j],q=pts[j+1];const u=(sm-p[2])/((q[2]-p[2])||1);
    const x=lerp(p[0],q[0],u),y=lerp(p[1],q[1],u);const ang=Math.atan2(q[1]-p[1],q[0]-p[0]);
    const r=lerp(r0,r1,k/Math.max(1,cnt-1));
    ball(col,x,y,sl*0.62,r,ang,a,glow);
  }
}

// ============================================================
//  world geometry
// ============================================================
const GROUND=1050;
const BACK_CP=[[300,885],[355,862],[415,825],[480,752],[545,668],[600,628],[655,640],[720,682],[790,704],[860,700],[930,672],[990,632],[1045,606],[1092,628],[1122,690]];
const NB=120;
const BRX=new Float32Array(NB),BRY=new Float32Array(NB);
(function(){
  const P=BACK_CP,dense=[];
  for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    for(let k=0;k<24;k++){const t=k/24,t2=t*t,t3=t2*t;const f=j=>0.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);dense.push([f(0),f(1)]);}}
  dense.push(P[P.length-1]);
  const cum=[0];for(let i=1;i<dense.length;i++)cum.push(cum[i-1]+hyp(dense[i][0]-dense[i-1][0],dense[i][1]-dense[i-1][1]));
  const L=cum[cum.length-1];let j=0;
  for(let i=0;i<NB;i++){const s=L*i/(NB-1);while(j<cum.length-2&&cum[j+1]<s)j++;const u=(s-cum[j])/((cum[j+1]-cum[j])||1);BRX[i]=lerp(dense[j][0],dense[j+1][0],u);BRY[i]=lerp(dense[j][1],dense[j+1][1],u);}
})();
function backTAtX(x){let best=0,bd=1e9;for(let i=0;i<NB;i++){const d=Math.abs(BRX[i]-x);if(d<bd){bd=d;best=i;}}return best/(NB-1);}

function genBack(){
  const s=SEC.back,B=S.breath,b=B.b;

  const tm=S.time;
  for(let i=0;i<NB;i++){
    const x=BRX[i];let y=BRY[i];
    y-=hump*gauss(x,600,95);
    y-=val*gauss(x,300,90);
    for(const c of S.curls){const u=(x-c.x)/c.w;if(u>-1&&u<1)y-=c.h*(1+c.wob*0.22)*Math.sqrt(1-u*u);}
    if(S.shiverA>0)y+=S.shiverA*9*Math.sin(x*0.09+tm*38)*gauss(x,1010,110);
    if(S.giggle>0)y+=S.giggle*6*Math.sin(x*0.05+tm*19);

}

  for(let i=0;i<n;i++){const u=i/(n-1);s.bx[i]=lerp(ax,bx,u);s.by[i]=lerp(ay,by,u)-Math.sin(u*Math.PI)*8;}

let route=[],routeLen=1;
function buildRoute(){
  const r=[];let off=0;
  const add=(s,tmax)=>{r.push({sec:s,id:s.id,tmax,off,len:s.len});off+=s.len*tmax;};
  if(SEC.bridgeC.on){add(SEC.cloud,1);add(SEC.bridgeC,1);}
  add(SEC.back,1);
  if(SEC.ear.on)add(SEC.ear,1);
  if(SEC.perch.on)add(SEC.perch,1);
  if(SEC.road.on&&S.roadShown>0.02)add(SEC.road,clamp(S.roadShown,0,1));
  if(SEC.castle.on)add(SEC.castle,1);
  route=r;routeLen=Math.max(1,off);
}
function rEntry(id){for(const e of route)if(e.id===id)return e;return null;}
function toS(id,t){const e=rEntry(id);if(!e)return null;return e.off+clamp(t,0,e.tmax)*e.len;}
function fromS(s){s=clamp(s,0,routeLen);for(const e of route){if(s<=e.off+e.len*e.tmax+1e-6)return {id:e.id,t:clamp((s-e.off)/e.len,0,e.tmax)};}const e=route[route.length-1];return {id:e.id,t:e.tmax};}
function ptAt(id,t,out){const s=SEC[id];const f=clamp(t,0,1)*(s.n-1);const i=Math.min(s.n-2,Math.floor(f));const u=f-i;
  out=out||{};out.x=lerp(s.px[i],s.px[i+1],u);out.y=lerp(s.py[i],s.py[i+1],u);out.nx=lerp(s.nx[i],s.nx[i+1],u);out.ny=lerp(s.ny[i],s.ny[i+1],u);out.d=lerp(s.d[i],s.d[i+1],u);return out;}
function project(wx,wy){
  let best=1e18,be=null,bi=0;
  for(const e of route){const s=e.sec,m=Math.floor(e.tmax*(s.n-1)+1e-6);for(let i=0;i<=m;i++){const dx=s.px[i]-wx,dy=s.py[i]-wy;const dd=dx*dx+dy*dy;if(dd<best){best=dd;be=e;bi=i;}}}
  if(!be)return null;const s=be.sec;let bt=bi/(s.n-1),bd=best;
  for(const j of [bi-1,bi]){if(j<0||j+1>s.n-1)continue;const ax=s.px[j],ay=s.py[j],vx=s.px[j+1]-ax,vy=s.py[j+1]-ay;const L2=vx*vx+vy*vy||1;let u=clamp(((wx-ax)*vx+(wy-ay)*vy)/L2,0,1);const qx=ax+vx*u-wx,qy=ay+vy*u-wy;const dd=qx*qx+qy*qy;if(dd<bd){bd=dd;bt=(j+u)/(s.n-1);}}
  return {id:s.id,t:Math.min(bt,be.tmax),dist:Math.sqrt(bd)};
}
// projection onto any section (even not in route) for presses
function projectSec(id,wx,wy){const s=SEC[id];let best=1e18,bi=0;for(let i=0;i<s.n;i++){const dx=s.px[i]-wx,dy=s.py[i]-wy;const dd=dx*dx+dy*dy;if(dd<best){best=dd;bi=i;}}return {id,t:bi/(s.n-1),dist:Math.sqrt(best)};}

const BUCK=4;

  const nb=6,bw=3.3;

      for(let i=1;i<F.length;i++){const a=F[i-1],b=F[i];if(!ok[i]||!ok[i-1]||a.run!==b.run||a.sec!==b.sec||Math.abs(xs[i]-xs[i-1])+Math.abs(ys[i]-ys[i-1])>40){pen=false;continue;}

    case 'fly':{const t=b.tgtFn?b.tgtFn():b.tgt;tx=t.x;ty=t.y;speed=460;
      if(hyp(tx-b.x,ty-b.y)<14){const cb=b.cb;b.cb=null;b.tgtFn=null;b.state=b.next||'follow';b.next=null;if(cb)cb(b);}break;}
    case 'ride':{if(b.ride&&!b.ride.dead){tx=b.ride.x;ty=b.ride.y+b.ride.r*0.45;snap=true;b.tilt=Math.sin(S.time*3)*0.2;}else{b.state=b.joined?'follow':'home';b.ride=null;b.tilt=0;}break;}
    case 'toSlide':{const sl=b.slide;if(!sl){b.state=b.prevState||'follow';break;}b.wait-=dt;const p=slidePos(sl,0);
      if(b.wait>0){tx=b.x;ty=b.y;ground=b.ground;break;}tx=p.x;ty=p.y-10;speed=520;if(hyp(tx-b.x,ty-b.y)<16){b.state='slide';b.slideK=0;play('chirp',b.type);}break;}
    case 'slide':{const sl=b.slide;const L=sl.pts.length;b.slideK+=dt*Math.max(10,L/1.5);const p=slidePos(sl,b.slideK);tx=p.x;ty=p.y-6;snap=true;b.tilt=0.5*b.face;
      if(Math.random()<0.4)part({k:'spark',x:p.x,y:p.y,vx:V(-30,30),vy:V(-60,-10),life:0.5,size:6,col:sl.rainbow?'#fff2a0':RAINBOW[Math.floor(V(0,6))],rot:0});

      if(hyp(tx-b.x,ty-b.y)<40){b.face=1;b.beak=0.5;if(Math.random()<0.5)windP(b.x+20,b.y-20,1);fb.windOn=true;}break;}
    case 'lift':{const c=S.castle;if(!c){b.state='follow';break;}const a=ceilAnchor(b.anchor);tx=a.x;ty=a.y+34;speed=420;b.look.x=a.x;b.look.y=a.y-40;break;}
    case 'away':{tx=b.x+20;ty=-1400;speed=380;break;}
    case 'arrive':{const c=S.castle;if(!c){b.state='away';break;}const r=b.ride;if(r){tx=r.x;ty=r.y+r.r*0.45;snap=true;}break;}
    case 'wait':{const p=ptAt('castle',0.74,{});tx=p.x;ty=p.y;ground=true;b.glow=1;if(Math.random()<dt*0.7){b.hopV=380;play('chirp',b.type);}
      if(P.sec==='castle'&&Math.abs(P.t-0.74)<0.07)castleJoin(b);break;}
  }
  if(snap){b.x=tx;b.y=ty;b.ground=false;}
  else{const dx=tx-b.x,dy=ty-b.y,d=hyp(dx,dy);if(d>0.3){const sp=Math.min(d*7,speed);b.x+=dx/d*sp*dt;b.y+=dy/d*sp*dt;if(Math.abs(dx)>3)b.face=dx>0?1:-1;}
    b.ground=ground&&d<24;}

function handPos(){const r=P.reach;return {x:P.x+P.face*(10+r*4),y:P.y-58-r*54};}
function setHold(type,src){
  if(S.hold&&S.hold.src){S.hold.src.state='on';S.hold.src.regrow=0;}
  S.hold={type,src};

}
function releaseHold(restore){const h=S.hold;if(!h)return;if(h.src){h.src.state='regrow';h.src.regrow=restore?0.01:10;}S.hold=null;}
function updItems(dt){
  const hp=handPos();
  // berries
  let wantReach=0;
  if(S.phase==='meadow'){
    for(const b of S.berries){
      b.bendV+=(-60*b.bend-5*b.bendV)*dt;b.bend+=b.bendV*dt;
      if(b.state==='regrow'){b.regrow-=dt;if(b.regrow<=0){b.state='on';sparkle(b.x,b.y,5,'#ff8fab');}continue;}
      if(b.state!=='on')continue;
      const dx=b.x-P.x;
      if(P.sec==='back'&&Math.abs(dx)<120){const prox=1-Math.abs(dx)/120;wantReach=Math.max(wantReach,prox);
        // branch leans toward the princess as she gets close
        const vd=(P.y-112)-b.y;b.lean=clamp(1-vd/200,0,1)*prox;
        if(hyp(b.x-hp.x,b.y-hp.y)<46&&!S.feed&&S.userActed&&!S.demo.on){pickBerry(b);}
      } else b.lean=0;
    }
    const o=S.orange;o.bendV+=(-60*o.bend-5*o.bendV)*dt;o.bend+=o.bendV*dt;
    if(o.state==='regrow'){o.regrow-=dt;if(o.regrow<=0)o.state='on';}
    else if(o.state==='on'&&P.sec==='perch'&&Math.abs(o.x-P.x)<90){wantReach=Math.max(wantReach,1-Math.abs(o.x-P.x)/90);if(hyp(o.x-hp.x,o.y-hp.y)<50){setHold('orange',o);o.state='held';sparkle(o.x,o.y,10,'#ffbe76');play('success');P.joy=1;}}
    const g=S.grape;g.wob*=0.9;
    if(g.state==='regrow'){g.regrow-=dt;if(g.regrow<=0)g.state='on';}
    else if(g.state==='on'&&P.sec==='cloud'&&Math.abs(P.t-g.t)*SEC.cloud.len<32){setHold('grape',g);g.state='held';const p=ptAt('cloud',g.t,{});sparkle(p.x,p.y-20,10,'#c8a8ff');play('success');P.joy=1;}
  }
  if(S.hold)wantReach=Math.max(wantReach,0.55);
  P.reach=lerp(P.reach,wantReach,Math.min(1,dt*6));
  // feathers
  for(const f of S.featherItems){
    f.wob*=0.9;
    if(f.state==='fall'){f.vy=Math.min(f.vy+120*dt,90);f.y+=f.vy*dt;f.x+=Math.sin(S.time*3+f.ph)*40*dt;const p=ptAt(f.sec,f.t,{});if(f.y>=p.y-8){f.state='on';puffs(p.x,p.y,3);play('tiny');}continue;}

      if(f.kind==='r'){S.slideLeft+=50;S.windRainbow=true;}else S.slideLeft+=20;
      const p=ptAt(f.sec,f.t,{});sparkle(p.x,p.y-30,f.kind==='r'?18:10,f.kind==='r'?null:'#ffffff');play('whoosh');play('success');P.joy=1;
      for(let i=0;i<5;i++)windP(p.x+V(-30,30),p.y-V(10,60),P.face);}
  }

function buildCeilProfile(){
  const F=S.fps;const bins=new Array(24).fill(null).map(()=>({sx:0,sy:0,n:0,w:0}));
  const o={};let minX=1e9,maxX=-1e9;const pos=[];
  for(const fp of F){const s=SEC[fp.sec];if(!s)continue;ptAt(fp.sec,fp.t,o);pos.push([o.x,o.y,fp.w]);if(o.x<minX)minX=o.x;if(o.x>maxX)maxX=o.x;}
  if(pos.length<4){for(let i=0;i<24;i++){bins[i].sx=lerp(320,1100,i/23);bins[i].sy=700;bins[i].n=0;}return {bins,rb:new Array(24).fill(0).map((_,i)=>Math.sin(i/23*Math.PI)*0.3)};}
  if(maxX-minX<120){const c=(minX+maxX)/2;minX=c-60;maxX=c+60;}
  for(const p of pos){const i=clamp(Math.floor((p[0]-minX)/(maxX-minX)*23.999),0,23);bins[i].sx+=p[0];bins[i].sy+=p[1];bins[i].n++;bins[i].w+=p[2];}
  let my=0,mn=0;for(const b of bins)if(b.n){b.sx/=b.n;b.sy/=b.n;b.w/=b.n;my+=b.sy;mn++;}my/=mn||1;
  // fill gaps
  for(let i=0;i<24;i++)if(!bins[i].n){let l=i-1,r=i+1;while(l>=0&&!bins[l].n)l--;while(r<24&&!bins[r].n)r++;
    const L=l>=0?bins[l]:null,Rb=r<24?bins[r]:null;const a=L&&Rb?(i-l)/(r-l):0;
    bins[i].sx=L&&Rb?lerp(L.sx,Rb.sx,a):(L||Rb).sx;bins[i].sy=L&&Rb?lerp(L.sy,Rb.sy,a):(L||Rb).sy;bins[i].w=0.3;bins[i].gap=true;}
  let rng=0;for(const b of bins)rng=Math.max(rng,Math.abs(b.sy-my));rng=Math.max(rng,40);

  return {bins,rb};
}

function goalNow(){
  const ph=S.phase;
  const routePt=(x)=>{const t=backTAtX(x);return {id:'back',t};};
  if(ph==='meadow'){
    const low=S.berries.find(b=>b.tier===0&&b.state==='on')||S.berries.find(b=>b.state==='on');
    if(!S.disc.slope&&low)return {x:low.x,y:low.y,r:{id:'back',t:backTAtX(low.x)},obj:low,kind:'berry'};
    if(!S.disc.fruit){if(S.hold&&S.hold.type)return {x:mouthPos().x,y:mouthPos().y,r:{id:'back',t:0.97},kind:'mouth'};if(low)return {x:low.x,y:low.y,r:{id:'back',t:backTAtX(low.x)},obj:low,kind:'berry'};}
    if(!S.bridge.perm){const p=ptAt('back',0,{});return {x:p.x-30,y:p.y+20,r:{id:'back',t:0},kind:'valley'};}
    const rc=S.curls.find(c=>c.role==='roll');
    if(!S.roll.done&&rc)return {x:rc.x,y:SEC.back.py[Math.round(backTAtX(rc.x)*(NB-1))]-10,r:{id:'back',t:backTAtX(rc.x)},obj:rc,kind:'curl'};
    const third=BIRDS.find(b=>!b.joined&&b.home&&b.home.kind==='sec'&&b.home.sec!=='back');
    if(third&&third.state==='home')return {x:third.x,y:third.y,r:{id:third.home.sec,t:third.home.t},obj:third,kind:'bird'};
    const fi=S.featherItems.find(f=>f.state==='on'&&SEC[f.sec].on);
    if(fi&&S.feathers.length<2){const p=ptAt(fi.sec,fi.t,{});return {x:p.x,y:p.y-10,r:{id:fi.sec,t:fi.t},obj:fi,kind:'feather'};}
    const sc=S.curls.find(c=>c.role==='shiver'&&!c.done);
    if(sc&&S.feathers.length<2)return {x:sc.x,y:SEC.back.py[Math.round(backTAtX(sc.x)*(NB-1))]-10,r:{id:'back',t:backTAtX(sc.x)},obj:sc,kind:'curl'};
    if(joinedCount()<2){const fb=BIRDS.find(b=>!b.joined&&b.state==='home');if(fb)return {x:fb.x,y:fb.y,r:null,obj:fb,kind:'bird'};}
    // wake: the nearest curl already explored
    let best=null,bd=1e9;for(const c of S.curls){const d=Math.abs(c.x-P.x)+(c.done?0:2000);if(d<bd){bd=d;best=c;}}
    if(best)return {x:best.x,y:SEC.back.py[Math.round(backTAtX(best.x)*(NB-1))]-10,r:{id:'back',t:backTAtX(best.x)},obj:best,kind:'curl'};
  } else if(ph==='sea'){
    const tied=S.sea.fruitB.find(f=>f.state==='tied');
    let best=null,bd=1e9;for(const d of S.sea.drops)if(d.state==='sit'){const dd=Math.abs(d.x-P.x);if(dd<bd){bd=dd;best=d;}}
    if(tied&&(!best||Math.random()<0))return {x:tied.x,y:tied.y,r:null,obj:tied,kind:'fruitB'};
    if(best)return {x:best.x,y:best.y,r:{id:'back',t:best.t},obj:best,kind:'drop'};
    if(tied)return {x:tied.x,y:tied.y,r:null,obj:tied,kind:'fruitB'};
    if(S.roadUnits>=ROAD_N&&SEC.castle.on){const p=ptAt('castle',0.2,{});return {x:p.x,y:p.y,r:{id:'castle',t:0.2},kind:'castle'};}
    if(S.roadUnits>0&&SEC.road.on){const p=ptAt('road',S.roadShown,{});return {x:p.x,y:p.y,r:{id:'road',t:S.roadShown*0.98},kind:'road'};}
  } else if(ph==='castle'){
    const c=S.castle;const wb=BIRDS.find(b=>b.state==='wait');
    if(wb)return {x:wb.x,y:wb.y,r:{id:'castle',t:0.74},obj:wb,kind:'bird'};
    if(S.hold){const b=BIRDS.find(b=>b.joined);if(b)return {x:b.x,y:b.y,r:null,obj:b,kind:'bird'};}
    if(c.slideReady)return {x:1535,y:-170,r:{id:'castle',t:0.99},kind:'slide'};
    const f=c.bowl.find(f=>f.state==='on');if(f){const p=ptAt('castle',f.t,{});return {x:p.x,y:p.y-14,r:{id:'castle',t:f.t},obj:f,kind:'bowl'};}
  }
  return null;
}
function isGoal(o){return S.goal&&S.goal.obj===o;}
function updGuide(dt){
  S.goalT=(S.goalT||0)-dt;if(S.goalT<=0){S.goal=goalNow();S.goalT=0.25;}
  S.goalPulse=Math.max(0,S.goalPulse-dt*0.6);
  if(S.attn){S.attn.t-=dt;if(S.attn.t<=0)S.attn=null;}
  // single hand demonstration, only if the player never dragged
  const d=S.demo;
  if(!d.done&&!d.on&&!S.everDragged&&S.idle>7&&S.phase==='meadow'){d.on=true;d.t=0;d.from=toS(P.sec,P.t);}
  if(d.on){d.t+=dt;const g=S.goal;const sg=g&&g.r?toS(g.r.id,g.r.t):null;const dir=sg!==null&&sg<d.from?-1:1;
    const u=smooth((d.t-0.5)/1.6);const s=clamp(d.from+dir*u*170,0,routeLen);const p=surfaceAtS(s);d.x=p.x;d.y=p.y;
    if(d.t>0.5&&d.t<2.1){pressSec(p.id,p.t,1200,14);P.tgt={id:p.id,t:p.t};if(Math.random()<dt*6)play('step',0.5);}
    if(d.t>2.8){d.on=false;d.done=true;}}
  // gentle environmental nudges after a long quiet moment
  S.nudgeT-=dt;
  if(S.idle>10&&S.nudgeT<=0&&S.goal){S.nudgeT=6;S.goalPulse=1;
    const g=S.goal;let bb=null,bd=1e9;for(const b of BIRDS){if(b.state!=='home'&&b.state!=='follow')continue;const dd=hyp(b.x-g.x,b.y-g.y);if(dd<bd){bd=dd;bb=b;}}
    if(bb){bb.look.x=g.x;bb.look.y=g.y;bb.hopV=420;bb.beak=0.6;play('chirp',bb.type);bb.face=g.x>bb.x?1:-1;}
    if(g.obj&&g.obj.bendV!==undefined)g.obj.bendV+=60;
    if(g.obj&&g.obj.wobV!==undefined)g.obj.wobV+=6;
    sparkle(g.x,g.y,6,'#fff6b0',120);}
}

function updPrincess(dt){
  P.hopV-=1600*dt;P.hop+=P.hopV*dt;if(P.hop<0){if(P.hopV<-300)impulseSec(P.sec,P.t,Math.min(900,-P.hopV),14);P.hop=0;P.hopV=0;}
  P.joy=Math.max(0,P.joy-dt*0.8);
  P.blinkT-=dt;if(P.blinkT<=0){P.blink=0.15;P.blinkT=V(2.5,5);}P.blink=Math.max(0,P.blink-dt);
  if(P.sliding){updSlideHome(dt);return;}
  if(!rEntry(P.sec)){const pr=project(P.x,P.y);if(pr){P.sec=pr.id;P.t=pr.t;}}
  const sCur=toS(P.sec,P.t);
  if(input.mode==='drag'){const pr=project(input.wx,input.wy);
    if(pr&&pr.dist<420){let st=toS(pr.id,pr.t);const df=st-sCur;if(Math.abs(df)>30)st-=Math.sign(df)*16;else st=sCur;P.tgt=fromS(st);}}
  let sT=sCur;if(P.tgt){const v=toS(P.tgt.id,P.tgt.t);if(v===null)P.tgt=null;else sT=v;}
  const df=sT-sCur;let v=clamp(df*5.5,-470,470);if(Math.abs(df)<1.5){v=0;if(input.mode!=='drag')P.tgt=null;}
  P.spd=lerp(P.spd,v,Math.min(1,dt*12));
  const sN=clamp(sCur+P.spd*dt,0,routeLen);const q=fromS(sN);const prev=P.sec;P.sec=q.id;P.t=q.t;
  const moved=sN-sCur;
  if(Math.abs(P.spd)>25)P.face=P.spd>0?1:-1;
  const p=ptAt(P.sec,P.t,{});P.x=p.x;P.y=p.y;P.nx=p.nx;P.ny=p.ny;
  P.walk+=Math.abs(moved)*0.09;
  pressSec(P.sec,P.t,360+Math.min(600,Math.abs(P.spd)*0.6),12);
  if(Math.abs(moved)>0.05){
    S.distAcc+=Math.abs(moved);S.streak+=Math.abs(moved);S.stillT=0;S.runOpen=true;
    S.stepAcc+=Math.abs(moved);if(S.stepAcc>46){S.stepAcc=0;play('step',clamp((900-P.y)/450,0,1));if(Math.random()<0.5)sparkle(P.x,P.y-4,1,null,60);}
    while(S.distAcc>=8){S.distAcc-=8;addFp();}
  } else {S.stillT+=dt;if(S.stillT>0.9){S.streak=Math.max(0,S.streak-dt*600);if(S.runOpen){S.runOpen=false;S.run++;if(S.curSlide&&S.curSlide.open)closeSlide();}}}
  if(P.sec!==prev)onEnterSec(P.sec,prev);
  // tickle by walking back and forth over a curl
  if(P.sec==='back'&&S.phase==='meadow'&&Math.abs(moved)>0.05){for(const c of S.curls){if(Math.abs(P.x-c.x)<c.w+10){const dir=Math.sign(moved);let amt=Math.abs(moved);if(c.lastDir&&dir!==c.lastDir)amt+=26;c.lastDir=dir;tickle(c,amt);}}}
  // look
  if(S.attn&&S.attn.t>0){P.look.x=S.attn.x;P.look.y=S.attn.y;}
  else if(S.hold){P.look.x=handPos().x;P.look.y=handPos().y;}
  else if(S.goal&&S.idle>2){P.look.x=S.goal.x;P.look.y=S.goal.y;}
  else {P.look.x=P.x+P.face*100;P.look.y=P.y-80;}
  // edge lean (stopping at an unconnected edge)
  P.lean=lerp(P.lean,(P.sec==='back'&&P.t<0.01&&!SEC.bridgeC.on&&input.mode==='drag')?1:0,dt*6);
}
function onEnterSec(id,prev){
  if(id==='bridgeC'||id==='cloud'){if(!S.bridge.perm){S.bridge.perm=true;S.cloudCrossed=true;disc('valley');play('success');sparkle(P.x,P.y-20,14,'#ffffff');puffs(P.x,P.y,6);}}
  if(id==='ear'&&!S.disc.earWalk){disc('earWalk');play('success');}
  if(id==='perch'){play('chirp','cautious');}
  if(id==='road'&&prev!=='road'){play('chime',2);}
}

const input={id:null,mode:'none',sx:0,sy:0,wx:0,wy:0,lx:0,ly:0,downX:0,downY:0,moved:0,lastProjS:null,pAcc:0};
let camSnap=true;
const cam={x:500,y:700,s:1};
function focusX(){return SAFE.l+(W-SAFE.l-SAFE.r)/2;}
function focusY(){return SAFE.t+(H-SAFE.t-SAFE.b)/2;}
function s2w(x,y){return {x:(x-focusX())/cam.s+cam.x,y:(y-focusY())/cam.s+cam.y};}
function w2s(x,y){return {x:(x-cam.x)*cam.s+focusX(),y:(y-cam.y)*cam.s+focusY()};}
function hitTest(w){
  const tol=20/cam.s;const ph=S.phase;
  const near=(x,y,r)=>hyp(w.x-x,w.y-y)<r+tol;
  if(S.castle&&ph==='castle'){const h=castleHit(w,tol);if(h)return h;}
  for(const fb of S.sea.fruitB)if(fb.state==='tied'&&near(fb.x,fb.y,36))return {kind:'fruitB',o:fb};
  // touching the princess always means "walk", never a bird behind her
  if(!P.sliding&&hyp(w.x-P.x,w.y-(P.y-50))<46+tol){const pr=project(P.x,P.y);if(pr)return {kind:'path',pr,onP:true};}
  for(const b of BIRDS){if(b.state==='away')continue;if(near(b.x,b.y-24,30))return {kind:'bird',o:b};}
  if(ph==='meadow'){
    for(const b of S.berries)if(b.state==='on'&&near(b.x,b.y,24))return {kind:'berry',o:b};
    if(S.orange.state==='on'&&near(S.orange.x,S.orange.y,26))return {kind:'berry',o:S.orange,orange:true};
    if(S.memento&&near(MEM.x,MEM.y-30,50))return {kind:'memento'};
  }
  for(const f of S.featherItems)if(f.state==='on'&&SEC[f.sec].on){const p=ptAt(f.sec,f.t,{});if(near(p.x,p.y-14,26))return {kind:'pickup',o:f,r:{id:f.sec,t:f.t}};}
  if(ph==='meadow'&&S.grape.state==='on'&&SEC.cloud.on){const p=ptAt('cloud',S.grape.t,{});if(near(p.x,p.y-18,24))return {kind:'pickup',o:S.grape,r:{id:'cloud',t:S.grape.t}};}
  for(const d of S.sea.drops)if(d.state==='sit'&&near(d.x,d.y,22))return {kind:'pickup',o:d,r:{id:'back',t:d.t}};
  if(ph==='meadow')for(const c of S.curls){const t=backTAtX(c.x);const y=SEC.back.py[Math.round(t*(NB-1))];if(near(c.x,y+c.w*0.6,c.w))return {kind:'curl',o:c};}
  const pr=project(w.x,w.y);
  if(pr&&pr.dist<44+tol)return {kind:'path',pr};
  // unconnected bridges / ear / cloud: local poke only
  for(const id of ['cloud','ear','perch']){const s=SEC[id];if(id==='cloud'||(id==='ear')){const q=projectSec(id,w.x,w.y);if(q.dist<40+tol)return {kind:'sec',pr:q};}}
  const hd=xf(1065,712);if(hyp(w.x-hd[0],w.y-hd[1])<120)return {kind:'head'};
  if(w.x>270&&w.x<1160&&w.y<1010+SH.y&&w.y>SEC.back.py[Math.round(backTAtX(clamp(w.x,300,1122))*(NB-1))])return {kind:'body'};
  return {kind:'bg'};
}
function onDown(e){

  if(S.demo.on){S.demo.on=false;S.demo.done=true;}
  const w=s2w(e.clientX,e.clientY);
  if(input.id!==null&&input.id!==e.pointerId){secondaryTap(w);return;}
  input.id=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}
  input.sx=e.clientX;input.sy=e.clientY;input.downX=e.clientX;input.downY=e.clientY;input.wx=w.x;input.wy=w.y;input.lx=w.x;input.ly=w.y;input.moved=0;input.pAcc=0;
  S.attn={x:w.x,y:w.y,t:1.4};

    case 'berry':if(h.orange){const o=h.o;const hp=handPos();if(P.sec==='perch'&&hyp(o.x-hp.x,o.y-hp.y)<80){setHold('orange',o);o.state='held';play('success');sparkle(o.x,o.y,10,'#ffbe76');}else{o.bendV+=140;play('bend');}}else tapBerry(h.o);input.mode='pending';break;
    case 'fruitB':releaseFruitB(h.o);input.mode='pending';break;
    case 'decor':castleTap(h,w);input.mode='pending';break;
    case 'memento':play('chirp','curious');sparkle(MEM.x,MEM.y-30,10);MEM.hop=1;input.mode='pending';break;
    case 'pickup':{h.o.wob=1;play('tiny');sparkle(w.x,w.y,3);const pr=project(w.x,w.y);if(pr&&pr.dist<90){P.tgt={id:pr.id,t:pr.t};}input.mode='drag';S.everDragged=true;break;}
    case 'curl':{const c=h.o;c.wobV+=10;tickle(c,40);const t=backTAtX(c.x);impulseSec('back',t,900,22);play('poyon',clamp((900-SEC.back.py[Math.round(t*(NB-1))])/400,0,1));sparkle(w.x,w.y,5);
      const pr=project(w.x,w.y);if(pr&&pr.dist<120)P.tgt={id:pr.id,t:pr.t};input.mode='drag';S.everDragged=true;break;}
    case 'path':{const pr=h.pr;impulseSec(pr.id,pr.t,1100,16);const p=ptAt(pr.id,pr.t,{});play('poyon',clamp((900-p.y)/500,0,1));sparkle(p.x,p.y-6,7);ring(p.x,p.y,'#ffffff',26);
      P.tgt={id:pr.id,t:pr.t};input.mode='drag';S.everDragged=true;input.lastProjS=toS(pr.id,pr.t);break;}
    case 'sec':{const pr=h.pr;impulseSec(pr.id,pr.t,700,16);const p=ptAt(pr.id,pr.t,{});play('poyon',0.15);puffs(p.x,p.y,3);input.mode='pending';break;}
    case 'head':{S.eye.tw=1;S.mouth.open=Math.max(S.mouth.open,0.25);play('poyon',0.1);const n=xf(1172,734);puffs(n[0],n[1],2);
      if(S.hold){P.tgt={id:'back',t:0.97};input.mode='drag';}else input.mode='pending';break;}
    case 'body':{const t=backTAtX(clamp(w.x,300,1122));impulseSec('back',t,500,40);play('poyon',0.05);puffs(w.x,w.y,2,'#fff6e6');input.mode='pending';break;}
    default:{ring(w.x,w.y,'#ffffff',18);play('tiny');input.mode='pending';break;}
  }
}
function secondaryTap(w){

  if(h.kind==='bird'){h.o.hopV=380;play('chirp',h.o.type);}
  else if(h.kind==='path'){impulseSec(h.pr.id,h.pr.t,700,16);play('poyon',0.4);}
  else if(h.kind==='decor'){castleTap(h,w);}

}
function onMove(e){
  if(e.pointerId!==input.id)return;e.preventDefault();S.idle=0;
  const w=s2w(e.clientX,e.clientY);const dx=w.x-input.lx,dy=w.y-input.ly;const dm=hyp(dx,dy);
  input.moved+=hyp(e.clientX-input.sx,e.clientY-input.sy);input.sx=e.clientX;input.sy=e.clientY;
  input.wx=w.x;input.wy=w.y;
  if(input.mode==='pending'&&hyp(e.clientX-input.downX,e.clientY-input.downY)>14){input.mode='drag';S.everDragged=true;}
  // rubbing a curl with the finger also tickles
  if(S.phase==='meadow'&&dm>0.5){for(const c of S.curls){const t=backTAtX(c.x);const y=SEC.back.py[Math.round(t*(NB-1))]+c.w*0.6;if(hyp(w.x-c.x,w.y-y)<c.w+30){const dir=Math.sign(dx);let amt=dm*0.6;if(c.fdir&&dir&&dir!==c.fdir)amt+=18;if(dir)c.fdir=dir;tickle(c,amt);}}}
  if(input.mode==='drag'){input.pAcc+=dm;if(input.pAcc>70){input.pAcc=0;const pr=project(w.x,w.y);if(pr&&pr.dist<60){const p=ptAt(pr.id,pr.t,{});play('poyon',clamp((900-p.y)/500,0,1));sparkle(p.x,p.y-4,2);}}}
  input.lx=w.x;input.ly=w.y;
}
function onUp(e){
  if(e.pointerId!==input.id)return;
  // finish the step exactly where the finger left the road
  if(input.mode==='drag'){const pr=project(input.wx,input.wy);if(pr&&pr.dist<120)P.tgt={id:pr.id,t:pr.t};}

}

function updCamera(dt){
  const base=Math.min(W/700,H/950);
  let ts=base,tx=P.x+P.face*40,ty=P.y-70,top=110,bot=1185,L=-200,Rr=1640;
  if(S.phase==='rising'||S.phase==='returning'||S.phase==='sea'||(S.phase==='castle'&&P.sec!=='castle')){
    const k=S.seaK;const seaS=Math.min(base,H/1350);ts=lerp(base,seaS,k);
    top=lerp(110,-820,k);bot=1200;
    const sy=P.y<420?P.y-40:lerp(425,P.y-110,0.3);ty=lerp(P.y-70,sy,k);
  }
  if(S.phase==='castle'&&P.sec==='castle'&&!P.sliding){ts=Math.min(W/720,H/880);tx=lerp(1310,P.x,0.25);ty=-390;top=-900;Rr=1720;L=-200;}
  if(P.sliding){ts=Math.min(base,H/1300);tx=P.x;ty=P.y;top=-900;}
  const hw=(W/2)/ts,hh=(H/2)/ts;
  if(Rr-L<2*hw)tx=(L+Rr)/2;else tx=clamp(tx,L+hw,Rr-hw);
  if(bot-top<2*hh)ty=bot-hh;else ty=clamp(ty,top+hh,bot-hh);
  if(camSnap){cam.x=tx;cam.y=ty;cam.s=ts;camSnap=false;}
  else{const k=Math.min(1,dt*3);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.s+=(ts-cam.s)*Math.min(1,dt*2.5);}
}

function worldXf(){ctx.setTransform(DPR*cam.s,0,0,DPR*cam.s,DPR*(focusX()-cam.x*cam.s),DPR*(focusY()-cam.y*cam.s));}
function view(){const a=s2w(0,0),b=s2w(W,H);return {l:a.x,t:a.y,r:b.x,b:b.y};}
function drawSky(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const k=S.seaK,alt=clamp((300-cam.y)/900,0,1);
  const pink=Math.min(1,S.scenery.straw*0.6),sun=Math.min(1,S.scenery.orange*0.6);
  const top=mixc(mixc(hexRGB('#7cc6ff'),hexRGB('#6fb3f5'),alt*0.6),hexRGB('#ffb3d6'),pink*0.35);
  const bot=mixc(mixc(hexRGB('#dff5ff'),hexRGB('#fff0f6'),k*0.3),hexRGB('#ffd9a0'),sun*0.5);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgba(top,1));g.addColorStop(1,rgba(bot,1));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun
  const sp=w2s(cam.x*0.8+40,cam.y*0.85-330);const sr=(60+sun*50)*cam.s;
  const sg=ctx.createRadialGradient(sp.x,sp.y,sr*0.2,sp.x,sp.y,sr*2.4);sg.addColorStop(0,sun?'rgba(255,200,120,0.9)':'rgba(255,250,210,0.9)');sg.addColorStop(0.35,sun?'rgba(255,170,90,0.35)':'rgba(255,245,200,0.35)');sg.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sp.x,sp.y,sr*2.4,0,TAU);ctx.fill();
  ctx.fillStyle=sun?'#ffc070':'#fff6c8';ctx.beginPath();ctx.arc(sp.x,sp.y,sr*0.55,0,TAU);ctx.fill();
}

function drawBerryOnTree(b){
  const sx=b.x+b.bend*0.5,sy=b.y-60;
  const lean=(b.lean||0);
  const bx=b.x+Math.sin(S.time*1.4+b.sw)*3+b.bend*0.8+(P.x-b.x)*0.12*lean;
  const by=b.y+b.bend*0.6+lean*14+(isGoal(b)?Math.sin(S.time*5)*4:0);
  ctx.strokeStyle='#7bcf8f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.quadraticCurveTo(sx,by-30,bx,by-14);ctx.stroke();
  if(b.state==='on')drawFruit('straw',bx,by,1,isGoal(b));
  else if(b.state==='regrow'){ball('#9de8a8',bx,by-8,6,6,0,1);}
}
function drawFruit(type,x,y,s,glow){
  if(glow){ctx.globalCompositeOperation='lighter';const r=34*s*(1+Math.sin(S.time*4)*0.12+S.goalPulse*0.4);const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,'rgba(255,240,180,0.7)');g.addColorStop(1,'rgba(255,240,180,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';}

    ball('#6fd08c',x-6*s,y-15*s,7*s,4*s,-0.5,1);ball('#6fd08c',x+6*s,y-15*s,7*s,4*s,0.5,1);}
  else if(type==='orange'){ball('#ffa43d',x,y,17*s,16*s,0,1);ball('#6fd08c',x+5*s,y-16*s,8*s,4*s,0.4,1);}

}

function drawFeathers(){
  for(const f of S.featherItems){if(f.state==='got')continue;if(f.state==='on'&&!SEC[f.sec].on&&f.sec!=='back')continue;let x,y;
    if(f.state==='fall'){x=f.x;y=f.y;}else{const p=ptAt(f.sec,f.t,{});x=p.x;y=p.y-10+Math.sin(S.time*2.4)*3;}
    drawFeather(x,y,f.kind==='r',Math.sin(S.time*2+(f.ph||0))*0.3+(f.wob||0)*Math.sin(S.time*30)*0.4,isGoal(f));}
}
function drawFeather(x,y,rare,rot,glow){
  ctx.save();ctx.translate(x,y);ctx.rotate(-0.6+rot);
  if(glow||rare){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(0,0,2,0,0,40);g.addColorStop(0,rare?'rgba(255,230,160,0.7)':'rgba(255,255,230,0.6)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,40,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';}

  ctx.beginPath();ctx.moveTo(0,-28);ctx.bezierCurveTo(14,-18,12,14,0,26);ctx.bezierCurveTo(-12,14,-14,-18,0,-28);ctx.fill();
  ctx.strokeStyle=rare?'rgba(255,255,255,0.9)':'rgba(180,190,230,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,32);ctx.stroke();
  ctx.restore();
}

const BELLY=[[1132,800],[1095,880],[960,950],[760,995],[520,995],[360,968],[288,920]];
function drawSheep(){
  const s=SEC.back;const tm=S.time;const sea=S.seaK;

  ctx.save();sheepCtx();
  const legs=[[400,975],[540,995],[800,995],[930,970]];

    ctx.lineWidth=2.5;for(let k=0;k<3;k++){const a=0.35*Math.PI+k*0.15*Math.PI;ctx.beginPath();ctx.moveTo(ex+Math.cos(a)*16,ey-6+Math.sin(a)*16+tw*2);ctx.lineTo(ex+Math.cos(a)*23,ey-6+Math.sin(a)*23+tw*2);ctx.stroke();}
    if(tw>0.3){ctx.fillStyle='#5a4050';ctx.beginPath();ctx.ellipse(ex,ey+8,7,2.5*tw,0,0,TAU);ctx.fill();}}
  else{ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(ex,ey,20,22*aw,0,0,TAU);ctx.fill();ctx.fillStyle='#4a3448';ctx.beginPath();ctx.ellipse(ex+6,ey+2,11,13*aw,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+10,ey-4*aw,4,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(ex+3,ey+6*aw,2,0,TAU);ctx.fill();
    ctx.strokeStyle='#7a5a66';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(ex,ey,20,22*aw,0,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}

  else{ctx.beginPath();ctx.arc(1132,784,9,0.2*Math.PI,0.8*Math.PI);ctx.stroke();}

function drawEar(front){
  const e=S.roll.ear;const n=26;const xs=new Float32Array(n),ys=new Float32Array(n);
  for(let i=0;i<n;i++){const u=i/(n-1);let [x,y]=earCenter(u,e);x+=S.shiverA*Math.sin(S.time*45+u*6)*6*u;y+=S.shiverA*Math.cos(S.time*41+u*5)*5*u;if(e<1&&!S.roll.done)y+=Math.sin(S.time*1.2)*3*u;xs[i]=x;ys[i]=y;}
  if(e>=1&&S.roll.done){const s=SEC.ear;
    // drawn in world coords using the physics section
    ctx.restore();ctx.save();
    for(let i=0;i<n;i++){xs[i]=s.px[i];ys[i]=s.py[i]+s.R;}
    tube(xs,ys,n,28,22,'#fff1dc',1);
    for(let i=0;i<n;i++)ys[i]-=4;tube(xs.subarray(3,n-2),ys.subarray(3,n-2),n-5,12,9,'#ffc4d4',0.8);
    ctx.restore();ctx.save();sheepCtx();
    return;}
  tube(xs,ys,n,28,22,'#fff1dc',1);
  tube(xs.subarray(3,n-2),ys.subarray(3,n-2),n-5,12,9,'#ffc4d4',0.75);
}
function drawBackRoad(){
  const s=SEC.back;drawSecRoad(s,'#fff8ec','#ffc9dc',1,1);
  // curls (translucent glowing balloons)
  for(const c of S.curls){
    const t=backTAtX(c.x);const i=Math.round(t*(NB-1));const top=s.py[i];const r=c.w*(1+c.wob*0.12);
    const col=c.role==='roll'?'#ffe2cc':c.role==='shiver'?'#eadcff':'#d9f5e6';
    const goal=isGoal(c);
    if(goal||c.glow>0){ctx.globalCompositeOperation='lighter';const gr=ctx.createRadialGradient(c.x,top+r*0.6,4,c.x,top+r*0.6,r*1.9);gr.addColorStop(0,'rgba(255,245,200,'+(0.45*(goal?1:c.glow)+S.goalPulse*0.3)+')');gr.addColorStop(1,'rgba(255,245,200,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(c.x,top+r*0.6,r*1.9,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';}

  // eye looking at the look target
  let lx=(b.look.x-b.x)*b.face,ly=b.look.y-(b.y-35);const ll=hyp(lx,ly)||1;lx=lx/ll*2.2;ly=ly/ll*2.2;
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(4,-2,5,0,TAU);ctx.fill();ctx.fillStyle='#3a2a3a';ctx.beginPath();ctx.arc(4+lx,-2+ly,3,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5+lx,-3.5+ly,1.1,0,TAU);ctx.fill();
  // beak
  const bo=b.beak*4;ctx.fillStyle='#ffa43d';ctx.beginPath();ctx.moveTo(10,-2-bo*0.3);ctx.lineTo(19,0);ctx.lineTo(10,2);ctx.closePath();ctx.fill();if(bo>0.5){ctx.beginPath();ctx.moveTo(10,2);ctx.lineTo(17,2+bo);ctx.lineTo(10,4+bo*0.4);ctx.closePath();ctx.fill();}
  ctx.restore();
  ctx.restore();
}
function drawPrincess(){
  const x=P.x,y=P.y-P.hop;const f=P.face;const walk=Math.sin(P.walk);const moving=Math.abs(P.spd)>20;
  ctx.save();ctx.translate(x,y);
  if(!P.sliding)shadow(0,2,26,6,0.16);
  const tilt=P.sliding?-0.3:(Math.atan2(P.ny,P.nx)+Math.PI/2)*0.35+P.lean*0.25*f;ctx.rotate(tilt);
  const sq=P.hop>0?-0.05:Math.min(0.08,Math.abs(P.spd)/6000);
  const bob=moving?Math.abs(walk)*-4:Math.sin(S.time*2)*1.2;
  // shoes
  ball('#ff7fa8',-8+(moving?walk*6:0),-4,8,5,0,1);ball('#ff7fa8',8-(moving?walk*6:0),-4,8,5,0,1);
  // skirt
  ball('#ff8fb8',0,-30+bob,30*(1+sq),27*(1-sq),0,1);
  for(let k=-2;k<=2;k++)ball('#ffb3d0',k*12,-8+bob+Math.abs(k)*-1,8,6,0,1);
  ball('#ff9fc2',0,-55+bob,14,13,0,1);
  // arms
  const hp=handPos();const hx=(hp.x-x)*1,hy=hp.y-y;
  ctx.strokeStyle='#ffe0cc';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-f*10,-56+bob);ctx.lineTo(-f*20,-36+bob+(moving?walk*3:0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(f*10,-58+bob);ctx.quadraticCurveTo(f*18,-60+bob,hx*Math.cos(-tilt)-hy*Math.sin(-tilt),hx*Math.sin(-tilt)+hy*Math.cos(-tilt));ctx.stroke();
  // head
  ball('#ffe3d1',0,-84+bob,19,19,0,1);
  ball('#ffd27a',-f*11,-90+bob,14,17,0,1);ball('#ffd27a',f*4,-100+bob,15,8,0,1);ball('#ffd27a',-f*18,-74+bob,8,10,0,1);
  // face
  let lx=P.look.x-x,ly=P.look.y-(y-84);const ll=hyp(lx,ly)||1;lx=lx/ll*1.8;ly=ly/ll*1.8;
  const ex=f*6;ctx.fillStyle='#4a3448';
  if(P.blink>0||P.joy>0.5){ctx.strokeStyle='#4a3448';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex-5,-84+bob,3,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.beginPath();ctx.arc(ex+5,-84+bob,3,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
  else{ctx.beginPath();ctx.ellipse(ex-5+lx,-84+bob+ly,2.6,3.2,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(ex+5+lx,-84+bob+ly,2.6,3.2,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-4+lx,-85.5+bob+ly,1,0,TAU);ctx.arc(ex+6+lx,-85.5+bob+ly,1,0,TAU);ctx.fill();}
  ctx.globalAlpha=0.45;ctx.fillStyle='#ff9fbf';ctx.beginPath();ctx.ellipse(ex-10,-77+bob,4,2.5,0,0,TAU);ctx.ellipse(ex+10,-77+bob,4,2.5,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#c0607a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,-78+bob,P.joy>0.2?4:2.6,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  // feathers worn in the hair (memory of the walk)
  S.feathers.forEach((k,i)=>{ctx.save();ctx.translate(-f*(10+i*6),-108+bob);ctx.scale(0.45,0.45);drawFeather(0,0,k==='r',-f*0.6-i*0.2,false);ctx.restore();});
  // crown
  ball('#ffe45c',-9,-104+bob,6,7,0,1);ball('#ffe45c',0,-108+bob,6,8,0,1);ball('#ffe45c',9,-104+bob,6,7,0,1);ball('#ff8fab',0,-110+bob,3,3,0,1);
  ctx.restore();
  // held fruit
  if(S.hold){const h=handPos();drawFruit(S.hold.type,h.x,h.y-10,0.9,false);}
  if(S.feed&&S.feed.t<0.6){const m=mouthPos();const u=smooth(S.feed.t/0.6);drawFruit(S.feed.type,lerp(S.feed.x0,m.x,u),lerp(S.feed.y0,m.y,u)-Math.sin(u*Math.PI)*60,0.9*(1-u*0.3),false);}
  if(S.fruitFly){const ff=S.fruitFly;const u=smooth(ff.t/ff.dur);drawFruit(ff.type,lerp(ff.x0,ff.to.x,u),lerp(ff.y0,ff.to.y-30,u)-Math.sin(u*Math.PI)*70,0.85,false);}
}
function drawGuide(){
  const g=S.goal;if(!g||P.sliding||S.phase==='rising'||S.phase==='returning')return;
  // glowing footprints from the princess toward the nearest temptation
  if(g.r&&input.mode!=='drag'){const sg=toS(g.r.id,g.r.t);const sp=toS(P.sec,P.t);
    if(sg!==null&&sp!==null&&Math.abs(sg-sp)>30){const dir=sg>sp?1:-1;const n=Math.min(9,Math.floor(Math.abs(sg-sp)/28));const boost=S.idle>10?1:0.55;
      for(let k=1;k<=n;k++){const s=sp+dir*k*28;const p=surfaceAtS(s);const pulse=(Math.sin(S.time*4-k*0.8)+1)/2;const a=(0.25+0.6*pulse)*boost*(S.idle>1.2?1:0.5);
        ctx.globalAlpha=a;ctx.fillStyle='#fffbe0';const side=k%2?1:-1;ctx.save();ctx.translate(p.x+p.nx*7,p.y+p.ny*7);ctx.rotate(Math.atan2(-p.nx,p.ny)+Math.PI/2*0);
        ctx.beginPath();ctx.ellipse(side*4,0,5,3.4,0,0,TAU);ctx.fill();ctx.restore();}
      ctx.globalAlpha=1;}}
  // a soft glow ring around the one thing to try next
  const r=(30+Math.sin(S.time*3.2)*4)*(1+S.goalPulse*0.6);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35+S.goalPulse*0.3;ctx.strokeStyle='#fff6c0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(g.x,g.y,r,0,TAU);ctx.stroke();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawHand(){
  const d=S.demo;if(!d.on||d.x===undefined)return;
  const a=d.t<0.4?d.t/0.4:d.t>2.3?Math.max(0,1-(d.t-2.3)/0.5):1;const press=d.t>0.5&&d.t<2.1?6:0;
  ctx.globalAlpha=0.85*a;ctx.save();ctx.translate(d.x+8,d.y+10+press);
  ball('#ffffff',0,22,18,22,0.2,1);ball('#ffffff',-4,-2,7,16,0,1);ball('#ffffff',10,14,6,10,0.3,1);ball('#ffffff',16,24,6,9,0.4,1);
  ctx.restore();ctx.globalAlpha=1;
}
function draw(){
  drawSky();
  worldXf();
  drawFar();
  drawSeaBack();
  if(S.phase!=='sea'&&S.phase!=='castle'||true)drawMeadow();
  drawCastleBack();
  drawCeiling();
  drawRoad();
  drawCloud();
  drawSheep();
  drawSeaFront();
  if(SEC.ear.on){/* ear bridge drawn with head */}
  if(SEC.perch.on){const s=SEC.perch;drawSecRoad(s,'#e8b688','#c98f5f',1,1);}
  drawBackRoad();
  drawMemento();
  const lift=S.castle?1-smooth(S.castle.lift*1.4):1;
  drawTrail(lift);
  drawSlides(lift);
  drawGuide();
  drawFeathers();
  drawDrops();
  drawBubbles();
  for(const b of BIRDS)drawBird(b);
  for(const b of BIRDS)if(b.state==='ride'&&b.ride)drawBubble(b.ride.x,b.ride.y,b.ride.r);
  for(const b of BIRDS)if(b.state==='arrive'&&b.ride)drawBubble(b.ride.x,b.ride.y,b.ride.r);
  drawPrincess();
  drawParts();
  drawHand();
}

// ============================================================
//  main loop
// ============================================================
let last=0,running=true,rafId=0;const PROF={u:0,d:0};
function frame(ts){
  rafId=0;if(!running)return;
  let dt=last?(ts-last)/1000:1/60;last=ts;dt=clamp(dt,0,0.05)*S.speed;
  const steps=dt>0.034?2:1;const h=dt/steps;
  const t0=performance.now();for(let i=0;i<steps;i++)update(h);
  const t1=performance.now();draw();const t2=performance.now();
  PROF.u=PROF.u*0.95+(t1-t0)*0.05;PROF.d=PROF.d*0.95+(t2-t1)*0.05;
  rafId=requestAnimationFrame(frame);
}
function update(dt){
  S.time+=dt;S.idle+=dt;
  updSheep(dt);
  updPhase(dt);
  genCloud();genBack();genEar();genPerch();genRoad();genCastle();
  for(const id of ['cloud','back','ear','perch','road','castle']){const s=SEC[id];physStep(s,dt);finishSec(s);}
  genBridge();physStep(SEC.bridgeC,dt);finishSec(SEC.bridgeC);
  buildRoute();
  updPrincess(dt);
  updItems(dt);
  updFeed(dt);
  for(const b of BIRDS)updBird(b,dt);
  updBubbles(dt);
  updSea(dt);
  updCastle(dt);
  updGuide(dt);
  updParts(dt);
  updCamera(dt);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;if(rafId){cancelAnimationFrame(rafId);rafId=0;}try{AU.ctx&&AU.ctx.state==='running'&&AU.ctx.suspend();}catch(e){}input.id=null;input.mode='none';}
  else{running=true;last=0;try{AU.ctx&&AU.ctx.state==='suspended'&&AU.ctx.resume().catch(()=>{});}catch(e){}if(!rafId)rafId=requestAnimationFrame(frame);}
});
window.addEventListener('pageshow',()=>{if(!document.hidden&&!rafId){running=true;last=0;rafId=requestAnimationFrame(frame);}});

// boot
setupCycle();
resize();
P.t=backTAtX(505);
for(let i=0;i<3;i++)update(1/60);
// place birds at home immediately
for(const b of BIRDS){const h=homePos(b);b.x=h.x;b.y=h.y;}
camSnap=true;updCamera(0);
rafId=requestAnimationFrame(frame);

// read-only hooks for automated checks (no UI)
window.__nemu={S,P,SEC,BIRDS,cam,w2s,s2w,ptAt,backTAtX,route:()=>route,goal:()=>S.goal,audio:()=>AU.ctx?AU.ctx.state:'none',prof:PROF,running:()=>running};
})();
</script>
