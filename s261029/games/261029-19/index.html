<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(()=>{'use strict';
/* =========================================================
   ふくろうおじいの、びよーん！まほう薬店
   瓶をタップ → カップへぽとん → ベルで渡す → 変身が世界を変える
   ========================================================= */
const cv=document.getElementById('c'),cx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,PI=Math.PI;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const elastic=t=>t<=0?0:t>=1?1:1-Math.pow(2,-8*t)*Math.cos(t*TAU*1.4);
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const x=a[i];a[i]=a[j];a[j]=x}return a};
const rm=(a,x)=>{const i=a.indexOf(x);if(i>=0)a.splice(i,1)};

/* ---------- colors ---------- */
const _hc={};
function HX(c){if(typeof c!=='string')return c;let r=_hc[c];if(!r){if(c[0]==='#'){const n=parseInt(c.slice(1),16);r=[n>>16&255,n>>8&255,n&255]}else{const m=c.match(/[\d.]+/g)||[0,0,0];r=[+m[0],+m[1],+m[2]]}_hc[c]=r}return r}
function mixA(a,b,t){a=HX(a);b=HX(b);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function css(a,al){a=HX(a);return(al==null||al>=1)?'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')':'rgba('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+','+al.toFixed(3)+')'}
const lt=(c,t)=>css(mixA(c,[255,255,255],t)),dk=(c,t)=>css(mixA(c,[18,24,40],t));
const PC={B:'#ff7a3d',F:'#ffcf2e',M:'#93ddff',S:'#b27cff'};
const FLC=['#ffd23f','#ff8a3d','#ffffff','#7fd7ff','#c39bff','#ffef8a'];

/* ---------- audio (Web Audio synth) ---------- */
const AU={c:null,m:null,ok:false,n:0,nb:null,wanted:false};
function audioStart(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      AU.c=new AC();const m=AU.c.createGain();m.gain.value=.5;
      const k=AU.c.createDynamicsCompressor();m.connect(k);k.connect(AU.c.destination);AU.m=m;
      const len=(AU.c.sampleRate*.5)|0,b=AU.c.createBuffer(1,len,AU.c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
      const s=AU.c.createBufferSource();s.buffer=AU.c.createBuffer(1,1,22050);s.connect(AU.c.destination);s.start(0);
    }
    AU.wanted=true;
    if(AU.c.state!=='running')AU.c.resume().catch(()=>{});
    AU.ok=true;
  }catch(e){AU.ok=false}
}
function tn(f,d,o){
  o=o||{};if(!AU.ok||!AU.c||AU.c.state==='closed'||AU.n>56)return;
  try{
    const c=AU.c,t=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+(o.sl||d));
    const v=o.v==null?.15:o.v,a=o.a||.005;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    let node=os;
    if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);node=fl}
    node.connect(g);g.connect(AU.m);os.start(t);os.stop(t+d+.05);AU.n++;
    os.onended=()=>{AU.n--;try{g.disconnect()}catch(e){}};
  }catch(e){}
}
function nz(d,o){
  o=o||{};if(!AU.ok||!AU.c||AU.c.state==='closed'||AU.n>56)return;
  try{
    const c=AU.c,t=c.currentTime+(o.at||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=AU.nb;f.type='bandpass';f.frequency.setValueAtTime(o.f||1500,t);
    if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+d);f.Q.value=o.q||1.2;
    const v=o.v||.08;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(AU.m);s.start(t);s.stop(t+d+.02);AU.n++;s.onended=()=>{AU.n--};
  }catch(e){}
}
const NOTE=[523,587,659,784,880,1047,1175,1319,1568];
function tune(seq,step,type,v){seq.forEach((n,i)=>{if(n>=0)tn(NOTE[n],step*1.8,{type:type||'triangle',v:v||.08,at:i*step})})}
const SFX={
  tok(p){p=p||1;tn(1250*p,.09,{type:'triangle',v:.16});tn(2900*p,.05,{v:.05});nz(.03,{f:4000,v:.04})},
  plop(p){p=p||1;tn(620*p,.22,{to:200*p,v:.2});nz(.05,{f:900,v:.03,at:.01})},
  bell(){[1,2.76,5.4,8.93].forEach((m,i)=>tn(1320*m,1.7/(1+i*.6),{v:.14/(1+i)}));tn(660,.4,{v:.05})},
  dull(){tn(700,.3,{type:'triangle',v:.09,to:620});tn(1400,.2,{v:.03})},
  gulp(){tn(320,.1,{to:170,v:.15});tn(300,.1,{to:150,v:.13,at:.17})},
  boing(p){p=p||1;tn(170*p,.5,{type:'triangle',to:560*p,sl:.18,v:.15});tn(340*p,.35,{to:220*p,v:.05,at:.12})},
  pop(){nz(.06,{f:1800,v:.12});tn(900,.12,{to:300,v:.1})},
  chime(){[784,988,1175,1568].forEach((f,i)=>tn(f,.55,{v:.1,at:i*.075,type:'triangle'}))},
  big(){[523,659,784,1047,1319,1568].forEach((f,i)=>tn(f,.8,{v:.1,at:i*.09,type:'triangle'}))},
  sparkle(){for(let i=0;i<4;i++)tn(rnd(1800,3200),.18,{v:.035,at:i*.05})},
  tick(){tn(300,.07,{v:.06})},
  inflate(){tn(220,.6,{to:700,v:.12});nz(.5,{f:600,to:2400,v:.03})},
  bloom(){[523,659,880,1047].forEach((f,i)=>tn(f,.45,{v:.08,at:i*.07}));nz(.25,{f:3200,v:.03})},
  shimmer(){for(let i=0;i<7;i++)tn(1300+i*240,.35,{v:.04,at:i*.045})},
  stretch(){tn(130,.75,{type:'sawtooth',to:460,v:.05,lp:900});tn(260,.75,{to:900,v:.05})},
  creak(){tn(190,.3,{type:'square',to:140,v:.025,lp:700})},
  hoot(){tn(440,.25,{to:380,v:.12});tn(400,.38,{to:330,v:.12,at:.3})},
  flutter(){for(let i=0;i<5;i++)nz(.03,{f:2600,v:.03,at:i*.05})},
  step(p){tn(120*(p||1),.09,{v:.07,type:'triangle'})},
  trumpet(){tn(233,.5,{type:'sawtooth',v:.08,lp:1300,to:311});tn(311,.7,{type:'sawtooth',v:.07,lp:1500,at:.4,to:392})},
  whoosh(){nz(.5,{f:400,to:3000,v:.06,q:.8})},
  voice(k){
    if(k==='owl'){tn(440,.2,{to:390,v:.1})}
    else if(k==='turtle'){tn(230,.28,{to:200,v:.1,type:'triangle'})}
    else if(k==='mouse'||k==='courier'){tn(1300,.08,{to:1750,v:.07});tn(1400,.08,{to:1900,v:.06,at:.1})}
    else if(k==='fox'){tn(680,.16,{to:940,v:.09,type:'triangle'})}
    else if(k==='special'){tn(196,.5,{type:'sawtooth',v:.06,lp:900,to:262})}
    else tn(rnd(520,880),.14,{to:rnd(700,1100),v:.07,type:'triangle'});
  },
  laugh(){for(let i=0;i<3;i++)tn(880-i*60,.08,{v:.05,at:i*.1,type:'triangle'})}
};

/* ---------- save (cards) ---------- */
const SKEY='fukurou-biyon-cards-v1';
const KINDS=['owl','turtle','mouse','fox','folk','courier','special'];
function loadCards(){
  try{
    const s=window.localStorage.getItem(SKEY);if(!s)return[];
    const a=JSON.parse(s);if(!Array.isArray(a))return[];
    return a.filter(c=>c&&typeof c.t==='string'&&KINDS.indexOf(c.t)>=0&&Array.isArray(c.s)&&c.s.length>0&&c.s.length<=4&&c.s.every(x=>typeof x==='string'&&'BFMS'.indexOf(x)>=0&&x.length===1)).slice(-8);
  }catch(e){return[]}
}
function saveCards(){try{window.localStorage.setItem(SKEY,JSON.stringify(G.cards.map(c=>({t:c.t,s:c.s}))))}catch(e){}}

/* ---------- screen / layout ---------- */
let SW=0,SH=0,DPR=1,SC=1,W=600,H=1000,portrait=true,ST=0,SB=0,SL=0,SR=0;
let LS=null,LP=null,L=null,RS=1;
function makeLayout(pl){
  const p=portrait,X=f=>SL+f*(W-SL-SR),o={};
  o.p=p;
  o.ceilY=pl?ST+(p?92:78):ST+(p?150+Math.max(0,H-ST-SB-1000)*.5:132);
  o.counterTop=H-SB-(p?300:215);
  o.floorY=o.counterTop-6;
  o.backY=o.floorY-46;
  const dxs=p?[.2,.5,.8]:[.2,.38,.56];
  o.doors=dxs.map(f=>({x:X(f),y:pl?ST+8:ST+20,w:p?116:124,h:pl?(p?72:58):(p?112:100)}));
  const wm=o.ceilY+(o.floorY-o.ceilY)*(p?(pl?.3:.4):.25);
  o.shelves=(pl?(p?[.14,.5,.86]:[.1,.45,.8]):(p?[.16,.46,.74]:[.13,.355,.58])).map(f=>({x:X(f),y:wm,w:p?104:116}));
  o.win={x:X(pl?(p?.935:.955):(p?.53:.40)),y:o.floorY-(p?120:104),w:p?88:78,h:p?76:68};
  o.hdoor={x:X(pl?(p?.065:.045):(p?.30:.20)),y:o.floorY-2,w:pl?62:(p?110:104),h:p?205:170};
  o.lamp={x:X(p?.44:.30),y:o.ceilY+(p?56:48)};
  o.owl={x:X(p?.11:.065),y:o.floorY-2};
  o.slots=(pl?[.3,.5,.7]:(p?[.33,.53,.72]:[.25,.40,.55])).map(X);
  o.slotGap=(pl?.2:(p?.19:.15))*W;
  o.minX=pl?X(.18):X(p?.24:.16);o.maxX=pl?X(.84):X(p?.76:.615);
  o.gapX0=pl?W+70:X(p?.795:.635);o.gapX1=pl?W+140:X(p?.87:.70);
  o.frameX=pl?W+140:X(p?.87:.70);
  o.outX=[0,1,2,3,4].map(i=>pl?W+170+i*90:(p?X(.95)+i*95:X(.76)+i*W*.072));
  o.back=[0,1,2,3,4,5,6,7].map(i=>pl?X(.13+i*.105):X((p?.25:.18)+i*(p?.072:.058)));
  o.wl=pl?X(p?.12:.085):o.frameX/2;
  o.wr=pl?X(p?.88:.915):o.frameX/2;
  o.k=pl?2.7:1;
  o.bottles=(p?[.10,.245,.39,.535]:[.11,.2,.29,.38]).map(f=>({x:X(f),y:o.counterTop+(p?120:100)}));
  o.cup={x:X(p?.70:.505),y:o.counterTop+(p?124:104)};
  o.bell={x:X(p?.885:.635),y:o.counterTop+(p?124:104)};
  o.cards=p?{cols:8,x0:X(.08),dx:(X(.92)-X(.08))/7,y0:o.counterTop+236,dy:0,sz:58}:{cols:4,x0:X(.735),dx:W*.066,y0:o.counterTop+66,dy:84,sz:58};
  o.special=pl?{x:X(p?.8:.84),y:o.backY-6}:{x:o.outX[0]+(p?80:70),y:o.floorY};
  o.fountain={x:X(.5),y:o.backY+4};
  o.midX=pl?X(.5):X(p?.47:.38);
  o.grow=pl?1:0;
  o.cs=pl?(p?1.15:.92):(p?1.4:1);
  return o;
}
function lerpL(a,b,t){
  if(typeof a==='number')return a+(b-a)*t;
  if(Array.isArray(a))return a.map((v,i)=>lerpL(v,b[i],t));
  if(a&&typeof a==='object'){const o={};for(const k in a)o[k]=lerpL(a[k],b[k],t);return o}
  return t<.5?a:b;
}
function resize(){
  SW=Math.max(1,window.innerWidth);SH=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  cv.style.width=SW+'px';cv.style.height=SH+'px';
  const was=portrait;portrait=SH>=SW;
  SC=portrait?Math.min(SW/600,SH/1000):Math.min(SW/1100,SH/760);
  W=SW/SC;H=SH/SC;RS=SC*DPR;
  let st=0,sb=0,sl=0,sr=0;
  try{const s=getComputedStyle(document.getElementById('sa'));st=parseFloat(s.paddingTop)||0;sb=parseFloat(s.paddingBottom)||0;sl=parseFloat(s.paddingLeft)||0;sr=parseFloat(s.paddingRight)||0}catch(e){}
  ST=st/SC;SB=Math.max(sb/SC,portrait?6:4);SL=sl/SC;SR=sr/SC;
  LS=makeLayout(false);LP=makeLayout(true);
  L=lerpL(LS,LP,G?G.grow:0);
  buildCaches();
  if(G)snapAll(was!==portrait);
}

/* ---------- caches (tiles, town, counter) ---------- */
let texWall=null,texTown=null,texCounter=null,wallY0=0,wallH=1;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*RS));c.height=Math.max(1,Math.ceil(h*RS));const g=c.getContext('2d');g.setTransform(RS,0,0,RS,0,0);return[c,g]}
function tileGlaze(g,x,y,s,base,motif){
  const gr=g.createLinearGradient(x,y,x+s,y+s);
  gr.addColorStop(0,lt(base,.22));gr.addColorStop(.5,css(base));gr.addColorStop(1,dk(base,.18));
  g.fillStyle=gr;
  rr(g,x+1.5,y+1.5,s-3,s-3,6);g.fill();
  g.fillStyle='rgba(255,255,255,.28)';rr(g,x+5,y+4,s*.45,s*.12,4);g.fill();
  g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(x+s*.3,y+s*.3,s*.18,s*.1,-.6,0,TAU);g.fill();
  if(motif===1){g.strokeStyle='rgba(255,246,220,.55)';g.lineWidth=2;g.beginPath();g.arc(x+s/2,y+s/2,s*.22,0,TAU);g.stroke();
    for(let i=0;i<4;i++){const a=i*PI/2+PI/4;g.beginPath();g.arc(x+s/2+Math.cos(a)*s*.3,y+s/2+Math.sin(a)*s*.3,s*.06,0,TAU);g.stroke()}}
  else if(motif===2){g.fillStyle='rgba(255,226,150,.5)';for(let i=0;i<5;i++){const a=i*TAU/5-PI/2;g.beginPath();g.ellipse(x+s/2+Math.cos(a)*s*.13,y+s/2+Math.sin(a)*s*.13,s*.09,s*.05,a,0,TAU);g.fill()}}
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function buildCaches(){
  // wall: covers shop wall [0,frameX] x [LP.ceilY, LS.floorY-44]
  const ww=LS.frameX;wallY0=LP.ceilY-2;wallH=LS.floorY-44-wallY0;
  let r=mkCanvas(ww,wallH);texWall=r[0];let g=r[1];
  g.fillStyle='#e9dcc0';g.fillRect(0,0,ww,wallH);
  const s=ww/Math.round(ww/50);
  const rows=Math.ceil(wallH/s)+1,cols=Math.round(ww/s);
  const wain=wallH-s*1.6;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const y=wallH-(j+1)*s,x=i*s;
    let base=((i+j)&1)?'#2f8a8f':'#26727c',m=0;
    if(y>wain){base=((i+j)&1)?'#e0a83a':'#cf9230';m=(i%3===1)?2:0}
    else if((i*7+j*3)%9===0){base='#2b4f9a';m=1}
    else if((i*5+j*11)%13===0){base='#f1e6cc';m=2}
    tileGlaze(g,x,y,s,base,m);
  }
  g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,wain-4,ww,5);
  g.fillStyle='rgba(255,240,200,.35)';g.fillRect(0,wain-6,ww,2);
  // town
  const th=LS.floorY+80;r=mkCanvas(W,th);texTown=r[0];g=r[1];
  let sky=g.createLinearGradient(0,0,0,th);sky.addColorStop(0,'#7fc8de');sky.addColorStop(.6,'#cfe8df');sky.addColorStop(1,'#f3e3c0');
  g.fillStyle=sky;g.fillRect(0,0,W,th);
  g.fillStyle='rgba(255,250,225,.9)';g.beginPath();g.arc(W*.78,LP.ceilY+70,40,0,TAU);g.fill();
  g.fillStyle='rgba(255,250,225,.25)';g.beginPath();g.arc(W*.78,LP.ceilY+70,70,0,TAU);g.fill();
  g.fillStyle='#9ccf9a';g.beginPath();g.moveTo(0,th*.7);
  for(let x=0;x<=W;x+=40)g.lineTo(x,th*.62+Math.sin(x*.012)*30);g.lineTo(W,th);g.lineTo(0,th);g.fill();
  const roofs=['#c8553d','#2b4f9a','#e0a83a','#2f8a8f','#b5623a'],walls=['#f3e6cc','#e7d3b0','#f6efe0','#e9d8bd'];
  let hx=-30,hi=0;
  while(hx<W+40){
    const hw=rnd(80,130),hh=rnd(110,190),by=LS.floorY-40;
    g.fillStyle=walls[hi%4];rr(g,hx,by-hh,hw,hh,10);g.fill();
    g.fillStyle='rgba(0,0,0,.08)';g.fillRect(hx+hw-12,by-hh+8,12,hh-8);
    g.fillStyle=roofs[hi%5];g.beginPath();g.moveTo(hx-10,by-hh+6);g.quadraticCurveTo(hx+hw/2,by-hh-60,hx+hw+10,by-hh+6);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.ellipse(hx+hw*.35,by-hh-14,hw*.18,6,-.3,0,TAU);g.fill();
    for(let k=0;k<2;k++){const wx=hx+hw*(.22+k*.38),wy=by-hh*.62;g.fillStyle='#2b4f9a';rr(g,wx,wy,hw*.2,hw*.24,8);g.fill();g.fillStyle='rgba(255,236,170,.7)';rr(g,wx+3,wy+3,hw*.2-6,hw*.1,5);g.fill()}
    g.fillStyle='#8a5a3a';rr(g,hx+hw*.4,by-46,hw*.2,46,8);g.fill();
    hx+=hw+rnd(14,36);hi++;
  }
  const gy=LS.floorY-44;g.fillStyle='#d9b98c';g.fillRect(0,gy,W,th-gy);
  for(let y=gy;y<th;y+=16)for(let x=((y/16)&1)*14;x<W;x+=28){g.fillStyle=((x+y)%3)?'rgba(255,255,255,.18)':'rgba(120,80,40,.12)';rr(g,x+2,y+2,24,12,6);g.fill()}
  // counter front
  const ch=H-LS.counterTop+4;r=mkCanvas(W,ch);texCounter=r[0];g=r[1];
  const top=portrait?150:132;
  let gt=g.createLinearGradient(0,0,0,top);gt.addColorStop(0,'#f6ecd6');gt.addColorStop(1,'#e2cfa9');
  g.fillStyle=gt;g.fillRect(0,0,W,top);
  for(let x=0;x<W;x+=70){g.fillStyle='rgba(150,110,60,.08)';g.fillRect(x,0,2,top)}
  g.fillStyle='rgba(255,255,255,.5)';g.fillRect(0,3,W,4);
  g.fillStyle='#b5623a';g.fillRect(0,top-8,W,10);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,top-8,W,2);
  const fs=46,fy=top+2;

function applyPotion(c,seq,amt){
  if(!seq.length)return;
  const t=G.t,str=clamp(amt/4,.7,1.6);
  G.stats.serves++;
  G.log.push({t:+t.toFixed(1),who:c.kind,seq:seq.join('')});
  recordCard(c.kind,seq);
  c.emo='surprise';c.emoT=1.1;c.sqv-=8;c.awake=t+6;
  const top=[c.x,c.y-c.z-c.h*c.sc*.6];
  burst(top[0],top[1],seq.map(k=>PC[k]),14+amt*2,'star',200);
  SFX.voice(c.kind);
  if(c.kind==='special'){startPlaza(seq);return}
  if(c.kind==='courier'){courierGo(c,seq[0]);return}
  if(c.kind==='owl'){owlAdd(c,seq);return}
  const iB=seq.indexOf('B'),iF=seq.indexOf('F');
  if(iB>=0&&iF>=0){if(iF<iB)makeBed(c,str);else makeHat(c,str)}
  else{if(iB>=0)makeFloat(c,str);if(iF>=0)makeFlower(c,str)}
  if(seq.indexOf('M')>=0)makeClear(c,str);
  if(seq.indexOf('S')>=0)makeStretch(c,str);

/* owl layered transformations */
function owlAdd(o,seq){
  const t=G.t;
  for(const k of seq){if(!o.layers.some(l=>l.k===k))o.layers.push({k,at:t})}
  o.layers.forEach(l=>l.until=t+48);
  o.awake=t+50;
  const ks=o.layers.map(l=>l.k);
  if(seq.indexOf('B')>=0)SFX.inflate();
  if(seq.indexOf('F')>=0){SFX.bloom();o.flowers=genFlowers(o,7,false);o.bloom=0;flowerChain(o)}
  if(seq.indexOf('M')>=0)SFX.shimmer();
  if(seq.indexOf('S')>=0)SFX.stretch();
  SFX.hoot();
  if(ks.length>=2){milestone('owldance');later(.6,SFX.big)}
}
function owlKey(o){return o.layers.map(l=>l.k).sort().join('')}

/* flower → butterflies → shelf */
function nearestHelper(c){
  let b=null,bd=1e9;
  for(const h of G.chars){
    if(h===c||h.kind==='owl'||h.kind==='courier'||h.kind==='special'||h.role==='out'||h.cross||h.z>4||h.tasks.length)continue;
    if(on(h,'bed')||on(h,'float')||(G.parade&&G.parade.mem.indexOf(h)>=0))continue;
    if(h.kind==='turtle'&&G.bridge&&G.bridge.owner===h)continue;
    const d=Math.abs(h.x-c.x);if(d<bd){bd=d;b=h}
  }
  return b;
}
function sproutSeeds(){
  let n=0;for(const s of G.seeds)if(!s.grow){s.grow=.01;n++}
  if(n){milestone('garden');later(.8,()=>{for(const s of G.seeds)spawnBF(1,s.fx*W,L.floorY-30,null,null,'free');SFX.bloom()})}
}
function flowerChain(c){
  sproutSeeds();
  const shop=G.mode==='shop';
  const h=nearestHelper(c);
  const ex=shop?L.gapX0-24:(c.x<W/2?W-60:60);
  const sx=shop?L.frameX+40:(ex<W/2?-30:W+30),sy=L.floorY-110;
  if(h){
    const side=h.x<c.x?-1:1;
    h.tasks=[go(c.x+side*60,h.role==='back'?L.backY:L.floorY),wait(.9,'dreamy'),go(ex,L.floorY),wait(.4),
      call(hh=>{spawnBF(4,sx,sy,hh,c);hh.emo='happy';hh.emoT=2}),go(c.x+(ex<c.x?-62:62),L.floorY),
      call(hh=>{for(const b of G.flies)if(b.lead===hh){b.st='circle';b.t=0}})];
    h.look={x:c.x,y:c.y-c.h*.6,until:G.t+3};
  }else{
    later(1,()=>spawnBF(4,sx,sy,null,c));
  }
}
function activateShelf(s){

  G.shelfAct=s;G.gather=s;sh.on=G.t;milestone('shelf');
  SFX.chime();

    for(const c of G.chars)if(c.role==='front'||c.role==='back'){c.emo='dreamy';c.emoT=3}
  }else if(sh.k==='garland'){

  }else{

/* parade (balloon→flower hat) */
function startParade(leader){
  if(G.parade&&G.t-G.parade.t0<G.parade.dur)return;

/* ---------- update ---------- */
function snapAll(rot){
  for(const c of G.chars){
    if(c.cross)continue;
    if(c.tasks.length&&!rot)continue;
    if(rot)c.tasks=[];
    const h=home(c);c.x=h[0];c.y=h[1];
  }
  if(G.bridge)G.bridge.x1=G.bridge.fx1*W;
  G.drops=[];G.cfly.forEach(f=>{f.x0=L.cup.x;f.y0=L.cup.y-50});
  for(const p of G.props){if(p.st!=='ground'){p.st='ground';p.fx=clamp(p.x/W,.15,.8)}}
  if(G.bridge&&G.bridge.kind==='slinky'){G.bridge.x0=L.gapX0-8;G.bridge.y0=L.floorY-4;G.bridge.x1=L.gapX1+12;G.bridge.y1=L.floorY-4}
}
function update(dt){
  const t=G.t;
  G.light=Math.min(1,G.light+dt*(G.lit?1.5:0));
  // transitions
  if(G.mode==='toPlaza'){const u=(t-G.gT0)/3.2;G.grow=elastic(u);if(u>=1)G.grow=1}
  else if(G.mode==='toShop'){const u=(t-G.gT0)/3;G.grow=1-elastic(u);if(u>=1){G.grow=0;resetDay();G.dayFlash=1;L=LS;return}}
  else if(G.mode==='plaza'||G.mode==='dusk')G.grow=1;else G.grow=0;
  L=G.grow===0?LS:(G.grow===1?LP:lerpL(LS,LP,G.grow));
  // timers
  for(let i=G.timers.length-1;i>=0;i--){if(G.timers[i].at<=t){const f=G.timers[i].fn;G.timers.splice(i,1);try{f()}catch(e){}}}
  // bottles / cup / bell springs
  for(const b of G.bottles){b.sqv+=(-b.sq*260-b.sqv*12)*dt;b.sq+=b.sqv*dt*0.06;b.sq=clamp(b.sq,-.6,.6);if(b.on)b.pop=Math.min(1,b.pop+dt*2)}
  const cp=G.cup;cp.wobv+=(-cp.wob*120-cp.wobv*6)*dt;cp.wob+=cp.wobv*dt*.1;cp.swirl=Math.max(0,cp.swirl-dt*.45);cp.spawn=Math.min(1,cp.spawn+dt*2.5);cp.ph+=dt*(1+cp.swirl*5);
  const bl=G.bell;bl.pv+=(-bl.p*300-bl.pv*14)*dt;bl.p+=bl.pv*dt*.1;bl.wv+=(-bl.w*200-bl.wv*5)*dt;bl.w+=bl.wv*dt*.05;
  // drops
  for(let i=G.drops.length-1;i>=0;i--){const d=G.drops[i];d.t+=dt/d.dur;if(d.t>=1){G.drops.splice(i,1);if(G.cup.items.length<8)landDrop(d)}}
  // flying cups
  for(let i=G.cfly.length-1;i>=0;i--){const f=G.cfly[i];f.t+=dt/f.dur;if(f.t>=1){G.cfly.splice(i,1);arriveCup(f)}}
  // replay
  if(G.replay){const r=G.replay;r.t+=dt;
    const n=r.card.s.length;
    if(r.step<n&&r.t>.35+r.step*.32){const k=r.card.s[r.step];r.items.push(k);r.step++;SFX.plop(1.2+r.step*.1);for(let j=0;j<4;j++)part({x:r.x,y:r.y-10,vx:rnd(-50,50),vy:rnd(-90,-30),g:300,life:.4,max:.4,c:PC[k],sz:3})}
    if(r.step>=n&&r.t>.6+n*.32){const tg=findTarget(r.card.t);if(tg)G.cfly.push({items:r.items.slice(),x0:r.x,y0:r.y,tgt:tg,t:0,dur:.6,mini:true});SFX.bell();G.replay=null}
  }
  // chars
  for(const c of G.chars.slice())updChar(c,dt);
  updBridge(dt);
  updParade(dt);
  // butterflies
  updFlies(dt);
  // props
  updProps(dt);
  // seeds grow
  for(const s of G.seeds)if(s.grow>0&&s.grow<1)s.grow=Math.min(1,s.grow+dt*.6);
  // particles
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue}p.vy+=p.g*dt;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  for(let i=G.rip.length-1;i>=0;i--){G.rip[i].t+=dt;if(G.rip[i].t>.6)G.rip.splice(i,1)}
  // doors anim
  for(const d of G.doors)d.o=Math.min(1,d.o+(d.op?dt*2:0));
  G.win.o=Math.min(1,G.win.o+(G.win.opened?dt*2.2:0));
  G.hdoor.o=Math.min(1,G.hdoor.o+(G.hdoor.opened?dt*1.2:0));G.hdoor.glow=Math.max(0,G.hdoor.glow-dt*.5);
  for(let i=G.ceilF.length-1;i>=0;i--)if(G.ceilF[i].until<t)G.ceilF.splice(i,1);
  // window reveal by transparent bodies
  if(!G.win.seen&&G.mode==='shop'){
    for(const c of G.chars){if(c.alpha>.7)continue;const b=bodyOf(c);
      if(Math.abs(b.x-L.win.x)<b.rx*.75+L.win.w*.3&&Math.abs(b.y-L.win.y)<b.ry*.75+L.win.h*.3){G.win.seen=t;SFX.sparkle();later(.2,SFX.chime);c.look={x:L.win.x,y:L.win.y,until:t+4};c.point=t+3;milestone('windowSeen');break}}
  }
  // projection
  if(G.proj){const P=G.proj;
    if(!P.beam){const ok=Math.abs(P.tu.x-(L.hdoor.x+40))<10&&Math.abs(P.fx.x-(L.hdoor.x-50))<10;if(ok||t-P.t0>5){P.beam=t;SFX.shimmer()}}
    else{if(!P.done&&t-P.beam>2.4){P.done=true;openHiddenDoor()}if(t-P.beam>6.5)G.proj=null}
  }
  // outside line refill
  if(G.mode==='shop'&&t>G.nextOut){G.nextOut=t+rnd(12,20);if(G.outside.length<2)addOutsideFolk(false)}
  // special guest
  if(G.mode==='shop'&&!G.special){
    let n=0;for(const k of G.ms)if(CHAIN.indexOf(k)>=0)n++;
    if(n>=5||(t>240&&n>=4)||(t>360&&n>=3)||(t>480&&n>=2)){if(!G.specialDue)G.specialDue=t+2.5;else if(t>G.specialDue)spawnSpecial()}
  }
  // owl show reaction key
  G.owlShow=owlKey(G.owl);
  // party / music
  if(AU.ok&&AU.c&&(G.party||G.music>t)){
    const ct=AU.c.currentTime;
    if(G.beatT<ct-1)G.beatT=ct+.05;
    while(G.beatT<ct+.25){
      const i=G.beat++;const mel=[0,2,4,2,5,4,2,-1,3,5,7,5,4,2,1,-1];
      const n=mel[i%16];if(n>=0)tn(NOTE[n],.28,{v:G.party?.035:.05,type:'triangle',at:G.beatT-ct});
      if(i%2===0)tn(i%4===0?131:196,.18,{v:.05,type:'sine',at:G.beatT-ct});
      G.beatT+=.26;
    }
  }
  // dusk & new day
  if(G.mode==='plaza'){
    const idle=t-G.lastIn,pt=t-G.plazaAt;
    if((pt>150&&idle>22)||pt>330){G.mode='dusk';G.dusk=t;react('happy',W/2,L.floorY-100);for(const c of G.chars){c.wave=t+4}tune([7,5,4,2,0],.3,'sine',.06)}
  }else if(G.mode==='dusk'){
    if(t-G.dusk>5.5){G.mode='toShop';G.gT0=t;G.party=false;SFX.stretch();later(.8,SFX.boing)}
  }
  G.dayFlash=Math.max(0,G.dayFlash-dt*.6);
  // hints
  const h=hintTarget();if(h!==G.hint){G.hint=h;G.hintSince=t}
  if(!G.owlPointed&&h&&h[0]==='b'&&t-G.lastIn>10&&G.lit!==null){G.owlPointed=true;G.owlPointAt=t;G.owl.awake=t+3;SFX.hoot()}
}
function bodyOf(c){
  const s=c.sc,hh=c.h*s;
  return{x:c.x,y:c.y-c.z-(c.kind==='owl'?c.legs:0)-hh*.5,rx:hh*(c.kind==='turtle'?.55:c.kind==='special'?.5:.42),ry:hh*.52};
}
function topZFor(c){return Math.max(0,(c.y-c.h*c.sc-(c.kind==='owl'?c.legs:0))-(L.ceilY+8))}

function drawChar(c){
  const sc=c.sc;
  const X=c.x,Y=c.y-c.z+(c.hopY||0);
  if(c.alpha<.8)revealBehind(c);
  cx.save();cx.translate(X,Y);
  const rot=c.rot+(c.spin||0);
  if(rot){const p=c.h*sc*.5+(c.kind==='owl'?c.legs:0);cx.translate(0,-p);cx.rotate(rot);cx.translate(0,p)}
  const sq=c.sq,ln=c.lean*.07;
  cx.scale(sc*(1+sq*.25+ln)*c.face,sc*(1-sq*.25+ln));
  cx.globalAlpha=clamp(c.alpha,0,1);
  if(c.kind==='courier'&&c.inWall&&G.t-c.inWall<1)cx.globalAlpha*=.3;
  KDRAW[c.kind](c);
  if(c.kind!=='owl'||!c.legs)overlays(c);else{cx.translate(0,-c.legs);overlays(c)}
  cx.restore();
  if(c.alpha<.8){ // glassy rim
    const b=bodyOf(c);cx.save();cx.globalAlpha=.75*(1-c.alpha);
    cx.strokeStyle='rgba(225,250,255,.9)';cx.lineWidth=2.5;cx.beginPath();cx.ellipse(b.x,b.y,b.rx,b.ry,0,0,TAU);cx.stroke();
    cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=4;cx.beginPath();cx.ellipse(b.x,b.y,b.rx*.8,b.ry*.8,0,PI*1.1,PI*1.45);cx.stroke();
    cx.restore();
  }
  cx.globalAlpha=1;
}
function drawShadow(c){
  const s=c.sc,k=1/(1+c.z/150);
  cx.fillStyle='rgba(40,30,20,'+(.22*k*clamp(c.alpha+.3,0,1)).toFixed(3)+')';
  cx.beginPath();cx.ellipse(c.x,c.y+2,c.h*s*.42*k*(c.kind==='turtle'?1.3:1),c.h*s*.08*k,0,0,TAU);cx.fill();
}
/* hidden things seen only through transparent bodies */
function revealBehind(c){
  const b=bodyOf(c);
  cx.save();cx.beginPath();cx.ellipse(b.x,b.y,b.rx*.95,b.ry*.95,0,0,TAU);cx.clip();
  cx.globalAlpha=1-c.alpha;

  for(const p of pics)hiddenPic(p[0],p[1],p[2]);

  if(!G.hdoor.opened){cx.strokeStyle='rgba(255,236,160,.8)';cx.lineWidth=4;cx.setLineDash([10,8]);doorPath(L.hdoor);cx.stroke();cx.setLineDash([])}

function star(x,y,r,n){cx.beginPath();for(let i=0;i<n*2;i++){const a=i*PI/n-PI/2,rr2=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}cx.closePath();cx.fill()}

function drawBG(){

  if(G.grow<=0){const x0=Math.max(0,L.frameX-12),sx=x0*RS;cx.drawImage(texTown,sx,0,texTown.width-sx,texTown.height,x0,0,W-x0,LS.floorY+80)}
  else cx.drawImage(texTown,0,0,texTown.width,texTown.height,0,0,W,LS.floorY+80);
  if(G.mode!=='shop'){
    // plaza decorations in sky
    const a=clamp(G.grow,0,1);cx.globalAlpha=a;
    const th=G.theme;
    for(let i=0;i<9;i++){
      const x=W*(i+.5)/9,y=L.ceilY+60+Math.sin(t*.8+i)*14+(i%2)*30;
      if(th==='B'||th==='S')balloonOn(x,y+60,[PC.B,'#ffd23f','#7fd7ff','#c39bff'][i%4],18);

  }
  // walls
  const k=L.k*(1+(G.mode==='toPlaza'||G.mode==='toShop'?Math.sin(t*16)*.05*(1-Math.abs(G.grow-.5)*2):0));
  const m=LS.frameX/2,tw=texWall.width/2;
  const wy=wallY0,wh=wallH;
  cx.drawImage(texWall,0,0,tw,texWall.height,L.wl-m*k,wy,m*k,wh);
  cx.drawImage(texWall,tw,0,tw,texWall.height,L.wr,wy,m*k,wh);
  // shading at wall split edges
  if(G.grow>.02){
    let g=cx.createLinearGradient(L.wl-20,0,L.wl,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.25)');cx.fillStyle=g;cx.fillRect(L.wl-20,wy,20,wh);
    g=cx.createLinearGradient(L.wr,0,L.wr+20,0);g.addColorStop(0,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(L.wr,wy,20,wh);
  }
  // door frame & outside awning (shop)
  if(L.frameX<W+40){
    const fx=L.frameX,top=L.floorY-216;
    cx.fillStyle='#b5623a';rr(cx,fx-10,top-20,22,L.floorY-top+20,8);cx.fill();
    cx.fillStyle='rgba(255,255,255,.3)';cx.fillRect(fx-6,top-16,4,L.floorY-top);
    cx.fillStyle='#e9dcc0';cx.fillRect(fx,wy,W-fx+10,top-20-wy);
    for(let x=fx;x<W+40;x+=36){cx.fillStyle=((x-fx)/36|0)%2?'#2f8a8f':'#f1e6cc';cx.beginPath();cx.moveTo(x,top-40);cx.lineTo(x+36,top-40);cx.lineTo(x+30,top-14);cx.quadraticCurveTo(x+18,top-4,x+6,top-14);cx.closePath();cx.fill()}
  }
  // shelves
  for(let i=0;i<3;i++)drawShelf(i);
  // window
  if(G.win.seen&&L.win.x<W+40)drawWindow(false);
  // hidden door
  drawHiddenDoor();
  // projection
  if(G.proj&&G.proj.beam)drawProjection();
  if(G.hdoor.glow>0&&!G.hdoor.opened){cx.globalAlpha=clamp(G.hdoor.glow,0,1)*(.5+.5*Math.sin(t*12));cx.strokeStyle='#fff3b0';cx.lineWidth=5;doorPath(L.hdoor);cx.stroke();cx.globalAlpha=1}
  // floor

  let g=cx.createLinearGradient(0,fy,0,L.counterTop);g.addColorStop(0,'#c46a46');g.addColorStop(1,'#a8532f');
  cx.fillStyle=g;cx.fillRect(0,fy,Math.min(L.frameX,W),L.counterTop-fy+20);
  cx.fillStyle='rgba(255,220,180,.18)';for(let x=0;x<L.frameX;x+=60){cx.fillRect(x,fy,2,L.counterTop-fy)}
  cx.fillRect(0,fy+22,Math.min(L.frameX,W),2);
  cx.globalAlpha=1;
  // gap / step at the door
  if(L.gapX0<W){
    const x0=L.gapX0,x1=L.gapX1;
    g=cx.createLinearGradient(0,fy,0,L.counterTop);g.addColorStop(0,'#3a2a24');g.addColorStop(1,'#5a3a2c');
    cx.fillStyle=g;cx.fillRect(x0,fy+6,x1-x0,L.counterTop-fy);
    cx.fillStyle='#7fcf6a';for(let x=x0+6;x<x1;x+=12){cx.beginPath();cx.ellipse(x,L.counterTop-4,5,10,0,0,TAU);cx.fill()}
    flower(x0+16,L.counterTop-14,6,'#ffd23f',1);flower(x1-14,L.counterTop-10,5,'#7fd7ff',1);
    cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(x0,fy+6,3,L.counterTop-fy);
  }
  // seeds & sprouts
  for(const s of G.seeds){
    const x=s.fx*W,y=L.floorY+2;
    if(s.grow<=0){cx.fillStyle='#8a5a3a';cx.beginPath();cx.ellipse(x,y,6,3,0,0,TAU);cx.fill()}
    else{const hh=40*s.grow;cx.strokeStyle='#5aa040';cx.lineWidth=3;cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo(x+6,y-hh*.5,x,y-hh);cx.stroke();cx.fillStyle='#7fcf6a';cx.beginPath();cx.ellipse(x+6,y-hh*.5,6,3,.5,0,TAU);cx.fill();flower(x,y-hh,10,s.c,s.grow)}
  }
  // ceiling
  drawCeiling();
}

  }
  cx.globalAlpha=1;
  for(const r of G.rip){const u=r.t/.6;cx.globalAlpha=1-u;cx.strokeStyle=r.c;cx.lineWidth=3;cx.beginPath();cx.arc(r.x,r.y,8+u*30,0,TAU);cx.stroke()}
  cx.globalAlpha=1;
}
function drawFlies(){
  for(const b of G.flies){
    const f=Math.abs(Math.sin(b.ph*(b.st==='perch'?.25:1))),s=7*b.sz;
    cx.save();cx.translate(b.x,b.y);
    cx.fillStyle=b.c;
    for(const d of[-1,1]){cx.save();cx.scale(d*(.25+f*.75),1);cx.beginPath();cx.ellipse(s*.8,-s*.4,s*.9,s*.75,-.4,0,TAU);cx.fill();cx.beginPath();cx.ellipse(s*.6,s*.5,s*.55,s*.5,.4,0,TAU);cx.fill();cx.restore()}
    cx.fillStyle='#3a2a30';cx.fillRect(-1.2,-s*.8,2.4,s*1.6);
    cx.restore();
  }
}
function drawProps(){
  for(const p of G.props){
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
    if(p.k==='S'){cx.scale(.7,.7);const P=BP.S||(BP.S=bottlePath('S'));cx.fillStyle=PC.S;cx.fill(P);cx.strokeStyle='rgba(30,60,70,.6)';cx.lineWidth=4;cx.stroke(P);cx.fillStyle='#c98a4a';rr(cx,-9,-106,18,14,4);cx.fill()}
    else{ // music box
      const play=G.music>G.t;
      cx.fillStyle='#b5623a';rr(cx,-24,-28,48,28,6);cx.fill();cx.fillStyle='#e0a83a';cx.fillRect(-24,-14,48,4);
      cx.save();cx.translate(-24,-28);cx.rotate(play?-.6:0);cx.fillStyle='#c8553d';rr(cx,0,-8,48,10,4);cx.fill();cx.restore();
      if(play){blob(0,-46+Math.sin(G.t*8)*3,7,9,'#f1e6cc');cx.save();cx.translate(0,-46);cx.rotate(G.t*5);cx.fillStyle='#ffd23f';cx.fillRect(-12,-2,24,4);cx.restore()}
      cx.fillStyle='#e0a83a';cx.save();cx.translate(26,-14);cx.rotate(G.t*(play?6:0));cx.fillRect(-2,-8,4,16);cx.restore();
    }
    cx.restore();
  }
}
function drawFinger(){
  const h=G.hint;if(!h)return;
  const idle=G.t-G.lastIn;if(idle<4)return;
  const p=hintPos(h);if(!p)return;
  const u=((idle-4)%1.6)/1.6;
  const press=u>.45&&u<.65;
  const x=p[0]+26,y=p[1]+34+(u<.45?(1-u/.45)*40:0)+(press?6:0);
  cx.save();cx.globalAlpha=.85*clamp((idle-4)*2,0,1);cx.translate(x,y);cx.rotate(-.35);
  cx.fillStyle='#fff3e0';cx.strokeStyle='rgba(90,60,40,.6)';cx.lineWidth=3;
  rr(cx,-6,-34,14,40,7);cx.fill();cx.stroke();
  rr(cx,-16,0,40,34,14);cx.fill();cx.stroke();
  cx.restore();
  if(press){cx.globalAlpha=.7;cx.strokeStyle='#fff6c8';cx.lineWidth=3;cx.beginPath();cx.arc(p[0]+16,p[1]-4,18+(u-.45)*80,0,TAU);cx.stroke();cx.globalAlpha=1}
  cx.globalAlpha=1;
}
function draw(){
  cx.setTransform(RS,0,0,RS,0,0);
  drawBG();
  // owl perch
  drawPerch();
  // character ordering
  const list=G.chars.slice().sort((a,b)=>{const za=(a.z>40||a.kind==='owl'&&a.z>10)?1:0,zb=(b.z>40||b.kind==='owl'&&b.z>10)?1:0;if(za!==zb)return za-zb;return(a.y-(a.role==='back'?2:0))-(b.y-(b.role==='back'?2:0))});
  G.drawList=list;
  for(const c of list)if(c.z<40&&!c.cross)drawShadow(c);
  drawProps();
  // selected spot
  if(G.sel&&G.chars.indexOf(G.sel)>=0){const s=G.sel;cx.fillStyle='rgba(255,236,170,'+(.25+.1*Math.sin(G.t*4)).toFixed(3)+')';cx.beginPath();cx.ellipse(s.x,s.y+2,s.h*s.sc*.55,s.h*s.sc*.12,0,0,TAU);cx.fill()}
  for(const c of list)drawChar(c);
  drawFlies();
  drawCounter();
  drawDrops();
  drawParts();
  // hint for chars / window
  const h=G.hint;
  if(h&&(h[0]==='c'||h==='win')){const p=hintPos(h);if(p)sparkles(p[0],p[1],h==='win'?52:60)}
  drawFinger();
  // lighting overlays
  const dim=(1-G.light)*.38;
  if(dim>.005){cx.fillStyle='rgba(20,30,60,'+dim.toFixed(3)+')';cx.fillRect(0,0,W,H)}
  if(G.mode==='dusk'||G.mode==='toShop'){const a=G.mode==='dusk'?clamp((G.t-G.dusk)/4,0,1):clamp(1-(G.t-G.gT0)/3,0,1);cx.fillStyle='rgba(255,120,60,'+(a*.18).toFixed(3)+')';cx.fillRect(0,0,W,H);cx.fillStyle='rgba(40,30,90,'+(a*.18).toFixed(3)+')';cx.fillRect(0,0,W,H)}
  if(G.dayFlash>0){cx.fillStyle='rgba(255,250,230,'+(G.dayFlash*.5).toFixed(3)+')';cx.fillRect(0,0,W,H)}
}

/* ---------- input ---------- */
const PTR={x:0,y:0,has:false};
function inCircle(x,y,cx2,cy2,r){const dx=x-cx2,dy=y-cy2;return dx*dx+dy*dy<=r*r}
function hitChar(x,y){
  let best=null,bd=1e9;
  for(const c of G.chars){
    if(c.cross)continue;
    const b=bodyOf(c);let rx=Math.max(b.rx+12,34),ry=Math.max(b.ry+12,40),bx=b.x;
    if(c.kind==='special'){if(!c.arrived)continue;if(G.mode==='shop'){bx=Math.min(b.x-60,W-70);rx=ry=130}}
    const d=((x-bx)/rx)**2+((y-b.y)/ry)**2;
    if(d<=1&&d<bd){bd=d;best=c}
  }
  return best;
}
function onDown(e){
  e.preventDefault&&e.preventDefault();
  audioStart();
  const x=e.clientX/SC,y=e.clientY/SC;
  PTR.x=x;PTR.y=y;PTR.has=true;
  G.lastIn=G.t;
  if(!G.lit){G.lit=true;SFX.hoot();G.owl.awake=G.t+2;G.owl.sqv-=6}
  tap(x,y);
}
function tap(x,y){
  if(G.mode==='toPlaza'||G.mode==='toShop'){ripple(x,y);return}
  // cards
  if(G.cards.length){const sz=L.cards.sz*.6;for(let i=0;i<G.cards.length&&i<8;i++){const p=cardPos(i);if(Math.abs(x-p[0])<sz&&Math.abs(y-p[1])<sz){playCard(i);return}}}
  // bottles
  {let bi=-1,bd=1e9;for(let i=0;i<4;i++){const b=G.bottles[i];if(!b.on)continue;const B=L.bottles[i],d=Math.abs(x-B.x);if(d<52&&y>B.y-125&&y<B.y+24&&d<bd){bd=d;bi=i}}if(bi>=0){pour(bi);return}}
  // bell
  if(inCircle(x,y,L.bell.x,L.bell.y-42,66)){ringBell();return}
  // cup
  if(inCircle(x,y,L.cup.x,L.cup.y-50,56)){G.cup.wobv+=6;G.cup.swirl=Math.min(1,G.cup.swirl+.5);tn(700,.15,{to:900,v:.06});return}
  // window
  if(G.win.seen&&inCircle(x,y,L.win.x,L.win.y,58)){
    if(!G.win.opened){G.win.opened=true;milestone('window');SFX.creak();SFX.chime();burst(L.win.x,L.win.y,['#fff6c0','#ffffff'],18,'star',180);later(.5,spawnCourier);react('surprise',L.win.x,L.win.y);return}
  }
  // characters
  const c=hitChar(x,y);
  if(c){selectChar(c);return}
  if(G.win.opened&&G.courier&&!G.courier.busy&&inCircle(x,y,L.win.x,L.win.y,50)){selectChar(G.courier);return}
  // music box
  for(const p of G.props){if(p.k==='music'&&p.st==='ground'&&inCircle(x,y,p.x,p.y-20,46)){G.music=G.t+5;tune([4,2,0,2,4,4,4,-1,2,2,2,-1,4,7,7],.18,'sine',.08);for(const ch of G.chars){ch.emo='happy';ch.emoT=2;ch.sqv-=3}G.owl.awake=G.t+6;return}}
  // hidden door band
  if(G.hdoor.opened&&inCircle(x,y,L.hdoor.x,L.hdoor.y-50,56)){G.hdoor.band=G.t;playBand();return}
  // cupboards: small rattle only
  for(let i=0;i<3;i++){const D=L.doors[i];if(Math.abs(x-D.x)<D.w/2&&y>D.y&&y<D.y+D.h){G.rip.push({x,y,t:0,c:'rgba(255,240,200,.7)'});SFX.creak();return}}
  // anything else: small wobble only
  ripple(x,y);SFX.tick();
}
function selectChar(c){
  if(c.kind==='special'&&!c.arrived)return;
  if(G.sel!==c){G.sel=c;c.emo='want';c.emoT=1.4;c.sqv-=5;SFX.voice(c.kind)}
  else{c.sqv-=6;c.emo='happy';c.emoT=1;SFX.voice(c.kind)}
  if(c.kind==='owl'){c.awake=G.t+6}
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',e=>{PTR.x=e.clientX/SC;PTR.y=e.clientY/SC;PTR.has=true},{passive:true});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));

/* ---------- loop ---------- */
let raf=0,lastTs=0,hidden=false;
function frame(ts){
  raf=0;if(hidden)return;
  const now=ts/1000;let dt=lastTs?now-lastTs:1/60;lastTs=now;dt=clamp(dt,0,.05);
  G.t+=dt;
  try{update(dt);draw()}catch(e){if(!frame.err){frame.err=1;console.warn(e)}}
  raf=requestAnimationFrame(frame);
}
function start(){if(!raf&&!hidden){lastTs=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',()=>{
  hidden=document.hidden;
  if(hidden){if(raf){cancelAnimationFrame(raf);raf=0}if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{})}
  else{if(AU.c&&AU.wanted)AU.c.resume().catch(()=>{});G.lastIn=G.t;start()}
});
window.addEventListener('pagehide',()=>{if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{})});
window.addEventListener('pageshow',()=>{hidden=document.hidden;start()});
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{resize();},60)}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));

resize();
resetDay();
L=LS;snapAll(true);
start();

// test/inspection hook (no UI)
window.__potion={
  get G(){return G},get L(){return L},get SC(){return SC},
  screen(x,y){return[x*SC,y*SC]},
  pos(name){
    if(name==='bell')return[L.bell.x*SC,(L.bell.y-42)*SC];
    if(name==='cup')return[L.cup.x*SC,(L.cup.y-50)*SC];
    if(name==='win')return[L.win.x*SC,L.win.y*SC];
    if(name.startsWith('b'))return[L.bottles[+name[1]].x*SC,(L.bottles[+name[1]].y-50)*SC];
    if(name.startsWith('card')){const p=cardPos(+name.slice(4));return[p[0]*SC,p[1]*SC]}
    if(name==='band')return[L.hdoor.x*SC,(L.hdoor.y-50)*SC];
    const c=G.chars.find(c=>c.kind===name);if(!c)return null;const b=bodyOf(c);
    if(c.kind==='special'&&G.mode==='shop')return[Math.min(b.x-60,W-70)*SC,b.y*SC];
    return[b.x*SC,b.y*SC];
  },
  audio(){return AU.c?AU.c.state:'none'},
  charPos(c){const b=bodyOf(c);return[b.x*SC,b.y*SC]}
};
})();
</script>
