// ================================================================ helpers
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const backOut=t=>{t=clamp(t,0,1);const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
class Spring{constructor(x,k,d){this.x=x;this.t=x;this.v=0;this.k=k||90;this.d=d||12;}
 step(dt){this.v+=((this.t-this.x)*this.k-this.v*this.d)*dt;this.x+=this.v*dt;}
 set(v){this.x=this.t=v;this.v=0;}}
function line(c,x0,y0,x1,y1){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0.01,Math.abs(r)),0,TAU);c.fill();}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(0.01,Math.abs(rx)),Math.max(0.01,Math.abs(ry)),rot||0,0,TAU);c.fill();}
const GLOW=new Map();
function glowSprite(rgb){let sp=GLOW.get(rgb);if(sp)return sp;sp=document.createElement('canvas');sp.width=sp.height=64;const g2=sp.getContext('2d');const gr=g2.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba('+rgb+',1)');gr.addColorStop(0.5,'rgba('+rgb+',0.5)');gr.addColorStop(1,'rgba('+rgb+',0)');g2.fillStyle=gr;g2.fillRect(0,0,64,64);GLOW.set(rgb,sp);return sp;}
function glow(c,x,y,r,col){if(r<=1)return;const m=/rgba\(([\d.]+,[\d.]+,[\d.]+),([\d.]+)\)/.exec(col);if(!m)return;const a=+m[2];if(a<=0.003)return;
 const ga=c.globalAlpha;c.globalAlpha=ga*Math.min(1,a);c.drawImage(glowSprite(m[1]),x-r,y-r,r*2,r*2);c.globalAlpha=ga;}
function bz(t,a,b,c,d){const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d;}
function q2(t,a,b,c){const u=1-t;return u*u*a+2*u*t*b+t*t*c;}

// ================================================================ audio
const A={c:null,m:null,rv:null,n:0,nb:null,
 init(){
  if(this.c){if(this.c.state!=='running'&&!document.hidden)this.c.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
   const c=new AC();this.c=c;
   const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.25;
   const m=c.createGain();m.gain.value=0.5;m.connect(comp);comp.connect(c.destination);this.m=m;
   const len=(c.sampleRate*1.5)|0,b=c.createBuffer(2,len,c.sampleRate);
   for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
   const cv=c.createConvolver();cv.buffer=b;const rg=c.createGain();rg.gain.value=0.25;cv.connect(rg);rg.connect(m);this.rv=cv;
   const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);
   if(c.state!=='running')c.resume().catch(()=>{});
  }catch(e){this.c=null;}
 },
 osc(f,o){
  const c=this.c;if(!c||c.state!=='running'||this.n>24)return;
  const t0=c.currentTime+(o.at||0),v=o.vol||0.1,att=o.att||0.004,dur=o.dur||0.6;
  const os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t0+(o.slideT||0.2));
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+att);g.gain.exponentialRampToValueAtTime(0.0001,t0+att+dur);
  os.connect(g);g.connect(this.m);
  if(o.rev&&this.rv){const s=c.createGain();s.gain.value=o.rev;g.connect(s);s.connect(this.rv);}
  os.start(t0);os.stop(t0+att+dur+0.05);this.n++;
  os.onended=()=>{this.n--;try{g.disconnect();}catch(e){}};
 },
 noise(o){
  const c=this.c;if(!c||c.state!=='running'||this.n>24)return;
  if(!this.nb){const b=c.createBuffer(1,(c.sampleRate*0.6)|0,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;}
  const t0=c.currentTime+(o.at||0),dur=o.dur||0.1;
  const s=c.createBufferSource();s.buffer=this.nb;
  const f=c.createBiquadFilter();f.type=o.sweep?'bandpass':'lowpass';f.frequency.setValueAtTime(o.freq||500,t0);
  if(o.sweep)f.frequency.exponentialRampToValueAtTime(o.sweep,t0+dur);f.Q.value=o.q||0.7;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol||0.1,t0+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+dur+0.02);this.n++;
  s.onended=()=>{this.n--;try{g.disconnect();}catch(e){}};
 },
 suspend(){if(this.c&&this.c.state==='running')this.c.suspend().catch(()=>{});},
 resume(){if(this.c&&this.c.state!=='running')this.c.resume().catch(()=>{});}
};
const PENT=[0,2,4,7,9];
const nf=i=>261.63*Math.pow(2,(12*Math.floor(i/5)+PENT[((i%5)+5)%5])/12);
function sBell(i){const f=nf(i);A.osc(f,{vol:.17,dur:1.5,rev:.6});A.osc(f*2.76,{vol:.045,dur:.5,rev:.3});A.osc(f*5.4,{vol:.016,dur:.22});A.osc(f*4.01,{vol:.012,dur:.06,at:.035});A.osc(f*4.2,{vol:.01,dur:.05,at:.07});}
function sDrum(lv){const f=100-Math.min(4,lv)*5;A.osc(f,{vol:.5,dur:.55,att:.003,slide:f*0.52,slideT:.28,rev:.25});A.noise({vol:.09,dur:.08,freq:420});A.osc(f*2.1,{type:'triangle',vol:.04,dur:.12});}
function sXylo(i){const f=nf(i);A.osc(f,{vol:.2,dur:.5,rev:.35});A.osc(f*3.98,{vol:.03,dur:.07});A.osc(f*2,{type:'triangle',vol:.03,dur:.18});}
function sChirp(d){d=d||0;A.osc(2300,{vol:.03,dur:.08,slide:3300,slideT:.06,at:d});A.osc(2600,{vol:.025,dur:.08,slide:3600,slideT:.05,at:d+.11});}
function sHop(){A.osc(480,{vol:.025,dur:.07,slide:760,slideT:.06});}
function sSuccess(){[5,7,8,10,12].forEach((n,j)=>A.osc(nf(n),{vol:.085,dur:1.1,rev:.7,at:j*.085}));[0,2,3].forEach(n=>A.osc(nf(n),{type:'triangle',vol:.035,att:.18,dur:1.6,rev:.5}));}
function sGift(){[7,9,12,14].forEach((n,j)=>A.osc(nf(n),{vol:.08,dur:.9,rev:.6,at:j*.07}));}
function sTick(){A.osc(nf(10),{vol:.03,dur:.12});}
function sWhee(){A.noise({vol:.035,dur:.5,freq:1800,sweep:600,q:2});A.osc(900,{vol:.022,dur:.45,slide:450,slideT:.4});}
function sChime(i){A.osc(nf(i),{vol:.035,dur:1.6,rev:.9});}
function sKob(i,d){A.osc(nf(i),{vol:.05,dur:.35,rev:.4,at:d==null?.08:d});}
function sReveal(){for(let j=0;j<12;j++)A.osc(nf(j+2),{vol:.06,dur:.5,rev:.6,at:j*.07});[5,7,9,12,14].forEach((n,j)=>A.osc(nf(n),{vol:.08,dur:1.4,rev:.8,at:1.0+j*.12}));[0,2,4].forEach(n=>A.osc(nf(n),{type:'triangle',vol:.04,att:.4,dur:2.5,rev:.6,at:1.2}));}

function readSA(){const cs=getComputedStyle(saEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function layout(){
 W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1,Math.sqrt(2400000/(W*H)));

  I.drum={x:l+aw*0.74,y:rowY+dr*0.05,r:dr};
  I.xylo={x:l+aw*0.03,y:rowY+Math.max(br,dr)*1.35+gap,w:xw,h:xh};
 }else{
  S=Math.min(aw/1000,(ah*0.72)/640);

  const ih=top+ah-ZY;
  I.bell={x:l+aw*0.12,y:ZY+ih*0.54,r:Math.min(ih*0.38,aw*0.09)};
  I.drum={x:l+aw*0.88,y:ZY+ih*0.56,r:Math.min(ih*0.4,aw*0.1)};
  const xw=Math.min(aw*0.5,ih*2.7),xh=Math.min(ih*0.78,xw*0.4);

 }

function fibers(c,R,x,y,w,h,n){
 for(let i=0;i<n;i++){const px=x+R()*w,py=y+R()*h,a=R()*TAU,l=6+R()*18;
  c.strokeStyle=R()<0.62?'rgba(255,255,240,0.22)':'rgba(110,130,60,0.08)';c.lineWidth=0.5+R()*1.1;
  c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+Math.cos(a+1)*l*0.6,py+Math.sin(a+1)*l*0.6,px+Math.cos(a)*l,py+Math.sin(a)*l);c.stroke();}
}
function paintVeins(c,R,col,ws){
 c.save();c.strokeStyle=col;c.lineCap='round';
 c.lineWidth=7*ws;c.beginPath();c.moveTo(505,590);c.bezierCurveTo(490,420,515,220,498,20);c.stroke();
 for(let i=0;i<9;i++){const y=548-i*58,mx=500+(i%2?3:-3);
  for(const dir of[-1,1]){
   const len=330-i*14,ex=mx+dir*len,ey=y-100-R()*45;
   const c1x=mx+dir*len*0.35,c1y=y-14,c2x=mx+dir*len*0.72,c2y=y-50;
   c.lineWidth=(4.4-i*0.28)*ws;c.beginPath();c.moveTo(mx,y);c.bezierCurveTo(c1x,c1y,c2x,c2y,ex,ey);c.stroke();

    c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+dir*14,py-26,px+dir*(8+R()*26),py-44-R()*26);c.stroke();
    c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+dir*10,py+18,px+dir*(16+R()*20),py+24+R()*14);c.stroke();}
  }}

 g=c.createRadialGradient(500,260,20,500,260,480);g.addColorStop(0,'rgba(255,253,228,0.8)');g.addColorStop(1,'rgba(255,253,228,0)');c.fillStyle=g;c.fillRect(90,30,820,545);

function updEnt(e,dt){
 if(e.busy){e.busyT+=dt;if(e.busyT>10){e.busy=false;}}else e.busyT=0;
 e.moving=false;
 if(e.path){
  const p=e.path;let mv=p.speed*dt;
  while(mv>0&&p.i<p.pts.length){const q=p.pts[p.i],dx=q[0]-e.x,dy=q[1]-e.y,d=Math.hypot(dx,dy);
   if(Math.abs(dx)>0.6)e.face=dx>0?1:-1;
   if(d<=mv){e.x=q[0];e.y=q[1];mv-=d;e.walk+=d;p.i++;}else{e.x+=dx/d*mv;e.y+=dy/d*mv;e.walk+=mv;mv=0;}}
  e.moving=true;
  if(p.i>=p.pts.length){const done=p.done;e.path=null;e.moving=false;if(done)done();}
 }else if(e.track){
  const tr=e.track,dir=Math.sign(tr.to-tr.u);
  if(dir!==0){tr.u+=dir*tr.speed*dt;if((dir>0&&tr.u>=tr.to)||(dir<0&&tr.u<=tr.to))tr.u=tr.to;e.moving=true;}
  const pt=tr.fn(tr.u);const dx=pt[0]-e.x;if(Math.abs(dx)>0.3&&e.moving)e.face=dx>0?1:-1;
  e.walk+=Math.hypot(dx,pt[1]-e.y);e.x=pt[0];e.y=pt[1];
  if(tr.u===tr.to&&tr.done){const d=tr.done;tr.done=null;d();}
 }else if(e.anchor){
  const pt=e.anchor();const k=Math.min(1,dt*14);e.x+=(pt[0]-e.x)*k;e.y+=(pt[1]-e.y)*k;
 }
 if(e.joy>0)e.joy=Math.max(0,e.joy-dt*0.9);
 if(e.wob>0)e.wob=Math.max(0,e.wob-dt*2);
 if(e.hug>0)e.hug=Math.max(0,e.hug-dt*0.7);
 if(e.peek>0)e.peek=Math.max(0,e.peek-dt*0.5);
 e.blink-=dt;if(e.blink<-0.13)e.blink=rnd(1.5,4.5);
 if(e.lookT>0){e.lookT-=dt;if(e.lookT<=0)e.look=null;}
}

function tickSnail(dt){
 const sn=snail;
 if(sn.st==='none'){
  if(G.snailRoll&&(G.form==='roof'||G.form==='bridge')&&G.act==='shadow'){
   sn.st='arrive';sn.use=G.form;sn.x=985;sn.y=600;sn.trail=[];
   const pts=sn.use==='roof'?[[700,600],[712,462],[620,382]]:[[905,600],[900,110],[870,96]];
   go(sn,pts,22,'crawl',()=>{sn.st='build';sn.bt=0;sChime(9);});logEv('snailCome');
  }
  return;
 }
 sn.trail.unshift([sn.x,sn.y]);if(sn.trail.length>40)sn.trail.pop();
 if(sn.st==='build'){sn.bt+=dt;if(sn.bt>2.6){sn.st='ride';discover('snail',sn.use);
   const down=sn.use==='roof'?[[712,462],[720,606]]:[[900,110],[905,606]];go(sn,down,30,'crawl',()=>{sn.st='cruise';sn.dir=-1;});}}
 if(sn.st==='cruise'&&!sn.path){
  const tx=sn.dir<0?140:880;sn.dir*=-1;go(sn,[[tx,606]],14,'crawl',null);
 }
 if(sn.st==='cruise'&&!sn.rider){const near=[rab].find(e=>e.mode==='free'&&!e.busy&&Math.abs(e.x-sn.x)<40&&G.act==='shadow');
  if(near){sn.rider=near;near.busy=true;near.mode='snail';settle(near,()=>[snail.x,snail.y-30]);near.joy=1;sChime(12);
   after(7,()=>{if(sn.rider===near){sn.rider=null;near.mode='move';jump(near,clamp(near.x,140,860),598,30,()=>{near.mode='free';near.busy=false;});}});}}
 if(sn.chimeT>0)sn.chimeT-=dt;
}
function snailChime(){if(snail.st==='cruise'||snail.st==='ride'||snail.st==='build'){if(snail.chimeT<=0){snail.chimeT=0.35;sChime(10+((Math.random()*3)|0));}}}

function gondPos(i,useT){const a=(useT?SP.wheel.t:SP.wheel.x)+i*TAU/6+PI/2;return[650+165*Math.cos(a),300+165*Math.sin(a)];}

function bottomIndex(){for(let i=0;i<6;i++){let a=(SP.wheel.x+i*TAU/6)%TAU;if(a<0)a+=TAU;if(a<0.1||a>TAU-0.1)return i;}return -1;}
function rotateToTop(i){let th=(SP.wheel.t+i*TAU/6+PI/2)%TAU;if(th<0)th+=TAU;let d=(1.5*PI-th)%TAU;if(d<0)d+=TAU;SP.wheel.t+=d;return d;}

function tickPark(dt){
 [bird,rab].forEach(e=>{if(e.mode==='wait'&&!e.path)e.waitT+=dt;});
 const settled=Math.abs(SP.wheel.v)<0.15&&Math.abs(SP.wheel.t-SP.wheel.x)<0.03;
 if(settled&&!G.concertPending){const bi=bottomIndex();if(bi>=0&&!riderOn(bi)){const c=[bird,rab].filter(e=>e.mode==='wait'&&!e.path&&!e.busy&&e.waitT>1.1).sort((a,b)=>b.waitT-a.waitT)[0];if(c)board(c,bi);}}

// ================================================================ guidance
let GT={i:'bell',s:0};
function guideTarget(){
 const d=G.disc,f=G.form;
 if(G.act==='shadow'){
  if(G.ready)return{i:'drum',s:0};
  if(!d.ears)return{i:'bell',s:0};
  if(items.drum.st==='lost'){if(f==='stairs')return{i:'xylo',s:1};return{i:'drum',s:0};}
  if(items.bell.st==='lost'){if(G.last==='bell'&&G.earLv>0)return{i:'drum',s:0};return{i:'bell',s:0};}
  if(items.xylo.st==='lost'){const sd=items.xylo.spot==='up'?1:-1;if(bird.mode==='ear'||bird.mode==='bridge'||f==='stairs')return{i:'xylo',s:sd};if(sd<0&&rab.mode==='free')return{i:'xylo',s:-1};return{i:'bell',s:0};}
  if(!d.slide)return(bird.mode==='ear'||bird.mode==='bridge')?{i:'xylo',s:1}:{i:'bell',s:0};
  if(!d.foldUp)return{i:'xylo',s:1};
  if(!d.lightPath)return G.fUpLv>0?{i:'bell',s:0}:{i:'xylo',s:1};
  if(!d.roof)return G.last==='drum'?{i:'bell',s:0}:{i:'drum',s:0};
  if(!d.tilt)return f==='stairs'?{i:'xylo',s:-1}:{i:'drum',s:0};
  if(!d.foldDown)return{i:'xylo',s:-1};
  if(!d.bridge)return G.last==='bell'?{i:'drum',s:0}:{i:'bell',s:0};
  const lag=KL.slice().sort((a,b)=>(a.practice||0)-(b.practice||0))[0];
  return{i:lag===KB.shy?'bell':lag===KB.strong?'drum':'xylo',s:1};
 }
 if(G.act==='park'){
  const br=bird.mode==='ride',rr=rab.mode==='ride';
  if(!d.wheel)return{i:'drum',s:0};
  if(!d.highBridge)return br?{i:'bell',s:0}:{i:'drum',s:0};
  if(!d.lowPass)return rr?{i:'bell',s:0}:(br&&!d.change?{i:'xylo',s:1}:{i:'drum',s:0});
  if(!d.change)return(br||rr)?{i:'xylo',s:1}:{i:'drum',s:0};
  if(!G.rideDone)return(br||rr)?{i:'xylo',s:1}:{i:'bell',s:0};
  const order=['drum','bell','xylo'];const j=(order.indexOf(G.last)+1)%3;return{i:order[j],s:1};
 }
 const order=['bell','xylo','drum'];const j=(order.indexOf(G.last)+1)%3;return{i:order[j],s:G.lastSide>0?-1:1};
}

function update(dt){

 for(const key in SP){const v=SP[key];if(Array.isArray(v))v.forEach(s=>s.step(dt));else v.step(dt);}
 SP.vein.t=0;
 tickTimers(dt);
 for(const e of ENTS)updEnt(e,dt);
 for(let j=FLY.length-1;j>=0;j--){updEnt(FLY[j],dt);if(FLY[j].dead)FLY.splice(j,1);}
 for(let j=nuts.length-1;j>=0;j--){const n=nuts[j];n.x+=n.vx*dt;n.vx*=1-dt*(n.off?0.2:1.6);n.rot+=n.vx*dt/n.r;
  if(n.home&&Math.abs(n.x-520)<14){nuts.splice(j,1);continue;}
  if(n.x<60||n.x>940){n.fade-=dt*3;if(n.fade<=0){nuts.splice(j,1);continue;}}
  if(!n.off){if(n.x<120){n.x=120;n.vx=Math.abs(n.vx)*0.3;}if(n.x>880){n.x=880;n.vx=-Math.abs(n.vx)*0.3;}}}
 updParts(dt);
 G.hbGlow=Math.max(0,G.hbGlow-dt*0.7);G.lpGlow=Math.max(0,G.lpGlow-dt*0.7);G.slideRip=Math.max(0,G.slideRip-dt*0.8);
 if(G.treeWave>=0){G.treeWave+=dt;if(G.treeWave>2)G.treeWave=-1;}
 if(G.act==='shadow'){G.flip=1;G.open=0;tickShadow(dt);}
 else if(G.act==='reveal'){const t=G.actT;G.flip=Math.cos(PI*seg(t,0,1.4));G.open=sm(seg(t,1.2,3.0));G.giantFade=t<1.4?1:0;

 else if(G.act==='park')tickPark(dt);
 else if(G.act==='concert'){tickPark(dt);tickConcert();}
 else if(G.act==='closing')tickClosing();
 if(snail.st!=='none'&&G.act!=='shadow')tickSnail(dt);
 GT=guideTarget();
 // wordless demo: a little kobito hand shows which instrument to touch
 if(G.idle>=4&&(G.act!=='reveal'&&G.act!=='closing')){
  const ph=(G.idle-4)%4.5;const press=(ph>0.95&&G.demoPrev<=0.95)||(ph>1.45&&G.demoPrev<=1.45);

   if(G.idle>=10&&!G.nudged){G.nudged=true;sTick();}}

 }else G.demoPrev=-1;
}

function draw(){

 // items not in kobito hands

  if(it.st==='lost'){const tw=0.5+0.5*Math.sin(G.t*3+it.x);glow(X,it.x,it.y,24,'rgba(255,230,150,'+(0.35*tw).toFixed(3)+')');if(it===items.bell){X.strokeStyle='rgba(120,90,40,0.6)';X.lineWidth=1.2;line(X,it.x,34,it.x,it.y-10);}}
  drawTiny(X,it.kind,it.x,it.y,1.7);}
 // floor actors sorted by depth
 const floor=[];for(const n of nuts)floor.push({y:n.y,f:()=>{X.globalAlpha=clamp(n.fade,0,1);drawNut(X,n.x,n.y-n.r,n.r,n.rot);X.globalAlpha=1;}});
 if(!(rab.mode==='ride'))floor.push({y:rab.y,f:()=>drawRabbit(X,rab)});
 for(const k of KL)if(k.layer==='front')floor.push({y:k.y,f:()=>drawKobito(X,k,false)});
 if(snail.st!=='none')floor.push({y:snail.y,f:()=>drawSnail(X)});
 floor.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 for(const f of FLY)drawNut(X,f.x,f.y,9,G.t*4);
 // frame
 X.setTransform(1,0,0,1,0,0);X.drawImage(tFront,0,0);
 TH();drawDeco(X);
 // instruments
 X.setTransform(DPR,0,0,DPR,0,0);
 drawGuideGlow();drawBell();drawDrum();drawXylo();

 TH();
 if(bird.mode!=='ride')drawBird(X,bird);
 for(const it of IL)if(it.st==='fly')drawTiny(X,it.kind,it.x,it.y,1.7);
 drawParts('t');
 X.setTransform(DPR,0,0,DPR,0,0);
 drawDemoHand();
}
const Z0={trees:0,wheel:0,slide:0,stage:0};
const ONE={trees:1,wheel:1,slide:1,stage:1};
function pops(){
 const t=G.actT;
 if(G.act==='shadow')return Z0;
 if(G.act==='reveal')return{trees:backOut(seg(t,2.6,4.0)),wheel:sm(seg(t,2.6,3.8)),slide:backOut(seg(t,3.0,4.2)),stage:backOut(seg(t,3.2,4.4))};
 if(G.act==='closing'){const q=1-sm(seg(t,0,1.5));return{trees:q,wheel:q,slide:q,stage:q};}
 return ONE;
}

// ================================================================ loop / lifecycle
let raf=0,lastT=0,paused=false,resizePending=false;
function frame(now){
 raf=requestAnimationFrame(frame);
 if(resizePending){resizePending=false;layout();}
 let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=0;if(dt>0.1)dt=0.1;
 const n=Math.max(1,Math.ceil(dt/(1/60)));const h=dt/n;for(let j=0;j<n;j++)update(h);
 draw();
}
function start(){if(raf||paused)return;lastT=performance.now();raf=requestAnimationFrame(frame);}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();A.suspend();}else{A.resume();start();}});
window.addEventListener('pagehide',()=>{stop();A.suspend();});
window.addEventListener('pageshow',()=>{if(!document.hidden){A.resume();start();}});
window.addEventListener('resize',()=>{resizePending=true;if(!raf)layout(),draw();});
window.addEventListener('orientationchange',()=>{resizePending=true;setTimeout(()=>{resizePending=true;},250);});
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointerup',()=>A.init(),{passive:true});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));

const sv=loadSave();G.deco=sv.deco;G.cycles=sv.cycles;
if(/[?&]snail/.test(location.search))G.forceSnail=true;
layout();setupCycle(true);update(1/60);draw();start();

window.__gf={G,SP,bird,rab,KB,items,lantern,snail,nuts,
 tap:(i,s,k)=>play(i,s||0,k),
 step:(sec)=>{const n=Math.round(sec*60);for(let j=0;j<n;j++)update(1/60);draw();},
 pause:()=>{paused=true;stop();},resume:()=>{paused=false;start();},
 rects:()=>({bell:Object.assign({},I.bell),drum:Object.assign({},I.drum),xylo:Object.assign({},I.xylo),theatre:{x:OX,y:OY,s:S},W,H}),
 guide:()=>Object.assign({},GT),
 state:()=>({act:G.act,form:G.form,earLv:G.earLv,puffLv:G.puffLv,fUp:G.fUpLv,fDn:G.fDnLv,tilt:+SP.tilt.t,lantern:lantern.st,lightLv:G.lightLv,
  bird:{mode:bird.mode,role:bird.role,x:Math.round(bird.x),y:Math.round(bird.y),busy:bird.busy},rab:{mode:rab.mode,x:Math.round(rab.x),y:Math.round(rab.y),busy:rab.busy,nut:rab.nut},
  items:{bell:items.bell.st,drum:items.drum.st,xylo:items.xylo.st,xspot:items.xylo.spot},kob:KL.map(k=>k.kind+':'+k.layer+(k.has?'+':'')),ready:G.ready,subs:subCount(),
  disc:Object.assign({},G.disc),wheelTurns:G.wheelTurns,parkTaps:G.parkTaps,cTaps:G.cTaps,cycle:G.cycle,deco:G.deco.slice(),snail:snail.st,parts:parts.length}),
 forceSnail:()=>{G.snailRoll=true;G.forceSnail=true;},
 log:()=>G.log.slice()};
})();
</script>
