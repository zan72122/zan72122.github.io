/* =========================================================
   ぐるりん！ねむねむくまの、おふとんすごろく
   - quilt is a deformable mesh (WebGL, 2D fallback)
   - path nodes live on the fabric; roll-overs gather ridges,

const TAU=Math.PI*2, PI=Math.PI;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const eOut=t=>1-(1-t)*(1-t);
const eInOut=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const eBack=t=>{const c=1.5;t-=1;return 1+(c+1)*t*t*t+c*t*t;};
function mkRng(s){let a=s>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
let R=mkRng(((Date.now()&0x7fffffff)^((Math.random()*1e9)|0))>>>0);

const SKEY='gf261029-2-futon-v1';
function freshMem(){return{v:1,rounds:0,seed:(Math.random()*997)|0,fav:null,lastRide:null,lastMain:null,lastFlower:false,lastBand:null,counts:{star:0,fish:0,flower:0,berry:0,cloud:0,moon:0},found:{}};}
let mem=freshMem(),memState='fresh';
function loadMem(){
  try{
    const s=window.localStorage.getItem(SKEY);
    if(!s){memState='empty';return;}
    const o=JSON.parse(s);
    if(!o||typeof o!=='object'||o.v!==1)throw new Error('bad');
    const m=freshMem();
    m.rounds=Number.isFinite(o.rounds)?clamp(o.rounds|0,0,99999):0;
    m.seed=Number.isFinite(o.seed)?Math.abs(o.seed|0)%997:m.seed;
    if(PATS.indexOf(o.fav)>=0)m.fav=o.fav;
    if(['slide','table','tramp'].indexOf(o.lastRide)>=0)m.lastRide=o.lastRide;
    if(['slide','table','tramp'].indexOf(o.lastMain)>=0)m.lastMain=o.lastMain;
    m.lastFlower=!!o.lastFlower;
    if(o.counts&&typeof o.counts==='object')for(const k in m.counts){const v=o.counts[k];if(Number.isFinite(v))m.counts[k]=clamp(v|0,0,1e6);}
    if(o.found&&typeof o.found==='object')for(const k in o.found)if(o.found[k]===true)m.found[k]=true;
    mem=m;memState='loaded';
  }catch(e){mem=freshMem();memState='corrupt';}
}
function saveMem(){try{window.localStorage.setItem(SKEY,JSON.stringify(mem));memState='saved';}catch(e){memState='save-refused';}}
function found(k){if(!mem.found[k]){mem.found[k]=true;log('found',{k});saveMem();}}

/* ---------------- audio ---------------- */
const NOTE=i=>{const st=[0,2,4,7,9];const o=Math.floor(i/5),r=((i%5)+5)%5;return 523.25*Math.pow(2,o+st[r]/12);};
const Snd={c:null,m:null,nb:null,
  init(){
    if(this.c){if(this.c.state!=='running'){try{this.c.resume();}catch(e){}}return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{this.c=new AC();}catch(e){this.c=null;return;}
    const c=this.c;
    try{
      const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.25;
      this.m=c.createGain();this.m.gain.value=0.62;this.m.connect(comp);comp.connect(c.destination);
      const len=c.sampleRate|0;const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;
      const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);
    }catch(e){}
    if(c.state!=='running'){try{c.resume();}catch(e){}}
    log('audio-init',{state:c.state});
  },
  ok(){return !!(this.c&&this.c.state==='running'&&this.m);},
  osc(type,f,t,dur,vol,f2,dest){const c=this.c,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*0.85);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.012,dur*0.25));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||this.m);o.start(t);o.stop(t+dur+0.05);return o;},
  bell(f,t,vol){this.osc('sine',f,t,1.0,vol);this.osc('sine',f*2.01,t,0.5,vol*0.32);this.osc('sine',f*3.02,t,0.25,vol*0.12);this.osc('triangle',f*4,t,0.04,vol*0.05);},
  noise(t,dur,vol,ft,f,q,f2,dest){const c=this.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;s.loop=true;fl.type=ft;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q||0.8;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.06,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest||this.m);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);},
  sfx(name,a){
    if(!this.ok())return;
    try{
      const t=this.c.currentTime+0.005;a=a||0;
      switch(name){
        case 'press':this.noise(t,0.12,0.10,'lowpass',900);this.bell(NOTE(3+a),t,0.05);this.bell(NOTE(8+a)*1.01,t+0.03,0.03);break;
        case 'roll':for(let i=0;i<5;i++)this.bell(NOTE(2+a+i),t+i*0.085,0.07);this.noise(t,0.5,0.03,'bandpass',3000,1);break;
        case 'nudge':this.bell(NOTE(1),t,0.04);break;
        case 'pof':this.noise(t,0.16,0.20,'lowpass',480);this.osc('sine',150,t,0.14,0.18,70);break;
        case 'pip':this.bell(NOTE(6+a),t,0.07);break;
        case 'star':[7,9,11,12].forEach((n,i)=>this.bell(NOTE(n+a),t+i*0.07,0.07));break;
        case 'fish':this.osc('sine',500,t,0.1,0.13,1100);this.osc('sine',700,t+0.12,0.1,0.11,1500);break;
        case 'flower':[2,4,7].forEach((n,i)=>this.osc('triangle',NOTE(n),t+i*0.04,0.7,0.06));this.noise(t,0.4,0.03,'highpass',3000);break;
        case 'berry':this.osc('sine',220,t,0.28,0.15,560);this.noise(t,0.26,0.05,'bandpass',800,1,2200);break;
        case 'cloudS':this.osc('sine',300,t,0.12,0.11,430);this.osc('sine',430,t+0.1,0.14,0.08,300);break;
        case 'cloudB':this.osc('sine',240,t,0.6,0.13,820);[5,7,9,10].forEach((n,i)=>this.bell(NOTE(n),t+0.1+i*0.08,0.05));this.noise(t,0.6,0.04,'bandpass',1200,0.6,3000);break;
        case 'moon':[4,2,0].forEach((n,i)=>this.osc('triangle',NOTE(n),t+i*0.32,0.5,0.07));break;
        case 'mumble':{const f=this.c.createBiquadFilter();f.type='bandpass';f.frequency.value=850;f.Q.value=2.5;const g=this.c.createGain();g.gain.value=1;f.connect(g);g.connect(this.m);
          const o=this.c.createOscillator(),og=this.c.createGain();o.type='sawtooth';const b=a?190:165;o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b*1.25,t+0.18);o.frequency.linearRampToValueAtTime(b*0.95,t+0.36);o.frequency.linearRampToValueAtTime(b*(a?1.35:1.1),t+0.6);
          og.gain.setValueAtTime(0.0001,t);og.gain.exponentialRampToValueAtTime(0.07,t+0.05);og.gain.setValueAtTime(0.07,t+0.15);og.gain.exponentialRampToValueAtTime(0.02,t+0.25);og.gain.exponentialRampToValueAtTime(0.07,t+0.35);og.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
          o.connect(og);og.connect(f);o.start(t);o.stop(t+0.75);break;}
        case 'rustle':this.noise(t,a||1.2,0.07,'bandpass',2400,0.7,1400);this.noise(t+0.1,(a||1.2)*0.8,0.05,'lowpass',500);break;
        case 'bridge':for(let i=0;i<8;i++)this.bell(NOTE(4+i),t+i*0.05,0.05);break;
        case 'stitch':this.noise(t,0.03,0.06,'highpass',4000);break;
        case 'squeak':this.osc('sine',1700,t,0.07,0.06,2300);this.osc('sine',1900,t+0.09,0.07,0.05,2500);break;
        case 'chirp':this.osc('sine',2000,t,0.06,0.06,2900);this.osc('sine',2200,t+0.09,0.07,0.06,3100+a*80);break;
        case 'sneezeIn':this.noise(t,0.7,0.05,'bandpass',1200,1,2600);break;
        case 'sneeze':this.noise(t,0.38,0.26,'lowpass',3200,0.7,600);this.osc('sine',420,t,0.28,0.11,180);break;
        case 'success':[5,7,9,10,12].forEach((n,i)=>this.bell(NOTE(n),t+i*0.09,0.07));[0,4,7].forEach(n=>this.osc('triangle',NOTE(n)/2,t+0.45,1.0,0.05));break;
        case 'whoosh':this.noise(t,0.8,0.09,'bandpass',500,1.2,2600);this.osc('sine',900,t,0.7,0.04,300);break;
        case 'munch':for(let i=0;i<3;i++)this.noise(t+i*0.14,0.07,0.11,'lowpass',1300);break;
        case 'yawn':{const f=this.c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.connect(this.m);this.osc('sawtooth',320,t,1.0,0.05,150,f);break;}
        case 'pop':this.osc('sine',800,t,0.05,0.09,1700);break;
        case 'breath':this.noise(t,1.3,0.022,'lowpass',380);break;
        case 'tap':this.noise(t,0.08,0.07,'lowpass',700);this.osc('sine',210,t,0.07,0.05,120);break;
        case 'wave':this.noise(t,0.7,0.06,'bandpass',500,0.6,1100);this.osc('sine',520,t+0.1,0.1,0.08,1000);break;
        case 'giggle':for(let i=0;i<4;i++)this.osc('triangle',330+i*25,t+i*0.11,0.09,0.06,300);break;
        case 'lift':this.noise(t,0.22,0.05,'bandpass',1600,1,2600);this.bell(NOTE(4+a),t,0.04);break;
        case 'twinkle':this.bell(NOTE(9+a),t,0.06);break;
        case 'snort':this.noise(t,0.18,0.09,'lowpass',380,1,200);break;
      }
    }catch(e){}
  }
};

/* ---------------- canvases / view ---------------- */
const cBG=document.getElementById('bg'),cGL=document.getElementById('gl'),cFG=document.getElementById('fg');
const bx=cBG.getContext('2d'),fx=cFG.getContext('2d');
const V={W:1,H:1,dpr:1,S:1,ox:0,oy:0,land:false,safe:{t:0,r:0,b:0,l:0}};
const D={x:0,y:0,s:40,rx:-0.35,ry:0.45,press:0,pressT:0,pressId:null,rolling:false,t0:0,val:1,fromR:[0,0],toR:[0,0],pipHi:0,wob:0,wobT:-9,show:1,glow:0};
function readSafe(){const el=document.getElementById('sa');const cs=getComputedStyle(el);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function proj(x,y,z){return [V.ox+x*V.S,V.oy+(y*CA-z*SA)*V.S];}
function layout(){
  const W=Math.max(1,window.innerWidth),H=Math.max(1,window.innerHeight);
  V.W=W;V.H=H;V.dpr=Math.min(2,window.devicePixelRatio||1);V.safe=readSafe();
  const s=V.safe,aw=W-s.l-s.r,ah=H-s.t-s.b;
  const qh=QH*CA;
  V.land=aw/ah>1.0;
  if(!V.land){
    const needW=640,needH=200+qh+190;
    const S=Math.min(aw/needW,ah/needH);V.S=S;
    const extra=ah-needH*S;
    V.ox=s.l+aw/2-300*S;V.oy=s.t+extra*0.3+200*S;
    const below=(s.t+ah)-(V.oy+qh*S);
    D.s=clamp(Math.min(below*0.30,72*S),30,90);
    D.x=V.ox+300*S;D.y=V.oy+qh*S+below*0.5;
  }else{
    const needW=640+300,needH=200+qh+30;
    const S=Math.min(aw/needW,ah/needH);V.S=S;
    V.ox=s.l+(aw-needW*S)/2+20*S;V.oy=s.t+(ah-needH*S)/2+200*S;
    D.s=clamp(70*S,30,92);
    D.x=V.ox+(600+160)*S;D.y=V.oy+qh*S*0.62;
  }
  for(const c of [cBG,cFG]){c.width=Math.round(W*V.dpr);c.height=Math.round(H*V.dpr);}
  cGL.width=Math.round(W*V.dpr);cGL.height=Math.round(H*V.dpr);
  drawBG();
  log('layout',{W,H,land:V.land,S:+V.S.toFixed(3)});
}

/* ---------------- layout (path on the quilt) ---------------- */
const TEMPL=[
 {r1:['star','fish','plain','berry','flower'],t1:'cloud',s0:'plain',up:['star','plain'],dn:['fish','plain'],rj:'moon',r2e:'plain',t2:'plain',r3:['berry','plain','cloud','flower','star'],t3:'plain',r4:['fish','moon','plain','berry','plain'],fin:'cloud'},
 {r1:['flower','berry','plain','star','fish'],t1:'plain',s0:'cloud',up:['fish','plain'],dn:['star','plain'],rj:'moon',r2e:'berry',t2:'plain',r3:['plain','star','cloud','fish','flower'],t3:'plain',r4:['berry','moon','plain','star','cloud'],fin:'plain'},
 {r1:['fish','star','berry','plain','flower'],t1:'cloud',s0:'plain',up:['star','plain'],dn:['fish','plain'],rj:'moon',r2e:'plain',t2:'flower',r3:['plain','berry','cloud','star','fish'],t3:'plain',r4:['moon','plain','fish','star','cloud'],fin:'plain'},
 {r1:['berry','star','flower','plain','fish'],t1:'cloud',s0:'plain',up:['fish','plain'],dn:['star','plain'],rj:'moon',r2e:'plain',t2:'plain',r3:['star','plain','flower','cloud','berry'],t3:'plain',r4:['fish','plain','moon','star','plain'],fin:'cloud'}
];
let L=null;
function makeLayout(round){
  const lr=mkRng(round*7919+mem.seed*13+5);
  const T=JSON.parse(JSON.stringify(TEMPL[(round+mem.seed)%TEMPL.length]));
  if(lr()<0.5){const x=T.up;T.up=T.dn;T.dn=x;}
  const mir=(round%2)===1;
  const nodes=[],edges=[];
  const A=(u,v,type)=>{nodes.push({id:nodes.length,u:mir?QW-u:u,v,type});return nodes.length-1;};
  const ph=lr()*6;const w=(i,amp)=>Math.sin(i*1.9+ph)*amp;
  const s=A(66,582,'start');
  const r1=T.r1.map((ty,i)=>A(154+i*90,576+w(i,9),ty));
  const t1=A(556,503,T.t1);
  const s0=A(496,434,T.s0);
  const u1=A(408,404,T.up[0]),u2=A(318,400,T.up[1]);
  const d1=A(408,464,T.dn[0]),d2=A(318,468,T.dn[1]);
  const rj=A(226,434,T.rj),r2e=A(136,432+w(3,6),T.r2e);
  const t2=A(56,359,T.t2);
  const r3=T.r3.map((ty,i)=>A(100+i*101,287+w(i+4,9),ty));
  const t3=A(550,213,T.t3);
  const r4=T.r4.map((ty,i)=>A(498-i*100,142+w(i+8,8),ty));
  const fin=A(178,70,T.fin);
  const goal=A(298,64,'goal');
  const E=(a,b,k)=>{const P=nodes[a],Q=nodes[b];const mx=(P.u+Q.u)/2,my=(P.v+Q.v)/2;const dx=Q.u-P.u,dy=Q.v-P.v;const l=Math.hypot(dx,dy)||1;const kk=(k!=null?k:(lr()*2-1)*10);edges.push({a,b,kind:'path',cu:mx-dy/l*kk,cv:my+dx/l*kk});};
  const chain=a=>{for(let i=0;i<a.length-1;i++)E(a[i],a[i+1]);};
  chain([s,...r1,t1,s0]);
  chain([s0,u1,u2,rj]);chain([s0,d1,d2,rj]);
  chain([rj,r2e,t2,...r3,t3,...r4,fin,goal]);
  // route index
  const idx=new Array(nodes.length).fill(-1);idx[s]=0;
  let changed=true;while(changed){changed=false;for(const e of edges){if(idx[e.a]>=0&&idx[e.b]<idx[e.a]+1){idx[e.b]=idx[e.a]+1;changed=true;}}}
  const bands=[{c:503,slope:(lr()-.5)*0.07},{c:358,slope:(lr()-.5)*0.07},{c:213,slope:(lr()-.5)*0.07}];
  const recLane=(round%2===0)?u1:d1;
  return{nodes,edges,start:s,goal,idx,bands,mirror:mir,split:s0,lanes:[u1,d1],recLane,T};
}

function flatPlan(){return{dir:0,tiltX:0,tiltY:0,bump:{x:300,y:175,h:34,sx:165,sy:150},ridge:null,flapL:0,flapR:0,flapT:0,pins:[],extra:[]};}
let PLAN=flatPlan();
const BL={from:null,k:1,t0:0,dur:1,kind:'back'};
function clonePlan(p){return JSON.parse(JSON.stringify(p));}
function startBlend(np,dur,kind){
  if(BL.from&&BL.k<1){/* mid-blend: settle from current target */}
  BL.from=clonePlan(PLAN);PLAN=np;BL.t0=G.t;BL.dur=dur;BL.k=0;BL.kind=kind||'back';
}
function updBlend(){
  if(!BL.from){BL.k=1;return;}
  const r=(G.t-BL.t0)/BL.dur;
  if(r>=1){BL.from=null;BL.k=1;return;}
  BL.k=BL.kind==='back'?eBack(r):eInOut(r);

  c.fillStyle='#fbe9dc';c.fillRect(0,0,QW,QH);
  const kinds=['dots','gingham','flowers','stripes','hearts','seed','dots','check'];
  for(let row=0;row<7;row++)for(let col=0;col<6;col++){
    const x=col*100,y=row*PH;const color=PAL[(r()*PAL.length)|0];const kind=kinds[(r()*kinds.length)|0];
    c.save();c.beginPath();c.rect(x,y,100,PH);c.clip();c.fillStyle=color;c.fillRect(x,y,100,PH);
    patchPattern(c,kind,x,y,100,PH,r);
    const g=c.createRadialGradient(x+50,y+PH/2,8,x+50,y+PH/2,72);g.addColorStop(0,'rgba(255,255,255,0.16)');g.addColorStop(1,'rgba(120,60,60,0.16)');c.fillStyle=g;c.fillRect(x,y,100,PH);
    c.restore();
    c.setLineDash([5,4]);c.strokeStyle='rgba(255,255,255,0.8)';c.lineWidth=1.3;c.strokeRect(x+7,y+7,86,PH-14);c.setLineDash([]);
  }
  c.strokeStyle='rgba(140,80,80,0.35)';c.lineWidth=2;c.beginPath();
  for(let i=1;i<6;i++){c.moveTo(i*100,0);c.lineTo(i*100,QH);}for(let j=1;j<7;j++){c.moveTo(0,j*PH);c.lineTo(QW,j*PH);}c.stroke();
  c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=1;c.beginPath();for(let i=1;i<6;i++){c.moveTo(i*100+1.5,0);c.lineTo(i*100+1.5,QH);}for(let j=1;j<7;j++){c.moveTo(0,j*PH+1.5);c.lineTo(QW,j*PH+1.5);}c.stroke();
  // binding
  c.lineWidth=16;c.strokeStyle='#ee8fa6';c.strokeRect(8,8,QW-16,QH-16);
  c.lineWidth=1.4;c.setLineDash([5,4]);c.strokeStyle='#fff6f0';c.strokeRect(8,8,QW-16,QH-16);c.setLineDash([]);

function patchPattern(c,kind,x,y,w,h,r){
  const tone='rgba(255,255,255,0.75)',dark='rgba(120,70,90,0.18)';
  if(kind==='dots'){c.fillStyle=tone;for(let j=0;j<7;j++)for(let i=0;i<7;i++){c.beginPath();c.arc(x+8+i*15+(j%2)*7,y+6+j*14,2.8,0,TAU);c.fill();}}
  else if(kind==='gingham'){c.fillStyle=dark;for(let i=0;i<7;i++){c.fillRect(x+i*16,y,8,h);c.fillRect(x,y+i*16,w,8);}}
  else if(kind==='flowers'){for(let k=0;k<9;k++){const px=x+10+r()*80,py=y+10+r()*(h-20);c.fillStyle=r()<.5?'#fff':'#ff9fbf';for(let p=0;p<5;p++){const a=p*TAU/5;c.beginPath();c.arc(px+Math.cos(a)*3,py+Math.sin(a)*3,2.2,0,TAU);c.fill();}c.fillStyle='#ffd34d';c.beginPath();c.arc(px,py,1.6,0,TAU);c.fill();}}
  else if(kind==='stripes'){c.strokeStyle=tone;c.lineWidth=4;c.beginPath();for(let i=-6;i<12;i++){c.moveTo(x+i*14,y);c.lineTo(x+i*14+h,y+h);}c.stroke();}
  else if(kind==='hearts'){c.fillStyle='rgba(255,120,150,0.45)';for(let j=0;j<5;j++)for(let i=0;i<5;i++){c.save();c.translate(x+10+i*20+(j%2)*10,y+10+j*18);heartPath(c,4);c.fill();c.restore();}}
  else if(kind==='seed'){c.strokeStyle='rgba(255,255,255,0.8)';c.lineWidth=1.2;c.beginPath();for(let k=0;k<26;k++){const px=x+5+r()*90,py=y+5+r()*(h-10),a=r()*PI;c.moveTo(px,py);c.lineTo(px+Math.cos(a)*4,py+Math.sin(a)*4);}c.stroke();}
  else if(kind==='check'){c.fillStyle=dark;for(let j=0;j<6;j++)for(let i=0;i<6;i++)if((i+j)%2)c.fillRect(x+i*17,y+j*17,17,17);}
}
function edgePts(e,n){const a=L.nodes[e.a],b=L.nodes[e.b];const pts=[];for(let i=0;i<=n;i++){const t=i/n,m=1-t;pts.push([m*m*a.u+2*m*t*e.cu+t*t*b.u,m*m*a.v+2*m*t*e.cv+t*t*b.v]);}return pts;}
function strokePts(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();}
function offsetPts(pts,d){const o=[];for(let i=0;i<pts.length;i++){const p=pts[Math.max(0,i-1)],q=pts[Math.min(pts.length-1,i+1)];const dx=q[0]-p[0],dy=q[1]-p[1];const l=Math.hypot(dx,dy)||1;o.push([pts[i][0]-dy/l*d,pts[i][1]+dx/l*d]);}return o;}
function paintTex(){
  const c=texCv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.drawImage(baseCv,0,0);c.setTransform(TS,0,0,TS,0,0);
  // souvenir of last ride (memory)
  if(mem.lastRide){c.save();const sx=L.mirror?60:540,sy=48;c.translate(sx,sy);c.fillStyle='#fff8ee';c.beginPath();c.arc(0,0,20,0,TAU);c.fill();c.setLineDash([2,2]);c.strokeStyle='#d98aa0';c.lineWidth=1.2;c.stroke();c.setLineDash([]);
    if(mem.lastRide==='slide'){['#ff8fa3','#ffc36b','#fff07a','#8fe0a0','#8cc8ff','#c2a6ff'].forEach((col,i)=>{c.strokeStyle=col;c.lineWidth=2.4;c.beginPath();c.arc(0,6,14-i*2.2,PI,TAU);c.stroke();});}
    else if(mem.lastRide==='table'){c.fillStyle='#ffe0b5';c.fillRect(-10,-2,20,10);c.fillStyle='#ff9fb5';c.fillRect(-10,-5,20,4);c.fillStyle='#ef5066';c.beginPath();c.arc(0,-8,3.5,0,TAU);c.fill();}
    else{c.fillStyle='#ffffff';cloudPath(c,13);c.fill();c.strokeStyle='#9cc8e8';c.stroke();}
    c.restore();}
  // ribbons
  const ribbons=L.edges.map(e=>edgePts(e,14));
  c.lineCap='round';c.lineJoin='round';
  for(const p of ribbons){c.strokeStyle='rgba(110,60,50,0.2)';c.lineWidth=32;c.save();c.translate(1.5,2.5);strokePts(c,p);c.restore();}
  for(const p of ribbons){c.strokeStyle='#e9cdb4';c.lineWidth=30;strokePts(c,p);}
  for(const p of ribbons){c.strokeStyle='#fff8ec';c.lineWidth=26;strokePts(c,p);}
  c.setLineDash([4,4]);c.lineWidth=1.6;c.strokeStyle='#e47f9b';
  for(const p of ribbons){strokePts(c,offsetPts(p,9.5));strokePts(c,offsetPts(p,-9.5));}
  c.setLineDash([]);
  for(const n of L.nodes)paintNode(c,n);
  G.texDirty=false;uploadTex();
}
function paintNode(c,n){
  const st=NS[n.id]||{};const m=MOTIF[n.type]||MOTIF.plain;
  c.save();c.translate(n.u,n.v);
  c.fillStyle='rgba(90,40,40,0.22)';c.beginPath();c.arc(1.5,2.5,28,0,TAU);c.fill();
  c.fillStyle=m.felt;c.beginPath();c.arc(0,0,27,0,TAU);c.fill();
  const g=c.createRadialGradient(-8,-10,4,0,0,28);g.addColorStop(0,'rgba(255,255,255,0.25)');g.addColorStop(1,'rgba(80,40,40,0.12)');c.fillStyle=g;c.fill();
  // blanket stitch
  c.strokeStyle=(n.type==='star'||n.type==='moon')?'#ffe9a8':'#d9849c';c.lineWidth=1.3;c.beginPath();
  for(let k=0;k<24;k++){const a=k*TAU/24;c.moveTo(Math.cos(a)*21.5,Math.sin(a)*21.5);c.lineTo(Math.cos(a)*26.5,Math.sin(a)*26.5);}c.stroke();
  c.beginPath();c.arc(0,0,26.5,0,TAU);c.stroke();
  if(n.type==='start'){c.strokeStyle='#a87443';c.lineWidth=3;for(let k=0;k<7;k++){c.beginPath();c.ellipse(0,2,17-k*0.6,10-k*0.4,k*0.4,0,TAU);c.stroke();}c.fillStyle='#fffaf0';c.beginPath();c.ellipse(-6,-2,5,4,0,0,TAU);c.fill();c.beginPath();c.ellipse(6,-1,4,3.4,0,0,TAU);c.fill();}
  else if(n.type==='goal'){c.fillStyle='#ffffff';c.beginPath();c.ellipse(0,3,20,12,0,0,TAU);c.fill();c.setLineDash([2,2]);c.strokeStyle='#ff9fb5';c.stroke();c.setLineDash([]);}
  else if(n.type==='plain'){c.fillStyle='#ffd3dd';c.beginPath();c.arc(0,0,8,0,TAU);c.fill();c.strokeStyle='#c97890';c.lineWidth=1.2;c.stroke();c.fillStyle='#c97890';c.beginPath();c.arc(-2.6,0,1.3,0,TAU);c.arc(2.6,0,1.3,0,TAU);c.fill();
    c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.moveTo(-2.6,0);c.lineTo(2.6,0);c.stroke();}
  else drawMotifEmb(c,n.type,!!st.lifted);
  c.restore();
}

  // wallpaper dots
  c.fillStyle='rgba(255,255,255,0.45)';const sp=Math.max(26,46*S);for(let y=0;y<H;y+=sp)for(let x=((y/sp)%2)*sp/2;x<W;x+=sp){c.beginPath();c.arc(x,y,Math.max(2,4*S),0,TAU);c.fill();}
  c.fillStyle='rgba(255,170,190,0.25)';for(let y=sp/2;y<H;y+=sp*2)for(let x=sp/4;x<W;x+=sp*2){c.save();c.translate(x,y);heartPath(c,Math.max(3,6*S));c.fill();c.restore();}

  c.strokeStyle='rgba(230,140,160,0.45)';c.setLineDash([6,5]);c.lineWidth=2;c.stroke();c.setLineDash([]);

  rr(c,hx0+18*S,hy0+16*S,hx1-hx0-36*S,(qy0-hy0)-10*S,30*S);c.fillStyle='#e8b98f';c.fill();
  // mattress / sheet
  rr(c,qx0,qy0,qx1-qx0,qy1-qy0+18*S,26*S);c.fillStyle='#e6d2c8';c.fill();
  rr(c,qx0,qy0,qx1-qx0,qy1-qy0,26*S);c.fillStyle='#fdfaf6';c.fill();
  c.save();rr(c,qx0,qy0,qx1-qx0,qy1-qy0,26*S);c.clip();c.strokeStyle='rgba(140,180,220,0.35)';c.lineWidth=2*S;for(let x=qx0;x<qx1;x+=14*S){c.beginPath();c.moveTo(x,qy0);c.lineTo(x,qy1);c.stroke();}c.restore();
  // pillow
  const [px,py]=proj(300,-70,0);
  c.save();c.translate(px,py);c.scale(S,S);

  pillowPath(c,0);const pg=c.createRadialGradient(-60,-40,20,0,0,240);pg.addColorStop(0,'#ffffff');pg.addColorStop(1,'#efe4f0');c.fillStyle=pg;c.fill();
  c.setLineDash([6,5]);c.strokeStyle='#e7a7bf';c.lineWidth=2;c.save();c.scale(0.9,0.84);pillowPath(c,0);c.stroke();c.restore();c.setLineDash([]);

function pillowPath(c,o){c.beginPath();c.moveTo(-200+o,-50+o);c.quadraticCurveTo(0,-100+o,200+o,-50+o);c.quadraticCurveTo(225+o,10+o,200+o,70+o);c.quadraticCurveTo(0,110+o,-200+o,70+o);c.quadraticCurveTo(-225+o,10+o,-200+o,-50+o);c.closePath();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------------- graph helpers ---------------- */
function outsOf(id){const r=[];for(const e of L.edges)if(e.a===id)r.push(e);for(const e of DYN)if(e.live&&e.a===id)r.push(e);return r;}
function mainOuts(id){return L.edges.filter(e=>e.a===id);}
function recEdge(id){const o=outsOf(id);if(o.length<=1)return o[0]||null;const d=o.filter(e=>e.kind!=='path');if(d.length)return d[d.length-1];return o.find(e=>e.b===L.recLane)||o[0];}
function nextEdge(id){const o=outsOf(id);if(!o.length)return null;const ch=CHOICE[id];if(ch){const e=o.find(e=>e.b===ch.b&&e.kind===ch.kind);if(e)return e;}return recEdge(id);}
function reachFrom(id){const seen=new Set([id]);const st=[id];while(st.length){const x=st.pop();for(const e of L.edges)if(e.a===x&&!seen.has(e.b)){seen.add(e.b);st.push(e.b);}}return seen;}
function predict(steps){let n=C.node;for(let i=0;i<steps;i++){const e=nextEdge(n);if(!e)break;n=e.b;if(n===L.goal)break;}return n;}
function edgeFlat(e,t){const a=L.nodes[e.a],b=L.nodes[e.b];const m=1-t;return[m*m*a.u+2*m*t*e.cu+t*t*b.u,m*m*a.v+2*m*t*e.cv+t*t*b.v];}
function edgeWorld(e,t,out){
  out=out||[0,0,0];
  if(e.kind==='path'){const f=edgeFlat(e,t);worldOf(f[0],f[1],out);return out;}
  const A=NW[e.a],Bp=NW[e.b];out[0]=lerp(A[0],Bp[0],t);out[1]=lerp(A[1],Bp[1],t);out[2]=lerp(A[2],Bp[2],t)+(e.arch||0)*4*t*(1-t);return out;
}
function bridgeArch(e){const a=L.nodes[e.a],b=L.nodes[e.b];let mz=-99;for(let i=1;i<6;i++){const t=i/6;deform(lerp(a.u,b.u,t),lerp(a.v,b.v,t),T4);if(T4[2]>mz)mz=T4[2];}return Math.max(0,mz-(NW[e.a][2]+NW[e.b][2])/2)+(e.kind==='bridge'?38:10);}

/* ---------------- fold planning ---------------- */
function makePlan(dir,bi,pins){
  const b=bi==null?null:L.bands[bi];
  return{dir,tiltX:dir*0.10,tiltY:-0.02,bump:{x:300+dir*130,y:175,h:42,sx:170,sy:165},
    ridge:b?{c:b.c,slope:b.slope,w:40,aL:dir<0?0.98:0.52,aR:dir<0?0.52:0.98,h:62,bi}:null,
    flapL:dir>0?2.72:0,flapR:dir<0?2.72:0,flapT:0,pins:pins||[],extra:[]};
}
const _o={dx:0,dy:0,dz:0};
function planNodePos(plan){return L.nodes.map(n=>{planDisp(plan,n.u,n.v,_o);return[n.u+_o.dx,n.v+_o.dy,_o.dz];});}
function pairsFor(plan,fromNode){
  const P=planNodePos(plan);const reach=reachFrom(fromNode);const i0=L.idx[fromNode];
  const used=new Set(DYN.filter(e=>e.live).map(e=>e.a));
  const seams=[],bridges=[];
  for(const X of reach){if(X===L.goal||used.has(X))continue;const ah=L.idx[X]-i0;if(ah<0||ah>10)continue;
    for(const Y of L.nodes){const skip=L.idx[Y.id]-L.idx[X];if(skip<3||skip>11||Y.id===X)continue;
      const nx=L.nodes[X];const d0=Math.hypot(nx.u-Y.u,nx.v-Y.v);const d=Math.hypot(P[X][0]-P[Y.id][0],P[X][1]-P[Y.id][1]);
      if(d0-d<34)continue;const sc=skip-0.35*ah-(Math.abs(skip-7)*0.25);
      if(d<66)seams.push({a:X,b:Y.id,d,skip,score:sc});else if(d<178)bridges.push({a:X,b:Y.id,d,skip,score:sc});}}
  seams.sort((p,q)=>q.score-p.score);bridges.sort((p,q)=>q.score-p.score);
  return{seams,bridges};
}
function freeStars(){return STARS.filter(s=>s.state==='stand');}
function bandScore(dir,bi){const pr=pairsFor(makePlan(dir,bi,[]),C.node);let s=-99;if(pr.seams.length)s=Math.max(s,pr.seams[0].score+1.5);if(pr.bridges.length)s=Math.max(s,pr.bridges[0].score+(freeStars().length?2:0));return s;}
function chooseBand(dir){
  const sc=[0,1,2].map(bi=>bandScore(dir,bi));
  let def=0;for(let i=1;i<3;i++)if(sc[i]>sc[def])def=i;
  if(sc[def]<=-99){// nothing useful: fold nearest band ahead
    const cv=L.nodes[C.node].v;let best=0,bd=1e9;for(let i=0;i<3;i++){const d=cv-L.bands[i].c;const dd=d>0?d:1e3-d;if(dd<bd){bd=dd;best=i;}}def=best;}
  const held=new Set(NS.filter(s=>s.active&&s.pinBand!=null).map(s=>s.pinBand));
  let ch=def;
  if(held.has(def)){let bs=-1e9;ch=null;for(let i=0;i<3;i++){if(held.has(i))continue;const v=sc[i]<=-99?-50-Math.abs(i-def):sc[i];if(v>bs){bs=v;ch=i;}}if(ch==null)ch=def;}
  return{chosen:ch,def,scores:sc,held:[...held]};
}
function currentPins(){const pins=[];NS.forEach((s,i)=>{if(s.active&&L.nodes[i].type==='flower'){const n=L.nodes[i];pins.push({x:n.u,y:n.v,r:80});if(s.pinX!=null)pins.push({x:s.pinX,y:s.pinY,r:120});}});return pins;}
function nextDir(){return (G.dir0*(G.rollCount%2===0?1:-1));}

/* ---------------- particles ---------------- */
function part(kind,x,y,z,o){if(PARTS.length>=140)PARTS.shift();const p=Object.assign({kind,x,y,z,vx:(R()-.5)*40,vy:(R()-.5)*40,vz:30+R()*60,life:0,max:1.2,size:6+R()*5,rot:R()*TAU,vr:(R()-.5)*4,col:null,g:60},o||{});PARTS.push(p);return p;}
function burst(kind,x,y,z,n,o){for(let i=0;i<n;i++)part(kind,x,y,z,o);}
function updParts(dt){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life+=dt;if(p.life>p.max){PARTS.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=p.g*dt;p.vx*=0.98;p.vy*=0.98;p.rot+=p.vr*dt;if(p.kind==='bubble'||p.kind==='heart'||p.kind==='cotton'){p.vz=Math.max(p.vz,p.kind==='cotton'?-10:12);}}}

/* ---------------- node state helpers ---------------- */
function resetNodeStates(){NS=L.nodes.map(()=>({active:false,lifted:false,t0:-9,react:-9,pinBand:null,pinX:null,pinY:null,vineT:-9,wave:false,used:false,cushT:-9}));}
function pushHist(type,extra){HIST.push(Object.assign({type,t:G.t},extra||{}));mem.counts[type]=(mem.counts[type]||0)+1;}

/* ---------------- chick movement ---------------- */
function moveC(spec){C.mv=Object.assign({t0:G.t,h:24},spec);C.rest=null;return wait(spec.dur*1000).then(()=>{const m=C.mv;C.mv=null;if(m&&m.endRest)C.rest=m.endRest;});}
function chickWorld(out){
  const m=C.mv;
  if(m&&m.kind==='fn'){const p=m.fn(clamp((G.t-m.t0)/m.dur,0,1));out[0]=p[0];out[1]=p[1];out[2]=p[2];return out;}
  if(m){const k=clamp((G.t-m.t0)/m.dur,0,1);let ke=m.ease==='in'?k*k:m.ease==='lin'?k:eInOut(k);
    if(m.kind==='edge'){edgeWorld(m.edge,m.rev?1-ke:ke,out);out[2]+=m.h*Math.sin(PI*k);}
    else{const a=ptOf(m.a),b=ptOf(m.b);out[0]=lerp(a[0],b[0],ke);out[1]=lerp(a[1],b[1],ke);out[2]=lerp(a[2],b[2],ke)+m.h*Math.sin(PI*k);}
    return out;}
  if(C.rest){out[0]=C.rest[0];out[1]=C.rest[1];out[2]=C.rest[2];return out;}
  const n=NW[C.node]||[0,0,0];out[0]=n[0];out[1]=n[1];out[2]=n[2];
  const bk=G.t-C.braceT;if(bk<1.6){const s=Math.sin(clamp(bk/1.6,0,1)*PI);out[0]+=C.braceDir[0]*14*s;out[1]+=C.braceDir[1]*14*s;}
  return out;
}
function ptOf(a){if(typeof a==='number')return NW[a];if(typeof a==='function')return a();return a;}
async function hopEdge(e){

const FACE_ROT={1:[0,0],2:[0,-PI/2],3:[PI/2,0]};
function nodeValue(id){
  const n=L.nodes[id],s=NS[id];if(!n)return 0;
  if(id===L.goal)return 3.2;
  const t=n.type;const seen=ty=>HIST.some(h=>h.type===ty);
  switch(t){
    case 'star':return(!s.active&&freeStars().length===0)?4:(!s.active?1.5:0.3);
    case 'fish':return !seen('fish')?2.6:(!s.active?1.2:0.4);
    case 'flower':{const want=(G.round%2===0)&&!mem.lastFlower;return !s.active?(want?2.4:0.9):0.2;}
    case 'berry':return !G.cushion?(!seen('berry')?2.6:1.6):0.3;
    case 'cloud':return G.cushion?4.2:(!seen('cloud')?1.3:0.4);
    case 'moon':{const hasSF=HIST.some(h=>h.type==='star'||h.type==='fish');return hasSF&&!s.gift?4:0.8;}
  }
  let v=0;
  if(G.rollCount>0&&waveAt(id))v+=2.2;

}
function chooseDie(){
  if(FORCE.length)return FORCE.shift();
  const sc=[1,2,3].map(d=>{const n=predict(d);let v=nodeValue(n);if(G.rollCount>0&&waveAt(n)&&!mem.found.wave)v+=2.5;
    // passing a branch with a shortcut is good too
    return v+R()*0.9-(d===G.lastD&&d===G.lastD2?2.5:0);});
  let best=0;for(let i=1;i<3;i++)if(sc[i]>sc[best])best=i;
  const v=R()<0.82?best+1:1+((R()*3)|0);
  G.lastD2=G.lastD;G.lastD=v;return v;
}

    const quick=(G.t-G.readyT)<3.2;G.combo=quick?Math.min(G.combo+1,6):0;
    if(GIFT)await resolveGift(true);

    const fr=FACE_ROT[val];const turns=1+((R()*2)|0);D.toR=[fr[0]-0.35+TAU*turns,fr[1]+0.45+TAU*(1+((R()*2)|0))];
    Snd.sfx('roll',G.combo);C.happyT=G.t;C.happy=G.combo;
    await wait(640);
    D.rolling=false;D.rx=D.toR[0]%TAU;D.ry=D.toR[1]%TAU;D.pipHi=0;D.wobT=G.t;
    Snd.sfx('pip',0);

}
async function moveSteps(n){
  for(let i=0;i<n;i++){
    const e=nextEdge(C.node);if(!e)break;
    const outs=outsOf(C.node);
    if(outs.length>1){const hasSc=outs.some(o=>o.kind!=='path');if(e.kind==='path'&&hasSc)C.tiltT=G.t;log('branch',{at:C.node,take:e.kind,to:e.b});}
    D.pipHi=i+1;Snd.sfx('pip',i+1);
    await hopEdge(e);
    if(e.kind==='bridge'){onBridgeCross(e);}
    if(e.kind==='seam'){log('seam-cross',{a:e.a,b:e.b});}
    if(C.node===L.goal)break;
    if(i<n-1)passOver(C.node);
  }
  await arrive(C.node,true);
}
function passOver(id){const n=L.nodes[id];if(PATS.indexOf(n.type)>=0||n.type==='cloud'||n.type==='moon'){NS[id].react=G.t;const w=NW[id];burst('spark',w[0],w[1],w[2]+10,2,{max:0.6});}}
async function arrive(id,chain){
  if(id===L.goal){await goalSeq();return;}
  const ty=L.nodes[id].type;let jump=null;
  if(ty==='star')await actStar(id);
  else if(ty==='fish')await actFish(id);
  else if(ty==='flower')await actFlower(id);
  else if(ty==='berry')await actBerry(id);
  else if(ty==='cloud')jump=await actCloud(id,chain);
  else if(ty==='moon')await actMoon(id);
  if(!chain)return;
  if(jump!=null){await cloudJump(id,jump);await arrive(C.node,false);return;}
  const wv=waveCarry(id);

}

function waveSet(){const set=new Map();NS.forEach((s,i)=>{if((s.active&&L.nodes[i].type==='fish')||s.wave){set.set(i,i);for(const e of L.edges){if(e.a===i)set.set(e.b,i);if(e.b===i)set.set(e.a,i);}}});return set;}

async function updateShortcuts(){
  // existing ones: stretch or let go
  for(const e of DYN){if(!e.live)continue;const d=Math.hypot(NW[e.a][0]-NW[e.b][0],NW[e.a][1]-NW[e.b][1]);
    if((e.kind==='seam'&&d>95)||(e.kind==='bridge'&&d>215)){e.live=false;e.goneT=G.t;log('shortcut-off',{kind:e.kind,a:e.a,b:e.b,d:+d.toFixed(0)});
      if(e.star){e.star.state='stand';e.star.edge=null;e.star.t0=G.t;}Snd.sfx('stitch');}}
  if(C.node===L.goal)return;
  const pr=pairsFor(PLAN,C.node);

  let made=0;
  const seam=pr.seams.find(p=>!usedN.has(p.a)&&!usedN.has(p.b));
  if(seam){usedN.add(seam.a);usedN.add(seam.b);const e={a:seam.a,b:seam.b,kind:'seam',live:false,born:G.t,grow:0};DYN.push(e);
    log('seam',{a:e.a,b:e.b,skip:seam.skip,d:+seam.d.toFixed(0)});
    await mouseStitch(e);made++;}
  const fs=freeStars();
  for(const bc of pr.bridges){if(!fs.length)break;if(usedN.has(bc.a)||usedN.has(bc.b))continue;
    const st=fs.shift();usedN.add(bc.a);usedN.add(bc.b);
    const e={a:bc.a,b:bc.b,kind:'bridge',live:false,born:G.t,grow:0,star:st};st.state='fly';st.edge=e;st.t0=G.t;
    if(st.src>=0){}
    DYN.push(e);log('bridge',{a:e.a,b:e.b,skip:bc.skip,d:+bc.d.toFixed(0),src:st.src});
    Snd.sfx('star');await wait(650);
    st.state='bridge';e.growT=G.t;Snd.sfx('bridge');await wait(650);e.live=true;made++;
    mouseCross(e);
  }
  if(!made&&pr.bridges.length&&!fs.length)log('bridge-missing-star',{a:pr.bridges[0].a,b:pr.bridges[0].b});
}

function mouseRouteTo(target){

}

/* ---------------- update ---------------- */
function update(dt){
  // timers
  for(let i=timersG.length-1;i>=0;i--)if(timersG[i].at<=G.t){const t=timersG[i];timersG.splice(i,1);try{t.fn();}catch(e){}}
  for(let i=waits.length-1;i>=0;i--)if(waits[i].at<=G.t){const w=waits[i];waits.splice(i,1);w.res();}
  updBlend();
  // breathing
  if(!B.breathHold&&!(B.wake)){const prev=Math.sin(G.breathPh);G.breathPh+=dt*TAU/4.4;const now=Math.sin(G.breathPh);if(prev<0&&now>=0&&G.firstTap)Snd.sfx('breath');}
  G.breathK=B.wake?1:1+0.13*Math.sin(G.breathPh);
  // bear turn
  const tk=clamp((G.t-(B.turnT||-9))/1.3,0,1);B.turn=lerp(B.turnFrom||0,B.turnTo||0,eBack(tk));
  // sit
  if(B.sitT2&&G.t>=B.sitT2){B.sit=clamp(1-(G.t-B.sitT2)/1.2,0,1);if(B.sit<=0){B.sitT2=0;B.sitT=0;}}
  else if(B.sitT){B.sit=clamp((G.t-B.sitT)/1.3,0,1);}else B.sit=0;
  // random sleepy life
  if(!B.wake&&G.mode!=='boot'){B.nextIdle-=dt;if(B.nextIdle<=0){B.nextIdle=7+R()*9;if(R()<0.5){B.smileT=G.t;}else{B.snortT=G.t;Snd.sfx('snort');const w=proj(300,-50,0);burst('cotton',300,-50,20,2,{vz:20,max:0.8,size:4});}}}
  for(let i=DENTS.length-1;i>=0;i--)if(G.t-DENTS[i].t0>1.8)DENTS.splice(i,1);
  if(P&&P.mole){const k=clamp((G.t-P.mole.t0)/P.mole.dur,0,1);const u=lerp(P.mole.u0,P.mole.u1,k);DENTS.push({u,v:P.tunnel.c-6,amp:16,r:34,decay:0,freq:0,t0:G.t-0.01,once:true});}
  updParts(dt);updMouse(dt);
  if(G.texDirty&&L)paintTex();
  meshUpdate();if(L)nodeWorldUpdate();
  for(let i=DENTS.length-1;i>=0;i--)if(DENTS[i].once)DENTS.splice(i,1);
  // blink
  C.blinkT-=dt;if(C.blinkT<0){C.blink=0.15;C.blinkT=2+R()*3.5;}C.blink=Math.max(0,C.blink-dt);
  // gift timeout
  if(GIFT&&!GIFT.tapped&&G.t-GIFT.t0>9&&!G.busy){resolveGift();}
  // idle cues
  idleCues();
  // park end
  if(G.mode==='park'&&P&&!P.busy){const pt=G.t-P.t0,idle=G.t-P.lastAct;if((pt>55&&P.acts>=6)||(pt>28&&idle>16)||pt>130)tidyUp();}
  // die press
  const tp=D.pressId!=null?1:0;D.press=lerp(D.press,tp,Math.min(1,dt*(tp?28:14)));
}
let HAND=null;

    if(t.k==='bear')return{kind:'bear',p:proj(300,-60-B.sit*50,40)};

  renderGL();

  NS.forEach((s,i)=>{const n=L.nodes[i];if(n.type==='goal'){if(!P)spr.push({y:NW[i][1],f:()=>drawCake(c,NW[i],G.t)});return;}

function rot(p,rx,ry){let [x,y,z]=p;let c=Math.cos(ry),s=Math.sin(ry);let x1=x*c+z*s,z1=-x*s+z*c;c=Math.cos(rx);s=Math.sin(rx);let y1=y*c-z1*s,z2=y*s+z1*c;return[x1,y1,z2];}
function drawDie(c){
  if(D.show<=0||G.mode==='park'||G.mode==='event'&&C.node===L.goal)return;
  let rx=D.rx,ry=D.ry,lift=0;
  if(D.rolling){const k=clamp((G.t-D.t0)/0.64,0,1);const e=eOut(k);rx=lerp(D.fromR[0],D.toR[0],e);ry=lerp(D.fromR[1],D.toR[1],e);lift=Math.sin(k*PI)*D.s*1.2;}
  const ready=G.mode==='play'&&!G.busy&&!(GIFT&&!GIFT.tapped);
  const pk=D.popT?eBack(clamp((G.t-D.popT)/0.6,0,1)):1;
  const wb=G.t-D.wobT;const wob=wb<0.8?Math.sin(wb*22)*Math.exp(-wb*5):0;
  const idleB=ready?Math.abs(Math.sin(G.t*2.2))*(G.t-G.lastInput>4?10:4):0;
  const pr=D.press;const rel=G.t-(D.relT||-9);const spring=rel<0.5?Math.sin(rel*25)*Math.exp(-rel*8)*0.15:0;
  const sx=(1+pr*0.16-spring)*pk,sy=(1-pr*0.2+spring)*pk;
  SCR(c);
  // shadow
  c.fillStyle='rgba(90,50,40,'+(0.25-lift/D.s*0.05).toFixed(2)+')';c.beginPath();c.ellipse(D.x,D.y+D.s*1.05,D.s*1.15*(1-lift/D.s*0.15),D.s*0.3,0,0,TAU);c.fill();
  if(ready){const a=0.28+0.18*Math.sin(G.t*4);const g=c.createRadialGradient(D.x,D.y,D.s*0.5,D.x,D.y,D.s*2.1);g.addColorStop(0,'rgba(255,250,190,'+a.toFixed(2)+')');g.addColorStop(1,'rgba(255,250,190,0)');c.fillStyle=g;c.beginPath();c.arc(D.x,D.y,D.s*2.1,0,TAU);c.fill();}
  c.save();c.translate(D.x,D.y+D.s*0.95-lift-idleB);c.rotate(wob*0.15);c.scale(sx,sy);c.translate(0,-D.s*0.95);
  const s=D.s*(ready?1:0.92);
  const P3=CUBE.map(p=>rot(p,rx,ry));
  const vis=FACES.map(f=>{const n=rot(f.n,rx,ry);return{f,n,z:f.v.reduce((a,i)=>a+P3[i][2],0)};}).filter(o=>o.n[2]>0.02).sort((a,b)=>a.z-b.z);
  const round=0.24+pr*0.12;
  for(const o of vis){const pts=o.f.v.map(i=>[P3[i][0]*s,P3[i][1]*s]);const sh=0.62+0.38*Math.max(0,o.n[2]*0.8-o.n[1]*0.3-o.n[0]*0.2);
    c.beginPath();for(let i=0;i<4;i++){const p=pts[i],q=pts[(i+1)%4],pp=pts[(i+3)%4];const a=[lerp(p[0],pp[0],round),lerp(p[1],pp[1],round)],b=[lerp(p[0],q[0],round),lerp(p[1],q[1],round)];i?c.lineTo(a[0],a[1]):c.moveTo(a[0],a[1]);c.quadraticCurveTo(p[0],p[1],b[0],b[1]);}c.closePath();
    c.fillStyle=o.f.col;c.fill();c.fillStyle='rgba(80,40,50,'+(1-sh).toFixed(2)+')';c.fill();c.lineWidth=2;c.strokeStyle='rgba(180,90,110,0.55)';c.stroke();
    // stitched border
    c.save();c.clip();c.setLineDash([4,3]);c.strokeStyle='rgba(255,255,255,0.9)';c.lineWidth=1.6;c.beginPath();const cx=(pts[0][0]+pts[2][0])/2,cy=(pts[0][1]+pts[2][1])/2;pts.forEach((p,i)=>{const x=lerp(p[0],cx,0.16),y=lerp(p[1],cy,0.16);i?c.lineTo(x,y):c.moveTo(x,y);});c.closePath();c.stroke();c.setLineDash([]);c.restore();
    // pips (embroidered knots)
    const pp=PIPS[o.f.val];const fr=o.n[2];
    pp.forEach((q,pi)=>{const u=(q[0]+1)/2,v=(q[1]+1)/2;const a=[lerp(pts[0][0],pts[1][0],u),lerp(pts[0][1],pts[1][1],u)],b=[lerp(pts[3][0],pts[2][0],u),lerp(pts[3][1],pts[2][1],u)];const x=lerp(a[0],b[0],v),y=lerp(a[1],b[1],v);
      const front=o===vis[vis.length-1];const hi=front&&!D.rolling&&D.pipHi>pi;const bounce=hi?1.35:1+(front&&!D.rolling&&G.t-D.wobT<0.5?Math.sin((G.t-D.wobT)*30)*0.15:0);
      const r=s*0.17*Math.sqrt(fr)*bounce;if(hi){c.fillStyle='rgba(255,240,150,0.8)';c.beginPath();c.arc(x,y,r*1.7,0,TAU);c.fill();}
      c.fillStyle=hi?'#ff5f86':'#e0567a';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,0.6)';c.beginPath();c.arc(x-r*0.3,y-r*0.35,r*0.35,0,TAU);c.fill();});
  }
  // bell on top corner
  c.restore();
}
function drawHand(c){
  if(!HAND)return;const k=(G.t-HAND.t0)/2.4;const p=HAND.p;SCR(c);
  let x,y,press=0;if(k<0.35){const e=eOut(k/0.35);x=lerp(V.W+40,p[0]+18,e);y=lerp(V.H+40,p[1]+26,e);}else if(k<0.7){x=p[0]+18;y=p[1]+26;press=Math.sin((k-0.35)/0.35*PI*2);if(press>0.8&&HAND.kind==='die'){D.press=Math.max(D.press,0.6);}}else{const e=(k-0.7)/0.3;x=lerp(p[0]+18,V.W+40,e*e);y=lerp(p[1]+26,V.H+40,e*e);}
  const s=Math.max(0.7,V.S*1.1);c.save();c.translate(x,y+press*6);c.scale(s,s);c.rotate(-0.5);
  c.globalAlpha=0.92;c.fillStyle='rgba(60,30,30,0.15)';c.beginPath();c.ellipse(6,8,22,28,0,0,TAU);c.fill();
  c.fillStyle='#fffaf3';c.strokeStyle='#e7a7bf';c.lineWidth=2;c.beginPath();c.ellipse(0,10,20,26,0,0,TAU);c.fill();c.stroke();
  c.beginPath();c.ellipse(-2,-22,7,14,0,0,TAU);c.fill();c.stroke();
  c.fillStyle='#ffc2d1';c.fillRect(-20,30,40,10);c.setLineDash([3,3]);c.strokeStyle='#fff';c.beginPath();c.moveTo(-18,35);c.lineTo(18,35);c.stroke();c.setLineDash([]);
  c.globalAlpha=1;c.restore();
  if(press>0.5){c.strokeStyle='rgba(255,255,255,'+(press*0.8).toFixed(2)+')';c.lineWidth=3;c.beginPath();c.arc(p[0],p[1],20+press*16,0,TAU);c.stroke();}
}

/* ---------------- loop ---------------- */
let lastTS=null,raf=0;
function frame(ts){
  raf=0;
  if(document.hidden){lastTS=null;return;}
  if(lastTS==null)lastTS=ts;
  const dt=Math.min(0.05,Math.max(0,(ts-lastTS)/1000))*G.speed;lastTS=ts;
  G.t+=dt;G.dt=dt;
  try{update(dt);render();}catch(e){log('err',{m:String(e&&e.stack||e)});if(!G.errShown){G.errShown=true;}}
  raf=requestAnimationFrame(frame);
}
function start(){if(!raf&&!document.hidden){lastTS=null;raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){G.hidden=true;if(Snd.c&&Snd.c.state==='running'){try{Snd.c.suspend();}catch(e){}}log('hidden');}
  else{G.hidden=false;if(Snd.c){try{Snd.c.resume();}catch(e){}}log('visible');start();}
});
window.addEventListener('pagehide',()=>{saveMem();});
let rzT=0;function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{layout();},60);}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',onResize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);

/* ---------------- boot ---------------- */
loadMem();
layout();
initGL();
newRound(false);
G.mode='play';G.readyT=-99;G.lastInput=0;
start();

/* test / debug hooks (no UI) */
window.__QS={get G(){return G;},get L(){return L;},get C(){return C;},get NS(){return NS;},get DYN(){return DYN;},get HIST(){return HIST;},get STARS(){return STARS;},get P(){return P;},get GIFT(){return GIFT;},get PLAN(){return PLAN;},get mem(){return mem;},get memState(){return memState;},
  LOG,FORCE,V,D,B,M,
  setSpeed(k){G.speed=k;},
  nodeScreen(id){const w=NW[id];return proj(w[0],w[1],w[2]);},
  giftScreen(){return GIFT?proj(GIFT.x,GIFT.y,GIFT.z):null;},
  target(){return G.target?{kind:G.target.kind,p:G.target.p}:null;},
  branchScreen(id,b){const e=outsOf(id).find(e=>e.b===b);if(!e)return null;const w=edgeWorld(e,e.kind==='path'?0.45:0.32);return proj(w[0],w[1],w[2]);},
  outs(id){return outsOf(id).map(e=>({b:e.b,kind:e.kind}));},
  bandFor(dir){return chooseBand(dir);},
  zOf(id){return NW[id][2];},
  glOK(){return glOK;}
};
})();
