'use strict';
(function(){
// ============================================================
//  ぺたっ！わすれものロボのくるくるお礼まつり
//  single-file canvas game / clay diorama style / no text UI
// ============================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sgn=v=>v<0?-1:v>0?1:0;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const elastic=t=>t<=0?0:t>=1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*TAU/3)+1;
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---------- colour helpers (cached) ----------
const _rgb={},_sh={};
function rgb(h){let c=_rgb[h];if(!c){const n=parseInt(h.slice(1),16);c=_rgb[h]=[n>>16&255,n>>8&255,n&255];}return c;}
function sh(h,f){const k=h+f;let s=_sh[k];if(s)return s;const c=rgb(h);
  if(f>=0)s=`rgb(${c[0]+(255-c[0])*f|0},${c[1]+(255-c[1])*f|0},${c[2]+(255-c[2])*f|0})`;
  else{const q=1+f;s=`rgb(${c[0]*q|0},${c[1]*q|0},${c[2]*q|0})`;}
  return _sh[k]=s;}
function rgba(h,a){const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}

// ---------- canvas / layout ----------
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let W=390,H=844,DPR=1,S=1,matH=110,baseY=700,visW=560,topY=-700,camX=990;
const SAFE={t:0,r:0,b:0,l:0};
const WORLD_W=2000;
function readSafe(){try{const cs=getComputedStyle(document.getElementById('sa'));
  SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;
  SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
const wx2sx=x=>(x-camX)*S+W/2, wy2sy=y=>(y-190)*S+baseY;
const sx2wx=x=>(x-W/2)/S+camX, sy2wy=y=>(y-baseY)/S+190;
function layout(){
  readSafe();
  W=Math.max(240,window.innerWidth|0);H=Math.max(240,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  matH=clamp(H*.155,Math.min(92,H*.2),165);
  const avail=H-matH-SAFE.b-SAFE.t*.4;
  S=Math.min((W-SAFE.l-SAFE.r)/520,avail/650,1.55);
  baseY=H-SAFE.b-matH;
  visW=W/S;topY=190-baseY/S;
  bgDirty=true;
}
const gy=z=>30+z*100;            // ground draw y for depth z (0 back .. 1 front)
const MAT_Y=()=>190+(matH*.5)/S; // world y of mat centre

// ---------- audio ----------
let AC=null,MG=null,NB=null;
function audioStart(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AC=new C();MG=AC.createGain();MG.gain.value=.55;
      const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=4;
      MG.connect(cp);cp.connect(AC.destination);
      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume();
    const b=AC.createBufferSource();b.buffer=AC.createBuffer(1,1,22050);b.connect(MG);b.start(0);
  }catch(e){AC=null;}
}
const aOK=()=>AC&&AC.state==='running';
const _last={};
function gap(n,s){const t=performance.now();if(_last[n]&&t-_last[n]<s*1000)return false;_last[n]=t;return true;}
function tone(f,d,o){if(!aOK())return;o=o||{};try{
  const t0=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);
  if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+(o.td||d));
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=f*.03;l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+d+.05);}
  const v=o.v||.18;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+(o.a||.006));
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(g);g.connect(MG);os.start(t0);os.stop(t0+d+.05);}catch(e){}}
function noise(d,o){if(!aOK()||!NB)return;o=o||{};try{
  const t0=AC.currentTime+(o.at||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1200,t0);fl.Q.value=o.q||1;
  if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const v=o.v||.15;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+(o.a||.01));
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(fl);fl.connect(g);g.connect(MG);
  s.start(t0,Math.random()*.5);s.stop(t0+d+.05);}catch(e){}}
const SND={
  wake(){tone(300,.35,{to:620,v:.16,type:'triangle'});tone(620,.25,{at:.18,to:900,v:.1});},
  pick(t){const f={lid:360,glove:250,umbrella:440,broom:300,button:780,pinwheel:520,spring:330,feather:600,flower:660,star:880}[t]||400;
    tone(f,.12,{to:f*1.5,v:.14,type:'triangle'});if(t==='glove')noise(.12,{ft:'lowpass',f:500,v:.12});},
  attach(slot){const m={head:1.3,arm:1.12,side:1,chest:1.06,foot:.82}[SLOTS[slot].k];
    tone(420*m,.09,{to:760*m,v:.2});tone(130*m,.12,{v:.2,type:'triangle',to:90});noise(.05,{f:3000,v:.05});},
  detach(){tone(720,.12,{to:380,v:.14});},
  back(){tone(330,.28,{to:210,v:.13,vib:9});},
  tick(f){tone(f||220,.05,{v:.06,type:'triangle'});},
  boing(h){const f=h?180:240;tone(f,h?.5:.32,{to:f*2.6,v:.18,vib:14});},
  thud(){noise(.12,{ft:'lowpass',f:260,v:.25});tone(90,.12,{v:.15,to:60});},
  splash(){noise(.35,{f:1400,q:.7,v:.22,to:500});for(let i=0;i<3;i++)tone(rnd(600,1100),.08,{at:i*.06+.05,v:.05,to:rnd(900,1500)});},
  ding(f){f=f||880;tone(f,1.1,{v:.15});tone(f*2.76,.5,{v:.05});tone(f*5.4,.25,{v:.025});},
  clang(){tone(523,.5,{type:'square',v:.05});tone(741,.45,{v:.08});tone(1180,.3,{v:.05});},
  whirr(){noise(.4,{f:900,to:2200,q:3,v:.06});},
  chime(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.6,{at:i*.09,v:.11,type:'triangle'}));},
  wave(){tone(900,.12,{to:1300,v:.08});tone(1300,.14,{at:.14,to:1000,v:.08});},
  sweep(){noise(.22,{ft:'highpass',f:2500,v:.12});noise(.22,{ft:'highpass',f:2200,v:.1,at:.25});},
  reveal(){[784,988,1175,1568].forEach((f,i)=>tone(f,.35,{at:i*.07,v:.1}));},
  success(k){const b={1:523,2:587,3:659,4:698,5:784,6:880}[k]||523;
    [b,b*1.26,b*1.5,b*2].forEach((f,i)=>tone(f,.45,{at:i*.1,v:.15,type:'triangle'}));
    tone(b*2,.9,{at:.42,v:.1});noise(.06,{at:0,f:5000,v:.06});noise(.06,{at:.4,f:5000,v:.06});},
  yay(){[660,880,1100].forEach((f,i)=>tone(f,.18,{at:i*.07,v:.12,to:f*1.1}));},
  meow(){tone(720,.38,{to:520,v:.1,type:'triangle',vib:7});},
  startle(){tone(900,.12,{to:1500,v:.12,type:'triangle'});},
  giggle(){[760,880,820,980].forEach((f,i)=>tone(f,.07,{at:i*.07,v:.1}));},
  chirp(){tone(2200,.07,{to:2800,v:.06});tone(2400,.08,{at:.1,to:3000,v:.06});},
  gust(){noise(1.2,{ft:'lowpass',f:300,to:1600,v:.12,a:.3});},
  rumble(){noise(1.6,{ft:'lowpass',f:120,to:400,v:.3,a:.2});tone(60,1.6,{to:120,v:.18,a:.3});},
  puff(){noise(.15,{ft:'lowpass',f:700,v:.16});tone(200,.12,{to:330,v:.1});},
  pass(){tone(500,.12,{to:900,v:.12});tone(900,.2,{at:.12,v:.1});},
  no(){tone(400,.12,{v:.08});tone(330,.18,{at:.13,v:.08});},
  clap(){noise(.05,{f:2000,q:.6,v:.14});noise(.05,{at:.12,f:2200,q:.6,v:.12});},
  shutter(){noise(.05,{f:3000,v:.12});tone(1800,.05,{at:.06,v:.06});}
};

// ---------- persistence (device only, failure tolerant) ----------
const SAVE_KEY='petawasure7.v1';
const THEME_KEYS=['chef','cleaner','gran'];
const store={ok:true,state:'none',data:{v:1,photos:[],returns:0,days:0}};
function loadSave(){
  let raw=null;
  try{raw=window.localStorage.getItem(SAVE_KEY);}catch(e){store.state='denied';return;}
  if(raw==null){store.state='fresh';return;}
  try{
    const d=JSON.parse(raw);
    if(!d||d.v!==1||!Array.isArray(d.photos))throw new Error('bad');
    store.data={v:1,returns:Math.max(0,d.returns|0),days:Math.max(0,d.days|0),
      photos:d.photos.filter(p=>p&&typeof p.s==='object').slice(0,3).map(p=>{const s={};
        for(const k in p.s){if(SLOT_KEYS.indexOf(k)>=0&&PT[p.s[k]&&p.s[k].t])s[k]={t:p.s[k].t,c:/^#[0-9a-f]{6}$/i.test(p.s[k].c)?p.s[k].c:PT[p.s[k].t].col};}
        return {s,th:THEME_KEYS.indexOf(p.th)>=0?p.th:'chef'};}).filter(p=>Object.keys(p.s).length>0)};
    store.state='restored';
  }catch(e){store.state='corrupt';try{window.localStorage.removeItem(SAVE_KEY);}catch(_){}}
}
function writeSave(){
  try{window.localStorage.setItem(SAVE_KEY,JSON.stringify(store.data));store.ok=true;}
  catch(e){store.ok=false;}
}

// ============================================================
//  DATA
// ============================================================
const PT={
  lid:{w:1.2,r:38,col:'#9db8cc',lift:10},

  broom:{w:.9,r:40,col:'#e8b878',lift:16},
  button:{w:.2,r:25,col:'#e66f6f',lift:12},
  pinwheel:{w:.4,r:34,col:'#c7b3e6',lift:18},
  spring:{w:.7,r:30,col:'#86cdb0',lift:34},
  feather:{w:.2,r:32,col:'#a6d6ee',lift:14},
  flower:{w:.2,r:28,col:'#f7a3c6',lift:14},
  star:{w:.2,r:28,col:'#ffd45e',lift:14}
};
const SLOTS={head:{x:0,y:-184,k:'head'},armL:{x:-68,y:-120,k:'arm'},armR:{x:68,y:-120,k:'arm'},
  sideL:{x:-60,y:-36,k:'side'},sideR:{x:60,y:-36,k:'side'},chest:{x:0,y:-62,k:'chest'},foot:{x:0,y:-4,k:'foot'}};
const SLOT_KEYS=Object.keys(SLOTS);

const BTN_PITCH={'#e66f6f':784,'#f2b84b':880,'#6fa8e6':1047,'#8fcf7a':988};

const SHOP_X=620,WM_X=735,WM_Y=-300,SX=990,SY=96,SHELF_X=1662,SHELF_Y=-300,CAT_HOME=1128;

  look:{x:x,y:-100},armL:0,armR:0,tL:0,tR:0,h:0,vh:0,happy:0,wave:0,clap:0,point:0,want:0,shake:0,

  photoTaken:false,theme:'chef',prop:null,lamps:[],seats:[],shake:0,devA:{},bpm:116,instr:'chef',idle:0};

// ============================================================
//  DRAW PRIMITIVES (clay look)
// ============================================================
function rrPath(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function blob(g,x,y,rx,ry,col,lit){
  rx=Math.max(.5,rx);ry=Math.max(.5,ry);
  const m=Math.max(rx,ry),gr=g.createRadialGradient(x-rx*.35,y-ry*.42,m*.08,x,y,m*1.08);
  gr.addColorStop(0,sh(col,lit==null?.4:lit));gr.addColorStop(.55,col);gr.addColorStop(1,sh(col,-.22));
  g.fillStyle=gr;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();
}
function slab(g,x,y,w,h,r,col,flat){
  const gr=g.createLinearGradient(x,y,x+w*.25,y+h);
  gr.addColorStop(0,sh(col,.3));gr.addColorStop(.45,col);gr.addColorStop(1,sh(col,-.2));
  g.fillStyle=flat?col:gr;rrPath(g,x,y,w,h,r);g.fill();
  g.strokeStyle=sh(col,.5);g.lineWidth=Math.max(1.2,Math.min(w,h)*.035);g.globalAlpha*=.55;
  g.beginPath();g.moveTo(x+r,y+g.lineWidth*1.2);g.lineTo(x+w-r,y+g.lineWidth*1.2);g.stroke();g.globalAlpha/=.55;
}
function shadow(g,x,y,rx,ry,a){g.fillStyle=`rgba(110,70,50,${a==null?.16:a})`;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();}
function limb(g,x1,y1,x2,y2,w,col){g.lineCap='round';g.strokeStyle=sh(col,-.15);g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  g.strokeStyle=col;g.lineWidth=w*.72;g.beginPath();g.moveTo(x1-w*.08,y1-w*.1);g.lineTo(x2-w*.08,y2-w*.1);g.stroke();
  g.strokeStyle=sh(col,.35);g.lineWidth=w*.25;g.beginPath();g.moveTo(x1-w*.18,y1-w*.2);g.lineTo(x2-w*.18,y2-w*.2);g.stroke();}
function circ(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(.3,r),0,TAU);g.fill();}
function eye(g,x,y,r,lx,ly,blink){
  circ(g,x,y,r,'#fffaf0');
  if(blink<.9){const px=x+lx*r*.38,py=y+ly*r*.32;circ(g,px,py,r*.55,'#3b2a2a');circ(g,px-r*.18,py-r*.2,r*.18,'#ffffff');}
  if(blink>0){g.fillStyle='rgba(0,0,0,0)';}
}

// ============================================================
//  BACKGROUND CACHE (static diorama)
// ============================================================
let bg=null,bgDirty=true,bgS=1,bgTop=-700;
function buildBG(){
  bgDirty=false;
  const top=Math.min(-560,topY-20);
  const hW=WORLD_W,hH=190+60-top;
  let k=Math.min(DPR,2);
  const area=hW*S*k*hH*S*k;if(area>9e6)k*=Math.sqrt(9e6/area);
  if(hW*S*k>8000)k=8000/(hW*S);
  bgS=S*k;bgTop=top;
  if(!bg)bg=document.createElement('canvas');
  bg.width=Math.ceil(hW*bgS);bg.height=Math.ceil(hH*bgS);
  const g=bg.getContext('2d');
  g.setTransform(bgS,0,0,bgS,0,-top*bgS);
  drawStatic(g,top);
}
function drawStatic(g,top){
  // sky
  const sk=g.createLinearGradient(0,top,0,0);
  sk.addColorStop(0,'#a9dcf0');sk.addColorStop(.65,'#d7f0f2');sk.addColorStop(1,'#fbefd6');
  g.fillStyle=sk;g.fillRect(-10,top-10,WORLD_W+20,260-top);
  // sun
  blob(g,1500,-470,52,52,'#ffe08a',.5);
  // clouds
  [[180,-520],[620,-600],[1180,-540],[1720,-610],[420,-760],[1500,-800],[900,-860]].forEach(([x,y])=>{
    if(y<top)return;blob(g,x,y,70,30,'#ffffff',.3);blob(g,x-50,y+8,44,24,'#ffffff',.3);blob(g,x+52,y+6,48,26,'#ffffff',.3);});
  // far hills

function houseBody(g,x,y,w,h,col,roof){

function winRound(g,x,y,r){blob(g,x,y,r+8,r+8,'#f0c99a');blob(g,x,y,r,r,'#cfeef6',.6);
  g.strokeStyle='#f0c99a';g.lineWidth=5;g.beginPath();g.moveTo(x-r,y);g.lineTo(x+r,y);g.moveTo(x,y-r);g.lineTo(x,y+r);g.stroke();}

function gloveShape(g,c,pf){
  const s=pf;
  blob(g,0,22*s,21*s,8*s,'#fff6ea');                       // cuff
  [[-15,-18,7],[-5,-24,7.5],[6,-24,7.5],[16,-17,7]].forEach(([x,y,r])=>blob(g,x*s,y*s,r*s,10*s,c));
  blob(g,-24*s,0,8*s,11*s,c);                               // thumb
  blob(g,0,2*s,22*s,22*s,c);                                // palm
  g.strokeStyle=sh(c,-.18);g.lineWidth=2*s;g.beginPath();g.moveTo(-8*s,-8*s);g.lineTo(-8*s,0);g.moveTo(3*s,-9*s);g.lineTo(3*s,-1*s);g.stroke();
}
function canopy(g,c,w,op,hgt){
  // dome above origin, scalloped base
  const ww=w*(.35+.65*op),hh=hgt*(.55+.45*op);
  g.fillStyle=sh(c,-.15);g.beginPath();g.moveTo(-ww,0);g.quadraticCurveTo(0,-hh*1.9,ww,0);g.closePath();g.fill();
  const gr=g.createLinearGradient(-ww,-hh,ww,0);gr.addColorStop(0,sh(c,.35));gr.addColorStop(.6,c);gr.addColorStop(1,sh(c,-.2));
  g.fillStyle=gr;g.beginPath();g.moveTo(-ww,0);g.quadraticCurveTo(0,-hh*1.85,ww,0);
  const n=4;for(let i=n;i>0;i--){const x0=-ww+(i)*2*ww/n,x1=-ww+(i-1)*2*ww/n;g.quadraticCurveTo((x0+x1)/2,9*op,x1,0);}
  g.fill();
  g.fillStyle='rgba(242,140,140,.55)';g.beginPath();g.moveTo(-ww*.18,-hh*.86);g.quadraticCurveTo(-ww*.3,-hh*.4,-ww*.5,0);g.lineTo(-ww*.08,0);g.closePath();g.fill();
  g.beginPath();g.moveTo(ww*.22,-hh*.84);g.quadraticCurveTo(ww*.42,-hh*.4,ww*.6,0);g.lineTo(ww*.95,0);g.quadraticCurveTo(ww*.7,-hh*.5,ww*.22,-hh*.84);g.fill();
  circ(g,0,-hh*.93,4.5,sh(c,-.3));
}
function umbrellaD(g,c,op,stick){
  g.lineCap='round';g.strokeStyle='#a87652';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(0,-stick);g.stroke();
  g.beginPath();g.arc(-7,0,7,0,Math.PI*.95);g.stroke();
  g.save();g.translate(0,-stick);canopy(g,c,50,op,30);g.restore();
}
function closedUmb(g,c,len){
  g.lineCap='round';g.strokeStyle='#a87652';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(0,len);g.stroke();
  g.fillStyle=c;g.beginPath();g.moveTo(-10,len*.15);g.quadraticCurveTo(-12,len*.7,0,len);g.quadraticCurveTo(12,len*.7,10,len*.15);g.closePath();g.fill();
  g.fillStyle=sh(c,.35);g.beginPath();g.ellipse(-4,len*.45,3,len*.25,0,0,TAU);g.fill();
  g.strokeStyle='#a87652';g.beginPath();g.arc(-7,0,7,Math.PI,TAU);g.stroke();
}
function broomD(g,c,len,sw){

  g.fillStyle=c;rrPath(g,-12,-8,24,10,5);g.fill();

}
function buttonD(g,c,r,rot){

  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>circ(g,a*r*.24,b*r*.24,r*.12,sh(c,-.4)));g.restore();
}
function pinD(g,c,spin,stick,ribbon){
  if(stick){g.lineCap='round';g.strokeStyle='#c08a5c';g.lineWidth=4;g.beginPath();g.moveTo(0,0);g.lineTo(0,-stick);g.stroke();}
  g.save();g.translate(0,-stick);
  if(ribbon!==false){g.strokeStyle='#f39ab4';g.lineWidth=4;g.beginPath();g.moveTo(0,4);
    for(let i=1;i<=6;i++)g.lineTo(-i*6-4,6+Math.sin(T*9+i)*5+i*4);g.stroke();
    g.strokeStyle='#8fd0e8';g.beginPath();g.moveTo(0,4);for(let i=1;i<=6;i++)g.lineTo(i*6+4,6+Math.sin(T*9+i+2)*5+i*4);g.stroke();}
  g.rotate(spin);
  const cols=[c,'#f6d36b','#9fd3b8','#f4a9a3'];
  for(let i=0;i<4;i++){g.rotate(TAU/4);g.fillStyle=cols[i];g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(22,-6,24,-24);g.quadraticCurveTo(8,-20,0,0);g.fill();}
  circ(g,0,0,5,'#fff3e0');g.restore();
}
function springD(g,c,len,boing){
  const n=5;g.lineCap='round';
  for(let i=0;i<n;i++){const y=i*len/n+len/n*.5;g.strokeStyle=sh(c,-.2);g.lineWidth=7;g.beginPath();g.ellipse(Math.sin(boing+i)*2,y,14,5,0,0,TAU);g.stroke();
    g.strokeStyle=sh(c,.3);g.lineWidth=3;g.beginPath();g.ellipse(Math.sin(boing+i)*2,y-1,14,5,0,Math.PI,TAU);g.stroke();}
}
function featherD(g,c,fl){
  g.save();g.rotate(fl||0);
  g.fillStyle=c;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(26,-10,40,-46);g.quadraticCurveTo(8,-38,0,0);g.fill();
  g.fillStyle=sh(c,.35);g.beginPath();g.moveTo(4,-6);g.quadraticCurveTo(22,-16,34,-40);g.quadraticCurveTo(14,-30,4,-6);g.fill();
  g.strokeStyle=sh(c,-.3);g.lineWidth=2;g.beginPath();g.moveTo(0,4);g.quadraticCurveTo(18,-18,38,-44);g.stroke();g.restore();
}
function flowerD(g,c,r){for(let i=0;i<5;i++){const a=i/5*TAU+T*.4;blob(g,Math.cos(a)*r*.6,Math.sin(a)*r*.6,r*.5,r*.5,c);}blob(g,0,0,r*.42,r*.42,'#ffd45e');}
function starD(g,c,r){g.fillStyle=sh(c,-.15);g.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=i%2?r*.5:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();g.fill();
  g.fillStyle=c;g.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=(i%2?r*.5:r)*.82;g.lineTo(Math.cos(a)*rr-1,Math.sin(a)*rr-1);}g.closePath();g.fill();
  circ(g,-r*.25,-r*.25,r*.14,'rgba(255,255,255,.7)');}

// mode: loose head arm side chest foot ; L = local ground y for foot mode
function drawPart(g,p,mode,L){
  const c=p.col,t=p.type;
  switch(t){
  case 'lid':
    if(mode==='side'){blob(g,0,0,34,34,c);g.strokeStyle=sh(c,.45);g.lineWidth=4;g.beginPath();g.arc(0,0,27,0,TAU);g.stroke();
      for(let i=0;i<3;i++){const a=p.spin+i*TAU/3;circ(g,Math.cos(a)*17,Math.sin(a)*17,5,sh(c,-.28));}blob(g,0,0,10,10,'#e9b97a');}
    else if(mode==='head'){blob(g,0,-2,48,13,c);
      for(let i=0;i<6;i++){const a=p.spin+i*TAU/6,s=Math.sin(a);if(s>-.2)circ(g,Math.cos(a)*38,-2+s*8,4,sh(c,.55));}
      blob(g,0,-12,22,13,sh(c,.08));blob(g,0,-24,9,8,'#e9b97a');
      if(p.spinV>6){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=3;for(let i=0;i<3;i++){const a=-p.spin*1.3+i*2.1;g.beginPath();g.ellipse(0,-6,58,16,0,a,a+1);g.stroke();}}}
    else if(mode==='foot'){blob(g,0,L-7,56,12,c);g.strokeStyle=sh(c,.45);g.lineWidth=3;g.beginPath();g.ellipse(0,L-9,44,7,0,Math.PI,TAU);g.stroke();}
    else if(mode==='arm'){g.save();g.translate(18,-4);g.rotate(-.3);blob(g,0,0,30,30,c);g.strokeStyle=sh(c,.45);g.lineWidth=3;g.beginPath();g.arc(0,0,23,0,TAU);g.stroke();blob(g,0,0,8,8,'#e9b97a');g.restore();}
    else if(mode==='chest'){blob(g,0,0,26,26,c);g.strokeStyle=sh(c,.45);g.lineWidth=3;g.beginPath();g.arc(0,0,20,0,TAU);g.stroke();blob(g,0,0,7,7,'#e9b97a');}
    else{blob(g,0,4,38,27,c);g.strokeStyle=sh(c,.45);g.lineWidth=4;g.beginPath();g.ellipse(0,3,30,20,0,0,TAU);g.stroke();blob(g,0,-6,12,9,'#e9b97a');}
    break;
  case 'glove':
    if(mode==='arm'){g.save();g.translate(14,-2);g.rotate(-.75+p.rot);gloveShape(g,c,.9*p.puff);g.restore();}
    else if(mode==='head'){g.save();g.translate(0,-26);gloveShape(g,c,.95*p.puff);g.restore();}
    else if(mode==='side'){g.save();g.translate(20,0);g.rotate(1.35+p.rot*.5);gloveShape(g,c,.8*p.puff);g.restore();}
    else if(mode==='foot'){const pf=p.puff;blob(g,0,L-15*pf,48,17*pf,c);
      [-27,-9,9,27].forEach(x=>blob(g,x,L-6,9,8,sh(c,.05)));blob(g,-44,L-18*pf,9,10,c);}
    else if(mode==='chest'){g.save();g.scale(.7,.7);gloveShape(g,c,p.puff);g.restore();}
    else{g.save();g.rotate(-.35);gloveShape(g,c,p.puff);g.restore();}
    break;
  case 'umbrella':
    if(mode==='head'){g.save();g.translate(0,6);umbrellaD(g,c,p.open,38);g.restore();}
    else if(mode==='arm'){g.save();g.translate(8,10);g.rotate(.2);umbrellaD(g,c,p.open,78);g.restore();}
    else if(mode==='side'){g.save();g.translate(4,4);g.rotate(1.2);umbrellaD(g,c,p.open,46);g.restore();}
    else if(mode==='foot'){g.save();g.translate(0,-6);closedUmb(g,c,L+6);g.restore();}
    else if(mode==='chest'){g.save();g.rotate(.5);g.translate(0,-20);closedUmb(g,c,48);g.restore();}
    else{g.save();g.rotate(-.75);g.translate(0,22);umbrellaD(g,c,p.open,46);g.restore();}
    break;
  case 'broom':
    if(mode==='arm'){g.save();g.translate(8,0);g.rotate(.32+p.rot);broomD(g,c,72,-.2);g.restore();}
    else if(mode==='head'){g.save();g.translate(0,8);g.rotate(Math.PI+p.rot*.3);broomD(g,c,22,0);g.restore();}
    else if(mode==='side'){g.save();g.translate(4,0);g.rotate(-1.15+p.rot*.4);broomD(g,c,44,0);g.restore();}
    else if(mode==='foot'){g.save();g.translate(-46,L-10);g.rotate(-Math.PI/2);broomD(g,c,58,0);g.restore();}
    else if(mode==='chest'){g.save();g.rotate(-.6);g.translate(0,-30);broomD(g,c,40,0);g.restore();}
    else{g.save();g.rotate(-.9);g.translate(0,-44);broomD(g,c,60,0);g.restore();}
    break;
  case 'button':
    if(mode==='foot'){g.save();g.translate(0,L-12);buttonD(g,c,15,p.spin);g.restore();}
    else if(mode==='side'){buttonD(g,c,17,p.spin);}
    else if(mode==='head'){buttonD(g,c,17,p.rot);}
    else buttonD(g,c,mode==='loose'?22:17,p.rot);
    break;
  case 'pinwheel':
    if(mode==='head')pinD(g,c,p.spin,30);
    else if(mode==='arm'){g.save();g.translate(10,6);g.rotate(.25);pinD(g,c,p.spin,52);g.restore();}
    else if(mode==='side'){g.save();g.rotate(1.2);pinD(g,c,p.spin,26);g.restore();}
    else if(mode==='foot'){g.save();g.translate(0,L-8);g.scale(1,.35);pinD(g,c,p.spin,0,false);g.restore();}
    else if(mode==='chest')pinD(g,c,p.spin,0,false);
    else{g.save();g.translate(0,18);g.rotate(-.3);pinD(g,c,p.spin,34);g.restore();}
    break;
  case 'spring':
    if(mode==='foot'){g.save();g.translate(0,-2);springD(g,c,(L+2)*p.sq,p.rot);g.restore();}
    else if(mode==='head'){g.save();g.rotate(Math.sin(p.rot)*.25);g.translate(0,-34);springD(g,c,32,p.rot);blob(g,0,-6,10,10,'#f4a9a3');g.restore();}
    else if(mode==='arm'||mode==='side'){g.save();g.rotate(-Math.PI/2+Math.sin(p.rot)*.2);springD(g,c,30,p.rot);blob(g,0,36,13,13,'#f4a9a3');g.restore();}
    else{g.save();g.translate(0,-18);springD(g,c,36,p.rot);g.restore();}
    break;
  case 'feather':
    if(mode==='arm')featherD(g,c,.3+p.rot);
    else if(mode==='head'){g.save();g.translate(-6,0);featherD(g,c,-.55+p.rot*.3);g.restore();}
    else if(mode==='side')featherD(g,c,.9+p.rot);
    else if(mode==='foot'){g.save();g.translate(-22,L-6);featherD(g,c,.9);g.restore();g.save();g.translate(22,L-6);g.scale(-1,1);featherD(g,c,.9);g.restore();}
    else{g.save();g.translate(-14,20);featherD(g,c,.2);g.restore();}
    break;
  case 'flower':
    if(mode==='head'){g.save();g.translate(0,-14);flowerD(g,c,20);g.restore();}
    else if(mode==='arm'||mode==='side'){g.save();g.translate(10,-6);flowerD(g,c,17);g.restore();}
    else if(mode==='foot'){g.save();g.translate(0,L-10);flowerD(g,c,15);g.restore();}
    else flowerD(g,c,mode==='loose'?22:17);
    break;
  case 'star':
    if(mode==='head'){g.save();g.translate(0,-18);g.rotate(Math.sin(T*2)*.15);starD(g,c,22);g.restore();}
    else if(mode==='foot'){g.save();g.translate(0,L-12);starD(g,c,16);g.restore();}
    else{g.save();g.translate(mode==='arm'||mode==='side'?10:0,0);starD(g,c,mode==='loose'?24:18);g.restore();}
    break;
  }
}

function spawn(type,x,y,o){
  if(particles.length>=MAXP)return null;o=o||{};
  const p={type,x,y,vx:o.vx!=null?o.vx:rnd(-60,60),vy:o.vy!=null?o.vy:rnd(-120,-30),life:o.life||rnd(.5,1),max:0,
    col:o.col||'#ffffff',s:o.s||rnd(4,9),a:rnd(0,TAU),va:rnd(-6,6),g:o.g!=null?o.g:200,drag:o.drag||1.5};
  p.max=p.life;particles.push(p);return p;
}
function burst(type,x,y,n,o){for(let i=0;i<n;i++)spawn(type,x+rnd(-8,8),y+rnd(-8,8),o?Object.assign({},o):null);}
function sparkle(x,y,n,col){burst('spark',x,y,n,{col:col||'#fff4b0',g:-20,life:.8});}
function updParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.vy+=p.g*dt;p.vx*=1-Math.min(1,p.drag*dt);p.vy*=1-Math.min(1,p.drag*dt*.3);
    if(p.type==='leaf'){p.vx+=WIND.v*60*dt;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;}
}
function drawParticles(g){
  for(const p of particles){const k=p.life/p.max;g.globalAlpha=Math.min(1,k*1.6);
    switch(p.type){
    case 'dust':circ(g,p.x,p.y,p.s*(1.6-k*.6),'rgba(240,222,190,.9)');break;
    case 'spark':{g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.col;const s=p.s*(.5+k*.6);
      g.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.35:s;const a=i/8*TAU;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.fill();g.restore();break;}
    case 'leaf':leafD(g,p.x,p.y,p.s,p.a,p.col);break;
    case 'drop':circ(g,p.x,p.y,p.s*.7,'rgba(140,200,235,.9)');break;
    case 'confetti':g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.col;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();break;
    case 'heart':{g.save();g.translate(p.x,p.y);g.scale(p.s/10,p.s/10);g.fillStyle=p.col;g.beginPath();g.moveTo(0,4);
      g.bezierCurveTo(-10,-4,-5,-12,0,-6);g.bezierCurveTo(5,-12,10,-4,0,4);g.fill();g.restore();break;}
    case 'whirl':g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.s*1.6,p.a,p.a+2.2);g.stroke();break;
    case 'bubble':g.strokeStyle=rgba(p.col,.8);g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,p.s,0,TAU);g.stroke();circ(g,p.x-p.s*.35,p.y-p.s*.35,p.s*.2,'rgba(255,255,255,.8)');break;
    case 'steam':circ(g,p.x,p.y,p.s*(2-k),'rgba(255,255,255,.55)');break;
    case 'note':g.fillStyle=p.col;g.beginPath();g.ellipse(p.x,p.y,p.s*.7,p.s*.5,-.4,0,TAU);g.fill();g.fillRect(p.x+p.s*.5,p.y-p.s*2.2,2.4,p.s*2.2);break;
    case 'ring':g.strokeStyle=rgba(p.col,.7);g.lineWidth=3;g.beginPath();g.ellipse(p.x,p.y,p.s*(2.2-k*1.2),p.s*(2.2-k*1.2)*.35,0,0,TAU);g.stroke();break;
    }}
  g.globalAlpha=1;
}

let C={};
function cfg(){
  const s=R.slots,c={};
  for(const k of SLOT_KEYS)c[k]=s[k]!=null?byId(s[k]).type:null;
  c.wheels=(c.sideL==='lid'?1:0)+(c.sideR==='lid'?1:0);
  c.tiny=(c.sideL==='button'?1:0)+(c.sideR==='button'?1:0);
  c.hat=c.head==='lid';
  c.umbOpen=c.head==='umbrella'||c.armL==='umbrella'||c.armR==='umbrella';
  c.sail=c.sideL==='umbrella'||c.sideR==='umbrella';
  c.pin=c.head==='pinwheel'?'head':(c.armL==='pinwheel'||c.armR==='pinwheel')?'arm':(c.sideL==='pinwheel'||c.sideR==='pinwheel')?'side':c.foot==='pinwheel'?'foot':c.chest==='pinwheel'?'chest':null;
  c.pinDir=(c.armL==='pinwheel'||c.sideL==='pinwheel')?-1:1;
  c.gloveArm=c.armL==='glove'||c.armR==='glove';
  c.broomArm=c.armL==='broom'||c.armR==='broom';
  c.sweep=(c.armL==='glove'&&c.armR==='broom')||(c.armL==='broom'&&c.armR==='glove');
  c.hopFoot=c.foot==='glove'||c.foot==='spring';
  c.fly=c.umbOpen&&!!c.pin;
  c.featherArm=c.armL==='feather'||c.armR==='feather';
  let wl=0,wr=0,tot=0,n=0;
  for(const k of SLOT_KEYS){if(!c[k])continue;const w=PT[c[k]].w;tot+=w;n++;if(k==='armL'||k==='sideL')wl+=w;if(k==='armR'||k==='sideR')wr+=w;}
  c.imb=wr-wl;c.tot=tot;c.n=n;
  c.buttons=SLOT_KEYS.filter(k=>c[k]==='button');
  return c;
}
function locoOf(c){
  let sp=58,k='walk';
  if(c.wheels===2){sp=250;k='roll';}else if(c.wheels===1){sp=165;k='roll';}
  else if(c.foot==='spring'){sp=175;k='bighop';}
  else if(c.foot==='glove'){sp=140;k='hop';}
  else if(c.foot==='lid'){sp=175;k='skate';}
  else if(c.tiny){sp=100;k='roll';}
  else if(c.foot==='broom'){sp=115;k='ride';}

    if(nearRobot(r)&&(p.where==='robot'||p.where==='mat'))return {part:p,to:{res:r.id},key:'ret'+r.id};}

    ()=>SHELF.item!=null&&!F.d2shelf&&['shelf',suggest(usable('glove').length?'glove':'spring','foot'),'shelf'],
    ()=>{if(LV.state!=='pile'||F.d3sweep)return false;

    ()=>{for(const r of RES_LIST){if(r.has||r.dayReturned)continue;const p=ownerPart(r);if(!p||p.where==='shelf'||p.where==='leaves')continue;

    R.x=lerp(s.x0,SX,k);R.z=lerp(s.z0,.5,k);R.h=Math.sin(Math.min(1,s.t)*Math.PI)*170;R.vh=0;R.vx=0;

    if(s.t>=1){R.toStage=null;R.inShow=true;R.h=0;R.sq=.8;SND.thud();burst('dust',R.x,R.oy,8);R.mode='ground';}
    finishRobot(dt,c);return;}
  if(R.inShow){showRobot(dt,c);finishRobot(dt,c);return;}
  // stage lift when standing on stage area
  const onStage=SH.h>4&&Math.abs(R.x-SX)<170&&R.z>.2&&R.z<.9;
  R.stageLift=approach(R.stageLift,onStage?SH.h:0,dt*300);
  // ---- targets ----

  if(R.userT>0)R.userT-=dt;

    }
  }
  let dir=0;
  if(R.target&&!busy){const dx=R.target.x-R.x;
    if(Math.abs(dx)>20)dir=sgn(dx);
    else{const id=R.target.id;R.target=null;R.restT=rnd(1.8,3.5);arrive(id);}}
  // ---- mode transitions ----
  if(R.mode==='ground'&&c.fly&&dir!==0&&R.target&&Math.abs(R.target.x-R.x)>140&&!busy){
    R.mode='fly';R.flyD=0;R.flyX0=R.x;R.flyAlt=R.target.id==='shelf'?330:125;SND.gust();

    if(ent){R.mode='glide';R.glide={dir,x0:R.x,t:0};SND.gust();R.surprise=.4;}}
  // ---- movement per mode ----
  let tvx=0;
  if(R.mode==='glide'){
    const gl=R.glide;gl.t+=dt;
    tvx=WIND.v*210+gl.dir*55;
    R.h=approach(R.h,82+Math.sin(T*3)*10,dt*160);R.vh=0;
    if(!(c.umbOpen&&c.wheels)){R.mode='ground';R.glide=null;}

      const crossed=sgn(R.x-PUD.cx)!==sgn(gl.x0-PUD.cx);
      R.mode='ground';R.glide=null;R.target=null;R.restT=2.5;
      if(crossed){if(flag('d4glide','wind'+(WIND.v>0?'R':'L'))){SND.success(4);}proud();sparkle(R.x,R.oy-120,10);}
      else{R.surprise=1;LOG.push({k:'glideBack',t:+T.toFixed(1)});}
    }
    if(gl&&R.x>PUD.x0&&R.x<PUD.x1&&Math.random()<dt*9)ripple(R.x+rnd(-20,20),gy(R.z)+rnd(-8,8),1);
  }else if(R.mode==='fly'){
    if(!c.fly){R.mode='ground';}
    else{
      const tx=R.target?R.target.x:R.x,dx=tx-R.x;
      tvx=Math.abs(dx)>26?sgn(dx)*205:0;
      let alt=R.flyAlt+Math.sin(T*2.2)*12;
      if(c.pin==='head'){R.loopA+=dt*3.4;alt+=Math.sin(R.loopA)*55;tvx+=Math.cos(R.loopA)*120;R.flip=R.loopA%TAU;}
      else if(c.pin==='arm'){R.tz=clamp(.5+.42*Math.sin(T*1.6)*c.pinDir,.05,.95);}
      else if(c.pin==='side'){tvx*=1.3;}

      if(Math.random()<dt*10)spawn('whirl',R.x+rnd(-40,40),R.oy-60,{vy:40,g:0,life:.5,s:rnd(6,10)});
      if(!R.target||Math.abs(dx)<=26){R.mode='ground';R.target=null;R.restT=2;}
    }
  }else{
    // ground
    let sp=lo.sp;
    const inPud=R.x>PUD.x0+12&&R.x<PUD.x1-12&&R.h<3;
    const onPlank=HELP.plank>.9&&Math.abs(R.z-.2)<.14;
    if(inPud&&!c.sail&&!onPlank&&lo.k!=='hop'&&lo.k!=='bighop'){sp*=.45;R.wet=1;
      if(dir!==0&&Math.random()<dt*5){splash(R.x,gy(R.z));}}
    tvx=dir*sp;
    if(c.sail&&!busy){tvx+=WIND.v*150;if(inPud){R.sailD+=Math.abs(R.vx)*dt;if(Math.random()<dt*8)ripple(R.x-sgn(R.vx)*30,gy(R.z),c.hat?2:1);
        if(c.hat){R.spinV=Math.max(R.spinV,13);}

    // depth steering
    let tz=R.tz;
    if(R.x>PUD.x0-80&&R.x<PUD.x1+80&&HELP.plank>.9&&!c.sail&&dir!==0&&R.mode==='ground'&&!c.hopFoot)tz=.2;
    R.z=approach(R.z,tz,dt*.6);
    // hops
    if(R.h<.5&&!busy){
      if((lo.k==='hop'||lo.k==='bighop'||lo.k==='pogo')&&(dir!==0||(Math.random()<dt*.4&&PTRS.size===0))&&R.hopCD<=0){
        R.vh=lo.k==='bighop'?560:lo.k==='pogo'?300:400;R.hopCD=.08;SND.boing(lo.k==='bighop');R.sq=.82;
        const fp=byId(R.slots.foot);if(fp){fp.puff=.75;fp.sq=.6;}
        if(inPud)splash(R.x,gy(R.z));}
      if(c.chest==='button'&&R.chestCD<=0){R.vh=Math.max(R.vh,250);R.chestCD=.95;SND.boing(false);catHear('boing');}
      if(c.featherArm&&dir!==0&&R.flutCD<=0){R.vh=Math.max(R.vh,200);R.flutCD=.6;}
    }
    // head button bell while moving
    if(c.head==='button'&&dir!==0&&R.dingCD<=0){R.dingCD=.62;const p=byId(R.slots.head);SND.ding(BTN_PITCH[p.col]);catHear('ding');p.rot=.4;R.sq=1.06;}
    if(c.foot==='button'){R.spinV=Math.max(R.spinV,dir!==0?13:4);if(dir!==0&&gap('twirl',.9))tone(1200,.12,{to:1600,v:.05});}
    // shelf: big jump
    if(SHELF.item!=null&&Math.abs(R.x-SHELF_X)<95&&R.h<.5&&!busy){
      if(c.hopFoot&&R.jumpCD<=0){R.vh=c.foot==='spring'?1020:960;R.jumpCD=2.2;R.jumpBig=1;SND.boing(true);R.sq=.7;}
      else if(!c.hopFoot&&!c.fly&&R.reachT<=0&&!R.target){R.reachT=2.6;R.vh=200;R.surprise=.5;LOG.push({k:'reachFail',t:+T.toFixed(1)});}
    }
    // updraft from chef's steam
    if(HELP.steam>.9&&c.umbOpen&&Math.abs(R.x-RES.chef.x)<80&&R.h<170&&R.steamCD<=0){R.vh=Math.max(R.vh,330);if(R.h<5){R.steamCD=0;LOG.push({k:'steamLift',t:+T.toFixed(1)});}}
    // spring pad
    if(HELP.pad>.9&&Math.abs(R.x-PAD_X)<34&&R.h<.5&&R.padCD<=0&&R.z>.35){R.vh=760;R.padCD=1.2;SND.boing(true);HELP.padSq=.5;LOG.push({k:'pad',t:+T.toFixed(1)});}
    // gravity
    if(R.h>0||R.vh>0){R.vh-=1500*dt;
      if(c.umbOpen&&R.vh<-130)R.vh=-130;if(c.featherArm&&R.vh<-260)R.vh=-260;
      R.h+=R.vh*dt;
      if(R.h<=0){if(R.vh<-320){SND.thud();R.sq=.78;burst('dust',R.x,gy(R.z),4);const fp=byId(R.slots.foot);if(fp&&fp.type==='glove'){fp.puff=1.3;}}
        if(R.x>PUD.x0+12&&R.x<PUD.x1-12&&R.vh<-150)splash(R.x,gy(R.z));
        R.h=0;R.vh=0;R.jumpBig=0;}}
    if(R.jumpBig&&SHELF.item!=null&&R.h>230&&Math.abs(R.x-SHELF_X)<130)grabShelf('jump');
  }
  if(R.mode==='fly'&&SHELF.item!=null&&R.h>260&&Math.abs(R.x-SHELF_X)<110)grabShelf('fly');
  // wobble when two wheels missing etc.
  const acc=(R.mode==='ground'?(lo.k==='skate'?260:700):360)*dt;
  R.vx=approach(R.vx,tvx,acc);
  if(lo.k==='skate'&&dir===0&&R.mode==='ground')R.vx*=1-dt*1.2;
  R.x=clamp(R.x+R.vx*dt,80,WORLD_W-80);
  if(R.mode!=='fly'||C.pin!=='arm')R.tz=approach(R.tz,.55,dt*.2);
  if(R.mode==='fly')R.z=approach(R.z,R.tz,dt*.9);
  if(R.mode!=='fly'||c.pin!=='head')R.flip=approach(((R.flip+Math.PI)%TAU+TAU)%TAU-Math.PI,0,dt*5);
  for(const r of RES_LIST){const d=Math.abs(r.x-R.x);if(d<160&&!R.target)R.waited[r.id]=(R.waited[r.id]||0)+dt;else if(d>600)R.waited[r.id]=0;}
  // wheels rolling distance + sounds
  R.wheelA+=R.vx*dt/34;
  if(c.wheels&&R.h<2&&Math.abs(R.vx)>40&&R.mode==='ground'){
    R.dist+=Math.abs(R.vx)*dt;R.rollTick+=Math.abs(R.vx)*dt;
    if(R.rollTick>70){R.rollTick=0;SND.tick(R.rollTick%2?210:250);if(Math.random()<.5)spawn('dust',R.x-sgn(R.vx)*50,gy(R.z)-4,{vy:-30,g:0,life:.4,s:5});}
    if(R.dist>140){if(flag('d1wheel')){SND.success(1);proud(1.6);}
      if(F.d1mill&&!F.d1back&&T-F.d1mill>1)flag('d1back','wheels again after hat');}
    if(!F.catStartle&&Math.abs(R.x-CAT.x)<260){CAT.startle=1.3;CAT.vh=360;SND.startle();flag('catStartle');}
  }
  if(c.wheels&&LV.state==='swept'&&Math.abs(R.x-LV.heapX)<60&&Math.abs(R.vx)>100&&gap('heap',1.2)){burst('leaf',LV.heapX,50,10,{col:'#f0a050',vy:-200,g:300,life:1.2});SND.sweep();}
  // windmill by hat
  if(c.hat){const hp=byId(R.slots.head);hp.spinV=Math.max(hp.spinV,10+Math.abs(R.vx)*.03+(R.h>0?6:0));
    if(Math.random()<dt*8){const [hx,hy]=slotPos('head');spawn('whirl',hx+rnd(-30,30),hy-10,{vy:-60,vx:(WM_X-hx)*.4,g:0,life:.6,s:rnd(6,10)});}
    if(Math.abs(R.x-WM_X)<200){WM.v=Math.min(17,WM.v+dt*11);WM.hot+=WM.v>9?dt:0;
      if(WM.hot>1.1&&WM.cd<=0){WM.cd=14;WM.hot=0;WM.flut=1;WIND.boost=20;SND.chime();SND.gust();sparkle(WM_X,WM_Y,12);
        RES.chef.happy=Math.max(RES.chef.happy,1.2);RES.chef.lookUp=2;
        if(flag('d1mill')){SND.success(2);}proud();}}}
  // waving
  if(c.gloveArm&&R.waveCD<=0&&R.awake&&R.mode==='ground'&&DAY.phase==='day'&&!R.inShow){
    let best=null,bd=380;for(const r of RES_LIST){const d=Math.abs(r.x-R.x);if(d<bd&&r.walkT===0){bd=d;best=r;}}
    if(best){R.waveT=1.7;R.waveCD=7;SND.wave();best.waveBackAt=.35;best.waveFrom=1;}
    else if(Math.abs(CAT.x-R.x)<300){R.waveT=1.4;R.waveCD=6;CAT.paw=1.4;SND.wave();}
  }
  // sweeping
  if(c.broomArm&&LV.state==='pile'&&Math.abs(R.x-LV.x)<150&&R.h<2&&R.awake){

      R.sweepT=Math.max(R.sweepT,.3);
      LV.amount-=dt/2.6;LV.heap=Math.min(1,LV.heap+dt/2.6);
      if(Math.random()<dt*14)spawn('leaf',LV.x+rnd(-80,80),rnd(20,60),{vx:(LV.heapX-LV.x)*rnd(.8,1.4),vy:rnd(-220,-80),g:320,life:.9,col:pick(['#f0a050','#e8873e','#f3b45c']),s:rnd(8,12)});

    }else if(R.swishCD<=0){
      R.swishCD=2.4;R.swish=.6;LV.amount=Math.max(.82,LV.amount-.04);SND.sweep();

      else{const v=Math.min(d,320*dt);b.x+=dx/d*v;b.y+=dy/d*v;b.f=sgn(dx)||1;}}
    else{const [hx,hy]=slotPos('head',partVisualOffset(byId(R.slots.head))||[0,-20]);b.x=hx+16;b.y=hy-28;}
  }
  finishRobot(dt,c);
}
function finishRobot(dt,c){
  // tilt / balance
  let tt=clamp(c.imb*.12,-.42,.42);
  R.danger=Math.abs(c.imb)>1.5?Math.min(3,R.danger+dt):Math.max(0,R.danger-dt*2);
  if(Math.abs(c.imb)>1.5)tt+=Math.sin(T*7)*.07;
  if(R.supported>0)tt*=.25;
  if(R.bird&&R.bird.perch)tt+=.16;
  tt+=clamp(R.vx*.0005,-.12,.12);
  if(R.mode==='fly'&&c.pin==='side')tt+=sgn(R.vx)*.15;
  R.tiltV+=(tt-R.tilt)*60*dt;R.tiltV*=1-Math.min(1,dt*7);R.tilt+=R.tiltV*dt;
  R.sqV+=(1-R.sq)*260*dt;R.sqV*=1-Math.min(1,dt*10);R.sq+=R.sqV*dt;
  R.spinA+=R.spinV*dt;R.spinV=Math.max(0,R.spinV-dt*6);
  if(R.spinV<.5){const m=((R.spinA%TAU)+TAU)%TAU;R.spinA+=((m>Math.PI?TAU:0)-m)*Math.min(1,dt*6);}
  R.sxv=(.3+.7*Math.abs(Math.cos(R.spinA)))*(2-R.sq);
  R.oy=gy(R.z)-R.h-R.lift-R.stageLift;
  // look target
  const dp=anyDrag();
  let lx=R.lx,ly=R.ly;
  if(dp){lx=dp.x;ly=dp.y;}
  else if(R.leadPtr&&PTRS.get(R.leadPtr)){const q=PTRS.get(R.leadPtr);lx=sx2wx(q.sx);ly=sy2wy(q.sy);}
  else if(HINT.hand){const p=HINT.hand.part;lx=p.x;ly=p.y;}
  else if(R.target){lx=R.target.x;ly=-120;}
  else if(idleT>4&&HINT.part){lx=HINT.part.x;ly=HINT.part.y;}
  else if(R.bird&&R.bird.perch){lx=R.bird.x;ly=R.bird.y;}
  else{if(Math.random()<dt*.4){const o=pick([CAT.x,RES.chef.x,R.x+rnd(-200,200),RES.gran.x]);R.lookX=o;R.lookY=rnd(-200,60);}lx=R.lookX||R.x;ly=R.lookY||-100;}
  R.lx=lerp(R.lx,lx,Math.min(1,dt*10));R.ly=lerp(R.ly,ly,Math.min(1,dt*10));
  // part anims on robot
  for(const k of SLOT_KEYS){const id=R.slots[k];if(id==null)continue;const p=byId(id),kind=SLOTS[k].k;
    if(p.type==='lid'&&kind==='side')p.spin=R.wheelA;
    if(p.type==='umbrella')p.open=approach(p.open,kind==='foot'||kind==='chest'?0:1,dt*6);
    if(p.type==='glove'&&kind==='arm'){p.rot=R.waveT>0?Math.sin(T*13)*.55:(R.sweepT>0?Math.sin(T*11)*.4:Math.sin(T*2)*.06);}
    if(p.type==='broom'&&kind==='arm'){p.rot=R.sweepT>0?Math.sin(T*11)*.5:R.swish>0?Math.sin(R.swish*10)*.5:0;}
    if(p.type==='pinwheel'){p.spinV=3+Math.abs(WIND.v)*6+Math.abs(R.vx)*.03+(R.mode==='fly'?14:0)+(c.hat?6:0);}
    if(p.type==='button'&&kind==='foot')p.spin=R.spinA;
    if(p.type==='spring')p.rot+=dt*(R.h>0?14:4);
    if(p.type==='feather'&&kind==='arm')p.rot=Math.sin(T*(R.h>0?16:4))*.35;
  }
  R.swish=Math.max(0,(R.swish||0)-dt);
  // grandma support
  const gr=RES.gran;
  if(R.danger>1.1&&DAY.phase==='day'&&!R.inShow&&!gr.supportGo){gr.supportGo=1;LOG.push({k:'granSupportStart',t:+T.toFixed(1)});}
  if(gr.supportGo&&Math.abs(c.imb)<1.2){gr.supportGo=Math.max(0,gr.supportGo-dt*.6);}
  R.supported=gr.supportGo&&Math.abs(gr.x-R.x)<110?1:0;
  if(R.supported&&!F.granSupport)flag('granSupport');
}
function arrive(id){
  if(id==='cat'){CAT.ear=1;}
  if(R.target==null&&id&&RES[id]){const r=RES[id];r.waveBackAt=.2;}
}
function grabShelf(how){
  const p=byId(SHELF.item);if(!p)return;
  SHELF.item=null;p.x=SHELF_X;p.y=SHELF_Y-24;sendFly(p,'mat',null,1.1);
  SND.reveal();sparkle(SHELF_X,SHELF_Y-20,14);
  if(flag('d2shelf',how+':'+p.type)){SND.success(3);}
  proud();R.jumpBig=0;
  RES.gran.happy=Math.max(RES.gran.happy,1.2);
}
function revealLeaves(){
  SND.reveal();SND.success(3);
  const items=LV.items.slice();LV.items=[];
  items.forEach((id,i)=>{const p=byId(id);if(!p)return;p.where='world';p.x=LV.x+(i-(items.length-1)/2)*70;p.y=60;p.vy=-380;p.wy=60+i*6;p.hop=0;});
  sparkle(LV.x,40,16,'#ffe9a0');
  flag('d3sweep',items.map(id=>byId(id).type).join('+'));
  proud();RES.cleaner.happy=2;RES.cleaner.clap=2;
}
function splash(x,y){if(gap('spl',.22))SND.splash();burst('drop',x,y-6,6,{vy:-260,g:900,life:.6});ripple(x,y,1);}
function ripple(x,y,kind){
  PUD.rip.push({x,y,t:0,k:kind||1});if(PUD.rip.length>26)PUD.rip.shift();
  if(Math.random()<.45){PUD.glint.push({x:x+rnd(-20,20),y:y+rnd(-8,8),life:1,hue:rnd(0,360),w:rnd(10,20)});if(PUD.glint.length>22)PUD.glint.shift();}
}

function computeActs(c){
  const s={wheel:0,spin:0,jump:0,air:0,wave:0,bell:0,swirl:0,sweep:0,flutter:0,dance:.6};
  if(c.wheels)s.wheel+=2.5+c.wheels;
  if(c.hat)s.spin+=2.6;
  if(c.hopFoot)s.jump+=3.2;
  if(c.umbOpen)s.air+=3;if(c.sail)s.air+=1.4;
  if(c.gloveArm)s.wave+=2.1;
  s.bell+=c.buttons.length*1.6;
  if(c.pin){s.swirl+=2.2;if(c.umbOpen)s.air+=.8;}
  if(c.broomArm)s.sweep+=1.9;
  if(c.featherArm||c.head==='feather')s.flutter+=1.6;
  for(const k of SLOT_KEYS)if(c[k]==='flower'||c[k]==='star')s.dance+=.9;
  const acts=Object.keys(s).filter(k=>s[k]>0).sort((a,b)=>s[b]-s[a]);
  return acts.filter((k,i)=>i===0||s[k]>=1.5).slice(0,3);
}
const ACT_GROUP={wheel:'turn',spin:'turn',jump:'hop',wave:'hop',air:'sky',swirl:'sky',flutter:'sky',bell:'bell',sweep:'bloom',dance:'bloom'};
function showRobot(dt,c){
  const act=SH.act;R.showA+=dt;
  const beatPos=SH.beatF%1;
  R.stageLift=SH.h;
  let tx=SX,tz=.5,th=0;
  switch(act){
  case 'wheel':{R.ang=(R.ang||0)+dt*1.9;tx=SX+Math.cos(R.ang)*120;tz=.5+Math.sin(R.ang)*.22;R.wheelA+=dt*6;break;}
  case 'spin':R.spinV=Math.max(R.spinV,14);if(c.hat){const hp=byId(R.slots.head);hp.spinV=18;}break;
  case 'jump':tx=SX+(SH.beat%4<2?-85:85);break;
  case 'air':th=110+Math.sin(R.showA*2)*45;tx=SX+Math.sin(R.showA*1.1)*90;if(c.pin==='head')R.flip=(R.showA*2.5)%TAU;break;
  case 'wave':R.waveT=Math.max(R.waveT,.5);break;
  case 'bell':th=beatPos<.3?18:0;break;
  case 'swirl':R.spinV=Math.max(R.spinV,7);th=40+Math.sin(R.showA*3)*20;break;
  case 'sweep':tx=SX+Math.sin(R.showA*1.4)*110;R.sweepT=Math.max(R.sweepT,.2);break;
  case 'flutter':th=30+Math.abs(Math.sin(R.showA*5))*50;break;
  default:tx=SX+Math.sin(R.showA*2)*40;R.tiltV+=Math.sin(R.showA*6)*.6*dt*60*.02;
  }
  const nx=lerp(R.x,tx,Math.min(1,dt*(act==='wheel'?12:4)));R.vx=(nx-R.x)/Math.max(dt,1e-4);R.x=nx;
  R.z=lerp(R.z,tz,Math.min(1,dt*6));
  if(act==='jump'){if(R.h<=0&&R.vh<=0&&SH.beatHit){R.vh=560;R.sq=.8;const fp=byId(R.slots.foot);if(fp)fp.puff=.75;}
    R.vh-=1500*dt;R.h=Math.max(0,R.h+R.vh*dt);if(R.h===0&&R.vh<-300){R.vh=0;R.sq=.82;}}
  else{R.h=lerp(R.h,th,Math.min(1,dt*5));R.vh=0;}
  if(act!=='air'||c.pin!=='head')R.flip=approach(((R.flip+Math.PI)%TAU+TAU)%TAU-Math.PI,0,dt*5);
  R.stunt=1;
}

function updRes(r,dt){
  r.t+=dt;
  for(const k of ['happy','wave','clap','point','shake','cheer','mouth','tiltQ','lookUp','glassesUp'])r[k]=Math.max(0,(r[k]||0)-dt);
  if(r.waveBackAt>0){r.waveBackAt-=dt;if(r.waveBackAt<=0){r.waveBackAt=0;r.wave=1.6;
    if(r.waveFrom){r.waveFrom=0;if(flag('d2wave',r.id)){SND.success(2);}SND.wave();proud(1.4);}}}
  if(r.giftAt>0){r.giftAt-=dt;if(r.giftAt<=0){r.giftAt=0;giveGift(r);}}
  // where to stand
  let tx=r.homeX,ty=r.homeY;
  if(r.seat){tx=r.seat[0];ty=r.seat[1];}
  else if(r.id==='gran'&&r.supportGo){tx=R.x+(C.imb>0?78:-78);ty=clamp(gy(R.z)-10,10,120);}
  const dx=tx-r.x;
  if(Math.abs(dx)>6){const sp=r.supportGo?230:r.seat?170:110;r.x+=sgn(dx)*Math.min(Math.abs(dx),sp*dt);r.walkT+=dt;r.face=sgn(dx);
    if(r.x>PUD.x0&&r.x<PUD.x1&&gap('rs'+r.id,.4))splash(r.x,r.y);}
  else{r.walkT=0;}
  r.y=approach(r.y,ty,dt*90);
  // jump
  if(r.h>0||r.vh>0){r.vh-=1400*dt;r.h+=r.vh*dt;if(r.h<=0){r.h=0;r.vh=0;if(r.happy>.6){r.vh=300;}}}
  // owned part status
  const p=ownerPart(r);
  let want=0;
  if(p&&!r.has){
    if(p.where==='robot'&&nearRobot(r))want=1;
    if(p.where==='drag'&&Math.hypot(p.x-r.x,p.y-(r.y-80))<240)want=1.4;
    if(p.where==='mat'&&nearRobot(r))want=.7;
  }
  r.want=lerp(r.want,want,Math.min(1,dt*6));
  if(want>0&&!r.happy){if(Math.random()<dt*1.6&&r.h===0&&want>.9)r.vh=200;}
  // look
  let lx=R.x,ly=R.oy-100;
  if(r.want>.3&&p){lx=p.x;ly=p.y;}
  else if(r.lookUp>0){lx=r.id==='chef'?WM_X:R.x;ly=-320;}
  else if(idleT>4&&HINT.part&&Math.abs(HINT.part.x-r.x)<700&&!r.happy){lx=HINT.part.x;ly=HINT.part.y;}
  else if(!F.d1wheel&&!r.has&&p&&(r.gestT>0)){lx=r.x+r.face*30;ly=r.y+20;}
  if(r.walkT===0&&!r.seat&&!r.supportGo)r.face=sgn(lx-r.x)||r.face;
  const ddx=(lx-r.x)*r.face,ddy=ly-(r.y-104);const dd=Math.hypot(ddx,ddy)||1;
  r.lookDX=lerp(r.lookDX||0,ddx/dd,Math.min(1,dt*8));r.lookDY=lerp(r.lookDY||0,ddy/dd,Math.min(1,dt*8));
  // idle gesture while missing their thing
  r.gest-=dt;
  if(r.gest<=0){r.gest=rnd(4,7);if(!r.has&&!r.dayReturned)r.gestT=1.8;}
  r.gestT=Math.max(0,(r.gestT||0)-dt);
  // arm targets (0 down .. PI up) left & right in body space
  let aL=.15,aR=.15;
  const inv=idleT>4&&HINT.to&&HINT.to.res===r.id;
  if(r.id==='gran'&&R.supported){aL=1.5;aR=1.5;}
  else if(r.happy>0){aL=2.7+Math.sin(T*14)*.25;aR=2.7+Math.sin(T*14+1)*.25;}
  else if(r.wave>0){aR=2.6+Math.sin(T*12)*.45;aL=.3;}
  else if(r.clap>0){const k=Math.sin(T*16)>0?1:0;aL=1.2+k*.25;aR=1.2+k*.25;if(gap('clap'+r.id,.32))SND.clap();}
  else if(r.cheer>0){aL=2.4;aR=2.4;}
  else if(r.want>.4||inv){aL=1.5+Math.sin(T*6)*.15;aR=1.6+Math.sin(T*6+1)*.15;}
  else if(r.point>0){aR=1.55;aL=.2;r.face=sgn(R.x-r.x)||1;}
  else if(r.has){aL=.9;aR=.9;}
  else if(r.gestT>0){
    if(r.id==='chef'){aL=.95;aR=.95;r.peek=1;}
    else if(r.id==='cleaner'){aR=r.variant?2.9:.6;aL=.3;r.tiltQ=Math.max(r.tiltQ,.3);}
    else{aR=2.5;aL=.3;r.glassesUp=Math.max(r.glassesUp,.5);}
  }
  else if(r.id==='chef'){aL=.85;aR=.85;}
  if(r.shake>0){r.tilt=Math.sin(T*18)*.08;}else r.tilt=lerp(r.tilt,(r.tiltQ>0?.18:0)+(r.peek&&r.gestT>0?.12:0),Math.min(1,dt*6));
  r.peek=r.gestT>0&&r.id==='chef'?1:0;
  r.armL=lerp(r.armL,aL,Math.min(1,dt*10));r.armR=lerp(r.armR,aR,Math.min(1,dt*10));
  r.glasses=lerp(r.glasses||0,r.glassesUp>0?1:0,Math.min(1,dt*8));
}
function updCat(dt){
  const c=CAT;c.startle=Math.max(0,c.startle-dt);c.paw=Math.max(0,c.paw-dt);c.ear=Math.max(0,c.ear-dt*.7);c.purr=Math.max(0,c.purr-dt);

}

function updShow(dt){
  if(SH.pending>0){SH.pending-=dt;if(SH.pending<=0){SH.pending=0;if(SH.state==='none'&&DAY.phase==='day')startShow();}}
  SH.flash=Math.max(0,(SH.flash||0)-dt*2);
  if(SH.state==='none')return;
  SH.t+=dt;
  if(SH.state==='rise'){
    SH.h=elastic(clamp((SH.t-.4)/2.2,0,1))*48;SH.doors=ease((SH.t-1)/1.6);
    if(Math.random()<dt*20&&SH.t<2.6)spawn('dust',SX+rnd(-170,170),SY+rnd(-10,20),{vy:-80,g:0,life:.7,s:8});
    if(SH.t>2.6){SH.state='on';SH.t=0;SH.beatT=0;MUS.on=true;enterStage();
      const acts=computeActs(C);SH.acts=acts;SH.act=acts[0];
      flag('d6show','first:'+RETURN_ORDER[0]+' last:'+SH.prop+' act:'+SH.act+' lamps:'+SH.lamps.length);
      SND.success(6);}
    return;
  }
  if(SH.state==='sink'){SH.h=Math.max(0,SH.h-dt*40);SH.doors=Math.max(0,SH.doors-dt*.8);if(SH.h<=0&&SH.doors<=0){SH.state='none';}return;}
  // ON
  SH.rot+=dt*(SH.act==='wheel'||SH.act==='spin'?1.4:.6);
  const spb=60/SH.bpm/2;
  SH.beatT+=dt;SH.beatHit=false;
  SH.beatF=SH.beatT/spb/2;
  const step=Math.floor(SH.beatT/spb);
  if(step!==SH.beat){SH.beat=step;if(step%2===0)SH.beatHit=true;playStep(step);
    // re-evaluate choreography immediately when parts change; cycle among acts
    const acts=computeActs(C);const key=acts.join();
    if(key!==SH.actsKey){SH.actsKey=key;SH.acts=acts;SH.act=acts[0];SH.actSwap=1;LOG.push({k:'showAct',t:+T.toFixed(1),info:acts.join('>')});}
    else if(step%16===0&&acts.length>1){SH.act=acts[(acts.indexOf(SH.act)+1)%acts.length];SH.actSwap=1;}
    if(step%2===0)for(const r of RES_LIST)if(r.seat)r.cheer=.25;
    if(step%8===0&&SH.act==='wave')for(const r of RES_LIST)if(r.seat)r.wave=.9;
    if(step%2===0&&Math.random()<.5)spawn('note',SX+rnd(-150,150),SY-SH.h-60,{vy:-60,g:-10,life:1.4,col:pick(THEME[SH.theme]),s:7});
  }
  SH.actSwap=Math.max(0,(SH.actSwap||0)-dt*2);
  const grp=ACT_GROUP[SH.act]||'bloom';SH.group=grp;
  for(const k of ['turn','hop','sky','bell','bloom'])SH.devA[k]=approach(SH.devA[k]||0,k===grp?1:0,dt*2.5);
  if(grp==='sky'&&Math.random()<dt*8)spawn('bubble',SX+rnd(-160,160),SY-SH.h,{vy:-70,vx:rnd(-20,20),g:-10,life:2.4,col:'#9fd6f0',s:rnd(6,12),drag:.3});
  if(grp==='turn'&&Math.random()<dt*10){const a=rnd(0,TAU);spawn('spark',SX+Math.cos(a)*170,SY-SH.h+Math.sin(a)*45,{vy:-40,g:0,life:.7,col:pick(THEME[SH.theme])});}
  if(grp==='bloom'&&Math.random()<dt*6)spawn('confetti',SX+rnd(-180,180),SY-300,{vy:60,vx:rnd(-30,30),g:60,life:3,col:pick(['#f48ca0','#f6d36b','#9fd3b8','#c7b3e6']),s:9,drag:.6});
  // gifts of extra decorations
  if(!SH.decor&&SH.t>20){SH.decor=true;
    RETURN_ORDER.forEach((id,i)=>{setTimeout(()=>{if(parts.length>=18)return;const r=RES[id];const tp=pick(['flower','star']);
      const p=mkPart(tp,'fly',tp==='flower'?pick(['#f7a3c6','#c7b3e6','#ffb27a']):pick(['#ffd45e','#9fd6f0','#f4a9a3']));
      const [hx,hy]=resHand(r,1);p.x=hx;p.y=hy;sendFly(p,'mat',null,1.2);p.fly.arc=260;r.cheer=1.5;SND.pass();
      if(i===RETURN_ORDER.length-1)flag('decor',RETURN_ORDER.length+'');},i*600);});}
  // robot left the stage?
  if(!R.inShow&&!R.toStage){SH.leftT+=dt;if(Math.abs(R.x-SX)<120&&R.h<5&&!anyDrag()&&!R.leadPtr){enterStage();}}
  else SH.leftT=0;
  // new day: only when the child has stopped playing for a while, or wandered away after the gifts
  if(SH.decor&&DAY.phase==='day'&&(idleT>24||SH.leftT>8))startEvening();
}
function startEvening(){DAY.phase='evening';DAY.t=0;MUS.on=false;SND.gust();

  LOG.push({k:'evening',t:+T.toFixed(1)});}
function updDay(dt){
  if(DAY.phase==='day'){DAY.tint=approach(DAY.tint,0,dt);return;}
  DAY.t+=dt;
  if(DAY.phase==='evening'){DAY.tint=Math.min(1,DAY.t/2);
    if(DAY.t>2.3){newDay();DAY.phase='morning';DAY.t=0;LOG.push({k:'morning',t:+T.toFixed(1)});}}
  else if(DAY.phase==='morning'){DAY.tint=Math.max(0,1-DAY.t/2);if(DAY.t>2.2){DAY.phase='day';R.surprise=.5;SND.wake();}}
}

const PAT={
  wheel:[0,2,4,2,5,4,2,1,0,2,4,6,5,4,2,-1],
  spin:[4,-1,5,-1,6,5,4,2,4,-1,5,-1,7,6,5,-1],

  air:[4,-1,-1,5,-1,-1,7,-1,6,-1,-1,4,-1,-1,2,-1],

function playStep(step){
  if(!aOK())return;
  const base={chef:262,cleaner:294,gran:330}[SH.instr]||262;
  const pat=PAT[SH.act]||PAT.dance,n=pat[step%16];
  if(n>=0){const f=base*Math.pow(2,PENTA[n]/12);
    if(SH.instr==='chef'){tone(f,.28,{type:'triangle',v:.13});tone(f*4,.05,{v:.03});}
    else if(SH.instr==='cleaner'){tone(f*2,.26,{v:.08,vib:6,a:.03});}
    else{tone(f*2,.5,{v:.08});tone(f*6,.15,{v:.025});}
    if(SH.act==='bell'&&C.buttons.length){const p=byId(R.slots[C.buttons[step%C.buttons.length]]);if(p&&step%4===0)SND.ding(BTN_PITCH[p.col]);}}
  if(step%4===0)tone(base/2,.25,{type:'triangle',v:.16});
  if(SH.act==='jump'||SH.act==='wave'){if(step%8===4)SND.clap();if(step%4===0)noise(.08,{ft:'lowpass',f:180,v:.2});}
  else if(SH.act==='wheel'||SH.act==='spin'){noise(.03,{ft:'highpass',f:6000,v:.05});}
  else if(SH.act==='air'||SH.act==='swirl'){if(step%2===0)noise(.12,{f:3500,q:2,v:.03});}
  else if(step%4===2)noise(.05,{f:2500,v:.06});
}

function updParts(dt){
  for(const p of parts){
    p.sqV+=(1-p.sq)*300*dt;p.sqV*=1-Math.min(1,dt*9);p.sq+=p.sqV*dt;
    p.puff=lerp(p.puff,1,Math.min(1,dt*5));
    p.spin+=p.spinV*dt;if(!(p.where==='robot'))p.spinV=Math.max(0,p.spinV-dt*4);
    if(p.type==='pinwheel'&&p.where!=='robot')p.spinV=Math.max(p.spinV,1.5+Math.abs(WIND.v)*3);
    if(p.hop>0||p.hopV>0){p.hopV-=1200*dt;p.hop+=p.hopV*dt;if(p.hop<=0){p.hop=0;p.hopV=0;p.sq=.82;}}
    if(p.where!=='robot')p.open=approach(p.open,p.type==='umbrella'?.45:0,dt*3);
    switch(p.where){
    case 'mat':{const [hx,hy]=matHome(p);const k=Math.min(1,dt*14);p.x+=(hx-p.x)*k;p.y+=(hy-p.y)*k;if(p.type!=='glove'&&p.type!=='broom')p.rot=lerp(p.rot,0,k);break;}
    case 'robot':{const [x,y]=slotPos(p.slot,partVisualOffset(p));p.x=x;p.y=y;break;}
    case 'drag':{const q=PTRS.get(p.ptr);if(q){const tx=sx2wx(q.sx),ty=sy2wy(q.sy)-34;p.x=lerp(p.x,tx,Math.min(1,dt*30));p.y=lerp(p.y,ty,Math.min(1,dt*30));}
      else{sendFly(p,'mat');}break;}
    case 'fly':{const f=p.fly;f.t+=dt/f.dur;const [tx,ty]=flyTarget(p);const k=ease(Math.min(1,f.t));
      p.x=lerp(f.fx,tx,k);p.y=lerp(f.fy,ty,k)-Math.sin(Math.min(1,f.t)*Math.PI)*f.arc;p.rot+=dt*4;
      if(f.t>=1){p.rot=0;p.fly=null;
        if(f.kind==='slot'){if(R.slots[f.arg]==null||R.slots[f.arg]===p.id)attachPart(p,f.arg);else{sendFly(p,'mat');}}
        else if(f.kind==='res'){p.where='resident';}
        else{p.where='mat';p.sq=.7;SND.tick(320);}}
      break;}
    }
  }
  // hover socket for dragged part
  const dp=anyDrag();
  if(dp){const ns=nearestSlot(dp.x,dp.y,150);const nh=ns?ns.slot:null;if(nh!==R.hover&&nh)tone(660+SLOT_KEYS.indexOf(nh)*40,.05,{v:.05});R.hover=nh;}
  else R.hover=null;
}
function nearestSlot(x,y,maxd){
  let best=null,bd=maxd;
  for(const k of SLOT_KEYS){const [sx,sy]=slotPos(k);let ox=0,oy=0;
    if(k==='head')oy=-16;if(k==='foot')oy=10;
    const d=Math.hypot(x-sx-ox,y-sy-oy)*(R.slots[k]!=null?1.12:1);if(d<bd){bd=d;best={slot:k,d};}}
  return best;
}

// ============================================================
//  INPUT
// ============================================================
const PTRS=new Map();
function partAt(x,y){
  let best=null,bd=1e9;
  for(const p of parts){
    if(p.ptr!=null||p.where==='leaves'||p.where==='fly')continue;
    let px=p.x,py=p.y,r=PT[p.type].r*1.35+10;
    if(p.where==='mat'){r=PT[p.type].r*1.45*matScale()+12;py-=p.hop;}
    if(p.where==='shelf'){r=50;}
    if(p.where==='robot'){r=PT[p.type].r*1.4+12;}
    const d=Math.hypot(x-px,y-py);
    if(d<r&&d<bd){bd=d;best=p;}
  }
  return best;
}
function robotBodyAt(x,y){const sc=robotScale(R.z);const lx=(x-R.x)/sc,ly=(y-R.oy)/sc;return Math.abs(lx)<62&&ly>-178&&ly<10+R.lift;}
function onDown(e){
  audioStart();
  idleT=0;
  const sx=e.clientX,sy=e.clientY,x=sx2wx(sx),y=sy2wy(sy);
  const q={id:e.pointerId,sx,sy,x0:sx,y0:sy,t0:performance.now(),kind:'none',moved:0};
  PTRS.set(e.pointerId,q);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(!firstTouch){firstTouch=true;}
  if(!R.awake){wakeRobot();}
  if(DAY.phase!=='day'){q.kind='none';return;}
  const p=partAt(x,y);
  if(p){
    if(p.where==='shelf'){p.stuck=.5;SND.no();q.kind='tap';R.target={x:SHELF_X,id:'shelf',kind:'user'};R.userT=12;R.surprise=.4;return;}
    if(p.where==='resident'){const r=RES[p.holder];r.has=false;p.holder=null;r.mouth=1;r.tiltQ=.4;LOG.push({k:'borrow',t:+T.toFixed(1),info:r.id});}
    q.kind='part';q.part=p.id;q.from={where:p.where,slot:p.slot};
    if(p.where==='robot')detachPart(p),SND.detach();else SND.pick(p.type);
    p.where='drag';p.ptr=e.pointerId;p.sq=1.25;p.hop=0;p.hopV=0;
    if(p.type==='glove')p.puff=1.2;
    if(p.type==='umbrella')p.open=.6;
    R.surprise=.3;
    return;
  }
  if(robotBodyAt(x,y)&&!R.leadPtr){q.kind='lead';R.leadPtr=e.pointerId;R.giggle=.4;return;}
  const r=resAt(x,y);
  if(r){q.kind='tap';r.wave=1.2;r.mouth=.8;SND.tick(500);if(SH.state!=='on'){R.target={x:r.x+(R.x<r.x?-100:100),id:r.id,kind:'user'};R.userT=12;}return;}
  if(Math.abs(x-CAT.x)<44&&y>CAT.y-90&&y<CAT.y+12){q.kind='tap';CAT.paw=1.2;CAT.ear=1;CAT.purr=1;SND.meow();R.target={x:CAT.x-110,id:'cat',kind:'user'};R.userT=12;return;}
  if(Math.abs(x-WM_X)<90&&y>WM_Y-90&&y<WM_Y+90){q.kind='tap';WM.v+=4;SND.whirr();R.target={x:WM_X-30,id:'mill',kind:'user'};R.userT=12;return;}
  if(Math.abs(x-LV.x)<110&&y>0&&y<100&&LV.state==='pile'){q.kind='tap';LV.swish=.5;burst('leaf',x,y,3,{col:'#f0a050'});SND.sweep();R.target={x:LV.x+20,id:'leaves',kind:'user'};R.userT=12;return;}
  if(((x-PUD.cx)/PUD.rx)**2+((y-PUD.cy)/PUD.ry)**2<1){q.kind='tap';ripple(x,y,1);SND.splash();R.target={x:farBank(),id:'puddle',kind:'user'};R.userT=12;return;}
  if(SH.h>10&&Math.abs(x-SX)<190&&y>SY-SH.h-60&&y<SY+30){q.kind='tap';if(!R.inShow&&!R.toStage)enterStage();return;}
  if(y>0&&y<160){q.kind='tap';spawn('dust',x,y,{vy:-20,g:0,life:.4,s:6});SND.tick(300);
    if(Math.abs(x-R.x)>40){R.target={x:clamp(x,90,WORLD_W-90),id:'spot',kind:'user'};R.userT=8;R.tz=clamp((y-30)/100,.1,.9);}return;}
  // unrelated: tiny soft dent
  q.kind='tap';spawn('ring',x,y,{vy:0,vx:0,g:0,life:.4,s:10,col:'#ffffff'});SND.tick(380);
}
function onMove(e){
  const q=PTRS.get(e.pointerId);if(!q)return;
  q.sx=e.clientX;q.sy=e.clientY;q.moved=Math.max(q.moved,Math.hypot(q.sx-q.x0,q.sy-q.y0));
  idleT=0;
  if(q.kind==='lead'){const x=sx2wx(q.sx),y=sy2wy(q.sy);
    if(q.moved>10){R.target={x:clamp(x,90,WORLD_W-90),id:'lead',kind:'user'};R.userT=10;if(y>10&&y<170)R.tz=clamp((y-30)/100,.1,.9);
      if(R.inShow&&Math.abs(x-SX)>200){R.inShow=false;R.h=Math.max(R.h,0);R.stageLift=SH.h;}}}
}
function onUp(e,cancel){
  const q=PTRS.get(e.pointerId);if(!q)return;PTRS.delete(e.pointerId);
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(q.kind==='part'){const p=byId(q.part);if(p&&p.where==='drag'){p.ptr=null;
      if(cancel){sendFly(p,'mat');return;}
      const x=p.x,y=p.y;
      const ns=nearestSlot(x,y,108);
      const r=resAt(x,y+20);
      const rd=r?Math.hypot(x-r.x,y-(r.y-r.h-80)):1e9;
      if(ns&&(ns.d<rd||!r)){attachPart(p,ns.slot,{swapFrom:q.from.where==='robot'?q.from.slot:null});}
      else if(r){if(!dropOnRes(p,r,q.from)){sendFly(p,'mat');p.fly.arc=150;SND.back();}}
      else{sendFly(p,'mat');p.fly.arc=120;p.sq=.6;SND.back();}
    }}
  else if(q.kind==='lead'){R.leadPtr=null;
    if(q.moved<12&&performance.now()-q.t0<450)robotTapAction();}
}
function robotTapAction(){
  const c=C;R.giggle=.8;R.sq=1.15;
  if(c.hopFoot&&R.h<1){R.vh=420;SND.boing(c.foot==='spring');}
  else if(c.head==='button'){SND.ding(BTN_PITCH[byId(R.slots.head).col]);catHear('ding');}
  else if(c.hat){byId(R.slots.head).spinV=20;SND.whirr();}
  else if(c.gloveArm){R.waveT=1.4;SND.wave();}
  else if(c.armL==='lid'||c.armR==='lid'||c.chest==='lid'){SND.clang();catHear('clang');}
  else if(c.foot==='button'){R.spinV=16;}
  else SND.giggle();
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();onDown(e);},{passive:false});
cv.addEventListener('pointermove',e=>{e.preventDefault();onMove(e);},{passive:false});
cv.addEventListener('pointerup',e=>{e.preventDefault();onUp(e,false);},{passive:false});
cv.addEventListener('pointercancel',e=>{onUp(e,true);});
cv.addEventListener('lostpointercapture',e=>{if(PTRS.has(e.pointerId))onUp(e,false);});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(n=>
  document.addEventListener(n,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
function releaseAll(){for(const [id,q] of PTRS){onUp({pointerId:id},true);}PTRS.clear();R.leadPtr=null;}

// ============================================================
//  LOOP
// ============================================================
let lastT=performance.now(),raf=0,running=false;
function step(dt){
  T+=dt;idleT+=dt;
  C=cfg();
  updWorld(dt);
  updRobot(dt);
  for(const r of RES_LIST)updRes(r,dt);
  updCat(dt);
  updParts(dt);
  updShow(dt);
  updDay(dt);
  updHint(dt);
  updParticles(dt);
  // camera
  let cx=R.inShow||SH.state==='rise'?SX:R.x;
  if(anyDrag())cx=camX;
  cx=visW>=WORLD_W?WORLD_W/2:clamp(cx,visW/2,WORLD_W-visW/2);
  camX+=(cx-camX)*Math.min(1,dt*2.6);
}
function frame(now){
  if(!running)return;
  raf=requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))dt=0;if(dt>.05)dt=.05;
  let total=dt*timeScale;
  while(total>0){const d=Math.min(total,1/50);step(d);total-=d;}
  render();
}
function start(){if(running)return;running=true;lastT=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){releaseAll();stop();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}start();}
});
window.addEventListener('pagehide',()=>{releaseAll();});
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{layout();camX=clamp(camX,visW/2,Math.max(visW/2,WORLD_W-visW/2));},60);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);

// ============================================================
//  BOOT
// ============================================================
loadSave();
photos=store.data.photos.slice();
layout();
initWorld();
camX=clamp(R.x,visW/2,WORLD_W-visW/2);
C=cfg();
render();
start();

// test / verification hooks (engineering only)
window.__G={R,parts,F,LOG,RES,CAT,SH,LV,SHELF,WIND,WM,HELP,DAY,PUD,store,ATTACH_LOG,RETURN_ORDER,HINT,
  cfg:()=>C,photos:()=>photos,
  setTimeScale:v=>{timeScale=v;},
  w2s:(x,y)=>[wx2sx(x),wy2sy(y)],
  slotScreen:s=>{const [x,y]=slotPos(s);return [wx2sx(x),wy2sy(y)];},
  partScreen:id=>{const p=byId(id);return [wx2sx(p.x),wy2sy(p.y-(p.hop||0))];},
  resScreen:id=>{const r=RES[id];return [wx2sx(r.x),wy2sy(r.y-80)];},
  byType:t=>parts.filter(p=>p.type===t).map(p=>({id:p.id,where:p.where,slot:p.slot,owner:p.owner,holder:p.holder})),
  setWind:v=>{WIND.v=WIND.target=v;WIND.t=60;},
  teleport:(x)=>{R.x=x;camX=clamp(x,visW/2,WORLD_W-visW/2);},
  hint:()=>({part:HINT.part?HINT.part.id:null,to:HINT.to,key:HINT.key,lm:HINT.lm}),
  view:()=>({W,H,S,visW,matH,baseY,camX,DPR,SAFE:Object.assign({},SAFE)}),
  particles:()=>particles.length,
  time:()=>T,idle:()=>idleT,frame:()=>FRAME,audio:()=>AC?AC.state:'none',running:()=>running,
  bench:n=>{const t0=performance.now();for(let i=0;i<n;i++){step(1/60);render();}return (performance.now()-t0)/n;},
  integrity:()=>{const seen={};for(const k of SLOT_KEYS){const id=R.slots[k];if(id==null)continue;if(seen[id])return 'dup '+id;seen[id]=1;const p=byId(id);if(p.where!=='robot'||p.slot!==k)return 'mismatch '+k;}
    for(const p of parts){if(p.where==='robot'&&R.slots[p.slot]!==p.id)return 'orphan '+p.id;if(p.where==='drag'&&!PTRS.has(p.ptr))return 'stuckdrag '+p.id;}return 'ok';},
};
})();
</script>
