<script>
(()=>{
'use strict';
/* ============================================================
   ぽけっとコートの、ちいさな四つの国
   手編みニットとガラス細工のミニチュア・ストップモーション調
   ============================================================ */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>(t=clamp(t,0,1),t*t*(3-2*t));
const backOut=t=>{t=clamp(t,0,1);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const R=(a,b)=>a+(b-a)*Math.random();
const pick=a=>a[(Math.random()*a.length)|0];
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const qs=new URLSearchParams(location.search);
let seedS=qs.has('seed')?(+qs.get('seed')||1):((Date.now()%1000003)|0);
function rnd(){seedS|=0;seedS=seedS+0x6D2B79F5|0;let t=Math.imul(seedS^seedS>>>15,1|seedS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const rpick=a=>a[(rnd()*a.length)|0];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;const x=a[i];a[i]=a[j];a[j]=x;}return a;}

/* ------------------------------------------------------------
   Audio : Web Audio synth (starts on first touch)
   ------------------------------------------------------------ */
const PENTA=[0,2,4,7,9];
const NOTE=i=>{const o=Math.floor(i/5),n=((i%5)+5)%5;return 523.25*Math.pow(2,(PENTA[n]+12*o)/12);};
const A={
  c:null,m:null,nb:null,
  init(){
    try{
      if(!this.c){
        const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
        this.c=new AC();
        this.m=this.c.createGain(); this.m.gain.value=0.55;
        const comp=this.c.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4;
        this.m.connect(comp); comp.connect(this.c.destination);
        const len=(this.c.sampleRate*0.8)|0; this.nb=this.c.createBuffer(1,len,this.c.sampleRate);
        const d=this.nb.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      }
      this.resume();
    }catch(e){}
  },
  resume(){ const c=this.c; if(c&&c.state!=='running'&&!document.hidden){ try{ const p=c.resume(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } },
  suspend(){ const c=this.c; if(c&&c.state==='running'){ try{ const p=c.suspend(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } },
  ok(){ return !!(this.c&&this.c.state==='running'); },
  o(f,d,o={}){
    if(!this.ok()) return;
    try{
      const c=this.c,t=c.currentTime+(o.dl||0);
      const os=c.createOscillator(),g=c.createGain();
      os.type=o.ty||'sine'; f=clamp(f,20,9000); os.frequency.setValueAtTime(f,t);
      if(o.to) os.frequency.exponentialRampToValueAtTime(clamp(o.to,20,9000),t+(o.gt||d));
      if(o.vib){ const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=o.vib; lg.gain.value=f*0.03; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t+d+0.05); }
      const v=o.v||0.2,a=o.a||0.005;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      os.connect(g);
      if(o.lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; g.connect(fl); fl.connect(this.m); }
      else g.connect(this.m);
      os.start(t); os.stop(t+d+0.05);
    }catch(e){}
  },
  n(d,o={}){
    if(!this.ok()) return;
    try{
      const c=this.c,t=c.currentTime+(o.dl||0);
      const s=c.createBufferSource(); s.buffer=this.nb; s.loop=true;
      const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t); f.Q.value=o.q||1;
      if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+d);
      const g=c.createGain(); const v=o.v||0.1;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      s.connect(f); f.connect(g); g.connect(this.m); s.start(t,Math.random()*0.5); s.stop(t+d+0.05);
    }catch(e){}
  },
  // ---- instruments ----
  knit(p=0){ this.n(0.14,{f:380,q:0.8,v:0.32}); this.o(150,0.2,{to:85,v:0.32}); this.o(240+p*30,0.32,{to:420+p*40,ty:'triangle',v:0.12,dl:0.06,lp:1800}); },
  unravel(){ this.n(0.55,{f:2200,q:3,v:0.07,to:5200,a:0.05}); for(let i=0;i<7;i++) this.o(700+i*90,0.06,{ty:'triangle',v:0.05,dl:0.1+i*0.05}); },
  zip(open){ for(let i=0;i<12;i++) this.n(0.03,{f:open?2600+i*140:4200-i*140,q:4,v:0.2,dl:i*0.028}); this.o(open?660:520,0.14,{ty:'triangle',v:0.08,dl:0.34}); },
  glass(p=0,v=0.13){ const f=NOTE(p+5); this.o(f,1.3,{v}); this.o(f*2.76,0.6,{v:v*0.35}); this.o(f*5.4,0.3,{v:v*0.2}); },
  bubble(p=0){ this.o(260+p*50,0.16,{to:820+p*90,v:0.13}); },
  pop(){ this.o(900,0.06,{to:1600,v:0.08}); this.n(0.04,{f:3000,q:2,v:0.06}); },
  petal(p=0){ this.o(NOTE(p),0.55,{ty:'triangle',v:0.08,a:0.04}); this.n(0.4,{f:5500,q:0.6,v:0.025,a:0.1}); },
  bee(){ this.o(190,0.5,{ty:'sawtooth',v:0.025,lp:800,vib:28}); },
  voice(base,kind=''){
    const b=base*(0.95+Math.random()*0.1);
    if(kind==='surprise'){ this.o(b,0.16,{to:b*2.1,ty:'square',v:0.035,lp:2600}); }
    else if(kind==='happy'){ this.o(b,0.09,{to:b*1.4,ty:'square',v:0.03,lp:2600}); this.o(b*1.25,0.12,{to:b*1.8,ty:'square',v:0.03,lp:2600,dl:0.1}); }
    else if(kind==='sleepy'){ this.o(b*0.8,0.4,{to:b*0.6,ty:'triangle',v:0.05}); }
    else { this.o(b,0.1,{to:b*1.3,ty:'square',v:0.03,lp:2400}); }
  },
  success(){ [0,2,4,5,7].forEach((n,i)=>{ const f=NOTE(n+5); this.o(f,0.7,{v:0.12,dl:i*0.08}); this.o(f*2,0.4,{v:0.04,dl:i*0.08}); }); },
  tiny(){ this.o(560+Math.random()*80,0.07,{ty:'triangle',v:0.03}); },
  freeze(){ for(let i=0;i<6;i++) this.glass(9-i,0.06+(i===0?0.04:0)); this.n(0.8,{f:7000,q:0.5,v:0.03,a:0.2}); },
  crack(){ for(let i=0;i<4;i++) this.o(1800+Math.random()*1500,0.05,{ty:'triangle',v:0.04,dl:i*0.05}); },
  drip(p=0){ this.o(1300-p*60,0.12,{to:600,v:0.07}); },
  honey(){ this.o(NOTE(3),0.3,{ty:'triangle',v:0.08}); this.o(NOTE(5),0.4,{v:0.08,dl:0.08}); },
  whoosh(){ this.n(0.7,{f:500,to:2400,q:0.7,v:0.12,a:0.2}); },
  boing(p=0){ this.o(200+p*25,0.3,{to:520+p*40,ty:'sine',v:0.14}); },
  cheer(){ [0,4,7,9,12,9,12,14].forEach((n,i)=>{ this.o(NOTE(n),0.5,{v:0.09,dl:i*0.11,ty:'triangle'}); this.o(NOTE(n)*2,0.25,{v:0.03,dl:i*0.11}); }); },
  munch(){ for(let i=0;i<3;i++) this.n(0.05,{f:1200,q:1.5,v:0.08,dl:i*0.12}); },
  chime(){ this.o(NOTE(7),0.9,{v:0.06}); this.o(NOTE(9),0.9,{v:0.05,dl:0.12}); },
};

/* ------------------------------------------------------------
   globals & state
   ------------------------------------------------------------ */
let W=0,H=0,DPR=1,SAFE={t:0,r:0,b:0,l:0},L=null,PZ={ox:0,oy:0,s:1};
let T=0,lastNow=0,running=true;
let phase='coat',phaseT=0,festT=0;
let round=0,entrance='snow';
let pal=null,knitPat=null,feltPat=null,liningPat=null;
const C={};
const D=new Set();
const LOG=[];
let Wd=null,F=null,fam=[],guests=[],parts=[],travelers=[],flyers=[],ripples=[];
let lastPointer={x:-999,y:-999,t:-99},idleT=0,hint=null,hintTimer=0,demo=null,demoDone=new Set(),firstTouch=false,wakeT=-9;
let fav=null,tapCount=0;
const MAXP=170;
const PERF=[];
function logE(ev){ LOG.push({t:+T.toFixed(2),ev}); if(LOG.length>500) LOG.shift(); }
function discover(k){ if(!D.has(k)){ D.add(k); logE('DISCOVER '+k); } }

/* ------------------------------------------------------------
   storage (favorite decoration only)
   ------------------------------------------------------------ */
const SKEY='pocketcoat17_fav_v1';
const DECOS=['berry','sflower','star','cherry'];
function loadFav(){
  let s=null;
  try{ s=localStorage.getItem(SKEY); }catch(e){ return null; }
  if(!s) return null;
  try{ const o=JSON.parse(s); if(o&&typeof o==='object'&&DECOS.indexOf(o.kind)>=0&&typeof o.hue==='number'&&isFinite(o.hue)) return {kind:o.kind,hue:clamp(o.hue,0,360)}; }catch(e){}
  try{ localStorage.removeItem(SKEY); }catch(e){}
  return null;
}
function saveFav(f){ try{ localStorage.setItem(SKEY,JSON.stringify({kind:f.kind,hue:Math.round(f.hue)})); return true; }catch(e){ return false; } }

/* ------------------------------------------------------------
   layout
   ------------------------------------------------------------ */
const KEYS=['snow','candy','flower','sea'];          // cycle of countries
const POSC=['TL','TR','BR','BL'];                    // cycle of positions
const SIDE={TL:{TR:'R',BL:'L'},TR:{TL:'L',BR:'R'},BR:{BL:'L',TR:'R'},BL:{BR:'R',TL:'L'}};
const INNER={TL:'R',TR:'L',BL:'R',BR:'L'};
function readSafe(){
  try{ const st=getComputedStyle(safeEl); SAFE={t:parseFloat(st.paddingTop)||0,r:parseFloat(st.paddingRight)||0,b:parseFloat(st.paddingBottom)||0,l:parseFloat(st.paddingLeft)||0}; }catch(e){}
}
function layout(){
  W=Math.max(200,window.innerWidth|0); H=Math.max(200,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  readSafe();
  const top=SAFE.t+4,bot=H-SAFE.b-4,lft=SAFE.l+4,rgt=W-SAFE.r-4;
  const portrait=H>=W*1.02;
  L={portrait,top,bot,lft,rgt,coat:{},fest:{}};
  if(portrait){
    const ah=bot-top;
    const chestH=clamp(ah*0.13,64,170);
    L.chest={x:lft+(rgt-lft)*0.06,y:top+ah*0.02,w:(rgt-lft)*0.38,h:chestH};
    L.brooch={x:lft+(rgt-lft)*0.8,y:top+ah*0.02+chestH*0.55};
    L.collar={x:W/2,y:top-4,w:(rgt-lft)*0.2,h:chestH*0.7};
    L.buttons=[{x:W/2,y:top+chestH*0.85,r:clamp(W*0.025,8,20)},{x:W/2,y:top+chestH*1.12,r:clamp(W*0.025,8,20)}];
    const gy0=L.chest.y+chestH+ah*0.025;
    const g=Math.max(6,(rgt-lft)*0.022);
    const cw=(rgt-lft-g)/2,rh=(bot-gy0-g)/2;
    L.coat.TL={x:lft,y:gy0,w:cw,h:rh}; L.coat.TR={x:lft+cw+g,y:gy0,w:cw,h:rh};
    L.coat.BL={x:lft,y:gy0+rh+g,w:cw,h:rh}; L.coat.BR={x:lft+cw+g,y:gy0+rh+g,w:cw,h:rh};
    const ph=ah*0.25, frh=(ah-ph-8)/2, fw=(rgt-lft-6)/2;
    L.fest.TL={x:lft,y:top,w:fw,h:frh}; L.fest.TR={x:lft+fw+6,y:top,w:fw,h:frh};
    L.fest.BL={x:lft,y:top+frh+ph+8,w:fw,h:frh}; L.fest.BR={x:lft+fw+6,y:top+frh+ph+8,w:fw,h:frh};
    L.plaza={x:lft,y:top+frh+4,w:rgt-lft,h:ph};
    L.pent={TL:[-70,-80],TR:[70,-80],BL:[-70,88],BR:[70,88]};
  }else{
    const ah=bot-top,aw=rgt-lft;
    const cc=aw*0.17,g=Math.max(8,aw*0.01);
    const colW=(aw-cc)/2-g, rh=(ah-g)/2;
    L.chest={x:W/2-cc*0.44,y:top+ah*0.12,w:cc*0.88,h:clamp(ah*0.2,70,190)};
    L.brooch={x:W/2,y:top+ah*0.07};
    L.collar={x:W/2,y:top-4,w:cc*0.5,h:ah*0.09};
    L.buttons=[]; for(let i=0;i<4;i++) L.buttons.push({x:W/2,y:L.chest.y+L.chest.h+ah*0.1+i*ah*0.13,r:clamp(cc*0.09,9,22)});
    L.coat.TL={x:lft,y:top,w:colW,h:rh}; L.coat.TR={x:rgt-colW,y:top,w:colW,h:rh};
    L.coat.BL={x:lft,y:top+rh+g,w:colW,h:rh}; L.coat.BR={x:rgt-colW,y:top+rh+g,w:colW,h:rh};
    const fcw=aw*0.335, frh=(ah-8)/2;
    L.fest.TL={x:lft,y:top,w:fcw,h:frh}; L.fest.TR={x:rgt-fcw,y:top,w:fcw,h:frh};
    L.fest.BL={x:lft,y:top+frh+8,w:fcw,h:frh}; L.fest.BR={x:rgt-fcw,y:top+frh+8,w:fcw,h:frh};
    L.plaza={x:lft+fcw+6,y:top,w:aw-fcw*2-12,h:ah};
    L.pent={TL:[-150,-60],TR:[150,-60],BL:[-150,70],BR:[150,70]};
  }
  const pl=L.plaza; PZ.s=Math.min(pl.w/310,pl.h/215); PZ.ox=pl.x+pl.w/2; PZ.oy=pl.y+pl.h*(L.portrait?0.5:0.56);
  buildPatterns();
  updTransforms();
}
function updTransforms(){
  const fe=sstep(festT);
  for(const k of KEYS){
    const c=C[k]; if(!c) continue;
    const a=L.coat[c.pos],b=L.fest[c.pos];
    const r={x:lerp(a.x,b.x,fe),y:lerp(a.y,b.y,fe),w:lerp(a.w,b.w,fe),h:lerp(a.h,b.h,fe)};
    c.rect=r; c.s=Math.min(r.w/236,r.h/292); c.ox=r.x+r.w/2; c.oy=r.y+r.h-64*c.s; c.topL=Math.min(-206,-(c.oy-r.y)/c.s+28);
  }
}

/* ------------------------------------------------------------
   textures (knit / felt / lining)
   ------------------------------------------------------------ */
const PALS=[
  {knit:[38,42,86],name:'oat'},{knit:[330,30,80],name:'rose'},{knit:[120,18,74],name:'sage'},{knit:[205,30,78],name:'sky'},{knit:[22,52,80],name:'peach'}
];
function hsl(h,s,l,a){ return a===undefined?`hsl(${h},${s}%,${l}%)`:`hsla(${h},${s}%,${l}%,${a})`; }
function mkPattern(cw,ch,draw){
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(cw*DPR)); c.height=Math.max(1,Math.round(ch*DPR));
  const g=c.getContext('2d'); g.scale(DPR,DPR); draw(g,cw,ch);
  const p=ctx.createPattern(c,'repeat');
  try{ if(p&&p.setTransform&&window.DOMMatrix) p.setTransform(new DOMMatrix([1/DPR,0,0,1/DPR,0,0])); }catch(e){}
  return p;
}
function buildPatterns(){
  if(!pal) return;
  const [h,s,l]=pal.knit;
  knitPat=mkPattern(14,12,(g,w,hh)=>{
    g.fillStyle=hsl(h,s,l-22); g.fillRect(0,0,w,hh);
    for(let row=-1;row<2;row++){
      const y=row*hh+hh/2;
      for(const [cx,rot] of [[3.6,0.95],[10.4,-0.95]]){
        g.save(); g.translate(cx,y); g.rotate(rot);
        const gr=g.createLinearGradient(0,-3,0,3); gr.addColorStop(0,hsl(h,s,l+6)); gr.addColorStop(1,hsl(h,s,l-8));
        g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,4.6,2.6,0,0,TAU); g.fill();
        g.strokeStyle=hsl(h,s,l-28,0.5); g.lineWidth=0.6; g.stroke();
        g.fillStyle=hsl(h,s,l+12,0.5); g.beginPath(); g.ellipse(-0.8,-0.8,2.2,0.9,0,0,TAU); g.fill();
        g.restore();
      }
    }
  });
  feltPat=mkPattern(40,40,(g,w,hh)=>{
    let sd=7; const rr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
    for(let i=0;i<140;i++){ const x=rr()*w,y=rr()*hh,a=rr()*TAU,ln=1+rr()*3;
      g.strokeStyle=rr()<0.5?'rgba(255,255,255,0.5)':'rgba(0,0,0,0.35)'; g.lineWidth=0.5;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*ln,y+Math.sin(a)*ln); g.stroke(); }
  });
  liningPat=mkPattern(36,36,(g,w,hh)=>{
    g.fillStyle='#5b2e4f'; g.fillRect(0,0,w,hh);
    g.strokeStyle='rgba(255,214,140,0.55)'; g.lineWidth=1; g.setLineDash([3,2.5]);
    g.beginPath(); g.moveTo(0,hh/2); g.lineTo(w/2,0); g.lineTo(w,hh/2); g.lineTo(w/2,hh); g.closePath(); g.stroke();
    g.setLineDash([]); g.fillStyle='rgba(255,220,160,0.5)'; g.beginPath(); g.arc(w/2,hh/2,1.4,0,TAU); g.fill();
    const gr=g.createRadialGradient(w/2,hh/2,2,w/2,hh/2,w*0.6); gr.addColorStop(0,'rgba(255,255,255,0.08)'); gr.addColorStop(1,'rgba(0,0,0,0.12)');
    g.fillStyle=gr; g.fillRect(0,0,w,hh);
  });
}

/* ------------------------------------------------------------
   drawing helpers
   ------------------------------------------------------------ */
function rrp(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function felt(col,a=0.3){ ctx.fillStyle=col; ctx.fill(); if(feltPat){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=feltPat; ctx.fill(); ctx.restore(); } }
function stitch(col='rgba(255,255,255,0.75)',lw=1.6,dash=[4,3.4]){ ctx.save(); ctx.setLineDash(dash); ctx.lineWidth=lw; ctx.strokeStyle=col; ctx.lineCap='round'; ctx.stroke(); ctx.restore(); }
function edge(col='rgba(0,0,0,0.25)',lw=1.2){ ctx.lineWidth=lw; ctx.strokeStyle=col; ctx.stroke(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,Math.max(0.01,r),0,TAU); }
function ell(x,y,rx,ry,rot=0){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot,0,TAU); }
function boil(){ return Math.floor(T*8)%3; }
function blobP(x,y,rx,ry,sd=0,amp=0.05){

function chooseHint(){

    if(Wd.passenger&&!Wd.passRevealed&&Wd.aloft) return 'flower:balloon';
    if(Wd.boxReady&&!Wd.boxOpen&&isOpen(C.candy)&&Wd.boxDrop<0.1) return 'candy:box';
    if(isOpen(C.snow)&&Wd.mitten==='none'&&T-C.snow.openedAt>2.5) return 'snow:chimney';
    for(const m of fam){ if(!m.found&&m.st==='hidden'&&C[m.spotC].target===0) return 'pocket:'+m.spotC; }
    const pairs=[['snow','candy','ice'],['candy','flower','cake'],['sea','flower','balloon'],['sea','snow','glasshat']];
    for(const [a,b,d] of pairs){ if(D.has(d)) continue; if(isOpen(C[a])&&C[b].target===0) return 'pocket:'+b; if(isOpen(C[b])&&C[a].target===0) return 'pocket:'+a; }
    for(const k of KEYS) if(C[k].target===0) return 'pocket:'+k;

    for(const k of KEYS){ const g=F.hidden&&F.hidden[k]; if(g&&!g.found) return 'guest:'+k; }

  if(hint){ const t=targets.find(q=>q.key===hint.key); if(t){ hint.pos=t.rect?{x:t.rect.x+t.rect.w/2,y:t.rect.y+t.rect.h*0.45}:{x:t.x,y:t.y}; } else hint.pos=null; }
  if(hint&&hint.pos&&!demo&&(phase==='coat'||phase==='fest')){
    if((idleT>5&&!demoDone.has(hint.key))||(idleT>24&&!demoDone.has(hint.key+'#2'))){ demoDone.add(idleT>24?hint.key+'#2':hint.key); demo={key:hint.key,t:0}; logE('demo hand: '+hint.key); }
  }
  if(demo){ demo.t+=dt; if(demo.t>2.4||!hint||hint.key!==demo.key) demo=null; }
}
function drawHintFx(){
  if(!hint||!hint.pos) return; const p=hint.pos;
  if(phase!=='coat'&&phase!=='fest') return;
  const a=idleT>3.5?1:0.55;
  for(let i=0;i<3;i++){ const an=T*1.6+i*TAU/3; const rr=26+Math.sin(T*3+i)*4; star4(p.x+Math.cos(an)*rr,p.y-8+Math.sin(an)*rr*0.7,(3+Math.sin(T*6+i*2)*1.5)*a,0.85*a); }
  if(demo){ const t=demo.t; const k=t<0.6?sstep(t/0.6):1; const press=(t>0.7&&t<1.0)||(t>1.3&&t<1.6)?1:0; const ox=lerp(70,0,k),oy=lerp(90,0,k); drawHand(p.x+ox+4,p.y+oy+4,clamp(Math.min(W,H)*0.09,34,70),press);
    if(press){ ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2; circ(p.x,p.y,14+((t*10)%3)*4); ctx.stroke(); } }
}
function drawRipples(){ for(let i=ripples.length-1;i>=0;i--){ const r=ripples[i]; const k=(T-r.t)/0.6; if(k>1){ ripples.splice(i,1); continue; } ctx.beginPath(); ctx.arc(r.x,r.y,8+k*22,0,TAU); ctx.save(); ctx.globalAlpha=1-k; stitch('rgba(255,255,255,0.8)',1.6,[3,3]); ctx.restore(); } }

/* ------------------------------------------------------------
   input
   ------------------------------------------------------------ */
function gatherTargets(){
  const out=[]; if(phase!=='coat'&&phase!=='fest') return out;
  for(const k of KEYS){ const c=C[k];
    const Pt=(key,x,y,r,pri,act)=>{ const p=toS(c,x,y); out.push({key,x:p[0],y:p[1],r:Math.max(r*c.s,24),pri,act}); };
    if(c.target===0&&c.t<0.6){ if(phase==='coat'){ const a=toS(c,-114,c.topL-10),b=toS(c,114,60); out.push({key:'pocket:'+k,rect:{x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1]},pri:1,act:()=>togglePocket(c)}); } continue; }
    if(c.target===1&&c.t>0.6){
      if(phase==='coat'||F.ready) Pt('close:'+k,0,45,20,phase==='fest'?5:2,()=>{ if(phase==='fest') startFold(k); else togglePocket(c); });
      if(c.t>0.8){ TARGETS[k](c,Pt);
        for(const m of fam){ if(!m.found&&m.st==='hidden'&&m.spotC===k&&!(Wd.passenger&&Wd.passenger.id===m.id)){ const sp=SPOTS[k][FAMSPOT[k]]; Pt('spot:'+m.id,sp.x,sp.y-6,26,4,()=>findMember(m)); } }
        if(phase==='fest'&&F.hidden){ const g=F.hidden[k]; if(g&&!g.found){ const sp=SPOTS[k][g.spot]; Pt('guest:'+k,sp.x,sp.y-6,22,4,()=>findGuest(k)); } } } } }
  for(const m of fam){ if(!m.found||m.st==='intro') continue; const p=memPos(m); if(!p) continue; if(m.node&&m.node!=='plaza'&&C[m.node].t<0.7&&m.st!=='lip') continue; out.push({key:'m:'+m.id,x:p[0],y:p[1]-m.S*SZ(p[2])*0.4,r:Math.max(m.S*SZ(p[2])*0.62,22),pri:3,act:()=>tapMember(m)}); }
  for(const g of guests){ const p=memPos(g); if(!p) continue; if(g.node&&g.node!=='plaza'&&C[g.node].t<0.7) continue; out.push({key:'g:'+g.id,x:p[0],y:p[1]-g.S*SZ(p[2])*0.4,r:Math.max(g.S*SZ(p[2])*0.6,22),pri:2,act:()=>tapMember(g)}); }
  if(phase==='coat'&&L.chest){ const r=L.chest; out.push({key:'chest',rect:{x:r.x,y:r.y,w:r.w,h:r.h},pri:allFound()?3:0,act:tapChest}); }
  if(phase==='fest') plazaTargets(out);
  return out;
}
function hitTest(x,y,ts){ let best=null,bs=1e9;
  for(const t of ts){ let sc;
    if(t.rect){ const r=t.rect; if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) sc=0.8; else continue; }
    else { const d=Math.hypot(x-t.x,y-t.y); if(d>t.r) continue; sc=d/t.r; }
    sc-=t.pri*0.25; if(sc<bs){ bs=sc; best=t; } }
  return best; }
function onTap(x,y){
  tapCount++; lastPointer={x,y,t:T};
  if(!firstTouch){ firstTouch=true; wakeT=T; A.boing(1); logE('first touch'); }
  const wasIdle=idleT; idleT=0;
  if(phase!=='coat'&&phase!=='fest'){ ripples.push({x,y,t:T}); return; }
  const t=hitTest(x,y,gatherTargets());
  if(t){ try{ t.act(x,y); }catch(err){ console.warn(err); } burst('ring',x,y,1,{sp:0,sz:12,g:0}); if(demo&&demo.key===t.key) demo=null; }
  else { ripples.push({x,y,t:T}); A.tiny(); idleT=Math.min(wasIdle,2.5); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); A.init(); onTap(e.clientX,e.clientY); },{passive:false});
for(const ev of ['pointermove','pointerup','pointercancel']) cv.addEventListener(ev,e=>e.preventDefault(),{passive:false});
for(const ev of ['touchstart','touchmove','touchend']) document.addEventListener(ev,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
for(const ev of ['gesturestart','gesturechange','dblclick','contextmenu','selectstart']) document.addEventListener(ev,e=>e.preventDefault(),{passive:false});

/* ------------------------------------------------------------
   rounds
   ------------------------------------------------------------ */
function newRound(entr){
  round++; entrance=entr;
  let k=0,d=1;
  if(round>1){ d=rnd()<0.5?1:-1; k=(rnd()*4)|0; }
  for(let i=0;i<4;i++){ const key=KEYS[(((k+d*i)%4)+4)%4]; C[key].pos=POSC[i]; }
  for(const key of KEYS){ const c=C[key]; c.door={}; for(const o of KEYS){ if(o===key) continue; const sd=SIDE[c.pos][C[o].pos]; if(sd) c.door[o]=sd; }
    c.t=0; c.target=0; c.press=0; c.everOpened=false; c.openedFlag=false; c.combo=0; c.hj=Math.round((rnd()-0.5)*14); c.lastToggle=-9; }
  const base=PALS[(round-1)%PALS.length]; pal={knit:[(base.knit[0]+Math.round((rnd()-0.5)*16)+360)%360,base.knit[1],base.knit[2]]};
  Wd=freshWorld(); F=freshFest();
  const spots=shuffle(['candy','sea','flower']);
  fam=[mkMember('dad',spots[0]),mkMember('mom',spots[1]),mkMember('kid',spots[2]),mkMember('baby','snow')];
  guests=[]; travelers=[]; flyers=[]; parts.length=0;
  Wd.rare=qs.has('rare')?true:(round>1&&rnd()<0.3);
  F.variant=qs.get('finale')||rpick(['lantern','petal','bubble','cake']);
  if(fav) Wd.cake.decos.push({kind:fav.kind,hue:fav.hue,pop:1});
  hint=null; demo=null; demoDone=new Set(); idleT=0; festT=0; phase='coat'; phaseT=0;
  if(L){ buildPatterns(); updTransforms(); }
  logE('ROUND '+round+' entrance='+entr+' layout='+KEYS.map(q=>q+':'+C[q].pos).join(',')+' hide='+fam.map(m=>m.id+'@'+m.spotC).join(',')+(Wd.rare?' rare':''));
}

/* ------------------------------------------------------------
   main loop
   ------------------------------------------------------------ */
function update(dt){
  T+=dt; phaseT+=dt; idleT+=dt;
  for(const k of KEYS){ const c=C[k]; const sp=c.target?1.3:1.7; c.t=clamp(c.t+(c.target?1:-1)*sp*dt,0,1); c.press=Math.max(0,c.press-dt*6);
    if(c.target&&c.t>=0.85&&!c.openedFlag){ c.openedFlag=true; onOpened(c); } }
  if(phase==='reveal'){ if(phaseT>1.9) startOpen(); }
  else if(phase==='open'){ festT=clamp(phaseT/3,0,1); if(phaseT<1.2&&Math.random()<dt*10) A.boing((phaseT*8)|0); if(festT>=1) startFest(); }
  else if(phase==='fold'){ if(phaseT>0.5) for(const k of KEYS) if(C[k].target) togglePocket(C[k],0); festT=1-clamp((phaseT-0.6)/2.2,0,1); if(phaseT>3.3){ const key=F.foldKey||'snow'; newRound(key); } }
  updTransforms();
  bezCache.clear();
  updWorld(dt);
  if(phase==='fest') updFest(dt);
  for(const m of fam) updMember(m,dt);
  for(const g of guests) updMember(g,dt);
  updTravelers(dt); updFlyers(dt); updParticles(dt);
  updHint(dt,gatherTargets());
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackdrop();
  drawCoat();
  drawSeams();
  const order=KEYS.slice().sort((a,b)=>(C[a].pos[0]==='T'?0:1)-(C[b].pos[0]==='T'?0:1));
  for(const k of order) drawCountry(C[k]);
  drawPlaza();
  drawTravelers();
  drawActors();
  drawFlyers(); drawFlyersExtra();
  drawParticles();
  if(phase==='open'){ const k=sstep(clamp(phaseT/2.4,0,1)); const r=L.chest; const a=[r.x+r.w/2,r.y+r.h*0.4],b=girlPos(); drawGirl(lerp(a[0],b[0],k),lerp(a[1],b[1],k)-Math.sin(k*Math.PI)*60,lerp(Math.max(40,r.h*0.9),46*PZ.s,k),{wave:true}); }
  drawHintFx();
  drawRipples();
}
function frame(now){
  if(!running) return;
  const dt=Math.min(0.05,Math.max(0,(now-lastNow)/1000)||0.016); lastNow=now;
  try{ const t0=performance.now(); update(dt); draw(); PERF.push(performance.now()-t0); if(PERF.length>120) PERF.shift(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function resume(){ if(running) return; running=true; lastNow=performance.now(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ running=false; A.suspend(); } else { resume(); A.resume(); } });
window.addEventListener('pagehide',()=>{ running=false; A.suspend(); });
window.addEventListener('pageshow',()=>{ resume(); A.resume(); });
let rzT=0; function onResize(){ clearTimeout(rzT); rzT=setTimeout(()=>{ layout(); },60); }
window.addEventListener('resize',onResize); window.addEventListener('orientationchange',onResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',onResize);

fav=loadFav();
newRound('snow');
layout();
lastNow=performance.now();
requestAnimationFrame(frame);

// test / verification hooks (no UI)
window.__G={
  get phase(){return phase;}, get festT(){return festT;}, get round(){return round;}, get entrance(){return entrance;},
  C, D, LOG, get fam(){return fam;}, get guests(){return guests;}, get Wd(){return Wd;}, get F(){return F;},
  get hint(){return hint&&hint.key;}, get parts(){return parts.length;}, get T(){return T;},
  targets(){ return gatherTargets().map(t=>({key:t.key,x:t.x,y:t.y,r:t.r,rect:t.rect})); },
  find(key){ const t=gatherTargets().find(q=>q.key===key); if(!t) return null; return t.rect?{x:t.rect.x+t.rect.w/2,y:t.rect.y+t.rect.h/2}:{x:t.x,y:t.y}; },
  fav:()=>fav,
  perf(){ const a=PERF.slice().sort((x,y)=>x-y); return {avg:+(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2),p90:+a[(a.length*0.9)|0].toFixed(2)}; },
};
})();
</script>
