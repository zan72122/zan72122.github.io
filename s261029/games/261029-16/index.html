const TAU = Math.PI * 2;

  ok() { return !!(this.ctx && this.ctx.state === 'running' && !document.hidden); },
  gate(name, ms) { const n = performance.now(); if (this.last[name] && n - this.last[name] < ms) return false; this.last[name] = n; return true; },
  osc(f, dur, o = {}) {

    const os = c.createOscillator(), g = c.createGain();
    os.type = o.type || 'sine';
    os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || dur));
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = f * 0.012; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.05); }
    const v = o.vol == null ? 0.2 : o.vol, a = o.att || 0.006;

  // ---- sound effects

  rustle() { if (!this.gate('rustle', 90)) return; this.nz(0.22, { f: 2600, fTo: 900, q: 0.7, vol: 0.13 }); this.osc(300, 0.16, { type: 'sine', to: 460, vol: 0.08 }); },

// ------------------------------------------------------------------ graph

// ------------------------------------------------------------------ camera / projection
const cam = { cx: 350, cy: 500, yaw: 0, tilt: 0, zoom: 1, scx: 0, scy: 0, D: 1500, c: 1, s: 0, ct: 1, st: 0 };

const P = { x: 0, y: 0, k: 1, d: 0 };
function proj(x, y, z = 0, o = P) {

// ------------------------------------------------------------------ screen layout
const V = { w: 0, h: 0, dpr: 1, land: false, sa: { t: 0, r: 0, b: 0, l: 0 }, tray: { x: 0, y: 0, w: 0, h: 0 }, map: { x: 0, y: 0, w: 0, h: 0 }, mapCam: { yaw: 0, zoom: 1, scx: 0, scy: 0 }, u: 1 };

}
function layout() {

  V.land = w > h * 1.05;

  V.mapCam = { yaw, zoom, scx: V.map.x + V.map.w / 2, scy: V.map.y + V.map.h / 2 };
