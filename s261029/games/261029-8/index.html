<script>
'use strict';
// =====================================================================
//  かめさんのじょうろ屋さん！商店街のありがとうパーティー
//  文字なし・単一ファイル・Canvas2D + WebAudio
// =====================================================================
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
const probe = document.getElementById('safe');
let g = mainCtx;
let W = 1, H = 1, DPR = 1, SAFE = { l: 0, t: 0, r: 0, b: 0 };
let T = 0;

// ---------- utils ----------
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const backOut = t => { t = clamp(t, 0, 1); const c = 1.8; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const approach = (v, t, k, dt) => v + (t - v) * (1 - Math.exp(-k * dt));
const moveTo = (v, t, sp, dt) => v < t ? Math.min(t, v + sp * dt) : Math.max(t, v - sp * dt);

// ---------- palette (ガッシュ絵本調) ----------
const C = {
  ink: '#4a3530', cream: '#f8f0dd', paper: '#efe3c6',
  mint: '#8ed3b5', mintD: '#5aae92', mintL: '#c9ecdc',
  coral: '#f2896b', coralD: '#d4654c', coralL: '#f8c4ae',
  lemon: '#f6d55a', lemonD: '#dcb437', lemonL: '#fbeaa8',
  red: '#e2463b', redD: '#b52f28', redL: '#f59084',
  leaf: '#7cbf6b', leafD: '#4f9147', wood: '#cf9d6c', woodD: '#a5734b', woodL: '#e8c393',
  white: '#fffaf0', sky: '#bfe5dc', brick: '#dc8d66', water: '#a7dceb', waterD: '#62b4cc',
  bear: '#c58b5c', bearL: '#ecc79f', cat: '#f4b65e', catD: '#dc8e3c', rab: '#fdf6e8', rabIn: '#f5a796',
  shell: '#7fc8a4', shellD: '#4f9d7c', skin: '#cde3a0', skinD: '#a9c47b', dough: '#f7e9cb', bread: '#e7ae5c', cookie: '#e9b56a'
};
const FLOWER_PALS = [
  ['#f2896b', '#f6d55a', '#f7a3a3'],
  ['#f5a04f', '#f6d55a', '#e8706a'],
  ['#b9a0e6', '#f6d55a', '#f28f86'],
  ['#ff8d74', '#8ed3e6', '#fbe27a'],
];

// ---------- 描画ヘルパ ----------
function blob(x, y, rx, ry, seed = 1, amp = .05, rot = 0, n = 10) {
  const pts = [];
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const r = 1 + amp * (hash(seed * 13.7 + i * 1.91) * 2 - 1);
    const px = Math.cos(a) * rx * r, py = Math.sin(a) * ry * r;
    pts.push([x + px * cr - py * sr, y + px * sr + py * cr]);
  }
  g.beginPath();
  const m0x = (pts[n - 1][0] + pts[0][0]) / 2, m0y = (pts[n - 1][1] + pts[0][1]) / 2;
  g.moveTo(m0x, m0y);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  g.closePath();
}
function wrect(x, y, w, h, r, seed = 1, amp = 3) {
  const j = i => (hash(seed + i * 7.3) - .5) * 2 * amp;
  g.beginPath();
  g.moveTo(x + r, y + j(1));
  g.quadraticCurveTo(x + w / 2, y + j(2), x + w - r, y + j(3));
  g.quadraticCurveTo(x + w + j(4), y + j(5), x + w + j(6), y + r);
  g.quadraticCurveTo(x + w + j(7), y + h / 2, x + w + j(8), y + h - r);
  g.quadraticCurveTo(x + w + j(9), y + h + j(10), x + w - r, y + h + j(11));
  g.quadraticCurveTo(x + w / 2, y + h + j(12), x + r, y + h + j(13));
  g.quadraticCurveTo(x + j(14), y + h + j(15), x + j(16), y + h - r);
  g.quadraticCurveTo(x + j(17), y + h / 2, x + j(18), y + r);
  g.quadraticCurveTo(x + j(19), y + j(20), x + r, y + j(1));
  g.closePath();
}
function stroke(w = 6, col = C.ink) { g.lineWidth = w; g.strokeStyle = col; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
// ガッシュ風の塗り：ベタ塗り＋明るい筆跡＋影＋太い輪郭
function paint(path, fill, bx, by, bw, bh, o = {}) {
  path(); g.fillStyle = fill; g.fill();
  if (!o.flat) {
    const sd = o.seed || 1;
    g.save(); g.clip();
    g.globalAlpha = o.la ?? .34; g.fillStyle = o.light || '#fff7e4';
    blob(bx + bw * .34, by + bh * .3, bw * .36, bh * .25, sd + 2, .22); g.fill();
    g.globalAlpha = o.da ?? .14; g.fillStyle = C.ink;
    blob(bx + bw * .72, by + bh * .86, bw * .62, bh * .34, sd + 4, .2); g.fill();
    g.globalAlpha = .2; g.strokeStyle = o.light || '#fff7e4'; g.lineWidth = Math.max(2, bw * .05); g.lineCap = 'round';
    g.beginPath(); g.moveTo(bx + bw * .18, by + bh * .5); g.quadraticCurveTo(bx + bw * .4, by + bh * .38, bx + bw * .6, by + bh * .46); g.stroke();
    g.restore();
  }
  if (o.w !== 0) { path(); stroke(o.w || 6, o.ink || C.ink); }
}
function ell(x, y, rx, ry, fill, o = {}) {
  paint(() => blob(x, y, rx, ry, o.seed || (x * .37 + y * .11), o.amp ?? .05, o.rot || 0, o.n || 10), fill, x - rx, y - ry, rx * 2, ry * 2,
    { flat: o.flat ?? (rx < 22 && ry < 22), w: o.w, seed: o.seed, la: o.la, da: o.da, light: o.light });
}
function circle(x, y, r) { g.beginPath(); g.arc(x, y, Math.max(.1, r), 0, TAU); }
function shadow(x, y, rx) { g.save(); g.globalAlpha = .13; g.fillStyle = C.ink; g.beginPath(); g.ellipse(x, y, rx, rx * .18, 0, 0, TAU); g.fill(); g.restore(); }
function limb(x, y, ang, len, col, thick = 12) {
  g.save(); g.translate(x, y); g.rotate(ang);
  ell(0, len * .5, thick, len * .55, col, { flat: 1, w: 5, seed: len + thick });
  g.restore();
}
function heartPath(x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * .35);
  g.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  g.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35); g.closePath();
}
function starPath(x, y, r, n = 5, inner = .45, rot = 0) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot - Math.PI / 2 + i * Math.PI / n; const rr = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath();
}
function sparkle(x, y, r, a = 1, rot = 0) {
  g.save(); g.globalAlpha = a; g.fillStyle = '#fffbe8'; starPath(x, y, r, 4, .28, rot); g.fill();
  g.lineWidth = Math.max(1.5, r * .12); g.strokeStyle = C.lemonD; g.stroke(); g.restore();
}
function flowerHead(x, y, r, col, open = 1, rot = 0, seed = 1) {
  if (open < .05) { ell(x, y, r * .45, r * .55, C.leaf, { flat: 1, w: 4, seed }); return; }
  g.save(); g.translate(x, y); g.rotate(rot);
  const pr = r * (.45 + .55 * open);
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * TAU;
    ell(Math.cos(a) * pr * .62, Math.sin(a) * pr * .62, pr * .5, pr * .42, col, { flat: 1, w: Math.max(3, r * .12), rot: a, seed: seed + i });
  }
  ell(0, 0, pr * .32, pr * .32, C.lemon, { flat: 1, w: Math.max(3, r * .1), seed: seed + 9 });
  g.restore();
}
function pawPath(x, y, s) {
  g.beginPath(); g.ellipse(x, y + s * .25, s * .55, s * .45, 0, 0, TAU);
  for (let i = -1; i <= 1; i++) { g.moveTo(x + i * s * .45 + s * .2, y - s * .45 + Math.abs(i) * s * .12); g.ellipse(x + i * s * .45, y - s * .45 + Math.abs(i) * s * .12, s * .2, s * .24, 0, 0, TAU); }
}
function drawPaw(x, y, s, fill, w = 4) { pawPath(x, y, s); g.fillStyle = fill; g.fill(); if (w) stroke(w); }

// ---------- 顔 ----------
function eyesDraw(cx, cy, sep, r, o) {
  const lx = o.lx || 0, ly = o.ly || 0, mood = o.mood || 'normal';
  const closed = mood === 'happy' || mood === 'proud' || mood === 'laugh';
  for (const sd of [-1, 1]) {
    const ex = cx + sd * sep / 2;
    if (closed) {
      g.beginPath(); g.arc(ex, cy + r * .45, r * .95, Math.PI * 1.15, Math.PI * 1.85); stroke(r * .55);
    } else if (o.blink > 0) {
      g.beginPath(); g.moveTo(ex - r * .8, cy); g.lineTo(ex + r * .8, cy); stroke(r * .5);
    } else {
      g.fillStyle = C.ink; g.beginPath(); g.ellipse(ex + lx * r * .55, cy + ly * r * .45, r * .78, r, 0, 0, TAU); g.fill();
      g.fillStyle = '#fff'; circle(ex + lx * r * .55 - r * .25, cy + ly * r * .45 - r * .38, r * .3); g.fill();
    }
    if (mood === 'worried' || mood === 'sad') {
      g.beginPath(); g.moveTo(ex - sd * r * 1.1, cy - r * 1.9); g.lineTo(ex + sd * r * .6, cy - r * 1.45); stroke(r * .4);
    }
  }
}
function mouthDraw(x, y, s, mood) {
  g.beginPath();
  if (mood === 'worried' || mood === 'sad') { g.arc(x, y + s * .9, s * .7, Math.PI * 1.2, Math.PI * 1.8); stroke(s * .32); }
  else if (mood === 'laugh' || mood === 'wow') {
    g.ellipse(x, y + s * .25, s * .55, s * (mood === 'wow' ? .6 : .48), 0, 0, Math.PI * (mood === 'wow' ? 2 : 1));
    if (mood === 'laugh') g.closePath();
    g.fillStyle = '#c8574a'; g.fill(); stroke(s * .25);
  }
  else { g.moveTo(x - s * .6, y); g.quadraticCurveTo(x - s * .3, y + s * .45, x, y); g.quadraticCurveTo(x + s * .3, y + s * .45, x + s * .6, y); stroke(s * .3); }
}
function cheeks(x, y, sep, r) {
  g.save(); g.globalAlpha = .45; g.fillStyle = C.coral;
  circle(x - sep / 2, y, r); g.fill(); circle(x + sep / 2, y, r); g.fill(); g.restore();
}

// =====================================================================
//  キャラクター
// =====================================================================
function flowerCrown(x, y, s, pal) {
  for (let i = 0; i < 7; i++) {
    const a = Math.PI * (1.05 + i * .15);
    flowerHead(x + Math.cos(a) * 34 * s, y + Math.sin(a) * 14 * s + 10 * s, 11 * s, pal[i % 3], 1, i, 40 + i);
  }
}
function drawTurtle(x, y, o) {
  const s = o.s || 1, d = o.dir || 1, w = o.walk || 0;
  g.save(); g.translate(x, y + (o.hop || 0));
  shadow(0, 0, 90 * s);
  g.scale(d * s, s);
  const bob = o.walking ? -Math.abs(Math.sin(w)) * 6 : 0;
  g.translate(0, bob);
  // 脚
  const legs = [[-55, 0], [42, Math.PI], [-22, Math.PI], [66, 0]];
  for (const [lx, ph] of legs) {
    const lift = o.walking ? Math.max(0, Math.sin(w + ph)) * 9 : 0;
    ell(lx, -12 - lift, 19, 15, C.skin, { flat: 1, w: 5, seed: lx });
  }
  ell(-92, -30, 14, 9, C.skin, { flat: 1, w: 5, seed: 3 });
  // こうら
  paint(() => { g.beginPath(); g.moveTo(-88, -28); g.bezierCurveTo(-92, -132, 78, -132, 80, -28); g.quadraticCurveTo(-4, -12, -88, -28); g.closePath(); },
    C.shell, -90, -128, 170, 100, { seed: 7 });
  g.save(); g.globalAlpha = .55;
  for (const [hx, hy, hr] of [[-38, -82, 20], [8, -96, 22], [48, -70, 17], [-62, -52, 14], [16, -52, 16]]) { ell(hx, hy, hr, hr * .8, C.shellD, { flat: 1, w: 0, seed: hx }); }
  g.restore();
  g.beginPath(); g.moveTo(-86, -30); g.quadraticCurveTo(-4, -14, 78, -30); stroke(12, C.ink); g.beginPath(); g.moveTo(-84, -30); g.quadraticCurveTo(-4, -16, 76, -30); stroke(6, C.lemon);
  // リュック
  paint(() => wrect(-96, -122, 66, 70, 18, 11, 2), C.coral, -96, -122, 66, 70, { seed: 13 });
  paint(() => wrect(-90, -96, 54, 26, 9, 12, 2), C.coralD, -90, -96, 54, 26, { flat: 1, w: 4 });
  circle(-63, -84, 5); g.fillStyle = C.lemon; g.fill(); stroke(3);
  g.beginPath(); g.moveTo(-40, -116); g.quadraticCurveTo(0, -128, 30, -104); stroke(7, C.ink); g.beginPath(); g.moveTo(-40, -116); g.quadraticCurveTo(0, -128, 30, -104); stroke(3, C.coralD);
  // 頭
  const hb = o.walking ? Math.sin(w * 2) * 2 : Math.sin(T * 2) * 1.5;
  const hx = 96, hy = -70 + hb;
  ell(74, -50, 24, 20, C.skin, { flat: 1, w: 6, seed: 21 });
  ell(hx, hy, 38, 33, C.skin, { seed: 22 });
  // かお
  const mood = o.mood || 'normal';
  const lift = o.glasses || 0;
  eyesDraw(hx + 8, hy - 6, 26, 6.5, { lx: o.lx, ly: o.ly, mood: lift > .3 ? 'proud' : mood, blink: o.blink });
  cheeks(hx + 8, hy + 8, 40, 6);
  mouthDraw(hx + 12, hy + 12, 10, mood === 'proud' ? 'laugh' : mood);
  // めがね
  const gy = hy - 6 - lift * 18, rot = -lift * .25;
  g.save(); g.translate(hx + 8, gy); g.rotate(rot);
  for (const sd of [-1, 1]) { circle(sd * 13, 0, 12); g.save(); g.globalAlpha = .25; g.fillStyle = '#fff'; g.fill(); g.restore(); stroke(8); circle(sd * 13, 0, 12); stroke(4, C.coral); }
  g.beginPath(); g.moveTo(-2, -1); g.lineTo(2, -1); stroke(5);
  g.restore();
  if (o.crown) flowerCrown(hx, hy - 30, 1.05, o.pal || FLOWER_PALS[0]);
  g.restore();
}

function drawRabbit(x, y, o) {
  const s = o.s || 1, d = o.dir || 1, w = o.walk || 0;
  g.save(); g.translate(x, y + (o.hop || 0));
  shadow(0, 0, 55 * s);
  g.rotate(o.lean || 0); g.scale(d * s, s);
  if (o.walking) g.translate(0, -Math.abs(Math.sin(w)) * 7);
  const fs = o.walking ? Math.sin(w) * 5 : 0;
  ell(-22, -9 + fs, 22, 11, C.rab, { flat: 1, w: 5, seed: 2 });
  ell(22, -9 - fs, 22, 11, C.rab, { flat: 1, w: 5, seed: 3 });
  ell(-44, -42, 14, 13, C.white, { flat: 1, w: 5, seed: 4 });
  ell(0, -62, 44, 52, C.rab, { seed: 5 });
  paint(() => { g.beginPath(); g.moveTo(-30, -88); g.lineTo(30, -88); g.quadraticCurveTo(40, -44, 30, -20); g.quadraticCurveTo(0, -12, -30, -20); g.quadraticCurveTo(-40, -44, -30, -88); g.closePath(); },
    C.mint, -36, -88, 72, 72, { seed: 6, w: 5 });
  flowerHead(0, -54, 8, C.coral, 1, 0, 31);
  const ar = o.arms || [.35, -.35];
  limb(-38, -92, ar[0], 40, C.rab); limb(38, -92, ar[1], 40, C.rab);
  const ew = o.earW || 0;
  for (const sd of [-1, 1]) {
    g.save(); g.translate(sd * 19, -172); g.rotate(sd * (.16 + ew) + Math.sin(T * 1.7 + sd) * .03);
    ell(0, -44, 15, 46, C.rab, { seed: 7 + sd }); ell(0, -40, 7, 31, C.rabIn, { flat: 1, w: 0, seed: 8 + sd });
    g.restore();
  }
  ell(0, -140, 50, 43, C.rab, { seed: 9 });
  eyesDraw(0, -144, 36, 7, o);
  cheeks(0, -128, 56, 8);
  g.fillStyle = C.coralD; g.beginPath(); g.moveTo(-5, -134); g.lineTo(5, -134); g.lineTo(0, -128); g.closePath(); g.fill();
  mouthDraw(0, -124, 9, o.mood);
  if (o.item) drawHeld(o.item, 0, -96, o);
  g.restore();
}

function drawBear(x, y, o) {
  const s = o.s || 1, d = o.dir || 1, w = o.walk || 0;
  g.save(); g.translate(x, y + (o.hop || 0));
  shadow(0, 0, 72 * s);
  g.rotate(o.lean || 0); g.scale(d * s, s);
  if (o.walking) g.translate(0, -Math.abs(Math.sin(w)) * 7);
  const fs = o.walking ? Math.sin(w) * 5 : 0;
  ell(-30, -12 + fs, 28, 15, C.bear, { flat: 1, w: 6, seed: 2 });
  ell(30, -12 - fs, 28, 15, C.bear, { flat: 1, w: 6, seed: 3 });
  ell(0, -78, 66, 70, C.bear, { seed: 5 });
  ell(0, -66, 44, 46, C.bearL, { seed: 6, w: 0 });
  // エプロン
  paint(() => { g.beginPath(); g.moveTo(-40, -110); g.lineTo(40, -110); g.quadraticCurveTo(54, -50, 44, -22); g.quadraticCurveTo(0, -12, -44, -22); g.quadraticCurveTo(-54, -50, -40, -110); g.closePath(); },
    C.white, -48, -110, 96, 96, { seed: 7, w: 5 });
  drawPaw(0, -62, 14, C.cookie, 4);
  const ar = o.arms || [.4, -.4];
  limb(-58, -118, ar[0], 50, C.bear, 16); limb(58, -118, ar[1], 50, C.bear, 16);
  // 頭
  ell(-44, -212, 20, 20, C.bear, { flat: 1, w: 6, seed: 11 }); ell(44, -212, 20, 20, C.bear, { flat: 1, w: 6, seed: 12 });
  ell(0, -178, 60, 50, C.bear, { seed: 13 });
  ell(0, -164, 26, 19, C.bearL, { flat: 1, w: 4, seed: 14 });
  g.fillStyle = C.ink; g.beginPath(); g.ellipse(0, -172, 9, 6, 0, 0, TAU); g.fill();
  eyesDraw(0, -188, 42, 7, o);
  cheeks(0, -168, 76, 8);
  mouthDraw(0, -158, 9, o.mood);
  // コック帽子
  paint(() => { g.beginPath(); g.moveTo(-36, -214); g.bezierCurveTo(-70, -246, -40, -290, -12, -268); g.bezierCurveTo(-2, -300, 34, -296, 34, -266); g.bezierCurveTo(66, -276, 62, -226, 36, -214); g.closePath(); },
    C.white, -62, -296, 124, 82, { seed: 15 });
  paint(() => wrect(-38, -222, 76, 16, 6, 15, 1), C.lemon, -38, -222, 76, 16, { flat: 1, w: 5 });
  if (o.item) drawHeld(o.item, 0, -120, o);
  g.restore();
}

function drawCat(x, y, o) {
  const s = o.s || 1, d = o.dir || 1, w = o.walk || 0;
  const fl = o.fluffy || 0, soap = o.soap || 0;
  g.save(); g.translate(x, y + (o.hop || 0));
  if (!o.noShadow) shadow(0, 0, 50 * s);
  g.rotate(o.lean || 0); g.scale(d * s, s);
  if (o.walking) g.translate(0, -Math.abs(Math.sin(w)) * 7);
  if (o.bubbleRide) { circle(0, -40, 70); g.save(); g.globalAlpha = .35; g.fillStyle = C.mintL; g.fill(); g.restore(); stroke(5, '#86c6d8'); }
  const fs = o.walking ? Math.sin(w) * 5 : 0;
  // しっぽ

}
function drawActors() {

function drawStraw() { if (S.straw) strawBubble(S.straw.x, S.straw.y, 30 + Math.sin(T * 4) * 2); }
function drawScreenUI() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const k = S.wipe; g.save(); g.fillStyle = C.cream;

    g.globalAlpha = .7; for (let i = 0; i < 12; i++) { g.fillStyle = [C.coral, C.lemon, C.mint][i % 3]; circle(W * (1 - k * 1.3) + 30 + hash(i) * W * .6, hash(i + 9) * H, 10 + hash(i + 3) * 14); g.fill(); }

}
function albumBookRect() { const w = Math.min(W * .8, 560), h = w * .55; return { x: W / 2 - w / 2, y: H - h - Math.max(30, SAFE.b + 20) - H * .06, w, h }; }
function drawAlbumBook(b, open) {

  g.fillStyle = '#fffaf0'; g.fillRect(0, 0, b.w / 2 - 4, b.h); g.fillRect(b.w / 2 + 4, 0, b.w / 2 - 4, b.h); g.strokeRect(0, 0, b.w / 2 - 4, b.h); g.strokeRect(b.w / 2 + 4, 0, b.w / 2 - 4, b.h);

  for (let i = 0; i < 3; i++) { flowerHead(b.w * .08 + i * b.w * .14, b.h * .9, b.w * .025, FLOWER_PALS[i][0], 1, i, 500 + i); }

function draw() {
  g = mainCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.cream; g.fillRect(0, 0, cv.width, cv.height);

// =====================================================================
//  起動・ループ・画面
// =====================================================================
function readSafe() {
  try { const cs = getComputedStyle(probe); SAFE = { l: parseFloat(cs.paddingLeft) || 0, t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0 }; }
  catch (e) { SAFE = { l: 0, t: 0, r: 0, b: 0 }; }
}
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(dprCap, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  readSafe();

let last = performance.now(), running = true, raf = 0;
// 端末が重いときは解像度を段階的に下げる（古いiPad向け）
let dprCap = 2, slowT = 0, frameEma = 16;

function start() { if (!raf && running) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; stop(); try { AU.ctx && AU.ctx.suspend(); } catch (e) { } }
  else { running = true; start(); try { AU.ctx && AU.ctx.state === 'suspended' && AU.ctx.resume().catch(() => { }); } catch (e) { } }

S = newState(); resetActors(); makePaper(); resize(); makeOverlay(); computeView(); start();

// 検証用フック（UIには出ない）
window.__kame = {
  get S() { return S; }, get A() { return A; }, get CAN() { return CAN; }, get cam() { return cam; }, get album() { return album; }, get P() { return P; }, get prevLog() { return prevLog; }, get cycle() { return cycle; },
  w2s, s2w, peekers, frameSlots, photoRect, goal: () => S.goal, running: () => running && !!raf,
  canScreen() { return w2s(CAN.x + 30, CAN.y - 130); }, roadScreen(u) { const i = Math.floor(u * (ROAD.length - 1)); return w2s(ROAD[i][0], ROAD[i][1]); },
