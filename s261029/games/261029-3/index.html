<script>
(()=>{'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const backOut=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

let W=1,H=1,DPR=1,S=1,portrait=true,SA={t:0,r:0,b:0,l:0};
let now=0,POP=0,L=null,paper=null;
let variant={cloudDX:0,resType:0,rain:1,boat:false,hue:0};

/* ================= projection (flat paper -> tilted pop-up town) ================= */
let TILT=0.3;
function PY(y){return POP<0.001?y:H-(H-y)*(1-TILT*POP);}
function PK(y){return POP<0.001?1:1-0.2*POP*(1-clamp(y/H,0,1));}
function PX(x,y){return POP<0.001?x:W/2+(x-W/2)*PK(y);}
function inv(sx,sy){if(POP<0.001)return{x:sx,y:sy};const y=H-(H-sy)/(1-TILT*POP);return{x:W/2+(sx-W/2)/PK(y),y};}

/* ================= polyline helpers ================= */
function cumLen(p){const c=[0];for(let i=1;i<p.length;i++)c.push(c[i-1]+Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y));return c;}
function pointAt(p,c,d){const n=p.length;if(n===1||d<=0)return{x:p[0].x,y:p[0].y,a:n>1?Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x):0};
  if(d>=c[n-1])return{x:p[n-1].x,y:p[n-1].y,a:Math.atan2(p[n-1].y-p[n-2].y,p[n-1].x-p[n-2].x)};
  let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=d)lo=m;else hi=m;}
  const t=(d-c[lo])/((c[hi]-c[lo])||1);return{x:lerp(p[lo].x,p[hi].x,t),y:lerp(p[lo].y,p[hi].y,t),a:Math.atan2(p[hi].y-p[lo].y,p[hi].x-p[lo].x)};}
function resample(raw,step){const out=[{x:raw[0].x,y:raw[0].y}];let acc=0;
  for(let i=1;i<raw.length;i++){const a=out[out.length-1],b=raw[i];const d=Math.hypot(b.x-a.x,b.y-a.y);if(d>=step){out.push({x:b.x,y:b.y});}}
  const l=raw[raw.length-1],o=out[out.length-1];if(o.x!==l.x||o.y!==l.y){if(Math.hypot(l.x-o.x,l.y-o.y)<step*0.4&&out.length>1)out[out.length-1]={x:l.x,y:l.y};else out.push({x:l.x,y:l.y});}
  void acc;return out;}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));}
function polyDist(p,pts){let best=1e9,bi=0;for(let i=0;i<pts.length;i++){const d=Math.hypot(p.x-pts[i].x,p.y-pts[i].y);if(d<best){best=d;bi=i;}}
  for(let i=1;i<pts.length;i++){const d=segDist(p,pts[i-1],pts[i]);if(d<best){best=d;}}return{d:best,i:bi};}

/* ================= audio (Web Audio synth only) ================= */
const AU={ctx:null,master:null,rainG:null,flowG:null,noise:null,ready:false,voices:0};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state!=='running'&&!document.hidden)AU.ctx.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{AU.ctx=new AC();}catch(e){AU.ctx=null;return;}
  const c=AU.ctx;
  AU.master=c.createGain();AU.master.gain.value=0.75;
  const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  const len=c.sampleRate*2|0,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
  const mk=(f,q,type)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.master);s.start();return g;};
  AU.rainG=mk(2600,0.5,'bandpass');AU.flowG=mk(500,1.2,'bandpass');
  const sil=c.createBufferSource();sil.buffer=c.createBuffer(1,1,22050);sil.connect(c.destination);sil.start(0);
  if(c.state!=='running')c.resume().catch(()=>{});
  AU.ready=true;
}
function aok(){return AU.ready&&AU.ctx.state==='running'&&AU.voices<30;}
function tone(f,dur,o={}){if(!aok())return;const c=AU.ctx,t=c.currentTime+(o.delay||0);
  const os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
  const v=o.vol==null?0.15:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.008));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  os.connect(g);g.connect(AU.master);os.start(t);os.stop(t+dur+0.03);AU.voices++;os.onended=()=>{AU.voices=Math.max(0,AU.voices-1);};}
function noiseHit(dur,f,o={}){if(!aok())return;const c=AU.ctx,t=c.currentTime+(o.delay||0);
  const s=c.createBufferSource();s.buffer=AU.noise;const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.value=f;fl.Q.value=o.q||1;
  const g=c.createGain();const v=o.vol==null?0.15:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.03);AU.voices++;s.onended=()=>{AU.voices=Math.max(0,AU.voices-1);};}
const VOW={a:[850,1250],i:[320,2400],u:[380,950],o:[520,900]};
function voice(p,dur,v,o={}){if(!aok())return;const c=AU.ctx,t=c.currentTime+(o.delay||0);
  const os=c.createOscillator();os.type='sawtooth';os.frequency.setValueAtTime(p,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur*0.7);
  const g=c.createGain();const vol=o.vol==null?0.06:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.04);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  for(const fr of VOW[v]||VOW.a){const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=fr;b.Q.value=6;os.connect(b);b.connect(g);}
  g.connect(AU.master);os.start(t);os.stop(t+dur+0.03);AU.voices++;os.onended=()=>{AU.voices=Math.max(0,AU.voices-1);};}
const sfx={
  pop(){tone(420,0.16,{to:1500,vol:0.22});noiseHit(0.22,2400,{vol:0.16});tone(1600,0.25,{delay:0.08,to:2400,vol:0.06});},
  splash(v){noiseHit(0.12,1800,{vol:0.05*v,q:0.8});},
  blip(y){const f=430+(1-clamp(y/H,0,1))*720+rnd(-25,25);tone(f,0.1,{type:'triangle',vol:0.1,to:f*1.3});},
  commit(){tone(660,0.12,{vol:0.08,to:880});},
  bubble(){const f=rnd(260,620);tone(f,0.07,{to:f*2.3,vol:0.06});},
  clack(){tone(rnd(170,200),0.07,{type:'triangle',vol:0.07,to:120});},
  success(){[0,4,7,12].forEach((s,i)=>tone(587*Math.pow(2,s/12),0.55,{type:'triangle',vol:0.09,delay:i*0.085}));},
  bigsuccess(){[0,4,7,12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),0.7,{type:'triangle',vol:0.09,delay:i*0.07}));},
  paper(){noiseHit(0.08,1100,{vol:0.2,type:'lowpass'});tone(150,0.08,{vol:0.07,to:100});},
  flip(){noiseHit(0.06,1500+rnd(-300,300),{vol:0.1});},
  plug(b){tone(b?320:520,0.13,{to:b?190:880,vol:0.18});noiseHit(0.05,900,{vol:0.06});},
  wobble(){tone(rnd(640,780),0.07,{vol:0.05,to:rnd(500,600)});},
  ink(){tone(rnd(900,1100),0.05,{vol:0.04,to:700});},
  rewind(){tone(1500,1.5,{to:180,vol:0.07});for(let i=0;i<12;i++)tone(1900-i*110,0.04,{type:'square',vol:0.02,delay:i*0.12});noiseHit(1.2,3000,{vol:0.04,q:0.4});},
  tick(){tone(1700,0.03,{type:'square',vol:0.025});},
  honk(){tone(560,0.12,{type:'triangle',to:430,vol:0.08});tone(600,0.12,{type:'triangle',to:470,vol:0.08,delay:0.16});},
  flap(){for(let i=0;i<6;i++)noiseHit(0.05,700,{vol:0.07,type:'lowpass',delay:i*0.09});},
  lift(){tone(260,0.8,{type:'triangle',to:780,vol:0.07});sfx.paper();},
  valve(){tone(900,0.15,{to:1300,vol:0.08});tone(1320,0.4,{delay:0.15,vol:0.08});},
  roof(){noiseHit(0.13,650,{vol:0.32,type:'lowpass'});tone(230,0.16,{vol:0.1,to:150});},
  joy(){voice(620,0.38,'a',{to:860,vol:0.07});voice(780,0.32,'i',{delay:0.28,to:960,vol:0.06});[0,7,12].forEach((s,i)=>tone(784*Math.pow(2,s/12),0.25,{vol:0.07,delay:0.12+i*0.08}));},
  wah(){[0,0.2,0.38].forEach((d,i)=>voice(470+i*95,0.7,'a',{delay:d,to:650+i*120,vol:0.05}));},
  hmm(){voice(380,0.3,'u',{to:300,vol:0.04});},
  wave(){voice(600,0.25,'o',{to:720,vol:0.04});},
};
let lastBubble=0,lastClack=0;

/* ================= layout ================= */
function readSafe(){const cs=getComputedStyle(saEl);SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function computeLayout(){
  const x0=SA.l,y0=SA.t,w=Math.max(40,W-SA.l-SA.r),h=Math.max(40,H-SA.t-SA.b);
  portrait=h>=w*0.95;TILT=portrait?0.22:0.3;
  const P=(fx,fy)=>({x:x0+fx*w,y:y0+fy*h});
  const o={x0,y0,w,h};
  if(portrait){
    S=Math.min(w/390,h/740);
    o.perch=P(.15,.115);o.center=P(.45,.45);
    o.cloud=P(.47+variant.cloudDX*.05,.08);
    o.spoutA={x:o.cloud.x,y:o.cloud.y+44*S};o.spoutB={x:o.cloud.x+24*S,y:o.cloud.y+102*S};
    o.pond=P(.70,.36);o.pondR=56*S;
    o.wheel=P(.24,.48);o.wheelR=37*S;
    o.fountain=P(.64,.61);o.fR=31*S;
    o.ravine=[{x:-20,y:y0+.66*h},P(.2,.695),P(.38,.775),P(.44,.95),{x:x0+.45*w,y:H+20}];
    o.home=P(.13,.885);o.table=P(.67,.85);
  }else{
    S=Math.min(w/700,h/470);
    o.perch=P(.085,.22);o.center=P(.5,.46);
    o.cloud=P(.3+variant.cloudDX*.06,.1);
    o.spoutA={x:o.cloud.x,y:o.cloud.y+44*S};o.spoutB={x:o.cloud.x+30*S,y:o.cloud.y+98*S};
    o.pond=P(.36,.49);o.pondR=50*S;
    o.wheel=P(.635,.3);o.wheelR=34*S;
    o.fountain=P(.6,.75);o.fR=29*S;
    o.ravine=[{x:x0+.7*w,y:-20},P(.735,.35),P(.77,.62),P(.82,.95),{x:x0+.83*w,y:H+20}];
    o.home=P(.905,.42);o.table=P(.2,.79);
  }
  o.S=S;
  const a=o.ravine[1],b=o.ravine[2],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  const dl=Math.hypot(b.x-a.x,b.y-a.y)||1;let nx=-(b.y-a.y)/dl,ny=(b.x-a.x)/dl;
  if((o.fountain.x-m.x)*nx+(o.fountain.y-m.y)*ny<0){nx=-nx;ny=-ny;}
  o.bridgeA={x:m.x+nx*30*S,y:m.y+ny*30*S};o.bridgeB={x:m.x-nx*30*S,y:m.y-ny*30*S};o.bridgeM=m;o.farN={x:-nx,y:-ny};
  o.wait={x:o.bridgeB.x-nx*24*S,y:o.bridgeB.y-ny*24*S};
  o.pillarL={x:o.table.x-50*S,y:o.table.y};o.pillarR={x:o.table.x+50*S,y:o.table.y};o.pillarH=54*S;
  o.roofX1=o.pillarL.x-14*S;o.roofX2=o.pillarR.x+26*S;o.roofY=o.table.y-o.pillarH-4*S;
  o.bucket={x:o.roofX2+2*S,y:o.table.y+16*S};
  const fv={x:o.bridgeA.x-o.fountain.x,y:o.bridgeA.y-o.fountain.y},fl=Math.hypot(fv.x,fv.y)||1;
  o.valve={x:o.fountain.x+fv.x/fl*(o.fR+16*S),y:o.fountain.y+fv.y/fl*(o.fR*.72+12*S)};
  o.card={tw:(portrait?34:42)*S,ar:portrait?3/4:4/3};
  L=o;
}
function anchors(o){return[o.spoutB,o.spoutA,o.pond,o.wheel,o.fountain,o.bucket,o.pillarL,o.pillarR,o.table,o.bridgeA,o.bridgeB,o.home,o.perch,o.center,o.valve,{x:o.x0,y:o.y0},{x:o.x0+o.w,y:o.y0},{x:o.x0,y:o.y0+o.h},{x:o.x0+o.w,y:o.y0+o.h}];}
function makeMapper(o1,o2){const A=anchors(o1),B=anchors(o2),sc=o2.S/o1.S;
  return p=>{let sw=0,sx=0,sy=0;for(let i=0;i<A.length;i++){const d2=(p.x-A[i].x)**2+(p.y-A[i].y)**2;if(d2<0.25)return{x:B[i].x,y:B[i].y};const w=1/(d2*d2);sw+=w;sx+=w*(B[i].x+(p.x-A[i].x)*sc);sy+=w*(B[i].y+(p.y-A[i].y)*sc);}return{x:sx/sw,y:sy/sw};};}

/* ================= game state ================= */
const G={phase:'intro',round:1,drawOK:false,raining:false,rainT:0,rainRate:1.2,roofRate:0.45,introPop:-1,
  roof:false,roofT:0,roofPts:null,bridge:0,bridgeDone:false,valve:false,valveT:0,fest:null,festHold:0,rew:null,
  ghosts:[],puddles:[],cakes:[],cakeT:0,hold:null,postcards:[],viewer:null,wantCapture:false,
  roundT:0,lastInput:0,hintShown:{},hand:null,wob:{},marker:null,target:null,memory:{roof:false,fest:0},
  firsts:{},rainAcc:0,drizAcc:0,dripAcc:0,sprayAcc:0,wheelA:0,wheelW:0,wheelSpin:0,dropBounce:0,cloudDrop:0,handleTaps:0,handleTapT:0,log:[]};
function logEv(k){G.log.push({k,t:+now.toFixed(2),round:G.round});if(G.log.length>200)G.log.shift();}
let houses=[];

/* ================= water network ================= */
const net={nodes:[],edges:[],order:[],nid:1,eid:1};
const FX={};
function mkNode(kind,x,y,fixed,level){const n={id:net.nid++,kind,x,y,fixed:!!fixed,level:level==null?null:level,adj:[],outs:[],ins:[],dist:Infinity,lev:Infinity,key:Infinity,in:0,spill:0,over:0};net.nodes.push(n);return n;}
function initNet(){net.nodes=[];net.edges=[];net.order=[];
  FX.spout=mkNode('spout',0,0,true,0);FX.bucket=mkNode('bucket',0,0,true,1);FX.pond=mkNode('pond',0,0,true,2);FX.wheel=mkNode('wheel',0,0,true,3);FX.fountain=mkNode('fountain',0,0,true,4);
  FX.pond.cap=6;FX.pond.water=0;FX.pond.rate=0.6;FX.bucket.cap=3;FX.bucket.water=0;FX.bucket.rate=0.5;syncFixed();rebuild();}
function syncFixed(){const f=(n,p,snap,vr,vry)=>{n.x=p.x;n.y=p.y;n.snap=snap;n.vr=vr;n.vry=vry;};
  f(FX.spout,L.spoutB,30*S+16,2*S,1);f(FX.bucket,L.bucket,24*S+18,15*S,.7);f(FX.pond,L.pond,L.pondR+24*S+8,L.pondR*.96,.72);
  f(FX.wheel,L.wheel,L.wheelR+22*S+8,L.wheelR*.8,.85);f(FX.fountain,L.fountain,L.fR+24*S+8,L.fR*1.05,.72);}
const FIXED=()=>[FX.spout,FX.bucket,FX.pond,FX.wheel,FX.fountain];
function recalc(e){e.cum=cumLen(e.pts);e.len=e.cum[e.cum.length-1];e.plugD=Math.min(30*S,e.len*0.35);}
function mkEdge(a,b,pts){const e={id:net.eid++,a,b,pts,cum:null,len:0,flow:0,front:0,vis:0,blocked:false,press:false,plugD:0,dir:0,born:now,plug:false,plugPop:0};recalc(e);net.edges.push(e);return e;}
function attach(x,y){const p={x,y};let best=null,br=1e9;
  for(const n of FIXED()){let d=Math.hypot(x-n.x,y-n.y);if(n===FX.spout)d=Math.min(d,segDist(p,L.spoutA,L.spoutB)*1.15);const r=d/n.snap;if(r<1&&r<br){br=r;best=n;}}
  if(best)return{node:best};
  for(const n of net.nodes){if(n.fixed)continue;if(n.adj.length<=1&&Math.hypot(x-n.x,y-n.y)<30*S+8)return{node:n};}
  let he=null,hd=22*S+6,hi=0;
  for(const e of net.edges){for(let i=0;i<e.pts.length;i++){const d=Math.hypot(x-e.pts[i].x,y-e.pts[i].y);if(d<hd){hd=d;he=e;hi=i;}}}
  if(he){if(hi<=2||he.cum[hi]<14*S)return{node:he.a};if(hi>=he.pts.length-3||he.len-he.cum[hi]<14*S)return{node:he.b};return{edge:he,i:hi};}
  for(const n of net.nodes){if(!n.fixed&&Math.hypot(x-n.x,y-n.y)<24*S+6)return{node:n};}
  return null;}
function splitEdge(e,i){const p=e.pts[i];const j=mkNode('junc',p.x,p.y,false);
  const e1=mkEdge(e.a,j,e.pts.slice(0,i+1)),e2=mkEdge(j,e.b,e.pts.slice(i));
  e1.blocked=e.blocked;e1.front=Math.min(e.front,e1.len);e2.front=Math.max(0,e.front-e1.len);e1.vis=e2.vis=e.vis;e1.flow=e2.flow=e.flow;
  net.edges.splice(net.edges.indexOf(e),1);return j;}
function resolveAt(at,x,y){if(!at)return mkNode('junc',x,y,false);if(at.node)return at.node;return splitEdge(at.edge,at.i);}
function snapEnd(pts,node,atStart){
  if(!node.fixed){const q={x:node.x,y:node.y};if(atStart){if(Math.hypot(pts[0].x-q.x,pts[0].y-q.y)>1)pts.unshift(q);else pts[0]=q;}else{const l=pts.length-1;if(Math.hypot(pts[l].x-q.x,pts[l].y-q.y)>1)pts.push(q);else pts[l]=q;}return;}
  if(node===FX.spout){const q={x:node.x,y:node.y};if(atStart){while(pts.length>2&&segDist(pts[1],L.spoutA,L.spoutB)<10*S)pts.shift();pts[0]=q;}else{while(pts.length>2&&segDist(pts[pts.length-2],L.spoutA,L.spoutB)<10*S)pts.pop();pts[pts.length-1]=q;}return;}
  const R=node.vr,ry=node.vry;const inside=p=>{const dx=(p.x-node.x)/R,dy=(p.y-node.y)/(R*ry);return dx*dx+dy*dy<1;};
  if(atStart){while(pts.length>2&&inside(pts[1]))pts.shift();}else{while(pts.length>2&&inside(pts[pts.length-2]))pts.pop();}
  const ref=atStart?(inside(pts[0])?pts[1]:pts[0]):(inside(pts[pts.length-1])?pts[pts.length-2]:pts[pts.length-1]);
  const ang=Math.atan2((ref.y-node.y)/ry,ref.x-node.x);const rim={x:node.x+Math.cos(ang)*R,y:node.y+Math.sin(ang)*R*ry};
  if(atStart){if(inside(pts[0])||Math.hypot(pts[0].x-rim.x,pts[0].y-rim.y)<6)pts[0]=rim;else pts.unshift(rim);}
  else{const l=pts.length-1;if(inside(pts[l])||Math.hypot(pts[l].x-rim.x,pts[l].y-rim.y)<6)pts[l]=rim;else pts.push(rim);}}
function rebuild(){
  for(const n of net.nodes){n.adj=[];n.outs=[];n.ins=[];n.dist=Infinity;n.lev=Infinity;n.key=Infinity;}
  for(const e of net.edges){e.a.adj.push(e);e.b.adj.push(e);}
  net.nodes=net.nodes.filter(n=>n.fixed||n.adj.length>0);
  const q=[];for(const s of [FX.spout,FX.bucket]){s.dist=0;s.lev=s.level;q.push(s);}
  while(q.length){const u=q.shift();if(u===FX.fountain)continue;
    for(const e of u.adj){const v=e.a===u?e.b:e.a;if(v.fixed&&v.level<u.lev)continue;if(v.dist>u.dist+1){v.dist=u.dist+1;v.lev=v.fixed?v.level:u.lev;q.push(v);}}}
  for(const n of net.nodes)n.key=isFinite(n.dist)?n.lev*1000+n.dist:Infinity;
  for(const e of net.edges){const ka=e.a.key,kb=e.b.key;let d=0;
    if(isFinite(ka)||isFinite(kb)){if(ka<kb)d=1;else if(kb<ka)d=-1;}
    if(d===1&&e.a===FX.fountain)d=0;if(d===-1&&e.b===FX.fountain)d=0;
    if(d===-1){const t=e.a;e.a=e.b;e.b=t;e.pts.reverse();recalc(e);e.front=0;d=1;}
    e.dir=d;if(d){e.a.outs.push(e);e.b.ins.push(e);}}
  for(const n of net.nodes){const pl=n.outs.length>=2;for(const e of n.outs){if(!pl)e.blocked=false;e.plug=pl;}}
  for(const e of net.edges)if(!e.dir){e.plug=false;e.blocked=false;}
  net.order=net.nodes.filter(n=>isFinite(n.key)).sort((a,b)=>a.key-b.key);
}
function nodeById(id){for(const n of net.nodes)if(n.id===id)return n;return null;}
function flowStep(dt){
  const rain=G.raining&&!G.rew;const FR=230*S;
  for(const n of net.nodes){n.in=0;n.spill=0;n.over=0;}
  for(const n of net.order){
    let avail=n.in;
    if(n===FX.spout)avail+=rain?G.rainRate:0;
    if(n===FX.bucket&&G.roof&&G.roofT>0.9&&rain)n.water+=G.roofRate*dt;
    if(n.cap){n.water+=n.in*dt;let out=0;if(n.outs.some(e=>!e.blocked)){out=n.rate*Math.sqrt(Math.min(1,n.water/n.cap));out=Math.min(out,n.water/dt);n.water-=out*dt;}
      if(n.water>n.cap){n.over=(n.water-n.cap)/dt;n.water=n.cap;}if(n.water<0)n.water=0;avail=out;}
    if(n===FX.fountain){if(!G.valve)n.spill=n.in;avail=0;}
    let open=0;for(const e of n.outs)if(!e.blocked)open++;
    if(!n.cap&&n!==FX.fountain&&open===0)n.spill=avail;
    const share=open?avail/open:0;
    for(const e of n.outs){e.flow=e.blocked?0:share;e.press=e.blocked&&avail>0.01;
      const on=e.flow>0.004||e.press;const lim=e.blocked?e.plugD:e.len;
      if(on){if(e.front<lim)e.front=Math.min(lim,e.front+FR*dt*(0.55+0.5*Math.min(1,e.flow*1.5)));else e.front=Math.max(lim,e.front-FR*dt);}
      else e.front=Math.max(0,e.front-FR*0.04*dt);
      if(e.flow>0.004&&e.front>=e.len-0.5)e.b.in+=e.flow;}
  }
  if(FX.bucket.cap&&!isFinite(FX.bucket.key)){}
  for(const e of net.edges){if(!e.dir){e.flow=0;e.press=false;e.front=Math.max(0,e.front-FR*0.1*dt);}
    e.vis+=(((e.flow>0.004)?1:0)-e.vis)*Math.min(1,dt*3);}
}

/* ================= stroke commit ================= */
function pillarHit(p,pl){return segDist(p,{x:pl.x,y:pl.y},{x:pl.x,y:pl.y-L.pillarH})<Math.max(34*S,30);}
function commitStroke(raw){
  if(raw.length<2)return;
  const pts=resample(raw,5*Math.max(.8,S));if(pts.length<2)return;
  const p0=pts[0],p1=pts[pts.length-1];
  if(!G.roof&&((pillarHit(p0,L.pillarL)&&pillarHit(p1,L.pillarR))||(pillarHit(p0,L.pillarR)&&pillarHit(p1,L.pillarL)))){buildRoof(pts);return;}
  consumeGhosts(pts);
  const nA=resolveAt(attach(p0.x,p0.y),p0.x,p0.y);
  rebuild();
  let atB=attach(p1.x,p1.y);
  if(atB&&atB.node===nA)atB=null;
  if(atB&&atB.edge&&(atB.edge.a===nA||atB.edge.b===nA)&&Math.hypot(p1.x-nA.x,p1.y-nA.y)<40*S)atB=null;
  const nB=resolveAt(atB,p1.x,p1.y);
  if(nB===nA){return;}
  snapEnd(pts,nA,true);snapEnd(pts,nB,false);
  const e=mkEdge(nA,nB,pts);
  rebuild();
  if(!e.dir){inkBall(e.pts);}
  sfx.commit();logEv('stroke');
  G.firsts.stroke=1;
}
function consumeGhosts(pts){G.ghosts=G.ghosts.filter(g=>{let n=0;for(const p of g)if(polyDist(p,pts).d<16*S)n++;return n<g.length*0.55;});}
function buildRoof(pts){G.roof=true;G.roofT=0;G.roofPts=pts;sfx.roof();setTimeout(()=>sfx.success(),180);logEv('roof');
  for(let i=0;i<10;i++)addP({type:'spark',x:lerp(L.roofX1,L.roofX2,i/9),y:L.roofY-8*S,vx:rnd(-20,20)*S,vy:rnd(-60,-20)*S,max:0.8,r:rnd(2,4)*S,hue:rnd(160,220)});}

/* ================= particles ================= */
const parts=[];let MAXP=260,rainCount=0;
function addP(o){if(parts.length>=MAXP)return null;o.age=0;parts.push(o);return o;}
function splash(x,y,s){for(let i=0;i<(s>0.7?2:1);i++)addP({type:'splash',x,y,vx:rnd(-50,50)*S,vy:rnd(-110,-50)*S*s,max:0.3,r:rnd(1,2)*S});if(Math.random()<0.15)sfx.splash(s);}
function inkBall(pts){const c=cumLen(pts);addP({type:'ink',pts,c,d:0,max:6,r:5*S});sfx.ink();}
function inkDot(x,y){addP({type:'inkdot',x,y,vx:rnd(-20,20)*S,vy:rnd(20,40)*S,max:1.6,r:6*S});sfx.ink();}
function updParts(dt){rainCount=0;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;let dead=p.max!=null&&p.age>p.max;
    switch(p.type){
      case'rain':rainCount++;if(G.rew){p.vy=-Math.abs(p.vy)-200*S*dt;p.y+=p.vy*dt*1.6;if(p.y<L.cloud.y)dead=true;break;}
        p.y+=p.vy*dt;if(p.y>=p.landY){dead=true;splash(p.x,p.landY,p.light?0.4:1);}break;
      case'splash':case'spark':case'conf':case'heart':p.vy+=(p.type==='splash'?700:p.type==='conf'?60:p.type==='heart'?-30:120)*S*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='conf')p.vx*=0.98;break;
      case'bead':{const tx=L.cloud.x+(p.ox||0),ty=L.cloud.y+10*S;if(p.age<0.25){p.x+=p.vx*dt;p.y+=p.vy*dt;}else{p.x=lerp(p.x,tx,Math.min(1,dt*5));p.y=lerp(p.y,ty,Math.min(1,dt*5));if(Math.hypot(p.x-tx,p.y-ty)<8*S)dead=true;}break;}
      case'up':{const tx=L.cloud.x+(p.ox||0),ty=L.cloud.y+12*S;p.x=lerp(p.x,tx,Math.min(1,dt*2.4));p.y=lerp(p.y,ty,Math.min(1,dt*2.4));if(Math.hypot(p.x-tx,p.y-ty)<10*S)dead=true;break;}
      case'drip':p.vy+=500*S*dt;p.y+=p.vy*dt;if(p.y>=p.landY){dead=true;splash(p.x,p.landY,0.5);}break;
      case'spray':p.vz-=380*S*dt;p.z+=p.vz*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.z<0){dead=true;}break;
      case'chase':p.x=lerp(p.x,p.tx,Math.min(1,dt*9));p.y=lerp(p.y,p.ty,Math.min(1,dt*9));break;
      case'ink':p.d+=dt*140*S;if(p.d>=p.c[p.c.length-1]){dead=true;inkDot(p.pts[p.pts.length-1].x,p.pts[p.pts.length-1].y);}break;
      case'inkdot':p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy*=0.95;break;
    }
    if(dead){parts[i]=parts[parts.length-1];parts.pop();}}
}
function drawParts(){
  for(const p of parts){const a=p.max?clamp(1-p.age/p.max,0,1):1;
    switch(p.type){
      case'rain':case'drip':case'bead':case'up':{const sx=PX(p.x,p.y),sy=PY(p.y),r=p.r*PK(p.y);
        ctx.fillStyle=p.light?'rgba(120,190,235,.45)':'rgba(110,185,235,.75)';ctx.beginPath();ctx.ellipse(sx,sy,r,r*(p.type==='rain'?1.5:1.1),0,0,TAU);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(sx-r*.35,sy-r*.45,r*.38,0,TAU);ctx.fill();break;}
      case'splash':ctx.fillStyle=`rgba(120,190,235,${.7*a})`;ctx.beginPath();ctx.arc(PX(p.x,p.y),PY(p.y),p.r,0,TAU);ctx.fill();break;
      case'spray':{const sx=PX(p.x,p.y),sy=PY(p.y)-p.z*PK(p.y);ctx.fillStyle=p.hue!=null?`hsla(${p.hue},85%,72%,.85)`:'rgba(120,195,240,.8)';ctx.beginPath();ctx.arc(sx,sy,p.r,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(sx-p.r*.3,sy-p.r*.3,p.r*.35,0,TAU);ctx.fill();break;}
      case'spark':{const sx=PX(p.x,p.y),sy=PY(p.y),r=p.r*(0.6+0.4*a);ctx.fillStyle=`hsla(${p.hue||200},90%,80%,${a})`;star(sx,sy,r);break;}
      case'conf':{ctx.save();ctx.translate(PX(p.x,p.y),PY(p.y));ctx.rotate(p.age*6+p.r);ctx.fillStyle=`hsla(${p.hue},80%,78%,${a})`;ctx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);ctx.restore();break;}
      case'heart':{ctx.fillStyle=`rgba(247,170,195,${a})`;heart(PX(p.x,p.y),PY(p.y),p.r);break;}
      case'chase':{ctx.fillStyle='rgba(120,195,240,.8)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(p.x-p.r*.3,p.y-p.r*.35,p.r*.35,0,TAU);ctx.fill();break;}
      case'ink':{const q=pointAt(p.pts,p.c,p.d);inkBead(PX(q.x,q.y),PY(q.y),p.r);break;}

function inkBead(x,y,r){ctx.fillStyle='rgba(50,110,150,.18)';ctx.beginPath();ctx.arc(x+r*.2,y+r*.35,r,0,TAU);ctx.fill();ctx.fillStyle='rgba(140,205,240,.95)';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x-r*.35,y-r*.35,r*.35,0,TAU);ctx.fill();}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.4:r;const a=i*Math.PI/4-Math.PI/2;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function heart(x,y,r){ctx.beginPath();ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*1.4,y-r*.1,x-r*.6,y-r*1.1,x,y-r*.35);ctx.bezierCurveTo(x+r*.6,y-r*1.1,x+r*1.4,y-r*.1,x,y+r*.9);ctx.fill();}

/* ================= drawing helpers ================= */
function pE(x,y,rx,ry,rot){const p=new Path2D();p.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);return p;}
function pRR(x,y,w,h,r){const p=new Path2D();r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y);p.closePath();return p;}
function relief(p,fill,depth){const d=depth==null?2.4:depth;
  ctx.save();ctx.translate(d*.5,d);ctx.fillStyle='rgba(60,95,110,.16)';ctx.fill(p);ctx.restore();
  ctx.fillStyle=fill;ctx.fill(p);
  ctx.save();ctx.translate(.5,.7);ctx.strokeStyle='rgba(80,120,135,.3)';ctx.lineWidth=1;ctx.stroke(p);ctx.restore();
  ctx.save();ctx.translate(-.5,-.7);ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=1.3;ctx.stroke(p);ctx.restore();}
function glassDrop(x,y,r,stretch){ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(50,110,150,.16)';ctx.beginPath();ctx.ellipse(r*.15,r*1.1,r*.9,r*.25,0,0,TAU);ctx.fill();
  const p=new Path2D();const t=stretch||1.35;p.moveTo(0,-r*t);p.bezierCurveTo(r*.55,-r*.6,r,-r*.1,r,r*.25);p.arc(0,r*.25,r,0,Math.PI);p.bezierCurveTo(-r,-r*.1,-r*.55,-r*.6,0,-r*t);
  const g=ctx.createRadialGradient(-r*.3,-r*.2,r*.1,0,r*.1,r*1.2);g.addColorStop(0,'rgba(235,250,255,.75)');g.addColorStop(.6,'rgba(150,212,244,.7)');g.addColorStop(1,'rgba(90,170,225,.85)');

  ctx.lineWidth=Math.max(1,r*.07);const hs=['rgba(255,190,210,.5)','rgba(255,240,170,.5)','rgba(170,235,190,.5)','rgba(170,210,255,.5)'];

function pickHouses(){const out=[],cand=[],step=44*S;
  for(let y=L.y0+28*S;y<L.y0+L.h-16*S;y+=step)for(let x=L.x0+22*S;x<L.x0+L.w-22*S;x+=step)cand.push({x:x+rnd(-8,8)*S,y:y+rnd(-8,8)*S});

  const av=[[L.pond,L.pondR+38*S],[L.wheel,L.wheelR+36*S],[L.fountain,L.fR+40*S],[L.table,86*S],[L.bucket,40*S],[{x:L.perch.x,y:L.perch.y},78*S],[L.home,44*S],[L.spoutB,44*S],[L.bridgeM,54*S],[L.wait,30*S],[L.valve,30*S]];

function findFlowPath(){let n=FX.fountain;const segs=[];let g=0;
  while(n.ins.length&&g++<40){let best=null;for(const e of n.ins)if(!best||e.flow>best.flow)best=e;if(!best||best.flow<=0.001)break;segs.unshift(best);n=best.a;}
  const pts=[];for(const e of segs)for(const p of e.pts)pts.push({x:p.x,y:p.y});if(pts.length<2)return[{x:L.bridgeA.x,y:L.bridgeA.y},{x:L.fountain.x,y:L.fountain.y}];return pts;}
function startFestival(){
  const f=G.fest={t:0,roof:G.roof,bucket:FX.bucket.outs.some(e=>e.flow>0.01),branches:net.nodes.filter(n=>n.outs.length>=2).length,blocked:net.edges.filter(e=>e.blocked).length,boat:variant.boat,cardDone:false,folds:[],members:[],route:null,rc:null};
  for(const h of houses){h.arch=net.edges.some(e=>e.vis>0.3&&polyDist(h,e.pts).d<24*S);h.delay=D(h,L.fountain)/(Math.max(W,H))*1.4;h.th=0;h.flipped=false;}
  for(let i=0;i<12;i++)f.folds.push({a:i/12*TAU+rnd(-.15,.15),d:rnd(0,.35)});
  buildParade();logEv('festival');G.memory.fest++;
  sfx.bigsuccess();setTimeout(()=>sfx.wah(),500);
  for(let i=0;i<40;i++)addP({type:'conf',x:L.fountain.x+rnd(-20,20)*S,y:L.fountain.y,vx:rnd(-160,160)*S,vy:rnd(-320,-140)*S,max:2.6,r:rnd(3,5)*S,hue:rnd(0,360)});}
function buildParade(){const f=G.fest;if(!f)return;f.route=findFlowPath();f.rc=cumLen(f.route);
  const m=[{kind:'swan'}];if(f.boat)m.push({kind:'boat'});
  const nres=3+Math.min(3,f.branches);for(let i=0;i<nres;i++)m.push({kind:'res',type:(variant.resType+i)%3});
  if(f.bucket){m.push({kind:'drum',type:1});m.push({kind:'drum',type:2});}

function festUpdate(dt){const f=G.fest;f.t+=dt;POP=ease((f.t-0.5)/2.4);

  if(f.t>9&&!f.cardDone){f.cardDone=true;G.wantCapture=true;}

/* ================= targets / hints ================= */
function rimPt(n,toward){const a=Math.atan2((toward.y-n.y)/(n.vry||1),toward.x-n.x);return{x:n.x+Math.cos(a)*n.vr,y:n.y+Math.sin(a)*n.vr*(n.vry||1)};}
function connected(a,b){for(const e of net.edges)if(e.dir&&((e.a===a&&e.b===b)))return true;return false;}
function reaches(n){return n.ins.some(e=>e.flow>0.004||e.front>0);}
function computeTarget(){
  if(G.rew||G.viewer)return null;
  if(G.phase==='intro'){if(G.introPop<0)return{id:'drop',kind:'tap',x:L.center.x,y:L.center.y};if(G.introPop>4.6)return{id:'handle',kind:'handle'};return null;}
  if(G.fest){if(G.fest.cardDone&&G.fest.t>11)return{id:'handle2',kind:'handle'};return null;}
  const pondFed=FX.pond.ins.length>0;
  if(!pondFed&&FX.pond.water<FX.pond.cap*.3&&!(FX.wheel.ins.length&&FX.fountain.ins.length))return{id:'spout-pond',kind:'trace',path:[L.spoutB,rimPt(FX.pond,L.spoutB)]};
  if(!FX.wheel.ins.length){if(FX.pond.water>FX.pond.cap*.3)return{id:'pond-wheel',kind:'trace',path:[rimPt(FX.pond,L.wheel),rimPt(FX.wheel,L.pond)]};return null;}
  if(!FX.fountain.ins.length&&!connected(FX.wheel,FX.fountain))return{id:'wheel-fountain',kind:'trace',path:[rimPt(FX.wheel,L.fountain),rimPt(FX.fountain,L.wheel)]};
  if(FX.pond.water<FX.pond.cap*.7&&FX.fountain.ins.length&&G.valve){for(const n of net.nodes){if(n.outs.length<2||!n.outs.some(e=>e.b===FX.pond&&!e.blocked))continue;const e=n.outs.find(e=>e.b!==FX.pond&&!e.blocked);if(e){const q=pointAt(e.pts,e.cum,e.plugD);return{id:'plug',kind:'tap',x:q.x,y:q.y,path:[q,q]};}}}
  if(!G.roof&&G.raining)return{id:'roof',kind:'trace',path:[{x:L.pillarL.x,y:L.pillarL.y-L.pillarH},{x:L.pillarR.x,y:L.pillarR.y-L.pillarH}]};
  if(G.roof&&FX.bucket.water>FX.bucket.cap*.5&&!FX.bucket.outs.length)return{id:'bucket-out',kind:'trace',path:[rimPt(FX.bucket,L.pond),rimPt(FX.pond,L.bucket)]};
  return null;}
function hintUpdate(dt){const t=computeTarget();G.target=t;
  if(t&&(t.kind==='trace'&&t.id!=='spout-pond'||t.id==='plug')){if(!G.marker||G.marker.id!==t.id){const sp=swanWorld();const fromSwan=swan.mode!=='dry';G.marker={id:t.id,x:t.path[0].x,y:t.path[0].y,fx:fromSwan?sp.x:t.path[0].x,fy:fromSwan?sp.y:L.cloud.y,t:0};if(fromSwan){swan.flick=1;sfx.honk();}}
    G.marker.x=t.path[0].x;G.marker.y=t.path[0].y;G.marker.t+=dt;}else G.marker=null;
  const idle=now-G.lastInput;
  if(G.hand){G.hand.t+=dt;if(G.hand.t>3.2)G.hand=null;}
  else if(t&&idle>10&&!G.hintShown[t.id]&&ptr.mode==null){G.hintShown[t.id]=1;G.hand={t:0,tg:t};logEv('hand:'+t.id);}}
function idleBounce(){const idle=now-G.lastInput;return idle>4?Math.abs(Math.sin(now*4))*clamp((idle-4)/1.5,0,1):0;}

/* ================= main update ================= */
function update(dt){
  G.roundT+=dt;for(const k in G.wob){G.wob[k]=Math.max(0,G.wob[k]-dt*2.2);}
  // rabbit
  rab.blinkT-=dt;if(rab.blinkT<-0.13){rab.blinkT=rnd(2,4.5);}
  if(rab.mode==='hop'){rab.hopT+=dt;if(rab.hopT>=0.8){rab.mode='perch';sfx.paper();}}
  if(G.phase==='intro'&&G.introPop>=0){G.introPop+=dt;if(G.introPop>0.55&&!G.raining)startRain();if(G.introPop>0.45&&rab.mode==='center'){rab.mode='hop';rab.hopT=0;rab.hold=false;}}
  rab.strain=Math.max(0,rab.strain-dt);rab.squash=lerp(rab.squash,rab.strain>0?1:0,Math.min(1,dt*10));
  if(rab.joy>0){rab.joy-=dt;if(rab.jump<=0&&rab.vy<=0&&rab.joy>0.2){rab.vy=260;}}
  rab.vy-=900*dt;rab.jump=Math.max(0,rab.jump+rab.vy*dt);if(rab.jump<=0&&rab.vy<0)rab.vy=0;
  if(!G.rew)rab.clockA+=dt*0.6;
  if(Math.random()<dt*0.4)rab.earJ=0.5;rab.earJ=Math.max(0,rab.earJ-dt);
  if(ptr.mode!=='handle')rab.pull=Math.max(0,rab.pull-dt*4);
  // look target
  let lk=null;
  if(ptr.mode==='draw'&&ptr.cur)lk=ptr.cur;else if(G.hold)lk=G.hold;
  else if(G.phase==='intro'&&G.introPop>2.2&&G.introPop<=4.6)lk=L.wheel;
  else if(G.phase==='intro'&&G.introPop>4.6)lk={x:rabPos().x-30*S,y:rabPos().y-10*S};
  else if(G.target&&G.target.kind==='trace')lk=G.target.path[0];
  else if(G.fest)lk=L.fountain;
  rab.point=(G.phase==='intro'&&G.introPop>2.2&&G.introPop<=4.6)?Math.min(1,rab.point+dt*3):Math.max(0,rab.point-dt*3);
  if(lk){const hp=rabScreen(0,-70);const dx=PX(lk.x,lk.y)-hp.x,dy=PY(lk.y)-hp.y,dl=Math.hypot(dx,dy)||1;rab.lookX=lerp(rab.lookX,dx/dl,Math.min(1,dt*8));rab.lookY=lerp(rab.lookY,dy/dl,Math.min(1,dt*8));}
  else{rab.lookX=lerp(rab.lookX,Math.sin(now*.5)*.4,dt*2);rab.lookY=lerp(rab.lookY,.1,dt*2);}
  if(G.rew){rewindUpdate(dt);}
  else{
    if(G.raining)G.rainT+=dt;
    flowStep(dt);
    // wheel & bridge
    const win=FX.wheel.in;G.wheelW=lerp(G.wheelW,win*5,Math.min(1,dt*2));G.wheelSpin=win>0.08?G.wheelSpin+dt:Math.max(0,G.wheelSpin-dt);
    if(G.wheelSpin>0.8&&!G.bridgeDone){if(G.bridge===0){sfx.lift();logEv('bridge');}G.bridge=Math.min(1,G.bridge+dt/1.6);if(G.bridge>=1){G.bridgeDone=true;}}
    // pond / swan triggers
    const pl=FX.pond.water/FX.pond.cap;
    if(pl>0.3&&!swan.flapped){swan.flapped=true;swan.flap=1.4;sfx.flap();setTimeout(()=>sfx.honk(),350);sfx.success();logEv('swan');}
    // festival
    if(!G.fest&&G.round>=2){const ok=pl>0.75&&G.wheelSpin>0.5&&G.valve&&FX.fountain.in>0.08;G.festHold=ok?G.festHold+dt:0;if(G.festHold>1)startFestival();}
    if(G.fest)festUpdate(dt);

  if(Math.abs(G.wheelW)>0.3&&now-lastClack>Math.max(0.12,1.2/Math.abs(G.wheelW))){lastClack=now;sfx.clack();}
  // resident
  resUpdate(dt);
  swanUpdate(dt);
  cakesUpdate(dt);
  puddleUpdate(dt);
  if(G.roof)G.roofT=Math.min(1,G.roofT+dt*2.2);
  spawnWeather(dt);
  updParts(dt);
  hintUpdate(dt);
  // audio beds
  if(AU.ready){const t=AU.ctx.currentTime;const rv=G.raining&&!G.rew?0.05:0;AU.rainG.gain.setTargetAtTime(rv,t,0.3);
    let tot=0;for(const e of net.edges)tot+=e.flow;AU.flowG.gain.setTargetAtTime(Math.min(0.05,tot*0.025),t,0.3);
    if(tot>0.05&&now-lastBubble>Math.max(0.14,0.5/tot)){lastBubble=now;if(Math.random()<0.7)sfx.bubble();}}
}
function resUpdate(dt){
  const r=resRoute();const c=cumLen(r);
  if(res.state==='wait'){if(G.bridge>=1){res.state='wave';res.t=0;sfx.wave();}}
  else if(res.state==='wave'){res.t+=dt;if(res.t>0.9){res.state='cross';res.d=0;}}
  else if(res.state==='cross'){res.d+=dt*48*S;if(res.d>=c[c.length-1]){res.state='open';res.t=0;}}
  else if(res.state==='open'){res.t+=dt;if(res.t>1.1&&!G.valve){G.valve=true;sfx.valve();sfx.success();logEv('valve');for(let i=0;i<8;i++)addP({type:'spark',x:L.fountain.x,y:L.fountain.y-20*S,vx:rnd(-90,90)*S,vy:rnd(-140,-40)*S,max:.8,r:rnd(2,4)*S,hue:rnd(160,220)});}if(res.t>1.6)res.state='stand';}
  if(G.valve)G.valveT=Math.min(1,G.valveT+dt*2);
}
function swanWorld(){const n=FX.pond;return{x:n.x+swan.x*L.pondR*.7,y:n.y+swan.y*L.pondR*.5};}
function swanUpdate(dt){const pl=FX.pond.water/FX.pond.cap;swan.flap=Math.max(0,swan.flap-dt);swan.flick=Math.max(0,swan.flick-dt*1.5);
  if(pl<0.12){swan.mode='dry';swan.x=lerp(swan.x,0,dt);swan.y=lerp(swan.y,.1,dt);return;}
  swan.mode='float';const rr=Math.min(.85,Math.sqrt(pl)*.95);
  let tx,ty;
  if(G.target&&G.target.kind==='trace'&&G.target.id!=='spout-pond'){const p=G.target.path[0];const a=Math.atan2(p.y-L.pond.y,p.x-L.pond.x);tx=Math.cos(a)*rr*.85;ty=Math.sin(a)*rr*.85;}

function cakesUpdate(dt){const rain=G.raining&&!G.rew;
  for(const c of G.cakes){c.pop=Math.min(1,c.pop+dt*3);c.wob=Math.max(0,c.wob-dt*2);if(rain&&!(G.roof&&G.roofT>0.8))c.wet=Math.min(1,c.wet+dt*0.12);else if(G.roof)c.wet=Math.max(0,c.wet-dt*0.05);}

  for(const h of helpers)h.hop=Math.max(0,h.hop-dt*2);}
function cakePos(i,n){const off=n===1?[0]:n===2?[-12,12]:[-20,0,20];return{x:L.table.x+(off[i]||0)*S,y:L.table.y-22*S};}
function spillPos(n){if(n===FX.spout)return{x:L.spoutB.x+8*S,y:L.spoutB.y+14*S};if(n===FX.fountain)return{x:L.fountain.x+L.fR*.8,y:L.fountain.y+L.fR*.8};
  if(n===FX.wheel)return{x:L.wheel.x+6*S,y:L.wheel.y+L.wheelR+12*S};if(n===FX.pond)return{x:L.pond.x+L.pondR*.55,y:L.pond.y+L.pondR*.8};if(n===FX.bucket)return{x:L.bucket.x+12*S,y:L.bucket.y+16*S};return{x:n.x,y:n.y};}
function puddleUpdate(dt){
  for(const n of net.nodes){const s=n.spill+n.over;if(s>0.01){let p=null;for(const q of G.puddles)if(q.nid===n.id){p=q;break;}
    if(!p){if(G.puddles.length>=14)continue;const sp=spillPos(n);p={nid:n.id,a:0,x:sp.x,y:sp.y,seed:rnd(0,9)};G.puddles.push(p);}p.a=Math.min(1,p.a+s*dt*0.12);p.live=1;}}

function spawnWeather(dt){
  if(G.raining&&!G.rew){
    G.rainAcc+=dt*30;while(G.rainAcc>1){G.rainAcc--;if(rainCount>100)break;const t=rnd(0,1);const x=lerp(L.spoutA.x,L.spoutB.x,t)+rnd(-14,14)*S;

    G.drizAcc+=dt*16;while(G.drizAcc>1){G.drizAcc--;if(rainCount>130)break;const x=rnd(L.x0,L.x0+L.w);let ly=rnd(L.y0+L.h*.18,L.y0+L.h);
      if(G.roof&&G.roofT>0.5&&x>L.roofX1&&x<L.roofX2&&ly>L.roofY-20*S)ly=roofYAt(x);
      if(Math.random()<0.25){ly=L.table.y-26*S+rnd(-4,8)*S;}

function roofYAt(x){const t=clamp((x-L.roofX1)/(L.roofX2-L.roofX1),0,1);return L.roofY-Math.sin(t*Math.PI)*16*S+t*6*S;}

/* ================= input ================= */
const ptr={id:null,mode:null,pts:[],len:0,lastBlip:0,cur:null,sx:0,sy:0,t0:0,startW:null,moved:0};
function hitHandle(sx,sy){if(G.phase==='intro'&&G.introPop<0)return false;
  const kn=rabScreen(-31-rab.pull*14,-27),cl=rabScreen(0,-30);
  return Math.hypot(sx-kn.x,sy-kn.y)<Math.max(38,26*kn.k)||Math.hypot(sx-cl.x,sy-cl.y)<Math.max(30,22*cl.k);}
function hitCloudDrop(w){return!G.raining&&G.phase==='play'&&Math.hypot(w.x-L.cloud.x,w.y-(L.cloud.y+36*S))<Math.max(40,30*S);}
function hitPlug(w){let best=null,bd=Math.max(26,20*S);for(const e of net.edges){if(!e.plug)continue;const p=pointAt(e.pts,e.cum,e.plugD);const d=Math.hypot(w.x-p.x,w.y-p.y);if(d<bd){bd=d;best=e;}}return best;}
function hitCake(w){const n=G.cakes.length;for(let i=0;i<n;i++){const p=cakePos(i,n);if(Math.hypot(w.x-p.x,w.y-p.y)<Math.max(24,17*S))return i;}return-1;}
function hitPostcard(sx,sy){const ps=cardSlots();for(let i=ps.length-1;i>=0;i--){const s=ps[i];if(Math.abs(sx-s.x)<s.w/2+8&&Math.abs(sy-s.y)<s.h/2+8)return s.i;}return-1;}
function objAt(w){const list=[['pond',L.pond,L.pondR],['wheel',L.wheel,L.wheelR+8*S],['fountain',L.fountain,L.fR+8*S],['table',{x:L.table.x,y:L.table.y-20*S},50*S],['bucket',L.bucket,22*S],['cloud',L.cloud,60*S],['home',L.home,30*S],['bridge',L.bridgeM,30*S],['res',resPos(),18*S]];
  const rp=rabPos();list.push(['rabbit',{x:rp.x,y:rp.y-50*S},45*S]);
  let best=null,bd=1e9;for(const [n,p,r] of list){const d=Math.hypot(w.x-p.x,w.y-p.y);if(d<r&&d/r<bd){bd=d/r;best=n;}}
  for(let i=0;i<houses.length;i++){const h=houses[i];if(Math.hypot(w.x-h.x,w.y-(h.y-12*S))<22*S)return'house'+i;}return best;}
function onDown(ev){ev.preventDefault();audioInit();
  if(ptr.id!==null)return;
  ptr.id=ev.pointerId;try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  G.lastInput=now;const sx=ev.clientX,sy=ev.clientY;const w=inv(sx,sy);ptr.sx=sx;ptr.sy=sy;ptr.t0=now;ptr.moved=0;ptr.startW=w;ptr.mode='none';
  if(G.hand)G.hand=null;
  if(G.viewer){G.viewer=null;sfx.paper();return;}
  const pc=hitPostcard(sx,sy);if(pc>=0){G.viewer={i:pc,t:0};sfx.paper();logEv('viewer');return;}
  if(G.rew)return;
  if(hitHandle(sx,sy)){ptr.mode='handle';return;}
  if(G.phase==='intro'&&G.introPop<0){
    if(Math.hypot(w.x-L.center.x,w.y-L.center.y)<Math.max(90,80*S)){popIntroDrop();return;}
    G.dropBounce=1;const o=objAt(w);if(o)wob(o);inkDot(w.x,w.y);return;}
  if(hitCloudDrop(w)){startRain();return;}
  const pl=hitPlug(w);if(pl){pl.blocked=!pl.blocked;pl.plugPop=1;sfx.plug(pl.blocked);logEv(pl.blocked?'plug-close':'plug-open');return;}
  const ci=hitCake(w);if(ci>=0){const c=G.cakes[ci];if(c.wet<0.35&&G.roof){ptr.mode='cake';G.hold={i:ci,x:w.x,y:w.y};sfx.paper();}else{c.wob=1;wob('table');}return;}
  if(G.drawOK){ptr.mode='draw';ptr.pts=[{x:w.x,y:w.y,t:now}];ptr.len=0;ptr.lastBlip=0;ptr.cur={x:w.x,y:w.y};return;}
  ptr.mode='tap';}
function onMove(ev){if(ev.pointerId!==ptr.id)return;ev.preventDefault();G.lastInput=now;
  const evs=(ev.getCoalescedEvents&&ev.getCoalescedEvents())||[];const list=evs.length?evs:[ev];
  for(const e of list){const sx=e.clientX,sy=e.clientY;ptr.moved=Math.max(ptr.moved,Math.hypot(sx-ptr.sx,sy-ptr.sy));const w=inv(sx,sy);
    if(ptr.mode==='draw'){const l=ptr.pts[ptr.pts.length-1];const d=Math.hypot(w.x-l.x,w.y-l.y);if(d>=3){ptr.pts.push({x:w.x,y:w.y,t:now});ptr.len+=d;ptr.cur=w;
        if(ptr.pts.length>900)ptr.pts.splice(1,1);
        if(ptr.len-ptr.lastBlip>26){ptr.lastBlip=ptr.len;sfx.blip(w.y);const grow=Math.min(2.2,1+ptr.len/500);addP({type:'chase',x:sx+rnd(-6,6),y:sy+rnd(-6,6),tx:sx,ty:sy,max:.45,r:rnd(2,3.5)*S*grow});}
        if(ptr.len>24&&!G.raining&&G.phase==='play')startRain();}}
    else if(ptr.mode==='handle'){const dx=sx-ptr.sx,dy=sy-ptr.sy;rab.pull=clamp(Math.max(-dx,Math.hypot(dx,dy)*0.6)/(44*Math.max(.8,S)),0,1);if(rab.pull>=1){ptr.mode='none';startRewind();}}
    else if(ptr.mode==='cake'&&G.hold){G.hold.x=w.x;G.hold.y=w.y;}}}
function endDraw(commit){const pts=ptr.pts;ptr.pts=[];ptr.cur=null;
  if(ptr.len>=24&&commit){commitStroke(pts);}
  else if(pts.length){const w=pts[0];const o=objAt(w);if(o)wob(o);else inkDot(w.x,w.y);}
  ptr.len=0;}
function onUp(ev){if(ev.pointerId!==ptr.id)return;ev.preventDefault();const cancel=ev.type==='pointercancel';
  const w=inv(ev.clientX,ev.clientY);

      if(G.handleTaps>=2){G.handleTaps=0;startRewind();}}}
  else if(ptr.mode==='cake'&&G.hold){const rp=rabScreen(0,-40);const sp={x:PX(w.x,w.y),y:PY(w.y)};
    if(Math.hypot(sp.x-rp.x,sp.y-rp.y)<Math.max(70,60*rp.k)){G.cakes.splice(G.hold.i,1);G.cakeT=0;rab.joy=1.8;rab.vy=280;sfx.joy();logEv('cake-give');
      for(let i=0;i<10;i++)addP({type:'heart',x:rabPos().x+rnd(-30,30)*S,y:rabPos().y-rnd(40,90)*S,vx:rnd(-30,30)*S,vy:rnd(-60,-20)*S,max:1.4,r:rnd(4,7)*S});}
    else sfx.paper();G.hold=null;}
  else if(ptr.mode==='tap'&&!cancel){const o=objAt(ptr.startW||w);if(o)wob(o);else inkDot(w.x,w.y);}
  try{cv.releasePointerCapture(ev.pointerId);}catch(e){}
  ptr.id=null;ptr.mode=null;}
function cancelPointer(){if(ptr.mode==='draw')endDraw(true);G.hold=null;ptr.id=null;ptr.mode=null;}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});

function tracePath(pts,dy){const p=new Path2D();for(let i=0;i<pts.length;i++){const q=pts[i];const x=PX(q.x,q.y),y=PY(q.y)-(dy||0);if(i)p.lineTo(x,y);else p.moveTo(x,y);}return p;}
function tracePart(pts,c,from,to,dy){const p=new Path2D();const a=pointAt(pts,c,from);p.moveTo(PX(a.x,a.y),PY(a.y)-(dy||0));for(let i=0;i<pts.length;i++){if(c[i]>from&&c[i]<to)p.lineTo(PX(pts[i].x,pts[i].y),PY(pts[i].y)-(dy||0));}const b=pointAt(pts,c,to);p.lineTo(PX(b.x,b.y),PY(b.y)-(dy||0));return p;}
function rainbowGrad(pts,a){const p0=pts[0],p1=pts[pts.length-1];const g=ctx.createLinearGradient(PX(p0.x,p0.y),PY(p0.y),PX(p1.x,p1.y),PY(p1.y)+1);
  for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsla(${(variant.hue+i*50+now*30)%360},80%,${78}%,${a})`);return g;}
function drawInk(e,isSpout){const k=PK(e.pts[0].y);const w=15*S*k;const lift=POP*6*S;
  const path=tracePath(e.pts,lift);

  if(POP>0.01){const wall=tracePath(e.pts,0);ctx.strokeStyle='rgba(60,95,110,.14)';ctx.lineWidth=w+6*S;ctx.save();ctx.translate(2*S,4*S);ctx.stroke(wall);ctx.restore();
    ctx.strokeStyle=rainbowGrad(e.pts,.9);ctx.lineWidth=w+4*S;ctx.stroke(wall);ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=w+2*S;for(let s=0;s<lift;s+=2*S){ctx.save();ctx.translate(0,-s);ctx.stroke(wall);ctx.restore();}}
  ctx.save();ctx.translate(1.3*S,2.6*S);ctx.strokeStyle='rgba(45,105,150,.17)';ctx.lineWidth=w+3*S;ctx.stroke(path);ctx.restore();
  ctx.strokeStyle=POP>0.3?rainbowGrad(e.pts,.95):'rgba(150,210,240,.88)';ctx.lineWidth=w;ctx.stroke(path);
  ctx.save();ctx.translate(-.6*S,-.8*S);ctx.strokeStyle='rgba(205,238,252,.9)';ctx.lineWidth=w*.55;ctx.stroke(path);ctx.restore();
  if(e.front>1){const wp=tracePart(e.pts,e.cum,0,Math.min(e.front,e.len),lift);
    ctx.strokeStyle=`rgba(38,126,210,${.35+.6*e.vis})`;ctx.lineWidth=w*.62;ctx.stroke(wp);
    if(e.vis>0.05){ctx.setLineDash([3*S,13*S]);ctx.lineDashOffset=-now*(70+90*Math.min(1.5,e.flow))*S;ctx.strokeStyle=`rgba(255,255,255,${.75*e.vis})`;ctx.lineWidth=w*.22;ctx.stroke(wp);ctx.setLineDash([]);
      const n=Math.min(8,Math.floor(e.front/(30*S)));for(let i=0;i<n;i++){const d=(now*(60+80*e.flow)*S+i*30*S)%Math.max(1,e.front);const q=pointAt(e.pts,e.cum,d);inkBeadW(PX(q.x,q.y),PY(q.y)-lift,w*.24*(0.8+Math.min(1,e.flow)));}

  ctx.save();ctx.translate(-w*.16,-w*.22);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=w*.17;ctx.stroke(path);ctx.restore();}

const spoutEdge={pts:[],cum:[0],len:0,front:0,vis:0,flow:0};
function drawSpout(){spoutEdge.pts=[L.spoutA,{x:lerp(L.spoutA.x,L.spoutB.x,.5)+3*S,y:lerp(L.spoutA.y,L.spoutB.y,.5)},L.spoutB];spoutEdge.cum=cumLen(spoutEdge.pts);spoutEdge.len=spoutEdge.cum[2];

  const b=L.spoutB,k=PK(b.y);const x=PX(b.x,b.y),y=PY(b.y)-POP*6*S;ctx.fillStyle='rgba(120,190,230,.9)';ctx.beginPath();ctx.arc(x,y,7.5*S*k,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(x-2*S,y-2*S,2.2*S,0,TAU);ctx.fill();

    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=ww*.2;ctx.beginPath();ctx.moveTo(PX(a.x,a.y)-ww*.16,PY(a.y)-ww*.22);ctx.lineTo(PX(b.x,b.y)-ww*.16,PY(b.y)-ww*.22);ctx.stroke();}
  // wobble rings of droplets growing with length

    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x-3*S,y-3.5*S,2.6*S,0,TAU);ctx.fill();}}
