<body>

<script>
'use strict';
(function(){
/* ============================================================
   こねこのバレエ劇場！ぽんぽん舞台がえ
   版画（リソグラフ）調の一画面舞台。3つの楽器が状態系をつなぐ。
   座標系: 舞台ボックス 600x640（床 y=560）。楽器はボックス下に並ぶ。
   ============================================================ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const eob = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const appr = (v, t, k, dt) => v + (t - v) * (1 - Math.exp(-k * dt));
const hyp = Math.hypot;

/* ---------- 刷り色（インク）と版ずれ ---------- */
const INK = {
  paper: '#f5ecd9', cream: '#fffaf0', pink: '#f29fa3', red: '#e5553b', teal: '#2f9d94',
  navy: '#2b3772', gold: '#d8a43e', yellow: '#f4cd62', sky: '#8fc3cf', plum: '#b46f8f'
};
let OFF = {};
function setRegistration() {
  const j = () => rand(-0.6, 0.6);
  OFF = {
    pink: [1.5 + j(), -1.0 + j()], red: [-1.2 + j(), 1.3 + j()], teal: [-1.6 + j(), 0.6 + j()],
    navy: [0.9 + j(), 1.2 + j()], gold: [1.3 + j(), 0.9 + j()], yellow: [-0.7 + j(), -1.2 + j()],
    sky: [0.6, -0.8], plum: [-0.8, 0.9], cream: [0, 0], paper: [0, 0]
  };
}
setRegistration();

/* ============================================================
   音（Web Audio 合成）
   ============================================================ */
const AU = { c: null, m: null, rv: null, ok: false, nb: null };
function audioStart() {
  if (AU.c) {
    if (AU.c.state === 'suspended') { try { AU.c.resume(); } catch (e) { /* 無音でも続行 */ } }
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = new AC();
    AU.c = c;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    comp.connect(c.destination);
    const m = c.createGain(); m.gain.value = 0.75; m.connect(comp); AU.m = m;
    // 残響（ふたつのディレイの帰還）
    const rin = c.createGain(); rin.gain.value = 0.5;
    const d1 = c.createDelay(1.0); d1.delayTime.value = 0.17;
    const d2 = c.createDelay(1.0); d2.delayTime.value = 0.29;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    const fb = c.createGain(); fb.gain.value = 0.42;
    const rout = c.createGain(); rout.gain.value = 0.55;
    rin.connect(d1); d1.connect(lp); lp.connect(d2); d2.connect(fb); fb.connect(d1);
    lp.connect(rout); d2.connect(rout); rout.connect(m);
    AU.rv = rin;
    const nb = c.createBuffer(1, Math.floor(c.sampleRate * 1.2), c.sampleRate);
    const ch = nb.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    AU.nb = nb;
    const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource();
    s.buffer = b; s.connect(c.destination); s.start(0);
    if (c.state === 'suspended') c.resume();
    AU.ok = true;
  } catch (e) { AU.ok = false; }
}
function osc(type, f, t0, dur, vol, o) {
  o = o || {};
  const c = AU.c, os = c.createOscillator(), g = c.createGain();
  os.type = type; os.frequency.setValueAtTime(f, t0);
  if (o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + (o.fd || dur));
  if (o.det) os.detune.setValueAtTime(o.det, t0);
  const a = o.a || 0.004;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  os.connect(g); g.connect(AU.m);
  if (o.rv) { const s = c.createGain(); s.gain.value = o.rv; g.connect(s); s.connect(AU.rv); }
  os.start(t0); os.stop(t0 + dur + 0.05);
}
function noi(t0, dur, vol, type, freq, q, o) {
  o = o || {};
  const c = AU.c, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.nb; f.type = type; f.frequency.setValueAtTime(freq, t0);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
  f.Q.value = q || 1;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + (o.a || 0.003));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AU.m);
  if (o.rv) { const r = c.createGain(); r.gain.value = o.rv; g.connect(r); r.connect(AU.rv); }
  s.start(t0, Math.random() * 0.4); s.stop(t0 + dur + 0.05);
}
function sfx(fn) {
  if (!AU.ok || !AU.c || AU.c.state === 'closed') return;
  try { fn(AU.c.currentTime + 0.004); } catch (e) { /* 再生拒否でも視覚は止めない */ }
}
const PENT = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98, 1760.0, 2093.0, 2349.3];
const SND = {
  drum(c) {
    sfx(t => {
      const f = 122 - c * 17;
      osc('sine', f * 1.7, t, 0.45 + 0.12 * c, 0.9, { f2: f * 0.55, fd: 0.26 });
      osc('triangle', f * 2.4, t, 0.1, 0.22, { f2: f * 1.1 });
      noi(t, 0.16, 0.32, 'lowpass', 650, 0.7);
      noi(t, 0.03, 0.12, 'bandpass', 1500, 1.2);
    });
  },
  xylo(start, count) {
    sfx(t => {
      for (let k = 0; k < count; k++) {
        const f = PENT[clamp(start + k, 0, PENT.length - 1)], t0 = t + k * 0.085;
        osc('sine', f, t0, 0.6, 0.36);
        osc('sine', f * 3.99, t0, 0.08, 0.1);
        noi(t0, 0.025, 0.12, 'bandpass', 2400, 3);
      }
    });
  },
  bell(p) {
    sfx(t => {
      const b = 1318.5 * (p || 1);
      osc('sine', b, t, 2.6, 0.24, { rv: 0.9, a: 0.002 });
      osc('sine', b * 2.756, t, 1.3, 0.08, { rv: 0.9 });
      osc('sine', b * 5.404, t, 0.6, 0.04, { rv: 0.9 });
      osc('sine', b * 0.5, t, 1.8, 0.07, { rv: 0.5 });
    });
  },
  success(big) {
    sfx(t => {
      const ns = big ? [1046.5, 1318.5, 1568, 2093, 2637] : [1568, 2093, 2637];
      ns.forEach((f, i) => osc('triangle', f, t + i * 0.07, 0.5, 0.17, { rv: 0.7 }));
      if (big) {
        [523.25, 659.25, 783.99].forEach(f => osc('sine', f, t + 0.05, 1.3, 0.09, { a: 0.08, rv: 0.4 }));
        for (let i = 0; i < 6; i++) osc('sine', rand(2600, 4200), t + 0.3 + i * 0.06, 0.25, 0.04, { rv: 0.9 });
      }
    });
  },
  squeak() {
    sfx(t => {
      osc('sine', 1700, t, 0.1, 0.13, { f2: 2500, fd: 0.07 });
      osc('sine', 1900, t + 0.13, 0.1, 0.11, { f2: 2800, fd: 0.07 });
    });
  },
  mew() { sfx(t => { osc('triangle', 720, t, 0.22, 0.12, { f2: 980, fd: 0.12 }); }); },
  land(v) {
    sfx(t => {
      noi(t, 0.16, 0.25 * (v || 1), 'lowpass', 420, 0.8);
      osc('sine', 95, t, 0.15, 0.16 * (v || 1), { f2: 55 });
    });
  },
  clack(i) {
    sfx(t => {
      noi(t, 0.035, 0.22, 'bandpass', 1500 + i * 160, 4);
      osc('square', 260 + i * 35, t, 0.035, 0.035);
    });
  },
  boing() { sfx(t => { osc('sine', 170, t, 0.5, 0.35, { f2: 430, fd: 0.14 }); osc('sine', 340, t + 0.12, 0.35, 0.12, { f2: 180 }); }); },
  whoosh() { sfx(t => { noi(t, 0.5, 0.16, 'bandpass', 500, 1.5, { f2: 2600, a: 0.15 }); }); },
  tiny() { sfx(t => { noi(t, 0.06, 0.07, 'bandpass', 3200, 2); }); },
  pop() { sfx(t => { osc('sine', 640, t, 0.12, 0.2, { f2: 320 }); noi(t, 0.05, 0.1, 'highpass', 2000, 1); }); },
  mbox(seq) {
    sfx(t => {
      seq.forEach((n, i) => {
        const f = PENT[clamp(n, 0, PENT.length - 1)] * 2;
        osc('sine', f, t + i * 0.14, 0.7, 0.1, { rv: 0.8, a: 0.002 });
        osc('sine', f * 2.01, t + i * 0.14, 0.2, 0.03);
      });
    });
  },
  magic() {
    sfx(t => {
      for (let i = 0; i < 12; i++) osc('triangle', PENT[i % 12], t + i * 0.06, 0.6, 0.12, { rv: 0.8 });
      [261.6, 329.6, 392, 523.25].forEach(f => osc('sine', f, t + 0.2, 2.4, 0.08, { a: 0.3, rv: 0.5 }));
      for (let i = 0; i < 10; i++) osc('sine', rand(2400, 4600), t + 0.6 + i * 0.09, 0.3, 0.035, { rv: 1 });
    });
  },
  fanfare() {
    sfx(t => {
      const m = [0, 2, 4, 5, 7, 9, 8, 10];
      m.forEach((n, i) => osc('triangle', PENT[n], t + i * 0.16, 0.45, 0.15, { rv: 0.6 }));
      [523.25, 659.25, 783.99, 1046.5].forEach(f => osc('sine', f, t + 1.3, 1.6, 0.07, { a: 0.05, rv: 0.6 }));
    });
  }
};

/* ============================================================
   キャンバスと配置
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');
let X = ctx, SIL = null;
let W = 1, H = 1, DPR = 1, S = 1, BX = 0, BY = 0, WW = 600, WH = 840, LAND = false, OS = 1.5;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
let EXT = { l: 0, r: 600, t: 0, b: 840 };
const FLOOR = 560;
const INST = {
  drum: { k: 'drum', x: 104, y: 740, r: 96 },
  xylo: { k: 'xylo', x: 300, y: 740, r: 100 },
  bell: { k: 'bell', x: 496, y: 740, r: 96 }
};
const MBOX = { x: 46, y: 604, r: 58 };
let ISC = 1, shadowCv = null, screenDotPat = null;
let bgIndoor = null, bgBall = null, grainPat = null, dotPat = null, dotCanvas = null, grainCanvas = null;

function readSafe() {
  try {
    const cs = getComputedStyle(saEl);
    SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
    SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) { SAFE.t = SAFE.r = SAFE.b = SAFE.l = 0; }
}
function layout() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  readSafe();
  const aw = Math.max(50, W - SAFE.l - SAFE.r), ah = Math.max(50, H - SAFE.t - SAFE.b);
  S = Math.min(aw / 600, ah / 936);
  WW = W / S; WH = H / S;
  OS = clamp(1.25 / S, 0.9, 2.2);
  const st = SAFE.t / S, sl = SAFE.l / S;
  const uw = aw / S, uh = ah / S, extra = Math.max(0, uh - 936);
  LAND = uw > 760;
  BX = sl + uw / 2 - 300;
  BY = st + 96 + extra * 0.8;
  const bandY = st + uh - 104 - BY;
  ISC = 1 + Math.min(0.28, extra / 900);
  for (const k in INST) INST[k].r = (k === 'xylo' ? 100 : 96) * ISC;
  const spread = LAND ? Math.min(285, uw / 2 - 128) : 196;
  INST.drum.x = 300 - spread; INST.xylo.x = 300; INST.bell.x = 300 + spread;
  INST.drum.y = INST.xylo.y = INST.bell.y = bandY;
  EXT = { l: -BX, r: WW - BX, t: -BY, b: WH - BY };
  buildTextures();
  buildBackgrounds();
}
function toBox(cx, cy) { return { x: cx / S - BX, y: cy / S - BY }; }

/* ---------- 版画の描画プリミティブ ---------- */
function bp() { X.beginPath(); }
function pc(x, y, r) { X.moveTo(x + r, y); X.arc(x, y, r, 0, TAU); }
function pe(x, y, rx, ry, rot) {
  rot = rot || 0;
  X.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot));
  X.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU);
}
function pr(x, y, w, h) { X.rect(x, y, w, h); }
function prr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath();
}
function pp(a) { X.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) X.lineTo(a[i], a[i + 1]); X.closePath(); }
function pl(a) { X.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) X.lineTo(a[i], a[i + 1]); }
function pstar(x, y, r1, r2, n, rot) {
  n = n || 5; rot = rot || 0;
  for (let i = 0; i < n * 2; i++) {
    const a = rot - PI / 2 + i * PI / n, r = i % 2 ? r2 : r1;
    if (i === 0) X.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else X.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  X.closePath();
}
/* インクで塗る（multiply＋版ずれ）。cream/paper は紙の白抜き */
function F(col, path, al) {
  if (SIL) { X.globalCompositeOperation = 'source-over'; X.fillStyle = SIL; bp(); path(); X.fill(); return; }
  const o = OFF[col] || [0, 0], ko = (col === 'cream' || col === 'paper');
  X.globalCompositeOperation = ko ? 'source-over' : 'multiply';
  X.fillStyle = INK[col] || col;
  let ga = 0;
  if (al != null) { ga = X.globalAlpha; X.globalAlpha = ga * al; }
  const ox = o[0] * OS, oy = o[1] * OS;
  X.translate(ox, oy); bp(); path(); X.fill(); X.translate(-ox, -oy);
  if (al != null) X.globalAlpha = ga;
}
/* 紺の主版線 */
function Ln(path, w, col, al) {
  if (SIL) return;
  col = col || 'navy';
  const o = OFF[col] || [0, 0];
  X.globalCompositeOperation = (col === 'cream') ? 'source-over' : 'multiply';
  X.strokeStyle = INK[col] || col; X.lineWidth = w || 2;
  let ga = 0;
  if (al != null) { ga = X.globalAlpha; X.globalAlpha = ga * al; }
  const ox = o[0] * OS, oy = o[1] * OS;
  X.translate(ox, oy); bp(); path(); X.stroke(); X.translate(-ox, -oy);
  if (al != null) X.globalAlpha = ga;
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 紙肌と網点 ---------- */
function buildTextures() {
  if (!grainCanvas) {
    const n = 220;
    grainCanvas = document.createElement('canvas'); grainCanvas.width = n; grainCanvas.height = n;
    const g = grainCanvas.getContext('2d');
    const id = g.createImageData(n, n), d = id.data;
    for (let i = 0; i < n * n; i++) {
      const r = Math.random();
      let v = 255 - Math.pow(r, 6) * 70 - Math.random() * 10;
      d[i * 4] = v; d[i * 4 + 1] = v - 2; d[i * 4 + 2] = v - 8; d[i * 4 + 3] = 255;
    }
    g.putImageData(id, 0, 0);
    g.globalCompositeOperation = 'multiply';
    for (let i = 0; i < 70; i++) {
      g.strokeStyle = 'rgba(150,120,90,' + rand(0.05, 0.16) + ')'; g.lineWidth = rand(0.4, 1.0);
      const x = rand(0, n), y = rand(0, n), a = rand(0, TAU), l = rand(3, 12);
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * l * 0.6, y + Math.sin(a + 0.5) * l * 0.6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  }
  grainPat = ctx.createPattern(grainCanvas, 'repeat');
  if (!dotCanvas) {
    dotCanvas = document.createElement('canvas'); dotCanvas.width = 9; dotCanvas.height = 9;
    const g = dotCanvas.getContext('2d');
    g.fillStyle = INK.navy; g.beginPath(); g.arc(4.5, 4.5, 2.7, 0, TAU); g.fill();
  }
  dotPat = ctx.createPattern(dotCanvas, 'repeat');
  const sd = document.createElement('canvas'), sp = Math.max(5, Math.round(4.2 * DPR));
  sd.width = sd.height = sp;
  const sgx = sd.getContext('2d'); sgx.fillStyle = INK.navy; sgx.beginPath(); sgx.arc(sp / 2, sp / 2, sp * 0.36, 0, TAU); sgx.fill();
  screenDotPat = ctx.createPattern(sd, 'repeat');
}

/* ============================================================
   背景（静的部分は事前描画）
   ============================================================ */
function newLayer() { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; }
function boxTransform(g) { g.setTransform(DPR * S, 0, 0, DPR * S, DPR * S * BX, DPR * S * BY); }
function buildBackgrounds() {
  bgIndoor = newLayer(); bgBall = newLayer();
  const keep = X;
  let g = bgIndoor.getContext('2d'); X = g; boxTransform(g); g.lineCap = 'round'; g.lineJoin = 'round';
  drawIndoorBG();
  g = bgBall.getContext('2d'); X = g; boxTransform(g); g.lineCap = 'round'; g.lineJoin = 'round';
  drawBallBG();
  X = keep;
}
function fillExt(col, al) { F(col, () => pr(EXT.l - 4, EXT.t - 4, EXT.r - EXT.l + 8, EXT.b - EXT.t + 8), al); }
function drawCloud(x, y, s) {
  const blob = () => { pc(x, y, 26 * s); pc(x + 28 * s, y - 8 * s, 22 * s); pc(x + 54 * s, y + 2 * s, 20 * s); pc(x - 26 * s, y + 4 * s, 18 * s); X.rect(x - 26 * s, y, 80 * s, 20 * s); };
  F('cream', blob); F('pink', blob, 0.22);
  Ln(() => { X.moveTo(x - 40 * s, y + 20 * s); X.lineTo(x + 70 * s, y + 20 * s); }, 1.4, 'teal', 0.5);
}
function drawDrapes(x0, x1, col, rng) {
  if (x1 - x0 < 8) return;
  F('cream', () => pr(x0, EXT.t - 4, x1 - x0, EXT.b - EXT.t + 8));
  F(col, () => pr(x0, EXT.t - 4, x1 - x0, EXT.b - EXT.t + 8));
  const n = Math.max(2, Math.round((x1 - x0) / 34));
  for (let i = 0; i < n; i++) {
    const x = x0 + (i + 0.5) * (x1 - x0) / n;
    F(col === 'gold' ? 'yellow' : 'plum', () => { X.moveTo(x - 5, EXT.t); X.quadraticCurveTo(x + 8, 300, x - 4, EXT.b); X.lineTo(x + 6, EXT.b); X.quadraticCurveTo(x + 16, 300, x + 5, EXT.t); X.closePath(); }, 0.45);

const RN = 18;

function ropeReset(x0, y0, x1, y1) {
  for (let i = 0; i < RN; i++) {
    const t = i / (RN - 1);
    RP.x[i] = RP.px[i] = lerp(x0, x1, t) + Math.sin(t * 6) * 2;
    RP.y[i] = RP.py[i] = lerp(y0, y1, t);
  }
}
function ropeStep(h) {
  const g = 1300 * h * h, rest = Math.max(0.5, ropeLen / (RN - 1));
  for (let i = 1; i < RN; i++) {
    const vx = (RP.x[i] - RP.px[i]) * 0.986, vy = (RP.y[i] - RP.py[i]) * 0.986;
    RP.px[i] = RP.x[i]; RP.py[i] = RP.y[i];
    RP.x[i] += vx + Math.sin(G.t * 2.3 + i * 0.7) * ropeWind * h; RP.y[i] += vy + g;
  }
  RP.x[0] = ropeA.x; RP.y[0] = ropeA.y;
  for (let it = 0; it < 12; it++) {
    for (let i = 0; i < RN - 1; i++) {
      const dx = RP.x[i + 1] - RP.x[i], dy = RP.y[i + 1] - RP.y[i];
      const d = Math.sqrt(dx * dx + dy * dy) || 0.001, diff = (d - rest) / d;
      let wa = i === 0 ? 0 : 1, wb = (i + 1 === RN - 1) ? 1 / ropeEndW : 1;
      if (ropeB && i + 1 === RN - 1) wb = 0;
      if (ropeMid && ropeMid.i === i) wa = 0;
      if (ropeMid && ropeMid.i === i + 1) wb = 0;
      const s = wa + wb; if (s === 0) continue;
      RP.x[i] += dx * diff * wa / s; RP.y[i] += dy * diff * wa / s;
      RP.x[i + 1] -= dx * diff * wb / s; RP.y[i + 1] -= dy * diff * wb / s;
    }
    if (ropeB) { RP.x[RN - 1] = ropeB.x; RP.y[RN - 1] = ropeB.y; }

}
function swingHold() {
  const sw = cat.sw;
  return { x: R.x + Math.sin(sw.th) * sw.L, y: 132 + Math.cos(sw.th) * sw.L };
}
function aSwing() {
  return {
    kind: 'swing', intr: false,
    init() { cat.sup = { t: 'swing' }; this.since = G.t; },

  if (!fav || r.score >= 2 || r.score >= fav.score * 0.5) G.fav[ph] = { snap: r.snap, taps: r.taps.slice(), style: r.style, score: r.score };
  setAct(aPose('bow', 1.3));
  cat.queue = [aCall(() => { G.mb.ready = 1; G.mb.readyT = G.t; cat.lookAt = { x: MBOX.x, y: MBOX.y }; cat.lookT = 3.5; SND.mbox([7, 9, 11]); })];
}
function startEncore() {
  const ph = G.phase === 'ball' ? 'ball' : 'indoor', fav = G.fav[ph];
  G.lastInputT = G.t;
  if (!fav || G.curtain.dir !== 0 || G.finale || (G.phase !== 'indoor' && G.phase !== 'ball')) { G.mb.wig = 1; SND.tiny(); return; }
  G.mb.ready = 0; G.mb.play = 1; SND.mbox([4, 7, 9, 7, 11, 9]); G.rec = null;
  for (let k = 0; k < 5; k++) note(MBOX.x + rand(-10, 10), MBOX.y - 20, 'gold');
  closeCurtain(() => { restore(fav.snap); G.style = fav.style; G.replay = { taps: fav.taps, i: 0, t0: G.t + 0.95, done: 0 }; });
}
function updReplay() {
  const r = G.replay;
  if (!r || G.curtain.dir === 1) return;
  while (r.i < r.taps.length && G.t - r.t0 >= r.taps[r.i].dt) {
    const tp = r.taps[r.i++], I = INST[tp.i];
    for (let k = 0; k < 3; k++) note(lerp(MBOX.x, I.x, k / 3), lerp(MBOX.y - 20, I.y - 60, k / 3), 'gold');
    play(tp.i, true);
  }
  if (r.i >= r.taps.length) {
    if (!r.done) r.done = G.t;
    if (G.t - r.done > 2.5 && catRestful() && cat.sup.t !== 'bridge') {
      G.replay = null; G.mb.play = 0;
      setAct(aPose('bow', 1.4));
      cat.queue = [aCall(() => { G.mb.ready = 1; G.mb.readyT = G.t; cat.lookAt = { x: MBOX.x, y: MBOX.y }; cat.lookT = 3; })];

    }

/* ============================================================
   言葉のない誘導（次に触るものはいつも一つ）
   ============================================================ */
function recommend() {
  const base = recommendBase();
  if ((G.hintMiss || 0) < 3) return base;
  const alt = ['xylo', 'bell', 'drum'].filter(k => k !== base);
  return alt[((G.hintMiss - 3) >> 1) % 2];
}
function recommendBase() {
  const f = G.found;
  if (G.phase === 'ball') {
    if (!B.lampT) return 'bell';
    if (!f.d6b) return 'xylo';
    if (!f.whirl) return 'drum';
    if (!f.orbit) return (cat.sup.t === 'rstair' && cat.sup.k >= 5) ? 'bell' : 'xylo';
    return ['drum', 'xylo', 'bell'][((G.t / 8) | 0) % 3];
  }
  if (!G.anyTap) return 'drum';
  if (cat.sup.t === 'swing') return f.d4b ? (ST.n >= 2 ? 'xylo' : 'bell') : 'drum';
  if (R.mode === 'bridge') return f.d2b ? 'bell' : 'drum';
  if (R.mode === 'tiedProp') return f.propbat ? 'bell' : 'drum';
  const under = R.mode === 'hanging' && cat.sup.t === 'floor' && Math.abs(cat.x - R.x) < 150;
  if (R.mode === 'hanging') { if (!f.d4 && under) return 'bell'; if (!f.d2) return 'xylo'; if (!f.d4) return 'bell'; }
  if (!f.d1) return 'drum';
  if (!f.d4 && R.mode === 'rolled') return 'bell';
  if (G.t - G.lastRollT < 12 && !f.d3b) return 'bell';
  if (!f.d3) return G.lastInst === 'xylo' ? 'drum' : 'xylo';
  if (mice.some(m => m.st === 'joined') && !f.d5b) return 'drum';
  if (ST.n < 5 || !DOOR.to) return 'xylo';
  if (!f.d2 || !f.d4) return R.mode === 'rolled' ? 'bell' : (!f.d2 ? 'xylo' : 'bell');
  return 'xylo';
}
function updHint(dt) {
  const idle = G.t - G.lastInputT;
  let tg = recommend();
  if (G.mb.ready > 0 && G.t - G.mb.readyT < 9) tg = 'mbox';
  const quiet = !!(G.replay || G.curtain.dir !== 0 || G.finale || G.phase === 'toBall');
  const str = quiet ? 0 : (!G.anyTap ? (idle > 3 ? 1 : 0.6) : (idle > 4 ? clamp((idle - 4) / 2.5, 0.25, 1) : 0.22));
  G.hint.target = tg; G.hint.str = appr(G.hint.str, str, 3, dt);
  for (const k of ['drum', 'xylo', 'bell']) IA[k].bob = (k === tg) ? Math.abs(Math.sin(G.t * 4.2)) * 8 * G.hint.str : appr(IA[k].bob, 0, 6, dt);
  const h = G.hand;
  if (h.t >= 0) { h.t += dt; if (h.t > 2.6) h.t = -1; }
  else if (!quiet) {
    if (!G.anyTap && idle > 4.2 && (!h.shown0 || idle - h.last0 > 10)) { h.shown0 = true; h.last0 = idle; h.t = 0; h.target = tg; }
    else if (G.anyTap && idle > 18 && !h.shownIdle) { h.shownIdle = true; h.t = 0; h.target = tg; }
  }
}
function updInst(dt) {
  const d = IA.drum;
  d.dv += (-(d.dent - 0.3) * 260 - 10 * d.dv) * dt; d.dent += d.dv * dt;
  d.sq = appr(d.sq, 0, 8, dt); d.wig = appr(d.wig, 0, 5, dt);
  const x = IA.xylo;
  for (let i = 0; i < 6; i++) {
    if (x.d[i] > 0) { x.d[i] -= dt; if (x.d[i] <= 0) { x.d[i] = 0; x.v[i] = 1; } }
    else x.v[i] *= Math.exp(-4 * dt);
  }
  x.wig = appr(x.wig, 0, 5, dt);
  const b = IA.bell;
  b.av += (-b.ang * 60 - 2.2 * b.av) * dt; b.ang += b.av * dt;
  b.cv += (-(b.clap + b.ang * 1.6) * 90 - 4 * b.cv) * dt; b.clap += b.cv * dt;
  b.wig = appr(b.wig, 0, 5, dt);
  const m = G.mb;
  m.lid = appr(m.lid, (m.play || m.ready > 0) ? 0.55 : 0, 4, dt);
  m.wig = appr(m.wig, 0, 5, dt);
  if (m.ready > 0 && G.t - m.readyT > 25) m.ready = 0;
  if (m.play && Math.random() < dt * 3) note(MBOX.x + rand(-12, 12), MBOX.y - 24, 'gold');
}

/* ============================================================
   サイクル（毎回少しずつ違う舞台）
   ============================================================ */
function newCycle(first) {
  if (!first) G.cycle++;
  setRegistration();
  const cols = ['red', 'teal', 'pink', 'plum'].filter(c => c !== G.ribbonCol);
  G.ribbonCol = pick(cols);
  G.stepCols = STEP_COLS.map((c, i) => i % 3 === (G.cycle % 3) ? pick(['red', 'teal', 'yellow', 'pink']) : c);
  makeProps();
  const qs = ['shy', 'bouncy', 'spinny'].sort(() => Math.random() - 0.5);
  mice.length = 0;
  mice.push(makeMouse(0, 'curtain', qs[0], pick(['yellow', 'pink', 'teal'])));
  mice.push(makeMouse(1, 'door', qs[1], pick(['yellow', 'pink', 'teal'])));
  G.found = {}; G.phase = 'indoor'; G.trans = 0; G.tt = 0;
  ROOF.o = 0; ROOF.to = 0; ROOF.peek = 0; ROOF.pv = 0;
  ST.n = 2;
  for (let i = 0; i < STEP_MAX; i++) { ST.grow[i] = i < 2 ? 1 : 0; ST.jig[i] = 0; ST.jv[i] = 0; }
  ST.bounce = ST.bv = ST.ghost = ST.gv = 0;
  DOOR.o = DOOR.to = 0;
  R.mode = 'rolled'; R.x = R.tx = rand(168, 236); R.len = 0; R.lenT = 0; R.coil = 1; R.prop = -1; R.tie = -1;
  ropeB = null; ropeMid = null;
  SP.A = SP.V = 0; SP.charge = 0; SP.pending = 0;
  B.ang = 0; B.om = 0.3; B.L = 0; B.Lt = 0; B.lampT = 0; B.lamp = 0; B.bounce = B.bv = 0; B.orbit = 0;
  for (let k = 0; k < 12; k++) B.grow[k] = 0;
  cat.act = null; cat.queue.length = 0; cat.sup = { t: 'floor' }; cat.x = 262; cat.y = FLOOR;
  cat.spin = 0; cat.rot = 0; cat.anchor = -30; cat.ground = 1; cat.sw = null; cat.idleT = 0; cat.climbNow = false;
  G.catPref = Math.random(); G.style = (Math.random() * 4) | 0;
  G.finale = null; G.ballSucc = 0; G.rec = null; G.replay = null; G.lastRollT = -99; G.roofCool = 0; G.lampAt = 0;
  G.lastInputT = G.t;
  if (!first) {
    buildBackgrounds();
    if (G.fav.indoor) { G.mb.ready = 1; G.mb.readyT = G.t; cat.lookAt = { x: MBOX.x, y: MBOX.y }; cat.lookT = 3; }
  }
}

/* ============================================================
   更新と描画
   ============================================================ */
function update(dt) {
  G.t += dt;
  SP.V += (-300 * SP.A - 11 * SP.V) * dt; SP.A += SP.V * dt;
  for (let i = 0; i < STEP_MAX; i++) {
    ST.grow[i] = i < ST.n ? Math.min(1, ST.grow[i] + dt * 2.4) : Math.max(0, ST.grow[i] - dt * 3);
    ST.jv[i] += (-420 * ST.jig[i] - 12 * ST.jv[i]) * dt; ST.jig[i] += ST.jv[i] * dt;
  }
  ST.bv += (-150 * ST.bounce - 5 * ST.bv) * dt; ST.bounce += ST.bv * dt;
  ST.gv += (-70 * ST.ghost - 6 * ST.gv) * dt; ST.ghost += ST.gv * dt;
  if (ST.ghost < 0) { ST.ghost = 0; if (ST.gv < 0) ST.gv = 0; }
  DOOR.o = appr(DOOR.o, DOOR.to, 4, dt); DOOR.rattle = appr(DOOR.rattle, 0, 3, dt); DOOR.glint = appr(DOOR.glint, 0, 1.5, dt);
  if (ST.n >= 5 && !DOOR.to && Math.random() < dt * 0.25) DOOR.glint = 1;
  ROOF.pv += (-90 * ROOF.peek - 7 * ROOF.pv) * dt; ROOF.peek += ROOF.pv * dt;
  G.curtainV += (-40 * G.curtainSway - 4 * G.curtainV) * dt; G.curtainSway += G.curtainV * dt;
  updProps(dt);
  catUpdate(dt);
  updRibbon(dt);
  for (const m of mices()) updMouse(m, dt);
  updBall(dt);
  updTransform(dt);
  updFinale(dt);
  updCurtain(dt);
  updReplay();
  updAct();
  if (G.phase === 'ball' && !G.finale && G.found.d6 && G.ballSucc >= 40 && ['d6b', 'whirl', 'orbit', 'star', 'sweep', 'shadowhop'].filter(k => G.found[k]).length >= 5 && G.t - G.lastInputT > 2.5 && catRestful() && G.curtain.dir === 0 && !G.replay) startFinale();
  updHint(dt);
  updInst(dt);
  updParticles(dt);
}
function mices() { return mice.slice(); }
function render() {
  X = ctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const tr = G.trans;
  if (tr < 0.999) ctx.drawImage(bgIndoor, 0, 0);
  if (tr > 0.001) { ctx.globalAlpha = tr; ctx.drawImage(bgBall, 0, 0); ctx.globalAlpha = 1; }
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * S * BX, DPR * S * BY);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ia = 1 - tr;
  if (ia > 0.001) {
    ctx.globalAlpha = ia;
    drawDoor();
    for (const m of mice) if (m.home === 'door' && m.st === 'hidden' && DOOR.o > 0.05) {
      ctx.save(); bp(); pr(576, stepTop(4).y - 60, 24, 60); ctx.clip(); drawMouse(m); ctx.restore();
    }
    drawSpool(); drawPeg(); drawStairs();
    if (R.mode !== 'rolled' && R.mode !== 'ball') drawRibbon(G.ribbonCol, 7, ia);
    drawDeck();
    for (const m of mice) if (m.home === 'curtain' && (m.st === 'hidden' || m.st === 'peek') && !m.hop) drawMouse(m);
    drawInnerCurtain();
    drawProps();
    ctx.globalAlpha = 1;
  }
  drawRoof();
  if (tr > 0.001) {
    ctx.globalAlpha = tr;
    drawDisc();
    const hx = cat.headX, hy = cat.headY;
    drawShadows();
    cat.headX = hx; cat.headY = hy;
    drawRStair(); drawLamp();
    ctx.globalAlpha = 1;
  }
  const chars = [];
  for (const m of mice) {
    if (m.hop || m.st === 'come' || m.st === 'joined' || m.st === 'disc' || m.st === 'skydrop') chars.push(m);
    else if (m.home === 'door' && m.st === 'peek') chars.push(m);
  }
  chars.push(cat);
  chars.sort((a, b) => a.y - b.y);
  for (const c of chars) { if (c === cat) drawCat(cat); else drawMouse(c); }
  if (G.audienceT >= 0) drawAudience();
  drawMBox();
  drawInstruments();
  drawParticles();
  drawHand();
  drawFrontCurtain();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.6;
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   入力（Pointer Events・マルチタッチ）
   ============================================================ */
function firstNudge() {
  if (cat.sup.t === 'floor' && catFree()) setAct(aJump({ to: () => ({ x: cat.x, y: floorY(cat.x) }), sup: { t: 'floor' }, ph: 40, dur: 0.42, pose: 'star', crouch: 0.03 }));
  cat.lookAt = { x: INST.drum.x, y: INST.drum.y }; cat.lookT = 2;
  IA.drum.wig = 1; SND.mew();
  G.hand.t = 0; G.hand.target = 'drum';
}
function bgTap(p) {
  ring(p.x, p.y, 6, 'navy', 0.5, 70); SND.tiny();
  if (G.phase === 'indoor' && p.x < 72 && p.y > 100 && p.y < 580) { G.curtainV += 3; }
  for (const pr0 of props) if (!pr0.tied && Math.hypot(p.x - pr0.x, p.y - propY(pr0)) < 34) { pr0.hv = 120; pr0.wig = 1; }
  for (const m of mice) if (Math.hypot(p.x - m.x, p.y - (m.y - 18)) < 34 && !m.jump && !m.hop && (m.st === 'joined' || m.st === 'disc')) { m.jump = { t: 0, h: 20, dur: 0.3, spin: 0 }; SND.squeak(); }
  if (!DOOR.to && G.phase === 'indoor' && p.x > 560 && Math.abs(p.y - (stepTop(4).y - 30)) < 40) DOOR.rattle = 1;
  if (Math.hypot(p.x - cat.x, p.y - (cat.y - 45)) < 56) {
    SND.mew(); cat.blink = 0.25; cat.mood = 1;
    if (catFree() && ['floor', 'step', 'disc', 'rstair'].includes(cat.sup.t)) { setAct(aPose('releve', 0.6)); cat.queue = [aPose('clap', 0.5)]; }
  }
}
function tap(p) {
  const hit = (I) => { const dx = p.x - I.x, dy = (p.y - I.y + 8) / 0.95; return dx * dx + dy * dy < I.r * I.r; };
  for (const k of ['drum', 'xylo', 'bell']) if (hit(INST[k])) { play(k, false); return; }
  if (Math.hypot(p.x - MBOX.x, p.y - MBOX.y) < MBOX.r) {
    if (!G.firstTapDone) { G.firstTapDone = true; firstNudge(); }
    startEncore(); return;
  }
  if (!G.firstTapDone) { G.firstTapDone = true; firstNudge(); }
  bgTap(p);
}
const ptrs = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioStart();
  const p = toBox(e.clientX, e.clientY);
  ptrs.set(e.pointerId, p);
  G.finger = { x: p.x, y: p.y, t: G.t };
  tap(p);
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = toBox(e.clientX, e.clientY);
  ptrs.set(e.pointerId, p); G.finger = { x: p.x, y: p.y, t: G.t };
}, { passive: true });
const endPtr = e => { ptrs.delete(e.pointerId); };
cv.addEventListener('pointerup', e => { endPtr(e); audioStart(); });
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', endPtr);
const stop = e => { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchstart', stop, { passive: false });
document.addEventListener('touchmove', stop, { passive: false });
document.addEventListener('touchend', e => { stop(e); audioStart(); }, { passive: false });
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });
document.addEventListener('dblclick', stop, { passive: false });
document.addEventListener('contextmenu', stop);
document.addEventListener('selectstart', stop);
document.addEventListener('wheel', stop, { passive: false });

/* ============================================================
   ループ（requestAnimationFrame のみ・非表示で停止）
   ============================================================ */
const ERR = [];
let last = performance.now(), running = true, raf = 0, speed = 1, relayoutT = 0;
function frame(now) {
  raf = 0;
  if (!running) return;
  let dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  try {
    if (relayoutT && now >= relayoutT) { relayoutT = 0; layout(); }
    const sp = Math.max(1, speed | 0);
    for (let i = 0; i < sp; i++) update(dt);
    render();
  } catch (err) {
    if (ERR.length < 20) ERR.push(String(err && err.stack || err));
  }
  raf = requestAnimationFrame(frame);
}
function requestRelayout() { relayoutT = performance.now() + 120; if (!raf && running) raf = requestAnimationFrame(frame); }
window.addEventListener('resize', requestRelayout);
window.addEventListener('orientationchange', requestRelayout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', requestRelayout);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    try { if (AU.c && AU.c.state === 'running') { const pr2 = AU.c.suspend(); if (pr2 && pr2.catch) pr2.catch(() => { }); } } catch (e) { /* 無視 */ }
  } else {
    running = true; last = performance.now();
    try { if (AU.c) { const pr2 = AU.c.resume(); if (pr2 && pr2.catch) pr2.catch(() => { }); } } catch (e) { /* 無視 */ }
    if (!raf) raf = requestAnimationFrame(frame);
  }
});
window.addEventListener('pageshow', () => { if (!document.hidden && !raf) { running = true; last = performance.now(); raf = requestAnimationFrame(frame); } });

/* 検証用の窓口（画面には何も表示しない） */
window.__kb = {
  G, ST, R, B, SP, DOOR, ROOF, cat, mice, props, INST, MBOX, ERR,
  get speed() { return speed; }, set speed(v) { speed = v; },
  tapBox(x, y) { const p = { x, y }; G.finger = { x, y, t: G.t }; tap(p); },
  toScreen(x, y) { return { x: (x + BX) * S, y: (y + BY) * S }; },
  play(k) { play(k, false); },
  snapshot, P,
  info() { return { phase: G.phase, n: ST.n, door: DOOR.to, ribbon: R.mode, cat: cat.sup.t + (cat.sup.i != null ? cat.sup.i : '') + (cat.sup.k != null ? cat.sup.k : ''), act: cat.act ? cat.act.kind : null, mice: mice.map(m => m.st), found: Object.keys(G.found), fav: !!G.fav.indoor, favBall: !!G.fav.ball, mb: G.mb.ready, cycle: G.cycle, particles: P.length, lamp: B.lampT, L: B.Lt, ballSucc: G.ballSucc, hint: G.hint.target }; }
};
window.__kbLog = [];

layout();
newCycle(true);
raf = requestAnimationFrame(frame);
})();
