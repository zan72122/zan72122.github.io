<script>
(()=>{
'use strict';
/* =========================================================
   こねこのお城、落としもの変身すごろく
   立体しかけ絵本調 / 単一ファイル / 文字なしUI
   ========================================================= */
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search);
const SPEED=Math.max(0.25,Math.min(30,+Q.get('speed')||1));

/* ---------- util ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const easeIn=t=>{t=clamp(t,0,1);return t*t;};
const backOut=t=>{t=clamp(t,0,1);const c=1.8;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const springS=s=>s<=0?0:1-Math.exp(-5*s)*Math.cos(13*s); /* s: seconds */
const wob=s=>s<=0||s>1.2?0:Math.exp(-4*s)*Math.sin(s*22);
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rand=mulberry((+Q.get('seed'))||((Date.now()^(Math.random()*1e9))&0x7fffffff));
const RN=(a,b)=>a+(b-a)*rand();
const pick=a=>a[(rand()*a.length)|0];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(rand()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const _sh={};
function shade(hex,amt){const k=hex+amt;if(_sh[k])return _sh[k];const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt;}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  return _sh[k]=`rgb(${r|0},${g|0},${b|0})`;}

/* ---------- time / tasks ---------- */
let gt=0;               /* game time (ms) - stops while hidden */
const timers=[];
function wait(ms){return new Promise(r=>timers.push({t:gt+ms,r}));}
function runTimers(){for(let i=timers.length-1;i>=0;i--){if(gt>=timers[i].t){const r=timers[i].r;timers.splice(i,1);r();}}}
const since=t=>(gt-t)/1000;

/* ---------- screen / layout ---------- */
let W=1,H=1,DPR=1;const SAFE={t:0,r:0,b:0,l:0};
let BW=1000,BH=1000;const L={};const V={s:1,x:0,y:0};
const safeEl=document.getElementById('safe');
function readSafe(){const cs=getComputedStyle(safeEl);SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}
function layout(){
  const l=SAFE.l+8,r=W-SAFE.r-8,t=SAFE.t+8,b=H-SAFE.b-8;
  L.land=(r-l)>(b-t)*1.05;
  if(L.land){
    const pw=clamp((r-l)*0.25,220,340);
    L.ui={x:r-pw,y:t,w:pw,h:b-t};
    L.board={x:l,y:t,w:r-l-pw-6,h:b-t};
    const dsz=Math.min(pw*0.52,(b-t)*0.3,190);
    L.dice={x:L.ui.x+pw/2,y:t+(b-t)*0.25,s:dsz};
    const top=t+(b-t)*0.47,ah=(b-t)*0.53-6;
    const cell=Math.min((pw-44)/2,ah/2-10,150);
    L.tray={x:L.ui.x+pw/2-cell,y:top+(ah-cell*2)/2,w:cell*2,h:cell*2};
    L.cell=cell;
  }else{
    const uh=clamp((b-t)*0.29,196,330);
    L.ui={x:l,y:b-uh,w:r-l,h:uh};
    L.board={x:l,y:t,w:r-l,h:b-t-uh-4};
    const dsz=Math.min(uh*0.66,(r-l)*0.34,190);
    L.dice={x:r-dsz*0.78-6,y:L.ui.y+uh*0.52,s:dsz};
    const aw=(L.dice.x-dsz*0.82)-l-24;
    const cell=Math.min(aw/2,(uh-36)/2,150);
    L.tray={x:l+16+(aw-cell*2)/2,y:L.ui.y+(uh-cell*2)/2,w:cell*2,h:cell*2};
    L.cell=cell;
  }
  L.slots=[];
  for(let i=0;i<4;i++){const cx=L.tray.x+L.cell*(i%2+0.5),cy=L.tray.y+L.cell*((i/2|0)+0.5);L.slots.push({x:cx,y:cy,r:L.cell*0.46});}
  const a=clamp(L.board.w/L.board.h,0.7,1.5);
  BW=1000*Math.max(1,a);BH=1000*Math.max(1,1/a);
  L.cover={x:L.board.x+6,y:L.board.y+4,w:Math.max(46,Math.min(70,L.board.w*0.11))};
  L.cover.h=L.cover.w*1.25;
}
function computeView(){
  const e=S.avE;
  const ext=0.085*e;
  const top=0.1*BH;const vw=BW*(1+2*ext),vh=BH*(1+0.03*e)+top;
  const B=L.board;const sc=Math.min(B.w/vw,B.h/vh);
  V.s=sc;V.x=B.x+B.w/2-(BW/2)*sc;V.y=B.y+B.h/2-(BH/2)*sc+top*sc*0.5;
  if(S.trT>0){const k=since(S.trT);if(k<3.6){const sh=Math.sin(k*40)*Math.max(0,0.6-k)*5;V.x+=sh;}}
}
const toWorld=(px,py)=>[(px-V.x)/V.s,(py-V.y)/V.s];
const toScreen=(wx,wy)=>[V.x+wx*V.s,V.y+wy*V.s];

/* ---------- audio (Web Audio synth) ---------- */
const AU={c:null,m:null,live:0,noiseBuf:null,started:false};
function audioStart(){
  try{
    if(!AU.c){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      AU.c=new AC();AU.m=AU.c.createGain();AU.m.gain.value=0.55;
      const comp=AU.c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
      AU.m.connect(comp);comp.connect(AU.c.destination);
      const len=AU.c.sampleRate*0.6;AU.noiseBuf=AU.c.createBuffer(1,len,AU.c.sampleRate);
      const d=AU.noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(AU.c.state!=='running')AU.c.resume();
    AU.started=true;
  }catch(e){}
}
function tone(f,dur,o={}){
  if(!AU.c||AU.c.state!=='running'||AU.live>18)return;
  const c=AU.c,t=c.currentTime+(o.when||0);
  const os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(30,o.to),t+(o.slide||dur));
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vibF||9;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.05);}
  const v=(o.vol||0.18);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let out=g;
  if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);out=fl;}
  os.connect(g);out.connect(AU.m);
  AU.live++;os.onended=()=>{AU.live--;};
  os.start(t);os.stop(t+dur+0.03);
}
function noise(dur,o={}){
  if(!AU.c||AU.c.state!=='running'||AU.live>18)return;
  const c=AU.c,t=c.currentTime+(o.when||0);
  const s=c.createBufferSource();s.buffer=AU.noiseBuf;
  const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1500,t);f.Q.value=o.q||1.2;
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||0.12,t+(o.att||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.m);AU.live++;s.onended=()=>{AU.live--;};
  s.start(t,Math.random()*0.2);s.stop(t+dur+0.02);
}
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093];
const note=i=>SCALE[clamp(i|0,0,SCALE.length-1)];
const SFX={
  xylo(i,vol=0.16,when=0){const f=note(i);tone(f,0.42,{type:'triangle',vol,when});tone(f*4,0.07,{vol:vol*0.35,when});},
  tick(){tone(1400,0.05,{type:'square',vol:0.03,lp:2400});},
  pop(){tone(900,0.14,{to:300,vol:0.14});noise(0.05,{f:2500,vol:0.05});},
  hop(){tone(500,0.12,{to:900,type:'triangle',vol:0.1});},
  paper(){noise(0.09,{f:3200,q:0.8,vol:0.07});},
  diceTap(){noise(0.05,{f:1800,vol:0.12});tone(320,0.12,{to:520,type:'triangle',vol:0.12});},
  diceTumble(k){noise(0.04,{f:1200+k*260,vol:0.08});tone(500+k*90,0.06,{type:'triangle',vol:0.07});},
  diceLand(){noise(0.08,{f:900,vol:0.14});tone(784,0.2,{type:'triangle',vol:0.12});tone(1175,0.25,{type:'sine',vol:0.08,when:0.06});},
  open(){noise(0.18,{f:900,to:2600,vol:0.07});tone(400,0.16,{to:700,type:'triangle',vol:0.08});},
  plop(){tone(700,0.22,{to:140,vol:0.2});noise(0.06,{f:500,vol:0.08,when:0.02});},
  boing(){tone(220,0.75,{to:620,slide:0.55,type:'triangle',vib:28,vibF:11,vol:0.13});},
  bubbles(){for(let i=0;i<8;i++)tone(380+i*70+Math.random()*60,0.09,{to:900+i*80,vol:0.08,when:i*0.13});},
  clatter(){for(let i=0;i<14;i++){noise(0.03,{f:2600+(i%3)*500,vol:0.07,when:i*0.085});}for(let i=0;i<4;i++)tone(660+i*110,0.07,{type:'square',lp:1800,vol:0.03,when:i*0.3});},
  wrap(){for(let i=0;i<4;i++)noise(0.12,{f:3000,q:0.6,vol:0.06,when:i*0.22});tone(880,0.3,{type:'triangle',vol:0.08,when:0.9});},
  splash(){for(let i=0;i<6;i++)tone(600+Math.random()*500,0.08,{to:1400,vol:0.06,when:i*0.12});noise(0.3,{f:800,q:0.5,vol:0.06});},
  stamp(){noise(0.1,{f:400,vol:0.18});tone(1568,0.6,{vol:0.07,when:0.1});tone(2093,0.6,{vol:0.05,when:0.18});},
  success(){[0,2,4,7].forEach((n,i)=>SFX.xylo(n+2,0.15,i*0.09));tone(2093,0.5,{vol:0.05,when:0.4});tone(2637,0.5,{vol:0.04,when:0.48});},
  again(){SFX.xylo(4,0.12);SFX.xylo(7,0.1,0.08);},
  trumpet(){[0,0.18,0.36].forEach((w,i)=>tone([523,659,784][i],0.26,{type:'sawtooth',lp:1600,vol:0.07,when:w,vib:6}));tone(1046,0.5,{type:'sawtooth',lp:1800,vol:0.07,when:0.56,vib:8});},
  meow(){tone(620,0.3,{to:880,slide:0.12,type:'triangle',vol:0.09});tone(880,0.25,{to:560,type:'triangle',vol:0.08,when:0.12});},
  purr(){for(let i=0;i<6;i++)tone(70,0.1,{type:'sawtooth',lp:300,vol:0.08,when:i*0.11});},
  squeak(){tone(1200,0.12,{to:1800,vol:0.07});tone(1800,0.1,{to:1300,vol:0.06,when:0.1});},
  horn(){tone(392,0.25,{type:'square',lp:900,vol:0.06});tone(523,0.3,{type:'square',lp:900,vol:0.06,when:0.22});},
  wind(){noise(1.0,{f:500,to:1600,q:0.4,vol:0.07,att:0.25});},
  rise(){for(let i=0;i<8;i++)SFX.xylo(i+1,0.09,i*0.08);},
  wiggle(){tone(300,0.08,{type:'triangle',vol:0.05});tone(260,0.08,{type:'triangle',vol:0.04,when:0.07});},
  clank(){noise(0.06,{f:2200,vol:0.12});tone(1320,0.2,{type:'square',lp:2600,vol:0.04});},
  page(){noise(0.5,{f:900,to:3200,q:0.5,vol:0.1,att:0.05});},
  sparkle(){tone(2093,0.3,{vol:0.05});tone(2637,0.3,{vol:0.04,when:0.07});tone(3136,0.35,{vol:0.03,when:0.14});},
  gold(){[7,9,10].forEach((n,i)=>SFX.xylo(n,0.1,i*0.07));SFX.sparkle();},
  munch(){for(let i=0;i<3;i++)noise(0.05,{f:1200,vol:0.07,when:i*0.13});tone(988,0.2,{type:'triangle',vol:0.07,when:0.4});},
  grand(){noise(1.6,{f:300,to:2400,q:0.4,vol:0.08,att:0.5});for(let i=0;i<10;i++)noise(0.05,{f:2800,vol:0.06,when:0.4+i*0.11});
    [[0,4,7],[2,5,9],[4,7,10]].forEach((ch,j)=>ch.forEach(n=>SFX.xylo(n,0.09,1.4+j*0.35)));},
  march(len){const mel=[4,5,7,5,4,2,4,7,8,7,5,4,2,4,5,4];for(let i=0;i<len;i++){SFX.xylo(mel[i%mel.length],0.07,i*0.22);if(i%2===0)noise(0.04,{f:200,vol:0.05,when:i*0.22});}},
};

/* ---------- world graph ---------- */
const NODES={
  A0:[.11,.85],A1:[.26,.90],A2:[.42,.90],H2:[.585,.855],A4:[.72,.76],A5:[.79,.62],H3:[.81,.455],
  A7:[.67,.325],A8:[.50,.30],A9:[.34,.325],A10:[.20,.40],H1:[.14,.565],A12:[.11,.715],
  M1:[.29,.585],GIFT:[.47,.585],M3:[.655,.575],
  D1:[.72,.935],W1:[.86,.935],TREAT:[.93,.785],W3:[.935,.62],
  S1:[.21,.20],S2:[.32,.10],S3:[.50,.05],SKY:[.68,.085],S5:[.82,.20],
  /* anchors */
  FLAGPOLE:[.315,.505],PENG:[.50,.775],PLATE:[.355,.765],MUSIC:[.64,.70],LONG:[.045,.50],
  CASTLE:[.50,.255],PRIN:[.50,.255],PAD:[.385,.255],CLOUD:[.50,.44],TABLE:[.50,.46]
};
const EDGES=[
  ['A0','A1','road'],['A1','A2','road'],['A2','H2','road'],['H2','A4','road'],['A4','A5','road'],['A5','H3','road'],
  ['H3','A7','road'],['A7','A8','road'],['A8','A9','road'],['A9','A10','road'],['A10','H1','road'],['H1','A12','road'],['A12','A0','road'],
  ['H1','M1','road'],['M3','H3','road'],
  ['M1','GIFT','bridge'],['GIFT','M3','bridge'],
  ['H2','D1','water'],['D1','W1','water'],['W1','TREAT','water'],['TREAT','W3','water'],['W3','H3','water'],
  ['A9','S1','sky'],['S1','S2','sky'],['S2','S3','sky'],['S3','SKY','sky'],['SKY','S5','sky'],['S5','A7','sky'],
  ['A4','TREAT','ramp']
];
const ADJ={};for(const k in NODES)ADJ[k]=[];
EDGES.forEach(([a,b,t])=>{ADJ[a].push({n:b,t});ADJ[b].push({n:a,t});});
const ROADNODES=['A0','A1','A2','H2','A4','A5','H3','A7','A8','A9','A10','H1','A12','M1','M3'];
const WATERN={D1:1,W1:1,TREAT:1,W3:1};
const SKYN={S1:1,S2:1,S3:1,SKY:1,S5:1};
const SPOTS=['H1','H2','H3','GIFT','TREAT','SKY'];
const MAIN=['roller','pump','gear'];
const ITEMS=['shoe','glove','pot','hanky'];
const RESULT={
  'shoe|roller':'bridge','hanky|roller':'flag','glove|pump':'balloon','pot|pump':'boat','shoe|gear':'wheels','glove|gear':'flower',
  'shoe|pump':'cushion','hanky|pump':'cloud','hanky|gear':'bow','pot|roller':'plate','pot|gear':'musicbox','glove|roller':'longhand'
};
const REQUIRED={'shoe|roller':1,'hanky|roller':1,'glove|pump':1,'pot|pump':1,'shoe|gear':1,'glove|gear':1};
const ICONABLE=['bridge','flag','balloon','boat','wheels','flower','flowercart','cushion','cloud','bow','plate','musicbox','longhand','star'];
const RANK=['flowercart','balloon','boat','bridge','flag','flower','wheels','musicbox','cushion','plate','cloud','longhand','bow'];

/* ---------- state ---------- */
let RUNN=0,S,K,CR,HOLE,PR,PG,DICE,FLY=[],PARTS=[],CATS=[],MEMBERS=[],MT={},PAL={};
const PALS=[
  {shoe:'#e8455d',glove:'#f59ac0',pot:'#c9d4e6',hanky:'#ffd6e4'},
  {shoe:'#f06a8a',glove:'#ffb3c7',pot:'#d7dbe8',hanky:'#fff0b8'},
  {shoe:'#d9455f',glove:'#c9a7f2',pot:'#cfe0e8',hanky:'#ffd9ea'}
];
function newRun(first){
  const perm=shuffle(MAIN.slice());
  MT={H1:perm[0],H2:perm[1],H3:perm[2],GIFT:'gift',TREAT:'treat',SKY:'sky'};
  PAL=pick(PALS);
  S={mode:'board',avT:0,avE:0,trT:0,opened:!!(S&&S.opened),openT:S?S.openT:-1e9,
    combos:{},used:{roller:0,pump:0,gear:0},visited:{},cartItem:null,busy:false,aim:null,aimT:-1e9,
    bridgeT:0,gateT:0,skyOpen:false,skyT:0,rampT:0,flagOnBridge:false,
    party:false,partyT:0,parades:0,gold:0,stars:0,rolls:0,lastDest:null,lastLead:null,
    lastInput:gt,hintDone:false,hint:null,fork:null,pageT:S?S.pageT:0,lastMade:null,lastMadeT:-1e9,
    lastTouch:null,lastTouchT:-1e9,show:null,trayOrder:shuffle(ITEMS.slice()),slotHide:{},slotPopT:{},
    wantRefill:null,cover:S?S.cover:null,firstRoll:true,buildT:0};
  K={node:pick(['A0','A0','A12','A1']),seg:null,face:'norm',faceT:0,hopT:0,bounceT:0,ride:null,seenBridge:false,lookT:0};
  CR={};
  HOLE={};SPOTS.forEach(s=>HOLE[s]={openT:-1e9,dropT:-1e9,work:null,boost:0,boostT:-1e9,tapN:0,popT:-1e9,wigT:-1e9,signT:-1e9});
  PR={nextCrown:gt+6000,blinkT:gt+1500,blink:0,begT:-1e9,crownT:-1e9,sparkT:-1e9,purrT:-1e9,gift:null,giftT:-1e9,munchT:-1e9,danceT:-1e9,lookAt:null,pawT:-1e9};
  PG={x:0,y:0,tx:null,peekT:-1e9,trumpetT:-1e9,bowT:-1e9,hopT:-1e9,munchT:-1e9,spot:null,init:false};
  DICE={rollT:-1e9,pressT:-1e9,landT:-1e9,wigT:-1e9,faces:['roller','pump','gear'],face:'roller',spin:0,badge:null,rolling:false};
  FLY=[];MEMBERS=[];CATS=[];
}
function P(n){const p=NODES[n];const e=S.avE;
  let u=p[0],v=p[1];
  if(e>0){const au=0.5+(u-0.5)*1.13,av=0.06+v*0.92;u=lerp(u,au,e);v=lerp(v,av,e);}
  return [u*BW,v*BH];}
const has=t=>!!CR[t];
function kindOf(spot){return MT[spot];}
function spotOfKind(k){for(const s of SPOTS)if(MT[s]===k)return s;return null;}
function edgeOpen(t){
  if(t==='road')return true;
  if(t==='bridge')return has('bridge')&&since(S.bridgeT)>0.9;

/* Dijkstra; allow(type)->cost factor or 0 */
function findPath(a,b,allow){
  if(a===b)return [a];

  const keys=Object.keys(ADJ);
  for(;;){
    let u=null,best=1e18;
    for(const k of keys){if(!done[k]&&d[k]!==undefined&&d[k]<best){best=d[k];u=k;}}
    if(u===null)return null;
    if(u===b)break;
    done[u]=1;
    for(const e of ADJ[u]){const f=allow(e.t,e.n,u);if(!f)continue;
      const nd=best+dist(NODES[u],NODES[e.n])*f+0.02;
      if(d[e.n]===undefined||nd<d[e.n]){d[e.n]=nd;prev[e.n]=u;}}
  }
  const path=[b];let c=b;while(c!==a){c=prev[c];path.unshift(c);}return path;
}
function edgeType(a,b){for(const e of ADJ[a])if(e.n===b)return e.t;return 'road';}

const MEMBER_HOME={boat:'D1',flowercart:'D1',wheels:'H3',balloon:'A9',princess:'A8',cushion:'A1',plate:'A2',musicbox:'A4',cloud:'A8'};
const ALLOW={
  boat:t=>t==='water'?1:0,
  flowercart:t=>t==='water'||t==='ramp'?0.6:(t==='road'||(t==='bridge'&&edgeOpen('bridge')))?1:0,
  balloon:t=>t==='sky'?0.5:1, cloud:t=>t==='sky'?0.5:1,
  wheels:t=>t==='road'||(t==='bridge'&&edgeOpen('bridge'))?1:0

const roadBridge=t=>t==='road'||(t==='bridge'&&edgeOpen('bridge'))?1:0;
function leaderWays(t){switch(t){
  case 'boat':return ['W3'];case 'flowercart':return ['TREAT','A4'];case 'balloon':return S.skyOpen?['SKY']:['A9'];
  case 'bridge':return ['GIFT'];case 'wheels':return ['H3'];case 'cushion':return ['A1'];case 'longhand':return ['H1'];
  default:return ['A8'];}}
function nearestReach(from,target,allow){const seen={[from]:1},q=[from];while(q.length){const u=q.shift();for(const e of ADJ[u]){if(!seen[e.n]&&allow(e.t)){seen[e.n]=1;q.push(e.n);}}}
  let best=from,bd=1e9;for(const n in seen){const d=dist(NODES[n],NODES[target]);if(d<bd){bd=d;best=n;}}return best;}
function routeVia(start,ways,end,allow){let nodes=[start],cur=start;
  for(const w of ways.concat(end?[end]:[])){const tgt=nearestReach(cur,w,allow);const p=findPath(cur,tgt,allow);if(p&&p.length>1){nodes=nodes.concat(p.slice(1));cur=tgt;}}
  return nodes;}
function timeline(nodes){const segs=[];let t=0;for(let i=1;i<nodes.length;i++){const a=nodes[i-1],b=nodes[i];const type=edgeType(a,b);const d=clamp(dist(P(a),P(b))*1.45,170,520);segs.push({a,b,type,t0:t,d});t+=d;}return {segs,total:t};}
function memberPos(m){const k=gt-m.t0;const tl=m.tl;if(k<=0||!tl.segs.length)return {p:P(m.nodes[0]),type:null};
  for(const s of tl.segs){if(k<s.t0+s.d){const u=(k-s.t0)/s.d,e=ease(u);const a=P(s.a),b=P(s.b);let y=lerp(a[1],b[1],e);

  const C=L.cover;if(x>=C.x-6&&x<=C.x+C.w+6&&y>=C.y-6&&y<=C.y+C.h+6){S.coverT=gt;SFX.sparkle();return;}
  if(Math.hypot(x-L.dice.x,y-L.dice.y)<L.dice.s*0.58){roll();return;}
  for(let i=0;i<4;i++){const sl=L.slots[i];if(Math.hypot(x-sl.x,y-sl.y)<sl.r*1.12){const id=S.trayOrder[i];
      if(S.cartItem===id){K.bounceT=gt;SFX.hop();return;}
      if(S.slotHide[id])return;
      if(DRAG)return;
      if(S.busy&&S.cartItem){sl.wigT=gt;SFX.wiggle();return;}
      DRAG={id,pid,x,y,sx:x,sy:y,moved:false};SFX.paper();sl.wigT=gt;return;}}
  if(inBoard(x,y)){const w=toWorld(x,y);worldTap(w[0],w[1]);}
}
function worldTap(wx,wy){
  if(S.fork){for(const o of S.fork.opts){const a=P(S.fork.at),b=P(o.next);if(Math.hypot(b[0]-wx,b[1]-wy)<95||Math.hypot(lerp(a[0],b[0],0.5)-wx,lerp(a[1],b[1],0.5)-wy)<70){resolveFork(o);return;}}}
  if(S.party&&since(S.partyT)>2&&wx>BW-150&&wy>BH-150){turnPage();return;}
  const kp=kittenPos();if(Math.hypot(kp[0]-wx,kp[1]-35-wy)<62){K.face='happy';K.faceT=gt+1200;K.waveT=gt+1200;K.bounceT=gt;SFX.meow();return;}
  const pp=prinPos();if(Math.abs(wx-pp[0])<55&&wy>pp[1]-165&&wy<pp[1]+12){PR.purrT=gt;SFX.purr();SFX.meow();if(CR.flower){PR.crownT=gt;}PR.sparkT=gt;return;}
  if(Math.abs(wx-PG.x)<45&&wy>PG.y-115&&wy<PG.y+10){PG.bowT=gt;SFX.xylo(3,0.1);SFX.xylo(5,0.1,0.12);return;}
  for(const c of CATS){if(Math.abs(wx-c.x)<40&&wy>c.y-100&&wy<c.y+8){c.happyT=gt;SFX.meow();return;}}
  let best=null,bd=1e9;
  for(const t in CR){const c=CR[t];if(c.merged||c.hidden||t==='flower'||t==='bow')continue;let q;
    if(t==='bridge'){let m=1e9;for(let i=0;i<=8;i++){const b=bridgePt(i/8);m=Math.min(m,Math.hypot(b[0]-wx,b[1]-wy));}if(m<48&&m<bd){bd=m;best=t;}continue;}
    if(carrierBusy(t))q=kittenPos();else q=crPos(t);const tp=t==='flag'?[q[0]+20,q[1]-80]:t==='balloon'?[q[0],q[1]-60]:t==='longhand'?[q[0],q[1]-40]:[q[0],q[1]-14];
    const d=Math.hypot(tp[0]-wx,tp[1]-wy);if(d<(t==='flag'?80:62)&&d<bd){bd=d;best=t;}}
  if(best){creationTap(best);return;}
  for(const s of SPOTS){const p=P(s);if(Math.hypot(p[0]-wx,p[1]-60-wy)<90||Math.hypot(p[0]-wx,p[1]-wy)<60){spotTap(s);return;}}
  const cp=P('CASTLE');if(Math.abs(wx-cp[0])<170&&wy<cp[1]&&wy>cp[1]-300){SFX.xylo(6,0.08);SFX.xylo(8,0.06,0.1);burst(...toScreen(wx,wy),5,'star',true,0.5);return;}
}
function spotTap(s){const h=HOLE[s];
  if(!spotOpen(s)){h.wigT=gt;SFX.wiggle();return;}
  h.boostT=gt;h.tapN++;SFX.xylo(h.tapN%10+(h.work?1:0),0.12);if(h.work)SFX.hop();
  const p=P(s);burst(p[0],p[1]-110,4+Math.min(h.tapN,8),h.work?'star':'conf');
  if(!S.busy){S.aim=s;S.aimT=gt;}
  PG.lookSpot=s;PG.lookT=gt;}
function creationTap(t){const c=CR[t];c.act=gt;const p=t==='bridge'?bridgePt(0.5):crPos(t);
  switch(t){case 'flag':SFX.wind();windGust(!!CR.balloon);if(CR.balloon)CR.balloon.act=gt+400;break;
    case 'balloon':SFX.squeak();break;case 'boat':case 'flowercart':SFX.horn();break;case 'wheels':SFX.clatter();break;
    case 'cushion':SFX.boing();break;case 'cloud':SFX.bubbles();for(let i=0;i<10;i++)addPart({x:p[0]+RN(-40,40),y:p[1],vx:RN(-10,10),vy:60,g:120,life:1.4,type:'petal',sz:6,rot:0,vr:3,screen:false});break;
    case 'plate':SFX.clank();break;case 'musicbox':playBox();break;case 'longhand':SFX.hop();SFX.clank();break;case 'bridge':SFX.sparkle();break;}
  burst(p[0],p[1]-40,6,'star');
  if(CR.flower&&!c.deco&&DECO_ORDER.includes(t)&&!c.merged)decorate(t);
  if(S.party)catsTo(p);
  PR.lookAt=t;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioStart();onFirst();PTR.x=e.clientX;PTR.y=e.clientY;PTR.t=gt;const w=toWorld(e.clientX,e.clientY);PTR.wx=w[0];PTR.wy=w[1];
  try{cv.setPointerCapture(e.pointerId);}catch(_){}down(e.pointerId,e.clientX,e.clientY);},{passive:false});
cv.addEventListener('pointermove',e=>{PTR.x=e.clientX;PTR.y=e.clientY;PTR.t=gt;const w=toWorld(e.clientX,e.clientY);PTR.wx=w[0];PTR.wy=w[1];
  if(DRAG&&DRAG.pid===e.pointerId){DRAG.x=e.clientX;DRAG.y=e.clientY;if(Math.hypot(DRAG.x-DRAG.sx,DRAG.y-DRAG.sy)>10)DRAG.moved=true;}});
function up(e,cancel){if(!DRAG||DRAG.pid!==e.pointerId)return;const d=DRAG;DRAG=null;
  if(cancel)return;
  if(!d.moved){selectItem(d.id);return;}
  if(inBoard(e.clientX,e.clientY)||Math.hypot(e.clientX-cartScreen()[0],e.clientY-cartScreen()[1])<90){selectItem(d.id,[e.clientX,e.clientY]);}
  else{const sl=slotOf(d.id);FLY.push({kind:'item',id:d.id,screen:true,from:[e.clientX,e.clientY],to:[sl.x,sl.y],t0:gt,dur:220,arc:20,s0:sl.r/60*1.1,s1:sl.r/60});S.slotHide[d.id]=1;wait(220).then(()=>{S.slotHide[d.id]=0;});}}
cv.addEventListener('pointerup',e=>up(e,false));
cv.addEventListener('pointercancel',e=>up(e,true));
cv.addEventListener('lostpointercapture',e=>{if(DRAG&&DRAG.pid===e.pointerId&&!DRAG.moved){}});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
function drawDrag(){if(!DRAG||!DRAG.moved)return;const sl=slotOf(DRAG.id);glowRing(DRAG.x,DRAG.y,sl.r*0.9);drawItem(DRAG.id,DRAG.x,DRAG.y,sl.r/60*1.15,Math.sin(gt/120)*0.1);}

/* ---------- update ---------- */
function update(dt){
  runTimers();
  S.avT=S.trT?ease(clamp((since(S.trT)-1.0)/1.8,0,1)):0;S.avE=S.avT;
  if(gt>PR.blinkT){PR.blink=1;if(gt>PR.blinkT+140){PR.blink=0;PR.blinkT=gt+1600+rand()*3400;}}
  if(!S.busy&&gt>PR.nextCrown){PR.nextCrown=gt+7000+rand()*6000;if(CR.flower||rand()<0.5)PR.crownT=gt;}
  /* penguin */
  const home=S.party?(()=>{const t=P('TABLE');return [t[0]+80,t[1]+20];})():P('PENG');
  let tx=home[0],ty=home[1];PG.peek=false;
  const sp=PG.spot||(PG.lookSpot&&since(PG.lookT)<3?PG.lookSpot:null);
  if(sp&&sp!=='SKY'){const p=P(sp);const side=p[0]>BW*0.5?-1:1;tx=p[0]+side*92;ty=p[1]+14;if(PG.peekOn&&PG.spot){PG.peek=true;PG.peekDir=-side;}}
  if(!PG.init){PG.x=tx;PG.y=ty;PG.init=true;}
  const dx=tx-PG.x,dy=ty-PG.y,d=Math.hypot(dx,dy);PG.walking=d>6;
  if(d>1){const v=Math.min(d,dt/1000*420);PG.x+=dx/d*v;PG.y+=dy/d*v;}
  if(MEMBERS.length)updateMembers();else if(K.ovr){K.ovr=null;}
  if(S.party)updateCats(dt);
  for(let i=FLY.length-1;i>=0;i--){if(gt>FLY[i].t0+FLY[i].dur)FLY.splice(i,1);}
  /* idle demonstration: wait 10s without input, show once with the cat's paw */
  if(!S.busy&&!S.hintDone&&!S.hint&&!DRAG&&S.mode!=='transform'&&gt-S.lastInput>10000){
    const ht=hintTarget();if(ht){S.hintDone=true;PR.pawT=gt;S.hint={t0:gt,target:()=>{const h=hintTarget();if(!h)return null;if(h.kind==='dice')return [L.dice.x,L.dice.y];const sl=slotOf(h.id);return [sl.x,sl.y];}};}}
}

/* ---------- render ---------- */
function draw(){
  computeView();
  ctx.setTransform(1,0,0,1,0,0);
  if(bgC)ctx.drawImage(bgC,0,0);
  ctx.setTransform(DPR*V.s,0,0,DPR*V.s,DPR*V.x,DPR*V.y);
  drawWorld();
  ctx.setTransform(DPR*V.s,0,0,DPR*V.s,DPR*V.x,DPR*V.y);
  drawCreaseGlow();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawCover();drawTray();drawDice();drawFlyScreen();drawDrag();drawParts(true);drawHintPaw();drawPageTurn();
}
const _cv=computeView;
computeView=function(){_cv();if(S.trT){const k=since(S.trT);if(k<2.6){const lift=Math.sin(clamp((k-0.3)/2.2,0,1)*Math.PI)*0.04;const cx=L.board.x+L.board.w/2,cy=L.board.y+L.board.h/2;V.x=cx+(V.x-cx)*(1+lift);V.y=cy+(V.y-cy)*(1+lift)-lift*40;V.s*=1+lift;}}};

/* ---------- loop / lifecycle ---------- */
let running=true,last=0,rafId=0,errCount=0;
function frame(t){
  if(!running)return;
  const dt=Math.min(50,last?t-last:16);last=t;
  try{gt+=dt*SPEED;update(dt*SPEED);draw();}
  catch(err){if(errCount++<3)console.warn(err);}
  rafId=requestAnimationFrame(frame);}
function pause(){running=false;cancelAnimationFrame(rafId);try{if(AU.c&&AU.c.state==='running')AU.c.suspend();}catch(_){}}
function resume(){if(running)return;running=true;last=0;try{if(AU.c&&AU.started)AU.c.resume();}catch(_){}rafId=requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
window.addEventListener('pagehide',pause);window.addEventListener('pageshow',()=>{if(!document.hidden)resume();});
let rzPending=false;
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  readSafe();layout();computeView();buildBg();buildSheet();PG.init=false;}
function queueResize(){if(rzPending)return;rzPending=true;requestAnimationFrame(()=>{rzPending=false;resize();});}
window.addEventListener('resize',queueResize);window.addEventListener('orientationchange',()=>{queueResize();setTimeout(queueResize,350);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',queueResize);

/* ---------- boot ---------- */
SAVED=loadSave();
newRun(true);S.cover=SAVED?SAVED.cover:null;PR.nextCrown=gt+6000;
resize();
rafId=requestAnimationFrame(frame);

/* test/inspection hook (no network, read-mostly) */
window.__kc={get S(){return S;},get K(){return K;},get CR(){return CR;},get MT(){return MT;},get V(){return V;},get L(){return L;},get MEMBERS(){return MEMBERS;},get CATS(){return CATS;},
  forceDest:null,saveState:()=>saveState,P,toScreen,spotOfKind,kittenPos,crPos,prinPos,get gt(){return gt;},get partsN(){return PARTS.length;},get audio(){return AU.c?AU.c.state:'none';}};
})();
</script>
