      var col = W.HOUSE_COL[i];
      var awake = hs.awake;
      var sinceWake = awake ? t - hs.wakeT : 99;
      var pop = awake && sinceWake < 0.8 ? Math.sin(sinceWake * Math.PI * 3) * Math.exp(-sinceWake * 4) * 0.12 : 0;
      var greet = hs.greetT >= 0 && t - hs.greetT < 0.7 ? Math.sin((t - hs.greetT) * 20) * 0.04 * (1 - (t - hs.greetT) / 0.7) : 0;
      var breath = awake ? 0 : Math.sin(tm * 1.4 + i * 1.3) * 0.02;
      var hop = celebrate && !awake ? Math.abs(Math.sin(tm * 4 + i)) * 0.02 : 0;
      ctx.save();
      ctx.translate(p.x, p.y + hh * 0.45);
      ctx.rotate(greet);
      ctx.scale(1 - pop * 0.5, 1 + breath + pop + hop);
      A.shadow(ctx, 0, 0, hw * 0.6, hw * 0.1);
      // 壁（積み木）
      A.block(ctx, -hw * 0.45, -hh * 0.62, hw * 0.9, hh * 0.62, hw * 0.08, col.wall, hw * 0.06, i + 1);
      // 屋根（三角の積み木）
      ctx.fillStyle = A.shade(col.roof, 0.28);
      ctx.beginPath(); ctx.moveTo(-hw * 0.55 + hw * 0.04, -hh * 0.6 + hw * 0.05); ctx.lineTo(hw * 0.04, -hh * 1.08 + hw * 0.05); ctx.lineTo(hw * 0.59, -hh * 0.6 + hw * 0.05); ctx.closePath(); ctx.fill();
      ctx.fillStyle = col.roof;
      ctx.beginPath(); ctx.moveTo(-hw * 0.55, -hh * 0.6); ctx.quadraticCurveTo(-hw * 0.1, -hh * 0.9, 0, -hh * 1.08); ctx.quadraticCurveTo(hw * 0.1, -hh * 0.9, hw * 0.55, -hh * 0.6); ctx.closePath(); ctx.fill();
      // 丸窓
      var wy = -hh * 0.4, wr = hw * 0.16;
      var open = awake ? smooth(sinceWake / 0.18) : 0; // タップ同フレームで開き始める
      A.disc(ctx, -hw * 0.2, wy, wr * 1.15, A.shade(col.wall, 0.18), wr * 0.1);
      if (open > 0) {
        A.glow(ctx, -hw * 0.2, wy, wr * 2.2, 0.7 * open);
        A.ellipseFill(ctx, -hw * 0.2, wy, wr, wr, PAL.goldLight);
      }
      // 閉じた窓板（眠っている：穏やかな寝息で少しふくらむ）
      if (open < 1) {
        ctx.save(); ctx.translate(-hw * 0.2, wy); ctx.scale(1 - open, 1);
        A.ellipseFill(ctx, 0, 0, wr, wr, A.shade(col.roof, 0.05));
        ctx.strokeStyle = A.shade(col.roof, 0.3); ctx.lineWidth = Math.max(1, wr * 0.15);
        ctx.beginPath(); ctx.moveTo(0, -wr); ctx.lineTo(0, wr); ctx.stroke();
        ctx.restore();
      }
      // 扉
      var dw = hw * 0.26, dh = hh * 0.34;
      A.block(ctx, hw * 0.04, -dh, dw, dh, dw * 0.45, awake ? A.shade(PAL.honey, 0.35) : A.shade(col.roof, 0.12), hw * 0.03, 2);
      if (awake) A.glow(ctx, hw * 0.04 + dw / 2, -dh * 0.45, dw * 1.2, 0.4);
      ctx.restore();
    }
  };

  Renderer.prototype.drawBridge = function (ctx, L, t, tm, story, ch) {
    var b = L.bridge, rv = L.river, U = L.U;
    // 川
    ctx.fillStyle = PAL.water;
    A.rr(ctx, rv.x0, rv.y0, rv.x1 - rv.x0, rv.y1 - rv.y0, (rv.y1 - rv.y0) * 0.5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (var i = 0; i < 6; i++) {
      var wx = rv.x0 + ((i * 0.19 + tm * 0.02) % 1) * (rv.x1 - rv.x0), wy = rv.y0 + (rv.y1 - rv.y0) * (0.35 + 0.3 * (i % 2));
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.quadraticCurveTo(wx + U * 0.3, wy - 3, wx + U * 0.6, wy); ctx.stroke();
    }
    // 連続した丸いアーチ
    var n = b.arches, span = (b.x1 - b.x0) / n, deckH = U * 0.32, archH = (rv.y1 - b.y) * 0.95;
    var base = PAL.wood;
    for (var k = 0; k < n; k++) {
      var x0 = b.x0 + k * span;
      ctx.fillStyle = A.shade(base, 0.25);
      ctx.beginPath(); ctx.moveTo(x0 + 3, b.y + 3); ctx.lineTo(x0 + span + 3, b.y + 3); ctx.lineTo(x0 + span + 3, b.y + archH + 3);
      ctx.lineTo(x0 + span - span * 0.12 + 3, b.y + archH + 3); ctx.arc(x0 + span / 2 + 3, b.y + archH + 3, span * 0.38, 0, Math.PI, true);
      ctx.lineTo(x0 + 3, b.y + archH + 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = k % 2 ? PAL.honey : A.shade(PAL.honey, -0.12);
      ctx.beginPath(); ctx.moveTo(x0, b.y); ctx.lineTo(x0 + span, b.y); ctx.lineTo(x0 + span, b.y + archH);
      ctx.lineTo(x0 + span - span * 0.12, b.y + archH); ctx.arc(x0 + span / 2, b.y + archH, span * 0.38, 0, Math.PI, true);
      ctx.lineTo(x0, b.y + archH); ctx.closePath(); ctx.fill();
      A.grain(ctx, x0, b.y, span, archH * 0.5, PAL.honey, k, 2);
    }
    A.block(ctx, b.x0 - 4, b.y - deckH * 0.5, b.x1 - b.x0 + 8, deckH, deckH * 0.4, PAL.coral, deckH * 0.25, 9);
    // 欄干の丸い柱
    var posts = n * 2 + 1;
    for (var p = 0; p < posts; p++) {
      var px = b.x0 + (b.x1 - b.x0) * p / (posts - 1);
      A.block(ctx, px - U * 0.08, b.y - deckH * 0.5 - U * 0.42, U * 0.16, U * 0.45, U * 0.08, PAL.milk, U * 0.03, p);
    }
    // 起こした家ごとの三角旗（参加が増えるほど橋が華やぐ）
    if (story) {
      for (var hI = 0, row = 0; hI < story.houses.length; hI++) {
        var hs = story.houses[hI];
        if (!hs.awake) continue;
        var ap = smooth((t - hs.wakeT) / 1.2);
        var yy = b.y - deckH * 0.5 - U * (0.38 - row * 0.09);
        var col = W.FLAG_COL[hs.kind];
        for (var q = 0; q < posts - 1; q++) {
          if (q / (posts - 1) > ap) break;
          var xa = b.x0 + (b.x1 - b.x0) * q / (posts - 1), xb = b.x0 + (b.x1 - b.x0) * (q + 1) / (posts - 1);
          ctx.strokeStyle = A.shade(PAL.wood, 0.2); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(xa, yy); ctx.quadraticCurveTo((xa + xb) / 2, yy + U * 0.18, xb, yy); ctx.stroke();
          ctx.fillStyle = col;
          for (var f = 1; f <= 2; f++) {
            var fx = xa + (xb - xa) * f / 3, fy = yy + U * 0.12 * Math.sin(Math.PI * f / 3);
            ctx.beginPath(); ctx.moveTo(fx - U * 0.08, fy); ctx.lineTo(fx + U * 0.08, fy); ctx.lineTo(fx, fy + U * 0.18 + Math.sin(tm * 4 + f + q) * U * 0.02); ctx.closePath(); ctx.fill();
          }
        }
        row++;
      }
    }
  };

  Renderer.prototype.drawPlazaGround = function (ctx, L, t, tm, story, ch) {
    var pl = L.plaza, U = L.U;
    // 橋から広場への小道
    ctx.strokeStyle = A.shade(PAL.honey, -0.3); ctx.lineWidth = U * 0.75; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    var r = L.route;
    ctx.moveTo(r[2].x, r[2].y + U * 0.15);
    for (var i = 3; i < r.length; i++) ctx.lineTo(r[i].x, r[i].y + U * 0.15);
    ctx.stroke();
    // 広場から城門へ
    ctx.beginPath(); ctx.moveTo(pl.x, pl.y); ctx.lineTo(L.gate.x, L.gate.y + U * 0.2); ctx.stroke();
    // 広場（丸い木の舞台）
    A.ellipseFill(ctx, pl.x + 3, pl.y + 5, pl.rx, pl.ry, A.shade(PAL.honey, 0.25));
    A.ellipseFill(ctx, pl.x, pl.y, pl.rx, pl.ry, PAL.milk);
    ctx.strokeStyle = A.shade(PAL.honey, -0.1); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(pl.x, pl.y, pl.rx * 0.7, pl.ry * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(pl.x, pl.y, pl.rx * 0.4, pl.ry * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
  };

  // 光のリボンの経路（0..1）
  Renderer.prototype.ribbonPoint = function (L, s) {
    var cs = L.castle, ti = cs.tiers;
    var rws = [cs.w * 0.5, cs.w * 0.36, cs.w * 0.24];
    if (s < 0.75) {
      var tier = Math.min(2, Math.floor(s / 0.25));
      var k = (s - tier * 0.25) / 0.25;
      if (s >= 0.5) { tier = 2; k = (s - 0.5) / 0.25; }
      var ang = Math.PI * 0.75 + k * Math.PI * 2.2;
      var rw = rws[tier] * 1.12;
      var y = ti[tier] + (ti[tier + 1] - ti[tier]) * k;
      return { x: cs.x + Math.cos(ang) * rw, y: y + Math.sin(ang) * rw * 0.2, back: Math.sin(ang) < 0 };
    }
    // 上の塔から城門へ下りる
    var k2 = (s - 0.75) / 0.25;
    var top = { x: cs.x + Math.cos(Math.PI * 0.75 + Math.PI * 2.2) * rws[2] * 1.12, y: ti[3] };
    var mid = { x: cs.x - cs.w * 0.75, y: (ti[1] + ti[2]) / 2 };
    var g = { x: L.gate.x, y: L.gate.y - L.U * 1.3 };
    var a = (1 - k2) * (1 - k2), b = 2 * (1 - k2) * k2, c = k2 * k2;
    return { x: a * top.x + b * mid.x + c * g.x, y: a * top.y + b * mid.y + c * g.y, back: false };
  };

  Renderer.prototype.drawCastle = function (ctx, L, t, tm, story, ch, celebrate) {
    var cs = L.castle, ti = cs.tiers, U = L.U;
    var rws = [cs.w * 0.5, cs.w * 0.36, cs.w * 0.24];
    var cols = [PAL.milk, '#FBE7C2', PAL.milk];
    var rib = story ? ch.ribbon(t) : 0;
    var pulse = story ? ch.barPulse(t) : 0;
    var inMosso = story && t >= ch.T('E1') && t < ch.T('E22');
    // 背面のリボン
    // Presto に入ったらリボンは細い金の飾りとして残す（再会の主役を邪魔しない）
    var ribA = story && t >= ch.T('E22') ? 1 - 0.55 * smooth(ch.tl.prog(t, 'E22', 'E25')) : 1;
    ctx.save(); ctx.globalAlpha *= ribA;
    if (rib > 0) this.drawRibbon(ctx, L, rib, tm, true, inMosso ? pulse : 0);
    ctx.restore();
    for (var i = 0; i < 3; i++) {
      A.cylinder(ctx, cs.x, ti[i + 1], ti[i], rws[i], cols[i]);
      // 帯と丸窓
      ctx.fillStyle = i === 1 ? PAL.coral : PAL.honey;
      ctx.fillRect(cs.x - rws[i], ti[i + 1] + (ti[i] - ti[i + 1]) * 0.12, rws[i] * 2, U * 0.12);
      var winGlow = celebrate || (story && t >= ch.T('E17')) ? 1 : 0;
      for (var w = -1; w <= 1; w += 2) {
        var wx = cs.x + w * rws[i] * 0.42, wy = ti[i + 1] + (ti[i] - ti[i + 1]) * 0.48;
        if (winGlow) A.glow(ctx, wx, wy, U * 0.6, 0.6);
        A.ellipseFill(ctx, wx, wy, rws[i] * 0.13, rws[i] * 0.16, winGlow ? PAL.goldLight : A.shade(PAL.sky, 0.15));
      }
      // 胸壁（丸い積み木）
      var nb = 5;
      for (var b = 0; b < nb; b++) {
        var bx = cs.x - rws[i] + (rws[i] * 2) * (b + 0.5) / nb;
        A.block(ctx, bx - rws[i] * 0.13, ti[i + 1] - U * 0.28, rws[i] * 0.26, U * 0.32, U * 0.1, cols[i], U * 0.04, b);
      }
    }
    // とんがり屋根
    var rw = rws[2] * 1.15;
    ctx.fillStyle = A.shade(PAL.coral, 0.25);
    ctx.beginPath(); ctx.moveTo(cs.x - rw + 3, ti[3] + 3); ctx.lineTo(cs.x + 3, cs.roofY + 3); ctx.lineTo(cs.x + rw + 3, ti[3] + 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.coral;
    ctx.beginPath(); ctx.moveTo(cs.x - rw, ti[3]); ctx.quadraticCurveTo(cs.x - rw * 0.2, ti[3] - (ti[3] - cs.roofY) * 0.4, cs.x, cs.roofY); ctx.quadraticCurveTo(cs.x + rw * 0.2, ti[3] - (ti[3] - cs.roofY) * 0.4, cs.x + rw, ti[3]); ctx.closePath(); ctx.fill();
    A.ellipseFill(ctx, cs.x, ti[3], rw, rw * 0.2, A.shade(PAL.coral, 0.15));
    // 塔の旗
    ctx.strokeStyle = PAL.woodDark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cs.x, cs.roofY); ctx.lineTo(cs.x, cs.roofY - U * 0.9); ctx.stroke();
    A.flagCloth(ctx, cs.x, cs.roofY - U * 0.9, U * 0.8, U * 0.45, 1, tm * (2 + celebrate * 4), PAL.honey, 0.6 + celebrate);
    // 城門と階段（城門はテラスへ通じる）
    this.drawGate(ctx, L, t, tm, story, ch);
    // 前面のリボン
    ctx.save(); ctx.globalAlpha *= ribA;
    if (rib > 0) this.drawRibbon(ctx, L, rib, tm, false, inMosso ? pulse : 0);
    else this.ribbonHead = null;
    ctx.restore();
    // 最後の金の飾り
    if (story && t >= ch.T('E251')) {
      var ga = smooth(ch.tl.prog(t, 'E251', 'E253'));
      ctx.save(); ctx.globalAlpha *= ga;
      for (var j = 0; j < 3; j++) {
        ctx.strokeStyle = PAL.gold; ctx.lineWidth = U * 0.08;
        var yy = ti[j + 1] + U * 0.1;
        ctx.beginPath(); ctx.moveTo(cs.x - rws[j], yy);
        ctx.quadraticCurveTo(cs.x - rws[j] * 0.5, yy + U * 0.35, cs.x, yy); ctx.quadraticCurveTo(cs.x + rws[j] * 0.5, yy + U * 0.35, cs.x + rws[j], yy); ctx.stroke();
      }
      ctx.restore();
    }
    // M34 の到着予告は効果で描く。E266 のお祝いの輪の準備
  };

  Renderer.prototype.drawRibbon = function (ctx, L, prog, tm, backPass, pulse) {
    var N = 160, U = L.U;
    var runs = [], cur = null, head = null, i, j;
    for (i = 0; i <= N; i++) {
      var s = Math.min(prog, i / N);
      var p = this.ribbonPoint(L, s);
      if (p.back === backPass) { if (!cur) { cur = []; runs.push(cur); } cur.push(p); }
      else if (cur) { cur.push(p); cur = null; }
      head = p;
      if (s >= prog) break;
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var width = U * 0.26 * (1 + pulse * 0.35);
    for (j = 0; j < runs.length; j++) {
      var r = runs[j];
      if (r.length < 2) continue;
      ctx.beginPath(); ctx.moveTo(r[0].x, r[0].y);
      for (i = 1; i < r.length; i++) ctx.lineTo(r[i].x, r[i].y);
      ctx.strokeStyle = backPass ? 'rgba(240,205,110,0.4)' : 'rgba(240,200,100,0.95)'; ctx.lineWidth = width; ctx.stroke();
      if (!backPass) { ctx.strokeStyle = 'rgba(255,248,222,0.95)'; ctx.lineWidth = width * 0.38; ctx.stroke(); }
    }
    if (!backPass && head) {
      // 走句の拍頭で頭の光がふくらむ
      A.glow(ctx, head.x, head.y, U * (1.1 + pulse * 0.9), 0.9);
      for (i = 0; i < 5; i++) {
        var ss = Math.max(0, prog - i * 0.035), q = this.ribbonPoint(L, ss);
        ctx.fillStyle = PAL.goldLight; ctx.globalAlpha = 0.9 - i * 0.15;
        star(ctx, q.x + Math.sin(tm * 5 + i) * U * 0.25, q.y - U * 0.25, U * (0.18 - i * 0.02));
      }
      ctx.globalAlpha = 1;
      this.ribbonHead = head;
    }
  };

  Renderer.prototype.drawGate = function (ctx, L, t, tm, story, ch) {
    var g = L.gate, U = L.U;
    var gw = U * 1.5, gh = U * 1.9;
    var open = story ? ch.gateOpen(t) : 0;
    var glowA = story ? ch.gateGlow(t) : 0;
    // 階段（城門 → テラス）
    for (var s = 0; s < 4; s++) {
      var sy = g.y + s * (L.terraceY - g.y) / 4;
      A.block(ctx, g.x - gw * 0.7 - s * U * 0.12, sy, gw * 1.4 + s * U * 0.24, (L.terraceY - g.y) / 4 + 2, U * 0.06, A.shade(PAL.milk, 0.06 * s), U * 0.04, s);
    }
    // 門の枠（アーチ）
    if (glowA > 0) A.glow(ctx, g.x, g.y - gh * 0.5, gw * 1.6, 0.6 * glowA + 0.25 * Math.sin(tm * 3) * glowA);
    ctx.fillStyle = A.shade(PAL.honey, 0.3);
    ctx.beginPath(); ctx.moveTo(g.x - gw * 0.65 + 3, g.y + 3); ctx.lineTo(g.x - gw * 0.65 + 3, g.y - gh * 0.62 + 3); ctx.arc(g.x + 3, g.y - gh * 0.62 + 3, gw * 0.65, Math.PI, 0); ctx.lineTo(g.x + gw * 0.65 + 3, g.y + 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.honey;
    ctx.beginPath(); ctx.moveTo(g.x - gw * 0.65, g.y); ctx.lineTo(g.x - gw * 0.65, g.y - gh * 0.62); ctx.arc(g.x, g.y - gh * 0.62, gw * 0.65, Math.PI, 0); ctx.lineTo(g.x + gw * 0.65, g.y); ctx.closePath(); ctx.fill();
    // 開口部（開くと薄い金色の光）
    ctx.save();
    ctx.beginPath(); ctx.moveTo(g.x - gw * 0.5, g.y); ctx.lineTo(g.x - gw * 0.5, g.y - gh * 0.62); ctx.arc(g.x, g.y - gh * 0.62, gw * 0.5, Math.PI, 0); ctx.lineTo(g.x + gw * 0.5, g.y); ctx.closePath();
    ctx.fillStyle = open > 0 ? PAL.goldLight : A.shade(PAL.coral, 0.1); ctx.fill();
    ctx.clip();
    // 扉（左右に開く）
    var dw = gw * 0.5 * (1 - open * 0.85);
    ctx.fillStyle = A.shade(PAL.coral, 0.05);
    ctx.fillRect(g.x - gw * 0.5, g.y - gh * 1.2, dw, gh * 1.3);
    ctx.fillRect(g.x + gw * 0.5 - dw, g.y - gh * 1.2, dw, gh * 1.3);
    ctx.strokeStyle = A.shade(PAL.coral, 0.25); ctx.lineWidth = 1.5;
    for (var k = 1; k < 3; k++) {
      ctx.beginPath(); ctx.moveTo(g.x - gw * 0.5 + dw * k / 3, g.y - gh * 1.2); ctx.lineTo(g.x - gw * 0.5 + dw * k / 3, g.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g.x + gw * 0.5 - dw * k / 3, g.y - gh * 1.2); ctx.lineTo(g.x + gw * 0.5 - dw * k / 3, g.y); ctx.stroke();
    }
    ctx.restore();
    if (glowA > 0) {
      ctx.strokeStyle = 'rgba(246,215,122,' + (0.6 + 0.4 * glowA) + ')'; ctx.lineWidth = U * 0.1;
      ctx.beginPath(); ctx.moveTo(g.x - gw * 0.65, g.y); ctx.lineTo(g.x - gw * 0.65, g.y - gh * 0.62); ctx.arc(g.x, g.y - gh * 0.62, gw * 0.65, Math.PI, 0); ctx.lineTo(g.x + gw * 0.65, g.y); ctx.stroke();
    }
  };

  Renderer.prototype.drawPlazaDecor = function (ctx, L, t, tm, story, ch, celebrate) {
    var pl = L.plaza, U = L.U, f = L.flag, top = L.flagTop;
    // E194：広場の旗が大きく開く（周りの小旗）
    var big = story ? smooth(ch.tl.prog(t, 'E194', 'E196')) : 0;
    var n = story ? 4 + story.n : 4;
    for (var i = 0; i < n; i++) {
      var a = Math.PI * (1.05 + 0.9 * i / Math.max(1, n - 1));
      var x = pl.x + Math.cos(a) * pl.rx * 1.02, y = pl.y + Math.sin(a) * pl.ry * 1.05;
      var hgt = U * (0.9 + big * 0.5);
      ctx.strokeStyle = PAL.woodDark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - hgt); ctx.stroke();
      A.flagCloth(ctx, x, y - hgt, U * (0.4 + big * 0.35), U * (0.28 + big * 0.18), 1, tm * 3 + i, [PAL.coral, PAL.sky, PAL.honey, PAL.leaf][i % 4], 0.6 + big + celebrate);
    }
    // 大旗（タップで即座に大きく振れる）
    var tap = story ? Math.max(0, 1 - (t - story.flagT) / 1.6) : 0;
    A.shadow(ctx, f.x, f.y + 2, U * 0.4, U * 0.1);
    A.block(ctx, f.x - U * 0.09, top.y, U * 0.18, f.y - top.y, U * 0.08, PAL.wood, U * 0.04, 3);
    A.disc(ctx, f.x, top.y, U * 0.16, PAL.gold, U * 0.03);
    ctx.save(); ctx.translate(f.x, top.y + U * 0.08); ctx.rotate(Math.sin(tm * 9) * 0.12 * tap);

  var qs = new URLSearchParams(root.location.search);
  var PREVIEW = qs.get('preview') === '1';                 // 無音のテスト時計（公開不可）
  var RATE = PREVIEW ? Math.max(0, Number(qs.get('rate') || 0)) : 0;
  var START = PREVIEW ? Math.max(0, Number(qs.get('start') || 0)) : 0;
  var DEV = PREVIEW || qs.get('debug') === '1';
  W.devLog = function () { if (DEV && root.console) root.console.log.apply(root.console, ['[w94]'].concat([].slice.call(arguments))); };

  var canvas = doc.getElementById('stage');
  var probe = doc.getElementById('safe');
  var renderer = new W.Renderer(canvas);
  var engine = RATE > 0 ? new W.VirtualEngine({ rate: RATE }) : new W.AudioEngine({ mode: PREVIEW ? 'silent' : 'audio', onInterrupt: onInterrupt });
  if (RATE > 0) engine.onInterrupt = onInterrupt;

  var titleTl = W.timelineFromContract();
  var app = {
    mode: 'title', L: null, tl: titleTl, story: new W.Story(titleTl), choreo: new W.Choreo(titleTl),
    endedAt: 0, parentHold: null, drag: null, lastErr: null, frames: 0,
  };

  function now() { return root.performance.now() / 1000; }

  // ---------- 配置 ----------
  function relayout() {
    var w = root.innerWidth, h = root.innerHeight;
    var cs = root.getComputedStyle(probe);
    var safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    app.L = W.computeLayout(w, h, safe);
    renderer.resize(w, h, root.devicePixelRatio || 1);
    // 回転・リサイズは座標の再配置だけ。音声や物語は戻さない。ドラッグ中なら優しく元へ。
    if (app.drag && app.mode === 'play') { app.story.chairCancel(musicT()); app.drag = null; }
  }
  root.addEventListener('resize', relayout);
  root.addEventListener('orientationchange', function () { setTimeout(relayout, 60); });

  function musicT() {
    if (app.mode === 'play' || app.mode === 'paused' || app.mode === 'ended') return engine.visualNow();
    return 0;
  }

  // ---------- 開始 ----------
  function begin() {
    // iOS: タップのハンドラー内で同期的に Context を生成／resume する
    try { engine.unlock(); } catch (e) { fail(e); return; }
    app.mode = 'loading';
    engine.load().then(function () {
      app.tl = engine.tl;
      app.story = new W.Story(engine.tl);
      app.choreo = new W.Choreo(engine.tl);
      wireMix();
      if (!engine.isContextRunning()) { app.mode = 'needTap'; return; }
      startPlay(START);
    }).catch(fail);
  }
  function fail(e) {
    app.lastErr = e;
    W.devLog('error', e && (e.code || ''), e && e.message);
    if (root.console && !DEV) root.console.warn('[w94]', e && e.message);
    app.mode = 'error';
  }
  function wireMix() {
    app.story.onMix = function (s) {
      var r = engine.mix.request(s, engine.musicNow());
      W.devLog('mix request', s, r && r.label);
    };
  }
  function startPlay(offset) {
    engine.start(offset || 0);
    if (offset) app.story.update(offset);
    app.mode = 'play';
  }
  function replay() {
    app.story.reset();
    wireMix();
    engine.replay();
    app.mode = 'play';
  }
  function pause(fade) {
    if (app.mode !== 'play') return;
    app.mode = 'paused';
    if (app.drag) { app.story.chairCancel(musicT()); app.drag = null; }
    engine.pause(fade);
  }
  function resume() {
    app.mode = 'play';
    engine.resume().catch(function (e) { W.devLog('resume failed', e); app.mode = 'paused'; });
  }
  function onInterrupt(st) { W.devLog('interrupted', st); if (app.mode === 'play') { app.mode = 'paused'; engine.running = false; engine.lastPos = engine.musicNow(); } }
  doc.addEventListener('visibilitychange', function () { if (doc.visibilityState === 'hidden') pause(false); });
  root.addEventListener('pagehide', function () { pause(false); });

  // ---------- 入力 ----------
  function hitCircle(c, x, y, extra) { return c && Math.hypot(x - c.x, y - c.y) <= c.r + (extra || 0); }
  function hitRect(r, x, y) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
  function toWorld(x, y) {
    var c = renderer.targets.cam || { z: 1, x: app.L.w / 2, y: app.L.h / 2 };
    return { x: (x - app.L.w / 2) / c.z + c.x, y: (y - app.L.h / 2) / c.z + c.y };
  }
  // 顔の周りに出そうな花火は外側へ逃がす
  function awayFromFaces(x, y) {
    var faces = renderer.targets.faces || [];
    for (var i = 0; i < faces.length; i++) {
      var f = faces[i], dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy), R = f.r * 2.2;
      if (d < R) {
        if (d < 1) { dx = 0; dy = -1; d = 1; }
        x = f.x + dx / d * R; y = f.y + dy / d * R;
        if (y > f.y) { y = f.y - R * 0.8; }
      }
    }
    return { x: x, y: y };
  }

  function onDown(ev) {
    ev.preventDefault();
    var x = ev.clientX, y = ev.clientY, tg = renderer.targets, L = app.L;
    if (hitCircle(tg.parent, x, y, 4) && (app.mode === 'play' || app.mode === 'paused' || app.mode === 'title' || app.mode === 'ended')) {
      app.parentHold = { id: ev.pointerId, t0: now() };
      return;
    }
    switch (app.mode) {
      case 'title': if (hitCircle(tg.big, x, y, 30)) begin(); return;
      case 'needTap': if (hitCircle(tg.big, x, y, 30)) { engine.unlock(); if (engine.isContextRunning()) startPlay(START); else { var p = engine.ctx.resume(); Promise.resolve(p).then(function () { if (engine.isContextRunning() && app.mode === 'needTap') startPlay(START); }); } } return;
      case 'loading': return;
      case 'error': if (hitCircle(tg.big, x, y, 30)) begin(); return;
      case 'paused': if (hitCircle(tg.big, x, y, 30)) resume(); return;
      case 'ended': if (hitCircle(tg.big, x, y, 30)) replay(); return;
      default: break;
    }
    // play
    var t = musicT(), st = app.story;
    if (hitCircle(tg.pause, x, y, 4)) { pause(true); return; }
    if (app.drag) return; // ドラッグ中の別の指は無視（多点タッチで増殖させない）
    var feet = app.choreo.chair(L, st, t);
    if (tg.chair && hitCircle(tg.chair, x, y, 8) && st.chairGrab(t)) {
      var w0 = toWorld(x, y);
      app.drag = { id: ev.pointerId, offX: feet.x - w0.x, offY: feet.y - w0.y };
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* */ }
      moveChair(x, y);
      return;
    }
    for (var i = 0; i < tg.houses.length; i++) {
      if (hitRect(tg.houses[i], x, y)) { st.tapHouse(i, t); return; }
    }
    if (hitCircle(tg.flag, x, y, 6)) { st.tapFlag(t); return; }
    var wpt;
    if (st.ribbonOpen(t) && (hitCircle(tg.ribbon, x, y, 10) || hitRect(tg.castle, x, y))) {
      wpt = toWorld(x, y);
      st.tapRibbon(t, wpt.x / L.w, wpt.y / L.h);
      return;
    }
    if (st.skyOpen(t)) {
      var a = awayFromFaces(x, y);
      wpt = toWorld(a.x, a.y);
      st.tapSky(t, wpt.x / L.w, wpt.y / L.h);
    }
  }
  function moveChair(x, y) {
    var w = toWorld(x, y), L = app.L;
    app.story.chairMove((w.x + app.drag.offX) / L.w, (w.y + app.drag.offY) / L.h);
  }
  function onMove(ev) {
    if (app.drag && ev.pointerId === app.drag.id) { ev.preventDefault(); moveChair(ev.clientX, ev.clientY); }
  }
  function onUp(ev) {
    if (app.parentHold && ev.pointerId === app.parentHold.id) {
      var held = now() - app.parentHold.t0;
      app.parentHold = null;
      if (held >= 1.0) openCredits();
      return;
    }
    if (app.drag && ev.pointerId === app.drag.id) {
      // 吸着判定は最後に描いた絵ではなく、いまの椅子の位置で（イベントが描画より先に連続しても正しく）
      var tg = renderer.targets, L = app.L, feet = app.choreo.chair(L, app.story, musicT());
      var c = tg.toScreen ? tg.toScreen(feet.x, feet.y - L.chairSize * 0.5) : null;
      var inSnap = c && tg.spot && Math.hypot(c.x - tg.spot.x, c.y - tg.spot.y) <= tg.spot.r;
      app.story.chairRelease(musicT(), inSnap);
      app.drag = null;
    }
  }
  function onCancel(ev) {
    if (app.parentHold && ev.pointerId === app.parentHold.id) app.parentHold = null;
    if (app.drag && ev.pointerId === app.drag.id) { app.story.chairCancel(musicT()); app.drag = null; }
  }
  // 保護者向け：長押し(1秒)で権利表記ページへ。開く前に本編を一時停止する。
  function openCredits() {
    pause(false);
    var wdw = null;
    try { wdw = root.open('credits.html', '_blank'); if (wdw) wdw.opener = null; } catch (e) { /* */ }
    if (!wdw) root.location.href = 'credits.html';
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onCancel);
  canvas.addEventListener('lostpointercapture', function (ev) { if (app.drag && ev.pointerId === app.drag.id) onUp(ev); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- ループ（描くだけ） ----------
  var lastActors = null;
  function frame() {
    root.requestAnimationFrame(frame);
    var L = app.L; if (!L) return;
    var started = app.mode === 'play' || app.mode === 'paused' || app.mode === 'ended';
    var t = started ? engine.visualNow() : 0;
    if (app.mode === 'play') {
      engine.mix.tick(engine.musicNow());
      app.story.update(t);
      if (app.story.ended) { app.mode = 'ended'; app.endedAt = now(); engine.stopAll(); }
    }
    var st = app.story, ch = app.choreo;
    var actors = ch.actors(L, st, t);
    lastActors = actors;
    var hold = app.parentHold ? Math.min(1, (now() - app.parentHold.t0) / 1.0) : 0;
    renderer.draw({
      mode: app.mode, L: L, t: t, amb: started ? t : now(), ui: now(), story: st, choreo: ch,
      cam: started ? ch.camera(L, st, t) : null, actors: actors, chairPos: ch.chair(L, st, t),
      faces: ch.faces(L, actors), guide: started ? st.guide(t) : null, parentHold: hold,
      endedFor: app.mode === 'ended' ? now() - app.endedAt : 0,
    });
    app.frames++;
  }

  // ---------- 開発用（?preview=1 のときだけ） ----------
  if (PREVIEW) {
    root.__w94 = {
      app: app, engine: engine, renderer: renderer,
      state: function () {
        var st = app.story, t = musicT();
        return {
          mode: app.mode, t: t, n: st.n, chair: st.chair.state, chairBy: st.chair.by, guide: st.guide(t),
          sTarget: engine.mix ? engine.mix.target() : 0, sCommitted: engine.mix ? engine.mix.sCommitted : 0,
          history: engine.mix ? engine.mix.history.map(function (r) { return { label: r.label, gi: r.gi, start: r.start, s0: r.s0, s1: r.s1, cancelled: r.cancelled }; }) : [],
          events: st.events.filter(function (e) { return e.type !== 'bar'; }).map(function (e) { return { type: e.type, t: e.t }; }),
          bars: st.events.filter(function (e) { return e.type === 'bar'; }).map(function (e) { return e.label; }),
          foxDrawn: renderer.stats.foxDrawn, rabbitDrawn: renderer.stats.rabbitDrawn,
          foxActors: lastActors ? lastActors.filter(function (a) { return a.kind === 'fox'; }).length : 0,
          actors: lastActors ? lastActors.length : 0, fx: st.fx.length, hand: renderer.targets.hand, frames: app.frames,
          ctxState: engine.ctx ? engine.ctx.state : null, ctxRate: engine.ctx ? engine.ctx.sampleRate : null,
        };
      },
      targets: function () { var t = renderer.targets; return { houses: t.houses, chair: t.chair, spot: t.spot, flag: t.flag, ribbon: t.ribbon, pause: t.pause, parent: t.parent, big: t.big, castle: t.castle, faces: t.faces, hand: t.hand }; },
      // 先へ／後ろへの移動（開発専用）。後ろへは物語を最初から再処理する。
      seek: function (sec) {
        var st = app.story;
        if (sec < st.lastT) { st.reset(); wireMix(); engine.mix.reset(); }
        engine.lastPos = sec;
        engine.start(sec);
        st.update(sec);
      },
    };
  }

  relayout();
  root.requestAnimationFrame(frame);
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>
</body>
</html>
