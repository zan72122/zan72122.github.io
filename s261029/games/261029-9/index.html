const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eo=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const hyp=Math.hypot;
const D=4; // world units per pixel-dot
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ---------------------------------------------------------------- save
const SKEY='nekohime-oto-dress', SV=1;
function loadSave(){
 const def={v:SV,shows:0,gems:[],kp:[-1,-1]};
 try{
  const raw=window.localStorage.getItem(SKEY); if(!raw) return def;
  const d=JSON.parse(raw);
  if(!d||typeof d!=='object'||d.v!==SV||!Array.isArray(d.gems)) return def;
  const gems=d.gems.filter(g=>g===0||g===1||g===2).slice(-9);
  const kp=Array.isArray(d.kp)?d.kp.slice(0,2).map(k=>(k|0)>=0&&(k|0)<5?(k|0):-1):[-1,-1];
  while(kp.length<2) kp.push(-1);
  return {v:SV,shows:clamp((+d.shows)|0,0,99999),gems,kp};
 }catch(e){return def;}
}
const save=loadSave();
function writeSave(){try{window.localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

// ---------------------------------------------------------------- pixel sprites
class Grid{
 constructor(w,h,o){this.w=w;this.h=h;this.o=o;this.d=new Array(w*h).fill(null);}
 px(x,y,c){x=Math.floor(x)+this.o;y=Math.floor(y)+this.o;if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;}
 get(x,y){x=Math.floor(x)+this.o;y=Math.floor(y)+this.o;if(x<0||y<0||x>=this.w||y>=this.h)return null;return this.d[y*this.w+x];}
 rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,c);}
 ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry)-1;y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx)-1;x<=Math.ceil(cx+rx);x++){const dx=(x+0.5-cx)/rx,dy=(y+0.5-cy)/ry;if(dx*dx+dy*dy<=1)this.px(x,y,c);}}
 line(x0,y0,x1,y1,c){const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));for(let i=0;i<=n;i++){const t=i/n;this.px(Math.round(lerp(x0,x1,t)),Math.round(lerp(y0,y1,t)),c);}}
 poly(p,c){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
  for(let y=Math.floor(y0)-1;y<=Math.ceil(y1);y++)for(let x=Math.floor(x0)-1;x<=Math.ceil(x1);x++){const X=x+0.5,Y=y+0.5;let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a[1]>Y)!==(b[1]>Y))&&(X<(b[0]-a[0])*(Y-a[1])/(b[1]-a[1])+a[0]))ins=!ins;}if(ins)this.px(x,y,c);}}
 recolor(f){for(let y=-this.o;y<this.h-this.o;y++)for(let x=-this.o;x<this.w-this.o;x++){const c=this.get(x,y);if(c){const n=f(x,y,c);if(n!==c)this.px(x,y,n);}}}
 mirror(w){for(let y=-this.o;y<this.h-this.o;y++)for(let x=0;x<w/2;x++){const c=this.get(x,y);this.px(w-1-x,y,c);}}
 outline(c){const n=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.d[y*this.w+x])continue;const f=(i,j)=>i>=0&&j>=0&&i<this.w&&j<this.h&&this.d[j*this.w+i];if(f(x-1,y)||f(x+1,y)||f(x,y-1)||f(x,y+1))n[y*this.w+x]=c;}this.d=n;}
}
const SPR={};
function def(name,w,h,paint,o){o=o||{};SPR[name]={w,h,paint,out:o.out===undefined?C.out:o.out,res:o.res||1,g:null,cv:null,dp:0};}
function rr(x,X,Y,w,h,a,b,c,d){x.beginPath();x.moveTo(X+a,Y);x.lineTo(X+w-b,Y);if(b)x.quadraticCurveTo(X+w,Y,X+w,Y+b);x.lineTo(X+w,Y+h-c);if(c)x.quadraticCurveTo(X+w,Y+h,X+w-c,Y+h);x.lineTo(X+d,Y+h);if(d)x.quadraticCurveTo(X,Y+h,X,Y+h-d);x.lineTo(X,Y+a);if(a)x.quadraticCurveTo(X,Y,X+a,Y);x.closePath();x.fill();}
function renderSpr(sp,dp){
 if(!sp.g){const g=new Grid(sp.w+2,sp.h+2,1);sp.paint(g);if(sp.out)g.outline(sp.out);sp.g=g;}
 if(sp.cv&&Math.abs(sp.dp-dp)<0.01) return;
 const g=sp.g, c=document.createElement('canvas');
 c.width=Math.max(1,Math.ceil(g.w*dp));c.height=Math.max(1,Math.ceil(g.h*dp));
 const x=c.getContext('2d'), r=dp*0.45, e=(i,j)=>i<0||j<0||i>=g.w||j>=g.h||!g.d[j*g.w+i];
 for(let j=0;j<g.h;j++)for(let i=0;i<g.w;i++){const col=g.d[j*g.w+i];if(!col)continue;
  const up=e(i,j-1),dn=e(i,j+1),lf=e(i-1,j),rt=e(i+1,j);x.fillStyle=col;
  rr(x,i*dp-0.4,j*dp-0.4,dp+0.8,dp+0.8,up&&lf?r:0,up&&rt?r:0,dn&&rt?r:0,dn&&lf?r:0);}
 sp.cv=c;sp.dp=dp;
}

 g.rect(8,2,4,1,C.gold);g.px(7,1,C.gold);g.px(12,1,C.gold);g.px(9,1,C.gold);g.px(10,1,C.gold);g.px(9,2,C.ruby);g.px(10,2,C.ruby);
}

let drag=null,activeId=null;
function toW(e){return{x:e.clientX/s,y:e.clientY/s};}
function itemPos(it){const sl=L.slots[it.i];return{x:sl.x,y:sl.y};}
function hitItem(w){for(const it of items){if(it.st!=='rack'&&it.st!=='sel'&&it.st!=='back')continue;const r=50*L.slotSc;if(hyp(w.x-it.x,w.y-it.y)<r)return it;}return null;}
function hitPrincess(w){const c=princessCenter(),sc=L.cs;return Math.abs(w.x-c.x)<46*sc&&Math.abs(w.y-c.y)<66*sc;}
function partAt(w){const v=(w.y-P.y+P.hopH)/(D*L.cs)+27,u=(w.x-P.x)/(D*L.cs)+10;let pref=v<7.5?2:(v>23.6&&Math.abs(u-10)<6.5?1:0);if(S.worn[pref])return pref;const ws=[0,1,2].filter(i=>S.worn[i]);if(!ws.length)return -1;const cen=[18,25,4];ws.sort((a,b)=>Math.abs(cen[a]-v)-Math.abs(cen[b]-v));return ws[0];}
function hitDog(w){const sc=dogScale();return hyp(w.x-Dg.x,w.y-(Dg.y-Dg.hover-40*sc))<48*sc;}
function nearPrincess(x,y){const c=princessCenter();return hyp(x-c.x,y-c.y)<125*L.cs;}
function onDown(e){
 e.preventDefault();initAudio();
 if(activeId!==null)return;
 if(S.curtain)return;
 activeId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
 const w=toW(e);S.idle=0;S.hand=null;
 drag={id:e.pointerId,sx:w.x,sy:w.y,wx:w.x,wy:w.y,t0:performance.now(),moved:false,item:null,kind:''};
 const it=hitItem(w);
 if(it){drag.item=it;drag.kind='rack';drag.wasSel=it.st==='sel';drag.ox=it.x-w.x;drag.oy=it.y-w.y;
  for(const o of items)if(o!==it&&o.st==='sel')o.st='back',o.bt=0,o.bx=o.x,o.by=o.y;
  it.st='drag';sfx.pick();return;}
 if(hitPrincess(w)){drag.kind='prin';drag.part=partAt(w);return;}
 drag.kind='other';
}
function onMove(e){
 if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
 const w=toW(e);drag.wx=w.x;drag.wy=w.y;
 if(hyp(w.x-drag.sx,w.y-drag.sy)>12)drag.moved=true;
 if(drag.kind==='prin'&&drag.moved&&drag.part>=0&&!drag.item&&!S.curtain){
  const i=drag.part,it=items[i],wp=wearPos(i);unwear(i);it.st='drag';it.x=wp.x;it.y=wp.y;drag.item=it;drag.ox=wp.x-drag.sx;drag.oy=wp.y-drag.sy;drag.kind='off';
 }
}
function onUp(e){
 if(!drag||e.pointerId!==drag.id){return;}
 e.preventDefault();initAudio();
 const d=drag,w=toW(e);d.wx=w.x;d.wy=w.y;drag=null;activeId=null;
 const dur=(performance.now()-d.t0)/1000;
 if(e.type==='pointercancel'){if(d.item){d.item.st='back';d.item.bt=0;d.item.bx=d.item.x;d.item.by=d.item.y;}return;}
 if(d.item){const it=d.item;
  if(d.kind==='rack'&&!d.moved&&dur<0.6){
   if(d.wasSel){it.st='back';it.bt=0;it.bx=it.x;it.by=it.y;sfx.back();}
   else{it.st='sel';}
   return;}
  if(nearPrincess(it.x,it.y)||nearPrincess(w.x,w.y)){wear(it.i,it.x,it.y);}
  else{it.st='back';it.bt=0;it.bx=it.x;it.by=it.y;sfx.back();}
  return;}
 if(d.moved)return;
 tapAt(w,d.kind);
}
function tapAt(w,kind){
 const sel=items.find(it=>it.st==='sel');
 if(kind==='prin'||hitPrincess(w)){
  if(sel){wear(sel.i,sel.x,sel.y);return;}
  tapPrincess();return;}
 if(hitDog(w)){Dg.sqy=0.62;Dg.sqv=0;Dg.happy=1.4;sfx.squeak();Dg.hopT=0.35;sparks(Dg.x,Dg.y-50,5,[C.dogL,C.white]);return;}
 if(S.entrance&&Math.abs(w.x-L.car)<64&&w.y>L.yS-140&&w.y<L.yS+10){newShow();return;}
 // resting bells: jingle and gather
 const rb=B.filter(b=>b.st==='rest');let hitB=null;for(const b of rb)if(hyp(w.x-b.x,w.y-b.y)<30){hitB=b;break;}
 if(hitB){const others=rb.filter(b=>b!==hitB);let tx=P.x-40;if(others.length){let best=others[0];for(const o of others)if(Math.abs(o.x-hitB.x)<Math.abs(best.x-hitB.x))best=o;tx=best.x+(hitB.x<best.x?-12:12);}
  hitB.st='fly';hitB.vx=(tx-hitB.x)/0.5;hitB.vy=-225;hitB.gy=L.yG+rnd(4,12);sfx.tink();sparks(hitB.x,hitB.y,4,[C.gold]);return;}
 // plaza
 if(w.y>L.yS+4&&w.y<L.yG+50&&w.x>L.town.x0&&w.x<L.town.x1){
  if(Math.abs(w.x-L.flower)<50&&w.y<L.yG+6){S.wob.fl=1;sfx.tink();return;}
  if(Math.abs(w.x-L.fount)<40&&w.y<L.yG+6){S.wob.fo=1;if(S.fount>0.3){sfx.splash();for(let i=0;i<6;i++)fx({k:'dr',x:L.fount,y:L.yG-30,vx:rnd(-80,80),vy:rnd(-200,-100),l:0,m:0.7,c:C.water,g:500,sz:1});}return;}
  if(S.worn[1]&&!S.parade){addWave(w.x,7);sfx.pok(0.22);return;}
  puff(w.x,w.y,2);return;}
 // scenery wobble only
 const bl=[['sB',L.shopB],['ca',L.car],['sA',L.shopA],['hs',L.house]];
 for(const b of bl)if(Math.abs(w.x-b[1])<46&&w.y>L.yS-120&&w.y<L.yS){S.wob[b[0]]=1;return;}
 if(Math.abs(w.x-L.tower)<30&&w.y<L.yS){S.wob.tw=1;return;}
 if(hyp(w.x-L.ferris,w.y-L.fY)<L.fR){S.wob.fe=1;return;}
}
function tapPrincess(){
 P.pose='tap';P.poseT=0;P.sqv-=1.6;S.idle=0;
 const ws=[0,1,2].filter(i=>S.worn[i]);
 if(!ws.length){sfx.squeak();sparks(P.x,P.y-90,4,[C.pink,C.white]);return;}
 for(const i of ws){emitNotes(i,1);}
 if(S.worn[0]){sfx.shaka();P.capeSk=1;if(!S.parade&&B.filter(b=>b.st!=='gone').length<10&&can('capeTap',0.5))capeBurst(1);}
 if(S.worn[1]){sfx.poko();if(!S.parade){P.hopV=-170;addWave(P.x,9);}}
 if(S.worn[2]){sfx.pyuun();for(let i=0;i<6;i++)fx({k:'pf',x:P.x+rnd(-20,20),y:P.y-rnd(0,40),vx:rnd(-40,40),vy:rnd(-120,-60),l:0,m:0.8,c:C.white,g:0,sz:1.4});}
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onUp,{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.id){onUp(Object.assign({},{pointerId:e.pointerId,type:'pointercancel',clientX:drag.wx*s,clientY:drag.wy*s,preventDefault(){}}));}});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='touchend')initAudio();if(e.cancelable)e.preventDefault();},{passive:false}));

function updItems(dt){
 const h=hintTarget();
 for(const it of items){it.t+=dt;const sl=L.slots[it.i];
  if(it.st==='rack'){let hop=0;if(h&&h.k==='item'&&h.i===it.i&&!drag){const per=S.idle>10?1.4:2.4,ph=(it.t%per)/per;hop=ph<0.3?Math.sin(ph/0.3*Math.PI)*(S.idle>10?16:9):0;}
   it.x=sl.x;it.y=sl.y-hop;it.vx=0;}
  else if(it.st==='sel'){it.x=lerp(it.x,sl.x,Math.min(1,dt*10));it.y=lerp(it.y,sl.y-26+Math.sin(it.t*3)*4,Math.min(1,dt*10));}
  else if(it.st==='drag'&&drag&&drag.item===it){let tx=drag.wx+drag.ox,ty=drag.wy+drag.oy;
   const c=princessCenter(),wp=wearPos(it.i),dd=hyp(tx-c.x,ty-c.y),mg=clamp(1-(dd-40)/110,0,1)*0.45;tx=lerp(tx,wp.x,mg);ty=lerp(ty,wp.y,mg);
   const nx=lerp(it.x,tx,Math.min(1,dt*28));it.vx=lerp(it.vx,(nx-it.x)/Math.max(dt,0.001),0.3);it.x=nx;it.y=lerp(it.y,ty,Math.min(1,dt*28));it.near=mg;}
  else if(it.st==='drag'){it.st='back';it.bt=0;it.bx=it.x;it.by=it.y;}
  else if(it.st==='back'){it.bt+=dt/0.32;const e=eo(it.bt);it.x=lerp(it.bx,sl.x,e);it.y=lerp(it.by,sl.y,e)-Math.sin(e*Math.PI)*30;if(it.bt>=1)it.st='rack';}
  else if(it.st==='worn'){if(it.snap){it.snap.t+=dt/0.14;if(it.snap.t>=1)it.snap=null;}}
  it.sk=lerp(it.sk,clamp(-it.vx/900,-0.5,0.5),Math.min(1,dt*10));
 }
}

// ---------------------------------------------------------------- resize remap
function remap(o){
 const T=L.town,mx=x=>T.x0+(x-o.x0)/o.w*T.w,my=y=>y>=o.yS?L.yS+(y-o.yS)/(o.yG-o.yS)*(L.yG-L.yS):T.y0+(y-o.y0)/(o.yS-o.y0)*(L.yS-T.y0);
 for(const b of B){if(b.st==='path'){b.t2=0;b.end(b);continue;}if(b.st==='hop'){shopHit(0,b);continue;}b.x=mx(b.x);b.y=my(b.y);b.gy=L.yG+rnd(4,14);if(b.st==='rest')b.y=b.gy;}
 for(let i=B.length-1;i>=0;i--)if(B[i].st==='gone')B.splice(i,1);
 FX.length=0;N.length=0;
 if(Dg.seq.length){Dg.seq.length=0;Dg.busy=false;Dg.air=false;if(Dg.carry){Dg.carry.st='fly';Dg.carry.vy=0;Dg.carry=null;}}
 Dg.x=mx(Dg.x);Dg.y=L.yG;
 if(drag){if(drag.item){drag.item.st='back';drag.item.bt=1;}drag=null;activeId=null;}
 for(const it of items)if(it.st==='back'||it.st==='sel'){const sl=L.slots[it.i];it.x=sl.x;it.y=sl.y;if(it.st==='back')it.st='rack';}
}

// ================================================================= drawing
function spr(n,x,y,sc,rot,al,fx2){const sp=SPR[n];if(!sp||!sp.cv)return;sc=sc||1;const w=sp.g.w*D*sc,h=sp.g.h*D*sc;
 if(!rot&&!fx2&&(al===undefined||al>=1)){ctx.drawImage(sp.cv,x-w/2,y-h/2,w,h);return;}
 if(al!==undefined&&al<=0)return;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(fx2)ctx.scale(-1,1);if(al!==undefined&&al<1)ctx.globalAlpha*=al;ctx.drawImage(sp.cv,-w/2,-h/2,w,h);ctx.restore();}
// draw sprite with an anchor (fractions of padded size)
function sprA(n,x,y,ax,ay,sc,rot){const sp=SPR[n];if(!sp||!sp.cv)return;sc=sc||1;const w=sp.g.w*D*sc,h=sp.g.h*D*sc;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.drawImage(sp.cv,-w*ax,-h*ay,w,h);ctx.restore();}
function dot(x,y,col,sz){sz=sz||D;ctx.fillStyle=col;const r=sz*0.32;rr(ctx,x-sz/2,y-sz/2,sz,sz,r,r,r,r);}
function box(x,y,w,h,col,o){const q=D*0.9;ctx.fillStyle=o||C.out;rr(ctx,x-q,y-q,w+q*2,h+q*2,D,D,D,D);ctx.fillStyle=col;rr(ctx,x,y,w,h,D*0.4,D*0.4,D*0.4,D*0.4);}
function face(x,y,sc,awake,pulse){const e=D*0.9*sc;
 if(awake){dot(x-5*sc,y,C.out,e);dot(x+5*sc,y,C.out,e);dot(x-5.5*sc,y-1*sc,C.white,e*0.4);dot(x+4.5*sc,y-1*sc,C.white,e*0.4);
  if(pulse>0.2){ctx.fillStyle=C.out;ctx.beginPath();ctx.ellipse(x,y+5*sc,2.4*sc,2.2*sc*pulse+0.6*sc,0,0,TAU);ctx.fill();}else{dot(x-1.2*sc,y+4*sc,C.out,e*0.6);dot(x+1.2*sc,y+4*sc,C.out,e*0.6);}
  dot(x-9*sc,y+3*sc,C.pink,e*0.8);dot(x+9*sc,y+3*sc,C.pink,e*0.8);}
 else{for(const sx of[-1,1]){dot(x+sx*5*sc-1.6*sc,y+1*sc,C.out,e*0.6);dot(x+sx*5*sc+1.6*sc,y+1*sc,C.out,e*0.6);}dot(x,y+4*sc,C.out,e*0.5);
  const t=(S.time*0.7)%1;dot(x+8*sc+t*8*sc,y-6*sc-t*16*sc,'rgba(255,255,255,'+(0.9-t*0.9).toFixed(2)+')',e*(0.6+t));}}

function drawBg(){
 const T=L.town;
 ctx.fillStyle=C.sky;ctx.fillRect(0,0,W,H);
 // dithered sky bands
 const bands=[[C.sky3,T.y0+T.h*0.08],[C.sky2,T.y0+T.h*0.2]];
 ctx.fillStyle=C.sky3;ctx.fillRect(0,0,W,bands[0][1]);
 ctx.fillStyle=C.sky2;ctx.fillRect(0,bands[0][1],W,bands[1][1]-bands[0][1]);
 for(const b of bands){ctx.fillStyle=b[0];for(let x=0;x<W;x+=D*2){ctx.fillRect(x,b[1],D,D);ctx.fillRect(x+D,b[1]+D*2,D,D);}}
 spr('sun',T.x0+T.w*(L.por?0.55:0.45),T.y0+34,1.1,Math.sin(S.time*0.5)*0.05);
 for(let i=0;i<3;i++){const x=((S.cloudOff+S.time*(6+i*3)+i*W*0.4)%(W+200))-100,y=T.y0+30+i*T.h*0.09;spr('cloud',x,y,1+i*0.15);}
}
function drawTower(){
 const x=L.tower,top=L.towerTop,wob=(S.wob.tw||0)*Math.sin(S.time*30)*0.02;
 ctx.save();ctx.translate(x,L.yS);ctx.rotate(wob);ctx.translate(-x,-L.yS);
 for(let y=L.yS-12;y>top+60;y-=24)spr('twSeg',x,y);
 spr('twTop',x,top+38);
 // clock
 const cx=x,cy=top+56;const a1=S.clock*1.2,a2=S.clock*0.1-1;ctx.strokeStyle=C.out;ctx.lineWidth=D*0.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a1-1.57)*8,cy+Math.sin(a1-1.57)*8);ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a2)*5,cy+Math.sin(a2)*5);ctx.stroke();
 // bell
 const op=sm(S.towerOpen),sw=Math.sin(S.time*9)*S.towerSw*0.5,bs=1+op*0.35;const tb=towerBell();
 sprA('bigBell',tb.x,tb.y-14,0.5,0.08,bs*0.95,sw);
 if(op>0){const awake=S.worn[0]&&S.parade;face(tb.x+Math.sin(sw)*16,tb.y+6,0.9,awake,S.towerSw);}
 // deco bells on tower
 for(let i=0;i<S.deco[2];i++){const a=i/14;spr('bell',x-24+a*48,top+6+Math.sin(i*1.7+S.time*3)*2,0.55);}
 // roof (lifts when open)
 spr('twRoof',x,top-20-op*26,1,op*-0.25);
 for(const bd of S.birds){const bx=x+Math.cos(bd.a)*bd.r,by=top+bd.y+Math.sin(bd.a*2)*8;if(!(S.parade&&S.modeT>0.5))spr(Math.sin(bd.t*12)>0?'bd0':'bd1',bx,by,1,0,1,Math.sin(bd.a)>0);}
 ctx.restore();
}
function drawFerris(){
 const cx=L.ferris,cy=L.fY,R=L.fR,wob=(S.wob.fe||0)*Math.sin(S.time*30)*0.04;

 spr(L.rim,cx,cy,1,S.fAng+wob);
 const fl=S.instr>0&&S.ferrisOn,aw=S.parade&&S.worn[2];

function drawCarousel(){
 const cx=L.car,base=L.yS,wob=(S.wob.ca||0)*Math.sin(S.time*30)*0.03;

}

// ================================================================= main loop
let raf=0,last=0,running=true,needLayout=true;
function loop(ts){
 raf=0;if(!running)return;
 if(needLayout){needLayout=false;doLayout();}
 let dt=last?(ts-last)/1000:0.016;last=ts;dt=Math.min(0.05,Math.max(0,dt));
 try{
  updPrincess(dt);updDog(dt);updItems(dt);updWorld(dt);updTransform(dt);updParade(dt);updFx(dt);
  musicTick();
  render();
 }catch(err){if(!loop.err){loop.err=1;setTimeout(()=>{throw err;});}}
 raf=requestAnimationFrame(loop);
}
function startLoop(){if(!raf&&running){last=0;raf=requestAnimationFrame(loop);}}
function onHide(){running=false;if(raf){cancelAnimationFrame(raf);raf=0;}if(AC&&AC.state==='running')AC.suspend().catch(()=>{});
 if(drag){if(drag.item){drag.item.st='back';drag.item.bt=0;drag.item.bx=drag.item.x;drag.item.by=drag.item.y;}drag=null;activeId=null;}}
function onShow(){if(document.hidden)return;running=true;MU.kind='';if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});startLoop();}
document.addEventListener('visibilitychange',()=>{document.hidden?onHide():onShow();});
window.addEventListener('pagehide',onHide);window.addEventListener('pageshow',onShow);
window.addEventListener('resize',()=>{needLayout=true;});
window.addEventListener('orientationchange',()=>{needLayout=true;});

newShowState();doLayout();needLayout=false;

 css(x,y){return{x:x*s,y:y*s};},slot(i){return{x:items[i].x*s,y:items[i].y*s};},princess(){const c=princessCenter();return{x:c.x*s,y:c.y*s};},
 dog(){return{x:Dg.x*s,y:(Dg.y-Dg.hover-40*dogScale())*s};},car(){return{x:L.car*s,y:(L.yS-60)*s};},part(i){const w=wearPos(i);const dy=[-4.5*D*L.cs,0.5*D*L.cs,0][i];return{x:w.x*s,y:(w.y+dy)*s};},audio(){return AC?AC.state:'none';},music(){return MU.on;}};
startLoop();
